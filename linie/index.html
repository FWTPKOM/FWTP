<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Linie – Rozkłady jazdy</title>

<link
    rel="stylesheet"
    href="../css/style.css"
>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800;900&display=swap"
    rel="stylesheet"
>


<style>

/* =========================================================
   KALENDARZ 7 DNI
   ========================================================= */

.dni {

    display: grid;

    grid-template-columns:
        repeat(
            7,
            minmax(0, 1fr)
        );

    gap: 4px;

    width: 80%;

    margin-left: auto;
    margin-right: auto;

    margin-bottom: 8px;

    box-sizing: border-box;
}


/* =========================================================
   PRZYCISKI DNI
   ========================================================= */

.dzien-btn {

    flex: 1;

    padding: 14px;

    background: white;

    border: 1px solid #ccc;

    border-radius: 6px;

    cursor: pointer;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 17px;

    font-weight: 700;

    color: #222;

    text-align: center;

    transition: 0.15s;

    box-sizing: border-box;
}


.dni .dzien-btn {

    min-width: 0;

    padding: 10px 4px;

    font-size: 15px;

    line-height: 1.15;

    white-space: nowrap;
}


.dzien-btn:hover {

    color: #d61c12;

    border-color: #d61c12;

    background: #fff;
}


.dzien-btn.aktywny {

    background: #d61c12;

    color: white;

    border-color: #d61c12;
}


.dzien-btn.aktywny:hover {

    background: #d61c12;

    color: white;

    border-color: #d61c12;
}


/* =========================================================
   KALENDARZ – WYBÓR INNEGO DNIA
   ========================================================= */

.kalendarz {

    display: none;

    width: 80%;

    margin-left: auto;
    margin-right: auto;

    margin-bottom: 8px;

    background: white;

    border: 1px solid #ddd;

    border-radius: 6px;

    padding: 12px 15px;

    box-sizing: border-box;
}


.kalendarz-tytul {

    margin-bottom: 8px;

    font-size: 15px;

    font-weight: 700;

    color: #222;
}


.kalendarz input {

    padding: 10px;

    font-size: 16px;

    border: 1px solid #ccc;

    border-radius: 5px;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;
}


/* =========================================================
   WYSZUKIWARKA
   ========================================================= */

.search {

    width: 100%;

    box-sizing: border-box;

    padding: 11px 14px;

    font-size: 16px;

    border: 1px solid #bdbdbd;

    border-radius: 4px;

    margin-bottom: 25px;

    background: #fff;

    color: #222;

    outline: none;
}


.search:focus {

    border-color: #777;
}


/* =========================================================
   SEKCJA LINII
   ========================================================= */

.linie {

    display: flex;

    flex-wrap: wrap;

    gap: 6px;

    align-items: center;
}


/* =========================================================
   PRZYCISKI LINII
   ========================================================= */

.linia {

    display: flex;

    align-items: center;

    justify-content: center;

    min-width: 62px;

    height: 50px;

    padding: 0 13px;

    box-sizing: border-box;

    background: #fff;

    text-decoration: none;

    color: #222;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 17px;

    font-weight: 700;

    line-height: 1;

    transition:
        background-color 0.12s ease,
        color 0.12s ease,
        border-color 0.12s ease;
}


/* =========================================================
   AUTOBUSY
   ========================================================= */

#autobusy .linia {

    border-bottom: 13px solid #990066;
}


/* =========================================================
   TRAMWAJE
   ========================================================= */

#tramwaje .linia {

    border-bottom: 13px solid #e30613;
}


/* =========================================================
   METRO
   ========================================================= */

#metro .linia {

    border-bottom: 13px solid #0066cc;
}


/* =========================================================
   NAJECHANIE
   ========================================================= */

.linia:hover {

    background: red;

    color: white;

    transform: none;
}


#autobusy .linia:hover {

    border-bottom-color: #990066;
}


#tramwaje .linia:hover {

    border-bottom-color: #e30613;
}


#metro .linia:hover {

    border-bottom-color: #0066cc;
}


/* =========================================================
   AKTYWNA LINIA
   ========================================================= */

.linia:active {

    background: #0055aa;
}


/* =========================================================
   SEKCJE
   ========================================================= */

.sekcja {

    margin-bottom: 30px;
}


.sekcja h2 {

    margin-bottom: 12px;

    padding-bottom: 8px;

    border-bottom: 1px solid #d5d5d5;

    font-size: 20px;

    font-weight: 700;
}


#sekcja-tramwaje {

    display: none;
}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 900px) {

    .dni {

        grid-template-columns:
            repeat(
                4,
                minmax(0, 1fr)
            );
    }
}


/* =========================================================
   TELEFON
   ========================================================= */

@media (max-width: 550px) {

    .container {

        width: 100%;

        max-width: none;

        margin-left: 0;

        margin-right: 0;

        padding-left: 0;

        padding-right: 0;

        box-sizing: border-box;
    }


    .dni,
    .kalendarz {

        width: 100%;

        max-width: none;

        margin-left: 0;

        margin-right: 0;

        box-sizing: border-box;
    }


    /* =====================================================
       KALENDARZ PRZESUWANY
       ===================================================== */

    .dni {

        display: flex !important;

        grid-template-columns: none;

        gap: 5px;

        width: 100%;

        max-width: 100%;

        overflow-x: auto;

        overflow-y: hidden;

        padding:
            0
            6px
            6px
            6px;

        box-sizing: border-box;

        scroll-snap-type:
            x proximity;

        scroll-behavior:
            smooth;

        -webkit-overflow-scrolling:
            touch;

        overscroll-behavior-x:
            contain;

        scrollbar-width:
            none;
    }


    .dni::-webkit-scrollbar {

        display: none;
    }


    .dni .dzien-btn {

        flex:
            0 0 112px;

        min-width:
            112px;

        font-size:
            14px;

        padding:
            10px 6px;

        scroll-snap-align:
            start;
    }


    /* =====================================================
       LINIE
       ===================================================== */

    .linie {

        /*
         * Blok linii nadal ma równy odstęp od lewej i prawej
         * krawędzi, ale niepełny wiersz zaczyna się od lewej.
         */
        gap: 5px;

        justify-content: flex-start;

        width: calc(100% - 24px);

        margin-left: auto;
        margin-right: auto;

        box-sizing: border-box;
    }


    /* Odsunięcie nagłówków i opisów o 8 px od lewej krawędzi */
    .container > h1,
    .container > p,
    .sekcja h2 {
        margin-left: 8px;
    }


    .linia {

        min-width: 56px;

        /*
         * Zachowujemy proporcje z wersji desktopowej:
         * 50 px wysokości / 13 px paska.
         *
         * Poprzednio na telefonie było 38 px wysokości,
         * ale pasek nadal miał 13 px, więc fioletowy pasek
         * wyglądał zbyt grubo względem białego pola.
         */
        height: 42px;

        padding: 0 10px;

        font-size: 16px;
    }


    #autobusy .linia {

        border-bottom-width: 11px;
    }


    #tramwaje .linia {

        border-bottom-width: 11px;
    }


    #metro .linia {

        border-bottom-width: 11px;
    }

}

</style>

</head>


<body>


<header class="topbar">

    <div class="logo">
        ROZKŁADY
    </div>


    <nav>

        <a href="../index.html">
            Strona główna
        </a>


        <a href="index.html">
            Linie
        </a>

    </nav>

</header>



<main class="container">


    <h1>
        Linie
    </h1>


    <p>
        Wybierz numer linii.
    </p>


    <!-- =====================================================
         KALENDARZ 7 DNI
         ===================================================== -->

    <div
        id="dni"
        class="dni"
    ></div>


    <!-- =====================================================
         WYBÓR INNEGO DNIA
         ===================================================== -->

    <div
        id="kalendarz"
        class="kalendarz"
    >

        <div
            class="kalendarz-tytul"
        >
            Wybór innego dnia
        </div>


        <input
            type="date"
            id="wybranaData"
        >

    </div>


    <!-- =====================================================
         WYSZUKIWARKA
         ===================================================== -->

    <input
        type="text"
        id="search"
        class="search"
        placeholder="🔎 Wyszukaj linię..."
    >


    <!-- =====================================================
         TRAMWAJE
         ===================================================== -->

    <div
        class="sekcja"
        id="sekcja-tramwaje"
    >

        <h2>
            🚋 Tramwaje
        </h2>


        <div
            id="tramwaje"
            class="linie"
        ></div>

    </div>


    <!-- =====================================================
         AUTOBUSY
         ===================================================== -->

    <div
        class="sekcja"
    >

        <h2>
            🚌 Autobusy
        </h2>


        <div
            id="autobusy"
            class="linie"
        ></div>

    </div>


    <!-- =====================================================
         METRO
         ===================================================== -->

    <div
        class="sekcja"
    >

        <h2>
            🚇 Metro
        </h2>


        <div
            id="metro"
            class="linie"
        ></div>

    </div>


</main>



<script
    src="../dane/linie.js"
></script>


<script
    src="../js/script.js"
></script>


<script>

/* =========================================================
   ZMIENNE
   ========================================================= */

let wybranaDataLinii =
    pobierzDateZURL() ||
    pobierzDzisiejszaDate();


/* =========================================================
   DZISIEJSZA DATA
   ========================================================= */

function pobierzDzisiejszaDate() {

    const data =
        new Date();


    data.setHours(
        0,
        0,
        0,
        0
    );


    return data;
}


/* =========================================================
   DATA YYYY-MM-DD
   ========================================================= */

function formatujDateInput(
    data
) {

    const rok =
        data.getFullYear();


    const miesiac =
        String(
            data.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const dzien =
        String(
            data.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        rok +
        "-" +
        miesiac +
        "-" +
        dzien
    );
}


/* =========================================================
   DATA D.MM
   ========================================================= */

function formatujDatePrzycisku(
    data
) {

    return (
        data.getDate() +
        "." +
        String(
            data.getMonth() + 1
        ).padStart(
            2,
            "0"
        )
    );
}


/* =========================================================
   DATA Z URL
   ========================================================= */

function pobierzDateZURL() {

    const parametry =
        new URLSearchParams(
            window.location.search
        );


    const tekst =
        parametry.get(
            "data"
        );


    if (!tekst) {

        return null;
    }


    const wynik =
        tekst.match(
            /^(\d{4})-(\d{2})-(\d{2})$/
        );


    if (!wynik) {

        return null;
    }


    const data =
        new Date(
            Number(
                wynik[1]
            ),
            Number(
                wynik[2]
            ) - 1,
            Number(
                wynik[3]
            )
        );


    data.setHours(
        0,
        0,
        0,
        0
    );


    if (
        data.getFullYear() !==
            Number(
                wynik[1]
            ) ||

        data.getMonth() !==
            Number(
                wynik[2]
            ) - 1 ||

        data.getDate() !==
            Number(
                wynik[3]
            )
    ) {

        return null;
    }


    return data;
}


/* =========================================================
   TA SAMA DATA
   ========================================================= */

function taSamaData(
    a,
    b
) {

    return (
        a instanceof Date &&
        b instanceof Date &&

        a.getFullYear() ===
            b.getFullYear() &&

        a.getMonth() ===
            b.getMonth() &&

        a.getDate() ===
            b.getDate()
    );
}


/* =========================================================
   POLSKIE SKRÓTY DNI
   ========================================================= */

function pobierzSkrotDnia(
    data
) {

    const dniTygodnia = [

        "nd",
        "pon",
        "wt",
        "śr",
        "czw",
        "pt",
        "sob"

    ];


    return dniTygodnia[
        data.getDay()
    ];
}


/* =========================================================
   ETYKIETA DNIA
   ========================================================= */

function pobierzEtykieteDnia(
    data,
    indeks
) {

    const dataTekst =
        formatujDatePrzycisku(
            data
        );


    if (indeks === 0) {

        return (
            dataTekst +
            " (dzisiaj)"
        );
    }


    if (indeks === 1) {

        return (
            dataTekst +
            " (jutro)"
        );
    }


    return (
        dataTekst +
        " (" +
        pobierzSkrotDnia(
            data
        ) +
        ")"
    );
}


/* =========================================================
   CZY DATA JEST 7. DNIEM KALENDARZA
   ========================================================= */

function czyOstatniDzienKalendarza(
    data
) {

    const dzisiaj =
        pobierzDzisiejszaDate();


    const ostatni =
        new Date(
            dzisiaj
        );


    ostatni.setDate(
        dzisiaj.getDate() +
        6
    );


    return taSamaData(
        data,
        ostatni
    );
}


/* =========================================================
   WIDOCZNOŚĆ WYBORU INNEGO DNIA
   ========================================================= */

function ustawWidocznoscKalendarza() {

    const kalendarz =
        document.getElementById(
            "kalendarz"
        );


    const input =
        document.getElementById(
            "wybranaData"
        );


    if (!kalendarz) {

        return;
    }


    if (
        czyOstatniDzienKalendarza(
            wybranaDataLinii
        )
    ) {

        kalendarz.style.display =
            "block";

    } else {

        kalendarz.style.display =
            "none";
    }


    if (input) {

        input.value =
            formatujDateInput(
                wybranaDataLinii
            );
    }
}


/* =========================================================
   GENEROWANIE 7 DNI
   ========================================================= */

function generujKalendarz7Dni() {

    const kontener =
        document.getElementById(
            "dni"
        );


    if (!kontener) {

        return;
    }


    kontener.innerHTML =
        "";


    const dzisiaj =
        pobierzDzisiejszaDate();


    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const data =
            new Date(
                dzisiaj
            );


        data.setDate(
            dzisiaj.getDate() +
            i
        );


        const btn =
            document.createElement(
                "button"
            );


        btn.type =
            "button";


        btn.className =
            "dzien-btn";


        btn.textContent =
            pobierzEtykieteDnia(
                data,
                i
            );


        if (
            taSamaData(
                data,
                wybranaDataLinii
            )
        ) {

            btn.classList.add(
                "aktywny"
            );
        }


        btn.addEventListener(
            "click",
            function() {

                wybierzDateLinii(
                    data
                );
            }
        );


        kontener.appendChild(
            btn
        );
    }


    ustawWidocznoscKalendarza();
}


/* =========================================================
   WYBÓR DATY
   ========================================================= */

function wybierzDateLinii(
    data
) {

    wybranaDataLinii =
        new Date(
            data
        );


    wybranaDataLinii.setHours(
        0,
        0,
        0,
        0
    );


    zapiszDateWURL();


    generujKalendarz7Dni();


    aktualizujLinkiLinii();
}


/* =========================================================
   ZAPIS DATY W URL LISTY LINII
   ========================================================= */

function zapiszDateWURL() {

    const url =
        new URL(
            window.location.href
        );


    url.searchParams.set(
        "data",
        formatujDateInput(
            wybranaDataLinii
        )
    );


    window.history.replaceState(
        null,
        "",
        url.toString()
    );
}


/* =========================================================
   DODANIE DATY DO LINKÓW LINII
   ========================================================= */

function aktualizujLinkiLinii() {

    const linki =
        document.querySelectorAll(
            "a.linia"
        );


    linki.forEach(
        link => {

            try {

                const url =
                    new URL(
                        link.href,
                        window.location.href
                    );


                url.searchParams.set(
                    "data",
                    formatujDateInput(
                        wybranaDataLinii
                    )
                );


                link.href =
                    url.toString();

            } catch (blad) {

                console.warn(
                    "Nie udało się ustawić daty dla linii.",
                    blad
                );
            }
        }
    );
}


/* =========================================================
   KLIKNIĘCIE LINII
   ========================================================= */

document.addEventListener(
    "click",
    function(event) {

        const link =
            event.target.closest(
                "a.linia"
            );


        if (!link) {

            return;
        }


        event.preventDefault();


        const url =
            new URL(
                link.href,
                window.location.href
            );


        url.searchParams.set(
            "data",
            formatujDateInput(
                wybranaDataLinii
            )
        );


        window.location.href =
            url.toString();
    }
);


/* =========================================================
   WYBÓR DATY Z INPUT
   ========================================================= */

const inputDaty =
    document.getElementById(
        "wybranaData"
    );


if (inputDaty) {

    inputDaty.addEventListener(
        "change",
        function() {

            if (!this.value) {

                return;
            }


            const czesci =
                this.value.split(
                    "-"
                );


            if (
                czesci.length !== 3
            ) {

                return;
            }


            const data =
                new Date(
                    Number(
                        czesci[0]
                    ),
                    Number(
                        czesci[1]
                    ) - 1,
                    Number(
                        czesci[2]
                    )
                );


            wybierzDateLinii(
                data
            );
        }
    );
}


/* =========================================================
   OBSERWATOR DYNAMICZNIE TWORZONYCH LINII
   ========================================================= */

const obserwatorLinii =
    new MutationObserver(
        function() {

            aktualizujLinkiLinii();
        }
    );


[
    "autobusy",
    "tramwaje",
    "metro"
].forEach(
    id => {

        const element =
            document.getElementById(
                id
            );


        if (element) {

            obserwatorLinii.observe(
                element,
                {

                    childList:
                        true,

                    subtree:
                        true

                }
            );
        }
    }
);


/* =========================================================
   START
   ========================================================= */

generujKalendarz7Dni();

aktualizujLinkiLinii();

</script>


</body>

</html>
