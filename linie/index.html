<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Linie – Rozkłady jazdy</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        /* =========================================================
           WYSZUKIWARKA
           ========================================================= */

        .search {

            width: 100%;

            box-sizing: border-box;

            padding: 11px 14px;

            font-size: 16px;

            border: 1px solid #bdbdbd;

            border-radius: 4px;

            margin-bottom: 25px;

            background: #fff;

            color: #222;

            outline: none;

        }


        .search:focus {

            border-color: #777;

        }


        /* =========================================================
           SEKCJA LINII
           ========================================================= */

        .linie {

            display: flex;

            flex-wrap: wrap;

            gap: 6px;

            align-items: center;

        }


      /* =========================================================
   PRZYCISKI LINII – WSPÓLNY WYGLĄD
   ========================================================= */

.linia {

    display: flex;

    align-items: center;

    justify-content: center;

    min-width: 62px;

    height: 50px;

    padding: 0 13px;

    box-sizing: border-box;

    background: #fff;

    text-decoration: none;

    color: #222;

    font-size: 17px;

    font-weight: 700;

    line-height: 1;

    transition:
        background-color 0.12s ease,
        color 0.12s ease,
        border-color 0.12s ease;

}


/* =========================================================
   AUTOBUSY
   ========================================================= */

#autobusy .linia {

    border-bottom: 13px solid #990066;

}


/* =========================================================
   TRAMWAJE
   ========================================================= */

#tramwaje .linia {

    border-bottom: 13px solid #e30613;

}


/* =========================================================
   METRO
   ========================================================= */

#metro .linia {

    border-bottom: 13px solid #0066cc;

}


/* =========================================================
   NAJECHANIE
   ========================================================= */

.linia:hover {

    background: #f5f5f5;

    color: #222;

    border-color: #aaa;

    transform: none;

}


/* =========================================================
   NAJECHANIE – ZACHOWANIE KOLOROWEJ BELKI
   ========================================================= */

#autobusy .linia:hover {

    border-bottom-color: #990066;

}


#tramwaje .linia:hover {

    border-bottom-color: #e30613;

}


#metro .linia:hover {

    border-bottom-color: #0066cc;

}


/* =========================================================
   SEKCJE
   ========================================================= */

.sekcja {

    margin-bottom: 30px;

}


.sekcja h2 {

    margin-bottom: 12px;

    padding-bottom: 8px;

    border-bottom: 1px solid #d5d5d5;

    font-size: 20px;

    font-weight: 700;

}

        /* =========================================================
           NAJECHANIE
           ========================================================= */

        .linia:hover {

            background: #0066cc;

            color: #fff;

            border-color: #0066cc;

            transform: none;

        }


        /* =========================================================
           AKTYWNA LINIA
           ========================================================= */

        .linia:active {

            background: #0055aa;

            border-color: #0055aa;

        }


        /* =========================================================
           SEKCJE
           ========================================================= */

        .sekcja {

            margin-bottom: 30px;

        }


        .sekcja h2 {

            margin-bottom: 12px;

            padding-bottom: 8px;

            border-bottom: 1px solid #d5d5d5;

            font-size: 20px;

            font-weight: 700;

        }


        /* =========================================================
           TELEFON
           ========================================================= */

        @media (max-width: 600px) {

            .linie {

                gap: 5px;

            }


            .linia {

                min-width: 56px;

                height: 38px;

                padding: 0 10px;

                font-size: 16px;

            }

        }

    </style>

</head>


<body>


<header class="topbar">

    <div class="logo">
        ROZKŁADY
    </div>

    <nav>

        <a href="../index.html">
            Strona główna
        </a>

        <a href="index.html">
            Linie
        </a>

    </nav>

</header>



<main class="container">


    <h1>Linie</h1>

    <p>
        Wybierz numer linii.
    </p>


    <input
        type="text"
        id="search"
        class="search"
        placeholder="🔎 Wyszukaj linię..."
    >

<!--<div class="sekcja">

        <h2>🚋 Tramwaje</h2>

        <div
            id="tramwaje"
            class="linie"
        ></div>

    </div>-->

    
    <div class="sekcja">

        
        <h2>🚌 Autobusy</h2>

        <div
            id="autobusy"
            class="linie"
        ></div>

    </div>


    <div class="sekcja">

        <h2>🚇 Metro</h2>

        <div
            id="metro"
            class="linie"
        ></div>

    </div>


</main>



<script src="../dane/linie.js"></script>

<script src="../js/script.js"></script>


</body>

</html>
