<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Linie – Rozkłady jazdy</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        /* =========================================================
           KALENDARZ
           ========================================================= */

        .kalendarz-sekcja {

            width: 100%;

            margin-bottom: 25px;

        }


        .dni {

            display: grid;

            grid-template-columns:
                repeat(
                    7,
                    minmax(0, 1fr)
                );

            gap: 4px;

            width: 80%;

            margin-left: auto;
            margin-right: auto;

            margin-bottom: 8px;

            box-sizing: border-box;

        }


        .dzien-btn {

            flex: 1;

            padding: 10px 4px;

            min-width: 0;

            background: white;

            border: 1px solid #ccc;

            border-radius: 6px;

            cursor: pointer;

            font-family:
                "Barlow Semi Condensed",
                sans-serif;

            font-size: 15px;

            font-weight: 700;

            line-height: 1.15;

            color: #222;

            text-align: center;

            white-space: nowrap;

            transition:
                background-color 0.15s,
                color 0.15s,
                border-color 0.15s;

            box-sizing: border-box;

        }


        .dzien-btn:hover {

            color: #d61c12;

            border-color: #d61c12;

            background: #fff;

        }


        .dzien-btn.aktywny {

            background: #d61c12;

            color: white;

            border-color: #d61c12;

        }


        .dzien-btn.aktywny:hover {

            background: #d61c12;

            color: white;

            border-color: #d61c12;

        }


        /* =========================================================
           WYBÓR INNEGO DNIA
           ========================================================= */

        .inny-dzien {

            width: 80%;

            margin-left: auto;
            margin-right: auto;

            margin-top: 0;

            margin-bottom: 8px;

            background: white;

            border: 1px solid #ddd;

            border-radius: 6px;

            padding: 12px 15px;

            box-sizing: border-box;

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .inny-dzien label {

            font-size: 15px;

            font-weight: 700;

            color: #222;

        }


        .inny-dzien input {

            padding: 10px;

            font-size: 16px;

            border: 1px solid #ccc;

            border-radius: 4px;

            background: white;

            font-family: inherit;

            box-sizing: border-box;

        }


        /* =========================================================
           WYBRANA DATA
           ========================================================= */

        .wybrana-data {

            width: 80%;

            margin-left: auto;
            margin-right: auto;

            margin-top: 5px;

            margin-bottom: 15px;

            box-sizing: border-box;

            font-size: 14px;

            color: #555;

        }


        .wybrana-data strong {

            color: #222;

        }


        /* =========================================================
           WYSZUKIWARKA
           ========================================================= */

        .search {

            width: 100%;

            box-sizing: border-box;

            padding: 11px 14px;

            font-size: 16px;

            border: 1px solid #bdbdbd;

            border-radius: 4px;

            margin-bottom: 25px;

            background: #fff;

            color: #222;

            outline: none;

        }


        .search:focus {

            border-color: #777;

        }


        /* =========================================================
           SEKCJA LINII
           ========================================================= */

        .linie {

            display: flex;

            flex-wrap: wrap;

            gap: 6px;

            align-items: center;

        }


        /* =========================================================
           PRZYCISKI LINII – WSPÓLNY WYGLĄD
           ========================================================= */

        .linia {

            display: flex;

            align-items: center;

            justify-content: center;

            min-width: 62px;

            height: 50px;

            padding: 0 13px;

            box-sizing: border-box;

            background: #fff;

            text-decoration: none;

            color: #222;

            font-size: 17px;

            font-weight: 700;

            line-height: 1;

            transition:
                background-color 0.12s ease,
                color 0.12s ease,
                border-color 0.12s ease;

        }


        /* =========================================================
           AUTOBUSY
           ========================================================= */

        #autobusy .linia {

            border-bottom: 13px solid #990066;

        }


        /* =========================================================
           TRAMWAJE
           ========================================================= */

        #tramwaje .linia {

            border-bottom: 13px solid #e30613;

        }


        /* =========================================================
           METRO
           ========================================================= */

        #metro .linia {

            border-bottom: 13px solid #0066cc;

        }


        /* =========================================================
           NAJECHANIE
           ========================================================= */

        .linia:hover {

            background: red;

            color: white;

            transform: none;

        }


        #autobusy .linia:hover {

            border-bottom-color: #990066;

        }


        #tramwaje .linia:hover {

            border-bottom-color: #e30613;

        }


        #metro .linia:hover {

            border-bottom-color: #0066cc;

        }


        /* =========================================================
           AKTYWNA LINIA
           ========================================================= */

        .linia:active {

            background: #0055aa;

        }


        /* =========================================================
           SEKCJE
           ========================================================= */

        .sekcja {

            margin-bottom: 30px;

        }


        .sekcja h2 {

            margin-bottom: 12px;

            padding-bottom: 8px;

            border-bottom: 1px solid #d5d5d5;

            font-size: 20px;

            font-weight: 700;

        }


        #sekcja-tramwaje {

            display: none;

        }


        /* =========================================================
           TELEFON
           ========================================================= */

        @media (max-width: 600px) {

            .container {

                width: 100%;

                max-width: none;

                box-sizing: border-box;

            }


            .linie {

                gap: 5px;

            }


            .linia {

                min-width: 56px;

                height: 38px;

                padding: 0 10px;

                font-size: 16px;

            }


            .kalendarz-sekcja {

                width: 100%;

            }


            .dni,
            .inny-dzien,
            .wybrana-data {

                width: 100%;

                max-width: none;

                margin-left: 0;

                margin-right: 0;

                box-sizing: border-box;

            }


            .dni {

                display: flex !important;

                grid-template-columns: none;

                gap: 5px;

                width: 100%;

                max-width: 100%;

                overflow-x: auto;

                overflow-y: hidden;

                padding: 0 6px 6px 6px;

                scroll-snap-type: x proximity;

                scroll-behavior: smooth;

                -webkit-overflow-scrolling: touch;

                overscroll-behavior-x: contain;

                scrollbar-width: none;

            }


            .dni::-webkit-scrollbar {

                display: none;

            }


            .dni .dzien-btn {

                flex: 0 0 112px;

                min-width: 112px;

                font-size: 14px;

                padding: 10px 6px;

                scroll-snap-align: start;

            }


            .inny-dzien {

                border-left: none;

                border-right: none;

                border-radius: 0;

            }


            .inny-dzien input {

                flex: 1;

                min-width: 0;

            }


            .wybrana-data {

                padding-left: 6px;

                padding-right: 6px;

            }

        }

    </style>

</head>


<body>


<header class="topbar">

    <div class="logo">
        ROZKŁADY
    </div>

    <nav>

        <a href="../index.html">
            Strona główna
        </a>

        <a href="index.html">
            Linie
        </a>

    </nav>

</header>



<main class="container">


    <h1>
        Linie
    </h1>


    <p>
        Wybierz numer linii.
    </p>


    <!-- =====================================================
         KALENDARZ
         ===================================================== -->

    <div
        class="kalendarz-sekcja"
    >

        <div
            id="dni"
            class="dni"
        ></div>


        <div
            class="inny-dzien"
        >

            <label
                for="wybranaData"
            >
                Inny dzień:
            </label>


            <input
                type="date"
                id="wybranaData"
            >

        </div>


        <div
            id="tekstWybranejDaty"
            class="wybrana-data"
        ></div>

    </div>


    <!-- =====================================================
         WYSZUKIWARKA
         ===================================================== -->

    <input
        type="text"
        id="search"
        class="search"
        placeholder="🔎 Wyszukaj linię..."
    >


    <!-- =====================================================
         TRAMWAJE
         ===================================================== -->

    <div
        class="sekcja"
        id="sekcja-tramwaje"
    >

        <h2>
            🚋 Tramwaje
        </h2>

        <div
            id="tramwaje"
            class="linie"
        ></div>

    </div>


    <!-- =====================================================
         AUTOBUSY
         ===================================================== -->

    <div
        class="sekcja"
    >

        <h2>
            🚌 Autobusy
        </h2>

        <div
            id="autobusy"
            class="linie"
        ></div>

    </div>


    <!-- =====================================================
         METRO
         ===================================================== -->

    <div
        class="sekcja"
    >

        <h2>
            🚇 Metro
        </h2>

        <div
            id="metro"
            class="linie"
        ></div>

    </div>


</main>



<script
    src="../dane/linie.js"
></script>


<script
    src="../js/script.js"
></script>


<script>

/* =========================================================
   ZMIENNE KALENDARZA
   ========================================================= */

let dataDlaRozkladu =
    pobierzDateZAdresu() ||
    dzisiejszaData();


/* =========================================================
   DZISIEJSZA DATA
   ========================================================= */

function dzisiejszaData() {

    const data =
        new Date();


    data.setHours(
        0,
        0,
        0,
        0
    );


    return data;

}


/* =========================================================
   FORMAT YYYY-MM-DD
   ========================================================= */

function formatujDateISO(
    data
) {

    const rok =
        data.getFullYear();


    const miesiac =
        String(
            data.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const dzien =
        String(
            data.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        rok +
        "-" +
        miesiac +
        "-" +
        dzien
    );

}


/* =========================================================
   FORMAT D.MM
   ========================================================= */

function formatujKrotkaDate(
    data
) {

    return (
        data.getDate() +
        "." +
        String(
            data.getMonth() + 1
        ).padStart(
            2,
            "0"
        )
    );

}


/* =========================================================
   DATA Z URL
   ========================================================= */

function pobierzDateZAdresu() {

    const parametry =
        new URLSearchParams(
            window.location.search
        );


    const tekst =
        parametry.get(
            "data"
        );


    if (!tekst) {
        return null;
    }


    const dopasowanie =
        tekst.match(
            /^(\d{4})-(\d{2})-(\d{2})$/
        );


    if (!dopasowanie) {
        return null;
    }


    const data =
        new Date(
            Number(
                dopasowanie[1]
            ),
            Number(
                dopasowanie[2]
            ) - 1,
            Number(
                dopasowanie[3]
            )
        );


    data.setHours(
        0,
        0,
        0,
        0
    );


    if (
        data.getFullYear() !==
        Number(
            dopasowanie[1]
        ) ||
        data.getMonth() !==
        Number(
            dopasowanie[2]
        ) - 1 ||
        data.getDate() !==
        Number(
            dopasowanie[3]
        )
    ) {

        return null;

    }


    return data;

}


/* =========================================================
   CZY TA SAMA DATA
   ========================================================= */

function taSamaData(
    a,
    b
) {

    if (
        !(a instanceof Date) ||
        !(b instanceof Date)
    ) {

        return false;

    }


    return (
        a.getFullYear() ===
            b.getFullYear() &&

        a.getMonth() ===
            b.getMonth() &&

        a.getDate() ===
            b.getDate()
    );

}


/* =========================================================
   DNI TYGODNIA
   ========================================================= */

function skrotDniaTygodnia(
    data
) {

    const dni = [

        "nd",
        "pon",
        "wt",
        "śr",
        "czw",
        "pt",
        "sob"

    ];


    return dni[
        data.getDay()
    ];

}


/* =========================================================
   ETYKIETA DNIA
   ========================================================= */

function etykietaDnia(
    data,
    indeks
) {

    const dataTekst =
        formatujKrotkaDate(
            data
        );


    if (indeks === 0) {

        return (
            dataTekst +
            " (dzisiaj)"
        );

    }


    if (indeks === 1) {

        return (
            dataTekst +
            " (jutro)"
        );

    }


    return (
        dataTekst +
        " (" +
        skrotDniaTygodnia(
            data
        ) +
        ")"
    );

}


/* =========================================================
   GENEROWANIE KALENDARZA
   ========================================================= */

function generujKalendarz() {

    const kontener =
        document.getElementById(
            "dni"
        );


    if (!kontener) {
        return;
    }


    kontener.innerHTML = "";


    const dzisiaj =
        dzisiejszaData();


    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const data =
            new Date(
                dzisiaj
            );


        data.setDate(
            dzisiaj.getDate() +
            i
        );


        const przycisk =
            document.createElement(
                "button"
            );


        przycisk.type =
            "button";


        przycisk.className =
            "dzien-btn";


        if (
            taSamaData(
                data,
                dataDlaRozkladu
            )
        ) {

            przycisk
                .classList
                .add(
                    "aktywny"
                );

        }


        przycisk.textContent =
            etykietaDnia(
                data,
                i
            );


        przycisk.addEventListener(
            "click",
            function() {

                ustawDate(
                    data
                );

            }
        );


        kontener.appendChild(
            przycisk
        );

    }


    ustawPoleDaty();

}


/* =========================================================
   USTAW DATĘ
   ========================================================= */

function ustawDate(
    data
) {

    dataDlaRozkladu =
        new Date(
            data
        );


    dataDlaRozkladu.setHours(
        0,
        0,
        0,
        0
    );


    zapiszDateWAdresie();


    generujKalendarz();


    aktualizujLinkiLinii();


    pokazWybranaDate();

}


/* =========================================================
   DATA W URL
   ========================================================= */

function zapiszDateWAdresie() {

    const url =
        new URL(
            window.location.href
        );


    url.searchParams.set(
        "data",
        formatujDateISO(
            dataDlaRozkladu
        )
    );


    window.history.replaceState(
        null,
        "",
        url
    );

}


/* =========================================================
   POLE DATE
   ========================================================= */

function ustawPoleDaty() {

    const input =
        document.getElementById(
            "wybranaData"
        );


    if (!input) {
        return;
    }


    input.value =
        formatujDateISO(
            dataDlaRozkladu
        );

}


/* =========================================================
   NAPIS Z WYBRANĄ DATĄ
   ========================================================= */

function pokazWybranaDate() {

    const element =
        document.getElementById(
            "tekstWybranejDaty"
        );


    if (!element) {
        return;
    }


    const format =
        new Intl.DateTimeFormat(
            "pl-PL",
            {

                weekday:
                    "long",

                day:
                    "numeric",

                month:
                    "long",

                year:
                    "numeric"

            }
        );


    element.innerHTML =
        "Rozkład na: <strong>" +
        format.format(
            dataDlaRozkladu
        ) +
        "</strong>";

}


/* =========================================================
   DODAWANIE DATY DO LINKÓW LINII
   ========================================================= */

function aktualizujLinkiLinii() {

    const linki =
        document.querySelectorAll(
            "a.linia"
        );


    linki.forEach(
        link => {

            try {

                const url =
                    new URL(
                        link.href,
                        window.location.href
                    );


                url.searchParams.set(
                    "data",
                    formatujDateISO(
                        dataDlaRozkladu
                    )
                );


                link.href =
                    url.toString();

            } catch (blad) {

                console.warn(
                    "Nie udało się ustawić daty dla linii.",
                    blad
                );

            }

        }
    );

}


/* =========================================================
   KLIKNIĘCIE LINII
   ========================================================= */

document.addEventListener(
    "click",
    function(event) {

        const link =
            event.target.closest(
                "a.linia"
            );


        if (!link) {
            return;
        }


        event.preventDefault();


        const url =
            new URL(
                link.href,
                window.location.href
            );


        url.searchParams.set(
            "data",
            formatujDateISO(
                dataDlaRozkladu
            )
        );


        window.location.href =
            url.toString();

    }
);


/* =========================================================
   WYBÓR INNEJ DATY
   ========================================================= */

const poleDaty =
    document.getElementById(
        "wybranaData"
    );


if (poleDaty) {

    poleDaty.addEventListener(
        "change",
        function() {

            if (!this.value) {
                return;
            }


            const czesci =
                this.value.split(
                    "-"
                );


            if (
                czesci.length !== 3
            ) {

                return;

            }


            const data =
                new Date(
                    Number(
                        czesci[0]
                    ),
                    Number(
                        czesci[1]
                    ) - 1,
                    Number(
                        czesci[2]
                    )
                );


            ustawDate(
                data
            );

        }
    );

}


/* =========================================================
   OBSERWATOR DYNAMICZNIE TWORZONYCH LINII
   ========================================================= */

const obserwatorLinii =
    new MutationObserver(
        function() {

            aktualizujLinkiLinii();

        }
    );


[
    "autobusy",
    "tramwaje",
    "metro"
].forEach(
    id => {

        const element =
            document.getElementById(
                id
            );


        if (element) {

            obserwatorLinii.observe(
                element,
                {

                    childList:
                        true,

                    subtree:
                        true

                }
            );

        }

    }
);


/* =========================================================
   START
   ========================================================= */

generujKalendarz();

pokazWybranaDate();

aktualizujLinkiLinii();

</script>


</body>

</html>
