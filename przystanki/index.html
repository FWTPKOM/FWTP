<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWTP - Przystanki</title>

    <link rel="stylesheet" href="/FWTP/css/style.css">

    <style>
        .przystanki-page {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px 50px;
            box-sizing: border-box;
        }

        .przystanki-box {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

      /* =========================================================
   NAGŁÓWEK - ODJAZDY Z PRZYSTANKÓW
   ========================================================= */

.przystanki-head {
    padding: 22px;

    background: #555555;
    color: #ffffff;

    border-bottom: none;
}


/* Tytuł */

.przystanki-head h1 {
    margin: 0 0 8px;

    color: #ffffff;

    font-size: 26px;
    font-weight: 700;
}


/* Tekst pod tytułem */

.przystanki-head p {
    margin: 0;

    color: #eeeeee;

    font-size: 16px;
}


/* =========================================================
   POLE WYSZUKIWANIA
   ========================================================= */

.wyszukiwarka-wrap {
    padding: 18px 22px;

    background: #d6d6d6;

    border-bottom: 1px solid #d2d2d2;
}


/* Samo pole wyszukiwania */

#wyszukiwarka {
    width: 100%;
    height: 48px;

    padding: 0 14px;

    box-sizing: border-box;

    background: #d6d6d6;

    border: 1px solid #000000;
    border-radius: 6px;

    color: #222222;

    font-size: 16px;

    outline: none;
}


/* Placeholder */

#wyszukiwarka::placeholder {
    color: #666666;
}


/* Aktywne pole */

#wyszukiwarka:focus {
    border-color: #d61c12;

    box-shadow:
        0 0 0 2px
        rgba(214, 28, 18, 0.10);
}

     /* =========================================================
   LICZBA PRZYSTANKÓW
   ========================================================= */

.licznik {
    padding: 11px 22px;

    background: #eeeeee;

    color: #666666;

    font-size: 14px;

    border-bottom: 1px solid #dddddd;
}

        .pozycja {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 22px;
            border-bottom: 1px solid #eee;
            color: #111;
        }

        .pozycja:last-child {
            border-bottom: 0;
        }

        .pozycja:hover {
            background: #fafafa;
        }

        .przystanek-link {
            display: inline-flex;
            align-items: center;
            min-width: 0;
            text-decoration: none;
            color: #111;
        }

        .przystanek-link:hover .nazwa {
            color: #d61c12;
        }

        .nazwa {
            font-weight: 600;
            transition: color .15s ease;
        }

        .nr {
            margin-left: 10px;
            font-size: 13px;
            color: #777;
            font-weight: 600;
            white-space: nowrap;
        }

        .linie {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 5px;
            margin-left: auto;
        }

        .linia {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 41px;
            padding: 4px 7px;
            border: 1px solid #d61c12;
            border-radius: 4px;
            color: #d61c12;
            background: #fff;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            transition:
                background-color .15s ease,
                color .15s ease,
                border-color .15s ease;
        }

        .linia:hover {
            background: #d61c12;
            color: #fff;
            border-color: #d61c12;
        }

        .komunikat {
            padding: 30px 22px;
            color: #666;
        }

        @media (max-width: 650px) {
            .przystanki-page {
                margin: 15px auto;
                padding: 0 0 35px;
            }

            .przystanki-box {
                border-left: 0;
                border-right: 0;
                border-radius: 0;
            }

            .przystanki-head,
            .wyszukiwarka-wrap,
            .licznik,
            .pozycja {
                padding-left: 15px;
                padding-right: 15px;
            }

            .pozycja {
                align-items: flex-start;
            }

            .przystanek-link {
                flex: 1 1 auto;
                flex-wrap: wrap;
            }

            .linie {
                max-width: 120px;
                flex: 0 0 auto;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="logo">FWTP</div>
    <nav id="menu"></nav>
</header>

<main class="przystanki-page">
    <section class="przystanki-box">
        <div class="przystanki-head">
            <h1>Odjazdy z przystanków</h1>
            <p>Wybierz przystanek, aby zobaczyć odjazdy wszystkich linii.</p>
        </div>

        <div class="wyszukiwarka-wrap">
            <input
                id="wyszukiwarka"
                type="search"
                placeholder="Wpisz nazwę lub numer przystanku..."
                autocomplete="off"
            >
        </div>

        <div class="licznik" id="licznik">Wczytywanie przystanków...</div>
        <div id="lista"></div>
    </section>
</main>

<script src="/FWTP/js/menu.js"></script>

<script>
let wszystkiePrzystanki = [];

function normalizuj(tekst) {
    return String(tekst || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ")
        .trim();
}

function escapeHtml(tekst) {
    return String(tekst ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function porownajLinie(a, b) {
    return String(a).localeCompare(
        String(b),
        "pl",
        { numeric: true, sensitivity: "base" }
    );
}

function sortujPrzystanki(lista) {
    return [...lista].sort((a, b) => {
        const nazwa = String(a.nazwa || "").localeCompare(
            String(b.nazwa || ""),
            "pl",
            { sensitivity: "base" }
        );

        if (nazwa !== 0) return nazwa;

        return String(a.nr || "").localeCompare(
            String(b.nr || ""),
            "pl",
            { numeric: true, sensitivity: "base" }
        );
    });
}

function pokazListe() {
    const lista = document.getElementById("lista");
    const licznik = document.getElementById("licznik");
    const szukaj = normalizuj(
        document.getElementById("wyszukiwarka").value
    );

    const wynik = wszystkiePrzystanki.filter(p => {
        if (!szukaj) return true;

        const tekst = normalizuj(
            `${p.nazwa || ""} ${p.nr || ""} ${(p.linie || []).join(" ")}`
        );

        return tekst.includes(szukaj);
    });

    licznik.textContent =
        wynik.length === 1
            ? "1 przystanek"
            : `${wynik.length} przystanków`;

    if (wynik.length === 0) {
        lista.innerHTML =
            `<div class="komunikat">Nie znaleziono przystanku.</div>`;
        return;
    }

    lista.innerHTML = wynik.map(p => {
        const url = new URL("/FWTP/przystanek/", window.location.origin);

        url.searchParams.set("nazwa", p.nazwa || "");
        url.searchParams.set("nr", p.nr || "");

        const linie = [...(p.linie || [])].sort(porownajLinie);

        return `
            <div class="pozycja">
                <a
                    class="przystanek-link"
                    href="${url.pathname}${url.search}"
                >
                    <span class="nazwa">${escapeHtml(p.nazwa || "")}</span>
                    <span class="nr">${escapeHtml(p.nr || "")}</span>
                </a>

                <span class="linie">
                    ${linie.slice(0, 8).map(linia => {
                        return `
                            <a
                                class="linia"
                                href="#"
                                data-linia="${escapeHtml(linia)}"
                                data-nazwa="${escapeHtml(p.nazwa || "")}"
                                data-nr="${escapeHtml(p.nr || "")}"
                                title="Rozkład linii ${escapeHtml(linia)} z tego przystanku"
                            >
                                ${escapeHtml(linia)}
                            </a>
                        `;
                    }).join("")}
                </span>
            </div>
        `;
    }).join("");
}

function dataISO(data) {
    return (
        data.getFullYear() + "-" +
        String(data.getMonth() + 1).padStart(2, "0") + "-" +
        String(data.getDate()).padStart(2, "0")
    );
}

async function pobierzJSON(adres) {
    try {
        const odpowiedz = await fetch(
            adres + (adres.includes("?") ? "&" : "?") + "v=" + Date.now(),
            { cache: "no-store" }
        );

        if (!odpowiedz.ok) return null;

        return await odpowiedz.json();

    } catch (blad) {
        console.warn("Nie udało się pobrać:", adres, blad);
        return null;
    }
}

function listaPrzystankow(dane) {
    if (Array.isArray(dane)) return dane;

    if (dane && Array.isArray(dane.przystanki)) {
        return dane.przystanki;
    }

    return [];
}

function kluczPrzystanku(p) {
    return (
        normalizuj(p?.nazwa || "") +
        "|" +
        String(p?.nr || "").trim().toLowerCase()
    );
}

function paczkaPasujeDoDaty(paczka, data) {
    const dzien = dataISO(data);
    const od = String(paczka?.od || "").trim();
    const doDaty = String(paczka?.do || "").trim();

    if (od && dzien < od) return false;
    if (doDaty && dzien > doDaty) return false;

    return true;
}

function adresIndeksuPaczki(paczka) {
    const folder = String(paczka?.folder || "")
        .trim()
        .replace(/^\/+/, "")
        .replace(/\/+$/, "");

    if (!folder) return "";

    return `/FWTP/dane/${folder}/przystanki.json`;
}

function scalIndeksyPrzystankow(
    baza,
    paczkiZDanymi
) {
    /*
     * mapaLinii przechowuje dla każdej linii jej aktualne
     * przystanki. Najpierw wczytujemy stan podstawowy.
     */
    const mapaLinii = new Map();

    baza.forEach(p => {
        (p.linie || []).forEach(linia => {
            const nrLinii = String(linia).trim();

            if (!mapaLinii.has(nrLinii)) {
                mapaLinii.set(nrLinii, new Map());
            }

            mapaLinii
                .get(nrLinii)
                .set(kluczPrzystanku(p), {
                    nazwa: p.nazwa || "",
                    nr: p.nr || ""
                });
        });
    });

    /*
     * Paczki są przekazane od najniższego do najwyższego
     * priorytetu. Każda paczka całkowicie zastępuje stan
     * TYLKO tych linii, które ma wpisane w "linie".
     */
    paczkiZDanymi.forEach(({ paczka, przystanki }) => {
        const liniePaczki = Array.isArray(paczka.linie)
            ? paczka.linie.map(x => String(x).trim()).filter(Boolean)
            : [];

        liniePaczki.forEach(linia => {
            mapaLinii.set(linia, new Map());
        });

        przystanki.forEach(p => {
            (p.linie || []).forEach(linia => {
                const nrLinii = String(linia).trim();

                if (!liniePaczki.includes(nrLinii)) {
                    return;
                }

                if (!mapaLinii.has(nrLinii)) {
                    mapaLinii.set(nrLinii, new Map());
                }

                mapaLinii
                    .get(nrLinii)
                    .set(kluczPrzystanku(p), {
                        nazwa: p.nazwa || "",
                        nr: p.nr || ""
                    });
            });
        });
    });

    /*
     * Ponownie składamy dane "przystanek -> wszystkie linie".
     */
    const wynik = new Map();

    for (const [linia, przystankiLinii] of mapaLinii) {
        for (const [klucz, p] of przystankiLinii) {
            if (!wynik.has(klucz)) {
                wynik.set(klucz, {
                    nazwa: p.nazwa,
                    nr: p.nr,
                    linie: []
                });
            }

            const rekord = wynik.get(klucz);

            if (!rekord.linie.includes(linia)) {
                rekord.linie.push(linia);
            }
        }
    }

    return [...wynik.values()];
}

async function wczytajPrzystankiDlaDaty(data) {
    const bazaDane =
        await pobierzJSON("/FWTP/dane/przystanki.json");

    const baza =
        listaPrzystankow(bazaDane);

    const manifest =
        await pobierzJSON("/FWTP/dane/paczki.json");

    const paczki =
        manifest && Array.isArray(manifest.paczki)
            ? manifest.paczki
            : (Array.isArray(manifest) ? manifest : []);

    /*
     * Rosnąco: paczka o większym priorytecie zostanie
     * zastosowana później i zastąpi wcześniejszą.
     */
    const pasujace =
        paczki
            .filter(p => paczkaPasujeDoDaty(p, data))
            .sort(
                (a, b) =>
                    Number(a.priorytet || 0) -
                    Number(b.priorytet || 0)
            );

    const paczkiZDanymi = [];

    for (const paczka of pasujace) {
        const adres =
            adresIndeksuPaczki(paczka);

        if (!adres) continue;

        const dane =
            await pobierzJSON(adres);

        if (!dane) {
            /*
             * Stara paczka może nie mieć jeszcze przystanki.json.
             * Wtedy jej nie używamy do indeksu przystanków.
             */
            continue;
        }

        paczkiZDanymi.push({
            paczka,
            przystanki:
                listaPrzystankow(dane)
        });
    }

    return scalIndeksyPrzystankow(
        baza,
        paczkiZDanymi
    );
}


function pobierzWariantKursu(kurs) {
    if (!kurs || typeof kurs !== "object") return "";

    const wariant = kurs.wariant;

    if (wariant && typeof wariant === "object") {
        return String(
            wariant.litera ||
            wariant.nazwa ||
            ""
        )
            .trim()
            .toUpperCase();
    }

    return String(wariant || "")
        .trim()
        .toUpperCase();
}


function czasJestPoprawny(czas) {
    return /^(\d{1,2}):(\d{2})$/.test(
        String(czas || "").trim()
    );
}


function paczkaZawieraLinie(paczka, linia) {
    if (
        !Array.isArray(paczka?.linie) ||
        paczka.linie.length === 0
    ) {
        return true;
    }

    return paczka.linie
        .map(x => String(x).trim())
        .includes(String(linia).trim());
}


function adresPlikuLiniiZPaczki(paczka, linia) {
    const folder = String(paczka?.folder || "")
        .trim()
        .replace(/^\/+/, "")
        .replace(/\/+$/, "");

    if (!folder) return "";

    return (
        "/FWTP/dane/" +
        folder +
        "/" +
        encodeURIComponent(linia) +
        ".json"
    );
}


async function pobierzDaneLiniiDlaDaty(linia, data) {
    const manifest =
        await pobierzJSON("/FWTP/dane/paczki.json");

    const paczki =
        manifest && Array.isArray(manifest.paczki)
            ? manifest.paczki
            : (Array.isArray(manifest) ? manifest : []);

    const pasujace =
        paczki
            .filter(
                p =>
                    paczkaPasujeDoDaty(p, data) &&
                    paczkaZawieraLinie(p, linia)
            )
            .sort(
                (a, b) =>
                    Number(b.priorytet || 0) -
                    Number(a.priorytet || 0)
            );

    for (const paczka of pasujace) {
        const adres =
            adresPlikuLiniiZPaczki(
                paczka,
                linia
            );

        if (!adres) continue;

        const dane =
            await pobierzJSON(adres);

        if (dane && Array.isArray(dane.rozkłady)) {
            return dane;
        }
    }

    return await pobierzJSON(
        "/FWTP/dane/" +
        encodeURIComponent(linia) +
        ".json"
    );
}


function znajdzPrzystanekLinii(
    daneLinii,
    nazwa,
    nr
) {
    if (
        !daneLinii ||
        !Array.isArray(daneLinii.rozkłady)
    ) {
        return null;
    }

    const szukanaNazwa =
        normalizuj(nazwa);

    const szukanyNr =
        String(nr || "").trim();

    for (const rozklad of daneLinii.rozkłady) {
        const kierunki =
            Array.isArray(rozklad.kierunki)
                ? rozklad.kierunki
                : [];

        for (
            let kierunekIndex = 0;
            kierunekIndex < kierunki.length;
            kierunekIndex++
        ) {
            const przystanki =
                Array.isArray(
                    kierunki[kierunekIndex].przystanki
                )
                    ? kierunki[kierunekIndex].przystanki
                    : [];

            for (
                let przystanekIndex = 0;
                przystanekIndex < przystanki.length;
                przystanekIndex++
            ) {
                const p =
                    przystanki[przystanekIndex];

                if (
                    normalizuj(p?.nazwa || "") !==
                    szukanaNazwa
                ) {
                    continue;
                }

                if (
                    String(p?.nr || "").trim() !==
                    szukanyNr
                ) {
                    continue;
                }

                /*
                 * Jeżeli ten sam słupek pojawia się w kilku
                 * kierunkach, preferujemy taki, z którego
                 * faktycznie jest odjazd dalej.
                 */
                const kursy =
                    Array.isArray(p.kursy)
                        ? p.kursy
                        : [];

                const maOdjazd =
                    kursy.some(
                        kurs => {
                            if (!czasJestPoprawny(kurs.czas)) {
                                return false;
                            }

                            const numerKursu =
                                String(
                                    kurs.numer || ""
                                ).trim();

                            if (!numerKursu) {
                                return true;
                            }

                            const wariant =
                                pobierzWariantKursu(
                                    kurs
                                );

                            for (
                                let i =
                                    przystanekIndex + 1;
                                i < przystanki.length;
                                i++
                            ) {
                                const dalej =
                                    Array.isArray(
                                        przystanki[i].kursy
                                    )
                                        ? przystanki[i].kursy
                                        : [];

                                if (
                                    dalej.some(
                                        k =>
                                            String(
                                                k.numer || ""
                                            ).trim() ===
                                            numerKursu
                                            &&
                                            pobierzWariantKursu(k) ===
                                            wariant
                                            &&
                                            czasJestPoprawny(k.czas)
                                    )
                                ) {
                                    return true;
                                }
                            }

                            return false;
                        }
                    );

                if (maOdjazd) {
                    return {
                        kierunek:
                            kierunekIndex,
                        przystanek:
                            przystanekIndex
                    };
                }
            }
        }
    }

    /*
     * Awaryjnie: jeśli nie znaleźliśmy przystanku
     * z odjazdem dalej, zwracamy pierwsze dokładne
     * dopasowanie nazwa + numer.
     */
    for (const rozklad of daneLinii.rozkłady) {
        const kierunki =
            Array.isArray(rozklad.kierunki)
                ? rozklad.kierunki
                : [];

        for (
            let kierunekIndex = 0;
            kierunekIndex < kierunki.length;
            kierunekIndex++
        ) {
            const przystanki =
                Array.isArray(
                    kierunki[kierunekIndex].przystanki
                )
                    ? kierunki[kierunekIndex].przystanki
                    : [];

            const przystanekIndex =
                przystanki.findIndex(
                    p =>
                        normalizuj(p?.nazwa || "") ===
                        szukanaNazwa
                        &&
                        String(p?.nr || "").trim() ===
                        szukanyNr
                );

            if (przystanekIndex !== -1) {
                return {
                    kierunek:
                        kierunekIndex,
                    przystanek:
                        przystanekIndex
                };
            }
        }
    }

    return null;
}


async function otworzRozkladLiniiZPrzystanku(
    linia,
    nazwa,
    nr,
    element
) {
    const data = new Date();
    data.setHours(0, 0, 0, 0);

    if (element) {
        element.style.pointerEvents = "none";
        element.setAttribute(
            "aria-busy",
            "true"
        );
    }

    try {
        const daneLinii =
            await pobierzDaneLiniiDlaDaty(
                linia,
                data
            );

        const znaleziony =
            znajdzPrzystanekLinii(
                daneLinii,
                nazwa,
                nr
            );

        if (!znaleziony) {
            throw new Error(
                "Nie znaleziono przystanku w rozkładzie linii " +
                linia
            );
        }

        const url =
            new URL(
                "/FWTP/linia/",
                window.location.origin
            );

        url.searchParams.set(
            "linia",
            linia
        );

        url.searchParams.set(
            "data",
            dataISO(data)
        );

        url.searchParams.set(
            "kierunek",
            znaleziony.kierunek
        );

        url.searchParams.set(
            "przystanek",
            "idx:" +
            znaleziony.przystanek
        );

        window.location.href =
            url.pathname +
            url.search;

    } catch (blad) {
        console.error(blad);

        alert(
            "Nie udało się otworzyć rozkładu tej linii z wybranego przystanku."
        );

        if (element) {
            element.style.pointerEvents = "";
            element.removeAttribute(
                "aria-busy"
            );
        }
    }
}


document
    .getElementById("lista")
    .addEventListener(
        "click",
        function (event) {
            const link =
                event.target.closest(
                    "a.linia"
                );

            if (!link) {
                return;
            }

            event.preventDefault();
            event.stopPropagation();

            otworzRozkladLiniiZPrzystanku(
                link.dataset.linia || "",
                link.dataset.nazwa || "",
                link.dataset.nr || "",
                link
            );
        }
    );


async function start() {
    const lista = document.getElementById("lista");
    const licznik = document.getElementById("licznik");

    try {
        const dzisiaj = new Date();
        dzisiaj.setHours(0, 0, 0, 0);

        wszystkiePrzystanki =
            sortujPrzystanki(
                await wczytajPrzystankiDlaDaty(
                    dzisiaj
                )
            );

        pokazListe();

    } catch (blad) {
        console.error(blad);

        licznik.textContent = "Błąd";

        lista.innerHTML =
            `<div class="komunikat">
                Nie udało się wczytać indeksu przystanków.
            </div>`;
    }
}

document
    .getElementById("wyszukiwarka")
    .addEventListener("input", pokazListe);

start();
</script>
