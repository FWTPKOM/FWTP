name: WTP LIVE - test dostepu ETA API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sprawdz polaczenie i Basic Auth (bez sekretow w logach)
        env:
          ETA_BASIC_USER: ${{ secrets.ETA_BASIC_USER }}
          ETA_BASIC_PASSWORD: ${{ secrets.ETA_BASIC_PASSWORD }}
        run: python -u test/check_eta_api.py
