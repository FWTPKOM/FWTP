name: WTP LIVE - test dostepu ETA API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sprawdz ETA (bez ujawniania klucza)
        env:
          ETA_API_KEY: ${{ secrets.ETA_API_KEY }}
        run: python test/check_eta_api.py
