name: Automatyczna aktualizacja GTFS
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gtfs-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pobierz i przetwórz GTFS (tworzy katalog od zera) (tworzy katalog od zera) (tworzy katalog od zera)
        run: python test/update_gtfs.py
      - name: Zapisz nowe rozkłady
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A test/gtfs
          if ! git diff --cached --quiet; then
            git commit -m "Automatyczna aktualizacja GTFS"
            git push
          fi
