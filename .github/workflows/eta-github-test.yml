name: WTP LIVE - ETA GitHub test v66

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eta-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zainstaluj requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Sprawdz ETA
        env:
          ETA_BASIC_USER: ${{ secrets.ETA_BASIC_USER }}
          ETA_BASIC_PASSWORD: ${{ secrets.ETA_BASIC_PASSWORD }}
          ETA_API_KEY: ${{ secrets.ETA_API_KEY }}
        run: python -u test/check_eta_github_v66.py
