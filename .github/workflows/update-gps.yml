name: WTP LIVE GPS - alternatywne pobieranie
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wtp-gps
  cancel-in-progress: false
jobs:
  gps:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pobierz aktualne pozycje GPS
        env:
          WTP_API_KEY: ${{ secrets.WTP_API_KEY }}
        run: python test/update_gps.py
      - name: Zapisz świeże pozycje
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/gps/1.json test/gps/2.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aktualizacja GPS WTP LIVE'
            git push
          fi
