<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Aktualności</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<header class="topbar">

    <div class="logo">
        ROZKŁADY
    </div>

    <nav>
        <a href="../">Strona główna</a>
        <a href="../linie/">Linie</a>
        <a href="./">Aktualności</a>
    </nav>

</header>


<main class="container">

    <section class="info">

        <h1>Aktualności</h1>

        <div id="aktualnosci">
            Ładowanie aktualności...
        </div>

    </section>

</main>


<footer>

    <p>
        FWTP © 2026
    </p>

</footer>


<script>

fetch("aktualnosci.json")
    .then(response => {

        if (!response.ok) {
            throw new Error(
                "Nie udało się pobrać aktualności."
            );
        }

        return response.json();

    })
    .then(aktualnosci => {

        const kontener =
            document.getElementById("aktualnosci");

        kontener.innerHTML = "";

        aktualnosci
            .sort((a, b) =>
                new Date(b.data) - new Date(a.data)
            )
            .forEach(aktualnosc => {

                const element =
                    document.createElement("article");

                element.className =
                    "aktualnosc";

                element.innerHTML = `
                    <div class="aktualnosc-data">
                        ${formatujDate(aktualnosc.data)}
                    </div>

                    <h3>
                        ${aktualnosc.tytul}
                    </h3>

                    <p>
                        ${aktualnosc.opis}
                    </p>

                  <a
    class="przycisk-czytaj"
    href="../artykul/?id=${encodeURIComponent(aktualnosc.id)}">

    Czytaj więcej →

</a>
                `;

                kontener.appendChild(element);

            });

    })
    .catch(error => {

        console.error(error);

        document.getElementById(
            "aktualnosci"
        ).innerHTML =
            "<p>Nie udało się załadować aktualności.</p>";

    });


function formatujDate(data) {

    const d =
        new Date(data + "T00:00:00");

    return d.toLocaleDateString(
        "pl-PL",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}

</script>

</body>
</html>
