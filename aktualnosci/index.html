<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Aktualności</title>

    <link rel="stylesheet"
          href="/FWTP/css/style.css">

</head>

<body>

<header class="topbar">

    <div class="logo">
        FWTP
    </div>

    <nav class="menu" id="menu"></nav>

</header>


<main class="container">

    <section class="info">

        <h1>Aktualności</h1>

        <div id="aktualnosci">
            Ładowanie aktualności...
        </div>

    </section>

</main>


<footer>

    <p>
        FWTP © 2026
    </p>

</footer>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const kontener =
        document.getElementById("aktualnosci");


    fetch("/FWTP/aktualnosci/aktualnosci.json", {
        cache: "no-store"
    })

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Błąd HTTP: " + response.status
                );

            }

            return response.json();

        })

        .then(aktualnosci => {

            if (!Array.isArray(aktualnosci)) {

                throw new Error(
                    "aktualnosci.json nie zawiera tablicy."
                );

            }


            kontener.innerHTML = "";


            aktualnosci

                .sort((a, b) => {

                    return (
                        new Date(b.data + "T00:00:00") -
                        new Date(a.data + "T00:00:00")
                    );

                })

                .forEach(aktualnosc => {

                    const element =
                        document.createElement("article");


                    element.className =
                        "aktualnosc";


                    element.innerHTML = `

                        <div class="aktualnosc-data">
                            ${formatujDate(aktualnosc.data)}
                        </div>

                        <h3>
                            ${aktualnosc.tytul}
                        </h3>

                        <p>
                            ${aktualnosc.opis}
                        </p>

                        <a
                            class="przycisk-czytaj"
                            href="/FWTP/artykul/?id=${encodeURIComponent(aktualnosc.id)}">

                            Czytaj więcej →

                        </a>

                    `;


                    kontener.appendChild(element);

                });


            if (aktualnosci.length === 0) {

                kontener.innerHTML =
                    "<p>Brak aktualności.</p>";

            }

        })

        .catch(error => {

            console.error(
                "Błąd ładowania aktualności:",
                error
            );

            kontener.innerHTML =
                "<p>Nie udało się załadować aktualności.</p>";

        });

});


function formatujDate(data) {

    const d =
        new Date(data + "T00:00:00");


    return d.toLocaleDateString(
        "pl-PL",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}

</script>


<script src="/FWTP/js/menu.js"></script>

</body>

</html>
