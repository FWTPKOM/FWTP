
<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FWTP</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topbar">

    <div class="logo">
        FWTP
    </div>

   <nav class="menu" id="menu"></nav>

</header>


<main class="container">

<section class="hero-grid">

    <section class="hero">

        <h1>
            Rozkład jazdy
        </h1>

        <a
            class="main-button"
            href="linie/"
        >
            Przejdź do listy linii
        </a>

    </section>


    <section class="hero">

        <h1>
            Odjazdy z przystanków
        </h1>

        <a
            class="main-button"
            href="przystanki/"
        >
            Przejdź do listy przystanków
        </a>

    </section>
     <section class="hero">
        <h1>Rozkład brygad</h1>
        <a class="main-button" href="przystanki/">Przejdź do listy brygad</a>
      </section>
      <section class="hero" style="background-color:#E0E0E0">
        <h1 style="color:#4F4F4F">Rozkłady papierowe</h1>
        <a class="main-button" href="" style="background-color:#B35656">wkrótce</a>
      </section>
</section>


<section class="info">

    <div class="sekcja-naglowek">

        <h2>
            Aktualności
        </h2>

        <a
            class="przycisk-wszystkie"
            href="aktualnosci/">

            Wszystkie aktualności

        </a>

    </div>

    <div id="aktualnosci">
        Ładowanie aktualności...
    </div>

</section>

</main>


<footer>

    <p>
        FWTP © 2026
    </p>

</footer>

<script src="/FWTP/js/menu.js"></script>
</body>
 <script>

fetch("aktualnosci/aktualnosci.json")
    .then(response => {

        if (!response.ok) {
            throw new Error("Nie udało się pobrać aktualności.");
        }

        return response.json();

    })
    .then(aktualnosci => {

        const kontener =
            document.getElementById("aktualnosci");

        kontener.innerHTML = "";

        aktualnosci
            .sort((a, b) =>
                new Date(b.data) - new Date(a.data)
            )
            .slice(0, 3)
            .forEach(aktualnosc => {

                const element =
                    document.createElement("article");

                element.className = "aktualnosc";

                element.innerHTML = `
                    <div class="aktualnosc-data">
                        ${formatujDate(aktualnosc.data)}
                    </div>

                    <h3>
                        ${aktualnosc.tytul}
                    </h3>

                    <p>
                        ${aktualnosc.opis}
                    </p>

                   <a
    class="przycisk-czytaj"
    href="artykul/?id=${encodeURIComponent(aktualnosc.id)}">

    Czytaj więcej →

</a>
                `;

                kontener.appendChild(element);

            });

    })
    .catch(error => {

        console.error(error);

        document.getElementById(
            "aktualnosci"
        ).innerHTML =
            "<p>Nie udało się załadować aktualności.</p>";

    });


function formatujDate(data) {

    const d =
        new Date(data + "T00:00:00");

    return d.toLocaleDateString(
        "pl-PL",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}

</script>
</html>
