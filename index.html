
<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rozkłady jazdy</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topbar">

    <div class="logo">
        ROZKŁADY
    </div>

    <nav>
        <a href="index.html">Strona główna</a>
        <a href="linie/">Linie</a>
    </nav>

</header>


<main class="container">

    <section class="hero">

        <h1>Rozkłady jazdy</h1>

        <a class="main-button" href="linie/">
            Przejdź do listy linii
        </a>

    </section>


  <section class="info">

    <h2>Aktualności</h2>

    <div id="aktualnosci">
        Ładowanie aktualności...
    </div>

</section>

</main>


<footer>

    <p>
        Rozkłady jazdy © 2026
    </p>

</footer>


</body>
    <script>

fetch("dane/aktualnosci.json")
    .then(response => {

        if (!response.ok) {
            throw new Error("Nie udało się pobrać aktualności.");
        }

        return response.json();

    })
    .then(aktualnosci => {

        const kontener =
            document.getElementById("aktualnosci");

        kontener.innerHTML = "";

        aktualnosci
            .sort((a, b) =>
                new Date(b.data) - new Date(a.data)
            )
            .forEach(aktualnosc => {

                const element =
                    document.createElement("article");

                element.className =
                    "aktualnosc";

                element.innerHTML = `
                    <div class="aktualnosc-data">
                        ${formatujDate(aktualnosc.data)}
                    </div>

                    <h3>
                        ${aktualnosc.tytul}
                    </h3>

                    <p>
                        ${aktualnosc.opis}
                    </p>

                    <a href="artykul/?id=${encodeURIComponent(aktualnosc.id)}">
                        Czytaj więcej →
                    </a>
                `;

                kontener.appendChild(element);

            });

    })
    .catch(error => {

        console.error(error);

        document.getElementById(
            "aktualnosci"
        ).innerHTML =
            "<p>Nie udało się załadować aktualności.</p>";

    });


function formatujDate(data) {

    const d =
        new Date(data + "T00:00:00");

    return d.toLocaleDateString(
        "pl-PL",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}

</script>
</html>
