/* =========================================================
   BRYGADY ŁĄCZONE – v13
   PEŁNA NOWA LOGIKA NA PODSTAWIE VBA
   =========================================================

   Zasada jest taka sama jak w VBA:

   1. Zadanie > 99 może występować na kilku liniach.
   2. Dla każdej linii najpierw budujemy wspólną oś obu kierunków
      (odpowiednik MergeStops / BuildCombinedLineData).
   3. Dopiero na tę oś mapujemy godziny każdego konkretnego kursu.
   4. Kursy wszystkich linii sortujemy chronologicznie.
   5. Każdy rzeczywisty przebieg kursu staje się wzorcem.
   6. Wzorce są składane ważonym LCS do jednej osi zadania
      (odpowiednik BuildMostCompactCombinedRouteLayout).
   7. Numery przystanków są pobierane z obu stron osi danej linii,
      dokładnie jak stopValue(1) / stopValue(2) w VBA.
   8. Linia 999 bierze udział we wszystkim, ale nie jest pokazywana
      w nagłówku brygady.
   ========================================================= */

const vbaCombinedLineCache = new Map();


function czyNumerZadaniaLaczonego(brygada){
    const tekst = String(brygada || "").trim();
    return /^\d+$/.test(tekst) && Number(tekst) > 99;
}


function vbaCombinedCacheKey(linia, data){
    return dataISO(data) + "|" + String(linia || "").trim();
}


async function vbaPobierzLinie(linia, data){
    const key = vbaCombinedCacheKey(linia, data);

    if(vbaCombinedLineCache.has(key)){
        return vbaCombinedLineCache.get(key);
    }

    const promise = pobierzLinie(linia, data).catch(() => null);
    vbaCombinedLineCache.set(key, promise);

    return promise;
}


function vbaWszystkieLinieZManifestu(paczki){
    const result = new Set();

    (Array.isArray(paczki) ? paczki : []).forEach(paczka => {
        (Array.isArray(paczka?.linie) ? paczka.linie : []).forEach(linia => {
            const nr = String(linia || "").trim();
            if(nr) result.add(nr);
        });
    });

    return Array.from(result).sort(porownajBrygady);
}


/* =========================================================
   ZBIERANIE KURSÓW – osobna wersja dla brygad łączonych
   ========================================================= */

function vbaZbierzKursyLinii(dane, data){
    const mapa = new Map();
    const rozklady = Array.isArray(dane?.rozkłady) ? dane.rozkłady : [];

    rozklady.forEach((rozklad, rozkladIndex) => {
        const kierunki = Array.isArray(rozklad?.kierunki)
            ? rozklad.kierunki
            : [];

        kierunki.forEach((kierunek, kierunekIndex) => {
            const przystanki = Array.isArray(kierunek?.przystanki)
                ? kierunek.przystanki
                : [];

            przystanki.forEach((przystanek, stopIndex) => {
                const kursy = Array.isArray(przystanek?.kursy)
                    ? przystanek.kursy
                    : [];

                kursy.forEach(kurs => {
                    if(!czyKursPasujeDoDaty(kurs, data)) return;

                    const brygada = String(kurs?.brygada || "").trim();
                    const numer = String(kurs?.numer || "").trim();
                    const czas = String(kurs?.czas || "").trim();

                    if(
                        !brygada ||
                        !numer ||
                        czasNaMinuty(czas) === null
                    ){
                        return;
                    }

                    const wariant = String(kurs?.wariant || "").trim();

                    /*
                     * Rozkład jest częścią klucza.
                     * Nie wolno łączyć dwóch różnych bloków rozkładowych
                     * tylko dlatego, że mają ten sam numer kursu.
                     */
                    const key = [
                        rozkladIndex,
                        kierunekIndex,
                        numer,
                        wariant,
                        brygada
                    ].join("|");

                    if(!mapa.has(key)){
                        mapa.set(key, {
                            key,
                            linia: String(dane?.linia || ""),
                            brygada,
                            numer,
                            wariant,
                            kierunek: kierunekIndex,

                            rozkladIndex,
                            rozklad,
                            kierunekData: kierunek,
                            route: przystanki,

                            czasy: new Map(),
                            punkty: new Map(),

                            start: null,
                            koniec: null,
                            startIndex: null,
                            koniecIndex: null
                        });
                    }

                    const record = mapa.get(key);

                    record.czasy.set(stopIndex, czas);
                    record.punkty.set(stopIndex, {
                        nazwa: String(przystanek?.nazwa || ""),
                        nr: vbaNr(przystanek?.nr),
                        typ: String(przystanek?.typ || ""),
                        nz: czyNZ(przystanek)
                    });
                });
            });
        });
    });

    const wynik = Array.from(mapa.values());

    wynik.forEach(record => {
        const indexes = Array.from(record.czasy.keys())
            .filter(i => czasNaMinuty(record.czasy.get(i)) !== null)
            .sort((a, b) => a - b);

        if(!indexes.length) return;

        record.startIndex = indexes[0];
        record.koniecIndex = indexes[indexes.length - 1];

        record.start = czasNaMinuty(record.czasy.get(record.startIndex));
        record.koniec = czasNaMinuty(record.czasy.get(record.koniecIndex));

        if(
            record.start !== null &&
            record.koniec !== null
        ){
            while(record.koniec < record.start){
                record.koniec += 1440;
            }
        }
    });

    return wynik.filter(k =>
        k.start !== null &&
        k.koniec !== null
    );
}


function vbaGrupujPoBrygadzie(kursy){
    const groups = new Map();

    (kursy || []).forEach(kurs => {
        const b = String(kurs?.brygada || "").trim();
        if(!b) return;

        if(!groups.has(b)){
            groups.set(b, []);
        }

        groups.get(b).push(kurs);
    });

    return groups;
}


async function vbaPobierzDodatkoweLinie(
    wybranaLinia,
    data,
    potrzebneBrygady
){
    const paczki = await pobierzManifestPaczek();
    const kandydaci = vbaWszystkieLinieZManifestu(paczki)
        .filter(linia => String(linia) !== String(wybranaLinia));

    if(!kandydaci.length || !potrzebneBrygady.size){
        return [];
    }

    const wynik = [];
    const LIMIT = 10;

    for(let i = 0; i < kandydaci.length; i += LIMIT){
        const partia = kandydaci.slice(i, i + LIMIT);

        const danePartii = await Promise.all(
            partia.map(linia => vbaPobierzLinie(linia, data))
        );

        danePartii.forEach(dane => {
            if(!dane) return;

            const kursy = vbaZbierzKursyLinii(dane, data);

            const potrzebna = kursy.some(kurs =>
                potrzebneBrygady.has(
                    String(kurs?.brygada || "").trim()
                )
            );

            if(potrzebna){
                wynik.push({
                    dane,
                    kursy
                });
            }
        });
    }

    return wynik;
}


/* =========================================================
   POMOCNICZE – nazwy / numery
   ========================================================= */

function vbaNorm(text){
    return normalizuj(text);
}


function vbaNr(value){
    /*
     * Dokładny odpowiednik VBA FormatStopNumber:
     * ""   -> ""
     * 2    -> "02"
     * "2"  -> "02"
     * "02" -> "02"
     * 71   -> "71"
     */
    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    let txt = String(value).trim();

    if(!txt){
        return "";
    }

    const normalizedNumeric =
        txt.replace(",", ".");

    if(
        /^[-+]?\d+(?:\.0+)?$/.test(normalizedNumeric)
    ){
        const number = Math.trunc(
            Number(normalizedNumeric)
        );

        if(Number.isFinite(number)){
            if(number >= 0 && number < 10){
                return "0" + String(number);
            }

            return String(number);
        }
    }

    return txt;
}


function vbaTextEquals(a, b){
    return vbaNorm(a) === vbaNorm(b);
}


function vbaStopKey(stop){
    return vbaNorm(stop?.nazwa) + "|" + vbaNr(stop?.nr);
}



/* =========================================================
   v15 – DOKŁADNY ODPOWIEDNIK GetOrderedStopRowsByLp
   ========================================================= */

function vbaLpSortKey(value, fallbackOrder){
    const MISSING_LP_BASE = 1_000_000_000;

    if(
        value === null ||
        value === undefined
    ){
        return MISSING_LP_BASE + fallbackOrder;
    }

    let txt = String(value).trim()
        .replace(/\u00A0/g, "")
        .replace(",", ".");

    if(txt.endsWith(".")){
        txt = txt.slice(0, -1);
    }

    if(txt && Number.isFinite(Number(txt))){
        return Number(txt);
    }

    return MISSING_LP_BASE + fallbackOrder;
}


function vbaSortStopsByLp(route){
    const source =
        Array.isArray(route)
            ? route
            : [];

    return source
        .map((p, index) => ({
            p,
            sourceOrder: index,
            sortKey: vbaLpSortKey(
                p?.lp,
                index + 1
            )
        }))
        .sort((a, b) => {
            if(a.sortKey !== b.sortKey){
                return a.sortKey - b.sortKey;
            }

            /*
             * Stabilne sortowanie przy tym samym/brakującym L.p.
             * dokładnie jak sourceOrder w VBA.
             */
            return a.sourceOrder - b.sourceOrder;
        })
        .map(x => ({
            ...(x.p || {}),
            _sourceOrder: x.sourceOrder
        }));
}


function vbaUsunKolejneDuplikaty(route){
    const result = [];
    let lastKey = null;

    (Array.isArray(route) ? route : []).forEach((p, originalIndex) => {
        const item = {
            nazwa: String(p?.nazwa || ""),
            nr: vbaNr(p?.nr),
            lp: p?.lp,
            typ: String(p?.typ || "").trim().toUpperCase(),
            nz: czyNZ(p),

            /*
             * _sourceOrder pochodzi sprzed sortowania po L.p.
             * Jeżeli go nie ma, zachowujemy indeks bieżący.
             */
            originalIndex:
                Number.isInteger(p?._sourceOrder)
                    ? p._sourceOrder
                    : originalIndex
        };

        const key = vbaStopKey(item);

        if(key !== lastKey){
            result.push(item);
            lastKey = key;
        }
    });

    return result;
}


/* =========================================================
   WYBÓR STRUKTURY KIERUNKU
   ========================================================= */

function vbaRouteZKierunku(kierunek){
    /*
     * VBA:
     * GetOrderedStopRowsByLp -> AddIfNotConsecutiveDuplicate.
     *
     * Najpierw stabilnie sortujemy po L.p., potem usuwamy
     * wyłącznie kolejne duplikaty nazwa+numer.
     */
    const ordered =
        vbaSortStopsByLp(
            Array.isArray(kierunek?.przystanki)
                ? kierunek.przystanki
                : []
        );

    return vbaUsunKolejneDuplikaty(
        ordered
    );
}


/*
 * Odpowiednik GetCachedRouteStructure / ExtractStopsFromOrderedRows:
 * bierzemy dokładnie dwa kierunki TEGO SAMEGO obiektu "rozkład".
 *
 * Eksporter JSON tworzy jeden obiekt rozkładu z każdych dwóch
 * kolejnych nagłówków przystankowych, więc to jest bezpośredni
 * odpowiednik primaryStopRow / secondaryStopRow z VBA.
 */
function vbaPelneTrasyZRozkladu(rozklad){
    const kierunki =
        Array.isArray(rozklad?.kierunki)
            ? rozklad.kierunki
            : [];

    return {
        route0:
            kierunki.length >= 1
                ? vbaRouteZKierunku(kierunki[0])
                : [],

        route1:
            kierunki.length >= 2
                ? vbaRouteZKierunku(kierunki[1])
                : []
    };
}


/* =========================================================
   VBA: GetStopMatchScore + MergeStops
   ========================================================= */

function vbaGetStopMatchScore(
    primary,
    secondary,
    primaryIndex,
    primaryCount,
    secondaryIndex,
    secondaryCount
){
    if(!vbaTextEquals(primary?.nazwa, secondary?.nazwa)){
        return 0;
    }

    let score = 100;

    if(
        vbaNr(primary?.nr) &&
        vbaNr(secondary?.nr) &&
        vbaTextEquals(primary?.nr, secondary?.nr)
    ){
        score += 1000;
    }

    if(primaryIndex === 0 && secondaryIndex === 0){
        score += 5000;
    }

    if(
        primaryIndex === primaryCount - 1 &&
        secondaryIndex === secondaryCount - 1
    ){
        score += 10000;
    }

    return score;
}


function vbaMergeStops(primaryRoute, secondaryRoute){
    const primary = Array.isArray(primaryRoute) ? primaryRoute : [];
    const secondarySource = Array.isArray(secondaryRoute)
        ? secondaryRoute
        : [];

    /*
     * Dokładnie jak VBA:
     * drugi kierunek odwracamy, aby obie listy miały ten sam
     * kierunek wyświetlania od góry do dołu.
     */
    const secondary = [...secondarySource].reverse();

    const n = primary.length;
    const m = secondary.length;

    if(!n){
        return secondary.map(s => ({
            nazwa: s.nazwa,
            code0: "",
            code1: vbaNr(s.nr),
            nz0: false,
            nz1: s.nz
        }));
    }

    if(!m){
        return primary.map(p => ({
            nazwa: p.nazwa,
            code0: vbaNr(p.nr),
            code1: "",
            nz0: p.nz,
            nz1: false
        }));
    }

    const dp = Array.from(
        {length: n + 1},
        () => Array(m + 1).fill(0)
    );

    for(let i = n - 1; i >= 0; i--){
        for(let j = m - 1; j >= 0; j--){
            const matchScore = vbaGetStopMatchScore(
                primary[i],
                secondary[j],
                i,
                n,
                j,
                m
            );

            const matchTotal = matchScore > 0
                ? matchScore + dp[i + 1][j + 1]
                : -1;

            const skipPrimary = dp[i + 1][j];
            const skipSecondary = dp[i][j + 1];

            dp[i][j] = Math.max(
                skipPrimary,
                skipSecondary,
                matchTotal
            );
        }
    }

    const result = [];
    let i = 0;
    let j = 0;

    while(i < n && j < m){
        const matchScore = vbaGetStopMatchScore(
            primary[i],
            secondary[j],
            i,
            n,
            j,
            m
        );

        const matchTotal = matchScore > 0
            ? matchScore + dp[i + 1][j + 1]
            : -1;

        const skipPrimary = dp[i + 1][j];
        const skipSecondary = dp[i][j + 1];

        /*
         * VBA przy remisie preferuje prawidłowe dopasowanie.
         */
        if(
            matchScore > 0 &&
            matchTotal === dp[i][j]
        ){
            result.push({
                nazwa: primary[i].nazwa,
                code0: vbaNr(primary[i].nr),
                code1: vbaNr(secondary[j].nr),
                nz0: primary[i].nz,
                nz1: secondary[j].nz
            });

            i++;
            j++;
        }
        else if(skipPrimary >= skipSecondary){
            result.push({
                nazwa: primary[i].nazwa,
                code0: vbaNr(primary[i].nr),
                code1: "",
                nz0: primary[i].nz,
                nz1: false
            });

            i++;
        }
        else{
            result.push({
                nazwa: secondary[j].nazwa,
                code0: "",
                code1: vbaNr(secondary[j].nr),
                nz0: false,
                nz1: secondary[j].nz
            });

            j++;
        }
    }

    while(i < n){
        result.push({
            nazwa: primary[i].nazwa,
            code0: vbaNr(primary[i].nr),
            code1: "",
            nz0: primary[i].nz,
            nz1: false
        });
        i++;
    }

    while(j < m){
        result.push({
            nazwa: secondary[j].nazwa,
            code0: "",
            code1: vbaNr(secondary[j].nr),
            nz0: false,
            nz1: secondary[j].nz
        });
        j++;
    }

    return result;
}


/* =========================================================
   MAPOWANIE KURSU NA OŚ LINII
   odpowiednik BuildSourceRowMaps + BuildCombinedLineData
   ========================================================= */

function vbaFindNextMergedStopIndex(
    stops,
    stopName,
    stopNumber,
    direction,
    startIndex
){
    const codeField = direction === 0 ? "code0" : "code1";

    for(let i = Math.max(0, startIndex); i < stops.length; i++){
        if(
            vbaTextEquals(stops[i]?.nazwa, stopName) &&
            vbaTextEquals(stops[i]?.[codeField], stopNumber)
        ){
            return i;
        }
    }

    return -1;
}


function vbaFindPreviousMergedStopIndex(
    stops,
    stopName,
    stopNumber,
    direction,
    startIndex
){
    const codeField = direction === 0 ? "code0" : "code1";

    for(
        let i = Math.min(stops.length - 1, startIndex);
        i >= 0;
        i--
    ){
        if(
            vbaTextEquals(stops[i]?.nazwa, stopName) &&
            vbaTextEquals(stops[i]?.[codeField], stopNumber)
        ){
            return i;
        }
    }

    return -1;
}


function vbaMapujKursNaLineData(kurs, lineData){
    const times = new Map();
    const actualRows = [];

    /*
     * VBA BuildSourceRowMaps nie przechodzi po surowej kolejności
     * wierszy arkusza. Najpierw GetOrderedStopRowsByLp sortuje je po L.p.
     *
     * Dlatego również tutaj musimy mapować godziny według tej samej
     * kolejności. Sam czas nadal pobieramy z pierwotnego indeksu JSON.
     */
    const orderedSource =
        (Array.isArray(kurs?.route) ? kurs.route : [])
            .map((p, rawIndex) => ({
                p,
                rawIndex,
                sortKey: vbaLpSortKey(
                    p?.lp,
                    rawIndex + 1
                )
            }))
            .sort((a, b) => {
                if(a.sortKey !== b.sortKey){
                    return a.sortKey - b.sortKey;
                }

                return a.rawIndex - b.rawIndex;
            })
            .filter(item =>
                kurs.czasy.has(item.rawIndex) &&
                czasNaMinuty(
                    kurs.czasy.get(item.rawIndex)
                ) !== null
            );

    if(!orderedSource.length){
        return null;
    }

    if(kurs.kierunek === 0){
        let search = 0;

        orderedSource.forEach(item => {
            const rawIndex = item.rawIndex;

            const p =
                kurs.punkty.get(rawIndex) ||
                item.p ||
                {};

            const rowIndex =
                vbaFindNextMergedStopIndex(
                    lineData.stops,
                    p.nazwa,
                    p.nr,
                    0,
                    search
                );

            if(rowIndex >= 0){
                times.set(
                    rowIndex,
                    String(
                        kurs.czasy.get(rawIndex)
                    )
                );

                actualRows.push(rowIndex);
                search = rowIndex + 1;
            }
        });
    }
    else{
        let search =
            lineData.stops.length - 1;

        orderedSource.forEach(item => {
            const rawIndex = item.rawIndex;

            const p =
                kurs.punkty.get(rawIndex) ||
                item.p ||
                {};

            const rowIndex =
                vbaFindPreviousMergedStopIndex(
                    lineData.stops,
                    p.nazwa,
                    p.nr,
                    1,
                    search
                );

            if(rowIndex >= 0){
                times.set(
                    rowIndex,
                    String(
                        kurs.czasy.get(rawIndex)
                    )
                );

                actualRows.push(rowIndex);
                search = rowIndex - 1;
            }
        });
    }

    if(!actualRows.length){
        return null;
    }

    /*
     * GetLineCourseBoundaryMinutes z VBA:
     *
     * kierunek 10:
     *   start = pierwszy niepusty od 1 -> N
     *   koniec = pierwszy niepusty od N -> 1
     *
     * kierunek 20:
     *   start = pierwszy niepusty od N -> 1
     *   koniec = pierwszy niepusty od 1 -> N
     *
     * Nie opieramy się na kolejności actualRows.
     */
    let startRow = null;
    let endRow = null;

    if(kurs.kierunek === 0){
        for(let i = 0; i < lineData.stopCount; i++){
            if(times.has(i)){
                startRow = i;
                break;
            }
        }

        for(let i = lineData.stopCount - 1; i >= 0; i--){
            if(times.has(i)){
                endRow = i;
                break;
            }
        }
    }
    else{
        for(let i = lineData.stopCount - 1; i >= 0; i--){
            if(times.has(i)){
                startRow = i;
                break;
            }
        }

        for(let i = 0; i < lineData.stopCount; i++){
            if(times.has(i)){
                endRow = i;
                break;
            }
        }
    }

    if(startRow === null || endRow === null){
        return null;
    }

    const startText =
        times.get(startRow);

    const endText =
        times.get(endRow);

    const startMinutes =
        czasNaMinuty(startText);

    const endMinutesRaw =
        czasNaMinuty(endText);

    if(
        startMinutes === null ||
        endMinutesRaw === null
    ){
        return null;
    }

    let sortStart =
        startMinutes;

    if(sortStart < 180){
        sortStart += 1440;
    }

    let sortEnd =
        endMinutesRaw;

    while(sortEnd < sortStart){
        sortEnd += 1440;
    }

    /*
     * actualRows ma być w rzeczywistym kierunku jazdy,
     * bo jest używane tylko pomocniczo przy formatowaniu.
     */
    const travelRows =
        Array.from(times.keys())
            .sort((a, b) =>
                kurs.kierunek === 0
                    ? a - b
                    : b - a
            );

    return {
        rawCourse: kurs,
        lineData,
        lineName: String(kurs.linia || ""),
        direction: Number(kurs.kierunek),
        courseNumber: String(kurs.numer || ""),
        times,

        actualRows: travelRows,

        startRow,
        endRow,

        endpoints:
            new Set([
                startRow,
                endRow
            ]),

        startMinutes,
        endMinutes: endMinutesRaw,
        sortStart,
        sortEnd
    };
}


function vbaBuildCombinedLineData(
    lineName,
    rozkladIndex,
    taskCourses
){
    const courses =
        Array.isArray(taskCourses)
            ? taskCourses
            : [];

    if(!courses.length){
        return null;
    }

    /*
     * Wszystkie kursy tego kontekstu pochodzą z tego samego
     * obiektu rozkładu. Nie rekonstruujemy trasy na podstawie
     * kursów — korzystamy z pełnych kierunków JSON.
     */
    const rozklad =
        courses.find(k => k?.rozklad)?.rozklad ||
        null;

    if(!rozklad){
        return null;
    }

    const {
        route0,
        route1
    } = vbaPelneTrasyZRozkladu(rozklad);

    if(!route0.length && !route1.length){
        return null;
    }

    const stops =
        vbaMergeStops(
            route0,
            route1
        );

    if(!stops.length){
        return null;
    }

    return {
        id:
            "line|" +
            String(lineName) +
            "|schedule|" +
            String(rozkladIndex),

        lineName: String(lineName),
        rozkladIndex: Number(rozkladIndex),
        rozklad,
        stops,
        stopCount: stops.length
    };
}


/* =========================================================
   REKORDY KURSÓW – odpowiednik AddCombinedLineCourseRecords
   ========================================================= */

function vbaCompareRecords(a, b){
    if(a.sortStart !== b.sortStart){
        return a.sortStart - b.sortStart;
    }

    const aa = a.rawCourse;
    const bb = b.rawCourse;

    const cmp = porownajKursyPoNumerze(aa, bb);

    if(cmp !== 0){
        return cmp;
    }

    return String(a.lineName).localeCompare(
        String(b.lineName),
        "pl",
        {numeric: true}
    );
}


function vbaBuildRecords(allTaskCourses){
    /*
     * VBA ma osobny context dla konkretnej linii i konkretnego typu dnia.
     * W JSON odpowiednikiem jest konkretny obiekt "rozkład".
     */
    const byContext = new Map();

    (allTaskCourses || []).forEach(kurs => {
        const line =
            String(kurs?.linia || "");

        const rozkladIndex =
            Number(kurs?.rozkladIndex ?? -1);

        const key =
            line + "|" + rozkladIndex;

        if(!byContext.has(key)){
            byContext.set(key, {
                line,
                rozkladIndex,
                courses: []
            });
        }

        byContext.get(key).courses.push(kurs);
    });

    const lineDataMap = new Map();

    byContext.forEach((context, key) => {
        const ld =
            vbaBuildCombinedLineData(
                context.line,
                context.rozkladIndex,
                context.courses
            );

        if(ld){
            lineDataMap.set(key, ld);
        }
    });

    const records = [];

    byContext.forEach((context, key) => {
        const ld =
            lineDataMap.get(key);

        if(!ld){
            return;
        }

        context.courses.forEach(kurs => {
            const record =
                vbaMapujKursNaLineData(
                    kurs,
                    ld
                );

            if(record){
                records.push(record);
            }
        });
    });

    records.sort(vbaCompareRecords);

    return {
        records,
        lineDataMap
    };
}


/* =========================================================
   VBA: BuildCombinedRecordEntries
   ========================================================= */

function vbaBuildRecordEntries(record, coursePosition){
    const result = [];

    const even =
        (coursePosition % 2 === 0);

    /*
     * Dokładne tłumaczenie VBA:
     *
     * reverseOrder =
     * ((directionCode = 20) Xor (coursePosition Mod 2 = 0))
     *
     * JS:
     * direction 0 = VBA 10
     * direction 1 = VBA 20
     */
    const reverse =
        (record.direction === 1) !== even;

    const stopCount =
        record.lineData.stopCount;

    /*
     * To jest kluczowa poprawka v14:
     * iterujemy PEŁNĄ WSPÓLNĄ OŚ lineData.stops,
     * nie record.actualRows w kolejności jazdy.
     */
    if(reverse){
        for(
            let rowIndex = stopCount - 1;
            rowIndex >= 0;
            rowIndex--
        ){
            if(!record.times.has(rowIndex)){
                continue;
            }

            result.push({
                lineData: record.lineData,
                rowIndex,
                reverse
            });
        }
    }
    else{
        for(
            let rowIndex = 0;
            rowIndex < stopCount;
            rowIndex++
        ){
            if(!record.times.has(rowIndex)){
                continue;
            }

            result.push({
                lineData: record.lineData,
                rowIndex,
                reverse
            });
        }
    }

    return result;
}


function vbaPatternKey(entries){
    return entries.map(entry =>
        [
            entry.lineData.id,
            entry.rowIndex,
            entry.reverse ? "R" : "F"
        ].join(":")
    ).join("|");
}


function vbaBuildPatterns(records){
    const map = new Map();
    const result = [];

    records.forEach((record, index) => {
        const entries = vbaBuildRecordEntries(
            record,
            index + 1
        );

        if(!entries.length) return;

        const key = vbaPatternKey(entries);

        if(map.has(key)){
            map.get(key).courseCount++;
        }
        else{
            const pattern = {
                key,
                entries,
                courseCount: 1,
                firstCoursePosition: index + 1
            };

            map.set(key, pattern);
            result.push(pattern);
        }
    });

    return result;
}


/* =========================================================
   VBA: CombinedStopPairMatchScore
   ========================================================= */

function vbaCombinedStopPairMatchScore(firstEntry, secondEntry){
    const firstStop =
        firstEntry.lineData.stops[firstEntry.rowIndex];

    const secondStop =
        secondEntry.lineData.stops[secondEntry.rowIndex];

    if(
        !vbaTextEquals(
            firstStop?.nazwa,
            secondStop?.nazwa
        )
    ){
        return 0;
    }

    let score = 100;

    const firstCodes = [
        vbaNr(firstStop?.code0),
        vbaNr(firstStop?.code1)
    ];

    const secondCodes = [
        vbaNr(secondStop?.code0),
        vbaNr(secondStop?.code1)
    ];

    /*
     * Dokładnie jak pętla i=1..2 / j=1..2 w VBA:
     * każdy niepusty kod pierwszego wiersza może dodać +5000,
     * jeśli występuje po którejkolwiek stronie drugiego wiersza.
     */
    firstCodes.forEach(code => {
        if(
            code &&
            secondCodes.some(other =>
                other && vbaTextEquals(code, other)
            )
        ){
            score += 5000;
        }
    });

    const firstLast = firstEntry.lineData.stopCount - 1;
    const secondLast = secondEntry.lineData.stopCount - 1;

    if(
        (firstEntry.rowIndex === 0 ||
         firstEntry.rowIndex === firstLast) &&
        (secondEntry.rowIndex === 0 ||
         secondEntry.rowIndex === secondLast)
    ){
        score += 500;
    }

    return score;
}


function vbaCombinedRowMatchScore(row, incomingEntry){
    let best = 0;

    (row.entries || []).forEach(existing => {
        const score = vbaCombinedStopPairMatchScore(
            existing,
            incomingEntry
        );

        if(score > best){
            best = score;
        }
    });

    return best;
}


function vbaEntryIdentity(entry){
    return entry.lineData.id + "|" + entry.rowIndex;
}


function vbaAddEntryIfMissing(row, incoming){
    const key = vbaEntryIdentity(incoming);

    if(
        row.entries.some(e =>
            vbaEntryIdentity(e) === key
        )
    ){
        return;
    }

    row.entries.push({...incoming});
}


function vbaCloneRows(rows){
    return (rows || []).map(row => ({
        entries: (row.entries || []).map(e => ({...e}))
    }));
}


/* =========================================================
   VBA: MergeCombinedRowsWithEntries
   ========================================================= */

function vbaMergeRowsWithEntries(existingRows, incomingEntries){
    const existing = vbaCloneRows(existingRows);
    const incoming = (incomingEntries || []).map(e => ({...e}));

    const n = existing.length;
    const m = incoming.length;

    if(!n){
        return incoming.map(e => ({
            entries: [{...e}]
        }));
    }

    if(!m){
        return existing;
    }

    const dp = Array.from(
        {length: n + 1},
        () => Array(m + 1).fill(0)
    );

    for(let i = n - 1; i >= 0; i--){
        for(let j = m - 1; j >= 0; j--){
            const matchScore =
                vbaCombinedRowMatchScore(
                    existing[i],
                    incoming[j]
                );

            const matchTotal = matchScore > 0
                ? matchScore + dp[i + 1][j + 1]
                : -1;

            const skipExisting = dp[i + 1][j];
            const skipIncoming = dp[i][j + 1];

            dp[i][j] = Math.max(
                skipExisting,
                skipIncoming,
                matchTotal
            );
        }
    }

    const result = [];
    let i = 0;
    let j = 0;

    while(i < n && j < m){
        const row = existing[i];
        const incomingEntry = incoming[j];

        const matchScore =
            vbaCombinedRowMatchScore(
                row,
                incomingEntry
            );

        const matchTotal = matchScore > 0
            ? matchScore + dp[i + 1][j + 1]
            : -1;

        const skipExisting = dp[i + 1][j];
        const skipIncoming = dp[i][j + 1];

        /*
         * VBA: przy remisie wspólny przystanek zawsze trafia
         * do jednego wiersza.
         */
        if(
            matchScore > 0 &&
            matchTotal === dp[i][j]
        ){
            vbaAddEntryIfMissing(row, incomingEntry);
            result.push(row);

            i++;
            j++;
        }
        else if(skipExisting >= skipIncoming){
            result.push(row);
            i++;
        }
        else{
            result.push({
                entries: [{...incomingEntry}]
            });
            j++;
        }
    }

    while(i < n){
        result.push(existing[i]);
        i++;
    }

    while(j < m){
        result.push({
            entries: [{...incoming[j]}]
        });
        j++;
    }

    return result;
}


/* =========================================================
   VBA: ScoreCombinedRouteLayout
   ========================================================= */

function vbaFindEntryPosition(rows, searchedEntry){
    const key = vbaEntryIdentity(searchedEntry);

    for(let i = 0; i < rows.length; i++){
        if(
            rows[i].entries.some(e =>
                vbaEntryIdentity(e) === key
            )
        ){
            return i;
        }
    }

    return -1;
}


function vbaScoreRouteLayout(rows, patterns){
    let maximumGap = 0;
    let totalWeightedGap = 0;

    for(const pattern of patterns){
        let previous = -1;

        for(const entry of pattern.entries){
            const current =
                vbaFindEntryPosition(rows, entry);

            if(current < 0){
                return Number.MAX_SAFE_INTEGER;
            }

            if(previous >= 0){
                const gap = current - previous - 1;

                if(gap < 0){
                    return Number.MAX_SAFE_INTEGER;
                }

                maximumGap = Math.max(
                    maximumGap,
                    gap
                );

                totalWeightedGap +=
                    gap * pattern.courseCount;
            }

            previous = current;
        }
    }

    return (
        maximumGap * 1_000_000_000 +
        totalWeightedGap * 100_000 +
        rows.length
    );
}


function vbaBuildLayoutFromSeed(patterns, seedIndex){
    let result = vbaMergeRowsWithEntries(
        [],
        patterns[seedIndex].entries
    );

    const included = [patterns[seedIndex]];
    const used = new Set([seedIndex]);

    while(used.size < patterns.length){
        let bestScore = Infinity;
        let bestIndex = -1;
        let bestRows = null;
        let bestPattern = null;

        patterns.forEach((candidate, index) => {
            if(used.has(index)) return;

            const trialRows = vbaMergeRowsWithEntries(
                result,
                candidate.entries
            );

            const trialPatterns = [
                ...included,
                candidate
            ];

            const score = vbaScoreRouteLayout(
                trialRows,
                trialPatterns
            );

            if(score < bestScore){
                bestScore = score;
                bestIndex = index;
                bestRows = trialRows;
                bestPattern = candidate;
            }
            else if(
                score === bestScore &&
                bestPattern &&
                candidate.courseCount >
                bestPattern.courseCount
            ){
                bestIndex = index;
                bestRows = trialRows;
                bestPattern = candidate;
            }
        });

        if(bestIndex < 0){
            break;
        }

        result = bestRows;
        included.push(bestPattern);
        used.add(bestIndex);
    }

    return result;
}


function vbaBuildMostCompactLayout(patterns){
    if(!patterns.length){
        return [];
    }

    let bestRows = [];
    let bestScore = Infinity;

    for(let seed = 0; seed < patterns.length; seed++){
        const candidateRows =
            vbaBuildLayoutFromSeed(patterns, seed);

        const score =
            vbaScoreRouteLayout(
                candidateRows,
                patterns
            );

        if(score < bestScore){
            bestScore = score;
            bestRows = candidateRows;
        }
    }

    return bestRows;
}


/* =========================================================
   DISPLAY RECORDS – placeholdery dla 0xx / 700–799
   ========================================================= */

function vbaCzyDutyChangeBrigade(brygada){
    const text = String(brygada || "").trim();

    if(text.startsWith("0")){
        return true;
    }

    const n = Number(text);

    return Number.isFinite(n) &&
           n >= 700 &&
           n <= 799;
}


function vbaCreatePlaceholder(direction, referenceStart){
    return {
        placeholder: true,
        kierunek: direction,
        direction,
        start: referenceStart,
        koniec: referenceStart,
        _combinedSortStart: referenceStart,
        _combinedSortEnd: referenceStart,
        separatorPrzed: true
    };
}


function vbaBuildDisplayRecords(records, brygada){
    if(!vbaCzyDutyChangeBrigade(brygada)){
        return records.map(record => ({
            ...record.rawCourse,
            _vbaRecord: record,
            _combinedSortStart: record.sortStart,
            _combinedSortEnd: record.sortEnd,
            separatorPrzed: false
        }));
    }

    const result = [];
    let previousDirection = null;

    records.forEach(record => {
        if(
            previousDirection !== null &&
            previousDirection === record.direction
        ){
            result.push(
                vbaCreatePlaceholder(
                    record.direction === 0 ? 1 : 0,
                    record.sortStart
                )
            );
        }

        result.push({
            ...record.rawCourse,
            _vbaRecord: record,
            _combinedSortStart: record.sortStart,
            _combinedSortEnd: record.sortEnd,
            separatorPrzed: false
        });

        previousDirection = record.direction;
    });

    return result;
}


/* =========================================================
   ODCZYT WIERSZA / GODZINY
   ========================================================= */

function vbaFindRowEntryForRecord(element, record){
    if(!record) return null;

    return (element?.entries || []).find(entry =>
        entry.lineData === record.lineData
    ) || null;
}


function vbaTimeForCell(kurs, element){
    if(kurs?.placeholder === true){
        return "";
    }

    const record = kurs?._vbaRecord;
    if(!record) return "";

    const entry =
        vbaFindRowEntryForRecord(
            element,
            record
        );

    if(!entry) return "";

    return String(
        record.times.get(entry.rowIndex) || ""
    );
}


function vbaIsEndpointCell(kurs, element){
    if(kurs?.placeholder === true){
        return false;
    }

    const record = kurs?._vbaRecord;
    if(!record) return false;

    const entry =
        vbaFindRowEntryForRecord(
            element,
            record
        );

    if(!entry) return false;

    return record.endpoints.has(
        entry.rowIndex
    );
}


function vbaDisplayTime(kurs, element){
    if(kurs?.placeholder === true){
        return "";
    }

    const record = kurs?._vbaRecord;
    if(!record){
        return "";
    }

    const entry =
        vbaFindRowEntryForRecord(
            element,
            record
        );

    if(!entry){
        return "";
    }

    const currentText =
        String(
            record.times.get(entry.rowIndex) ||
            ""
        );

    if(!currentText){
        return "";
    }

    const current =
        rozbijCzas(currentText);

    if(!current){
        return currentText;
    }

    const isEndpoint =
        record.endpoints.has(
            entry.rowIndex
        );

    if(isEndpoint){
        return current.pelny;
    }

    /*
     * Dokładnie wg FormatCombinedCourseDeparture:
     *
     * readsTopToBottom =
     *   directionCode = IIf(reverseOrder, 20, 10)
     *
     * direction JS 0 = VBA 10
     * direction JS 1 = VBA 20
     */
    const readsTopToBottom =
        record.direction ===
        (entry.reverse ? 1 : 0);

    let previousText = "";

    /*
     * displayRow w VBA:
     * reverse=false -> sourceIndex
     * reverse=true  -> stopCount-sourceIndex+1
     *
     * Tutaj indeksy JS są 0-based.
     */
    const displayIndex =
        entry.reverse
            ? record.lineData.stopCount - 1 - entry.rowIndex
            : entry.rowIndex;

    if(readsTopToBottom){
        for(
            let candidateDisplay = displayIndex - 1;
            candidateDisplay >= 0;
            candidateDisplay--
        ){
            const candidateSource =
                entry.reverse
                    ? record.lineData.stopCount - 1 - candidateDisplay
                    : candidateDisplay;

            const txt =
                String(
                    record.times.get(candidateSource) ||
                    ""
                );

            if(txt.trim()){
                previousText = txt;
                break;
            }
        }
    }
    else{
        for(
            let candidateDisplay = displayIndex + 1;
            candidateDisplay < record.lineData.stopCount;
            candidateDisplay++
        ){
            const candidateSource =
                entry.reverse
                    ? record.lineData.stopCount - 1 - candidateDisplay
                    : candidateDisplay;

            const txt =
                String(
                    record.times.get(candidateSource) ||
                    ""
                );

            if(txt.trim()){
                previousText = txt;
                break;
            }
        }
    }

    if(previousText){
        const previous =
            rozbijCzas(previousText);

        if(
            previous &&
            previous.godzinaRzeczywista !==
            current.godzinaRzeczywista
        ){
            return current.pelny;
        }
    }

    return current.minuta;
}


/* =========================================================
   NUMERY WIERSZA – dokładnie jak VBA ProcessCombinedBrigade
   ========================================================= */

function vbaNumeryWiersza(element){
    let left = null;
    let right = null;

    for(const entry of (element?.entries || [])){
        const stop =
            entry.lineData.stops[entry.rowIndex];

        if(!stop) continue;

        let leftNr;
        let rightNr;
        let leftNz;
        let rightNz;

        if(entry.reverse){
            leftNr = vbaNr(stop.code1);
            rightNr = vbaNr(stop.code0);

            leftNz = Boolean(stop.nz1);
            rightNz = Boolean(stop.nz0);
        }
        else{
            leftNr = vbaNr(stop.code0);
            rightNr = vbaNr(stop.code1);

            leftNz = Boolean(stop.nz0);
            rightNz = Boolean(stop.nz1);
        }

        if(!left && leftNr){
            left = {
                nr: leftNr,
                nz: leftNz
            };
        }

        if(!right && rightNr){
            right = {
                nr: rightNr,
                nz: rightNz
            };
        }
    }

    return {
        lewy: left,
        prawy: right
    };
}


function vbaNazwaWiersza(element){
    const first = element?.entries?.[0];

    if(!first){
        return "";
    }

    const stop =
        first.lineData.stops[first.rowIndex];

    return String(stop?.nazwa || "");
}


/* =========================================================
   RENDEROWANIE GODZIN
   ========================================================= */

function vbaRenderCourseCells(displayRecords, element){
    let rowEndpoint = false;

    const html = displayRecords.map(kurs => {
        let result = "";

        if(maSeparatorPrzed(kurs)){
            result += '<td class="separator-komorka"></td>';
        }

        if(kurs?.placeholder === true){
            return result +
                '<td class="czas-kursu"></td>';
        }

        const time = vbaTimeForCell(kurs, element);
        const endpoint =
            Boolean(time) &&
            vbaIsEndpointCell(kurs, element);

        if(endpoint){
            rowEndpoint = true;
        }

        result +=
            `<td class="czas-kursu${endpoint ? " koniec-kursu" : ""}">` +
            `${escapeHtml(vbaDisplayTime(kurs, element))}` +
            '</td>';

        return result;
    }).join("");

    return {
        html,
        rowEndpoint
    };
}


/* =========================================================
   NAGŁÓWEK – 999 UKRYTA TYLKO TUTAJ
   ========================================================= */

function vbaCombinedLineLabel(records){
    const seen = new Set();
    const result = [];

    records.forEach(record => {
        const line = String(record?.lineName || "").trim();

        /*
         * Jedyny specjalny wyjątek pozostawiony zgodnie z prośbą:
         * 999 działa w trasie, kursach i godzinach, lecz nie ma jej
         * w nagłówku.
         */
        if(line === "999"){
            return;
        }

        if(line && !seen.has(line)){
            seen.add(line);
            result.push(line);
        }
    });

    return result.join("+");
}


/* =========================================================
   POSTOJE / PODSUMOWANIE
   ========================================================= */

function vbaCombinedBreaks(displayRecords){
    const result = [];

    for(let i = 0; i < displayRecords.length - 1; i++){
        const current = displayRecords[i];
        const next = displayRecords[i + 1];

        if(
            current?.placeholder === true ||
            next?.placeholder === true
        ){
            result.push(null);
            continue;
        }

        const currentRecord = current._vbaRecord;
        const nextRecord = next._vbaRecord;

        if(!currentRecord || !nextRecord){
            result.push(null);
            continue;
        }

        let diff =
            nextRecord.sortStart -
            currentRecord.sortEnd;

        while(diff < 0){
            diff += 1440;
        }

        result.push(diff);
    }

    return result;
}


function vbaCombinedSummary(displayRecords, breaks){
    let driving = 0;
    let breakMinutes = 0;

    displayRecords.forEach(kurs => {
        if(kurs?.placeholder === true){
            return;
        }

        const record = kurs?._vbaRecord;
        if(!record) return;

        driving += Math.max(
            0,
            record.sortEnd - record.sortStart
        );
    });

    (breaks || []).forEach(value => {
        if(
            value !== null &&
            value !== undefined &&
            Number.isFinite(Number(value))
        ){
            breakMinutes += Math.max(
                0,
                Number(value)
            );
        }
    });

    return {
        jazda: driving,
        przerwy: breakMinutes,
        razem: driving + breakMinutes,
        jazdaTekst: formatCzasTrwania(driving),
        przerwyTekst: formatCzasTrwania(breakMinutes),
        razemTekst: formatCzasTrwania(
            driving + breakMinutes
        )
    };
}


/* =========================================================
   PEŁNY MODEL BRYGADY ŁĄCZONEJ
   ========================================================= */

function vbaBuildCombinedModel(brygada, allCourses){
    const courses = (allCourses || [])
        .filter(k =>
            String(k?.brygada || "").trim() ===
            String(brygada || "").trim()
        );

    const built = vbaBuildRecords(courses);
    const records = built.records;

    if(records.length === 0){
        return null;
    }

    const patterns =
        vbaBuildPatterns(records);

    if(!patterns.length){
        return null;
    }

    const rows =
        vbaBuildMostCompactLayout(patterns);

    if(!rows.length){
        return null;
    }

    const displayRecords =
        vbaBuildDisplayRecords(
            records,
            brygada
        );

    return {
        records,
        rows,
        displayRecords
    };
}


/* =========================================================
   RENDER BRYGADY ŁĄCZONEJ
   ========================================================= */

function vbaRenderCombinedBrigade(brygada, allCourses){
    const model =
        vbaBuildCombinedModel(
            brygada,
            allCourses
        );

    if(!model){
        return "";
    }

    const {
        records,
        rows,
        displayRecords
    } = model;

    const postoje =
        vbaCombinedBreaks(
            displayRecords
        );

    const summary =
        vbaCombinedSummary(
            displayRecords,
            postoje
        );

    const lineLabel =
        vbaCombinedLineLabel(records);

    const szerokoscTabeli =
        24 + 130 + 24 +
        (displayRecords.length * 35) +
        (liczbaSeparatorow(displayRecords) * 6);

    let html =
        '<section class="brygada">' +
        '<div class="brygada-scroll">' +
        `<div class="tabela-brygady-inner" style="width:${szerokoscTabeli}px">` +
        renderCiagleSeparatory(displayRecords) +
        `<table class="tabela-brygady" style="width:${szerokoscTabeli}px!important;min-width:${szerokoscTabeli}px!important;max-width:${szerokoscTabeli}px!important">` +
        '<colgroup>' +
        '<col class="kol-nr">' +
        '<col class="kol-nazwa">' +
        '<col class="kol-nr">' +
        renderColgroupKursow(displayRecords) +
        '</colgroup>' +
        '<thead><tr>' +
        '<th class="naglowek-brygady" colspan="3">' +
        `${escapeHtml(lineLabel)} / ${escapeHtml(brygada)}` +
        '</th>' +
        renderNaglowkiKursow(displayRecords) +
        '</tr>' +
        renderPostojGora(displayRecords, postoje) +
        '</thead><tbody>';

    rows.forEach(element => {
        const cells =
            vbaRenderCourseCells(
                displayRecords,
                element
            );

        const numbers =
            vbaNumeryWiersza(element);

        const name =
            vbaNazwaWiersza(element);

        html +=
            '<tr class="wiersz-przystanku">' +

            `<td class="nr-lewy${cells.rowEndpoint ? " przystanek-koniec" : ""}">` +
            pokazNumerPrzystanku(numbers.lewy, true) +
            '</td>' +

            `<td class="nazwa-przystanku${cells.rowEndpoint ? " przystanek-koniec" : ""}">` +
            '<div class="przystanek-scroll">' +
            `<span>${escapeHtml(name.toUpperCase())}</span>` +
            '</div>' +
            '</td>' +

            `<td class="nr-prawy${cells.rowEndpoint ? " przystanek-koniec" : ""}">` +
            pokazNumerPrzystanku(numbers.prawy, false) +
            '</td>' +

            cells.html +
            '</tr>';
    });

    html +=
        renderPostojDol(displayRecords, postoje) +
        renderPustyWierszDol(displayRecords) +
        '</tbody></table></div></div>' +

        '<table class="podsumowanie">' +
        '<colgroup>' +
        '<col class="podsumowanie-opis">' +
        '<col class="podsumowanie-wartosc">' +
        '</colgroup><tbody>' +

        '<tr><th>Czas jazdy:</th>' +
        `<td>${escapeHtml(summary.jazdaTekst)}</td></tr>` +

        '<tr><th>Czas przerw:</th>' +
        `<td>${escapeHtml(summary.przerwyTekst)}</td></tr>` +

        '<tr class="razem"><th>Łączny czas:</th>' +
        `<td>${escapeHtml(summary.razemTekst)}</td></tr>` +

        '</tbody></table>' +
        '</section>';

    return html;
}


/* =========================================================
   DEDUPLIKACJA
   ========================================================= */

function vbaDeduplicateCombinedCourses(courses){
    const map = new Map();

    (courses || []).forEach(kurs => {
        const times = Array.from(kurs.czasy.entries())
            .sort((a, b) => a[0] - b[0])
            .map(([i, t]) => `${i}=${t}`)
            .join(";");

        const key = [
            kurs.linia,
            kurs.brygada,
            kurs.kierunek,
            kurs.numer,
            kurs.wariant,
            kurs.rozkladIndex,
            times
        ].join("|");

        if(!map.has(key)){
            map.set(key, kurs);
        }
    });

    return Array.from(map.values());
}


/* =========================================================
   WYŚWIETLANIE WSZYSTKICH BRYGAD
   ========================================================= */

function vbaPokazBrygadyZLaczeniami(
    daneWybranejLinii,
    data,
    dodatkoweZbiory
){
    const wynik =
        document.getElementById("wynik");

    const info =
        document.getElementById("brygadyInfo");

    /*
     * Zwykłe brygady nadal korzystają z dotychczasowego zbierzKursy()
     * i renderBrygada() – nic w ich logice nie zmieniamy.
     */
    const kursyGlowneNormal =
        zbierzKursy(
            daneWybranejLinii,
            data
        );

    const grupyGlowneNormal =
        vbaGrupujPoBrygadzie(
            kursyGlowneNormal
        );

    /*
     * Osobny zbiór dla algorytmu VBA.
     */
    const kursyGlowneVBA =
        vbaZbierzKursyLinii(
            daneWybranejLinii,
            data
        );

    const grupyGlowneVBA =
        vbaGrupujPoBrygadzie(
            kursyGlowneVBA
        );

    const brygady =
        Array.from(
            grupyGlowneNormal.keys()
        ).sort(porownajBrygady);

    if(!brygady.length){
        info.textContent =
            `Linia ${daneWybranejLinii.linia || aktualnaLinia} • ${dataISO(data)}`;

        wynik.innerHTML =
            '<div class="brak">Brak brygad dla wybranego dnia.</div>';

        return;
    }

    const extra = (dodatkoweZbiory || []).map(item => ({
        dane: item.dane,
        kursy: item.kursy ||
            vbaZbierzKursyLinii(item.dane, data),
        grupy: vbaGrupujPoBrygadzie(
            item.kursy ||
            vbaZbierzKursyLinii(item.dane, data)
        )
    }));

    info.textContent =
        `Linia ${daneWybranejLinii.linia || aktualnaLinia} • ` +
        `${dataISO(data)} • ` +
        `${brygady.length} ${brygady.length === 1 ? "brygada" : "brygad"}`;

    wynik.innerHTML =
        brygady.map(brygada => {
            const normalCourses =
                grupyGlowneNormal.get(brygada) || [];

            if(!czyNumerZadaniaLaczonego(brygada)){
                return renderBrygada(
                    String(
                        daneWybranejLinii.linia ||
                        aktualnaLinia
                    ),
                    brygada,
                    normalCourses
                );
            }

            const all = [
                ...(grupyGlowneVBA.get(brygada) || [])
            ];

            const lines = new Set(
                all.map(k => String(k.linia || ""))
            );

            extra.forEach(item => {
                const courses =
                    item.grupy.get(brygada);

                if(!courses?.length){
                    return;
                }

                all.push(...courses);

                courses.forEach(k =>
                    lines.add(
                        String(k.linia || "")
                    )
                );
            });

            /*
             * Numer >99 występujący tylko na jednej linii zachowuje
             * starą obsługę, tak samo jak VBA.
             */
            if(lines.size < 2){
                return renderBrygada(
                    String(
                        daneWybranejLinii.linia ||
                        aktualnaLinia
                    ),
                    brygada,
                    normalCourses
                );
            }

            return vbaRenderCombinedBrigade(
                brygada,
                vbaDeduplicateCombinedCourses(all)
            );
        }).join("");

    requestAnimationFrame(() => {
        ustawPozycjeCiaglychSeparatorow();
    });

    requestAnimationFrame(
        uruchomPrzesuwanieNazw
    );
}


/* =========================================================
   GŁÓWNE WCZYTANIE
   ========================================================= */

async function wczytajIBuduj(){
    const wynik =
        document.getElementById("wynik");

    const info =
        document.getElementById("brygadyInfo");

    wynik.innerHTML =
        '<div class="brak">Ładowanie brygad...</div>';

    info.textContent =
        `Ładowanie linii ${aktualnaLinia}...`;

    try{
        const dane =
            await pobierzLinie(
                aktualnaLinia,
                wybranaData
            );

        const kursyGlowne =
            vbaZbierzKursyLinii(
                dane,
                wybranaData
            );

        const potrzebneBrygady =
            new Set(
                kursyGlowne
                    .map(k =>
                        String(k.brygada || "").trim()
                    )
                    .filter(czyNumerZadaniaLaczonego)
            );

        if(!potrzebneBrygady.size){
            /*
             * Brak zadań łączonych – uruchamiamy dokładnie starą ścieżkę.
             */
            pokazBrygady(
                dane,
                wybranaData
            );

            return;
        }

        info.textContent =
            `Ładowanie linii ${aktualnaLinia} i zadań łączonych...`;

        const dodatkowe =
            await vbaPobierzDodatkoweLinie(
                aktualnaLinia,
                wybranaData,
                potrzebneBrygady
            );

        vbaPokazBrygadyZLaczeniami(
            dane,
            wybranaData,
            dodatkowe
        );
    }
    catch(error){
        console.error(error);

        pokazBlad(
            error?.message ||
            "Nie udało się wczytać brygad."
        );
    }
}
