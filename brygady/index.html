<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brygady linii - FWTP</title>
<link rel="stylesheet" href="../css/style.css">

<style>
.brygady-page{max-width:1320px;margin:24px auto;padding:0 12px}
.brygady-panel{background:#fff;border:1px solid #ddd;border-radius:8px;padding:18px;margin-bottom:16px}
.brygady-panel h1{margin:0 0 14px;font-size:26px}
.wybor-grid{display:grid;grid-template-columns:180px auto;gap:12px;align-items:end}
.pole{display:flex;flex-direction:column;gap:5px}
.pole label{font-size:13px;font-weight:700}
.pole input{width:100%;min-height:40px;padding:7px 10px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#222;font:inherit;font-size:15px}
.przycisk-laduj{min-height:40px;padding:8px 16px;border:0;border-radius:6px;background:#d61c12;color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.przycisk-laduj:hover{background:#b8170f}
.dni{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:18px}
.dzien-btn{padding:8px 4px;background:#fff;border:1px solid #ccc;border-radius:6px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.dzien-btn.aktywny{background:#d61c12;color:#fff;border-color:#d61c12}
.brygady-info{margin-top:10px;color:#666;font-size:13px}
.brygada{margin-bottom:28px}
.brygada-scroll{overflow-x:auto;width:100%;-webkit-overflow-scrolling:touch}
.tabela-brygady{border-collapse:collapse;width:auto!important;min-width:0!important;max-width:none!important;background:#fff;table-layout:fixed;border:3px solid #111}
.tabela-brygady th,.tabela-brygady td{height:15px;padding:0 1px;border:1px solid #ccc;color:#111;font-size:10px;line-height:1;text-align:center;vertical-align:middle;white-space:nowrap;overflow:hidden;box-sizing:border-box}
.naglowek-brygady{background:#ccc!important;font-size:12px!important;font-weight:800!important;border-bottom:2px solid #111!important}
.naglowek-kursu{width:35px!important;min-width:35px!important;max-width:35px!important;background:#eee;font-size:8px!important;font-weight:400;padding:0!important;overflow:hidden;text-overflow:clip}
.czas-kursu{width:35px!important;min-width:35px!important;max-width:35px!important;padding:0!important;font-size:10px!important;overflow:hidden}
.kurs-meta{display:block;margin-top:1px;color:#777;font-size:8px;font-weight:500}
.postoj-label,.postoj-dol-label{text-align:right!important;font-size:10px!important;font-weight:500!important}
.postoj-label,.postoj-gora{border-bottom:3px solid #111!important}
.postoj-dol-label,.postoj-dol{border-top:3px solid #111!important}
.postoj-gora,.postoj-dol{font-weight:700}
.nr-lewy{width:24px!important;min-width:24px!important;max-width:24px!important;padding:0!important;text-align:left!important;border-right:1px solid #ccc!important;overflow:hidden;box-sizing:border-box}
.nazwa-przystanku{width:130px!important;min-width:130px!important;max-width:130px!important;text-align:left!important;font-weight:500;padding:0!important;overflow:hidden;box-sizing:border-box}
.nr-prawy{width:24px!important;min-width:24px!important;max-width:24px!important;padding-left:0!important;padding-right:3px!important;text-align:right!important;border-right:3px solid #111!important;overflow:hidden;box-sizing:border-box}
.wiersz-przystanku td{border-top:1px dotted #666;border-bottom:1px dotted #666}
.wiersz-przystanku .czas-kursu{border-top:1px solid #ccc;border-bottom:1px solid #ccc}
.koniec-kursu,.przystanek-koniec{font-weight:800!important}
.nz{font-size:9px;font-weight:400!important}





.brak{padding:24px;background:#fff;border:1px solid #ddd;border-radius:8px;color:#666}
@media(max-width:700px){
 .brygady-page{margin:15px auto;padding:0 8px}
 .brygady-panel{padding:15px}
 .wybor-grid{grid-template-columns:1fr}
 .dni{display:flex;overflow-x:auto;gap:5px;padding-bottom:5px;scrollbar-width:none}
 .dni::-webkit-scrollbar{display:none}
 .dni .dzien-btn{flex:0 0 112px;min-width:112px}
 .tabela-brygady th,.tabela-brygady td{font-size:11px}
}

.przystanek-scroll{display:block;width:130px!important;max-width:130px!important;overflow:hidden;white-space:nowrap;padding:0 4px;box-sizing:border-box;text-align:left}
.przystanek-scroll span{
    display:inline-block;
    min-width:max-content;
    font-weight:inherit;
}
.przystanek-scroll.przesuwaj span{transform:none!important;animation:none!important}
85%,100%{transform:translateX(var(--przesuniecie,0px))}
}


.tabela-brygady col.kol-nr{width:24px!important;min-width:24px!important;max-width:24px!important}
.tabela-brygady col.kol-nazwa{width:130px!important;min-width:130px!important;max-width:130px!important}
.tabela-brygady col.kol-czas{width:35px!important;min-width:35px!important;max-width:35px!important}


.podsumowanie{
    width:225px;
    margin-top:10px;
    border-collapse:collapse;
    table-layout:fixed;
    background:#ffffff;
    border:2px solid #111111;
}
.podsumowanie col.podsumowanie-opis{
    width:135px;
}
.podsumowanie col.podsumowanie-wartosc{
    width:90px;
}
.podsumowanie th,
.podsumowanie td{
    height:15px!important;
    min-height:15px!important;
    padding:0 4px!important;
    border:1px solid #111111!important;
    box-sizing:border-box;
    font-size:12px;
    line-height:1;
    vertical-align:middle;
}
.podsumowanie th{
    text-align:right;
    font-weight:400;
    background:#ffffff;
}
.podsumowanie td{
    text-align:center;
    font-weight:400;
    background:#ffffff;
}
.podsumowanie tr.razem th,
.podsumowanie tr.razem td{
    background:#cccccc;
    font-weight:800;
}


.nr-przystanku-wrap{
    width:100%;
    height:100%;
    display:grid;
    align-items:center;
    justify-items:center;
    box-sizing:border-box;
}

.nr-przystanku-wrap.lewy{
    grid-template-columns:1fr 8px;
    padding-left:3px;
}

.nr-przystanku-wrap.prawy{
    grid-template-columns:8px 1fr;
    padding-right:3px;
}

.nr-przystanku-tekst{
    display:block;
    width:100%;
    text-align:center;
    line-height:1;
}

.nr-przystanku-z{
    display:block;
    width:100%;
    text-align:center;
    line-height:1;
    font-size:9px;
    font-weight:400!important;
}


.tabela-brygady .naglowek-brygady{
    border-right:3px solid #111111!important;
}

.tabela-brygady .postoj-label,
.tabela-brygady .postoj-dol-label{
    border-right:3px solid #111111!important;
}





.tabela-brygady .pusty-wiersz-dol td{
    height:15px!important;
    padding:0!important;
    background:#ffffff;
}
.tabela-brygady .pusty-wiersz-dol td:first-child{
    border-right:3px solid #111111!important;
}


.tabela-brygady col.kol-separator{
    width:4px!important;
    min-width:4px!important;
    max-width:4px!important;
}

.tabela-brygady .separator-komorka{
    width:4px!important;
    min-width:4px!important;
    max-width:4px!important;
    padding:0!important;

    background:#ffffff!important;

    border-left:1px solid #111111!important;
    border-right:1px solid #111111!important;

    border-top:inherit;
    border-bottom:inherit;

    box-sizing:border-box;
}


.podsumowanie th,
.podsumowanie td{
    text-align:center!important;
    justify-content:center!important;
}

/* =========================================================
   KALENDARZ – ZGODNY Z POZOSTAŁYMI STRONAMI FWTP
   ========================================================= */

.dni{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:4px;

    width:80%;
    margin:18px auto 8px;

    box-sizing:border-box;
}

.dni .dzien-btn{
    min-width:0;
    padding:10px 4px;

    background:#ffffff;
    color:#222222;

    border:1px solid #cccccc;
    border-radius:6px;

    font:inherit;
    font-size:15px;
    font-weight:700;
    line-height:1.15;

    text-align:center;
    white-space:nowrap;

    cursor:pointer;
    box-sizing:border-box;
}

.dni .dzien-btn:hover{
    color:#d61c12;
    border-color:#d61c12;
    background:#ffffff;
}

.dni .dzien-btn.aktywny,
.dni .dzien-btn.aktywny:hover{
    background:#d61c12;
    color:#ffffff;
    border-color:#d61c12;
}

.kalendarz{
    display:none;

    width:80%;
    margin:0 auto 8px;

    padding:12px 15px;

    background:#ffffff;

    border:1px solid #dddddd;
    border-radius:6px;

    box-sizing:border-box;
}

.kalendarz-tytul{
    margin-bottom:8px;

    color:#222222;

    font-size:15px;
    font-weight:700;
}

.kalendarz input{
    padding:10px;

    border:1px solid #cccccc;
    border-radius:5px;

    font:inherit;
    font-size:16px;
}

@media(max-width:550px){

    .dni,
    .kalendarz{
        width:100%;
        max-width:none;
        margin-left:0;
        margin-right:0;
        box-sizing:border-box;
    }

    .dni{
        display:flex!important;
        grid-template-columns:none;
        gap:5px;

        overflow-x:auto;
        overflow-y:hidden;

        padding:0 6px 6px;

        scroll-snap-type:x proximity;
        scroll-behavior:smooth;

        -webkit-overflow-scrolling:touch;
        overscroll-behavior-x:contain;

        scrollbar-width:none;
    }

    .dni::-webkit-scrollbar{
        display:none;
    }

    .dni .dzien-btn{
        flex:0 0 112px;
        min-width:112px;

        padding:10px 6px;

        font-size:14px;

        scroll-snap-align:start;
    }
}

/* Dodatkowy końcowy wiersz tylko dla brygad dodatków */
.podsumowanie tr.laczny-czas-brygady th,
.podsumowanie tr.laczny-czas-brygady td{
    background:#e6e6e6;
    font-weight:800;
}


/* =========================================================
   PODSUMOWANIE – OSTATECZNE WYRÓWNANIE I KOLORY
   ========================================================= */

/* Napisy po lewej: do prawej i pionowo na środku */
.podsumowanie th{
    text-align:right!important;
    vertical-align:middle!important;
}

/* Wartości czasu również do prawej */
.podsumowanie td{
    text-align:right!important;
    vertical-align:middle!important;
}

/* Wszystkie wiersze podsumowania +2 px: 15 -> 17 px */
.podsumowanie th,
.podsumowanie td{
    height:17px!important;
    min-height:17px!important;
    padding-top:0!important;
    padding-bottom:0!important;
    line-height:1!important;
}

/* Łączny czas – jaśniejszy */
.podsumowanie tr.razem th,
.podsumowanie tr.razem td{
    background:#e6e6e6!important;
}

/* Łączny czas brygady – wyraźnie ciemniejszy */
.podsumowanie tr.laczny-czas-brygady th,
.podsumowanie tr.laczny-czas-brygady td{
    background:#c8c8c8!important;
    font-weight:800!important;
}


/* Podsumowanie: napisy do prawej, wartości czasu na środku */
.podsumowanie th{
    text-align:right!important;
}

.podsumowanie td{
    text-align:center!important;
}


/* =========================================================
   PODWÓJNY SEPARATOR – CZARNE LINIE NAD SIATKĄ TABELI
   ========================================================= */

.tabela-brygady .separator-komorka{
    position:relative!important;

    width:4px!important;
    min-width:4px!important;
    max-width:4px!important;

    padding:0!important;
    background:#ffffff!important;

    /* usuwamy zwykłe obramowanie komórki,
       żeby szara linia nie prześwitywała */
    border-left:0!important;
    border-right:0!important;

    box-sizing:border-box;
}

/* lewa czarna linia – zawsze na wierzchu */
.tabela-brygady .separator-komorka::before{
    content:"";
    position:absolute;

    top:-1px;
    bottom:-1px;
    left:0;

    width:1px;

    background:#111111;

    z-index:20;
    pointer-events:none;
}

/* prawa czarna linia – zawsze na wierzchu */
.tabela-brygady .separator-komorka::after{
    content:"";
    position:absolute;

    top:-1px;
    bottom:-1px;
    right:0;

    width:1px;

    background:#111111;

    z-index:20;
    pointer-events:none;
}


/* =========================================================
   SEPARATOR – BEZ SZARYCH LINII PRZY CZARNYCH
   ========================================================= */

/* Sama komórka separatora */
.tabela-brygady .separator-komorka{
    position:relative!important;

    width:4px!important;
    min-width:4px!important;
    max-width:4px!important;

    padding:0!important;
    box-sizing:border-box!important;

    background:#ffffff!important;

    /* żadnych szarych pionowych krawędzi */
    border-left:0!important;
    border-right:0!important;
}

/* Dwie czarne linie separatora */
.tabela-brygady .separator-komorka::before,
.tabela-brygady .separator-komorka::after{
    content:"";
    position:absolute;

    top:-1px;
    bottom:-1px;

    width:1px;

    background:#111111!important;

    z-index:50;
    pointer-events:none;
}

.tabela-brygady .separator-komorka::before{
    left:0;
}

.tabela-brygady .separator-komorka::after{
    right:0;
}

/*
 * Najważniejsze:
 * komórka bezpośrednio PRZED separatorem nie może
 * zostawić swojej szarej prawej krawędzi.
 */
.tabela-brygady th:has(+ .separator-komorka),
.tabela-brygady td:has(+ .separator-komorka){
    border-right-color:transparent!important;
}

/*
 * Komórka bezpośrednio ZA separatorem nie może
 * zostawić swojej szarej lewej krawędzi.
 */
.tabela-brygady .separator-komorka + th,
.tabela-brygady .separator-komorka + td{
    border-left-color:transparent!important;
}


/* =========================================================
   SEPARATOR W NAGŁÓWKU KURSÓW – BEZ BIAŁEGO ŚLADU
   ========================================================= */

/* Separator w każdym wierszu nie wychodzi poza komórkę */
.tabela-brygady .separator-komorka::before,
.tabela-brygady .separator-komorka::after{
    top:0!important;
    bottom:0!important;
}

/*
 * W wierszach z grubą czarną linią poziomą nie pozwalamy,
 * aby białe wnętrze separatora przykrywało tę linię.
 */
.tabela-brygady tr:has(.naglowek-kursu) .separator-komorka{
    background:
        linear-gradient(
            to right,
            #111111 0,
            #111111 1px,
            transparent 1px,
            transparent 3px,
            #111111 3px,
            #111111 4px
        )!important;
}

/* Dwie pionowe czarne linie pozostają na wierzchu */
.tabela-brygady tr:has(.naglowek-kursu) .separator-komorka::before,
.tabela-brygady tr:has(.naglowek-kursu) .separator-komorka::after{
    background:#111111!important;
    z-index:60!important;
}


/* =========================================================
   OSTATECZNY WYGLĄD PODWÓJNEGO SEPARATORA
   ========================================================= */

.tabela-brygady col.kol-separator{
    width:6px!important;
    min-width:6px!important;
    max-width:6px!important;
}

.tabela-brygady .separator-komorka{
    position:relative!important;

    width:6px!important;
    min-width:6px!important;
    max-width:6px!important;

    padding:0!important;
    background:#ffffff!important;

    border-left:0!important;
    border-right:0!important;

    box-sizing:border-box!important;
}

/* obie czarne linie mają teraz po 2 px */
.tabela-brygady .separator-komorka::before,
.tabela-brygady .separator-komorka::after{
    content:"";
    position:absolute;

    top:0!important;
    bottom:0!important;

    width:2px!important;

    background:#111111!important;

    z-index:100!important;
    pointer-events:none;
}

.tabela-brygady .separator-komorka::before{
    left:0!important;
}

.tabela-brygady .separator-komorka::after{
    right:0!important;
}

/* żadnych szarych pionowych linii stykających się z separatorem */
.tabela-brygady th:has(+ .separator-komorka),
.tabela-brygady td:has(+ .separator-komorka){
    border-right-color:transparent!important;
}

.tabela-brygady .separator-komorka + th,
.tabela-brygady .separator-komorka + td{
    border-left-color:transparent!important;
}


/* =========================================================
   IDEALNY PODWÓJNY SEPARATOR
   ========================================================= */

.tabela-brygady col.kol-separator{
    width:6px!important;
    min-width:6px!important;
    max-width:6px!important;
}

.tabela-brygady .separator-komorka{
    width:6px!important;
    min-width:6px!important;
    max-width:6px!important;

    padding:0!important;

    /* żadnych ramek tej komórki */
    border:0!important;

    /* cały separator rysowany jako jedno tło */
    background:
        linear-gradient(
            to right,
            #111111 0px,
            #111111 2px,
            #ffffff 2px,
            #ffffff 4px,
            #111111 4px,
            #111111 6px
        )!important;

    background-repeat:no-repeat!important;
    background-size:6px 100%!important;
    background-position:center top!important;

    box-sizing:border-box!important;

    position:static!important;
    overflow:hidden!important;
}

/* wyłączamy stare pseudo-elementy całkowicie */
.tabela-brygady .separator-komorka::before,
.tabela-brygady .separator-komorka::after{
    content:none!important;
    display:none!important;
}

/*
 * Komórki stykające się z separatorem nie rysują
 * własnej szarej pionowej krawędzi.
 */
.tabela-brygady th:has(+ .separator-komorka),
.tabela-brygady td:has(+ .separator-komorka){
    border-right:0!important;
}

.tabela-brygady .separator-komorka + th,
.tabela-brygady .separator-komorka + td{
    border-left:0!important;
}

/*
 * W wierszach nagłówkowych separator ma dokładnie takie samo
 * 6 px i nic nie może go przykryć.
 */
.tabela-brygady thead .separator-komorka{
    background:
        linear-gradient(
            to right,
            #111111 0px,
            #111111 2px,
            #ffffff 2px,
            #ffffff 4px,
            #111111 4px,
            #111111 6px
        )!important;
}

/*
 * Wymuszamy, aby tła zwykłych komórek kończyły się
 * dokładnie przed separatorem.
 */
.tabela-brygady .separator-komorka{
    background-clip:border-box!important;
}


/* =========================================================
   CIĄGŁY PODWÓJNY SEPARATOR – BEZ PRZERW MIĘDZY WIERSZAMI
   ========================================================= */

.tabela-brygady-inner{
    position:relative;
    width:max-content;
}

.tabela-brygady .separator-komorka{
    width:6px!important;
    min-width:6px!important;
    max-width:6px!important;

    padding:0!important;

    background:transparent!important;

    border-left:0!important;
    border-right:0!important;

    box-sizing:border-box!important;
}

/* stare rysowanie w komórkach całkowicie wyłączone */
.tabela-brygady .separator-komorka::before,
.tabela-brygady .separator-komorka::after{
    content:none!important;
    display:none!important;
}

/* sąsiednie szare pionowe ramki nadal wyłączone */
.tabela-brygady th:has(+ .separator-komorka),
.tabela-brygady td:has(+ .separator-komorka){
    border-right:0!important;
}

.tabela-brygady .separator-komorka + th,
.tabela-brygady .separator-komorka + td{
    border-left:0!important;
}

/*
 * Jeden ciągły separator na całą wysokość tabeli.
 * Środek 2 px jest przezroczysty, więc poziome linie
 * tabeli nie dostają białych przerw.
 */
.separator-ciagly{
    position:absolute;
    top:0;
    bottom:0;

    width:6px;

    background:
        linear-gradient(
            to right,
            #111111 0,
            #111111 2px,
            #ffffff 2px,
            #ffffff 4px,
            #111111 4px,
            #111111 6px
        );

    background-repeat:no-repeat;
    background-size:6px 100%;

    pointer-events:none;
    z-index:1000;
}


.tabela-brygady .separator-komorka{
    background:transparent!important;
    border-left:0!important;
    border-right:0!important;
    padding:0!important;
}


/* =========================================================
   SEPARATOR – DOKŁADNIE W MIEJSCU KOLUMNY
   ========================================================= */

.tabela-brygady-inner{
    position:relative!important;
    isolation:isolate;
}

.separator-ciagly{
    position:absolute!important;
    top:0!important;
    bottom:0!important;
    width:6px!important;

    background:
        linear-gradient(
            to right,
            #111111 0,
            #111111 2px,
            #ffffff 2px,
            #ffffff 4px,
            #111111 4px,
            #111111 6px
        )!important;

    pointer-events:none!important;

    /* nie wychodzi nad menu */
    z-index:1!important;
}

.tabela-brygady{
    position:relative!important;
    z-index:0!important;
}

<script>
const BASE_DANE="/FWTP/dane/";

let manifestPaczek=null;

let wybranaData=dataZURL()||new Date();

let aktualnaLinia=String(
    new URLSearchParams(window.location.search).get("linia")||""
).trim();


document.addEventListener("DOMContentLoaded",()=>{

    const input=document.getElementById("liniaInput");
    input.value=aktualnaLinia;

    document.getElementById("ladujBtn").addEventListener("click",()=>{
        aktualnaLinia=String(input.value||"").trim();

        if(!aktualnaLinia){
            pokazBlad("Podaj numer linii.");
            return;
        }

        ustawURL();
        wczytajIBuduj();
    });

    input.addEventListener("keydown",event=>{
        if(event.key==="Enter"){
            document.getElementById("ladujBtn").click();
        }
    });

    generujKalendarz7Dni();

    const inputDaty=
        document.getElementById(
            "wybranaData"
        );

    if(inputDaty){

        inputDaty.value=
            dataISO(
                wybranaData
            );

        inputDaty.addEventListener(
            "change",
            function(){

                if(!this.value){
                    return;
                }

                const czesci=
                    this.value.split(
                        "-"
                    );

                const data=
                    new Date(
                        Number(czesci[0]),
                        Number(czesci[1])-1,
                        Number(czesci[2])
                    );

                wybierzDateZKalendarza(
                    data
                );
            }
        );
    }

    if(aktualnaLinia){
        wczytajIBuduj();
    }
});


function dataZURL(){

    const tekst=new URLSearchParams(window.location.search).get("data");

    if(!tekst)return null;

    const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(tekst);

    if(!m)return null;

    const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));

    return Number.isNaN(d.getTime())?null:d;
}


function dataISO(d){
    return [
        d.getFullYear(),
        String(d.getMonth()+1).padStart(2,"0"),
        String(d.getDate()).padStart(2,"0")
    ].join("-");
}


function dodajDni(d,ile){
    const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    x.setDate(x.getDate()+ile);
    return x;
}


function tenSamDzien(a,b){
    return a.getFullYear()===b.getFullYear() &&
           a.getMonth()===b.getMonth() &&
           a.getDate()===b.getDate();
}


function taSamaData(a,b){

    return(
        a instanceof Date &&
        b instanceof Date &&
        a.getFullYear()===b.getFullYear() &&
        a.getMonth()===b.getMonth() &&
        a.getDate()===b.getDate()
    );
}


function czyOstatniDzienKalendarza7(data){

    if(!(data instanceof Date)){
        return false;
    }

    const dzisiaj=new Date();
    dzisiaj.setHours(0,0,0,0);

    const ostatniDzien=
        new Date(dzisiaj);

    ostatniDzien.setDate(
        dzisiaj.getDate()+6
    );

    return taSamaData(
        data,
        ostatniDzien
    );
}


function ustawWidocznoscWyboruInnegoDnia(){

    const kalendarz=
        document.getElementById(
            "kalendarz"
        );

    if(!kalendarz){
        return;
    }

    kalendarz.style.display=
        czyOstatniDzienKalendarza7(
            wybranaData
        )
            ? "block"
            : "none";

    if(
        kalendarz.style.display===
        "block"
    ){

        const input=
            document.getElementById(
                "wybranaData"
            );

        if(input){
            input.value=
                dataISO(
                    wybranaData
                );
        }
    }
}


function generujKalendarz7Dni(){

    const kontener=
        document.getElementById(
            "dni"
        );

    if(!kontener){
        return;
    }

    kontener.innerHTML="";

    const dzisiaj=
        new Date();

    dzisiaj.setHours(
        0,0,0,0
    );

    const dniTygodnia=[
        "nd",
        "pon",
        "wt",
        "śr",
        "czw",
        "pt",
        "sob"
    ];

    for(let i=0;i<7;i++){

        const data=
            new Date(
                dzisiaj
            );

        data.setDate(
            dzisiaj.getDate()+i
        );

        const btn=
            document.createElement(
                "button"
            );

        btn.type="button";
        btn.className="dzien-btn";

        const dataTekst=
            data.getDate()+
            "."+
            String(
                data.getMonth()+1
            ).padStart(2,"0");

        if(i===0){

            btn.textContent=
                dataTekst+
                " (dzisiaj)";

        }else if(i===1){

            btn.textContent=
                dataTekst+
                " (jutro)";

        }else{

            btn.textContent=
                dataTekst+
                " ("+
                dniTygodnia[
                    data.getDay()
                ]+
                ")";
        }

        if(
            taSamaData(
                data,
                wybranaData
            )
        ){
            btn.classList.add(
                "aktywny"
            );
        }

        btn.addEventListener(
            "click",
            ()=>{
                wybierzDateZKalendarza(
                    data
                );
            }
        );

        kontener.appendChild(
            btn
        );
    }

    ustawWidocznoscWyboruInnegoDnia();
}


function wybierzDateZKalendarza(data){

    wybranaData=
        new Date(
            data.getFullYear(),
            data.getMonth(),
            data.getDate()
        );

    const input=
        document.getElementById(
            "wybranaData"
        );

    if(input){
        input.value=
            dataISO(
                wybranaData
            );
    }

    ustawURL();
    generujKalendarz7Dni();

    if(aktualnaLinia){
        wczytajIBuduj();
    }
}


function ustawURL(){

    const url=new URL(window.location.href);

    if(aktualnaLinia){
        url.searchParams.set("linia",aktualnaLinia);
    }else{
        url.searchParams.delete("linia");
    }

    url.searchParams.set("data",dataISO(wybranaData));

    history.replaceState({},"",url);
}


async function pobierzManifestPaczek(){

    if(manifestPaczek!==null)return manifestPaczek;

    try{
        const r=await fetch(
            BASE_DANE+"paczki.json?ts="+Date.now(),
            {cache:"no-store"}
        );

        if(!r.ok){
            manifestPaczek=[];
            return manifestPaczek;
        }

        const d=await r.json();

        manifestPaczek=
            Array.isArray(d)
                ? d
                : Array.isArray(d.paczki)
                    ? d.paczki
                    : [];

    }catch(e){
        manifestPaczek=[];
    }

    return manifestPaczek;
}


function paczkaObowiazuje(paczka,linia,data){

    if(!paczka)return false;

    const linie=Array.isArray(paczka.linie)
        ? paczka.linie.map(String)
        : [];

    if(!linie.includes(String(linia)))return false;

    const iso=dataISO(data);
    const od=String(paczka.od||"");
    const doDaty=String(paczka.do||"");

    if(od && iso<od)return false;
    if(doDaty && iso>doDaty)return false;

    return true;
}


async function pobierzLinie(linia,data){

    const paczki=await pobierzManifestPaczek();

    const pasujace=paczki
        .filter(p=>paczkaObowiazuje(p,linia,data))
        .sort((a,b)=>Number(b.priorytet||0)-Number(a.priorytet||0));

    const urls=[];

    pasujace.forEach(p=>{
        const folder=String(p.folder||"")
            .replace(/^\/+/,"")
            .replace(/\/+$/,"");

        if(folder){
            urls.push(
                BASE_DANE+folder+"/"+encodeURIComponent(linia)+".json"
            );
        }
    });

    urls.push(BASE_DANE+encodeURIComponent(linia)+".json");

    for(const url of urls){

        try{
            const r=await fetch(url+"?ts="+Date.now(),{cache:"no-store"});

            if(!r.ok)continue;

            return await r.json();
        }catch(e){}
    }

    throw new Error("Nie znaleziono pliku JSON linii "+linia+".");
}


function wielkanoc(rok){

    const a=rok%19;
    const b=Math.floor(rok/100);
    const c=rok%100;
    const d=Math.floor(b/4);
    const e=b%4;
    const f=Math.floor((b+8)/25);
    const g=Math.floor((b-f+1)/3);
    const h=(19*a+b-d-g+15)%30;
    const i=Math.floor(c/4);
    const k=c%4;
    const l=(32+2*e+2*i-h-k)%7;
    const m=Math.floor((a+11*h+22*l)/451);
    const miesiac=Math.floor((h+l-7*m+114)/31);
    const dzien=((h+l-7*m+114)%31)+1;

    return new Date(rok,miesiac-1,dzien);
}


function polskieSwieta(rok){

    const s=new Set([
        `${rok}-01-01`,
        `${rok}-01-06`,
        `${rok}-05-01`,
        `${rok}-05-03`,
        `${rok}-08-15`,
        `${rok}-11-01`,
        `${rok}-11-11`,
        `${rok}-12-25`,
        `${rok}-12-26`
    ]);

    const w=wielkanoc(rok);

    s.add(dataISO(w));
    s.add(dataISO(dodajDni(w,1)));
    s.add(dataISO(dodajDni(w,49)));
    s.add(dataISO(dodajDni(w,60)));

    return s;
}


function czySwieto(data){
    return polskieSwieta(data.getFullYear()).has(dataISO(data));
}


function czyKursPasujeDoDaty(kurs,data){

    if(!kurs)return false;

    const uwagi=String(kurs.uwagi||"").trim().toUpperCase();

    if(!uwagi)return false;

    /*
     * Kursy techniczne nadal należą do właściwego typu dnia.
     * DTECH = kurs techniczny wykonywany w dzień powszedni.
     * Pozostawiamy też analogiczną obsługę CTECH / 6TECH / 7TECH,
     * gdyby takie oznaczenia pojawiły się później w danych.
     */
    const kodDnia=
        uwagi==="DTECH" ? "D" :
        uwagi==="CTECH" ? "C" :
        uwagi==="6TECH" ? "6" :
        uwagi==="7TECH" ? "7" :
        uwagi;

    const dzien=data.getDay();
    const swieto=czySwieto(data);

    if(kodDnia==="D"){
        return dzien>=1 && dzien<=5 && !swieto;
    }

    if(kodDnia==="C"){
        return dzien===6 || dzien===0 || swieto;
    }

    if(kodDnia==="6"){
        return dzien===6 && !swieto;
    }

    if(kodDnia==="7"){
        return dzien===0 || swieto;
    }

    return false;
}


function czasNaMinuty(czas){

    const m=/^(\d{1,2}):(\d{2})$/.exec(String(czas||"").trim());

    if(!m)return null;

    const h=Number(m[1]);
    const min=Number(m[2]);

    if(h<0 || h>47 || min<0 || min>59)return null;

    return h*60+min;
}


function roznicaMinut(pozniej,wczesniej){

    if(pozniej===null || wczesniej===null)return null;

    let r=pozniej-wczesniej;

    while(r<0)r+=1440;

    return r;
}


function formatCzasTrwania(minuty){

    const v=Math.max(0,Number(minuty||0));
    return Math.floor(v/60)+":"+String(v%60).padStart(2,"0");
}


function normalizuj(tekst){
    return String(tekst||"")
        .trim()
        .toLocaleLowerCase("pl-PL")
        .replace(/\s+/g," ");
}


function czyNZ(p){

    if(!p)return false;

    const typ=String(p.typ||"").trim().toUpperCase();

    return typ==="NŻ" ||
           typ==="NZ" ||
           p.naZadanie===true ||
           p.nz===true;
}


function zbierzKursy(dane,data){

    const mapa=new Map();

    const rozklady=Array.isArray(dane.rozkłady)?dane.rozkłady:[];

    rozklady.forEach(rozklad=>{

        const kierunki=Array.isArray(rozklad.kierunki)?rozklad.kierunki:[];

        kierunki.forEach((kierunek,indeksKierunku)=>{

            const przystanki=Array.isArray(kierunek.przystanki)
                ? kierunek.przystanki
                : [];

            przystanki.forEach((przystanek,indeksPrzystanku)=>{

                const kursy=Array.isArray(przystanek.kursy)
                    ? przystanek.kursy
                    : [];

                kursy.forEach(kurs=>{

                    if(!czyKursPasujeDoDaty(kurs,data))return;

                    const brygada=String(kurs.brygada||"").trim();
                    const numer=String(kurs.numer||"").trim();
                    const czas=String(kurs.czas||"").trim();

                    if(!brygada || !numer || czasNaMinuty(czas)===null)return;

                    const wariant=String(kurs.wariant||"").trim();

                    const key=[
                        indeksKierunku,
                        numer,
                        wariant,
                        brygada
                    ].join("|");

                    if(!mapa.has(key)){
                        mapa.set(key,{
                            key,
                            linia:String(dane.linia||""),
                            brygada,
                            numer,
                            wariant,
                            kierunek:indeksKierunku,
                            czasy:new Map(),
                            przystanki,
                            start:null,
                            koniec:null,
                            startIndex:null,
                            koniecIndex:null
                        });
                    }

                    mapa.get(key).czasy.set(indeksPrzystanku,czas);
                });
            });
        });
    });

    const wynik=Array.from(mapa.values());

    wynik.forEach(rekord=>{

        const indeksy=Array.from(rekord.czasy.keys()).sort((a,b)=>a-b);

        if(!indeksy.length)return;

        rekord.startIndex=indeksy[0];
        rekord.koniecIndex=indeksy[indeksy.length-1];

        rekord.start=czasNaMinuty(rekord.czasy.get(rekord.startIndex));
        rekord.koniec=czasNaMinuty(rekord.czasy.get(rekord.koniecIndex));

        if(rekord.koniec!==null && rekord.start!==null && rekord.koniec<rekord.start){
            rekord.koniec+=1440;
        }
    });

    return wynik.filter(r=>r.start!==null && r.koniec!==null);
}


function wartoscNumeruKursu(numer){

    const tekst=String(numer||"");
    const fragment=tekst.includes(".")?tekst.split(".").pop():tekst;
    const liczba=Number(fragment.replace(/[^\d.-]/g,""));

    return Number.isFinite(liczba)?liczba:Number.MAX_SAFE_INTEGER;
}


function porownajKursyPoNumerze(a,b){

    const aa=wartoscNumeruKursu(a.numer);
    const bb=wartoscNumeruKursu(b.numer);

    if(aa!==bb)return aa-bb;

    return String(a.numer).localeCompare(
        String(b.numer),
        "pl",
        {numeric:true}
    );
}


function czyBrygadaZmianowa(brygada){

    const tekst=String(brygada||"").trim();

    if(tekst.startsWith("0"))return true;

    const liczba=Number(tekst);

    return Number.isFinite(liczba) && liczba>=700 && liczba<=799;
}


function czyPlaceholderKursu(kurs){
    return Boolean(
        kurs &&
        kurs.placeholder===true
    );
}


function utworzPlaceholderKursu(
    kierunek,
    start,
    separatorPrzed
){

    return{
        key:
            "placeholder|"+
            kierunek+
            "|"+
            start+
            "|"+
            Math.random(),

        linia:"",
        brygada:"",
        numer:"",
        wariant:"",
        kierunek,

        czasy:new Map(),
        przystanki:[],

        start,
        koniec:start,
        startIndex:null,
        koniecIndex:null,

        placeholder:true,
        separatorPrzed:
            Boolean(
                separatorPrzed
            )
    };
}


function ulozBrygadeZmianowa(kursy){

    const chronologiczne=
        [...kursy].sort(
            (a,b)=>
                a.start-b.start ||
                porownajKursyPoNumerze(a,b)
        );

    const wynik=[];

    let poprzedni=null;

    chronologiczne.forEach(kurs=>{

        /*
         * Dla brygad 0xx i 700-799 zachowujemy logikę
         * z Twojego VBA:
         *
         * - kursy są po kolei chronologicznie,
         * - jeżeli dwa kolejne rzeczywiste kursy są
         *   w tym samym kierunku, wstawiamy pusty slot
         *   kierunku przeciwnego,
         * - dzięki temu strony tabeli nie zamieniają się.
         *
         * Dodatkowo, zgodnie z Twoją prośbą:
         * przerwa > 90 minut oznacza zmianę/długi postój
         * i dostaje podwójną pionową linię.
         */

        if(poprzedni){

            const przerwa=
                roznicaMinut(
                    kurs.start,
                    poprzedni.koniec
                );

            const dlugaPrzerwa=
                przerwa!==null &&
                przerwa>90;

            if(
                kurs.kierunek===
                poprzedni.kierunek
            ){

                const brakujacyKierunek=
                    kurs.kierunek===0
                        ? 1
                        : 0;

                wynik.push(
                    utworzPlaceholderKursu(
                        brakujacyKierunek,
                        kurs.start,
                        dlugaPrzerwa
                    )
                );

                /*
                 * Sama kolumna następnego kursu nie dostaje
                 * już drugiej linii – linia stoi przed pustym
                 * slotem, tak jak w Excelu/VBA.
                 */
                kurs.separatorPrzed=false;

            }else{

                kurs.separatorPrzed=
                    dlugaPrzerwa;
            }
        }else{
            kurs.separatorPrzed=false;
        }

        wynik.push(kurs);

        poprzedni=kurs;
    });

    return wynik;
}


function ulozKursyBrygady(kursy){

    if(!kursy.length)return [];

    if(czyBrygadaZmianowa(kursy[0].brygada)){
        return ulozBrygadeZmianowa(
            kursy
        );
    }

    const grupy=new Map();

    kursy.forEach(k=>{
        if(!grupy.has(k.kierunek))grupy.set(k.kierunek,[]);
        grupy.get(k.kierunek).push(k);
    });

    grupy.forEach(lista=>lista.sort(porownajKursyPoNumerze));

    const dirs=Array.from(grupy.keys()).sort((a,b)=>a-b);

    if(dirs.length<=1){
        return [...kursy].sort(porownajKursyPoNumerze);
    }

    const a=grupy.get(dirs[0])||[];
    const b=grupy.get(dirs[1])||[];

    const startA=a[0]?.start??Number.MAX_SAFE_INTEGER;
    const startB=b[0]?.start??Number.MAX_SAFE_INTEGER;

    const pierwszy=startB<startA?b:a;
    const drugi=pierwszy===a?b:a;

    const wynik=[];
    const ile=Math.max(pierwszy.length,drugi.length);

    for(let i=0;i<ile;i++){
        if(pierwszy[i])wynik.push(pierwszy[i]);
        if(drugi[i])wynik.push(drugi[i]);
    }

    return wynik;
}


function lcsMerge(a,b){

    const n=a.length;
    const m=b.length;

    const dp=Array.from({length:n+1},()=>Array(m+1).fill(0));

    for(let i=n-1;i>=0;i--){
        for(let j=m-1;j>=0;j--){
            if(a[i].klucz===b[j].klucz){
                dp[i][j]=1+dp[i+1][j+1];
            }else{
                dp[i][j]=Math.max(dp[i+1][j],dp[i][j+1]);
            }
        }
    }

    const wynik=[];
    let i=0;
    let j=0;

    while(i<n || j<m){

        if(i<n && j<m && a[i].klucz===b[j].klucz){

            wynik.push({
                nazwa:a[i].nazwa,
                dir0:a[i].dir0,
                dir1:b[j].dir1
            });

            i++;
            j++;

        }else if(
            j>=m ||
            (i<n && dp[i+1][j]>=dp[i][j+1])
        ){

            wynik.push({
                nazwa:a[i].nazwa,
                dir0:a[i].dir0,
                dir1:null
            });

            i++;

        }else{

            wynik.push({
                nazwa:b[j].nazwa,
                dir0:null,
                dir1:b[j].dir1
            });

            j++;
        }
    }

    return wynik;
}



function polaczTrasyZKoncami(
    lista0,
    lista1
) {

    if(
        !lista0.length ||
        !lista1.length
    ){
        return lcsMerge(
            lista0,
            lista1
        );
    }

    const pierwszyWspolny=
        lista0[0].klucz===
        lista1[0].klucz;

    const ostatniWspolny=
        lista0[
            lista0.length-1
        ].klucz===
        lista1[
            lista1.length-1
        ].klucz;

    /*
     * Krańce parujemy osobno.
     *
     * To jest ważne dla tras, na których ta sama nazwa
     * pojawia się również gdzieś indziej. Zwykły LCS może
     * wtedy dopasować np. ostatnie RONDO DASZYŃSKIEGO
     * do niewłaściwego wystąpienia.
     *
     * Po tej zmianie:
     * - pierwszy wspólny kraniec ma numery z obu kierunków,
     * - ostatni wspólny kraniec ma numery z obu kierunków,
     * - jeżeli ta sama nazwa jest krańcem po obu stronach,
     *   nadal może wystąpić dwa razy: na początku i na końcu.
     */

    let start0=0;
    let start1=0;

    let end0=
        lista0.length;

    let end1=
        lista1.length;

    const wynik=[];

    if(pierwszyWspolny){

        wynik.push({
            nazwa:lista0[0].nazwa,
            dir0:lista0[0].dir0,
            dir1:lista1[0].dir1
        });

        start0=1;
        start1=1;
    }

    if(ostatniWspolny){
        end0--;
        end1--;
    }

    const srodek0=
        lista0.slice(
            start0,
            end0
        );

    const srodek1=
        lista1.slice(
            start1,
            end1
        );

    wynik.push(
        ...lcsMerge(
            srodek0,
            srodek1
        )
    );

    if(ostatniWspolny){

        wynik.push({
            nazwa:
                lista0[
                    lista0.length-1
                ].nazwa,
            dir0:
                lista0[
                    lista0.length-1
                ].dir0,
            dir1:
                lista1[
                    lista1.length-1
                ].dir1
        });
    }

    return wynik;
}

function zbudujOsPrzystankow(kursy,startDirection){

    const rzeczywiste=
        kursy.filter(
            k=>
                !czyPlaceholderKursu(k)
        );

    const p0=rzeczywiste.find(k=>k.kierunek===0);
    const p1=rzeczywiste.find(k=>k.kierunek===1);

    const lista0=(p0?.przystanki||[]).map((p,index)=>({
        klucz:normalizuj(p.nazwa),
        nazwa:String(p.nazwa||""),
        dir0:{
            index,
            nr:String(p.nr||""),
            nz:czyNZ(p)
        }
    }));

    const lista1=(p1?.przystanki||[]).map((p,index)=>({
        klucz:normalizuj(p.nazwa),
        nazwa:String(p.nazwa||""),
        dir1:{
            index,
            nr:String(p.nr||""),
            nz:czyNZ(p)
        }
    })).reverse();

    let os;

    if(lista0.length && lista1.length){
        os=polaczTrasyZKoncami(
            lista0,
            lista1
        );
    }else if(lista0.length){
        os=lista0.map(x=>({
            nazwa:x.nazwa,
            dir0:x.dir0,
            dir1:null
        }));
    }else{
        os=lista1.map(x=>({
            nazwa:x.nazwa,
            dir0:null,
            dir1:x.dir1
        }));
    }

    if(startDirection===1){
        os.reverse();
    }

    return os;
}


function escapeHtml(tekst){
    return String(tekst??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function pokazNumerPrzystanku(
    dane,
    lewy
) {

    if (!dane) {
        return "";
    }

    const nr =
        escapeHtml(
            dane.nr
        );

    const z =
        dane.nz
            ? '<span class="nr-przystanku-z">ż</span>'
            : '<span class="nr-przystanku-z"></span>';

    if (lewy) {

        return (
            '<span class="nr-przystanku-wrap lewy">' +
            '<span class="nr-przystanku-tekst">' +
            nr +
            '</span>' +
            z +
            '</span>'
        );
    }

    return (
        '<span class="nr-przystanku-wrap prawy">' +
        z +
        '<span class="nr-przystanku-tekst">' +
        nr +
        '</span>' +
        '</span>'
    );
}


function czasKursuNaOsi(kurs,element){

    if(czyPlaceholderKursu(kurs)){
        return "";
    }

    const dane=kurs.kierunek===0?element.dir0:element.dir1;

    if(!dane)return "";

    return String(kurs.czasy.get(dane.index)||"");
}


function daneKursuNaOsi(kurs,element){

    if(czyPlaceholderKursu(kurs)){
        return null;
    }

    return kurs.kierunek===0
        ? element.dir0
        : element.dir1;
}


/*
 * Znak "-" pokazujemy tylko wtedy, gdy dany punkt leży
 * wewnątrz zakresu kursu, ale kurs nie ma w nim czasu.
 *
 * Dzięki temu:
 * - wariant omijający przystanek dostaje "-"
 * - kurs skrócony NIE dostaje "-" za swoim krańcem
 * - kurs zaczynający później NIE dostaje "-" przed początkiem
 */
function czyWariantOmijaPrzystanek(kurs,element){

    const dane=daneKursuNaOsi(kurs,element);

    if(!dane)return false;

    if(kurs.czasy.has(dane.index)){
        return false;
    }

    return(
        dane.index>kurs.startIndex &&
        dane.index<kurs.koniecIndex
    );
}


function rozbijCzas(czas){

    const match=/^(\d{1,2}):(\d{2})$/.exec(
        String(czas||"").trim()
    );

    if(!match)return null;

    const godzinaRzeczywista=Number(match[1]);

    return{
        godzina:godzinaRzeczywista,
        godzinaRzeczywista,
        minuta:match[2],
        pelny:
            String(godzinaRzeczywista % 24).padStart(2,"0")+
            ":"+
            match[2]
    };
}


/*
 * W kolumnie kursu:
 * - pierwszy obsługiwany przystanek: pełna godzina
 * - ostatni obsługiwany przystanek: pełna godzina
 * - gdy zmienia się godzina: pełna godzina
 * - w pozostałych wierszach: tylko minuty
 */

function poprzedniCzasWKursie(
    kurs,
    indeksPrzystanku
) {

    let poprzedniIndeks=null;

    for(const indeks of kurs.czasy.keys()){

        if(indeks<indeksPrzystanku){

            if(
                poprzedniIndeks===null ||
                indeks>poprzedniIndeks
            ){
                poprzedniIndeks=indeks;
            }
        }
    }

    if(poprzedniIndeks===null){
        return "";
    }

    return String(
        kurs.czasy.get(
            poprzedniIndeks
        ) || ""
    );
}


function tekstCzasuWTabeli(
    kurs,
    element
) {

    const czas=
        czasKursuNaOsi(
            kurs,
            element
        );

    if(!czas){

        if(
            czyWariantOmijaPrzystanek(
                kurs,
                element
            )
        ){
            return "-";
        }

        return "";
    }

    const dane=
        daneKursuNaOsi(
            kurs,
            element
        );

    const aktualny=
        rozbijCzas(
            czas
        );

    if(
        !dane ||
        !aktualny
    ){
        return czas;
    }

    const pierwszy=
        dane.index===
        kurs.startIndex;

    const ostatni=
        dane.index===
        kurs.koniecIndex;

    const poprzedniCzas=
        poprzedniCzasWKursie(
            kurs,
            dane.index
        );

    const poprzedni=
        rozbijCzas(
            poprzedniCzas
        );

    const zmianaGodziny=
        poprzedni &&
        poprzedni.godzinaRzeczywista!==
            aktualny.godzinaRzeczywista;

    if(
        pierwszy ||
        ostatni ||
        zmianaGodziny
    ){
        return aktualny.pelny;
    }

    return aktualny.minuta;
}



function czyEndpointNaOsi(kurs,element){

    if(czyPlaceholderKursu(kurs)){
        return false;
    }

    const dane=kurs.kierunek===0?element.dir0:element.dir1;

    if(!dane)return false;

    return dane.index===kurs.startIndex || dane.index===kurs.koniecIndex;
}


function zbudujPostoje(
    kursy,
    brygada
){

    const wynik=[];

    const zmianowa=
        czyBrygadaZmianowa(
            brygada
        );

    for(
        let i=0;
        i<kursy.length-1;
        i++
    ){

        const obecny=
            kursy[i];

        const nastepny=
            kursy[i+1];

        if(
            czyPlaceholderKursu(obecny) ||
            czyPlaceholderKursu(nastepny)
        ){
            wynik.push(null);
            continue;
        }

        const przerwa=
            roznicaMinut(
                nastepny.start,
                obecny.koniec
            );

        if(
            zmianowa &&
            przerwa!==null &&
            przerwa>90
        ){
            wynik.push(null);
        }else{
            wynik.push(przerwa);
        }
    }

    return wynik;
}


function czyPrzedSeparatoremKoniecNaGorze(kursy, indeksSeparatora){

    const pierwszyRzeczywisty=
        kursy.find(
            kurs=>
                !czyPlaceholderKursu(kurs)
        );

    if(!pierwszyRzeczywisty){
        return false;
    }

    const startDirection=
        pierwszyRzeczywisty.kierunek;

    let poprzedniRzeczywisty=null;

    for(
        let i=indeksSeparatora-1;
        i>=0;
        i--
    ){

        if(
            !czyPlaceholderKursu(
                kursy[i]
            )
        ){

            poprzedniRzeczywisty=
                kursy[i];

            break;
        }
    }

    if(!poprzedniRzeczywisty){
        return false;
    }

    return(
        poprzedniRzeczywisty.kierunek
        !==
        startDirection
    );
}


function renderPostojGora(kursy,postoje){

    let html=
        '<tr>'+ 
        '<td class="postoj-label" colspan="3">'+
        'Postoje na krańcu [min]'+
        '</td>';

    let i=0;

    let trybPoSeparatorze=false;
    let pierwszaKomorkaSekcji=true;
    let koniecPrzedSeparatoremNaGorze=false;

    while(i<kursy.length){

        if(
            maSeparatorPrzed(
                kursy[i]
            )
        ){

            html+=
                '<td class="separator-komorka"></td>';

            trybPoSeparatorze=true;
            pierwszaKomorkaSekcji=true;

            koniecPrzedSeparatoremNaGorze=
                czyPrzedSeparatoremKoniecNaGorze(
                    kursy,
                    i
                );
        }

        if(
            !trybPoSeparatorze &&
            i===0
        ){

            html+=
                '<td class="postoj-gora"></td>';

            i++;
            continue;
        }

        if(
            trybPoSeparatorze &&
            pierwszaKomorkaSekcji
        ){

            if(
                koniecPrzedSeparatoremNaGorze
            ){

                html+=
                    '<td class="postoj-gora"></td>';

                pierwszaKomorkaSekcji=false;
                i++;
                continue;
            }

            pierwszaKomorkaSekcji=false;
        }

        if(
            i===kursy.length-1 ||
            maSeparatorPrzed(
                kursy[i+1]
            )
        ){

            html+=
                '<td class="postoj-gora"></td>';

            i++;
            continue;
        }

        const wartosc=
            postoje[i];

        html+=
            `<td class="postoj-gora" colspan="2">`+
            `${wartosc===null||wartosc===undefined?"":escapeHtml(wartosc)}`+
            `</td>`;

        i+=2;
    }

    return html+"</tr>";
}

function renderKomorkiKursow(
    kursy,
    element
){

    let rowEndpoint=false;

    const html=
        kursy
            .map(kurs=>{

                let wynik="";

                if(maSeparatorPrzed(kurs)){
                    wynik+=
                        '<td class="separator-komorka"></td>';
                }

                if(czyPlaceholderKursu(kurs)){
                    wynik+=
                        '<td class="czas-kursu"></td>';

                    return wynik;
                }

                const czasPelny=
                    czasKursuNaOsi(
                        kurs,
                        element
                    );

                const endpoint=
                    Boolean(czasPelny)&&
                    czyEndpointNaOsi(
                        kurs,
                        element
                    );

                if(endpoint){
                    rowEndpoint=true;
                }

                const tekstCzasu=
                    tekstCzasuWTabeli(
                        kurs,
                        element
                    );

                wynik+=
                    `<td class="czas-kursu${endpoint?" koniec-kursu":""}">`+
                    `${escapeHtml(tekstCzasu)}`+
                    `</td>`;

                return wynik;
            })
            .join("");

    return{
        html,
        rowEndpoint
    };
}

function ustawPozycjeCiaglychSeparatorow(){

    document
        .querySelectorAll(
            ".tabela-brygady-inner"
        )
        .forEach(wrapper=>{

            const tabela=
                wrapper.querySelector(
                    ".tabela-brygady"
                );

            const overlays=
                Array.from(
                    wrapper.children
                ).filter(
                    el=>
                        el.classList &&
                        el.classList.contains(
                            "separator-ciagly"
                        )
                );

            if(
                !tabela ||
                !overlays.length
            ){
                return;
            }

            const wrapperRect=
                wrapper.getBoundingClientRect();

            const pozycje=[];

            tabela
                .querySelectorAll(
                    ".separator-komorka"
                )
                .forEach(komorka=>{

                    const rect=
                        komorka.getBoundingClientRect();

                    /*
                     * Bez Math.round i bez żadnego offsetu:
                     * dokładnie ta sama pozycja, którą
                     * przeglądarka wyliczyła dla kolumny.
                     */
                    const left=
                        rect.left-
                        wrapperRect.left;

                    if(
                        !pozycje.some(
                            x=>
                                Math.abs(
                                    x-left
                                )<0.5
                        )
                    ){
                        pozycje.push(left);
                    }
                });

            pozycje.sort(
                (a,b)=>a-b
            );

            overlays.forEach(
                (overlay,index)=>{

                    if(
                        pozycje[index]===
                        undefined
                    ){
                        overlay.style.display=
                            "none";
                        return;
                    }

                    overlay.style.display=
                        "block";

                    overlay.style.left=
                        pozycje[index]+
                        "px";
                }
            );
        });
}


function liczbaSeparatorow(kursy){

    return kursy.filter(
        kurs=>
            maSeparatorPrzed(kurs)
    ).length;
}


function renderPustyWierszDol(kursy){

    let html=
        '<tr class="pusty-wiersz-dol">'+
        '<td colspan="3"></td>';

    let i=0;

    /*
     * Ten wiersz ma kopiować UKŁAD SCALANIA
     * z renderPostojDol(), tylko bez wartości.
     *
     * Na początku:
     * - od razu łączymy komórki parami.
     *
     * Po separatorze:
     * - jeśli pierwszy slot jest zwykłym kursem,
     *   pierwsza komórka jest pojedyncza,
     *   a kolejne są parami;
     * - jeśli pierwszy slot jest placeholderem,
     *   od razu łączymy parami.
     */
    let trybPoSeparatorze=false;
    let pierwszyPoSeparatorzePlaceholder=false;
    let pierwszaKomorkaSekcji=true;

    while(i<kursy.length){

        if(maSeparatorPrzed(kursy[i])){

            html+=
                '<td class="separator-komorka"></td>';

            trybPoSeparatorze=true;
            pierwszaKomorkaSekcji=true;

            pierwszyPoSeparatorzePlaceholder=
                czyPlaceholderKursu(
                    kursy[i]
                );
        }

        if(
            trybPoSeparatorze &&
            pierwszaKomorkaSekcji &&
            !pierwszyPoSeparatorzePlaceholder
        ){

            html+=
                '<td></td>';

            pierwszaKomorkaSekcji=false;
            i++;
            continue;
        }

        if(
            trybPoSeparatorze &&
            pierwszaKomorkaSekcji
        ){
            pierwszaKomorkaSekcji=false;
        }

        if(
            i===kursy.length-1 ||
            maSeparatorPrzed(
                kursy[i+1]
            )
        ){

            html+=
                '<td></td>';

            i++;
            continue;
        }

        html+=
            '<td colspan="2"></td>';

        i+=2;
    }

    html+='</tr>';

    return html;
}

function policzPodsumowanie(
    kursy,
    postoje
){

    const indeksSeparatora=
        kursy.findIndex(
            kurs=>
                maSeparatorPrzed(kurs)
        );

    const maPodzial=
        indeksSeparatora>0;

    function policzZakres(
        odIndeksu,
        doIndeksu
    ){

        let jazda=0;
        let przerwy=0;

        for(
            let i=odIndeksu;
            i<doIndeksu;
            i++
        ){

            const kurs=
                kursy[i];

            if(
                czyPlaceholderKursu(kurs)
            ){
                continue;
            }

            const czasJazdy=
                roznicaMinut(
                    kurs.koniec,
                    kurs.start
                );

            if(
                czasJazdy!==null &&
                czasJazdy>=0
            ){
                jazda+=czasJazdy;
            }
        }

        for(
            let i=odIndeksu;
            i<doIndeksu-1;
            i++
        ){

            if(
                maSeparatorPrzed(
                    kursy[i+1]
                )
            ){
                continue;
            }

            const p=
                postoje[i];

            if(
                p!==null &&
                p!==undefined &&
                p>=0
            ){
                przerwy+=p;
            }
        }

        return{
            jazda,
            przerwy,
            razem:
                jazda+
                przerwy
        };
    }


    if(maPodzial){

        const pierwsza=
            policzZakres(
                0,
                indeksSeparatora
            );

        const druga=
            policzZakres(
                indeksSeparatora,
                kursy.length
            );

        return{
            jazda:
                pierwsza.jazda+
                druga.jazda,

            przerwy:
                pierwsza.przerwy+
                druga.przerwy,

            razem:
                pierwsza.razem+
                druga.razem,

            jazdaTekst:
                formatCzasTrwania(
                    pierwsza.jazda
                )+
                " / "+
                formatCzasTrwania(
                    druga.jazda
                ),

            przerwyTekst:
                formatCzasTrwania(
                    pierwsza.przerwy
                )+
                " / "+
                formatCzasTrwania(
                    druga.przerwy
                ),

            razemTekst:
                formatCzasTrwania(
                    pierwsza.razem
                )+
                " / "+
                formatCzasTrwania(
                    druga.razem
                ),

            lacznyCzasBrygadyTekst:
                formatCzasTrwania(
                    pierwsza.razem+
                    druga.razem
                ),

            podzielone:true
        };
    }


    const calosc=
        policzZakres(
            0,
            kursy.length
        );

    return{
        jazda:calosc.jazda,
        przerwy:calosc.przerwy,
        razem:calosc.razem,

        jazdaTekst:
            formatCzasTrwania(
                calosc.jazda
            ),

        przerwyTekst:
            formatCzasTrwania(
                calosc.przerwy
            ),

        razemTekst:
            formatCzasTrwania(
                calosc.razem
            ),

        lacznyCzasBrygadyTekst:"",
        podzielone:false
    };
}

    html+=
        renderPostojDol(uporzadkowane,postoje)+

function uruchomPrzesuwanieNazw(){

    document
        .querySelectorAll(".przystanek-scroll")
        .forEach(element=>{

            const span=
                element.querySelector("span");

            if(!span){
                return;
            }

            if(element._marqueeFrame){
                cancelAnimationFrame(
                    element._marqueeFrame
                );
            }

            element.scrollLeft=0;
            element.classList.remove("przesuwaj");

            const maxScroll=
                Math.max(
                    0,
                    span.scrollWidth-
                    element.clientWidth+
                    8
                );

            if(maxScroll<=0){
                return;
            }

            element.classList.add("przesuwaj");

            let pozycja=0;
            let kierunek=1;

            let ostatniCzas=null;
            let pauzaDo=performance.now()+1400;

            const predkosc=8; // px na sekundę

            function animuj(czas){

                if(ostatniCzas===null){
                    ostatniCzas=czas;
                }

                const dt=
                    Math.min(
                        50,
                        czas-ostatniCzas
                    )/1000;

                ostatniCzas=czas;

                if(czas>=pauzaDo){

                    pozycja+=
                        kierunek*
                        predkosc*
                        dt;

                    if(pozycja>=maxScroll){

                        pozycja=maxScroll;
                        kierunek=-1;
                        pauzaDo=czas+1600;
                    }
                    else if(pozycja<=0){

                        pozycja=0;
                        kierunek=1;
                        pauzaDo=czas+1600;
                    }

                    element.scrollLeft=
                        Math.round(
                            pozycja
                        );
                }

                element._marqueeFrame=
                    requestAnimationFrame(
                        animuj
                    );
            }

            element._marqueeFrame=
                requestAnimationFrame(
                    animuj
                );
        });
}

function porownajBrygady(a,b){

    const na=Number(a);
    const nb=Number(b);

    const aa=Number.isFinite(na);
    const bb=Number.isFinite(nb);

    if(aa && bb)return na-nb;
    if(aa)return -1;
    if(bb)return 1;

    return String(a).localeCompare(String(b),"pl",{numeric:true});
}


function pokazBrygady(dane,data){

    const wynik=document.getElementById("wynik");
    const info=document.getElementById("brygadyInfo");

    const kursy=zbierzKursy(dane,data);

    const grupy=new Map();

    kursy.forEach(k=>{
        if(!grupy.has(k.brygada))grupy.set(k.brygada,[]);
        grupy.get(k.brygada).push(k);
    });

    const brygady=Array.from(grupy.keys()).sort(porownajBrygady);

    if(!brygady.length){

        info.textContent=`Linia ${dane.linia||aktualnaLinia} • ${dataISO(data)}`;

        wynik.innerHTML=
            '<div class="brak">Brak brygad dla wybranego dnia.</div>';

        return;
    }

    info.textContent=
        `Linia ${dane.linia||aktualnaLinia} • ${dataISO(data)} • `+
        `${brygady.length} ${brygady.length===1?"brygada":"brygad"}`;

    wynik.innerHTML=brygady.map(b=>
        renderBrygada(
            String(dane.linia||aktualnaLinia),
            b,
            grupy.get(b)
        )
    ).join("");

    requestAnimationFrame(
        ()=>{
            ustawPozycjeCiaglychSeparatorow();
        }
    );

    requestAnimationFrame(
        uruchomPrzesuwanieNazw
    );
}
