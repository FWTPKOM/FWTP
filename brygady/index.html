<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brygady linii - FWTP</title>
<link rel="stylesheet" href="../css/style.css">

<style>
.brygady-page{max-width:1320px;margin:24px auto;padding:0 12px}
.brygady-panel{background:#fff;border:1px solid #ddd;border-radius:8px;padding:18px;margin-bottom:16px}
.brygady-panel h1{margin:0 0 14px;font-size:26px}
.wybor-grid{display:grid;grid-template-columns:180px auto;gap:12px;align-items:end}
.pole{display:flex;flex-direction:column;gap:5px}
.pole label{font-size:13px;font-weight:700}
.pole input{width:100%;min-height:40px;padding:7px 10px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#222;font:inherit;font-size:15px;box-sizing:border-box}
.przycisk-laduj{min-height:40px;padding:8px 16px;border:0;border-radius:6px;background:#d61c12;color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.przycisk-laduj:hover{background:#b8170f}
.brygady-info{margin-top:10px;color:#666;font-size:13px}
.brygada{margin-bottom:28px}
.brygada-scroll{overflow-x:auto;width:100%;-webkit-overflow-scrolling:touch}
.tabela-brygady-inner{position:relative!important;isolation:isolate;width:max-content}
.tabela-brygady{border-collapse:collapse;width:auto!important;min-width:0!important;max-width:none!important;background:#fff;table-layout:fixed;border:3px solid #111;position:relative!important;z-index:0!important}
.tabela-brygady th,.tabela-brygady td{height:15px;padding:0 1px;border:1px solid #ccc;color:#111;font-family:Arial,sans-serif;font-size:10px;line-height:1;text-align:center;vertical-align:middle;white-space:nowrap;overflow:hidden;box-sizing:border-box}
.naglowek-brygady{background:#ccc!important;font-size:12px!important;font-weight:800!important;border-bottom:2px solid #111!important;border-right:3px solid #111!important}
.naglowek-kursu{width:35px!important;min-width:35px!important;max-width:35px!important;background:#eee;font-size:8px!important;font-weight:400;padding:0!important;overflow:hidden;text-overflow:clip}
.czas-kursu{width:35px!important;min-width:35px!important;max-width:35px!important;padding:0!important;font-size:10px!important;overflow:hidden}
.kurs-meta{display:block;margin-top:1px;color:#777;font-size:8px;font-weight:500}
.postoj-label,.postoj-dol-label{text-align:right!important;font-size:10px!important;font-weight:500!important;border-right:3px solid #111!important}
.postoj-label,.postoj-gora{border-bottom:3px solid #111!important}
.postoj-dol-label,.postoj-dol{border-top:3px solid #111!important}
.postoj-gora,.postoj-dol{font-weight:700}
.nr-lewy{width:24px!important;min-width:24px!important;max-width:24px!important;padding:0!important;text-align:left!important;border-right:1px solid #ccc!important;overflow:hidden;box-sizing:border-box}
.nazwa-przystanku{width:130px!important;min-width:130px!important;max-width:130px!important;text-align:left!important;font-weight:500;padding:0!important;overflow:hidden;box-sizing:border-box}
.nr-prawy{width:24px!important;min-width:24px!important;max-width:24px!important;padding-left:0!important;padding-right:0!important;text-align:right!important;border-right:3px solid #111!important;overflow:hidden;box-sizing:border-box}
.wiersz-przystanku td{border-top:1px dotted #666;border-bottom:1px dotted #666}
.wiersz-przystanku .czas-kursu{border-top:1px solid #ccc;border-bottom:1px solid #ccc}
.koniec-kursu,.przystanek-koniec{font-weight:800!important}
.brak{padding:24px;background:#fff;border:1px solid #ddd;border-radius:8px;color:#666}
.przystanek-scroll{display:block;width:130px!important;max-width:130px!important;overflow:hidden;white-space:nowrap;padding:0 4px;box-sizing:border-box;text-align:left}
.przystanek-scroll span{display:inline-block;min-width:max-content;font-weight:inherit}
.tabela-brygady col.kol-nr{width:24px!important;min-width:24px!important;max-width:24px!important}
.tabela-brygady col.kol-nazwa{width:130px!important;min-width:130px!important;max-width:130px!important}
.tabela-brygady col.kol-czas{width:35px!important;min-width:35px!important;max-width:35px!important}
.tabela-brygady col.kol-separator{width:6px!important;min-width:6px!important;max-width:6px!important}
.tabela-brygady .separator-komorka{width:6px!important;min-width:6px!important;max-width:6px!important;padding:0!important;border-left:0!important;border-right:0!important;background:transparent!important}
.tabela-brygady th:has(+ .separator-komorka),.tabela-brygady td:has(+ .separator-komorka){border-right:0!important}
.tabela-brygady .separator-komorka + th,.tabela-brygady .separator-komorka + td{border-left:0!important}
.separator-ciagly{position:absolute!important;top:0!important;bottom:0!important;width:6px!important;background:linear-gradient(to right,#111 0,#111 2px,#fff 2px,#fff 4px,#111 4px,#111 6px)!important;pointer-events:none!important;z-index:1!important}
.separator-ciagly::before,.separator-ciagly::after{content:"";position:absolute;left:0;width:6px;height:3px;background:#111;pointer-events:none}
.separator-ciagly::before{top:0}.separator-ciagly::after{bottom:0}
.nr-przystanku-wrap{width:100%;height:100%;display:grid;align-items:center;justify-items:center;box-sizing:border-box}
.nr-przystanku-wrap.lewy{grid-template-columns:1fr 8px;padding-left:3px}
.nr-przystanku-wrap.prawy{grid-template-columns:8px 1fr;padding-right:3px}
.nr-przystanku-tekst{display:block;width:100%;text-align:center;line-height:1}
.nr-przystanku-z{display:block;width:100%;text-align:center;line-height:1;font-size:9px;font-weight:400!important}
.podsumowanie{width:225px;margin-top:10px;border-collapse:collapse;table-layout:fixed;background:#fff;border:2px solid #111}
.podsumowanie col.podsumowanie-opis{width:135px}.podsumowanie col.podsumowanie-wartosc{width:90px}
.podsumowanie th,.podsumowanie td{height:17px!important;min-height:17px!important;padding:0 4px!important;border:1px solid #111!important;box-sizing:border-box;font-family:Arial,sans-serif;font-size:12px;line-height:1;vertical-align:middle}
.podsumowanie th{text-align:right!important;font-weight:400;background:#fff}.podsumowanie td{text-align:center!important;font-weight:400;background:#fff}
.podsumowanie tr.razem th,.podsumowanie tr.razem td{background:#e6e6e6!important;font-weight:800}
.podsumowanie tr.laczny-czas-brygady th,.podsumowanie tr.laczny-czas-brygady td{background:#c8c8c8!important;font-weight:800!important}

.dni{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;width:80%;margin:18px auto 8px;box-sizing:border-box}
.dni .dzien-btn{min-width:0;padding:10px 4px;background:#fff;color:#222;border:1px solid #ccc;border-radius:6px;font:inherit;font-size:15px;font-weight:700;line-height:1.15;text-align:center;white-space:nowrap;cursor:pointer;box-sizing:border-box}
.dni .dzien-btn:hover{color:#d61c12;border-color:#d61c12;background:#fff}
.dni .dzien-btn.aktywny,.dni .dzien-btn.aktywny:hover{background:#d61c12;color:#fff;border-color:#d61c12}
.kalendarz{display:none;width:80%;margin:0 auto 8px;padding:12px 15px;background:#fff;border:1px solid #ddd;border-radius:6px;box-sizing:border-box}
.kalendarz.pokaz{display:block}.kalendarz-tytul{margin-bottom:8px;color:#222;font-size:15px;font-weight:700}.kalendarz input{padding:10px;border:1px solid #ccc;border-radius:5px;font:inherit;font-size:16px}

@media(max-width:700px){.brygady-page{margin:15px auto;padding:0 8px}.brygady-panel{padding:15px}.wybor-grid{grid-template-columns:1fr}.tabela-brygady th,.tabela-brygady td{font-size:11px}}
@media(max-width:550px){.dni,.kalendarz{width:100%;max-width:none;margin-left:0;margin-right:0;box-sizing:border-box}.dni{display:flex!important;grid-template-columns:none;gap:5px;overflow-x:auto;overflow-y:hidden;padding:0 6px 6px;scroll-snap-type:x proximity;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none}.dni::-webkit-scrollbar{display:none}.dni .dzien-btn{flex:0 0 112px;min-width:112px;padding:10px 6px;font-size:14px;scroll-snap-align:start}}
</style>
</head>
<body>
<header class="topbar">
    <div class="logo">FWTP</div>
    <nav class="menu" id="menu"></nav>
</header>

<main class="brygady-page">
<section class="brygady-panel">
    <h1>Brygady linii</h1>
    <div class="wybor-grid">
        <div class="pole">
            <label for="liniaInput">Numer linii</label>
            <input type="text" id="liniaInput" placeholder="np. 126" autocomplete="off">
        </div>
        <button type="button" id="ladujBtn" class="przycisk-laduj">Pokaż brygady</button>
    </div>

    <div id="dni" class="dni"></div>
    <div id="kalendarz" class="kalendarz">
        <div class="kalendarz-tytul">Wybór innego dnia</div>
        <input type="date" id="wybranaData">
    </div>
    <div id="brygadyInfo" class="brygady-info">Wpisz numer linii.</div>
</section>
<div id="wynik"></div>
</main>

<script src="/FWTP/js/menu.js"></script>
<script>
"use strict";

/* =========================================================
   USTAWIENIA
   ========================================================= */

const ROOT_DANYCH = "/FWTP/dane";
const LICZBA_DNI = 7;

let wybranaData = startDnia(new Date());
let ostatniaLinia = "";
let ostatnieDane = null;
let cacheJSON = new Map();

const elLinia = document.getElementById("liniaInput");
const elLaduj = document.getElementById("ladujBtn");
const elDni = document.getElementById("dni");
const elKalendarz = document.getElementById("kalendarz");
const elData = document.getElementById("wybranaData");
const elInfo = document.getElementById("brygadyInfo");
const elWynik = document.getElementById("wynik");

/* =========================================================
   START
   ========================================================= */

inicjalizuj();

function inicjalizuj(){
    const p = new URLSearchParams(location.search);
    const liniaURL = String(p.get("linia") || "").trim();
    const dataURL = String(p.get("data") || "").trim();

    if (dataURL && /^\d{4}-\d{2}-\d{2}$/.test(dataURL)) {
        wybranaData = dataZISO(dataURL);
    }

    if (liniaURL) elLinia.value = liniaURL;

    elData.value = isoDaty(wybranaData);
    zbudujPrzyciskiDni();

    elLaduj.addEventListener("click", ()=>ladujBrygady());
    elLinia.addEventListener("keydown", e=>{
        if (e.key === "Enter") ladujBrygady();
    });
    elData.addEventListener("change", ()=>{
        if (!elData.value) return;
        wybranaData = dataZISO(elData.value);
        zbudujPrzyciskiDni();
        if (String(elLinia.value || "").trim()) ladujBrygady();
    });

    window.addEventListener("resize", ()=>requestAnimationFrame(ustawPozycjeCiaglychSeparatorow));

    if (liniaURL) ladujBrygady();
}

/* =========================================================
   KALENDARZ
   ========================================================= */

function zbudujPrzyciskiDni(){
    elDni.innerHTML = "";
    const baza = startDnia(new Date());

    for (let i=0; i<LICZBA_DNI; i++) {
        const d = new Date(baza);
        d.setDate(d.getDate()+i);

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "dzien-btn" + (tenSamDzien(d, wybranaData) ? " aktywny" : "");
        btn.textContent = opisPrzyciskuDnia(d, i);
        btn.addEventListener("click", ()=>{
            wybranaData = startDnia(d);
            elData.value = isoDaty(wybranaData);
            elKalendarz.classList.remove("pokaz");
            zbudujPrzyciskiDni();
            if (String(elLinia.value || "").trim()) ladujBrygady();
        });
        elDni.appendChild(btn);
    }

    const inne = document.createElement("button");
    inne.type = "button";
    inne.className = "dzien-btn";
    inne.textContent = "Inny dzień";
    inne.addEventListener("click", ()=>elKalendarz.classList.toggle("pokaz"));

    // Przy 7 przyciskach nie dokładamy ósmego do siatki; ostatni dzień
    // otrzymuje dwuklik do kalendarza na desktopie. Na telefonie przycisk
    // "Inny dzień" dokładamy jako ósmy element przewijanej listy.
    if (matchMedia("(max-width:550px)").matches) elDni.appendChild(inne);
    else {
        const ostatni = elDni.lastElementChild;
        if (ostatni) {
            ostatni.title = "Kliknij dwa razy, aby wybrać inną datę";
            ostatni.addEventListener("dblclick", ()=>elKalendarz.classList.toggle("pokaz"));
        }
    }
}

function opisPrzyciskuDnia(d, i){
    if (i === 0) return "Dzisiaj";
    if (i === 1) return "Jutro";
    const dni = ["Nd","Pn","Wt","Śr","Cz","Pt","Sb"];
    return `${dni[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}`;
}

function startDnia(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function tenSamDzien(a,b){ return isoDaty(a) === isoDaty(b); }
function isoDaty(d){
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function dataZISO(s){
    const [y,m,d] = s.split("-").map(Number);
    return new Date(y,m-1,d);
}

/* =========================================================
   POBIERANIE JSON – zgodne z paczki.json
   ========================================================= */

async function pobierzJSON(url){
    if (cacheJSON.has(url)) return cacheJSON.get(url);
    try {
        const r = await fetch(url, {cache:"no-store"});
        if (!r.ok) return null;
        const dane = await r.json();
        cacheJSON.set(url, dane);
        return dane;
    } catch(e) {
        console.warn("Nie udało się pobrać", url, e);
        return null;
    }
}

function paczkaPasujeDoDaty(paczka, data){
    const iso = isoDaty(data);
    const od = String(paczka?.od || paczka?.data_od || paczka?.start || "").slice(0,10);
    const doDaty = String(paczka?.do || paczka?.data_do || paczka?.koniec || "").slice(0,10);
    if (od && iso < od) return false;
    if (doDaty && iso > doDaty) return false;
    return true;
}

function paczkaZawieraLinie(paczka, linia){
    if (!Array.isArray(paczka?.linie)) return true;
    return paczka.linie.map(x=>String(x).trim()).includes(String(linia).trim());
}

function adresPlikuLiniiZPaczki(paczka, linia){
    const folder = String(paczka?.folder || "").trim().replace(/^\/+/, "").replace(/\/+$/, "");
    if (!folder) return "";
    return `${ROOT_DANYCH}/${folder}/${encodeURIComponent(linia)}.json`;
}

async function pobierzDaneLiniiDlaDaty(linia, data){
    const manifest = await pobierzJSON(`${ROOT_DANYCH}/paczki.json`);
    const paczki = manifest && Array.isArray(manifest.paczki) ? manifest.paczki : (Array.isArray(manifest) ? manifest : []);
    const pasujace = paczki
        .filter(p=>paczkaPasujeDoDaty(p,data) && paczkaZawieraLinie(p,linia))
        .sort((a,b)=>Number(b.priorytet||0)-Number(a.priorytet||0));

    for (const paczka of pasujace) {
        const adres = adresPlikuLiniiZPaczki(paczka,linia);
        if (!adres) continue;
        const dane = await pobierzJSON(adres);
        if (dane && Array.isArray(dane.rozkłady)) return {dane,paczka};
    }

    const dane = await pobierzJSON(`${ROOT_DANYCH}/${encodeURIComponent(linia)}.json`);
    return dane ? {dane,paczka:null} : null;
}

/* =========================================================
   WYBÓR ROZKŁADU DLA DATY
   ========================================================= */

function bezPolskich(s){
    return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
}

function znajdzRozkladDlaDaty(dane, data){
    const rozklady = Array.isArray(dane?.rozkłady) ? dane.rozkłady : [];
    if (!rozklady.length) return null;
    const dzien = data.getDay(); // 0 nd, 6 sb

    const ocen = r=>{
        const n = bezPolskich(r?.nazwa);
        let score = 0;
        if (dzien >= 1 && dzien <= 5) {
            if (n.includes("PONIEDZIAL") && n.includes("PIAT")) score += 100;
            if (n.includes("POWSZED")) score += 90;
            if (n.includes("ROBOCZ")) score += 80;
            if (n.includes("SOBOT")) score -= 100;
            if (n.includes("NIEDZIEL")) score -= 100;
        } else if (dzien === 6) {
            if (n.includes("SOBOT")) score += 100;
            if (n.includes("NIEDZIEL") && n.includes("SOBOT")) score += 20;
            if (n.includes("PONIEDZIAL") || n.includes("POWSZED")) score -= 100;
        } else {
            if (n.includes("NIEDZIEL") || n.includes("SWIAT")) score += 100;
            if (n.includes("SOBOT") && n.includes("NIEDZIEL")) score += 20;
            if (n.includes("PONIEDZIAL") || n.includes("POWSZED")) score -= 100;
        }
        return score;
    };

    return rozklady.map((r,i)=>({r,i,s:ocen(r)})).sort((a,b)=>b.s-a.s || a.i-b.i)[0]?.r || rozklady[0];
}

/* =========================================================
   GŁÓWNE ŁADOWANIE
   ========================================================= */

async function ladujBrygady(){
    const linia = String(elLinia.value || "").trim();
    if (!linia) {
        elInfo.textContent = "Wpisz numer linii.";
        elWynik.innerHTML = "";
        return;
    }

    ostatniaLinia = linia;
    elInfo.textContent = `Ładowanie linii ${linia}...`;
    elWynik.innerHTML = "";

    const wynik = await pobierzDaneLiniiDlaDaty(linia, wybranaData);
    if (!wynik?.dane) {
        elInfo.textContent = "Nie znaleziono danych linii.";
        elWynik.innerHTML = `<div class="brak">Brak pliku JSON dla linii ${esc(linia)}.</div>`;
        return;
    }

    ostatnieDane = wynik.dane;
    const rozklad = znajdzRozkladDlaDaty(wynik.dane, wybranaData);
    if (!rozklad) {
        elInfo.textContent = "Brak rozkładu dla wybranego dnia.";
        elWynik.innerHTML = `<div class="brak">Brak rozkładu dla ${esc(isoDaty(wybranaData))}.</div>`;
        return;
    }

    const model = zbudujModelBrygad(wynik.dane, rozklad);
    if (!model.brygady.length) {
        elInfo.textContent = "Nie znaleziono brygad w tym rozkładzie.";
        elWynik.innerHTML = `<div class="brak">W polu <b>kursy</b> nie znaleziono numerów brygad.</div>`;
        return;
    }

    elInfo.textContent = `${rozklad.nazwa || "Rozkład"} • ${isoDaty(wybranaData)} • brygad: ${model.brygady.length}`;
    elWynik.innerHTML = model.brygady.map(b=>renderujBrygade(model,b)).join("");

    requestAnimationFrame(()=>{
        ustawPozycjeCiaglychSeparatorow();
        dopasujNazwyPrzystankow();
    });

    ustawAdres(linia, wybranaData);
}

function ustawAdres(linia,data){
    const p = new URLSearchParams(location.search);
    p.set("linia",linia);
    p.set("data",isoDaty(data));
    history.replaceState(null,"",`${location.pathname}?${p.toString()}`);
}

/* =========================================================
   MODEL KURSÓW I BRYGAD
   ========================================================= */

function zbudujModelBrygad(dane, rozklad){
    const kierunki = Array.isArray(rozklad?.kierunki) ? rozklad.kierunki : [];
    const stops0 = Array.isArray(kierunki[0]?.przystanki) ? kierunki[0].przystanki : [];
    const stops1 = Array.isArray(kierunki[1]?.przystanki) ? kierunki[1].przystanki : [];

    const courses = [];
    courses.push(...zbierzKursyKierunku(stops0,0,String(dane?.linia||ostatniaLinia)));
    courses.push(...zbierzKursyKierunku(stops1,1,String(dane?.linia||ostatniaLinia)));

    const mapaBrygad = new Map();
    for (const c of courses) {
        const b = String(c.brygada || "").trim();
        if (!b) continue;
        if (!mapaBrygad.has(b)) mapaBrygad.set(b,[]);
        mapaBrygad.get(b).push(c);
    }

    const rows = scalWierszePrzystankow(stops0,stops1);
    const brygady = [...mapaBrygad.entries()].map(([numer,kursy])=>{
        const uporzadkowane = sortujKursyChronologicznie(kursy);
        const specjalna = czyBrygadaDodatku(numer);
        const zPlaceholderami = specjalna ? dodajPusteSlotyKierunku(uporzadkowane) : uporzadkowane;
        return {numer,kursy:zPlaceholderami,specjalna};
    });

    brygady.sort((a,b)=>porownajBrygady(a.numer,b.numer));
    return {dane,rozklad,stops0,stops1,rows,brygady};
}

function zbierzKursyKierunku(stops,direction,lineName){
    const mapa = new Map();

    stops.forEach((stop, stopIndex)=>{
        const kursy = Array.isArray(stop?.kursy) ? stop.kursy : [];
        for (const k of kursy) {
            const numer = String(k?.numer || "").trim();
            if (!numer) continue;
            if (!mapa.has(numer)) {
                mapa.set(numer,{
                    numer,
                    brygada:String(k?.brygada||"").trim(),
                    uwagi:String(k?.uwagi||"").trim(),
                    wariant:String(k?.wariant||"").trim(),
                    direction,
                    lineName,
                    entries:[]
                });
            }
            const c = mapa.get(numer);
            c.entries.push({stopIndex,czas:String(k?.czas||"").trim(),stop});
            if (!c.brygada && k?.brygada != null) c.brygada=String(k.brygada).trim();
        }
    });

    const wynik = [...mapa.values()];
    for (const c of wynik) normalizujCzasyKursu(c);
    return wynik;
}

function normalizujCzasyKursu(course){
    course.entries.sort((a,b)=>a.stopIndex-b.stopIndex);
    let poprzedni = null;
    let dodatek = 0;
    for (const e of course.entries) {
        const surowe = czasNaMinuty(e.czas);
        if (!Number.isFinite(surowe)) { e.minutes = NaN; continue; }
        let m = surowe + dodatek;
        if (poprzedni != null && m < poprzedni - 600) {
            dodatek += 1440;
            m += 1440;
        }
        e.minutes = m;
        poprzedni = m;
    }
    const poprawne = course.entries.filter(e=>Number.isFinite(e.minutes));
    course.startMinutes = poprawne.length ? poprawne[0].minutes : Infinity;
    course.endMinutes = poprawne.length ? poprawne[poprawne.length-1].minutes : Infinity;
    course.duration = (Number.isFinite(course.startMinutes) && Number.isFinite(course.endMinutes)) ? Math.max(0,course.endMinutes-course.startMinutes) : 0;
    course.firstStopIndex = poprawne.length ? poprawne[0].stopIndex : -1;
    course.lastStopIndex = poprawne.length ? poprawne[poprawne.length-1].stopIndex : -1;
    course.byStopIndex = new Map(course.entries.map(e=>[e.stopIndex,e]));
}

function sortujKursyChronologicznie(kursy){
    return [...kursy].sort((a,b)=>{
        const x = a.startMinutes - b.startMinutes;
        if (x) return x;
        return porownajNumeryKursow(a.numer,b.numer);
    });
}

function dodajPusteSlotyKierunku(kursy){
    if (kursy.length < 2) return kursy;
    const out=[];
    for (let i=0;i<kursy.length;i++) {
        if (i>0 && kursy[i-1].direction===kursy[i].direction) {
            out.push({placeholder:true,direction:1-kursy[i].direction,numer:"",entries:[],duration:0});
        }
        out.push(kursy[i]);
    }
    return out;
}

function czyBrygadaDodatku(numer){
    const s=String(numer||"").trim();
    if (s.startsWith("0")) return true;
    const n=Number(s);
    return Number.isFinite(n) && n>=700 && n<=799;
}

function porownajBrygady(a,b){
    const na=Number(a), nb=Number(b);
    const aa=Number.isFinite(na), bb=Number.isFinite(nb);
    if (aa && bb) return na-nb || String(a).localeCompare(String(b),"pl");
    if (aa) return -1;
    if (bb) return 1;
    return String(a).localeCompare(String(b),"pl",{numeric:true,sensitivity:"base"});
}

function porownajNumeryKursow(a,b){
    return String(a).localeCompare(String(b),"pl",{numeric:true,sensitivity:"base"});
}

/* =========================================================
   ŁĄCZENIE LIST PRZYSTANKÓW – odpowiednik MergeStops z VBA
   ========================================================= */

function scalWierszePrzystankow(stops0,stops1){
    const a = stops0.map((s,i)=>({s,i}));
    const b = stops1.map((s,i)=>({s,i})).reverse();
    const n=a.length,m=b.length;
    const dp=Array.from({length:n+1},()=>new Float64Array(m+1));

    for (let i=n-1;i>=0;i--) {
        for (let j=m-1;j>=0;j--) {
            const ms=ocenaDopasowaniaPrzystanku(a[i].s,b[j].s,i,n,j,m);
            const match=ms>0 ? ms+dp[i+1][j+1] : -1;
            dp[i][j]=Math.max(dp[i+1][j],dp[i][j+1],match);
        }
    }

    const rows=[];
    let i=0,j=0;
    while(i<n && j<m){
        const ms=ocenaDopasowaniaPrzystanku(a[i].s,b[j].s,i,n,j,m);
        const match=ms>0 ? ms+dp[i+1][j+1] : -1;
        if (match===dp[i][j] && match>=0) {
            rows.push({i0:a[i].i,i1:b[j].i,stop0:a[i].s,stop1:b[j].s,name:a[i].s?.nazwa||b[j].s?.nazwa||""});
            i++;j++;
        } else if (dp[i+1][j]>=dp[i][j+1]) {
            rows.push({i0:a[i].i,i1:null,stop0:a[i].s,stop1:null,name:a[i].s?.nazwa||""});
            i++;
        } else {
            rows.push({i0:null,i1:b[j].i,stop0:null,stop1:b[j].s,name:b[j].s?.nazwa||""});
            j++;
        }
    }
    while(i<n){ rows.push({i0:a[i].i,i1:null,stop0:a[i].s,stop1:null,name:a[i].s?.nazwa||""}); i++; }
    while(j<m){ rows.push({i0:null,i1:b[j].i,stop0:null,stop1:b[j].s,name:b[j].s?.nazwa||""}); j++; }
    return rows;
}

function ocenaDopasowaniaPrzystanku(a,b,i,n,j,m){
    if (!a || !b || normalizujTekst(a.nazwa)!==normalizujTekst(b.nazwa)) return 0;
    let score=100;
    const na=formatNr(a.nr), nb=formatNr(b.nr);
    if (na && nb && na===nb) score+=1000;
    if (i===0 && j===0) score+=5000;
    if (i===n-1 && j===m-1) score+=10000;
    return score;
}

function normalizujTekst(s){
    return String(s||"").replace(/\u00a0/g," ").trim().replace(/\s+/g," ").toLocaleLowerCase("pl");
}
function formatNr(v){
    const s=String(v??"").trim();
    if (!s) return "";
    if (/^\d+$/.test(s)) return String(Number(s)).padStart(2,"0");
    return s;
}
function czyNZ(stop){
    const t=bezPolskich(stop?.typ).replace(/\s/g,"");
    return t==="NZ" || t==="NŻ";
}

/* =========================================================
   RENDER TABELI
   ========================================================= */

function renderujBrygade(model,brygada){
    const kursy=brygada.kursy;
    const realne=kursy.filter(k=>!k.placeholder);
    if (!realne.length) return "";

    const startDirection=realne[0].direction;
    const breakInfo=obliczPostoje(kursy,startDirection);
    const suma=obliczPodsumowanie(kursy);
    const separatorPo=znajdzSeparatoryZmiany(kursy,brygada.numer);

    let colgroup=`<colgroup><col class="kol-nr"><col class="kol-nazwa"><col class="kol-nr">`;
    kursy.forEach((k,i)=>{
        colgroup+=`<col class="kol-czas">`;
        if (separatorPo.has(i)) colgroup+=`<col class="kol-separator">`;
    });
    colgroup+=`</colgroup>`;

    const liczbaKolumn = 3 + kursy.length + separatorPo.size;
    let html=`<section class="brygada" data-brygada="${escAttr(brygada.numer)}"><div class="brygada-scroll"><div class="tabela-brygady-inner">`;
    html+=`<table class="tabela-brygady">${colgroup}<thead>`;
    html+=`<tr><th colspan="3" class="naglowek-brygady">BRYGADA ${esc(brygada.numer)}</th>${kursy.map((k,i)=>renderNaglowekKursu(k,separatorPo.has(i))).join("")}</tr>`;
    html+=`<tr><th colspan="3" class="postoj-label">Postoje na krańcu [min]</th>${kursy.map((k,i)=>renderPostojCell(breakInfo.top,i,"postoj-gora",separatorPo.has(i))).join("")}</tr>`;
    html+=`</thead><tbody>`;

    model.rows.forEach(row=>{
        let endpointRow=false;
        const cells=kursy.map((k,i)=>{
            if (k.placeholder) return `<td class="czas-kursu"></td>${separatorPo.has(i)?'<td class="separator-komorka"></td>':''}`;
            const stopIndex = k.direction===0 ? row.i0 : row.i1;
            const entry = stopIndex==null ? null : k.byStopIndex.get(stopIndex);
            const endpoint = !!entry && (stopIndex===k.firstStopIndex || stopIndex===k.lastStopIndex);
            if (endpoint) endpointRow=true;
            return `<td class="czas-kursu${endpoint?' koniec-kursu':''}">${entry?esc(czasDoWyswietlenia(entry.minutes)):""}</td>${separatorPo.has(i)?'<td class="separator-komorka"></td>':''}`;
        }).join("");

        html+=`<tr class="wiersz-przystanku">`+
              `<td class="nr-lewy${endpointRow?' przystanek-koniec':''}">${renderNr(row.stop0,true)}</td>`+
              `<td class="nazwa-przystanku${endpointRow?' przystanek-koniec':''}"><span class="przystanek-scroll"><span>${esc(row.name)}</span></span></td>`+
              `<td class="nr-prawy${endpointRow?' przystanek-koniec':''}">${renderNr(row.stop1,false)}</td>`+
              cells+`</tr>`;
    });

    html+=`<tr><td colspan="3" class="postoj-dol-label">Postoje na krańcu [min]</td>${kursy.map((k,i)=>renderPostojCell(breakInfo.bottom,i,"postoj-dol",separatorPo.has(i))).join("")}</tr>`;
    html+=`<tr class="pusty-wiersz-dol"><td colspan="3"></td>${kursy.map((k,i)=>`<td></td>${separatorPo.has(i)?'<td class="separator-komorka"></td>':''}`).join("")}</tr>`;
    html+=`</tbody></table>`;

    // ciągłe separatory zostaną ustawione JS-em dokładnie nad ich kolumnami
    separatorPo.forEach(()=>{ html+=`<div class="separator-ciagly"></div>`; });
    html+=`</div></div>`;

    html+=renderPodsumowanie(suma,brygada.specjalna);
    html+=`</section>`;
    return html;
}

function renderNaglowekKursu(k,separator){
    const content = k.placeholder ? "" : `${esc(skrotNumeruKursu(k.numer))}${k.lineName && k.lineName!==ostatniaLinia?`<span class="kurs-meta">${esc(k.lineName)}</span>`:""}`;
    return `<th class="naglowek-kursu">${content}</th>${separator?'<th class="separator-komorka"></th>':''}`;
}

function skrotNumeruKursu(numer){
    const s=String(numer||"");
    const p=s.lastIndexOf(".");
    return p>=0 ? s.slice(p+1) : s;
}

function renderNr(stop,left){
    if (!stop) return "";
    const nr=formatNr(stop.nr);
    if (!nr) return "";
    const z=czyNZ(stop) ? `<span class="nr-przystanku-z">ż</span>` : `<span class="nr-przystanku-z"></span>`;
    return left
        ? `<span class="nr-przystanku-wrap lewy"><span class="nr-przystanku-tekst">${esc(nr)}</span>${z}</span>`
        : `<span class="nr-przystanku-wrap prawy">${z}<span class="nr-przystanku-tekst">${esc(nr)}</span></span>`;
}

/* =========================================================
   POSTOJE I PODSUMOWANIE
   ========================================================= */

function obliczPostoje(kursy,startDirection){
    const top=new Map(),bottom=new Map();
    for(let i=0;i<kursy.length-1;i++){
        const a=kursy[i],b=kursy[i+1];
        if (a.placeholder || b.placeholder) continue;
        if (!Number.isFinite(a.endMinutes)||!Number.isFinite(b.startMinutes)) continue;
        const przerwa=roznicaMinut(a.endMinutes,b.startMinutes);
        const side = getCourseEndSide(a.direction,startDirection);
        const target = side===1 ? top : bottom;
        target.set(i,przerwa);
    }
    return {top,bottom};
}

function getCourseStartSide(direction,startDirection){ return direction===startDirection?1:2; }
function getCourseEndSide(direction,startDirection){ return getCourseStartSide(direction,startDirection)===1?2:1; }

function renderPostojCell(map,index,klass,separator){
    // postój między kursem index i index+1 pokazujemy w komórce kursu index;
    // wizualne scalenie uzyskujemy obramowaniem i tekstem na środku.
    const v=map.has(index)?String(map.get(index)):"";
    return `<td class="${klass}">${esc(v)}</td>${separator?'<td class="separator-komorka"></td>':''}`;
}

function obliczPodsumowanie(kursy){
    let jazda=0,przerwy=0;
    const realne=kursy.filter(k=>!k.placeholder);
    for (const k of realne) jazda += Number.isFinite(k.duration)?k.duration:0;
    for (let i=0;i<realne.length-1;i++) {
        if (Number.isFinite(realne[i].endMinutes)&&Number.isFinite(realne[i+1].startMinutes))
            przerwy += Math.max(0,roznicaMinut(realne[i].endMinutes,realne[i+1].startMinutes));
    }
    return {jazda,przerwy,razem:jazda+przerwy};
}

function renderPodsumowanie(suma,specjalna){
    let h=`<table class="podsumowanie"><colgroup><col class="podsumowanie-opis"><col class="podsumowanie-wartosc"></colgroup><tbody>`;
    h+=`<tr><th>Czas jazdy:</th><td>${esc(formatCzasTrwania(suma.jazda))}</td></tr>`;
    h+=`<tr><th>Czas przerw:</th><td>${esc(formatCzasTrwania(suma.przerwy))}</td></tr>`;
    h+=`<tr class="razem"><th>Łączny czas:</th><td>${esc(formatCzasTrwania(suma.razem))}</td></tr>`;
    if (specjalna) h+=`<tr class="laczny-czas-brygady"><th>Łączny czas brygady:</th><td>${esc(formatCzasTrwania(suma.razem))}</td></tr>`;
    h+=`</tbody></table>`;
    return h;
}

function formatCzasTrwania(min){
    min=Math.max(0,Math.round(Number(min)||0));
    return `${Math.floor(min/60)}:${String(min%60).padStart(2,"0")}`;
}

function roznicaMinut(a,b){
    let x=b-a;
    while(x<0) x+=1440;
    return Math.round(x);
}

/* =========================================================
   ZMIANA B / SEPARATORY
   ========================================================= */

function znajdzSeparatoryZmiany(kursy,numerBrygady){
    const set=new Set();
    if (!czyBrygadaDodatku(numerBrygady)) return set;

    // Separator występuje przy przejściu pomiędzy dwoma rzeczywistymi
    // fragmentami pracy, szczególnie gdy wstawiony jest pusty slot kierunku.
    for(let i=0;i<kursy.length-1;i++){
        const a=kursy[i],b=kursy[i+1];
        if (a.placeholder || b.placeholder) {
            set.add(i);
            continue;
        }
        // Przy dodatkach duża przerwa jest naturalnym miejscem zmiany B.
        if (Number.isFinite(a.endMinutes)&&Number.isFinite(b.startMinutes)) {
            const gap=roznicaMinut(a.endMinutes,b.startMinutes);
            if (gap>=120) set.add(i);
        }
    }
    return set;
}

function ustawPozycjeCiaglychSeparatorow(){
    document.querySelectorAll(".tabela-brygady-inner").forEach(wrap=>{
        const tabela=wrap.querySelector(".tabela-brygady");
        const sepy=[...tabela.querySelectorAll("thead tr:first-child .separator-komorka")];
        const linie=[...wrap.querySelectorAll(":scope > .separator-ciagly")];
        linie.forEach((linia,i)=>{
            const cell=sepy[i];
            if(!cell) {linia.style.display="none";return;}
            const rCell=cell.getBoundingClientRect();
            const rWrap=wrap.getBoundingClientRect();
            linia.style.left=`${rCell.left-rWrap.left}px`;
            linia.style.display="block";
        });
    });
}

/* =========================================================
   CZASY
   ========================================================= */

function czasNaMinuty(s){
    const m=String(s||"").trim().match(/^(\d{1,2}):(\d{2})$/);
    if(!m) return NaN;
    return Number(m[1])*60+Number(m[2]);
}
function czasDoWyswietlenia(min){
    if(!Number.isFinite(min)) return "";
    const h=Math.floor(min/60);
    const m=((Math.round(min)%60)+60)%60;
    return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
}

/* =========================================================
   DOPASOWANIE DŁUGICH NAZW
   ========================================================= */

function dopasujNazwyPrzystankow(){
    document.querySelectorAll(".przystanek-scroll").forEach(box=>{
        const span=box.querySelector("span");
        if(!span) return;
        box.title = span.scrollWidth > box.clientWidth ? span.textContent : "";
    });
}

/* =========================================================
   HTML ESCAPE
   ========================================================= */

function esc(v){
    return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function escAttr(v){ return esc(v); }
