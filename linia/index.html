<!DOCTYPE html>

<html lang="pl">
<head>

<title>Rozkład jazdy</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600&display=swap" rel="stylesheet">

<style>

/* =========================================================
   GŁÓWNY KONTENER I NAGŁÓWKI
   ========================================================= */

.rozkład {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px;
}

.naglowek-linii {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 25px;
    margin-bottom: 15px;
}

.numer-linii {
    font-size: 42px;
    font-weight: bold;
    margin: 0 0 8px 0;
}

.trasa {
    font-size: 19px;
    font-weight: bold;
    margin: 0;
    white-space: pre-line;
}


/* =========================================================
   KIERUNKI I DNI
   ========================================================= */

.kierunki,
.dni {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.kierunek-btn,
.dzien-btn {
    flex: 1;
    padding: 14px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    transition: 0.15s;
}

.kierunek-btn:hover,
.dzien-btn:hover {
    border-color: #0066cc;
}

.kierunek-btn.aktywny,
.dzien-btn.aktywny {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
}


/* =========================================================
   WARIANTY W STYLU WTP
   ========================================================= */

.warianty-pojemnik {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border-top: 2px solid #ccc;
    border-bottom: 2px solid #ccc;

    width: 80%;
    margin-left: auto;
    margin-right: auto;

    padding: 10px 10px 10px 15px;

    /* BRAK ODSTĘPU DO LISTY PRZYSTANKÓW */
    margin-bottom: 0;

    box-sizing: border-box;
}

.warianty-info {
    font-size: 15px;
    color: #1d1d1b;
    padding-left: 10px;
}

.warianty-info strong {
    font-weight: 700;
}

.warianty-przyciski {
    display: flex;
    gap: 2px;
    padding-right: 10px;
}

.wariant-btn {
    padding: 4px 12px;
    font-size: 22px;
    font-weight: 900;
    color: #706f6f;
    background: transparent;
    border: none;
    border-bottom: 4px solid transparent;
    cursor: pointer;
    transition: 0.15s;
    font-family: inherit;
    text-transform: uppercase;
}

.wariant-btn:hover {

}

.wariant-btn.aktywny {
    color: #d61c12;
    border-bottom-color: #d61c12;
}


/* =========================================================
   KALENDARZ / ŁADOWANIE / BŁĘDY
   ========================================================= */

.kalendarz {
    display: none;
    background: white;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 15px;
    margin-bottom: 15px;
}

.kalendarz input {
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.typ-rozkładu {
    background: #f7f7f7;
    border: 1px solid #ddd;

    width: 80%;
    margin-left: auto;
    margin-right: auto;

    padding: 12px 15px;
    margin-bottom: 15px;
    border-radius: 6px;
    font-size: 14px;
    color: #555;

    box-sizing: border-box;
}

.brak-godzin {
    padding: 15px;
    color: #777;
    font-size: 14px;
}

.loading {
    background: white;
    border: 1px solid #ddd;

    text-align: center;

}

.blad {

    border-radius: 8px;
    padding: 20px;
    line-height: 1.6;
}

.blad strong {

    margin-bottom: 8px;
}

.brak-danych {
    padding: 30px;
    text-align: center;
    color: #777;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
}


/* =========================================================
   ROZKŁAD JAZDY - WIDOK PRZYSTANKU
   ========================================================= */

.przystanek {
    background: white;
    border: 1px solid #ddd;
    border-radius: 7px;

}

.godziny {
    width: 100%;
}

.wiersz-godziny {

    grid-template-columns: 43px repeat(10, 46px);
    grid-auto-columns: 46px;

    border-bottom: 1px solid #eee;
}

.kolumna-godzina {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Barlow Semi Condensed", sans-serif;

    font-weight: 600;
    background: #555;
    color: white;
    border-right: 1px solid #444;
    min-height: 38px;
}

.kolumna-minuta {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    min-height: 38px;
    font-family: "Barlow Semi Condensed", sans-serif;
    font-weight: 600;
    width: 46px;
    color: black;
    transform: translateX(10px);
    cursor: pointer;
}

.kolumna-minuta:hover {
    background: #e8eef5;
}

.minuta-z-wariantem {
    position: relative;
    display: inline-block;

}

.minuta {

    font-size: 16px;
    font-weight: 600;
    line-height: 1;

}

.wariant-minuty {

    font-weight: 600;

/* =========================================================

.legenda-wariantow {

}

.legenda-element {

    font-weight: 600;
}

.legenda-litera,
.legenda-separator,

    font-size: 15px;
}

.legenda-litera {
    font-size: 16px;
    min-width: 22px;
}


/* =========================================================
   WIZUALNA OŚ TRASY
   ========================================================= */

.lista-przystankow {
    display: flex;
    flex-direction: column;
    gap: 0;
    background: white;
    padding: 15px 0;
    border: 1px solid #ddd;
    border-radius: 8px;

    width: 80%;
    margin: 0 auto;

    box-sizing: border-box;
}

.przystanek-btn {
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0;
    background: transparent;
    border: none;
    cursor: pointer;
    text-align: left;
    transition: 0.15s;
    font-family: inherit;

    margin: 0;

}

.przystanek-btn:hover {

}

.przystanek-btn:hover .przystanek-nazwa {
    color: #d61c12;
}


/* =========================================================
   KONTENER WĘZŁA SVG

.node-wrapper {

    position: relative;
    flex-shrink: 0;
}

.node-wrapper svg {

}


/* =========================================================

.przystanek-nazwa {

    display: flex;
    align-items: center;
    font-size: 16px;
    font-weight: bold;
    color: #000;
    padding-left: 12px;

    z-index: 11;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.przystanek-btn.inactive .przystanek-nazwa {

    font-weight: normal;
}

.przystanek-btn.inactive:hover .przystanek-nazwa {
    color: #d61c12;
}

.przystanek-nr {
    margin-left: auto;
    display: flex;
    align-items: center;
    padding: 0 16px 0 10px;
    font-size: 14px;
    font-weight: bold;
    color: #666;
    font-family: "Barlow Semi Condensed", sans-serif;
    flex-shrink: 0;
    z-index: 11;
}

.przystanek-btn.inactive .przystanek-nr {

/* =========================================================

.naglowek-przystanku-widok {

.naglowek-przystanku-widok .nazwa {

/* =========================================================
   WIDOK CAŁEGO KURSU
   ========================================================= */

.kurs-widok {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 15px;
}

.kurs-naglowek {
    background: #555;
    color: white;
    padding: 15px;

}

.kurs-naglowek .kurs-tytul {

}

.kurs-naglowek .kurs-informacja {

.kurs-lista {

}

.kurs-przystanek {

}

.kurs-przystanek.aktywny {

.kurs-czas-rel {

.kurs-nazwa-box {

    display: flex;
    align-items: center;

}

.kurs-nr {
    margin-left: auto;

    align-items: center;
    padding-right: 15px;
    font-size: 13px;
    font-weight: bold;

}

.kurs-czas-abs {

    display: flex;
    align-items: center;

    flex-shrink: 0;

/* =========================================================
   RESPONSYWNOŚĆ
   ========================================================= */

@media (max-width: 550px) {

    .rozkład {

    }

    .lista-przystankow {
        width: 80%;
    }
}

</style>

<script>

<header class="topbar">

<nav>

<main class="rozkład">

</h1>

</p>

</section>

<div id="kierunki" class="kierunki"></div>

<div id="warianty-pojemnik"
     class="warianty-pojemnik"
     style="display:none;">

<div class="warianty-info">
    <strong>Uwaga!</strong>
    Ta linia ma różne warianty trasy
</div>

     class="warianty-przyciski">
</div>

</div>

<div class="dni" style="display:none;">

<button id="dzisiajBtn"
  class="dzien-btn aktywny"
  onclick="wybierzDzien('dzisiaj')">
DZISIAJ </button>

<button id="jutroBtn"
  class="dzien-btn"
  onclick="wybierzDzien('jutro')">
JUTRO </button>

  class="dzien-btn"
  onclick="wybierzDzien('kalendarz')">
KALENDARZ </button>

<input type="date"
 id="wybranaData">

</div>

     class="typ-rozkładu">
    Ładowanie rozkładu...

<script>

let daneLinii = null;
let numerLinii = null;

let aktualnyKierunek = 0;
let aktualnyWariant = null;
let aktualnyDzien = "dzisiaj";

let wybranaData = new Date();

let wybranyPrzystanek = null;
let wybranyPrzystanekIndex = null;
let wybranyPrzystanekId = null;

let widokKursuAktywny = false;


const parametry =
    new URLSearchParams(
        window.location.search
    );


numerLinii =
    parametry.get("linia");


if (!numerLinii) {

    pokazBlad(
        "Nie podano numeru linii.",
        "Wybierz linię z menu."
    );

} else {

    document.getElementById(
        "numerLinii"
    ).textContent =
        numerLinii;

    pobierzDane();
}


/* =========================================================
   USUWANIE POLE GODZINY
   ========================================================= */

function usunPoleGodziny(
    tekst
) {

    const pozycja =
        tekst.search(
            /"godziny"\s*:\s*\[/
        );


    if (pozycja === -1)
        return tekst;


    const poczatekTablicy =
        tekst.indexOf(
            "[",
            pozycja
        );


    if (poczatekTablicy === -1)
        return tekst;


    let poziom = 0;
    let wStringu = false;
    let ucieczka = false;
    let koniecTablicy = -1;


    for (
        let i = poczatekTablicy;
        i < tekst.length;
        i++
    ) {

        const znak =
            tekst[i];


        if (ucieczka) {

            ucieczka = false;

            continue;
        }


        if (
            znak === "\\" &&
            wStringu
        ) {

            ucieczka = true;

            continue;
        }


        if (znak === '"') {

            wStringu =
                !wStringu;

            continue;
        }


        if (wStringu)
            continue;


        if (znak === "[")
            poziom++;


        if (znak === "]") {

            poziom--;


            if (poziom === 0) {

                koniecTablicy =
                    i;

                break;
            }
        }
    }


    if (koniecTablicy === -1)
        return tekst;


    let poczatek =
        pozycja;


    let koniec =
        koniecTablicy + 1;


    while (
        koniec < tekst.length &&
        /\s/.test(
            tekst[koniec]
        )
    ) {

        koniec++;
    }


    if (
        tekst[koniec] === ","
    ) {

        koniec++;
    }


    return (
        tekst.substring(
            0,
            poczatek
        ) +
        tekst
            .substring(koniec)
            .replace(
                /,\s*,/g,
                ","
            )
            .replace(
                /,\s*}/g,
                "}"
            )
    );
}


/* =========================================================
   POBIERANIE JSON
   ========================================================= */

async function pobierzDane() {

    const adres =
        "../dane/" +
        encodeURIComponent(
            numerLinii
        ) +
        ".json";


    try {

        const odpowiedz =
            await fetch(
                adres,
                {
                    cache:
                        "no-cache"
                }
            );


        if (!odpowiedz.ok) {

            throw new Error(
                "Nie znaleziono pliku JSON dla linii " +
                numerLinii
            );
        }


        let tekst =
            await odpowiedz.text();


        try {

            daneLinii =
                JSON.parse(
                    tekst
                );

        } catch (e1) {

            daneLinii =
                JSON.parse(
                    usunPoleGodziny(
                        tekst
                    )
                );
        }


        uruchomStrone();


    } catch (blad) {

        pokazBlad(
            "Błąd ładowania.",
            blad.message
        );
    }
}


/* =========================================================
   ZAPIS DOKŁADNEGO PRZYSTANKU
   ========================================================= */

function ustawWybranyPrzystanek(
    p,
    index
) {

    if (!p) {

        wybranyPrzystanek =
            null;

        wybranyPrzystanekIndex =
            null;

        wybranyPrzystanekId =
            null;

        return;
    }


    wybranyPrzystanek =
        p;


    if (
        index !== undefined &&
        index !== null &&
        Number.isInteger(
            Number(index)
        )
    ) {

        wybranyPrzystanekIndex =
            Number(index);

    } else {

        wybranyPrzystanekIndex =
            null;
    }


    wybranyPrzystanekId = {

        kierunek:
            Number(
                aktualnyKierunek
            ),

        index:
            wybranyPrzystanekIndex,

        lp:
            p.lp !== undefined &&
            p.lp !== null
                ? String(
                    p.lp
                ).trim()
                : "",

        nr:
            p.nr !== undefined &&
            p.nr !== null
                ? String(
                    p.nr
                ).trim()
                : "",

        nazwa:
            String(
                p.nazwa || ""
            ).trim()
    };
}


/* =========================================================
   ZNAJDOWANIE PRZYSTANKU
   ========================================================= */

function znajdzPrzystanek(
    przystanki,
    identyfikator
) {

    if (
        !Array.isArray(
            przystanki
        ) ||
        przystanki.length === 0 ||
        identyfikator === null ||
        identyfikator === undefined
    ) {

        return null;
    }


    const szukany =
        String(
            identyfikator
        ).trim();


    if (
        szukany
            .toLowerCase()
            .startsWith("idx:")
    ) {

        const idx =
            Number(
                szukany
                    .substring(4)
                    .trim()
            );


        if (
            Number.isInteger(
                idx
            ) &&
            idx >= 0 &&
            idx < przystanki.length
        ) {

            return przystanki[
                idx
            ];
        }


        return null;
    }


    if (
        wybranyPrzystanekId &&
        Number(
            wybranyPrzystanekId.kierunek
        ) ===
            Number(
                aktualnyKierunek
            ) &&
        wybranyPrzystanekIndex !== null
    ) {

        const idx =
            Number(
                wybranyPrzystanekIndex
            );


        if (
            Number.isInteger(
                idx
            ) &&
            idx >= 0 &&
            idx < przystanki.length
        ) {

            return przystanki[
                idx
            ];
        }
    }


    if (
        szukany
            .toLowerCase()
            .startsWith("lp:")
    ) {

        const lp =
            szukany
                .substring(3)
                .trim();


        const znaleziony =
            przystanki.find(
                p =>
                    String(
                        p.lp !== undefined &&
                        p.lp !== null
                            ? p.lp
                            : ""
                    ).trim() === lp
            );


        if (znaleziony)
            return znaleziony;
    }


    if (
        wybranyPrzystanekId &&
        wybranyPrzystanekId.nr &&
        wybranyPrzystanekId.nazwa
    ) {

        const nr =
            wybranyPrzystanekId.nr;


        const nazwa =
            wybranyPrzystanekId.nazwa;


        const znaleziony =
            przystanki.find(
                p =>
                    String(
                        p.nr || ""
                    ).trim() === nr
                    &&
                    normalizujTekst(
                        p.nazwa
                    ) ===
                    normalizujTekst(
                        nazwa
                    )
            );


        if (znaleziony)
            return znaleziony;
    }


    const poNr =
        przystanki.find(
            p =>
                String(
                    p.nr || ""
                ).trim() ===
                szukany
        );


    if (poNr)
        return poNr;


    const poNazwie =
        przystanki.find(
            p =>
                String(
                    p.nazwa || ""
                ).trim() ===
                szukany
        );


    if (poNazwie)
        return poNazwie;


    const normalny =
        normalizujTekst(
            szukany
        );


    return przystanki.find(
        p =>
            normalizujTekst(
                p.nazwa
            ) === normalny
    ) || null;
}


/* =========================================================
   START STRONY
   ========================================================= */

function uruchomStrone() {

    document.getElementById(
        "numerLinii"
    ).textContent =
        daneLinii.linia ||
        numerLinii;


    document.getElementById(
        "trasa"
    ).textContent =
        daneLinii.trasa ||
        "";


    const paramK =
        parametry.get(
            "kierunek"
        );


    if (
        paramK !== null
    ) {

        const num =
            Number(
                paramK
            );


        if (
            Number.isInteger(
                num
            ) &&
            num >= 0
        ) {

            aktualnyKierunek =
                num;
        }
    }


    const rozklad =
        znajdzRozklad();


    const paramP =
        parametry.get(
            "przystanek"
        );


    if (
        paramP &&
        rozklad &&
        Array.isArray(
            rozklad.kierunki
        )
    ) {

        const kierunek =
            rozklad.kierunki[
                aktualnyKierunek
            ];


        if (
            kierunek &&
            Array.isArray(
                kierunek.przystanki
            )
        ) {

            const znaleziony =
                znajdzPrzystanek(
                    kierunek.przystanki,
                    paramP
                );


            if (znaleziony) {

                const indeks =
                    kierunek.przystanki.indexOf(
                        znaleziony
                    );


                ustawWybranyPrzystanek(
                    znaleziony,
                    indeks
                );
            }
        }
    }


    pokazRozklad();
}


/* =========================================================
   TYP DNIA
   ========================================================= */

function okreslTypDnia(
    data
) {

    const d =
        data.getDay();


    if (d === 6)
        return "sobota";


    if (d === 0)
        return "niedziela";


    return "roboczy";
}


/* =========================================================
   NORMALIZACJA
   ========================================================= */

function normalizujTekst(
    tekst
) {

    return String(
        tekst || ""
    )
        .toLowerCase()
        .normalize(
            "NFD"
        )
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );
}


/* =========================================================
   ZNAJDŹ ROZKŁAD
   ========================================================= */

function znajdzRozklad() {

    const rozklady =
        daneLinii.rozkłady ||
        [];


    if (
        rozklady.length === 0
    )
        return null;


    const typ =
        okreslTypDnia(
            wybranaData
        );


    if (
        typ === "sobota"
    ) {

        for (
            const r of rozklady
        ) {

            if (
                normalizujTekst(
                    r.nazwa
                ).includes(
                    "sobot"
                )
            ) {

                return r;
            }
        }
    }


    if (
        typ === "niedziela"
    ) {

        for (
            const r of rozklady
        ) {

            const n =
                normalizujTekst(
                    r.nazwa
                );


            if (
                n.includes(
                    "niedziel"
                ) ||
                n.includes(
                    "swiat"
                )
            ) {

                return r;
            }
        }
    }


    if (
        typ === "roboczy"
    ) {

        for (
            const r of rozklady
        ) {

            const n =
                normalizujTekst(
                    r.nazwa
                );


            if (
                n.includes(
                    "piatk"
                ) ||
                n.includes(
                    "poniedzial"
                )
            ) {

                return r;
            }
        }
    }


    return rozklady[0];
}


/* =========================================================
   KIERUNKI
   ========================================================= */

function generujKierunki() {

    const kontener =
        document.getElementById(
            "kierunki"
        );


    kontener.innerHTML =
        "";


    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !Array.isArray(
            rozklad.kierunki
        )
    )
        return;


    rozklad.kierunki.forEach(
        (
            kierunek,
            index
        ) => {

            const btn =
                document.createElement(
                    "button"
                );


            btn.className =
                "kierunek-btn" +
                (
                    index ===
                    aktualnyKierunek
                        ? " aktywny"
                        : ""
                );


            const p =
                kierunek.przystanki ||
                [];


            btn.textContent =
                p.length > 0
                    ? (
                        p[
                            p.length - 1
                        ].nazwa ||
                        "Kierunek"
                    )
                    : "Kierunek " +
                      (
                        index + 1
                      );


            btn.onclick =
                () => {

                    aktualnyKierunek =
                        index;


                    aktualnyWariant =
                        null;


                    ustawWybranyPrzystanek(
                        null
                    );


                    widokKursuAktywny =
                        false;


                    aktualizujHistorieURL(
                        null
                    );


                    pokazRozklad();
                };


            kontener.appendChild(
                btn
            );
        }
    );
}

/* =========================================================
   DATA
   ========================================================= */

document
    .getElementById(
        "wybranaData"
    )
    .addEventListener(
        "change",
        function () {

            if (!this.value)
                return;


            const czesci =
                this.value.split(
                    "-"
                );


            wybranaData =
                new Date(
                    Number(
                        czesci[0]
                    ),
                    Number(
                        czesci[1]
                    ) - 1,
                    Number(
                        czesci[2]
                    )
                );


            pokazRozklad();
        }
    );


function formatujDateInput(
    data
) {

    return (
        data.getFullYear() +
        "-" +
        String(
            data.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +
        "-" +
        String(
            data.getDate()
        ).padStart(
            2,
            "0"
        )
    );
}


/* =========================================================
   WARIANT
   ========================================================= */

function pobierzWariant(
    k
) {

    return String(
        (
            k &&
            typeof k === "object" &&
            k.wariant
        )
            ? (
                k.wariant.litera ||
                k.wariant.nazwa ||
                k.wariant
            )
            : (
                k && k.wariant
                    ? k.wariant
                    : ""
            )
    ).trim();
}


function zbierzWariantyDlaKierunku(
    kierunek
) {

    const set =
        new Set();


    (
        kierunek.przystanki ||
        []
    ).forEach(
        p =>
            (
                p.kursy ||
                []
            ).forEach(
                k => {

                    const w =
                        pobierzWariant(
                            k
                        );


                    if (w)
                        set.add(w);
                }
            )
    );


    return Array
        .from(set)
        .sort();
}


/* =========================================================
   HISTORIA URL
   ========================================================= */

function aktualizujHistorieURL(
    przystanekId
) {

    const url =
        new URL(
            window.location.href
        );


    url.searchParams.set(
        "linia",
        numerLinii
    );


    url.searchParams.set(
        "kierunek",
        aktualnyKierunek
    );


    if (przystanekId) {

        url.searchParams.set(
            "przystanek",
            przystanekId
        );

    } else {

        url.searchParams.delete(
            "przystanek"
        );
    }


    window.history.pushState(
        {
            przystanek:
                przystanekId,

            kierunek:
                aktualnyKierunek
        },
        "",
        url.toString()
    );
}


/* =========================================================
   GŁÓWNY WIDOK
   ========================================================= */

function pokazRozklad() {

    if (!daneLinii)
        return;


    const rozklad =
        znajdzRozklad();


    const kontener =
        document.getElementById(
            "przystanki"
        );


    const typ =
        document.getElementById(
            "typRozkładu"
        );


    const wp =
        document.getElementById(
            "warianty-pojemnik"
        );


    if (
        !rozklad ||
        !rozklad.kierunki ||
        rozklad.kierunki.length === 0
    ) {

        typ.textContent =
            "Brak rozkładu";


        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak danych rozkładu.' +
            '</div>';


        if (wp)
            wp.style.display =
                "none";


        return;
    }


    if (
        aktualnyKierunek >=
        rozklad.kierunki.length
    ) {

        aktualnyKierunek =
            0;


        ustawWybranyPrzystanek(
            null
        );
    }


    generujKierunki();


    if (
        widokKursuAktywny
    )
        return;


    if (
        wybranyPrzystanek !== null &&
        wybranyPrzystanekIndex !== null
    ) {

        const kierunek =
            rozklad.kierunki[
                aktualnyKierunek
            ];


        if (
            kierunek &&
            Array.isArray(
                kierunek.przystanki
            )
        ) {

            const idx =
                Number(
                    wybranyPrzystanekIndex
                );


            if (
                Number.isInteger(idx) &&
                idx >= 0 &&
                idx <
                    kierunek.przystanki.length
            ) {

                wybranyPrzystanek =
                    kierunek.przystanki[
                        idx
                    ];


                pokazRozkladWybranegoPrzystanku(
                    rozklad,
                    wybranyPrzystanek
                );


                return;
            }
        }


        ustawWybranyPrzystanek(
            null
        );
    }


    pokazListePrzystankow(
        rozklad
    );
}


/* =========================================================
   FUNKCJA ROZPOZNAJĄCA NŻ
   ========================================================= */

function czyPrzystanekNaZadanie(
    p
) {

    if (!p)
        return false;


    const typ =
        String(
            p.typ || ""
        )
            .trim()
            .toUpperCase();


    if (
        typ === "NŻ" ||
        typ === "NZ"
    ) {

        return true;
    }


    if (
        p.naZadanie === true ||
        String(
            p.naZadanie
        ).toLowerCase() ===
            "true"
    ) {

        return true;
    }


    if (
        p.nz === true ||
        String(
            p.nz
        ).toLowerCase() ===
            "true"
    ) {

        return true;
    }


    if (
        typeof p.nazwa ===
            "string" &&
        p.nazwa.includes(
            "(NŻ)"
        )
    ) {

        return true;
    }


    return false;
}


/* =========================================================
   LISTA PRZYSTANKÓW
   ========================================================= */

function pokazListePrzystankow(
    rozklad
) {

    const kontener =
        document.getElementById(
            "przystanki"
        );


    const kierunek =
        rozklad.kierunki[
            aktualnyKierunek
        ];


    const przystanki =
        kierunek.przystanki ||
        [];


    /*
     * NIE POKAZUJEMY "Wybierz przystanek"
     */
    document.getElementById(
        "typRozkładu"
    ).style.display =
        "none";


    document.querySelector(
        ".dni"
    ).style.display =
        "none";


    document.getElementById(
        "kalendarz"
    ).style.display =
        "none";


    kontener.innerHTML =
        "";


    const wp =
        document.getElementById(
            "warianty-pojemnik"
        );


    const wprz =
        document.getElementById(
            "warianty-przyciski"
        );


    let wariantyKierunku =
        [];


    if (
        wp &&
        wprz
    ) {

        wariantyKierunku =
            zbierzWariantyDlaKierunku(
                kierunek
            );


        if (
            wariantyKierunku.length > 0
        ) {

            wp.style.display =
                "flex";


            wprz.innerHTML =
                "";


            if (
                aktualnyWariant === null ||
                !wariantyKierunku.includes(
                    aktualnyWariant
                )
            ) {

                if (
                    wariantyKierunku.includes(
                        "A"
                    )
                ) {

                    aktualnyWariant =
                        "A";

                } else {

                    aktualnyWariant =
                        wariantyKierunku[0];
                }
            }


            wariantyKierunku.forEach(
                w => {

                    if (w === "")
                        return;


                    const btn =
                        document.createElement(
                            "button"
                        );


                    btn.className =
                        "wariant-btn" +
                        (
                            aktualnyWariant === w
                                ? " aktywny"
                                : ""
                        );


                    btn.textContent =
                        w;


                    btn.onclick =
                        () => {

                            aktualnyWariant =
                                w;


                            pokazRozklad();
                        };


                    wprz.appendChild(
                        btn
                    );
                }
            );

        } else {

            wp.style.display =
                "none";


            aktualnyWariant =
                null;
        }
    }


    if (
        przystanki.length === 0
    ) {

        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak przystanków.' +
            '</div>';


        return;
    }


    const N =
        przystanki.length;


    let mainWariant =
        wariantyKierunku.includes(
            "A"
        )
            ? "A"
            : wariantyKierunku[0];


    let isOnMainAxis =
        new Array(
            N
        ).fill(
            false
        );


    przystanki.forEach(
        (
            p,
            i
        ) => {

            isOnMainAxis[i] =
                (
                    p.kursy ||
                    []
                ).some(
                    k =>
                        pobierzWariant(
                            k
                        ) ===
                        mainWariant
                );
        }
    );


    const tripPaths =
        {};


    przystanki.forEach(
        (
            p,
            i
        ) => {

            (
                p.kursy ||
                []
            ).forEach(
                k => {

                    if (
                        !tripPaths[
                            k.numer
                        ]
                    ) {

                        tripPaths[
                            k.numer
                        ] = [];
                    }


                    tripPaths[
                        k.numer
                    ].push(
                        {
                            index:
                                i,

                            wariant:
                                pobierzWariant(
                                    k
                                )
                        }
                    );
                }
            );
        }
    );


    const edgesMap =
        {};


    Object.values(
        tripPaths
    ).forEach(
        path => {

            path.sort(
                (
                    a,
                    b
                ) =>
                    a.index -
                    b.index
            );


            for (
                let j = 0;
                j <
                    path.length - 1;
                j++
            ) {

                const u =
                    path[j].index;


                const v =
                    path[j + 1].index;


                const w =
                    path[j].wariant;


                const key =
                    u + "," + v;


                if (
                    !edgesMap[key]
                ) {

                    edgesMap[key] =
                        {

                            u:
                                u,

                            v:
                                v,

                            warianty:
                                new Set()
                        };
                }


                if (
                    w !== undefined &&
                    w !== null
                ) {

                    edgesMap[key]
                        .warianty
                        .add(w);
                }
            }
        }
    );


    const edges =
        Object.values(
            edgesMap
        );


    edges.forEach(
        e => {

            if (
                isOnMainAxis[e.u] &&
                isOnMainAxis[e.v]
            ) {

                if (
                    e.v - e.u === 1
                ) {

                    e.track =
                        0;

                } else {

                    let skipsMain =
                        false;


                    for (
                        let k =
                            e.u + 1;
                        k < e.v;
                        k++
                    ) {

                        if (
                            isOnMainAxis[k]
                        ) {

                            skipsMain =
                                true;

                            break;
                        }
                    }


                    if (
                        skipsMain
                    ) {

                        e.track =
                            -1;

                    } else {

                        e.track =
                            0;
                    }
                }

            } else {

                e.track =
                    1;
            }
        }
    );


    const ROW_HEIGHT =
        44;


    const TRACK_W =
        22;


    const SPINE_X =
        44;


    const LEFT_X =
        SPINE_X -
        TRACK_W;


    const RIGHT_X =
        SPINE_X +
        TRACK_W;


    const SVG_W =
        RIGHT_X +
        16;


    let firstActiveIndex =
        -1;


    let lastActiveIndex =
        -1;


    przystanki.forEach(
        (
            p,
            i
        ) => {

            const active =
                (
                    p.kursy ||
                    []
                ).some(
                    k =>
                        pobierzWariant(
                            k
                        ) ===
                        aktualnyWariant
                );


            if (active) {

                if (
                    firstActiveIndex === -1
                ) {

                    firstActiveIndex =
                        i;
                }


                lastActiveIndex =
                    i;
            }
        }
    );


    const lista =
        document.createElement(
            "div"
        );


    lista.className =
        "lista-przystankow";


    przystanki.forEach(
        (
            p,
            i
        ) => {

            const nodeActive =
                (
                    p.kursy ||
                    []
                ).some(
                    k =>
                        pobierzWariant(
                            k
                        ) ===
                        aktualnyWariant
                );


            const btn =
                document.createElement(
                    "button"
                );


            btn.type =
                "button";


            btn.className =
                "przystanek-btn" +
                (
                    nodeActive
                        ? ""
                        : " inactive"
                );


            const isFirstActive =
                i ===
                firstActiveIndex;


            const isLastActive =
                i ===
                lastActiveIndex;


            const isNz =
                czyPrzystanekNaZadanie(
                    p
                );


            let inactiveLines =
                "";


            let activeLines =
                "";


            const drawLine =
                (
                    x1,
                    y1,
                    x2,
                    y2,
                    isActive
                ) => {

                    const color =
                        isActive
                            ? "#000"
                            : "#ccc";


                    const w =
                        isActive
                            ? 2.5
                            : 2;


                    const str =
                        `<line
                            x1="${x1}"
                            y1="${y1}"
                            x2="${x2}"
                            y2="${y2}"
                            stroke="${color}"
                            stroke-width="${w}"
                            stroke-linecap="round"
                        />`;


                    if (
                        isActive
                    )
                        activeLines +=
                            str;

                    else
                        inactiveLines +=
                            str;
                };


            edges.forEach(
                e => {

                    const isEdgeActive =
                        e.warianty.has(
                            aktualnyWariant
                        );


                    if (
                        e.track === 0
                    ) {

                        if (
                            i === e.u
                        ) {

                            drawLine(
                                SPINE_X,
                                ROW_HEIGHT / 2,
                                SPINE_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i > e.u &&
                            i < e.v
                        ) {

                            drawLine(
                                SPINE_X,
                                0,
                                SPINE_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i === e.v
                        ) {

                            drawLine(
                                SPINE_X,
                                0,
                                SPINE_X,
                                ROW_HEIGHT / 2,
                                isEdgeActive
                            );
                        }

                    } else if (
                        e.track === 1
                    ) {

                        const startX =
                            isOnMainAxis[e.u]
                                ? SPINE_X
                                : RIGHT_X;


                        const endX =
                            isOnMainAxis[e.v]
                                ? SPINE_X
                                : RIGHT_X;


                        if (
                            i === e.u
                        ) {

                            drawLine(
                                startX,
                                ROW_HEIGHT / 2,
                                RIGHT_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i > e.u &&
                            i < e.v
                        ) {

                            drawLine(
                                RIGHT_X,
                                0,
                                RIGHT_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i === e.v
                        ) {

                            drawLine(
                                RIGHT_X,
                                0,
                                endX,
                                ROW_HEIGHT / 2,
                                isEdgeActive
                            );
                        }

                    } else if (
                        e.track === -1
                    ) {

                        if (
                            i === e.u
                        ) {

                            drawLine(
                                SPINE_X,
                                ROW_HEIGHT / 2,
                                LEFT_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i > e.u &&
                            i < e.v
                        ) {

                            drawLine(
                                LEFT_X,
                                0,
                                LEFT_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i === e.v
                        ) {

                            drawLine(
                                LEFT_X,
                                0,
                                SPINE_X,
                                ROW_HEIGHT / 2,
                                isEdgeActive
                            );
                        }
                    }
                }
            );


            const nodeX =
                isOnMainAxis[i]
                    ? SPINE_X
                    : RIGHT_X;


            const strokeColor =
                nodeActive
                    ? (
                        isFirstActive
                            ? "#000"
                            : "#e42313"
                    )
                    : "#ccc";


            const fillColor =
                nodeActive
                    ? (
                        isFirstActive
                            ? "#000"
                            : "#e42313"
                    )
                    : "#ccc";


            let nodeSvg =
                "";


            /*
             * =================================================
             * WĘZŁY:
             *
             * ZWYKŁY:
             * 16 x 16 px
             *
             * NŻ:
             * zewnętrzny rozmiar również 16 x 16 px,
             * ale środek pozostaje biały.
             * =================================================
             */

            if (
                isFirstActive ||
                isLastActive
            ) {

                if (isNz) {

                    nodeSvg =
                        `<rect
                            x="${nodeX - 6.75}"
                            y="15.25"
                            width="13.5"
                            height="13.5"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    nodeSvg =
                        `<rect
                            x="${nodeX - 8}"
                            y="14"
                            width="16"
                            height="16"
                            fill="${fillColor}"
                            stroke="none"
                        />`;
                }

            } else {

                if (isNz) {

                    nodeSvg =
                        `<circle
                            cx="${nodeX}"
                            cy="22"
                            r="6.75"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    nodeSvg =
                        `<circle
                            cx="${nodeX}"
                            cy="22"
                            r="8"
                            fill="${fillColor}"
                            stroke="none"
                        />`;
                }
            }


            const svgHtml =
                `<svg
                    width="${SVG_W}"
                    height="${ROW_HEIGHT}"
                >
                    ${inactiveLines}
                    ${activeLines}
                    ${nodeSvg}
                </svg>`;


            const nodeWrapper =
                document.createElement(
                    "div"
                );


            nodeWrapper.className =
                "node-wrapper";


            nodeWrapper.style.width =
                SVG_W + "px";


            nodeWrapper.innerHTML =
                svgHtml;


            const nazwa =
                document.createElement(
                    "div"
                );


            nazwa.className =
                "przystanek-nazwa";


            nazwa.textContent =
                p.nazwa ||
                "Przystanek";


            const nr =
                document.createElement(
                    "div"
                );


            nr.className =
                "przystanek-nr";


            nr.textContent =
                p.nr || "";


            btn.appendChild(
                nodeWrapper
            );


            btn.appendChild(
                nazwa
            );


            btn.appendChild(
                nr
            );


            btn.onclick =
                () =>
                    wybierzPrzystanek(
                        p,
                        i
                    );


            lista.appendChild(
                btn
            );
        }
    );


    kontener.appendChild(
        lista
    );
}


/* =========================================================
   WYBÓR PRZYSTANKU
   ========================================================= */

function wybierzPrzystanek(
    p,
    index
) {

    ustawWybranyPrzystanek(
        p,
        index
    );

    widokKursuAktywny =
        false;

    aktualizujHistorieURL(
        "idx:" + index
    );

    pokazRozklad();


    requestAnimationFrame(() => {

        window.scrollTo(
            0,
            0
        );

        requestAnimationFrame(() => {

            window.scrollTo(
                0,
                0
            );

        });

    });
}


/* =========================================================
   WIDOK PRZYSTANKU
   ========================================================= */

function pokazRozkladWybranegoPrzystanku(
    rozklad,
    przystanek
) {

    const kontener =
        document.getElementById(
            "przystanki"
        );


    document.querySelector(
        ".dni"
    ).style.display =
        "flex";


    if (
        aktualnyDzien !==
        "kalendarz"
    ) {

        document.getElementById(
            "kalendarz"
        ).style.display =
            "none";
    }


    document.getElementById(
        "typRozkładu"
    ).style.display =
        "block";


    document.getElementById(
        "typRozkładu"
    ).textContent =
        rozklad.nazwa ||
        "Rozkład jazdy";


    document.getElementById(
        "warianty-pojemnik"
    ).style.display =
        "none";


    kontener.innerHTML =
        "";


    const naglowek =
        document.createElement(
            "div"
        );


    naglowek.className =
        "naglowek-przystanku-widok";


    naglowek.innerHTML =
        `<div class="nazwa">
            ${przystanek.nazwa}
        </div>

        <div class="numer">
            ${
                przystanek.nr
                    ? przystanek.nr
                    : ""
            }
        </div>`;


    kontener.appendChild(
        naglowek
    );


    const blok =
        document.createElement(
            "div"
        );


    blok.className =
        "przystanek";


    const godziny =
        document.createElement(
            "div"
        );


    godziny.className =
        "godziny";


    if (
        !przystanek.kursy ||
        przystanek.kursy.length === 0
    ) {

        godziny.innerHTML =
            '<div class="brak-godzin">' +
            'Brak odjazdów' +
            '</div>';

    } else {

        let aktGodz =
            null;


        let wiersz =
            null;


        przystanek.kursy.forEach(
            k => {

                const dop =
                    String(
                        k.czas || ""
                    )
                        .trim()
                        .match(
                            /^(\d{1,2}):(\d{2})$/
                        );


                if (!dop)
                    return;


                const g =
                    Number(
                        dop[1]
                    );


                const m =
                    dop[2];


                if (
                    aktGodz !== g
                ) {

                    aktGodz =
                        g;


                    wiersz =
                        document.createElement(
                            "div"
                        );


                    wiersz.className =
                        "wiersz-godziny";


                    wiersz.innerHTML =
                        `<div class="kolumna-godzina">
                            ${String(g).padStart(2, "0")}
                        </div>`;


                    godziny.appendChild(
                        wiersz
                    );
                }


                const kol =
                    document.createElement(
                        "div"
                    );


                kol.className =
                    "kolumna-minuta";


                const litera =
                    pobierzWariant(
                        k
                    );


                kol.innerHTML =
                    `<span class="minuta-z-wariantem">

                        <span class="minuta">
                            ${m}
                        </span>

                        ${
                            litera
                                ? `<span class="wariant-minuty">
                                    ${litera}
                                  </span>`
                                : ""
                        }

                    </span>`;


                if (k.numer) {

                    kol.title =
                        "Zobacz przebieg kursu " +
                        k.numer;


                    kol.onclick =
                        () =>
                            pokazCalyKurs(
                                k.numer
                            );
                }


                wiersz.appendChild(
                    kol
                );
            }
        );
    }


    blok.appendChild(
        godziny
    );


    const uzyteWarianty =
        new Map();


    if (
        przystanek.kursy
    ) {

        przystanek.kursy.forEach(
            k => {

                const w =
                    pobierzWariant(
                        k
                    );


                if (w)
                    uzyteWarianty.set(
                        w,
                        ""
                    );
            }
        );
    }


    if (
        uzyteWarianty.size > 0 &&
        rozklad.warianty
    ) {

        const leg =
            document.createElement(
                "div"
            );


        leg.className =
            "legenda-wariantow";


        let legList =
            '<div class="legenda-lista">';


        uzyteWarianty.forEach(
            (
                _,
                litera
            ) => {

                const w =
                    rozklad.warianty.find(
                        x =>
                            x.litera ===
                            litera
                    );


                if (w) {

                    legList +=
                        `<div class="legenda-element">

                            <span class="legenda-litera">
                                ${litera}
                            </span>

                            <span class="legenda-separator">
                                -
                            </span>

                            <span class="legenda-opis">
                                ${w.opis}
                            </span>

                        </div>`;
                }
            }
        );


        legList +=
            "</div>";


        leg.innerHTML =
            legList;


        blok.appendChild(
            leg
        );
    }


    kontener.appendChild(
        blok
    );


    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            window.scrollTo({
                top: 0,
                left: 0,
                behavior: "auto"
            });

            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;

        });

    });
}


/* =========================================================
   CAŁY KURS
   ========================================================= */

function pokazCalyKurs(
    nrKursu
) {

    widokKursuAktywny =
        true;


    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !rozklad.kierunki ||
        !rozklad.kierunki[
            aktualnyKierunek
        ]
    )
        return;


    const kierunek =
        rozklad.kierunki[
            aktualnyKierunek
        ];


    const przystankiK =
        kierunek.przystanki ||
        [];


    const kursPrzystanki =
        [];


    przystankiK.forEach(
        (
            p,
            originalIndex
        ) => {

            const k =
                (
                    p.kursy ||
                    []
                ).find(
                    x =>
                        x.numer ===
                        nrKursu
                );


            if (k) {

                kursPrzystanki.push(
                    {
                        nazwa:
                            p.nazwa,

                        nr:
                            p.nr,

                        nz:
                            czyPrzystanekNaZadanie(
                                p
                            ),

                        czas:
                            k.czas,

                        originalIndex:
                            originalIndex
                    }
                );
            }
        }
    );


    const kontener =
        document.getElementById(
            "przystanki"
        );


    document.getElementById(
        "typRozkładu"
    ).style.display =
        "block";


    document.getElementById(
        "typRozkładu"
    ).textContent =
        "Przebieg kursu";


    document.querySelector(
        ".dni"
    ).style.display =
        "none";


    document.getElementById(
        "kalendarz"
    ).style.display =
        "none";


    document.getElementById(
        "warianty-pojemnik"
    ).style.display =
        "none";


    kontener.innerHTML =
        "";


    let stopIndex =
        -1;


    if (
        wybranyPrzystanekIndex !== null
    ) {

        const originalIndex =
            Number(
                wybranyPrzystanekIndex
            );


        stopIndex =
            kursPrzystanki.findIndex(
                p =>
                    p.originalIndex ===
                    originalIndex
            );
    }


    if (
        stopIndex === -1 &&
        wybranyPrzystanek
    ) {

        stopIndex =
            kursPrzystanki.findIndex(
                p =>
                    String(
                        p.nr || ""
                    ) ===
                    String(
                        wybranyPrzystanek.nr || ""
                    )
                    &&
                    String(
                        p.nazwa || ""
                    ) ===
                    String(
                        wybranyPrzystanek.nazwa || ""
                    )
            );
    }


    const currentStopName =
        stopIndex !== -1
            ? kursPrzystanki[
                stopIndex
            ].nazwa
            : (
                kursPrzystanki.length
                    ? kursPrzystanki[0].nazwa
                    : ""
            );


    const lastStopName =
        kursPrzystanki.length
            ? kursPrzystanki[
                kursPrzystanki.length - 1
            ].nazwa
            : "";


    const widok =
        document.createElement(
            "div"
        );


    widok.className =
        "kurs-widok";


    widok.innerHTML =
        `<div class="kurs-naglowek">

            <div class="kurs-tytul">
                ${currentStopName}
                &rarr;
                ${lastStopName}
            </div>

            <div class="kurs-informacja">
                Kurs ${nrKursu}
                |
                Przebieg przez
                ${kursPrzystanki.length}
                przystanków
            </div>

        </div>`;


    const lista =
        document.createElement(
            "div"
        );


    lista.className =
        "kurs-lista";


    const czasWMinutach =
        cz => {

            const p =
                String(
                    cz || ""
                ).split(
                    ":"
                );


            return p.length === 2
                ? parseInt(
                    p[0],
                    10
                  ) * 60 +
                  parseInt(
                    p[1],
                    10
                  )
                : 0;
        };


    const startIndex =
        stopIndex !== -1
            ? stopIndex
            : 0;


    const baseTime =
        kursPrzystanki.length
            ? czasWMinutach(
                kursPrzystanki[
                    startIndex
                ].czas
            )
            : 0;


    kursPrzystanki.forEach(
        (
            el,
            index
        ) => {

            const isPast =
                stopIndex !== -1 &&
                index < stopIndex;


            const isCurrent =
                stopIndex !== -1 &&
                index === stopIndex;


            const wiersz =
                document.createElement(
                    "div"
                );


            wiersz.className =
                "kurs-przystanek" +
                (
                    isCurrent
                        ? " aktywny"
                        : ""
                );


            let diffText =
                "";


            if (!isPast) {

                let diff =
                    czasWMinutach(
                        el.czas
                    ) -
                    baseTime;


                if (diff < 0)
                    diff +=
                        24 * 60;


                diffText =
                    `${diff} min`;
            }


            const strokeColor =
                isPast
                    ? "#cccccc"
                    : (
                        isCurrent
                            ? "#000000"
                            : (
                                index === 0
                                    ? "#000000"
                                    : "#e42313"
                            )
                    );


            const fillColor =
                isPast
                    ? "#cccccc"
                    : (
                        isCurrent
                            ? "#000000"
                            : (
                                index === 0
                                    ? "#000000"
                                    : "#e42313"
                            )
                    );


            const topSegColor =
                isPast ||
                isCurrent
                    ? "#cccccc"
                    : "#000000";


            const botSegColor =
                isPast
                    ? "#cccccc"
                    : "#000000";


            let svgHtml =
                `<svg
                    width="40"
                    height="44"
                    style="display:block; overflow:visible;"
                >`;


            if (index > 0) {

                svgHtml +=
                    `<line
                        x1="20"
                        y1="0"
                        x2="20"
                        y2="22"
                        stroke="${topSegColor}"
                        stroke-width="2.5"
                    />`;
            }


            if (
                index <
                kursPrzystanki.length - 1
            ) {

                svgHtml +=
                    `<line
                        x1="20"
                        y1="22"
                        x2="20"
                        y2="44"
                        stroke="${botSegColor}"
                        stroke-width="2.5"
                    />`;
            }


            /*
             * =================================================
             * WĘZŁY W WIDOKU CAŁEGO KURSU
             *
             * ZWYKŁY = 16 x 16
             * NŻ     = zewnętrznie również 16 x 16
             * =================================================
             */

            if (
                index === 0 ||
                index ===
                kursPrzystanki.length - 1
            ) {

                if (el.nz) {

                    svgHtml +=
                        `<rect
                            x="13.25"
                            y="15.25"
                            width="13.5"
                            height="13.5"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    svgHtml +=
                        `<rect
                            x="12"
                            y="14"
                            width="16"
                            height="16"
                            fill="${fillColor}"
                            stroke="none"
                        />`;
                }

            } else {

                if (el.nz) {

                    svgHtml +=
                        `<circle
                            cx="20"
                            cy="22"
                            r="6.75"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    svgHtml +=
                        `<circle
                            cx="20"
                            cy="22"
                            r="8"
                            fill="${fillColor}"
                            stroke="none"
                        />`;
                }
            }


            svgHtml +=
                "</svg>";


            const textStyling =
                isPast
                    ? "color: #aaaaaa; font-weight: normal;"
                    : (
                        isCurrent
                            ? "color: #000000; font-weight: 900; font-size: 17px;"
                            : "color: #000000; font-weight: bold;"
                    );


            const timeStyling =
                isPast
                    ? "color: #aaaaaa; font-weight: normal;"
                    : (
                        isCurrent
                            ? "color: #000000; font-weight: 900; font-size: 17px;"
                            : "color: #000000; font-weight: bold;"
                    );


            const nrStyling =
                isPast
                    ? "color: #cccccc;"
                    : "color: #777777;";


            const relTimeStyling =
                isPast
                    ? "color: #cccccc;"
                    : (
                        isCurrent
                            ? "color: #444444; font-weight: bold;"
                            : "color: #888888;"
                    );


            wiersz.innerHTML =
                `
                <div
                    class="kurs-czas-rel"
                    style="${relTimeStyling}"
                >
                    ${diffText}
                </div>

                <div
                    class="node-wrapper"
                    style="width: 40px;"
                >
                    ${svgHtml}
                </div>

                <div
                    class="kurs-nazwa-box"
                    style="${textStyling}"
                >
                    ${el.nazwa}
                </div>

                <div
                    class="kurs-nr"
                    style="${nrStyling}"
                >
                    ${el.nr || ""}
                </div>

                <div
                    class="kurs-czas-abs"
                    style="${timeStyling}"
                >
                    ${el.czas}
                </div>
                `;


            lista.appendChild(
                wiersz
            );
        }
    );


    widok.appendChild(
        lista
    );


    kontener.appendChild(
        widok
    );
}


/* =========================================================
   BŁĄD
   ========================================================= */

function pokazBlad(
    tytul,
    opis
) {

    document.getElementById(
        "numerLinii"
    ).textContent =
        "Błąd";


    document.getElementById(
        "trasa"
    ).textContent =
        "";


    document.getElementById(
        "kierunki"
    ).innerHTML =
        "";


    document.getElementById(
        "typRozkładu"
    ).style.display =
        "none";


    const wp =
        document.getElementById(
            "warianty-pojemnik"
        );


    if (wp)
        wp.style.display =
            "none";


    document.getElementById(
        "przystanki"
    ).innerHTML =
        '<div class="blad">' +
            '<strong>' +
                tytul +
            '</strong>' +
            opis +
        '</div>';
}


/* =========================================================
   HISTORIA PRZEGLĄDARKI
   ========================================================= */

window.addEventListener(
    "popstate",
    function() {

        const url =
            new URL(
                window.location.href
            );


        const pParam =
            url.searchParams.get(
                "przystanek"
            );


        const kParam =
            url.searchParams.get(
                "kierunek"
            );


        if (
            kParam !== null &&
            !isNaN(
                Number(kParam)
            )
        ) {

            aktualnyKierunek =
                Number(
                    kParam
                );
        }


        const rozklad =
            znajdzRozklad();


        if (
            pParam &&
            rozklad &&
            rozklad.kierunki &&
            rozklad.kierunki[
                aktualnyKierunek
            ]
        ) {

            const kierunek =
                rozklad.kierunki[
                    aktualnyKierunek
                ];


            const przystanki =
                kierunek.przystanki ||
                [];


            const p =
                znajdzPrzystanek(
                    przystanki,
                    pParam
                );


            if (p) {

                const index =
                    przystanki.indexOf(
                        p
                    );


                ustawWybranyPrzystanek(
                    p,
                    index
                );

            } else {

                ustawWybranyPrzystanek(
                    null
                );
            }

        } else {

            ustawWybranyPrzystanek(
                null
            );
        }


        widokKursuAktywny =
            false;


        pokazRozklad();
    }
);

</script>
