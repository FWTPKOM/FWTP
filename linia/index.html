            'Brak przystanków.' +
            '</div>';


        return;
    }


    /* =====================================================
       DOKŁADNY KURS BAZOWY
       ===================================================== */

    const kursBazowy =
        znajdzKursBazowy(
            kierunekDlaDaty,
            aktualnyWariant
        );


    const czasyKursu =
        pobierzCzasyKursu(
            kierunekDlaDaty,
            kursBazowy
        );


    const czasySumowane =
        obliczSumowaneCzasy(
            czasyKursu
        );


    const selectedActive =
        czasyKursu.map(
            czas =>
                czasNaMinuty(
                    czas
                ) !== null
        );


    /* =====================================================
       PIERWSZY I OSTATNI AKTYWNY PRZYSTANEK
       ===================================================== */

    const N =
        przystanki.length;


    let firstActiveIndex =
        -1;


    let lastActiveIndex =
        -1;


    selectedActive.forEach(
        (
            active,
            i
        ) => {

            if (!active)
                return;


            if (
                firstActiveIndex === -1
            ) {

                firstActiveIndex =
                    i;
            }


            lastActiveIndex =
                i;
        }
    );


    if (
        firstActiveIndex === -1
    ) {

        przystanki.forEach(
            (
                p,
                i
            ) => {

                const active =
                    (
                        p.kursy ||
                        []
                    ).some(
                        k =>
                            pobierzWariant(
                                k
                            ) ===
                            aktualnyWariant
                    );


                if (
                    active &&
                    firstActiveIndex === -1
                ) {

                    firstActiveIndex =
                        i;
                }


                if (active) {

                    lastActiveIndex =
                        i;
                }
            }
        );
    }


    /* =====================================================
       ŚCIEŻKI KURSÓW
       ===================================================== */

    let mainWariant =
        wariantyKierunku.includes(
            "A"
        )
            ? "A"
            : wariantyKierunku[0];


    if (
        wariantyKierunku.length >= 4 &&
        wariantyKierunku.includes("") &&
        !wariantyKierunku.includes("A")
    ) {

        mainWariant =
            "";
    }


    let isOnMainAxis =
        new Array(
            N
        ).fill(
            false
        );


    przystanki.forEach(
        (
            p,
            i
        ) => {

            isOnMainAxis[i] =
                (
                    p.kursy ||
                    []
                ).some(
                    k =>
                        pobierzWariant(
                            k
                        ) ===
                        mainWariant
                );
        }
    );


    /* =====================================================
       ŚCIEŻKI
       ===================================================== */

    const tripPaths =
        {};


    przystanki.forEach(
        (
            p,
            i
        ) => {

            (
                p.kursy ||
                []
            ).forEach(
                k => {

                    const numer =
                        String(
                            k.numer
                        ).trim();


                    if (!numer)
                        return;


                    const wariant =
                        pobierzWariant(
                            k
                        );


                    const klucz =
                        numer +
                        "||" +
                        wariant;


                    if (
                        !tripPaths[
                            klucz
                        ]
                    ) {

                        tripPaths[
                            klucz
                        ] = [];
                    }


                    tripPaths[
                        klucz
                    ].push(
                        {
                            index:
                                i,

                            wariant:
                                wariant
                        }
                    );
                }
            );
        }
    );


    /* =====================================================
       KRAWĘDZIE
       ===================================================== */

    const edgesMap =
        {};


    Object.values(
        tripPaths
    ).forEach(
        path => {

            path.sort(
                (
                    a,
                    b
                ) =>
                    a.index -
                    b.index
            );


            for (
                let j = 0;
                j <
                path.length - 1;
                j++
            ) {

                const u =
                    path[j].index;


                const v =
                    path[j + 1].index;


                const w =
                    path[j].wariant;


                const key =
                    u +
                    "," +
                    v;


                if (
                    !edgesMap[key]
                ) {

                    edgesMap[key] =
                        {
                            u:
                                u,

                            v:
                                v,

                            warianty:
                                new Set()
                        };
                }


                edgesMap[key]
                    .warianty
                    .add(w);
            }
        }
    );


    const edges =
        Object.values(
            edgesMap
        );


    edges.forEach(
        e => {

            if (
                isOnMainAxis[e.u] &&
                isOnMainAxis[e.v]
            ) {

                if (
                    e.v - e.u === 1
                ) {

                    e.track =
                        0;

                } else {

                    let skipsMain =
                        false;


                    for (
                        let k =
                            e.u + 1;
                        k < e.v;
                        k++
                    ) {

                        if (
                            isOnMainAxis[k]
                        ) {

                            skipsMain =
                                true;

                            break;
                        }
                    }


                    e.track =
                        skipsMain
                            ? -1
                            : 0;
                }

            } else {

                e.track =
                    1;
            }
        }
    );


    /* =====================================================
       KRAWĘDZIE DOKŁADNEGO KURSU
       ===================================================== */

    const selectedEdgeKeys =
        new Set();


    if (
        kursBazowy &&
        Array.isArray(
            kursBazowy.punkty
        )
    ) {

        const punkty =
            kursBazowy.punkty
                .filter(
                    pt =>
                        czasNaMinuty(
                            pt.czas
                        ) !== null
                )
                .sort(
                    (
                        a,
                        b
                    ) =>
                        a.index -
                        b.index
                );


        for (
            let j = 0;
            j <
            punkty.length - 1;
            j++
        ) {

            selectedEdgeKeys.add(
                punkty[j].index +
                "," +
                punkty[j + 1].index
            );
        }
    }


    /* =====================================================
       PARAMETRY SVG
       ===================================================== */

    const ROW_HEIGHT =
        44;


    const TRACK_W =
        22;


    const SPINE_X =
        44;


    const LEFT_X =
        SPINE_X -
        TRACK_W;


    const RIGHT_X =
        SPINE_X +
        TRACK_W;


    const SVG_W =
        RIGHT_X +
        16;


    /* =====================================================
       LISTA PRZYSTANKÓW
       ===================================================== */

    const lista =
        document.createElement(
            "div"
        );


    lista.className =
        "lista-przystankow";


    przystanki.forEach(
        (
            p,
            i
        ) => {

            const nodeActive =
                selectedActive[i];


            const beforeVariantStart =
                firstActiveIndex !== -1 &&
                i <
                firstActiveIndex;


            const inactiveForCourse =
                !nodeActive;


            const visualInactive =
                beforeVariantStart ||
                inactiveForCourse;


            const btn =
                document.createElement(
                    "button"
                );


            btn.type =
                "button";


            btn.className =
                "przystanek-btn" +
                (
                    visualInactive
                        ? " inactive"
                        : ""
                );


            const isFirstStop =
                i === 0;


            const isLastStop =
                i ===
                przystanki.length - 1;


            const isVariantStart =
                firstActiveIndex !== -1 &&
                i === firstActiveIndex;


            const isVariantEnd =
                lastActiveIndex !== -1 &&
                i === lastActiveIndex;


            const shouldBeSquare =
                isFirstStop ||
                isVariantStart ||
                isVariantEnd ||
                isLastStop;


            const isNz =
                czyPrzystanekNaZadanie(
                    p
                );


            let inactiveLines =
                "";


            let activeLines =
                "";


            const drawLine =
                (
                    x1,
                    y1,
                    x2,
                    y2,
                    isActive
                ) => {

                    const color =
                        isActive
                            ? "#000"
                            : "#ccc";


                    const w =
                        isActive
                            ? 2.5
                            : 2;


                    const str =
                        `<line
                            x1="${x1}"
                            y1="${y1}"
                            x2="${x2}"
                            y2="${y2}"
                            stroke="${color}"
                            stroke-width="${w}"
                            stroke-linecap="round"
                        />`;


                    if (
                        isActive
                    ) {

                        activeLines +=
                            str;

                    } else {

                        inactiveLines +=
                            str;
                    }
                };


            edges.forEach(
                e => {

                    const edgeKey =
                        e.u +
                        "," +
                        e.v;


                    const isEdgeActive =
                        selectedEdgeKeys.has(
                            edgeKey
                        );


                    if (
                        e.track === 0
                    ) {

                        if (
                            i === e.u
                        ) {

                            drawLine(
                                SPINE_X,
                                ROW_HEIGHT / 2,
                                SPINE_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i > e.u &&
                            i < e.v
                        ) {

                            drawLine(
                                SPINE_X,
                                0,
                                SPINE_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i === e.v
                        ) {

                            drawLine(
                                SPINE_X,
                                0,
                                SPINE_X,
                                ROW_HEIGHT / 2,
                                isEdgeActive
                            );
                        }


                    } else if (
                        e.track === 1
                    ) {

                        const startX =
                            isOnMainAxis[e.u]
                                ? SPINE_X
                                : RIGHT_X;


                        const endX =
                            isOnMainAxis[e.v]
                                ? SPINE_X
                                : RIGHT_X;


                        if (
                            i === e.u
                        ) {

                            drawLine(
                                startX,
                                ROW_HEIGHT / 2,
                                RIGHT_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i > e.u &&
                            i < e.v
                        ) {

                            drawLine(
                                RIGHT_X,
                                0,
                                RIGHT_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i === e.v
                        ) {

                            drawLine(
                                RIGHT_X,
                                0,
                                endX,
                                ROW_HEIGHT / 2,
                                isEdgeActive
                            );
                        }


                    } else if (
                        e.track === -1
                    ) {

                        if (
                            i === e.u
                        ) {

                            drawLine(
                                SPINE_X,
                                ROW_HEIGHT / 2,
                                LEFT_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i > e.u &&
                            i < e.v
                        ) {

                            drawLine(
                                LEFT_X,
                                0,
                                LEFT_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i === e.v
                        ) {

                            drawLine(
                                LEFT_X,
                                0,
                                SPINE_X,
                                ROW_HEIGHT / 2,
                                isEdgeActive
                            );
                        }
                    }
                }
            );


            const nodeX =
                isOnMainAxis[i]
                    ? SPINE_X
                    : RIGHT_X;


            const isBlackStart =
                isVariantStart;


            const strokeColor =
                !nodeActive
                    ? "#ccc"
                    : (
                        isBlackStart
                            ? "#000"
                            : "#e42313"
                    );


            const fillColor =
                !nodeActive
                    ? "#ccc"
                    : (
                        isBlackStart
                            ? "#000"
                            : "#e42313"
                    );


            let nodeSvg =
                "";


            if (
                shouldBeSquare
            ) {

                if (isNz) {

                    nodeSvg =
                        `<rect
                            x="${nodeX - 6.75}"
                            y="15.25"
                            width="13.5"
                            height="13.5"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    nodeSvg =
                        `<rect
                            x="${nodeX - 8}"
                            y="14"
                            width="16"
                            height="16"
                            fill="${fillColor}"
                            stroke="none"
                        />`;
                }


            } else {

                if (isNz) {

                    nodeSvg =
                        `<circle
                            cx="${nodeX}"
                            cy="22"
                            r="6.75"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    nodeSvg =
                        `<circle
                            cx="${nodeX}"
                            cy="22"
                            r="8"
                            fill="${fillColor}"
                            stroke="none"
                        />`;
                }
            }


            const svgHtml =
                `<svg
                    width="${SVG_W}"
                    height="${ROW_HEIGHT}"
                    aria-hidden="true"
                >
                    ${inactiveLines}
                    ${activeLines}
                    ${nodeSvg}
                </svg>`;


            const nodeWrapper =
                document.createElement(
                    "div"
                );


            nodeWrapper.className =
                "node-wrapper";


            nodeWrapper.style.width =
                SVG_W +
                "px";


            nodeWrapper.innerHTML =
                svgHtml;


            const czasKolumna =
                document.createElement(
                    "div"
                );


            czasKolumna.className =
                "kolumna-czas-przejazdu";


            if (
                i ===
                firstActiveIndex
            ) {

                czasKolumna.classList.add(
                    "pierwszy"
                );
            }


            const czasSumowany =
                czasySumowane[i];


            if (
                czasSumowany !== null &&
                czasSumowany !== undefined &&
                nodeActive
            ) {

                czasKolumna.textContent =
                    czasSumowany +
                    " min";

            } else {

                czasKolumna.textContent =
                    "";
            }


            const nazwa =
                document.createElement(
                    "div"
                );


            nazwa.className =
                "przystanek-nazwa";


            nazwa.textContent =
                p.nazwa ||
                "Przystanek";


            nazwa.style.cursor =
                "pointer";


            nazwa.addEventListener(
                "click",
                function(e) {

                    e.stopPropagation();


                    wybierzPrzystanek(
                        p,
                        i
                    );
                }
            );


            const nr =
                document.createElement(
                    "div"
                );


            nr.className =
                "przystanek-nr";


            nr.textContent =
                p.nr || "";


            btn.appendChild(
                czasKolumna
            );


            btn.appendChild(
                nodeWrapper
            );


            btn.appendChild(
                nazwa
            );


            btn.appendChild(
                nr
            );


            btn.onclick =
                () =>
                    wybierzPrzystanek(
                        p,
                        i
                    );


            lista.appendChild(
                btn
            );
        }
    );


    kontener.appendChild(
        lista
    );
}


/* =========================================================
   WYBÓR PRZYSTANKU
   ========================================================= */

function wybierzPrzystanek(
    p,
    index
) {

    ustawWybranyPrzystanek(
        p,
        index
    );


    widokKursuAktywny =
        false;


    aktualizujHistorieURL(
        "idx:" + index
    );


    pokazRozklad();


    requestAnimationFrame(
        () => {

            window.scrollTo(
                0,
                0
            );


            requestAnimationFrame(
                () => {

                    window.scrollTo(
                        0,
                        0
                    );
                }
            );
        }
    );
}


/* =========================================================
   WIDOK PRZYSTANKU
   ========================================================= */

function pokazRozkladWybranegoPrzystanku(
    rozklad,
    przystanek
) {

    const kontener =
        document.getElementById(
            "przystanki"
        );


    document.querySelector(
        ".dni"
    ).style.display =
        "flex";


    if (
        aktualnyDzien !==
        "kalendarz"
    ) {

        document.getElementById(
            "kalendarz"
        ).style.display =
            "none";
    }


    document.getElementById(
        "typRozkładu"
    ).style.display =
        "block";


    document.getElementById(
        "typRozkładu"
    ).textContent =
        rozklad.nazwa ||
        "Rozkład jazdy";


    document.getElementById(
        "warianty-pojemnik"
    ).style.display =
        "none";


    kontener.innerHTML =
        "";


    /*
     * =====================================================
     * FILTROWANIE KURSÓW DLA WYBRANEJ DATY
     * =====================================================
     */

    const przystanekDlaDaty =
        Object.assign(
            {},
            przystanek
        );


    przystanekDlaDaty.kursy =
        filtrujKursyDlaDaty(
            przystanek.kursy || [],
            wybranaData
        );


    const naglowek =
        document.createElement(
            "div"
        );


    naglowek.className =
        "naglowek-przystanku-widok";


    naglowek.innerHTML =
        `<div class="nazwa">
            ${przystanek.nazwa}
        </div>

        <div class="numer">
            ${
                przystanek.nr
                    ? przystanek.nr
                    : ""
            }
        </div>`;


    kontener.appendChild(
        naglowek
    );


    const blok =
        document.createElement(
            "div"
        );


    blok.className =
        "przystanek";


    const godziny =
        document.createElement(
            "div"
        );


    godziny.className =
        "godziny";


    if (
        !przystanekDlaDaty.kursy ||
        przystanekDlaDaty.kursy.length === 0
    ) {

        godziny.innerHTML =
            '<div class="brak-godzin">' +
            'Brak odjazdów dla wybranego dnia' +
            '</div>';

    } else {

        let aktGodz =
            null;


        let wiersz =
            null;


        /*
         * =====================================================
         * LICZBA WARIANTÓW NA KIERUNKU
         * =====================================================
         */

        const kierunek =
            rozklad.kierunki[
                aktualnyKierunek
            ];


        const kierunekDlaDaty =
            przygotujKierunekDlaDaty(
                kierunek,
                wybranaData
            );


        const wszystkieWarianty =
            kierunekDlaDaty
                ? zbierzWariantyDlaKierunku(
                    kierunekDlaDaty
                )
                : [];


        const jestCzteryLubWiecejWariantow =
            wszystkieWarianty.length >= 4;


        przystanekDlaDaty.kursy.forEach(
            k => {

                const dop =
                    String(
                        k.czas || ""
                    )
                        .trim()
                        .match(
                            /^(\d{1,2}):(\d{2})$/
                        );


                if (!dop)
                    return;


                const g =
                    Number(
                        dop[1]
                    );


                const m =
                    dop[2];


                if (
                    aktGodz !== g
                ) {

                    aktGodz =
                        g;


                    wiersz =
                        document.createElement(
                            "div"
                        );


                    wiersz.className =
                        "wiersz-godziny";


                    wiersz.innerHTML =
                        `<div class="kolumna-godzina">
                            ${String(g).padStart(2, "0")}
                        </div>`;


                    godziny.appendChild(
                        wiersz
                    );
                }


                const kol =
                    document.createElement(
                        "div"
                    );


                kol.className =
                    "kolumna-minuta";


                const litera =
                    pobierzWariant(
                        k
                    );


                const literaDoPokazania =
                    litera === ""
                        ? (
                            jestCzteryLubWiecejWariantow
                                ? "A"
                                : ""
                        )
                        : litera;


                const pokazWariant =
                    literaDoPokazania &&
                    (
                        literaDoPokazania !== "A" ||
                        jestCzteryLubWiecejWariantow
                    );


                kol.innerHTML =
                    `<span class="minuta-z-wariantem">

                        <span class="minuta">
                            ${m}
                        </span>

                        ${
                            pokazWariant
                                ? `<span class="wariant-minuty">
                                    ${literaDoPokazania}
                                  </span>`
                                : ""
                        }

                    </span>`;


                if (
                    k.numer !== undefined &&
                    k.numer !== null
                ) {

                    kol.title =
                        "Zobacz przebieg kursu " +
                        k.numer +
                        (
                            literaDoPokazania
                                ? " (" +
                                  literaDoPokazania +
                                  ")"
                                : ""
                        );


                    kol.onclick =
                        () =>
                            pokazCalyKurs(
                                k.numer,
                                litera
                            );
                }


                wiersz.appendChild(
                    kol
                );
            }
        );
    }


    blok.appendChild(
        godziny
    );


    /* =====================================================
       LEGENDA WARIANTÓW
       ===================================================== */

    const uzyteWarianty =
        new Map();


    const wariantyLegendyKierunku =
        rozklad.kierunki[
            aktualnyKierunek
        ]
            ? zbierzWariantyDlaKierunku(
                przygotujKierunekDlaDaty(
                    rozklad.kierunki[
                        aktualnyKierunek
                    ],
                    wybranaData
                )
            )
            : [];


    const pokazALegendy =
        wariantyLegendyKierunku.length >= 4;


    if (
        przystanekDlaDaty.kursy
    ) {

        przystanekDlaDaty.kursy.forEach(
            k => {

                const w =
                    pobierzWariant(
                        k
                    );


                if (w === "") {

                    if (pokazALegendy) {

                        uzyteWarianty.set(
                            "",
                            ""
                        );
                    }

                } else if (w) {

                    uzyteWarianty.set(
                        w,
                        ""
                    );
                }
            }
        );
    }


    if (
        uzyteWarianty.size > 0 &&
        rozklad.warianty
    ) {

        const leg =
            document.createElement(
                "div"
            );


        leg.className =
            "legenda-wariantow";


        let legList =
            '<div class="legenda-lista">';


        uzyteWarianty.forEach(
            (
                _,
                litera
            ) => {

                const w =
                    rozklad.warianty.find(
                        x =>
                            litera === ""
                                ? (
                                    x.litera === "" ||
                                    x.litera === "A"
                                )
                                : x.litera === litera
                    );


                const literaLegendy =
                    litera === ""
                        ? "A"
                        : litera;


                if (w) {

                    legList +=
                        `<div class="legenda-element">

                            <span class="legenda-litera">
                                ${literaLegendy}
                            </span>

                            <span class="legenda-separator">
                                -
                            </span>

                            <span class="legenda-opis">
                                ${w.opis}
                            </span>

                        </div>`;
                }
            }
        );


        legList +=
            "</div>";


        leg.innerHTML =
            legList;


        blok.appendChild(
            leg
        );
    }


    kontener.appendChild(
        blok
    );


    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    window.scrollTo({
                        top: 0,
                        left: 0,
                        behavior: "auto"
                    });


                    document.documentElement.scrollTop =
                        0;


                    document.body.scrollTop =
                        0;
                }
            );
        }
    );
}


/* =========================================================
   CAŁY KURS
   ========================================================= */

function pokazCalyKurs(
    nrKursu,
    wariantKursu = null
) {

    widokKursuAktywny =
        true;


    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !rozklad.kierunki ||
        !rozklad.kierunki[
            aktualnyKierunek
        ]
    )
        return;


    const kierunek =
        przygotujKierunekDlaDaty(
            rozklad.kierunki[
                aktualnyKierunek
            ],
            wybranaData
        );


    const przystankiK =
        kierunek.przystanki ||
        [];


    const kursPrzystanki =
        [];


    const szukanyNumer =
        String(
            nrKursu
        ).trim();


    const szukanyWariant =
        String(
            wariantKursu ||
            ""
        ).trim();


    przystankiK.forEach(
        (
            p,
            originalIndex
        ) => {

            const k =
                (
                    p.kursy ||
                    []
                ).find(
                    x => {

                        const numer =
                            String(
                                x.numer
                            ).trim();


                        const wariant =
                            pobierzWariant(
                                x
                            );


                        if (
                            numer !==
                            szukanyNumer
                        ) {

                            return false;
                        }


                        if (
                            wariantKursu !== null &&
                            wariant !==
                            szukanyWariant
                        ) {

                            return false;
                        }


                        return true;
                    }
                );


            if (k) {

                kursPrzystanki.push(
                    {
                        nazwa:
                            p.nazwa,

                        nr:
                            p.nr,

                        nz:
                            czyPrzystanekNaZadanie(
                                p
                            ),

                        czas:
                            k.czas,

                        wariant:
                            pobierzWariant(
                                k
                            ),

                        originalIndex:
                            originalIndex
                    }
                );
            }
        }
    );


    const kontener =
        document.getElementById(
            "przystanki"
        );


    document.getElementById(
        "typRozkładu"
    ).style.display =
        "block";


    document.getElementById(
        "typRozkładu"
    ).textContent =
        "Przebieg kursu";


    document.querySelector(
        ".dni"
    ).style.display =
        "none";


    document.getElementById(
        "kalendarz"
    ).style.display =
        "none";


    document.getElementById(
        "warianty-pojemnik"
    ).style.display =
        "none";


    kontener.innerHTML =
        "";


    /* =====================================================
       AKTUALNY PRZYSTANEK
       ===================================================== */

    let stopIndex =
        -1;


    if (
        wybranyPrzystanekIndex !== null
    ) {

        const originalIndex =
            Number(
                wybranyPrzystanekIndex
            );


        stopIndex =
            kursPrzystanki.findIndex(
                p =>
                    p.originalIndex ===
                    originalIndex
            );
    }


    if (
        stopIndex === -1 &&
        wybranyPrzystanek
    ) {

        stopIndex =
            kursPrzystanki.findIndex(
                p =>
                    String(
                        p.nr || ""
                    ) ===
                    String(
                        wybranyPrzystanek.nr ||
                        ""
                    )
                    &&
                    String(
                        p.nazwa || ""
                    ) ===
                    String(
                        wybranyPrzystanek.nazwa ||
                        ""
                    )
            );
    }


    const currentStopName =
        stopIndex !== -1
            ? kursPrzystanki[
                stopIndex
            ].nazwa
            : (
                kursPrzystanki.length
                    ? kursPrzystanki[0].nazwa
                    : ""
            );


    const lastStopName =
        kursPrzystanki.length
            ? kursPrzystanki[
                kursPrzystanki.length - 1
            ].nazwa
            : "";


    const widok =
        document.createElement(
            "div"
        );


    widok.className =
        "kurs-widok";


    widok.innerHTML =
        `<div class="kurs-naglowek">

            <div class="kurs-tytul">
                ${currentStopName}
                &rarr;
                ${lastStopName}
            </div>

            <div class="kurs-informacja">

                Kurs ${nrKursu}

                ${
                    szukanyWariant
                        ? " | Wariant " +
                          szukanyWariant
                        : ""
                }

                |
                Przebieg przez
                ${kursPrzystanki.length}
                przystanków

            </div>

        </div>`;


    const lista =
        document.createElement(
            "div"
        );


    lista.className =
        "kurs-lista";


    const czasWMinutach =
        cz => {

            const minuty =
                czasNaMinuty(
                    cz
                );


            return minuty === null
                ? 0
                : minuty;
        };


    const startIndex =
        stopIndex !== -1
            ? stopIndex
            : 0;


    const baseTime =
        kursPrzystanki.length
            ? czasWMinutach(
                kursPrzystanki[
                    startIndex
                ].czas
            )
            : 0;


    kursPrzystanki.forEach(
        (
            el,
            index
        ) => {

            const isPast =
                stopIndex !== -1 &&
                index < stopIndex;


            const isCurrent =
                stopIndex !== -1 &&
                index === stopIndex;


            const isFirst =
                index === 0;


            const isLast =
                index ===
                kursPrzystanki.length - 1;


            const shouldBeSquare =
                isFirst ||
                isLast;


            const wiersz =
                document.createElement(
                    "div"
                );


            wiersz.className =
                "kurs-przystanek" +
                (
                    isCurrent
                        ? " aktywny"
                        : ""
                );


            let diffText =
                "";


            if (!isPast) {

                let diff =
                    czasWMinutach(
                        el.czas
                    ) -
                    baseTime;


                if (
                    diff < 0
                ) {

                    diff +=
                        24 * 60;
                }


                diffText =
                    `${diff} min`;
            }


            const strokeColor =
                isPast
                    ? "#cccccc"
                    : (
                        isCurrent
                            ? "#000000"
                            : (
                                isFirst
                                    ? "#000000"
                                    : "#e42313"
                            )
                    );


            const fillColor =
                isPast
                    ? "#cccccc"
                    : (
                        isCurrent
                            ? "#000000"
                            : (
                                isFirst
                                    ? "#000000"
                                    : "#e42313"
                            )
                    );


            const topSegColor =
                isPast ||
                isCurrent
                    ? "#cccccc"
                    : "#000000";


            const botSegColor =
                isPast
                    ? "#cccccc"
                    : "#000000";


            let svgHtml =
                `<svg
                    width="40"
                    height="44"
                    style="display:block; overflow:visible;"
                >`;


            if (
                index > 0
            ) {

                svgHtml +=
                    `<line
                        x1="20"
                        y1="0"
                        x2="20"
                        y2="22"
                        stroke="${topSegColor}"
                        stroke-width="2.5"
                    />`;
            }


            if (
                index <
                kursPrzystanki.length - 1
            ) {

                svgHtml +=
                    `<line
                        x1="20"
                        y1="22"
                        x2="20"
                        y2="44"
                        stroke="${botSegColor}"
                        stroke-width="2.5"
                    />`;
            }


            if (
                shouldBeSquare
            ) {

                if (el.nz) {

                    svgHtml +=
                        `<rect
                            x="13.25"
                            y="15.25"
                            width="13.5"
                            height="13.5"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    svgHtml +=
                        `<rect
                            x="12"
                            y="14"
                            width="16"
                            height="16"
                            fill="${fillColor}"
                            stroke="none"
                        />`;
                }

            } else {

                if (el.nz) {

                    svgHtml +=
                        `<circle
                            cx="20"
                            cy="22"
                            r="6.75"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    svgHtml +=
                        `<circle
                            cx="20"
                            cy="22"
                            r="8"
                            fill="${fillColor}"
                            stroke="none"
                        />`;
                }
            }


            svgHtml +=
                "</svg>";


            const textStyling =
                isPast
                    ? "color:#aaaaaa; font-weight:600;"
                    : (
                        isCurrent
                            ? "color:#000000; font-weight:900; font-size:17px;"
                            : "color:#000000; font-weight:600;"
                    );


            const timeStyling =
                isPast
                    ? "color:#aaaaaa; font-weight:600;"
                    : (
                        isCurrent
                            ? "color:#000000; font-weight:900; font-size:17px;"
                            : "color:#000000; font-weight:600;"
                    );


            const nrStyling =
                isPast
                    ? "color:#cccccc;"
                    : "color:#777777;";


            const relTimeStyling =
                isPast
                    ? "color:#cccccc;"
                    : (
                        isCurrent
                            ? "color:#444444; font-weight:600;"
                            : "color:#888888;"
                    );


            wiersz.innerHTML =
                `
                <div
                    class="kurs-czas-rel"
                    style="${relTimeStyling}"
                >
                    ${diffText}
                </div>

                <div
                    class="node-wrapper"
                    style="width:40px;"
                >
                    ${svgHtml}
                </div>

                <div
                    class="kurs-nazwa-box"
                    style="${textStyling}"
                >
                    ${el.nazwa}
                </div>

                <div
                    class="kurs-nr"
                    style="${nrStyling}"
                >
                    ${el.nr || ""}
                </div>

                <div
                    class="kurs-czas-abs"
                    style="${timeStyling}"
                >
                    ${el.czas}
                </div>
                `;


            lista.appendChild(
                wiersz
            );
        }
    );


    widok.appendChild(
        lista
    );


    kontener.appendChild(
        widok
    );
}


/* =========================================================
   BŁĄD
   ========================================================= */

function pokazBlad(
    tytul,
    opis
) {

    document.getElementById(
        "numerLinii"
    ).textContent =
        "Błąd";


    document.getElementById(
        "trasa"
    ).textContent =
        "";


    document.getElementById(
        "kierunki"
    ).innerHTML =
        "";


    document.getElementById(
        "typRozkładu"
    ).style.display =
        "none";


    const wp =
        document.getElementById(
            "warianty-pojemnik"
        );


    if (wp)
        wp.style.display =
            "none";


    document.getElementById(
        "przystanki"
    ).innerHTML =
        '<div class="blad">' +
            '<strong>' +
                tytul +
            '</strong>' +
            opis +
        '</div>';
}


/* =========================================================
   HISTORIA PRZEGLĄDARKI
   ========================================================= */

window.addEventListener(
    "popstate",
    function() {

        const url =
            new URL(
                window.location.href
            );


        const pParam =
            url.searchParams.get(
                "przystanek"
            );


        const kParam =
            url.searchParams.get(
                "kierunek"
            );


        if (
            kParam !== null &&
            !isNaN(
                Number(kParam)
            )
        ) {

            aktualnyKierunek =
                Number(
                    kParam
                );
        }


        const rozklad =
            znajdzRozklad();


        if (
            pParam &&
            rozklad &&
            rozklad.kierunki &&
            rozklad.kierunki[
                aktualnyKierunek
            ]
        ) {

            const kierunek =
                rozklad.kierunki[
                    aktualnyKierunek
                ];


            const przystanki =
                kierunek.przystanki ||
                [];


            const p =
                znajdzPrzystanek(
                    przystanki,
                    pParam
                );


            if (p) {

                const index =
                    przystanki.indexOf(
                        p
                    );


                ustawWybranyPrzystanek(
                    p,
                    index
                );

            } else {

                ustawWybranyPrzystanek(
                    null
                );
            }

        } else {

            ustawWybranyPrzystanek(
                null
            );
        }


        widokKursuAktywny =
            false;


        pokazRozklad();
    }
);

</script>
