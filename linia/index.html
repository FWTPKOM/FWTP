<!DOCTYPE html>

<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rozkład jazdy</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800;900&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   GŁÓWNY KONTENER I NAGŁÓWKI
   ========================================================= */

.rozkład {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px;
}

.naglowek-linii {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 25px;
    margin-bottom: 15px;
}

.numer-linii {
    font-size: 42px;
    font-weight: bold;
    margin: 0 0 8px 0;
}

.trasa {
    font-size: 19px;
    font-weight: bold;
    margin: 0;
    white-space: pre-line;
}


/* =========================================================
   KIERUNKI I DNI
   ========================================================= */

.kierunki,
.dni {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.kierunek-btn,
.dzien-btn {
    flex: 1;
    padding: 14px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    transition: 0.15s;
}

.kierunek-btn:hover,
.dzien-btn:hover {
    border-color: #0066cc;
}

.kierunek-btn.aktywny,
.dzien-btn.aktywny {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
}


/* =========================================================
   WARIANTY
   ========================================================= */

.warianty-pojemnik {
    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #fff;

    border-top: 2px solid #ccc;
    border-bottom: 2px solid #ccc;

    width: 80%;

    margin-left: auto;
    margin-right: auto;

    padding: 10px 10px 10px 15px;

    margin-bottom: 0;

    box-sizing: border-box;
}

.warianty-info {
    font-size: 15px;
    color: #1d1d1b;
    padding-left: 10px;
}

.warianty-info strong {
    font-weight: 700;
}

.warianty-przyciski {
    display: flex;
    gap: 2px;
    padding-right: 10px;
}

.wariant-btn {
    padding: 4px 12px;

    font-size: 22px;
    font-weight: 900;

    color: #706f6f;

    background: transparent;
    border: none;

    border-bottom: 4px solid transparent;

    cursor: pointer;

    transition: 0.15s;

    font-family: inherit;

    text-transform: uppercase;
}

.wariant-btn:hover {
    color: #d61c12;
}

.wariant-btn.aktywny {
    color: #d61c12;
    border-bottom-color: #d61c12;
}


/* =========================================================
   KALENDARZ / ŁADOWANIE / BŁĘDY
   ========================================================= */

.kalendarz {
    display: none;

    background: white;

    border: 1px solid #ddd;
    border-radius: 6px;

    padding: 15px;
    margin-bottom: 15px;
}

.kalendarz input {
    padding: 10px;

    font-size: 16px;

    border: 1px solid #ccc;
    border-radius: 5px;
}

.typ-rozkładu {
    background: #f7f7f7;

    border: 1px solid #ddd;

    width: 80%;

    margin-left: auto;
    margin-right: auto;

    padding: 12px 15px;

    margin-bottom: 15px;

    border-radius: 6px;

    font-size: 14px;
    color: #555;

    box-sizing: border-box;
}

.brak-godzin {
    padding: 15px;

    color: #777;

    font-size: 14px;
}

.loading {
    background: white;

    border: 1px solid #ddd;
    border-radius: 8px;

    padding: 30px;

    text-align: center;

    color: #666;
}

.blad {
    background: #fff4f4;

    border: 1px solid #e0aaaa;

    color: #a00000;

    border-radius: 8px;

    padding: 20px;

    line-height: 1.6;
}

.blad strong {
    display: block;
    margin-bottom: 8px;
}

.brak-danych {
    padding: 30px;

    text-align: center;

    color: #777;

    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;
}


/* =========================================================
   ROZKŁAD JAZDY
   ========================================================= */

.przystanek {
    background: white;

    border: 1px solid #ddd;

    border-radius: 7px;

    overflow: hidden;
}

.godziny {
    width: 100%;
}

.wiersz-godziny {
    display: grid;

    grid-template-columns:
        43px
        repeat(10, 46px);

    grid-auto-columns: 46px;

    min-height: 38px;

    border-bottom: 1px solid #eee;
}

.kolumna-godzina {
    display: flex;

    align-items: center;
    justify-content: center;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 16px;

    font-weight: 600;

    background: #555;

    color: white;

    border-right: 1px solid #444;

    min-height: 38px;
}

.kolumna-minuta {
    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    position: relative;

    min-height: 38px;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-weight: 600;

    width: 46px;

    color: black;

    transform: translateX(10px);

    cursor: pointer;
}

.kolumna-minuta:hover {
    background: #e8eef5;
}

.minuta-z-wariantem {
    position: relative;

    display: inline-block;

    line-height: 1;

    text-align: center;
}

.minuta {
    display: inline-block;

    font-size: 16px;

    font-weight: 600;

    line-height: 1;

    z-index: 1;
}

.wariant-minuty {
    position: absolute;

    left: calc(100% + 2px);

    bottom: -1px;

    font-size: 12px;

    line-height: 1;

    font-weight: 600;

    white-space: nowrap;

    z-index: 2;
}


/* =========================================================
   LEGENDA
   ========================================================= */

.legenda-wariantow {
    background: #f7f7f7;

    border-top: 1px solid #ddd;

    padding: 10px 15px;

    font-size: 16px;

    color: #555;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;
}

.legenda-element {
    display: flex;

    align-items: baseline;

    gap: 6px;

    line-height: 1.35;

    font-weight: 600;
}

.legenda-litera,
.legenda-separator,
.legenda-opis {
    color: black;

    font-size: 15px;
}

.legenda-litera {
    font-size: 16px;

    min-width: 22px;
}


/* =========================================================
   LISTA PRZYSTANKÓW
   ========================================================= */

.lista-przystankow {
    display: flex;

    flex-direction: column;

    gap: 0;

    background: white;

    padding: 15px 0;

    border-radius: 0;

    width: 80%;

    margin: 0 auto;

    box-sizing: border-box;
}


/* =========================================================
   WIERSZ PRZYSTANKU
   ========================================================= */

.przystanek-btn {
    width: 100%;

    display: flex;

    align-items: center;

    padding: 0;

    background: transparent;

    border: none;

    cursor: pointer;

    text-align: left;

    transition: 0.15s;

    font-family: inherit;

    height: 44px;

    margin: 0;

    position: relative;
}

.przystanek-btn:hover {
    background-color: #f8fbff;
}

.przystanek-btn:hover .przystanek-nazwa {
    color: #d61c12;
}


/* =========================================================
   KOLUMNA CZASU PRZEJAZDU
   ========================================================= */

.kolumna-czas-przejazdu {
    width: 48px;

    min-width: 48px;

    max-width: 48px;

    height: 44px;

    display: flex;

    align-items: center;

    justify-content: center;

    box-sizing: border-box;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 13px;

    font-weight: 600;

    color: #777;

    flex-shrink: 0;

    white-space: nowrap;
}

.kolumna-czas-przejazdu.pierwszy {
    color: #777;
}


/* =========================================================
   OŚ TRASY
   ========================================================= */

.node-wrapper {
    height: 44px;

    position: relative;

    flex-shrink: 0;
}

.node-wrapper svg {
    display: block;

    overflow: visible;
}


/* =========================================================
   NAZWA PRZYSTANKU
   ========================================================= */

.przystanek-nazwa {
    flex: 1;

    display: flex;

    align-items: center;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 16px;

    font-weight: 600;

    color: #000;

    padding-left: 12px;

    transition: color 0.15s;

    z-index: 11;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.przystanek-btn.inactive .przystanek-nazwa {
    color: #999;

    font-weight: 600;
}

.przystanek-btn.inactive:hover .przystanek-nazwa {
    color: #d61c12;
}


/* =========================================================
   NUMER PRZYSTANKU
   ========================================================= */

.przystanek-nr {
    margin-left: auto;

    display: flex;

    align-items: center;

    padding: 0 16px 0 10px;

    font-size: 14px;

    font-weight: 600;

    color: #666;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    flex-shrink: 0;

    z-index: 11;
}

.przystanek-btn.inactive .przystanek-nr {
    color: #ccc;
}


/* =========================================================
   WIDOK PRZYSTANKU
   ========================================================= */

.naglowek-przystanku-widok {
    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;

    padding: 20px;

    margin-bottom: 15px;
}

.naglowek-przystanku-widok .nazwa {
    display: inline;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 26px;

    font-weight: 700;

    margin-bottom: 0;
}

.naglowek-przystanku-widok .numer {
    display: inline;

    margin-left: 8px;

    color: #777;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 18px;

    font-weight: 600;
}


/* =========================================================
   WIDOK CAŁEGO KURSU
   ========================================================= */

.kurs-widok {
    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;

    overflow: hidden;

    margin-top: 15px;
}

.kurs-naglowek {
    background: #555;

    color: white;

    padding: 15px;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;
}

.kurs-naglowek .kurs-tytul {
    font-size: 22px;

    margin-bottom: 5px;

    font-weight: 600;
}

.kurs-naglowek .kurs-informacja {
    font-size: 15px;

    opacity: 0.9;
}

.kurs-lista {
    display: flex;

    flex-direction: column;

    padding: 10px 0;
}

.kurs-przystanek {
    display: flex;

    align-items: center;

    height: 44px;
}

.kurs-przystanek.aktywny {
    background: #f8fbff;
}

.kurs-czas-rel {
    width: 60px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding-right: 0;

    color: #888;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 13px;

    flex-shrink: 0;
}

.kurs-nazwa-box {
    flex: 1;

    display: flex;

    align-items: center;

    padding-left: 12px;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 15px;

    font-weight: 600;

    color: #000;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.kurs-nr {
    margin-left: auto;

    display: flex;

    align-items: center;

    padding-right: 15px;

    font-size: 13px;

    font-weight: 600;

    color: #777;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    flex-shrink: 0;
}

.kurs-czas-abs {
    width: 65px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-weight: 600;

    font-size: 15px;

    flex-shrink: 0;
}


/* =========================================================
   RESPONSYWNOŚĆ
   ========================================================= */

@media (max-width: 550px) {

    .rozkład {
        margin: 15px auto;
    }

    .warianty-pojemnik {
        flex-direction: column;

        align-items: flex-start;

        gap: 10px;

        padding: 10px 10px 10px 15px;
    }

    .warianty-info {
        padding-left: 10px;
    }

    .warianty-przyciski {
        padding-right: 10px;
    }

    .typ-rozkładu {
        width: 80%;
    }

    .wiersz-godziny {
        grid-template-columns:
            36px
            repeat(4, 46px);

        min-height: 36px;

        overflow-x: auto;
    }

    .kolumna-godzina {
        font-size: 14px;

        min-height: 36px;
    }

    .kolumna-minuta {
        width: 46px;

        min-width: 46px;

        max-width: 46px;

        min-height: 36px;
    }

    .przystanek-btn .przystanek-nazwa {
        font-family:
            "Barlow Semi Condensed",
            sans-serif;

        font-size: 15px;

        font-weight: 600;
    }

    .naglowek-przystanku-widok .nazwa {
        font-size: 22px;
    }

    .naglowek-przystanku-widok .numer {
        font-size: 17px;
    }

    .lista-przystankow {
        width: 80%;
    }

    .kolumna-czas-przejazdu {
        width: 42px;

        min-width: 42px;

        max-width: 42px;

        padding-right: 0;

        font-size: 12px;
    }
}

</style>

</head>


<body>

<script>

if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
}

</script>


<header class="topbar">

    <div class="logo">
        FWTP
    </div>

    <nav>

        <a href="../">
            Strona główna
        </a>

        <a href="../linie/">
            Linie
        </a>

    </nav>

</header>


<main class="rozkład">


<section class="naglowek-linii">

    <h1
        id="numerLinii"
        class="numer-linii"
    >
        Ładowanie...
    </h1>

    <p
        id="trasa"
        class="trasa"
    >
        Pobieranie danych...
    </p>

</section>


<div
    id="kierunki"
    class="kierunki"
></div>


<div
    id="warianty-pojemnik"
    class="warianty-pojemnik"
    style="display:none;"
>

    <div class="warianty-info">

        <strong>
            Uwaga!
        </strong>

        Ta linia ma różne warianty trasy

    </div>


    <div
        id="warianty-przyciski"
        class="warianty-przyciski"
    >
    </div>

</div>


<div
    class="dni"
    style="display:none;"
>

    <button
        id="dzisiajBtn"
        class="dzien-btn aktywny"
        onclick="wybierzDzien('dzisiaj')"
    >
        DZISIAJ
    </button>


    <button
        id="jutroBtn"
        class="dzien-btn"
        onclick="wybierzDzien('jutro')"
    >
        JUTRO
    </button>


    <button
        id="kalendarzBtn"
        class="dzien-btn"
        onclick="wybierzDzien('kalendarz')"
    >
        KALENDARZ
    </button>

</div>


<div
    id="kalendarz"
    class="kalendarz"
>

    <input
        type="date"
        id="wybranaData"
    >

</div>


<div
    id="typRozkładu"
    class="typ-rozkładu"
>
    Ładowanie rozkładu...
</div>


<div
    id="przystanki"
    class="przystanki"
>

    <div class="loading">
        Ładowanie przystanków...
    </div>

</div>


</main>

<script>

/* =========================================================
   FWTP – ROZKŁAD JAZDY
   ========================================================= */

let daneLinii = null;
let numerLinii = "";
let aktualnyKierunek = null;
let aktualnyWariant = null;
let aktualnyDzien = null;
let wybranaData = null;

let selectedStopIndex = null;
let selectedStopDirection = null;

let widokKursuAktywny = false;


/* =========================================================
   PARAMETRY URL
   ========================================================= */

const params = new URLSearchParams(
    window.location.search
);

numerLinii =
    params.get("linia") ||
    params.get("line") ||
    "";

aktualnyKierunek =
    params.get("kierunek") ||
    params.get("direction") ||
    null;

aktualnyWariant =
    params.get("wariant") ||
    params.get("variant") ||
    null;

aktualnyDzien =
    params.get("dzien") ||
    params.get("day") ||
    null;


/* =========================================================
   POBIERANIE JSON
   ========================================================= */

async function pobierzDane() {

    if (!numerLinii) {
        pokazBlad(
            "Brak numeru linii w adresie."
        );
        return;
    }

    try {

        const response =
            await fetch(
                "../data/" +
                numerLinii +
                ".json"
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        daneLinii =
            await response.json();

        uruchomStrone();

    } catch (error) {

        console.error(error);

        pokazBlad(
            "Nie udało się wczytać danych linii " +
            numerLinii +
            "."
        );
    }
}


/* =========================================================
   USUWANIE POLA GODZINY
   ========================================================= */

function usunPoleGodziny(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(
            /^\s+|\s+$/g,
            ""
        );
}


/* =========================================================
   SZUKANIE PRZYSTANKU
   ========================================================= */

function znajdzPrzystanek(
    kierunek,
    index
) {

    if (
        !daneLinii ||
        !Array.isArray(
            daneLinii.przystanki
        )
    ) {
        return null;
    }

    return daneLinii.przystanki[index] ||
        null;
}


/* =========================================================
   START STRONY
   ========================================================= */

function uruchomStrone() {

    if (!daneLinii) {
        return;
    }

    const tytul =
        document.getElementById(
            "numer-linii"
        );

    if (tytul) {
        tytul.textContent =
            numerLinii;
    }

    generujKierunki();

    ustawDzienDomyslny();

    if (
        aktualnyKierunek === null
    ) {

        const kierunki =
            pobierzKierunki();

        if (
            kierunki.length > 0
        ) {
            aktualnyKierunek =
                kierunki[0];
        }
    }

    generujWarianty();

    if (
        !aktualnyWariant
    ) {

        const warianty =
            pobierzWarianty(
                aktualnyKierunek
            );

        if (
            warianty.length > 0
        ) {
            aktualnyWariant =
                warianty[0];
        }
    }

    pokazListePrzystankow(
        rozkladDlaAktualnychUstawien()
    );
}


/* =========================================================
   DZIEŃ DOMYŚLNY
   ========================================================= */

function ustawDzienDomyslny() {

    if (!aktualnyDzien) {

        aktualnyDzien =
            "D";
    }
}


/* =========================================================
   POBIERANIE ROZKŁADU
   ========================================================= */

function pobierzRozklady() {

    if (!daneLinii) {
        return [];
    }

    if (
        Array.isArray(
            daneLinii.rozklady
        )
    ) {
        return daneLinii.rozklady;
    }

    if (
        Array.isArray(
            daneLinii.kursy
        )
    ) {
        return daneLinii.kursy;
    }

    return [];
}


/* =========================================================
   KIERUNKI
   ========================================================= */

function pobierzKierunki() {

    const rozklady =
        pobierzRozklady();

    const wynik = [];

    rozklady.forEach(
        kurs => {

            const kierunek =
                kurs.kierunek ||
                kurs.direction ||
                "";

            if (
                kierunek &&
                !wynik.includes(
                    kierunek
                )
            ) {
                wynik.push(
                    kierunek
                );
            }
        }
    );

    return wynik;
}


function generujKierunki() {

    const kontener =
        document.getElementById(
            "kierunki"
        );

    if (!kontener) {
        return;
    }

    kontener.innerHTML = "";

    const kierunki =
        pobierzKierunki();

    kierunki.forEach(
        (kierunek, index) => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "przycisk-kierunek";

            if (
                kierunek ===
                aktualnyKierunek
            ) {
                button.classList.add(
                    "aktywny"
                );
            }

            button.textContent =
                kierunek;

            button.addEventListener(
                "click",
                () => {

                    aktualnyKierunek =
                        kierunek;

                    aktualnyWariant =
                        null;

                    generujKierunki();
                    generujWarianty();

                    pokazListePrzystankow(
                        rozkladDlaAktualnychUstawien()
                    );
                }
            );

            kontener.appendChild(
                button
            );
        }
    );
}


/* =========================================================
   WARIANTY
   ========================================================= */

function pobierzWarianty(
    kierunek
) {

    const rozklady =
        pobierzRozklady();

    const wynik = [];

    rozklady.forEach(
        kurs => {

            const k =
                kurs.kierunek ||
                kurs.direction ||
                "";

            if (
                k !== kierunek
            ) {
                return;
            }

            const wariant =
                kurs.wariant ||
                kurs.variant ||
                "";

            if (
                !wynik.includes(
                    wariant
                )
            ) {
                wynik.push(
                    wariant
                );
            }
        }
    );

    return wynik;
}


function generujWarianty() {

    const kontener =
        document.getElementById(
            "warianty"
        );

    if (!kontener) {
        return;
    }

    kontener.innerHTML = "";

    const warianty =
        pobierzWarianty(
            aktualnyKierunek
        );

    warianty.forEach(
        wariant => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "przycisk-wariant";

            if (
                wariant ===
                aktualnyWariant
            ) {
                button.classList.add(
                    "aktywny"
                );
            }

            button.textContent =
                wariant ||
                "Podstawowy";

            button.addEventListener(
                "click",
                () => {

                    aktualnyWariant =
                        wariant;

                    generujWarianty();

                    pokazListePrzystankow(
                        rozkladDlaAktualnychUstawien()
                    );
                }
            );

            kontener.appendChild(
                button
            );
        }
    );
}


/* =========================================================
   ZNALEZIENIE ROZKŁADU
   ========================================================= */

function rozkladDlaAktualnychUstawien() {

    const rozklady =
        pobierzRozklady();

    return rozklady.find(
        kurs => {

            const kierunek =
                kurs.kierunek ||
                kurs.direction ||
                "";

            const wariant =
                kurs.wariant ||
                kurs.variant ||
                "";

            const dzien =
                kurs.dzien ||
                kurs.day ||
                "";

            return (
                kierunek ===
                aktualnyKierunek &&
                wariant ===
                aktualnyWariant &&
                (
                    !aktualnyDzien ||
                    !dzien ||
                    dzien ===
                    aktualnyDzien
                )
            );
        }
    ) || null;
}


/* =========================================================
   CZAS -> MINUTY
   ========================================================= */

function czasNaMinuty(
    czas
) {

    if (
        czas === null ||
        czas === undefined ||
        czas === ""
    ) {
        return null;
    }

    const tekst =
        String(czas)
            .trim();

    const match =
        tekst.match(
            /^(\d{1,2}):(\d{2})/
        );

    if (!match) {
        return null;
    }

    const godzina =
        Number(match[1]);

    const minuta =
        Number(match[2]);

    if (
        Number.isNaN(godzina) ||
        Number.isNaN(minuta)
    ) {
        return null;
    }

    return (
        godzina * 60 +
        minuta
    );
}


/* =========================================================
   ZNAJDŹ DOKŁADNY KURS BAZOWY
   ========================================================= */

function znajdzKursBazowy(
    kierunek,
    wariant
) {

    const rozklady =
        pobierzRozklady();

    const mapa =
        new Map();

    rozklady.forEach(
        kurs => {

            const k =
                kurs.kierunek ||
                kurs.direction ||
                "";

            const w =
                kurs.wariant ||
                kurs.variant ||
                "";

            if (
                k !== kierunek ||
                w !== wariant
            ) {
                return;
            }

            const numer =
                kurs.numer ??
                kurs.nr ??
                kurs.id ??
                kurs.number ??
                "";

            const klucz =
                String(numer) +
                "||" +
                String(w);

            if (
                !mapa.has(klucz)
            ) {

                mapa.set(
                    klucz,
                    {
                        numer:
                            numer,
                        wariant:
                            w,
                        punkty: []
                    }
                );
            }

            const wynik =
                mapa.get(klucz);

            const punkty =
                kurs.punkty ||
                kurs.stops ||
                kurs.przystanki ||
                [];

            punkty.forEach(
                (punkt, index) => {

                    const stopIndex =
                        punkt.index ??
                        punkt.stopIndex ??
                        index;

                    const czas =
                        punkt.czas ??
                        punkt.time ??
                        "";

                    wynik.punkty.push({
                        index:
                            Number(
                                stopIndex
                            ),
                        czas:
                            czas
                    });
                }
            );
        }
    );

    const kursy =
        Array.from(
            mapa.values()
        );

    kursy.forEach(
        kurs => {

            kurs.punkty.sort(
                (a, b) =>
                    a.index -
                    b.index
            );

            const pierwszy =
                kurs.punkty.find(
                    punkt =>
                        czasNaMinuty(
                            punkt.czas
                        ) !== null
                );

            const ostatni =
                [...kurs.punkty]
                    .reverse()
                    .find(
                        punkt =>
                            czasNaMinuty(
                                punkt.czas
                            ) !== null
                    );

            kurs.startIndex =
                pierwszy
                    ? pierwszy.index
                    : 999999;

            kurs.startMinuty =
                pierwszy
                    ? czasNaMinuty(
                        pierwszy.czas
                    )
                    : null;

            kurs.endIndex =
                ostatni
                    ? ostatni.index
                    : -1;

            kurs.endMinuty =
                ostatni
                    ? czasNaMinuty(
                        ostatni.czas
                    )
                    : null;
        }
    );

    const pasujace =
        kursy.filter(
            kurs =>
                kurs.wariant ===
                wariant
        );

    pasujace.sort(
        (a, b) => {

            const am =
                a.startMinuty ??
                999999;

            const bm =
                b.startMinuty ??
                999999;

            if (
                am !== bm
            ) {
                return am - bm;
            }

            return (
                a.startIndex -
                b.startIndex
            );
        }
    );

    return (
        pasujace[0] ||
        null
    );
}


/* =========================================================
   POBIERANIE CZASÓW KURSU
   ========================================================= */

function pobierzCzasyKursu(
    kierunek,
    kurs
) {

    if (
        !kurs ||
        !Array.isArray(
            kurs.punkty
        )
    ) {
        return [];
    }

    const wynik = [];

    kurs.punkty.forEach(
        punkt => {

            wynik[
                punkt.index
            ] =
                punkt.czas;
        }
    );

    return wynik;
}


/* =========================================================
   SUMOWANIE CZASÓW
   ========================================================= */

function obliczSumowaneCzasy(
    czasy
) {

    if (
        !Array.isArray(czasy)
    ) {
        return [];
    }

    return czasy.map(
        czas =>
            czasNaMinuty(
                czas
            )
    );
}

/* =========================================================
   NŻ
   ========================================================= */

function czyPrzystanekNaZadanie(
    przystanek
) {

    if (!przystanek) {
        return false;
    }

    const typ =
        String(
            przystanek.typ ||
            przystanek.type ||
            przystanek.oznaczenie ||
            ""
        )
            .trim()
            .toUpperCase();

    return (
        typ === "NŻ" ||
        typ === "NZ"
    );
}


/* =========================================================
   GŁÓWNA LISTA PRZYSTANKÓW
   ========================================================= */

function pokazListePrzystankow(
    rozklad
) {

    const kontener =
        document.getElementById(
            "przystanki"
        );

    if (!kontener) {
        return;
    }

    kontener.innerHTML = "";

    widokKursuAktywny =
        false;

    if (!daneLinii) {
        return;
    }

    /*
     * Pobieramy dokładny kurs bazowy.
     */
    const kursBazowy =
        znajdzKursBazowy(
            aktualnyKierunek,
            aktualnyWariant
        );

    const czasyKursu =
        pobierzCzasyKursu(
            aktualnyKierunek,
            kursBazowy
        );

    /*
     * Aktywność przystanków.
     */
    const selectedActive =
        czasyKursu.map(
            czas =>
                czasNaMinuty(
                    czas
                ) !== null
        );

    /*
     * Pierwszy i ostatni aktywny przystanek.
     *
     * Tego nie usuwamy – istniejące
     * kwadraty pozostają bez zmian.
     */
    let firstActiveIndex =
        -1;

    let lastActiveIndex =
        -1;

    selectedActive.forEach(
        (active, i) => {

            if (!active) {
                return;
            }

            if (
                firstActiveIndex === -1
            ) {
                firstActiveIndex =
                    i;
            }

            lastActiveIndex =
                i;
        }
    );


    /* =====================================================
       JEŻELI NIE MA CZASÓW – SZUKAMY PO PUNKTACH
       ===================================================== */

    if (
        firstActiveIndex === -1 &&
        kursBazowy &&
        Array.isArray(
            kursBazowy.punkty
        )
    ) {

        kursBazowy.punkty.forEach(
            punkt => {

                if (
                    czasNaMinuty(
                        punkt.czas
                    ) === null
                ) {
                    return;
                }

                const index =
                    Number(
                        punkt.index
                    );

                if (
                    firstActiveIndex === -1
                ) {
                    firstActiveIndex =
                        index;
                }

                lastActiveIndex =
                    index;
            }
        );
    }


    /* =====================================================
       RZECZYWISTY POCZĄTEK WARIANTU
       ===================================================== */

    const variantStartIndex =
        kursBazowy &&
        Number.isInteger(
            Number(
                kursBazowy.startIndex
            )
        )
            ? Number(
                kursBazowy.startIndex
            )
            : firstActiveIndex;


    /* =====================================================
       RZECZYWISTY KONIEC WARIANTU
       ===================================================== */

    let variantEndIndex =
        kursBazowy &&
        Number.isInteger(
            Number(
                kursBazowy.endIndex
            )
        )
            ? Number(
                kursBazowy.endIndex
            )
            : lastActiveIndex;


    /*
     * Jeżeli endIndex nie istnieje,
     * wyznaczamy go bezpośrednio z punktów.
     */
    if (
        kursBazowy &&
        Array.isArray(
            kursBazowy.punkty
        )
    ) {

        const aktywnePunkty =
            kursBazowy.punkty
                .filter(
                    pt =>
                        czasNaMinuty(
                            pt.czas
                        ) !== null
                );

        if (
            aktywnePunkty.length > 0
        ) {

            variantEndIndex =
                Math.max(
                    ...aktywnePunkty.map(
                        pt =>
                            Number(
                                pt.index
                            )
                    )
                );
        }
    }


    /* =====================================================
       KRAWĘDZIE DOKŁADNEGO KURSU
       ===================================================== */

    const selectedEdgeKeys =
        new Set();

    if (
        kursBazowy &&
        Array.isArray(
            kursBazowy.punkty
        )
    ) {

        const punkty =
            kursBazowy.punkty
                .filter(
                    pt =>
                        czasNaMinuty(
                            pt.czas
                        ) !== null
                )
                .sort(
                    (a, b) =>
                        a.index -
                        b.index
                );

        for (
            let j = 0;
            j < punkty.length - 1;
            j++
        ) {

            selectedEdgeKeys.add(
                punkty[j].index +
                "," +
                punkty[j + 1].index
            );
        }
    }


    /* =====================================================
       PRZYSTANKI
       ===================================================== */

    let przystanki =
        daneLinii.przystanki ||
        [];

    if (
        !Array.isArray(przystanki)
    ) {
        przystanki = [];
    }


    przystanki.forEach(
        (p, i) => {

            const czas =
                czasyKursu[i] ||
                "";

            const nodeActive =
                selectedActive[i] ||
                false;


            /*
             * Przystanki przed początkiem wariantu
             * są szare.
             */
            const beforeVariantStart =
                variantStartIndex !== -1 &&
                i <
                variantStartIndex;


            const inactiveForCourse =
                !nodeActive;


            const visualInactive =
                beforeVariantStart ||
                inactiveForCourse;


            /* =============================================
               ISTNIEJĄCE KWADRATY
               ============================================= */

            const isFirstActive =
                i === firstActiveIndex;

            const isLastActive =
                i === lastActiveIndex;


            /* =============================================
               NOWE KWADRATY DLA WARIANTU
               ============================================= */

            const isVariantStart =
                i === variantStartIndex;

            const isVariantEnd =
                i === variantEndIndex;


            /*
             * WAŻNE:
             *
             * Nie zastępujemy istniejących kwadratów.
             *
             * Dodajemy tylko kwadrat na początku
             * i końcu rzeczywistego wariantu.
             */
            const shouldBeSquare =
                isFirstActive ||
                isLastActive ||
                isVariantStart ||
                isVariantEnd;


            const isNz =
                czyPrzystanekNaZadanie(
                    p
                );


            /* =============================================
               KOLORY
               ============================================= */

            let strokeColor;
            let fillColor;


            /*
             * Szary przystanek pozostaje szary,
             * ALE JEŻELI JEST KWADRATEM,
             * NADAL RYSUJEMY KWADRAT.
             */
            if (
                visualInactive
            ) {

                strokeColor =
                    "#ccc";

                fillColor =
                    "#ccc";

            } else {

                /*
                 * Początek wariantu jest czarny.
                 */
                if (
                    isVariantStart ||
                    isFirstActive
                ) {

                    strokeColor =
                        "#000";

                    fillColor =
                        "#000";

                } else {

                    strokeColor =
                        "#e42313";

                    fillColor =
                        "#e42313";
                }
            }


            /* =============================================
               WIERSZ PRZYSTANKU
               ============================================= */

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "wiersz-przystanku";


            if (
                visualInactive
            ) {

                row.classList.add(
                    "nieaktywny"
                );
            }


            /* =============================================
               KONTENER IKONY
               ============================================= */

            const ikona =
                document.createElement(
                    "div"
                );

            ikona.className =
                "ikona-przystanku";


            /* =============================================
               RYSOWANIE SVG
               ============================================= */

            const svgNS =
                "http://www.w3.org/2000/svg";

            const svg =
                document.createElementNS(
                    svgNS,
                    "svg"
                );

            svg.setAttribute(
                "width",
                "18"
            );

            svg.setAttribute(
                "height",
                "18"
            );

            svg.setAttribute(
                "viewBox",
                "0 0 18 18"
            );


            /* =============================================
               KWADRAT
               ============================================= */

            if (
                shouldBeSquare
            ) {

                const rect =
                    document.createElementNS(
                        svgNS,
                        "rect"
                    );

                rect.setAttribute(
                    "x",
                    "3"
                );

                rect.setAttribute(
                    "y",
                    "3"
                );

                rect.setAttribute(
                    "width",
                    "12"
                );

                rect.setAttribute(
                    "height",
                    "12"
                );

                rect.setAttribute(
                    "rx",
                    "0"
                );

                /*
                 * Szary początek/koniec wariantu
                 * również jest KWADRATEM.
                 */
                rect.setAttribute(
                    "fill",
                    fillColor
                );

                rect.setAttribute(
                    "stroke",
                    strokeColor
                );

                rect.setAttribute(
                    "stroke-width",
                    "1.5"
                );

                svg.appendChild(
                    rect
                );


            } else {

                /* =========================================
                   KOŁO
                   ========================================= */

                const circle =
                    document.createElementNS(
                        svgNS,
                        "circle"
                    );

                circle.setAttribute(
                    "cx",
                    "9"
                );

                circle.setAttribute(
                    "cy",
                    "9"
                );

                circle.setAttribute(
                    "r",
                    "5"
                );

                circle.setAttribute(
                    "fill",
                    fillColor
                );

                circle.setAttribute(
                    "stroke",
                    strokeColor
                );

                circle.setAttribute(
                    "stroke-width",
                    "1.5"
                );

                svg.appendChild(
                    circle
                );
            }


            /* =============================================
               NŻ
               ============================================= */

            if (
                isNz
            ) {

                svg.innerHTML = "";

                const nzCircle =
                    document.createElementNS(
                        svgNS,
                        "circle"
                    );

                nzCircle.setAttribute(
                    "cx",
                    "9"
                );

                nzCircle.setAttribute(
                    "cy",
                    "9"
                );

                nzCircle.setAttribute(
                    "r",
                    "5"
                );

                nzCircle.setAttribute(
                    "fill",
                    "white"
                );

                nzCircle.setAttribute(
                    "stroke",
                    visualInactive
                        ? "#ccc"
                        : "#e42313"
                );

                nzCircle.setAttribute(
                    "stroke-width",
                    "2"
                );

                svg.appendChild(
                    nzCircle
                );
            }


            ikona.appendChild(
                svg
            );


            /* =============================================
               NAZWA PRZYSTANKU
               ============================================= */

            const nazwa =
                document.createElement(
                    "div"
                );

            nazwa.className =
                "nazwa-przystanku";

            nazwa.textContent =
                p.nazwa ||
                p.name ||
                p.nazwaPrzystanku ||
                "";


            /* =============================================
               NUMER PRZYSTANKU
               ============================================= */

            const numer =
                document.createElement(
                    "div"
                );

            numer.className =
                "numer-przystanku";

            numer.textContent =
                p.nr ||
                p.numer ||
                p.number ||
                "";


            /* =============================================
               CZAS
               ============================================= */

            const czasDiv =
                document.createElement(
                    "div"
                );

            czasDiv.className =
                "czas-przystanku";

            czasDiv.textContent =
                czas ||
                "";


            /* =============================================
               SKŁADANIE WIERSZA
               ============================================= */

            row.appendChild(
                ikona
            );

            row.appendChild(
                nazwa
            );

            row.appendChild(
                numer
            );

            row.appendChild(
                czasDiv
            );


            /* =============================================
               KLIKNIĘCIE W PRZYSTANEK
               ============================================= */

            row.addEventListener(
                "click",
                () => {

                    selectedStopIndex =
                        i;

                    selectedStopDirection =
                        aktualnyKierunek;

                    pokazCalyKurs(
                        i
                    );
                }
            );


            kontener.appendChild(
                row
            );
        }
    );
}

            const numer =
                document.createElement(
                    "div"
                );

            numer.className =
                "numer-przystanku";

            numer.textContent =
                p.nr ||
                p.numer ||
                p.number ||
                "";


            /* =============================================
               CZAS
               ============================================= */

            const czasDiv =
                document.createElement(
                    "div"
                );

            czasDiv.className =
                "czas-przystanku";

            czasDiv.textContent =
                czas;


            row.appendChild(
                ikona
            );

            row.appendChild(
                nazwa
            );

            row.appendChild(
                numer
            );

            row.appendChild(
                czasDiv
            );

            kontener.appendChild(
                row
            );
        }
    );
}


/* =========================================================
   BŁĄD
   ========================================================= */

function pokazBlad(
    tekst
) {

    const kontener =
        document.getElementById(
            "przystanki"
        );

    if (!kontener) {
        return;
    }

    kontener.innerHTML = "";

    const blad =
        document.createElement(
            "div"
        );

    blad.className =
        "blad";

    blad.textContent =
        tekst;

    kontener.appendChild(
        blad
    );
}


/* =========================================================
   POPSTATE
   ========================================================= */

window.addEventListener(
    "popstate",
    () => {

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        aktualnyKierunek =
            urlParams.get(
                "kierunek"
            );

        aktualnyWariant =
            urlParams.get(
                "wariant"
            );

        aktualnyDzien =
            urlParams.get(
                "dzien"
            );

        generujKierunki();

        generujWarianty();

        pokazListePrzystankow(
            rozkladDlaAktualnychUstawien()
        );
    }
);


/* =========================================================
   URUCHOMIENIE
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        pobierzDane();
    }
);

</script>
