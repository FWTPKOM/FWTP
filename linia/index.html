
<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Linia</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .line-header {

            background: white;

            border: 1px solid #ddd;

            border-radius: 8px;

            padding: 30px;

            margin-bottom: 25px;

        }


        .line-number {

            font-size: 42px;

            font-weight: bold;

            margin: 0;
        }


        .direction {

            display: block;

            background: white;

            border: 1px solid #ddd;

            border-radius: 6px;

            padding: 20px;

            margin-bottom: 12px;

            text-decoration: none;

            color: #222;

        }


        .direction:hover {

            background: #f0f5fa;

            border-color: #0066cc;

        }


        .back {

            display: inline-block;

            margin-bottom: 25px;

            color: #0066cc;

            text-decoration: none;

        }

    </style>

</head>


<body>


<header class="topbar">

    <div class="logo">
        ROZKŁADY
    </div>

    <nav>

        <a href="../">
            Strona główna
        </a>

        <a href="../linie/">
            Linie
        </a>

    </nav>

</header>



<main class="container">


    <a
        class="back"
        href="../linie/"
    >
        ← Powrót do listy linii
    </a>


    <section class="line-header">

        <p>Linia</p>

        <h1
            id="numerLinii"
            class="line-number"
        >
            -
        </h1>

        <p id="nazwaLinii">
            -
        </p>

    </section>



    <h2>Kierunki</h2>


    <a
        class="direction"
        href="#"
    >

        <strong>
            Kierunek 1
        </strong>

        <br>

        <span>
            Tutaj będzie nazwa krańca
        </span>

    </a>


    <a
        class="direction"
        href="#"
    >

        <strong>
            Kierunek 2
        </strong>

        <br>

        <span>
            Tutaj będzie nazwa krańca
        </span>

    </a>


</main>



<script>

    // =====================================
    // ODCZYT NUMERU LINII Z ADRESU
    // =====================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const numer =
        params.get("linia");


    const numerElement =
        document.getElementById(
            "numerLinii"
        );


    const nazwaElement =
        document.getElementById(
            "nazwaLinii"
        );


    if (numer) {

        numerElement.textContent =
            numer;


        nazwaElement.textContent =
            "Rozkład jazdy linii " + numer;

    }

    else {

        numerElement.textContent =
            "Nie znaleziono linii";


        nazwaElement.textContent =
            "Brak numeru linii w adresie.";

    }

</script>


</body>
</html>
