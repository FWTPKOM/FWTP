
<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rozkład jazdy</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        /* =====================================
           GŁÓWNY BLOK ROZKŁADU
           ===================================== */

        .rozkład {

            max-width: 1000px;

            margin: 30px auto;

        }


        /* =====================================
           POWRÓT
           ===================================== */

        .powrot {

            display: inline-block;

            margin-bottom: 20px;

            color: #0066cc;

            text-decoration: none;

            font-weight: bold;

        }

        .powrot:hover {

            text-decoration: underline;

        }


        /* =====================================
           NAGŁÓWEK LINII
           ===================================== */

        .naglowek-linii {

            background: white;

            border: 1px solid #ddd;

            border-radius: 8px;

            padding: 25px;

            margin-bottom: 15px;

        }


        .numer-linii {

            font-size: 42px;

            font-weight: bold;

            margin: 0 0 8px 0;

        }


        .kierunek {

            font-size: 19px;

            font-weight: bold;

            margin: 0;

        }


        /* =====================================
           PRZYCISKI KIERUNKÓW
           ===================================== */

        .kierunki {

            display: flex;

            gap: 10px;

            margin-bottom: 15px;

        }


        .kierunek-btn {

            flex: 1;

            padding: 13px;

            background: white;

            border: 1px solid #ccc;

            border-radius: 6px;

            cursor: pointer;

            font-size: 15px;

            font-weight: bold;

        }


        .kierunek-btn:hover {

            border-color: #0066cc;

        }


        .kierunek-btn.aktywny {

            background: #0066cc;

            color: white;

            border-color: #0066cc;

        }


        /* =====================================
           WYBÓR DNIA
           ===================================== */

        .dni {

            display: flex;

            gap: 8px;

            margin-bottom: 15px;

        }


        .dzien-btn {

            padding: 12px 20px;

            border: 1px solid #ccc;

            background: white;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;

        }


        .dzien-btn:hover {

            border-color: #0066cc;

        }


        .dzien-btn.aktywny {

            background: #0066cc;

            color: white;

            border-color: #0066cc;

        }


        /* =====================================
           KALENDARZ
           ===================================== */

        .kalendarz {

            display: none;

            background: white;

            border: 1px solid #ddd;

            border-radius: 6px;

            padding: 15px;

            margin-bottom: 15px;

        }


        .kalendarz input {

            padding: 10px;

            font-size: 16px;

        }


        /* =====================================
           TABELA ODJAZDÓW
           ===================================== */

        .tablica {

            background: white;

            border: 1px solid #ddd;

            border-radius: 8px;

            overflow: hidden;

        }


        .tablica-naglowek {

            background: #f2f2f2;

            padding: 14px 18px;

            font-weight: bold;

            border-bottom: 1px solid #ddd;

        }


        .godziny {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

        }


        .godzina {

            padding: 15px;

            text-align: center;

            border-right: 1px solid #eee;

            border-bottom: 1px solid #eee;

            font-size: 18px;

        }


        .godzina:nth-child(4n) {

            border-right: none;

        }


        .godzina:hover {

            background: #f5f8fb;

        }


        /* =====================================
           INFORMACJA
           ===================================== */

        .informacja {

            margin-top: 15px;

            padding: 15px;

            background: white;

            border: 1px solid #ddd;

            border-radius: 6px;

            color: #666;

        }


        /* =====================================
           TELEFON
           ===================================== */

        @media (max-width: 600px) {

            .rozkład {

                margin: 15px;

            }


            .numer-linii {

                font-size: 34px;

            }


            .kierunek {

                font-size: 16px;

            }


            .kierunki {

                flex-direction: column;

            }


            .dni {

                flex-wrap: wrap;

            }


            .dzien-btn {

                flex: 1;

            }


            .godziny {

                grid-template-columns:
                    repeat(3, 1fr);

            }


            .godzina:nth-child(4n) {

                border-right: 1px solid #eee;

            }


            .godzina:nth-child(3n) {

                border-right: none;

            }

        }

    </style>

</head>


<body>


<header class="topbar">

    <div class="logo">
        ROZKŁADY
    </div>

    <nav>

        <a href="../">
            Strona główna
        </a>

        <a href="../linie/">
            Linie
        </a>

    </nav>

</header>



<main class="rozkład">


    <!-- =================================
         POWRÓT
         ================================= -->

    <a
        class="powrot"
        href="../linie/"
    >
        ← Linie
    </a>



    <!-- =================================
         NAGŁÓWEK
         ================================= -->

    <section class="naglowek-linii">

        <h1
            id="numerLinii"
            class="numer-linii"
        >
            -
        </h1>


        <p
            id="kierunek"
            class="kierunek"
        >
            METRO MŁOCINY → OLIMPIA
        </p>

    </section>



    <!-- =================================
         KIERUNKI
         ================================= -->

    <div class="kierunki">

        <button
            class="kierunek-btn aktywny"
            onclick="zmienKierunek(0)"
        >
            METRO MŁOCINY
            → OLIMPIA
        </button>


        <button
            class="kierunek-btn"
            onclick="zmienKierunek(1)"
        >
            OLIMPIA
            → METRO MŁOCINY
        </button>

    </div>



    <!-- =================================
         DZIEŃ
         ================================= -->

    <div class="dni">

        <button
            id="dzisiajBtn"
            class="dzien-btn aktywny"
            onclick="wybierzDzien('dzisiaj')"
        >
            DZISIAJ
        </button>


        <button
            class="dzien-btn"
            onclick="wybierzDzien('jutro')"
        >
            JUTRO
        </button>


        <button
            class="dzien-btn"
            onclick="wybierzDzien('kalendarz')"
        >
            KALENDARZ
        </button>

    </div>



    <!-- =================================
         KALENDARZ
         ================================= -->

    <div
        id="kalendarz"
        class="kalendarz"
    >

        <input
            type="date"
            id="wybranaData"
        >

    </div>



    <!-- =================================
         TABLICA ODJAZDÓW
         ================================= -->

    <section class="tablica">


        <div
            id="naglowekTablicy"
            class="tablica-naglowek"
        >
            Odjazdy – dzisiaj
        </div>


        <div
            id="godziny"
            class="godziny"
        ></div>


    </section>



    <div class="informacja">

        Rozkład jazdy jest przykładowy.
        Dane zostaną później podłączone
        do właściwej bazy rozkładów.

    </div>


</main>



<script>


/* ==========================================
   ODCZYT NUMERU LINII
   ========================================== */

const parametry =
    new URLSearchParams(
        window.location.search
    );


const numerLinii =
    parametry.get("linia");


if (numerLinii) {

    document.getElementById(
        "numerLinii"
    ).textContent = numerLinii;

}

else {

    document.getElementById(
        "numerLinii"
    ).textContent = "?";

}



/* ==========================================
   PRZYKŁADOWE DANE
   ========================================== */

const dane = {

    kierunek1: [

        "04:32",
        "04:52",
        "05:12",
        "05:32",

        "05:52",
        "06:12",
        "06:32",
        "06:52",

        "07:12",
        "07:32",
        "07:52",
        "08:12",

        "08:32",
        "08:52",
        "09:12",
        "09:32",

        "09:52",
        "10:12",
        "10:32",
        "10:52",

        "11:12",
        "11:32",
        "11:52",
        "12:12"

    ],


    kierunek2: [

        "04:40",
        "05:00",
        "05:20",
        "05:40",

        "06:00",
        "06:20",
        "06:40",
        "07:00",

        "07:20",
        "07:40",
        "08:00",
        "08:20",

        "08:40",
        "09:00",
        "09:20",
        "09:40",

        "10:00",
        "10:20",
        "10:40",
        "11:00"

    ]

};



/* ==========================================
   AKTUALNY KIERUNEK
   ========================================== */

let aktualnyKierunek = 0;



/* ==========================================
   WYŚWIETLANIE GODZIN
   ========================================== */

function pokazGodziny() {


    const kontener =
        document.getElementById("godziny");


    kontener.innerHTML = "";


    let lista;


    if (aktualnyKierunek === 0) {

        lista = dane.kierunek1;

    }

    else {

        lista = dane.kierunek2;

    }


    lista.forEach(godzina => {


        const element =
            document.createElement("div");


        element.className =
            "godzina";


        element.textContent =
            godzina;


        kontener.appendChild(element);


    });

}



/* ==========================================
   ZMIANA KIERUNKU
   ========================================== */

function zmienKierunek(numer) {


    aktualnyKierunek = numer;


    const przyciski =
        document.querySelectorAll(
            ".kierunek-btn"
        );


    przyciski.forEach(
        przycisk => {

            przycisk.classList.remove(
                "aktywny"
            );

        }
    );


    przyciski[numer]
        .classList.add("aktywny");


    if (numer === 0) {

        document.getElementById(
            "kierunek"
        ).textContent =
            "METRO MŁOCINY → OLIMPIA";

    }

    else {

        document.getElementById(
            "kierunek"
        ).textContent =
            "OLIMPIA → METRO MŁOCINY";

    }


    pokazGodziny();

}



/* ==========================================
   WYBÓR DNIA
   ========================================== */

function wybierzDzien(dzien) {


    const przyciski =
        document.querySelectorAll(
            ".dzien-btn"
        );


    przyciski.forEach(
        przycisk => {

            przycisk.classList.remove(
                "aktywny"
            );

        }
    );


    const kalendarz =
        document.getElementById(
            "kalendarz"
        );


    kalendarz.style.display =
        "none";


    if (dzien === "dzisiaj") {


        przyciski[0]
            .classList.add("aktywny");


        document.getElementById(
            "naglowekTablicy"
        ).textContent =
            "Odjazdy – dzisiaj";

    }


    if (dzien === "jutro") {


        przyciski[1]
            .classList.add("aktywny");


        document.getElementById(
            "naglowekTablicy"
        ).textContent =
            "Odjazdy – jutro";

    }


    if (dzien === "kalendarz") {


        przyciski[2]
            .classList.add("aktywny");


        kalendarz.style.display =
            "block";


        document.getElementById(
            "naglowekTablicy"
        ).textContent =
            "Odjazdy – wybrany dzień";

    }

}



/* ==========================================
   START
   ========================================== */

pokazGodziny();


</script>


</body>
</html>
