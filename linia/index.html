/* =========================================================

<script>

/* =========================================================
   ZMIENNE
   ========================================================= */

let daneLinii = null;

let numerLinii = null;

let aktualnyKierunek = 0;

let aktualnyWariant = null;

let aktualnyDzien = "dzisiaj";

let wybranaData = new Date();

let wybranyPrzystanek = null;

let wybranyPrzystanekIndex = null;

let wybranyPrzystanekId = null;

let widokKursuAktywny = false;


/* =========================================================
   URL
   ========================================================= */

const parametry =
    new URLSearchParams(
        window.location.search
    );

numerLinii =
    parametry.get("linia");


if (!numerLinii) {

    pokazBlad(
        "Nie podano numeru linii.",
        "Wybierz linię z menu."
    );

} else {

    document.getElementById(
        "numerLinii"
    ).textContent =
        numerLinii;

    pobierzDane();
}


/* =========================================================
   NORMALIZACJA
   ========================================================= */

function normalizujTekst(
    tekst
) {

    return String(
        tekst || ""
    )
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );
}


/* =========================================================
   CZAS
   ========================================================= */

function czasNaMinuty(
    czas
) {

    const dop =
        String(
            czas || ""
        )
        .trim()
        .match(
            /^(\d{1,2}):(\d{2})$/
        );

    if (!dop)
        return null;

    const h =
        Number(dop[1]);

    const m =
        Number(dop[2]);

    if (
        h < 0 ||
        h > 23 ||
        m < 0 ||
        m > 59
    )
        return null;

    return h * 60 + m;
}


/* =========================================================
   WARIANT KURSU
   ========================================================= */

function pobierzWariant(
    k
) {

    if (
        !k ||
        typeof k !== "object"
    )
        return "";

    const wariant =
        k.wariant;

    if (
        wariant &&
        typeof wariant === "object"
    ) {

        return String(
            wariant.litera ||
            wariant.nazwa ||
            ""
        ).trim();
    }

    return String(
        wariant || ""
    ).trim();
}


/* =========================================================
   NŻ
   ========================================================= */

function czyPrzystanekNaZadanie(
    p
) {

    if (!p)
        return false;

    const typ =
        String(
            p.typ || ""
        )
        .trim()
        .toUpperCase();

    if (
        typ === "NŻ" ||
        typ === "NZ"
    )
        return true;

    if (
        p.naZadanie === true ||
        String(
            p.naZadanie
        ).toLowerCase() === "true"
    )
        return true;

    if (
        p.nz === true ||
        String(
            p.nz
        ).toLowerCase() === "true"
    )
        return true;

    if (
        typeof p.nazwa === "string" &&
        p.nazwa.includes("(NŻ)")
    )
        return true;

    return false;
}


/* =========================================================
   POBIERANIE JSON
   ========================================================= */

async function pobierzDane() {

    const adres =
        "../dane/" +
        encodeURIComponent(
            numerLinii
        ) +
        ".json";

    try {

        const odpowiedz =
            await fetch(
                adres,
                {
                    cache: "no-cache"
                }
            );

        if (!odpowiedz.ok) {

            throw new Error(
                "Nie znaleziono pliku JSON dla linii " +
                numerLinii
            );
        }

        let tekst =
            await odpowiedz.text();

        try {

            daneLinii =
                JSON.parse(
                    tekst
                );

        } catch (e) {

            daneLinii =
                JSON.parse(
                    usunPoleGodziny(
                        tekst
                    )
                );
        }

        uruchomStrone();

    } catch (blad) {

        pokazBlad(
            "Błąd ładowania.",
            blad.message
        );
    }
}


/* =========================================================
   USUWANIE GODZINY
   ========================================================= */

function usunPoleGodziny(
    tekst
) {

    const pozycja =
        tekst.search(
            /"godziny"\s*:\s*\[/
        );

    if (pozycja === -1)
        return tekst;

    const poczatekTablicy =
        tekst.indexOf(
            "[",
            pozycja
        );

    if (poczatekTablicy === -1)
        return tekst;

    let poziom = 0;
    let wStringu = false;
    let ucieczka = false;
    let koniecTablicy = -1;

    for (
        let i = poczatekTablicy;
        i < tekst.length;
        i++
    ) {

        const znak =
            tekst[i];

        if (ucieczka) {

            ucieczka = false;
            continue;
        }

        if (
            znak === "\\" &&
            wStringu
        ) {

            ucieczka = true;
            continue;
        }

        if (znak === '"') {

            wStringu =
                !wStringu;

            continue;
        }

        if (wStringu)
            continue;

        if (znak === "[")
            poziom++;

        if (znak === "]") {

            poziom--;

            if (poziom === 0) {

                koniecTablicy =
                    i;

                break;
            }
        }
    }

    if (koniecTablicy === -1)
        return tekst;

    let poczatek =
        pozycja;

    let koniec =
        koniecTablicy + 1;

    while (
        koniec < tekst.length &&
        /\s/.test(
            tekst[koniec]
        )
    )
        koniec++;

    if (
        tekst[koniec] === ","
    )
        koniec++;

    return (
        tekst.substring(
            0,
            poczatek
        ) +
        tekst.substring(
            koniec
        )
        .replace(
            /,\s*,/g,
            ","
        )
        .replace(
            /,\s*}/g,
            "}"
        )
    );
}


/* =========================================================
   ROZKŁAD
   ========================================================= */

function okreslTypDnia(
    data
) {

    const d =
        data.getDay();

    if (d === 6)
        return "sobota";

    if (d === 0)
        return "niedziela";

    return "roboczy";
}


function znajdzRozklad() {

    const rozklady =
        daneLinii.rozkłady ||
        [];

    if (
        !rozklady.length
    )
        return null;

    const typ =
        okreslTypDnia(
            wybranaData
        );

    if (
        typ === "sobota"
    ) {

        const r =
            rozklady.find(
                x =>
                    normalizujTekst(
                        x.nazwa
                    ).includes("sobot")
            );

        if (r)
            return r;
    }

    if (
        typ === "niedziela"
    ) {

        const r =
            rozklady.find(
                x => {

                    const n =
                        normalizujTekst(
                            x.nazwa
                        );

                    return (
                        n.includes("niedziel") ||
                        n.includes("swiat")
                    );
                }
            );

        if (r)
            return r;
    }

    if (
        typ === "roboczy"
    ) {

        const r =
            rozklady.find(
                x => {

                    const n =
                        normalizujTekst(
                            x.nazwa
                        );

                    return (
                        n.includes("piatk") ||
                        n.includes("poniedzial")
                    );
                }
            );

        if (r)
            return r;
    }

    return rozklady[0];
}

/* =========================================================
   PRZYSTANEK
   ========================================================= */

function ustawWybranyPrzystanek(
    p,
    index
) {

    if (!p) {

        wybranyPrzystanek = null;
        wybranyPrzystanekIndex = null;
        wybranyPrzystanekId = null;

        return;
    }

    wybranyPrzystanek = p;

    wybranyPrzystanekIndex =
        Number.isInteger(
            Number(index)
        )
            ? Number(index)
            : null;

    wybranyPrzystanekId = {

        kierunek:
            Number(
                aktualnyKierunek
            ),

        index:
            wybranyPrzystanekIndex,

        lp:
            p.lp !== undefined
                ? String(p.lp).trim()
                : "",

        nr:
            p.nr !== undefined
                ? String(p.nr).trim()
                : "",

        nazwa:
            String(
                p.nazwa || ""
            ).trim()
    };
}


function znajdzPrzystanek(
    przystanki,
    identyfikator
) {

    if (
        !Array.isArray(przystanki) ||
        identyfikator === null ||
        identyfikator === undefined
    )
        return null;

    const szukany =
        String(
            identyfikator
        ).trim();

    if (
        szukany
            .toLowerCase()
            .startsWith("idx:")
    ) {

        const idx =
            Number(
                szukany.substring(4)
            );

        return (
            Number.isInteger(idx) &&
            idx >= 0 &&
            idx < przystanki.length
        )
            ? przystanki[idx]
            : null;
    }

    const poNr =
        przystanki.find(
            p =>
                String(
                    p.nr || ""
                ).trim() === szukany
        );

    if (poNr)
        return poNr;

    const poNazwie =
        przystanki.find(
            p =>
                String(
                    p.nazwa || ""
                ).trim() === szukany
        );

    if (poNazwie)
        return poNazwie;

    const normalny =
        normalizujTekst(
            szukany
        );

    return przystanki.find(
        p =>
            normalizujTekst(
                p.nazwa
            ) === normalny
    ) || null;
}

/* =========================================================
   WARIANTY
   ========================================================= */

function zbierzWariantyDlaKierunku(
    kierunek
) {

    const set =
        new Set();

    (
        kierunek.przystanki || []
    ).forEach(
        p =>
            (
                p.kursy || []
            ).forEach(
                k => {

                    const w =
                        pobierzWariant(k);

                    if (w)
                        set.add(w);
                }
            )
    );

    return Array
        .from(set)
        .sort(
            (a,b) =>
                a.localeCompare(
                    b,
                    "pl"
                )
        );
}


/* =========================================================
   PIERWSZY PRZYSTANEK WARIANTU
   ========================================================= */

function znajdzPierwszyPrzystanekWariantu(
    kierunek,
    wariant
) {

    const szukany =
        String(
            wariant || ""
        ).trim();

    const przystanki =
        kierunek.przystanki || [];

    for (
        let i = 0;
        i < przystanki.length;
        i++
    ) {

        const obsluguje =
            (
                przystanki[i].kursy || []
            ).some(
                k =>
                    pobierzWariant(k) ===
                    szukany
            );

        if (obsluguje)
            return i;
    }

    return -1;
}


/* =========================================================
   DOMYŚLNY WARIANT
   ========================================================= */

function znajdzDomyslnyWariant(
    kierunek
) {

    const starty =
        new Map();

    (
        kierunek.przystanki || []
    ).forEach(
        (
            p,
            index
        ) => {

            (
                p.kursy || []
            ).forEach(
                k => {

                    const w =
                        pobierzWariant(k);

                    if (
                        !starty.has(w)
                    ) {

                        starty.set(
                            w,
                            index
                        );
                    }
                }
            );
        }
    );

    const lista =
        Array.from(
            starty.entries()
        );

    if (!lista.length)
        return "";

    lista.sort(
        (a,b) => {

            if (
                a[1] !== b[1]
            )
                return a[1] - b[1];

            if (
                a[0] === "" &&
                b[0] !== ""
            )
                return -1;

            if (
                a[0] !== "" &&
                b[0] === ""
            )
                return 1;

            return a[0].localeCompare(
                b[0],
                "pl"
            );
        }
    );

    return lista[0][0];
}


/* =========================================================
   KURS BAZOWY
   ========================================================= */

function znajdzKursBazowy(
    kierunek,
    wariant
) {

    const mapa =
        new Map();

    (
        kierunek.przystanki || []
    ).forEach(
        (
            p,
            index
        ) => {

            (
                p.kursy || []
            ).forEach(
                k => {

                    if (
                        k.numer === undefined ||
                        k.numer === null
                    )
                        return;

                    const numer =
                        String(
                            k.numer
                        ).trim();

                    const w =
                        pobierzWariant(k);

                    if (!numer)
                        return;

                    const klucz =
                        numer +
                        "||" +
                        w;

                    if (
                        !mapa.has(klucz)
                    ) {

                        mapa.set(
                            klucz,
                            {
                                numer:
                                    k.numer,

                                wariant:
                                    w,

                                punkty: []
                            }
                        );
                    }

                    mapa
                        .get(klucz)
                        .punkty
                        .push({
                            index,
                            czas: k.czas
                        });
                }
            );
        }
    );

    const kursy =
        Array.from(
            mapa.values()
        )
        .filter(
            k =>
                k.wariant ===
                String(
                    wariant || ""
                ).trim()
        );

    kursy.forEach(
        k => {

            k.punkty.sort(
                (a,b) =>
                    a.index -
                    b.index
            );

            const pierwszy =
                k.punkty.find(
                    p =>
                        czasNaMinuty(
                            p.czas
                        ) !== null
                );

            k.startIndex =
                pierwszy
                    ? pierwszy.index
                    : 999999;

            k.startMinuty =
                pierwszy
                    ? czasNaMinuty(
                        pierwszy.czas
                    )
                    : null;
        }
    );

    if (!kursy.length)
        return null;

    const kursy11 =
        kursy.filter(
            k => {

                if (
                    k.startMinuty === null
                )
                    return false;

                return (
                    Math.floor(
                        k.startMinuty / 60
                    ) % 24 === 11
                );
            }
        );

    if (kursy11.length) {

        kursy11.sort(
            (a,b) =>
                a.startMinuty -
                b.startMinuty
        );

        return kursy11[0];
    }

    kursy.sort(
        (a,b) => {

            const aa =
                a.startMinuty === null
                    ? 999999
                    : a.startMinuty;

            const bb =
                b.startMinuty === null
                    ? 999999
                    : b.startMinuty;

            return aa - bb;
        }
    );

    return kursy[0];
}


/* =========================================================
   CZASY KURSU
   ========================================================= */

function pobierzCzasyKursu(
    kierunek,
    kurs
) {

    const przystanki =
        kierunek.przystanki || [];

    const wynik =
        new Array(
            przystanki.length
        ).fill(null);

    if (!kurs)
        return wynik;

    const numer =
        String(
            kurs.numer
        ).trim();

    const wariant =
        String(
            kurs.wariant || ""
        ).trim();

    przystanki.forEach(
        (
            p,
            index
        ) => {

            const k =
                (
                    p.kursy || []
                ).find(
                    x =>
                        String(
                            x.numer
                        ).trim() === numer &&
                        pobierzWariant(x) === wariant
                );

            if (!k)
                return;

            if (
                czasNaMinuty(
                    k.czas
                ) !== null
            ) {

                wynik[index] =
                    k.czas;
            }
        }
    );

    return wynik;
}


/* =========================================================
   CZAS SUMOWANY
   ========================================================= */

function obliczSumowaneCzasy(
    czasy
) {

    const wynik =
        new Array(
            czasy.length
        ).fill(null);

    let pierwszy = null;

    for (
        let i = 0;
        i < czasy.length;
        i++
    ) {

        const t =
            czasNaMinuty(
                czasy[i]
            );

        if (t !== null) {

            pierwszy = t;
            break;
        }
    }

    if (pierwszy === null)
        return wynik;

    let poprzedni =
        pierwszy;

    let suma = 0;

    for (
        let i = 0;
        i < czasy.length;
        i++
    ) {

        const t =
            czasNaMinuty(
                czasy[i]
            );

        if (t === null)
            continue;

        let roznica =
            t - poprzedni;

        if (
            roznica < 0
        )
            roznica += 1440;

        suma += roznica;

        wynik[i] =
            suma;

        poprzedni =
            t;
    }

    const pierwszyIndex =
        czasy.findIndex(
            t =>
                czasNaMinuty(t) !== null
        );

    if (
        pierwszyIndex !== -1
    )
        wynik[pierwszyIndex] = 0;

    return wynik;
}


/* =========================================================
   GŁÓWNY WIDOK
   ========================================================= */

function pokazRozklad() {

    if (!daneLinii)
        return;

    const rozklad =
        znajdzRozklad();

    const kontener =
        document.getElementById(
            "przystanki"
        );

    if (
        !rozklad ||
        !Array.isArray(
            rozklad.kierunki
        ) ||
        !rozklad.kierunki.length
    ) {

        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak danych rozkładu.' +
            '</div>';

        return;
    }

    if (
        aktualnyKierunek >=
        rozklad.kierunki.length
    )
        aktualnyKierunek = 0;

    generujKierunki();

    if (
        widokKursuAktywny
    )
        return;

    if (
        wybranyPrzystanek &&
        wybranyPrzystanekIndex !== null
    ) {

        const kierunek =
            rozklad.kierunki[
                aktualnyKierunek
            ];

        const idx =
            Number(
                wybranyPrzystanekIndex
            );

        if (
            idx >= 0 &&
            idx <
            kierunek.przystanki.length
        ) {

            pokazRozkladWybranegoPrzystanku(
                rozklad,
                kierunek.przystanki[idx]
            );

            return;
        }
    }

    pokazListePrzystankow(
        rozklad
    );
}


/* =========================================================
   LISTA PRZYSTANKÓW
   ========================================================= */

function pokazListePrzystankow(
    rozklad
) {

    const kontener =
        document.getElementById(
            "przystanki"
        );

    const kierunek =
        rozklad.kierunki[
            aktualnyKierunek
        ];

    const przystanki =
        kierunek.przystanki || [];

    document.getElementById(
        "typRozkładu"
    ).style.display =
        "none";

    document.querySelector(
        ".dni"
    ).style.display =
        "none";

    document.getElementById(
        "kalendarz"
    ).style.display =
        "none";

    kontener.innerHTML =
        "";


    /* =====================================================
       USTALENIE WARIANTU
       ===================================================== */

    if (
        aktualnyWariant === null
    ) {

        aktualnyWariant =
            znajdzDomyslnyWariant(
                kierunek
            );
    }


    const warianty =
        zbierzWariantyDlaKierunku(
            kierunek
        );


    const istniejeWariant =
        new Set(
            przystanki.flatMap(
                p =>
                    (
                        p.kursy || []
                    ).map(
                        k =>
                            pobierzWariant(k)
                    )
            )
        );


    if (
        !istniejeWariant.has(
            String(
                aktualnyWariant || ""
            )
        )
    ) {

        aktualnyWariant =
            znajdzDomyslnyWariant(
                kierunek
            );
    }


    /* =====================================================
       PRZYCISKI WARIANTÓW
       ===================================================== */

    const wp =
        document.getElementById(
            "warianty-pojemnik"
        );

    const wprz =
        document.getElementById(
            "warianty-przyciski"
        );

    if (
        wp &&
        wprz &&
        warianty.length
    ) {

        wp.style.display =
            "flex";

        wprz.innerHTML =
            "";

        /*
         * Główny wariant.
         */

        if (
            istniejeWariant.has("")
        ) {

            const btn =
                document.createElement(
                    "button"
                );

            btn.className =
                "wariant-btn" +
                (
                    aktualnyWariant === ""
                        ? " aktywny"
                        : ""
                );

            btn.textContent =
                "—";

            btn.title =
                "Wariant główny";

            btn.onclick =
                () => {

                    aktualnyWariant =
                        "";

                    pokazRozklad();
                };

            wprz.appendChild(
                btn
            );
        }

        warianty.forEach(
            w => {

                const btn =
                    document.createElement(
                        "button"
                    );

                btn.className =
                    "wariant-btn" +
                    (
                        aktualnyWariant === w
                            ? " aktywny"
                            : ""
                    );

                btn.textContent =
                    w;

                btn.onclick =
                    () => {

                        aktualnyWariant =
                            w;

                        pokazRozklad();
                    };

                wprz.appendChild(
                    btn
                );
            }
        );

    } else if (wp) {

        wp.style.display =
            "none";
    }


    /* =====================================================
       PIERWSZY PRZYSTANEK WARIANTU
       ===================================================== */

    const pierwszy =
        znajdzPierwszyPrzystanekWariantu(
            kierunek,
            aktualnyWariant
        );


    /*
     * Dokładnie tutaj zaczyna się
     * wybrany wariant.
     */

    const pierwszyWariant =
        pierwszy >= 0
            ? pierwszy
            : 0;


    /* =====================================================
       KURS BAZOWY
       ===================================================== */

    const kursBazowy =
        znajdzKursBazowy(
            kierunek,
            aktualnyWariant
        );

    const czasyKursu =
        pobierzCzasyKursu(
            kierunek,
            kursBazowy
        );

    const czasySumowane =
        obliczSumowaneCzasy(
            czasyKursu
        );


    /* =====================================================
       USTALENIE PRZYSTANKÓW OBSŁUGIWANYCH
       ===================================================== */

    const aktywne =
        przystanki.map(
            p =>
                (
                    p.kursy || []
                ).some(
                    k =>
                        pobierzWariant(k) ===
                        String(
                            aktualnyWariant || ""
                        ).trim()
                )
        );


    /*
     * Ostatni faktycznie obsługiwany
     * przystanek wariantu.
     */

    let ostatni =
        -1;

    aktywne.forEach(
        (
            aktywny,
            index
        ) => {

            if (
                aktywny &&
                index >= pierwszyWariant
            )
                ostatni = index;
        }
    );


    /* =====================================================
       OŚ TRASY
       ===================================================== */

    const N =
        przystanki.length;

    const ROW_HEIGHT =
        44;

    const TRACK_W =
        22;

    const SPINE_X =
        44;

    const LEFT_X =
        SPINE_X -
        TRACK_W;

    const RIGHT_X =
        SPINE_X +
        TRACK_W;

    const SVG_W =
        RIGHT_X +
        16;


    /*
     * Tworzymy krawędzie osobno dla każdego
     * NUMERU KURSU + WARIANTU.
     *
     * Dzięki temu warianty nie mieszają się.
     */

    const tripPaths =
        new Map();


    przystanki.forEach(
        (
            p,
            index
        ) => {

            (
                p.kursy || []
            ).forEach(
                k => {

                    if (
                        k.numer === undefined ||
                        k.numer === null
                    )
                        return;

                    const numer =
                        String(
                            k.numer
                        ).trim();

                    const wariant =
                        pobierzWariant(k);

                    const klucz =
                        numer +
                        "||" +
                        wariant;

                    if (
                        !tripPaths.has(
                            klucz
                        )
                    ) {

                        tripPaths.set(
                            klucz,
                            []
                        );
                    }

                    tripPaths
                        .get(klucz)
                        .push(index);
                }
            );
        }
    );


    /*
     * Krawędzie tylko wybranego wariantu
     * są traktowane jako aktywne.
     */

    const edges =
        [];

    const edgeKeys =
        new Set();


    tripPaths.forEach(
        (
            path,
            klucz
        ) => {

            const parts =
                klucz.split(
                    "||"
                );

            const wariant =
                parts.length > 1
                    ? parts[1]
                    : "";

            path.sort(
                (a,b) =>
                    a - b
            );

            for (
                let j = 0;
                j < path.length - 1;
                j++
            ) {

                const u =
                    path[j];

                const v =
                    path[j + 1];

                const key =
                    u + "," + v;

                let edge =
                    edges.find(
                        e =>
                            e.u === u &&
                            e.v === v
                    );

                if (!edge) {

                    edge = {
                        u,
                        v,
                        warianty:
                            new Set()
                    };

                    edges.push(
                        edge
                    );
                }

                edge.warianty.add(
                    wariant
                );

                edgeKeys.add(
                    key
                );
            }
        }
    );


    /*
     * Ustalamy główną oś tylko wizualnie.
     *
     * Nie wpływa ona na wybór wariantu.
     */

    let mainWariant =
        "";

    const wszystkieWarianty =
        Array.from(
            new Set(
                przystanki.flatMap(
                    p =>
                        (
                            p.kursy || []
                        ).map(
                            k =>
                                pobierzWariant(k)
                        )
                )
            )
        );


    if (
        wszystkieWarianty.includes("")
    ) {

        mainWariant =
            "";

    } else if (
        wszystkieWarianty.includes("A")
    ) {

        mainWariant =
            "A";

    } else {

        mainWariant =
            znajdzDomyslnyWariant(
                kierunek
            );
    }


    const mainAxis =
        przystanki.map(
            p =>
                (
                    p.kursy || []
                ).some(
                    k =>
                        pobierzWariant(k) ===
                        mainWariant
                )
        );


    /* =====================================================
       GENEROWANIE LISTY
       ===================================================== */

    const lista =
        document.createElement(
            "div"
        );

    lista.className =
        "lista-przystankow";


    przystanki.forEach(
        (
            p,
            i
        ) => {

            const jestObslugiwany =
                aktywne[i];

            const przedStartem =
                i <
                pierwszyWariant;

            /*
             * Nieaktywne:
             *
             * - wszystko przed początkiem wariantu
             * - przystanki, których wariant nie obsługuje
             */

            const aktywnyWizualnie =
                jestObslugiwany &&
                !przedStartem;


            const pierwszyAktywny =
                aktywnyWizualnie &&
                i === pierwszyWariant;


            const ostatniAktywny =
                aktywnyWizualnie &&
                i === ostatni;


            const btn =
                document.createElement(
                    "button"
                );

            btn.type =
                "button";

            btn.className =
                "przystanek-btn" +
                (
                    aktywnyWizualnie
                        ? ""
                        : " inactive"
                );


            /* =================================================
               SVG
               ================================================= */

            let inactiveLines =
                "";

            let activeLines =
                "";


            edges.forEach(
                e => {

                    /*
                     * Krawędź należy do wariantu
                     * tylko wtedy, gdy wariant
                     * znajduje się w Set.
                     */

                    const edgeWariantu =
                        e.warianty.has(
                            String(
                                aktualnyWariant || ""
                            ).trim()
                        );


                    /*
                     * Krawędzie przed początkiem
                     * wariantu zawsze są szare.
                     */

                    const edgeAktywny =
                        edgeWariantu &&
                        e.u >=
                        pierwszyWariant;


                    const color =
                        edgeAktywny
                            ? "#000"
                            : "#ccc";


                    const width =
                        edgeAktywny
                            ? 2.5
                            : 2;


                    let x1;
                    let y1;
                    let x2;
                    let y2;


                    /*
                     * Jeżeli główna oś przechodzi
                     * przez oba przystanki,
                     * prowadzimy ją środkiem.
                     */

                    let track =
                        0;


                    if (
                        mainAxis[e.u] &&
                        mainAxis[e.v]
                    ) {

                        track =
                            0;

                    } else {

                        /*
                         * Odgałęzienie wariantowe
                         * prowadzimy prawą stroną.
                         */

                        track =
                            1;
                    }


                    if (
                        track === 0
                    ) {

                        if (
                            i === e.u
                        ) {

                            x1 =
                                SPINE_X;

                            y1 =
                                ROW_HEIGHT / 2;

                            x2 =
                                SPINE_X;

                            y2 =
                                ROW_HEIGHT;

                        } else if (
                            i > e.u &&
                            i < e.v
                        ) {

                            x1 =
                                SPINE_X;

                            y1 = 0;

                            x2 =
                                SPINE_X;

                            y2 =
                                ROW_HEIGHT;

                        } else if (
                            i === e.v
                        ) {

                            x1 =
                                SPINE_X;

                            y1 = 0;

                            x2 =
                                SPINE_X;

                            y2 =
                                ROW_HEIGHT / 2;

                        } else {

                            return;
                        }

                    } else {

                        if (
                            i === e.u
                        ) {

                            x1 =
                                mainAxis[e.u]
                                    ? SPINE_X
                                    : RIGHT_X;

                            y1 =
                                ROW_HEIGHT / 2;

                            x2 =
                                RIGHT_X;

                            y2 =
                                ROW_HEIGHT;

                        } else if (
                            i > e.u &&
                            i < e.v
                        ) {

                            x1 =
                                RIGHT_X;

                            y1 = 0;

                            x2 =
                                RIGHT_X;

                            y2 =
                                ROW_HEIGHT;

                        } else if (
                            i === e.v
                        ) {

                            x1 =
                                RIGHT_X;

                            y1 = 0;

                            x2 =
                                mainAxis[e.v]
                                    ? SPINE_X
                                    : RIGHT_X;

                            y2 =
                                ROW_HEIGHT / 2;

                        } else {

                            return;
                        }
                    }


                    const line =
                        `<line
                            x1="${x1}"
                            y1="${y1}"
                            x2="${x2}"
                            y2="${y2}"
                            stroke="${color}"
                            stroke-width="${width}"
                            stroke-linecap="round"
                        />`;


                    if (
                        edgeAktywny
                    )
                        activeLines +=
                            line;
                    else
                        inactiveLines +=
                            line;
                }
            );


            /* =================================================
               POZYCJA WĘZŁA
               ================================================= */

            const nodeX =
                mainAxis[i]
                    ? SPINE_X
                    : RIGHT_X;


            /*
             * Kolor:
             *
             * przed wariantem = szary
             * pierwszy = czarny
             * pozostałe = czerwone
             */

            const nodeColor =
                !aktywnyWizualnie
                    ? "#ccc"
                    : (
                        pierwszyAktywny
                            ? "#000"
                            : "#e42313"
                    );


            let nodeSvg =
                "";


            /*
             * PIERWSZY PRZYSTANEK WARIANTU
             * = ZAWSZE KWADRAT
             *
             * OSTATNI PRZYSTANEK
             * również pozostaje kwadratem.
             */

            if (
                pierwszyAktywny ||
                ostatniAktywny
            ) {

                if (
                    czyPrzystanekNaZadanie(p)
                ) {

                    nodeSvg =
                        `<rect
                            x="${nodeX - 6.75}"
                            y="15.25"
                            width="13.5"
                            height="13.5"
                            fill="#fff"
                            stroke="${nodeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    nodeSvg =
                        `<rect
                            x="${nodeX - 8}"
                            y="14"
                            width="16"
                            height="16"
                            fill="${nodeColor}"
                            stroke="none"
                        />`;
                }

            } else {

                if (
                    czyPrzystanekNaZadanie(p)
                ) {

                    nodeSvg =
                        `<circle
                            cx="${nodeX}"
                            cy="22"
                            r="6.75"
                            fill="#fff"
                            stroke="${nodeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    nodeSvg =
                        `<circle
                            cx="${nodeX}"
                            cy="22"
                            r="8"
                            fill="${nodeColor}"
                            stroke="none"
                        />`;
                }
            }


            const svg =
                `<svg
                    width="${SVG_W}"
                    height="${ROW_HEIGHT}"
                    style="display:block;overflow:visible;"
                >
                    ${inactiveLines}
                    ${activeLines}
                    ${nodeSvg}
                </svg>`;


            const nodeWrapper =
                document.createElement(
                    "div"
                );

            nodeWrapper.className =
                "node-wrapper";

            nodeWrapper.style.width =
                SVG_W + "px";

            nodeWrapper.innerHTML =
                svg;


            /* =================================================
               CZAS PRZEJAZDU
               ================================================= */

            const czas =
                document.createElement(
                    "div"
                );

            czas.className =
                "kolumna-czas-przejazdu";


            if (
                pierwszyAktywny
            )
                czas.classList.add(
                    "pierwszy"
                );


            if (
                aktywnyWizualnie &&
                czasySumowane[i] !== null &&
                czasySumowane[i] !== undefined
            ) {

                czas.textContent =
                    czasySumowane[i] +
                    " min";

            } else {

                czas.textContent =
                    "";
            }


            /* =================================================
               NAZWA
               ================================================= */

            const nazwa =
                document.createElement(
                    "div"
                );

            nazwa.className =
                "przystanek-nazwa";

            nazwa.textContent =
                p.nazwa ||
                "Przystanek";


            /* =================================================
               NUMER
               ================================================= */

            const nr =
                document.createElement(
                    "div"
                );

            nr.className =
                "przystanek-nr";

            nr.textContent =
                p.nr || "";


            btn.appendChild(
                czas
            );

            btn.appendChild(
                nodeWrapper
            );

            btn.appendChild(
                nazwa
            );

            btn.appendChild(
                nr
            );


            btn.onclick =
                () =>
                    wybierzPrzystanek(
                        p,
                        i
                    );


            lista.appendChild(
                btn
            );
        }
    );


    kontener.appendChild(
        lista
    );
}


/* =========================================================
   WYBÓR PRZYSTANKU
   ========================================================= */

function wybierzPrzystanek(
    p,
    index
) {

    ustawWybranyPrzystanek(
        p,
        index
    );

    widokKursuAktywny =
        false;

    aktualizujHistorieURL(
        "idx:" + index
    );

    pokazRozklad();

    requestAnimationFrame(
        () => {

            window.scrollTo(
                0,
                0
            );
        }
    );
}


/* =========================================================
   WIDOK PRZYSTANKU
   ========================================================= */

function pokazRozkladWybranegoPrzystanku(
    rozklad,
    przystanek
) {

    const kontener =
        document.getElementById(
            "przystanki"
        );

    document.querySelector(
        ".dni"
    ).style.display =
        "flex";

    document.getElementById(
        "typRozkładu"
    ).style.display =
        "block";

    document.getElementById(
        "typRozkładu"
    ).textContent =
        rozklad.nazwa ||
        "Rozkład jazdy";

    document.getElementById(
        "warianty-pojemnik"
    ).style.display =
        "none";

    kontener.innerHTML =
        "";


    const naglowek =
        document.createElement(
            "div"
        );

    naglowek.className =
        "naglowek-przystanku-widok";

    naglowek.innerHTML =
        `<div class="nazwa">
            ${przystanek.nazwa || ""}
        </div>

        <div class="numer">
            ${przystanek.nr || ""}
        </div>`;


    kontener.appendChild(
        naglowek
    );


    const blok =
        document.createElement(
            "div"
        );

    blok.className =
        "przystanek";


    const godziny =
        document.createElement(
            "div"
        );

    godziny.className =
        "godziny";


    if (
        !przystanek.kursy ||
        !przystanek.kursy.length
    ) {

        godziny.innerHTML =
            '<div class="brak-godzin">' +
            'Brak odjazdów' +
            '</div>';

    } else {

        let aktGodz = null;
        let wiersz = null;


        przystanek.kursy.forEach(
            k => {

                const dop =
                    String(
                        k.czas || ""
                    )
                    .trim()
                    .match(
                        /^(\d{1,2}):(\d{2})$/
                    );

                if (!dop)
                    return;

                const g =
                    Number(
                        dop[1]
                    );

                const m =
                    dop[2];


                if (
                    aktGodz !== g
                ) {

                    aktGodz =
                        g;

                    wiersz =
                        document.createElement(
                            "div"
                        );

                    wiersz.className =
                        "wiersz-godziny";

                    wiersz.innerHTML =
                        `<div class="kolumna-godzina">
                            ${String(g).padStart(2,"0")}
                        </div>`;

                    godziny.appendChild(
                        wiersz
                    );
                }


                const kol =
                    document.createElement(
                        "div"
                    );

                kol.className =
                    "kolumna-minuta";


                const litera =
                    pobierzWariant(
                        k
                    );


                kol.innerHTML =
                    `<span class="minuta-z-wariantem">

                        <span class="minuta">
                            ${m}
                        </span>

                        ${
                            litera
                                ? `<span class="wariant-minuty">
                                    ${litera}
                                  </span>`
                                : ""
                        }

                    </span>`;


                if (
                    k.numer !== undefined &&
                    k.numer !== null
                ) {

                    kol.title =
                        "Zobacz przebieg kursu " +
                        k.numer +
                        (
                            litera
                                ? " (" +
                                  litera +
                                  ")"
                                : ""
                        );


                    kol.onclick =
                        () =>
                            pokazCalyKurs(
                                k.numer,
                                litera
                            );
                }


                wiersz.appendChild(
                    kol
                );
            }
        );
    }


    blok.appendChild(
        godziny
    );


    /*
     * LEGENDA WARIANTÓW
     */

    const uzyte =
        new Set();


    (
        przystanek.kursy || []
    ).forEach(
        k => {

            const w =
                pobierzWariant(k);

            if (w)
                uzyte.add(w);
        }
    );


    if (
        uzyte.size &&
        Array.isArray(
            rozklad.warianty
        )
    ) {

        const leg =
            document.createElement(
                "div"
            );

        leg.className =
            "legenda-wariantow";


        uzyte.forEach(
            litera => {

                const w =
                    rozklad.warianty.find(
                        x =>
                            String(
                                x.litera || ""
                            ).trim() ===
                            litera
                    );

                if (!w)
                    return;

                const element =
                    document.createElement(
                        "div"
                    );

                element.className =
                    "legenda-element";

                element.innerHTML =
                    `<span class="legenda-litera">
                        ${litera}
                    </span>

                    <span class="legenda-separator">
                        -
                    </span>

                    <span class="legenda-opis">
                        ${w.opis || ""}
                    </span>`;

                leg.appendChild(
                    element
                );
            }
        );

        blok.appendChild(
            leg
        );
    }


    kontener.appendChild(
        blok
    );


    requestAnimationFrame(
        () => {

            window.scrollTo({
                top: 0,
                left: 0,
                behavior: "auto"
            });

            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
        }
    );
}


/* =========================================================
   CAŁY KURS
   ========================================================= */

function pokazCalyKurs(
    nrKursu,
    wariantKursu = null
) {

    widokKursuAktywny =
        true;

    const rozklad =
        znajdzRozklad();

    if (
        !rozklad ||
        !rozklad.kierunki ||
        !rozklad.kierunki[
            aktualnyKierunek
        ]
    )
        return;


    const kierunek =
        rozklad.kierunki[
            aktualnyKierunek
        ];

    const przystanki =
        kierunek.przystanki || [];


    const numer =
        String(
            nrKursu
        ).trim();

    const wariant =
        String(
            wariantKursu || ""
        ).trim();


    const kursPrzystanki =
        [];


    przystanki.forEach(
        (
            p,
            originalIndex
        ) => {

            const k =
                (
                    p.kursy || []
                ).find(
                    x =>
                        String(
                            x.numer
                        ).trim() === numer &&
                        (
                            wariantKursu === null ||
                            pobierzWariant(x) === wariant
                        )
                );


            if (k) {

                kursPrzystanki.push({
                    nazwa:
                        p.nazwa,

                    nr:
                        p.nr,

                    nz:
                        czyPrzystanekNaZadanie(p),

                    czas:
                        k.czas,

                    wariant:
                        pobierzWariant(k),

                    originalIndex
                });
            }
        }
    );


    const kontener =
        document.getElementById(
            "przystanki"
        );

    document.getElementById(
        "typRozkładu"
    ).style.display =
        "block";

    document.getElementById(
        "typRozkładu"
    ).textContent =
        "Przebieg kursu";

    document.querySelector(
        ".dni"
    ).style.display =
        "none";

    document.getElementById(
        "warianty-pojemnik"
    ).style.display =
        "none";

    kontener.innerHTML =
        "";


    let stopIndex =
        -1;


    if (
        wybranyPrzystanekIndex !== null
    ) {

        stopIndex =
            kursPrzystanki.findIndex(
                p =>
                    p.originalIndex ===
                    Number(
                        wybranyPrzystanekIndex
                    )
            );
    }


    const currentStopName =
        stopIndex >= 0
            ? kursPrzystanki[
                stopIndex
            ].nazwa
            : (
                kursPrzystanki.length
                    ? kursPrzystanki[0].nazwa
                    : ""
            );


    const lastStopName =
        kursPrzystanki.length
            ? kursPrzystanki[
                kursPrzystanki.length - 1
            ].nazwa
            : "";


    const widok =
        document.createElement(
            "div"
        );

    widok.className =
        "kurs-widok";


    widok.innerHTML =
        `<div class="kurs-naglowek">

            <div class="kurs-tytul">
                ${currentStopName}
                &rarr;
                ${lastStopName}
            </div>

            <div class="kurs-informacja">

                Kurs ${numer}

                ${
                    wariant
                        ? " | Wariant " +
                          wariant
                        : ""
                }

                |
                Przebieg przez
                ${kursPrzystanki.length}
                przystanków

            </div>

        </div>`;


    const lista =
        document.createElement(
            "div"
        );

    lista.className =
        "kurs-lista";


    const startIndex =
        stopIndex >= 0
            ? stopIndex
            : 0;


    const baseTime =
        kursPrzystanki.length
            ? czasNaMinuty(
                kursPrzystanki[
                    startIndex
                ].czas
            )
            : 0;


    kursPrzystanki.forEach(
        (
            el,
            index
        ) => {

            const isPast =
                stopIndex >= 0 &&
                index < stopIndex;

            const isCurrent =
                stopIndex >= 0 &&
                index === stopIndex;


            const wiersz =
                document.createElement(
                    "div"
                );

            wiersz.className =
                "kurs-przystanek" +
                (
                    isCurrent
                        ? " aktywny"
                        : ""
                );


            let diffText =
                "";


            if (!isPast) {

                let diff =
                    czasNaMinuty(
                        el.czas
                    ) -
                    baseTime;

                if (
                    diff < 0
                )
                    diff += 1440;

                diffText =
                    diff +
                    " min";
            }


            const kolor =
                isPast
                    ? "#ccc"
                    : (
                        isCurrent
                            ? "#000"
                            : "#e42313"
                    );


            const topColor =
                isPast ||
                isCurrent
                    ? "#ccc"
                    : "#000";


            const bottomColor =
                isPast
                    ? "#ccc"
                    : "#000";


            let svg =
                `<svg
                    width="40"
                    height="44"
                    style="display:block;overflow:visible;"
                >`;


            if (index > 0) {

                svg +=
                    `<line
                        x1="20"
                        y1="0"
                        x2="20"
                        y2="22"
                        stroke="${topColor}"
                        stroke-width="2.5"
                    />`;
            }


            if (
                index <
                kursPrzystanki.length - 1
            ) {

                svg +=
                    `<line
                        x1="20"
                        y1="22"
                        x2="20"
                        y2="44"
                        stroke="${bottomColor}"
                        stroke-width="2.5"
                    />`;
            }


            if (
                index === 0 ||
                index ===
                kursPrzystanki.length - 1
            ) {

                if (el.nz) {

                    svg +=
                        `<rect
                            x="13.25"
                            y="15.25"
                            width="13.5"
                            height="13.5"
                            fill="#fff"
                            stroke="${kolor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    svg +=
                        `<rect
                            x="12"
                            y="14"
                            width="16"
                            height="16"
                            fill="${kolor}"
                            stroke="none"
                        />`;
                }

            } else {

                if (el.nz) {

                    svg +=
                        `<circle
                            cx="20"
                            cy="22"
                            r="6.75"
                            fill="#fff"
                            stroke="${kolor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    svg +=
                        `<circle
                            cx="20"
                            cy="22"
                            r="8"
                            fill="${kolor}"
                            stroke="none"
                        />`;
                }
            }


            svg +=
                "</svg>";


            const textColor =
                isPast
                    ? "#aaa"
                    : "#000";


            wiersz.innerHTML =
                `<div
                    class="kurs-czas-rel"
                    style="color:${isPast ? "#ccc" : "#888"};"
                >
                    ${diffText}
                </div>

                <div
                    class="node-wrapper"
                    style="width:40px;"
                >
                    ${svg}
                </div>

                <div
                    class="kurs-nazwa-box"
                    style="
                        color:${textColor};
                        font-weight:${isCurrent ? 900 : 600};
                    "
                >
                    ${el.nazwa || ""}
                </div>

                <div
                    class="kurs-nr"
                    style="color:${isPast ? "#ccc" : "#777"};"
                >
                    ${el.nr || ""}
                </div>

                <div
                    class="kurs-czas-abs"
                    style="
                        color:${textColor};
                        font-weight:${isCurrent ? 900 : 600};
                    "
                >
                    ${el.czas || ""}
                </div>`;


            lista.appendChild(
                wiersz
            );
        }
    );


    widok.appendChild(
        lista
    );

    kontener.appendChild(
        widok
    );
}


/* =========================================================
   DNI
   ========================================================= */

function wybierzDzien(
    dzien
) {

    aktualnyDzien =
        dzien;

    document
        .querySelectorAll(
            ".dzien-btn"
        )
        .forEach(
            b =>
                b.classList.remove(
                    "aktywny"
                )
        );

    document.getElementById(
        "kalendarz"
    ).style.display =
        "none";


    if (
        dzien === "dzisiaj"
    ) {

        document.getElementById(
            "dzisiajBtn"
        ).classList.add(
            "aktywny"
        );

        wybranaData =
            new Date();
    }


    if (
        dzien === "jutro"
    ) {

        document.getElementById(
            "jutroBtn"
        ).classList.add(
            "aktywny"
        );

        wybranaData =
            new Date();

        wybranaData.setDate(
            wybranaData.getDate() + 1
        );
    }


    if (
        dzien === "kalendarz"
    ) {

        document.getElementById(
            "kalendarzBtn"
        ).classList.add(
            "aktywny"
        );

        document.getElementById(
            "kalendarz"
        ).style.display =
            "block";

        document.getElementById(
            "wybranaData"
        ).value =
            formatujDateInput(
                wybranaData
            );
    }


    pokazRozklad();
}


/* =========================================================
   DATA
   ========================================================= */

document
    .getElementById(
        "wybranaData"
    )
    .addEventListener(
        "change",
        function() {

            if (!this.value)
                return;

            const c =
                this.value.split("-");

            wybranaData =
                new Date(
                    Number(c[0]),
                    Number(c[1]) - 1,
                    Number(c[2])
                );

            pokazRozklad();
        }
    );


function formatujDateInput(
    data
) {

    return (
        data.getFullYear() +
        "-" +
        String(
            data.getMonth() + 1
        ).padStart(2,"0") +
        "-" +
        String(
            data.getDate()
        ).padStart(2,"0")
    );
}


/* =========================================================
   HISTORIA URL
   ========================================================= */

function aktualizujHistorieURL(
    przystanekId
) {

    const url =
        new URL(
            window.location.href
        );

    url.searchParams.set(
        "linia",
        numerLinii
    );

    url.searchParams.set(
        "kierunek",
        aktualnyKierunek
    );


    if (przystanekId) {

        url.searchParams.set(
            "przystanek",
            przystanekId
        );

    } else {

        url.searchParams.delete(
            "przystanek"
        );
    }


    window.history.pushState(
        {},
        "",
        url.toString()
    );
}


/* =========================================================
   BŁĄD
   ========================================================= */

function pokazBlad(
    tytul,
    opis
) {

    document.getElementById(
        "numerLinii"
    ).textContent =
        "Błąd";

    document.getElementById(
        "trasa"
    ).textContent =
        "";

    document.getElementById(
        "kierunki"
    ).innerHTML =
        "";

    document.getElementById(
        "typRozkładu"
    ).style.display =
        "none";

    document.getElementById(
        "warianty-pojemnik"
    ).style.display =
        "none";

    document.getElementById(
        "przystanki"
    ).innerHTML =
        '<div class="blad">' +
            '<strong>' +
                tytul +
            '</strong>' +
            opis +
        '</div>';
}


/* =========================================================
   HISTORIA PRZEGLĄDARKI
   ========================================================= */

window.addEventListener(
    "popstate",
    function() {

        const url =
            new URL(
                window.location.href
            );

        const pParam =
            url.searchParams.get(
                "przystanek"
            );

        const kParam =
            url.searchParams.get(
                "kierunek"
            );


        if (
            kParam !== null &&
            !isNaN(
                Number(kParam)
            )
        ) {

            aktualnyKierunek =
                Number(kParam);
        }


        const rozklad =
            znajdzRozklad();


        if (
            pParam &&
            rozklad &&
            rozklad.kierunki &&
            rozklad.kierunki[
                aktualnyKierunek
            ]
        ) {

            const kierunek =
                rozklad.kierunki[
                    aktualnyKierunek
                ];

            const p =
                znajdzPrzystanek(
                    kierunek.przystanki || [],
                    pParam
                );

            if (p) {

                ustawWybranyPrzystanek(
                    p,
                    kierunek.przystanki.indexOf(p)
                );

            } else {

                ustawWybranyPrzystanek(
                    null
                );
            }

        } else {

            ustawWybranyPrzystanek(
                null
            );
        }


        widokKursuAktywny =
            false;

        /*
         * Po powrocie na listę ponownie
         * wybieramy wariant zaczynający
         * się najwcześniej na trasie.
         */

        aktualnyWariant =
            null;

        pokazRozklad();
    }
);

</script>
