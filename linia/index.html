<script>

/* =========================================================
   FWTP – SYSTEM ROZKŁADÓW
   ========================================================= */


/* =========================================================
   ZMIENNE
   ========================================================= */

let daneLinii = null;

let numerLinii = null;

let aktualnyKierunek = 0;

let aktualnyDzien = "dzisiaj";

let wybranaData = new Date();


/* =========================================================
   ODCZYT NUMERU LINII Z ADRESU
   ========================================================= */

const parametry =
    new URLSearchParams(
        window.location.search
    );

numerLinii =
    parametry.get("linia");


/* =========================================================
   JEŻELI NIE MA NUMERU LINII
   ========================================================= */

if (!numerLinii) {

    pokazBlad(
        "Nie podano numeru linii.",
        "Wróć do listy linii i wybierz linię."
    );

}
else {

    document.getElementById(
        "numerLinii"
    ).textContent =
        numerLinii;

    pobierzDane();

}


/* =========================================================
   POBIERANIE JSON
   ========================================================= */

async function pobierzDane() {

    /*
     * Wszystkie JSON-y znajdują się w:
     *
     * /FWTP/dane/
     *
     * Przykład:
     *
     * /FWTP/dane/102.json
     */

    const adres =
        "/FWTP/dane/" +
        encodeURIComponent(numerLinii) +
        ".json";


    try {

        console.log(
            "FWTP - pobieram:",
            adres
        );


        const odpowiedz =
            await fetch(
                adres,
                {
                    cache: "no-cache"
                }
            );


        if (!odpowiedz.ok) {

            throw new Error(
                "HTTP " +
                odpowiedz.status +
                " – nie znaleziono pliku: " +
                adres
            );

        }


        const tekst =
            await odpowiedz.text();


        /*
         * Parsowanie JSON
         */

        try {

            daneLinii =
                JSON.parse(tekst);

        }
        catch (bladJSON) {

            console.error(
                "Błąd JSON:",
                bladJSON
            );

            console.error(
                "Treść pobranego pliku:",
                tekst
            );

            throw new Error(
                "Plik JSON istnieje, ale ma nieprawidłową składnię."
            );

        }


        /*
         * Kontrola danych
         */

        if (
            !daneLinii ||
            typeof daneLinii !== "object"
        ) {

            throw new Error(
                "JSON jest pusty lub nie jest obiektem."
            );

        }


        if (
            !Array.isArray(
                daneLinii.rozkłady
            )
        ) {

            throw new Error(
                "JSON nie zawiera poprawnej tablicy 'rozkłady'."
            );

        }


        console.log(
            "FWTP - dane linii " +
            numerLinii +
            " załadowane:",
            daneLinii
        );


        /*
         * Uruchamiamy stronę
         */

        uruchomStrone();

    }
    catch (blad) {

        console.error(
            "FWTP - błąd ładowania linii:",
            blad
        );


        pokazBlad(
            "Nie udało się załadować linii " +
            numerLinii + ".",
            blad.message
        );

    }

}


/* =========================================================
   URUCHOMIENIE STRONY
   ========================================================= */

function uruchomStrone() {


    /*
     * TRASA
     */

    const trasa =
        daneLinii.trasa || "";


    document.getElementById(
        "trasa"
    ).textContent =
        trasa ||
        "Rozkład jazdy linii " +
        numerLinii;


    /*
     * DATA MUSI BYĆ USTAWIONA
     * PRZED GENEROWANIEM KIERUNKÓW
     */

    ustawDate();


    /*
     * GENEROWANIE KIERUNKÓW
     */

    generujKierunki();


    /*
     * POKAZANIE ROZKŁADU
     */

    pokazRozklad();

}


/* =========================================================
   ZNAJDOWANIE ODPOWIEDNIEGO ROZKŁADU
   ========================================================= */

function znajdzRozklad() {


    const rozklady =
        daneLinii.rozkłady || [];


    if (
        rozklady.length === 0
    ) {

        return null;

    }


    /*
     * 0 = niedziela
     * 1 = poniedziałek
     * 2 = wtorek
     * 3 = środa
     * 4 = czwartek
     * 5 = piątek
     * 6 = sobota
     */

    const dzien =
        wybranaData.getDay();


    const weekend =
        dzien === 0 ||
        dzien === 6;


    /*
     * =====================================================
     * WEEKEND / ŚWIĘTA
     * =====================================================
     */

    if (weekend) {

        for (
            let i = 0;
            i < rozklady.length;
            i++
        ) {

            const nazwa =
                String(
                    rozklady[i].nazwa || ""
                ).toLowerCase();


            if (
                nazwa.includes("sobot") ||
                nazwa.includes("niedziel") ||
                nazwa.includes("świąt") ||
                nazwa.includes("swiat")
            ) {

                return rozklady[i];

            }

        }

    }


    /*
     * =====================================================
     * PONIEDZIAŁEK–PIĄTEK
     * =====================================================
     */

    else {

        for (
            let i = 0;
            i < rozklady.length;
            i++
        ) {

            const nazwa =
                String(
                    rozklady[i].nazwa || ""
                ).toLowerCase();


            if (
                nazwa.includes("poniedział") ||
                nazwa.includes("poniedzial") ||
                nazwa.includes("piątk") ||
                nazwa.includes("piatk") ||
                nazwa.includes("dni robocze") ||
                nazwa.includes("dni roboczych") ||
                nazwa.includes("roboc")
            ) {

                return rozklady[i];

            }

        }

    }


    /*
     * =====================================================
     * AWARYJNIE
     * =====================================================
     *
     * Jeżeli nazwa rozkładu nie pasuje do
     * żadnego z powyższych wariantów,
     * używamy pierwszego.
     */

    return rozklady[0];

}


/* =========================================================
   GENEROWANIE PRZYCISKÓW KIERUNKÓW
   ========================================================= */

function generujKierunki() {


    const kontener =
        document.getElementById(
            "kierunki"
        );


    kontener.innerHTML = "";


    /*
     * Pobieramy rozkład dla aktualnej daty.
     */

    const rozklad =
        znajdzRozklad();


    if (!rozklad) {

        return;

    }


    const kierunki =
        rozklad.kierunki || [];


    if (
        !Array.isArray(kierunki) ||
        kierunki.length === 0
    ) {

        return;

    }


    /*
     * Jeżeli aktualny kierunek nie istnieje,
     * wracamy do pierwszego.
     */

    if (
        !kierunki[aktualnyKierunek]
    ) {

        aktualnyKierunek = 0;

    }


    /*
     * Tworzymy przyciski.
     */

    kierunki.forEach(
        (kierunek, index) => {


            const przycisk =
                document.createElement(
                    "button"
                );


            przycisk.className =
                "kierunek-btn";


            /*
             * Aktywny kierunek.
             */

            if (
                index === aktualnyKierunek
            ) {

                przycisk.classList.add(
                    "aktywny"
                );

            }


            /*
             * Lista przystanków.
             */

            const przystanki =
                kierunek.przystanki || [];


            let nazwa =
                "";


            /*
             * =================================================
             * SZUKANIE NAZWY KIERUNKU
             * =================================================
             *
             * Bierzemy ostatni prawdziwy przystanek.
             *
             * Pomijamy:
             *
             * Nr linii:
             * Nr linii
             *
             * oraz puste wpisy.
             */

            for (
                let i = przystanki.length - 1;
                i >= 0;
                i--
            ) {


                const nazwaPrzystanku =
                    String(
                        przystanki[i].nazwa || ""
                    ).trim();


                const malaNazwa =
                    nazwaPrzystanku
                        .toLowerCase();


                if (
                    nazwaPrzystanku !== "" &&
                    malaNazwa !== "nr linii:" &&
                    malaNazwa !== "nr linii"
                ) {

                    nazwa =
                        nazwaPrzystanku;

                    break;

                }

            }


            /*
             * Jeżeli nie znaleziono nazwy.
             */

            if (!nazwa) {

                nazwa =
                    "Kierunek " +
                    (index + 1);

            }


            /*
             * Tekst przycisku.
             */

            przycisk.textContent =
                nazwa;


            /*
             * Kliknięcie.
             */

            przycisk.onclick =
                function () {

                    zmienKierunek(
                        index
                    );

                };


            kontener.appendChild(
                przycisk
            );

        }
    );

}


/* =========================================================
   ZMIANA KIERUNKU
   ========================================================= */

function zmienKierunek(
    index
) {


    aktualnyKierunek =
        index;


    /*
     * Aktualizacja wyglądu przycisków.
     */

    const przyciski =
        document.querySelectorAll(
            ".kierunek-btn"
        );


    przyciski.forEach(
        (przycisk, i) => {

            przycisk.classList.toggle(
                "aktywny",
                i === index
            );

        }
    );


    /*
     * Pokazujemy rozkład.
     */

    pokazRozklad();

}


/* =========================================================
   WYBÓR DNIA
   ========================================================= */

function wybierzDzien(
    dzien
) {


    aktualnyDzien =
        dzien;


    /*
     * Usuwamy aktywny przycisk
     * ze wszystkich.
     */

    document.querySelectorAll(
        ".dzien-btn"
    ).forEach(
        przycisk => {

            przycisk.classList.remove(
                "aktywny"
            );

        }
    );


    /*
     * Ukrywamy kalendarz.
     */

    const kalendarz =
        document.getElementById(
            "kalendarz"
        );


    kalendarz.style.display =
        "none";


    /*
     * =====================================================
     * DZISIAJ
     * =====================================================
     */

    if (
        dzien === "dzisiaj"
    ) {


        document.getElementById(
            "dzisiajBtn"
        ).classList.add(
            "aktywny"
        );


        wybranaData =
            new Date();

    }


    /*
     * =====================================================
     * JUTRO
     * =====================================================
     */

    else if (
        dzien === "jutro"
    ) {


        document.getElementById(
            "jutroBtn"
        ).classList.add(
            "aktywny"
        );


        wybranaData =
            new Date();


        wybranaData.setDate(
            wybranaData.getDate() + 1
        );

    }


    /*
     * =====================================================
     * KALENDARZ
     * =====================================================
     */

    else if (
        dzien === "kalendarz"
    ) {


        document.getElementById(
            "kalendarzBtn"
        ).classList.add(
            "aktywny"
        );


        kalendarz.style.display =
            "block";


        const input =
            document.getElementById(
                "wybranaData"
            );


        input.value =
            formatujDateInput(
                wybranaData
            );

    }


    /*
     * Po zmianie dnia:
     *
     * 1. znajdujemy właściwy rozkład
     * 2. generujemy właściwe kierunki
     * 3. pokazujemy właściwe godziny
     */

    generujKierunki();

    pokazRozklad();

}


/* =========================================================
   KALENDARZ – ZMIANA DATY
   ========================================================= */

document
    .getElementById(
        "wybranaData"
    )
    .addEventListener(
        "change",
        function () {


            if (
                !this.value
            ) {

                return;

            }


            const czesci =
                this.value.split("-");


            if (
                czesci.length !== 3
            ) {

                return;

            }


            wybranaData =
                new Date(
                    Number(czesci[0]),
                    Number(czesci[1]) - 1,
                    Number(czesci[2])
                );


            /*
             * Po zmianie daty
             * odświeżamy kierunki
             * i rozkład.
             */

            generujKierunki();

            pokazRozklad();

        }
    );


/* =========================================================
   USTAWIENIE DATY
   ========================================================= */

function ustawDate() {

    wybranaData =
        new Date();

}


/* =========================================================
   POKAZANIE ROZKŁADU
   ========================================================= */

function pokazRozklad() {


    if (
        !daneLinii
    ) {

        return;

    }


    /*
     * Znajdujemy odpowiedni rozkład
     * dla wybranej daty.
     */

    const rozklad =
        znajdzRozklad();


    const kontener =
        document.getElementById(
            "przystanki"
        );


    const typ =
        document.getElementById(
            "typRozkladu"
        );


    /*
     * Brak rozkładu.
     */

    if (!rozklad) {


        typ.textContent =
            "Brak rozkładu";


        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak danych rozkładu.' +
            '</div>';


        return;

    }


    /*
     * Nazwa rozkładu.
     */

    typ.textContent =
        rozklad.nazwa ||
        "Rozkład jazdy";


    /*
     * Kierunki.
     */

    const kierunki =
        rozklad.kierunki || [];


    /*
     * Sprawdzenie kierunku.
     */

    if (
        kierunki.length === 0 ||
        !kierunki[aktualnyKierunek]
    ) {


        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak danych dla tego kierunku.' +
            '</div>';


        return;

    }


    /*
     * Wybrany kierunek.
     */

    const kierunek =
        kierunki[
            aktualnyKierunek
        ];


    /*
     * Przystanki.
     */

    const przystanki =
        kierunek.przystanki || [];


    /*
     * Czyścimy kontener.
     */

    kontener.innerHTML =
        "";


    /*
     * =====================================================
     * WYŚWIETLANIE PRZYSTANKÓW
     * =====================================================
     */

    przystanki.forEach(
        (przystanek, index) => {


            /*
             * Pomijamy techniczne wpisy
             * typu "Nr linii:".
             */

            const nazwaPrzystanku =
                String(
                    przystanek.nazwa || ""
                ).trim();


            const malaNazwa =
                nazwaPrzystanku
                    .toLowerCase();


            if (
                malaNazwa === "nr linii:" ||
                malaNazwa === "nr linii"
            ) {

                return;

            }


            /*
             * GŁÓWNY BLOK
             */

            const blok =
                document.createElement(
                    "div"
                );


            blok.className =
                "przystanek";


            /*
             * =================================================
             * NAGŁÓWEK PRZYSTANKU
             * =================================================
             */

            const naglowek =
                document.createElement(
                    "div"
                );


            naglowek.className =
                "przystanek-naglowek";


            /*
             * LP
             */

            const lp =
                document.createElement(
                    "span"
                );


            lp.className =
                "lp";


            lp.textContent =
                przystanek.lp ||
                index + 1;


            /*
             * NAZWA
             */

            const nazwa =
                document.createElement(
                    "span"
                );


            nazwa.className =
                "nazwa-przystanku";


            nazwa.textContent =
                nazwaPrzystanku ||
                "Przystanek";


            /*
             * NUMER
             */

            const nr =
                document.createElement(
                    "span"
                );


            nr.className =
                "numer-przystanku";


            if (
                przystanek.nr
            ) {

                nr.textContent =
                    "nr " +
                    przystanek.nr;

            }


            /*
             * Dodanie elementów
             */

            naglowek.appendChild(
                lp
            );

            naglowek.appendChild(
                nazwa
            );

            naglowek.appendChild(
                nr
            );


            blok.appendChild(
                naglowek
            );


            /*
             * =================================================
             * GODZINY
             * =================================================
             */

            const godziny =
                document.createElement(
                    "div"
                );


            godziny.className =
                "godziny";


            const lista =
                Array.isArray(
                    przystanek.godziny
                )
                ?
                przystanek.godziny
                :
                [];


            /*
             * Brak godzin.
             */

            if (
                lista.length === 0
            ) {


                godziny.innerHTML =
                    '<div class="brak-godzin">' +
                    'Brak odjazdów' +
                    '</div>';

            }


            /*
             * Godziny.
             */

            else {


                lista.forEach(
                    czas => {


                        const element =
                            document.createElement(
                                "div"
                            );


                        element.className =
                            "godzina";


                        element.textContent =
                            czas;


                        godziny.appendChild(
                            element
                        );

                    }
                );

            }


            /*
             * Dodanie godzin.
             */

            blok.appendChild(
                godziny
            );


            /*
             * Dodanie całego przystanku.
             */

            kontener.appendChild(
                blok
            );

        }
    );


    /*
     * Jeżeli po odfiltrowaniu
     * nie ma żadnego przystanku.
     */

    if (
        kontener.children.length === 0
    ) {

        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak przystanków dla tego kierunku.' +
            '</div>';

    }

}


/* =========================================================
   FORMAT DATY DO INPUT
   ========================================================= */

function formatujDateInput(
    data
) {


    const rok =
        data.getFullYear();


    const miesiac =
        String(
            data.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const dzien =
        String(
            data.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        rok +
        "-" +
        miesiac +
        "-" +
        dzien
    );

}
