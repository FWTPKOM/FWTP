
<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rozkład jazdy</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    color: #222;
}

/* =========================================================
   GÓRNY NAGŁÓWEK
   ========================================================= */

.naglowek {
    width: 100%;
    background: #fff;
    border-bottom: 1px solid #ddd;
}

.naglowek-wewnetrzny {
    max-width: 1200px;
    margin: auto;
    padding: 15px 20px;
}

.linia-naglowek {
    display: flex;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.numer-linii {
    font-size: 38px;
    font-weight: bold;
    line-height: 1;
}

.trasa {
    font-size: 17px;
    color: #444;
    white-space: pre-line;
}

/* =========================================================
   KIERUNKI
   ========================================================= */

.kierunki {
    max-width: 1200px;
    margin: 0 auto;
    padding: 10px 20px 0;
}

.kierunki-przyciski {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.przycisk-kierunku {
    border: 1px solid #bbb;
    background: #f3f3f3;
    color: #333;
    padding: 9px 15px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
}

.przycisk-kierunku:hover {
    background: #e7e7e7;
}

.przycisk-kierunku.aktywny {
    background: #555;
    color: white;
    border-color: #555;
}

/* =========================================================
   WARIANTY
   ========================================================= */

.warianty {
    max-width: 1200px;
    margin: 8px auto 0;
    padding: 0 20px;
}

.wariant {
    display: inline-block;
    margin-right: 8px;
    margin-bottom: 5px;
    font-size: 13px;
    color: #555;
}

.wariant-literka {
    display: inline-flex;
    width: 22px;
    height: 22px;
    align-items: center;
    justify-content: center;
    border: 1px solid #aaa;
    border-radius: 50%;
    font-weight: bold;
    margin-right: 4px;
}

/* =========================================================
   GŁÓWNY KONTENER
   ========================================================= */

.glowny-kontener {
    max-width: 1200px;
    margin: 15px auto 40px;
    padding: 0 20px;
}

/* =========================================================
   NAGŁÓWEK PRZYSTANKU
   ========================================================= */

.naglowek-przystanku {
    background: #555;
    color: white;
    padding: 10px 12px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 4px 4px 0 0;
}

.przystanek-wiersz {
    display: flex;
    align-items: center;
    min-height: 48px;
    border-bottom: 1px solid #ddd;
    cursor: pointer;
    background: white;
}

.przystanek-wiersz:hover {
    background: #f3f3f3;
}

.przystanek-lp {
    width: 48px;
    min-width: 48px;
    text-align: center;
    color: #777;
    font-size: 13px;
}

.przystanek-nazwa {
    flex: 1;
    font-size: 15px;
}

.przystanek-nr {
    width: 45px;
    min-width: 45px;
    text-align: center;
    font-size: 13px;
    color: #777;
}

/* =========================================================
   NŻ
   ========================================================= */

.przystanek-nz {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    width: 24px;
    height: 24px;

    margin-right: 7px;

    border-radius: 50%;
    background: white;
    border: 2px solid #555;

    font-size: 11px;
    font-weight: bold;
    color: #555;
}

/* =========================================================
   WIDOK GODZIN
   ========================================================= */

.wiersz-godziny {
    display: grid;

    /*
       43 px = godzina
       46 px = minuta

       Dzięki temu każda minuta ma stałą szerokość.
    */
    grid-template-columns: 43px repeat(10, 46px);
    grid-auto-columns: 46px;

    align-items: stretch;

    border-bottom: 1px solid #ddd;
    min-height: 43px;
}

/* =========================================================
   KOLUMNA GODZINY
   ========================================================= */

.kolumna-godzina {
    width: 43px;
    min-width: 43px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #555;
    color: white;

    font-weight: bold;
    font-size: 14px;

    border-right: 1px solid #444;
}

/* =========================================================
   KOLUMNA MINUTY
   ========================================================= */

.kolumna-minuta {
    width: 46px;
    min-width: 46px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-right: 1px solid #eee;

    font-size: 14px;
}

/* =========================================================
   MINUTA
   ========================================================= */

.minuta {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.minuta:hover {
    background: #eee;
}

.minuta-wariant {
    font-size: 13px;
    font-weight: bold;
}

/* =========================================================
   PUste
   ========================================================= */

.minuta-pusta {
    color: transparent;
}

/* =========================================================
   KURS
   ========================================================= */

.minuta-kurs {
    font-weight: bold;
    text-decoration: none;
}

.minuta-kurs:hover {
    text-decoration: underline;
}

/* =========================================================
   INFORMACJE
   ========================================================= */

.info {
    padding: 15px;
    color: #666;
    font-size: 14px;
}

.blad {
    margin: 20px;
    padding: 15px;
    border: 1px solid #d33;
    background: #fff0f0;
    color: #a00;
}

/* =========================================================
   PRZYCISK POWROTU
   ========================================================= */

.przycisk-powrotu {
    display: inline-block;

    margin: 15px 0;
    padding: 9px 15px;

    border: 1px solid #aaa;
    border-radius: 4px;

    background: #f5f5f5;
    color: #333;

    cursor: pointer;
    font-size: 14px;
}

.przycisk-powrotu:hover {
    background: #e5e5e5;
}

/* =========================================================
   WIDOK CAŁEGO KURSU
   ========================================================= */

.kurs-naglowek {
    margin-top: 15px;
    margin-bottom: 10px;

    padding: 12px;

    background: #555;
    color: white;

    border-radius: 4px;

    font-size: 16px;
    font-weight: bold;
}

.kurs-wiersz {
    display: flex;

    min-height: 42px;

    border-bottom: 1px solid #ddd;
}

.kurs-lp {
    width: 50px;
    min-width: 50px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #777;
}

.kurs-czas {
    width: 70px;
    min-width: 70px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;
}

.kurs-przystanek {
    flex: 1;

    display: flex;
    align-items: center;

    padding-left: 10px;
}

.kurs-wariant {
    width: 50px;
    min-width: 50px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;
}

.kurs-brygada {
    width: 80px;
    min-width: 80px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #666;
}

/* =========================================================
   WYBRANY PRZYSTANEK
   ========================================================= */

.przystanek-wybrany {
    background: #eee;
    font-weight: bold;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 800px) {

    .naglowek-wewnetrzny {
        padding: 12px;
    }

    .glowny-kontener,
    .kierunki,
    .warianty {
        padding-left: 10px;
        padding-right: 10px;
    }

    .numer-linii {
        font-size: 32px;
    }

    .trasa {
        font-size: 14px;
    }

    .wiersz-godziny {
        grid-template-columns: 40px repeat(10, 42px);
        grid-auto-columns: 42px;
    }

    .kolumna-godzina {
        width: 40px;
        min-width: 40px;
    }

    .kolumna-minuta {
        width: 42px;
        min-width: 42px;
    }
}

@media (max-width: 550px) {

    .numer-linii {
        font-size: 28px;
    }

    .trasa {
        font-size: 13px;
    }

    .przystanek-nazwa {
        font-size: 14px;
    }

    .przystanek-lp {
        width: 38px;
        min-width: 38px;
    }

    .przystanek-nr {
        width: 40px;
        min-width: 40px;
    }

    .wiersz-godziny {
        grid-template-columns: 38px repeat(10, 38px);
        grid-auto-columns: 38px;
    }

    .kolumna-godzina {
        width: 38px;
        min-width: 38px;
    }

    .kolumna-minuta {
        width: 38px;
        min-width: 38px;
    }

    .kurs-brygada {
        display: none;
    }
}

</style>
</head>

<body>

<!-- =========================================================
     NAGŁÓWEK
     ========================================================= -->

<header class="naglowek">

    <div class="naglowek-wewnetrzny">

        <div class="linia-naglowek">

            <div
                id="numerLinii"
                class="numer-linii">
            </div>

            <div
                id="trasaLinii"
                class="trasa">
            </div>

        </div>

    </div>

</header>


<!-- =========================================================
     KIERUNKI
     ========================================================= -->

<div class="kierunki">

    <div
        id="kierunkiPrzyciski"
        class="kierunki-przyciski">
    </div>

</div>


<!-- =========================================================
     WARIANTY
     ========================================================= -->

<div
    id="warianty"
    class="warianty">
</div>


<!-- =========================================================
     GŁÓWNY KONTENER
     ========================================================= -->

<main
    id="glownyKontener"
    class="glowny-kontener">

    <div
        id="zawartosc">
    </div>

</main>


<script>

/* =========================================================
   ZMIENNE GLOBALNE
   ========================================================= */

let daneLinii = null;
let numerLinii = null;

let aktualnyKierunek = 0;
let aktualnyWariant = null;

let aktualnyDzien = "dzisiaj";
let wybranaData = new Date();

let wybranyPrzystanek = null;

/*
   NAJWAŻNIEJSZA ZMIENNA.

   Przystanek zapamiętujemy przez:
   - kierunek
   - lp
   - nr
   - nazwę

   Dzięki temu:

   CH Targówek 03
   CH Targówek 05

   są traktowane jako dwa różne przystanki.
*/
let wybranyPrzystanekId = null;

let widokKursuAktywny = false;


/* =========================================================
   START
   ========================================================= */

document.addEventListener("DOMContentLoaded", uruchomStrone);


/* =========================================================
   URUCHOMIENIE STRONY
   ========================================================= */

async function uruchomStrone() {

    try {

        const parametry = new URLSearchParams(
            window.location.search
        );

        numerLinii =
            parametry.get("linia") ||
            parametry.get("line");

        if (!numerLinii) {

            const fragment =
                window.location.pathname
                    .split("/")
                    .filter(Boolean);

            numerLinii =
                fragment.length
                    ? fragment[fragment.length - 1]
                    : null;
        }

        if (!numerLinii) {

            pokazBlad(
                "Nie podano numeru linii."
            );

            return;
        }


        /* -------------------------------------------------
           POBRANIE JSON
           ------------------------------------------------- */

        const odpowiedz = await fetch(
            `../dane/${encodeURIComponent(numerLinii)}.json`,
            {
                cache: "no-cache"
            }
        );

        if (!odpowiedz.ok) {

            throw new Error(
                `Nie udało się pobrać pliku JSON. HTTP ${odpowiedz.status}`
            );
        }


        daneLinii = await odpowiedz.json();


        /* -------------------------------------------------
           NAGŁÓWEK
           ------------------------------------------------- */

        document.getElementById(
            "numerLinii"
        ).textContent =
            daneLinii.linia || numerLinii;

        document.getElementById(
            "trasaLinii"
        ).textContent =
            daneLinii.trasa || "";


        /* -------------------------------------------------
           KIERUNEK Z URL
           ------------------------------------------------- */

        const parametrKierunek =
            parametry.get("kierunek");

        if (
            parametrKierunek !== null &&
            !isNaN(Number(parametrKierunek))
        ) {

            const k =
                Number(parametrKierunek);

            if (
                k >= 0 &&
                k < pobierzKierunki().length
            ) {

                aktualnyKierunek = k;
            }
        }


        /* -------------------------------------------------
           PRZYSTANEK Z URL
           ------------------------------------------------- */

        const parametrPrzystanek =
            parametry.get("przystanek");

        if (parametrPrzystanek) {

            const kierunek =
                pobierzKierunki()[aktualnyKierunek];

            const znaleziony =
                znajdzPrzystanek(
                    kierunek?.przystanki || [],
                    parametrPrzystanek
                );

            if (znaleziony) {

                wybranyPrzystanek =
                    znaleziony;

                ustawIdWybranegoPrzystanku(
                    znaleziony,
                    aktualnyKierunek
                );
            }
        }


        /* -------------------------------------------------
           POKAŻ ROZKŁAD
           ------------------------------------------------- */

        pokazRozklad();


        /* -------------------------------------------------
           OBSŁUGA HISTORII
           ------------------------------------------------- */

        window.addEventListener(
            "popstate",
            obsluzPopstate
        );

    }
    catch (blad) {

        console.error(blad);

        pokazBlad(
            "Wystąpił błąd podczas ładowania rozkładu: " +
            blad.message
        );
    }
}


/* =========================================================
   POBIERZ KIERUNKI
   ========================================================= */

function pobierzKierunki() {

    if (
        !daneLinii ||
        !Array.isArray(daneLinii.rozkłady) ||
        !daneLinii.rozkłady.length
    ) {

        return [];
    }

    const rozklad =
        daneLinii.rozkłady[0];

    return Array.isArray(rozklad.kierunki)
        ? rozklad.kierunki
        : [];
}


/* =========================================================
   POBIERZ WARIANTY
   ========================================================= */

function pobierzWarianty() {

    if (
        !daneLinii ||
        !Array.isArray(daneLinii.rozkłady) ||
        !daneLinii.rozkłady.length
    ) {

        return [];
    }

    const rozklad =
        daneLinii.rozkłady[0];

    return Array.isArray(rozklad.warianty)
        ? rozklad.warianty
        : [];
}


/* =========================================================
   GENEROWANIE PRZYCISKÓW KIERUNKÓW
   ========================================================= */

function generujKierunki() {

    const kontener =
        document.getElementById(
            "kierunkiPrzyciski"
        );

    kontener.innerHTML = "";

    const kierunki =
        pobierzKierunki();


    kierunki.forEach(
        (kierunek, index) => {

            const przycisk =
                document.createElement("button");

            przycisk.className =
                "przycisk-kierunku";

            if (
                index === aktualnyKierunek
            ) {

                przycisk.classList.add(
                    "aktywny"
                );
            }


            przycisk.textContent =
                pobierzNazweKierunku(
                    kierunek,
                    index
                );


            przycisk.addEventListener(
                "click",
                () => {

                    aktualnyKierunek =
                        index;

                    /*
                       Zmiana kierunku oznacza,
                       że poprzedni przystanek
                       nie jest już aktualnym
                       przystankiem.
                    */

                    wybranyPrzystanek =
                        null;

                    wybranyPrzystanekId =
                        null;

                    widokKursuAktywny =
                        false;


                    aktualizujHistorieURL();


                    pokazRozklad();
                }
            );


            kontener.appendChild(
                przycisk
            );
        }
    );
}


/* =========================================================
   NAZWA KIERUNKU
   ========================================================= */

function pobierzNazweKierunku(
    kierunek,
    index
) {

    if (!kierunek) {

        return `Kierunek ${index + 1}`;
    }

    return (
        kierunek.nazwa ||
        kierunek.kierunek ||
        kierunek.kierunekNazwa ||
        kierunek.do ||
        kierunek.trasa ||
        `Kierunek ${index + 1}`
    );
}


/* =========================================================
   WARIANTY
   ========================================================= */

function generujWarianty() {

    const kontener =
        document.getElementById(
            "warianty"
        );

    kontener.innerHTML = "";

    const warianty =
        pobierzWarianty();


    warianty.forEach(
        wariant => {

            const element =
                document.createElement("span");

            element.className =
                "wariant";


            const litera =
                document.createElement("span");

            litera.className =
                "wariant-literka";

            litera.textContent =
                wariant.litera || "";


            element.appendChild(
                litera
            );


            const opis =
                document.createElement("span");

            opis.textContent =
                wariant.opis || "";


            element.appendChild(
                opis
            );


            kontener.appendChild(
                element
            );
        }
    );
}


/* =========================================================
   GŁÓWNY ROZKŁAD
   ========================================================= */

function pokazRozklad() {

    generujKierunki();
    generujWarianty();


    const kontener =
        document.getElementById(
            "zawartosc"
        );

    kontener.innerHTML = "";


    const kierunki =
        pobierzKierunki();


    if (
        !kierunki.length ||
        !kierunki[aktualnyKierunek]
    ) {

        kontener.innerHTML =
            `<div class="info">
                Brak danych dla tego kierunku.
             </div>`;

        return;
    }


    const kierunek =
        kierunki[aktualnyKierunek];


    /*
       JEŻELI WYBRANO PRZYSTANEK,
       POKAZUJEMY JEGO ROZKŁAD.
    */

    if (wybranyPrzystanek) {

        /*
           Szukamy ponownie po LP.

           NIE po samej nazwie.
           NIE po samym numerze.

           Dzięki temu dwa identyczne nazwy
           z różnymi numerami nie kolidują.
        */

        const identyfikator =
            wybranyPrzystanekId
                ? `lp:${wybranyPrzystanekId.lp}`
                : (
                    wybranyPrzystanek.nr ||
                    wybranyPrzystanek.nazwa
                );


        const akt =
            znajdzPrzystanek(
                kierunek.przystanki || [],
                identyfikator
            );


        if (akt) {

            wybranyPrzystanek =
                akt;

            pokazRozkladWybranegoPrzystanku(
                akt
            );

            return;
        }
    }


    /*
       NORMALNY WIDOK LISTY PRZYSTANKÓW
    */

    pokazListePrzystankow(
        kierunek.przystanki || []
    );
}


/* =========================================================
   LISTA PRZYSTANKÓW
   ========================================================= */

function pokazListePrzystankow(
    przystanki
) {

    const kontener =
        document.getElementById(
            "zawartosc"
        );

    kontener.innerHTML = "";


    przystanki.forEach(
        (p, index) => {

            const wiersz =
                document.createElement("div");

            wiersz.className =
                "przystanek-wiersz";


            const lp =
                document.createElement("div");

            lp.className =
                "przystanek-lp";

            lp.textContent =
                p.lp != null
                    ? p.lp
                    : index + 1;


            const nazwa =
                document.createElement("div");

            nazwa.className =
                "przystanek-nazwa";


            /*
               NŻ
            */

            if (czyNaZadanie(p)) {

                const nz =
                    document.createElement("span");

                nz.className =
                    "przystanek-nz";

                nz.textContent =
                    "NŻ";


                nazwa.appendChild(
                    nz
                );
            }


            const tekst =
                document.createElement("span");

            tekst.textContent =
                p.nazwa || "";


            nazwa.appendChild(
                tekst
            );


            const nr =
                document.createElement("div");

            nr.className =
                "przystanek-nr";

            nr.textContent =
                p.nr || "";


            wiersz.appendChild(
                lp
            );

            wiersz.appendChild(
                nazwa
            );

            wiersz.appendChild(
                nr
            );


            /*
               WAŻNE:

               Przekazujemy dokładny obiekt
               i jego index.

               Nie wyszukujemy go ponownie
               po nazwie.
            */

            wiersz.addEventListener(
                "click",
                () => {

                    wybierzPrzystanek(
                        p,
                        index
                    );
                }
            );


            kontener.appendChild(
                wiersz
            );
        }
    );
}


/* =========================================================
   WYBÓR PRZYSTANKU
   ========================================================= */

function wybierzPrzystanek(
    p,
    index
) {

    wybranyPrzystanek =
        p;


    /*
       LP jest głównym identyfikatorem.

       Jeżeli JSON nie posiada LP,
       używamy index + 1.
    */

    const lp =
        p.lp != null
            ? String(p.lp).trim()
            : String(index + 1);


    wybranyPrzystanekId = {

        kierunek:
            aktualnyKierunek,

        lp:
            lp,

        nr:
            String(p.nr || "").trim(),

        nazwa:
            String(p.nazwa || "").trim()
    };


    widokKursuAktywny =
        false;


    /*
       W URL zapisujemy:

       przystanek=lp:2

       a nie:

       przystanek=CH%20Targówek

       ani:

       przystanek=03

       Dzięki temu nie ma pomyłek.
    */

    aktualizujHistorieURL(
        `lp:${lp}`
    );


    pokazRozklad();
}


/* =========================================================
   USTAW ID WYBRANEGO PRZYSTANKU
   ========================================================= */

function ustawIdWybranegoPrzystanku(
    p,
    kierunek
) {

    if (!p) {

        wybranyPrzystanekId =
            null;

        return;
    }


    wybranyPrzystanekId = {

        kierunek:
            kierunek,

        lp:
            String(
                p.lp != null
                    ? p.lp
                    : ""
            ).trim(),

        nr:
            String(
                p.nr || ""
            ).trim(),

        nazwa:
            String(
                p.nazwa || ""
            ).trim()
    };
}


/* =========================================================
   SZUKANIE PRZYSTANKU
   ========================================================= */

function znajdzPrzystanek(
    przystanki,
    identyfikator
) {

    if (
        !Array.isArray(przystanki) ||
        !przystanki.length ||
        identyfikator == null
    ) {

        return null;
    }


    const szukany =
        String(
            identyfikator
        ).trim();


    /* -----------------------------------------------------
       1. LP
       ----------------------------------------------------- */

    if (
        szukany
            .toLowerCase()
            .startsWith("lp:")
    ) {

        const lp =
            szukany
                .substring(3)
                .trim();


        const poLp =
            przystanki.find(
                p =>
                    String(
                        p.lp != null
                            ? p.lp
                            : ""
                    ).trim() === lp
            );


        if (poLp) {

            return poLp;
        }
    }


    /* -----------------------------------------------------
       2. ZAPAMIĘTANY ID
       ----------------------------------------------------- */

    if (
        wybranyPrzystanekId &&
        wybranyPrzystanekId.kierunek ===
            aktualnyKierunek
    ) {

        const poLp =
            przystanki.find(
                p =>
                    String(
                        p.lp != null
                            ? p.lp
                            : ""
                    ).trim() ===
                    String(
                        wybranyPrzystanekId.lp
                    ).trim()
            );


        if (poLp) {

            return poLp;
        }
    }


    /* -----------------------------------------------------
       3. DOKŁADNY NUMER
       ----------------------------------------------------- */

    const poNr =
        przystanki.find(
            p =>
                String(
                    p.nr || ""
                ).trim() === szukany
        );


    if (poNr) {

        return poNr;
    }


    /* -----------------------------------------------------
       4. DOKŁADNA NAZWA
       ----------------------------------------------------- */

    const poNazwie =
        przystanki.find(
            p =>
                String(
                    p.nazwa || ""
                ).trim() === szukany
        );


    if (poNazwie) {

        return poNazwie;
    }


    /* -----------------------------------------------------
       5. NORMALIZACJA
       ----------------------------------------------------- */

    const normalizuj =
        tekst =>
            String(
                tekst || ""
            )
            .trim()
            .toLowerCase()
            .replace(/\s+/g, " ");


    const normalny =
        normalizuj(szukany);


    return (
        przystanki.find(
            p =>
                normalizuj(p.nr) ===
                normalny
        )
        ||
        przystanki.find(
            p =>
                normalizuj(p.nazwa) ===
                normalny
        )
        ||
        null
    );
}


/* =========================================================
   CZY NŻ
   ========================================================= */

function czyNaZadanie(p) {

    if (!p) {

        return false;
    }


    if (
        p.naZadanie === true ||
        p.nz === true
    ) {

        return true;
    }


    const typ =
        String(
            p.typ || ""
        )
        .trim()
        .toUpperCase();


    if (typ === "NŻ") {

        return true;
    }


    const nazwa =
        String(
            p.nazwa || ""
        )
        .toUpperCase();


    return (
        nazwa.includes("(NŻ)") ||
        nazwa.includes("NŻ")
    );
}


/* =========================================================
   KURSY PRZYSTANKU
   ========================================================= */

function pobierzKursyPrzystanku(
    przystanek
) {

    if (!przystanek) {

        return [];
    }


    /* -----------------------------------------------------
       NORMALNE KURSY
       ----------------------------------------------------- */

    if (
        Array.isArray(
            przystanek.kursy
        )
    ) {

        return przystanek.kursy;
    }


    /* -----------------------------------------------------
       GODZINY + MINUTY
       ----------------------------------------------------- */

    if (
        Array.isArray(
            przystanek.godziny
        )
    ) {

        const wynik = [];


        przystanek.godziny.forEach(
            godzina => {

                const h =
                    String(
                        godzina.godzina || ""
                    ).padStart(2, "0");


                if (
                    !Array.isArray(
                        godzina.minuty
                    )
                ) {

                    return;
                }


                godzina.minuty.forEach(
                    minuta => {

                        const m =
                            typeof minuta ===
                                "object"

                                ? String(
                                    minuta.minuta || ""
                                ).padStart(2, "0")

                                : String(
                                    minuta
                                ).padStart(2, "0");


                        wynik.push({

                            czas:
                                `${h}:${m}`,

                            wariant:
                                typeof minuta ===
                                    "object"
                                    ? minuta.wariant
                                    : null,

                            brygada:
                                typeof minuta ===
                                    "object"
                                    ? minuta.brygada
                                    : null,

                            numer:
                                typeof minuta ===
                                    "object"
                                    ? minuta.numer
                                    : null
                        });
                    }
                );
            }
        );


        return wynik;
    }


    /* -----------------------------------------------------
       ODJAZDY
       ----------------------------------------------------- */

    if (
        Array.isArray(
            przystanek.odjazdy
        )
    ) {

        return przystanek.odjazdy;
    }


    return [];
}


/* =========================================================
   ROZKŁAD WYBRANEGO PRZYSTANKU
   ========================================================= */

function pokazRozkladWybranegoPrzystanku(
    przystanek
) {

    const kontener =
        document.getElementById(
            "zawartosc"
        );

    kontener.innerHTML = "";


    /* -----------------------------------------------------
       POWRÓT
       ----------------------------------------------------- */

    const powrot =
        document.createElement("button");

    powrot.className =
        "przycisk-powrotu";

    powrot.textContent =
        "← Powrót do listy przystanków";


    powrot.addEventListener(
        "click",
        () => {

            wybranyPrzystanek =
                null;

            wybranyPrzystanekId =
                null;

            widokKursuAktywny =
                false;


            aktualizujHistorieURL();

            pokazRozklad();
        }
    );


    kontener.appendChild(
        powrot
    );


    /* -----------------------------------------------------
       NAGŁÓWEK
       ----------------------------------------------------- */

    const naglowek =
        document.createElement("div");

    naglowek.className =
        "naglowek-przystanku";


    let tekstNaglowka =
        przystanek.nazwa || "";


    if (przystanek.nr) {

        tekstNaglowka +=
            ` ${przystanek.nr}`;
    }


    naglowek.textContent =
        tekstNaglowka;


    kontener.appendChild(
        naglowek
    );


    /* -----------------------------------------------------
       KURSY
       ----------------------------------------------------- */

    const kursy =
        pobierzKursyPrzystanku(
            przystanek
        );


    if (!kursy.length) {

        const brak =
            document.createElement("div");

        brak.className =
            "info";

        brak.textContent =
            "Brak kursów dla tego przystanku.";

        kontener.appendChild(
            brak
        );

        return;
    }


    /*
       Grupujemy kursy według godziny.
    */

    const grupy = {};


    kursy.forEach(
        kurs => {

            if (!kurs) {

                return;
            }


            const czas =
                String(
                    kurs.czas || ""
                ).trim();


            if (!czas) {

                return;
            }


            const czesci =
                czas.split(":");


            if (
                czesci.length !== 2
            ) {

                return;
            }


            const godzina =
                czesci[0].padStart(
                    2,
                    "0"
                );


            const minuta =
                czesci[1].padStart(
                    2,
                    "0"
                );


            if (!grupy[godzina]) {

                grupy[godzina] = [];
            }


            grupy[godzina].push({

                ...kurs,

                czas:
                    `${godzina}:${minuta}`
            });
        }
    );


    const godziny =
        Object.keys(grupy)
            .sort(
                (a, b) =>
                    Number(a) -
                    Number(b)
            );


    /* -----------------------------------------------------
       WIERSZE GODZIN
       ----------------------------------------------------- */

    godziny.forEach(
        godzina => {

            const wiersz =
                document.createElement("div");

            wiersz.className =
                "wiersz-godziny";


            const kolumnaGodzina =
                document.createElement("div");

            kolumnaGodzina.className =
                "kolumna-godzina";

            kolumnaGodzina.textContent =
                godzina;


            wiersz.appendChild(
                kolumnaGodzina
            );


            /*
               Minuty 00–09
            */

            const kursyGodziny =
                grupy[godzina];


            const mapaMinut = {};


            kursyGodziny.forEach(
                kurs => {

                    const minuta =
                        kurs.czas
                            .split(":")[1];

                    mapaMinut[minuta] =
                        kurs;
                }
            );


            for (
                let m = 0;
                m < 60;
                m++
            ) {

                const minuta =
                    String(m)
                        .padStart(2, "0");


                /*
                   Tworzymy tylko 10 kolumn
                   na wiersz.

                   Pozostałe minuty są
                   dokładane jako kolejne
                   kolumny CSS grid.
                */

                if (
                    m === 0
                ) {
                    /* nic */
                }


                const kolumna =
                    document.createElement("div");

                kolumna.className =
                    "kolumna-minuta";


                const kurs =
                    mapaMinut[minuta];


                if (kurs) {

                    const element =
                        document.createElement("div");

                    element.className =
                        "minuta minuta-kurs";


                    element.textContent =
                        kurs.wariant ||
                        minuta;


                    /*
                       Tooltip
                    */

                    const informacje = [];


                    if (kurs.numer) {

                        informacje.push(
                            `Kurs: ${kurs.numer}`
                        );
                    }


                    if (kurs.brygada) {

                        informacje.push(
                            `Brygada: ${kurs.brygada}`
                        );
                    }


                    if (kurs.wariant) {

                        informacje.push(
                            `Wariant: ${kurs.wariant}`
                        );
                    }


                    if (informacje.length) {

                        element.title =
                            informacje.join(
                                "\n"
                            );
                    }


                    /*
                       Kliknięcie kursu
                    */

                    element.addEventListener(
                        "click",
                        event => {

                            event.stopPropagation();

                            if (kurs.numer) {

                                pokazCalyKurs(
                                    kurs.numer
                                );
                            }
                        }
                    );


                    kolumna.appendChild(
                        element
                    );

                }
                else {

                    kolumna.innerHTML =
                        `<div class="minuta minuta-pusta">
                            .
                         </div>`;
                }


                wiersz.appendChild(
                    kolumna
                );
            }


            kontener.appendChild(
                wiersz
            );
        }
    );
}


/* =========================================================
   POKAŻ CAŁY KURS
   ========================================================= */

function pokazCalyKurs(
    numerKursu
) {

    const kontener =
        document.getElementById(
            "zawartosc"
        );

    kontener.innerHTML = "";


    const powrot =
        document.createElement("button");

    powrot.className =
        "przycisk-powrotu";

    powrot.textContent =
        "← Powrót do przystanku";


    powrot.addEventListener(
        "click",
        () => {

            widokKursuAktywny =
                false;

            pokazRozklad();
        }
    );


    kontener.appendChild(
        powrot
    );


    const naglowek =
        document.createElement("div");

    naglowek.className =
        "kurs-naglowek";

    naglowek.textContent =
        `Kurs ${numerKursu}`;


    kontener.appendChild(
        naglowek
    );


    const kierunek =
        pobierzKierunki()
            [aktualnyKierunek];


    if (!kierunek) {

        return;
    }


    const przystanki =
        kierunek.przystanki || [];


    /*
       Znajdź przystanek, od którego
       otwarto kurs.

       Najpierw LP.
    */

    let indeksWybranego =
        -1;


    if (
        wybranyPrzystanekId &&
        wybranyPrzystanekId.lp
    ) {

        indeksWybranego =
            przystanki.findIndex(
                p =>
                    String(
                        p.lp != null
                            ? p.lp
                            : ""
                    ).trim() ===
                    String(
                        wybranyPrzystanekId.lp
                    ).trim()
            );
    }


    /*
       Awaryjnie numer + nazwa.
    */

    if (
        indeksWybranego === -1 &&
        wybranyPrzystanek
    ) {

        indeksWybranego =
            przystanki.findIndex(
                p =>
                    String(
                        p.nr || ""
                    ).trim() ===
                    String(
                        wybranyPrzystanek.nr || ""
                    ).trim()
                    &&
                    String(
                        p.nazwa || ""
                    ).trim() ===
                    String(
                        wybranyPrzystanek.nazwa || ""
                    ).trim()
            );
    }


    /*
       Kurs pokazujemy od początku,
       chyba że chcemy zaznaczyć
       aktualny przystanek.
    */

    przystanki.forEach(
        (p, index) => {

            const kursy =
                pobierzKursyPrzystanku(
                    p
                );


            const kurs =
                kursy.find(
                    k =>
                        String(
                            k.numer || ""
                        ).trim() ===
                        String(
                            numerKursu
                        ).trim()
                );


            if (!kurs) {

                return;
            }


            const wiersz =
                document.createElement("div");

            wiersz.className =
                "kurs-wiersz";


            if (
                index ===
                indeksWybranego
            ) {

                wiersz.classList.add(
                    "przystanek-wybrany"
                );
            }


            const lp =
                document.createElement("div");

            lp.className =
                "kurs-lp";

            lp.textContent =
                p.lp != null
                    ? p.lp
                    : index + 1;


            const czas =
                document.createElement("div");

            czas.className =
                "kurs-czas";

            czas.textContent =
                kurs.czas || "";


            const nazwa =
                document.createElement("div");

            nazwa.className =
                "kurs-przystanek";

            nazwa.textContent =
                p.nazwa || "";


            if (p.nr) {

                nazwa.textContent +=
                    ` ${p.nr}`;
            }


            const wariant =
                document.createElement("div");

            wariant.className =
                "kurs-wariant";

            wariant.textContent =
                kurs.wariant || "";


            const brygada =
                document.createElement("div");

            brygada.className =
                "kurs-brygada";

            brygada.textContent =
                kurs.brygada
                    ? `Brygada ${kurs.brygada}`
                    : "";


            wiersz.appendChild(
                lp
            );

            wiersz.appendChild(
                czas
            );

            wiersz.appendChild(
                nazwa
            );

            wiersz.appendChild(
                wariant
            );

            wiersz.appendChild(
                brygada
            );


            kontener.appendChild(
                wiersz
            );
        }
    );
}


/* =========================================================
   HISTORIA URL
   ========================================================= */

function aktualizujHistorieURL(
    przystanekId = null
) {

    const parametry =
        new URLSearchParams(
            window.location.search
        );


    parametry.set(
        "linia",
        numerLinii
    );


    parametry.set(
        "kierunek",
        aktualnyKierunek
    );


    if (przystanekId) {

        parametry.set(
            "przystanek",
            przystanekId
        );

    }
    else {

        parametry.delete(
            "przystanek"
        );
    }


    const nowyURL =
        `${window.location.pathname}?${parametry.toString()}`;


    window.history.pushState(
        {},
        "",
        nowyURL
    );
}


/* =========================================================
   POPSTATE
   ========================================================= */

function obsluzPopstate() {

    const parametry =
        new URLSearchParams(
            window.location.search
        );


    const kierunek =
        Number(
            parametry.get(
                "kierunek"
            )
        );


    if (
        !isNaN(kierunek) &&
        kierunek >= 0 &&
        kierunek <
            pobierzKierunki().length
    ) {

        aktualnyKierunek =
            kierunek;
    }


    const parametrPrzystanek =
        parametry.get(
            "przystanek"
        );


    const kierunekDanych =
        pobierzKierunki()
            [aktualnyKierunek];


    if (parametrPrzystanek) {

        const znaleziony =
            znajdzPrzystanek(
                kierunekDanych?.przystanki || [],
                parametrPrzystanek
            );


        if (znaleziony) {

            wybranyPrzystanek =
                znaleziony;

            ustawIdWybranegoPrzystanku(
                znaleziony,
                aktualnyKierunek
            );

        }
        else {

            wybranyPrzystanek =
                null;

            wybranyPrzystanekId =
                null;
        }

    }
    else {

        wybranyPrzystanek =
            null;

        wybranyPrzystanekId =
            null;
    }


    pokazRozklad();
}


/* =========================================================
   BŁĄD
   ========================================================= */

function pokazBlad(
    tekst
) {

    const kontener =
        document.getElementById(
            "zawartosc"
        );


    if (!kontener) {

        return;
    }


    kontener.innerHTML =
        `<div class="blad">
            ${esc(tekst)}
         </div>`;
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function esc(
    tekst
) {

    return String(
        tekst || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}
