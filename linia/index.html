        data.getFullYear() +
        "-" +
        String(
            data.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +
        "-" +
        String(
            data.getDate()
        ).padStart(
            2,
            "0"
        )
    );
}


/* =========================================================
   WARIANT
   ========================================================= */

function pobierzWariant(k) {

    if (
        !k ||
        typeof k !== "object"
    ) {

        return "";
    }

    const wariant =
        k.wariant;

    if (
        wariant &&
        typeof wariant === "object"
    ) {

        return String(
            wariant.litera ||
            wariant.nazwa ||
            ""
        ).trim();
    }

    return String(
        wariant || ""
    ).trim();
}


/* =========================================================
   WARIANTY
   ========================================================= */

function zbierzWariantyDlaKierunku(
    kierunek
) {

    const set =
        new Set();

    (
        kierunek.przystanki ||
        []
    ).forEach(
        p =>
            (
                p.kursy ||
                []
            ).forEach(
                k => {

                    const w =
                        pobierzWariant(
                            k
                        );

                    if (w)
                        set.add(w);
                }
            )
    );

    return Array
        .from(set)
        .sort(
            (
                a,
                b
            ) =>
                a.localeCompare(
                    b,
                    "pl",
                    {
                        numeric: true
                    }
                )
        );
}


/* =========================================================
   DOMYŚLNY WARIANT
   ========================================================= */

function znajdzDomyslnyWariant(
    kierunek
) {

    const wariantStarty =
        new Map();

    (
        kierunek.przystanki ||
        []
    ).forEach(
        (
            przystanek,
            index
        ) => {

            (
                przystanek.kursy ||
                []
            ).forEach(
                kurs => {

                    const wariant =
                        pobierzWariant(
                            kurs
                        );

                    if (
                        !wariantStarty.has(
                            wariant
                        )
                    ) {

                        wariantStarty.set(
                            wariant,
                            index
                        );
                    }
                }
            );
        }
    );

    const lista =
        Array.from(
            wariantStarty.entries()
        );

    if (
        lista.length === 0
    )
        return "";

    lista.sort(
        (
            a,
            b
        ) => {

            if (
                a[1] !==
                b[1]
            ) {

                return (
                    a[1] -
                    b[1]
                );
            }

            if (
                a[0] === "" &&
                b[0] !== ""
            )
                return -1;

            if (
                a[0] !== "" &&
                b[0] === ""
            )
                return 1;

            return a[0].localeCompare(
                b[0],
                "pl",
                {
                    numeric: true
                }
            );
        }
    );

    return lista[0][0];
}


/* =========================================================
   CZAS NA MINUTY
   ========================================================= */

function czasNaMinuty(
    czas
) {

    const dop =
        String(
            czas || ""
        )
            .trim()
            .match(
                /^(\d{1,2}):(\d{2})$/
            );

    if (!dop)
        return null;

    const godzina =
        Number(
            dop[1]
        );

    const minuta =
        Number(
            dop[2]
        );

    if (
        godzina < 0 ||
        godzina > 23 ||
        minuta < 0 ||
        minuta > 59
    ) {

        return null;
    }

    return (
        godzina * 60 +
        minuta
    );
}


/* =========================================================
   ZNAJDOWANIE PIERWSZEGO KURSU
   ========================================================= */

function znajdzKursBazowy(
    kierunek,
    wariant
) {

    const przystanki =
        kierunek.przystanki ||
        [];

    const mapaKursow =
        new Map();


    przystanki.forEach(
        (
            p,
            index
        ) => {

            (
                p.kursy ||
                []
            ).forEach(
                k => {

                    if (
                        k.numer === undefined ||
                        k.numer === null
                    ) {

                        return;
                    }

                    const numer =
                        String(
                            k.numer
                        ).trim();

                    if (!numer)
                        return;

                    const kursWariant =
                        pobierzWariant(
                            k
                        );

                    const klucz =
                        numer +
                        "||" +
                        kursWariant;

                    if (
                        !mapaKursow.has(
                            klucz
                        )
                    ) {

                        mapaKursow.set(
                            klucz,
                            {
                                numer:
                                    k.numer,

                                wariant:
                                    kursWariant,

                                punkty:
                                    []
                            }
                        );
                    }

                    mapaKursow
                        .get(klucz)
                        .punkty
                        .push(
                            {
                                index:
                                    index,

                                czas:
                                    k.czas
                            }
                        );
                }
            );
        }
    );


    const wszystkieKursy =
        Array.from(
            mapaKursow.values()
        );


    wszystkieKursy.forEach(
        kurs => {

            kurs.punkty.sort(
                (
                    a,
                    b
                ) =>
                    a.index -
                    b.index
            );

            const pierwszy =
                kurs.punkty.find(
                    punkt =>
                        czasNaMinuty(
                            punkt.czas
                        ) !== null
                );

            kurs.startIndex =
                pierwszy
                    ? pierwszy.index
                    : 999999;

            kurs.startMinuty =
                pierwszy
                    ? czasNaMinuty(
                        pierwszy.czas
                    )
                    : null;
        }
    );


    const szukanyWariant =
        String(
            wariant || ""
        ).trim();


    const kandydaci =
        wszystkieKursy.filter(
            kurs =>
                kurs.wariant ===
                szukanyWariant
        );


    if (
        kandydaci.length === 0
    ) {

        return null;
    }


    kandydaci.sort(
        (
            a,
            b
        ) => {

            const aa =
                a.startMinuty === null
                    ? 999999
                    : a.startMinuty;

            const bb =
                b.startMinuty === null
                    ? 999999
                    : b.startMinuty;

            if (
                aa !== bb
            ) {

                return aa - bb;
            }

            return (
                a.startIndex -
                b.startIndex
            );
        }
    );


    return (
        kandydaci[0] ||
        null
    );
}


/* =========================================================
   POBIERANIE CZASÓW DOKŁADNEGO KURSU
   ========================================================= */

function pobierzCzasyKursu(
    kierunek,
    kurs
) {

    const przystanki =
        kierunek.przystanki ||
        [];

    const czasy =
        new Array(
            przystanki.length
        ).fill(
            null
        );

    if (!kurs)
        return czasy;


    (
        kurs.punkty ||
        []
    ).forEach(
        punkt => {

            const index =
                Number(
                    punkt.index
                );

            if (
                !Number.isInteger(
                    index
                ) ||
                index < 0 ||
                index >= przystanki.length
            ) {

                return;
            }

            const czas =
                String(
                    punkt.czas || ""
                ).trim();

            if (
                czasNaMinuty(
                    czas
                ) !== null
            ) {

                czasy[index] =
                    czas;
            }
        }
    );

    return czasy;
}


/* =========================================================
   SUMOWANIE CZASU PRZEJAZDU
   ========================================================= */

function obliczSumowaneCzasy(
    czasy
) {

    const wynik =
        new Array(
            czasy.length
        ).fill(
            null
        );

    let pierwszyCzas =
        null;

    for (
        let i = 0;
        i < czasy.length;
        i++
    ) {

        const minuty =
            czasNaMinuty(
                czasy[i]
            );

        if (
            minuty !== null
        ) {

            pierwszyCzas =
                minuty;

            break;
        }
    }

    if (
        pierwszyCzas === null
    ) {

        return wynik;
    }

    for (
        let i = 0;
        i < czasy.length;
        i++
    ) {

        const minuty =
            czasNaMinuty(
                czasy[i]
            );

        if (
            minuty === null
        )
            continue;

        let roznica =
            minuty -
            pierwszyCzas;

        if (
            roznica < 0
        ) {

            roznica +=
                24 * 60;
        }

        wynik[i] =
            roznica;
    }

    return wynik;
}


/* =========================================================
   HISTORIA URL
   ========================================================= */

function aktualizujHistorieURL(
    przystanekId
) {

    const url =
        new URL(
            window.location.href
        );

    url.searchParams.set(
        "linia",
        numerLinii
    );

    url.searchParams.set(
        "kierunek",
        aktualnyKierunek
    );

    if (przystanekId) {

        url.searchParams.set(
            "przystanek",
            przystanekId
        );

    } else {

        url.searchParams.delete(
            "przystanek"
        );
    }

    window.history.pushState(
        {
            przystanek:
                przystanekId,

            kierunek:
                aktualnyKierunek
        },
        "",
        url.toString()
    );
}


/* =========================================================
   GŁÓWNY WIDOK
   ========================================================= */

function pokazRozklad() {

    if (!daneLinii)
        return;

    const rozklad =
        znajdzRozklad();

    const kontener =
        document.getElementById(
            "przystanki"
        );

    const typ =
        document.getElementById(
            "typRozkładu"
        );

    const wp =
        document.getElementById(
            "warianty-pojemnik"
        );


    if (
        !rozklad ||
        !rozklad.kierunki ||
        rozklad.kierunki.length === 0
    ) {

        typ.textContent =
            "Brak rozkładu";

        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak danych rozkładu.' +
            '</div>';

        if (wp)
            wp.style.display =
                "none";

        return;
    }


    if (
        aktualnyKierunek >=
        rozklad.kierunki.length
    ) {

        aktualnyKierunek =
            0;

        ustawWybranyPrzystanek(
            null
        );
    }


    generujKierunki();


    if (
        widokKursuAktywny
    )
        return;


    if (
        wybranyPrzystanek !== null &&
        wybranyPrzystanekIndex !== null
    ) {

        const kierunek =
            rozklad.kierunki[
                aktualnyKierunek
            ];

        if (
            kierunek &&
            Array.isArray(
                kierunek.przystanki
            )
        ) {

            const idx =
                Number(
                    wybranyPrzystanekIndex
                );

            if (
                Number.isInteger(idx) &&
                idx >= 0 &&
                idx <
                kierunek.przystanki.length
            ) {

                wybranyPrzystanek =
                    kierunek.przystanki[
                        idx
                    ];

                pokazRozkladWybranegoPrzystanku(
                    rozklad,
                    wybranyPrzystanek
                );

                return;
            }
        }

        ustawWybranyPrzystanek(
            null
        );
    }


    pokazListePrzystankow(
        rozklad
    );
}


/* =========================================================
   NŻ
   ========================================================= */

function czyPrzystanekNaZadanie(
    p
) {

    if (!p)
        return false;

    const typ =
        String(
            p.typ || ""
        )
            .trim()
            .toUpperCase();

    if (
        typ === "NŻ" ||
        typ === "NZ"
    ) {

        return true;
    }

    if (
        p.naZadanie === true ||
        String(
            p.naZadanie
        ).toLowerCase() ===
        "true"
    ) {

        return true;
    }

    if (
        p.nz === true ||
        String(
            p.nz
        ).toLowerCase() ===
        "true"
    ) {

        return true;
    }

    if (
        typeof p.nazwa ===
        "string" &&
        p.nazwa.includes(
            "(NŻ)"
        )
    ) {

        return true;
    }

    return false;
}


/* =========================================================
   LISTA PRZYSTANKÓW
   ========================================================= */

function pokazListePrzystankow(rozklad) {

    const kontener = document.getElementById("listaPrzystankow");

    if (!kontener) {
        return;
    }

    kontener.innerHTML = "";

    if (!rozklad || !rozklad.przystanki || !rozklad.przystanki.length) {
        return;
    }

    const przystanki = rozklad.przystanki;

    /* =========================================================
       1. ZNAJDŹ KURS BAZOWY DLA WYBRANEGO WARIANTU
       ========================================================= */

    const kursBazowy = znajdzKursBazowy(
        rozklad,
        aktualnyWariant
    );

    if (!kursBazowy) {

        przystanki.forEach((p) => {

            const div = document.createElement("div");
            div.className = "przystanek";

            const nazwa = document.createElement("div");
            nazwa.className = "nazwa-przystanku";
            nazwa.textContent =
                p.nazwa ||
                p.nazwaPrzystanku ||
                "";

            div.appendChild(nazwa);

            kontener.appendChild(div);
        });

        return;
    }


    /* =========================================================
       2. CZASY WYBRANEGO KURSU
       ========================================================= */

    const czasyKursu = pobierzCzasyKursu(
        kursBazowy,
        przystanki
    );


    /* =========================================================
       3. OKREŚLAMY, KTÓRE PRZYSTANKI SĄ OBSŁUGIWANE
       ========================================================= */

    const aktywne = przystanki.map((p, i) => {

        const czas = czasyKursu
            ? czasyKursu[i]
            : null;

        return (
            czas !== null &&
            czas !== undefined &&
            czas !== "" &&
            czas !== "-"
        );
    });


    /* =========================================================
       4. INDEKSY PIERWSZEGO I OSTATNIEGO OBSŁUGIWANEGO
       ========================================================= */

    let pierwszyAktywny = -1;
    let ostatniAktywny = -1;

    for (let i = 0; i < aktywne.length; i++) {

        if (aktywne[i]) {

            if (pierwszyAktywny === -1) {
                pierwszyAktywny = i;
            }

            ostatniAktywny = i;
        }
    }


    /* =========================================================
       5. DLA KAŻDEGO PRZYSTANKU USTALAMY JEGO POŁOŻENIE
       
       RIGHT  = kurs obsługuje przystanek
       LEFT   = kurs omija przystanek
       ========================================================= */

    const strony = [];

    for (let i = 0; i < przystanki.length; i++) {

        if (aktywne[i]) {
            strony[i] = "RIGHT";
        } else {
            strony[i] = "LEFT";
        }
    }


    /* =========================================================
       6. NIEOBSŁUGIWANE PRZYSTANKI PRZED STARTEM KURSU
          I ZA KOŃCEM KURSU NIE SĄ CZĘŚCIĄ OMIJANIA
       ========================================================= */

    for (let i = 0; i < pierwszyAktywny; i++) {
        strony[i] = "NONE";
    }

    for (
        let i = ostatniAktywny + 1;
        i < przystanki.length;
        i++
    ) {
        strony[i] = "NONE";
    }


    /* =========================================================
       7. SZUKAMY BLOKÓW POMIJANYCH PRZYSTANKÓW
       
       Przykład:

       A
       B   ← LEFT
       C   ← LEFT
       D
       
       tutaj kurs:
       
       A ───╲
             ╲
       B     │
       C     │
             ╱
       D ───╱
       ========================================================= */

    const pomijaneBloki = [];

    let blokStart = -1;

    for (let i = pierwszyAktywny; i <= ostatniAktywny; i++) {

        if (!aktywne[i]) {

            if (blokStart === -1) {
                blokStart = i;
            }

        } else {

            if (blokStart !== -1) {

                pomijaneBloki.push({
                    start: blokStart,
                    koniec: i - 1,
                    przed: blokStart - 1,
                    po: i
                });

                blokStart = -1;
            }
        }
    }


    /* =========================================================
       8. POMOCNICZE FUNKCJE SVG
       ========================================================= */

    const SVG_NS = "http://www.w3.org/2000/svg";

    const SVG_W = 52;
    const SVG_H = 44;

    const CENTER_X = 26;

    const LEFT_X = 8;
    const RIGHT_X = 44;


    function utworzSVG() {

        const svg = document.createElementNS(
            SVG_NS,
            "svg"
        );

        svg.setAttribute(
            "viewBox",
            `0 0 ${SVG_W} ${SVG_H}`
        );

        svg.setAttribute(
            "aria-hidden",
            "true"
        );

        return svg;
    }


    function linia(
        svg,
        x1,
        y1,
        x2,
        y2,
        klasa = ""
    ) {

        const l = document.createElementNS(
            SVG_NS,
            "line"
        );

        l.setAttribute("x1", x1);
        l.setAttribute("y1", y1);
        l.setAttribute("x2", x2);
        l.setAttribute("y2", y2);

        l.setAttribute(
            "stroke-linecap",
            "round"
        );

        l.setAttribute(
            "stroke-width",
            "3"
        );

        if (klasa) {
            l.classList.add(klasa);
        }

        svg.appendChild(l);

        return l;
    }


    function kolo(
        svg,
        x,
        y,
        promien,
        wypelnienie,
        obrys
    ) {

        const c = document.createElementNS(
            SVG_NS,
            "circle"
        );

        c.setAttribute("cx", x);
        c.setAttribute("cy", y);
        c.setAttribute("r", promien);

        c.setAttribute(
            "fill",
            wypelnienie
        );

        c.setAttribute(
            "stroke",
            obrys
        );

        c.setAttribute(
            "stroke-width",
            "2"
        );

        svg.appendChild(c);

        return c;
    }


    function kwadrat(
        svg,
        x,
        y,
        wypelnienie,
        obrys
    ) {

        const r = document.createElementNS(
            SVG_NS,
            "rect"
        );

        r.setAttribute(
            "x",
            x - 6
        );

        r.setAttribute(
            "y",
            y - 6
        );

        r.setAttribute(
            "width",
            "12"
        );

        r.setAttribute(
            "height",
            "12"
        );

        r.setAttribute(
            "fill",
            wypelnienie
        );

        r.setAttribute(
            "stroke",
            obrys
        );

        r.setAttribute(
            "stroke-width",
            "2"
        );

        svg.appendChild(r);

        return r;
    }


    /* =========================================================
       9. OKREŚLAMY, CZY PRZYSTANEK JEST POCZĄTKIEM/KOŃCEM
       ========================================================= */

    function czyPoczatekWariantu(i) {

        return (
            i === pierwszyAktywny
        );
    }


    function czyKoniecWariantu(i) {

        return (
            i === ostatniAktywny
        );
    }


    function czyPierwszyNaLiscie(i) {

        return i === 0;
    }


    function czyOstatniNaLiscie(i) {

        return i === przystanki.length - 1;
    }


    /* =========================================================
       10. FUNKCJA USTALAJĄCA RODZAJ PRZEJŚCIA
       
       WTP:
       
       RIGHT → RIGHT = p0/p4
       RIGHT → LEFT  = p5/p7
       LEFT  → LEFT  = p4/p0
       LEFT  → RIGHT = p1/p3
       ========================================================= */

    function typPrzejscia(
        poprzedniaStrona,
        aktualnaStrona
    ) {

        if (
            poprzedniaStrona === "RIGHT" &&
            aktualnaStrona === "RIGHT"
        ) {
            return "RIGHT_VERTICAL";
        }

        if (
            poprzedniaStrona === "LEFT" &&
            aktualnaStrona === "LEFT"
        ) {
            return "LEFT_VERTICAL";
        }

        if (
            poprzedniaStrona === "RIGHT" &&
            aktualnaStrona === "LEFT"
        ) {
            return "RIGHT_TO_LEFT";
        }

        if (
            poprzedniaStrona === "LEFT" &&
            aktualnaStrona === "RIGHT"
        ) {
            return "LEFT_TO_RIGHT";
        }

        return "NONE";
    }


    /* =========================================================
       11. RYSUJEMY LISTĘ
       ========================================================= */

    for (let i = 0; i < przystanki.length; i++) {

        const p = przystanki[i];

        const aktywny = aktywne[i];

        const poprzedniAktywny =
            i > 0
                ? aktywne[i - 1]
                : false;

        const nastepnyAktywny =
            i < przystanki.length - 1
                ? aktywne[i + 1]
                : false;


        const wiersz = document.createElement("div");

        wiersz.className =
            "wiersz-przystanku";


        /* =====================================================
           KONTENER SVG
           ===================================================== */

        const grafika =
            document.createElement("div");

        grafika.className =
            "grafika-przystanku";

        grafika.style.width = "52px";
        grafika.style.height = "44px";
        grafika.style.flex = "0 0 52px";


        const svg = utworzSVG();


        /* =====================================================
           KOLOR
           ===================================================== */

        const czyNZ =
            czyPrzystanekNaZadanie(p);


        let kolor = "#e42313";

        if (!aktywny) {
            kolor = "#bdbdbd";
        }


        /* =====================================================
           USTALAMY POŁOŻENIE WĘZŁA
           ===================================================== */

        let nodeX = CENTER_X;

        if (aktywny) {
            nodeX = RIGHT_X;
        }


        /*
         * Pomijany przystanek pozostaje na osi nazw,
         * natomiast linia kursu omija go z lewej.
         */

        if (!aktywny) {
            nodeX = CENTER_X;
        }


        /* =====================================================
           LINIA Z POPRZEDNIEGO PRZYSTANKU
           ===================================================== */

        if (i > 0) {

            const poprzednia = strony[i - 1];
            const aktualna = strony[i];

            const przejscie =
                typPrzejscia(
                    poprzednia,
                    aktualna
                );


            if (przejscie === "RIGHT_VERTICAL") {

                linia(
                    svg,
                    RIGHT_X,
                    0,
                    RIGHT_X,
                    22,
                    "p0"
                );

            } else if (przejscie === "LEFT_VERTICAL") {

                linia(
                    svg,
                    LEFT_X,
                    0,
                    LEFT_X,
                    22,
                    "p0"
                );

            } else if (
                przejscie === "RIGHT_TO_LEFT"
            ) {

                linia(
                    svg,
                    RIGHT_X,
                    0,
                    LEFT_X,
                    22,
                    "p7"
                );

            } else if (
                przejscie === "LEFT_TO_RIGHT"
            ) {

                linia(
                    svg,
                    LEFT_X,
                    0,
                    RIGHT_X,
                    22,
                    "p1"
                );
            }
        }


        /* =====================================================
           LINIA DO NASTĘPNEGO PRZYSTANKU
           ===================================================== */

        if (i < przystanki.length - 1) {

            const aktualna = strony[i];

            const nastepna = strony[i + 1];

            const przejscie =
                typPrzejscia(
                    aktualna,
                    nastepna
                );


            if (
                przejscie === "RIGHT_VERTICAL"
            ) {

                linia(
                    svg,
                    RIGHT_X,
                    22,
                    RIGHT_X,
                    44,
                    "p4"
                );

            } else if (
                przejscie === "LEFT_VERTICAL"
            ) {

                linia(
                    svg,
                    LEFT_X,
                    22,
                    LEFT_X,
                    44,
                    "p4"
                );

            } else if (
                przejscie === "RIGHT_TO_LEFT"
            ) {

                linia(
                    svg,
                    RIGHT_X,
                    22,
                    LEFT_X,
                    44,
                    "p5"
                );

            } else if (
                przejscie === "LEFT_TO_RIGHT"
            ) {

                linia(
                    svg,
                    LEFT_X,
                    22,
                    RIGHT_X,
                    44,
                    "p3"
                );
            }
        }


        /* =====================================================
           WĘZEŁ PRZYSTANKU
           ===================================================== */

        const poczatek =
            czyPierwszyNaLiscie(i) ||
            czyPoczatekWariantu(i);

        const koniec =
            czyOstatniNaLiscie(i) ||
            czyKoniecWariantu(i);


        if (czyNZ) {

            /*
             * NŻ = pusty okrąg
             */

            kolo(
                svg,
                nodeX,
                22,
                6,
                "#fff",
                kolor
            );

        } else if (poczatek || koniec) {

            /*
             * WTP używa kwadratu na początku/końcu
             */

            kwadrat(
                svg,
                nodeX,
                22,
                kolor,
                kolor
            );

        } else {

            /*
             * Zwykły przystanek
             */

            kolo(
                svg,
                nodeX,
                22,
                6,
                kolor,
                kolor
            );
        }


        grafika.appendChild(svg);

        wiersz.appendChild(grafika);


        /* =====================================================
           NAZWA PRZYSTANKU
           ===================================================== */

        const nazwa =
            document.createElement("div");

        nazwa.className =
            "nazwa-przystanku";

        nazwa.style.marginLeft = "2px";

        nazwa.textContent =
            p.nazwa ||
            p.nazwaPrzystanku ||
            p.nazwa_przystanku ||
            "";


        /* =====================================================
           KLIKNIĘCIE PRZYSTANKU
           ===================================================== */

        wiersz.style.cursor = "pointer";

        wiersz.addEventListener(
            "click",
            function () {

                ustawWybranyPrzystanek(
                    p
                );

                pokazRozklad();
            }
        );


        wiersz.appendChild(nazwa);

        kontener.appendChild(wiersz);


        /* =====================================================
           DODATKOWY WIERSZ PRZERWY
           
           Gdy kurs:
           
           RIGHT
             ↓
           LEFT
           LEFT
             ↓
           RIGHT
           
           robimy dodatkowy odstęp przy powrocie.
           ===================================================== */

        if (
            i < przystanki.length - 1 &&
            strony[i] === "LEFT" &&
            strony[i + 1] === "RIGHT"
        ) {

            const przerwa =
                document.createElement("div");

            przerwa.className =
                "przerwa-trasy";

            przerwa.style.height =
                "10px";

            kontener.appendChild(
                przerwa
            );
        }
    }


    /* =========================================================
       12. DOPASOWANIE ODSTĘPÓW
       ========================================================= */

    kontener.style.position = "relative";


    /*
     * Nazwy są bliżej grafiki WTP.
     */

    const nazwy =
        kontener.querySelectorAll(
            ".nazwa-przystanku"
        );

    nazwy.forEach(
        function (el) {

            el.style.marginLeft =
                "2px";

            el.style.paddingLeft =
                "0";
        }
    );
}


/* =========================================================
   WYBÓR PRZYSTANKU
   ========================================================= */

function wybierzPrzystanek(
    p,
    index
) {

    ustawWybranyPrzystanek(
        p,
        index
    );

    widokKursuAktywny =
        false;

    aktualizujHistorieURL(
        "idx:" + index
    );

    pokazRozklad();


    requestAnimationFrame(
        () => {

            window.scrollTo(
                0,
                0
            );

            requestAnimationFrame(
                () => {

                    window.scrollTo(
                        0,
                        0
                    );
                }
            );
        }
    );
}


/* =========================================================
   WIDOK PRZYSTANKU
   ========================================================= */

function pokazRozkladWybranegoPrzystanku(
    rozklad,
    przystanek
) {

    const kontener =
        document.getElementById(
            "przystanki"
        );


    document.querySelector(
        ".dni"
    ).style.display =
        "flex";


    if (
        aktualnyDzien !==
        "kalendarz"
    ) {

        document.getElementById(
            "kalendarz"
        ).style.display =
            "none";
    }


    document.getElementById(
        "typRozkładu"
    ).style.display =
        "block";


    document.getElementById(
        "typRozkładu"
    ).textContent =
        rozklad.nazwa ||
        "Rozkład jazdy";


    document.getElementById(
        "warianty-pojemnik"
    ).style.display =
        "none";


    kontener.innerHTML =
        "";


    const naglowek =
        document.createElement(
            "div"
        );


    naglowek.className =
        "naglowek-przystanku-widok";


    naglowek.innerHTML =
        `<div class="nazwa">
            ${przystanek.nazwa}
        </div>

        <div class="numer">
            ${
                przystanek.nr
                    ? przystanek.nr
                    : ""
            }
        </div>`;


    kontener.appendChild(
        naglowek
    );


    const blok =
        document.createElement(
            "div"
        );


    blok.className =
        "przystanek";


    const godziny =
        document.createElement(
            "div"
        );


    godziny.className =
        "godziny";


    if (
        !przystanek.kursy ||
        przystanek.kursy.length === 0
    ) {

        godziny.innerHTML =
            '<div class="brak-godzin">' +
            'Brak odjazdów' +
            '</div>';

    } else {

        let aktGodz =
            null;

        let wiersz =
            null;


        przystanek.kursy.forEach(
            k => {

                const dop =
                    String(
                        k.czas || ""
                    )
                        .trim()
                        .match(
                            /^(\d{1,2}):(\d{2})$/
                        );


                if (!dop)
                    return;


                const g =
                    Number(
                        dop[1]
                    );

                const m =
                    dop[2];


                if (
                    aktGodz !== g
                ) {

                    aktGodz =
                        g;


                    wiersz =
                        document.createElement(
                            "div"
                        );


                    wiersz.className =
                        "wiersz-godziny";


                    wiersz.innerHTML =
                        `<div class="kolumna-godzina">
                            ${String(g).padStart(2, "0")}
                        </div>`;


                    godziny.appendChild(
                        wiersz
                    );
                }


                const kol =
                    document.createElement(
                        "div"
                    );


                kol.className =
                    "kolumna-minuta";


                const litera =
                    pobierzWariant(
                        k
                    );


                kol.innerHTML =
                    `<span class="minuta-z-wariantem">

                        <span class="minuta">
                            ${m}
                        </span>

                        ${
                            litera
                                ? `<span class="wariant-minuty">
                                    ${litera}
                                  </span>`
                                : ""
                        }

                    </span>`;


                if (
                    k.numer !== undefined &&
                    k.numer !== null
                ) {

                    kol.title =
                        "Zobacz przebieg kursu " +
                        k.numer +
                        (
                            litera
                                ? " (" +
                                  litera +
                                  ")"
                                : ""
                        );


                    kol.onclick =
                        () =>
                            pokazCalyKurs(
                                k.numer,
                                litera
                            );
                }


                wiersz.appendChild(
                    kol
                );
            }
        );
    }


    blok.appendChild(
        godziny
    );


    /* =====================================================
       LEGENDA WARIANTÓW
       ===================================================== */

    const uzyteWarianty =
        new Map();


    if (
        przystanek.kursy
    ) {

        przystanek.kursy.forEach(
            k => {

                const w =
                    pobierzWariant(
                        k
                    );

                if (w)
                    uzyteWarianty.set(
                        w,
                        ""
                    );
            }
        );
    }


    if (
        uzyteWarianty.size > 0 &&
        rozklad.warianty
    ) {

        const leg =
            document.createElement(
                "div"
            );

        leg.className =
            "legenda-wariantow";


        let legList =
            '<div class="legenda-lista">';


        uzyteWarianty.forEach(
            (
                _,
                litera
            ) => {

                const w =
                    rozklad.warianty.find(
                        x =>
                            x.litera ===
                            litera
                    );


                if (w) {

                    legList +=
                        `<div class="legenda-element">

                            <span class="legenda-litera">
                                ${litera}
                            </span>

                            <span class="legenda-separator">
                                -
                            </span>

                            <span class="legenda-opis">
                                ${w.opis}
                            </span>

                        </div>`;
                }
            }
        );


        legList +=
            "</div>";


        leg.innerHTML =
            legList;


        blok.appendChild(
            leg
        );
    }


    kontener.appendChild(
        blok
    );


    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    window.scrollTo({
                        top: 0,
                        left: 0,
                        behavior: "auto"
                    });

                    document.documentElement.scrollTop =
                        0;

                    document.body.scrollTop =
                        0;
                }
            );
        }
    );
}


/* =========================================================
   CAŁY KURS
   ========================================================= */

function pokazCalyKurs(
    nrKursu,
    wariantKursu = null
) {

    widokKursuAktywny =
        true;


    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !rozklad.kierunki ||
        !rozklad.kierunki[
            aktualnyKierunek
        ]
    )
        return;


    const kierunek =
        rozklad.kierunki[
            aktualnyKierunek
        ];


    const przystankiK =
        kierunek.przystanki ||
        [];


    const kursPrzystanki =
        [];


    const szukanyNumer =
        String(
            nrKursu
        ).trim();


    const szukanyWariant =
        String(
            wariantKursu ||
            ""
        ).trim();


    przystankiK.forEach(
        (
            p,
            originalIndex
        ) => {

            const k =
                (
                    p.kursy ||
                    []
                ).find(
                    x => {

                        const numer =
                            String(
                                x.numer
                            ).trim();


                        const wariant =
                            pobierzWariant(
                                x
                            );


                        if (
                            numer !==
                            szukanyNumer
                        ) {

                            return false;
                        }


                        if (
                            wariantKursu !== null &&
                            wariant !==
                            szukanyWariant
                        ) {

                            return false;
                        }


                        return true;
                    }
                );


            if (k) {

                kursPrzystanki.push(
                    {
                        nazwa:
                            p.nazwa,

                        nr:
                            p.nr,

                        nz:
                            czyPrzystanekNaZadanie(
                                p
                            ),

                        czas:
                            k.czas,

                        wariant:
                            pobierzWariant(
                                k
                            ),

                        originalIndex:
                            originalIndex
                    }
                );
            }
        }
    );


    const kontener =
        document.getElementById(
            "przystanki"
        );


    document.getElementById(
        "typRozkładu"
    ).style.display =
        "block";


    document.getElementById(
        "typRozkładu"
    ).textContent =
        "Przebieg kursu";


    document.querySelector(
        ".dni"
    ).style.display =
        "none";


    document.getElementById(
        "kalendarz"
    ).style.display =
        "none";


    document.getElementById(
        "warianty-pojemnik"
    ).style.display =
        "none";


    kontener.innerHTML =
        "";


    /* =====================================================
       AKTUALNY PRZYSTANEK
       ===================================================== */

    let stopIndex =
        -1;


    if (
        wybranyPrzystanekIndex !== null
    ) {

        const originalIndex =
            Number(
                wybranyPrzystanekIndex
            );


        stopIndex =
            kursPrzystanki.findIndex(
                p =>
                    p.originalIndex ===
                    originalIndex
            );
    }


    if (
        stopIndex === -1 &&
        wybranyPrzystanek
    ) {

        stopIndex =
            kursPrzystanki.findIndex(
                p =>
                    String(
                        p.nr || ""
                    ) ===
                    String(
                        wybranyPrzystanek.nr ||
                        ""
                    )
                    &&
                    String(
                        p.nazwa || ""
                    ) ===
                    String(
                        wybranyPrzystanek.nazwa ||
                        ""
                    )
            );
    }


    const currentStopName =
        stopIndex !== -1
            ? kursPrzystanki[
                stopIndex
            ].nazwa
            : (
                kursPrzystanki.length
                    ? kursPrzystanki[0].nazwa
                    : ""
            );


    const lastStopName =
        kursPrzystanki.length
            ? kursPrzystanki[
                kursPrzystanki.length - 1
            ].nazwa
            : "";


    const widok =
        document.createElement(
            "div"
        );


    widok.className =
        "kurs-widok";


    widok.innerHTML =
        `<div class="kurs-naglowek">

            <div class="kurs-tytul">
                ${currentStopName}
                &rarr;
                ${lastStopName}
            </div>

            <div class="kurs-informacja">

                Kurs ${nrKursu}

                ${
                    szukanyWariant
                        ? " | Wariant " +
                          szukanyWariant
                        : ""
                }

                |
                Przebieg przez
                ${kursPrzystanki.length}
                przystanków

            </div>

        </div>`;


    const lista =
        document.createElement(
            "div"
        );


    lista.className =
        "kurs-lista";


    const czasWMinutach =
        cz => {

            const minuty =
                czasNaMinuty(
                    cz
                );

            return minuty === null
                ? 0
                : minuty;
        };


    const startIndex =
        stopIndex !== -1
            ? stopIndex
            : 0;


    const baseTime =
        kursPrzystanki.length
            ? czasWMinutach(
                kursPrzystanki[
                    startIndex
                ].czas
            )
            : 0;


    kursPrzystanki.forEach(
        (
            el,
            index
        ) => {

            const isPast =
                stopIndex !== -1 &&
                index < stopIndex;


            const isCurrent =
                stopIndex !== -1 &&
                index === stopIndex;


            const isFirst =
                index === 0;


            const isLast =
                index ===
                kursPrzystanki.length - 1;


            /*
             * W widoku całego kursu pierwszy i ostatni
             * przystanek przebiegu są kwadratami.
             *
             * Jest to niezależne od tego, gdzie ten kurs
             * zaczyna/kończy się na pełnej trasie.
             */

            const shouldBeSquare =
                isFirst ||
                isLast;


            const wiersz =
                document.createElement(
                    "div"
                );


            wiersz.className =
                "kurs-przystanek" +
                (
                    isCurrent
                        ? " aktywny"
                        : ""
                );


            let diffText =
                "";


            if (!isPast) {

                let diff =
                    czasWMinutach(
                        el.czas
                    ) -
                    baseTime;


                if (
                    diff < 0
                ) {

                    diff +=
                        24 * 60;
                }


                diffText =
                    `${diff} min`;
            }


            const strokeColor =
                isPast
                    ? "#cccccc"
                    : (
                        isCurrent
                            ? "#000000"
                            : (
                                isFirst
                                    ? "#000000"
                                    : "#e42313"
                            )
                    );


            const fillColor =
                isPast
                    ? "#cccccc"
                    : (
                        isCurrent
                            ? "#000000"
                            : (
                                isFirst
                                    ? "#000000"
                                    : "#e42313"
                            )
                    );


            const topSegColor =
                isPast ||
                isCurrent
                    ? "#cccccc"
                    : "#000000";


            const botSegColor =
                isPast
                    ? "#cccccc"
                    : "#000000";


            let svgHtml =
                `<svg
                    width="40"
                    height="44"
                    style="display:block; overflow:visible;"
                >`;


            if (
                index > 0
            ) {

                svgHtml +=
                    `<line
                        x1="20"
                        y1="0"
                        x2="20"
                        y2="22"
                        stroke="${topSegColor}"
                        stroke-width="2.5"
                    />`;
            }


            if (
                index <
                kursPrzystanki.length - 1
            ) {

                svgHtml +=
                    `<line
                        x1="20"
                        y1="22"
                        x2="20"
                        y2="44"
                        stroke="${botSegColor}"
                        stroke-width="2.5"
                    />`;
            }


            /* =================================================
               KSZTAŁT WĘZŁA W WIDOKU KURSU
               ================================================= */

            if (
                shouldBeSquare
            ) {

                if (el.nz) {

                    svgHtml +=
                        `<rect
                            x="13.25"
                            y="15.25"
                            width="13.5"
                            height="13.5"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    svgHtml +=
                        `<rect
                            x="12"
                            y="14"
                            width="16"
                            height="16"
                            fill="${fillColor}"
                            stroke="none"
                        />`;
                }

            } else {

                if (el.nz) {

                    svgHtml +=
                        `<circle
                            cx="20"
                            cy="22"
                            r="6.75"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    svgHtml +=
                        `<circle
                            cx="20"
                            cy="22"
                            r="8"
                            fill="${fillColor}"
                            stroke="none"
                        />`;
                }
            }


            svgHtml +=
                "</svg>";


            const textStyling =
                isPast
                    ? "color:#aaaaaa; font-weight:600;"
                    : (
                        isCurrent
                            ? "color:#000000; font-weight:900; font-size:17px;"
                            : "color:#000000; font-weight:600;"
                    );


            const timeStyling =
                isPast
                    ? "color:#aaaaaa; font-weight:600;"
                    : (
                        isCurrent
                            ? "color:#000000; font-weight:900; font-size:17px;"
                            : "color:#000000; font-weight:600;"
                    );


            const nrStyling =
                isPast
                    ? "color:#cccccc;"
                    : "color:#777777;";


            const relTimeStyling =
                isPast
                    ? "color:#cccccc;"
                    : (
                        isCurrent
                            ? "color:#444444; font-weight:600;"
                            : "color:#888888;"
                    );


            wiersz.innerHTML =
                `
                <div
                    class="kurs-czas-rel"
                    style="${relTimeStyling}"
                >
                    ${diffText}
                </div>

                <div
                    class="node-wrapper"
                    style="width:40px;"
                >
                    ${svgHtml}
                </div>

                <div
                    class="kurs-nazwa-box"
                    style="${textStyling}"
                >
                    ${el.nazwa}
                </div>

                <div
                    class="kurs-nr"
                    style="${nrStyling}"
                >
                    ${el.nr || ""}
                </div>

                <div
                    class="kurs-czas-abs"
                    style="${timeStyling}"
                >
                    ${el.czas}
                </div>
                `;


            lista.appendChild(
                wiersz
            );
        }
    );


    widok.appendChild(
        lista
    );


    kontener.appendChild(
        widok
    );
}


/* =========================================================
   BŁĄD
   ========================================================= */

function pokazBlad(
    tytul,
    opis
) {

    document.getElementById(
        "numerLinii"
    ).textContent =
        "Błąd";


    document.getElementById(
        "trasa"
    ).textContent =
        "";


    document.getElementById(
        "kierunki"
    ).innerHTML =
        "";


    document.getElementById(
        "typRozkładu"
    ).style.display =
        "none";


    const wp =
        document.getElementById(
            "warianty-pojemnik"
        );


    if (wp)
        wp.style.display =
            "none";


    document.getElementById(
        "przystanki"
    ).innerHTML =
        '<div class="blad">' +
            '<strong>' +
                tytul +
            '</strong>' +
            opis +
        '</div>';
}


/* =========================================================
   HISTORIA PRZEGLĄDARKI
   ========================================================= */

window.addEventListener(
    "popstate",
    function() {

        const url =
            new URL(
                window.location.href
            );


        const pParam =
            url.searchParams.get(
                "przystanek"
            );


        const kParam =
            url.searchParams.get(
                "kierunek"
            );


        if (
            kParam !== null &&
            !isNaN(
                Number(kParam)
            )
        ) {

            aktualnyKierunek =
                Number(
                    kParam
                );
        }


        const rozklad =
            znajdzRozklad();


        if (
            pParam &&
            rozklad &&
            rozklad.kierunki &&
            rozklad.kierunki[
                aktualnyKierunek
            ]
        ) {

            const kierunek =
                rozklad.kierunki[
                    aktualnyKierunek
                ];


            const przystanki =
                kierunek.przystanki ||
                [];


            const p =
                znajdzPrzystanek(
                    przystanki,
                    pParam
                );


            if (p) {

                const index =
                    przystanki.indexOf(
                        p
                    );


                ustawWybranyPrzystanek(
                    p,
                    index
                );

            } else {

                ustawWybranyPrzystanek(
                    null
                );
            }

        } else {

            ustawWybranyPrzystanek(
                null
            );
        }


        widokKursuAktywny =
            false;


        pokazRozklad();
    }
);

</script>
