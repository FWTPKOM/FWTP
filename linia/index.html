<!DOCTYPE html>

<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FWTP - Rozkład</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800;900&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   GŁÓWNY KONTENER I NAGŁÓWKI
   ========================================================= */

.rozkład {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px;
}

/* =========================================================
   NAGŁÓWEK LINII
   ========================================================= */

.naglowek-linii {
    display: block;

    width: fit-content;
    min-width: 165px;

    margin-left: 10%;
    margin-right: 0;

    margin-bottom: 15px;

    background: white;

    border: 1px solid #ddd;

    border-radius: 0;

    padding: 0;

    box-sizing: border-box;

    text-align: center;

    overflow: hidden;
}


/* =========================================================
   NUMER LINII
   ========================================================= */

.numer-linii {
    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;

    height: 100px;

    margin: 0;
    padding: 0 22px;

    box-sizing: border-box;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 80px;

    font-weight: 700;

    line-height: 1;

    text-align: center;

    color: #222;

    /* WAŻNE */
    transform: none;
}


/* =========================================================
   FIOLETOWY PASEK POD NUMEREM
   ========================================================= */

.naglowek-linii::after {
    content: "";

    display: block;

    width: 100%;

    height: 16px;

    background: #990066;
}


/* =========================================================
   TRAMWAJ
   ========================================================= */

.naglowek-linii.tramwaj::after {
    background: #e30613;
}


/* =========================================================
   UKRYCIE TRASY
   ========================================================= */

.trasa {
    display: none;
}


/* =========================================================
   TRAMWAJ
   ========================================================= */

.naglowek-linii.tramwaj {
    border-bottom-color: #e30613;
}

/* =========================================================
   KIERUNKI I DNI
   ========================================================= */

.kierunki {
    display: flex;
    gap: 10px;
    width: 80%;
    margin-left: auto;
    margin-right: auto;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

/* =========================================================
   KALENDARZ 7 DNI
   ========================================================= */

.dni {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;

    width: 80%;

    margin-left: auto;
    margin-right: auto;
    margin-bottom: 8px;

    box-sizing: border-box;
}

.kierunek-btn,
.dzien-btn {
    flex: 1;
    padding: 14px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
     font-family:
        "Barlow Semi Condensed",
        sans-serif;
   font-size: 17px;
    font-weight: 700;
    color: #222;
    text-align: center;
    transition: 0.15s;
    box-sizing: border-box;
}

.dni .dzien-btn {
    min-width: 0;
    padding: 10px 4px;
    font-size: 15px;
    line-height: 1.15;
    white-space: nowrap;
}

.kierunek-btn:hover,
.dzien-btn:hover {
    color: #d61c12;
    border-color: #d61c12;
    background: #fff;
}

.kierunek-btn.aktywny,
.dzien-btn.aktywny {
   background: #d61c12;
    color: white;
    border-color: #d61c12;
}
.kierunek-btn.aktywny:hover {
    background: #d61c12;

    color: white;

    border-color: #d61c12;
}

/* =========================================================
   WSPÓLNA SZEROKOŚĆ ELEMENTÓW ROZKŁADU
   ========================================================= */

/*
 * Pasek 7 dni, wybór innego dnia, informacja o typie
 * rozkładu oraz właściwy rozkład przystanku mają dokładnie
 * taką samą szerokość jak lista przystanków.
 */
.dni,
.kalendarz,
.typ-rozkładu,
.warianty-pojemnik,
.lista-przystankow,
.naglowek-przystanku-widok,
.przystanek,
.kurs-widok {
    width: 80%;
    margin-left: auto;
    margin-right: auto;
    box-sizing: border-box;
}

/* =========================================================
   WARIANTY
   ========================================================= */

.warianty-pojemnik {
    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #fff;

    border-top: 2px solid #ccc;
    border-bottom: 2px solid #ccc;

    width: 80%;

    margin-left: auto;
    margin-right: auto;

    padding: 10px 10px 10px 15px;

    margin-bottom: 0;

    box-sizing: border-box;
}

.warianty-info {
    font-size: 15px;
    color: #1d1d1b;
    padding-left: 10px;
}

.warianty-info strong {
    font-weight: 700;
}

.warianty-przyciski {
    display: flex;
    gap: 2px;
    padding-right: 10px;
}

.wariant-btn {
    padding: 4px 12px;

    font-size: 22px;
    font-weight: 900;

    color: #706f6f;

    background: transparent;
    border: none;

    border-bottom: 4px solid transparent;

    cursor: pointer;

    transition: 0.15s;

    font-family: inherit;

    text-transform: uppercase;
}

.wariant-btn:hover {
    color: #d61c12;
}

.wariant-btn.aktywny {
    color: #d61c12;
    border-bottom-color: #d61c12;
}


/* =========================================================
   KALENDARZ / ŁADOWANIE / BŁĘDY
   ========================================================= */

.kalendarz {
    display: none;

    width: 80%;
    margin-left: auto;
    margin-right: auto;
    margin-bottom: 8px;

    background: white;

    border: 1px solid #ddd;
    border-radius: 6px;

    padding: 12px 15px;
    box-sizing: border-box;
}

.kalendarz-tytul {
    margin-bottom: 8px;
    font-size: 15px;
    font-weight: 700;
    color: #222;
}

.kalendarz input {
    padding: 10px;

    font-size: 16px;

    border: 1px solid #ccc;
    border-radius: 5px;
}

.typ-rozkładu {
    display: none !important;

    background: #f7f7f7;

    border: 1px solid #ddd;

    width: 80%;

    margin-left: auto;
    margin-right: auto;

    padding: 12px 15px;

    margin-bottom: 15px;

    border-radius: 6px;

    font-size: 14px;
    color: #555;

    box-sizing: border-box;
}

.brak-godzin {
    padding: 15px;

    color: #777;

    font-size: 14px;
}

.loading {
    background: white;

    border: 1px solid #ddd;
    border-radius: 8px;

    padding: 30px;

    text-align: center;

    color: #666;
}

.blad {
    background: #fff4f4;

    border: 1px solid #e0aaaa;

    color: #a00000;

    border-radius: 8px;

    padding: 20px;

    line-height: 1.6;
}

.blad strong {
    display: block;
    margin-bottom: 8px;
}

.brak-danych {
    padding: 30px;

    text-align: center;

    color: #777;

    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;
}


/* =========================================================
   ROZKŁAD JAZDY
   ========================================================= */

.przystanek {
    background: white;

    border: 1px solid #ddd;

    border-radius: 7px;

    overflow: hidden;
}

.godziny {
    width: 100%;
}

.wiersz-godziny {
    display: flex;
    align-items: stretch;
    width: 100%;
    min-height: 38px;
    border-bottom: 1px solid #eee;
}

.minuty-w-godzinie {
    display: flex;
    flex: 1 1 auto;
    flex-wrap: wrap;
    align-content: flex-start;
    min-width: 0;
}

.kolumna-godzina {
    display: flex;
    width: 43px;
    min-width: 43px;
    flex: 0 0 43px;

    align-items: center;
    justify-content: center;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 16px;

    font-weight: 600;

    background: #555;

    color: white;

    border-right: 1px solid #444;

    min-height: 38px;
}

.kolumna-minuta {
    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    position: relative;

    min-height: 38px;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-weight: 600;

    width: 46px;

    color: black;

    transform: translateX(10px);

    cursor: pointer;
}

.kolumna-minuta:hover {
    background: transparent;
    color: #d61c12;
}

.kolumna-minuta:hover .minuta,
.kolumna-minuta:hover .wariant-minuty {
    color: #d61c12;
}

.minuta-z-wariantem {
    position: relative;

    display: inline-block;

    line-height: 1;

    text-align: center;
}

.minuta {
    display: inline-block;

    font-size: 16px;

    font-weight: 600;

    line-height: 1;

    z-index: 1;
}

.wariant-minuty {
    position: absolute;

    left: calc(100% + 2px);

    bottom: -1px;

    font-size: 12px;

    line-height: 1;

    font-weight: 600;

    white-space: nowrap;

    z-index: 2;
}


/* =========================================================
   LEGENDA
   ========================================================= */

.legenda-wariantow {
    background: #f7f7f7;

    border-top: 1px solid #ddd;

    padding: 10px 15px;

    font-size: 16px;

    color: #555;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;
}

.legenda-element {
    display: flex;

    align-items: baseline;

    gap: 6px;

    line-height: 1.35;

    font-weight: 600;
}

.legenda-litera,
.legenda-separator,
.legenda-opis {
    color: black;

    font-size: 15px;
}

.legenda-litera {
    font-size: 16px;

    min-width: 22px;
}


/* =========================================================
   LISTA PRZYSTANKÓW
   ========================================================= */

.lista-przystankow {
    display: flex;

    flex-direction: column;

    gap: 0;

    background: white;

    padding: 15px 0;

    border-radius: 0;

    width: 80%;

    margin: 0 auto;

    box-sizing: border-box;
}


/* =========================================================
   WIERSZ PRZYSTANKU
   ========================================================= */

.przystanek-btn {
    width: 100%;

    display: flex;

    align-items: center;

    padding: 0;

    background: transparent;

    border: none;

    cursor: default;

    text-align: left;

    font-family: inherit;

    height: 44px;

    margin: 0;

    position: relative;
}

.przystanek-btn:hover {
    background: transparent;
}

.przystanek-nazwa,
.przystanek-nr {
    cursor: pointer;
}

.przystanek-btn.hover-przystanek .przystanek-nazwa,
.przystanek-btn.hover-przystanek .przystanek-nr {
    color: #d61c12 !important;
}


/* =========================================================
   KOLUMNA CZASU PRZEJAZDU
   ========================================================= */

.kolumna-czas-przejazdu {
    width: 48px;

    min-width: 48px;

    max-width: 48px;

    height: 44px;

    display: flex;

    align-items: center;

    justify-content: center;

    box-sizing: border-box;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 13px;

    font-weight: 600;

    color: #777;

    flex-shrink: 0;

    white-space: nowrap;
}

.kolumna-czas-przejazdu.pierwszy {
    color: #777;
}


/* =========================================================
   OŚ TRASY
   ========================================================= */

.node-wrapper {
    height: 44px;

    position: relative;

    flex-shrink: 0;
}

.node-wrapper svg {
    display: block;

    overflow: visible;
}

/* =========================================================
   WARSTWY TRASY

   Szare linie są zawsze pod czarnymi, a znaczniki przystanków
   są nad obiema warstwami. Dzięki rozdzieleniu na osobne SVG
   działa to także wtedy, gdy odcinki wychodzą poza wysokość
   własnego wiersza i przecinają się z liniami sąsiedniego wiersza.
   ========================================================= */
.node-wrapper .trasa-warstwa {
    position: absolute;
    left: 0;
    top: 0;
    display: block;
    overflow: visible;
    pointer-events: none;
}

.node-wrapper .trasa-warstwa-szara {
    z-index: 1;
}

.node-wrapper .trasa-warstwa-czarna {
    z-index: 2;
}

.node-wrapper .trasa-warstwa-punkty {
    z-index: 3;
}


/* =========================================================
   NAZWA PRZYSTANKU
   ========================================================= */

.przystanek-nazwa {
    flex: 1;

    display: flex;

    align-items: center;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 16px;

    font-weight: 600;

    color: #000;

    padding-left: 12px;

    transition: color 0.15s;

    z-index: 11;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.przystanek-btn.inactive .przystanek-nazwa {
    color: #999;

    font-weight: 600;
}



/* =========================================================
   NUMER PRZYSTANKU
   ========================================================= */

.przystanek-nr {
    margin-left: auto;

    display: flex;

    align-items: center;

    padding: 0 16px 0 10px;

    font-size: 14px;

    font-weight: 600;

    color: #666;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    flex-shrink: 0;

    z-index: 11;
}

.przystanek-btn.inactive .przystanek-nr {
    color: #ccc;
}


/* =========================================================
   WIDOK PRZYSTANKU
   ========================================================= */

.naglowek-przystanku-widok {
    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;

    padding: 20px;

    margin-bottom: 15px;
}

.naglowek-przystanku-widok .nazwa {
    display: inline;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 26px;

    font-weight: 700;

    margin-bottom: 0;
}

.naglowek-przystanku-widok .numer {
    display: inline;

    margin-left: 8px;

    color: #777;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 18px;

    font-weight: 600;
}


/* =========================================================
   WIDOK CAŁEGO KURSU
   ========================================================= */

.kurs-widok {
    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;

    overflow: hidden;

    margin-top: 15px;
}

.kurs-naglowek {
    background: #555;

    color: white;

    padding: 15px;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;
}

.kurs-naglowek .kurs-tytul {
    font-size: 22px;

    margin-bottom: 5px;

    font-weight: 600;
}

.kurs-naglowek .kurs-informacja {
    font-size: 12px;

    opacity: 0.9;
}

.kurs-lista {
    display: flex;

    flex-direction: column;

    padding: 10px 0;
}

.kurs-przystanek {
    display: flex;

    align-items: center;

    height: 44px;

    cursor: default;
}

.kurs-przystanek:hover {
    background: transparent;
}

.kurs-przystanek.aktywny {
    background: transparent;
}

.kurs-nazwa-box,
.kurs-nr {
    cursor: pointer;
}

.kurs-przystanek.hover-przystanek .kurs-nazwa-box,
.kurs-przystanek.hover-przystanek .kurs-nr {
    color: #d61c12 !important;
}

.kurs-czas-rel {
    width: 60px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding-right: 0;

    color: #888;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 13px;

    flex-shrink: 0;
}

.kurs-nazwa-box {
    flex: 1;

    display: flex;

    align-items: center;

    padding-left: 12px;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 15px;

    font-weight: 600;

    color: #000;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.kurs-nr {
    margin-left: auto;

    display: flex;

    align-items: center;

    padding-right: 15px;

    font-size: 13px;

    font-weight: 600;

    color: #777;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    flex-shrink: 0;
}

/* Nieobsługiwane przystanki po końcu kursu skróconego */
.kurs-przystanek.nieaktywny .kurs-nazwa-box {
    color: #999;
    font-weight: 400;
}

.kurs-przystanek.nieaktywny .kurs-nr {
    color: #c4c4c4;
    font-weight: 400;
}

/*
 * Po najechaniu zachowujemy normalne zachowanie strony:
 * nazwa i numer przystanku robią się czerwone.
 */
.kurs-przystanek.nieaktywny .kurs-nazwa-box:hover,
.kurs-przystanek.nieaktywny .kurs-nr:hover {
    color: #d61c12 !important;
}


.kurs-czas-abs {
    width: 65px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-weight: 600;

    font-size: 15px;

    flex-shrink: 0;
}


/* =========================================================
   RESPONSYWNOŚĆ
   ========================================================= */

@media (max-width: 900px) {

    .dni {
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }
}


@media (max-width: 550px) {

    /*
     * Na telefonie cały rozkład wykorzystuje pełną
     * szerokość ekranu.
     */
    .rozkład {
        width: 100%;
        max-width: none;
        margin: 0 auto;
        padding: 0;
        box-sizing: border-box;
    }

    .kierunki,
    .dni,
    .kalendarz,
    .typ-rozkładu,
    .warianty-pojemnik,
    .przystanki,
    #przystanki,
    .lista-przystankow,
    .naglowek-przystanku-widok,
    .przystanek,
    .kurs-widok {
        width: 100%;
        max-width: none;
        margin-left: 0;
        margin-right: 0;
        box-sizing: border-box;
    }

    .dni {
        display: flex !important;
        grid-template-columns: none;
        gap: 5px;

        width: 100%;
        max-width: 100%;

        overflow-x: auto;
        overflow-y: hidden;

        padding: 0 6px 6px 6px;

        box-sizing: border-box;

        scroll-snap-type: x proximity;
        scroll-behavior: smooth;

        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;

        scrollbar-width: none;
    }

    .dni::-webkit-scrollbar {
        display: none;
    }

    .dni .dzien-btn {
        flex: 0 0 112px;
        min-width: 112px;

        font-size: 14px;
        padding: 10px 6px;

        scroll-snap-align: start;
    }

    .rozkład {
        margin: 15px auto;
    }

    .warianty-pojemnik {
        flex-direction: column;

        align-items: flex-start;

        gap: 10px;

        padding: 10px 10px 10px 15px;
    }

    .warianty-info {
        padding-left: 10px;
    }

    .warianty-przyciski {
        padding-right: 10px;
    }

    .typ-rozkładu {
        width: 100%;
        max-width: none;
        margin-left: 0;
        margin-right: 0;
    }

    .wiersz-godziny {
        display: flex;
        align-items: stretch;
        width: 100%;
        min-height: 36px;
        overflow: visible;
    }

    .minuty-w-godzinie {
        display: flex;
        flex: 1 1 auto;
        flex-wrap: wrap;
        min-width: 0;
    }

    .kolumna-godzina {
        width: 36px;
        min-width: 36px;
        flex: 0 0 36px;
        font-size: 14px;

        min-height: 36px;
    }

    .kolumna-minuta {
        width: 46px;

        min-width: 46px;

        max-width: 46px;

        min-height: 36px;
    }

    .przystanek-btn .przystanek-nazwa {
        font-family:
            "Barlow Semi Condensed",
            sans-serif;

        font-size: 15px;

        font-weight: 600;
    }

    .naglowek-przystanku-widok .nazwa {
        font-size: 22px;
    }

    .naglowek-przystanku-widok .numer {
        font-size: 17px;
    }

    .lista-przystankow {
        width: 100%;
        max-width: none;
        margin-left: 0;
        margin-right: 0;
    }

    .kolumna-czas-przejazdu {
        width: 42px;

        min-width: 42px;

        max-width: 42px;

        padding-right: 0;

        font-size: 12px;
    }
}

</style>

</head>


<body>

<script>

/* =========================================================
   FWTP v35
   - godziny nocne: 24->00, 25->01, 26->02 itd.
   - 00/24, 01/25, 02/26 itd. są łączone w jeden wiersz
   ========================================================= */


/* =========================================================
   FWTP WWW v34
   - próg 4 wariantów liczony OSOBNO dla aktualnego kierunku
   - A: ukryte przy 1-3, widoczne przy 4+ w tym kierunku
   - idx: zawsze indeks listy pasażerskiej bez TECH
   - odświeżenie pozostaje na dokładnie tym samym przystanku
   ========================================================= */

if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
}

</script>


<header class="topbar">

    <div class="logo">
        FWTP
    </div>

 <nav class="menu" id="menu"></nav>

</header>


<main class="rozkład">


<section class="naglowek-linii">

    <h1
        id="numerLinii"
        class="numer-linii"
    >

<script>

if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
}


/* =========================================================
   ZMIENNE GŁÓWNE
   ========================================================= */

let daneLinii = null;
let numerLinii = null;
let aktualnyKierunek = 0;
let aktualnyWariant = null;
let aktualnyDzien = "dzisiaj";
let wybranaData = new Date();

let wybranyPrzystanek = null;
let wybranyPrzystanekIndex = null;
let wybranyPrzystanekId = null;

let widokKursuAktywny = false;

/* =========================================================
   PACZKI ROZKŁADÓW
   ========================================================= */

let manifestPaczek = null;
let aktualnaPaczkaDanych = null;
let aktualnyAdresDanych = null;


/* =========================================================
   PARAMETRY URL
   ========================================================= */

let parametry =
    new URLSearchParams(
        window.location.search
    );

numerLinii =
    parametry.get("linia");


/* =========================================================
   DATA Z URL
   ========================================================= */

function dataZParametruURL(
    wartosc
) {

    const dopasowanie =
        String(
            wartosc || ""
        ).match(
            /^(\d{4})-(\d{2})-(\d{2})$/
        );


    if (!dopasowanie) {
        return null;
    }


    const rok =
        Number(
            dopasowanie[1]
        );


    const miesiac =
        Number(
            dopasowanie[2]
        );


    const dzien =
        Number(
            dopasowanie[3]
        );


    const wynik =
        new Date(
            rok,
            miesiac - 1,
            dzien
        );


    if (
        wynik.getFullYear() !== rok ||
        wynik.getMonth() !== miesiac - 1 ||
        wynik.getDate() !== dzien
    ) {

        return null;
    }


    wynik.setHours(
        0,
        0,
        0,
        0
    );


    return wynik;
}


const dataStartowaZURL =
    dataZParametruURL(
        parametry.get("data")
    );


if (dataStartowaZURL) {

    wybranaData =
        dataStartowaZURL;
}


if (!numerLinii) {

    pokazBlad(
        "Nie podano numeru linii.",
        "Wybierz linię z menu."
    );

} else {

    document.getElementById(
        "numerLinii"
    ).textContent =
        numerLinii;

    pobierzDane();
}


/* =========================================================
   USUWANIE POLA GODZINY
   ========================================================= */

function usunPoleGodziny(tekst) {

    const pozycja =
        tekst.search(
            /"godziny"\s*:\s*\[/
        );

    if (pozycja === -1)
        return tekst;

    const poczatekTablicy =
        tekst.indexOf(
            "[",
            pozycja
        );

    if (poczatekTablicy === -1)
        return tekst;

    let poziom = 0;
    let wStringu = false;
    let ucieczka = false;
    let koniecTablicy = -1;

    for (
        let i = poczatekTablicy;
        i < tekst.length;
        i++
    ) {

        const znak =
            tekst[i];

        if (ucieczka) {

            ucieczka = false;
            continue;
        }

        if (
            znak === "\\" &&
            wStringu
        ) {

            ucieczka = true;
            continue;
        }

        if (znak === '"') {

            wStringu =
                !wStringu;

            continue;
        }

        if (wStringu)
            continue;

        if (znak === "[")
            poziom++;

        if (znak === "]") {

            poziom--;

            if (poziom === 0) {

                koniecTablicy =
                    i;

                break;
            }
        }
    }

    if (koniecTablicy === -1)
        return tekst;

    let poczatek =
        pozycja;

    let koniec =
        koniecTablicy + 1;

    while (
        koniec < tekst.length &&
        /\s/.test(
            tekst[koniec]
        )
    ) {

        koniec++;
    }

    if (
        tekst[koniec] === ","
    ) {

        koniec++;
    }

    return (
        tekst.substring(
            0,
            poczatek
        ) +
        tekst
            .substring(koniec)
            .replace(
                /,\s*,/g,
                ","
            )
            .replace(
                /,\s*}/g,
                "}"
            )
    );
}


/* =========================================================
   POBIERANIE JSON / PACZEK
   ========================================================= */

/*
 * WAŻNE:
 *
 * Strona obsługuje teraz kilka wariantów zapisu pola "folder"
 * w paczki.json. Zalecany zapis to:
 *
 *     "folder": "paczki/2026-09-12-specjalny"
 *
 * ale kod poradzi sobie również z:
 *
 *     "folder": "dane/paczki/2026-09-12-specjalny"
 *     "folder": "/dane/paczki/2026-09-12-specjalny/"
 *     "folder": "paczki\\2026-09-12-specjalny"
 *
 * Nie trzeba dopisywać nazwy pliku linii do manifestu.
 */


function normalizujFolderPaczki(
    folder
) {

    let wynik =
        String(
            folder || ""
        )
            .trim()
            .replace(
                /\\/g,
                "/"
            );


    wynik =
        wynik.replace(
            /^https?:\/\/[^/]+\/+/i,
            ""
        );


    wynik =
        wynik.replace(
            /^\.\/+/,
            ""
        );


    wynik =
        wynik.replace(
            /^\/+/,
            ""
        );


    /*
     * Jeżeli ktoś przez pomyłkę wpisał ścieżkę
     * od katalogu repozytorium, usuwamy początek.
     */
    wynik =
        wynik.replace(
            /^FWTP_JSON\//i,
            ""
        );


    wynik =
        wynik.replace(
            /^FWTP\//i,
            ""
        );


    wynik =
        wynik.replace(
            /^dane\//i,
            ""
        );


    wynik =
        wynik.replace(
            /\/+$/,
            ""
        );


    wynik =
        wynik.replace(
            /\/{2,}/g,
            "/"
        );


    return wynik;
}


function zakodujSciezke(
    sciezka
) {

    return String(
        sciezka || ""
    )
        .split("/")
        .filter(
            czesc =>
                czesc !== ""
        )
        .map(
            czesc =>
                encodeURIComponent(
                    czesc
                )
        )
        .join("/");
}


function adresManifestuPaczek() {

    const adres =
        new URL(
            "../dane/paczki.json",
            window.location.href
        );


    /*
     * GitHub Pages i przeglądarka potrafią trzymać
     * stary paczki.json w cache. Parametr _fwpt wymusza
     * świeże pobranie po odświeżeniu / zmianie dnia.
     */
    adres.searchParams.set(
        "_fwpt",
        String(
            Date.now()
        )
    );


    return adres.toString();
}


async function pobierzManifestPaczek(
    wymusOdswiezenie = false
) {

    if (
        manifestPaczek &&
        !wymusOdswiezenie
    ) {

        return manifestPaczek;
    }


    try {

        const adres =
            adresManifestuPaczek();


        const odpowiedz =
            await fetch(
                adres,
                {
                    cache: "no-store"
                }
            );


        if (!odpowiedz.ok) {

            console.warn(
                "FWTP: brak dane/paczki.json, HTTP",
                odpowiedz.status
            );


            manifestPaczek = {
                wersja: 1,
                paczki: []
            };


            return manifestPaczek;
        }


        const dane =
            await odpowiedz.json();


        manifestPaczek = {

            wersja:
                dane &&
                dane.wersja
                    ? dane.wersja
                    : 1,

            paczki:
                dane &&
                Array.isArray(
                    dane.paczki
                )
                    ? dane.paczki
                    : []
        };


        console.info(
            "FWTP: pobrano manifest paczek",
            manifestPaczek
        );


        return manifestPaczek;

    } catch (blad) {

        console.warn(
            "FWTP: nie udało się pobrać dane/paczki.json. Używam starego układu dane/NUMER.json.",
            blad
        );


        manifestPaczek = {
            wersja: 1,
            paczki: []
        };


        return manifestPaczek;
    }
}


function dataTekstDoLiczby(
    dataTekst
) {

    const dopasowanie =
        String(
            dataTekst || ""
        ).match(
            /^(\d{4})-(\d{2})-(\d{2})$/
        );


    if (!dopasowanie) {
        return null;
    }


    const rok =
        Number(
            dopasowanie[1]
        );


    const miesiac =
        Number(
            dopasowanie[2]
        );


    const dzien =
        Number(
            dopasowanie[3]
        );


    const sprawdzenie =
        new Date(
            rok,
            miesiac - 1,
            dzien
        );


    if (
        sprawdzenie.getFullYear() !== rok ||
        sprawdzenie.getMonth() !== miesiac - 1 ||
        sprawdzenie.getDate() !== dzien
    ) {

        return null;
    }


    return (
        rok * 10000 +
        miesiac * 100 +
        dzien
    );
}


function paczkiDlaDaty(
    data
) {

    if (
        !manifestPaczek ||
        !Array.isArray(
            manifestPaczek.paczki
        )
    ) {

        return [];
    }


    const dataTekst =
        formatujDateInput(
            data
        );


    const dataLiczba =
        dataTekstDoLiczby(
            dataTekst
        );


    if (dataLiczba === null) {
        return [];
    }


    const wynik =
        manifestPaczek.paczki
            .filter(
                paczka => {

                    if (!paczka) {
                        return false;
                    }


                    /*
                     * Jeżeli manifest posiada pole aktywna,
                     * respektujemy wartość NIE/FALSE/0.
                     * Jeżeli pola nie ma, paczka jest aktywna.
                     */
                    const aktywna =
                        paczka.aktywna;


                    if (
                        aktywna !== undefined &&
                        aktywna !== null
                    ) {

                        const tekstAktywna =
                            String(
                                aktywna
                            )
                                .trim()
                                .toUpperCase();


                        if (
                            tekstAktywna === "NIE" ||
                            tekstAktywna === "FALSE" ||
                            tekstAktywna === "0"
                        ) {

                            return false;
                        }
                    }


                    const od =
                        dataTekstDoLiczby(
                            paczka.od
                        );


                    const doDaty =
                        dataTekstDoLiczby(
                            paczka.do ||
                            paczka.od
                        );


                    if (
                        od === null ||
                        doDaty === null
                    ) {

                        return false;
                    }


                    if (
                        dataLiczba < od ||
                        dataLiczba > doDaty
                    ) {

                        return false;
                    }


                    return (
                        normalizujFolderPaczki(
                            paczka.folder
                        ) !== ""
                    );
                }
            );


    wynik.sort(
        (
            a,
            b
        ) => {

            const priorytetA =
                Number(
                    a.priorytet || 0
                );


            const priorytetB =
                Number(
                    b.priorytet || 0
                );


            if (
                priorytetA !==
                priorytetB
            ) {

                return (
                    priorytetB -
                    priorytetA
                );
            }


            const odA =
                dataTekstDoLiczby(
                    a.od
                );


            const doA =
                dataTekstDoLiczby(
                    a.do ||
                    a.od
                );


            const odB =
                dataTekstDoLiczby(
                    b.od
                );


            const doB =
                dataTekstDoLiczby(
                    b.do ||
                    b.od
                );


            return (
                (doA - odA) -
                (doB - odB)
            );
        }
    );


    return wynik;
}


function adresPlikuLiniiWPaczce(
    paczka
) {

    if (!paczka) {
        return null;
    }


    const folder =
        normalizujFolderPaczki(
            paczka.folder
        );


    if (!folder) {
        return null;
    }


    const sciezka =
        "../dane/" +
        zakodujSciezke(
            folder
        ) +
        "/" +
        encodeURIComponent(
            String(
                numerLinii || ""
            ).trim()
        ) +
        ".json";


    return new URL(
        sciezka,
        window.location.href
    ).toString();
}


function adresStaregoPlikuLinii() {

    return new URL(
        "../dane/" +
        encodeURIComponent(
            String(
                numerLinii || ""
            ).trim()
        ) +
        ".json",
        window.location.href
    ).toString();
}


async function pobierzTekstJSON(
    adres
) {

    try {

        const url =
            new URL(
                adres,
                window.location.href
            );


        url.searchParams.set(
            "_fwpt",
            String(
                Date.now()
            )
        );


        const odpowiedz =
            await fetch(
                url.toString(),
                {
                    cache: "no-store"
                }
            );


        if (!odpowiedz.ok) {

            console.info(
                "FWTP: brak pliku",
                odpowiedz.status,
                adres
            );


            return null;
        }


        return await odpowiedz.text();

    } catch (blad) {

        console.warn(
            "FWTP: błąd pobierania",
            adres,
            blad
        );


        return null;
    }
}


function parsujDaneLinii(
    tekst
) {

    try {

        return JSON.parse(
            tekst
        );

    } catch (e1) {

        return JSON.parse(
            usunPoleGodziny(
                tekst
            )
        );
    }
}


function czyPoprawnyPlikLinii(
    tekst
) {

    if (
        tekst === null ||
        tekst === undefined
    ) {

        return false;
    }


    try {

        const dane =
            parsujDaneLinii(
                tekst
            );


        return (
            dane &&
            typeof dane === "object"
        );

    } catch (blad) {

        return false;
    }
}


async function pobierzDane(
    uruchomPoPobraniu = true
) {

    try {

        /*
         * Przy każdym pobraniu rozkładu odświeżamy manifest.
         * Dzięki temu po wrzuceniu nowej paczki na GitHub
         * nie trzeba czekać na stary cache przeglądarki.
         */
        await pobierzManifestPaczek(
            true
        );


        const dataTekst =
            formatujDateInput(
                wybranaData
            );


        const pasujacePaczki =
            paczkiDlaDaty(
                wybranaData
            );


        let tekst =
            null;


        let uzytaPaczka =
            null;


        let uzytyAdres =
            null;


        console.info(
            "FWTP: szukam linii",
            numerLinii,
            "dla daty",
            dataTekst
        );


        console.info(
            "FWTP: pasujące paczki",
            pasujacePaczki.map(
                paczka => ({
                    id:
                        paczka.id || "",

                    od:
                        paczka.od || "",

                    do:
                        paczka.do || "",

                    folder:
                        paczka.folder || "",

                    priorytet:
                        paczka.priorytet || 0
                })
            )
        );


        /* =================================================
           1. PACZKI
           ================================================= */

        for (
            const paczka
            of pasujacePaczki
        ) {

            const adres =
                adresPlikuLiniiWPaczce(
                    paczka
                );


            if (!adres) {
                continue;
            }


            console.info(
                "FWTP: sprawdzam paczkę:",
                paczka.id || "(bez id)",
                adres
            );


            const pobranyTekst =
                await pobierzTekstJSON(
                    adres
                );


            if (
                pobranyTekst === null
            ) {

                continue;
            }


            /*
             * Nie kończymy szukania na uszkodzonym JSON-ie.
             * Jeżeli plik z paczki istnieje, ale ma błąd,
             * próbujemy kolejnej pasującej paczki.
             */
            if (
                !czyPoprawnyPlikLinii(
                    pobranyTekst
                )
            ) {

                console.warn(
                    "FWTP: plik istnieje, ale JSON jest niepoprawny:",
                    adres
                );


                continue;
            }


            tekst =
                pobranyTekst;


            uzytaPaczka =
                paczka;


            uzytyAdres =
                adres;


            break;
        }


        /* =================================================
           2. STARY PLIK dane/NUMER.json
           ================================================= */

        if (
            tekst === null
        ) {

            const adresStary =
                adresStaregoPlikuLinii();


            console.info(
                "FWTP: nie znaleziono linii w paczkach. Sprawdzam plik główny:",
                adresStary
            );


            const pobranyTekst =
                await pobierzTekstJSON(
                    adresStary
                );


            if (
                pobranyTekst !== null &&
                czyPoprawnyPlikLinii(
                    pobranyTekst
                )
            ) {

                tekst =
                    pobranyTekst;


                uzytaPaczka =
                    null;


                uzytyAdres =
                    adresStary;
            }
        }


        if (
            tekst === null
        ) {

            throw new Error(
                "Brak rozkładu linii " +
                numerLinii +
                " dla dnia " +
                dataTekst +
                ". Sprawdź dane/paczki.json oraz folder paczki."
            );
        }


        daneLinii =
            parsujDaneLinii(
                tekst
            );


        aktualnaPaczkaDanych =
            uzytaPaczka;


        aktualnyAdresDanych =
            uzytyAdres;


        console.info(
            "FWTP: WCZYTANO ROZKŁAD",
            {
                linia:
                    numerLinii,

                data:
                    dataTekst,

                paczka:
                    uzytaPaczka
                        ? (
                            uzytaPaczka.id ||
                            "(bez id)"
                        )
                        : "plik główny",

                folder:
                    uzytaPaczka
                        ? uzytaPaczka.folder
                        : "",

                adres:
                    uzytyAdres
            }
        );


        if (
            uruchomPoPobraniu
        ) {

            uruchomStrone();
        }


        return true;

    } catch (blad) {

        console.error(
            "FWTP: nie udało się wczytać rozkładu",
            blad
        );


        pokazBlad(
            "Nie udało się wczytać rozkładu.",
            blad.message ||
            "Brak danych dla wybranej daty."
        );


        return false;
    }
}




/* =========================================================
   ZAPIS PRZYSTANKU
   ========================================================= */

function ustawWybranyPrzystanek(
    p,
    index
) {

    if (!p) {

        wybranyPrzystanek = null;
        wybranyPrzystanekIndex = null;
        wybranyPrzystanekId = null;

        return;
    }

    wybranyPrzystanek = p;

    if (
        index !== undefined &&
        index !== null &&
        Number.isInteger(
            Number(index)
        )
    ) {

        wybranyPrzystanekIndex =
            Number(index);

    } else {

        wybranyPrzystanekIndex =
            null;
    }

    wybranyPrzystanekId = {

        kierunek:
            Number(
                aktualnyKierunek
            ),

        index:
            wybranyPrzystanekIndex,

        lp:
            p.lp !== undefined &&
            p.lp !== null
                ? String(
                    p.lp
                ).trim()
                : "",

        nr:
            p.nr !== undefined &&
            p.nr !== null
                ? String(
                    p.nr
                ).trim()
                : "",

        nazwa:
            String(
                p.nazwa || ""
            ).trim()
    };
}


/* =========================================================
   ZNAJDOWANIE PRZYSTANKU
   ========================================================= */

function znajdzPrzystanek(
    przystanki,
    identyfikator
) {

    if (
        !Array.isArray(
            przystanki
        ) ||
        przystanki.length === 0 ||
        identyfikator === null ||
        identyfikator === undefined
    ) {

        return null;
    }

    const szukany =
        String(
            identyfikator
        ).trim();

    if (
        szukany
            .toLowerCase()
            .startsWith("idx:")
    ) {

        const idx =
            Number(
                szukany
                    .substring(4)
                    .trim()
            );

        if (
            Number.isInteger(idx) &&
            idx >= 0 &&
            idx < przystanki.length
        ) {

            return przystanki[idx];
        }

        return null;
    }

    if (
        wybranyPrzystanekId &&
        Number(
            wybranyPrzystanekId.kierunek
        ) ===
        Number(
            aktualnyKierunek
        ) &&
        wybranyPrzystanekIndex !== null
    ) {

        const idx =
            Number(
                wybranyPrzystanekIndex
            );

        if (
            Number.isInteger(idx) &&
            idx >= 0 &&
            idx < przystanki.length
        ) {

            return przystanki[idx];
        }
    }

    if (
        szukany
            .toLowerCase()
            .startsWith("lp:")
    ) {

        const lp =
            szukany
                .substring(3)
                .trim();

        const znaleziony =
            przystanki.find(
                p =>
                    String(
                        p.lp !== undefined &&
                        p.lp !== null
                            ? p.lp
                            : ""
                    ).trim() === lp
            );

        if (znaleziony)
            return znaleziony;
    }

    if (
        wybranyPrzystanekId &&
        wybranyPrzystanekId.nr &&
        wybranyPrzystanekId.nazwa
    ) {

        const nr =
            wybranyPrzystanekId.nr;

        const nazwa =
            wybranyPrzystanekId.nazwa;

        const znaleziony =
            przystanki.find(
                p =>
                    String(
                        p.nr || ""
                    ).trim() === nr &&
                    normalizujTekst(
                        p.nazwa
                    ) ===
                    normalizujTekst(
                        nazwa
                    )
            );

        if (znaleziony)
            return znaleziony;
    }

    const poNr =
        przystanki.find(
            p =>
                String(
                    p.nr || ""
                ).trim() ===
                szukany
        );

    if (poNr)
        return poNr;

    const poNazwie =
        przystanki.find(
            p =>
                String(
                    p.nazwa || ""
                ).trim() ===
                szukany
        );

    if (poNazwie)
        return poNazwie;

    const normalny =
        normalizujTekst(
            szukany
        );

    return przystanki.find(
        p =>
            normalizujTekst(
                p.nazwa
            ) === normalny
    ) || null;
}

function uruchomStrone() {

        "numerLinii"
    ).textContent =
        daneLinii.linia ||

    document.getElementById(
        "trasa"
    ).textContent =

    ) {

            );

        if (

            num >= 0
        ) {

            aktualnyKierunek =
                num;
        }
    }

    const rozklad =
        znajdzRozklad();

    const paramP =
        parametry.get(
            "przystanek"
        );

    if (
        paramP &&
        rozklad &&
        Array.isArray(
            rozklad.kierunki
        )
    ) {

        const kierunek =
            rozklad.kierunki[
                aktualnyKierunek
            ];

        if (
            kierunek &&
            Array.isArray(
                kierunek.przystanki
            )
        ) {

            /*
             * URL "idx:X" zawsze odnosi się do listy
             * PASAŻERSKIEJ, czyli po usunięciu TECH.
             *
             * Dzięki temu odświeżenie strony nie może
             * przesunąć użytkownika na TECH znajdujący się
             * wcześniej w surowej tablicy JSON.
             */
            const kierunekDlaDaty =
                przygotujKierunekDlaDaty(
                    kierunek,
                    wybranaData
                );


            const przystankiPasazerskie =
                kierunekDlaDaty
                    ? (
                        kierunekDlaDaty.przystanki ||
                        []
                      )
                    : filtrujPrzystankiSpecjalneFWTP(
                        kierunek.przystanki ||
                        []
                      );


            const znaleziony =
                znajdzPrzystanek(
                    przystankiPasazerskie,
                    paramP
                );


            if (znaleziony) {

                const indeks =
                    przystankiPasazerskie.indexOf(
                        znaleziony
                    );


                ustawWybranyPrzystanek(
                    znaleziony,
                    indeks
                );
            }
        }
    }

    /*
     * Przywrócenie wybranego wariantu trasy z URL.
     * Dzięki temu Wstecz/Dalej prawidłowo przełącza np. B -> A.
     */
    const paramWariantTrasy =
        parametry.get(
            "wariant"
        );


    if (
        paramWariantTrasy !== null &&
        String(
            paramWariantTrasy
        ).trim() !== ""
    ) {

        aktualnyWariant =
            String(
                paramWariantTrasy
            )
                .trim()
                .toUpperCase();
    }


    generujKalendarz7Dni();

    pokazRozklad();


    /* =====================================================
       PRZYWRÓCENIE WIDOKU KONKRETNEGO KURSU PO ODŚWIEŻENIU
       ===================================================== */

    const paramKurs =

            "kurs"
        );

    const paramWariantKursu =
        parametry.get(
            "wariantKursu"
        );


    if (
        paramKurs !== null &&
        String(paramKurs).trim() !== ""
    ) {

        pokazCalyKurs(
            paramKurs,
            paramWariantKursu !== null
                ? paramWariantKursu
                : null,
            false
        );
    }
}


/* =========================================================
   HISTORIA PRZEGLĄDARKI — WSTECZ / DALEJ
   =========================================================

   Problem:
   po kliknięciu drugiego kierunku aktualizujemy URL przez
   history.pushState(), ale przeglądarka sama nie uruchamia
   ponownie JavaScriptu po kliknięciu Wstecz.

   Dodatkowo wcześniej "parametry" były tworzone tylko raz
   przy starcie strony, więc po Wstecz nadal zawierały stare
   wartości z momentu pierwszego załadowania.

   Teraz:
   1. przy każdym popstate ponownie odczytujemy window.location.search,
   2. zerujemy stan zależny od poprzedniego widoku,
   3. przywracamy kierunek / wariant / przystanek / kurs z URL,
   4. renderujemy stronę bez ponownego pobierania JSON.

   Dzięki temu:
       kierunek 0
       -> klik kierunek 1
       -> Wstecz
       -> znowu kierunek 0

   Działa to również dla wariantów, przystanków i konkretnych kursów.
*/

let trwaPrzywracanieHistorii =
    false;


function przywrocStanZAktualnegoURL() {

    if (
        !daneLinii ||
        trwaPrzywracanieHistorii
    ) {

        return;
    }


    trwaPrzywracanieHistorii =
        true;


    try {

        /*
         * URL po Wstecz/Dalej jest już zmieniony przez przeglądarkę.
         * Musimy więc utworzyć NOWY URLSearchParams.
         */
        parametry =
            new URLSearchParams(
                window.location.search
            );


        /*
         * Numer linii normalnie się nie zmienia w obrębie tego widoku,
         * ale odczytujemy go ponownie dla pełnej zgodności z URL.
         */
        const liniaZURL =
            parametry.get(
                "linia"
            );


        if (
            liniaZURL !== null &&
            String(
                liniaZURL
            ).trim() !== ""
        ) {

            numerLinii =
                String(
                    liniaZURL
                ).trim();
        }


        /*
         * Zerujemy wszystko, czego może już nie być
         * w starszym wpisie historii.
         *
         * To jest ważne np. gdy:
         * - obecnie jesteśmy na kierunku 1,
         * - poprzedni wpis był kierunkiem 0,
         * - poprzedni wpis nie miał wariantu ani przystanku.
         */
        aktualnyKierunek =
            0;

        aktualnyWariant =
            null;

        ustawWybranyPrzystanek(
            null
        );

        widokKursuAktywny =
            false;


        /*
         * Data również może znajdować się w URL.
         * Jeśli jest poprawna, przywracamy ją.
         */
        const dataZHistorii =
            dataZParametruURL(
                parametry.get(
                    "data"
                )
            );


        if (
            dataZHistorii
        ) {

            wybranaData =
                dataZHistorii;
        }


        /*
         * uruchomStrone() już zawiera pełną logikę:
         * - kierunek,
         * - przystanek,
         * - wariant,
         * - konkretny kurs,
         * - ponowne narysowanie rozkładu.
         *
         * Nie wywołujemy pobierzDane(), bo dane tej linii
         * mamy już w pamięci.
         */
        uruchomStrone();


        /*
         * Po odtworzeniu widoku wracamy na górę tylko wtedy,
         * gdy historia nie wskazuje konkretnego przystanku/kursu.
         * Gdy wskazuje, istniejąca logika strony ustawi właściwy widok.
         */
        if (
            !parametry.get(
                "przystanek"
            ) &&
            !parametry.get(
                "kurs"
            )
        ) {

            window.scrollTo(
                0,
                0
            );
        }

    } finally {

        trwaPrzywracanieHistorii =
            false;
    }
}


window.addEventListener(
    "popstate",
    () => {

        przywrocStanZAktualnegoURL();
    }
);


/* =========================================================
   TYP DNIA
   ========================================================= */

function okreslTypDnia(data) {

    const d =
        data.getDay();

    if (d === 6)
        return "sobota";

    if (d === 0)
        return "niedziela";

    return "roboczy";
}


/* =========================================================
   NORMALIZACJA
   ========================================================= */

function normalizujTekst(tekst) {

    return String(
        tekst || ""
    )
        .toLowerCase()
        .normalize(
            "NFD"
        )
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );
}


/* =========================================================
   NORMALIZACJA KLUCZA PRZYSTANKU
   ========================================================= */

function kluczPrzystanku(p) {

    if (!p)
        return "";

    const nr =
        String(
            p.nr || ""
        )
            .trim()
            .toLowerCase();

    const nazwa =
        normalizujTekst(
            p.nazwa || ""
        )
            .replace(
                /\s+/g,
                " "
            )
            .trim();

    /*
     * Numer przystanku jest najlepszym identyfikatorem.
     * Jeżeli go nie ma, korzystamy z nazwy.
     */

    if (nr)
        return "nr:" + nr;

    if (nazwa)
        return "nazwa:" + nazwa;

    return "";
}


/* =========================================================
   NORMALIZACJA OPISU WARIANTU
   ========================================================= */

function normalizujOpisWariantu(
    opis
) {

    return normalizujTekst(
        opis
    )
        .replace(
            /\s+/g,
            " "
        )
        .trim();
}


/* =========================================================
   WIELKANOC
   ========================================================= */

function obliczWielkanoc(rok) {

    const a =
        rok % 19;

    const b =
        Math.floor(
            rok / 100
        );

    const c =
        rok % 100;

    const d =
        Math.floor(
            b / 4
        );

    const e =
        b % 4;

    const f =
        Math.floor(
            (b + 8) / 25
        );

    const g =
        Math.floor(
            (b - f + 1) / 3
        );

    const h =
        (
            19 * a +
            b -
            d -
            g +
            15
        ) % 30;

    const i =
        Math.floor(
            c / 4
        );

    const k =
        c % 4;

    const l =
        (
            32 +
            2 * e +
            2 * i -
            h -
            k
        ) % 7;

    const m =
        Math.floor(
            (a + 11 * h + 22 * l) / 451
        );

    const miesiac =
        Math.floor(
            (h + l - 7 * m + 114) / 31
        );

    const dzien =
        (
            (h + l - 7 * m + 114) % 31
        ) + 1;

    return new Date(
        rok,
        miesiac - 1,
        dzien
    );
}


/* =========================================================
   DODAWANIE DNI
   ========================================================= */

function dodajDni(
    data,
    liczba
) {

    const wynik =
        new Date(
            data
        );

    wynik.setDate(
        wynik.getDate() +
        liczba
    );

    return wynik;
}


/* =========================================================
   KLUCZ DATY
   ========================================================= */

function kluczDaty(
    data
) {

    return (
        data.getFullYear() +
        "-" +
        String(
            data.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +
        "-" +
        String(
            data.getDate()
        ).padStart(
            2,
            "0"
        )
    );
}


/* =========================================================
   POLSKIE ŚWIĘTA
   ========================================================= */

function pobierzPolskieSwieta(
    rok
) {

    const swieta =
        new Set();


    function dodaj(
        miesiac,
        dzien
    ) {

        swieta.add(
            kluczDaty(
                new Date(
                    rok,
                    miesiac - 1,
                    dzien
                )
            )
        );
    }


    dodaj(1, 1);
    dodaj(1, 6);
    dodaj(5, 1);
    dodaj(5, 3);
    dodaj(8, 15);
    dodaj(11, 1);
    dodaj(11, 11);
    dodaj(12, 24);
    dodaj(12, 25);
    dodaj(12, 26);


    const wielkanoc =
        obliczWielkanoc(
            rok
        );


    swieta.add(
        kluczDaty(
            wielkanoc
        )
    );


    swieta.add(
        kluczDaty(
            dodajDni(
                wielkanoc,
                1
            )
        )
    );


    swieta.add(
        kluczDaty(
            dodajDni(
                wielkanoc,
                49
            )
        )
    );


    swieta.add(
        kluczDaty(
            dodajDni(
                wielkanoc,
                60
            )
        )
    );


    return swieta;
}


/* =========================================================
   CZY DATA JEST ŚWIĘTEM
   ========================================================= */

function czySwieto(
    data
) {

    if (!(data instanceof Date))
        return false;

    const swieta =
        pobierzPolskieSwieta(
            data.getFullYear()
        );

    return swieta.has(
        kluczDaty(
            data
        )
    );
}


/* =========================================================
   SPRAWDZENIE, CZY KURS JEST AKTYWNY
   ========================================================= */

function czyKursPasujeDoDaty(
    kurs,
    data
) {

    if (!kurs)
        return false;

    let uwagi =
        kurs.uwagi;

    if (
        uwagi === undefined ||
        uwagi === null
    ) {
        return false;
    }

    uwagi =
        String(
            uwagi
        )
            .trim()
            .toUpperCase();

    if (!uwagi)
        return false;

    const dzien =
        data.getDay();

    const swieto =
        czySwieto(
            data
        );


    if (
        uwagi === "D"
    ) {

        return (
            dzien >= 1 &&
            dzien <= 5 &&
            !swieto
        );
    }


    if (
        uwagi === "C"
    ) {

        return (
            dzien === 6 ||
            dzien === 0 ||
            swieto
        );
    }


    if (
        uwagi === "6"
    ) {

        return (
            dzien === 6 &&
            !swieto
        );
    }


    if (
        uwagi === "7"
    ) {

        return (
            dzien === 0 ||
            swieto
        );
    }


    return false;
}


/* =========================================================
   OKREŚLENIE SYMBOLU ROZKŁADU
   ========================================================= */

function okreslSymbolRozkladu(
    data
) {

    const dzienTygodnia =
        data.getDay();

    const swieto =
        czySwieto(
            data
        );


    if (
        dzienTygodnia >= 1 &&
        dzienTygodnia <= 5
    ) {

        if (swieto)
            return "7";

        return "D";
    }


    if (
        dzienTygodnia === 6
    ) {

        if (swieto)
            return "7";

        return "6";
    }


    if (
        dzienTygodnia === 0
    ) {

        return "7";
    }


    return "D";
}


/* =========================================================
   FILTROWANIE KURSÓW DLA DATY
   ========================================================= */

function filtrujKursyDlaDaty(
    kursy,
    data
) {

    if (
        !Array.isArray(
            kursy
        )
    ) {

        return [];
    }


    return kursy.filter(
        kurs =>
            czyKursPasujeDoDaty(
                kurs,
                data
            )
    );
}


/* =========================================================
   UTWORZENIE ROZKŁADU DLA DATY
   ========================================================= */

function pobierzTypPrzystankuFWTP(
    przystanek
) {

    return String(
        przystanek?.typ ||
        przystanek?.rodzaj ||
        przystanek?.status ||
        ""
    )
        .trim()
        .toUpperCase();
}


function filtrujPrzystankiSpecjalneFWTP(
    przystanki
) {

    const lista =
        Array.isArray(przystanki)
            ? przystanki
            : [];


    return lista.filter(
        (
            przystanek,
            index
        ) => {

            const typ =
                pobierzTypPrzystankuFWTP(
                    przystanek
                );


            /*
             * TECH jest przystankiem technicznym.
             * Nie pokazujemy go ani na trasie,
             * ani w rozkładzie, ani w widoku kursu.
             */
            if (typ === "TECH") {

                return false;
            }


            /*
             * Jeśli po WYS występuje WS, ukrywamy WS.
             * Przy sprawdzaniu pomijamy ewentualne TECH
             * znajdujące się pomiędzy nimi.
             */
            if (typ === "WS") {

                let poprzedni =
                    index - 1;


                while (
                    poprzedni >= 0 &&
                    pobierzTypPrzystankuFWTP(
                        lista[
                            poprzedni
                        ]
                    ) === "TECH"
                ) {

                    poprzedni--;
                }


                if (
                    poprzedni >= 0 &&
                    pobierzTypPrzystankuFWTP(
                        lista[
                            poprzedni
                        ]
                    ) === "WYS"
                ) {

                    return false;
                }
            }


            return true;
        }
    );
}


function przygotujKierunekDlaDaty(
    kierunek,
    data
) {

    if (!kierunek)
        return null;


    const nowyKierunek =
        Object.assign(
            {},
            kierunek
        );


    nowyKierunek.przystanki =
        filtrujPrzystankiSpecjalneFWTP(
            (
                kierunek.przystanki ||
                []
            )
                .map(
                    p => {

                        const nowyPrzystanek =
                            Object.assign(
                                {},
                                p
                            );


                        nowyPrzystanek.kursy =
                            filtrujKursyDlaDaty(
                                p.kursy || [],
                                data
                            );


                        return nowyPrzystanek;
                    }
                )
                .filter(
                    p =>
                        Array.isArray(
                            p.kursy
                        ) &&
                        p.kursy.length > 0
                )
        );


    return nowyKierunek;
}


/* =========================================================
   MAPA WARIANTÓW DLA JEDNEGO ROZKŁADU
   ========================================================= */

function zbudujMapeWariantowDlaRozkladu(
    rozklad,
    mapaGlobalna
) {

    const mapa =
        new Map();


    if (
        !rozklad ||
        !Array.isArray(
            rozklad.warianty
        )
    ) {

        return mapa;
    }


    /*
     * WAŻNE:
     *
     * Zachowujemy dokładnie lokalne litery wariantów
     * zapisane w danym rozkładzie JSON.
     *
     * Nie wolno scalać wariantów tylko dlatego,
     * że mają taki sam opis.
     *
     * Przykład linia 126 / rozkład C:
     *     A, B, C, D
     *
     * Warianty B i C mogą mieć identyczny opis,
     * ale są osobnymi rzeczywistymi przebiegami
     * i muszą pozostać osobnymi wariantami.
     */

    rozklad.warianty.forEach(
        wariant => {

            if (!wariant)
                return;


            const lokalnaLitera =
                String(
                    wariant.litera !== undefined &&
                    wariant.litera !== null
                        ? wariant.litera
                        : ""
                )
                    .trim()
                    .toUpperCase();


            if (!lokalnaLitera)
                return;


            mapa.set(
                lokalnaLitera,
                lokalnaLitera
            );
        }
    );


    return mapa;
}


/* =========================================================
   GLOBALNA MAPA WARIANTÓW PO OPISIE
   ========================================================= */

function zbudujGlobalnaMapeWariantow(
    rozklady
) {

    const mapa =
        new Map();


    (
        rozklady ||
        []
    ).forEach(
        rozklad => {

            if (
                !Array.isArray(
                    rozklad.warianty
                )
            ) {
                return;
            }


            rozklad.warianty.forEach(
                wariant => {

                    if (!wariant)
                        return;


                    const litera =
                        String(
                            wariant.litera !== undefined &&
                            wariant.litera !== null
                                ? wariant.litera
                                : ""
                        )
                            .trim()
                            .toUpperCase();


                    const opis =
                        String(
                            wariant.opis ||
                            ""
                        ).trim();


                    if (
                        !litera ||
                        !opis
                    ) {
                        return;
                    }


                    const klucz =
                        normalizujOpisWariantu(
                            opis
                        );


                    if (
                        !klucz
                    ) {
                        return;
                    }


                    /*
                     * Pierwsza napotkana litera
                     * staje się literą kanoniczną.
                     *
                     * Dzięki temu np.:
                     *
                     * D:
                     * E = "kurs skrócony..."
                     *
                     * C:
                     * C = "kurs skrócony..."
                     *
                     * dostają wspólną literę E.
                     */

                    if (
                        !mapa.has(
                            klucz
                        )
                    ) {

                        mapa.set(
                            klucz,
                            {
                                litera:
                                    litera,

                                opis:
                                    opis
                            }
                        );
                    }
                }
            );
        }
    );


    return mapa;
}


/* =========================================================
   ZNAJDŹ ROZKŁAD
   ========================================================= */

function znajdzRozklad() {

    if (
        !daneLinii ||
        !Array.isArray(
            daneLinii.rozkłady
        ) ||
        daneLinii.rozkłady.length === 0
    ) {

        return null;
    }


    const wynik = {

        nazwa:
            "Rozkład jazdy",

        kierunki:
            [],

        warianty:
            []
    };


    const symbolDnia =
        okreslSymbolRozkladu(
            wybranaData
        );


    /* =====================================================
       GLOBALNA MAPA WARIANTÓW
       ===================================================== */

    const mapaGlobalna =
        zbudujGlobalnaMapeWariantow(
            daneLinii.rozkłady
        );


    /* =====================================================
       MAPY WARIANTÓW DLA POSZCZEGÓLNYCH ROZKŁADÓW
       ===================================================== */

    const informacjeORozkladach =
        daneLinii.rozkłady.map(
            rozklad => {

                return {

                    rozklad:
                        rozklad,

                    mapaWariantow:
                        zbudujMapeWariantowDlaRozkladu(
                            rozklad,
                            mapaGlobalna
                        )
                };
            }
        );


    /* =====================================================
       WARIANTY WYNIKOWE
       ===================================================== */

    /*
     * Budujemy legendę wariantów wyłącznie z rozkładów,
     * które faktycznie mają kursy dla aktualnie wybranej daty.
     *
     * Dzięki temu zachowujemy litery z JSON-a dla D/C/6/7
     * i nie mieszamy opisów wariantów z innych rozkładów.
     */

    const wynikoweWarianty =
        new Map();


    daneLinii.rozkłady.forEach(
        rozklad => {

            if (
                !Array.isArray(
                    rozklad.kierunki
                )
            ) {
                return;
            }


            const uzyteLitery =
                new Set();


            rozklad.kierunki.forEach(
                kierunek => {

                    if (
                        !kierunek ||
                        !Array.isArray(
                            kierunek.przystanki
                        )
                    ) {
                        return;
                    }


                    kierunek.przystanki.forEach(
                        p => {

                            const kursy =
                                filtrujKursyDlaDaty(
                                    p.kursy || [],
                                    wybranaData
                                );


                            kursy.forEach(
                                kurs => {

                                    const litera =
                                        pobierzWariant(
                                            kurs
                                        );


                                    if (litera) {

                                        uzyteLitery.add(
                                            litera
                                        );
                                    }
                                }
                            );
                        }
                    );
                }
            );


            if (
                uzyteLitery.size === 0
            ) {
                return;
            }


            (
                Array.isArray(
                    rozklad.warianty
                )
                    ? rozklad.warianty
                    : []
            ).forEach(
                wariant => {

                    if (!wariant)
                        return;


                    const litera =
                        String(
                            wariant.litera || ""
                        )
                            .trim()
                            .toUpperCase();


                    if (
                        !litera ||
                        !uzyteLitery.has(
                            litera
                        ) ||
                        wynikoweWarianty.has(
                            litera
                        )
                    ) {
                        return;
                    }


                    wynikoweWarianty.set(
                        litera,
                        Object.assign(
                            {},
                            wariant,
                            {
                                litera:
                                    litera
                            }
                        )
                    );
                }
            );
        }
    );


    wynik.warianty =
        Array.from(
            wynikoweWarianty.values()
        );


    wynik.warianty.sort(
        (
            a,
            b
        ) => {

            return String(
                a.litera || ""
            ).localeCompare(
                String(
                    b.litera || ""
                ),
                "pl",
                {
                    numeric: true
                }
            );
        }
    );


    /* =====================================================
       LICZBA KIERUNKÓW
       ===================================================== */

    let liczbaKierunkow =
        0;


    daneLinii.rozkłady.forEach(
        rozklad => {

            if (
                Array.isArray(
                    rozklad.kierunki
                )
            ) {

                liczbaKierunkow =
                    Math.max(
                        liczbaKierunkow,
                        rozklad.kierunki.length
                    );
            }
        }
    );


    /* =====================================================
       BUDOWANIE KIERUNKÓW
       ===================================================== */

    for (
        let kierunekIndex = 0;
        kierunekIndex < liczbaKierunkow;
        kierunekIndex++
    ) {

        /*
         * -------------------------------------------------
         * NAJWAŻNIEJSZA ZMIANA
         * -------------------------------------------------
         *
         * Najpierw szukamy właściwej trasy dla aktualnego
         * D/C/6/7.
         *
         * Nie używamy już pierwszego rozkładu jako bazy.
         * Nie zakładamy również, że przystanek nr 10
         * w D jest tym samym co przystanek nr 10 w C.
         */


        let najlepszyRozklad =
            null;

        let najlepszaLiczbaPrzystankow =
            -1;


        informacjeORozkladach.forEach(
            info => {

                const rozklad =
                    info.rozklad;


                if (
                    !Array.isArray(
                        rozklad.kierunki
                    )
                ) {
                    return;
                }


                const kierunek =
                    rozklad.kierunki[
                        kierunekIndex
                    ];


                if (
                    !kierunek ||
                    !Array.isArray(
                        kierunek.przystanki
                    )
                ) {
                    return;
                }


                let liczba =
                    0;


                kierunek.przystanki.forEach(
                    p => {

                        const kursy =
                            filtrujKursyDlaDaty(
                                p.kursy || [],
                                wybranaData
                            );


                        if (
                            kursy.length > 0
                        ) {

                            liczba++;
                        }
                    }
                );


                if (
                    liczba >
                    najlepszaLiczbaPrzystankow
                ) {

                    najlepszaLiczbaPrzystankow =
                        liczba;

                    najlepszyRozklad =
                        info;
                }
            }
        );


        /*
         * Jeżeli nie znaleźliśmy żadnego rozkładu
         * z kursami dla wybranej daty, pomijamy kierunek.
         */

        if (
            !najlepszyRozklad ||
            najlepszaLiczbaPrzystankow <= 0
        ) {

            continue;
        }


        const bazaKierunku =
            najlepszyRozklad
                .rozklad
                .kierunki[
                    kierunekIndex
                ];


        /*
         * Trasa bazowa pochodzi WYŁĄCZNIE
         * z aktualnego D/C/6/7.
         */

        const aktywnePrzystankiBazy =
            bazaKierunku.przystanki
                .map(
                    p => {

                        const kursy =
                            filtrujKursyDlaDaty(
                                p.kursy || [],
                                wybranaData
                            );


                        return {

                            przystanek:
                                p,

                            kursy:
                                kursy
                        };
                    }
                )
                .filter(
                    x =>
                        x.kursy.length > 0
                );


        const nowyKierunek = {

            nazwa:
                bazaKierunku.nazwa ||
                "",

            kierunek:
                bazaKierunku.kierunek ||
                "",

            przystanki:
                []
        };


        /*
         * -------------------------------------------------
         * BUDOWANIE PRZYSTANKÓW
         * -------------------------------------------------
         *
         * Lista jest oparta na trasie właściwej dla D/C/6/7.
         *
         * Dodatkowe rozkłady mogą dostarczać kursy do tych
         * samych przystanków, ale NIE mogą dodać nowych
         * przystanków spoza trasy bazowej.
         */

        aktywnePrzystankiBazy.forEach(
            element => {

                const baza =
                    element.przystanek;


                const kursyZDaty =
                    element.kursy;


                const klucz =
                    kluczPrzystanku(
                        baza
                    );


                const wszystkieKursy =
                    [];


                /*
                 * Dodajemy kursy z właściwego rozkładu.
                 */

                kursyZDaty.forEach(
                    kurs => {

                        if (!kurs)
                            return;


                        const nowyKurs =
                            Object.assign(
                                {},
                                kurs
                            );


                        const lokalnaLitera =
                            pobierzWariant(
                                kurs
                            );


                        const kanonicznaLitera =
                            najlepszyRozklad
                                .mapaWariantow
                                .get(
