<!DOCTYPE html>

<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rozkład jazdy</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800;900&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   GŁÓWNY KONTENER I NAGŁÓWKI
   ========================================================= */

.rozkład {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px;
}

.naglowek-linii {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 25px;
    margin-bottom: 15px;
}

.numer-linii {
    font-size: 42px;
    font-weight: bold;
    margin: 0 0 8px 0;
}

.trasa {
    font-size: 19px;
    font-weight: bold;
    margin: 0;
    white-space: pre-line;
}


/* =========================================================
   KIERUNKI I DNI
   ========================================================= */

.kierunki,
.dni {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.kierunek-btn,
.dzien-btn {
    flex: 1;
    padding: 14px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    transition: 0.15s;
}

.kierunek-btn:hover,
.dzien-btn:hover {
    border-color: #0066cc;
}

.kierunek-btn.aktywny,
.dzien-btn.aktywny {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
}


/* =========================================================
   WARIANTY
   ========================================================= */

.warianty-pojemnik {
    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #fff;

    border-top: 2px solid #ccc;
    border-bottom: 2px solid #ccc;

    width: 80%;

    margin-left: auto;
    margin-right: auto;

    padding: 10px 10px 10px 15px;

    margin-bottom: 0;

    box-sizing: border-box;
}

.warianty-info {
    font-size: 15px;
    color: #1d1d1b;
    padding-left: 10px;
}

.warianty-info strong {
    font-weight: 700;
}

.warianty-przyciski {
    display: flex;
    gap: 2px;
    padding-right: 10px;
}

.wariant-btn {
    padding: 4px 12px;

    font-size: 22px;
    font-weight: 900;

    color: #706f6f;

    background: transparent;
    border: none;

    border-bottom: 4px solid transparent;

    cursor: pointer;

    transition: 0.15s;

    font-family: inherit;

    text-transform: uppercase;
}

.wariant-btn:hover {
    color: #d61c12;
}

.wariant-btn.aktywny {
    color: #d61c12;
    border-bottom-color: #d61c12;
}


/* =========================================================
   KALENDARZ / ŁADOWANIE / BŁĘDY
   ========================================================= */

.kalendarz {
    display: none;

    background: white;

    border: 1px solid #ddd;
    border-radius: 6px;

    padding: 15px;
    margin-bottom: 15px;
}

.kalendarz input {
    padding: 10px;

    font-size: 16px;

    border: 1px solid #ccc;
    border-radius: 5px;
}

.typ-rozkładu {
    background: #f7f7f7;

    border: 1px solid #ddd;

    width: 80%;

    margin-left: auto;
    margin-right: auto;

    padding: 12px 15px;

    margin-bottom: 15px;

    border-radius: 6px;

    font-size: 14px;
    color: #555;

    box-sizing: border-box;
}

.brak-godzin {
    padding: 15px;

    color: #777;

    font-size: 14px;
}

.loading {
    background: white;

    border: 1px solid #ddd;
    border-radius: 8px;

    padding: 30px;

    text-align: center;

    color: #666;
}

.blad {
    background: #fff4f4;

    border: 1px solid #e0aaaa;

    color: #a00000;

    border-radius: 8px;

    padding: 20px;

    line-height: 1.6;
}

.blad strong {
    display: block;
    margin-bottom: 8px;
}

.brak-danych {
    padding: 30px;

    text-align: center;

    color: #777;

    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;
}


/* =========================================================
   ROZKŁAD JAZDY
   ========================================================= */

.przystanek {
    background: white;

    border: 1px solid #ddd;

    border-radius: 7px;

    overflow: hidden;
}

.godziny {
    width: 100%;
}

.wiersz-godziny {
    display: grid;

    grid-template-columns:
        43px
        repeat(10, 46px);

    grid-auto-columns: 46px;

    min-height: 38px;

    border-bottom: 1px solid #eee;
}

.kolumna-godzina {
    display: flex;

    align-items: center;
    justify-content: center;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 16px;

    font-weight: 600;

    background: #555;

    color: white;

    border-right: 1px solid #444;

    min-height: 38px;
}

.kolumna-minuta {
    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    position: relative;

    min-height: 38px;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-weight: 600;

    width: 46px;

    color: black;

    transform: translateX(10px);

    cursor: pointer;
}

.kolumna-minuta:hover {
    background: #e8eef5;
}

.minuta-z-wariantem {
    position: relative;

    display: inline-block;

    line-height: 1;

    text-align: center;
}

.minuta {
    display: inline-block;

    font-size: 16px;

    font-weight: 600;

    line-height: 1;

    z-index: 1;
}

.wariant-minuty {
    position: absolute;

    left: calc(100% + 2px);

    bottom: -1px;

    font-size: 12px;

    line-height: 1;

    font-weight: 600;

    white-space: nowrap;

    z-index: 2;
}


/* =========================================================
   LEGENDA
   ========================================================= */

.legenda-wariantow {
    background: #f7f7f7;

    border-top: 1px solid #ddd;

    padding: 10px 15px;

    font-size: 16px;

    color: #555;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;
}

.legenda-element {

    align-items: baseline;

    gap: 6px;

    line-height: 1.35;

    font-weight: 600;
}

.legenda-litera,
.legenda-separator,

    font-size: 15px;
}

.legenda-litera {
    font-size: 16px;

    min-width: 22px;
}


/* =========================================================
   LISTA PRZYSTANKÓW
   ========================================================= */

.lista-przystankow {
    display: flex;

    flex-direction: column;

    gap: 0;

    background: white;

    padding: 15px 0;

    border-radius: 0;

    width: 80%;

    margin: 0 auto;

    box-sizing: border-box;
}


/* =========================================================
   WIERSZ PRZYSTANKU
   ========================================================= */

.przystanek-btn {
    width: 100%;

    display: flex;

    align-items: center;

    padding: 0;

    background: transparent;

    border: none;

    cursor: pointer;

    text-align: left;

    transition: 0.15s;

    margin: 0;

    position: relative;
}

.przystanek-btn:hover {

}

.przystanek-btn:hover .przystanek-nazwa {

/* =========================================================

   ========================================================= */

        sans-serif;

    font-size: 13px;

    font-weight: 600;

    color: #777;

    flex-shrink: 0;

    white-space: nowrap;
}

.kolumna-czas-przejazdu.pierwszy {
    color: #777;
}


/* =========================================================
   OŚ TRASY

.node-wrapper {
    height: 44px;

    position: relative;

    flex-shrink: 0;
}

.node-wrapper svg {
    display: block;

    overflow: visible;
}


/* =========================================================
   NAZWA PRZYSTANKU
   ========================================================= */

.przystanek-nazwa {
    flex: 1;

    display: flex;

    align-items: center;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 16px;

    font-weight: 600;

    padding-left: 12px;

    z-index: 11;

.przystanek-btn.inactive .przystanek-nazwa {
    color: #999;

    font-weight: 600;
}

.przystanek-btn.inactive:hover .przystanek-nazwa {
    color: #d61c12;
}


/* =========================================================
   NUMER PRZYSTANKU
   ========================================================= */

.przystanek-nr {

    display: flex;

    align-items: center;

    padding: 0 16px 0 10px;

    font-size: 14px;

    font-weight: 600;

    color: #666;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    flex-shrink: 0;

    z-index: 11;
}

.przystanek-btn.inactive .przystanek-nr {
    color: #ccc;
}


/* =========================================================
   WIDOK PRZYSTANKU
   ========================================================= */

.naglowek-przystanku-widok {
    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;

    margin-bottom: 15px;
}

.naglowek-przystanku-widok .nazwa {
    display: inline;

    font-family:

        sans-serif;

    font-weight: 700;

}

.naglowek-przystanku-widok .numer {
    display: inline;

    margin-left: 8px;

    color: #777;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-weight: 600;

/* =========================================================
   WIDOK CAŁEGO KURSU
   ========================================================= */

.kurs-widok {

    border: 1px solid #ddd;

    border-radius: 8px;

    overflow: hidden;

    margin-top: 15px;
}

.kurs-naglowek {

.kurs-naglowek .kurs-tytul {

.kurs-naglowek .kurs-informacja {

}

.kurs-lista {

    flex-direction: column;

}

.kurs-przystanek {
    display: flex;

    align-items: center;

    height: 44px;
}

.kurs-przystanek.aktywny {

}

.kurs-czas-rel {
    width: 60px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding-right: 0;

    color: #888;

    font-family:

        sans-serif;

.kurs-nazwa-box {
    flex: 1;

    display: flex;

    align-items: center;

    padding-left: 12px;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 15px;

    font-weight: 600;

    color: #000;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

.kurs-nr {
    margin-left: auto;

    display: flex;

    align-items: center;

    padding-right: 15px;

    font-size: 13px;

    font-weight: 600;

    color: #777;

    font-family:
        "Barlow Semi Condensed",

.kurs-czas-abs {

/* =========================================================
   RESPONSYWNOŚĆ
   ========================================================= */

@media (max-width: 550px) {

    .rozkład {
        margin: 15px auto;
    }

    .warianty-pojemnik {
        flex-direction: column;

        align-items: flex-start;

        padding: 10px 10px 10px 15px;
    }

    .warianty-info {

    .warianty-przyciski {

    }

    .typ-rozkładu {

    }

    .wiersz-godziny {
        grid-template-columns:
            36px

        min-height: 36px;

        overflow-x: auto;
    }

    .kolumna-godzina {

        min-height: 36px;
    }

    .kolumna-minuta {
        width: 46px;

    .przystanek-btn .przystanek-nazwa {

<script>

if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
}


/* =========================================================
   ZMIENNE GŁÓWNE
   ========================================================= */

let daneLinii = null;
let numerLinii = null;
let aktualnyKierunek = 0;
let aktualnyWariant = null;
let aktualnyDzien = "dzisiaj";
let wybranaData = new Date();

let wybranyPrzystanek = null;
let wybranyPrzystanekIndex = null;
let wybranyPrzystanekId = null;

let widokKursuAktywny = false;


/* =========================================================
   PARAMETRY URL
   ========================================================= */

const parametry =
    new URLSearchParams(
        window.location.search
    );

numerLinii =
    parametry.get("linia");


if (!numerLinii) {

    pokazBlad(
        "Nie podano numeru linii.",
        "Wybierz linię z menu."
    );

} else {

    document.getElementById(
        "numerLinii"
    ).textContent =
        numerLinii;

    pobierzDane();
}


/* =========================================================
   USUWANIE POLA GODZINY
   ========================================================= */

function usunPoleGodziny(tekst) {

    const pozycja =
        tekst.search(
            /"godziny"\s*:\s*\[/
        );

    if (pozycja === -1)
        return tekst;

    const poczatekTablicy =
        tekst.indexOf(
            "[",
            pozycja
        );

    if (poczatekTablicy === -1)
        return tekst;

    let poziom = 0;
    let wStringu = false;
    let ucieczka = false;
    let koniecTablicy = -1;

    for (
        let i = poczatekTablicy;
        i < tekst.length;
        i++
    ) {

        const znak =
            tekst[i];

        if (ucieczka) {

            ucieczka = false;
            continue;
        }

        if (
            znak === "\\" &&
            wStringu
        ) {

            ucieczka = true;
            continue;
        }

        if (znak === '"') {

            wStringu =
                !wStringu;

            continue;
        }

        if (wStringu)
            continue;

        if (znak === "[")
            poziom++;

        if (znak === "]") {

            poziom--;

            if (poziom === 0) {

                koniecTablicy =
                    i;

                break;
            }
        }
    }

    if (koniecTablicy === -1)
        return tekst;

    let poczatek =
        pozycja;

    let koniec =
        koniecTablicy + 1;

    while (
        koniec < tekst.length &&
        /\s/.test(
            tekst[koniec]
        )
    ) {

        koniec++;
    }

    if (
        tekst[koniec] === ","
    ) {

        koniec++;
    }

    return (
        tekst.substring(
            0,
            poczatek
        ) +
        tekst
            .substring(koniec)
            .replace(
                /,\s*,/g,
                ","
            )
            .replace(
                /,\s*}/g,
                "}"
            )
    );
}


/* =========================================================
   POBIERANIE JSON
   ========================================================= */

async function pobierzDane() {

    const adres =
        "../dane/" +
        encodeURIComponent(
            numerLinii
        ) +
        ".json";

    try {

        const odpowiedz =
            await fetch(
                adres,
                {
                    cache: "no-cache"
                }
            );

        if (!odpowiedz.ok) {

            throw new Error(
                "Nie znaleziono pliku JSON dla linii " +
                numerLinii
            );
        }

        let tekst =
            await odpowiedz.text();

        try {

            daneLinii =
                JSON.parse(
                    tekst
                );

        } catch (e1) {

            daneLinii =
                JSON.parse(
                    usunPoleGodziny(
                        tekst
                    )
                );
        }

        uruchomStrone();

    } catch (blad) {

        pokazBlad(
            "Błąd ładowania.",
            blad.message
        );
    }
}


/* =========================================================
   ZAPIS PRZYSTANKU
   ========================================================= */

function ustawWybranyPrzystanek(
    p,
    index
) {

    if (!p) {

        wybranyPrzystanek = null;
        wybranyPrzystanekIndex = null;
        wybranyPrzystanekId = null;

        return;
    }

    wybranyPrzystanek = p;

    if (
        index !== undefined &&
        index !== null &&
        Number.isInteger(
            Number(index)
        )
    ) {

        wybranyPrzystanekIndex =
            Number(index);

    } else {

        wybranyPrzystanekIndex =
            null;
    }

    wybranyPrzystanekId = {

        kierunek:
            Number(
                aktualnyKierunek
            ),

        index:
            wybranyPrzystanekIndex,

        lp:
            p.lp !== undefined &&
            p.lp !== null
                ? String(
                    p.lp
                ).trim()
                : "",

        nr:
            p.nr !== undefined &&
            p.nr !== null
                ? String(
                    p.nr
                ).trim()
                : "",

        nazwa:
            String(
                p.nazwa || ""
            ).trim()
    };
}


/* =========================================================
   ZNAJDOWANIE PRZYSTANKU
   ========================================================= */

function znajdzPrzystanek(
    przystanki,
    identyfikator
) {

    if (
        !Array.isArray(
            przystanki
        ) ||
        przystanki.length === 0 ||
        identyfikator === null ||
        identyfikator === undefined
    ) {

        return null;
    }

    const szukany =
        String(
            identyfikator
        ).trim();

    if (
        szukany
            .toLowerCase()
            .startsWith("idx:")
    ) {

        const idx =
            Number(
                szukany
                    .substring(4)
                    .trim()
            );

        if (
            Number.isInteger(idx) &&
            idx >= 0 &&
            idx < przystanki.length
        ) {

            return przystanki[idx];
        }

        return null;
    }

    if (
        wybranyPrzystanekId &&
        Number(
            wybranyPrzystanekId.kierunek
        ) ===
        Number(
            aktualnyKierunek
        ) &&
        wybranyPrzystanekIndex !== null
    ) {

        const idx =
            Number(
                wybranyPrzystanekIndex
            );

        if (
            Number.isInteger(idx) &&
            idx >= 0 &&
            idx < przystanki.length
        ) {

            return przystanki[idx];
        }
    }

    if (
        szukany
            .toLowerCase()
            .startsWith("lp:")
    ) {

        const lp =
            szukany
                .substring(3)
                .trim();

        const znaleziony =
            przystanki.find(
                p =>
                    String(
                        p.lp !== undefined &&
                        p.lp !== null
                            ? p.lp
                            : ""
                    ).trim() === lp
            );

        if (znaleziony)
            return znaleziony;
    }

    if (
        wybranyPrzystanekId &&
        wybranyPrzystanekId.nr &&
        wybranyPrzystanekId.nazwa
    ) {

        const nr =
            wybranyPrzystanekId.nr;

        const nazwa =
            wybranyPrzystanekId.nazwa;

        const znaleziony =
            przystanki.find(
                p =>
                    String(
                        p.nr || ""
                    ).trim() === nr &&
                    normalizujTekst(
                        p.nazwa
                    ) ===
                    normalizujTekst(
                        nazwa
                    )
            );

        if (znaleziony)
            return znaleziony;
    }

    const poNr =
        przystanki.find(
            p =>
                String(
                    p.nr || ""
                ).trim() ===
                szukany
        );

    if (poNr)
        return poNr;

    const poNazwie =
        przystanki.find(
            p =>
                String(
                    p.nazwa || ""
                ).trim() ===
                szukany
        );

    if (poNazwie)
        return poNazwie;

    const normalny =
        normalizujTekst(
            szukany
        );

    return przystanki.find(
        p =>
            normalizujTekst(
                p.nazwa
            ) === normalny
    ) || null;
}

            )

                );

            if (znaleziony) {

                    );

                );

/* =========================================================
   TYP DNIA
   ========================================================= */

function okreslTypDnia(data) {

    const d =
        data.getDay();

    if (d === 6)
        return "sobota";

    if (d === 0)
        return "niedziela";

    return "roboczy";
}


/* =========================================================
   NORMALIZACJA
   ========================================================= */

function normalizujTekst(tekst) {

    return String(
        tekst || ""
    )
        .toLowerCase()
        .normalize(
            "NFD"
        )
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );
}


/* =========================================================
   ZNAJDŹ ROZKŁAD
   ========================================================= */

function znajdzRozklad() {

    const rozklady =
        daneLinii.rozkłady ||
        [];

    if (
        rozklady.length === 0
    )
        return null;

    const typ =
        okreslTypDnia(
            wybranaData
        );

    if (
        typ === "sobota"
    ) {

        for (
            const r of rozklady
        ) {

            if (
                normalizujTekst(
                    r.nazwa
                ).includes(
                    "sobot"
                )
            ) {

                return r;
            }
        }
    }

    if (
        typ === "niedziela"
    ) {

        for (
            const r of rozklady
        ) {

            const n =
                normalizujTekst(
                    r.nazwa
                );

            if (
                n.includes(
                    "niedziel"
                ) ||
                n.includes(
                    "swiat"
                )
            ) {

                return r;
            }
        }
    }

    if (
        typ === "roboczy"
    ) {

        for (
            const r of rozklady
        ) {

            const n =
                normalizujTekst(
                    r.nazwa
                );

            if (
                n.includes(
                    "piatk"
                ) ||
                n.includes(
                    "poniedzial"
                )
            ) {

                return r;
            }
        }
    }

    return rozklady[0];
}


/* =========================================================
   KIERUNKI
   ========================================================= */

function generujKierunki() {

    const kontener =
        document.getElementById(
            "kierunki"
        );

    kontener.innerHTML =

    const rozklad =
        znajdzRozklad();

    if (

            rozklad.kierunki
        )
    )

    rozklad.kierunki.forEach(

                );

                (
                    index ===

                        ? " aktywny"
                        : ""
                );

            const p =
                kierunek.przystanki ||
                [];

            btn.textContent =
                p.length > 0
                    ? (
                        p[
                            p.length - 1
                        ].nazwa ||
                        "Kierunek"
                    )
                    : "Kierunek " +
                      (
                        index + 1
                    );

            btn.onclick =

                    aktualnyKierunek =
                        index;

                    aktualnyWariant =
                        null;

                    ustawWybranyPrzystanek(

                    );

                    widokKursuAktywny =
                        false;

                    aktualizujHistorieURL(
                        null
                    );

                    pokazRozklad();
                };

                btn
            );

    );
}

                );

) {
