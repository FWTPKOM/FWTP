<head>

<title>Rozkład jazdy</title>

<link rel="stylesheet" href="../css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   GŁÓWNY KONTENER
   ========================================================= */

.rozkład {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px;
}

.powrot {
    display: inline-block;
    margin-bottom: 20px;
    color: #0066cc;
    text-decoration: none;
    font-weight: bold;
    cursor: pointer;
}

.powrot:hover {
    text-decoration: underline;
}

/* =========================================================
   NAGŁÓWEK LINII
   ========================================================= */

.naglowek-linii {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 25px;
    margin-bottom: 15px;
}

.numer-linii {
    font-size: 42px;
    font-weight: bold;
    margin: 0 0 8px 0;
}

.trasa {
    font-size: 19px;
    font-weight: bold;
    margin: 0;
    white-space: pre-line;
}

/* =========================================================
   KIERUNKI
   ========================================================= */

.kierunki,
.dni {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.kierunek-btn,
.dzien-btn {
    flex: 1;
    padding: 14px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    transition: 0.15s;
}

.kierunek-btn:hover,
.dzien-btn:hover {
    border-color: #0066cc;
}

.kierunek-btn.aktywny,
.dzien-btn.aktywny {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
}

/* =========================================================
   WARIANTY
   ========================================================= */

.warianty-pojemnik {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border-top: 2px solid #ccc;
    border-bottom: 2px solid #ccc;
    padding: 10px 0;
    margin-bottom: 15px;
}

.warianty-info {
    font-size: 15px;
    color: #1d1d1b;
}

.warianty-info strong {
    font-weight: 700;
}

.warianty-przyciski {
    display: flex;
    gap: 2px;
}

.wariant-btn {
    padding: 4px 12px;
    font-size: 22px;
    font-weight: 900;
    color: #706f6f;
    background: transparent;
    border: none;
    border-bottom: 4px solid transparent;
    cursor: pointer;
    transition: 0.15s;
    font-family: inherit;
    text-transform: uppercase;
}

.wariant-btn:hover {
    color: #d61c12;
}

.wariant-btn.aktywny {
    color: #d61c12;
    border-bottom-color: #d61c12;
}

/* =========================================================
   KALENDARZ
   ========================================================= */

.kalendarz {
    display: none;
    background: white;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 15px;
    margin-bottom: 15px;
}

.kalendarz input {
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

/* =========================================================
   INFORMACJE
   ========================================================= */

.typ-rozkładu {
    background: #f7f7f7;
    border: 1px solid #ddd;
    padding: 12px 15px;
    margin-bottom: 15px;
    border-radius: 6px;
    font-size: 14px;
    color: #555;
}

.brak-godzin {
    padding: 15px;
    color: #777;
    font-size: 14px;
}

.loading {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 30px;
    text-align: center;
    color: #666;
}

.blad {
    background: #fff4f4;
    border: 1px solid #e0aaaa;
    color: #a00000;
    border-radius: 8px;
    padding: 20px;
    line-height: 1.6;
}

.blad strong {
    display: block;
    margin-bottom: 8px;
}

.brak-danych {
    padding: 30px;
    text-align: center;
    color: #777;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
}

/* =========================================================
   ROZKŁAD MINUTOWY
   ========================================================= */

.przystanek {
    background: white;
    border: 1px solid #ddd;
    border-radius: 7px;
    overflow: hidden;
}

.godziny {
    width: 100%;
}

.wiersz-godziny {
    display: grid;
    grid-template-columns: 43px repeat(10, 46px);
    grid-auto-columns: 46px;
    min-height: 38px;
    border-bottom: 1px solid #eee;
}

.kolumna-godzina {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Barlow Semi Condensed", sans-serif;
    font-size: 16px;
    font-weight: 700;
    background: #555;
    color: white;
    border-right: 1px solid #444;
    min-height: 38px;
}

.kolumna-minuta {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    min-height: 38px;
    font-family: "Barlow Semi Condensed", sans-serif;
    font-weight: 600;
    width: 46px;
    color: black;
    transform: translateX(10px);
    cursor: pointer;
}

.kolumna-minuta:hover {
    background: #e8eef5;
}

.minuta-z-wariantem {
    position: relative;
    display: inline-block;
    line-height: 1;
    text-align: center;
}

.minuta {
    display: inline-block;
    font-size: 16px;
    font-weight: 600;
    line-height: 1;
    z-index: 1;
}

.wariant-minuty {
    position: absolute;
    left: calc(100% + 2px);
    bottom: -1px;
    font-size: 12px;
    line-height: 1;
    font-weight: 600;
    white-space: nowrap;
    z-index: 2;
}

/* =========================================================
   LEGENDA
   ========================================================= */

.legenda-wariantow {
    background: #f7f7f7;
    border-top: 1px solid #ddd;
    padding: 10px 15px;
    font-size: 16px;
    color: #555;
    font-family: "Barlow Semi Condensed", sans-serif;
}

.legenda-element {
    display: flex;
    align-items: baseline;
    gap: 6px;
    line-height: 1.35;
    font-weight: 600;
}

.legenda-litera,
.legenda-separator,
.legenda-opis {
    color: black;
    font-size: 15px;
}

.legenda-litera {
    font-size: 16px;
    min-width: 22px;
}

/* =========================================================
   OŚ TRASY
   ========================================================= */

.lista-przystankow {
    display: flex;
    flex-direction: column;
    gap: 0;
    background: white;
    padding: 15px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.przystanek-btn {
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0;
    background: transparent;
    border: none;
    cursor: pointer;
    text-align: left;
    transition: 0.15s;
    font-family: inherit;
    height: 44px;
    margin: 0;
    position: relative;
}

.przystanek-btn:hover {
    background-color: #f8fbff;
}

.przystanek-btn:hover .przystanek-nazwa {
    color: #0066cc;
}

.node-wrapper {
    height: 44px;
    position: relative;
    flex-shrink: 0;
}

.node-wrapper svg {
    display: block;
    overflow: visible;
}

.przystanek-nazwa {
    flex: 1;
    display: flex;
    align-items: center;
    font-size: 16px;
    font-weight: bold;
    color: #000;
    padding-left: 12px;
    transition: color 0.15s;
    z-index: 11;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.przystanek-btn.inactive .przystanek-nazwa {
    color: #999;
    font-weight: normal;
}

.przystanek-btn.inactive:hover .przystanek-nazwa {
    color: #555;
}

.przystanek-nr {
    margin-left: auto;
    display: flex;
    align-items: center;
    padding: 0 16px 0 10px;
    font-size: 14px;
    font-weight: bold;
    color: #666;
    font-family: "Barlow Semi Condensed", sans-serif;
    flex-shrink: 0;
    z-index: 11;
}

.przystanek-btn.inactive .przystanek-nr {
    color: #ccc;
}

/* =========================================================
   NAGŁÓWEK PRZYSTANKU
   ========================================================= */

.naglowek-przystanku-widok {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 15px;
}

.naglowek-przystanku-widok .nazwa {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 5px;
}

.naglowek-przystanku-widok .numer {
    color: #777;
    font-size: 14px;
}

/* =========================================================
   KURS
   ========================================================= */

.kurs-widok {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 15px;
}

.kurs-naglowek {
    background: #555;
    color: white;
    padding: 15px;
    font-family: "Barlow Semi Condensed", sans-serif;
}

.kurs-naglowek .kurs-tytul {
    font-size: 22px;
    margin-bottom: 5px;
    font-weight: 600;
}

.kurs-naglowek .kurs-informacja {
    font-size: 15px;
    opacity: 0.9;
}

.kurs-lista {
    display: flex;
    flex-direction: column;
    padding: 10px 0;
}

.kurs-przystanek {
    display: flex;
    align-items: center;
    height: 44px;
}

.kurs-przystanek.aktywny {
    background: #f8fbff;
}

.kurs-czas-rel {
    width: 60px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 12px;
    color: #888;
    font-size: 13px;
    flex-shrink: 0;
}

.kurs-nazwa-box {
    flex: 1;
    display: flex;
    align-items: center;
    padding-left: 12px;
    font-size: 15px;
    font-weight: bold;
    color: #000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.kurs-nr {
    margin-left: auto;
    display: flex;
    align-items: center;
    padding-right: 15px;
    font-size: 13px;
    font-weight: bold;
    color: #777;
    font-family: "Barlow Semi Condensed", sans-serif;
    flex-shrink: 0;
}

.kurs-czas-abs {
    width: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 15px;
    flex-shrink: 0;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 550px) {

    .rozkład {
        margin: 15px auto;
    }

    .warianty-pojemnik {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 10px;
    }

    .wiersz-godziny {
        grid-template-columns: 36px repeat(4, 46px);
        min-height: 36px;
        overflow-x: auto;
    }

    .kolumna-godzina {
        font-size: 14px;
        min-height: 36px;
    }

    .kolumna-minuta {
        width: 46px;
        min-width: 46px;
        max-width: 46px;
        min-height: 36px;
    }

    .przystanek-btn .przystanek-nazwa {
        font-size: 15px;
    }

    .naglowek-przystanku-widok .nazwa {
        font-size: 22px;
    }
}

<script>

/* =========================================================
   ZMIENNE
   ========================================================= */

let daneLinii = null;
let numerLinii = null;

let aktualnyKierunek = 0;
let aktualnyWariant = null;
let aktualnyDzien = "dzisiaj";

let wybranaData = new Date();

let wybranyPrzystanek = null;

let widokKursuAktywny = false;


/* =========================================================
   PARAMETRY URL
   ========================================================= */

const parametry = new URLSearchParams(
    window.location.search
);

numerLinii = parametry.get("linia");


if (!numerLinii) {

    pokazBlad(
        "Nie podano numeru linii.",
        "Wybierz linię z menu."
    );

} else {

    document.getElementById(
        "numerLinii"
    ).textContent = numerLinii;

    pobierzDane();
}


/* =========================================================
   NORMALIZACJA TEKSTU
   ========================================================= */

function normalizujTekst(tekst) {

    return String(tekst || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();

}


/* =========================================================
   POBIERANIE JSON
   ========================================================= */

async function pobierzDane() {

    const adres =
        "../dane/" +
        encodeURIComponent(numerLinii) +
        ".json";

    try {

        const odpowiedz =
            await fetch(adres, {
                cache: "no-cache"
            });

        if (!odpowiedz.ok) {

            throw new Error(
                "Nie znaleziono pliku JSON dla linii " +
                numerLinii
            );

        }

        daneLinii = await odpowiedz.json();

        uruchomStrone();

    } catch (blad) {

        console.error(blad);

        pokazBlad(
            "Błąd ładowania.",
            blad.message
        );

    }

}


/* =========================================================
   URUCHOMIENIE
   ========================================================= */

function uruchomStrone() {

    document.getElementById(
        "numerLinii"
    ).textContent =
        daneLinii.linia || numerLinii;

    document.getElementById(
        "trasa"
    ).textContent =
        daneLinii.trasa || "";


    const paramK =
        parametry.get("kierunek");

    if (paramK !== null) {

        const num = Number(paramK);

        if (
            Number.isInteger(num) &&
            num >= 0
        ) {

            aktualnyKierunek = num;

        }

    }


    const paramP =
        parametry.get("przystanek");


    const rozklad =
        znajdzRozklad();


    if (
        paramP &&
        rozklad &&
        Array.isArray(rozklad.kierunki)
    ) {

        const kierunek =
            rozklad.kierunki[
                aktualnyKierunek
            ];


        if (
            kierunek &&
            Array.isArray(kierunek.przystanki)
        ) {

            wybranyPrzystanek =
                znajdzPrzystanek(
                    kierunek.przystanki,
                    paramP
                );

        }

    }


    pokazRozklad();

}


/* =========================================================
   TYP DNIA
   ========================================================= */

function okreslTypDnia(data) {

    const d = data.getDay();

    if (d === 6) return "sobota";

    if (d === 0) return "niedziela";

    return "roboczy";

}


/* =========================================================
   ZNAJDŹ ROZKŁAD
   ========================================================= */

function znajdzRozklad() {

    const rozklady =
        daneLinii.rozkłady || [];

    if (rozklady.length === 0) {

        return null;

    }


    const typ =
        okreslTypDnia(wybranaData);


    if (typ === "sobota") {

        for (const r of rozklady) {

            if (
                normalizujTekst(r.nazwa)
                    .includes("sobot")
            ) {

                return r;

            }

        }

    }


    if (typ === "niedziela") {

        for (const r of rozklady) {

            const n =
                normalizujTekst(r.nazwa);

            if (
                n.includes("niedziel") ||
                n.includes("swiat")
            ) {

                return r;

            }

        }

    }


    if (typ === "roboczy") {

        for (const r of rozklady) {

            const n =
                normalizujTekst(r.nazwa);

            if (
                n.includes("piatk") ||
                n.includes("poniedzial")
            ) {

                return r;

            }

        }

    }


    return rozklady[0];

}


/* =========================================================
   ZNAJDOWANIE PRZYSTANKU
   ========================================================= */

function znajdzPrzystanek(
    przystanki,
    identyfikator
) {

    const id =
        String(identyfikator || "")
            .trim();


    /* Najpierw dokładny numer słupka */

    let znaleziony =
        przystanki.find(
            p =>
                String(p.nr || "")
                    .trim() === id
        );


    if (znaleziony) {

        return znaleziony;

    }


    /* Następnie dokładna nazwa */

    znaleziony =
        przystanki.find(
            p =>
                String(p.nazwa || "")
                    .trim() === id
        );


    if (znaleziony) {

        return znaleziony;

    }


    /* Na końcu normalizacja */

    const idNorm =
        normalizujTekst(id);


    znaleziony =
        przystanki.find(
            p =>
                normalizujTekst(p.nr) === idNorm ||
                normalizujTekst(p.nazwa) === idNorm
        );


    return znaleziony || null;

}


/* =========================================================
   KIERUNKI
   ========================================================= */

function generujKierunki() {

    const kontener =
        document.getElementById(
            "kierunki"
        );

    kontener.innerHTML = "";


    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !Array.isArray(rozklad.kierunki)
    ) {

        return;

    }


    rozklad.kierunki.forEach(
        (kierunek, index) => {

            const btn =
                document.createElement(
                    "button"
                );

            btn.className =
                "kierunek-btn" +
                (
                    index === aktualnyKierunek
                        ? " aktywny"
                        : ""
                );


            const p =
                kierunek.przystanki || [];


            btn.textContent =
                p.length > 0
                    ? (
                        p[p.length - 1].nazwa ||
                        "Kierunek"
                    )
                    : "Kierunek " +
                      (index + 1);


            btn.onclick = () => {

                aktualnyKierunek =
                    index;

                aktualnyWariant =
                    null;

                wybranyPrzystanek =
                    null;

                widokKursuAktywny =
                    false;

                aktualizujHistorieURL(
                    null
                );

                pokazRozklad();

            };


            kontener.appendChild(btn);

        }
    );

}


/* =========================================================
   DZIEŃ
   ========================================================= */

function wybierzDzien(dzien) {

    aktualnyDzien = dzien;

    document
        .querySelectorAll(".dzien-btn")
        .forEach(
            b =>
                b.classList.remove(
                    "aktywny"
                )
        );


    document.getElementById(
        "kalendarz"
    ).style.display = "none";


    if (dzien === "dzisiaj") {

        document.getElementById(
            "dzisiajBtn"
        ).classList.add("aktywny");

        wybranaData =
            new Date();

    }


    if (dzien === "jutro") {

        document.getElementById(
            "jutroBtn"
        ).classList.add("aktywny");

        wybranaData =
            new Date();

        wybranaData.setDate(
            wybranaData.getDate() + 1
        );

    }


    if (dzien === "kalendarz") {

        document.getElementById(
            "kalendarzBtn"
        ).classList.add("aktywny");

        document.getElementById(
            "kalendarz"
        ).style.display = "block";

        document.getElementById(
            "wybranaData"
        ).value =
            formatujDateInput(
                wybranaData
            );

    }


    pokazRozklad();

}


/* =========================================================
   KALENDARZ
   ========================================================= */

document
    .getElementById("wybranaData")
    .addEventListener(
        "change",
        function() {

            if (!this.value) return;


            const czesci =
                this.value.split("-");


            wybranaData =
                new Date(
                    Number(czesci[0]),
                    Number(czesci[1]) - 1,
                    Number(czesci[2])
                );


            pokazRozklad();

        }
    );


function formatujDateInput(data) {

    return (
        data.getFullYear() +
        "-" +
        String(
            data.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
            data.getDate()
        ).padStart(2, "0")
    );

}


/* =========================================================
   WARIANT
   ========================================================= */

function pobierzWariant(k) {

    if (!k) return "";


    if (
        typeof k.wariant === "object" &&
        k.wariant !== null
    ) {

        return String(
            k.wariant.litera ||
            k.wariant.nazwa ||
            ""
        ).trim();

    }


    return String(
        k.wariant || ""
    ).trim();

}


/* =========================================================
   BRYGADA
   ========================================================= */

function pobierzBrygade(k) {

    if (!k) return "";


    return String(
        k.brygada ||
        k.brygadaNr ||
        k.brygadaNumer ||
        ""
    ).trim();

}


/* =========================================================
   WARIANTY DLA KIERUNKU
   ========================================================= */

function zbierzWariantyDlaKierunku(
    kierunek
) {

    const set =
        new Set();


    (
        kierunek.przystanki || []
    ).forEach(
        p => {

            (
                pobierzKursyPrzystanku(p)
            ).forEach(
                k => {

                    const w =
                        pobierzWariant(k);

                    if (w) {

                        set.add(w);

                    }

                }
            );

        }
    );


    return Array.from(set).sort();

}


/* =========================================================
   POBIERANIE KURSÓW PRZYSTANKU
   ========================================================= */

function pobierzKursyPrzystanku(
    przystanek
) {

    if (!przystanek) {

        return [];

    }


    /*
       NOWA STRUKTURA JSON
       kursy: [...]
    */

    if (
        Array.isArray(
            przystanek.kursy
        )
    ) {

        return przystanek.kursy;

    }


    /*
       ALTERNATYWNA STRUKTURA
       godziny: [...]
    */

    if (
        Array.isArray(
            przystanek.godziny
        )
    ) {

        return przystanek.godziny
            .map(
                g =>
                    typeof g === "string"
                        ? {
                            czas: g
                        }
                        : g
            );

    }


    /*
       odjazdy
    */

    if (
        Array.isArray(
            przystanek.odjazdy
        )
    ) {

        return przystanek.odjazdy
            .map(
                g =>
                    typeof g === "string"
                        ? {
                            czas: g
                        }
                        : g
            );

    }


    return [];

}


/* =========================================================
   NAWIGACJA
   ========================================================= */

function aktualizujPrzyciskPowrotu() {

    const link =
        document.getElementById(
            "linkPowrotu"
        );


    if (!link) return;


    if (
        widokKursuAktywny &&
        wybranyPrzystanek !== null
    ) {

        link.textContent =
            "← Powrót do: " +
            wybranyPrzystanek.nazwa;


        link.href = "#";


        link.onclick =
            function(e) {

                e.preventDefault();

                widokKursuAktywny =
                    false;

                pokazRozklad();

            };


    } else if (
        wybranyPrzystanek !== null
    ) {

        link.textContent =
            "← Trasa linii " +
            (
                daneLinii
                    ? daneLinii.linia
                    : numerLinii
            );


        link.href = "#";


        link.onclick =
            function(e) {

                e.preventDefault();

                wybranyPrzystanek =
                    null;

                aktualizujHistorieURL(
                    null
                );

                pokazRozklad();

            };


    } else {

        link.textContent =
            "← Linie";

        link.href =
            "../linie/";

        link.onclick = null;

    }

}


/* =========================================================
   HISTORIA URL
   ========================================================= */

function aktualizujHistorieURL(
    przystanekId
) {

    const url =
        new URL(
            window.location.href
        );


    url.searchParams.set(
        "linia",
        numerLinii
    );


    url.searchParams.set(
        "kierunek",
        aktualnyKierunek
    );


    if (przystanekId) {

        url.searchParams.set(
            "przystanek",
            przystanekId
        );

    } else {

        url.searchParams.delete(
            "przystanek"
        );

    }


    window.history.pushState(
        {
            przystanek:
                przystanekId,
            kierunek:
                aktualnyKierunek
        },
        "",
        url.toString()
    );

}


/* =========================================================
   GŁÓWNY WIDOK
   ========================================================= */

function pokazRozklad() {

    if (!daneLinii) return;


    aktualizujPrzyciskPowrotu();


    const rozklad =
        znajdzRozklad();


    const kontener =
        document.getElementById(
            "przystanki"
        );


    const typ =
        document.getElementById(
            "typRozkladu"
        );


    const wp =
        document.getElementById(
            "warianty-pojemnik"
        );


    if (
        !rozklad ||
        !Array.isArray(
            rozklad.kierunki
        ) ||
        rozklad.kierunki.length === 0
    ) {

        typ.textContent =
            "Brak rozkładu";


        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak danych rozkładu.' +
            '</div>';


        if (wp) {

            wp.style.display =
                "none";

        }


        return;

    }


    if (
        aktualnyKierunek >=
        rozklad.kierunki.length
    ) {

        aktualnyKierunek = 0;

    }


    generujKierunki();


    if (widokKursuAktywny) {

        return;

    }


    /*
       JEŻELI NIE WYBRANO PRZYSTANKU
       → POKAZUJEMY TRASĘ
    */

    if (!wybranyPrzystanek) {

        pokazListePrzystankow(
            rozklad
        );

        return;

    }


    const kierunek =
        rozklad.kierunki[
            aktualnyKierunek
        ];


    const p =
        kierunek.przystanki || [];


    /*
       WAŻNE:
       SZUKAMY PRZYSTANKU PONOWNIE
       PO NUMERZE SŁUPKA / NAZWIE
    */

    const akt =
        znajdzPrzystanek(
            p,
            wybranyPrzystanek.nr ||
            wybranyPrzystanek.nazwa
        );


    /*
       JEŻELI NIE ZNALEZIONO
       WRACAMY DO TRASY
    */

    if (!akt) {

        wybranyPrzystanek =
            null;

        pokazListePrzystankow(
            rozklad
        );

        return;

    }


    /*
       OD TEGO MOMENTU PRACUJEMY
       NA PRAWDZIWYM OBIEKCIE
       PRZYSTANKU Z AKTUALNEGO JSON
    */

    wybranyPrzystanek =
        akt;


    pokazRozkladWybranegoPrzystanku(
        rozklad,
        akt
    );

}


/* =========================================================
   LISTA PRZYSTANKÓW
   ========================================================= */

function pokazListePrzystankow(
    rozklad
) {

    const kontener =
        document.getElementById(
            "przystanki"
        );


    const kierunek =
        rozklad.kierunki[
            aktualnyKierunek
        ];


    const przystanki =
        kierunek.przystanki || [];


    document.getElementById(
        "typRozkladu"
    ).textContent =
        "Wybierz przystanek";


    document.querySelector(
        ".dni"
    ).style.display =
        "none";


    document.getElementById(
        "kalendarz"
    ).style.display =
        "none";


    kontener.innerHTML = "";


    const wp =
        document.getElementById(
            "warianty-pojemnik"
        );


    const wprz =
        document.getElementById(
            "warianty-przyciski"
        );


    let wariantyKierunku = [];


    if (wp && wprz) {

        wariantyKierunku =
            zbierzWariantyDlaKierunku(
                kierunek
            );


        if (
            wariantyKierunku.length > 0
        ) {

            wp.style.display =
                "flex";


            wprz.innerHTML =
                "";


            if (
                aktualnyWariant === null ||
                !wariantyKierunku.includes(
                    aktualnyWariant
                )
            ) {

                if (
                    wariantyKierunku.includes(
                        "A"
                    )
                ) {

                    aktualnyWariant =
                        "A";

                } else {

                    aktualnyWariant =
                        wariantyKierunku[0];

                }

            }


            wariantyKierunku.forEach(
                w => {

                    if (w === "") return;


                    const btn =
                        document.createElement(
                            "button"
                        );


                    btn.className =
                        "wariant-btn" +
                        (
                            aktualnyWariant === w
                                ? " aktywny"
                                : ""
                        );


                    btn.textContent = w;


                    btn.onclick = () => {

                        aktualnyWariant =
                            w;

                        pokazRozklad();

                    };


                    wprz.appendChild(btn);

                }
            );


        } else {

            wp.style.display =
                "none";

            aktualnyWariant =
                null;

        }

    }


    if (przystanki.length === 0) {

        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak przystanków.' +
            '</div>';

        return;

    }


    const N =
        przystanki.length;


    /*
       GŁÓWNA OŚ
    */

    let mainWariant =
        wariantyKierunku.includes("A")
            ? "A"
            : (
                wariantyKierunku[0] ||
                ""
            );


    let isOnMainAxis =
        new Array(N)
            .fill(false);


    przystanki.forEach(
        (p, i) => {

            isOnMainAxis[i] =
                pobierzKursyPrzystanku(p)
                    .some(
                        k =>
                            pobierzWariant(k) ===
                            mainWariant
                    );

        }
    );


    /*
       ŚCIEŻKI KURSÓW
    */

    const tripPaths = {};


    przystanki.forEach(
        (p, i) => {

            pobierzKursyPrzystanku(p)
                .forEach(
                    k => {

                        if (!k.numer)
                            return;


                        if (
                            !tripPaths[
                                k.numer
                            ]
                        ) {

                            tripPaths[
                                k.numer
                            ] = [];

                        }


                        tripPaths[
                            k.numer
                        ].push({
                            index: i,
                            wariant:
                                pobierzWariant(k)
                        });

                    }
                );

        }
    );


    const edgesMap = {};


    Object.values(
        tripPaths
    ).forEach(
        path => {

            path.sort(
                (a, b) =>
                    a.index -
                    b.index
            );


            for (
                let j = 0;
                j < path.length - 1;
                j++
            ) {

                const u =
                    path[j].index;

                const v =
                    path[j + 1].index;

                const w =
                    path[j].wariant;

                const key =
                    u + "," + v;


                if (!edgesMap[key]) {

                    edgesMap[key] = {
                        u: u,
                        v: v,
                        warianty:
                            new Set()
                    };

                }


                edgesMap[key]
                    .warianty
                    .add(w);

            }

        }
    );


    const edges =
        Object.values(
            edgesMap
        );


    let hasLeftBypass =
        false;


    edges.forEach(
        e => {

            if (
                isOnMainAxis[e.u] &&
                isOnMainAxis[e.v]
            ) {

                if (
                    e.v - e.u === 1
                ) {

                    e.track = 0;

                } else {

                    let skipsMain =
                        false;


                    for (
                        let k =
                            e.u + 1;
                        k < e.v;
                        k++
                    ) {

                        if (
                            isOnMainAxis[k]
                        ) {

                            skipsMain =
                                true;

                            break;

                        }

                    }


                    if (skipsMain) {

                        e.track = -1;

                        hasLeftBypass =
                            true;

                    } else {

                        e.track = 0;

                    }

                }

            } else {

                e.track = 1;

            }

        }
    );


    const ROW_HEIGHT = 44;
    const TRACK_W = 22;

    const SPINE_X =
        hasLeftBypass
            ? 44
            : 26;

    const LEFT_X =
        SPINE_X -
        TRACK_W;

    const RIGHT_X =
        SPINE_X +
        TRACK_W;

    const SVG_W =
        RIGHT_X + 16;


    let firstActiveIndex =
        -1;

    let lastActiveIndex =
        -1;


    przystanki.forEach(
        (p, i) => {

            const active =
                pobierzKursyPrzystanku(p)
                    .some(
                        k =>
                            pobierzWariant(k) ===
                            aktualnyWariant
                    );


            if (active) {

                if (
                    firstActiveIndex === -1
                ) {

                    firstActiveIndex =
                        i;

                }


                lastActiveIndex =
                    i;

            }

        }
    );


    const lista =
        document.createElement(
            "div"
        );

    lista.className =
        "lista-przystankow";


    przystanki.forEach(
        (p, i) => {

            const kursy =
                pobierzKursyPrzystanku(p);


            const nodeActive =
                kursy.some(
                    k =>
                        pobierzWariant(k) ===
                        aktualnyWariant
                );


            const btn =
                document.createElement(
                    "button"
                );


            btn.type =
                "button";


            btn.className =
                "przystanek-btn" +
                (
                    nodeActive
                        ? ""
                        : " inactive"
                );


            const isFirstActive =
                i === firstActiveIndex;

            const isLastActive =
                i === lastActiveIndex;


            /*
               NŻ
            */

            const isNz =
                p.naZadanie === true ||
                String(
                    p.naZadanie
                ).toLowerCase() ===
                    "true" ||
                p.nz === true ||
                String(
                    p.nz
                ).toLowerCase() ===
                    "true" ||
                String(
                    p.typ || ""
                ).toUpperCase() ===
                    "NŻ" ||
                (
                    typeof p.nazwa ===
                    "string" &&
                    p.nazwa.includes(
                        "(NŻ)"
                    )
                );


            let inactiveLines = "";
            let activeLines = "";


            const drawLine =
                (
                    x1,
                    y1,
                    x2,
                    y2,
                    isActive
                ) => {

                    const color =
                        isActive
                            ? "#000"
                            : "#ccc";


                    const w =
                        isActive
                            ? 2.5
                            : 2;


                    const str =
                        `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}" stroke-linecap="round" />`;


                    if (isActive) {

                        activeLines += str;

                    } else {

                        inactiveLines += str;

                    }

                };


            edges.forEach(
                e => {

                    const isEdgeActive =
                        e.warianty.has(
                            aktualnyWariant
                        );


                    if (
                        e.track === 0
                    ) {

                        if (
                            i === e.u
                        ) {

                            drawLine(
                                SPINE_X,
                                ROW_HEIGHT / 2,
                                SPINE_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i > e.u &&
                            i < e.v
                        ) {

                            drawLine(
                                SPINE_X,
                                0,
                                SPINE_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i === e.v
                        ) {

                            drawLine(
                                SPINE_X,
                                0,
                                SPINE_X,
                                ROW_HEIGHT / 2,
                                isEdgeActive
                            );

                        }

                    } else if (
                        e.track === 1
                    ) {

                        const startX =
                            isOnMainAxis[e.u]
                                ? SPINE_X
                                : RIGHT_X;

                        const endX =
                            isOnMainAxis[e.v]
                                ? SPINE_X
                                : RIGHT_X;


                        if (
                            i === e.u
                        ) {

                            drawLine(
                                startX,
                                ROW_HEIGHT / 2,
                                RIGHT_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i > e.u &&
                            i < e.v
                        ) {

                            drawLine(
                                RIGHT_X,
                                0,
                                RIGHT_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i === e.v
                        ) {

                            drawLine(
                                RIGHT_X,
                                0,
                                endX,
                                ROW_HEIGHT / 2,
                                isEdgeActive
                            );

                        }

                    } else if (
                        e.track === -1
                    ) {

                        if (
                            i === e.u
                        ) {

                            drawLine(
                                SPINE_X,
                                ROW_HEIGHT / 2,
                                LEFT_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i > e.u &&
                            i < e.v
                        ) {

                            drawLine(
                                LEFT_X,
                                0,
                                LEFT_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i === e.v
                        ) {

                            drawLine(
                                LEFT_X,
                                0,
                                SPINE_X,
                                ROW_HEIGHT / 2,
                                isEdgeActive
                            );

                        }

                    }

                }
            );


            const nodeX =
                isOnMainAxis[i]
                    ? SPINE_X
                    : RIGHT_X;


            const strokeColor =
                nodeActive
                    ? (
                        isFirstActive
                            ? "#000"
                            : "#e42313"
                    )
                    : "#ccc";


            const fillColor =
                nodeActive
                    ? (
                        isFirstActive
                            ? "#000"
                            : "#e42313"
                    )
                    : "#ccc";


            let nodeSvg = "";


            /*
               NŻ = BIAŁY ŚRODEK
            */

            if (
                isFirstActive ||
                isLastActive
            ) {

                if (isNz) {

                    nodeSvg =
                        `<rect x="${nodeX - 5}" y="17" width="10" height="10" fill="#ffffff" stroke="${strokeColor}" stroke-width="2.5" />`;

                } else {

                    nodeSvg =
                        `<rect x="${nodeX - 5.5}" y="16.5" width="11" height="11" fill="${fillColor}" stroke="none" />`;

                }

            } else {

                if (isNz) {

                    nodeSvg =
                        `<circle cx="${nodeX}" cy="22" r="5" fill="#ffffff" stroke="${strokeColor}" stroke-width="2.5" />`;

                } else {

                    nodeSvg =
                        `<circle cx="${nodeX}" cy="22" r="5.5" fill="${fillColor}" stroke="none" />`;

                }

            }


            const svgHtml =
                `<svg width="${SVG_W}" height="${ROW_HEIGHT}">
                    ${inactiveLines}
                    ${activeLines}
                    ${nodeSvg}
                </svg>`;


            const nodeWrapper =
                document.createElement(
                    "div"
                );

            nodeWrapper.className =
                "node-wrapper";

            nodeWrapper.style.width =
                SVG_W + "px";

            nodeWrapper.innerHTML =
                svgHtml;


            const nazwa =
                document.createElement(
                    "div"
                );

            nazwa.className =
                "przystanek-nazwa";

            nazwa.textContent =
                p.nazwa ||
                "Przystanek";


            const nr =
                document.createElement(
                    "div"
                );

            nr.className =
                "przystanek-nr";

            nr.textContent =
                p.nr || "";


            btn.appendChild(
                nodeWrapper
            );

            btn.appendChild(
                nazwa
            );

            btn.appendChild(
                nr
            );


            /*
               KLIKNIĘCIE W PRZYSTANEK
            */

            btn.onclick =
                () => {

                    wybierzPrzystanek(
                        p,
                        i
                    );

                };


            lista.appendChild(
                btn
            );

        }
    );


    kontener.appendChild(
        lista
    );

}


/* =========================================================
   WYBÓR PRZYSTANKU
   ========================================================= */

function wybierzPrzystanek(
    p,
    index
) {

    /*
       Zapisujemy dokładny przystanek
       z aktualnego kierunku.
    */

    wybranyPrzystanek =
        p;


    widokKursuAktywny =
        false;


    /*
       W URL zapisujemy numer słupka.
       Np. Malborska 01
    */

    const identyfikator =
        p.nr ||
        p.nazwa;


    aktualizujHistorieURL(
        identyfikator
    );


    /*
       Natychmiast wyświetlamy
       rozkład wybranego przystanku.
    */

    pokazRozklad();

}


/* =========================================================
   ROZKŁAD WYBRANEGO PRZYSTANKU
   ========================================================= */

function pokazRozkladWybranegoPrzystanku(
    rozklad,
    przystanek
) {

    const kontener =
        document.getElementById(
            "przystanki"
        );


    document.querySelector(
        ".dni"
    ).style.display =
        "flex";


    if (
        aktualnyDzien !==
        "kalendarz"
    ) {

        document.getElementById(
            "kalendarz"
        ).style.display =
            "none";

    }


    document.getElementById(
        "typRozkladu"
    ).textContent =
        rozklad.nazwa ||
        "Rozkład jazdy";


    document.getElementById(
        "warianty-pojemnik"
    ).style.display =
        "none";


    kontener.innerHTML = "";


    /*
       NAGŁÓWEK PRZYSTANKU
    */

    const naglowek =
        document.createElement(
            "div"
        );


    naglowek.className =
        "naglowek-przystanku-widok";


    naglowek.innerHTML =
        `
        <div class="nazwa">
            ${przystanek.nazwa || "Przystanek"}
        </div>

        <div class="numer">
            ${
                przystanek.nr
                    ? "Słupek: " +
                      przystanek.nr
                    : ""
            }
        </div>
        `;


    kontener.appendChild(
        naglowek
    );


    /*
       BLOK ROZKŁADU
    */

    const blok =
        document.createElement(
            "div"
        );


    blok.className =
        "przystanek";


    const godziny =
        document.createElement(
            "div"
        );


    godziny.className =
        "godziny";


    /*
       NAJWAŻNIEJSZA CZĘŚĆ:
       pobieramy kursy BEZPOŚREDNIO
       z klikniętego przystanku.
    */

    const kursy =
        pobierzKursyPrzystanku(
            przystanek
        );


    if (
        kursy.length === 0
    ) {

        godziny.innerHTML =
            `
            <div class="brak-godzin">
                Brak odjazdów dla
                <strong>
                    ${przystanek.nazwa || ""}
                </strong>
            </div>
            `;

    } else {

        /*
           Sortowanie godzin
        */

        const uporzadkowane =
            [...kursy].filter(
                k =>
                    String(
                        k.czas || ""
                    )
                    .trim()
                    .match(
                        /^\d{1,2}:\d{2}$/
                    )
            );


        uporzadkowane.sort(
            (a, b) =>
                czasWMinutach(
                    a.czas
                ) -
                czasWMinutach(
                    b.czas
                )
        );


        let aktGodz = null;
        let wiersz = null;


        uporzadkowane.forEach(
            k => {

                const dop =
                    String(
                        k.czas || ""
                    )
                    .trim()
                    .match(
                        /^(\d{1,2}):(\d{2})$/
                    );


                if (!dop) return;


                const g =
                    Number(
                        dop[1]
                    );


                const m =
                    dop[2];


                if (
                    aktGodz !== g
                ) {

                    aktGodz =
                        g;


                    wiersz =
                        document.createElement(
                            "div"
                        );


                    wiersz.className =
                        "wiersz-godziny";


                    wiersz.innerHTML =
                        `
                        <div class="kolumna-godzina">
                            ${String(g).padStart(2, "0")}
                        </div>
                        `;


                    godziny.appendChild(
                        wiersz
                    );

                }


                const kol =
                    document.createElement(
                        "div"
                    );


                kol.className =
                    "kolumna-minuta";


                const litera =
                    pobierzWariant(k);


                const brygada =
                    pobierzBrygade(k);


                kol.innerHTML =
                    `
                    <span class="minuta-z-wariantem">

                        <span class="minuta">
                            ${m}
                        </span>

                        ${
                            litera
                                ? `
                                <span class="wariant-minuty">
                                    ${litera}
                                </span>
                                `
                                : ""
                        }

                    </span>
                    `;


                /*
                   Informacja po najechaniu
                */

                const informacje = [];


                if (k.numer) {

                    informacje.push(
                        "Kurs " +
                        k.numer
                    );

                }


                if (brygada) {

                    informacje.push(
                        "Brygada " +
                        brygada
                    );

                }


                if (litera) {

                    informacje.push(
                        "Wariant " +
                        litera
                    );

                }


                if (
                    informacje.length
                ) {

                    kol.title =
                        informacje.join(
                            " | "
                        );

                }


                /*
                   Kliknięcie minuty
                   otwiera cały kurs
                */

                if (k.numer) {

                    kol.onclick =
                        () => {

                            pokazCalyKurs(
                                k.numer
                            );

                        };

                }


                wiersz.appendChild(
                    kol
                );

            }
        );

    }


    blok.appendChild(
        godziny
    );


    /*
       LEGENDA WARIANTÓW
    */

    const uzyteWarianty =
        new Map();


    kursy.forEach(
        k => {

            const w =
                pobierzWariant(k);


            if (w) {

                uzyteWarianty.set(
                    w,
                    ""
                );

            }

        }
    );


    if (
        uzyteWarianty.size > 0 &&
        rozklad.warianty
    ) {

        const leg =
            document.createElement(
                "div"
            );


        leg.className =
            "legenda-wariantow";


        let legList =
            '<div class="legenda-lista">';


        uzyteWarianty.forEach(
            (_, litera) => {

                const w =
                    rozklad.warianty.find(
                        x =>
                            x.litera ===
                            litera
                    );


                if (w) {

                    legList +=
                        `
                        <div class="legenda-element">

                            <span class="legenda-litera">
                                ${litera}
                            </span>

                            <span class="legenda-separator">
                                -
                            </span>

                            <span class="legenda-opis">
                                ${w.opis}
                            </span>

                        </div>
                        `;

                }

            }
        );


        legList +=
            "</div>";


        leg.innerHTML =
            legList;


        blok.appendChild(
            leg
        );

    }


    kontener.appendChild(
        blok
    );

}


/* =========================================================
   CZAS → MINUTY
   ========================================================= */

function czasWMinutach(
    czas
) {

    const p =
        String(
            czas || ""
        ).split(":");


    if (
        p.length !== 2
    ) {

        return 0;

    }


    return (
        parseInt(
            p[0],
            10
        ) * 60 +
        parseInt(
            p[1],
            10
        )
    );

}


/* =========================================================
   CAŁY KURS
   ========================================================= */

function pokazCalyKurs(
    nrKursu
) {

    widokKursuAktywny =
        true;


    aktualizujPrzyciskPowrotu();


    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !rozklad.kierunki ||
        !rozklad.kierunki[
            aktualnyKierunek
        ]
    ) {

        return;

    }


    const kierunek =
        rozklad.kierunki[
            aktualnyKierunek
        ];


    const przystankiK =
        kierunek.przystanki ||
        [];


    const kursPrzystanki =
        [];


    przystankiK.forEach(
        p => {

            const kursy =
                pobierzKursyPrzystanku(
                    p
                );


            const k =
                kursy.find(
                    x =>
                        String(
                            x.numer || ""
                        ) ===
                        String(
                            nrKursu || ""
                        )
                );


            if (k) {

                const isNz =
                    p.naZadanie === true ||
                    p.nz === true ||
                    String(
                        p.typ || ""
                    ).toUpperCase() ===
                        "NŻ" ||
                    (
                        typeof p.nazwa ===
                        "string" &&
                        p.nazwa.includes(
                            "(NŻ)"
                        )
                    );


                kursPrzystanki.push({
                    nazwa:
                        p.nazwa,
                    nr:
                        p.nr,
                    nz:
                        isNz,
                    czas:
                        k.czas
                });

            }

        }
    );


    const kontener =
        document.getElementById(
            "przystanki"
        );


    document.getElementById(
        "typRozkladu"
    ).textContent =
        "Przebieg kursu";


    document.querySelector(
        ".dni"
    ).style.display =
        "none";


    document.getElementById(
        "kalendarz"
    ).style.display =
        "none";


    document.getElementById(
        "warianty-pojemnik"
    ).style.display =
        "none";


    kontener.innerHTML = "";


    if (
        kursPrzystanki.length === 0
    ) {

        kontener.innerHTML =
            `
            <div class="brak-danych">
                Nie znaleziono przebiegu kursu
                ${nrKursu}.
            </div>
            `;

        return;

    }


    let stopIndex = -1;


    if (wybranyPrzystanek) {

        stopIndex =
            kursPrzystanki.findIndex(
                p =>
                    (
                        p.nr &&
                        wybranyPrzystanek.nr &&
                        String(p.nr) ===
                        String(
                            wybranyPrzystanek.nr
                        )
                    ) ||
                    p.nazwa ===
                    wybranyPrzystanek.nazwa
            );

    }


    const currentStopName =
        stopIndex !== -1
            ? kursPrzystanki[
                stopIndex
              ].nazwa
            : kursPrzystanki[0].nazwa;


    const lastStopName =
        kursPrzystanki[
            kursPrzystanki.length - 1
        ].nazwa;


    const widok =
        document.createElement(
            "div"
        );


    widok.className =
        "kurs-widok";


    widok.innerHTML =
        `
        <div class="kurs-naglowek">

            <div class="kurs-tytul">
                ${currentStopName}
                &rarr;
                ${lastStopName}
            </div>

            <div class="kurs-informacja">
                Kurs ${nrKursu}
                |
                Przebieg przez
                ${kursPrzystanki.length}
                przystanków
            </div>

        </div>
        `;


    const lista =
        document.createElement(
            "div"
        );


    lista.className =
        "kurs-lista";


    const startIndex =
        stopIndex !== -1
            ? stopIndex
            : 0;


    const baseTime =
        czasWMinutach(
            kursPrzystanki[
                startIndex
            ].czas
        );


    kursPrzystanki.forEach(
        (el, index) => {

            const isPast =
                stopIndex !== -1 &&
                index < stopIndex;


            const isCurrent =
                stopIndex !== -1 &&
                index === stopIndex;


            const wiersz =
                document.createElement(
                    "div"
                );


            wiersz.className =
                "kurs-przystanek" +
                (
                    isCurrent
                        ? " aktywny"
                        : ""
                );


            let diffText = "";


            if (!isPast) {

                let diff =
                    czasWMinutach(
                        el.czas
                    ) -
                    baseTime;


                if (diff < 0) {

                    diff +=
                        24 * 60;

                }


                diffText =
                    `${diff} min`;

            }


            let strokeColor =
                isPast
                    ? "#cccccc"
                    : (
                        isCurrent
                            ? "#000000"
                            : (
                                index === 0
                                    ? "#000000"
                                    : "#e42313"
                            )
                    );


            let fillColor =
                isPast
                    ? "#cccccc"
                    : (
                        isCurrent
                            ? "#000000"
                            : (
                                index === 0
                                    ? "#000000"
                                    : "#e42313"
                            )
                    );


            let topSegColor =
                isPast ||
                isCurrent
                    ? "#cccccc"
                    : "#000000";


            let botSegColor =
                isPast
                    ? "#cccccc"
                    : "#000000";


            let svgHtml =
                `
                <svg width="40"
                     height="44"
                     style="display:block; overflow:visible;">
                `;


            if (index > 0) {

                svgHtml +=
                    `
                    <line
                        x1="20"
                        y1="0"
                        x2="20"
                        y2="22"
                        stroke="${topSegColor}"
                        stroke-width="2.5"
                    />
                    `;

            }


            if (
                index <
                kursPrzystanki.length - 1
            ) {

                svgHtml +=
                    `
                    <line
                        x1="20"
                        y1="22"
                        x2="20"
                        y2="44"
                        stroke="${botSegColor}"
                        stroke-width="2.5"
                    />
                    `;

            }


            /*
               NŻ = BIAŁY ŚRODEK
            */

            if (
                index === 0 ||
                index ===
                    kursPrzystanki.length - 1
            ) {

                if (el.nz) {

                    svgHtml +=
                        `
                        <rect
                            x="15"
                            y="17"
                            width="10"
                            height="10"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />
                        `;

                } else {

                    svgHtml +=
                        `
                        <rect
                            x="14.5"
                            y="16.5"
                            width="11"
                            height="11"
                            fill="${fillColor}"
                            stroke="none"
                        />
                        `;

                }

            } else {

                if (el.nz) {

                    svgHtml +=
                        `
                        <circle
                            cx="20"
                            cy="22"
                            r="5"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />
                        `;

                } else {

                    svgHtml +=
                        `
                        <circle
                            cx="20"
                            cy="22"
                            r="5.5"
                            fill="${fillColor}"
                            stroke="none"
                        />
                        `;

                }

            }


            svgHtml +=
                "</svg>";


            const textStyling =
                isPast
                    ? "color:#aaaaaa;font-weight:normal;"
                    : (
                        isCurrent
                            ? "color:#000000;font-weight:900;font-size:17px;"
                            : "color:#000000;font-weight:bold;"
                    );


            const timeStyling =
                isPast
                    ? "color:#aaaaaa;font-weight:normal;"
                    : (
                        isCurrent
                            ? "color:#000000;font-weight:900;font-size:17px;"
                            : "color:#000000;font-weight:bold;"
                    );


            const nrStyling =
                isPast
                    ? "color:#cccccc;"
                    : "color:#777777;";


            const relTimeStyling =
                isPast
                    ? "color:#cccccc;"
                    : (
                        isCurrent
                            ? "color:#444444;font-weight:bold;"
                            : "color:#888888;"
                    );


            wiersz.innerHTML =
                `
                <div
                    class="kurs-czas-rel"
                    style="${relTimeStyling}">
                    ${diffText}
                </div>

                <div
                    class="node-wrapper"
                    style="width:40px;">
                    ${svgHtml}
                </div>

                <div
                    class="kurs-nazwa-box"
                    style="${textStyling}">
                    ${el.nazwa}
                </div>

                <div
                    class="kurs-nr"
                    style="${nrStyling}">
                    ${el.nr || ""}
                </div>

                <div
                    class="kurs-czas-abs"
                    style="${timeStyling}">
                    ${el.czas}
                </div>
                `;


            lista.appendChild(
                wiersz
            );

        }
    );


    widok.appendChild(
        lista
    );


    kontener.appendChild(
        widok
    );

}


/* =========================================================
   BŁĄD
   ========================================================= */

function pokazBlad(
    tytul,
    opis
) {

    document.getElementById(
        "numerLinii"
    ).textContent =
        "Błąd";


    document.getElementById(
        "trasa"
    ).textContent =
        "";


    document.getElementById(
        "kierunki"
    ).innerHTML =
        "";


    document.getElementById(
        "typRozkladu"
    ).style.display =
        "none";


    const wp =
        document.getElementById(
            "warianty-pojemnik"
        );


    if (wp) {

        wp.style.display =
            "none";

    }


    document.getElementById(
        "przystanki"
    ).innerHTML =
        `
        <div class="blad">

            <strong>
                ${tytul}
            </strong>

            ${opis}

        </div>
        `;

}


/* =========================================================
   POPSTATE
   ========================================================= */

window.addEventListener(
    "popstate",
    function() {

        const url =
            new URL(
                window.location.href
            );


        const pParam =
            url.searchParams.get(
                "przystanek"
            );


        const kParam =
            url.searchParams.get(
                "kierunek"
            );


        if (
            kParam !== null &&
            !isNaN(
                Number(kParam)
            )
        ) {

            aktualnyKierunek =
                Number(kParam);

        }


        const rozklad =
            znajdzRozklad();


        if (
            pParam &&
            rozklad &&
            rozklad.kierunki &&
            rozklad.kierunki[
                aktualnyKierunek
            ]
        ) {

            const kierunek =
                rozklad.kierunki[
                    aktualnyKierunek
                ];


            wybranyPrzystanek =
                znajdzPrzystanek(
                    kierunek.przystanki || [],
                    pParam
                );


        } else {

            wybranyPrzystanek =
                null;

        }


        widokKursuAktywny =
            false;


        pokazRozklad();

    }
);

</script>
