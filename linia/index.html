        "none";


    kontener.innerHTML =
        "";


    /* =====================================================
       FILTROWANIE KURSÓW DLA DATY
       ===================================================== */

    const przystanekDlaDaty =
        Object.assign(
            {},
            przystanek
        );


    przystanekDlaDaty.kursy =
        filtrujKursyDlaDaty(
            przystanek.kursy || [],
            wybranaData
        );


    /*
     * Jeżeli dany kurs KOŃCZY się na wybranym przystanku,
     * nie pokazujemy go już jako odjazdu z tego przystanku.
     *
     * Kurs zostaje w rozkładzie tylko wtedy, gdy ten sam
     * numer kursu i wariant występują jeszcze na którymś
     * następnym przystanku w tym kierunku.
     */
    const kierunekSurowyDoSprawdzeniaKoncow =
        rozklad.kierunki[
            aktualnyKierunek
        ];


    const kierunekDoSprawdzeniaKoncow =
        przygotujKierunekDlaDaty(
            kierunekSurowyDoSprawdzeniaKoncow,
            wybranaData
        );


    if (
        kierunekDoSprawdzeniaKoncow &&
        Array.isArray(
            kierunekDoSprawdzeniaKoncow.przystanki
        )
    ) {

        let indeksBiezacegoPrzystanku =
            Number(
                wybranyPrzystanekIndex
            );


        if (
            !Number.isInteger(
                indeksBiezacegoPrzystanku
            ) ||
            indeksBiezacegoPrzystanku < 0 ||
            indeksBiezacegoPrzystanku >=
                kierunekDoSprawdzeniaKoncow.przystanki.length
        ) {

            indeksBiezacegoPrzystanku =
                kierunekDoSprawdzeniaKoncow.przystanki.findIndex(
                    p =>
                        kluczPrzystanku(
                            p
                        ) ===
                        kluczPrzystanku(
                            przystanek
                        )
                );
        }


        if (
            indeksBiezacegoPrzystanku !== -1
        ) {

            przystanekDlaDaty.kursy =
                przystanekDlaDaty.kursy.filter(
                    kurs => {

                        const numerKursu =
                            String(
                                kurs.numer ?? ""
                            ).trim();


                        const wariantKursu =
                            pobierzWariant(
                                kurs
                            );


                        /*
                         * Bez numeru kursu nie da się pewnie ustalić,
                         * czy to jest jego przystanek końcowy,
                         * dlatego taki wpis pozostawiamy.
                         */
                        if (!numerKursu) {
                            return true;
                        }


                        for (
                            let i =
                                indeksBiezacegoPrzystanku + 1;
                            i <
                                kierunekDoSprawdzeniaKoncow.przystanki.length;
                            i++
                        ) {

                            const nastepnyPrzystanek =
                                kierunekDoSprawdzeniaKoncow.przystanki[
                                    i
                                ];


                            const kursDalej =
                                filtrujKursyDlaDaty(
                                    nastepnyPrzystanek.kursy || [],
                                    wybranaData
                                ).some(
                                    k =>
                                        String(
                                            k.numer ?? ""
                                        ).trim() ===
                                        numerKursu
                                        &&
                                        pobierzWariant(
                                            k
                                        ) ===
                                        wariantKursu
                                        &&
                                        czasNaMinuty(
                                            k.czas
                                        ) !== null
                                );


                            if (
                                kursDalej
                            ) {
                                return true;
                            }
                        }


                        /*
                         * Nie ma już następnego przystanku tego kursu:
                         * wybrany przystanek jest jego końcem,
                         * więc nie pokazujemy tej godziny jako odjazdu.
                         */
                        return false;
                    }
                );
        }
    }


    const naglowek =
        document.createElement(
            "div"
        );


    naglowek.className =
        "naglowek-przystanku-widok";


    naglowek.innerHTML =
        `<div class="nazwa">
            ${przystanek.nazwa}
        </div>

        <div class="numer">
            ${
                przystanek.nr
                    ? przystanek.nr
                    : ""
            }
        </div>`;


    kontener.appendChild(
        naglowek
    );


    const blok =
        document.createElement(
            "div"
        );


    blok.className =
        "przystanek";


    const godziny =
        document.createElement(
            "div"
        );


    godziny.className =
        "godziny";


    /*
     * Analizę wariantów deklarujemy w zakresie całej funkcji,
     * ponieważ korzystają z niej zarówno minuty, jak i legenda.
     */
    const kierunek =
        rozklad.kierunki[
            aktualnyKierunek
        ];


    const kierunekDlaDaty =
        przygotujKierunekDlaDaty(
            kierunek,
            wybranaData
        );


    const analizaWariantow =
        zbudujAnalizeWariantowFWTP(
            kierunekDlaDaty
        );


    /*
     * Jeżeli eksporter ma już poprawny opis "kurs przez ...",
     * zachowujemy go jako zabezpieczenie. Nie przywracamy
     * tekstów typu "bez podjazdów".
     *
     * Wariant podstawowy nadal pozostaje bez oznaczenia.
     */
    if (
        analizaWariantow &&
        analizaWariantow.warianty &&
        Array.isArray(
            rozklad.warianty
        )
    ) {

        rozklad.warianty.forEach(
            wariant => {

                const litera =
                    String(
                        wariant?.litera ||
                        ""
                    )
                        .trim()
                        .toUpperCase();


                const opisJSON =
                    String(
                        wariant?.opis ||
                        ""
                    ).trim();


                if (
                    !litera ||
                    !opisJSON ||
                    !/^kurs\s+przez\b/i.test(
                        opisJSON
                    )
                ) {

                    return;
                }


                const daneAnalizy =
                    analizaWariantow.warianty.get(
                        litera
                    );


                if (
                    !daneAnalizy ||
                    daneAnalizy.typ ===
                        "podstawowy"
                ) {

                    return;
                }


                /*
                 * Jeżeli analiza sama rozpoznała skrócenie
                 * lub wydłużenie, taki opis ma pierwszeństwo.
                 */
                if (
                    daneAnalizy.opis &&
                    (
                        daneAnalizy.typ === "skrocony" ||
                        daneAnalizy.typ === "wydluzony" ||
                        daneAnalizy.typ === "przez"
                    )
                ) {

                    return;
                }


                daneAnalizy.typ =
                    "przez";


                daneAnalizy.opis =
                    opisJSON;


                daneAnalizy.pokazOznaczenie =
                    true;
            }
        );
    }



    /*
     * =====================================================
     * OZNACZENIA WARIANTÓW W TABELI GODZIN
     * =====================================================
     *
     * WAŻNE:
     * geometria trasy i wybór osi głównej mogą zależeć od
     * liczby kursów. Nie możemy jednak używać tego samego
     * wyboru do decydowania, czy litera ma być widoczna.
     *
     * To powodowało błąd linii 110:
     * w jednym kierunku analiza uznawała inny wariant za
     * "podstawowy", więc litery i legenda znikały.
     *
     * W tabeli godzin obowiązuje stabilna zasada:
     *
     * 1. jeżeli istnieje kilka rzeczywistych wariantów,
     *    warianty inne niż A mogą mieć literę niezależnie
     *    od tego, który przebieg geometria wybrała jako główny;
     *
     * 2. A pozostaje ukryte przy 1-3 wariantach
     *    W AKTUALNYM KIERUNKU;
     *
     * 3. przy co najmniej 4 wariantach W AKTUALNYM KIERUNKU
     *    pokazujemy również A
     *    (zgodnie z wcześniejszą zasadą FWTP);
     *
     * 4. opis bierzemy najpierw z analizy, a jeśli analiza
     *    go nie ma — bezpośrednio z rozklad.warianty.
     *
     * Ta zmiana dotyczy WYŁĄCZNIE literek i legendy.
     * Nie zmienia geometrii 110, 126, 131, 332, 338 itd.
     */

    const definicjeWariantowRozkladu =
        Array.isArray(
            rozklad.warianty
        )
            ? rozklad.warianty
            : [];


    /*
     * Warianty widoczne przy minutach liczymy WYŁĄCZNIE
     * dla aktualnego kierunku.
     *
     * To jest ważne przy zasadzie:
     * - 1-3 warianty w tym kierunku -> A ukryte,
     * - 4 lub więcej wariantów w tym kierunku -> A widoczne.
     *
     * Nie liczymy wariantów występujących tylko w przeciwnym
     * kierunku.
     */
    const literyWariantowKierunku =
        [
            ...new Set(
                zbierzWariantyDlaKierunku(
                    kierunekDlaDaty
                )
                    .map(
                        litera =>
                            String(
                                litera || ""
                            )
                                .trim()
                                .toUpperCase()
                    )
                    .filter(
                        Boolean
                    )
            )
        ];


    const liczbaWariantowKierunku =
        literyWariantowKierunku.length;


    function pobierzDefinicjeWariantuZRozkladu(
        litera
    ) {

        const szukana =
            String(
                litera || ""
            )
                .trim()
                .toUpperCase();


        if (!szukana) {
            return null;
        }


        return (
            definicjeWariantowRozkladu.find(
                wariant =>
                    String(
                        wariant?.litera ||
                        ""
                    )
                        .trim()
                        .toUpperCase() ===
                    szukana
            ) ||
            null
        );
    }


    function pobierzOpisWariantuDoTabeli(
        litera
    ) {

        const znak =
            String(
                litera || ""
            )
                .trim()
                .toUpperCase();


        if (!znak) {
            return "";
        }


        /*
         * NAJWAŻNIEJSZA ZASADA:
         *
         * Jeżeli opis wariantu istnieje już w JSON-ie,
         * wyświetlamy DOKŁADNIE ten opis.
         *
         * Nie wolno go zastępować opisem wyliczonym ponownie
         * przez analizę przebiegu na stronie.
         *
         * Przykład 126:
         *
         * JSON:
         * C = "kurs przez PŁYTOWA, KUPIECKA i POLFA"
         *
         * Strona wcześniej najpierw pytała analizęWariantow
         * i dopiero wtedy JSON. Analiza zwracała np.
         * "kurs przez POLFA", więc poprawny opis z JSON-u
         * nigdy nie był używany.
         *
         * Od teraz:
         * 1. opis z rozklad.warianty,
         * 2. analiza tylko jako fallback dla starych JSON-ów
         *    bez pola opis.
         */
        const definicja =
            pobierzDefinicjeWariantuZRozkladu(
                znak
            );


        const opisZJSON =
            definicja
                ? String(
                    definicja.opis ||
                    ""
                  ).trim()
                : "";


        if (opisZJSON) {
            return opisZJSON;
        }


        return String(
            pobierzOpisWariantuFWTP(
                analizaWariantow,
                znak
            ) || ""
        ).trim();
    }


    function czyPokazacWariantWTabeli(
        litera
    ) {

        const znak =
            String(
                litera || ""
            )
                .trim()
                .toUpperCase();


        if (!znak) {
            return false;
        }


        /*
         * Jeżeli JSON rozkładu zawiera kilka wariantów,
         * nie uzależniamy oznaczenia B/C/D... od tego,
         * który z nich analiza geometrii uznała za główny.
         */
        if (
            liczbaWariantowKierunku > 1 &&
            literyWariantowKierunku.includes(
                znak
            )
        ) {

            /*
             * A jest bazą i zgodnie z wcześniejszą zasadą
             * pozostaje bez literki przy 1-3 wariantach.
             */
            if (
                znak === "A" &&
                liczbaWariantowKierunku < 4
            ) {

                return false;
            }


            /*
             * Dla B/C/D... wystarczy, że wariant rzeczywiście
             * istnieje w definicji rozkładu.
             *
             * Opis może pochodzić z JSON albo z analizy.
             */
            return true;
        }


        /*
         * Fallback dla starszych / nietypowych JSON-ów.
         */
        return czyPokazacOznaczenieWariantuFWTP(
            analizaWariantow,
            znak
        );
    }


    if (
        !przystanekDlaDaty.kursy ||
        przystanekDlaDaty.kursy.length === 0
    ) {

        godziny.innerHTML =
            '<div class="brak-godzin">' +
            'Brak odjazdów dla wybranego dnia' +
            '</div>';

    } else {

        /*
         * =====================================================
         * GODZINY NOCNE 24 / 25 / 26...
         * =====================================================
         *
         * Ten widok jest budowany z pola "kursy", a nie z pola
         * "godziny" z JSON-u. Dlatego 25:xx, 26:xx itd. trzeba
         * normalizować także tutaj.
         *
         * 24 -> 00
         * 25 -> 01
         * 26 -> 02
         * 27 -> 03
         * itd.
         *
         * Godziny równoważne są łączone:
         * 00 i 24 -> jeden wiersz 00
         * 01 i 25 -> jeden wiersz 01
         * 02 i 26 -> jeden wiersz 02
         * itd.
         * =====================================================
         */

        const grupyGodzin =
            new Map();


        przystanekDlaDaty.kursy.forEach(
            k => {

                const dop =
                    String(
                        k.czas || ""
                    )
                        .trim()
                        .match(
                            /^(\d{1,2}):(\d{2})$/
                        );


                if (!dop) {
                    return;
                }


                const godzinaSurowa =
                    Number(
                        dop[1]
                    );


                if (
                    !Number.isFinite(
                        godzinaSurowa
                    )
                ) {
                    return;
                }


                const godzinaNormalna =
                    (
                        (
                            godzinaSurowa % 24
                        ) +
                        24
                    ) % 24;


                const kluczGodziny =
                    String(
                        godzinaNormalna
                    ).padStart(
                        2,
                        "0"
                    );


                if (
                    !grupyGodzin.has(
                        kluczGodziny
                    )
                ) {

                    grupyGodzin.set(
                        kluczGodziny,
                        []
                    );
                }


                grupyGodzin.get(
                    kluczGodziny
                ).push(
                    {
                        kurs: k,
                        minuta: dop[2]
                    }
                );
            }
        );


        grupyGodzin.forEach(
            (
                pozycjeGodziny,
                godzinaDoPokazania
            ) => {

                const wiersz =
                    document.createElement(
                        "div"
                    );


                wiersz.className =
                    "wiersz-godziny";


                wiersz.innerHTML =
                    `<div class="kolumna-godzina">
                        ${godzinaDoPokazania}
                    </div>`;


                const minutyWiersza =
                    document.createElement(
                        "div"
                    );


                minutyWiersza.className =
                    "minuty-w-godzinie";


                wiersz.appendChild(
                    minutyWiersza
                );


                godziny.appendChild(
                    wiersz
                );


                pozycjeGodziny.forEach(
                    pozycja => {

                        const k =
                            pozycja.kurs;


                        const m =
                            pozycja.minuta;


                        const kol =
                            document.createElement(
                                "div"
                            );


                        kol.className =
                            "kolumna-minuta";


                        const litera =
                            pobierzWariant(
                                k
                            );


                /*
                 * Literę pokazujemy WYŁĄCZNIE wtedy, gdy wariant
                 * oznacza rzeczywistą zmianę krańca:
                 * - kurs skrócony,
                 * - kurs wydłużony.
                 *
                 * Główny przebieg oraz warianty jadące do tego
                 * samego krańca są bez liter.
                 */
                let literaDoPokazania =
                    czyPokazacWariantWTabeli(
                        litera
                    )
                        ? litera
                        : "";


                const pokazWariant =
                    literaDoPokazania !== "";


                kol.innerHTML =
                    `<span class="minuta-z-wariantem">

                        <span class="minuta">
                            ${m}
                        </span>

                        ${
                            pokazWariant
                                ? `<span class="wariant-minuty">
                                    ${literaDoPokazania}
                                  </span>`
                                : ""
                        }

                    </span>`;


                if (
                    k.numer !== undefined &&
                    k.numer !== null
                ) {

                    kol.title =
                        "Zobacz przebieg kursu " +
                        k.numer +
                        (
                            literaDoPokazania
                                ? " (" +
                                  literaDoPokazania +
                                  ")"
                                : ""
                        );


                    kol.onclick =
                        () =>
                            pokazCalyKurs(
                                k.numer,
                                litera
                            );
                }


                        minutyWiersza.appendChild(
                            kol
                        );
                    }
                );
            }
        );
    }


    blok.appendChild(
        godziny
    );


    /* =====================================================
       LEGENDA WARIANTÓW
       =====================================================

       Pokazujemy tylko oznaczenia mające znaczenie dla pasażera:
       kurs skrócony / kurs wydłużony.
       ===================================================== */

    const uzyteWarianty =
        new Set();


    if (
        przystanekDlaDaty.kursy
    ) {

        przystanekDlaDaty.kursy.forEach(
            k => {

                const w =
                    pobierzWariant(
                        k
                    );


                if (
                    w &&
                    czyPokazacWariantWTabeli(
                        w
                    )
                ) {

                    uzyteWarianty.add(
                        w
                    );
                }
            }
        );
    }


    if (
        uzyteWarianty.size > 0
    ) {

        const leg =
            document.createElement(
                "div"
            );


        leg.className =
            "legenda-wariantow";


        let legList =
            '<div class="legenda-lista">';


        uzyteWarianty.forEach(
            litera => {

                const opis =
                    pobierzOpisWariantuDoTabeli(
                        litera
                    );


                if (!opis) {
                    return;
                }


                legList +=
                    `<div class="legenda-element">

                        <span class="legenda-litera">
                            ${litera}
                        </span>

                        <span class="legenda-separator">
                            -
                        </span>

                        <span class="legenda-opis">
                            ${opis}
                        </span>

                    </div>`;
            }
        );


        legList +=
            "</div>";


        leg.innerHTML =
            legList;


        blok.appendChild(
            leg
        );
    }

    kontener.appendChild(
        blok
    );


    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    window.scrollTo({
                        top: 0,
                        left: 0,
                        behavior: "auto"
                    });


                    document.documentElement.scrollTop =
                        0;


                    document.body.scrollTop =
                        0;
                }
            );
        }
    );
}


/* =========================================================
   CAŁY KURS
   ========================================================= */

function pokazCalyKurs(
    nrKursu,
    wariantKursu = null,
    zapiszHistorie = true
) {

    widokKursuAktywny =
        true;


    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !rozklad.kierunki ||
        !rozklad.kierunki[
            aktualnyKierunek
        ]
    )
        return;


    if (zapiszHistorie) {

        aktualizujHistorieKursuURL(
            nrKursu,
            wariantKursu
        );
    }


    /*
     * W widoku konkretnego kursu zachowujemy pełną listę przystanków
     * kierunku. Dzięki temu przy kursie skróconym przystanki znajdujące
     * się za jego końcówką nadal są widoczne, ale jako nieobsługiwane
     * (szare). TECH oraz WS bezpośrednio po WYS nadal są ukrywane.
     */
    const kierunek =
        rozklad.kierunki[
            aktualnyKierunek
        ];


    const przystankiK =
        kierunek
            ? filtrujPrzystankiSpecjalneFWTP(
                kierunek.przystanki || []
              )
            : [];


    const kursPrzystanki =
        [];


    const szukanyNumer =
        String(
            nrKursu
        ).trim();


    const szukanyWariant =
        String(
            wariantKursu ||
            ""
        )
            .trim()
            .toUpperCase();


    /*
     * W widoku konkretnego kursu pokazujemy WYŁĄCZNIE przystanki,
     * przez które ten kurs rzeczywiście jedzie.
     *
     * Jeżeli na pełnej trasie istnieją przystanki należące do
     * innego wariantu, ale wybrany kurs ich nie obsługuje,
     * nie dodajemy ich do kursPrzystanki w ogóle.
     *
     * Dzięki temu w przebiegu kursu nie ma już szarych:
     * - przystanków,
     * - kropek,
     * - odcinków linii
     * należących do niewybranego wariantu.
     */
    const dopasowaniaKursu =
        przystankiK.map(
            p =>
                (
                    p.kursy ||
                    []
                ).find(
                    x => {

                        const numer =
                            String(
                                x.numer
                            ).trim();


                        const wariant =
                            pobierzWariant(
                                x
                            );


                        if (
                            numer !==
                            szukanyNumer
                        ) {

                            return false;
                        }


                        if (
                            wariantKursu !== null &&
                            wariant !==
                            szukanyWariant
                        ) {

                            return false;
                        }


                        return (
                            czasNaMinuty(
                                x.czas
                            ) !== null
                        );
                    }
                ) || null
        );


    przystankiK.forEach(
        (
            p,
            originalIndex
        ) => {

            const k =
                dopasowaniaKursu[
                    originalIndex
                ];


            /*
             * Brak tego konkretnego kursu na przystanku =
             * przystanek należy do innego przebiegu/wariantu.
             * W przebiegu wybranego kursu całkowicie go pomijamy.
             */
            if (!k) {
                return;
            }


            kursPrzystanki.push(
                {
                    nazwa:
                        p.nazwa,

                    nr:
                        p.nr,

                    nz:
                        czyPrzystanekNaZadanie(
                            p
                        ),

                    czas:
                        k.czas,

                    wariant:
                        pobierzWariant(
                            k
                        ),

                    aktywny:
                        true,

                    przystanek:
                        p,

                    originalIndex:
                        originalIndex
                }
            );
        }
    );


    const kontener =
        document.getElementById(
            "przystanki"
        );


    document.getElementById(
        "typRozkładu"
    ).style.display =
        "block";


    document.getElementById(
        "typRozkładu"
    ).textContent =
        "Przebieg kursu";


    document.querySelector(
        ".dni"
    ).style.display =
        "none";


    document.getElementById(
        "kalendarz"
    ).style.display =
        "none";


    document.getElementById(
        "warianty-pojemnik"
    ).style.display =
        "none";


    kontener.innerHTML =
        "";


    /* =====================================================
       AKTUALNY PRZYSTANEK
       ===================================================== */

    let stopIndex =
        -1;


    if (
        wybranyPrzystanekIndex !== null
    ) {

        const originalIndex =
            Number(
                wybranyPrzystanekIndex
            );


        stopIndex =
            kursPrzystanki.findIndex(
                p =>
                    p.originalIndex ===
                    originalIndex
            );
    }


    if (
        stopIndex === -1 &&
        wybranyPrzystanek
    ) {

        stopIndex =
            kursPrzystanki.findIndex(
                p =>
                    String(
                        p.nr || ""
                    ) ===
                    String(
                        wybranyPrzystanek.nr ||
                        ""
                    )
                    &&
                    String(
                        p.nazwa || ""
                    ) ===
                    String(
                        wybranyPrzystanek.nazwa ||
                        ""
                    )
            );
    }


    const currentStopName =
        stopIndex !== -1
            ? kursPrzystanki[
                stopIndex
            ].nazwa
            : (
                kursPrzystanki.length
                    ? kursPrzystanki[0].nazwa
                    : ""
            );


    const ostatniObslugiwanyPrzystanek =
        [
            ...kursPrzystanki
        ]
            .reverse()
            .find(
                p =>
                    p.aktywny === true
            );


    const lastStopName =
        ostatniObslugiwanyPrzystanek
            ? ostatniObslugiwanyPrzystanek.nazwa
            : "";


    const widok =
        document.createElement(
            "div"
        );


    widok.className =
        "kurs-widok";


    widok.innerHTML =
        `<div class="kurs-naglowek">

            <div class="kurs-tytul">
                ${currentStopName}
                &rarr;
                ${lastStopName}
            </div>

            <div class="kurs-informacja">

                Kurs ${nrKursu}

                ${
                    szukanyWariant
                        ? " | Wariant " +
                          szukanyWariant
                        : ""
                }

            </div>

        </div>`;


    const lista =
        document.createElement(
            "div"
        );


    lista.className =
        "kurs-lista";


    const czasWMinutach =
        cz => {

            const minuty =
                czasNaMinuty(
                    cz
                );


            return minuty === null
                ? 0
                : minuty;
        };


    const startIndex =
        stopIndex !== -1
            ? stopIndex
            : 0;


    const baseTime =
        kursPrzystanki.length
            ? czasWMinutach(
                kursPrzystanki[
                    startIndex
                ].czas
            )
            : 0;


    const aktywneIndeksy =
        kursPrzystanki
            .map(
                (el, index) =>
                    el.aktywny
                        ? index
                        : -1
            )
            .filter(
                index => index !== -1
            );


    const pierwszyAktywnyIndex =
        aktywneIndeksy.length
            ? aktywneIndeksy[0]
            : -1;


    const ostatniAktywnyIndex =
        aktywneIndeksy.length
            ? aktywneIndeksy[
                aktywneIndeksy.length - 1
            ]
            : -1;


    const czasDoPokazania =
        czas => {

            const tekst =
                String(
                    czas || ""
                ).trim();


            const m =
                tekst.match(
                    /^(\d{1,2}):(\d{2})$/
                );


            if (!m) {

                return tekst;
            }


            const godzina =
                Number(
                    m[1]
                );


            return (
                (
                    godzina === 24
                        ? "00"
                        : String(godzina).padStart(2, "0")
                ) +
                ":" +
                m[2]
            );
        };


    kursPrzystanki.forEach(
        (
            el,
            index
        ) => {

            const isPast =
                stopIndex !== -1 &&
                index < stopIndex;


            const isCurrent =
                stopIndex !== -1 &&
                index === stopIndex;


            const nodeActive =
                el.aktywny === true;


            const isFirst =
                index ===
                pierwszyAktywnyIndex;


            const isLast =
                index ===
                ostatniAktywnyIndex;


            /*
             * Kwadratem oznaczamy:
             * - początek konkretnego kursu,
             * - rzeczywisty koniec konkretnego kursu,
             * - oraz ostatni przystanek pełnej trasy.
             *
             * Jeżeli kurs jest skrócony, ostatni przystanek pełnej
             * trasy jest nieaktywny, więc kwadrat będzie szary.
             */
            const isLastOnFullRoute =
                index ===
                kursPrzystanki.length - 1;


            const shouldBeSquare =
                isFirst ||
                isLast ||
                isLastOnFullRoute;


            const wiersz =
                document.createElement(
                    "div"
                );


            wiersz.className =
                "kurs-przystanek" +
                (
                    isCurrent
                        ? " aktywny"
                        : ""
                ) +
                (
                    !nodeActive
                        ? " nieaktywny"
                        : ""
                );


            let diffText =
                "";


            if (
                !isPast &&
                nodeActive
            ) {

                let diff =
                    czasWMinutach(
                        el.czas
                    ) -
                    baseTime;


                if (
                    diff < 0
                ) {

                    diff +=
                        24 * 60;
                }


                diffText =
                    `${diff} min`;
            }


            /*
             * Kolor w przebiegu kursu zależy od tego,
             * czy TEN KONKRETNY KURS rzeczywiście obsługuje
             * dany przystanek, a nie od tego, czy przystanek
             * jest już za nami.
             *
             * Dzięki temu przejechane przystanki pozostają
             * czerwone/czarne tak jak na liście przystanków.
             * Szary jest wyłącznie przystanek pomijany przez
             * wybrany wariant kursu.
             */
            const strokeColor =
                !nodeActive
                    ? "#cccccc"
                    : (
                        isFirst
                            ? "#000000"
                            : "#e42313"
                    );


            const fillColor =
                !nodeActive
                    ? "#cccccc"
                    : (
                        isFirst
                            ? "#000000"
                            : "#e42313"
                    );


            const poprzedniAktywny =
                index > 0
                    ? kursPrzystanki[
                        index - 1
                    ].aktywny === true
                    : false;


            const nastepnyAktywny =
                index <
                kursPrzystanki.length - 1
                    ? kursPrzystanki[
                        index + 1
                    ].aktywny === true
                    : false;


            const topSegColor =
                nodeActive &&
                poprzedniAktywny
                    ? "#000000"
                    : "#cccccc";


            const botSegColor =
                nodeActive &&
                nastepnyAktywny
                    ? "#000000"
                    : "#cccccc";


            let svgHtml =
                `<svg
                    width="40"
                    height="44"
                    style="display:block; overflow:visible;"
                >`;


            if (
                index > 0
            ) {

                svgHtml +=
                    `<line
                        x1="20"
                        y1="0"
                        x2="20"
                        y2="22"
                        stroke="${topSegColor}"
                        stroke-width="2.5"
                    />`;
            }


            if (
                index <
                kursPrzystanki.length - 1
            ) {

                svgHtml +=
                    `<line
                        x1="20"
                        y1="22"
                        x2="20"
                        y2="44"
                        stroke="${botSegColor}"
                        stroke-width="2.5"
                    />`;
            }


            if (
                shouldBeSquare
            ) {

                if (el.nz) {

                    svgHtml +=
                        `<rect
                            x="13.25"
                            y="15.25"
                            width="13.5"
                            height="13.5"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    svgHtml +=
                        `<rect
                            x="12"
                            y="14"
                            width="16"
                            height="16"
                            fill="${fillColor}"
                            stroke="none"
                        />`;
                }

            } else {

                if (el.nz) {

                    svgHtml +=
                        `<circle
                            cx="20"
                            cy="22"
                            r="6.75"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    svgHtml +=
                        `<circle
                            cx="20"
                            cy="22"
                            r="8"
                            fill="${fillColor}"
                            stroke="none"
                        />`;
                }
            }


            svgHtml +=
                "</svg>";


            /*
             * Nieobsługiwane przystanki kursu skróconego:
             * - nazwa szara i bez pogrubienia,
             * - numer jeszcze bledszy i bez pogrubienia.
             *
             * Te style są ustawiane tutaj, ponieważ elementy mają
             * style inline i sam CSS nie mógł ich wcześniej nadpisać.
             */
            const textStyling =
                !nodeActive
                    ? "color:#999999; font-weight:400;"
                    : (
                        isPast
                            ? "color:#aaaaaa; font-weight:600;"
                            : (
                                isCurrent
                                    ? "color:#000000; font-weight:700;"
                                    : "color:#000000; font-weight:600;"
                            )
                    );


            const timeStyling =
                isPast
                    ? "color:#aaaaaa; font-weight:600;"
                    : (
                        isCurrent
                            ? "color:#000000; font-weight:700;"
                            : "color:#000000; font-weight:600;"
                    );


            const nrStyling =
                !nodeActive
                    ? "color:#cfcfcf; font-weight:400;"
                    : (
                        isPast
                            ? "color:#cccccc;"
                            : "color:#777777;"
                    );


            const relTimeStyling =
                isPast
                    ? "color:#cccccc;"
                    : (
                        isCurrent
                            ? "color:#444444; font-weight:600;"
                            : "color:#888888;"
                    );


            wiersz.innerHTML =
                `
                <div
                    class="kurs-czas-rel"
                    style="${relTimeStyling}"
                >
                    ${diffText}
                </div>

                <div
                    class="kurs-czas-abs"
                    style="${timeStyling}"
                >
                    ${nodeActive ? czasDoPokazania(el.czas) : ""}
                </div>

                <div
                    class="node-wrapper"
                    style="width:40px;"
                >
                    ${svgHtml}
                </div>

                <div
                    class="kurs-nazwa-box"
                    style="${textStyling}"
                >
                    ${el.nazwa}
                </div>

                <div
                    class="kurs-nr"
                    style="${nrStyling}"
                >
                    ${el.nr || ""}
                </div>
                `;


            const kliknijPrzystanek =
                () => {

                    if (!el.przystanek)
                        return;

                    wybierzPrzystanek(
                        el.przystanek,
                        el.originalIndex
                    );
                };


            const nazwaKlik =
                wiersz.querySelector(
                    ".kurs-nazwa-box"
                );

            const nrKlik =
                wiersz.querySelector(
                    ".kurs-nr"
                );


            const wlaczHoverPrzystanku =
                () => {
                    wiersz.classList.add(
                        "hover-przystanek"
                    );
                };

            const wylaczHoverPrzystanku =
                () => {
                    wiersz.classList.remove(
                        "hover-przystanek"
                    );
                };


            if (nazwaKlik) {
                nazwaKlik.onclick =
                    kliknijPrzystanek;

                nazwaKlik.onmouseenter =
                    wlaczHoverPrzystanku;

                nazwaKlik.onmouseleave =
                    wylaczHoverPrzystanku;
            }

            if (nrKlik) {
                nrKlik.onclick =
                    kliknijPrzystanek;

                nrKlik.onmouseenter =
                    wlaczHoverPrzystanku;

                nrKlik.onmouseleave =
                    wylaczHoverPrzystanku;
            }


            lista.appendChild(
                wiersz
            );
        }
    );


    widok.appendChild(
        lista
    );


    kontener.appendChild(
        widok
    );
}

function pokazBlad(
    tytul,
    opis
) {

    document.getElementById(
        "numerLinii"
    ).textContent =
        "Błąd";


    document.getElementById(
        "trasa"
    ).textContent =
        "";


    document.getElementById(
        "kierunki"
    ).innerHTML =
        "";


    document.getElementById(
        "typRozkładu"
    ).style.display =
        "none";


    const wp =
        document.getElementById(
            "warianty-pojemnik"
        );


    if (wp)
        wp.style.display =
            "none";


    document.getElementById(
        "przystanki"
    ).innerHTML =
        '<div class="blad">' +
            '<strong>' +
                tytul +
            '</strong>' +
            opis +
        '</div>';
}


/* =========================================================
   HISTORIA PRZEGLĄDARKI
   ========================================================= */

window.addEventListener(
    "popstate",
    function() {

        const url =
            new URL(
                window.location.href
            );


        const pParam =
            url.searchParams.get(
                "przystanek"
            );


        const kParam =
            url.searchParams.get(
                "kierunek"
            );


        const kursParam =
            url.searchParams.get(
                "kurs"
            );


        const wariantKursuParam =
            url.searchParams.get(
                "wariantKursu"
            );


        const wariantParam =
            url.searchParams.get(
                "wariant"
            );


        if (
            wariantParam !== null &&
            String(
                wariantParam
            ).trim() !== ""
        ) {

            aktualnyWariant =
                String(
                    wariantParam
                )
                    .trim()
                    .toUpperCase();

        } else {

            /*
             * Brak parametru oznacza widok domyślny.
             * pokazRozklad() ustawi wtedy wariant bazowy,
             * najczęściej A.
             */
            aktualnyWariant =
                null;
        }


        if (
            kParam !== null &&
            !isNaN(
                Number(kParam)
            )
        ) {

            aktualnyKierunek =
                Number(
                    kParam
                );
        }


        const rozklad =
            znajdzRozklad();


        if (
            pParam &&
            rozklad &&
            rozklad.kierunki &&
            rozklad.kierunki[
                aktualnyKierunek
            ]
        ) {

            const kierunek =
                rozklad.kierunki[
                    aktualnyKierunek
                ];


            const przystanki =
                kierunek.przystanki ||
                [];


            const p =
                znajdzPrzystanek(
                    przystanki,
                    pParam
                );


            if (p) {

                const index =
                    przystanki.indexOf(
                        p
                    );


                ustawWybranyPrzystanek(
                    p,
                    index
                );

            } else {

                ustawWybranyPrzystanek(
                    null
                );
            }

        } else {

            ustawWybranyPrzystanek(
                null
            );
        }


        widokKursuAktywny =
            false;


        pokazRozklad();


        if (
            kursParam !== null &&
            String(kursParam).trim() !== ""
        ) {

            pokazCalyKurs(
                kursParam,
                wariantKursuParam !== null
                    ? wariantKursuParam
                    : null,
                false
            );
        }
    }
);

</script>
