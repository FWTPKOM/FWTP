                                    lokalnaLitera
                                ) ||
                            lokalnaLitera;


                        nowyKurs.wariant =
                            kanonicznaLitera;


                        nowyKurs.uwagi =
                            String(
                                kurs.uwagi || ""
                            )
                                .trim()
                                .toUpperCase();


                        wszystkieKursy.push(
                            nowyKurs
                        );
                    }
                );


                /*
                 * ------------------------------------------------
                 * DODATKOWE ROZKŁADY
                 * ------------------------------------------------
                 *
                 * Szukamy tego samego przystanku po numerze/nazwie.
                 *
                 * Jeżeli np. D i C mają wspólny przystanek,
                 * możemy do niego dołączyć kursy.
                 *
                 * Jeżeli przystanek występuje tylko w C,
                 * ale nie ma go w bazowej trasie D,
                 * nie zostanie dodany do D.
                 */

                informacjeORozkladach.forEach(
                    info => {

                        if (
                            info ===
                            najlepszyRozklad
                        ) {
                            return;
                        }


                        const rozklad =
                            info.rozklad;


                        if (
                            !Array.isArray(
                                rozklad.kierunki
                            )
                        ) {
                            return;
                        }


                        const kierunek =
                            rozklad.kierunki[
                                kierunekIndex
                            ];


                        if (
                            !kierunek ||
                            !Array.isArray(
                                kierunek.przystanki
                            )
                        ) {
                            return;
                        }


                        const odpowiadajacy =
                            kierunek.przystanki.find(
                                p =>
                                    kluczPrzystanku(
                                        p
                                    ) === klucz
                            );


                        if (
                            !odpowiadajacy
                        ) {
                            return;
                        }


                        const kursy =
                            filtrujKursyDlaDaty(
                                odpowiadajacy.kursy || [],
                                wybranaData
                            );


                        kursy.forEach(
                            kurs => {

                                if (!kurs)
                                    return;


                                const nowyKurs =
                                    Object.assign(
                                        {},
                                        kurs
                                    );


                                const lokalnaLitera =
                                    pobierzWariant(
                                        kurs
                                    );


                                const kanonicznaLitera =
                                    info
                                        .mapaWariantow
                                        .get(
                                            lokalnaLitera
                                        ) ||
                                    lokalnaLitera;


                                nowyKurs.wariant =
                                    kanonicznaLitera;


                                nowyKurs.uwagi =
                                    String(
                                        kurs.uwagi || ""
                                    )
                                        .trim()
                                        .toUpperCase();


                                wszystkieKursy.push(
                                    nowyKurs
                                );
                            }
                        );
                    }
                );


                /*
                 * ------------------------------------------------
                 * USUWANIE DUPLIKATÓW KURSÓW
                 * ------------------------------------------------
                 */

                const mapaKursow =
                    new Map();


                wszystkieKursy.forEach(
                    kurs => {

                        const numer =
                            String(
                                kurs.numer ||
                                ""
                            ).trim();


                        const czas =
                            String(
                                kurs.czas ||
                                ""
                            ).trim();


                        const uwagi =
                            String(
                                kurs.uwagi ||
                                ""
                            )
                                .trim()
                                .toUpperCase();


                        const wariant =
                            pobierzWariant(
                                kurs
                            );


                        const kluczKursu =
                            numer +
                            "||" +
                            czas +
                            "||" +
                            uwagi +
                            "||" +
                            wariant;


                        if (
                            !mapaKursow.has(
                                kluczKursu
                            )
                        ) {

                            mapaKursow.set(
                                kluczKursu,
                                Object.assign(
                                    {},
                                    kurs,
                                    {
                                        uwagi:
                                            uwagi,

                                        wariant:
                                            wariant
                                    }
                                )
                            );
                        }
                    }
                );


                const finalneKursy =
                    Array.from(
                        mapaKursow.values()
                    );


                /*
                 * ------------------------------------------------
                 * JEŻELI PO WSZYSTKIM NIE MA KURSU,
                 * PRZYSTANEK NIE MOŻE SIĘ POJAWIĆ.
                 * ------------------------------------------------
                 */

                if (
                    finalneKursy.length === 0
                ) {

                    return;
                }


                const nowyPrzystanek =
                    Object.assign(
                        {},
                        baza
                    );


                nowyPrzystanek.kursy =
                    finalneKursy;


                /*
                 * ------------------------------------------------
                 * BUDOWANIE GODZIN
                 * ------------------------------------------------
                 */

                const mapaGodzin =
                    new Map();


                finalneKursy.forEach(
                    kurs => {

                        const czas =
                            String(
                                kurs.czas ||
                                ""
                            ).trim();


                        const dop =
                            czas.match(
                                /^(\d{1,2}):(\d{2})$/
                            );


                        if (!dop)
                            return;


                        const godzina =
                            dop[1].padStart(
                                2,
                                "0"
                            );


                        const minuta =
                            dop[2];


                        if (
                            !mapaGodzin.has(
                                godzina
                            )
                        ) {

                            mapaGodzin.set(
                                godzina,
                                []
                            );
                        }


                        mapaGodzin
                            .get(
                                godzina
                            )
                            .push(
                                {
                                    minuta:
                                        minuta,

                                    wariant:
                                        pobierzWariant(
                                            kurs
                                        ),

                                    brygada:
                                        kurs.brygada ||
                                        "",

                                    uwagi:
                                        kurs.uwagi ||
                                        ""
                                }
                            );
                    }
                );


                nowyPrzystanek.godziny =
                    Array.from(
                        mapaGodzin.entries()
                    )
                        .sort(
                            (
                                a,
                                b
                            ) =>
                                Number(a[0]) -
                                Number(b[0])
                        )
                        .map(
                            (
                                [
                                    godzina,
                                    minuty
                                ]
                            ) => {

                                minuty.sort(
                                    (
                                        a,
                                        b
                                    ) =>
                                        Number(
                                            a.minuta
                                        ) -
                                        Number(
                                            b.minuta
                                        )
                                );


                                return {

                                    godzina:
                                        godzina,

                                    minuty:
                                        minuty
                                };
                            }
                        );


                nowyKierunek.przystanki.push(
                    nowyPrzystanek
                );
            }
        );


        /*
         * Dodajemy kierunek tylko wtedy,
         * gdy ma faktycznie przystanki.
         */

        if (
            nowyKierunek.przystanki.length > 0
        ) {

            wynik.kierunki.push(
                nowyKierunek
            );
        }
    }


    if (
        wynik.kierunki.length === 0
    ) {

        return null;
    }


    return wynik;
}


/* =========================================================
   KIERUNKI
   ========================================================= */

function generujKierunki() {

    const kontener =
        document.getElementById(
            "kierunki"
        );


    kontener.innerHTML =
        "";


    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !Array.isArray(
            rozklad.kierunki
        )
    )
        return;


    rozklad.kierunki.forEach(
        (
            kierunek,
            index
        ) => {

            const btn =
                document.createElement(
                    "button"
                );


            btn.className =
                "kierunek-btn" +
                (
                    index ===
                    aktualnyKierunek
                        ? " aktywny"
                        : ""
                );


            const p =
                kierunek.przystanki ||
                [];


            btn.textContent =
                p.length > 0
                    ? (
                        p[
                            p.length - 1
                        ].nazwa ||
                        "Kierunek"
                    )
                    : "Kierunek " +
                      (
                        index + 1
                    );


            btn.onclick =
                () => {

                    aktualnyKierunek =
                        index;

                    aktualnyWariant =
                        null;

                    ustawWybranyPrzystanek(
                        null
                    );

                    widokKursuAktywny =
                        false;

                    aktualizujHistorieURL(
                        null
                    );

                    pokazRozklad();
                };


            kontener.appendChild(
                btn
            );
        }
    );
}


/* =========================================================
   KALENDARZ 7 DNI
   ========================================================= */

function taSamaData(
    a,
    b
) {

    return (
        a instanceof Date &&
        b instanceof Date &&
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate()
    );
}


function czyOstatniDzienKalendarza7(
    data
) {

    if (!(data instanceof Date))
        return false;


    const dzisiaj =
        new Date();


    dzisiaj.setHours(
        0,
        0,
        0,
        0
    );


    const ostatniDzien =
        new Date(
            dzisiaj
        );


    ostatniDzien.setDate(
        dzisiaj.getDate() + 6
    );


    return taSamaData(
        data,
        ostatniDzien
    );
}


function ustawWidocznoscWyboruInnegoDnia() {

    const kalendarz =
        document.getElementById(
            "kalendarz"
        );


    if (!kalendarz)
        return;


    kalendarz.style.display =
        czyOstatniDzienKalendarza7(
            wybranaData
        )
            ? "block"
            : "none";


    if (
        kalendarz.style.display ===
        "block"
    ) {

        const input =
            document.getElementById(
                "wybranaData"
            );


        if (input) {

            input.value =
                formatujDateInput(
                    wybranaData
                );
        }
    }
}


function generujKalendarz7Dni() {

    const kontener =
        document.getElementById(
            "dni"
        );


    if (!kontener)
        return;


    kontener.innerHTML =
        "";


    const dzisiaj =
        new Date();


    dzisiaj.setHours(
        0,
        0,
        0,
        0
    );


    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const data =
            new Date(
                dzisiaj
            );


        data.setDate(
            dzisiaj.getDate() + i
        );


        const btn =
            document.createElement(
                "button"
            );


        btn.type =
            "button";


        btn.className =
            "dzien-btn";


        const dataTekst =
            data.getDate() +
            "." +
            String(
                data.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        if (i === 0) {

            btn.textContent =
                dataTekst +
                " (dzisiaj)";

        } else if (i === 1) {

            btn.textContent =
                dataTekst +
                " (jutro)";

        } else {

            const dniTygodnia = [
                "nd",
                "pon",
                "wt",
                "śr",
                "czw",
                "pt",
                "sob"
            ];

            btn.textContent =
                dataTekst +
                " (" +
                dniTygodnia[
                    data.getDay()
                ] +
                ")";
        }


        if (
            taSamaData(
                data,
                wybranaData
            )
        ) {

            btn.classList.add(
                "aktywny"
            );
        }


        btn.onclick =
            function () {

                wybierzDateZKalendarza(
                    data
                );
            };


        kontener.appendChild(
            btn
        );
    }
}


async function wybierzDateZKalendarza(
    data
) {

    const dzisiaj =
        new Date();


    dzisiaj.setHours(
        0,
        0,
        0,
        0
    );


    wybranaData =
        new Date(
            data.getFullYear(),
            data.getMonth(),
            data.getDate()
        );


    const jutro =
        new Date(
            dzisiaj
        );


    jutro.setDate(
        dzisiaj.getDate() + 1
    );


    if (
        taSamaData(
            wybranaData,
            dzisiaj
        )
    ) {

        aktualnyDzien =
            "dzisiaj";

    } else if (
        taSamaData(
            wybranaData,
            jutro
        )
    ) {

        aktualnyDzien =
            "jutro";

    } else {

        aktualnyDzien =
            "kalendarz";
    }


    /* Zachowujemy wybrany przystanek przy zmianie dnia.
       Dzięki temu po przeładowaniu danych dla innej daty
       pokazRozklad() odszuka ten sam przystanek po numerze/nazwie. */

    aktualnyWariant =
        null;


    widokKursuAktywny =
        false;


    const input =
        document.getElementById(
            "wybranaData"
        );


    if (input) {

        input.value =
            formatujDateInput(
                wybranaData
            );
    }


    generujKalendarz7Dni();


    ustawWidocznoscWyboruInnegoDnia();


    /* =====================================================
       ZAPIS DATY W URL
       ===================================================== */

    const urlDaty =
        new URL(
            window.location.href
        );


    urlDaty.searchParams.set(
        "linia",
        numerLinii
    );


    urlDaty.searchParams.set(
        "data",
        formatujDateInput(
            wybranaData
        )
    );


    if (
        wybranyPrzystanekIndex !== null
    ) {

        urlDaty.searchParams.set(
            "przystanek",
            "idx:" +
            wybranyPrzystanekIndex
        );

    } else {

        urlDaty.searchParams.delete(
            "przystanek"
        );
    }


    urlDaty.searchParams.delete(
        "kurs"
    );


    urlDaty.searchParams.delete(
        "wariantKursu"
    );


    window.history.replaceState(
        null,
        "",
        urlDaty.toString()
    );


    const wczytano =
        await pobierzDane(
            false
        );


    if (wczytano) {
        pokazRozklad();
    }
}


function wybierzDzien(
    dzien
) {

    const data =
        new Date();


    data.setHours(
        0,
        0,
        0,
        0
    );


    if (
        dzien ===
        "jutro"
    ) {

        data.setDate(
            data.getDate() + 1
        );
    }


    if (
        dzien ===
        "kalendarz"
    ) {

        const kalendarz =
            document.getElementById(
                "kalendarz"
            );


        if (kalendarz) {

            kalendarz.style.display =
                "block";
        }


        const input =
            document.getElementById(
                "wybranaData"
            );


        if (input) {

            input.value =
                formatujDateInput(
                    wybranaData
                );
        }


        return;
    }


    wybierzDateZKalendarza(
        data
    );
}


/* =========================================================
   DATA
   ========================================================= */

document
    .getElementById(
        "wybranaData"
    )
    .addEventListener(
        "change",
        function () {

            if (!this.value)
                return;


            const czesci =
                this.value.split(
                    "-"
                );


            const data =
                new Date(
                    Number(
                        czesci[0]
                    ),
                    Number(
                        czesci[1]
                    ) - 1,
                    Number(
                        czesci[2]
                    )
                );


            wybierzDateZKalendarza(
                data
            );
        }
    );


function formatujDateInput(
    data
) {

    return (
        data.getFullYear() +
        "-" +
        String(
            data.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +
        "-" +
        String(
            data.getDate()
        ).padStart(
            2,
            "0"
        )
    );
}


/* =========================================================
   WARIANT
   ========================================================= */

function pobierzWariant(k) {

    if (
        !k ||
        typeof k !== "object"
    ) {

        return "";
    }


    const wariant =
        k.wariant;


    if (
        wariant &&
        typeof wariant === "object"
    ) {

        return String(
            wariant.litera ||
            wariant.nazwa ||
            ""
        )
            .trim()
            .toUpperCase();
    }


    return String(
        wariant ||
        ""
    )
        .trim()
        .toUpperCase();
}


/* =========================================================
   WARIANTY
   ========================================================= */

function zbierzWariantyDlaKierunku(
    kierunek
) {

    const set =
        new Set();


    (
        kierunek &&
        kierunek.przystanki
            ? kierunek.przystanki
            : []
    ).forEach(
        p =>
            (
                p.kursy ||
                []
            ).forEach(
                k => {

                    const w =
                        pobierzWariant(
                            k
                        );


                    if (
                        w
                    ) {

                        set.add(
                            w
                        );
                    }
                }
            )
    );


    return Array
        .from(set)
        .sort(
            (
                a,
                b
            ) =>
                a.localeCompare(
                    b,
                    "pl",
                    {
                        numeric: true
                    }
                )
        );
}


/* =========================================================
   DOMYŚLNY WARIANT
   ========================================================= */

function znajdzDomyslnyWariant(
    kierunek
) {

    const wariantStarty =
        new Map();


    (
        kierunek &&
        kierunek.przystanki
            ? kierunek.przystanki
            : []
    ).forEach(
        (
            przystanek,
            index
        ) => {

            (
                przystanek.kursy ||
                []
            ).forEach(
                kurs => {

                    const wariant =
                        pobierzWariant(
                            kurs
                        );


                    if (
                        wariant &&
                        !wariantStarty.has(
                            wariant
                        )
                    ) {

                        wariantStarty.set(
                            wariant,
                            index
                        );
                    }
                }
            );
        }
    );


    const lista =
        Array.from(
            wariantStarty.entries()
        );


    if (
        lista.length === 0
    )
        return null;


    lista.sort(
        (
            a,
            b
        ) => {

            if (
                a[1] !==
                b[1]
            ) {

                return (
                    a[1] -
                    b[1]
                );
            }


            return a[0].localeCompare(
                b[0],
                "pl",
                {
                    numeric: true
                }
            );
        }
    );


    return lista[0][0];
}


/* =========================================================
   INTELIGENTNE OZNACZENIA WARIANTÓW
   =========================================================

   Zasady:
   1. Wariant najczęściej wykonywany w danym kierunku/dniu
      traktujemy jako przebieg podstawowy i NIE oznaczamy go
      literą przy minutach.

   2. Jeżeli różne przebiegi kończą się na TYM SAMYM krańcu:
      - inny początek kursu nie dostaje opisu,
      - rzeczywisty objazd w środku trasy, przez dodatkowe
        przystanki i z powrotem na trasę główną, dostaje opis
        "kurs przez ...".

   3. Jeżeli kurs kończy wcześniej na przebiegu podstawowym:
         kurs skrócony do przystanku NAZWA

   4. Jeżeli kurs odchodzi od przebiegu podstawowego i kończy
      na innym krańcu:
         kurs wydłużony do krańca NAZWA

   Dzięki temu reguła działa dla wszystkich linii bez wpisywania
   wyjątków dla konkretnych numerów linii.
   ========================================================= */

function zbudujAnalizeWariantowFWTP(
    kierunek
) {

    const wynik = {
        glownyWariant: "",
        glownyKoniecIndex: -1,
        glownyKoniecNazwa: "",
        warianty: new Map()
    };


    if (
        !kierunek ||
        !Array.isArray(
            kierunek.przystanki
        )
    ) {

        return wynik;
    }


    const przystanki =
        kierunek.przystanki;


    const mapaKursow =
        new Map();


    przystanki.forEach(
        (
            p,
            index
        ) => {

            (
                p.kursy ||
                []
            ).forEach(
                kurs => {

                    const czas =
                        czasNaMinuty(
                            kurs?.czas
                        );


                    if (czas === null) {
                        return;
                    }


                    const numer =
                        String(
                            kurs?.numer ?? ""
                        ).trim();


                    if (!numer) {
                        return;
                    }


                    const wariant =
                        pobierzWariant(
                            kurs
                        );


                    const klucz =
                        numer +
                        "||" +
                        wariant;


                    if (
                        !mapaKursow.has(
                            klucz
                        )
                    ) {

                        mapaKursow.set(
                            klucz,
                            {
                                numer:
                                    numer,

                                wariant:
                                    wariant,

                                punkty:
                                    []
                            }
                        );
                    }


                    mapaKursow
                        .get(klucz)
                        .punkty
                        .push(
                            {
                                index:
                                    index,

                                czas:
                                    czas
                            }
                        );
                }
            );
        }
    );


    const wszystkieKursy =
        Array.from(
            mapaKursow.values()
        )
            .map(
                kurs => {

                    kurs.punkty.sort(
                        (
                            a,
                            b
                        ) =>
                            a.index -
                            b.index
                    );


                    return kurs;
                }
            )
            .filter(
                kurs =>
                    kurs.punkty.length > 0
            );


    if (
        wszystkieKursy.length === 0
    ) {

        return wynik;
    }


    /*
     * Liczymy liczbę UNIKALNYCH kursów każdego wariantu.
     * Najczęstszy wariant jest przebiegiem podstawowym.
     */
    const licznikWariantow =
        new Map();


    wszystkieKursy.forEach(
        kurs => {

            const wariant =
                kurs.wariant;


            if (!wariant) {
                return;
            }


            licznikWariantow.set(
                wariant,
                (
                    licznikWariantow.get(
                        wariant
                    ) || 0
                ) + 1
            );
        }
    );


    const warianty =
        Array.from(
            licznikWariantow.keys()
        );


    if (
        warianty.length === 0
    ) {

        return wynik;
    }


    let glownyWariant =
        warianty[0];


    warianty.forEach(
        wariant => {

            const liczba =
                licznikWariantow.get(
                    wariant
                ) || 0;


            const liczbaGlownego =
                licznikWariantow.get(
                    glownyWariant
                ) || 0;


            if (
                liczba >
                liczbaGlownego
            ) {

                glownyWariant =
                    wariant;

                return;
            }


            /*
             * Przy remisie wariant A pozostaje przebiegiem
             * podstawowym, jeżeli występuje.
             */
            if (
                liczba ===
                    liczbaGlownego &&
                wariant === "A" &&
                glownyWariant !== "A"
            ) {

                glownyWariant =
                    "A";
            }
        }
    );


    wynik.glownyWariant =
        glownyWariant;


    const kursyGlownegoWariantu =
        wszystkieKursy.filter(
            kurs =>
                kurs.wariant ===
                glownyWariant
        );


    /*
     * Najpierw ustalamy najczęstszy przystanek końcowy
     * przebiegu podstawowego.
     */
    const konceGlownego =
        new Map();


    kursyGlownegoWariantu.forEach(
        kurs => {

            const ostatni =
                kurs.punkty[
                    kurs.punkty.length - 1
                ];


            const index =
                ostatni.index;


            konceGlownego.set(
                index,
                (
                    konceGlownego.get(
                        index
                    ) || 0
                ) + 1
            );
        }
    );


    let glownyKoniecIndex =
        -1;


    let najwiecejKoncow =
        -1;


    konceGlownego.forEach(
        (
            liczba,
            index
        ) => {

            if (
                liczba >
                najwiecejKoncow
            ) {

                najwiecejKoncow =
                    liczba;

                glownyKoniecIndex =
                    Number(index);

                return;
            }


            /*
             * Przy remisie wybieramy dalszy przebieg.
             */
            if (
                liczba ===
                    najwiecejKoncow &&
                Number(index) >
                    glownyKoniecIndex
            ) {

                glownyKoniecIndex =
                    Number(index);
            }
        }
    );


    /*
     * Reprezentatywny przebieg podstawowy:
     * najdłuższy kurs kończący się na głównym krańcu.
     */
    let glownyKurs =
        null;


    kursyGlownegoWariantu.forEach(
        kurs => {

            const ostatni =
                kurs.punkty[
                    kurs.punkty.length - 1
                ];


            if (
                ostatni.index !==
                    glownyKoniecIndex
            ) {

                return;
            }


            if (
                !glownyKurs ||
                kurs.punkty.length >
                    glownyKurs.punkty.length
            ) {

                glownyKurs =
                    kurs;
            }
        }
    );


    if (
        !glownyKurs &&
        kursyGlownegoWariantu.length > 0
    ) {

        glownyKurs =
            kursyGlownegoWariantu
                .slice()
                .sort(
                    (
                        a,
                        b
                    ) =>
                        b.punkty.length -
                        a.punkty.length
                )[0];


        glownyKoniecIndex =
            glownyKurs.punkty[
                glownyKurs.punkty.length - 1
            ].index;
    }


    wynik.glownyKoniecIndex =
        glownyKoniecIndex;


    wynik.glownyKoniecNazwa =
        glownyKoniecIndex >= 0 &&
        przystanki[
            glownyKoniecIndex
        ]
            ? String(
                przystanki[
                    glownyKoniecIndex
                ].nazwa || ""
              ).trim()
            : "";


    const indeksyGlownejTrasy =
        new Set(
            glownyKurs
                ? glownyKurs.punkty.map(
                    p => p.index
                  )
                : []
        );


    const nazwyGlownejTrasy =
        new Set(
            glownyKurs
                ? glownyKurs.punkty.map(
                    punkt =>
                        normalizujTekst(
                            przystanki[
                                punkt.index
                            ]?.nazwa || ""
                        )
                  )
                : []
        );


    /*
     * Analiza każdego wariantu.
     */
    warianty.forEach(
        wariant => {

            const kursyWariantu =
                wszystkieKursy.filter(
                    kurs =>
                        kurs.wariant ===
                            wariant
                );


            const konce =
                new Map();


            kursyWariantu.forEach(
                kurs => {

                    const ostatni =
                        kurs.punkty[
                            kurs.punkty.length - 1
                        ];


                    konce.set(
                        ostatni.index,
                        (
                            konce.get(
                                ostatni.index
                            ) || 0
                        ) + 1
                    );
                }
            );


            let koniecIndex =
                -1;


            let liczbaKoncow =
                -1;


            konce.forEach(
                (
                    liczba,
                    index
                ) => {

                    if (
                        liczba >
                        liczbaKoncow
                    ) {

                        liczbaKoncow =
                            liczba;

                        koniecIndex =
                            Number(index);

                        return;
                    }


                    if (
                        liczba ===
                            liczbaKoncow &&
                        Number(index) >
                            koniecIndex
                    ) {

                        koniecIndex =
                            Number(index);
                    }
                }
            );


            const koniecNazwa =
                koniecIndex >= 0 &&
                przystanki[
                    koniecIndex
                ]
                    ? String(
                        przystanki[
                            koniecIndex
                        ].nazwa || ""
                      ).trim()
                    : "";


            const taSamaNazwaKonca =
                normalizujTekst(
                    koniecNazwa
                ) ===
                normalizujTekst(
                    wynik.glownyKoniecNazwa
                );


            let typ =
                "bez-oznaczenia";


            let opis =
                "";


            if (
                wariant ===
                glownyWariant
            ) {

                /*
                 * Główny wariant jest zwykłym przebiegiem.
                 * Nie pokazujemy A (ani innej litery, jeśli
                 * główny wariant nie jest A).
                 */
                typ =
                    "podstawowy";

            } else if (
                taSamaNazwaKonca
            ) {

                /*
                 * TEN SAM KRANIEC nie oznacza automatycznie,
                 * że wariant ma być bez opisu.
                 *
                 * Rozróżniamy dwa przypadki:
                 *
                 * 1. Kurs zaczyna się z innego przystanku / innej
                 *    odnogi i potem tylko DOŁĄCZA do trasy głównej.
                 *    Wtedy NIE pokazujemy "kurs przez ...".
                 *
                 * 2. Kurs jedzie trasą główną, następnie ODBIJA
                 *    przez dodatkowe przystanki i później WRACA
                 *    na trasę główną.
                 *    Wtedy pokazujemy:
                 *
                 *        kurs przez NAZWA, NAZWA...
                 *
                 * To jest m.in. przypadek linii 210.
                 */

                let kursReprezentatywnyWariantu =
                    null;


                kursyWariantu.forEach(
                    kurs => {

                        if (
                            !Array.isArray(
                                kurs.punkty
                            ) ||
                            kurs.punkty.length === 0
                        ) {

                            return;
                        }


                        const ostatni =
                            kurs.punkty[
                                kurs.punkty.length - 1
                            ];


                        if (
                            ostatni.index !==
                                koniecIndex
                        ) {

                            return;
                        }


                        if (
                            !kursReprezentatywnyWariantu ||
                            kurs.punkty.length >
                                kursReprezentatywnyWariantu.punkty.length
                        ) {

                            kursReprezentatywnyWariantu =
                                kurs;
                        }
                    }
                );


                if (
                    !kursReprezentatywnyWariantu &&
                    kursyWariantu.length > 0
                ) {

                    kursReprezentatywnyWariantu =
                        kursyWariantu
                            .slice()
                            .sort(
                                (
                                    a,
                                    b
                                ) =>
                                    b.punkty.length -
                                    a.punkty.length
                            )[0];
                }


                /*
                 * Przy ustalaniu, czy wariant WRACA na trasę główną,
                 * porównujemy nazwę zespołu przystankowego.
                 *
                 * Numer stanowiska może być inny po drugiej stronie
                 * skrzyżowania / pętli, ale nadal jest to powrót
                 * do tej samej trasy. Wcześniej porównanie
                 * "nazwa + numer" powodowało, że część prawdziwych
                 * wariantów "kurs przez ..." nie była wykrywana.
                 */
                const kluczPrzystanku =
                    index => {

                        const p =
                            przystanki[
                                index
                            ];


                        if (!p) {
                            return "";
                        }


                        return normalizujTekst(
                            p.nazwa || ""
                        );
                    };


                const kluczeGlownejTrasy =
                    new Set(
                        glownyKurs
                            ? glownyKurs.punkty
                                .map(
                                    punkt =>
                                        kluczPrzystanku(
                                            punkt.index
                                        )
                                )
                                .filter(Boolean)
                            : []
                    );


                const punktyWariantu =
                    kursReprezentatywnyWariantu &&
                    Array.isArray(
                        kursReprezentatywnyWariantu.punkty
                    )
                        ? kursReprezentatywnyWariantu.punkty
                        : [];


                /*
                 * Szukamy dodatkowych przystanków TYLKO pomiędzy
                 * dwoma punktami wspólnymi z trasą główną.
                 *
                 * Dodatkowe przystanki przed pierwszym wspólnym
                 * punktem oznaczają jedynie inny POCZĄTEK kursu
                 * i nie tworzą opisu "kurs przez ...".
                 *
                 * Analogicznie nie opisujemy samego innego początku
                 * trasy, co zachowuje poprawne zachowanie np. dla
                 * kierunków wychodzących z różnych krańców.
                 */
                const wspolny =
                    punktyWariantu.map(
                        punkt =>
                            kluczeGlownejTrasy.has(
                                kluczPrzystanku(
                                    punkt.index
                                )
                            )
                    );


                let pierwszyWspolny =
                    -1;


                let ostatniWspolny =
                    -1;


                wspolny.forEach(
                    (
                        czyWspolny,
                        index
                    ) => {

                        if (!czyWspolny) {
                            return;
                        }


                        if (
                            pierwszyWspolny === -1
                        ) {

                            pierwszyWspolny =
                                index;
                        }


                        ostatniWspolny =
                            index;
                    }
                );


                const dodatkoweNazwy =
                    [];


                const widzianeNazwy =
                    new Set();


                if (
                    pierwszyWspolny >= 0 &&
                    ostatniWspolny >
                        pierwszyWspolny
                ) {

                    for (
                        let i =
                            pierwszyWspolny + 1;
                        i < ostatniWspolny;
                        i++
                    ) {

                        if (
                            wspolny[i]
                        ) {

                            continue;
                        }


                        const punkt =
                            punktyWariantu[i];


                        const przystanek =
                            punkt
                                ? przystanki[
                                    punkt.index
                                  ]
                                : null;


                        if (!przystanek) {
                            continue;
                        }


                        const nazwa =
                            String(
                                przystanek.nazwa ||
                                ""
                            ).trim();


                        const kluczNazwy =
                            normalizujTekst(
                                nazwa
                            );


                        if (
                            !nazwa ||
                            !kluczNazwy ||
                            widzianeNazwy.has(
                                kluczNazwy
                            )
                        ) {

                            continue;
                        }


                        widzianeNazwy.add(
                            kluczNazwy
                        );


                        dodatkoweNazwy.push(
                            nazwa
                        );
                    }
                }


                if (
                    dodatkoweNazwy.length > 0
                ) {

                    typ =
                        "przez";


                    opis =
                        "kurs przez " +
                        dodatkoweNazwy
                            .map(
                                nazwa =>
                                    String(
                                        nazwa
                                    ).toUpperCase()
                            )
                            .join(", ");

                } else {

                    /*
                     * Ten sam kraniec, ale brak rzeczywistego
                     * objazdu w środku trasy. Najczęściej jest to
                     * tylko inny przystanek początkowy.
                     */
                    typ =
                        "ten-sam-kraniec";
                }

            } else {

                const nazwaKoncaNorm =
                    normalizujTekst(
                        koniecNazwa
                    );


                const koniecLezyNaGlownejTrasie =
                    indeksyGlownejTrasy.has(
                        koniecIndex
                    ) ||
                    nazwyGlownejTrasy.has(
                        nazwaKoncaNorm
                    );


                const koniecJestWczesniej =
                    koniecIndex >= 0 &&
                    wynik.glownyKoniecIndex >= 0 &&
                    koniecIndex <
                        wynik.glownyKoniecIndex;


                if (
                    koniecLezyNaGlownejTrasie ||
                    koniecJestWczesniej
                ) {

                    typ =
                        "skrocony";


                    opis =
                        "kurs skrócony do przystanku " +
                        String(
                            koniecNazwa
                        ).toUpperCase();

                } else {

                    typ =
                        "wydluzony";


                    opis =
                        "kurs wydłużony do krańca " +
                        String(
                            koniecNazwa
                        ).toUpperCase();
                }
            }


            wynik.warianty.set(
                wariant,
                {
                    wariant:
                        wariant,

                    typ:
                        typ,

                    opis:
                        opis,

                    koniecIndex:
                        koniecIndex,

                    koniecNazwa:
                        koniecNazwa,

                    liczbaKursow:
                        kursyWariantu.length,

                    pokazOznaczenie:
                        opis !== ""
                }
            );
        }
    );


    return wynik;
}


function pobierzOpisWariantuFWTP(
    analiza,
    wariant
) {

    if (
        !analiza ||
        !analiza.warianty ||
        typeof analiza.warianty.get !==
            "function"
    ) {

        return "";
    }


    const dane =
        analiza.warianty.get(
            String(
                wariant || ""
            )
                .trim()
                .toUpperCase()
        );


    return dane
        ? String(
            dane.opis || ""
          )
        : "";
}


function czyPokazacOznaczenieWariantuFWTP(
    analiza,
    wariant
) {

    if (
        !analiza ||
        !analiza.warianty ||
        typeof analiza.warianty.get !==
            "function"
    ) {

        return false;
    }


    const dane =
        analiza.warianty.get(
            String(
                wariant || ""
            )
                .trim()
                .toUpperCase()
        );


    return !!(
        dane &&
        dane.pokazOznaczenie
    );
}


/* =========================================================
   CZAS NA MINUTY
   ========================================================= */

function czasNaMinuty(
    czas
) {

    const dop =
        String(
            czas || ""
        )
            .trim()
            .match(
                /^(\d{1,2}):(\d{2})$/
            );


    if (!dop)
        return null;


    const godzina =
        Number(
            dop[1]
        );


    const minuta =
        Number(
            dop[2]
        );


    if (
        godzina < 0 ||
        godzina > 24 ||
        minuta < 0 ||
        minuta > 59
    ) {

        return null;
    }


    /*
     * 24:xx traktujemy jako czas po północy tego samego kursu.
     * W danych może zostać 24:05, 24:30 itd., dzięki czemu
     * zachowujemy prawidłową kolejność kursu przez północ.
     * Na ekranie godzina 24 będzie pokazywana jako 00.
     */
    return (
        godzina * 60 +
        minuta
    );
}


/* =========================================================
   ZNAJDOWANIE PIERWSZEGO KURSU
   ========================================================= */

function znajdzKursBazowy(
    kierunek,
    wariant
) {

    if (!kierunek)
        return null;


    const przystanki =
        kierunek.przystanki ||
        [];


    const mapaKursow =
        new Map();


    przystanki.forEach(
        (
            p,
            index
        ) => {

            (
                p.kursy ||
                []
            ).forEach(
                k => {

                    if (
                        k.numer === undefined ||
                        k.numer === null
                    ) {

                        return;
                    }


                    const numer =
                        String(
                            k.numer
                        ).trim();


                    if (!numer)
                        return;


                    const kursWariant =
                        pobierzWariant(
                            k
                        );


                    const klucz =
                        numer +
                        "||" +
                        kursWariant;


                    if (
                        !mapaKursow.has(
                            klucz
                        )
                    ) {

                        mapaKursow.set(
                            klucz,
                            {
                                numer:
                                    k.numer,

                                wariant:
                                    kursWariant,

                                punkty:
                                    []
                            }
                        );
                    }


                    mapaKursow
                        .get(klucz)
                        .punkty
                        .push(
                            {
                                index:
                                    index,

                                czas:
                                    k.czas
                            }
                        );
                }
            );
        }
    );


    const wszystkieKursy =
        Array.from(
            mapaKursow.values()
        );


    wszystkieKursy.forEach(
        kurs => {

            kurs.punkty.sort(
                (
                    a,
                    b
                ) =>
                    a.index -
                    b.index
            );


            const pierwszy =
                kurs.punkty.find(
                    punkt =>
                        czasNaMinuty(
                            punkt.czas
                        ) !== null
                );


            kurs.startIndex =
                pierwszy
                    ? pierwszy.index
                    : 999999;


            kurs.startMinuty =
                pierwszy
                    ? czasNaMinuty(
                        pierwszy.czas
                    )
                    : null;
        }
    );


    const szukanyWariant =
        String(
            wariant || ""
        )
            .trim()
            .toUpperCase();


    const kandydaci =
        wszystkieKursy.filter(
            kurs =>
                kurs.wariant ===
                szukanyWariant
        );


    if (
        kandydaci.length === 0
    ) {

        return null;
    }


    kandydaci.sort(
        (
            a,
            b
        ) => {

            /*
             * Kurs reprezentatywny dla czasu przejazdu wybieramy
             * przede wszystkim po DŁUGOŚCI PRZEBIEGU, a nie po
             * najwcześniejszej godzinie odjazdu.
             *
             * Dzięki temu pojedynczy kurs np. 04:36 zaczynający
             * się w środku trasy nie stanie się bazą do liczenia
             * minut przejazdu całej linii.
             */

            const liczbaPunktowA =
                (
                    a.punkty ||
                    []
                ).filter(
                    punkt =>
                        czasNaMinuty(
                            punkt.czas
                        ) !== null
                ).length;


            const liczbaPunktowB =
                (
                    b.punkty ||
                    []
                ).filter(
                    punkt =>
                        czasNaMinuty(
                            punkt.czas
                        ) !== null
                ).length;


            if (
                liczbaPunktowA !==
                liczbaPunktowB
            ) {

                return (
                    liczbaPunktowB -
                    liczbaPunktowA
                );
            }


            if (
                a.startIndex !==
                b.startIndex
            ) {

                return (
                    a.startIndex -
                    b.startIndex
                );
            }


            const aa =
                a.startMinuty === null
                    ? 999999
                    : a.startMinuty;


            const bb =
                b.startMinuty === null
                    ? 999999
                    : b.startMinuty;


            return aa - bb;
        }
    );


    return (
        kandydaci[0] ||
        null
    );
}


/* =========================================================
   POBIERANIE CZASÓW DOKŁADNEGO KURSU
   ========================================================= */

function pobierzCzasyKursu(
    kierunek,
    kurs
) {

    const przystanki =
        kierunek.przystanki ||
        [];


    const czasy =
        new Array(
            przystanki.length
        ).fill(
            null
        );


    if (!kurs)
        return czasy;


    (
        kurs.punkty ||
        []
    ).forEach(
        punkt => {

            const index =
                Number(
                    punkt.index
                );


            if (
                !Number.isInteger(
                    index
                ) ||
                index < 0 ||
                index >= przystanki.length
            ) {

                return;
            }


            const czas =
                String(
                    punkt.czas || ""
                ).trim();


            if (
                czasNaMinuty(
                    czas
                ) !== null
            ) {

                czasy[index] =
                    czas;
            }
        }
    );


    return czasy;
}


/* =========================================================
   SUMOWANIE CZASU PRZEJAZDU
   ========================================================= */

function obliczSumowaneCzasy(
    czasy
) {

    const wynik =
        new Array(
            czasy.length
        ).fill(
            null
        );


    let pierwszyCzas =
        null;


    for (
        let i = 0;
        i < czasy.length;
        i++
    ) {

        const minuty =
            czasNaMinuty(
                czasy[i]
            );


        if (
            minuty !== null
        ) {

            pierwszyCzas =
                minuty;

            break;
        }
    }


    if (
        pierwszyCzas === null
    ) {

        return wynik;
    }


    for (
        let i = 0;
        i < czasy.length;
        i++
    ) {

        const minuty =
            czasNaMinuty(
                czasy[i]
            );


        if (
            minuty === null
        )
            continue;


        let roznica =
            minuty -
            pierwszyCzas;


        if (
            roznica < 0
        ) {

            roznica +=
                24 * 60;
        }


        wynik[i] =
            roznica;
    }


    return wynik;
}

            let znaleziony =

                    );

                    );

                    rozklad,
                    wybranyPrzystanek

            }

        ustawWybranyPrzystanek(

        );

    pokazListePrzystankow(

    );

function czyPrzystanekNaZadanie(
    p
) {

    if (!p)
        return false;


    const typ =
        String(
            p.typ || ""
        )
            .trim()
            .toUpperCase();


    if (
        typ === "NŻ" ||
        typ === "NZ"
    ) {

        return true;
    }


    if (
        p.naZadanie === true ||
        String(
            p.naZadanie
        ).toLowerCase() ===
        "true"
    ) {

        return true;
    }


    if (
        p.nz === true ||
        String(
            p.nz
        ).toLowerCase() ===
        "true"
    ) {

        return true;
    }


    if (
        typeof p.nazwa ===
        "string" &&
        p.nazwa.includes(
            "(NŻ)"
        )
    ) {

        return true;
    }


    return false;
}

            if (wariantyKierunku.length === 1) {

        );

        );

        );


    /*
     * W zwykłym widoku linii nie podświetlamy tylko jednego

     *
     * Dla wybranego wariantu podświetlamy więc SUMĘ wszystkich

     *
     * Dzięki temu:
     * - A pokazuje całą trasę podstawową,
     * - kurs zaczynający później nie skraca wizualnie trasy A,
     * - prawdziwy wariant skrócony B nadal ma tylko swój zakres.
     */
const wariantySkrocone =
    new Set(
        (
            Array.isArray(
                rozklad.warianty
            )
                ? rozklad.warianty
                : []
        )
            .filter(

                        )
                            .trim()

                    return opis.startsWith(

                    );
                }
            )
            .map(
                wariant =>
                    String(
                        wariant?.litera ||
                        ""
                    )
                        .trim()
                        .toUpperCase()
            )
            .filter(Boolean)
    );


    /*
     * W zwykłej LIŚCIE PRZYSTANKÓW nie wyszarzamy dalszej części
     * trasy tylko dlatego, że wybrany wariant jest kursem skróconym.
     *
     * Wyszarzenie przystanków ZA końcem kursu skróconego ma dotyczyć
     * wyłącznie widoku KONKRETNEGO KURSU po kliknięciu godziny/minuty.
     */
    /*
     * Tak samo jak w widoku konkretnego kursu:
     * po wybraniu wariantu skróconego przystanki za jego
     * końcem mają być szare. Ostatni obsługiwany przystanek
     * pozostaje końcówką wariantu (kwadrat).
     */
    const selectedActive =
        aktualnyWariant
            ? przystanki.map(
                p =>
                    (
                        p.kursy ||
                        []
                    ).some(
                        k =>
                            pobierzWariant(k) ===
                            aktualnyWariant
                    )
            )
            : czasyKursu.map(
                czas =>
                    czasNaMinuty(
                        czas
                    ) !== null
            );


    const N =
        przystanki.length;


    /* =====================================================
   POCZĄTEK I KONIEC WYBRANEGO WARIANTU
   ===================================================== */

let firstActiveIndex = -1;
let lastActiveIndex = -1;


/*
 * Początek i koniec wyznaczamy przede wszystkim
 * z RZECZYWISTEGO przebiegu wybranego kursu.
 *
 * Dzięki temu, jeżeli wariant zaczyna kurs dopiero
 * na przystanku znajdującym się w środku całej trasy
 * (np. na linii 126), właśnie ten przystanek jest
 * początkiem wariantu i zostanie narysowany jako
 * czarny kwadrat.
 */

selectedActive.forEach(
    (
        active,
        i
    ) => {

        if (!active)
            return;


        if (
            firstActiveIndex === -1
        ) {

            firstActiveIndex =
                i;
        }


        lastActiveIndex =
            i;
    }
);


/*
 * Awaryjnie, jeżeli dokładny kurs nie zwrócił
 * żadnego czasu, korzystamy z występowania
 * aktualnie wybranego wariantu na przystankach.
 */

if (
    firstActiveIndex === -1 &&
    aktualnyWariant
) {

    przystanki.forEach(
        (
            p,
            i
        ) => {

            const maWariant =
                (
                    p.kursy ||
                    []
                ).some(
                    k =>
                        pobierzWariant(k) ===
                        aktualnyWariant
                );


            if (
                !maWariant
            ) {
                return;
            }


            if (
                firstActiveIndex === -1
            ) {

                firstActiveIndex =
                    i;
            }


            lastActiveIndex =
                i;
        }
    );
}

   /* =====================================================
   WARIANT BAZOWY / OŚ GŁÓWNA
   ===================================================== */

/*
 * Główną osią jest wariant, który ma najwięcej
 * UNIKALNYCH kursów dla aktualnie wybranej daty.
 *
 * Ważne:
 * - nie zmieniamy sposobu budowania listy przystanków,
 * - nie zmieniamy znajdzRozklad(),
 * - wariant A nadal normalnie istnieje i jest widoczny,
 * - zmienia się wyłącznie wariant rysowany jako główna oś.
 */




const liczbaKursowWariantu =
    new Map();


wariantyKierunku.forEach(
    wariant => {

        const unikalneKursy =
            new Set();


        przystanki.forEach(
            p => {

                (
                    p.kursy ||
                    []
                ).forEach(
                    kurs => {

                        if (
                            pobierzWariant(kurs) !==
                            wariant
                        ) {
                            return;
                        }


                        const numer =
                            String(
                                kurs.numer !== undefined &&
                                kurs.numer !== null
                                    ? kurs.numer
                                    : ""
                            ).trim();


                        if (numer) {

                            unikalneKursy.add(
                                numer
                            );

                            return;
                        }


                        /*
                         * Awaryjny identyfikator, gdy kurs
                         * nie ma pola numer.
                         */

                        const czas =
                            String(
                                kurs.czas ||
                                ""
                            ).trim();


                        const brygada =
                            String(
                                kurs.brygada ||
                                ""
                            ).trim();


                        if (
                            czas ||
                            brygada
                        ) {

                            unikalneKursy.add(
                                czas +
                                "||" +
                                brygada +
                                "||" +
                                wariant
                            );
                        }
                    }
                );
            }
        );


        liczbaKursowWariantu.set(
            wariant,
            unikalneKursy.size
        );
    }
);


/*
 * Wariant skrócony nie może zostać osią główną tylko dlatego,
 * że ma więcej kursów. Najpierw wybieramy spośród wariantów
 * nieskróconych. Jeżeli nie ma żadnego, używamy wszystkich.
 */
const kandydaciGlownejOsi =
    wariantyKierunku.filter(
        wariant =>
            !wariantySkrocone.has(
                wariant
            )
    );


const wariantyDoWyboruGlownejOsi =
    kandydaciGlownejOsi.length > 0
        ? kandydaciGlownejOsi
        : wariantyKierunku;


/* =========================================================
   REPREZENTATYWNE PRZEBIEGI WARIANTÓW — GLOBALNIE
   =========================================================

   Nie wybieramy już reprezentatywnego przebiegu przez
   znajdzKursBazowy(), bo pierwszy znaleziony kurs potrafi być
   kursem skróconym albo zaczynającym/kończącym w środku trasy.

   To było szczególnie widoczne na 228: w jednym kierunku kod
   potrafił uznać przebieg przez dodatkowe przystanki za oś główną,
   mimo że istnieje prostszy przejazd pomiędzy tymi samymi punktami.

   Teraz:
   1. zbieramy WSZYSTKIE rzeczywiste ścieżki kursów dla wariantu,
   2. jako reprezentatywną wybieramy najpełniejszą (najwięcej punktów),
   3. później porównujemy warianty lokalnie pomiędzy wspólnymi punktami.

   Dzięki temu zasada działa w obu kierunkach i nie zależy od numeru linii.
 */
const wszystkieSciezkiWariantow =
    new Map();


wariantyDoWyboruGlownejOsi.forEach(
    wariant => {

        wszystkieSciezkiWariantow.set(
            wariant,
            new Map()
        );
    }
);


przystanki.forEach(
    (
        p,
        indexPrzystanku
    ) => {

        (
            p.kursy || []
        ).forEach(
            kurs => {

                if (
                    czasNaMinuty(
                        kurs.czas
                    ) === null
                ) {
                    return;
                }


                const wariant =
                    pobierzWariant(
                        kurs
                    );


                if (
                    !wszystkieSciezkiWariantow.has(
                        wariant
                    )
                ) {
                    return;
                }


                const numer =
                    String(
                        kurs.numer !== undefined &&
                        kurs.numer !== null
                            ? kurs.numer
                            : ""
                    ).trim();


                const brygada =
                    String(
                        kurs.brygada || ""
                    ).trim();


                /*
                 * Pole numer jest najlepszym identyfikatorem kursu.
                 * Gdy go brak, używamy brygady + wariantu jako
                 * awaryjnego klucza. Nie używamy czasu, bo czas zmienia
                 * się na każdym kolejnym przystanku tego samego kursu.
                 */
                const kluczKursu =
                    numer
                        ? "N:" + numer
                        : (
                            brygada
                                ? "B:" + brygada + "||" + wariant
                                : "AUTO:" + wariant
                          );


                const mapaKursow =
                    wszystkieSciezkiWariantow.get(
                        wariant
                    );


                if (
                    !mapaKursow.has(
                        kluczKursu
                    )
                ) {

                    mapaKursow.set(
                        kluczKursu,
                        []
                    );
                }


                const sciezka =
                    mapaKursow.get(
                        kluczKursu
                    );


                if (
                    sciezka.length === 0 ||
                    sciezka[
                        sciezka.length - 1
                    ] !== indexPrzystanku
                ) {

                    sciezka.push(
                        indexPrzystanku
                    );
                }
            }
        );
    }
);


const reprezentatywneSciezkiWariantow =
    new Map();


wariantyDoWyboruGlownejOsi.forEach(
    wariant => {

        const mapaKursow =
            wszystkieSciezkiWariantow.get(
                wariant
            );


        const sciezki =
            mapaKursow
                ? Array.from(
                    mapaKursow.values()
                  )
                : [];


        sciezki.forEach(
            sciezka => {

                sciezka.sort(
                    (
                        a,
                        b
                    ) => a - b
                );
            }
        );


        sciezki.sort(
            (
                a,
                b
            ) => {

                if (
                    b.length !== a.length
                ) {

                    return (
                        b.length -
                        a.length
                    );
                }


                if (
                    a.length === 0 ||
                    b.length === 0
                ) {
                    return 0;
                }


                /*
                 * Przy tej samej liczbie punktów preferujemy przebieg
                 * obejmujący większy zakres indeksów listy.
                 */
                const zakresA =
                    a[
                        a.length - 1
                    ] - a[0];


                const zakresB =
                    b[
                        b.length - 1
                    ] - b[0];


                return (
                    zakresB -
                    zakresA
                );
            }
        );


        reprezentatywneSciezkiWariantow.set(
            wariant,
            sciezki.length > 0
                ? sciezki[0]
                : []
        );
    }
);


/*
 * Czy krótszy przebieg jest rzeczywistym szkieletem dłuższego?
 *
 * Nie wymagamy, żeby indeksy były obok siebie. Właśnie brak
 * przystanków pomiędzy nimi oznacza bezpośredni przejazd.
 *
 * Warunki:
 * - ten sam pierwszy przystanek,
 * - ten sam ostatni przystanek,
 * - wszystkie punkty krótszego przebiegu występują w dłuższym
 *   w tej samej kolejności,
 * - dłuższy ma co najmniej jeden dodatkowy przystanek.
 */
function czyPodciagWTejSamejKolejnosciFWTP(
    krotszy,
    dluzszy
) {

    if (
        !Array.isArray(krotszy) ||
        !Array.isArray(dluzszy) ||
        krotszy.length === 0 ||
        dluzszy.length < krotszy.length
    ) {

        return false;
    }


    let pozycja = 0;


    for (
        const index
        of dluzszy
    ) {

        if (
            index ===
            krotszy[pozycja]
        ) {

            pozycja++;


            if (
                pozycja ===
                krotszy.length
            ) {

                return true;
            }
        }
    }


    return false;
}


/*
 * GLOBALNE WYKRYWANIE OBJAZDU MIĘDZY DWOMA WSPÓLNYMI PUNKTAMI.
 *
 * To jest ważniejsza i bardziej ogólna wersja wcześniejszego
 * porównania całych przebiegów.
 *
 * Wcześniej wymagaliśmy, aby oba warianty miały dokładnie ten sam
 * pierwszy i ostatni przystanek. To działało np. na części linii 110,
 * 126 i 331, ale potrafiło zawieść w jednym kierunku linii 228,
 * jeżeli jeden przebieg zaczynał się albo kończył wcześniej/później.
 *
 * Teraz szukamy DWÓCH WSPÓLNYCH KOTWIC wewnątrz tras:
 *
 *     A: ... X ---------------- Y ...
 *     B: ... X -> p1 -> p2 -> Y ...
 *
 * Jeżeli pomiędzy tym samym X i Y jedna trasa jest bezpośredniejsza,
 * a druga zawiera dodatkowe przystanki, to dłuższa część jest objazdem.
 *
 * Dzięki temu kierunek jazdy i różne początki/końce kursów nie powinny
 * zmieniać tego, która geometria jest osią główną.
 */
function policzKareLokalnegoObjazduFWTP(
    kandydatObjazdu,
    kandydatProsty
) {

    if (
        !Array.isArray(kandydatObjazdu) ||
        !Array.isArray(kandydatProsty) ||
        kandydatObjazdu.length < 2 ||
        kandydatProsty.length < 2
    ) {

        return 0;
    }


    let najlepszaKara =
        0;


    /*
     * Bierzemy każdą parę kolejnych punktów z prostszego przebiegu.
     * Jeżeli w drugim przebiegu pomiędzy tymi samymi punktami są
     * dodatkowe przystanki, jest to lokalny objazd.
     *
     * Przykład:
     *
     * prosty:   [10, 20]
     * objazd:   [10, 11, 12, 20]
     * kara = 2
     */
    for (
        let a = 0;
        a < kandydatProsty.length - 1;
        a++
    ) {

        const start =
            kandydatProsty[a];


        for (
            let b = a + 1;
            b < kandydatProsty.length;
            b++
        ) {

            const koniec =
                kandydatProsty[b];


            const startObjazdu =
                kandydatObjazdu.indexOf(
                    start
                );


            if (
                startObjazdu < 0
            ) {

                continue;
            }


            const koniecObjazdu =
                kandydatObjazdu.indexOf(
                    koniec,
                    startObjazdu + 1
                );


            if (
                koniecObjazdu < 0
            ) {

                continue;
            }


            const fragmentProsty =
                kandydatProsty.slice(
                    a,
                    b + 1
                );


            const fragmentObjazdu =
                kandydatObjazdu.slice(
                    startObjazdu,
                    koniecObjazdu + 1
                );


            if (
                fragmentObjazdu.length <=
                fragmentProsty.length
            ) {

                continue;
            }


            /*
             * Wszystkie punkty prostszego fragmentu muszą występować
             * w objazdowym fragmencie w tej samej kolejności.
             */
            if (
                !czyPodciagWTejSamejKolejnosciFWTP(
                    fragmentProsty,
                    fragmentObjazdu
                )
            ) {

                continue;
            }


            const kara =
                fragmentObjazdu.length -
                fragmentProsty.length;


            if (
                kara > najlepszaKara
            ) {

                najlepszaKara =
                    kara;
            }
        }
    }


    return najlepszaKara;
}


/*
 * Kara za bycie objazdem.
 *
 * Jeżeli wariant pomiędzy dowolnymi dwoma wspólnymi punktami
 * odwiedza dodatkowe przystanki, dostaje karę za lokalny objazd.
 * Nie wymagamy już identycznego początku i końca całych tras.
 *
 * Im mniejsza kara, tym lepszy kandydat na oś główną.
 */
const karaObjazduWariantu =
    new Map();


wariantyDoWyboruGlownejOsi.forEach(
    wariant => {

        karaObjazduWariantu.set(
            wariant,
            0
        );
    }
);


wariantyDoWyboruGlownejOsi.forEach(
    wariantA => {

        const sciezkaA =
            reprezentatywneSciezkiWariantow.get(
                wariantA
            ) || [];


        wariantyDoWyboruGlownejOsi.forEach(
            wariantB => {

                if (
                    wariantA === wariantB
                ) {

                    return;
                }


                const sciezkaB =
                    reprezentatywneSciezkiWariantow.get(
                        wariantB
                    ) || [];


                /*
                 * Sprawdzamy nie tylko CAŁE trasy, ale również lokalny
                 * przebieg pomiędzy wspólnymi punktami.
                 *
                 * Dzięki temu np. wariant z dodatkowymi przystankami
                 * nie staje się osią główną tylko dlatego, że w tym
                 * kierunku ma inny początek albo inny koniec kursu.
                 */
                const karaLokalna =
                    policzKareLokalnegoObjazduFWTP(
                        sciezkaA,
                        sciezkaB
                    );


                if (
                    karaLokalna > 0
                ) {

                    karaObjazduWariantu.set(
                        wariantA,
                        (
                            karaObjazduWariantu.get(
                                wariantA
                            ) || 0
                        ) +
                        karaLokalna
                    );
                }
            }
        );
    }
);


let mainWariant =
    wariantyDoWyboruGlownejOsi[0] ||
    "";


wariantyDoWyboruGlownejOsi.forEach(
    wariant => {

        const karaAktualnego =
            karaObjazduWariantu.get(
                wariant
            ) || 0;


        const karaGlownego =
            karaObjazduWariantu.get(
                mainWariant
            ) || 0;


        /*
         * Najpierw wybieramy przebieg, który NIE jest objazdem.
         */
        if (
            karaAktualnego <
            karaGlownego
        ) {

            mainWariant =
                wariant;

            return;
        }


        if (
            karaAktualnego >
            karaGlownego
        ) {

            return;
        }


        /*
         * Dopiero gdy dwa warianty są geometrycznie równorzędne,
         * używamy liczby kursów jako drugiego kryterium.
         */
        const liczbaAktualnego =
            liczbaKursowWariantu.get(
                wariant
            ) || 0;


        const liczbaGlownego =
            liczbaKursowWariantu.get(
                mainWariant
            ) || 0;


        if (
            liczbaAktualnego >
            liczbaGlownego
        ) {

            mainWariant =
                wariant;

            return;
        }


        /*
         * Przy pełnym remisie zostawiamy A jako główny,
         * jeżeli A bierze udział w remisie.
         */
        if (
            liczbaAktualnego ===
