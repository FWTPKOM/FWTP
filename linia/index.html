
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FWTP – Rozkład jazdy</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #222;
}

/* =========================================================
   GÓRA
   ========================================================= */

.header {
    max-width: 1100px;
    margin: 0 auto 20px auto;
}

.header h1 {
    margin: 0 0 5px 0;
    font-size: 28px;
}

.header .trasa {
    font-size: 14px;
    color: #555;
    line-height: 1.4;
}

/* =========================================================
   WYBÓR ROZKŁADU
   ========================================================= */

.rozkład-selector {
    max-width: 1100px;
    margin: 0 auto 20px auto;
}

.rozkład-selector button {
    border: 1px solid #ccc;
    background: #f5f5f5;
    padding: 9px 14px;
    margin: 3px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

.rozkład-selector button:hover {
    background: #e8e8e8;
}

.rozkład-selector button.active {
    background: #333;
    color: white;
    border-color: #333;
}

/* =========================================================
   ROZKŁAD
   ========================================================= */

.rozkład {
    max-width: 1100px;
    margin: 0 auto 35px auto;
}

.nazwa-rozkładu {
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 12px 0;
    padding-bottom: 7px;
    border-bottom: 2px solid #222;
}

/* =========================================================
   KIERUNEK
   ========================================================= */

.kierunek {
    margin-bottom: 30px;
}

.kierunek-nazwa {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 8px;
}

/* =========================================================
   PRZYSTANEK
   ========================================================= */

.przystanek {
    border-top: 1px solid #ddd;
    padding: 8px 0 10px 0;
}

.przystanek-header {
    display: flex;
    align-items: baseline;
    margin-bottom: 5px;
}

.przystanek-lp {
    width: 35px;
    color: #777;
    font-size: 12px;
}

.przystanek-nazwa {
    font-weight: 700;
    font-size: 15px;
}

.przystanek-nr {
    margin-left: 7px;
    font-size: 12px;
    color: #777;
}

/* =========================================================
   TABELA GODZIN
   ========================================================= */

.tabela-godzin {
    border-collapse: collapse;
    border-spacing: 0;
    width: auto;
}

.tabela-godzin td {
    padding: 0 !important;
    margin: 0 !important;
    border: 0;
}

/* =========================================================
   GODZINA
   ========================================================= */

.godzina {
    width: 29px;
    min-width: 29px;
    max-width: 29px;

    height: 23px;
    min-height: 23px;
    max-height: 23px;

    padding: 0 !important;
    margin: 0 !important;

    text-align: center;
    vertical-align: middle;

    font-size: 15px;
    font-weight: 700;

    line-height: 23px;
}

/* =========================================================
   MINUTY
   ========================================================= */

.minuty {
    width: 29px;
    min-width: 29px;
    max-width: 29px;

    padding: 0 !important;
    margin: 0 !important;

    display: flex;
    flex-direction: column;
    align-items: center;
}

/* =========================================================
   POJEDYNCZA MINUTA
   ========================================================= */

.minuta {
    position: relative;

    width: 29px;
    min-width: 29px;
    max-width: 29px;

    height: 21px;
    min-height: 21px;
    max-height: 21px;

    padding: 0 !important;
    margin: 0 !important;

    display: flex;
    justify-content: center;
    align-items: flex-end;

    line-height: 21px;

    font-size: 14px;
    font-weight: 600;

    white-space: nowrap;
}

/* =========================================================
   LICZBA MINUTY
   ========================================================= */

.minuta-liczba {
    display: block;

    width: 100%;
    height: 21px;

    text-align: center;

    font-size: 14px;
    font-weight: 600;

    line-height: 21px;

    padding: 0;
    margin: 0;
}

/* =========================================================
   LITERKA WARIANTU
   =========================================================

   WAŻNE:

   Literka jest:
   - mniejsza od minuty,
   - przy minucie,
   - wyrównana DO DOŁU,
   - nie zmienia położenia środka minuty.

   Przykład:

       44A

   gdzie 44 jest idealnie na środku,
   a A znajduje się z prawej strony
   i dotyka dolnej linii.
*/

.minuta-wariant {
    position: absolute;

    left: calc(50% + 7px);
    bottom: 1px;

    font-size: 10px;
    font-weight: 700;

    line-height: 10px;

    color: inherit;

    padding: 0;
    margin: 0;

    vertical-align: bottom;

    pointer-events: none;
}

/* =========================================================
   LEGENDA
   ========================================================= */

.legenda {
    margin-top: 10px;
    padding: 8px 10px;

    border-top: 1px solid #ccc;

    font-size: 12px;
}

.legenda-title {
    font-weight: 700;
    margin-bottom: 4px;
}

.legenda-item {
    margin: 2px 0;
}

.legenda-litera {
    display: inline-block;

    font-weight: 700;
    font-size: 11px;

    margin-right: 5px;
}

/* =========================================================
   BRAK DANYCH
   ========================================================= */

.brak-danych {
    padding: 20px;
    text-align: center;
    color: #777;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 700px) {

    body {
        padding: 10px;
    }

    .header h1 {
        font-size: 22px;
    }

    .przystanek-nazwa {
        font-size: 14px;
    }

    .godzina {
        width: 27px;
        min-width: 27px;
        max-width: 27px;
    }

    .minuty,
    .minuta {
        width: 27px;
        min-width: 27px;
        max-width: 27px;
    }

    .minuta-wariant {
        left: calc(50% + 6px);
    }
}
</style>
</head>

<body>

<div class="header">
    <h1 id="linia">Linia</h1>
    <div class="trasa" id="trasa"></div>
</div>

<div class="rozkład-selector" id="rozkładSelector"></div>

<div id="app">
    <div class="brak-danych">
        Ładowanie rozkładu...
    </div>
</div>


<script>

/* =========================================================
   KONFIGURACJA
   ========================================================= */

/* =========================================================
   ROZPOZNAWANIE NUMERU LINII
   ========================================================= */

function pobierzNumerLinii() {

    const url = window.location;

    /* -----------------------------------------------------
       1. ?linia=127
       ----------------------------------------------------- */

    const parametry =
        new URLSearchParams(url.search);

    let linia =
        parametry.get("linia");

    if (linia && /^\d+$/.test(linia)) {
        return linia;
    }


    /* -----------------------------------------------------
       2. ?127
       ----------------------------------------------------- */

    const search =
        url.search.replace("?", "").trim();

    if (/^\d+$/.test(search)) {
        return search;
    }


    /* -----------------------------------------------------
       3. /linia/127/
       ----------------------------------------------------- */

    const sciezka =
        url.pathname
            .split("/")
            .filter(Boolean);

    for (let i = 0; i < sciezka.length; i++) {

        if (/^\d+$/.test(sciezka[i])) {

            return sciezka[i];
        }
    }


    /* -----------------------------------------------------
       4. /127/
       ----------------------------------------------------- */

    if (sciezka.length > 0) {

        const ostatni =
            sciezka[sciezka.length - 1];

        if (/^\d+$/.test(ostatni)) {

            return ostatni;
        }
    }


    /* -----------------------------------------------------
       5. DOMYŚLNIE
       ----------------------------------------------------- */

    return "127";
}


const numerLinii =
    pobierzNumerLinii();

console.log(
    "Rozpoznana linia:",
    numerLinii
);


/* =========================================================
   ELEMENTY
   ========================================================= */

const app = document.getElementById("app");
const liniaElement = document.getElementById("linia");
const trasaElement = document.getElementById("trasa");
const selectorElement = document.getElementById("rozkładSelector");


/* =========================================================
   POBRANIE JSON
   ========================================================= */

async function pobierzDane() {

    try {

        const response = await fetch(
    `../dane/${numerLinii}.json`
);

        if (!response.ok) {
            throw new Error(
                `Nie można pobrać pliku ${numerLinii}.json`
            );
        }

        const dane = await response.json();

        wyswietlDane(dane);

    } catch (error) {

        console.error(error);

        app.innerHTML = `
            <div class="brak-danych">
                Nie udało się wczytać rozkładu.<br><br>
                ${escapeHTML(error.message)}
            </div>
        `;
    }
}


/* =========================================================
   WYŚWIETLANIE DANYCH
   ========================================================= */

function wyswietlDane(dane) {

    liniaElement.textContent =
        `Linia ${dane.linia}`;

    trasaElement.textContent =
        dane.trasa || "";

    const rozklady =
        Array.isArray(dane.rozkłady)
            ? dane.rozkłady
            : [];

    if (rozklady.length === 0) {

        app.innerHTML = `
            <div class="brak-danych">
                Brak rozkładów.
            </div>
        `;

        return;
    }

    utworzPrzyciskiRozkladow(
        rozklady
    );

    pokazRozklad(
        rozklady,
        0
    );
}


/* =========================================================
   PRZYCISKI ROZKŁADÓW
   ========================================================= */

function utworzPrzyciskiRozkladow(
    rozklady
) {

    selectorElement.innerHTML = "";

    rozklady.forEach(
        (rozklad, index) => {

            const button =
                document.createElement("button");

            button.textContent =
                rozklad.nazwa || `Rozkład ${index + 1}`;

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".rozkład-selector button"
                        )
                        .forEach(
                            b => b.classList.remove(
                                "active"
                            )
                        );

                    button.classList.add("active");

                    pokazRozklad(
                        rozklady,
                        index
                    );
                }
            );

            selectorElement.appendChild(
                button
            );
        }
    );

    const pierwszy =
        selectorElement.querySelector("button");

    if (pierwszy) {
        pierwszy.classList.add("active");
    }
}


/* =========================================================
   POKAŻ ROZKŁAD
   ========================================================= */

function pokazRozklad(
    rozklady,
    index
) {

    const rozklad =
        rozklady[index];

    if (!rozklad) {
        return;
    }

    let html = "";

    html += `
        <div class="rozkład">

            <div class="nazwa-rozkładu">
                ${escapeHTML(
                    rozklad.nazwa || ""
                )}
            </div>
    `;

    const kierunki =
        Array.isArray(rozklad.kierunki)
            ? rozklad.kierunki
            : [];

    kierunki.forEach(
        (kierunek, kierunekIndex) => {

            html += `
                <div class="kierunek">

                    <div class="kierunek-nazwa">
                        ${pobierzNazweKierunku(
                            kierunek,
                            kierunekIndex
                        )}
                    </div>
            `;

            const przystanki =
                Array.isArray(
                    kierunek.przystanki
                )
                    ? kierunek.przystanki
                    : [];

            przystanki.forEach(
                przystanek => {

                    html +=
                        utworzPrzystanek(
                            przystanek
                        );
                }
            );

            /*
               LEGENDA JEST POD KAŻDYM ROZKŁADEM
               DLA DANEGO KIERUNKU.
            */

            html += utworzLegende(
                rozklad
            );

            html += `
                </div>
            `;
        }
    );

    html += `
        </div>
    `;

    app.innerHTML = html;
}


/* =========================================================
   NAZWA KIERUNKU
   ========================================================= */

function pobierzNazweKierunku(
    kierunek,
    index
) {

    if (
        kierunek.nazwa &&
        String(kierunek.nazwa).trim()
    ) {

        return escapeHTML(
            kierunek.nazwa
        );
    }

    /*
       Jeżeli JSON nie ma nazwy kierunku,
       pokazujemy numer kierunku.
    */

    if (index === 0) {
        return "Kierunek 1";
    }

    return "Kierunek 2";
}


/* =========================================================
   PRZYSTANEK
   ========================================================= */

function utworzPrzystanek(
    przystanek
) {

    const nazwa =
        przystanek.nazwa || "";

    const nr =
        przystanek.nr || "";

    const lp =
        przystanek.lp ?? "";

    let html = `
        <div class="przystanek">

            <div class="przystanek-header">

                <span class="przystanek-lp">
                    ${escapeHTML(String(lp))}
                </span>

                <span class="przystanek-nazwa">
                    ${escapeHTML(nazwa)}
                </span>
    `;

    if (nr) {

        html += `
                <span class="przystanek-nr">
                    ${escapeHTML(String(nr))}
                </span>
        `;
    }

    html += `
            </div>
    `;


    /*
       Preferujemy "godziny" z JSON,
       ponieważ właśnie tam znajdują się
       godziny i minuty wraz z wariantami.
    */

    const godziny =
        Array.isArray(przystanek.godziny)
            ? przystanek.godziny
            : [];


    if (godziny.length > 0) {

        html += `
            <table class="tabela-godzin">
                <tbody>
        `;

        godziny.forEach(
            grupa => {

                html += `
                    <tr>
                        <td class="godzina">
                            ${escapeHTML(
                                grupa.godzina
                            )}
                        </td>

                        <td>
                            <div class="minuty">
                `;

                const minuty =
                    Array.isArray(
                        grupa.minuty
                    )
                        ? grupa.minuty
                        : [];

                minuty.forEach(
                    minuta => {

                        html +=
                            utworzMinute(
                                minuta
                            );
                    }
                );

                html += `
                            </div>
                        </td>
                    </tr>
                `;
            }
        );

        html += `
                </tbody>
            </table>
        `;

    } else {

        /*
           Awaryjnie tworzymy godziny z "kursy",
           gdyby JSON nie posiadał tablicy godzin.
        */

        html +=
            utworzGodzinyZKursow(
                przystanek.kursy
            );
    }

    html += `
        </div>
    `;

    return html;
}


/* =========================================================
   MINUTA + WARIANT
   ========================================================= */

function utworzMinute(
    dane
) {

    if (!dane) {
        return "";
    }

    let minuta = "";

    let wariant = "";

    if (
        typeof dane === "string" ||
        typeof dane === "number"
    ) {

        minuta =
            String(dane);

    } else {

        minuta =
            dane.minuta != null
                ? String(dane.minuta)
                : "";

        wariant =
            dane.wariant != null
                ? String(dane.wariant)
                : "";
    }


    /*
       WAŻNE:

       minuta jest osobnym elementem
       zajmującym 100% szerokości.

       wariant jest position:absolute.

       Dzięki temu wariant NIE przesuwa
       środka minuty.
    */

    let html = `
        <div class="minuta">

            <span class="minuta-liczba">
                ${escapeHTML(minuta)}
            </span>
    `;

    if (wariant) {

        html += `
            <span class="minuta-wariant">
                ${escapeHTML(wariant)}
            </span>
        `;
    }

    html += `
        </div>
    `;

    return html;
}


/* =========================================================
   AWARYJNE GODZINY Z KURSÓW
   ========================================================= */

function utworzGodzinyZKursow(
    kursy
) {

    if (!Array.isArray(kursy)) {
        return "";
    }

    const grupy = new Map();

    kursy.forEach(
        kurs => {

            if (!kurs || !kurs.czas) {
                return;
            }

            const czas =
                String(kurs.czas);

            const czesci =
                czas.split(":");

            if (czesci.length < 2) {
                return;
            }

            const godzina =
                czesci[0];

            const minuta =
                czesci[1];

            if (!grupy.has(godzina)) {

                grupy.set(
                    godzina,
                    []
                );
            }

            grupy
                .get(godzina)
                .push({
                    minuta: minuta,
                    wariant:
                        kurs.wariant || ""
                });
        }
    );

    let html = `
        <table class="tabela-godzin">
            <tbody>
    `;

    grupy.forEach(
        (minuty, godzina) => {

            html += `
                <tr>

                    <td class="godzina">
                        ${escapeHTML(godzina)}
                    </td>

                    <td>
                        <div class="minuty">
            `;

            minuty.forEach(
                minuta => {

                    html +=
                        utworzMinute(
                            minuta
                        );
                }
            );

            html += `
                        </div>
                    </td>

                </tr>
            `;
        }
    );

    html += `
            </tbody>
        </table>
    `;

    return html;
}


/* =========================================================
   LEGENDA WARIANTÓW
   ========================================================= */

function utworzLegende(
    rozklad
) {

    const warianty =
        Array.isArray(
            rozklad.warianty
        )
            ? rozklad.warianty
            : [];

    if (warianty.length === 0) {
        return "";
    }

    let html = `
        <div class="legenda">

            <div class="legenda-title">
                Warianty:
            </div>
    `;

    warianty.forEach(
        wariant => {

            if (!wariant) {
                return;
            }

            const litera =
                wariant.litera || "";

            const opis =
                wariant.opis || "";

            html += `
                <div class="legenda-item">

                    <span
                        class="legenda-litera"
                    >
                        ${escapeHTML(
                            String(litera)
                        )}
                    </span>

                    ${escapeHTML(
                        String(opis)
                    )}

                </div>
            `;
        }
    );

    html += `
        </div>
    `;

    return html;
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(
    tekst
) {

    return String(tekst)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================================
   START
   ========================================================= */

pobierzDane();

</script>

</body>
</html>
