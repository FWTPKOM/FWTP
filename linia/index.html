
<!DOCTYPE html>

<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Rozkład jazdy</title>

<link rel="stylesheet"
      href="../css/style.css">

<style>

/* =====================================================
   GŁÓWNY KONTENER
   ===================================================== */

.rozkład {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px;
}


/* =====================================================
   POWRÓT
   ===================================================== */

.powrot {
    display: inline-block;
    margin-bottom: 20px;
    color: #0066cc;
    text-decoration: none;
    font-weight: bold;
}

.powrot:hover {
    text-decoration: underline;
}


/* =====================================================
   NAGŁÓWEK LINII
   ===================================================== */

.naglowek-linii {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 25px;
    margin-bottom: 15px;
}

.numer-linii {
    font-size: 42px;
    font-weight: bold;
    margin: 0 0 8px 0;
}

.trasa {
    font-size: 19px;
    font-weight: bold;
    margin: 0;
}


/* =====================================================
   WYBÓR KIERUNKU
   ===================================================== */

.kierunki {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.kierunek-btn {
    flex: 1;
    padding: 14px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    transition: 0.15s;
}

.kierunek-btn:hover {
    border-color: #0066cc;
}

.kierunek-btn.aktywny {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
}


/* =====================================================
   WYBÓR DNIA
   ===================================================== */

.dni {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.dzien-btn {
    padding: 12px 20px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.dzien-btn:hover {
    border-color: #0066cc;
}

.dzien-btn.aktywny {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
}


/* =====================================================
   KALENDARZ
   ===================================================== */

.kalendarz {
    display: none;
    background: white;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 15px;
    margin-bottom: 15px;
}

.kalendarz input {
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
}


/* =====================================================
   INFORMACJA O TYPIE ROZKŁADU
   ===================================================== */

.typ-rozkładu {
    background: #f7f7f7;
    border: 1px solid #ddd;
    padding: 12px 15px;
    margin-bottom: 15px;
    border-radius: 6px;
    font-size: 14px;
    color: #555;
}


/* =====================================================
   LISTA PRZYSTANKÓW
   ===================================================== */

.przystanki {
    display: flex;
    flex-direction: column;
    gap: 10px;
}


/* =====================================================
   PRZYSTANEK
   ===================================================== */

.przystanek {
    background: white;
    border: 1px solid #ddd;
    border-radius: 7px;
    overflow: hidden;
}

.przystanek-naglowek {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #f2f2f2;
    padding: 13px 15px;
    border-bottom: 1px solid #ddd;
}

.lp {
    min-width: 35px;
    font-weight: bold;
    color: #666;
}

.nazwa-przystanku {
    font-weight: bold;
    font-size: 17px;
}

.numer-przystanku {
    margin-left: auto;
    color: #777;
    font-size: 13px;
}


/* =====================================================
   GODZINY
   UKŁAD:
   
   7  | 23 | 25 | 27 | 28 | 30 | ...
   8  | 00 | 01 | 02 | 03 | 04 | ...
   
   Pierwsza kolumna = godzina
   Pozostałe kolumny = minuty
   ===================================================== */

.godziny {
    display: flex;
    flex-direction: column;
    width: 100%;
    overflow-x: auto;
}


/* =====================================================
   WIERSZ GODZINY
   ===================================================== */

.wiersz-godziny {
    display: grid;

    /*
     * Pierwsza kolumna = godzina
     * Kolejne 10 = minuty
     */

    grid-template-columns:
        55px
        repeat(10, minmax(45px, 1fr));

    width: 100%;
    min-height: 48px;

    border-bottom: 1px solid #eee;
}


/* =====================================================
   KOLUMNA GODZINY
   ===================================================== */

.kolumna-godzina {
    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 17px;
    font-weight: bold;

    background: #f7f7f7;

    border-right: 1px solid #ddd;
}


/* =====================================================
   KOLUMNA MINUTY
   ===================================================== */

.kolumna-minuta {
    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    font-size: 16px;
    font-weight: 500;

    border-right: 1px solid #eee;

    position: relative;

    min-height: 48px;

    box-sizing: border-box;
}

.kolumna-minuta:last-child {
    border-right: none;
}

.kolumna-minuta:hover {
    background: #f5f8fb;
}


/* =====================================================
   MINUTA
   ===================================================== */

.minuta {
    display: block;
    line-height: 18px;
}


/* =====================================================
   WARIANT
   ===================================================== */

.wariant-minuty {
    display: block;

    font-size: 9px;

    line-height: 10px;

    color: #777;

    margin-top: 1px;

    font-weight: bold;

    min-height: 10px;
}


/* =====================================================
   PUSTA MINUTA
   ===================================================== */

.pusta-minuta {
    color: transparent;
}


/* =====================================================
   BRAK GODZIN
   ===================================================== */

.brak-godzin {
    padding: 15px;
    color: #777;
    font-size: 14px;
}


/* =====================================================
   ŁADOWANIE
   ===================================================== */

.loading {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 30px;
    text-align: center;
    color: #666;
}


/* =====================================================
   BŁĄD
   ===================================================== */

.blad {
    background: #fff4f4;
    border: 1px solid #e0aaaa;
    color: #a00000;
    border-radius: 8px;
    padding: 20px;
    line-height: 1.6;
}

.blad strong {
    display: block;
    margin-bottom: 8px;
}


/* =====================================================
   BRAK DANYCH
   ===================================================== */

.brak-danych {
    padding: 30px;
    text-align: center;
    color: #777;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
}


/* =====================================================
   TELEFON
   ===================================================== */

@media (max-width: 800px) {

    .wiersz-godziny {
        grid-template-columns:
            45px
            repeat(6, minmax(42px, 1fr));
    }

}


/* =====================================================
   MAŁY TELEFON
   ===================================================== */

@media (max-width: 550px) {

    .rozkład {
        margin: 15px auto;
    }

    .numer-linii {
        font-size: 34px;
    }

    .trasa {
        font-size: 16px;
    }

    .kierunki {
        flex-direction: column;
    }

    .dni {
        flex-wrap: wrap;
    }

    .dzien-btn {
        flex: 1;
        padding: 11px 10px;
    }


    /*
     * Na telefonie wiersz
     * może przewijać się poziomo.
     */

    .wiersz-godziny {
        grid-template-columns:
            40px
            repeat(4, 55px);

        min-width: 260px;
    }


    .kolumna-godzina {
        font-size: 15px;
    }

    .kolumna-minuta {
        font-size: 15px;
        min-height: 44px;
    }


    .przystanek-naglowek {
        padding: 12px;
    }

    .nazwa-przystanku {
        font-size: 15px;
    }

    .numer-przystanku {
        font-size: 11px;
    }

}

</style>

</head>


<body>


<header class="topbar">

    <div class="logo">
        FWTP
    </div>

    <nav>

        <a href="../">
            Strona główna
        </a>

        <a href="../linie/">
            Linie
        </a>

    </nav>

</header>


<main class="rozkład">


<a
    class="powrot"
    href="../linie/"
>
    ← Linie
</a>


<section class="naglowek-linii">

    <h1
        id="numerLinii"
        class="numer-linii"
    >
        Ładowanie...
    </h1>

    <p
        id="trasa"
        class="trasa"
    >
        Pobieranie danych...
    </p>

</section>


<div
    id="kierunki"
    class="kierunki"
>
</div>


<div class="dni">

    <button
        id="dzisiajBtn"
        class="dzien-btn aktywny"
        onclick="wybierzDzien('dzisiaj')"
    >
        DZISIAJ
    </button>

    <button
        id="jutroBtn"
        class="dzien-btn"
        onclick="wybierzDzien('jutro')"
    >
        JUTRO
    </button>

    <button
        id="kalendarzBtn"
        class="dzien-btn"
        onclick="wybierzDzien('kalendarz')"
    >
        KALENDARZ
    </button>

</div>


<div
    id="kalendarz"
    class="kalendarz"
>

    <input
        type="date"
        id="wybranaData"
    >

</div>


<div
    id="typRozkladu"
    class="typ-rozkładu"
>
    Ładowanie rozkładu...
</div>


<div
    id="przystanki"
    class="przystanki"
>

    <div class="loading">
        Ładowanie przystanków...
    </div>

</div>


</main>


<script>


/* =========================================================
   FWTP – ROZKŁAD JAZDY
   =========================================================

   Obsługiwany JSON:

   rozkłady[]
       kierunki[]
           przystanki[]
               kursy[]
                   numer
                   czas
                   wariant

   ========================================================= */


/* =========================================================
   ZMIENNE
   ========================================================= */

let daneLinii = null;

let numerLinii = null;

let aktualnyKierunek = 0;

let aktualnyDzien = "dzisiaj";

let wybranaData = new Date();


/* =========================================================
   ODCZYT NUMERU LINII
   ========================================================= */

const parametry =
    new URLSearchParams(
        window.location.search
    );


numerLinii =
    parametry.get("linia");


/* =========================================================
   START
   ========================================================= */

if (!numerLinii) {

    pokazBlad(
        "Nie podano numeru linii.",
        "Wróć do listy linii i wybierz linię."
    );

}
else {

    document.getElementById(
        "numerLinii"
    ).textContent =
        numerLinii;

    pobierzDane();

}


/* =========================================================
   POBIERANIE JSON
   ========================================================= */

async function pobierzDane() {

    const adres =
        "../dane/" +
        encodeURIComponent(numerLinii) +
        ".json";


    try {

        console.log(
            "FWTP – pobieram:",
            adres
        );


        const odpowiedz =
            await fetch(
                adres,
                {
                    cache: "no-cache"
                }
            );


        if (!odpowiedz.ok) {

            throw new Error(
                "HTTP " +
                odpowiedz.status +
                " – nie znaleziono pliku " +
                numerLinii +
                ".json"
            );

        }


        const tekst =
            await odpowiedz.text();


        if (!tekst.trim()) {

            throw new Error(
                "Plik JSON jest pusty."
            );

        }


        try {

            daneLinii =
                JSON.parse(tekst);

        }
        catch (bladJSON) {

            console.error(
                "Nieprawidłowy JSON:",
                tekst
            );

            throw new Error(
                "Plik JSON istnieje, ale ma nieprawidłową składnię."
            );

        }


        if (!daneLinii) {

            throw new Error(
                "Nie udało się odczytać danych."
            );

        }


        if (
            !Array.isArray(
                daneLinii.rozkłady
            )
        ) {

            throw new Error(
                "JSON nie zawiera prawidłowego pola 'rozkłady'."
            );

        }


        console.log(
            "FWTP – JSON załadowany:",
            daneLinii
        );


        uruchomStrone();

    }
    catch (blad) {

        console.error(
            "FWTP – błąd:",
            blad
        );


        pokazBlad(
            "Nie udało się załadować linii " +
            numerLinii +
            ".",
            blad.message
        );

    }

}


/* =========================================================
   URUCHOMIENIE STRONY
   ========================================================= */

function uruchomStrone() {


    document.getElementById(
        "numerLinii"
    ).textContent =
        daneLinii.linia ||
        numerLinii;


    document.getElementById(
        "trasa"
    ).textContent =
        daneLinii.trasa ||
        "Rozkład jazdy linii " +
        numerLinii;


    ustawDate();


    aktualnyKierunek = 0;


    pokazRozklad();

}


/* =========================================================
   NORMALIZACJA TEKSTU
   ========================================================= */

function normalizujTekst(tekst) {

    return String(
        tekst || ""
    )
    .toLowerCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    );

}


/* =========================================================
   OKREŚLENIE TYPU DNIA
   ========================================================= */

function okreslTypDnia(data) {

    const dzien =
        data.getDay();


    if (dzien === 6) {

        return "sobota";

    }


    if (dzien === 0) {

        return "niedziela";

    }


    return "roboczy";

}


/* =========================================================
   ZNALEZIENIE ROZKŁADU
   ========================================================= */

function znajdzRozklad() {

    const rozklady =
        daneLinii.rozkłady || [];


    if (rozklady.length === 0) {

        return null;

    }


    const typDnia =
        okreslTypDnia(
            wybranaData
        );


    console.log(
        "FWTP – typ dnia:",
        typDnia
    );


    /* =====================================================
       SOBOTA
       ===================================================== */

    if (typDnia === "sobota") {

        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                nazwa.includes("sobot")
            ) {

                return rozklad;

            }

        }

    }


    /* =====================================================
       NIEDZIELA / ŚWIĘTA
       ===================================================== */

    if (typDnia === "niedziela") {

        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                nazwa.includes("niedziel")
            ) {

                return rozklad;

            }

        }


        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                (
                    nazwa.includes("sobot") &&
                    nazwa.includes("niedziel")
                )
                ||
                nazwa.includes("swieta")
                ||
                nazwa.includes("swiat")
            ) {

                return rozklad;

            }

        }

    }


    /* =====================================================
       PONIEDZIAŁEK – PIĄTEK
       ===================================================== */

    if (typDnia === "roboczy") {

        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                nazwa.includes(
                    "poniedzialku"
                )
                ||
                nazwa.includes(
                    "poniedzialek"
                )
                ||
                nazwa.includes(
                    "poniedzialku do piatku"
                )
                ||
                (
                    nazwa.includes("piat") &&
                    !nazwa.includes("sobot")
                )
            ) {

                return rozklad;

            }

        }

    }


    /* =====================================================
       FALLBACK
       ===================================================== */

    return rozklady[0];

}


/* =========================================================
   GENEROWANIE KIERUNKÓW
   ========================================================= */

function generujKierunki() {

    const kontener =
        document.getElementById(
            "kierunki"
        );


    kontener.innerHTML = "";


    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !Array.isArray(
            rozklad.kierunki
        )
    ) {

        return;

    }


    const kierunki =
        rozklad.kierunki;


    kierunki.forEach(
        function(
            kierunek,
            index
        ) {

            const przycisk =
                document.createElement(
                    "button"
                );


            przycisk.className =
                "kierunek-btn";


            if (
                index ===
                aktualnyKierunek
            ) {

                przycisk.classList.add(
                    "aktywny"
                );

            }


            const przystanki =
                Array.isArray(
                    kierunek.przystanki
                )
                    ?
                    kierunek.przystanki
                    :
                    [];


            let nazwaKierunku =
                "";


            if (
                przystanki.length > 0
            ) {

                const ostatni =
                    przystanki[
                        przystanki.length - 1
                    ];


                nazwaKierunku =
                    ostatni.nazwa ||
                    "";

            }


            if (
                !nazwaKierunku
            ) {

                nazwaKierunku =
                    "Kierunek " +
                    (
                        index + 1
                    );

            }


            przycisk.textContent =
                nazwaKierunku;


            przycisk.onclick =
                function() {

                    zmienKierunek(
                        index
                    );

                };


            kontener.appendChild(
                przycisk
            );

        }
    );

}


/* =========================================================
   ZMIANA KIERUNKU
   ========================================================= */

function zmienKierunek(index) {

    aktualnyKierunek =
        index;


    pokazRozklad();

}


/* =========================================================
   WYBÓR DNIA
   ========================================================= */

function wybierzDzien(dzien) {

    aktualnyDzien =
        dzien;


    const przyciski =
        document.querySelectorAll(
            ".dzien-btn"
        );


    przyciski.forEach(
        function(przycisk) {

            przycisk.classList.remove(
                "aktywny"
            );

        }
    );


    const kalendarz =
        document.getElementById(
            "kalendarz"
        );


    kalendarz.style.display =
        "none";


    /* =====================================================
       DZISIAJ
       ===================================================== */

    if (
        dzien === "dzisiaj"
    ) {

        document.getElementById(
            "dzisiajBtn"
        ).classList.add(
            "aktywny"
        );


        wybranaData =
            new Date();

    }


    /* =====================================================
       JUTRO
       ===================================================== */

    if (
        dzien === "jutro"
    ) {

        document.getElementById(
            "jutroBtn"
        ).classList.add(
            "aktywny"
        );


        wybranaData =
            new Date();


        wybranaData.setDate(
            wybranaData.getDate() + 1
        );

    }


    /* =====================================================
       KALENDARZ
       ===================================================== */

    if (
        dzien === "kalendarz"
    ) {

        document.getElementById(
            "kalendarzBtn"
        ).classList.add(
            "aktywny"
        );


        kalendarz.style.display =
            "block";


        const input =
            document.getElementById(
                "wybranaData"
            );


        input.value =
            formatujDateInput(
                wybranaData
            );

    }


    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !rozklad.kierunki ||
        !rozklad.kierunki[
            aktualnyKierunek
        ]
    ) {

        aktualnyKierunek = 0;

    }


    pokazRozklad();

}


/* =========================================================
   KALENDARZ – ZMIANA DATY
   ========================================================= */

document
    .getElementById(
        "wybranaData"
    )
    .addEventListener(
        "change",
        function() {

            if (
                !this.value
            ) {

                return;

            }


            const czesci =
                this.value.split("-");


            wybranaData =
                new Date(
                    Number(
                        czesci[0]
                    ),
                    Number(
                        czesci[1]
                    ) - 1,
                    Number(
                        czesci[2]
                    )
                );


            const rozklad =
                znajdzRozklad();


            if (
                !rozklad ||
                !rozklad.kierunki ||
                !rozklad.kierunki[
                    aktualnyKierunek
                ]
            ) {

                aktualnyKierunek = 0;

            }


            pokazRozklad();

        }
    );


/* =========================================================
   USTAWIENIE DATY
   ========================================================= */

function ustawDate() {

    wybranaData =
        new Date();

}


/* =========================================================
   POKAZANIE ROZKŁADU
   ========================================================= */

function pokazRozklad() {

    if (!daneLinii) {

        return;

    }


    const rozklad =
        znajdzRozklad();


    generujKierunki();


    const kontener =
        document.getElementById(
            "przystanki"
        );


    const typ =
        document.getElementById(
            "typRozkladu"
        );


    if (!rozklad) {

        typ.textContent =
            "Brak rozkładu";


        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak danych rozkładu.' +
            '</div>';


        return;

    }


    typ.textContent =
        rozklad.nazwa ||
        "Rozkład jazdy";


    const kierunki =
        rozklad.kierunki || [];


    if (
        kierunki.length === 0
    ) {

        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Ten rozkład nie zawiera kierunków.' +
            '</div>';


        return;

    }


    if (
        aktualnyKierunek < 0 ||
        aktualnyKierunek >=
        kierunki.length
    ) {

        aktualnyKierunek = 0;

    }


    const kierunek =
        kierunki[
            aktualnyKierunek
        ];


    const przystanki =
        kierunek.przystanki || [];


    kontener.innerHTML = "";


    if (
        przystanki.length === 0
    ) {

        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak przystanków w tym kierunku.' +
            '</div>';


        return;

    }


    /* =====================================================
       PRZYSTANKI
       ===================================================== */

    przystanki.forEach(
        function(
            przystanek,
            index
        ) {

            const blok =
                document.createElement(
                    "div"
                );


            blok.className =
                "przystanek";


            /* =================================================
               NAGŁÓWEK
               ================================================= */

            const naglowek =
                document.createElement(
                    "div"
                );


            naglowek.className =
                "przystanek-naglowek";


            /* =================================================
               LP
               ================================================= */

            const lp =
                document.createElement(
                    "span"
                );


            lp.className =
                "lp";


            lp.textContent =
                przystanek.lp ||
                (
                    index + 1
                );


            /* =================================================
               NAZWA
               ================================================= */

            const nazwa =
                document.createElement(
                    "span"
                );


            nazwa.className =
                "nazwa-przystanku";


            nazwa.textContent =
                przystanek.nazwa ||
                "Przystanek";


            /* =================================================
               NUMER
               ================================================= */

            const nr =
                document.createElement(
                    "span"
                );


            nr.className =
                "numer-przystanku";


            if (
                przystanek.nr !==
                undefined &&
                przystanek.nr !==
                null &&
                String(
                    przystanek.nr
                ).trim() !== ""
            ) {

                nr.textContent =
                    "nr " +
                    przystanek.nr;

            }


            naglowek.appendChild(
                lp
            );


            naglowek.appendChild(
                nazwa
            );


            naglowek.appendChild(
                nr
            );


            blok.appendChild(
                naglowek
            );


            /* =================================================
               GODZINY
               ================================================= */

            const godziny =
                document.createElement(
                    "div"
                );


            godziny.className =
                "godziny";


            const kursy =
                Array.isArray(
                    przystanek.kursy
                )
                    ?
                    przystanek.kursy
                    :
                    [];


            if (
                kursy.length === 0
            ) {

                godziny.innerHTML =
                    '<div class="brak-godzin">' +
                    'Brak odjazdów' +
                    '</div>';

            }
            else {

                /*
                 * =================================================
                 * GRUPOWANIE KURSÓW WEDŁUG GODZINY
                 * =================================================
                 */

                const grupyGodzin = {};


                kursy.forEach(
                    function(kurs) {

                        /*
                         * Kurs musi być obiektem.
                         */

                        if (
                            !kurs ||
                            typeof kurs !==
                            "object"
                        ) {

                            return;

                        }


                        /*
                         * Pobieramy czas.
                         *
                         * WAŻNE:
                         *
                         * Pusta wartość oznacza
                         * pustą komórkę.
                         *
                         * Natomiast 00:00 jest
                         * prawidłowym czasem.
                         */

                        let czas =
                            kurs.czas;


                        if (
                            czas === null ||
                            czas === undefined
                        ) {

                            return;

                        }


                        czas =
                            String(
                                czas
                            ).trim();


                        /*
                         * PUSTA KOMÓRKA
                         */

                        if (
                            czas === ""
                        ) {

                            return;

                        }


                        /*
                         * Akceptujemy:
                         *
                         * 5:10
                         * 05:10
                         * 23:59
                         * 00:00
                         */

                        const dopasowanie =
                            czas.match(
                                /^(\d{1,2}):(\d{2})$/
                            );


                        if (
                            !dopasowanie
                        ) {

                            console.warn(
                                "FWTP – pominięto nieprawidłowy czas:",
                                czas,
                                kurs
                            );

                            return;

                        }


                        const godzina =
                            Number(
                                dopasowanie[1]
                            );


                        const minuta =
                            dopasowanie[2];


                        /*
                         * Sprawdzamy poprawność
                         * godziny i minuty.
                         */

                        if (
                            !Number.isFinite(
                                godzina
                            ) ||
                            godzina < 0 ||
                            godzina > 23
                        ) {

                            return;

                        }


                        const minutaNumber =
                            Number(
                                minuta
                            );


                        if (
                            !Number.isFinite(
                                minutaNumber
                            ) ||
                            minutaNumber < 0 ||
                            minutaNumber > 59
                        ) {

                            return;

                        }


                        /*
                         * Tworzymy grupę.
                         */

                        if (
                            !grupyGodzin[
                                godzina
                            ]
                        ) {

                            grupyGodzin[
                                godzina
                            ] = [];

                        }


                        grupyGodzin[
                            godzina
                        ].push({

                            minuta:
                                minuta,

                            minutaNumber:
                                minutaNumber,

                            wariant:
                                kurs.wariant ||
                                "",

                            numer:
                                kurs.numer ||
                                ""

                        });

                    }
                );


                /*
                 * =================================================
                 * SORTOWANIE GODZIN
                 * =================================================
                 */

                const posortowaneGodziny =
                    Object.keys(
                        grupyGodzin
                    )
                    .map(
                        Number
                    )
                    .sort(
                        function(a, b) {

                            return a - b;

                        }
                    );


                if (
                    posortowaneGodziny.length === 0
                ) {

                    godziny.innerHTML =
                        '<div class="brak-godzin">' +
                        'Brak poprawnych godzin' +
                        '</div>';

                }
                else {


                    /*
                     * =================================================
                     * TWORZENIE WIERSZY
                     * =================================================
                     *
                     * Maksymalnie 10 minut
                     * w jednym wierszu.
                     *
                     * Przykład:
                     *
                     * 7 | 23 | 25 | 27 | 28 | 30 | 35 | 40
                     *
                     * Jeżeli jest więcej:
                     *
                     * 7 | 23 | 25 | 27 | 28 | 30 | 35 | 40 | 45 | 50 | 55
                     * 7 | 58
                     *
                     * =================================================
                     */


                    posortowaneGodziny.forEach(
                        function(godzina) {

                            const lista =
                                grupyGodzin[
                                    godzina
                                ];


                            /*
                             * Sortujemy minuty.
                             */

                            lista.sort(
                                function(a, b) {

                                    return (
                                        a.minutaNumber -
                                        b.minutaNumber
                                    );

                                }
                            );


                            /*
                             * Dzielimy na grupy
                             * po 10 kursów.
                             */

                            const wielkoscGrupy =
                                10;


                            for (
                                let poczatek = 0;
                                poczatek < lista.length;
                                poczatek += wielkoscGrupy
                            ) {

                                const grupa =
                                    lista.slice(
                                        poczatek,
                                        poczatek +
                                        wielkoscGrupy
                                    );


                                /*
                                 * Tworzymy wiersz.
                                 */

                                const wiersz =
                                    document.createElement(
                                        "div"
                                    );


                                wiersz.className =
                                    "wiersz-godziny";


                                /*
                                 * =================================================
                                 * KOLUMNA GODZINY
                                 * =================================================
                                 */

                                const kolumnaGodziny =
                                    document.createElement(
                                        "div"
                                    );


                                kolumnaGodziny.className =
                                    "kolumna-godzina";


                                kolumnaGodziny.textContent =
                                    String(
                                        godzina
                                    );


                                wiersz.appendChild(
                                    kolumnaGodziny
                                );


                                /*
                                 * =================================================
                                 * KOLUMNY MINUT
                                 * =================================================
                                 */

                                grupa.forEach(
                                    function(kurs) {

                                        const kolumna =
                                            document.createElement(
                                                "div"
                                            );


                                        kolumna.className =
                                            "kolumna-minuta";


                                        /*
                                         * MINUTA
                                         */

                                        const minuta =
                                            document.createElement(
                                                "span"
                                            );


                                        minuta.className =
                                            "minuta";


                                        minuta.textContent =
                                            kurs.minuta;


                                        kolumna.appendChild(
                                            minuta
                                        );


                                        /*
                                         * =================================================
                                         * WARIANT
                                         * =================================================
                                         *
                                         * Jeżeli kurs ma wariant:
                                         *
                                         * D
                                         * C
                                         * itd.
                                         *
                                         * pokazujemy go pod minutą.
                                         */

                                        const wariant =
                                            document.createElement(
                                                "span"
                                            );


                                        wariant.className =
                                            "wariant-minuty";


                                        if (
                                            kurs.wariant &&
                                            String(
                                                kurs.wariant
                                            ).trim() !== ""
                                        ) {

                                            wariant.textContent =
                                                String(
                                                    kurs.wariant
                                                ).trim();

                                        }
                                        else {

                                            /*
                                             * Pusta przestrzeń
                                             * utrzymuje wysokość
                                             * wszystkich komórek.
                                             */

                                            wariant.textContent =
                                                "";

                                        }


                                        kolumna.appendChild(
                                            wariant
                                        );


                                        /*
                                         * =================================================
                                         * TOOLTIP – NUMER KURSU
                                         * =================================================
                                         */

                                        if (
                                            kurs.numer &&
                                            String(
                                                kurs.numer
                                            ).trim() !== ""
                                        ) {

                                            kolumna.title =
                                                "Kurs " +
                                                String(
                                                    kurs.numer
                                                );

                                        }


                                        wiersz.appendChild(
                                            kolumna
                                        );

                                    }
                                );


                                /*
                                 * =================================================
                                 * PUSTE KOLUMNY
                                 * =================================================
                                 *
                                 * Jeżeli w grupie jest mniej
                                 * niż 10 minut, uzupełniamy
                                 * puste miejsca.
                                 *
                                 * Dzięki temu układ pozostaje
                                 * równy.
                                 */

                                for (
                                    let i = grupa.length;
                                    i < wielkoscGrupy;
                                    i++
                                ) {

                                    const pusta =
                                        document.createElement(
                                            "div"
                                        );


                                    pusta.className =
                                        "kolumna-minuta pusta-minuta";


                                    pusta.innerHTML =
                                        "&nbsp;";


                                    wiersz.appendChild(
                                        pusta
                                    );

                                }


                                godziny.appendChild(
                                    wiersz
                                );

                            }

                        }
                    );

                }

            }


            blok.appendChild(
                godziny
            );


            kontener.appendChild(
                blok
            );

        }
    );

}


/* =========================================================
   FORMAT DATY
   ========================================================= */

function formatujDateInput(data) {

    const rok =
        data.getFullYear();


    const miesiac =
        String(
            data.getMonth() + 1
        )
        .padStart(
            2,
            "0"
        );


    const dzien =
        String(
            data.getDate()
        )
        .padStart(
            2,
            "0"
        );


    return (
        rok +
        "-" +
        miesiac +
        "-" +
        dzien
    );

}

    tytul,

    document.getElementById(

    ).innerHTML =

    document.getElementById(
        "typRozkladu"

    document.getElementById(
        "przystanki"
    ).innerHTML =

        '<div class="blad">' +

        '<strong>' +
        tytul +
        '</strong>' +

        opis +

        '</div>';

}
