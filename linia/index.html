}


/* =========================================================
   DATA
   ========================================================= */

document
    .getElementById(
        "wybranaData"
    )
    .addEventListener(
        "change",
        function () {

            if (!this.value)
                return;


            const czesci =
                this.value.split(
                    "-"
                );


            wybranaData =
                new Date(
                    Number(
                        czesci[0]
                    ),
                    Number(
                        czesci[1]
                    ) - 1,
                    Number(
                        czesci[2]
                    )
                );


            aktualnyDzien =
                "kalendarz";


            /*
             * Zmiana daty może zmienić trasę.
             */

            ustawWybranyPrzystanek(
                null
            );


            aktualnyWariant =
                null;


            widokKursuAktywny =
                false;


            document
                .querySelectorAll(
                    ".dzien-btn"
                )
                .forEach(
                    b =>
                        b.classList.remove(
                            "aktywny"
                        )
                );


            const kalendarzBtn =
                document.getElementById(
                    "kalendarzBtn"
                );


            if (kalendarzBtn) {

                kalendarzBtn.classList.add(
                    "aktywny"
                );
            }


            pokazRozklad();
        }
    );


function formatujDateInput(
    data
) {

    return (
        data.getFullYear() +
        "-" +
        String(
            data.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +
        "-" +
        String(
            data.getDate()
        ).padStart(
            2,
            "0"
        )
    );
}


/* =========================================================
   WARIANT
   ========================================================= */

function pobierzWariant(k) {

    if (
        !k ||
        typeof k !== "object"
    ) {

        return "";
    }


    const wariant =
        k.wariant;


    if (
        wariant &&
        typeof wariant === "object"
    ) {

        return String(
            wariant.litera ||
            wariant.nazwa ||
            ""
        )
            .trim()
            .toUpperCase();
    }


    return String(
        wariant ||
        ""
    )
        .trim()
        .toUpperCase();
}


/* =========================================================
   WARIANTY
   ========================================================= */

function zbierzWariantyDlaKierunku(
    kierunek
) {

    const set =
        new Set();


    (
        kierunek &&
        kierunek.przystanki
            ? kierunek.przystanki
            : []
    ).forEach(
        p =>
            (
                p.kursy ||
                []
            ).forEach(
                k => {

                    const w =
                        pobierzWariant(
                            k
                        );


                    if (
                        w
                    ) {

                        set.add(
                            w
                        );
                    }
                }
            )
    );


    return Array
        .from(set)
        .sort(
            (
                a,
                b
            ) =>
                a.localeCompare(
                    b,
                    "pl",
                    {
                        numeric: true
                    }
                )
        );
}


/* =========================================================
   DOMYŚLNY WARIANT
   ========================================================= */

function znajdzDomyslnyWariant(
    kierunek
) {

    const wariantStarty =
        new Map();


    (
        kierunek &&
        kierunek.przystanki
            ? kierunek.przystanki
            : []
    ).forEach(
        (
            przystanek,
            index
        ) => {

            (
                przystanek.kursy ||
                []
            ).forEach(
                kurs => {

                    const wariant =
                        pobierzWariant(
                            kurs
                        );


                    if (
                        wariant &&
                        !wariantStarty.has(
                            wariant
                        )
                    ) {

                        wariantStarty.set(
                            wariant,
                            index
                        );
                    }
                }
            );
        }
    );


    const lista =
        Array.from(
            wariantStarty.entries()
        );


    if (
        lista.length === 0
    )
        return null;


    lista.sort(
        (
            a,
            b
        ) => {

            if (
                a[1] !==
                b[1]
            ) {

                return (
                    a[1] -
                    b[1]
                );
            }


            return a[0].localeCompare(
                b[0],
                "pl",
                {
                    numeric: true
                }
            );
        }
    );


    return lista[0][0];
}


/* =========================================================
   CZAS NA MINUTY
   ========================================================= */

function czasNaMinuty(
    czas
) {

    const dop =
        String(
            czas || ""
        )
            .trim()
            .match(
                /^(\d{1,2}):(\d{2})$/
            );


    if (!dop)
        return null;


    const godzina =
        Number(
            dop[1]
        );


    const minuta =
        Number(
            dop[2]
        );


    if (
        godzina < 0 ||
        godzina > 23 ||
        minuta < 0 ||
        minuta > 59
    ) {

        return null;
    }


    return (
        godzina * 60 +
        minuta
    );
}


/* =========================================================
   ZNAJDOWANIE PIERWSZEGO KURSU
   ========================================================= */

function znajdzKursBazowy(
    kierunek,
    wariant
) {

    if (!kierunek)
        return null;


    const przystanki =
        kierunek.przystanki ||
        [];


    const mapaKursow =
        new Map();


    przystanki.forEach(
        (
            p,
            index
        ) => {

            (
                p.kursy ||
                []
            ).forEach(
                k => {

                    if (
                        k.numer === undefined ||
                        k.numer === null
                    ) {

                        return;
                    }


                    const numer =
                        String(
                            k.numer
                        ).trim();


                    if (!numer)
                        return;


                    const kursWariant =
                        pobierzWariant(
                            k
                        );


                    const klucz =
                        numer +
                        "||" +
                        kursWariant;


                    if (
                        !mapaKursow.has(
                            klucz
                        )
                    ) {

                        mapaKursow.set(
                            klucz,
                            {
                                numer:
                                    k.numer,

                                wariant:
                                    kursWariant,

                                punkty:
                                    []
                            }
                        );
                    }


                    mapaKursow
                        .get(klucz)
                        .punkty
                        .push(
                            {
                                index:
                                    index,

                                czas:
                                    k.czas
                            }
                        );
                }
            );
        }
    );


    const wszystkieKursy =
        Array.from(
            mapaKursow.values()
        );


    wszystkieKursy.forEach(
        kurs => {

            kurs.punkty.sort(
                (
                    a,
                    b
                ) =>
                    a.index -
                    b.index
            );


            const pierwszy =
                kurs.punkty.find(
                    punkt =>
                        czasNaMinuty(
                            punkt.czas
                        ) !== null
                );


            kurs.startIndex =
                pierwszy
                    ? pierwszy.index
                    : 999999;


            kurs.startMinuty =
                pierwszy
                    ? czasNaMinuty(
                        pierwszy.czas
                    )
                    : null;
        }
    );


    const szukanyWariant =
        String(
            wariant || ""
        )
            .trim()
            .toUpperCase();


    const kandydaci =
        wszystkieKursy.filter(
            kurs =>
                kurs.wariant ===
                szukanyWariant
        );


    if (
        kandydaci.length === 0
    ) {

        return null;
    }


    kandydaci.sort(
        (
            a,
            b
        ) => {

            const aa =
                a.startMinuty === null
                    ? 999999
                    : a.startMinuty;


            const bb =
                b.startMinuty === null
                    ? 999999
                    : b.startMinuty;


            if (
                aa !== bb
            ) {

                return aa - bb;
            }


            return (
                a.startIndex -
                b.startIndex
            );
        }
    );


    return (
        kandydaci[0] ||
        null
    );
}


/* =========================================================
   POBIERANIE CZASÓW KURSU
   ========================================================= */

function pobierzCzasyKursu(
    kierunek,
    kurs
) {

    const przystanki =
        kierunek &&
        Array.isArray(
            kierunek.przystanki
        )
            ? kierunek.przystanki
            : [];


    const czasy =
        new Array(
            przystanki.length
        ).fill(
            null
        );


    if (!kurs)
        return czasy;


    /*
     * Jeżeli kurs posiada własną tablicę punktów,
     * korzystamy z indeksów zapisanych w JSON.
     */

    if (
        Array.isArray(
            kurs.punkty
        )
    ) {

        kurs.punkty.forEach(
            punkt => {

                if (!punkt)
                    return;


                const index =
                    Number(
                        punkt.index
                    );


                if (
                    !Number.isInteger(
                        index
                    ) ||
                    index < 0 ||
                    index >= przystanki.length
                ) {
                    return;
                }


                if (
                    punkt.czas !== undefined &&
                    punkt.czas !== null
                ) {

                    czasy[index] =
                        String(
                            punkt.czas
                        ).trim();
                }
            }
        );
    }


    /*
     * Awaryjnie obsługujemy również kurs zapisany
     * bez tablicy punktów.
     */

    if (
        kurs.czas !== undefined &&
        kurs.czas !== null
    ) {

        const pierwszy =
            czasy.findIndex(
                x =>
                    x === null
            );


        if (
            pierwszy >= 0
        ) {

            czasy[pierwszy] =
                String(
                    kurs.czas
                ).trim();
        }
    }


    return czasy;
}


/* =========================================================
   OBLICZANIE SUMOWANYCH CZASÓW
   ========================================================= */

function obliczSumowaneCzasy(
    czasy
) {

    const wynik =
        new Array(
            czasy.length
        ).fill(
            null
        );


    let pierwszyCzas =
        null;

    let poprzedni =
        null;


    for (
        let i = 0;
        i < czasy.length;
        i++
    ) {

        const minuty =
            czasNaMinuty(
                czasy[i]
            );


        if (
            minuty === null
        ) {
            continue;
        }


        if (
            pierwszyCzas === null
        ) {

            pierwszyCzas =
                minuty;

            poprzedni =
                minuty;

            wynik[i] =
                0;

            continue;
        }


        let roznica =
            minuty -
            poprzedni;


        /*
         * Przejście przez północ.
         */

        if (
            roznica < 0
        ) {

            roznica +=
                24 * 60;
        }


        /*
         * Jeżeli rozkład ma bardzo nietypową
         * kolejność czasów, zabezpieczamy wynik.
         */

        if (
            roznica < 0
        ) {

            roznica = 0;
        }


        wynik[i] =
            wynik[
                wynik.findIndex(
                    x =>
                        x !== null &&
                        x >= 0
                )
            ] !== undefined
                ? null
                : null;


        poprzedni =
            minuty;
    }


    /*
     * Drugi przebieg jest prostszy i stabilniejszy:
     * liczymy czas względem pierwszego odjazdu.
     */

    let pierwszy =
        null;

    let poprzedniCzas =
        null;

    let suma =
        0;


    for (
        let i = 0;
        i < czasy.length;
        i++
    ) {

        const minuty =
            czasNaMinuty(
                czasy[i]
            );


        if (
            minuty === null
        ) {

            continue;
        }


        if (
            pierwszy === null
        ) {

            pierwszy =
                minuty;

            poprzedniCzas =
                minuty;

            suma =
                0;

            wynik[i] =
                0;

            continue;
        }


        let roznica =
            minuty -
            poprzedniCzas;


        if (
            roznica < 0
        ) {

            roznica +=
                24 * 60;
        }


        suma +=
            roznica;


        wynik[i] =
            suma;


        poprzedniCzas =
            minuty;
    }


    return wynik;
}


/* =========================================================
   AKTUALIZACJA HISTORII URL
   ========================================================= */

function aktualizujHistorieURL(
    przystanekId
) {

    const url =
        new URL(
            window.location.href
        );


    url.searchParams.set(
        "linia",
        numerLinii
    );


    url.searchParams.set(
        "kierunek",
        String(
            aktualnyKierunek
        )
    );


    if (
        przystanekId
    ) {

        if (
            przystanekId.nr
        ) {

            url.searchParams.set(
                "przystanek",
                przystanekId.nr
            );

        } else if (
            przystanekId.lp
        ) {

            url.searchParams.set(
                "przystanek",
                "lp:" +
                przystanekId.lp
            );

        } else if (
            przystanekId.index !== null &&
            przystanekId.index !== undefined
        ) {

            url.searchParams.set(
                "przystanek",
                "idx:" +
                przystanekId.index
            );

        } else if (
            przystanekId.nazwa
        ) {

            url.searchParams.set(
                "przystanek",
                przystanekId.nazwa
            );

        } else {

            url.searchParams.delete(
                "przystanek"
            );
        }

    } else {

        url.searchParams.delete(
            "przystanek"
        );
    }


    history.pushState(
        {},
        "",
        url
    );
}


/* =========================================================
   POKAZANIE ROZKŁADU
   ========================================================= */

function pokazRozklad() {

    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !Array.isArray(
            rozklad.kierunki
        )
    ) {

        pokazBlad(
            "Brak rozkładu.",
            "Dla wybranej daty nie znaleziono kursów."
        );

        return;
    }


    generujKierunki();


    /*
     * Jeżeli jesteśmy w widoku całego kursu,
     * nie przełączamy automatycznie widoku.
     */

    if (
        widokKursuAktywny
    ) {

        return;
    }


    /*
     * Jeżeli użytkownik ma wybrany przystanek,
     * próbujemy znaleźć go ponownie w aktualnym
     * kierunku.
     */

    if (
        wybranyPrzystanek
    ) {

        const kierunek =
            rozklad.kierunki[
                aktualnyKierunek
            ];


        if (
            kierunek &&
            Array.isArray(
                kierunek.przystanki
            )
        ) {

            let przystanek =
                null;


            if (
                wybranyPrzystanekId
            ) {

                if (
                    wybranyPrzystanekId.nr &&
                    wybranyPrzystanekId.nazwa
                ) {

                    przystanek =
                        kierunek.przystanki.find(
                            p =>
                                String(
                                    p.nr || ""
                                ).trim() ===
                                String(
                                    wybranyPrzystanekId.nr
                                ).trim() &&
                                normalizujTekst(
                                    p.nazwa
                                ) ===
                                normalizujTekst(
                                    wybranyPrzystanekId.nazwa
                                )
                        );
                }
            }


            /*
             * Jeżeli nie znaleziono po numerze i nazwie,
             * próbujemy po zapamiętanym indeksie.
             */

            if (
                !przystanek &&
                wybranyPrzystanekIndex !== null &&
                wybranyPrzystanekIndex !== undefined
            ) {

                const idx =
                    Number(
                        wybranyPrzystanekIndex
                    );


                if (
                    Number.isInteger(idx) &&
                    idx >= 0 &&
                    idx < kierunek.przystanki.length
                ) {

                    przystanek =
                        kierunek.przystanki[idx];
                }
            }


            if (
                przystanek
            ) {

                const index =
                    kierunek.przystanki.indexOf(
                        przystanek
                    );


                ustawWybranyPrzystanek(
                    przystanek,
                    index
                );


                pokazRozkladWybranegoPrzystanku(
                    rozklad,
                    przystanek
                );

                return;
            }
        }
    }


    pokazListePrzystankow(
        rozklad
    );
}


/* =========================================================
   CZY PRZYSTANEK JEST NA ŻĄDANIE
   ========================================================= */

function czyPrzystanekNaZadanie(
    p
) {

    if (!p)
        return false;


    const typ =
        String(
            p.typ || ""
        )
            .trim()
            .toUpperCase();


    if (
        typ === "NŻ" ||
        typ === "NZ"
    ) {

        return true;
    }


    if (
        p.naZadanie === true ||
        p.nz === true
    ) {

        return true;
    }


    const nazwa =
        String(
            p.nazwa || ""
        );


    return (
        nazwa.includes("(NŻ)") ||
        nazwa.includes("(NZ)")
    );
}


/* =========================================================
   LISTA PRZYSTANKÓW
   ========================================================= */

function pokazListePrzystankow(
    rozklad
) {

    const kierunek =
        rozklad.kierunki[
            aktualnyKierunek
        ];


    if (!kierunek) {

        pokazBlad(
            "Brak kierunku.",
            "Nie znaleziono wybranego kierunku."
        );

        return;
    }


    const kierunekDlaDaty =
        przygotujKierunekDlaDaty(
            kierunek,
            wybranaData
        );


    if (
        !kierunekDlaDaty ||
        !Array.isArray(
            kierunekDlaDaty.przystanki
        ) ||
        kierunekDlaDaty.przystanki.length === 0
    ) {

        pokazBlad(
            "Brak kursów.",
            "Dla wybranej daty nie znaleziono kursów."
        );

        return;
    }


    const trasaElement =
        document.getElementById(
            "trasa"
        );


    if (
        trasaElement
    ) {

        trasaElement.textContent =
            kierunekDlaDaty.nazwa ||
            kierunekDlaDaty.kierunek ||
            "";
    }


    const dni =
        document.querySelector(
            ".dni"
        );


    if (
        dni
    ) {

        dni.style.display =
            "flex";
    }


    const kalendarz =
        document.getElementById(
            "kalendarz"
        );


    if (
        kalendarz &&
        aktualnyDzien !== "kalendarz"
    ) {

        kalendarz.style.display =
            "none";
    }


    /*
     * -----------------------------------------------------
     * WARIANTY
     * -----------------------------------------------------
     */

    const warianty =
        zbierzWariantyDlaKierunku(
            kierunekDlaDaty
        );


    const kontenerWariantow =
        document.getElementById(
            "warianty"
        );


    if (
        kontenerWariantow
    ) {

        kontenerWariantow.innerHTML =
            "";


        if (
            warianty.length > 1
        ) {

            kontenerWariantow.style.display =
                "flex";


            warianty.forEach(
                wariant => {

                    const btn =
                        document.createElement(
                            "button"
                        );


                    btn.className =
                        "wariant-btn";


                    if (
                        wariant ===
                        aktualnyWariant
                    ) {

                        btn.classList.add(
                            "aktywny"
                        );
                    }


                    btn.textContent =
                        wariant;


                    btn.onclick =
                        () => {

                            aktualnyWariant =
                                wariant;


                            widokKursuAktywny =
                                false;


                            pokazRozklad();
                        };


                    kontenerWariantow.appendChild(
                        btn
                    );
                }
            );


        } else {

            kontenerWariantow.style.display =
                "none";
        }
    }


    /*
     * Jeżeli wariant nie został wybrany,
     * wybieramy domyślny.
     */

    if (
        !aktualnyWariant ||
        !warianty.includes(
            aktualnyWariant
        )
    ) {

        aktualnyWariant =
            znajdzDomyslnyWariant(
                kierunekDlaDaty
            );
    }


    /*
     * -----------------------------------------------------
     * KURS BAZOWY DLA WYBRANEGO WARIANTU
     * -----------------------------------------------------
     */

    const kursBazowy =
        znajdzKursBazowy(
            kierunekDlaDaty,
            aktualnyWariant
        );


    const czasyKursu =
        pobierzCzasyKursu(
            kierunekDlaDaty,
            kursBazowy
        );


    const sumowaneCzasy =
        obliczSumowaneCzasy(
            czasyKursu
        );


    /*
     * -----------------------------------------------------
     * USTALENIE PIERWSZEGO I OSTATNIEGO AKTYWNEGO
     * PRZYSTANKU WYBRANEGO WARIANTU
     * -----------------------------------------------------
     */

    let pierwszyAktywny =
        -1;

    let ostatniAktywny =
        -1;


    kierunekDlaDaty.przystanki.forEach(
        (
            p,
            index
        ) => {

            const maWariant =
                (
                    p.kursy ||
                    []
                ).some(
                    k =>
                        pobierzWariant(
                            k
                        ) ===
                        aktualnyWariant
                );


            if (
                maWariant
            ) {

                if (
                    pierwszyAktywny === -1
                ) {

                    pierwszyAktywny =
                        index;
                }


                ostatniAktywny =
                    index;
            }
        }
    );


    /*
     * Fallback – jeżeli nie udało się ustalić
     * po kursach przystankowych.
     */

    if (
        pierwszyAktywny === -1
    ) {

        pierwszyAktywny =
            czasyKursu.findIndex(
                czas =>
                    czasNaMinuty(
                        czas
                    ) !== null
            );
    }


    if (
        ostatniAktywny === -1
    ) {

        for (
            let i =
                czasyKursu.length - 1;
            i >= 0;
            i--
        ) {

            if (
                czasNaMinuty(
                    czasyKursu[i]
                ) !== null
            ) {

                ostatniAktywny =
                    i;

                break;
            }
        }
    }


    /*
     * -----------------------------------------------------
     * OŚ GŁÓWNA
     * -----------------------------------------------------
     *
     * Główną osią jest wariant, który ma najwięcej
     * UNIKALNYCH kursów dla aktualnie wybranej daty.
     *
     * Ten sam kurs występuje przy wielu przystankach,
     * dlatego liczymy go tylko raz po numerze kursu.
     *
     * Przy remisie pierwszeństwo ma wariant A,
     * a następnie niższa litera.
     */

    const liczbaKursowWariantu =
        new Map();


    warianty.forEach(
        wariant => {

            const unikalneKursy =
                new Set();


            kierunekDlaDaty.przystanki.forEach(
                p => {

                    (
                        p.kursy ||
                        []
                    ).forEach(
                        kurs => {

                            if (
                                pobierzWariant(kurs) !== wariant
                            ) {
                                return;
                            }


                            const numer =
                                String(
                                    kurs.numer !== undefined &&
                                    kurs.numer !== null
                                        ? kurs.numer
                                        : ""
                                ).trim();


                            if (numer) {

                                unikalneKursy.add(
                                    numer
                                );
                            }
                        }
                    );
                }
            );


            liczbaKursowWariantu.set(
                wariant,
                unikalneKursy.size
            );
        }
    );


    let mainWariant =
        null;


    if (
        warianty.length > 0
    ) {

        const uporzadkowaneWarianty =
            warianty.slice().sort(
                (a, b) => {

                    const liczbaA =
                        liczbaKursowWariantu.get(a) || 0;

                    const liczbaB =
                        liczbaKursowWariantu.get(b) || 0;


                    if (
                        liczbaA !== liczbaB
                    ) {

                        return liczbaB - liczbaA;
                    }


                    if (
                        a === "A" &&
                        b !== "A"
                    ) {
                        return -1;
                    }


                    if (
                        b === "A" &&
                        a !== "A"
                    ) {
                        return 1;
                    }


                    return String(a).localeCompare(
                        String(b),
                        "pl",
                        { numeric: true }
                    );
                }
            );


        mainWariant =
            uporzadkowaneWarianty[0] || null;
    }


    if (
        !mainWariant &&
        aktualnyWariant
    ) {

        mainWariant =
            aktualnyWariant;
    }


    const isOnMainAxis =
        kierunekDlaDaty.przystanki.map(
            p =>
                (
                    p.kursy ||
                    []
                ).some(
                    k =>
                        pobierzWariant(
                            k
                        ) ===
                        mainWariant
                )
        );


    /*
     * -----------------------------------------------------
     * ŚCIEŻKI WARIANTÓW
     * -----------------------------------------------------
     */

    const tripPaths =
        new Map();


    kierunekDlaDaty.przystanki.forEach(
        (
            p,
            index
        ) => {

            (
                p.kursy ||
                []
            ).forEach(
                kurs => {

                    const wariant =
                        pobierzWariant(
                            kurs
                        );


                    if (!wariant)
                        return;


                    const numer =
                        String(
                            kurs.numer ||
                            ""
                        ).trim();


                    const key =
                        numer +
                        "||" +
                        wariant;


                    if (
                        !tripPaths.has(
                            key
                        )
                    ) {

                        tripPaths.set(
                            key,
                            []
                        );
                    }


                    const arr =
                        tripPaths.get(
                            key
                        );


                    if (
                        !arr.includes(
                            index
                        )
                    ) {

                        arr.push(
                            index
                        );
                    }
                }
            );
        }
    );


    /*
     * -----------------------------------------------------
     * PRZYPISANIE TORÓW
     * -----------------------------------------------------
     */

    const trackByKey =
        new Map();


    tripPaths.forEach(
        (
            indices,
            key
        ) => {

            const wariant =
                key.split(
                    "||"
                )[1];


            if (
                wariant ===
                mainWariant
            ) {

                trackByKey.set(
                    key,
                    0
                );

                return;
            }


            /*
             * Warianty inne niż A idą na prawą gałąź.
             */

            trackByKey.set(
                key,
                1
            );
        }
    );


    /*
     * -----------------------------------------------------
     * ROZMIARY SVG
     * -----------------------------------------------------
     */

    const ROW_HEIGHT =
        44;

    const TRACK_W =
        22;

    const SPINE_X =
        44;

    const LEFT_X =
        22;

    const RIGHT_X =
        66;

    const SVG_W =
        82;


    /*
     * -----------------------------------------------------
     * KONTENER
     * -----------------------------------------------------
     */

    const kontener =
        document.getElementById(
            "listaPrzystankow"
        );


    if (!kontener) {

        return;
    }


    kontener.innerHTML =
        "";


    /*
     * -----------------------------------------------------
     * BUDOWANIE LISTY
     * -----------------------------------------------------
 */

    kierunekDlaDaty.przystanki.forEach(
        (
            p,
            index
        ) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "przystanek-row";


            if (
                index ===
                pierwszyAktywny
            ) {

                row.classList.add(
                    "pierwszy"
                );
            }


            if (
                index ===
                ostatniAktywny
            ) {

                row.classList.add(
                    "ostatni"
                );
            }


            /*
             * -------------------------------------------------
             * SVG TRASY
             * -------------------------------------------------
             */

            const svg =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg"
                );


            svg.setAttribute(
                "width",
                SVG_W
            );


            svg.setAttribute(
                "height",
                ROW_HEIGHT
            );


            svg.setAttribute(
                "viewBox",
                `0 0 ${SVG_W} ${ROW_HEIGHT}`
            );


            svg.classList.add(
                "trasa-svg"
            );


            /*
             * Linie pionowe dla osi głównej
             * i gałęzi.
             */

            if (
                index > 0 &&
                isOnMainAxis[index - 1] &&
                isOnMainAxis[index]
            ) {

                const line =
                    document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "line"
                    );


                line.setAttribute(
                    "x1",
                    SPINE_X
                );


                line.setAttribute(
                    "y1",
                    0
                );


                line.setAttribute(
                    "x2",
                    SPINE_X
                );


                line.setAttribute(
                    "y2",
                    ROW_HEIGHT
                );


                line.classList.add(
                    "linia-glowna"
                );


                svg.appendChild(
                    line
                );
            }


            /*
             * Gałęzie wariantów.
             */

            const wariantyNaPrzystanku =
                new Set();


            (
                p.kursy ||
                []
            ).forEach(
                kurs => {

                    const w =
                        pobierzWariant(
                            kurs
                        );


                    if (
                        w &&
                        w !==
                        mainWariant
                    ) {

                        wariantyNaPrzystanku.add(
                            w
                        );
                    }
                }
            );


            if (
                wariantyNaPrzystanku.size > 0
            ) {

                const line =
                    document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "line"
                    );


                line.setAttribute(
                    "x1",
                    RIGHT_X
                );


                line.setAttribute(
                    "y1",
                    0
                );


                line.setAttribute(
                    "x2",
                    RIGHT_X
                );


                line.setAttribute(
                    "y2",
                    ROW_HEIGHT
                );


                line.classList.add(
                    "linia-wariant"
                );


                svg.appendChild(
                    line
                );


                const branch =
                    document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "line"
                    );


                branch.setAttribute(
                    "x1",
                    SPINE_X
                );


                branch.setAttribute(
                    "y1",
                    ROW_HEIGHT / 2
                );


                branch.setAttribute(
                    "x2",
                    RIGHT_X
                );


                branch.setAttribute(
                    "y2",
                    ROW_HEIGHT / 2
                );


                branch.classList.add(
                    "linia-wariant"
                );


                svg.appendChild(
                    branch
                );
            }


            /*
             * -------------------------------------------------
             * WĘZEŁ PRZYSTANKU
             * -------------------------------------------------
             */

            const naZadanie =
                czyPrzystanekNaZadanie(
                    p
                );


            const aktywnyNaOsi =
                isOnMainAxis[index];


            const jestPoczatkiem =
                index ===
                pierwszyAktywny;


            const jestKoncem =
                index ===
                ostatniAktywny;


            const node =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "rect"
                );


            const nodeX =
                aktywnyNaOsi
                    ? SPINE_X - 6
                    : RIGHT_X - 6;


            node.setAttribute(
                "x",
                nodeX
            );


            node.setAttribute(
                "y",
                ROW_HEIGHT / 2 - 6
            );


            node.setAttribute(
                "width",
                12
            );


            node.setAttribute(
                "height",
                12
            );


            node.classList.add(
                "wez-przystanku"
            );


            if (
                naZadanie
            ) {

                node.classList.add(
                    "nż"
                );
            }


            if (
                jestPoczatkiem ||
                jestKoncem
            ) {

                node.classList.add(
                    "skrajny"
                );
            }


            if (
                aktywnyNaOsi
            ) {

                node.classList.add(
                    "glowny"
                );

            } else {

                node.classList.add(
                    "wariant"
                );
            }


            svg.appendChild(
                node
            );


            row.appendChild(
                svg
            );


            /*
             * -------------------------------------------------
             * NAZWA PRZYSTANKU
             * -------------------------------------------------
             */

            const nazwa =
                document.createElement(
                    "div"
                );


            nazwa.className =
                "nazwa-przystanku";


            nazwa.textContent =
                p.nazwa ||
                "";


            if (
                naZadanie
            ) {

                nazwa.classList.add(
                    "na-zadanie"
                );
            }


            /*
             * Jeżeli wybrany przystanek,
             * zaznaczamy go.
             */

            if (
                wybranyPrzystanekId &&
                (
                    (
                        wybranyPrzystanekId.nr &&
                        String(
                            wybranyPrzystanekId.nr
                        ).trim() ===
                        String(
                            p.nr || ""
                        ).trim()
                    ) ||
                    (
                        wybranyPrzystanekId.nazwa &&
                        normalizujTekst(
                            wybranyPrzystanekId.nazwa
                        ) ===
                        normalizujTekst(
                            p.nazwa
                        )
                    )
                )
            ) {

                row.classList.add(
                    "wybrany"
                );
            }


            row.appendChild(
                nazwa
            );


            /*
             * -------------------------------------------------
             * CZAS / MINUTY
             * -------------------------------------------------
             */

            const czas =
                document.createElement(
                    "div"
                );


            czas.className =
                "czas-przystanku";


            const wartosc =
                sumowaneCzasy[index];


            if (
                wartosc !== null &&
                wartosc !== undefined
            ) {

                czas.textContent =
                    String(
                        wartosc
                    );

            } else {

                czas.textContent =
                    "";
            }


            row.appendChild(
                czas
            );


            /*
             * -------------------------------------------------
             * KLIKNIĘCIE
             * -------------------------------------------------
             */

            row.addEventListener(
                "click",
                () => {

                    wybierzPrzystanek(
                        p,
                        index
                    );
                }
            );


            kontener.appendChild(
                row
            );
        }
    );
}


/* =========================================================
   WYBÓR PRZYSTANKU
   ========================================================= */

function wybierzPrzystanek(
    p,
    index
) {

    if (!p)
        return;


    ustawWybranyPrzystanek(
        p,
        index
    );


    widokKursuAktywny =
        false;


    aktualizujHistorieURL(
        wybranyPrzystanekId
    );


    const rozklad =
        znajdzRozklad();


    if (
        rozklad
    ) {

        pokazRozkladWybranegoPrzystanku(
            rozklad,
            p
        );
    }
}


/* =========================================================
   ROZKŁAD WYBRANEGO PRZYSTANKU
   ========================================================= */

function pokazRozkladWybranegoPrzystanku(
    rozklad,
    przystanek
) {

    if (
        !rozklad ||
        !przystanek
    ) {

        return;
    }


    const kontener =
        document.getElementById(
            "listaPrzystankow"
        );


    if (!kontener)
        return;


    kontener.innerHTML =
        "";


    const kontenerWariantow =
        document.getElementById(
            "warianty"
        );


    if (
        kontenerWariantow
    ) {

        kontenerWariantow.style.display =
            "none";

        kontenerWariantow.innerHTML =
            "";
    }


    const dni =
        document.querySelector(
            ".dni"
        );


    if (
        dni
    ) {

        dni.style.display =
            "flex";
    }


    const kursy =
        filtrujKursyDlaDaty(
            przystanek.kursy || [],
            wybranaData
        );


    if (
        kursy.length === 0
    ) {

        pokazBlad(
            "Brak odjazdów.",
            "Dla wybranego przystanku nie znaleziono kursów."
        );

        return;
    }


    /*
     * -----------------------------------------------------
     * WSZYSTKIE WARIANTY
     * -----------------------------------------------------
     */

    const wszystkieWarianty =
        Array.from(
            new Set(
                kursy
                    .map(
                        k =>
                            pobierzWariant(
                                k
                            )
                    )
                    .filter(
                        Boolean
                    )
            )
        ).sort(
            (
                a,
                b
            ) =>
                a.localeCompare(
                    b,
                    "pl",
                    {
                        numeric: true
                    }
                )
        );


    /*
     * Litery A/B/C pokazujemy w minutach tylko wtedy,
     * gdy są co najmniej 4 warianty.
     */

    const jestCzteryLubWiecejWariantow =
        wszystkieWarianty.length >= 4;


    /*
     * -----------------------------------------------------
     * NAGŁÓWEK PRZYSTANKU
     * -----------------------------------------------------
     */

    const naglowek =
        document.createElement(
            "div"
        );


    naglowek.className =
        "naglowek-przystanku";


    naglowek.textContent =
        przystanek.nazwa ||
        "";


    kontener.appendChild(
        naglowek
    );


    /*
     * -----------------------------------------------------
     * MAPA GODZIN
     * -----------------------------------------------------
     */

    const mapaGodzin =
        new Map();


    kursy.forEach(
        kurs => {

            const czas =
                String(
                    kurs.czas ||
                    ""
                ).trim();


            const dop =
                czas.match(
                    /^(\d{1,2}):(\d{2})$/
                );


            if (!dop)
                return;


            const godzina =
                dop[1].padStart(
                    2,
                    "0"
                );


            const minuta =
                dop[2];


            if (
                !mapaGodzin.has(
                    godzina
                )
            ) {

                mapaGodzin.set(
                    godzina,
                    []
                );
            }


            mapaGodzin
                .get(
                    godzina
                )
                .push(
                    {
                        minuta:
                            minuta,

                        kurs:
                            kurs
                    }
                );
        }
    );


    /*
     * -----------------------------------------------------
     * SIATKA ROZKŁADU
     * -----------------------------------------------------
     */

    const rozkladGrid =
        document.createElement(
            "div"
        );


    rozkladGrid.className =
        "rozklad-przystanku";


    Array.from(
        mapaGodzin.entries()
    )
        .sort(
            (
                a,
                b
            ) =>
                Number(a[0]) -
                Number(b[0])
        )
        .forEach(
            (
                [
                    godzina,
                    minuty
                ]
            ) => {

                minuty.sort(
                    (
                        a,
                        b
                    ) =>
                        Number(
                            a.minuta
                        ) -
                        Number(
                            b.minuta
                        )
                );


                /*
                 * Wiersz godziny.
                 */

                const wiersz =
                    document.createElement(
                        "div"
                    );


                wiersz.className =
                    "wiersz-godziny";


                const kolumnaGodziny =
                    document.createElement(
                        "div"
                    );


                kolumnaGodziny.className =
                    "kolumna-godzina";


                kolumnaGodziny.textContent =
                    godzina;


                wiersz.appendChild(
                    kolumnaGodziny
                );


                /*
                 * Każda minuta.
                 */

                minuty.forEach(
                    item => {

                        const kolumna =
                            document.createElement(
                                "div"
                            );


                        kolumna.className =
                            "kolumna-minuta";


                        const kurs =
                            item.kurs;


                        const litera =
                            pobierzWariant(
                                kurs
                            );


                        /*
                         * A jest ukrywane,
                         * jeżeli wariantów jest mniej niż 4.
                         *
                         * Przy 4 lub więcej:
                         * A, B, C, D... są pokazywane.
                         */

                        const literaDoPokazania =
                            litera === "A" &&
                            !jestCzteryLubWiecejWariantow
                                ? ""
                                : litera;


                        kolumna.textContent =
                            item.minuta +
                            literaDoPokazania;


                        /*
                         * Typ przystanku.
                         */

                        if (
                            czyPrzystanekNaZadanie(
                                przystanek
                            )
                        ) {

                            kolumna.classList.add(
                                "nż"
                            );
                        }


                        /*
                         * Kliknięcie w minutę
                         * otwiera cały kurs.
                         */

                        kolumna.addEventListener(
                            "click",
                            () => {

                                pokazCalyKurs(
                                    kurs.numer,
                                    litera
                                );
                            }
                        );


                        wiersz.appendChild(
                            kolumna
                        );
                    }
                );


                rozkladGrid.appendChild(
                    wiersz
                );
            }
        );


    kontener.appendChild(
        rozkladGrid
    );


    /*
     * -----------------------------------------------------
     * LEGENDA WARIANTÓW
     * -----------------------------------------------------
     */

    if (
        wszystkieWarianty.length > 0
    ) {

        const legenda =
            document.createElement(
                "div"
            );


        legenda.className =
            "legenda-wariantow";


        wszystkieWarianty.forEach(
            litera => {

                /*
                 * Jeżeli jest mniej niż 4 warianty,
                 * A nie jest pokazywane w legendzie.
                 */

                if (
                    litera === "A" &&
                    !jestCzteryLubWiecejWariantow
                ) {

                    return;
                }


                const element =
                    document.createElement(
                        "span"
                    );


                element.className =
                    "legenda-wariant";


                element.textContent =
                    litera;


                const wariantInfo =
                    (
                        rozklad.warianty ||
                        []
                    ).find(
                        w =>
                            String(
                                w.litera || ""
                            )
                                .trim()
                                .toUpperCase() ===
                            litera
                    );


                if (
                    wariantInfo &&
                    wariantInfo.opis
                ) {

                    element.title =
                        wariantInfo.opis;
                }


                legenda.appendChild(
                    element
                );
            }
        );


        kontener.appendChild(
            legenda
        );
    }
}


/* =========================================================
   POKAZANIE CAŁEGO KURSU
   ========================================================= */

function pokazCalyKurs(
    nrKursu,
    wariantKursu = null
) {

    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !Array.isArray(
            rozklad.kierunki
        )
    ) {

        return;
    }


    const kierunek =
        rozklad.kierunki[
            aktualnyKierunek
        ];


    if (!kierunek)
        return;


    const numer =
        String(
            nrKursu
        ).trim();


    const szukanyWariant =
        String(
            wariantKursu || ""
        )
            .trim()
            .toUpperCase();


    /*
     * -----------------------------------------------------
     * ZNALEZIENIE KURSU
     * -----------------------------------------------------
     */

    const mapaKursu =
        new Map();


    kierunek.przystanki.forEach(
        (
            p,
            index
        ) => {

            const kursy =
                filtrujKursyDlaDaty(
                    p.kursy || [],
                    wybranaData
                );


            kursy.forEach(
                kurs => {

                    const numerKursu =
                        String(
                            kurs.numer ||
                            ""
                        ).trim();


                    const wariant =
                        pobierzWariant(
                            kurs
                        );


                    if (
                        numerKursu !==
                        numer
                    ) {

                        return;
                    }


                    if (
                        szukanyWariant &&
                        wariant !==
                        szukanyWariant
                    ) {

                        return;
                    }


                    const klucz =
                        numerKursu +
                        "||" +
                        wariant;


                    if (
                        !mapaKursu.has(
                            klucz
                        )
                    ) {

                        mapaKursu.set(
                            klucz,
                            {
                                numer:
                                    numerKursu,

                                wariant:
                                    wariant,

                                punkty:
                                    []
                            }
                        );
                    }


                    mapaKursu
                        .get(
                            klucz
                        )
                        .punkty
                        .push(
                            {
                                index:
                                    index,

                                przystanek:
                                    p,

                                czas:
                                    kurs.czas,

                                kurs:
                                    kurs
                            }
                        );
                }
            );
        }
    );


    if (
        mapaKursu.size === 0
    ) {

        pokazBlad(
            "Nie znaleziono kursu.",
            "Kurs nie istnieje dla wybranej daty."
        );

        return;
    }


    /*
     * Jeżeli nie podano wariantu i znaleziono
     * kilka kursów o tym samym numerze,
     * wybieramy pierwszy.
     */

    const kursDoPokazania =
        Array.from(
            mapaKursu.values()
        )[0];


    kursDoPokazania.punkty.sort(
        (
            a,
            b
        ) =>
            a.index -
            b.index
    );


    /*
     * -----------------------------------------------------
     * TRYB KURSU
     * -----------------------------------------------------
     */

    widokKursuAktywny =
        true;


    aktualnyWariant =
        kursDoPokazania.wariant ||
        null;


    const kontenerWariantow =
        document.getElementById(
            "warianty"
        );


    if (
        kontenerWariantow
    ) {

        kontenerWariantow.style.display =
            "none";

        kontenerWariantow.innerHTML =
            "";
    }


    const dni =
        document.querySelector(
            ".dni"
        );


    if (
        dni
    ) {

        dni.style.display =
            "none";
    }


    const kalendarz =
        document.getElementById(
            "kalendarz"
        );


    if (
        kalendarz
    ) {

        kalendarz.style.display =
            "none";
    }


    /*
     * -----------------------------------------------------
     * KONTENER
     * -----------------------------------------------------
     */

    const kontener =
        document.getElementById(
            "listaPrzystankow"
        );


    if (!kontener)
        return;


    kontener.innerHTML =
        "";


    /*
     * -----------------------------------------------------
     * NAGŁÓWEK
     * -----------------------------------------------------
     */

    const naglowek =
        document.createElement(
            "div"
        );


    naglowek.className =
        "naglowek-kursu";


    naglowek.textContent =
        "Kurs " +
        kursDoPokazania.numer +
        (
            kursDoPokazania.wariant
                ? " | Wariant " +
                  kursDoPokazania.wariant
                : ""
        ) +
        " | Przebieg przez " +
        kursDoPokazania.punkty.length +
        " przystanków";


    kontener.appendChild(
        naglowek
    );


    /*
     * -----------------------------------------------------
     * WYSZUKANIE AKTUALNEGO PRZYSTANKU
     * -----------------------------------------------------
     */

    let aktualnyIndex =
        -1;


    if (
        wybranyPrzystanek
    ) {

        aktualnyIndex =
            kursDoPokazania.punkty.findIndex(
                punkt =>
                    (
                        wybranyPrzystanekId &&
                        wybranyPrzystanekId.nr &&
                        String(
                            punkt.przystanek.nr ||
                            ""
                        ).trim() ===
                        String(
                            wybranyPrzystanekId.nr
                        ).trim()
                    ) ||
                    (
                        normalizujTekst(
                            punkt.przystanek.nazwa
                        ) ===
                        normalizujTekst(
                            wybranyPrzystanek.nazwa
                        )
                    )
            );
    }


    /*
     * -----------------------------------------------------
     * LISTA PRZYSTANKÓW KURSU
     * -----------------------------------------------------
     */

    const lista =
        document.createElement(
            "div"
        );


    lista.className =
        "lista-kursu";


    kursDoPokazania.punkty.forEach(
        (
            punkt,
            index
        ) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "przystanek-row kurs-row";


            if (
                index ===
                aktualnyIndex
            ) {

                row.classList.add(
                    "wybrany"
                );
            }


            /*
             * Linia.
             */

            const svg =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg"
                );


            svg.setAttribute(
                "width",
                "44"
            );


            svg.setAttribute(
                "height",
                "44"
            );


            svg.setAttribute(
                "viewBox",
                "0 0 44 44"
            );


            const line =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );


            line.setAttribute(
                "x1",
                "22"
            );


            line.setAttribute(
                "y1",
                "0"
            );


            line.setAttribute(
                "x2",
                "22"
            );


            line.setAttribute(
                "y2",
                "44"
            );


            line.classList.add(
                "linia-glowna"
            );


            svg.appendChild(
                line
            );


            const node =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "rect"
                );


            node.setAttribute(
                "x",
                "16"
            );


            node.setAttribute(
                "y",
                "16"
            );


            node.setAttribute(
                "width",
                "12"
            );


            node.setAttribute(
                "height",
                "12"
            );


            node.classList.add(
                "wez-przystanku"
            );


            if (
                index === 0 ||
                index ===
                kursDoPokazania.punkty.length - 1
            ) {

                node.classList.add(
                    "skrajny"
                );
            }


            svg.appendChild(
                node
            );


            row.appendChild(
                svg
            );


            /*
             * Nazwa.
             */

            const nazwa =
                document.createElement(
                    "div"
                );


            nazwa.className =
                "nazwa-przystanku";


            nazwa.textContent =
                punkt.przystanek.nazwa ||
                "";


            row.appendChild(
                nazwa
            );


            /*
             * Czas.
             */

            const czas =
                document.createElement(
                    "div"
                );


            czas.className =
                "czas-przystanku";


            czas.textContent =
                punkt.czas ||
                "";


            row.appendChild(
                czas
            );


            /*
             * Względny czas od początku kursu.
             */

            const pierwszyCzas =
                kursDoPokazania.punkty.length > 0
                    ? czasNaMinuty(
                        kursDoPokazania.punkty[0].czas
                    )
                    : null;


            const aktualnyCzas =
                czasNaMinuty(
                    punkt.czas
                );


            if (
                pierwszyCzas !== null &&
                aktualnyCzas !== null
            ) {

                let roznica =
                    aktualnyCzas -
                    pierwszyCzas;


                if (
                    roznica < 0
                ) {

                    roznica +=
                        24 * 60;
                }


                const rel =
                    document.createElement(
                        "span"
                    );


                rel.className =
                    "czas-wzgledny";


                rel.textContent =
                    "+" +
                    roznica +
                    " min";


                row.appendChild(
                    rel
                );
            }


            row.addEventListener(
                "click",
                () => {

                    ustawWybranyPrzystanek(
                        punkt.przystanek,
                        punkt.index
                    );


                    aktualizujHistorieURL(
                        wybranyPrzystanekId
                    );


                    pokazRozkladWybranegoPrzystanku(
                        rozklad,
                        punkt.przystanek
                    );
                }
            );


            lista.appendChild(
                row
            );
        }
    );


    kontener.appendChild(
        lista
    );
}


/* =========================================================
   POKAZANIE BŁĘDU
   ========================================================= */

function pokazBlad(
    tytul,
    opis
) {

    const kontener =
        document.getElementById(
            "listaPrzystankow"
        );


    if (
        kontener
    ) {

        kontener.innerHTML =
            "";


        const box =
            document.createElement(
                "div"
            );


        box.className =
            "blad";


        const h =
            document.createElement(
                "h2"
            );


        h.textContent =
            tytul ||
            "Błąd";


        const p =
            document.createElement(
                "p"
            );


        p.textContent =
            opis ||
            "";


        box.appendChild(
            h
        );


        box.appendChild(
            p
        );


        kontener.appendChild(
            box
        );
    }
}


/* =========================================================
   HISTORIA PRZEGLĄDARKI
   ========================================================= */

window.addEventListener(
    "popstate",
    () => {

        const url =
            new URL(
                window.location.href
            );


        const kierunekParam =
            url.searchParams.get(
                "kierunek"
            );


        if (
            kierunekParam !== null
        ) {

            const kierunek =
                Number(
                    kierunekParam
                );


            if (
                Number.isInteger(
                    kierunek
                ) &&
                kierunek >= 0
            ) {

                aktualnyKierunek =
                    kierunek;
            }
        }


        const rozklad =
            znajdzRozklad();


        const przystanekParam =
            url.searchParams.get(
                "przystanek"
            );


        ustawWybranyPrzystanek(
            null
        );


        if (
            przystanekParam &&
            rozklad &&
            Array.isArray(
                rozklad.kierunki
            )
        ) {

            const kierunek =
                rozklad.kierunki[
                    aktualnyKierunek
                ];


            if (
                kierunek &&
                Array.isArray(
                    kierunek.przystanki
                )
            ) {

                const znaleziony =
                    znajdzPrzystanek(
                        kierunek.przystanki,
                        przystanekParam
                    );


                if (
                    znaleziony
                ) {

                    const index =
                        kierunek.przystanki.indexOf(
                            znaleziony
                        );


                    ustawWybranyPrzystanek(
                        znaleziony,
                        index
                    );
                }
            }
        }


        widokKursuAktywny =
            false;


        pokazRozklad();
    }
);

</script>
