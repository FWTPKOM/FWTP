
<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rozkład jazdy</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <style>

        /* =====================================================
           GŁÓWNY KONTENER
           ===================================================== */

        .rozkład {

            max-width: 1100px;

            margin: 30px auto;

            padding: 0 15px;

        }


        /* =====================================================
           POWRÓT
           ===================================================== */

        .powrot {

            display: inline-block;

            margin-bottom: 20px;

            color: #0066cc;

            text-decoration: none;

            font-weight: bold;

        }

        .powrot:hover {

            text-decoration: underline;

        }


        /* =====================================================
           NAGŁÓWEK LINII
           ===================================================== */

        .naglowek-linii {

            background: white;

            border: 1px solid #ddd;

            border-radius: 8px;

            padding: 25px;

            margin-bottom: 15px;

        }


        .numer-linii {

            font-size: 42px;

            font-weight: bold;

            margin: 0 0 8px 0;

        }


        .trasa {

            font-size: 19px;

            font-weight: bold;

            margin: 0;

        }


        /* =====================================================
           WYBÓR KIERUNKU
           ===================================================== */

        .kierunki {

            display: flex;

            gap: 10px;

            margin-bottom: 15px;

        }


        .kierunek-btn {

            flex: 1;

            padding: 14px;

            background: white;

            border: 1px solid #ccc;

            border-radius: 6px;

            cursor: pointer;

            font-size: 15px;

            font-weight: bold;

            transition: 0.15s;

        }


        .kierunek-btn:hover {

            border-color: #0066cc;

        }


        .kierunek-btn.aktywny {

            background: #0066cc;

            color: white;

            border-color: #0066cc;

        }


        /* =====================================================
           WYBÓR DNIA
           ===================================================== */

        .dni {

            display: flex;

            gap: 8px;

            margin-bottom: 15px;

        }


        .dzien-btn {

            padding: 12px 20px;

            border: 1px solid #ccc;

            background: white;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;

        }


        .dzien-btn:hover {

            border-color: #0066cc;

        }


        .dzien-btn.aktywny {

            background: #0066cc;

            color: white;

            border-color: #0066cc;

        }


        /* =====================================================
           KALENDARZ
           ===================================================== */

        .kalendarz {

            display: none;

            background: white;

            border: 1px solid #ddd;

            border-radius: 6px;

            padding: 15px;

            margin-bottom: 15px;

        }


        .kalendarz input {

            padding: 10px;

            font-size: 16px;

            border: 1px solid #ccc;

            border-radius: 5px;

        }


        /* =====================================================
           INFORMACJA O TYPIE ROZKŁADU
           ===================================================== */

        .typ-rozkładu {

            background: #f7f7f7;

            border: 1px solid #ddd;

            padding: 12px 15px;

            margin-bottom: 15px;

            border-radius: 6px;

            font-size: 14px;

            color: #555;

        }


        /* =====================================================
           LISTA PRZYSTANKÓW
           ===================================================== */

        .przystanki {

            display: flex;

            flex-direction: column;

            gap: 10px;

        }


        /* =====================================================
           PRZYSTANEK
           ===================================================== */

        .przystanek {

            background: white;

            border: 1px solid #ddd;

            border-radius: 7px;

            overflow: hidden;

        }


        .przystanek-naglowek {

            display: flex;

            align-items: center;

            gap: 12px;

            background: #f2f2f2;

            padding: 13px 15px;

            border-bottom: 1px solid #ddd;

        }


        .lp {

            min-width: 35px;

            font-weight: bold;

            color: #666;

        }


        .nazwa-przystanku {

            font-weight: bold;

            font-size: 17px;

        }


        .numer-przystanku {

            margin-left: auto;

            color: #777;

            font-size: 13px;

        }


        /* =====================================================
           GODZINY
           ===================================================== */

        .godziny {

            display: grid;

            grid-template-columns:
                repeat(8, 1fr);

        }


        .godzina {

            padding: 13px 5px;

            text-align: center;

            border-right: 1px solid #eee;

            border-bottom: 1px solid #eee;

            font-size: 17px;

            font-weight: 500;

        }


        .godzina:nth-child(8n) {

            border-right: none;

        }


        .godzina:hover {

            background: #f5f8fb;

        }


        /* =====================================================
           BRAK GODZIN
           ===================================================== */

        .brak-godzin {

            padding: 15px;

            color: #777;

            font-size: 14px;

        }


        /* =====================================================
           ŁADOWANIE
           ===================================================== */

        .loading {

            background: white;

            border: 1px solid #ddd;

            border-radius: 8px;

            padding: 30px;

            text-align: center;

            color: #666;

        }


        /* =====================================================
           BŁĄD
           ===================================================== */

        .blad {

            background: #fff4f4;

            border: 1px solid #e0aaaa;

            color: #a00000;

            border-radius: 8px;

            padding: 20px;

            line-height: 1.6;

        }


        .blad strong {

            display: block;

            margin-bottom: 8px;

        }


        /* =====================================================
           BRAK DANYCH
           ===================================================== */

        .brak-danych {

            padding: 30px;

            text-align: center;

            color: #777;

        }


        /* =====================================================
           TELEFON
           ===================================================== */

        @media (max-width: 800px) {

            .godziny {

                grid-template-columns:
                    repeat(5, 1fr);

            }


            .godzina:nth-child(8n) {

                border-right: 1px solid #eee;

            }


            .godzina:nth-child(5n) {

                border-right: none;

            }

        }


        @media (max-width: 550px) {

            .rozkład {

                margin: 15px auto;

            }


            .numer-linii {

                font-size: 34px;

            }


            .trasa {

                font-size: 16px;

            }


            .kierunki {

                flex-direction: column;

            }


            .dni {

                flex-wrap: wrap;

            }


            .dzien-btn {

                flex: 1;

                padding: 11px 10px;

            }


            .godziny {

                grid-template-columns:
                    repeat(3, 1fr);

            }


            .godzina:nth-child(5n) {

                border-right: 1px solid #eee;

            }


            .godzina:nth-child(3n) {

                border-right: none;

            }


            .przystanek-naglowek {

                padding: 12px;

            }


            .nazwa-przystanku {

                font-size: 15px;

            }


            .numer-przystanku {

                font-size: 11px;

            }

        }

    </style>

</head>


<body>


<header class="topbar">

    <div class="logo">
        FWTP
    </div>


    <nav>

        <a href="../">
            Strona główna
        </a>


        <a href="../linie/">
            Linie
        </a>

    </nav>

</header>



<main class="rozkład">


    <!-- =================================================
         POWRÓT
         ================================================= -->

    <a
        class="powrot"
        href="../linie/"
    >
        ← Linie
    </a>



    <!-- =================================================
         NAGŁÓWEK
         ================================================= -->

    <section class="naglowek-linii">

        <h1
            id="numerLinii"
            class="numer-linii"
        >
            Ładowanie...
        </h1>


        <p
            id="trasa"
            class="trasa"
        >
            Pobieranie danych...
        </p>

    </section>



    <!-- =================================================
         KIERUNKI
         ================================================= -->

    <div
        id="kierunki"
        class="kierunki"
    >
    </div>



    <!-- =================================================
         WYBÓR DNIA
         ================================================= -->

    <div class="dni">

        <button
            id="dzisiajBtn"
            class="dzien-btn aktywny"
            onclick="wybierzDzien('dzisiaj')"
        >
            DZISIAJ
        </button>


        <button
            id="jutroBtn"
            class="dzien-btn"
            onclick="wybierzDzien('jutro')"
        >
            JUTRO
        </button>


        <button
            id="kalendarzBtn"
            class="dzien-btn"
            onclick="wybierzDzien('kalendarz')"
        >
            KALENDARZ
        </button>

    </div>



    <!-- =================================================
         KALENDARZ
         ================================================= -->

    <div
        id="kalendarz"
        class="kalendarz"
    >

        <input
            type="date"
            id="wybranaData"
        >

    </div>



    <!-- =================================================
         TYP ROZKŁADU
         ================================================= -->

    <div
        id="typRozkladu"
        class="typ-rozkładu"
    >
        Ładowanie rozkładu...
    </div>



    <!-- =================================================
         LISTA PRZYSTANKÓW
         ================================================= -->

    <div
        id="przystanki"
        class="przystanki"
    >

        <div class="loading">
            Ładowanie przystanków...
        </div>

    </div>


</main>



<script>

/* =========================================================
   FWTP – SYSTEM ROZKŁADÓW
   ========================================================= */


/* =========================================================
   ZMIENNE
   ========================================================= */

let daneLinii = null;

let numerLinii = null;

let aktualnyKierunek = 0;

let aktualnyDzien = "dzisiaj";

let wybranaData = new Date();



/* =========================================================
   ODCZYT NUMERU LINII Z ADRESU
   ========================================================= */

const parametry =
    new URLSearchParams(
        window.location.search
    );


numerLinii =
    parametry.get("linia");



/* =========================================================
   JEŻELI NIE MA NUMERU LINII
   ========================================================= */

if (!numerLinii) {

    pokazBlad(
        "Nie podano numeru linii.",
        "Wróć do listy linii i wybierz linię."
    );

}

else {

    document.getElementById(
        "numerLinii"
    ).textContent =
        numerLinii;


    pobierzDane();

}



/* =========================================================
   POBIERANIE JSON
   ========================================================= */

async function pobierzDane() {

    const adres =
        "/FWTP/dane/" +
        encodeURIComponent(numerLinii) +
        ".json";

    try {

        console.log("Pobieram:", adres);

        const odpowiedz =
            await fetch(adres, {
                cache: "no-cache"
            });

        if (!odpowiedz.ok) {

            throw new Error(
                "HTTP " +
                odpowiedz.status +
                " – nie znaleziono pliku: " +
                adres
            );

        }

        const tekst =
            await odpowiedz.text();

        try {

            daneLinii =
                JSON.parse(tekst);

        } catch (bladJSON) {

            throw new Error(
                "Plik JSON istnieje, ale ma nieprawidłową składnię."
            );

        }

        if (!daneLinii) {

            throw new Error(
                "JSON jest pusty."
            );

        }

        if (!daneLinii.rozkłady) {

            throw new Error(
                "JSON nie zawiera pola 'rozkłady'."
            );

        }

        console.log(
            "Dane linii " +
            numerLinii +
            " załadowane poprawnie:",
            daneLinii
        );

        uruchomStrone();

    }
    catch (blad) {

        console.error(
            "Błąd ładowania linii " +
            numerLinii +
            ":",
            blad
        );

        pokazBlad(
            "Nie udało się załadować linii " +
            numerLinii + ".",
            blad.message
        );

    }
}



/* =========================================================
   URUCHOMIENIE STRONY
   ========================================================= */

function uruchomStrone() {


    /* -----------------------------------------
       TRASA
       ----------------------------------------- */

    let trasa =
        daneLinii.trasa || "";


    document.getElementById(
        "trasa"
    ).textContent =
        trasa ||
        "Rozkład jazdy linii " +
        numerLinii;



/* =========================================================
   URUCHOMIENIE STRONY
   ========================================================= */

function uruchomStrone() {

    /* -----------------------------------------
       TRASA
       ----------------------------------------- */

    let trasa =
        daneLinii.trasa || "";

    document.getElementById(
        "trasa"
    ).textContent =
        trasa ||
        "Rozkład jazdy linii " +
        numerLinii;


    /* -----------------------------------------
       DATA
       ----------------------------------------- */

    ustawDate();


    /* -----------------------------------------
       KIERUNKI
       ----------------------------------------- */

    generujKierunki();


    /* -----------------------------------------
       ROZKŁAD
       ----------------------------------------- */

    pokazRozklad();

}




/* =========================================================
   GENEROWANIE PRZYCISKÓW KIERUNKÓW
   ========================================================= */

function generujKierunki() {

    const kontener =
        document.getElementById("kierunki");

    kontener.innerHTML = "";

    /*
     * Pobieramy rozkład odpowiedni dla
     * wybranej daty.
     */
    const rozklad =
        znajdzRozklad();

    if (!rozklad) {
        return;
    }

    const kierunki =
        rozklad.kierunki || [];

    if (kierunki.length === 0) {
        return;
    }

    /*
     * Jeżeli wybrany kierunek nie istnieje
     * w aktualnym rozkładzie, wracamy
     * do pierwszego.
     */
    if (!kierunki[aktualnyKierunek]) {
        aktualnyKierunek = 0;
    }

    kierunki.forEach(
        (kierunek, index) => {

            const przycisk =
                document.createElement("button");

            przycisk.className =
                "kierunek-btn";

            if (index === aktualnyKierunek) {

                przycisk.classList.add(
                    "aktywny"
                );

            }

            const przystanki =
                kierunek.przystanki || [];

            let nazwa = "";

            /*
             * Nazwa kierunku jest pobierana
             * z ostatniego rzeczywistego
             * przystanku.
             *
             * Wiersz "Nr linii:" jest pomijany.
             */
            for (
                let i = przystanki.length - 1;
                i >= 0;
                i--
            ) {

                const nazwaPrzystanku =
                    (
                        przystanki[i].nazwa || ""
                    ).trim();

                if (
                    nazwaPrzystanku &&
                    nazwaPrzystanku
                        .toLowerCase() !== "nr linii:" &&
                    nazwaPrzystanku
                        .toLowerCase() !== "nr linii"
                ) {

                    nazwa =
                        nazwaPrzystanku;

                    break;

                }

            }

            if (!nazwa) {

                nazwa =
                    "Kierunek " +
                    (index + 1);

            }

            przycisk.textContent =
                nazwa;

            przycisk.onclick =
                function () {

                    zmienKierunek(index);

                };

            kontener.appendChild(
                przycisk
            );

        }
    );

}


/* =========================================================
   ZMIANA KIERUNKU
   ========================================================= */

function zmienKierunek(index) {


    aktualnyKierunek =
        index;


    const przyciski =
        document.querySelectorAll(
            ".kierunek-btn"
        );


    przyciski.forEach(
        (przycisk, i) => {

            przycisk.classList.toggle(
                "aktywny",
                i === index
            );

        }
    );


    pokazRozklad();

}



/* =========================================================
   WYBÓR DNIA
   ========================================================= */

function wybierzDzien(dzien) {


    aktualnyDzien =
        dzien;


    const przyciski =
        document.querySelectorAll(
            ".dzien-btn"
        );


    przyciski.forEach(
        przycisk => {

            przycisk.classList.remove(
                "aktywny"
            );

        }
    );


    const kalendarz =
        document.getElementById(
            "kalendarz"
        );


    kalendarz.style.display =
        "none";


    if (dzien === "dzisiaj") {

        document.getElementById(
            "dzisiajBtn"
        ).classList.add(
            "aktywny"
        );


        wybranaData =
            new Date();

    }


    if (dzien === "jutro") {

        document.getElementById(
            "jutroBtn"
        ).classList.add(
            "aktywny"
        );


        wybranaData =
            new Date();


        wybranaData.setDate(
            wybranaData.getDate() + 1
        );

    }


    if (dzien === "kalendarz") {

        document.getElementById(
            "kalendarzBtn"
        ).classList.add(
            "aktywny"
        );


        kalendarz.style.display =
            "block";


        const input =
            document.getElementById(
                "wybranaData"
            );


        input.value =
            formatujDateInput(
                wybranaData
            );

    }


   generujKierunki();
pokazRozklad();

}



/* =========================================================
   KALENDARZ – ZMIANA DATY
   ========================================================= */

document
    .getElementById("wybranaData")
    .addEventListener(
        "change",
        function () {


            if (!this.value) {

                return;

            }


            const czesci =
                this.value.split("-");


          wybranaData = new Date(
    Number(czesci[0]),
    Number(czesci[1]) - 1,
    Number(czesci[2])
);

generujKierunki();
pokazRozklad();

        }
    );



/* =========================================================
   USTAWIENIE DATY
   ========================================================= */

function ustawDate() {

    wybranaData =
        new Date();


}



/* =========================================================
   WYBÓR ODPOWIEDNIEGO ROZKŁADU
   ========================================================= */

function znajdzRozklad() {


    const rozklady =
        daneLinii.rozkłady || [];


    if (rozklady.length === 0) {

        return null;

    }


    /*
     * 0 = poniedziałek-piątek
     * 1 = sobota/niedziela/święto
     */

    const dzien =
        wybranaData.getDay();


    const weekend =
        dzien === 0 ||
        dzien === 6;


    let znaleziony = null;


    for (
        let i = 0;
        i < rozklady.length;
        i++
    ) {

        const nazwa =
            (
                rozklady[i].nazwa || ""
            ).toLowerCase();


        if (weekend) {

            if (
                nazwa.includes("sobot") ||
                nazwa.includes("niedziel") ||
                nazwa.includes("świąt") ||
                nazwa.includes("swia")
            ) {

                znaleziony =
                    rozklady[i];

                break;

            }

        }

        else {

            if (
                nazwa.includes("poniedział") ||
                nazwa.includes("piątk") ||
                nazwa.includes("poniedzial") ||
                nazwa.includes("piatk")
            ) {

                znaleziony =
                    rozklady[i];

                break;

            }

        }

    }


    /*
     * Jeżeli nie znaleziono dokładnego
     * wariantu, używamy pierwszego.
     */

    if (!znaleziony) {

        znaleziony =
            rozklady[0];

    }


    return znaleziony;

}



/* =========================================================
   POKAZANIE ROZKŁADU
   ========================================================= */

function pokazRozklad() {


    if (!daneLinii) {

        return;

    }


    const rozklad =
        znajdzRozklad();


    const kontener =
        document.getElementById(
            "przystanki"
        );


    const typ =
        document.getElementById(
            "typRozkladu"
        );


    if (!rozklad) {

        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak danych rozkładu.' +
            '</div>';

        return;

    }


    typ.textContent =
        rozklad.nazwa ||
        "Rozkład jazdy";


    const kierunki =
        rozklad.kierunki || [];


    if (
        kierunki.length === 0 ||
        !kierunki[aktualnyKierunek]
    ) {

        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak danych dla tego kierunku.' +
            '</div>';

        return;

    }


    const kierunek =
        kierunki[
            aktualnyKierunek
        ];


    const przystanki =
        kierunek.przystanki || [];


    kontener.innerHTML = "";


    przystanki.forEach(
        (przystanek, index) => {


            const blok =
                document.createElement(
                    "div"
                );


            blok.className =
                "przystanek";


            /* -----------------------------------
               NAGŁÓWEK PRZYSTANKU
               ----------------------------------- */

            const naglowek =
                document.createElement(
                    "div"
                );


            naglowek.className =
                "przystanek-naglowek";


            const lp =
                document.createElement(
                    "span"
                );


            lp.className =
                "lp";


            lp.textContent =
                przystanek.lp ||
                index + 1;


            const nazwa =
                document.createElement(
                    "span"
                );


            nazwa.className =
                "nazwa-przystanku";


            nazwa.textContent =
                przystanek.nazwa ||
                "Przystanek";


            const nr =
                document.createElement(
                    "span"
                );


            nr.className =
                "numer-przystanku";


            if (przystanek.nr) {

                nr.textContent =
                    "nr " +
                    przystanek.nr;

            }


            naglowek.appendChild(lp);

            naglowek.appendChild(nazwa);

            naglowek.appendChild(nr);


            blok.appendChild(
                naglowek
            );


            /* -----------------------------------
               GODZINY
               ----------------------------------- */

            const godziny =
                document.createElement(
                    "div"
                );


            godziny.className =
                "godziny";


            const lista =
                przystanek.godziny || [];


            if (lista.length === 0) {


                godziny.innerHTML =
                    '<div class="brak-godzin">' +
                    'Brak odjazdów' +
                    '</div>';


            }

            else {


                lista.forEach(
                    czas => {


                        const element =
                            document.createElement(
                                "div"
                            );


                        element.className =
                            "godzina";


                        element.textContent =
                            czas;


                        godziny.appendChild(
                            element
                        );

                    }
                );

            }


            blok.appendChild(
                godziny
            );


            kontener.appendChild(
                blok
            );

        }
    );

}



/* =========================================================
   FORMAT DATY DO INPUT
   ========================================================= */

function formatujDateInput(data) {


    const rok =
        data.getFullYear();


    const miesiac =
        String(
            data.getMonth() + 1
        ).padStart(2, "0");


    const dzien =
        String(
            data.getDate()
        ).padStart(2, "0");


    return (
        rok +
        "-" +
        miesiac +
        "-" +
        dzien
    );

}



/* =========================================================
   WYŚWIETLANIE BŁĘDU
   ========================================================= */

function pokazBlad(
    tytul,
    opis
) {


    document.getElementById(
        "numerLinii"
    ).textContent =
        "Błąd";


    document.getElementById(
        "trasa"
    ).textContent =
        "";


    document.getElementById(
        "kierunki"
    ).innerHTML =
        "";
