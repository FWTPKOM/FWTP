<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rozkład jazdy</title>
<link rel="stylesheet" href="../css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600&display=swap" rel="stylesheet">

<style>
/* =========================================================
   GŁÓWNY KONTENER I NAGŁÓWKI
   ========================================================= */
.rozkład {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px;
}
.powrot {
    display: inline-block;
    margin-bottom: 20px;
    color: #0066cc;
    text-decoration: none;
    font-weight: bold;
}
.powrot:hover {
    text-decoration: underline;
}
.naglowek-linii {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 25px;
    margin-bottom: 15px;
}
.numer-linii {
    font-size: 42px;
    font-weight: bold;
    margin: 0 0 8px 0;
}
.trasa {
    font-size: 19px;
    font-weight: bold;
    margin: 0;
    white-space: pre-line;
}

/* =========================================================
   KIERUNKI I DNI
   ========================================================= */
.kierunki, .dni {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}
.kierunek-btn, .dzien-btn {
    flex: 1;
    padding: 14px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    transition: 0.15s;
}
.kierunek-btn:hover, .dzien-btn:hover {
    border-color: #0066cc;
}
.kierunek-btn.aktywny, .dzien-btn.aktywny {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
}

/* =========================================================
   WARIANTY W STYLU WTP
   ========================================================= */
.warianty-pojemnik {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border-top: 2px solid #ccc;
    border-bottom: 2px solid #ccc;
    padding: 10px 0;
    margin-bottom: 15px;
}
.warianty-info {
    font-size: 15px;
    color: #1d1d1b;
}
.warianty-info strong {
    font-weight: 700;
}
.warianty-przyciski {
    display: flex;
    gap: 2px;
}
.wariant-btn {
    padding: 4px 12px;
    font-size: 22px;
    font-weight: 900;
    color: #706f6f;
    background: transparent;
    border: none;
    border-bottom: 4px solid transparent;
    cursor: pointer;
    transition: 0.15s;
    font-family: inherit;
}
.wariant-btn.wszystkie {
    font-size: 17px;
    font-weight: 600;
}
.wariant-btn:hover {
    color: #d61c12;
}
.wariant-btn.aktywny {
    color: #d61c12;
    border-bottom-color: #d61c12;
}

/* =========================================================
   WIDOKI: KALENDARZ, ŁADOWANIE, BŁĘDY
   ========================================================= */
.kalendarz {
    display: none;
    background: white;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 15px;
    margin-bottom: 15px;
}
.kalendarz input {
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
}
.typ-rozkładu {
    background: #f7f7f7;
    border: 1px solid #ddd;
    padding: 12px 15px;
    margin-bottom: 15px;
    border-radius: 6px;
    font-size: 14px;
    color: #555;
}
.brak-godzin { padding: 15px; color: #777; font-size: 14px; }
.loading { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 30px; text-align: center; color: #666; }
.blad { background: #fff4f4; border: 1px solid #e0aaaa; color: #a00000; border-radius: 8px; padding: 20px; line-height: 1.6; }
.blad strong { display: block; margin-bottom: 8px; }
.brak-danych { padding: 30px; text-align: center; color: #777; background: white; border: 1px solid #ddd; border-radius: 8px; }

/* =========================================================
   ROZKŁAD JAZDY - WIDOK PRZYSTANKU (KOLUMNY I MINUTY)
   ========================================================= */
.przystanek {
    background: white;
    border: 1px solid #ddd;
    border-radius: 7px;
    overflow: hidden;
}
.godziny { width: 100%; }
.wiersz-godziny {
    display: grid;
    grid-template-columns: 43px repeat(10, 46px);
    grid-auto-columns: 46px;
    min-height: 38px;
    border-bottom: 1px solid #eee;
}
.kolumna-godzina {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Barlow Semi Condensed", sans-serif;
    font-size: 16px;
    font-weight: 600;
    background: #555;
    color: white;
    border-right: 1px solid #444;
    min-height: 38px;
}
.kolumna-minuta {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    min-height: 38px;
    font-family: "Barlow Semi Condensed", sans-serif;
    font-weight: 600;
    width: 46px;
    color: black;
    transform: translateX(10px);
    cursor: pointer;
}
.kolumna-minuta:hover { background: #e8eef5; }
.minuta-z-wariantem { position: relative; display: inline-block; line-height: 1; text-align: center; }
.minuta { display: inline-block; font-size: 16px; font-weight: 600; line-height: 1; z-index: 1; }
.wariant-minuty {
    position: absolute;
    left: calc(100% + 2px);
    bottom: -1px;
    font-size: 12px;
    line-height: 1;
    font-weight: 600;
    white-space: nowrap;
    z-index: 2;
}

/* =========================================================
   LEGENDA
   ========================================================= */
.legenda-wariantow {
    background: #f7f7f7;
    border-top: 1px solid #ddd;
    padding: 10px 15px;
    font-size: 16px;
    color: #555;
    font-family: "Barlow Semi Condensed", sans-serif;
}
.legenda-element {
    display: flex;
    align-items: baseline;
    gap: 6px;
    line-height: 1.35;
    font-weight: 600;
}
.legenda-litera, .legenda-separator, .legenda-opis { color: black; font-size: 15px; }
.legenda-litera { font-size: 16px; min-width: 22px; }

/* =========================================================
   WIZUALNA OŚ TRASY (CIĄGŁA LINIA, BEZ NUMERÓW LP)
   ========================================================= */
.lista-przystankow {
    display: flex;
    flex-direction: column;
    gap: 0; /* Zapewnia brak przerw między węzłami linii */
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
    background: white;
}
.przystanek-btn {
    width: 100%;
    display: flex;
    align-items: stretch;
    padding: 0;
    background: white;
    border: none;
    /* border-bottom USUNIĘTY zgodnie z prośbą */
    cursor: pointer;
    text-align: left;
    transition: 0.15s;
    font-family: inherit;
    min-height: 48px;
}
.przystanek-btn:hover { background: #f8fbff; }
.przystanek-btn:hover .przystanek-nazwa { color: #0066cc; }

/* Struktura kropek i pionowej linii */
.node-wrapper {
    width: 50px;
    display: flex;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
}
.linia-pionowa {
    position: absolute;
    width: 2px;
    background-color: #000;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
}
.linia-pionowa.start { top: 50%; bottom: -1px; }
.linia-pionowa.middle { top: -1px; bottom: -1px; }
.linia-pionowa.end { top: -1px; bottom: 50%; }

.wezel {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
}
.wezel.square { width: 12px; height: 12px; border-radius: 1px; }
.wezel.circle { width: 12px; height: 12px; border-radius: 50%; }

/* Przystanek na żądanie - niezamalowany środek */
.wezel.nz {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: #fff;
    border: 3px solid #e42313;
    box-sizing: content-box;
}
.bg-black { background-color: #000; }
.bg-red { background-color: #e42313; }

.przystanek-btn .przystanek-nazwa {
    flex: 1;
    display: flex;
    align-items: center;
    font-size: 16px;
    font-weight: bold;
    color: #222;
    padding-left: 0; /* skorygowane żeby nie było za dużej przerwy po usunięciu numerków */
    transition: color 0.15s;
}
.przystanek-btn .przystanek-nr {
    color: #777;
    font-size: 13px;
    display: flex;
    align-items: center;
    padding: 0 15px;
}

/* =========================================================
   POWRÓT I NAGŁÓWKI WIDOKU PRZYSTANKU
   ========================================================= */
.powrot-przystanki { margin-bottom: 15px; }
.powrot-przystanki button {
    border: none; background: none; padding: 0;
    color: #0066cc; font-size: 15px; font-weight: bold;
    cursor: pointer; font-family: inherit;
}
.powrot-przystanki button:hover { text-decoration: underline; }
.naglowek-przystanku-widok {
    background: white; border: 1px solid #ddd; border-radius: 8px;
    padding: 20px; margin-bottom: 15px;
}
.naglowek-przystanku-widok .nazwa { font-size: 26px; font-weight: bold; margin-bottom: 5px; }
.naglowek-przystanku-widok .numer { color: #777; font-size: 14px; }

/* =========================================================
   WIDOK CAŁEGO KURSU
   ========================================================= */
.kurs-widok { background: white; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; margin-top: 15px; }
.kurs-naglowek { background: #555; color: white; padding: 15px; font-family: "Barlow Semi Condensed", sans-serif; }
.kurs-naglowek .kurs-tytul { font-size: 22px; margin-bottom: 5px; font-weight: 600; }
.kurs-naglowek .kurs-informacja { font-size: 15px; opacity: 0.9; }
.kurs-lista { display: flex; flex-direction: column; }
.kurs-przystanek { display: flex; align-items: stretch; min-height: 48px; border-bottom: 1px solid #eee; }
.kurs-przystanek:last-child { border-bottom: none; }
.kurs-przystanek.aktywny { background: #f2f2f2; }
.kurs-czas-rel { width: 60px; display: flex; align-items: center; justify-content: flex-end; padding-right: 12px; color: #888; font-size: 13px; }
.kurs-nazwa-box { flex: 1; display: flex; align-items: center; padding-left: 0; font-size: 15px; font-weight: bold; }
.kurs-nazwa-box span { font-weight: normal; color: #777; font-size: 13px; margin-left: 6px; }
.kurs-czas-abs { width: 65px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px; }

/* =========================================================
   RESPONSYWNOŚĆ
   ========================================================= */
@media (max-width: 550px) {
    .rozkład { margin: 15px auto; }
    .wiersz-godziny { grid-template-columns: 36px repeat(4, 46px); min-height: 36px; overflow-x: auto; }
    .kolumna-godzina { font-size: 14px; min-height: 36px; }
    .kolumna-minuta { width: 46px; min-width: 46px; max-width: 46px; min-height: 36px; }
    .przystanek-btn .przystanek-nazwa { font-size: 15px; }
    .naglowek-przystanku-widok .nazwa { font-size: 22px; }
}
</style>
</head>

<body>

<header class="topbar">
    <div class="logo">FWTP</div>
    <nav>
        <a href="../">Strona główna</a>
        <a href="../linie/">Linie</a>
    </nav>
</header>

<main class="rozkład">

<a class="powrot" href="../linie/">← Linie</a>

<section class="naglowek-linii">
    <h1 id="numerLinii" class="numer-linii">Ładowanie...</h1>
    <p id="trasa" class="trasa">Pobieranie danych...</p>
</section>

<div id="kierunki" class="kierunki"></div>

<!-- POJEMNIK WARIANTÓW -->
<div id="warianty-pojemnik" class="warianty-pojemnik" style="display:none;">
    <div class="warianty-info"><strong>Uwaga!</strong> Ta linia ma różne warianty trasy.</div>
    <div id="warianty-przyciski" class="warianty-przyciski"></div>
</div>

<div class="dni" style="display:none;">
    <button id="dzisiajBtn" class="dzien-btn aktywny" onclick="wybierzDzien('dzisiaj')">DZISIAJ</button>
    <button id="jutroBtn" class="dzien-btn" onclick="wybierzDzien('jutro')">JUTRO</button>
    <button id="kalendarzBtn" class="dzien-btn" onclick="wybierzDzien('kalendarz')">KALENDARZ</button>
</div>

<div id="kalendarz" class="kalendarz">
    <input type="date" id="wybranaData">
</div>

<div id="powrotPrzystanki" class="powrot-przystanki" style="display:none;">
    <button onclick="pokazListePrzystankowZPowrotem()">← Przystanki</button>
</div>

<div id="typRozkladu" class="typ-rozkładu">Ładowanie rozkładu...</div>

<div id="przystanki" class="przystanki">
    <div class="loading">Ładowanie przystanków...</div>
</div>

</main>

<script>
let daneLinii = null;
let numerLinii = null;
let aktualnyKierunek = 0;
let aktualnyWariant = null;
let aktualnyDzien = "dzisiaj";
let wybranaData = new Date();
let wybranyPrzystanek = null;

const parametry = new URLSearchParams(window.location.search);
numerLinii = parametry.get("linia");

if (!numerLinii) {
    pokazBlad("Nie podano numeru linii.", "Użyj adresu w rodzaju: ?linia=126");
} else {
    document.getElementById("numerLinii").textContent = numerLinii;
    pobierzDane();
}

function usunPoleGodziny(tekst) {
    const pozycja = tekst.search(/"godziny"\s*:\s*\[/);
    if (pozycja === -1) return tekst;
    const poczatekTablicy = tekst.indexOf("[", pozycja);
    if (poczatekTablicy === -1) return tekst;
    let poziom = 0;
    let wStringu = false;
    let ucieczka = false;
    let koniecTablicy = -1;
    for (let i = poczatekTablicy; i < tekst.length; i++) {
        const znak = tekst[i];
        if (ucieczka) { ucieczka = false; continue; }
        if (znak === "\\" && wStringu) { ucieczka = true; continue; }
        if (znak === '"') { wStringu = !wStringu; continue; }
        if (wStringu) continue;
        if (znak === "[") poziom++;
        if (znak === "]") {
            poziom--;
            if (poziom === 0) { koniecTablicy = i; break; }
        }
    }
    if (koniecTablicy === -1) return tekst;
    let poczatek = pozycja;
    let koniec = koniecTablicy + 1;
    while (koniec < tekst.length && /\s/.test(tekst[koniec])) koniec++;
    if (tekst[koniec] === ",") koniec++;
    let wynik = tekst.substring(0, poczatek) + tekst.substring(koniec);
    return wynik.replace(/,\s*,/g, ",").replace(/,\s*}/g, "}");
}

async function pobierzDane() {
    const adres = "../dane/" + encodeURIComponent(numerLinii) + ".json";
    try {
        const odpowiedz = await fetch(adres, { cache: "no-cache" });
        if (!odpowiedz.ok) throw new Error("Nie znaleziono pliku JSON.");
        let tekst = await odpowiedz.text();
        try {
            daneLinii = JSON.parse(tekst);
        } catch (e1) {
            daneLinii = JSON.parse(usunPoleGodziny(tekst));
        }
        uruchomStrone();
    } catch (blad) {
        pokazBlad("Błąd ładowania.", blad.message);
    }
}

function uruchomStrone() {
    document.getElementById("numerLinii").textContent = daneLinii.linia || numerLinii;
    document.getElementById("trasa").textContent = daneLinii.trasa || "";
    const paramK = parametry.get("kierunek");
    if (paramK !== null) {
        const num = Number(paramK);
        if (Number.isInteger(num) && num >= 0) aktualnyKierunek = num;
    }
    pokazRozklad();
}

function okreslTypDnia(data) {
    const d = data.getDay();
    if (d === 6) return "sobota";
    if (d === 0) return "niedziela";
    return "roboczy";
}

function normalizujTekst(tekst) {
    return String(tekst || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function znajdzRozklad() {
    const rozklady = daneLinii.rozkłady || [];
    if (rozklady.length === 0) return null;
    const typ = okreslTypDnia(wybranaData);
    if (typ === "sobota") {
        for (const r of rozklady) {
            if (normalizujTekst(r.nazwa).includes("sobot")) return r;
        }
    }
    if (typ === "niedziela") {
        for (const r of rozklady) {
            const nazwa = normalizujTekst(r.nazwa);
            if (nazwa.includes("niedziel") || nazwa.includes("swiat")) return r;
        }
    }
    if (typ === "roboczy") {
        for (const r of rozklady) {
            if (normalizujTekst(r.nazwa).includes("piatk") || normalizujTekst(r.nazwa).includes("poniedzial")) return r;
        }
    }
    return rozklady[0];
}

function generujKierunki() {
    const kontener = document.getElementById("kierunki");
    kontener.innerHTML = "";
    const rozklad = znajdzRozklad();
    if (!rozklad || !Array.isArray(rozklad.kierunki)) return;
    rozklad.kierunki.forEach((kierunek, index) => {
        const btn = document.createElement("button");
        btn.className = "kierunek-btn" + (index === aktualnyKierunek ? " aktywny" : "");
        const przystanki = kierunek.przystanki || [];
        btn.textContent = przystanki.length > 0 ? (przystanki[przystanki.length - 1].nazwa || "Kierunek") : "Kierunek " + (index + 1);
        btn.onclick = () => { aktualnyKierunek = index; aktualnyWariant = null; wybranyPrzystanek = null; pokazRozklad(); };
        kontener.appendChild(btn);
    });
}

function wybierzDzien(dzien) {
    aktualnyDzien = dzien;
    document.querySelectorAll(".dzien-btn").forEach(b => b.classList.remove("aktywny"));
    document.getElementById("kalendarz").style.display = "none";
    if (dzien === "dzisiaj") { document.getElementById("dzisiajBtn").classList.add("aktywny"); wybranaData = new Date(); }
    if (dzien === "jutro") { document.getElementById("jutroBtn").classList.add("aktywny"); wybranaData = new Date(); wybranaData.setDate(wybranaData.getDate() + 1); }
    if (dzien === "kalendarz") { document.getElementById("kalendarzBtn").classList.add("aktywny"); document.getElementById("kalendarz").style.display = "block"; document.getElementById("wybranaData").value = formatujDateInput(wybranaData); }
    pokazRozklad();
}

document.getElementById("wybranaData").addEventListener("change", function() {
    if (!this.value) return;
    const czesci = this.value.split("-");
    wybranaData = new Date(Number(czesci[0]), Number(czesci[1]) - 1, Number(czesci[2]));
    pokazRozklad();
});

function formatujDateInput(data) {
    return data.getFullYear() + "-" + String(data.getMonth() + 1).padStart(2, "0") + "-" + String(data.getDate()).padStart(2, "0");
}

function pobierzDaneWariantu(kurs) {
    let litera = String(kurs.wariant || "").trim();
    return { litera: litera, opis: "" };
}

function zbierzWariantyDlaKierunku(kierunek) {
    const znalezione = new Set();
    if (!kierunek || !Array.isArray(kierunek.przystanki)) return [];
    kierunek.przystanki.forEach(p => {
        if (Array.isArray(p.kursy)) {
            p.kursy.forEach(k => {
                const litera = String(k.wariant || "").trim();
                if (litera !== "") znalezione.add(litera);
            });
        }
    });
    return Array.from(znalezione).sort();
}

function pokazRozklad() {
    if (!daneLinii) return;
    const rozklad = znajdzRozklad();
    const kontener = document.getElementById("przystanki");
    const typ = document.getElementById("typRozkladu");
    const powrot = document.getElementById("powrotPrzystanki");
    const wp = document.getElementById("warianty-pojemnik");

    if (!rozklad || !rozklad.kierunki || rozklad.kierunki.length === 0) {
        typ.textContent = "Brak rozkładu";
        kontener.innerHTML = '<div class="brak-danych">Brak danych rozkładu.</div>';
        if(wp) wp.style.display = "none";
        return;
    }
    if (aktualnyKierunek >= rozklad.kierunki.length) aktualnyKierunek = 0;
    generujKierunki();

    if (!wybranyPrzystanek) { pokazListePrzystankow(rozklad); return; }
    const kierunek = rozklad.kierunki[aktualnyKierunek];
    const przystanki = kierunek.przystanki || [];
    const aktualny = przystanki.find(p => String(p.nr || "") === String(wybranyPrzystanek.nr || "")) ||
                     przystanki.find(p => p.nazwa === wybranyPrzystanek.nazwa);
    if (!aktualny) { wybranyPrzystanek = null; pokazListePrzystankow(rozklad); return; }
    wybranyPrzystanek = aktualny;
    pokazRozkladWybranegoPrzystanku(rozklad, aktualny);
}

function pokazListePrzystankow(rozklad) {
    const kontener = document.getElementById("przystanki");
    const kierunek = rozklad.kierunki[aktualnyKierunek];
    const przystanki = kierunek.przystanki || [];
    document.getElementById("typRozkladu").textContent = "Wybierz przystanek";
    document.getElementById("powrotPrzystanki").style.display = "none";
    document.querySelector(".dni").style.display = "none";
    document.getElementById("kalendarz").style.display = "none";
    kontener.innerHTML = "";

    const wp = document.getElementById("warianty-pojemnik");
    const wprz = document.getElementById("warianty-przyciski");
    if (wp && wprz) {
        const wariantyKierunku = zbierzWariantyDlaKierunku(kierunek);
        if (wariantyKierunku.length > 0) {
            wp.style.display = "flex";
            wprz.innerHTML = "";
            const btnAll = document.createElement("button");
            btnAll.className = "wariant-btn wszystkie" + (aktualnyWariant === null ? " aktywny" : "");
            btnAll.textContent = "Cały schemat";
            btnAll.onclick = () => { aktualnyWariant = null; pokazRozklad(); };
            wprz.appendChild(btnAll);
            wariantyKierunku.forEach(w => {
                const btn = document.createElement("button");
                btn.className = "wariant-btn" + (aktualnyWariant === w ? " aktywny" : "");
                btn.textContent = w;
                btn.onclick = () => { aktualnyWariant = w; pokazRozklad(); };
                wprz.appendChild(btn);
            });
        } else {
            wp.style.display = "none";
            aktualnyWariant = null;
        }
    }

    let widoczne = przystanki;
    if (aktualnyWariant !== null) {
        widoczne = przystanki.filter(p => Array.isArray(p.kursy) && p.kursy.some(k => String(k.wariant || "").trim() === aktualnyWariant));
    }

    const lista = document.createElement("div");
    lista.className = "lista-przystankow";

    if (widoczne.length === 0) {
        lista.innerHTML = '<div class="brak-danych">Brak przystanków w tym wariancie.</div>';
        kontener.appendChild(lista);
        return;
    }

    widoczne.forEach((p, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "przystanek-btn";

        const node = document.createElement("div");
        node.className = "node-wrapper";
        const line = document.createElement("div");
        line.className = "linia-pionowa " + (index === 0 ? "start" : (index === widoczne.length - 1 ? "end" : "middle"));
        
        // Zgodnie z plikiem JSON, przystanek na żądanie oznaczony jest jako "naZadanie": true
        const isNz = p.naZadanie === true || p.nz === true;
        const icon = document.createElement("div");
        icon.className = "wezel " + (index === 0 ? "square bg-black" : (index === widoczne.length - 1 ? "square bg-red" : (isNz ? "nz" : "circle bg-red")));

        node.appendChild(line);
        node.appendChild(icon);

        const nazwa = document.createElement("div");
        nazwa.className = "przystanek-nazwa";
        nazwa.textContent = p.nazwa || "Przystanek";

        const nr = document.createElement("div");
        nr.className = "przystanek-nr";
        if (p.nr) nr.textContent = "nr " + p.nr;

        // Celowo pominięto LP zgodnie z życzeniem
        btn.appendChild(node);
        btn.appendChild(nazwa);
        btn.appendChild(nr);
        btn.onclick = () => wybierzPrzystanek(p, index);
        lista.appendChild(btn);
    });

    kontener.appendChild(lista);
}

function wybierzPrzystanek(p, index) {
    wybranyPrzystanek = p;
    pokazRozklad();
}

function pokazListePrzystankowZPowrotem() {
    wybranyPrzystanek = null;
    pokazRozklad();
}

function pokazRozkladWybranegoPrzystanku(rozklad, przystanek) {
    const kontener = document.getElementById("przystanki");
    document.getElementById("powrotPrzystanki").style.display = "block";
    document.querySelector(".dni").style.display = "flex";
    if (aktualnyDzien !== "kalendarz") document.getElementById("kalendarz").style.display = "none";
    document.getElementById("typRozkladu").textContent = rozklad.nazwa || "Rozkład jazdy";
    document.getElementById("warianty-pojemnik").style.display = "none";
    kontener.innerHTML = "";

    const naglowek = document.createElement("div");
    naglowek.className = "naglowek-przystanku-widok";
    naglowek.innerHTML = `<div class="nazwa">${przystanek.nazwa}</div><div class="numer">${przystanek.nr ? 'nr ' + przystanek.nr : ''}</div>`;
    kontener.appendChild(naglowek);

    const blok = document.createElement("div");
    blok.className = "przystanek";
    const godziny = document.createElement("div");
    godziny.className = "godziny";

    if (!przystanek.kursy || przystanek.kursy.length === 0) {
        godziny.innerHTML = '<div class="brak-godzin">Brak odjazdów</div>';
    } else {
        let aktGodz = null;
        let wiersz = null;
        przystanek.kursy.forEach(k => {
            const czas = String(k.czas || "").trim();
            const dop = czas.match(/^(\d{1,2}):(\d{2})$/);
            if (!dop) return;
            const g = Number(dop[1]);
            const m = dop[2];

            if (aktGodz !== g) {
                aktGodz = g;
                wiersz = document.createElement("div");
                wiersz.className = "wiersz-godziny";
                wiersz.innerHTML = `<div class="kolumna-godzina">${String(g).padStart(2,"0")}</div>`;
                godziny.appendChild(wiersz);
            }
            const kol = document.createElement("div");
            kol.className = "kolumna-minuta";
            const litera = String(k.wariant || "").trim();
            kol.innerHTML = `<span class="minuta-z-wariantem"><span class="minuta">${m}</span>${litera ? '<span class="wariant-minuty">'+litera+'</span>' : ''}</span>`;
            if (k.numer) {
                kol.title = "Zobacz kurs " + k.numer;
                kol.onclick = () => pokazCalyKurs(k.numer);
            }
            wiersz.appendChild(kol);
        });
    }

    blok.appendChild(godziny);

    // Dodanie objaśnienia wariantów (legenda pod tabelką)
    const uzyteWarianty = zbierzWariantyPrzystanku(przystanek);
    if (uzyteWarianty.size > 0 && rozklad.warianty) {
        const leg = document.createElement("div");
        leg.className = "legenda-wariantow";
        let legList = '<div class="legenda-lista">';
        uzyteWarianty.forEach((_, litera) => {
            const w = rozklad.warianty.find(x => x.litera === litera);
            if (w) {
                legList += `<div class="legenda-element"><span class="legenda-litera">${litera}</span><span class="legenda-separator">-</span><span class="legenda-opis">${w.opis}</span></div>`;
            }
        });
        legList += '</div>';
        leg.innerHTML = legList;
        blok.appendChild(leg);
    }

    kontener.appendChild(blok);
}

function zbierzWariantyPrzystanku(p) {
    const w = new Map();
    if (p.kursy) p.kursy.forEach(k => { if(k.wariant) w.set(k.wariant, ""); });
    return w;
}

function czasWMinutach(czasString) {
    if (!czasString) return 0;
    const parts = czasString.split(":");
    return parts.length === 2 ? parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10) : 0;
}

function pokazCalyKurs(nrKursu) {
    const rozklad = znajdzRozklad();
    const kierunek = rozklad.kierunki[aktualnyKierunek];
    const przystankiK = kierunek.przystanki || [];
    const kursPrzystanki = [];

    przystankiK.forEach((p, idx) => {
        const k = (p.kursy || []).find(x => x.numer === nrKursu);
        if (k) kursPrzystanki.push({ nazwa: p.nazwa, nr: p.nr, naZadanie: p.naZadanie, czas: k.czas });
    });

    const kontener = document.getElementById("przystanki");
    document.getElementById("typRozkladu").textContent = "Przebieg kursu";
    document.querySelector(".dni").style.display = "none";
    document.getElementById("kalendarz").style.display = "none";
    document.getElementById("warianty-pojemnik").style.display = "none";
    kontener.innerHTML = "";

    const widok = document.createElement("div");
    widok.className = "kurs-widok";
    widok.innerHTML = `<div class="kurs-naglowek"><div class="kurs-tytul">Kurs ${nrKursu}</div><div class="kurs-informacja">Przebieg przez ${kursPrzystanki.length} przystanków</div></div>`;
    
    const lista = document.createElement("div");
    lista.className = "kurs-lista";
    const pierwszyCzas = czasWMinutach(kursPrzystanki[0].czas);

    kursPrzystanki.forEach((el, index) => {
        const wiersz = document.createElement("div");
        wiersz.className = "kurs-przystanek" + (wybranyPrzystanek && wybranyPrzystanek.nr === el.nr ? " aktywny" : "");
        
        let diff = czasWMinutach(el.czas) - pierwszyCzas;
        if (diff < 0) diff += 24 * 60;

        const lineC = index === 0 ? "start" : (index === kursPrzystanki.length - 1 ? "end" : "middle");
        const isNz = el.naZadanie === true;
        const iconC = index === 0 ? "square bg-black" : (index === kursPrzystanki.length - 1 ? "square bg-red" : (isNz ? "nz" : "circle bg-red"));

        wiersz.innerHTML = `
            <div class="kurs-czas-rel">${diff} min</div>
            <div class="node-wrapper">
                <div class="linia-pionowa ${lineC}"></div>
                <div class="wezel ${iconC}"></div>
            </div>
            <div class="kurs-nazwa-box">${el.nazwa}<span>${el.nr ? el.nr : ''}</span></div>
            <div class="kurs-czas-abs">${el.czas}</div>
        `;
        lista.appendChild(wiersz);
    });

    widok.appendChild(lista);
    kontener.appendChild(widok);
}

</script>

</body>
</html>
