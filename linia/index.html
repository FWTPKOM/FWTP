<!DOCTYPE html>

<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rozkład jazdy</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800;900&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   GŁÓWNY KONTENER I NAGŁÓWKI
   ========================================================= */

.rozkład {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px;
}

/* =========================================================
   NAGŁÓWEK LINII
   ========================================================= */

.naglowek-linii {
    display: block;

    width: fit-content;
    min-width: 165px;

    margin-left: 10%;
    margin-right: 0;

    margin-bottom: 15px;

    background: white;

    border: 1px solid #ddd;

    border-radius: 0;

    padding: 0;

    box-sizing: border-box;

    text-align: center;

    overflow: hidden;
}


/* =========================================================
   NUMER LINII
   ========================================================= */

.numer-linii {
    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;

    height: 100px;

    margin: 0;
    padding: 0 22px;

    box-sizing: border-box;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 80px;

    font-weight: 700;

    line-height: 1;

    text-align: center;

    color: #222;

    /* WAŻNE */
    transform: none;
}


/* =========================================================
   FIOLETOWY PASEK POD NUMEREM
   ========================================================= */

.naglowek-linii::after {
    content: "";

    display: block;

    width: 100%;

    height: 16px;

    background: #990066;
}


/* =========================================================
   TRAMWAJ
   ========================================================= */

.naglowek-linii.tramwaj::after {
    background: #e30613;
}


/* =========================================================
   UKRYCIE TRASY
   ========================================================= */

.trasa {
    display: none;
}


/* =========================================================
   TRAMWAJ
   ========================================================= */

.naglowek-linii.tramwaj {
    border-bottom-color: #e30613;
}

/* =========================================================
   KIERUNKI I DNI
   ========================================================= */

.kierunki,
.dni {
    display: flex;
    gap: 10px;
    width: 80%;
    margin-left: auto;
    margin-right: auto;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.kierunek-btn,
.dzien-btn {
    flex: 1;
    padding: 14px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
     font-family:
        "Barlow Semi Condensed",
        sans-serif;
   font-size: 17px;
    font-weight: 700;
    color: #222;
    text-align: center;
    transition: 0.15s;
    box-sizing: border-box;
}

.kierunek-btn:hover,
.dzien-btn:hover {
    color: #d61c12;
    border-color: #d61c12;
    background: #fff;
}

.kierunek-btn.aktywny,
.dzien-btn.aktywny {
   background: #d61c12;
    color: white;
    border-color: #d61c12;
}
.kierunek-btn.aktywny:hover {
    background: #d61c12;

    color: white;

    border-color: #d61c12;
}

/* =========================================================
   WARIANTY
   ========================================================= */

.warianty-pojemnik {
    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #fff;

    border-top: 2px solid #ccc;
    border-bottom: 2px solid #ccc;

    width: 80%;

    margin-left: auto;
    margin-right: auto;

    padding: 10px 10px 10px 15px;

    margin-bottom: 0;

    box-sizing: border-box;
}

.warianty-info {
    font-size: 15px;
    color: #1d1d1b;
    padding-left: 10px;
}

.warianty-info strong {
    font-weight: 700;
}

.warianty-przyciski {
    display: flex;
    gap: 2px;
    padding-right: 10px;
}

.wariant-btn {
    padding: 4px 12px;

    font-size: 22px;
    font-weight: 900;

    color: #706f6f;

    background: transparent;
    border: none;

    border-bottom: 4px solid transparent;

    cursor: pointer;

    transition: 0.15s;

    font-family: inherit;

    text-transform: uppercase;
}

.wariant-btn:hover {
    color: #d61c12;
}

.wariant-btn.aktywny {
    color: #d61c12;
    border-bottom-color: #d61c12;
}


/* =========================================================
   KALENDARZ / ŁADOWANIE / BŁĘDY
   ========================================================= */

.kalendarz {
    display: none;

    background: white;

    border: 1px solid #ddd;
    border-radius: 6px;

    padding: 15px;
    margin-bottom: 15px;
}

.kalendarz input {
    padding: 10px;

    font-size: 16px;

    border: 1px solid #ccc;
    border-radius: 5px;
}

.typ-rozkładu {
    background: #f7f7f7;

    border: 1px solid #ddd;

    width: 80%;

    margin-left: auto;
    margin-right: auto;

    padding: 12px 15px;

    margin-bottom: 15px;

    border-radius: 6px;

    font-size: 14px;
    color: #555;

    box-sizing: border-box;
}

.brak-godzin {
    padding: 15px;

    color: #777;

    font-size: 14px;
}

.loading {
    background: white;

    border: 1px solid #ddd;
    border-radius: 8px;

    padding: 30px;

    text-align: center;

    color: #666;
}

.blad {
    background: #fff4f4;

    border: 1px solid #e0aaaa;

    color: #a00000;

    border-radius: 8px;

    padding: 20px;

    line-height: 1.6;
}

.blad strong {
    display: block;
    margin-bottom: 8px;
}

.brak-danych {
    padding: 30px;

    text-align: center;

    color: #777;

    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;
}


/* =========================================================
   ROZKŁAD JAZDY
   ========================================================= */

.przystanek {
    background: white;

    border: 1px solid #ddd;

    border-radius: 7px;

    overflow: hidden;
}

.godziny {
    width: 100%;
}

.wiersz-godziny {
    display: grid;

    grid-template-columns:
        43px
        repeat(10, 46px);

    grid-auto-columns: 46px;

    min-height: 38px;

    border-bottom: 1px solid #eee;
}

.kolumna-godzina {
    display: flex;

    align-items: center;
    justify-content: center;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 16px;

    font-weight: 600;

    background: #555;

    color: white;

    border-right: 1px solid #444;

    min-height: 38px;
}

.kolumna-minuta {
    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    position: relative;

    min-height: 38px;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-weight: 600;

    width: 46px;

    color: black;

    transform: translateX(10px);

    cursor: pointer;
}

.kolumna-minuta:hover {
    background: #e8eef5;
}

.minuta-z-wariantem {
    position: relative;

    display: inline-block;

    line-height: 1;

    text-align: center;
}

.minuta {
    display: inline-block;

    font-size: 16px;

    font-weight: 600;

    line-height: 1;

    z-index: 1;
}

.wariant-minuty {
    position: absolute;

    left: calc(100% + 2px);

    bottom: -1px;

    font-size: 12px;

    line-height: 1;

    font-weight: 600;

    white-space: nowrap;

    z-index: 2;
}


/* =========================================================
   LEGENDA
   ========================================================= */

.legenda-wariantow {
    background: #f7f7f7;

    border-top: 1px solid #ddd;

    padding: 10px 15px;

    font-size: 16px;

    color: #555;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;
}

.legenda-element {

    align-items: baseline;

    line-height: 1.35;

}

.legenda-litera,
.legenda-separator,

}

.legenda-litera {

    min-width: 22px;
}


/* =========================================================
   LISTA PRZYSTANKÓW
   ========================================================= */

.lista-przystankow {
    display: flex;

    flex-direction: column;

    gap: 0;

    background: white;

    border-radius: 0;

    box-sizing: border-box;
}


/* =========================================================
   WIERSZ PRZYSTANKU
   ========================================================= */

.przystanek-btn {
    width: 100%;

    display: flex;

    align-items: center;

    padding: 0;

    background: transparent;

    border: none;

    cursor: pointer;

    text-align: left;

.przystanek-btn:hover {

/* =========================================================

    font-size: 13px;

}


/* =========================================================

/* =========================================================

   ========================================================= */

    align-items: center;

    font-family:

}

.przystanek-btn.inactive .przystanek-nazwa {

}

.przystanek-btn.inactive:hover .przystanek-nazwa {

}


/* =========================================================
   NUMER PRZYSTANKU
   ========================================================= */

    font-family:

}

.naglowek-przystanku-widok .numer {

    margin-left: 8px;

/* =========================================================
   WIDOK CAŁEGO KURSU
   ========================================================= */

.kurs-widok {

    border-radius: 8px;

}

.kurs-naglowek {

.kurs-lista {

.kurs-przystanek {

.kurs-czas-rel {

/* =========================================================

if ("scrollRestoration" in history) {

<main class="rozkład">


<section class="naglowek-linii">

    <h1

    </h1>

></div>

        id="kalendarzBtn"

    </button>

<script>

if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
}


/* =========================================================
   ZMIENNE GŁÓWNE
   ========================================================= */

let daneLinii = null;
let numerLinii = null;
let aktualnyKierunek = 0;
let aktualnyWariant = null;
let aktualnyDzien = "dzisiaj";
let wybranaData = new Date();

let wybranyPrzystanek = null;
let wybranyPrzystanekIndex = null;
let wybranyPrzystanekId = null;

let widokKursuAktywny = false;


/* =========================================================
   PARAMETRY URL
   ========================================================= */

const parametry =
    new URLSearchParams(
        window.location.search
    );

numerLinii =
    parametry.get("linia");


if (!numerLinii) {

    pokazBlad(
        "Nie podano numeru linii.",
        "Wybierz linię z menu."
    );

} else {

    document.getElementById(
        "numerLinii"
    ).textContent =
        numerLinii;

    pobierzDane();
}


/* =========================================================
   USUWANIE POLA GODZINY
   ========================================================= */

function usunPoleGodziny(tekst) {

    const pozycja =
        tekst.search(
            /"godziny"\s*:\s*\[/
        );

    if (pozycja === -1)
        return tekst;

    const poczatekTablicy =
        tekst.indexOf(
            "[",
            pozycja
        );

    if (poczatekTablicy === -1)
        return tekst;

    let poziom = 0;
    let wStringu = false;
    let ucieczka = false;
    let koniecTablicy = -1;

    for (
        let i = poczatekTablicy;
        i < tekst.length;
        i++
    ) {

        const znak =
            tekst[i];

        if (ucieczka) {

            ucieczka = false;
            continue;
        }

        if (
            znak === "\\" &&
            wStringu
        ) {

            ucieczka = true;
            continue;
        }

        if (znak === '"') {

            wStringu =
                !wStringu;

            continue;
        }

        if (wStringu)
            continue;

        if (znak === "[")
            poziom++;

        if (znak === "]") {

            poziom--;

            if (poziom === 0) {

                koniecTablicy =
                    i;

                break;
            }
        }
    }

    if (koniecTablicy === -1)
        return tekst;

    let poczatek =
        pozycja;

    let koniec =
        koniecTablicy + 1;

    while (
        koniec < tekst.length &&
        /\s/.test(
            tekst[koniec]
        )
    ) {

        koniec++;
    }

    if (
        tekst[koniec] === ","
    ) {

        koniec++;
    }

    return (
        tekst.substring(
            0,
            poczatek
        ) +
        tekst
            .substring(koniec)
            .replace(
                /,\s*,/g,
                ","
            )
            .replace(
                /,\s*}/g,
                "}"
            )
    );
}


/* =========================================================
   POBIERANIE JSON
   ========================================================= */

async function pobierzDane() {

    const adres =
        "../dane/" +
        encodeURIComponent(
            numerLinii
        ) +
        ".json";

    try {

        const odpowiedz =
            await fetch(
                adres,
                {
                    cache: "no-cache"
                }
            );

        if (!odpowiedz.ok) {

            throw new Error(
                "Nie znaleziono pliku JSON dla linii " +
                numerLinii
            );
        }

        let tekst =
            await odpowiedz.text();

        try {

            daneLinii =
                JSON.parse(
                    tekst
                );

        } catch (e1) {

            daneLinii =
                JSON.parse(
                    usunPoleGodziny(
                        tekst
                    )
                );
        }

        uruchomStrone();

    } catch (blad) {

        pokazBlad(
            "Błąd ładowania.",
            blad.message
        );
    }
}


/* =========================================================
   ZAPIS PRZYSTANKU
   ========================================================= */

function ustawWybranyPrzystanek(
    p,
    index
) {

    if (!p) {

        wybranyPrzystanek = null;
        wybranyPrzystanekIndex = null;
        wybranyPrzystanekId = null;

        return;
    }

    wybranyPrzystanek = p;

    if (
        index !== undefined &&
        index !== null &&
        Number.isInteger(
            Number(index)
        )
    ) {

        wybranyPrzystanekIndex =
            Number(index);

    } else {

        wybranyPrzystanekIndex =
            null;
    }

    wybranyPrzystanekId = {

        kierunek:
            Number(
                aktualnyKierunek
            ),

        index:
            wybranyPrzystanekIndex,

        lp:
            p.lp !== undefined &&
            p.lp !== null
                ? String(
                    p.lp
                ).trim()
                : "",

        nr:
            p.nr !== undefined &&
            p.nr !== null
                ? String(
                    p.nr
                ).trim()
                : "",

        nazwa:
            String(
                p.nazwa || ""
            ).trim()
    };
}


/* =========================================================
   ZNAJDOWANIE PRZYSTANKU
   ========================================================= */

function znajdzPrzystanek(
    przystanki,
    identyfikator
) {

    if (
        !Array.isArray(
            przystanki
        ) ||
        przystanki.length === 0 ||
        identyfikator === null ||
        identyfikator === undefined
    ) {

        return null;
    }

    const szukany =
        String(
            identyfikator
        ).trim();

    if (
        szukany
            .toLowerCase()
            .startsWith("idx:")
    ) {

        const idx =
            Number(
                szukany
                    .substring(4)
                    .trim()
            );

        if (
            Number.isInteger(idx) &&
            idx >= 0 &&
            idx < przystanki.length
        ) {

            return przystanki[idx];
        }

        return null;
    }

    if (
        wybranyPrzystanekId &&
        Number(
            wybranyPrzystanekId.kierunek
        ) ===
        Number(
            aktualnyKierunek
        ) &&
        wybranyPrzystanekIndex !== null
    ) {

        const idx =
            Number(
                wybranyPrzystanekIndex
            );

        if (
            Number.isInteger(idx) &&
            idx >= 0 &&
            idx < przystanki.length
        ) {

            return przystanki[idx];
        }
    }

    if (
        szukany
            .toLowerCase()
            .startsWith("lp:")
    ) {

        const lp =
            szukany
                .substring(3)
                .trim();

        const znaleziony =
            przystanki.find(
                p =>
                    String(
                        p.lp !== undefined &&
                        p.lp !== null
                            ? p.lp
                            : ""
                    ).trim() === lp
            );

        if (znaleziony)
            return znaleziony;
    }

    if (
        wybranyPrzystanekId &&
        wybranyPrzystanekId.nr &&
        wybranyPrzystanekId.nazwa
    ) {

        const nr =
            wybranyPrzystanekId.nr;

        const nazwa =
            wybranyPrzystanekId.nazwa;

        const znaleziony =
            przystanki.find(
                p =>
                    String(
                        p.nr || ""
                    ).trim() === nr &&
                    normalizujTekst(
                        p.nazwa
                    ) ===
                    normalizujTekst(
                        nazwa
                    )
            );

        if (znaleziony)
            return znaleziony;
    }

    const poNr =
        przystanki.find(
            p =>
                String(
                    p.nr || ""
                ).trim() ===
                szukany
        );

    if (poNr)
        return poNr;

    const poNazwie =
        przystanki.find(
            p =>
                String(
                    p.nazwa || ""
                ).trim() ===
                szukany
        );

    if (poNazwie)
        return poNazwie;

    const normalny =
        normalizujTekst(
            szukany
        );

    return przystanki.find(
        p =>
            normalizujTekst(
                p.nazwa
            ) === normalny
    ) || null;
}

/* =========================================================
   TYP DNIA
   ========================================================= */

function okreslTypDnia(data) {

    const d =
        data.getDay();

    if (d === 6)
        return "sobota";

    if (d === 0)
        return "niedziela";

    return "roboczy";
}


/* =========================================================
   NORMALIZACJA
   ========================================================= */

function normalizujTekst(tekst) {

    return String(
        tekst || ""
    )
        .toLowerCase()
        .normalize(
            "NFD"
        )
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );
}


/* =========================================================
   NORMALIZACJA KLUCZA PRZYSTANKU
   ========================================================= */

function kluczPrzystanku(p) {

    if (!p)
        return "";

    const nr =
        String(
            p.nr || ""
        )
            .trim()
            .toLowerCase();

    const nazwa =
        normalizujTekst(
            p.nazwa || ""
        )
            .replace(
                /\s+/g,
                " "
            )
            .trim();

    /*
     * Numer przystanku jest najlepszym identyfikatorem.
     * Jeżeli go nie ma, korzystamy z nazwy.
     */

    if (nr)
        return "nr:" + nr;

    if (nazwa)
        return "nazwa:" + nazwa;

    return "";
}


/* =========================================================
   NORMALIZACJA OPISU WARIANTU
   ========================================================= */

function normalizujOpisWariantu(
    opis
) {

    return normalizujTekst(
        opis
    )
        .replace(
            /\s+/g,
            " "
        )
        .trim();
}


/* =========================================================
   WIELKANOC
   ========================================================= */

function obliczWielkanoc(rok) {

    const a =
        rok % 19;

    const b =
        Math.floor(
            rok / 100
        );

    const c =
        rok % 100;

    const d =
        Math.floor(
            b / 4
        );

    const e =
        b % 4;

    const f =
        Math.floor(
            (b + 8) / 25
        );

    const g =
        Math.floor(
            (b - f + 1) / 3
        );

    const h =
        (
            19 * a +
            b -
            d -
            g +
            15
        ) % 30;

    const i =
        Math.floor(
            c / 4
        );

    const k =
        c % 4;

    const l =
        (
            32 +
            2 * e +
            2 * i -
            h -
            k
        ) % 7;

    const m =
        Math.floor(
            (a + 11 * h + 22 * l) / 451
        );

    const miesiac =
        Math.floor(
            (h + l - 7 * m + 114) / 31
        );

    const dzien =
        (
            (h + l - 7 * m + 114) % 31
        ) + 1;

    return new Date(
        rok,
        miesiac - 1,
        dzien
    );
}


/* =========================================================
   DODAWANIE DNI
   ========================================================= */

function dodajDni(
    data,
    liczba
) {

    const wynik =
        new Date(
            data
        );

    wynik.setDate(
        wynik.getDate() +
        liczba
    );

    return wynik;
}


/* =========================================================
   KLUCZ DATY
   ========================================================= */

function kluczDaty(
    data
) {

    return (
        data.getFullYear() +
        "-" +
        String(
            data.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +
        "-" +
        String(
            data.getDate()
        ).padStart(
            2,
            "0"
        )
    );
}


/* =========================================================
   POLSKIE ŚWIĘTA
   ========================================================= */

function pobierzPolskieSwieta(
    rok
) {

    const swieta =
        new Set();


    function dodaj(
        miesiac,
        dzien
    ) {

        swieta.add(
            kluczDaty(
                new Date(
                    rok,
                    miesiac - 1,
                    dzien
                )
            )
        );
    }


    dodaj(1, 1);
    dodaj(1, 6);
    dodaj(5, 1);
    dodaj(5, 3);
    dodaj(8, 15);
    dodaj(11, 1);
    dodaj(11, 11);
    dodaj(12, 24);
    dodaj(12, 25);
    dodaj(12, 26);


    const wielkanoc =
        obliczWielkanoc(
            rok
        );


    swieta.add(
        kluczDaty(
            wielkanoc
        )
    );


    swieta.add(
        kluczDaty(
            dodajDni(
                wielkanoc,
                1
            )
        )
    );


    swieta.add(
        kluczDaty(
            dodajDni(
                wielkanoc,
                49
            )
        )
    );


    swieta.add(
        kluczDaty(
            dodajDni(
                wielkanoc,
                60
            )
        )
    );


    return swieta;
}


/* =========================================================
   CZY DATA JEST ŚWIĘTEM
   ========================================================= */

function czySwieto(
    data
) {

    if (!(data instanceof Date))
        return false;

    const swieta =
        pobierzPolskieSwieta(
            data.getFullYear()
        );

    return swieta.has(
        kluczDaty(
            data
        )
    );
}


/* =========================================================
   SPRAWDZENIE, CZY KURS JEST AKTYWNY
   ========================================================= */

function czyKursPasujeDoDaty(
    kurs,
    data
) {

    if (!kurs)
        return false;

    let uwagi =
        kurs.uwagi;

    if (
        uwagi === undefined ||
        uwagi === null
    ) {
        return false;
    }

    uwagi =
        String(
            uwagi
        )
            .trim()
            .toUpperCase();

    if (!uwagi)
        return false;

    const dzien =
        data.getDay();

    const swieto =
        czySwieto(
            data
        );


    if (
        uwagi === "D"
    ) {

        return (
            dzien >= 1 &&
            dzien <= 5 &&
            !swieto
        );
    }


    if (
        uwagi === "C"
    ) {

        return (
            dzien === 6 ||
            dzien === 0 ||
            swieto
        );
    }


    if (
        uwagi === "6"
    ) {

        return (
            dzien === 6 &&
            !swieto
        );
    }


    if (
        uwagi === "7"
    ) {

        return (
            dzien === 0 ||
            swieto
        );
    }


    return false;
}


/* =========================================================
   OKREŚLENIE SYMBOLU ROZKŁADU
   ========================================================= */

function okreslSymbolRozkladu(
    data
) {

    const dzienTygodnia =
        data.getDay();

    const swieto =
        czySwieto(
            data
        );


    if (
        dzienTygodnia >= 1 &&
        dzienTygodnia <= 5
    ) {

        if (swieto)
            return "7";

        return "D";
    }


    if (
        dzienTygodnia === 6
    ) {

        if (swieto)
            return "7";

        return "6";
    }


    if (
        dzienTygodnia === 0
    ) {

        return "7";
    }


    return "D";
}


/* =========================================================
   FILTROWANIE KURSÓW DLA DATY
   ========================================================= */

function filtrujKursyDlaDaty(
    kursy,
    data
) {

    if (
        !Array.isArray(
            kursy
        )
    ) {

        return [];
    }


    return kursy.filter(
        kurs =>
            czyKursPasujeDoDaty(
                kurs,
                data
            )
    );
}


/* =========================================================
   UTWORZENIE ROZKŁADU DLA DATY
   ========================================================= */

function przygotujKierunekDlaDaty(
    kierunek,
    data
) {

    if (!kierunek)
        return null;


    const nowyKierunek =
        Object.assign(
            {},
            kierunek
        );


    nowyKierunek.przystanki =
        (
            kierunek.przystanki ||
            []
        )
            .map(
                p => {

                    const nowyPrzystanek =
                        Object.assign(
                            {},
                            p
                        );


                    nowyPrzystanek.kursy =
                        filtrujKursyDlaDaty(
                            p.kursy || [],
                            data
                        );


                    return nowyPrzystanek;
                }
            )
            .filter(
                p =>
                    Array.isArray(
                        p.kursy
                    ) &&
                    p.kursy.length > 0
            );


    return nowyKierunek;
}


/* =========================================================
   MAPA WARIANTÓW DLA JEDNEGO ROZKŁADU
   ========================================================= */

function zbudujMapeWariantowDlaRozkladu(
    rozklad,
    mapaGlobalna
) {

    const mapa =
        new Map();


    if (
        !rozklad ||
        !Array.isArray(
            rozklad.warianty
        )
    ) {

        return mapa;
    }


    rozklad.warianty.forEach(
        wariant => {

            if (!wariant)
                return;


            const lokalnaLitera =
                String(
                    wariant.litera !== undefined &&
                    wariant.litera !== null
                        ? wariant.litera
                        : ""
                )
                    .trim()
                    .toUpperCase();


            const opis =
                String(
                    wariant.opis ||
                    ""
                ).trim();


            if (!lokalnaLitera)
                return;


            const klucz =
                normalizujOpisWariantu(
                    opis
                );


            if (
                klucz &&
                mapaGlobalna &&
                mapaGlobalna.has(
                    klucz
                )
            ) {

                mapa.set(
                    lokalnaLitera,
                    mapaGlobalna.get(
                        klucz
                    ).litera
                );

            } else {

                mapa.set(
                    lokalnaLitera,
                    lokalnaLitera
                );
            }
        }
    );


    return mapa;
}


/* =========================================================
   GLOBALNA MAPA WARIANTÓW PO OPISIE
   ========================================================= */

function zbudujGlobalnaMapeWariantow(
    rozklady
) {

    const mapa =
        new Map();


    (
        rozklady ||
        []
    ).forEach(
        rozklad => {

            if (
                !Array.isArray(
                    rozklad.warianty
                )
            ) {
                return;
            }


            rozklad.warianty.forEach(
                wariant => {

                    if (!wariant)
                        return;


                    const litera =
                        String(
                            wariant.litera !== undefined &&
                            wariant.litera !== null
                                ? wariant.litera
                                : ""
                        )
                            .trim()
                            .toUpperCase();


                    const opis =
                        String(
                            wariant.opis ||
                            ""
                        ).trim();


                    if (
                        !litera ||
                        !opis
                    ) {
                        return;
                    }


                    const klucz =
                        normalizujOpisWariantu(
                            opis
                        );


                    if (
                        !klucz
                    ) {
                        return;
                    }


                    if (
                        !mapa.has(
                            klucz
                        )
                    ) {

                        mapa.set(
                            klucz,
                            {
                                litera:
                                    litera,

                                opis:
                                    opis
                            }
                        );
                    }
                }
            );
        }
    );


    return mapa;
}


/* =========================================================
   ZNAJDŹ ROZKŁAD
   ========================================================= */

function znajdzRozklad() {

    if (
        !daneLinii ||
        !Array.isArray(
            daneLinii.rozkłady
        ) ||
        daneLinii.rozkłady.length === 0
    ) {

        return null;
    }


    const wynik = {

        nazwa:
            "Rozkład jazdy",

        kierunki:
            [],

        warianty:
            []
    };


    const symbolDnia =
        okreslSymbolRozkladu(
            wybranaData
        );


    /* =====================================================
       GLOBALNA MAPA WARIANTÓW
       ===================================================== */

    const mapaGlobalna =
        zbudujGlobalnaMapeWariantow(
            daneLinii.rozkłady
        );


    /* =====================================================
       MAPY WARIANTÓW DLA POSZCZEGÓLNYCH ROZKŁADÓW
       ===================================================== */

    const informacjeORozkladach =
        daneLinii.rozkłady.map(
            rozklad => {

                return {

                    rozklad:
                        rozklad,

                    mapaWariantow:
                        zbudujMapeWariantowDlaRozkladu(
                            rozklad,
                            mapaGlobalna
                        )
                };
            }
        );


    /* =====================================================
       WARIANTY WYNIKOWE
       ===================================================== */

    const wynikoweWarianty =
        new Map();


    mapaGlobalna.forEach(
        wariant => {

            if (
                !wynikoweWarianty.has(
                    wariant.litera
                )
            ) {

                wynikoweWarianty.set(
                    wariant.litera,
                    {
                        litera:
                            wariant.litera,

                        opis:
                            wariant.opis
                    }
                );
            }
        }
    );


    daneLinii.rozkłady.forEach(
        rozklad => {

            if (
                !Array.isArray(
                    rozklad.warianty
                )
            ) {
                return;
            }


            rozklad.warianty.forEach(
                wariant => {

                    if (!wariant)
                        return;


                    const litera =
                        String(
                            wariant.litera || ""
                        )
                            .trim()
                            .toUpperCase();


                    const opis =
                        String(
                            wariant.opis || ""
                        ).trim();


                    if (
                        !litera
                    )
                        return;


                    const klucz =
                        normalizujOpisWariantu(
                            opis
                        );


                    if (
                        !klucz &&
                        !wynikoweWarianty.has(
                            litera
                        )
                    ) {

                        wynikoweWarianty.set(
                            litera,
                            Object.assign(
                                {},
                                wariant,
                                {
                                    litera:
                                        litera
                                }
                            )
                        );
                    }
                }
            );
        }
    );


    wynik.warianty =
        Array.from(
            wynikoweWarianty.values()
        );


    wynik.warianty.sort(
        (
            a,
            b
        ) => {

            return String(
                a.litera || ""
            ).localeCompare(
                String(
                    b.litera || ""
                ),
                "pl",
                {
                    numeric: true
                }
            );
        }
    );


    /* =====================================================
       LICZBA KIERUNKÓW
       ===================================================== */

    let liczbaKierunkow =
        0;


    daneLinii.rozkłady.forEach(
        rozklad => {

            if (
                Array.isArray(
                    rozklad.kierunki
                )
            ) {

                liczbaKierunkow =
                    Math.max(
                        liczbaKierunkow,
                        rozklad.kierunki.length
                    );
            }
        }
    );


    /* =====================================================
       BUDOWANIE KIERUNKÓW
       ===================================================== */

    for (
        let kierunekIndex = 0;
        kierunekIndex < liczbaKierunkow;
        kierunekIndex++
    ) {

        /*
         * -------------------------------------------------
         * WYBÓR GŁÓWNEJ TRASY
         * -------------------------------------------------
         *
         * Główna trasa jest teraz wybierana na podstawie
         * LICZBY KURSÓW dla wybranej daty.
         *
         * Nie liczymy już liczby przystanków.
         *
         * Przykład:
         *
         * trasa 1 = 40 kursów
         * trasa 2 = 15 kursów
         *
         * jako bazowa zostanie wybrana trasa 1.
         */

        let najlepszyRozklad =
            null;

        let najlepszaLiczbaKursow =
            -1;


        informacjeORozkladach.forEach(
            info => {

                const rozklad =
                    info.rozklad;


                if (
                    !Array.isArray(
                        rozklad.kierunki
                    )
                ) {
                    return;
                }


                const kierunek =
                    rozklad.kierunki[
                        kierunekIndex
                    ];


                if (
                    !kierunek ||
                    !Array.isArray(
                        kierunek.przystanki
                    )
                ) {
                    return;
                }


                /*
                 * LICZYMY WSZYSTKIE KURSY,
                 * a nie liczbę przystanków.
                 */

                let liczbaKursow =
                    0;


                kierunek.przystanki.forEach(
                    p => {

                        const kursy =
                            filtrujKursyDlaDaty(
                                p.kursy || [],
                                wybranaData
                            );


                        /*
                         * Każdy kurs znaleziony
                         * przy przystanku zwiększa
                         * licznik o 1.
                         */

                        liczbaKursow +=
                            kursy.length;
                    }
                );


                /*
                 * Rozkład z największą liczbą
                 * kursów staje się bazowym.
                 */

                if (
                    liczbaKursow >
                    najlepszaLiczbaKursow
                ) {

                    najlepszaLiczbaKursow =
                        liczbaKursow;

                    najlepszyRozklad =
                        info;
                }
            }
        );


        /*
         * Jeżeli nie znaleźliśmy żadnego rozkładu
         * z kursami dla wybranej daty, pomijamy kierunek.
         */

        if (
            !najlepszyRozklad ||
            najlepszaLiczbaKursow <= 0
        ) {

            continue;
        }


        const bazaKierunku =
            najlepszyRozklad
                .rozklad
                .kierunki[
                    kierunekIndex
                ];


        /*
         * Trasa bazowa pochodzi z rozkładu,
         * który ma NAJWIĘCEJ KURSÓW dla wybranej daty.
         */

        const aktywnePrzystankiBazy =
            bazaKierunku.przystanki
                .map(
                    p => {

                        const kursy =
                            filtrujKursyDlaDaty(
                                p.kursy || [],
                                wybranaData
                            );


                        return {

                            przystanek:
                                p,

                            kursy:
                                kursy
                        };
                    }
                )
                .filter(
                    x =>
                        x.kursy.length > 0
                );


        const nowyKierunek = {

            nazwa:
                bazaKierunku.nazwa ||
                "",

            kierunek:
                bazaKierunku.kierunek ||
                "",

            przystanki:
                []
        };


        /*
         * -------------------------------------------------
         * BUDOWANIE PRZYSTANKÓW
         * -------------------------------------------------
         */

        aktywnePrzystankiBazy.forEach(
            element => {

                const baza =
                    element.przystanek;


                const kursyZDaty =
                    element.kursy;


                const klucz =
                    kluczPrzystanku(
                        baza
                    );


                const wszystkieKursy =
                    [];


                /*
                 * Dodajemy kursy z właściwego
                 * rozkładu bazowego.
                 */

                kursyZDaty.forEach(
                    kurs => {

                        if (!kurs)
                            return;


                        const nowyKurs =
                            Object.assign(
                                {},
                                kurs
                            );


                        const lokalnaLitera =
                            pobierzWariant(
                                kurs
                            );


                        const kanonicznaLitera =
                            najlepszyRozklad
                                .mapaWariantow
                                .get(
                                    lokalnaLitera
                                ) ||
                            lokalnaLitera;


                        nowyKurs.wariant =
                            kanonicznaLitera;


                        nowyKurs.uwagi =
                            String(
                                kurs.uwagi || ""
                            )
                                .trim()
                                .toUpperCase();


                        wszystkieKursy.push(
                            nowyKurs
                        );
                    }
                );


                /*
                 * ------------------------------------------------
                 * DODATKOWE ROZKŁADY
                 * ------------------------------------------------
                 */

                informacjeORozkladach.forEach(
                    info => {

                        if (
                            info ===
                            najlepszyRozklad
                        ) {
                            return;
                        }


                        const rozklad =
                            info.rozklad;


                        if (
                            !Array.isArray(
                                rozklad.kierunki
                            )
                        ) {
                            return;
                        }


                        const kierunek =
                            rozklad.kierunki[
                                kierunekIndex
                            ];


                        if (
                            !kierunek ||
                            !Array.isArray(
                                kierunek.przystanki
                            )
                        ) {
                            return;
                        }


                        const odpowiadajacy =
                            kierunek.przystanki.find(
                                p =>
                                    kluczPrzystanku(
                                        p
                                    ) === klucz
                            );


                        if (
                            !odpowiadajacy
                        ) {
                            return;
                        }


                        const kursy =
                            filtrujKursyDlaDaty(
                                odpowiadajacy.kursy || [],
                                wybranaData
                            );


                        kursy.forEach(
                            kurs => {

                                if (!kurs)
                                    return;


                                const nowyKurs =
                                    Object.assign(
                                        {},
                                        kurs
                                    );


                                const lokalnaLitera =
                                    pobierzWariant(
                                        kurs
                                    );


                                const kanonicznaLitera =
                                    info
                                        .mapaWariantow
                                        .get(
                                            lokalnaLitera
                                        ) ||
                                    lokalnaLitera;


                                nowyKurs.wariant =
                                    kanonicznaLitera;


                                nowyKurs.uwagi =
                                    String(
                                        kurs.uwagi || ""
                                    )
                                        .trim()
                                        .toUpperCase();


                                wszystkieKursy.push(
                                    nowyKurs
                                );
                            }
                        );
                    }
                );


                /*
                 * ------------------------------------------------
                 * USUWANIE DUPLIKATÓW KURSÓW
                 * ------------------------------------------------
                 */

                const mapaKursow =
                    new Map();


                wszystkieKursy.forEach(
                    kurs => {

                        const numer =
                            String(
                                kurs.numer ||
                                ""
                            ).trim();


                        const czas =
                            String(
                                kurs.czas ||
                                ""
                            ).trim();


                        const uwagi =
                            String(
                                kurs.uwagi ||
                                ""
                            )
                                .trim()
                                .toUpperCase();


                        const wariant =
                            pobierzWariant(
                                kurs
                            );


                        const kluczKursu =
                            numer +
                            "||" +
                            czas +
                            "||" +
                            uwagi +
                            "||" +
                            wariant;


                        if (
                            !mapaKursow.has(
                                kluczKursu
                            )
                        ) {

                            mapaKursow.set(
                                kluczKursu,
                                Object.assign(
                                    {},
                                    kurs,
                                    {
                                        uwagi:
                                            uwagi,

                                        wariant:
                                            wariant
                                    }
                                )
                            );
                        }
                    }
                );


                const finalneKursy =
                    Array.from(
                        mapaKursow.values()
                    );


                /*
                 * Jeżeli po wszystkim nie ma kursu,
                 * przystanek nie może się pojawić.
                 */

                if (
                    finalneKursy.length === 0
                ) {

                    return;
                }


                const nowyPrzystanek =
                    Object.assign(
                        {},
                        baza
                    );


                nowyPrzystanek.kursy =
                    finalneKursy;


                /*
                 * ------------------------------------------------
                 * BUDOWANIE GODZIN
                 * ------------------------------------------------
                 */

                const mapaGodzin =
                    new Map();


                finalneKursy.forEach(
                    kurs => {

                        const czas =
                            String(
                                kurs.czas ||
                                ""
                            ).trim();


                        const dop =
                            czas.match(
                                /^(\d{1,2}):(\d{2})$/
                            );


                        if (!dop)
                            return;


                        const godzina =
                            dop[1].padStart(
                                2,
                                "0"
                            );


                        const minuta =
                            dop[2];


                        if (
                            !mapaGodzin.has(
                                godzina
                            )
                        ) {

                            mapaGodzin.set(
                                godzina,
                                []
                            );
                        }


                        mapaGodzin
                            .get(
                                godzina
                            )
                            .push(
                                {
                                    minuta:
                                        minuta,

                                    wariant:
                                        pobierzWariant(
                                            kurs
                                        ),

                                    brygada:
                                        kurs.brygada ||
                                        "",

                                    uwagi:
                                        kurs.uwagi ||
                                        ""
                                }
                            );
                    }
                );


                nowyPrzystanek.godziny =
                    Array.from(
                        mapaGodzin.entries()
                    )
                        .sort(
                            (
                                a,
                                b
                            ) =>
                                Number(a[0]) -
                                Number(b[0])
                        )
                        .map(
                            (
                                [
                                    godzina,
                                    minuty
                                ]
                            ) => {

                                minuty.sort(
                                    (
                                        a,
                                        b
                                    ) =>
                                        Number(
                                            a.minuta
                                        ) -
                                        Number(
                                            b.minuta
                                        )
                                );


                                return {

                                    godzina:
                                        godzina,

                                    minuty:
                                        minuty
                                };
                            }
                        );


                nowyKierunek.przystanki.push(
                    nowyPrzystanek
                );
            }
        );


        /*
         * Dodajemy kierunek tylko wtedy,
         * gdy ma faktycznie przystanki.
         */

        if (
            nowyKierunek.przystanki.length > 0
        ) {

            wynik.kierunki.push(
                nowyKierunek
            );
        }
    }


    if (
        wynik.kierunki.length === 0
    ) {

        return null;
    }


    return wynik;
}


/* =========================================================
   KIERUNKI
   ========================================================= */

function generujKierunki() {

    const kontener =
        document.getElementById(
            "kierunki"
        );


    kontener.innerHTML =
        "";


    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !Array.isArray(
            rozklad.kierunki
        )
    )
        return;


    rozklad.kierunki.forEach(
        (
            kierunek,
            index
        ) => {

            const btn =
                document.createElement(
                    "button"
                );


            btn.className =
                "kierunek-btn" +
                (
                    index ===
                    aktualnyKierunek
                        ? " aktywny"
                        : ""
                );


            const p =
                kierunek.przystanki ||
                [];


            btn.textContent =
                p.length > 0
                    ? (
                        p[
                            p.length - 1
                        ].nazwa ||
                        "Kierunek"
                    )
                    : "Kierunek " +
                      (
                        index + 1
                    );


            btn.onclick =
                () => {

                    aktualnyKierunek =
                        index;

                    aktualnyWariant =
                        null;

                    ustawWybranyPrzystanek(
                        null
                    );

                    widokKursuAktywny =
                        false;

                    aktualizujHistorieURL(
                        null
                    );

                    pokazRozklad();
                };


            kontener.appendChild(
                btn
            );
        }
    );
}

) {

     */

    );

        null;


    widokKursuAktywny =

        .querySelectorAll(

        )
        .forEach(
            b =>

                )
        );

    ).style.display =
        "none";


    if (
        dzien ===
        "dzisiaj"
    ) {

        document.getElementById(
            "dzisiajBtn"

        );
