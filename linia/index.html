<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rozkład jazdy</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   GŁÓWNY KONTENER
   ========================================================= */

.rozkład {
    width: 100%;
    box-sizing: border-box;
}

/* =========================================================
   NAGŁÓWEK LINII
   ========================================================= */

.naglowek-linii {
    text-align: center;
    margin-bottom: 15px;
}

.numer-linii {
    margin: 0;
    font-size: 34px;
    font-weight: 700;
}

.trasa {
    margin: 4px 0 0 0;
    white-space: pre-line;
}

/* =========================================================
   KIERUNKI
   ========================================================= */

.kierunki {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 15px;
}

.kierunek-btn {
    border: 1px solid #ccc;
    background: #f5f5f5;
    padding: 9px 16px;
    cursor: pointer;
    font-size: 14px;
    border-radius: 5px;
}

.kierunek-btn.aktywny {
    background: #555;
    color: white;
}

/* =========================================================
   WARIANTY
   ========================================================= */

.warianty-pojemnik {
    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #fff;

    border-top: 2px solid #ccc;
    border-bottom: 2px solid #ccc;

    width: 80%;

    margin-left: auto;
    margin-right: auto;

    padding: 10px 10px 10px 15px;

    /* BRAK ODSTĘPU POD PASKIEM WARIANTÓW */
    margin-bottom: 0;

    box-sizing: border-box;
}

.warianty-info {
    font-size: 14px;
    color: #555;
}

.warianty-przyciski {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: flex-end;
}

.wariant-btn {
    border: 1px solid #aaa;
    background: #f5f5f5;
    padding: 5px 9px;
    cursor: pointer;
    border-radius: 4px;
}

.wariant-btn.aktywny {
    background: #555;
    color: white;
}

/* =========================================================
   DNI
   ========================================================= */

.dni {
    display: none;
    justify-content: center;
    gap: 5px;
    margin: 15px auto;
}

.dzien-btn {
    padding: 8px 14px;
    border: 1px solid #ccc;
    background: #f5f5f5;
    cursor: pointer;
}

.dzien-btn.aktywny {
    background: #555;
    color: white;
}

/* =========================================================
   KALENDARZ
   ========================================================= */

.kalendarz {
    display: none;
    text-align: center;
    margin: 10px auto;
}

.kalendarz input {
    padding: 8px;
}

/* =========================================================
   TYP ROZKŁADU
   ========================================================= */

.typ-rozkładu {
    background: #f7f7f7;

    border: 1px solid #ddd;

    width: 80%;

    margin-left: auto;
    margin-right: auto;

    padding: 12px 15px;

    margin-bottom: 15px;

    border-radius: 6px;

    font-size: 14px;
    color: #555;

    box-sizing: border-box;
}

/* =========================================================
   LISTA PRZYSTANKÓW
   ========================================================= */

.lista-przystankow {
    display: flex;
    flex-direction: column;

    gap: 0;

    background: white;

    padding: 15px 0;

    border: 1px solid #ddd;

    border-radius: 8px;

    width: 80%;

    margin: 0 auto;

    box-sizing: border-box;
}

/* =========================================================
   WIERSZ PRZYSTANKU
   ========================================================= */

.przystanek-wiersz {
    display: grid;

    grid-template-columns: 70px 1fr;

    min-height: 44px;

    position: relative;

    cursor: pointer;

    box-sizing: border-box;
}

.przystanek-wiersz:hover {
    background: #f7f7f7;
}

/* =========================================================
   TOR / SVG
   ========================================================= */

.trasa-svg {
    width: 88px;
    height: 44px;

    display: block;

    overflow: visible;
}

/* =========================================================
   NAZWA PRZYSTANKU
   ========================================================= */

.nazwa-przystanku {
    display: flex;

    align-items: center;

    min-height: 44px;

    padding: 0 10px 0 0;

    font-size: 16px;

    line-height: 1.15;

    box-sizing: border-box;
}

.nazwa-przystanku strong {
    font-weight: 700;
}

/* =========================================================
   NŻ
   ========================================================= */

.nz {
    font-size: 12px;

    margin-left: 7px;

    color: #777;

    white-space: nowrap;
}

/* =========================================================
   NIEAKTYWNY PRZYSTANEK
   ========================================================= */

.przystanek-nieaktywny {
    color: #aaa;
}

.przystanek-nieaktywny .nazwa-przystanku {
    color: #aaa;
}

/* =========================================================
   ROZKŁAD PRZYSTANKU
   ========================================================= */

.rozkład-przystanku {
    width: 80%;

    margin: 0 auto;

    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;

    overflow: hidden;

    box-sizing: border-box;
}

/* =========================================================
   CAŁY KURS
   ========================================================= */

.caly-kurs {
    width: 80%;

    margin: 0 auto;

    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;

    overflow: hidden;

    box-sizing: border-box;
}

.kurs-wiersz {
    display: grid;

    grid-template-columns: 40px 1fr;

    min-height: 44px;
}

.kurs-svg {
    width: 40px;
    height: 44px;

    display: block;

    overflow: visible;
}

.kurs-nazwa {
    display: flex;

    align-items: center;

    padding-right: 10px;

    font-size: 16px;
}

/* =========================================================
   GODZINY
   ========================================================= */

.wiersz-godziny {
    display: grid;

    grid-template-columns: 45px repeat(10, 19px);

    grid-auto-columns: 19px;

    align-items: center;
}

.kolumna-godzina {
    background: #555;

    color: white;

    border-right: 1px solid #444;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: 600;
}

.kolumna-minuta {
    width: 19px;
    min-width: 19px;
    max-width: 19px;

    text-align: center;
}

/* =========================================================
   LOADING
   ========================================================= */

.loading {
    text-align: center;

    padding: 30px;

    color: #777;
}

/* =========================================================
   BŁĄD
   ========================================================= */

.blad {
    width: 80%;

    margin: 20px auto;

    padding: 20px;

    background: #fff0f0;

    border: 1px solid #e0aaaa;

    color: #a00000;

    border-radius: 6px;

    box-sizing: border-box;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 800px) {

    .warianty-pojemnik,
    .typ-rozkładu,
    .lista-przystankow,
    .rozkład-przystanku,
    .caly-kurs,
    .blad {
        width: 95%;
    }

    .warianty-pojemnik {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
    }

    .warianty-przyciski {
        justify-content: flex-start;
    }
}

@media (max-width: 550px) {

    .lista-przystankow,
    .rozkład-przystanku,
    .caly-kurs {
        width: 100%;
        border-left: 0;
        border-right: 0;
        border-radius: 0;
    }

    .warianty-pojemnik,
    .typ-rozkładu {
        width: 100%;
        border-radius: 0;
    }

    .przystanek-wiersz {
        grid-template-columns: 70px 1fr;
    }

    .nazwa-przystanku {
        font-size: 15px;
    }
}

</style>
</head>

<body>

<script>
if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
}
</script>

<header class="topbar">

    <div class="logo">
        FWTP
    </div>

    <nav>
        <a href="../">Strona główna</a>
        <a href="../linie/">Linie</a>
    </nav>

</header>

<main class="rozkład">

<section class="naglowek-linii">

    <h1 id="numerLinii" class="numer-linii">
        Ładowanie...
    </h1>

    <p id="trasa" class="trasa">
        Pobieranie danych...
    </p>

</section>

<div id="kierunki" class="kierunki"></div>

<div
    id="warianty-pojemnik"
    class="warianty-pojemnik"
    style="display:none;"
>

    <div class="warianty-info">
        <strong>Uwaga!</strong>
        Ta linia ma różne warianty trasy
    </div>

    <div
        id="warianty-przyciski"
        class="warianty-przyciski"
    ></div>

</div>

<div class="dni" style="display:none;">

    <button
        id="dzisiajBtn"
        class="dzien-btn aktywny"
        onclick="wybierzDzien('dzisiaj')"
    >
        DZISIAJ
    </button>

    <button
        id="jutroBtn"
        class="dzien-btn"
        onclick="wybierzDzien('jutro')"
    >
        JUTRO
    </button>

    <button
        id="kalendarzBtn"
        class="dzien-btn"
        onclick="wybierzDzien('kalendarz')"
    >
        KALENDARZ
    </button>

</div>

<div
    id="kalendarz"
    class="kalendarz"
>
    <input
        type="date"
        id="wybranaData"
    >
</div>

<div
    id="typRozkładu"
    class="typ-rozkładu"
>
    Ładowanie rozkładu...
</div>

<div
    id="przystanki"
    class="przystanki"
>

    <div class="loading">
        Ładowanie przystanków...
    </div>

</div>

</main>

<script>

/* =========================================================
   ZMIENNE
   ========================================================= */

let daneLinii = null;

let numerLinii = null;

let aktualnyKierunek = null;

let aktualnyWariant = null;

let aktualnyDzien = null;

let wybranaData = null;

let wybranyPrzystanek = null;

let wybranyPrzystanekIndex = -1;

let wybranyPrzystanekId = null;

let widokKursuAktywny = false;


/* =========================================================
   GEOMETRIA TRASY
   ========================================================= */

const SPINE_X = 44;

const TRACK_W = 4;

const LEFT_X = SPINE_X - TRACK_W;

const RIGHT_X = SPINE_X + TRACK_W;

const SVG_W = RIGHT_X + 16;


/* =========================================================
   USUWANIE POLA GODZINY
   ========================================================= */

function usunPoleGodziny() {

    const el = document.querySelector(
        ".pole-godziny"
    );

    if (el) {
        el.remove();
    }

}


/* =========================================================
   POBIERANIE DANYCH
   ========================================================= */

async function pobierzDane() {

    try {

        const params =
            new URLSearchParams(
                window.location.search
            );

        numerLinii =
            params.get("linia");

        if (!numerLinii) {

            throw new Error(
                "Brak numeru linii w adresie."
            );

        }

        const response =
            await fetch(
                `../json/${numerLinii}.json`
            );

        if (!response.ok) {

            throw new Error(
                `Nie można pobrać danych linii ${numerLinii}.`
            );

        }

        daneLinii =
            await response.json();

        document.getElementById(
            "numerLinii"
        ).textContent =
            daneLinii.linia ||
            numerLinii;

        document.getElementById(
            "trasa"
        ).textContent =
            daneLinii.trasa ||
            "";

        uruchomStrone();

    }
    catch (error) {

        pokazBlad(
            error.message
        );

    }

}


/* =========================================================
   USTAWIANIE PRZYSTANKU
   ========================================================= */

function ustawWybranyPrzystanek(
    przystanek,
    index
) {

    wybranyPrzystanek =
        przystanek;

    wybranyPrzystanekIndex =
        index;

    wybranyPrzystanekId =
        przystanek.id ||
        przystanek.nr ||
        przystanek.numer ||
        null;

}


/* =========================================================
   ZNAJDŹ PRZYSTANEK
   ========================================================= */

function znajdzPrzystanek(
    lista,
    id
) {

    if (!Array.isArray(lista)) {
        return -1;
    }

    return lista.findIndex(
        p =>
            String(
                p.id ??
                p.nr ??
                p.numer ??
                ""
            ) === String(id)
    );

}


/* =========================================================
   URUCHOMIENIE STRONY
   ========================================================= */

function uruchomStrone() {

    aktualnyDzien =
        okreslTypDnia();

    generujKierunki();

    pokazRozklad();

}


/* =========================================================
   OKREŚLENIE TYPU DNIA
   ========================================================= */

function okreslTypDnia() {

    const dzis =
        new Date();

    const dzien =
        dzis.getDay();

    if (dzien === 0) {
        return "N";
    }

    if (dzien === 6) {
        return "S";
    }

    return "D";

}


/* =========================================================
   NORMALIZACJA TEKSTU
   ========================================================= */

function normalizujTekst(
    tekst
) {

    return String(
        tekst ?? ""
    )
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}


/* =========================================================
   ZNAJDŹ ROZKŁAD
   ========================================================= */

function znajdzRozklad() {

    if (!daneLinii) {
        return null;
    }

    if (
        daneLinii.rozkłady &&
        daneLinii.rozkłady[aktualnyDzien]
    ) {

        return daneLinii.rozkłady[
            aktualnyDzien
        ];

    }

    if (
        daneLinii.rozklady &&
        daneLinii.rozklady[aktualnyDzien]
    ) {

        return daneLinii.rozklady[
            aktualnyDzien
        ];

    }

    if (
        daneLinii.rozkład &&
        typeof daneLinii.rozkład === "object"
    ) {

        return daneLinii.rozkład;

    }

    if (
        daneLinii.rozklad &&
        typeof daneLinii.rozklad === "object"
    ) {

        return daneLinii.rozklad;

    }

    return daneLinii;

}


/* =========================================================
   GENEROWANIE KIERUNKÓW
   ========================================================= */

function generujKierunki() {

    const kontener =
        document.getElementById(
            "kierunki"
        );

    kontener.innerHTML = "";

    if (!daneLinii) {
        return;
    }

    let kierunki =
        daneLinii.kierunki ||
        daneLinii.directions ||
        [];

    if (!Array.isArray(kierunki)) {

        kierunki =
            Object.keys(
                kierunki
            ).map(
                key => ({
                    id: key,
                    nazwa:
                        kierunki[key]
                })
            );

    }

    kierunki.forEach(
        (kierunek, index) => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "kierunek-btn";

            button.textContent =
                kierunek.nazwa ||
                kierunek.kierunek ||
                kierunek.kierunek_nazwa ||
                `Kierunek ${index + 1}`;

            button.onclick =
                () => {

                    aktualnyKierunek =
                        kierunek;

                    aktualnyWariant =
                        null;

                    aktualizujHistorieURL();

                    pokazRozklad();

                };

            if (
                aktualnyKierunek === null &&
                index === 0
            ) {

                aktualnyKierunek =
                    kierunek;

            }

            if (
                aktualnyKierunek === kierunek
            ) {

                button.classList.add(
                    "aktywny"
                );

            }

            kontener.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   WYBÓR DNIA
   ========================================================= */

function wybierzDzien(
    dzien
) {

    const dzisiajBtn =
        document.getElementById(
            "dzisiajBtn"
        );

    const jutroBtn =
        document.getElementById(
            "jutroBtn"
        );

    const kalendarzBtn =
        document.getElementById(
            "kalendarzBtn"
        );

    dzisiajBtn.classList.remove(
        "aktywny"
    );

    jutroBtn.classList.remove(
        "aktywny"
    );

    kalendarzBtn.classList.remove(
        "aktywny"
    );

    if (dzien === "dzisiaj") {

        dzisiajBtn.classList.add(
            "aktywny"
        );

        aktualnyDzien =
            okreslTypDnia();

        document.getElementById(
            "kalendarz"
        ).style.display =
            "none";

    }

    else if (dzien === "jutro") {

        jutroBtn.classList.add(
            "aktywny"
        );

        const jutro =
            new Date();

        jutro.setDate(
            jutro.getDate() + 1
        );

        const day =
            jutro.getDay();

        if (day === 0) {
            aktualnyDzien = "N";
        }
        else if (day === 6) {
            aktualnyDzien = "S";
        }
        else {
            aktualnyDzien = "D";
        }

        document.getElementById(
            "kalendarz"
        ).style.display =
            "none";

    }

    else {

        kalendarzBtn.classList.add(
            "aktywny"
        );

        document.getElementById(
            "kalendarz"
        ).style.display =
            "block";

    }

    pokazRozklad();

}


/* =========================================================
   DATA
   ========================================================= */

document
    .getElementById("wybranaData")
    .addEventListener(
        "change",
        function () {

            wybranaData =
                this.value;

            const date =
                new Date(
                    this.value +
                    "T12:00:00"
                );

            const day =
                date.getDay();

            if (day === 0) {
                aktualnyDzien = "N";
            }
            else if (day === 6) {
                aktualnyDzien = "S";
            }
            else {
                aktualnyDzien = "D";
            }

            pokazRozklad();

        }
    );


/* =========================================================
   FORMATOWANIE DATY
   ========================================================= */

function formatujDateInput(
    date
) {

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );

    return `${year}-${month}-${day}`;

}


/* =========================================================
   POBIERANIE WARIANTU
   ========================================================= */

function pobierzWariant(
    wariant
) {

    aktualnyWariant =
        wariant;

    aktualizujHistorieURL();

    pokazRozklad();

}


/* =========================================================
   ZBIERANIE WARIANTÓW
   ========================================================= */

function zbierzWariantyDlaKierunku() {

    if (!aktualnyKierunek) {
        return [];
    }

    const warianty =
        aktualnyKierunek.warianty ||
        aktualnyKierunek.variants ||
        [];

    if (!Array.isArray(warianty)) {
        return [];
    }

    return warianty;

}


/* =========================================================
   HISTORIA URL
   ========================================================= */

function aktualizujHistorieURL() {

    const url =
        new URL(
            window.location.href
        );

    if (
        aktualnyKierunek &&
        aktualnyKierunek.id !== undefined
    ) {

        url.searchParams.set(
            "kierunek",
            aktualnyKierunek.id
        );

    }

    if (
        aktualnyWariant &&
        aktualnyWariant.id !== undefined
    ) {

        url.searchParams.set(
            "wariant",
            aktualnyWariant.id
        );

    }

    history.replaceState(
        {},
        "",
        url
    );

}


/* =========================================================
   POKAŻ ROZKŁAD
   ========================================================= */

function pokazRozklad() {

    if (!daneLinii) {
        return;
    }

    const warianty =
        zbierzWariantyDlaKierunku();

    const wariantyPojemnik =
        document.getElementById(
            "warianty-pojemnik"
        );

    const wariantyPrzyciski =
        document.getElementById(
            "warianty-przyciski"
        );

    wariantyPrzyciski.innerHTML = "";

    if (
        warianty.length > 0
    ) {

        wariantyPojemnik.style.display =
            "flex";

        warianty.forEach(
            (wariant, index) => {

                const btn =
                    document.createElement(
                        "button"
                    );

                btn.className =
                    "wariant-btn";

                btn.textContent =
                    wariant.nazwa ||
                    wariant.name ||
                    `Wariant ${index + 1}`;

                btn.onclick =
                    () => {

                        pobierzWariant(
                            wariant
                        );

                    };

                if (
                    aktualnyWariant === wariant
                ) {

                    btn.classList.add(
                        "aktywny"
                    );

                }

                wariantyPrzyciski.appendChild(
                    btn
                );

            }
        );

    }
    else {

        wariantyPojemnik.style.display =
            "none";

    }

    if (
        aktualnyKierunek &&
        aktualnyKierunek.przystanki
    ) {

        pokazListePrzystankow(
            aktualnyKierunek.przystanki
        );

    }
    else {

        const rozklad =
            znajdzRozklad();

        if (
            rozklad &&
            Array.isArray(
                rozklad.przystanki
            )
        ) {

            pokazListePrzystankow(
                rozklad.przystanki
            );

        }

    }

}


/* =========================================================
   CZY PRZYSTANEK NŻ
   ========================================================= */

function czyPrzystanekNaZadanie(
    przystanek
) {

    if (!przystanek) {
        return false;
    }

    return (
        przystanek.NŻ === true ||
        przystanek.nz === true ||
        przystanek.NZ === true ||
        normalizujTekst(
            przystanek.typ
        ) === "nz" ||
        normalizujTekst(
            przystanek.rodzaj
        ) === "nz"
    );

}


/* =========================================================
   LISTA PRZYSTANKÓW
   ========================================================= */

function pokazListePrzystankow(
    przystanki
) {

    widokKursuAktywny =
        false;

    /* USUNIĘTE „WYBIERZ PRZYSTANEK” */
    document.getElementById(
        "typRozkładu"
    ).style.display =
        "none";

    document.querySelector(
        ".dni"
    ).style.display =
        "none";

    document.getElementById(
        "kalendarz"
    ).style.display =
        "none";

    const kontener =
        document.getElementById(
            "przystanki"
        );

    if (
        !Array.isArray(przystanki) ||
        przystanki.length === 0
    ) {

        kontener.innerHTML =
            `<div class="loading">
                Brak przystanków.
            </div>`;

        return;

    }

    const SPINE_X = 44;

    const LEFT_X =
        SPINE_X - TRACK_W;

    const RIGHT_X =
        SPINE_X + TRACK_W;

    const SVG_W =
        RIGHT_X + 16;

    let html = "";

    przystanki.forEach(
        (
            przystanek,
            index
        ) => {

            const isFirstActive =
                index === 0;

            const isLastActive =
                index ===
                przystanki.length - 1;

            const isNz =
                czyPrzystanekNaZadanie(
                    przystanek
                );

            const strokeColor =
                "#555";

            const fillColor =
                "#555";

            const nodeX =
                SPINE_X;

            let nodeSvg = "";

            /* =================================================
               KWADRAT - PIERWSZY / OSTATNI
               ================================================= */

            if (
                isFirstActive ||
                isLastActive
            ) {

                if (isNz) {

                    /*
                     NŻ:
                     zewnętrzny rozmiar = 16 px
                     */

                    nodeSvg =
                        `<rect
                            x="${nodeX - 6.75}"
                            y="15.25"
                            width="13.5"
                            height="13.5"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                }
                else {

                    /*
                     zwykły:
                     16 × 16 px
                     */

                    nodeSvg =
                        `<rect
                            x="${nodeX - 8}"
                            y="14"
                            width="16"
                            height="16"
                            fill="${fillColor}"
                            stroke="none"
                        />`;

                }

            }

            /* =================================================
               KOŁO - POZOSTAŁE
               ================================================= */

            else {

                if (isNz) {

                    /*
                     NŻ:
                     geometryczne r = 6.75
                     + obrys 2.5 px
                     = zewnętrznie 16 px
                     */

                    nodeSvg =
                        `<circle
                            cx="${nodeX}"
                            cy="22"
                            r="6.75"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                }
                else {

                    /*
                     zwykły:
                     średnica 16 px
                     */

                    nodeSvg =
                        `<circle
                            cx="${nodeX}"
                            cy="22"
                            r="8"
                            fill="${fillColor}"
                            stroke="none"
                        />`;

                }

            }

            const nazwa =
                przystanek.nazwa ||
                przystanek.name ||
                przystanek.nazwa_przystanku ||
                "";

            html += `

                <div
                    class="przystanek-wiersz"
                    onclick="wybierzPrzystanek(${index})"
                >

                    <svg
                        class="trasa-svg"
                        width="${SVG_W}"
                        height="44"
                        viewBox="0 0 ${SVG_W} 44"
                    >

                        <line
                            x1="${SPINE_X}"
                            y1="0"
                            x2="${SPINE_X}"
                            y2="44"
                            stroke="#555"
                            stroke-width="${TRACK_W}"
                        />

                        ${nodeSvg}

                    </svg>

                    <div class="nazwa-przystanku">

                        <strong>
                            ${nazwa}
                        </strong>

                        ${
                            isNz
                            ? `<span class="nz">NŻ</span>`
                            : ""
                        }

                    </div>

                </div>

            `;

        }
    );

    kontener.innerHTML =
        `<div class="lista-przystankow">
            ${html}
        </div>`;

}


/* =========================================================
   WYBÓR PRZYSTANKU
   ========================================================= */

function wybierzPrzystanek(
    index
) {

    let przystanki = [];

    if (
        aktualnyKierunek &&
        Array.isArray(
            aktualnyKierunek.przystanki
        )
    ) {

        przystanki =
            aktualnyKierunek.przystanki;

    }
    else {

        const rozklad =
            znajdzRozklad();

        if (
            rozklad &&
            Array.isArray(
                rozklad.przystanki
            )
        ) {

            przystanki =
                rozklad.przystanki;

        }

    }

    if (
        index < 0 ||
        index >= przystanki.length
    ) {

        return;

    }

    ustawWybranyPrzystanek(
        przystanki[index],
        index
    );

    pokazRozkladWybranegoPrzystanku();

    requestAnimationFrame(
        () => {

            window.scrollTo(
                0,
                0
            );

            requestAnimationFrame(
                () => {

                    window.scrollTo(
                        0,
                        0
                    );

                }
            );

        }
    );

}


/* =========================================================
   ROZKŁAD WYBRANEGO PRZYSTANKU
   ========================================================= */

function pokazRozkladWybranegoPrzystanku() {

    widokKursuAktywny =
        false;

    const rozklad =
        znajdzRozklad();

    document.getElementById(
        "typRozkładu"
    ).style.display =
        "block";

    document.getElementById(
        "typRozkładu"
    ).textContent =
        rozklad?.nazwa ||
        "Rozkład jazdy";

    document.querySelector(
        ".dni"
    ).style.display =
        "flex";

    const kontener =
        document.getElementById(
            "przystanki"
        );

    const przystanek =
        wybranyPrzystanek;

    if (!przystanek) {
        return;
    }

    /*
     Tutaj zachowana jest dotychczasowa
     logika generowania godzin.
    */

    let odjazdy = [];

    if (
        Array.isArray(
            przystanek.odjazdy
        )
    ) {

        odjazdy =
            przystanek.odjazdy;

    }
    else if (
        Array.isArray(
            przystanek.departures
        )
    ) {

        odjazdy =
            przystanek.departures;

    }

    let html = "";

    html += `
        <div class="rozkład-przystanku">

            <div
                class="przystanek-wiersz"
                style="cursor:default;"
            >

                <svg
                    class="trasa-svg"
                    width="${SVG_W}"
                    height="44"
                    viewBox="0 0 ${SVG_W} 44"
                >

                    <line
                        x1="${SPINE_X}"
                        y1="0"
                        x2="${SPINE_X}"
                        y2="44"
                        stroke="#555"
                        stroke-width="${TRACK_W}"
                    />

                    <circle
                        cx="${SPINE_X}"
                        cy="22"
                        r="${
                            czyPrzystanekNaZadanie(
                                przystanek
                            )
                            ? "6.75"
                            : "8"
                        }"
                        fill="${
                            czyPrzystanekNaZadanie(
                                przystanek
                            )
                            ? "#ffffff"
                            : "#555"
                        }"
                        stroke="${
                            czyPrzystanekNaZadanie(
                                przystanek
                            )
                            ? "#555"
                            : "none"
                        }"
                        stroke-width="2.5"
                    />

                </svg>

                <div class="nazwa-przystanku">

                    <strong>
                        ${
                            przystanek.nazwa ||
                            przystanek.name ||
                            ""
                        }
                    </strong>

                    ${
                        czyPrzystanekNaZadanie(
                            przystanek
                        )
                        ? `<span class="nz">NŻ</span>`
                        : ""
                    }

                </div>

            </div>

            ${
                odjazdy.length
                ? odjazdy.map(
                    odjazd => {

                        const czas =
                            typeof odjazd === "string"
                            ? odjazd
                            : (
                                odjazd.czas ||
                                odjazd.time ||
                                ""
                            );

                        return `
                            <div
                                class="wiersz-godziny"
                            >

                                <div
                                    class="kolumna-godzina"
                                >
                                    ${czas}
                                </div>

                            </div>
                        `;

                    }
                ).join("")
                : `
                    <div
                        class="loading"
                    >
                        Brak odjazdów.
                    </div>
                `
            }

        </div>
    `;

    kontener.innerHTML =
        html;

    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    window.scrollTo({
                        top: 0,
                        left: 0,
                        behavior: "auto"
                    });

                    document.documentElement.scrollTop =
                        0;

                    document.body.scrollTop =
                        0;

                }
            );

        }
    );

}


/* =========================================================
   POKAŻ CAŁY KURS
   ========================================================= */

function pokazCalyKurs(
    kursPrzystanki
) {

    widokKursuAktywny =
        true;

    document.getElementById(
        "typRozkładu"
    ).style.display =
        "block";

    document.getElementById(
        "typRozkładu"
    ).textContent =
        "Przebieg kursu";

    document.querySelector(
        ".dni"
    ).style.display =
        "none";

    document.getElementById(
        "kalendarz"
    ).style.display =
        "none";

    const kontener =
        document.getElementById(
            "przystanki"
        );

    let svgHtml = "";

    kursPrzystanki.forEach(
        (
            el,
            index
        ) => {

            const isNz =
                czyPrzystanekNaZadanie(
                    el
                );

            const strokeColor =
                "#555";

            const fillColor =
                "#555";

            if (
                index === 0 ||
                index ===
                kursPrzystanki.length - 1
            ) {

                if (isNz) {

                    svgHtml +=
                        `<rect
                            x="13.25"
                            y="15.25"
                            width="13.5"
                            height="13.5"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                }
                else {

                    svgHtml +=
                        `<rect
                            x="12"
                            y="14"
                            width="16"
                            height="16"
                            fill="${fillColor}"
                            stroke="none"
                        />`;

                }

            }
            else {

                if (isNz) {

                    svgHtml +=
                        `<circle
                            cx="20"
                            cy="22"
                            r="6.75"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                }
                else {

                    svgHtml +=
                        `<circle
                            cx="20"
                            cy="22"
                            r="8"
                            fill="${fillColor}"
                            stroke="none"
                        />`;

                }

            }

            const nazwa =
                el.nazwa ||
                el.name ||
                "";

            svgHtml +=
                `<div class="kurs-wiersz">

                    <svg
                        class="kurs-svg"
                        width="40"
                        height="44"
                        viewBox="0 0 40 44"
                    >

                        <line
                            x1="20"
                            y1="0"
                            x2="20"
                            y2="44"
                            stroke="#555"
                            stroke-width="${TRACK_W}"
                        />

                        ${svgHtml}

                    </svg>

                    <div class="kurs-nazwa">

                        <strong>
                            ${nazwa}
                        </strong>

                        ${
                            isNz
                            ? `<span class="nz">NŻ</span>`
                            : ""
                        }

                    </div>

                </div>`;

        }
    );

    kontener.innerHTML =
        `<div class="caly-kurs">
            ${svgHtml}
        </div>`;

}


/* =========================================================
   POKAŻ BŁĄD
   ========================================================= */

function pokazBlad(
    komunikat
) {

    document.getElementById(
        "typRozkładu"
    ).style.display =
        "none";

    document.getElementById(
        "warianty-pojemnik"
    ).style.display =
        "none";

    document.getElementById(
        "przystanki"
    ).innerHTML =
        `
        <div class="blad">
            ${komunikat}
        </div>
        `;

}


/* =========================================================
   POPSTATE
   ========================================================= */

window.addEventListener(
    "popstate",
    function () {

        pokazRozklad();

    }
);


/* =========================================================
   START
   ========================================================= */

pobierzDane();

</script>
