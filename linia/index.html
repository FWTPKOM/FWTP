<!DOCTYPE html>

<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rozkład jazdy</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800;900&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   GŁÓWNY KONTENER I NAGŁÓWKI
   ========================================================= */

.rozkład {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px;
}

/* =========================================================
   NAGŁÓWEK LINII
   ========================================================= */

.naglowek-linii {
    display: block;

    width: fit-content;
    min-width: 165px;

    margin-left: 10%;
    margin-right: 0;

    margin-bottom: 15px;

    background: white;

    border: 1px solid #ddd;

    border-radius: 0;

    padding: 0;

    box-sizing: border-box;

    text-align: center;

    overflow: hidden;
}


/* =========================================================
   NUMER LINII
   ========================================================= */

.numer-linii {
    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;

    height: 100px;

    margin: 0;
    padding: 0 22px;

    box-sizing: border-box;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 80px;

    font-weight: 700;

    line-height: 1;

    text-align: center;

    color: #222;

    /* WAŻNE */
    transform: none;
}


/* =========================================================
   FIOLETOWY PASEK POD NUMEREM
   ========================================================= */

.naglowek-linii::after {
    content: "";

    display: block;

    width: 100%;

    height: 16px;

    background: #990066;
}


/* =========================================================
   TRAMWAJ
   ========================================================= */

.naglowek-linii.tramwaj::after {
    background: #e30613;
}


/* =========================================================
   UKRYCIE TRASY
   ========================================================= */

.trasa {
    display: none;
}


/* =========================================================
   TRAMWAJ
   ========================================================= */

.naglowek-linii.tramwaj {
    border-bottom-color: #e30613;
}

/* =========================================================
   KIERUNKI I DNI
   ========================================================= */

.kierunki,
.dni {
    display: flex;
    gap: 10px;
    width: 80%;
    margin-left: auto;
    margin-right: auto;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.kierunek-btn,
.dzien-btn {
    flex: 1;
    padding: 14px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
     font-family:
        "Barlow Semi Condensed",
        sans-serif;
   font-size: 17px;
    font-weight: 700;
    color: #222;
    text-align: center;
    transition: 0.15s;
    box-sizing: border-box;
}

.kierunek-btn:hover,
.dzien-btn:hover {
    color: #d61c12;
    border-color: #d61c12;
    background: #fff;
}

.kierunek-btn.aktywny,
.dzien-btn.aktywny {
   background: #d61c12;
    color: white;
    border-color: #d61c12;
}
.kierunek-btn.aktywny:hover {
    background: #d61c12;

    color: white;

    border-color: #d61c12;
}

/* =========================================================
   WARIANTY
   ========================================================= */

.warianty-pojemnik {
    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #fff;

    border-top: 2px solid #ccc;
    border-bottom: 2px solid #ccc;

    width: 80%;

    margin-left: auto;
    margin-right: auto;

    padding: 10px 10px 10px 15px;

    margin-bottom: 0;

    box-sizing: border-box;
}

.warianty-info {
    font-size: 15px;
    color: #1d1d1b;
    padding-left: 10px;
}

.warianty-info strong {
    font-weight: 700;
}

.warianty-przyciski {
    display: flex;
    gap: 2px;
    padding-right: 10px;
}

.wariant-btn {
    padding: 4px 12px;

    font-size: 22px;
    font-weight: 900;

    color: #706f6f;

    background: transparent;
    border: none;

    border-bottom: 4px solid transparent;

    cursor: pointer;

    transition: 0.15s;

    font-family: inherit;

    text-transform: uppercase;
}

.wariant-btn:hover {
    color: #d61c12;
}

.wariant-btn.aktywny {
    color: #d61c12;
    border-bottom-color: #d61c12;
}


/* =========================================================
   KALENDARZ / ŁADOWANIE / BŁĘDY
   ========================================================= */

.kalendarz {
    display: none;

    background: white;

    border: 1px solid #ddd;
    border-radius: 6px;

    padding: 15px;
    margin-bottom: 15px;
}

.kalendarz input {
    padding: 10px;

    font-size: 16px;

    border: 1px solid #ccc;
    border-radius: 5px;
}

.typ-rozkładu {
    background: #f7f7f7;

    border: 1px solid #ddd;

    width: 80%;

    margin-left: auto;
    margin-right: auto;

    padding: 12px 15px;

    margin-bottom: 15px;

    border-radius: 6px;

    font-size: 14px;
    color: #555;

    box-sizing: border-box;
}

.brak-godzin {
    padding: 15px;

    color: #777;

    font-size: 14px;
}

.loading {
    background: white;

    border: 1px solid #ddd;
    border-radius: 8px;

    padding: 30px;

    text-align: center;

    color: #666;
}

.blad {
    background: #fff4f4;

    border: 1px solid #e0aaaa;

    color: #a00000;

    border-radius: 8px;

    padding: 20px;

    line-height: 1.6;
}

.blad strong {
    display: block;
    margin-bottom: 8px;
}

.brak-danych {
    padding: 30px;

    text-align: center;

    color: #777;

    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;
}


/* =========================================================
   ROZKŁAD JAZDY
   ========================================================= */

.przystanek {
    background: white;

    border: 1px solid #ddd;

    border-radius: 7px;

    overflow: hidden;
}

.godziny {
    width: 100%;
}

.wiersz-godziny {
    display: grid;

    grid-template-columns:
        43px
        repeat(10, 46px);

    grid-auto-columns: 46px;

    min-height: 38px;

    border-bottom: 1px solid #eee;
}

.kolumna-godzina {
    display: flex;

    align-items: center;
    justify-content: center;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 16px;

    font-weight: 600;

    background: #555;

    color: white;

    border-right: 1px solid #444;

    min-height: 38px;
}

.kolumna-minuta {
    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    position: relative;

    min-height: 38px;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-weight: 600;

    width: 46px;

    color: black;

    transform: translateX(10px);

    cursor: pointer;
}

.kolumna-minuta:hover {
    background: #e8eef5;
}

.minuta-z-wariantem {
    position: relative;

    display: inline-block;

    line-height: 1;

    text-align: center;
}

.minuta {
    display: inline-block;

    font-size: 16px;

    font-weight: 600;

    line-height: 1;

    z-index: 1;
}

.wariant-minuty {
    position: absolute;

    left: calc(100% + 2px);

    bottom: -1px;

    font-size: 12px;

    line-height: 1;

    font-weight: 600;

    white-space: nowrap;

    z-index: 2;
}


/* =========================================================
   LEGENDA
   ========================================================= */

.legenda-wariantow {
    background: #f7f7f7;

    border-top: 1px solid #ddd;

    padding: 10px 15px;

    font-size: 16px;

    color: #555;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;
}

.legenda-element {
    display: flex;

    align-items: baseline;

    gap: 6px;

    line-height: 1.35;

}

.legenda-litera,
.legenda-separator,

}

.legenda-litera {
    font-size: 16px;

}


/* =========================================================
   LISTA PRZYSTANKÓW
   ========================================================= */

.lista-przystankow {
    display: flex;

    flex-direction: column;

    gap: 0;

    background: white;

    padding: 15px 0;

    border-radius: 0;

    box-sizing: border-box;
}


/* =========================================================
   WIERSZ PRZYSTANKU
   ========================================================= */

.przystanek-btn {
    width: 100%;

    display: flex;

    align-items: center;

    padding: 0;

    background: transparent;

    border: none;

    cursor: pointer;

    text-align: left;

.przystanek-btn:hover .przystanek-nazwa {

/* =========================================================
   KOLUMNA CZASU PRZEJAZDU

    white-space: nowrap;

.kolumna-czas-przejazdu.pierwszy {

}


/* =========================================================

    position: relative;

}

/* =========================================================

    align-items: center;

    font-family:
        "Barlow Semi Condensed",

    font-size: 16px;

    padding-left: 12px;

}

.przystanek-btn.inactive .przystanek-nazwa {

    font-weight: 600;
}

.przystanek-btn.inactive:hover .przystanek-nazwa {

}


/* =========================================================
   NUMER PRZYSTANKU
   ========================================================= */

    font-family:

    flex-shrink: 0;

}

.naglowek-przystanku-widok .numer {

    margin-left: 8px;

    font-family:

/* =========================================================
   WIDOK CAŁEGO KURSU
   ========================================================= */

.kurs-widok {
    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;

}

.kurs-naglowek {

.kurs-lista {

.kurs-przystanek {

    align-items: center;

.kurs-czas-rel {

.kurs-nazwa-box {

/* =========================================================

<script>

if ("scrollRestoration" in history) {

<header class="topbar">

<main class="rozkład">


<section class="naglowek-linii">

    <h1
        id="numerLinii"

    >

    </h1>

    id="kierunki"

></div>

    class="warianty-pojemnik"

>

        <strong>

        </strong>

        id="jutroBtn"

        id="kalendarzBtn"

    </button>

    id="kalendarz"

<script>

if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
}


/* =========================================================
   ZMIENNE GŁÓWNE
   ========================================================= */

let daneLinii = null;
let numerLinii = null;
let aktualnyKierunek = 0;
let aktualnyWariant = null;
let aktualnyDzien = "dzisiaj";
let wybranaData = new Date();

let wybranyPrzystanek = null;
let wybranyPrzystanekIndex = null;
let wybranyPrzystanekId = null;

let widokKursuAktywny = false;


/* =========================================================
   PARAMETRY URL
   ========================================================= */

const parametry =
    new URLSearchParams(
        window.location.search
    );

numerLinii =
    parametry.get("linia");


if (!numerLinii) {

    pokazBlad(
        "Nie podano numeru linii.",
        "Wybierz linię z menu."
    );

} else {

    document.getElementById(
        "numerLinii"
    ).textContent =
        numerLinii;

    pobierzDane();
}


/* =========================================================
   USUWANIE POLA GODZINY
   ========================================================= */

function usunPoleGodziny(tekst) {

    const pozycja =
        tekst.search(
            /"godziny"\s*:\s*\[/
        );

    if (pozycja === -1)
        return tekst;

    const poczatekTablicy =
        tekst.indexOf(
            "[",
            pozycja
        );

    if (poczatekTablicy === -1)
        return tekst;

    let poziom = 0;
    let wStringu = false;
    let ucieczka = false;
    let koniecTablicy = -1;

    for (
        let i = poczatekTablicy;
        i < tekst.length;
        i++
    ) {

        const znak =
            tekst[i];

        if (ucieczka) {

            ucieczka = false;
            continue;
        }

        if (
            znak === "\\" &&
            wStringu
        ) {

            ucieczka = true;
            continue;
        }

        if (znak === '"') {

            wStringu =
                !wStringu;

            continue;
        }

        if (wStringu)
            continue;

        if (znak === "[")
            poziom++;

        if (znak === "]") {

            poziom--;

            if (poziom === 0) {

                koniecTablicy =
                    i;

                break;
            }
        }
    }

    if (koniecTablicy === -1)
        return tekst;

    let poczatek =
        pozycja;

    let koniec =
        koniecTablicy + 1;

    while (
        koniec < tekst.length &&
        /\s/.test(
            tekst[koniec]
        )
    ) {

        koniec++;
    }

    if (
        tekst[koniec] === ","
    ) {

        koniec++;
    }

    return (
        tekst.substring(
            0,
            poczatek
        ) +
        tekst
            .substring(koniec)
            .replace(
                /,\s*,/g,
                ","
            )
            .replace(
                /,\s*}/g,
                "}"
            )
    );
}


/* =========================================================
   POBIERANIE JSON
   ========================================================= */

async function pobierzDane() {

    const adres =
        "../dane/" +
        encodeURIComponent(
            numerLinii
        ) +
        ".json";

    try {

        const odpowiedz =
            await fetch(
                adres,
                {
                    cache: "no-cache"
                }
            );

        if (!odpowiedz.ok) {

            throw new Error(
                "Nie znaleziono pliku JSON dla linii " +
                numerLinii
            );
        }

        let tekst =
            await odpowiedz.text();

        try {

            daneLinii =
                JSON.parse(
                    tekst
                );

        } catch (e1) {

            daneLinii =
                JSON.parse(
                    usunPoleGodziny(
                        tekst
                    )
                );
        }

        uruchomStrone();

    } catch (blad) {

        pokazBlad(
            "Błąd ładowania.",
            blad.message
        );
    }
}


/* =========================================================
   ZAPIS PRZYSTANKU
   ========================================================= */

function ustawWybranyPrzystanek(
    p,
    index
) {

    if (!p) {

        wybranyPrzystanek = null;
        wybranyPrzystanekIndex = null;
        wybranyPrzystanekId = null;

        return;
    }

    wybranyPrzystanek = p;

    if (
        index !== undefined &&
        index !== null &&
        Number.isInteger(
            Number(index)
        )
    ) {

        wybranyPrzystanekIndex =
            Number(index);

    } else {

        wybranyPrzystanekIndex =
            null;
    }

    wybranyPrzystanekId = {

        kierunek:
            Number(
                aktualnyKierunek
            ),

        index:
            wybranyPrzystanekIndex,

        lp:
            p.lp !== undefined &&
            p.lp !== null
                ? String(
                    p.lp
                ).trim()
                : "",

        nr:
            p.nr !== undefined &&
            p.nr !== null
                ? String(
                    p.nr
                ).trim()
                : "",

        nazwa:
            String(
                p.nazwa || ""
            ).trim()
    };
}


/* =========================================================
   ZNAJDOWANIE PRZYSTANKU
   ========================================================= */

function znajdzPrzystanek(
    przystanki,
    identyfikator
) {

    if (
        !Array.isArray(
            przystanki
        ) ||
        przystanki.length === 0 ||
        identyfikator === null ||
        identyfikator === undefined
    ) {

        return null;
    }

    const szukany =
        String(
            identyfikator
        ).trim();

    if (
        szukany
            .toLowerCase()
            .startsWith("idx:")
    ) {

        const idx =
            Number(
                szukany
                    .substring(4)
                    .trim()
            );

        if (
            Number.isInteger(idx) &&
            idx >= 0 &&
            idx < przystanki.length
        ) {

            return przystanki[idx];
        }

        return null;
    }

    if (
        wybranyPrzystanekId &&
        Number(
            wybranyPrzystanekId.kierunek
        ) ===
        Number(
            aktualnyKierunek
        ) &&
        wybranyPrzystanekIndex !== null
    ) {

        const idx =
            Number(
                wybranyPrzystanekIndex
            );

        if (
            Number.isInteger(idx) &&
            idx >= 0 &&
            idx < przystanki.length
        ) {

            return przystanki[idx];
        }
    }

    if (
        szukany
            .toLowerCase()
            .startsWith("lp:")
    ) {

        const lp =
            szukany
                .substring(3)
                .trim();

        const znaleziony =
            przystanki.find(
                p =>
                    String(
                        p.lp !== undefined &&
                        p.lp !== null
                            ? p.lp
                            : ""
                    ).trim() === lp
            );

        if (znaleziony)
            return znaleziony;
    }

    if (
        wybranyPrzystanekId &&
        wybranyPrzystanekId.nr &&
        wybranyPrzystanekId.nazwa
    ) {

        const nr =
            wybranyPrzystanekId.nr;

        const nazwa =
            wybranyPrzystanekId.nazwa;

        const znaleziony =
            przystanki.find(
                p =>
                    String(
                        p.nr || ""
                    ).trim() === nr &&
                    normalizujTekst(
                        p.nazwa
                    ) ===
                    normalizujTekst(
                        nazwa
                    )
            );

        if (znaleziony)
            return znaleziony;
    }

    const poNr =
        przystanki.find(
            p =>
                String(
                    p.nr || ""
                ).trim() ===
                szukany
        );

    if (poNr)
        return poNr;

    const poNazwie =
        przystanki.find(
            p =>
                String(
                    p.nazwa || ""
                ).trim() ===
                szukany
        );

    if (poNazwie)
        return poNazwie;

    const normalny =
        normalizujTekst(
            szukany
        );

    return przystanki.find(
        p =>
            normalizujTekst(
                p.nazwa
            ) === normalny
    ) || null;
}

/* =========================================================
   TYP DNIA
   ========================================================= */

function okreslTypDnia(data) {

    const d =
        data.getDay();

    if (d === 6)
        return "sobota";

    if (d === 0)
        return "niedziela";

    return "roboczy";
}


/* =========================================================
   NORMALIZACJA
   ========================================================= */

function normalizujTekst(tekst) {

    return String(
        tekst || ""
    )
        .toLowerCase()
        .normalize(
            "NFD"
        )
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );
}


/* =========================================================
   WIELKANOC
   ========================================================= */

function obliczWielkanoc(rok) {

    const a =
        rok % 19;

    const b =
        Math.floor(
            rok / 100
        );

    const c =
        rok % 100;

    const d =
        Math.floor(
            b / 4
        );

    const e =
        b % 4;

    const f =
        Math.floor(
            (b + 8) / 25
        );

    const g =
        Math.floor(
            (b - f + 1) / 3
        );

    const h =
        (
            19 * a +
            b -
            d -
            g +
            15
        ) % 30;

    const i =
        Math.floor(
            c / 4
        );

    const k =
        c % 4;

    const l =
        (
            32 +
            2 * e +
            2 * i -
            h -
            k
        ) % 7;

    const m =
        Math.floor(
            (a + 11 * h + 22 * l) / 451
        );

    const miesiac =
        Math.floor(
            (h + l - 7 * m + 114) / 31
        );

    const dzien =
        (
            (h + l - 7 * m + 114) % 31
        ) + 1;

    return new Date(
        rok,
        miesiac - 1,
        dzien
    );
}


/* =========================================================
   DODAWANIE DNI
   ========================================================= */

function dodajDni(
    data,
    liczba
) {

    const wynik =
        new Date(
            data
        );

    wynik.setDate(
        wynik.getDate() +
        liczba
    );

    return wynik;
}


/* =========================================================
   KLUCZ DATY
   ========================================================= */

function kluczDaty(
    data
) {

    return (
        data.getFullYear() +
        "-" +
        String(
            data.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +
        "-" +
        String(
            data.getDate()
        ).padStart(
            2,
            "0"
        )
    );
}


/* =========================================================
   POLSKIE ŚWIĘTA
   ========================================================= */

function pobierzPolskieSwieta(
    rok
) {

    const swieta =
        new Set();


    function dodaj(
        miesiac,
        dzien
    ) {

        swieta.add(
            kluczDaty(
                new Date(
                    rok,
                    miesiac - 1,
                    dzien
                )
            )
        );
    }


    /*
     * Święta stałe.
     */

    dodaj(1, 1);     // Nowy Rok
    dodaj(1, 6);     // Trzech Króli
    dodaj(5, 1);     // Święto Pracy
    dodaj(5, 3);     // Święto Konstytucji 3 Maja
    dodaj(8, 15);    // Wniebowzięcie NMP
    dodaj(11, 1);    // Wszystkich Świętych
    dodaj(11, 11);   // Święto Niepodległości
    dodaj(12, 24);   // Wigilia
    dodaj(12, 25);   // Boże Narodzenie
    dodaj(12, 26);   // Drugi dzień Bożego Narodzenia


    /*
     * Święta ruchome.
     */

    const wielkanoc =
        obliczWielkanoc(
            rok
        );


    /*
     * Wielkanoc.
     */

    swieta.add(
        kluczDaty(
            wielkanoc
        )
    );


    /*
     * Poniedziałek Wielkanocny.
     */

    swieta.add(
        kluczDaty(
            dodajDni(
                wielkanoc,
                1
            )
        )
    );


    /*
     * Zielone Świątki.
     * 49 dni po Wielkanocy.
     */

    swieta.add(
        kluczDaty(
            dodajDni(
                wielkanoc,
                49
            )
        )
    );


    /*
     * Boże Ciało.
     * 60 dni po Wielkanocy.
     */

    swieta.add(
        kluczDaty(
            dodajDni(
                wielkanoc,
                60
            )
        )
    );


    return swieta;
}


/* =========================================================
   CZY DATA JEST ŚWIĘTEM
   ========================================================= */

function czySwieto(
    data
) {

    if (!(data instanceof Date))
        return false;

    const swieta =
        pobierzPolskieSwieta(
            data.getFullYear()
        );

    return swieta.has(
        kluczDaty(
            data
        )
    );
}

/* =========================================================
   SPRAWDZENIE, CZY KURS JEST AKTYWNY W DANYM DNIU
   =========================================================

   D = poniedziałek-piątek, ale NIE święto
   C = sobota + niedziela + każde święto
   6 = zwykła sobota
   7 = niedziela + każde święto

   WAŻNE:
   - zwykła sobota  -> C + 6
   - sobota będąca świętem -> C + 7
   - niedziela -> C + 7
   - poniedziałek-piątek święto -> C + 7
   */

function czyKursPasujeDoDaty(
    kurs,
    data
) {

    if (!kurs)
        return false;


    /*
     * Brak uwag = stary JSON.
     * Zachowujemy kompatybilność.
     */

    if (
        kurs.uwagi === undefined ||
        kurs.uwagi === null
    ) {

        return true;
    }


    const uwagi =
        String(
            kurs.uwagi
        )
            .trim()
            .toUpperCase();


    /*
     * Puste uwagi = kurs zawsze dostępny.
     */

    if (!uwagi)
        return true;


    /*
     * Zabezpieczenie przed nieprawidłową datą.
     */

    if (
        !(data instanceof Date) ||
        isNaN(
            data.getTime()
        )
    ) {

        return false;
    }


    const dzien =
        data.getDay();


    const swieto =
        czySwieto(
            data
        );


    /* =====================================================
       D
       Poniedziałek-piątek, ale NIE święto
       ===================================================== */

    if (
        uwagi === "D"
    ) {

        return (
            dzien >= 1 &&
            dzien <= 5 &&
            !swieto
        );
    }


    /* =====================================================
       C
       Sobota + niedziela + każde święto
       ===================================================== */

    if (
        uwagi === "C"
    ) {

        return (
            dzien === 6 ||
            dzien === 0 ||
            swieto
        );
    }


    /* =====================================================
       6
       TYLKO zwykła sobota

       Jeżeli sobota jest świętem:
       6 NIE działa.
       ===================================================== */

    if (
        uwagi === "6"
    ) {

        return (
            dzien === 6 &&
            !swieto
        );
    }


    /* =====================================================
       7
       Niedziela + każde święto

       Dlatego:
       niedziela zwykła       -> TAK
       niedziela święto       -> TAK
       sobota zwykła          -> NIE
       sobota będąca świętem  -> TAK
       dzień roboczy święto   -> TAK
       ===================================================== */

    if (
        uwagi === "7"
    ) {

        return (
            dzien === 0 ||
            swieto
        );
    }


    /*
     * Nieznane oznaczenie.
     * Nie ukrywamy kursu.
     */

    return true;
}
/* =========================================================
   OKREŚLENIE SYMBOLU ROZKŁADU
   =========================================================

   D = poniedziałek-piątek, bez święta
   C = sobota + niedziela + święto
   6 = zwykła sobota
   7 = niedziela + święto
   */

function okreslSymbolRozkladu(
    data
) {

    const dzienTygodnia =
        data.getDay();

    const swieto =
        czySwieto(
            data
        );


    /*
     * Poniedziałek-piątek.
     */

    if (
        dzienTygodnia >= 1 &&
        dzienTygodnia <= 5
    ) {

        if (swieto)
            return "7";

        return "D";
    }


    /*
     * Sobota.
     *
     * Zwykła sobota = 6
     * Sobota będąca świętem = 7
     */

    if (
        dzienTygodnia === 6
    ) {

        if (swieto)
            return "7";

        return "6";
    }


    /*
     * Niedziela.
     */

    if (
        dzienTygodnia === 0
    ) {

        return "7";
    }


    return "D";
}
/* =========================================================
   FILTROWANIE KURSÓW DLA DATY
   ========================================================= */

function filtrujKursyDlaDaty(
    kursy,
    data
) {

    if (
        !Array.isArray(
            kursy
        )
    ) {

        return [];
    }


    return kursy.filter(
        kurs =>
            czyKursPasujeDoDaty(
                kurs,
                data
            )
    );
}


/* =========================================================
   UTWORZENIE ROZKŁADU DLA WYBRANEGO DNIA
   ========================================================= */

function przygotujKierunekDlaDaty(
    kierunek,
    data
) {

    if (!kierunek)
        return null;


    const nowyKierunek =
        Object.assign(
            {},
            kierunek
        );


    nowyKierunek.przystanki =
        (
            kierunek.przystanki ||
            []
        ).map(
            p => {

                const nowyPrzystanek =
                    Object.assign(
                        {},
                        p
                    );


                nowyPrzystanek.kursy =
                    filtrujKursyDlaDaty(
                        p.kursy || [],
                        data
                    );


                return nowyPrzystanek;
            }
        );


    return nowyKierunek;
}


/* =========================================================
   ZNAJDŹ ROZKŁAD
   ========================================================= */

function znajdzRozklad() {

    const rozklady =
        daneLinii.rozkłady ||
        [];

    if (
        rozklady.length === 0
    )
        return null;

    const typ =
        okreslTypDnia(
            wybranaData
        );

    if (
        typ === "sobota"
    ) {

        for (
            const r of rozklady
        ) {

            if (
                normalizujTekst(
                    r.nazwa
                ).includes(
                    "sobot"
                )
            ) {

                return r;
            }
        }
    }

    if (
        typ === "niedziela"
    ) {

        for (
            const r of rozklady
        ) {

            const n =
                normalizujTekst(
                    r.nazwa
                );

            if (
                n.includes(
                    "niedziel"
                ) ||
                n.includes(
                    "swiat"
                )
            ) {

                return r;
            }
        }
    }

    if (
        typ === "roboczy"
    ) {

        for (
            const r of rozklady
        ) {

            const n =
                normalizujTekst(
                    r.nazwa
                );

            if (
                n.includes(
                    "piatk"
                ) ||
                n.includes(
                    "poniedzial"
                )
            ) {

                return r;
            }
        }
    }

    return rozklady[0];
}

    if (

            rozklad.kierunki
        )
    )
        return;

    rozklad.kierunki.forEach(
        (
            kierunek,
            index
        ) => {

            const btn =
                document.createElement(

                );

            btn.className =

                        ? " aktywny"

                );

            const p =
                kierunek.przystanki ||
                [];

            btn.textContent =
                p.length > 0
                    ? (
                        p[
                            p.length - 1
                        ].nazwa ||
                        "Kierunek"
                    )
                    : "Kierunek " +
                      (
                        index + 1
                    );

            btn.onclick =
                () => {

                    aktualnyKierunek =
                        index;

                    aktualnyWariant =
                        null;

                    ustawWybranyPrzystanek(
                        null
                    );

                    widokKursuAktywny =
                        false;

                    aktualizujHistorieURL(
                        null
                    );

                    pokazRozklad();
                };

            kontener.appendChild(
                btn
            );
        }
    );
}

/* =========================================================
   WARIANT
   ========================================================= */

function pobierzWariant(k) {

    if (
        !k ||
        typeof k !== "object"
    ) {

        return "";
    }

    const wariant =
        k.wariant;

    let wynik = "";

    if (
        wariant &&
        typeof wariant === "object"
    ) {

        wynik = String(
            wariant.litera ||
            wariant.nazwa ||
            ""
        ).trim();

    } else {

        wynik = String(
            wariant ||
            ""
        ).trim();
    }


    if (wynik === "A")
        return "";

    return wynik;
}


/* =========================================================
   WARIANTY
   ========================================================= */

function zbierzWariantyDlaKierunku(
    kierunek
) {

    const set =
        new Set();


    (
        kierunek.przystanki ||
        []
    ).forEach(
        p =>
            (
                p.kursy ||
                []
            ).forEach(
                k => {

                    const w =
                        pobierzWariant(
                            k
                        );

                    if (
                        w !== undefined &&
                        w !== null
                    ) {

                        set.add(
                            w
                        );
                    }
                }
            )
    );


    return Array
        .from(set)
        .sort(
            (
                a,
                b
            ) => {

                if (
                    a === "" &&
                    b !== ""
                )
                    return -1;

                if (
                    a !== "" &&
                    b === ""
                )
                    return 1;

                return a.localeCompare(
                    b,
                    "pl",
                    {
                        numeric: true
                    }
                );
            }
        );
}


/* =========================================================
   DOMYŚLNY WARIANT
   ========================================================= */

function znajdzDomyslnyWariant(
    kierunek
) {

    const wariantStarty =
        new Map();


    (
        kierunek.przystanki ||
        []
    ).forEach(
        (
            przystanek,
            index
        ) => {

            (
                przystanek.kursy ||
                []
            ).forEach(
                kurs => {

                    const wariant =
                        pobierzWariant(
                            kurs
                        );

                    if (
                        !wariantStarty.has(
                            wariant
                        )
                    ) {

                        wariantStarty.set(
                            wariant,
                            index
                        );
                    }
                }
            );
        }
    );


    const lista =
        Array.from(
            wariantStarty.entries()
        );


    if (
        lista.length === 0
    )
        return "";


    lista.sort(
        (
            a,
            b
        ) => {

            if (
                a[1] !==
                b[1]
            ) {

                return (
                    a[1] -
                    b[1]
                );
            }

            if (
                a[0] === "" &&
                b[0] !== ""
            )
                return -1;

            if (
                a[0] !== "" &&
                b[0] === ""
            )
                return 1;

            return a[0].localeCompare(
                b[0],
                "pl",
                {
                    numeric: true
                }
            );
        }
    );


    return lista[0][0];
}


/* =========================================================
   CZAS NA MINUTY
   ========================================================= */

function czasNaMinuty(
    czas
) {

    const dop =
        String(
            czas || ""
        )
            .trim()
            .match(
                /^(\d{1,2}):(\d{2})$/
            );

    if (!dop)
        return null;


    const godzina =
        Number(
            dop[1]
        );


    const minuta =
        Number(
            dop[2]
        );


    if (
        godzina < 0 ||
        godzina > 23 ||
        minuta < 0 ||
        minuta > 59
    ) {

        return null;
    }


    return (
        godzina * 60 +
        minuta
    );
}


/* =========================================================
   ZNAJDOWANIE PIERWSZEGO KURSU
   ========================================================= */

function znajdzKursBazowy(
    kierunek,
    wariant
) {

    const przystanki =
        kierunek.przystanki ||
        [];


    const mapaKursow =
        new Map();


    przystanki.forEach(
        (
            p,
            index
        ) => {

            (
                p.kursy ||
                []
            ).forEach(
                k => {

                    if (
                        k.numer === undefined ||
                        k.numer === null
                    ) {

                        return;
                    }


                    const numer =
                        String(
                            k.numer
                        ).trim();


                    if (!numer)
                        return;


                    const kursWariant =
                        pobierzWariant(
                            k
                        );


                    const klucz =
                        numer +
                        "||" +
                        kursWariant;


                    if (
                        !mapaKursow.has(
                            klucz
                        )
                    ) {

                        mapaKursow.set(
                            klucz,
                            {
                                numer:
                                    k.numer,

                                wariant:
                                    kursWariant,

                                punkty:
                                    []
                            }
                        );
                    }


                    mapaKursow
                        .get(klucz)
                        .punkty
                        .push(
                            {
                                index:
                                    index,

                                czas:
                                    k.czas
                            }
                        );
                }
            );
        }
    );


    const wszystkieKursy =
        Array.from(
            mapaKursow.values()
        );


    wszystkieKursy.forEach(
        kurs => {

            kurs.punkty.sort(
                (
                    a,
                    b
                ) =>
                    a.index -
                    b.index
            );


            const pierwszy =
                kurs.punkty.find(
                    punkt =>
                        czasNaMinuty(
                            punkt.czas
                        ) !== null
                );


            kurs.startIndex =
                pierwszy
                    ? pierwszy.index
                    : 999999;


            kurs.startMinuty =
                pierwszy
                    ? czasNaMinuty(
                        pierwszy.czas
                    )
                    : null;
        }
    );


    const szukanyWariant =
        String(
            wariant || ""
        ).trim();


    const kandydaci =
        wszystkieKursy.filter(
            kurs =>
                kurs.wariant ===
                szukanyWariant
        );


    if (
        kandydaci.length === 0
    ) {

        return null;
    }


    kandydaci.sort(
        (
            a,
            b
        ) => {

            const aa =
                a.startMinuty === null
                    ? 999999
                    : a.startMinuty;


            const bb =
                b.startMinuty === null
                    ? 999999
                    : b.startMinuty;


            if (
                aa !== bb
            ) {

                return aa - bb;
            }


            return (
                a.startIndex -
                b.startIndex
            );
        }
    );


    return (
        kandydaci[0] ||
        null
    );
}


/* =========================================================
   POBIERANIE CZASÓW DOKŁADNEGO KURSU
   ========================================================= */

function pobierzCzasyKursu(
    kierunek,
    kurs
) {

    const przystanki =
        kierunek.przystanki ||
        [];


    const czasy =
        new Array(
            przystanki.length
        ).fill(
            null
        );


    if (!kurs)
        return czasy;


    (
        kurs.punkty ||
        []
    ).forEach(
        punkt => {

            const index =
                Number(
                    punkt.index
                );


            if (
                !Number.isInteger(
                    index
                ) ||
                index < 0 ||
                index >= przystanki.length
            ) {

                return;
            }


            const czas =
                String(
                    punkt.czas || ""
                ).trim();


            if (
                czasNaMinuty(
                    czas
                ) !== null
            ) {

                czasy[index] =
                    czas;
            }
        }
    );


    return czasy;
}


/* =========================================================
   SUMOWANIE CZASU PRZEJAZDU
   ========================================================= */

function obliczSumowaneCzasy(
    czasy
) {

    const wynik =
        new Array(
            czasy.length
        ).fill(
            null
        );


    let pierwszyCzas =
        null;


    for (
        let i = 0;
        i < czasy.length;
        i++
    ) {

        const minuty =
            czasNaMinuty(
                czasy[i]
            );


        if (
            minuty !== null
        ) {

            pierwszyCzas =
                minuty;

            break;
        }
    }


    if (
        pierwszyCzas === null
    ) {

        return wynik;
    }


    for (
        let i = 0;
        i < czasy.length;
        i++
    ) {

        const minuty =
            czasNaMinuty(
                czasy[i]
            );


        if (
            minuty === null
        )
            continue;


        let roznica =
            minuty -
            pierwszyCzas;


        if (
            roznica < 0
        ) {

            roznica +=
                24 * 60;
        }


        wynik[i] =
            roznica;
    }


    return wynik;
}

/* =========================================================
   NŻ
   ========================================================= */

function czyPrzystanekNaZadanie(
    p
) {

    if (!p)
        return false;


    const typ =
        String(
            p.typ || ""
        )
            .trim()
            .toUpperCase();


    if (
        typ === "NŻ" ||
        typ === "NZ"
    ) {

        return true;
    }


    if (
        p.naZadanie === true ||
        String(
            p.naZadanie
        ).toLowerCase() ===
        "true"
    ) {

        return true;
    }


    if (
        p.nz === true ||
        String(
            p.nz
        ).toLowerCase() ===
        "true"
    ) {

        return true;
    }


    if (
        typeof p.nazwa ===
        "string" &&
        p.nazwa.includes(
            "(NŻ)"
        )
    ) {

        return true;
    }


    return false;
}

                );

            ) {

                    );
            }

        } else {

        }
    }

    /* =====================================================
       WARIANTY
       ===================================================== */

    const wp =
        document.getElementById(
            "warianty-pojemnik"
        );


    const wprz =
        document.getElementById(
            "warianty-przyciski"
        );


    let wariantyKierunku =
        [];


    if (
        wp &&
        wprz
    ) {

        wariantyKierunku =
            zbierzWariantyDlaKierunku(
                kierunekDlaDaty
            );


        if (
            wariantyKierunku.length > 1
        ) {

            wp.style.display =
                "flex";


            wprz.innerHTML =
                "";


            if (
                aktualnyWariant === null ||
                !wariantyKierunku.includes(
                    aktualnyWariant
                )
            ) {

                aktualnyWariant =
                    znajdzDomyslnyWariant(
                        kierunekDlaDaty
                    );
            }


            wariantyKierunku.forEach(
                w => {

                    const btn =
                        document.createElement(
                            "button"
                        );


                    btn.className =
                        "wariant-btn" +
                        (
                            aktualnyWariant === w
                                ? " aktywny"
                                : ""
                        );

                        w === ""
                            ? "A"
                            : w;


                    btn.onclick =
                        () => {

                            aktualnyWariant =
                                w;

                            pokazRozklad();
                        };


                    wprz.appendChild(
                        btn
                    );
                }
            );

        } else {

            wp.style.display =
                "none";


            aktualnyWariant =
                null;
        }
    }


    /* =====================================================
       BRAK PRZYSTANKÓW

    ) {
