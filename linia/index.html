<script>

/* =========================================================
   ZMIENNE GŁÓWNE
   ========================================================= */

let daneLinii = null;

let numerLinii = null;

let aktualnyKierunek = 0;

let aktualnyWariant = null;

let aktualnyDzien = "dzisiaj";

let wybranaData = new Date();

let wybranyPrzystanek = null;

let wybranyPrzystanekIndex = null;

let wybranyPrzystanekId = null;

let widokKursuAktywny = false;


/* =========================================================
   PARAMETRY URL
   ========================================================= */

const parametry =
    new URLSearchParams(
        window.location.search
    );

numerLinii =
    parametry.get("linia");


if (!numerLinii) {

    pokazBlad(
        "Nie podano numeru linii.",
        "Wybierz linię z menu."
    );

} else {

    document.getElementById(
        "numerLinii"
    ).textContent =
        numerLinii;

    pobierzDane();
}


/* =========================================================
   USUWANIE POLA GODZINY
   ========================================================= */

function usunPoleGodziny(
    tekst
) {

    const pozycja =
        tekst.search(
            /"godziny"\s*:\s*\[/
        );

    if (pozycja === -1)
        return tekst;

    const poczatekTablicy =
        tekst.indexOf(
            "[",
            pozycja
        );

    if (poczatekTablicy === -1)
        return tekst;

    let poziom = 0;

    let wStringu = false;

    let ucieczka = false;

    let koniecTablicy = -1;

    for (
        let i = poczatekTablicy;
        i < tekst.length;
        i++
    ) {

        const znak =
            tekst[i];

        if (ucieczka) {

            ucieczka = false;

            continue;
        }

        if (
            znak === "\\" &&
            wStringu
        ) {

            ucieczka = true;

            continue;
        }

        if (znak === '"') {

            wStringu =
                !wStringu;

            continue;
        }

        if (wStringu)
            continue;

        if (znak === "[")
            poziom++;

        if (znak === "]") {

            poziom--;

            if (poziom === 0) {

                koniecTablicy =
                    i;

                break;
            }
        }
    }

    if (koniecTablicy === -1)
        return tekst;

    let poczatek =
        pozycja;

    let koniec =
        koniecTablicy + 1;

    while (
        koniec < tekst.length &&
        /\s/.test(
            tekst[koniec]
        )
    ) {

        koniec++;
    }

    if (
        tekst[koniec] === ","
    ) {

        koniec++;
    }

    return (
        tekst.substring(
            0,
            poczatek
        ) +
        tekst
            .substring(koniec)
            .replace(
                /,\s*,/g,
                ","
            )
            .replace(
                /,\s*}/g,
                "}"
            )
    );
}


/* =========================================================
   POBIERANIE JSON
   ========================================================= */

async function pobierzDane() {

    const adres =
        "../dane/" +
        encodeURIComponent(
            numerLinii
        ) +
        ".json";

    try {

        const odpowiedz =
            await fetch(
                adres,
                {
                    cache: "no-cache"
                }
            );

        if (!odpowiedz.ok) {

            throw new Error(
                "Nie znaleziono pliku JSON dla linii " +
                numerLinii
            );
        }

        let tekst =
            await odpowiedz.text();

        try {

            daneLinii =
                JSON.parse(
                    tekst
                );

        } catch (e1) {

            daneLinii =
                JSON.parse(
                    usunPoleGodziny(
                        tekst
                    )
                );
        }

        uruchomStrone();

    } catch (blad) {

        pokazBlad(
            "Błąd ładowania.",
            blad.message
        );
    }
}


/* =========================================================
   ZAPIS DOKŁADNEGO PRZYSTANKU
   ========================================================= */

function ustawWybranyPrzystanek(
    p,
    index
) {

    if (!p) {

        wybranyPrzystanek = null;

        wybranyPrzystanekIndex = null;

        wybranyPrzystanekId = null;

        return;
    }

    wybranyPrzystanek = p;

    if (
        index !== undefined &&
        index !== null &&
        Number.isInteger(
            Number(index)
        )
    ) {

        wybranyPrzystanekIndex =
            Number(index);

    } else {

        wybranyPrzystanekIndex =
            null;
    }

    wybranyPrzystanekId = {

        kierunek:
            Number(
                aktualnyKierunek
            ),

        index:
            wybranyPrzystanekIndex,

        lp:
            p.lp !== undefined &&
            p.lp !== null
                ? String(
                    p.lp
                ).trim()
                : "",

        nr:
            p.nr !== undefined &&
            p.nr !== null
                ? String(
                    p.nr
                ).trim()
                : "",

        nazwa:
            String(
                p.nazwa || ""
            ).trim()
    };
}


/* =========================================================
   ZNAJDOWANIE PRZYSTANKU
   ========================================================= */

function znajdzPrzystanek(
    przystanki,
    identyfikator
) {

    if (
        !Array.isArray(
            przystanki
        ) ||
        przystanki.length === 0 ||
        identyfikator === null ||
        identyfikator === undefined
    ) {

        return null;
    }

    const szukany =
        String(
            identyfikator
        ).trim();

    if (
        szukany
            .toLowerCase()
            .startsWith("idx:")
    ) {

        const idx =
            Number(
                szukany
                    .substring(4)
                    .trim()
            );

        if (
            Number.isInteger(idx) &&
            idx >= 0 &&
            idx < przystanki.length
        ) {

            return przystanki[idx];
        }

        return null;
    }

    if (
        wybranyPrzystanekId &&
        Number(
            wybranyPrzystanekId.kierunek
        ) ===
        Number(
            aktualnyKierunek
        ) &&
        wybranyPrzystanekIndex !== null
    ) {

        const idx =
            Number(
                wybranyPrzystanekIndex
            );

        if (
            Number.isInteger(idx) &&
            idx >= 0 &&
            idx < przystanki.length
        ) {

            return przystanki[idx];
        }
    }

    if (
        szukany
            .toLowerCase()
            .startsWith("lp:")
    ) {

        const lp =
            szukany
                .substring(3)
                .trim();

        const znaleziony =
            przystanki.find(
                p =>
                    String(
                        p.lp !== undefined &&
                        p.lp !== null
                            ? p.lp
                            : ""
                    ).trim() === lp
            );

        if (znaleziony)
            return znaleziony;
    }

    if (
        wybranyPrzystanekId &&
        wybranyPrzystanekId.nr &&
        wybranyPrzystanekId.nazwa
    ) {

        const nr =
            wybranyPrzystanekId.nr;

        const nazwa =
            wybranyPrzystanekId.nazwa;

        const znaleziony =
            przystanki.find(
                p =>
                    String(
                        p.nr || ""
                    ).trim() === nr &&
                    normalizujTekst(
                        p.nazwa
                    ) ===
                    normalizujTekst(
                        nazwa
                    )
            );

        if (znaleziony)
            return znaleziony;
    }

    const poNr =
        przystanki.find(
            p =>
                String(
                    p.nr || ""
                ).trim() ===
                szukany
        );

    if (poNr)
        return poNr;

    const poNazwie =
        przystanki.find(
            p =>
                String(
                    p.nazwa || ""
                ).trim() ===
                szukany
        );

    if (poNazwie)
        return poNazwie;

    const normalny =
        normalizujTekst(
            szukany
        );

    return przystanki.find(
        p =>
            normalizujTekst(
                p.nazwa
            ) === normalny
    ) || null;
}

/* =========================================================
   TYP DNIA
   ========================================================= */

function okreslTypDnia(
    data
) {

    const d =
        data.getDay();

    if (d === 6)
        return "sobota";

    if (d === 0)
        return "niedziela";

    return "roboczy";
}


/* =========================================================
   NORMALIZACJA
   ========================================================= */

function normalizujTekst(
    tekst
) {

    return String(
        tekst || ""
    )
        .toLowerCase()
        .normalize(
            "NFD"
        )
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );
}


/* =========================================================
   ZNAJDŹ ROZKŁAD
   ========================================================= */

function znajdzRozklad() {

    const rozklady =
        daneLinii.rozkłady ||
        [];

    if (
        rozklady.length === 0
    )
        return null;

    const typ =
        okreslTypDnia(
            wybranaData
        );

    if (
        typ === "sobota"
    ) {

        for (
            const r of rozklady
        ) {

            if (
                normalizujTekst(
                    r.nazwa
                ).includes(
                    "sobot"
                )
            ) {

                return r;
            }
        }
    }

    if (
        typ === "niedziela"
    ) {

        for (
            const r of rozklady
        ) {

            const n =
                normalizujTekst(
                    r.nazwa
                );

            if (
                n.includes(
                    "niedziel"
                ) ||
                n.includes(
                    "swiat"
                )
            ) {

                return r;
            }
        }
    }

    if (
        typ === "roboczy"
    ) {

        for (
            const r of rozklady
        ) {

            const n =
                normalizujTekst(
                    r.nazwa
                );

            if (
                n.includes(
                    "piatk"
                ) ||
                n.includes(
                    "poniedzial"
                )
            ) {

                return r;
            }
        }
    }

    return rozklady[0];
}

    );

/* =========================================================
   WARIANT
   ========================================================= */

function pobierzWariant(
    k
) {

    if (
        !k ||
        typeof k !== "object"
    ) {

        return "";
    }

    const wariant =
        k.wariant;

    if (
        wariant &&
        typeof wariant === "object"
    ) {

        return String(
            wariant.litera ||
            wariant.nazwa ||
            ""
        ).trim();
    }

    return String(
        wariant || ""
    ).trim();
}


/* =========================================================
   ZBIERANIE WARIANTÓW
   ========================================================= */

function zbierzWariantyDlaKierunku(
    kierunek
) {

    const set =
        new Set();

    (
        kierunek.przystanki ||
        []
    ).forEach(
        p =>
            (
                p.kursy ||
                []
            ).forEach(
                k => {

                    const w =
                        pobierzWariant(
                            k
                        );

                    if (w)
                        set.add(w);
                }
            )
    );

    return Array
        .from(set)
        .sort(
            (
                a,
                b
            ) =>
                a.localeCompare(
                    b,
                    "pl"
                )
        );
}


/* =========================================================
   PIERWSZY PRZYSTANEK WARIANTU
   ========================================================= */

function znajdzPierwszyPrzystanekWariantu(
    kierunek,
    wariant
) {

    const szukany =
        String(
            wariant || ""
        ).trim();

    const przystanki =
        kierunek.przystanki ||
        [];

    for (
        let i = 0;
        i < przystanki.length;
        i++
    ) {

        const p =
            przystanki[i];

        const maKurs =
            (
                p.kursy ||
                []
            ).some(
                k =>
                    pobierzWariant(
                        k
                    ) === szukany
            );

        if (maKurs)
            return i;
    }

    return -1;
}


/* =========================================================
   DOMYŚLNY WARIANT
   ========================================================= */

/*
 * Wariant nie jest wybierany według liczby kursów.
 *
 * Najpierw sprawdzamy:
 *
 *     na którym przystanku zaczyna się wariant
 *
 * Im mniejszy indeks, tym wcześniej zaczyna się wariant.
 *
 * Jeżeli kilka wariantów zaczyna się na tym samym
 * przystanku, pusty wariant główny jest pierwszy.
 */

function znajdzDomyslnyWariant(
    kierunek
) {

    const przystanki =
        kierunek.przystanki ||
        [];

    const wariantStarty =
        new Map();


    przystanki.forEach(
        (
            p,
            index
        ) => {

            (
                p.kursy ||
                []
            ).forEach(
                k => {

                    const w =
                        pobierzWariant(
                            k
                        );

                    if (
                        !wariantStarty.has(
                            w
                        )
                    ) {

                        wariantStarty.set(
                            w,
                            index
                        );
                    }
                }
            );
        }
    );


    const lista =
        Array.from(
            wariantStarty.entries()
        );


    if (
        lista.length === 0
    )
        return "";


    lista.sort(
        (
            a,
            b
        ) => {

            if (
                a[1] !==
                b[1]
            ) {

                return (
                    a[1] -
                    b[1]
                );
            }


            /*
             * Przy tym samym przystanku
             * główny wariant bez litery
             * ma pierwszeństwo.
             */

            if (
                a[0] === "" &&
                b[0] !== ""
            )
                return -1;


            if (
                a[0] !== "" &&
                b[0] === ""
            )
                return 1;


            return a[0].localeCompare(
                b[0],
                "pl"
            );
        }
    );


    return lista[0][0];
}


/* =========================================================
   CZAS NA MINUTY
   ========================================================= */

function czasNaMinuty(
    czas
) {

    const dop =
        String(
            czas || ""
        )
            .trim()
            .match(
                /^(\d{1,2}):(\d{2})$/
            );

    if (!dop)
        return null;

    const godzina =
        Number(
            dop[1]
        );

    const minuta =
        Number(
            dop[2]
        );

    if (
        godzina < 0 ||
        godzina > 23 ||
        minuta < 0 ||
        minuta > 59
    ) {

        return null;
    }

    return (
        godzina * 60 +
        minuta
    );
}


/* =========================================================
   ZNAJDOWANIE KURSU BAZOWEGO
   ========================================================= */

/*
 * Dla wybranego wariantu:
 *
 * 1. zbieramy wszystkie kursy;
 * 2. każdy kurs identyfikujemy przez:
 *
 *       NUMER KURSU + WARIANT
 *
 * 3. ustalamy pierwszy przystanek i pierwszą godzinę;
 * 4. najpierw szukamy kursu rozpoczynającego się
 *    w godzinach 11:00–11:59;
 * 5. jeśli nie ma takiego kursu, bierzemy
 *    pierwszy kurs chronologicznie.
 *
 * Nigdy nie łączymy kursów różnych wariantów.
 */

function znajdzKursBazowy(
    kierunek,
    wariant
) {

    const przystanki =
        kierunek.przystanki ||
        [];

    const mapaKursow =
        new Map();


    przystanki.forEach(
        (
            p,
            index
        ) => {

            (
                p.kursy ||
                []
            ).forEach(
                k => {

                    if (
                        k.numer === undefined ||
                        k.numer === null
                    ) {

                        return;
                    }

                    const numer =
                        String(
                            k.numer
                        ).trim();

                    if (!numer)
                        return;


                    const kursWariant =
                        pobierzWariant(
                            k
                        );


                    const klucz =
                        numer +
                        "||" +
                        kursWariant;


                    if (
                        !mapaKursow.has(
                            klucz
                        )
                    ) {

                        mapaKursow.set(
                            klucz,
                            {
                                numer:
                                    k.numer,

                                wariant:
                                    kursWariant,

                                punkty:
                                    []
                            }
                        );
                    }


                    mapaKursow
                        .get(klucz)
                        .punkty
                        .push(
                            {
                                index:
                                    index,

                                czas:
                                    k.czas
                            }
                        );
                }
            );
        }
    );


    const wszystkieKursy =
        Array.from(
            mapaKursow.values()
        );


    wszystkieKursy.forEach(
        kurs => {

            kurs.punkty.sort(
                (
                    a,
                    b
                ) =>
                    a.index -
                    b.index
            );


            const pierwszy =
                kurs.punkty.find(
                    punkt =>
                        czasNaMinuty(
                            punkt.czas
                        ) !== null
                );


            kurs.startIndex =
                pierwszy
                    ? pierwszy.index
                    : 999999;


            kurs.startMinuty =
                pierwszy
                    ? czasNaMinuty(
                        pierwszy.czas
                    )
                    : null;
        }
    );


    const szukanyWariant =
        String(
            wariant || ""
        ).trim();


    let kandydaci =
        wszystkieKursy.filter(
            kurs =>
                kurs.wariant ===
                szukanyWariant
        );


    if (
        kandydaci.length === 0
    ) {

        return null;
    }


    /*
     * NAJPIERW KURS 11:XX
     */

    const kursy11 =
        kandydaci.filter(
            kurs => {

                if (
                    kurs.startMinuty === null
                )
                    return false;

                const godzina =
                    Math.floor(
                        kurs.startMinuty /
                        60
                    ) % 24;

                return (
                    godzina === 11
                );
            }
        );


    if (
        kursy11.length > 0
    ) {

        kursy11.sort(
            (
                a,
                b
            ) => {

                if (
                    a.startMinuty !==
                    b.startMinuty
                ) {

                    return (
                        a.startMinuty -
                        b.startMinuty
                    );
                }

                return (
                    a.startIndex -
                    b.startIndex
                );
            }
        );


        return kursy11[0];
    }


    /*
     * JEŻELI NIE MA 11:XX:
     *
     * pierwszy chronologicznie kurs
     */

    kandydaci.sort(
        (
            a,
            b
        ) => {

            const aa =
                a.startMinuty === null
                    ? 999999
                    : a.startMinuty;

            const bb =
                b.startMinuty === null
                    ? 999999
                    : b.startMinuty;


            if (
                aa !== bb
            ) {

                return aa - bb;
            }


            return (
                a.startIndex -
                b.startIndex
            );
        }
    );


    return (
        kandydaci[0] ||
        null
    );
}


/* =========================================================
   POBIERANIE CZASÓW KONKRETNEGO KURSU
   ========================================================= */

function pobierzCzasyKursu(
    kierunek,
    kurs
) {

    const przystanki =
        kierunek.przystanki ||
        [];

    const czasy =
        new Array(
            przystanki.length
        ).fill(
            null
        );


    if (!kurs)
        return czasy;


    const numerKursu =
        String(
            kurs.numer
        ).trim();


    const wariantKursu =
        String(
            kurs.wariant ||
            ""
        ).trim();


    przystanki.forEach(
        (
            p,
            index
        ) => {

            const znaleziony =
                (
                    p.kursy ||
                    []
                ).find(
                    k => {

                        const numer =
                            String(
                                k.numer
                            ).trim();


                        const wariant =
                            pobierzWariant(
                                k
                            );


                        return (
                            numer ===
                            numerKursu
                            &&
                            wariant ===
                            wariantKursu
                        );
                    }
                );


            if (!znaleziony)
                return;


            const czas =
                String(
                    znaleziony.czas ||
                    ""
                ).trim();


            if (
                czasNaMinuty(
                    czas
                ) !== null
            ) {

                czasy[index] =
                    czas;
            }
        }
    );


    return czasy;
}


/* =========================================================
   SUMOWANIE CZASU PRZEJAZDU
   ========================================================= */

function obliczSumowaneCzasy(
    czasy
) {

    const wynik =
        new Array(
            czasy.length
        ).fill(
            null
        );


    let pierwszyCzas =
        null;


    /*
     * Pierwszy obsługiwany przystanek
     * otrzymuje 0 min.
     */

    for (
        let i = 0;
        i < czasy.length;
        i++
    ) {

        const minuty =
            czasNaMinuty(
                czasy[i]
            );


        if (
            minuty !== null
        ) {

            pierwszyCzas =
                minuty;

            break;
        }
    }


    if (
        pierwszyCzas === null
    ) {

        return wynik;
    }


    let poprzedniCzas =
        pierwszyCzas;


    let suma =
        0;


    for (
        let i = 0;
        i < czasy.length;
        i++
    ) {

        const minuty =
            czasNaMinuty(
                czasy[i]
            );


        if (
            minuty === null
        ) {

            continue;
        }


        let roznica =
            minuty -
            poprzedniCzas;


        /*
         * Przejście przez północ.
         */

        if (
            roznica < 0
        ) {

            roznica +=
                24 * 60;
        }


        suma +=
            roznica;


        wynik[i] =
            suma;


        poprzedniCzas =
            minuty;
    }


    /*
     * Pierwszy przystanek zawsze 0.
     */

    const pierwszyIndex =
        czasy.findIndex(
            czas =>
                czasNaMinuty(
                    czas
                ) !== null
        );


    if (
        pierwszyIndex !== -1
    ) {

        wynik[pierwszyIndex] =
            0;
    }


    return wynik;
}


/* =========================================================
   HISTORIA URL
   ========================================================= */

function aktualizujHistorieURL(
    przystanekId
) {

    const url =
        new URL(
            window.location.href
        );


    url.searchParams.set(
        "linia",
        numerLinii
    );


    url.searchParams.set(
        "kierunek",
        aktualnyKierunek
    );


    if (przystanekId) {

        url.searchParams.set(
            "przystanek",
            przystanekId
        );

    } else {

        url.searchParams.delete(
            "przystanek"
        );
    }


    window.history.pushState(
        {
            przystanek:
                przystanekId,

            kierunek:
                aktualnyKierunek
        },
        "",
        url.toString()
    );
}

        !rozklad ||
        !rozklad.kierunki ||
        rozklad.kierunki.length === 0
    ) {

        typ.textContent =
            "Brak rozkładu";


        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak danych rozkładu.' +
            '</div>';


        if (wp)
            wp.style.display =
                "none";


        return;
    }


    if (
        aktualnyKierunek >=
        rozklad.kierunki.length
    ) {

        aktualnyKierunek =
            0;


        ustawWybranyPrzystanek(
            null
        );
    }


    generujKierunki();


    if (
        widokKursuAktywny
    )
        return;


    if (
        wybranyPrzystanek !== null &&
        wybranyPrzystanekIndex !== null
    ) {

        const kierunek =
            rozklad.kierunki[
                aktualnyKierunek
            ];


        if (
            kierunek &&
            Array.isArray(
                kierunek.przystanki
            )
        ) {

            const idx =
                Number(
                    wybranyPrzystanekIndex
                );


            if (
                Number.isInteger(idx) &&
                idx >= 0 &&
                idx <
                kierunek.przystanki.length
            ) {

                wybranyPrzystanek =
                    kierunek.przystanki[
                        idx
                    ];


                pokazRozkladWybranegoPrzystanku(
                    rozklad,
                    wybranyPrzystanek
                );


                return;
            }
        }


        ustawWybranyPrzystanek(
            null
        );
    }


    pokazListePrzystankow(
        rozklad
    );
}


/* =========================================================
   NŻ
   ========================================================= */

function czyPrzystanekNaZadanie(
    p
) {

    if (!p)
        return false;


    const typ =
        String(
            p.typ || ""
        )
            .trim()
            .toUpperCase();


    if (
        typ === "NŻ" ||
        typ === "NZ"
    ) {

        return true;
    }


    if (
        p.naZadanie === true ||
        String(
            p.naZadanie
        ).toLowerCase() ===
        "true"
    ) {

        return true;
    }


    if (
        p.nz === true ||
        String(
            p.nz
        ).toLowerCase() ===
        "true"
    ) {

        return true;
    }


    if (
        typeof p.nazwa ===
        "string" &&
        p.nazwa.includes(
            "(NŻ)"
        )
    ) {

        return true;
    }


    return false;
}


/* =========================================================
   LISTA PRZYSTANKÓW
   ========================================================= */

function pokazListePrzystankow(
    rozklad
) {

    const kontener =
        document.getElementById(
            "przystanki"
        );


    const kierunek =
        rozklad.kierunki[
            aktualnyKierunek
        ];


    const przystanki =
        kierunek.przystanki ||
        [];


    document.getElementById(
        "typRozkładu"
    ).style.display =
        "none";


    document.querySelector(
        ".dni"
    ).style.display =
        "none";


    document.getElementById(
        "kalendarz"
    ).style.display =
        "none";


    kontener.innerHTML =
        "";


    const wp =
        document.getElementById(
            "warianty-pojemnik"
        );


    const wprz =
        document.getElementById(
            "warianty-przyciski"
        );


    let wariantyKierunku =
        zbierzWariantyDlaKierunku(
            kierunek
        );


    /*
     * Jeżeli nie wybrano wariantu,
     * wybieramy ten, który zaczyna
     * się najwcześniej na trasie.
     */

    if (
        aktualnyWariant === null
    ) {

        aktualnyWariant =
            znajdzDomyslnyWariant(
                kierunek
            );
    }


    /*
     * Jeżeli wybrany wariant już nie istnieje,
     * ponownie wybieramy domyślny.
     */

    const wszystkieWarianty =
        new Set(
            przystanki.flatMap(
                p =>
                    (
                        p.kursy ||
                        []
                    ).map(
                        k =>
                            pobierzWariant(
                                k
                            )
                    )
            )
        );


    if (
        !wszystkieWarianty.has(
            String(
                aktualnyWariant ||
                ""
            )
        )
    ) {

        aktualnyWariant =
            znajdzDomyslnyWariant(
                kierunek
            );
    }


    /*
     * Wariant główny może być pusty.
     * Nie pokazujemy go jako osobnego przycisku,
     * ale pozostaje możliwy do wybrania wewnętrznie.
     */

    if (
        wp &&
        wprz
    ) {

        if (
            wariantyKierunku.length > 0
        ) {

            wp.style.display =
                "flex";


            wprz.innerHTML =
                "";


            /*
             * Jeżeli aktywny jest pusty wariant,
             * dodajemy przycisk "GŁÓWNY".
             */

            if (
                aktualnyWariant === ""
            ) {

                const btnGlowny =
                    document.createElement(
                        "button"
                    );

                btnGlowny.className =
                    "wariant-btn aktywny";

                btnGlowny.textContent =
                    "—";

                btnGlowny.title =
                    "Wariant główny";

                btnGlowny.onclick =
                    () => {

                        aktualnyWariant =
                            "";

                        pokazRozklad();
                    };

                wprz.appendChild(
                    btnGlowny
                );
            }


            wariantyKierunku.forEach(
                w => {

                    const btn =
                        document.createElement(
                            "button"
                        );


                    btn.className =
                        "wariant-btn" +
                        (
                            aktualnyWariant === w
                                ? " aktywny"
                                : ""
                        );


                    btn.textContent =
                        w;


                    btn.onclick =
                        () => {

                            aktualnyWariant =
                                w;


                            pokazRozklad();
                        };


                    wprz.appendChild(
                        btn
                    );
                }
            );

        } else {

            wp.style.display =
                "none";

            aktualnyWariant =
                "";
        }
    }


    if (
        przystanki.length === 0
    ) {

        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak przystanków.' +
            '</div>';


        return;
    }


    /* =====================================================
       PIERWSZY PRZYSTANEK WYBRANEGO WARIANTU
       ===================================================== */

    const pierwszyPrzystanekWariantu =
        znajdzPierwszyPrzystanekWariantu(
            kierunek,
            aktualnyWariant
        );


    /* =====================================================
       CZAS PRZEJAZDU
       ===================================================== */

    const kursBazowy =
        znajdzKursBazowy(
            kierunek,
            aktualnyWariant
        );


    const czasyKursu =
        pobierzCzasyKursu(
            kierunek,
            kursBazowy
        );


    const czasySumowane =
        obliczSumowaneCzasy(
            czasyKursu
        );


    /* =====================================================
       OŚ TRASY
       ===================================================== */

    const N =
        przystanki.length;


    /*
     * Główna oś.
     *
     * Najpierw próbujemy użyć pustego wariantu
     * jako głównej osi.
     *
     * Jeżeli go nie ma, używamy A.
     *
     * Jeżeli nie ma A, używamy wariantu,
     * który zaczyna się najwcześniej.
     */

    const wszystkieWariantyKursow =
        Array.from(
            new Set(
                przystanki.flatMap(
                    p =>
                        (
                            p.kursy ||
                            []
                        ).map(
                            k =>
                                pobierzWariant(
                                    k
                                )
                        )
                )
            )
        );


    let mainWariant =
        "";


    if (
        wszystkieWariantyKursow.includes(
            ""
        )
    ) {

        mainWariant =
            "";

    } else if (
        wszystkieWariantyKursow.includes(
            "A"
        )
    ) {

        mainWariant =
            "A";

    } else {

        mainWariant =
            znajdzDomyslnyWariant(
                kierunek
            );
    }


    let isOnMainAxis =
        new Array(
            N
        ).fill(
            false
        );


    przystanki.forEach(
        (
            p,
            i
        ) => {

            isOnMainAxis[i] =
                (
                    p.kursy ||
                    []
                ).some(
                    k =>
                        pobierzWariant(
                            k
                        ) ===
                        mainWariant
                );
        }
    );


    /*
     * Jeżeli główna oś jest pusta,
     * zabezpieczamy się przed pustą trasą.
     */

    if (
        !isOnMainAxis.some(
            Boolean
        )
    ) {

        isOnMainAxis =
            przystanki.map(
                (
                    p,
                    i
                ) =>
                    (
                        p.kursy ||
                        []
                    ).some(
                        k =>
                            pobierzWariant(
                                k
                            ) ===
                            aktualnyWariant
                    )
            );
    }


    /* =====================================================
       ŚCIEŻKI KURSÓW
       ===================================================== */

    const tripPaths =
        {};


    przystanki.forEach(
        (
            p,
            i
        ) => {

            (
                p.kursy ||
                []
            ).forEach(
                k => {

                    const numer =
                        String(
                            k.numer
                        ).trim();


                    const wariant =
                        pobierzWariant(
                            k
                        );


                    const klucz =
                        numer +
                        "||" +
                        wariant;


                    if (
                        !tripPaths[
                            klucz
                        ]
                    ) {

                        tripPaths[
                            klucz
                        ] = [];
                    }


                    tripPaths[
                        klucz
                    ].push(
                        {
                            index:
                                i,

                            wariant:
                                wariant
                        }
                    );
                }
            );
        }
    );


    const edgesMap =
        {};


    Object.values(
        tripPaths
    ).forEach(
        path => {

            path.sort(
                (
                    a,
                    b
                ) =>
                    a.index -
                    b.index
            );


            for (
                let j = 0;
                j <
                path.length - 1;
                j++
            ) {

                const u =
                    path[j].index;


                const v =
                    path[j + 1].index;


                const w =
                    path[j].wariant;


                const key =
                    u +
                    "," +
                    v;


                if (
                    !edgesMap[key]
                ) {

                    edgesMap[key] =
                        {
                            u:
                                u,

                            v:
                                v,

                            warianty:
                                new Set()
                        };
                }


                edgesMap[key]
                    .warianty
                    .add(w);
            }
        }
    );


    const edges =
        Object.values(
            edgesMap
        );


    edges.forEach(
        e => {

            if (
                isOnMainAxis[e.u] &&
                isOnMainAxis[e.v]
            ) {

                if (
                    e.v - e.u === 1
                ) {

                    e.track =
                        0;

                } else {

                    let skipsMain =
                        false;


                    for (
                        let k =
                            e.u + 1;
                        k < e.v;
                        k++
                    ) {

                        if (
                            isOnMainAxis[k]
                        ) {

                            skipsMain =
                                true;

                            break;
                        }
                    }


                    if (
                        skipsMain
                    ) {

                        e.track =
                            -1;

                    } else {

                        e.track =
                            0;
                    }
                }

            } else {

                e.track =
                    1;
            }
        }
    );


    const ROW_HEIGHT =
        44;


    const TRACK_W =
        22;


    const SPINE_X =
        44;


    const LEFT_X =
        SPINE_X -
        TRACK_W;


    const RIGHT_X =
        SPINE_X +
        TRACK_W;


    const SVG_W =
        RIGHT_X +
        16;


    let firstActiveIndex =
        pierwszyPrzystanekWariantu;


    let lastActiveIndex =
        -1;


    przystanki.forEach(
        (
            p,
            i
        ) => {

            const active =
                (
                    p.kursy ||
                    []
                ).some(
                    k =>
                        pobierzWariant(
                            k
                        ) ===
                        aktualnyWariant
                );


            if (active) {

                lastActiveIndex =
                    i;
            }
        }
    );


    /*
     * Awaryjnie, gdyby wariant nie miał
     * żadnego przystanku.
     */

    if (
        firstActiveIndex < 0
    ) {

        firstActiveIndex =
            0;
    }


    const lista =
        document.createElement(
            "div"
        );


    lista.className =
        "lista-przystankow";


    przystanki.forEach(
        (
            p,
            i
        ) => {

            const nodeActive =
                (
                    p.kursy ||
                    []
                ).some(
                    k =>
                        pobierzWariant(
                            k
                        ) ===
                        aktualnyWariant
                );


            /*
             * Wszystkie przystanki przed faktycznym
             * początkiem wariantu są nieaktywne.
             */

            const przedStartem =
                i <
                firstActiveIndex;


            const wizualnieAktywny =
                nodeActive &&
                !przedStartem;


            const btn =
                document.createElement(
                    "button"
                );


            btn.type =
                "button";


            btn.className =
                "przystanek-btn" +
                (
                    wizualnieAktywny
                        ? ""
                        : " inactive"
                );


            const isFirstActive =
                i ===
                firstActiveIndex;


            const isLastActive =
                i ===
                lastActiveIndex;


            const isNz =
                czyPrzystanekNaZadanie(
                    p
                );


            let inactiveLines =
                "";


            let activeLines =
                "";


            const drawLine =
                (
                    x1,
                    y1,
                    x2,
                    y2,
                    isActive
                ) => {

                    /*
                     * Jeżeli odcinek znajduje się przed
                     * startem wariantu, zawsze jest szary.
                     */

                    const color =
                        isActive &&
                        !(
                            Math.min(
                                i,
                                i
                            ) <
                            firstActiveIndex
                        )
                            ? "#000"
                            : "#ccc";


                    const w =
                        isActive
                            ? 2.5
                            : 2;


                    const str =
                        `<line
                            x1="${x1}"
                            y1="${y1}"
                            x2="${x2}"
                            y2="${y2}"
                            stroke="${color}"
                            stroke-width="${w}"
                            stroke-linecap="round"
                        />`;


                    if (
                        color === "#000"
                    )
                        activeLines +=
                            str;

                    else
                        inactiveLines +=
                            str;
                };


            edges.forEach(
                e => {

                    /*
                     * Odcinek jest aktywny tylko wtedy,
                     * gdy należy do wybranego wariantu
                     * ORAZ znajduje się już od jego startu.
                     *
                     * Odcinek dochodzący do pierwszego
                     * przystanku wariantu również pozostaje
                     * szary.
                     */

                    const isEdgeActive =
                        e.warianty.has(
                            aktualnyWariant
                        ) &&
                        e.u >=
                        firstActiveIndex;


                    if (
                        e.track === 0
                    ) {

                        if (
                            i === e.u
                        ) {

                            drawLine(
                                SPINE_X,
                                ROW_HEIGHT / 2,
                                SPINE_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i > e.u &&
                            i < e.v
                        ) {

                            drawLine(
                                SPINE_X,
                                0,
                                SPINE_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i === e.v
                        ) {

                            drawLine(
                                SPINE_X,
                                0,
                                SPINE_X,
                                ROW_HEIGHT / 2,
                                isEdgeActive
                            );
                        }

                    } else if (
                        e.track === 1
                    ) {

                        const startX =
                            isOnMainAxis[e.u]
                                ? SPINE_X
                                : RIGHT_X;


                        const endX =
                            isOnMainAxis[e.v]
                                ? SPINE_X
                                : RIGHT_X;


                        if (
                            i === e.u
                        ) {

                            drawLine(
                                startX,
                                ROW_HEIGHT / 2,
                                RIGHT_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i > e.u &&
                            i < e.v
                        ) {

                            drawLine(
                                RIGHT_X,
                                0,
                                RIGHT_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i === e.v
                        ) {

                            drawLine(
                                RIGHT_X,
                                0,
                                endX,
                                ROW_HEIGHT / 2,
                                isEdgeActive
                            );
                        }

                    } else if (
                        e.track === -1
                    ) {

                        if (
                            i === e.u
                        ) {

                            drawLine(
                                SPINE_X,
                                ROW_HEIGHT / 2,
                                LEFT_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i > e.u &&
                            i < e.v
                        ) {

                            drawLine(
                                LEFT_X,
                                0,
                                LEFT_X,
                                ROW_HEIGHT,
                                isEdgeActive
                            );

                        } else if (
                            i === e.v
                        ) {

                            drawLine(
                                LEFT_X,
                                0,
                                SPINE_X,
                                ROW_HEIGHT / 2,
                                isEdgeActive
                            );
                        }
                    }
                }
            );


            const nodeX =
                isOnMainAxis[i]
                    ? SPINE_X
                    : RIGHT_X;


            /*
             * Kolor węzła:
             *
             * - przed startem wariantu = szary
             * - pierwszy aktywny = czarny
             * - ostatni aktywny = czerwony
             * - pozostałe = czerwone
             */

            const strokeColor =
                !wizualnieAktywny
                    ? "#ccc"
                    : (
                        isFirstActive
                            ? "#000"
                            : "#e42313"
                    );


            const fillColor =
                !wizualnieAktywny
                    ? "#ccc"
                    : (
                        isFirstActive
                            ? "#000"
                            : "#e42313"
                    );


            let nodeSvg =
                "";


            if (
                isFirstActive ||
                isLastActive
            ) {

                if (isNz) {

                    nodeSvg =
                        `<rect
                            x="${nodeX - 6.75}"
                            y="15.25"
                            width="13.5"
                            height="13.5"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    nodeSvg =
                        `<rect
                            x="${nodeX - 8}"
                            y="14"
                            width="16"
                            height="16"
                            fill="${fillColor}"
                            stroke="none"
                        />`;
                }

            } else {

                if (isNz) {

                    nodeSvg =
                        `<circle
                            cx="${nodeX}"
                            cy="22"
                            r="6.75"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    nodeSvg =
                        `<circle
                            cx="${nodeX}"
                            cy="22"
                            r="8"
                            fill="${fillColor}"
                            stroke="none"
                        />`;
                }
            }


            const svgHtml =
                `<svg
                    width="${SVG_W}"
                    height="${ROW_HEIGHT}"
                >
                    ${inactiveLines}
                    ${activeLines}
                    ${nodeSvg}
                </svg>`;


            const nodeWrapper =
                document.createElement(
                    "div"
                );


            nodeWrapper.className =
                "node-wrapper";


            nodeWrapper.style.width =
                SVG_W + "px";


            nodeWrapper.innerHTML =
                svgHtml;


            /* =================================================
               CZAS PRZEJAZDU
               ================================================= */

            const czasKolumna =
                document.createElement(
                    "div"
                );


            czasKolumna.className =
                "kolumna-czas-przejazdu";


            if (
                i ===
                firstActiveIndex
            ) {

                czasKolumna.classList.add(
                    "pierwszy"
                );
            }


            /*
             * Przed początkiem wariantu
             * czas jest pusty.
             */

            if (
                !przedStartem &&
                czasySumowane[i] !== null &&
                czasySumowane[i] !== undefined
            ) {

                czasKolumna.textContent =
                    czasySumowane[i] +
                    " min";

            } else {

                czasKolumna.textContent =
                    "";
            }


            /* =================================================
               NAZWA PRZYSTANKU
               ================================================= */

            const nazwa =
                document.createElement(
                    "div"
                );


            nazwa.className =
                "przystanek-nazwa";


            nazwa.textContent =
                p.nazwa ||
                "Przystanek";


            /* =================================================
               NUMER PRZYSTANKU
               ================================================= */

            const nr =
                document.createElement(
                    "div"
                );


            nr.className =
                "przystanek-nr";


            nr.textContent =
                p.nr || "";


            /*
             * KOLEJNOŚĆ:
             *
             * 1. CZAS
             * 2. OŚ
             * 3. NAZWA
             * 4. NR
             */

            btn.appendChild(
                czasKolumna
            );


            btn.appendChild(
                nodeWrapper
            );


            btn.appendChild(
                nazwa
            );


            btn.appendChild(
                nr
            );


            btn.onclick =
                () =>
                    wybierzPrzystanek(
                        p,
                        i
                    );


            lista.appendChild(
                btn
            );
        }
    );


    kontener.appendChild(
        lista
    );
}


/* =========================================================
   WYBÓR PRZYSTANKU
   ========================================================= */

function wybierzPrzystanek(
    p,
    index
) {

    ustawWybranyPrzystanek(
        p,
        index
    );


    widokKursuAktywny =
        false;


    aktualizujHistorieURL(
        "idx:" + index
    );


    pokazRozklad();


    requestAnimationFrame(
        () => {

            window.scrollTo(
                0,
                0
            );


            requestAnimationFrame(
                () => {

                    window.scrollTo(
                        0,
                        0
                    );

                }
            );

        }
    );
}


/* =========================================================
   WIDOK PRZYSTANKU
   ========================================================= */

function pokazRozkladWybranegoPrzystanku(
    rozklad,
    przystanek
) {

    const kontener =
        document.getElementById(
            "przystanki"
        );


    document.querySelector(
        ".dni"
    ).style.display =
        "flex";


    if (
        aktualnyDzien !==
        "kalendarz"
    ) {

        document.getElementById(
            "kalendarz"
        ).style.display =
            "none";
    }


    document.getElementById(
        "typRozkładu"
    ).style.display =
        "block";


    document.getElementById(
        "typRozkładu"
    ).textContent =
        rozklad.nazwa ||
        "Rozkład jazdy";


    document.getElementById(
        "warianty-pojemnik"
    ).style.display =
        "none";


    kontener.innerHTML =
        "";


    const naglowek =
        document.createElement(
            "div"
        );


    naglowek.className =
        "naglowek-przystanku-widok";


    naglowek.innerHTML =
        `<div class="nazwa">
            ${przystanek.nazwa}
        </div>

        <div class="numer">
            ${
                przystanek.nr
                    ? przystanek.nr
                    : ""
            }
        </div>`;


    kontener.appendChild(
        naglowek
    );


    const blok =
        document.createElement(
            "div"
        );


    blok.className =
        "przystanek";


    const godziny =
        document.createElement(
            "div"
        );


    godziny.className =
        "godziny";


    if (
        !przystanek.kursy ||
        przystanek.kursy.length === 0
    ) {

        godziny.innerHTML =
            '<div class="brak-godzin">' +
            'Brak odjazdów' +
            '</div>';

    } else {

        let aktGodz =
            null;


        let wiersz =
            null;


        przystanek.kursy.forEach(
            k => {

                const dop =
                    String(
                        k.czas || ""
                    )
                        .trim()
                        .match(
                            /^(\d{1,2}):(\d{2})$/
                        );


                if (!dop)
                    return;


                const g =
                    Number(
                        dop[1]
                    );


                const m =
                    dop[2];


                if (
                    aktGodz !== g
                ) {

                    aktGodz =
                        g;


                    wiersz =
                        document.createElement(
                            "div"
                        );


                    wiersz.className =
                        "wiersz-godziny";


                    wiersz.innerHTML =
                        `<div class="kolumna-godzina">
                            ${String(g).padStart(2, "0")}
                        </div>`;


                    godziny.appendChild(
                        wiersz
                    );
                }


                const kol =
                    document.createElement(
                        "div"
                    );


                kol.className =
                    "kolumna-minuta";


                const litera =
                    pobierzWariant(
                        k
                    );


                kol.innerHTML =
                    `<span class="minuta-z-wariantem">

                        <span class="minuta">
                            ${m}
                        </span>

                        ${
                            litera
                                ? `<span class="wariant-minuty">
                                    ${litera}
                                  </span>`
                                : ""
                        }

                    </span>`;


                if (
                    k.numer !== undefined &&
                    k.numer !== null
                ) {

                    kol.title =
                        "Zobacz przebieg kursu " +
                        k.numer +
                        (
                            litera
                                ? " (" +
                                  litera +
                                  ")"
                                : ""
                        );


                    kol.onclick =
                        () =>
                            pokazCalyKurs(
                                k.numer,
                                litera
                            );
                }


                wiersz.appendChild(
                    kol
                );
            }
        );
    }


    blok.appendChild(
        godziny
    );


    const uzyteWarianty =
        new Map();


    if (
        przystanek.kursy
    ) {

        przystanek.kursy.forEach(
            k => {

                const w =
                    pobierzWariant(
                        k
                    );


                if (w)
                    uzyteWarianty.set(
                        w,
                        ""
                    );
            }
        );
    }


    if (
        uzyteWarianty.size > 0 &&
        rozklad.warianty
    ) {

        const leg =
            document.createElement(
                "div"
            );


        leg.className =
            "legenda-wariantow";


        let legList =
            '<div class="legenda-lista">';


        uzyteWarianty.forEach(
            (
                _,
                litera
            ) => {

                const w =
                    rozklad.warianty.find(
                        x =>
                            x.litera ===
                            litera
                    );


                if (w) {

                    legList +=
                        `<div class="legenda-element">

                            <span class="legenda-litera">
                                ${litera}
                            </span>

                            <span class="legenda-separator">
                                -
                            </span>

                            <span class="legenda-opis">
                                ${w.opis}
                            </span>

                        </div>`;
                }
            }
        );


        legList +=
            "</div>";


        leg.innerHTML =
            legList;


        blok.appendChild(
            leg
        );
    }


    kontener.appendChild(
        blok
    );


    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    window.scrollTo({
                        top: 0,
                        left: 0,
                        behavior: "auto"
                    });

                    document.documentElement.scrollTop = 0;

                    document.body.scrollTop = 0;

                }
            );

        }
    );
}


/* =========================================================
   CAŁY KURS
   ========================================================= */

function pokazCalyKurs(
    nrKursu,
    wariantKursu = null
) {

    widokKursuAktywny =
        true;


    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !rozklad.kierunki ||
        !rozklad.kierunki[
            aktualnyKierunek
        ]
    )
        return;


    const kierunek =
        rozklad.kierunki[
            aktualnyKierunek
        ];


    const przystankiK =
        kierunek.przystanki ||
        [];


    const kursPrzystanki =
        [];


    const szukanyNumer =
        String(
            nrKursu
        ).trim();


    const szukanyWariant =
        String(
            wariantKursu ||
            ""
        ).trim();


    przystankiK.forEach(
        (
            p,
            originalIndex
        ) => {

            const k =
                (
                    p.kursy ||
                    []
                ).find(
                    x => {

                        const numer =
                            String(
                                x.numer
                            ).trim();


                        const wariant =
                            pobierzWariant(
                                x
                            );


                        if (
                            numer !==
                            szukanyNumer
                        ) {

                            return false;
                        }


                        if (
                            wariantKursu !== null &&
                            wariant !==
                            szukanyWariant
                        ) {

                            return false;
                        }


                        return true;
                    }
                );


            if (k) {

                kursPrzystanki.push(
                    {
                        nazwa:
                            p.nazwa,

                        nr:
                            p.nr,

                        nz:
                            czyPrzystanekNaZadanie(
                                p
                            ),

                        czas:
                            k.czas,

                        wariant:
                            pobierzWariant(
                                k
                            ),

                        originalIndex:
                            originalIndex
                    }
                );
            }
        }
    );


    const kontener =
        document.getElementById(
            "przystanki"
        );


    document.getElementById(
        "typRozkładu"
    ).style.display =
        "block";


    document.getElementById(
        "typRozkładu"
    ).textContent =
        "Przebieg kursu";


    document.querySelector(
        ".dni"
    ).style.display =
        "none";


    document.getElementById(
        "kalendarz"
    ).style.display =
        "none";


    document.getElementById(
        "warianty-pojemnik"
    ).style.display =
        "none";


    kontener.innerHTML =
        "";


    let stopIndex =
        -1;


    if (
        wybranyPrzystanekIndex !== null
    ) {

        const originalIndex =
            Number(
                wybranyPrzystanekIndex
            );


        stopIndex =
            kursPrzystanki.findIndex(
                p =>
                    p.originalIndex ===
                    originalIndex
            );
    }


    if (
        stopIndex === -1 &&
        wybranyPrzystanek
    ) {

        stopIndex =
            kursPrzystanki.findIndex(
                p =>
                    String(
                        p.nr || ""
                    ) ===
                    String(
                        wybranyPrzystanek.nr ||
                        ""
                    )
                    &&
                    String(
                        p.nazwa || ""
                    ) ===
                    String(
                        wybranyPrzystanek.nazwa ||
                        ""
                    )
            );
    }


    const currentStopName =
        stopIndex !== -1
            ? kursPrzystanki[
                stopIndex
            ].nazwa
            : (
                kursPrzystanki.length
                    ? kursPrzystanki[0].nazwa
                    : ""
            );


    const lastStopName =
        kursPrzystanki.length
            ? kursPrzystanki[
                kursPrzystanki.length - 1
            ].nazwa
            : "";


    const widok =
        document.createElement(
            "div"
        );


    widok.className =
        "kurs-widok";


    widok.innerHTML =
        `<div class="kurs-naglowek">

            <div class="kurs-tytul">
                ${currentStopName}
                &rarr;
                ${lastStopName}
            </div>

            <div class="kurs-informacja">

                Kurs ${nrKursu}

                ${
                    szukanyWariant
                        ? " | Wariant " +
                          szukanyWariant
                        : ""
                }

                |
                Przebieg przez
                ${kursPrzystanki.length}
                przystanków

            </div>

        </div>`;


    const lista =
        document.createElement(
            "div"
        );


    lista.className =
        "kurs-lista";


    const czasWMinutach =
        cz => {

            const minuty =
                czasNaMinuty(
                    cz
                );


            return minuty === null
                ? 0
                : minuty;
        };


    const startIndex =
        stopIndex !== -1
            ? stopIndex
            : 0;


    const baseTime =
        kursPrzystanki.length
            ? czasWMinutach(
                kursPrzystanki[
                    startIndex
                ].czas
            )
            : 0;


    kursPrzystanki.forEach(
        (
            el,
            index
        ) => {

            const isPast =
                stopIndex !== -1 &&
                index < stopIndex;


            const isCurrent =
                stopIndex !== -1 &&
                index === stopIndex;


            const wiersz =
                document.createElement(
                    "div"
                );


            wiersz.className =
                "kurs-przystanek" +
                (
                    isCurrent
                        ? " aktywny"
                        : ""
                );


            let diffText =
                "";


            if (!isPast) {

                let diff =
                    czasWMinutach(
                        el.czas
                    ) -
                    baseTime;


                if (
                    diff < 0
                ) {

                    diff +=
                        24 * 60;
                }


                diffText =
                    `${diff} min`;
            }


            const strokeColor =
                isPast
                    ? "#cccccc"
                    : (
                        isCurrent
                            ? "#000000"
                            : (
                                index === 0
                                    ? "#000000"
                                    : "#e42313"
                            )
                    );


            const fillColor =
                isPast
                    ? "#cccccc"
                    : (
                        isCurrent
                            ? "#000000"
                            : (
                                index === 0
                                    ? "#000000"
                                    : "#e42313"
                            )
                    );


            const topSegColor =
                isPast ||
                isCurrent
                    ? "#cccccc"
                    : "#000000";


            const botSegColor =
                isPast
                    ? "#cccccc"
                    : "#000000";


            let svgHtml =
                `<svg
                    width="40"
                    height="44"
                    style="display:block; overflow:visible;"
                >`;


            if (
                index > 0
            ) {

                svgHtml +=
                    `<line
                        x1="20"
                        y1="0"
                        x2="20"
                        y2="22"
                        stroke="${topSegColor}"
                        stroke-width="2.5"
                    />`;
            }


            if (
                index <
                kursPrzystanki.length - 1
            ) {

                svgHtml +=
                    `<line
                        x1="20"
                        y1="22"
                        x2="20"
                        y2="44"
                        stroke="${botSegColor}"
                        stroke-width="2.5"
                    />`;
            }


            if (
                index === 0 ||
                index ===
                kursPrzystanki.length - 1
            ) {

                if (el.nz) {

                    svgHtml +=
                        `<rect
                            x="13.25"
                            y="15.25"
                            width="13.5"
                            height="13.5"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    svgHtml +=
                        `<rect
                            x="12"
                            y="14"
                            width="16"
                            height="16"
                            fill="${fillColor}"
                            stroke="none"
                        />`;
                }

            } else {

                if (el.nz) {

                    svgHtml +=
                        `<circle
                            cx="20"
                            cy="22"
                            r="6.75"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    svgHtml +=
                        `<circle
                            cx="20"
                            cy="22"
                            r="8"
                            fill="${fillColor}"
                            stroke="none"
                        />`;
                }
            }


            svgHtml +=
                "</svg>";


            const textStyling =
                isPast
                    ? "color:#aaaaaa; font-weight:600;"
                    : (
                        isCurrent
                            ? "color:#000000; font-weight:900; font-size:17px;"
                            : "color:#000000; font-weight:600;"
                    );


            const timeStyling =
                isPast
                    ? "color:#aaaaaa; font-weight:600;"
                    : (
                        isCurrent
                            ? "color:#000000; font-weight:900; font-size:17px;"
                            : "color:#000000; font-weight:600;"
                    );


            const nrStyling =
                isPast
                    ? "color:#cccccc;"
                    : "color:#777777;";


            const relTimeStyling =
                isPast
                    ? "color:#cccccc;"
                    : (
                        isCurrent
                            ? "color:#444444; font-weight:600;"
                            : "color:#888888;"
                    );


            wiersz.innerHTML =
                `
                <div
                    class="kurs-czas-rel"
                    style="${relTimeStyling}"
                >
                    ${diffText}
                </div>

                <div
                    class="node-wrapper"
                    style="width:40px;"
                >
                    ${svgHtml}
                </div>

                <div
                    class="kurs-nazwa-box"
                    style="${textStyling}"
                >
                    ${el.nazwa}
                </div>

                <div
                    class="kurs-nr"
                    style="${nrStyling}"
                >
                    ${el.nr || ""}
                </div>

                <div
                    class="kurs-czas-abs"
                    style="${timeStyling}"
                >
                    ${el.czas}
                </div>
                `;


            lista.appendChild(
                wiersz
            );
        }
    );


    widok.appendChild(
        lista
    );


    kontener.appendChild(
        widok
    );
}


/* =========================================================
   BŁĄD
   ========================================================= */

function pokazBlad(
    tytul,
    opis
) {

    document.getElementById(
        "numerLinii"
    ).textContent =
        "Błąd";


    document.getElementById(
        "trasa"
    ).textContent =
        "";


    document.getElementById(
        "kierunki"
    ).innerHTML =
        "";


    document.getElementById(
        "typRozkładu"
    ).style.display =
        "none";


    const wp =
        document.getElementById(
            "warianty-pojemnik"
        );


    if (wp)
        wp.style.display =
            "none";


    document.getElementById(
        "przystanki"
    ).innerHTML =
        '<div class="blad">' +
            '<strong>' +
                tytul +
            '</strong>' +
            opis +
        '</div>';
}


/* =========================================================
   HISTORIA PRZEGLĄDARKI
   ========================================================= */

window.addEventListener(
    "popstate",
    function() {

        const url =
            new URL(
                window.location.href
            );


        const pParam =
            url.searchParams.get(
                "przystanek"
            );


        const kParam =
            url.searchParams.get(
                "kierunek"
            );


        if (
            kParam !== null &&
            !isNaN(
                Number(kParam)
            )
        ) {

            aktualnyKierunek =
                Number(
                    kParam
                );
        }


        const rozklad =
            znajdzRozklad();


        if (
            pParam &&
            rozklad &&
            rozklad.kierunki &&
            rozklad.kierunki[
                aktualnyKierunek
            ]
        ) {

            const kierunek =
                rozklad.kierunki[
                    aktualnyKierunek
                ];


            const przystanki =
                kierunek.przystanki ||
                [];


            const p =
                znajdzPrzystanek(
                    przystanki,
                    pParam
                );


            if (p) {

                const index =
                    przystanki.indexOf(
                        p
                    );


                ustawWybranyPrzystanek(
                    p,
                    index
                );

            } else {

                ustawWybranyPrzystanek(
                    null
                );
            }

        } else {

            ustawWybranyPrzystanek(
                null
            );
        }


        widokKursuAktywny =
            false;


        /*
         * Po powrocie przez historię również
         * ustalamy wariant od początku trasy.
         */

        aktualnyWariant =
            null;


        pokazRozklad();
    }
);

</script>
