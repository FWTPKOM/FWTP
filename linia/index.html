                liczbaGlownego &&
            wariant === "A" &&
            mainWariant !== "A"
        ) {

            mainWariant =
                "A";
        }
    }
);



/* =====================================================
   GLOBALNA REGUŁA:
   DŁUŻSZA TRASA PRZY PODOBNEJ LICZBIE KURSÓW
   =====================================================

   Problem widoczny m.in. na linii 228:

   - istnieje dłuższy przebieg przez więcej przystanków,
   - istnieje krótszy przebieg omijający część tej trasy,
   - liczba kursów obu przebiegów jest bardzo podobna.

   W takim układzie nie chcemy automatycznie wybierać
   krótszej trasy jako osi głównej tylko dlatego, że jest
   geometrycznie prostsza.

   Zasada:

   1. szukamy wariantu z NAJDŁUŻSZĄ reprezentatywną trasą,
   2. szukamy krótszych wariantów, które są z nim rzeczywiście
      powiązane (dłuższy przebieg jest lokalnym objazdem /
      rozwinięciem krótszego),
   3. bierzemy największą liczbę kursów wśród takich krótszych
      przebiegów,
   4. jeżeli dłuższa trasa ma tyle samo kursów albo najwyżej
      o 3 kursy mniej, uznajemy ją za trasę podstawową.

   Czyli przykładowo:

       dłuższa:  12 kursów
       krótsza:  12 kursów  -> dłuższa jest podstawowa

       dłuższa:  11 kursów
       krótsza:  13 kursów  -> dłuższa jest podstawowa

       dłuższa:  10 kursów
       krótsza:  13 kursów  -> dłuższa jest podstawowa

       dłuższa:   9 kursów
       krótsza:  13 kursów  -> zostaje zwykła logika

   Tolerancja = 3 kursy.

   Reguła jest globalna i nie sprawdza numeru linii.
   Dzięki temu może zadziałać również na innych liniach
   o takim samym układzie jak 228.
*/

const TOLERANCJA_KURSOW_DLUZSZEJ_TRASY =
    3;


let kandydatNajdluzszejTrasy =
    null;


let dlugoscNajdluzszejTrasy =
    -1;


wariantyDoWyboruGlownejOsi.forEach(
    wariant => {

        const sciezka =
            reprezentatywneSciezkiWariantow.get(
                wariant
            ) || [];


        const dlugosc =
            Array.isArray(
                sciezka
            )
                ? sciezka.length
                : 0;


        if (
            dlugosc >
            dlugoscNajdluzszejTrasy
        ) {

            kandydatNajdluzszejTrasy =
                wariant;

            dlugoscNajdluzszejTrasy =
                dlugosc;
        }
    }
);


if (
    kandydatNajdluzszejTrasy
) {

    const sciezkaNajdluzsza =
        reprezentatywneSciezkiWariantow.get(
            kandydatNajdluzszejTrasy
        ) || [];


    const liczbaKursowNajdluzszej =
        liczbaKursowWariantu.get(
            kandydatNajdluzszejTrasy
        ) || 0;


    let maksymalnaLiczbaKursowKrotszej =
        -1;


    let znalezionoPowiazanaKrotszaTrase =
        false;


    wariantyKierunku.forEach(
        wariantKrotszy => {

            if (
                wariantKrotszy ===
                kandydatNajdluzszejTrasy
            ) {

                return;
            }


            const sciezkaKrotsza =
                reprezentatywneSciezkiWariantow.get(
                    wariantKrotszy
                ) || [];


            if (
                !Array.isArray(
                    sciezkaKrotsza
                ) ||
                sciezkaKrotsza.length === 0 ||
                sciezkaKrotsza.length >=
                    sciezkaNajdluzsza.length
            ) {

                return;
            }


            /*
             * Dłuższa trasa musi być rzeczywiście rozwinięciem
             * / objazdem względem krótszej, a nie zupełnie inną
             * trasą o przypadkowo mniejszej liczbie punktów.
             */
            const karaRozwiniecia =
                policzKareLokalnegoObjazduFWTP(
                    sciezkaNajdluzsza,
                    sciezkaKrotsza
                );


            if (
                karaRozwiniecia <= 0
            ) {

                return;
            }


            znalezionoPowiazanaKrotszaTrase =
                true;


            const liczbaKursowKrotszej =
                liczbaKursowWariantu.get(
                    wariantKrotszy
                ) || 0;


            if (
                liczbaKursowKrotszej >
                maksymalnaLiczbaKursowKrotszej
            ) {

                maksymalnaLiczbaKursowKrotszej =
                    liczbaKursowKrotszej;
            }
        }
    );


    if (
        znalezionoPowiazanaKrotszaTrase &&
        maksymalnaLiczbaKursowKrotszej >= 0
    ) {

        const roznicaKursow =
            maksymalnaLiczbaKursowKrotszej -
            liczbaKursowNajdluzszej;


        /*
         * Jeżeli dłuższa trasa ma co najmniej tyle kursów,
         * co krótsza MINUS tolerancja 3, staje się osią główną.
         *
         * Ujemna różnica oznacza, że dłuższa ma nawet więcej
         * kursów — wtedy również oczywiście ją wybieramy.
         */
        if (
            roznicaKursow <=
            TOLERANCJA_KURSOW_DLUZSZEJ_TRASY
        ) {

            mainWariant =
                kandydatNajdluzszejTrasy;


            console.info(
                "FWTP: dłuższa trasa wybrana jako podstawowa",
                {
                    linia:
                        numerLinii,

                    kierunek:
                        aktualnyKierunek,

                    wariant:
                        kandydatNajdluzszejTrasy,

                    liczbaKursowDluzszej:
                        liczbaKursowNajdluzszej,

                    maksymalnaLiczbaKursowKrotszej:
                        maksymalnaLiczbaKursowKrotszej,

                    roznica:
                        roznicaKursow,

                    tolerancja:
                        TOLERANCJA_KURSOW_DLUZSZEJ_TRASY,

                    dlugoscSciezki:
                        sciezkaNajdluzsza.length
                }
            );
        }
    }
}


/* =====================================================
   LINIA 131 — ZACHOWANIE STAREGO WYBORU OSI GŁÓWNEJ
   =====================================================

   W wersji globalnej v5 zmieniliśmy wybór osi głównej tak, aby
   wariant z dodatkowymi przystankami nie stawał się osią główną.

   Dla linii 131 wcześniejszy układ był już poprawnie dopasowany,
   dlatego 131 zachowuje poprzednią zasadę:
   - najwięcej unikalnych kursów,
   - przy remisie preferencja wariantu A.

   Dzięki temu nowe reguły dla 110 / 126 / 331 nie zmieniają
   geometrii 131.
*/
if (
    String(
        numerLinii || ""
    ).trim() === "131"
) {

    mainWariant =
        wariantyDoWyboruGlownejOsi[0] ||
        "";


    wariantyDoWyboruGlownejOsi.forEach(
        wariant => {

            const liczbaAktualnego =
                liczbaKursowWariantu.get(
                    wariant
                ) || 0;


            const liczbaGlownego =
                liczbaKursowWariantu.get(
                    mainWariant
                ) || 0;


            if (
                liczbaAktualnego >
                liczbaGlownego
            ) {

                mainWariant =
                    wariant;

                return;
            }


            if (
                liczbaAktualnego ===
                    liczbaGlownego &&
                wariant === "A" &&
                mainWariant !== "A"
            ) {

                mainWariant =
                    "A";
            }
        }
    );
}


console.info(
    "FWTP: wybór osi głównej",
    {
        linia:
            numerLinii,

        kierunek:
            aktualnyKierunek,

        mainWariant:
            mainWariant,

        karyObjazdu:
            Object.fromEntries(
                karaObjazduWariantu
            ),

        sciezki:
            Object.fromEntries(
                reprezentatywneSciezkiWariantow
            )
    }
);

/*
 * Oś główna jest określana na podstawie
 * rzeczywistego występowania wariantu A
 * na danym przystanku.
 *
 * Dzięki temu:
 *
 * Ursynów PŁD. -> A = środek
 * Ursynów PŁD. -> B = prawa strona
 */

let isOnMainAxis =
    new Array(N).fill(false);


przystanki.forEach(
    (
        p,
        i
    ) => {

        const kursy =
            p.kursy ||
            [];


        const maWariantBazowy =
            kursy.some(
                k =>
                    pobierzWariant(k) ===
                    mainWariant
            );


        isOnMainAxis[i] =
            maWariantBazowy;
    }
);


/*
 * Zachowujemy oryginalną informację o przebiegu podstawowym.
 *
 * To jest bardzo ważne przy kursach WYDŁUŻONYCH.
 *
 * Przykład linii 131:
 *
 * trasa podstawowa:
 *   ... -> Goraszewska -> Sadyba 05
 *
 * kurs wydłużony:
 *   ... -> Goraszewska -> Sadyba 01 -> ... -> Wilanów
 *
 * Sadyba 05 jest krańcem trasy podstawowej, ale kurs wydłużony
 * jej NIE obsługuje. Taki kurs musi ominąć ten przystanek
 * po LEWEJ stronie, zamiast prowadzić czarną linię przez
 * nieobsługiwany Sadyba 05.
 *
 * Później isOnMainAxis może być rozszerzane ze względów
 * graficznych, dlatego do wykrywania takich pominięć używamy
 * osobnej, niezmiennej kopii.
 */
const isOnMainAxisBazowa =
    isOnMainAxis.slice();


    /* =====================================================
       ŚCIEŻKI
       ===================================================== */

    const tripPaths =
        {};


    przystanki.forEach(
        (
            p,
            i
        ) => {

            (
                p.kursy ||
                []
            ).forEach(
                k => {

                    const numer =
                        String(
                            k.numer
                        ).trim();


                    if (!numer)
                        return;


                    /*
                     * Do ścieżki konkretnego kursu dodajemy
                     * tylko przystanki, na których kurs ma
                     * rzeczywisty czas.
                     *
                     * Dzięki temu kurs pomijający kilka
                     * przystanków tworzy jedną długą krawędź
                     * i może zostać narysowany z LEWEJ strony.
                     */
                    if (
                        czasNaMinuty(
                            k.czas
                        ) === null
                    ) {
                        return;
                    }


                    const wariant =
                        pobierzWariant(
                            k
                        );


                    const klucz =
                        numer +
                        "||" +
                        wariant;


                    if (
                        !tripPaths[
                            klucz
                        ]
                    ) {

                        tripPaths[
                            klucz
                        ] = [];
                    }


                    tripPaths[
                        klucz
                    ].push(
                        {
                            index:
                                i,

                            wariant:
                                wariant
                        }
                    );
                }
            );
        }
    );


    /* =====================================================
       KRAWĘDZIE
       ===================================================== */

    const edgesMap =
        {};


    Object.values(
        tripPaths
    ).forEach(
        path => {

            path.sort(
                (
                    a,
                    b
                ) =>
                    a.index -
                    b.index
            );


            for (
                let j = 0;
                j <
                path.length - 1;
                j++
            ) {

                const u =
                    path[j].index;


                const v =
                    path[j + 1].index;


                const w =
                    path[j].wariant;


                const key =
                    u +
                    "," +
                    v;


                if (
                    !edgesMap[key]
                ) {

                    edgesMap[key] =
                        {
                            u:
                                u,

                            v:
                                v,

                            warianty:
                                new Set()
                        };
                }


                edgesMap[key]
                    .warianty
                    .add(w);
            }
        }
    );


    const edges =
        Object.values(
            edgesMap
        );


    /*
     * Sprawdzamy, czy pomiędzy u i v istnieje RZECZYWISTA
     * alternatywna droga przez przystanki pośrednie.
     *
     * Jest to ważne przy układach takich jak:
     *
     *   Wiertnicza -> Sadyba 05 -> Sadyba 02
     *   Wiertnicza -------------> Sadyba 02
     *
     * Jeżeli bezpośrednia krawędź należy do trasy podstawowej,
     * pozostaje ona PROSTO, a wariant przez dodatkowe przystanki
     * jest rysowany po PRAWEJ stronie.
     *
     * Lewa strona jest używana dopiero wtedy, gdy konkretny kurs
     * rzeczywiście pomija przystanek trasy podstawowej.
     *
     * Natomiast gdy przystanki znajdujące się pomiędzy indeksami
     * tworzą osobną odnogę, która NIE wraca do v, długa krawędź
     * nie jest objazdem. Jest zwykłym ciągiem trasy i może iść
     * prosto. To naprawia m.in. układ Wękarska / Rychnowska /
     * Romantyczna / Cyklamenów / Skalnicowa / Strzygłowska.
     */
    function istniejeAlternatywnaSciezkaFWTP(
        u,
        v
    ) {

        if (v <= u + 1) {
            return false;
        }


        const sasiedzi =
            new Map();


        edges.forEach(
            krawedz => {

                if (
                    krawedz.u < u ||
                    krawedz.v > v ||
                    (
                        krawedz.u === u &&
                        krawedz.v === v
                    )
                ) {
                    return;
                }


                if (
                    !sasiedzi.has(
                        krawedz.u
                    )
                ) {
                    sasiedzi.set(
                        krawedz.u,
                        []
                    );
                }


                sasiedzi
                    .get(krawedz.u)
                    .push(krawedz.v);
            }
        );


        const stos =
            [u];


        const odwiedzone =
            new Set([u]);


        while (stos.length > 0) {

            const aktualny =
                stos.pop();


            const dalej =
                sasiedzi.get(aktualny) ||
                [];


            for (const nastepny of dalej) {

                if (nastepny === v) {
                    return true;
                }


                if (
                    !odwiedzone.has(
                        nastepny
                    )
                ) {

                    odwiedzone.add(
                        nastepny
                    );


                    stos.push(
                        nastepny
                    );
                }
            }
        }


        return false;
    }


    /*
     * Jeżeli długa krawędź przechodzi "nad" przystankami
     * wpisanymi pomiędzy indeksami, ale NIE istnieje droga
     * u -> ... -> v przez te przystanki, oznacza to, że
     * przystanki pośrednie należą do bocznej odnogi.
     *
     * Wtedy ciąg u -> v ma iść PROSTO po osi głównej,
     * a odnoga może odchodzić w prawo.
     *
     * To naprawia sytuację jak:
     * Wękarska -> Strzygłowska (prosto)
     * oraz osobno Wękarska -> Rychnowska -> ... -> Skalnicowa.
     */
    edges.forEach(
        e => {

            if (
                e.v > e.u + 1 &&
                !istniejeAlternatywnaSciezkaFWTP(
                    e.u,
                    e.v
                )
            ) {

                /*
                 * Jeżeli pośrednie punkty NIE należą do trasy
                 * podstawowej, są tylko boczną odnogą i wtedy
                 * bezpośrednia krawędź może pozostać osią główną.
                 *
                 * Jeżeli natomiast po drodze znajduje się punkt
                 * trasy podstawowej (np. Sadyba 05 na linii 131),
                 * nie wolno potraktować bezpośredniego przejazdu
                 * jako zwykłej pionowej osi.
                 */
                let maPosredniPunktBazowy =
                    false;


                for (
                    let k =
                        e.u + 1;
                    k < e.v;
                    k++
                ) {

                    if (
                        isOnMainAxisBazowa[k]
                    ) {

                        maPosredniPunktBazowy =
                            true;

                        break;
                    }
                }


                if (!maPosredniPunktBazowy) {

                    isOnMainAxis[
                        e.u
                    ] = true;


                    isOnMainAxis[
                        e.v
                    ] = true;
                }
            }
        }
    );


    /*
     * LINIA 338 — lokalne położenie punktów prawej odnogi.
     * Nie zmieniamy globalnego isOnMainAxis.
     */
    const force338RightNodes =
        new Set();


    edges.forEach(
        e => {

            const maPrzystankiPomiedzy =
                e.v >
                e.u + 1;


            /*
             * Czy pomiędzy końcami tej krawędzi znajduje się
             * przystanek należący do RZECZYWISTEJ trasy
             * podstawowej?
             *
             * Jeżeli tak, a dany kurs przechodzi bezpośrednio
             * z u do v, to znaczy, że pomija ten przystanek.
             *
             * To obejmuje także sytuację, gdy pomijany przystanek
             * jest KRAŃCEM trasy podstawowej i nie istnieje już
             * dalsza krawędź trasy A do punktu v.
             */
            let pomijaPrzystanekTrasyPodstawowej =
                false;


            if (maPrzystankiPomiedzy) {

                for (
                    let k =
                        e.u + 1;
                    k < e.v;
                    k++
                ) {

                    if (
                        isOnMainAxisBazowa[k]
                    ) {

                        pomijaPrzystanekTrasyPodstawowej =
                            true;

                        break;
                    }
                }
            }


            const maAlternatywnaSciezke =
                maPrzystankiPomiedzy &&
                istniejeAlternatywnaSciezkaFWTP(
                    e.u,
                    e.v
                );


            const nalezyDoWariantuPodstawowego =
                e.warianty &&
                typeof e.warianty.has ===
                    "function" &&
                e.warianty.has(
                    mainWariant
                );


            /*
             * KLUCZOWA ZASADA GEOMETRII:
             *
             * Jeżeli przebieg podstawowy jedzie BEZPOŚREDNIO
             * z u do v, a inny wariant odbija pomiędzy nimi
             * przez dodatkowe przystanki i wraca do v, to:
             *
             * - przebieg podstawowy zostaje PROSTO,
             * - wariant przez dodatkowe przystanki idzie PRAWO.
             *
             * Nie wolno wtedy przenosić bezpośredniej krawędzi
             * na lewą stronę tylko dlatego, że istnieje
             * alternatywna droga.
             *
             * Przykład linii 210:
             * Sierakowska -> Langiewicza = prosto,
             * a Sierakowska -> Langiewicza 03 -> Hornówek
             * -> Langiewicza 02 = prawa odnoga.
             */
            const podstawowaKrawedzZObjazdem =
                nalezyDoWariantuPodstawowego &&
                maAlternatywnaSciezke &&
                !pomijaPrzystanekTrasyPodstawowej;


            const rzeczywiscieOmija =
                maPrzystankiPomiedzy &&
                !podstawowaKrawedzZObjazdem &&
                (
                    pomijaPrzystanekTrasyPodstawowej ||
                    maAlternatywnaSciezke
                );


            if (
                podstawowaKrawedzZObjazdem
            ) {

                /*
                 * Trasa podstawowa idzie prosto.
                 * Boczne przystanki zostaną narysowane po prawej
                 * przez krawędzie track = 1.
                 */
                e.track =
                    0;

            } else if (
                rzeczywiscieOmija
            ) {

                /*
                 * Rzeczywiste pominięcie przystanku należącego
                 * do trasy podstawowej albo skrót niebędący
                 * przebiegiem podstawowym rysujemy po lewej.
                 */
                e.track =
                    -1;

            } else if (
                isOnMainAxis[e.u] &&
                isOnMainAxis[e.v]
            ) {

                /*
                 * Oba końce leżą na osi głównej.
                 * Nawet jeśli w tablicy pomiędzy nimi są wpisane
                 * przystanki osobnej odnogi, linia idzie PROSTO.
                 */
                e.track =
                    0;

            } else {

                /*
                 * Przejazd przez dodatkową odnogę / wariant.
                 */
                e.track =
                    1;
            }
        }
    );



    /* =====================================================
       LINIA 338 — POST-PROCESSING GOTOWEJ GEOMETRII
       =====================================================

       Standardowa logika już poprawnie wskazuje przejazd,
       który omija cały blok przystanków: nadaje mu track = -1.

       Dla 338 robimy tylko lokalną zamianę:
       - najdłuższy track = -1 staje się track = 0,
       - pozostałe krawędzie wewnątrz tego zakresu stają się track = 1,
       - wewnętrzne punkty tego zakresu są rysowane na RIGHT_X.

       Dzięki temu:
       - przejazd omijający idzie osią główną,
       - wariant przez dodatkowe przystanki idzie po prawej,
       - początek i koniec są połączone,
       - żadna inna linia nie jest zmieniana.
    */

    if (
        String(
            numerLinii || ""
        ).trim() === "338"
    ) {

        const kandydaci338 =
            edges
                .filter(
                    e =>
                        e.track === -1 &&
                        (
                            e.v -
                            e.u
                        ) >= 4
                )
                .sort(
                    (
                        a,
                        b
                    ) =>
                        (
                            b.v -
                            b.u
                        ) -
                        (
                            a.v -
                            a.u
                        )
                );


        const glownySkrot338 =
            kandydaci338.length > 0
                ? kandydaci338[0]
                : null;


        if (
            glownySkrot338
        ) {

            const start338 =
                glownySkrot338.u;


            const koniec338 =
                glownySkrot338.v;


            glownySkrot338.track =
                0;


            for (
                let k =
                    start338 + 1;
                k < koniec338;
                k++
            ) {

                force338RightNodes.add(
                    k
                );
            }


            edges.forEach(
                e => {

                    if (
                        e ===
                            glownySkrot338 ||
                        e.u < start338 ||
                        e.v > koniec338 ||
                        e.v <= e.u
                    ) {

                        return;
                    }


                    e.track =
                        1;
                }
            );
        }
    }


    function xDlaPunktu338(
        index
    ) {

        if (
            String(
                numerLinii || ""
            ).trim() === "338" &&
            force338RightNodes.has(
                index
            )
        ) {

            return RIGHT_X;
        }


        return isOnMainAxis[index]
            ? SPINE_X
            : RIGHT_X;
    }


    /* =====================================================
       KOŃCE LEWEGO WARIANTU POMIJAJĄCEGO

       Dotyczy również pominięć wewnątrz innego wariantu.
       Dzięki temu końcowy wiersz jest automatycznie obniżany
       również tam, gdzie wcześniej linie się nie stykały.
       ===================================================== */

    /*
     * Jeżeli wariant pomijający rozpoczyna się na przystanku
     * po PRAWEJ stronie osi, musi mieć dodatkową wysokość,
     * żeby przekątna RIGHT_X -> LEFT_X miała miejsce na pełne
     * 44 px w pionie.
     */
    const leftSkipVariantStartIndexes =
        new Set(
            edges
                .filter(
                    e =>
                        e.track === -1 &&
                        !isOnMainAxis[
                            e.u
                        ]
                )
                .map(
                    e => e.u
                )
        );


    const leftSkipVariantEndIndexes =
        new Set(
            edges
                .filter(
                    e =>
                        e.track === -1
                )
                .map(
                    e => e.v
                )
        );


    /*
     * POMINIĘCIA TRASY PODSTAWOWEJ — REGUŁA GLOBALNA
     *
     * Wcześniej KAŻDY przystanek trasy podstawowej znajdujący się
     * wewnątrz lewego ominięcia dostawał wysokość 66 px.
     *
     * To powodowało sztuczne odstępy m.in. na liniach 110, 126 i 331.
     *
     * Teraz dla KAŻDEJ lewej krawędzi powiększamy tylko OSTATNI
     * pomijany przystanek trasy podstawowej — ten bezpośrednio przed
     * powrotem wariantu na dalszą trasę.
     *
     * Dzięki temu:
     * - środek ominięcia ma zwykłe odstępy 44 px,
     * - pion po lewej jest ciągły,
     * - dodatkowe miejsce pojawia się tylko przed przekątną powrotu,
     * - układy prowadzone po prawej stronie (np. część 210/239)
     *   nie są zmieniane, bo nie mają track === -1.
     */
    const leftSkipIntermediateMainIndexes =
        new Set();


    /*
     * GLOBALNA GEOMETRIA 1–2 POMINIĘĆ — WG MIEJSCA POWROTU
     *
     * Wcześniej poprawna geometria była przypisana wyłącznie
     * do linii 131. Okazało się jednak, że dokładnie ten sam
     * układ występuje również np. na linii 170:
     *
     *     punkt wspólny
     *          \
     *           \   wariant pomija JEDEN przystanek osi głównej
     *            \
     *     pomijany przystanek
     *              \
     *               punkt powrotu
     *
     * Jeżeli lewa krawędź omija dokładnie JEDEN przystanek
     * rzeczywistej osi głównej, używamy starej geometrii 131:
     * - wiersz ma 66 px,
     * - nieaktywny znacznik jest na y = 44 px,
     * - pion po lewej zaczyna się na y = 22 px.
     *
     * Jeżeli pomijanych przystanków jest kilka (np. 110/126/331),
     * zachowujemy nową zwartą geometrię: zwykłe odstępy pośrodku
     * i dodatkowe miejsce tylko przed przekątną powrotu.
     */
    const legacySingleSkipIntermediateIndexes =
        new Set();


    /*
     * LINIA 311, KIERUNEK 1 (KAMIONKA)
     *
     * Większy odstęp ma być TYLKO na początku ominięcia:
     *
     * Umińskiego
     *      ↓ większy odstęp
     * Rechniewskiego 02
     *      ↓ zwykły odstęp
     * Rechniewskiego 01
     *      ↓ zwykły odstęp
     * Nowaka-Jeziorańskiego
     *
     * Dlatego dodatkowe 22 px dostaje PIERWSZY pomijany
     * przystanek, a nie punkt powrotu na oś główną.
     *
     * Drugi kierunek linii 311 pozostaje dokładnie tak jak w v12.
     */
    const extraTopFirstSkippedVariantIndexes =
        new Set();


    edges
        .filter(
            e =>
                e.track === -1
        )
        .forEach(
            e => {

                const pomijaneBazowe =
                    [];


                for (
                    let k = e.u + 1;
                    k < e.v;
                    k++
                ) {

                    if (
                        isOnMainAxisBazowa[k]
                    ) {

                        pomijaneBazowe.push(
                            k
                        );
                    }
                }


                const ostatniPomijanyBazowy =
                    pomijaneBazowe.length > 0
                        ? pomijaneBazowe[
                            pomijaneBazowe.length - 1
                          ]
                        : -1;


                e.skippedMainIndexes =
                    pomijaneBazowe;


                e.lastSkippedMainIndex =
                    ostatniPomijanyBazowy;


                /*
                 * GLOBALNA ZASADA GEOMETRII JEDNEGO POMINIĘCIA
                 *
                 * Są dwa różne układy, które wcześniej przypadkiem
                 * były rozróżniane numerem linii / kierunkiem:
                 *
                 * 1. wariant omija jeden przystanek i WRACA na oś główną
                 *    (e.v leży na osi głównej)
                 *    -> geometria taka jak poprawny kierunek 131 oraz
                 *       poprawiony kierunek 170 do Ronda Starzyńskiego;
                 *       dodatkowe 22 px są NAD pomijanym punktem,
                 *       a lewy pion dochodzi do końca wiersza.
                 *
                 * 2. wariant omija jeden przystanek, ale po pominięciu
                 *    DALEJ JEDZIE BOCZNĄ osią (e.v nie leży na osi głównej)
                 *    -> geometria zwarta; dodatkowe 22 px są POD punktem,
                 *       a pion kończy się wcześniej, bo następna przekątna
                 *       zaczyna się 22 px ponad kolejnym wierszem.
                 *
                 * To jest dokładnie różnica, przez którą 170 w jednym
                 * kierunku wymagało zachowania v7, a w drugim v8.
                 */
                /*
                 * GLOBALNA GEOMETRIA POWROTU NA OŚ GŁÓWNĄ
                 *
                 * Wcześniej ten układ działał tylko wtedy, gdy długa
                 * krawędź omijała dokładnie JEDEN przystanek.
                 *
                 * To było zbyt wąskie założenie. Na liniach takich jak
                 * 311 w jednym kierunku pomijane są DWA przystanki,
                 * ale topologia jest dokładnie taka sama:
                 *
                 *     punkt wspólny
                 *          \
                 *           \---- lewa odnoga / przejazd bezpośredni
                 *            |
                 *      [pomijany 1]
                 *            |
                 *      [pomijany 2]
                 *            |
                 *           /
                 *          /
                 *     punkt powrotu NA OŚ GŁÓWNĄ
                 *
                 * Dlatego geometria typu 131 działa teraz globalnie
                 * dla 1 LUB 2 pomijanych przystanków, jeżeli wariant
                 * wraca na oś główną.
                 *
                 * Ważne:
                 * - nadal powiększamy tylko OSTATNI pomijany wiersz,
                 *   więc nie wracają duże odstępy znane z 110/126/331;
                 * - układy z trzema i większą liczbą pominięć zostają
                 *   przy zwartej geometrii;
                 * - nie ma warunku zależnego od numeru linii.
                 */
                e.useLegacySingleSkipGeometry =
                    pomijaneBazowe.length >= 1 &&
                    pomijaneBazowe.length <= 2 &&
                    isOnMainAxis[
                        e.v
                    ] === true;


                const czy311KamionkaDwaPomijane =
                    String(
                        numerLinii || ""
                    ).trim() === "311" &&
                    Number(
                        aktualnyKierunek
                    ) === 1 &&
                    pomijaneBazowe.length === 2 &&
                    isOnMainAxis[
                        e.v
                    ] === true;


                /*
                 * GLOBALNA REGUŁA:
                 * NAJPIERW WARIANT, POTEM OMINIĘCIE TRASY GŁÓWNEJ
                 *
                 * Przykład: linia 332
                 *
                 * Danusi
                 *      \
                 *       ○ Juranda ze Spychowa-Szkoła
                 *       ○ Echa Leśne
                 *       ○ Kamykowa
                 *      /
                 *     [lewy skrót omijający]
                 *       ○ Przyjazna
                 *       ○ Dobka z Oleśnicy
                 *       ...
                 *       ○ Berensona
                 *      /
                 * Juranda ze Spychowa
                 *
                 * Jeżeli lewa krawędź:
                 * - ZACZYNA się poza osią główną,
                 * - omija przystanki osi głównej,
                 * - i WRACA na oś główną,
                 *
                 * to dodatkowe 22 px powinno być na POCZĄTKU
                 * ominięcia, czyli przed pierwszym pomijanym
                 * przystankiem.
                 *
                 * Nie dokładamy dodatkowego miejsca przed punktem
                 * powrotu. Dzięki temu:
                 *
                 * Kamykowa -> Przyjazna = większy odstęp
                 * Berensona -> Juranda ze Spychowa = zwykły odstęp
                 *
                 * Reguła jest topologiczna, nie zależy od numeru 332.
                 * Nie obejmuje 126 / 131 / 170 / 311 / 711, bo tam
                 * początek takiej lewej krawędzi leży na osi głównej.
                 */
                const czyNajpierwWariantPotemPominiecie =
                    pomijaneBazowe.length >= 1 &&
                    isOnMainAxis[
                        e.u
                    ] !== true &&
                    isOnMainAxis[
                        e.v
                    ] === true;


                /*
                 * GLOBALNA REGUŁA DŁUGIEGO, PROSTEGO OMINIĘCIA
                 *
                 * Przykład: linia 711
                 *
                 * Węzeł Nadarzyn
                 *      \
                 *       |  kilka pomijanych przystanków
                 *       |
                 *      /
                 * Kościuszki
                 *      |
                 * Urząd Gminy
                 *
                 * Jeżeli:
                 * - krawędź zaczyna się na osi głównej,
                 * - omija co najmniej 3 przystanki osi głównej,
                 * - wraca bezpośrednio na oś główną,
                 * - a następny przystanek po punkcie powrotu również
                 *   należy do osi głównej,
                 *
                 * to NIE dokładamy dodatkowych 22 px.
                 *
                 * Dzięki temu nie powstaje sztuczna przerwa przed
                 * punktem powrotu. Sama przekątna nadal ma poprawną
                 * geometrię, bo LEFT_X -> SPINE_X wymaga tylko 22 px.
                 *
                 * Warunek >= 3 celowo zostawia bez zmian krótsze układy
                 * typu 131 / 170 oraz specjalny przypadek 311.
                 */
                const czyDlugiProstyPowrotNaOs =
                    pomijaneBazowe.length >= 3 &&
                    isOnMainAxis[
                        e.u
                    ] === true &&
                    isOnMainAxis[
                        e.v
                    ] === true &&
                    (
                        e.v + 1 >= N ||
                        isOnMainAxis[
                            e.v + 1
                        ] === true
                    );


                e.compactDirectReturn =
                    czyDlugiProstyPowrotNaOs;


                if (
                    czy311KamionkaDwaPomijane ||
                    czyNajpierwWariantPotemPominiecie
                ) {

                    const pierwszyPomijanyBazowy =
                        pomijaneBazowe[0];


                    /*
                     * Dodatkowe 22 px są NAD pierwszym pomijanym
                     * przystankiem.
                     *
                     * Działa to dla:
                     * - specjalnego układu 311 -> Kamionka,
                     * - globalnego układu "wariant -> ominięcie",
                     *   np. 332.
                     */
                    extraTopFirstSkippedVariantIndexes.add(
                        pierwszyPomijanyBazowy
                    );

                    e.firstSkippedMainIndex =
                        pierwszyPomijanyBazowy;

                    e.extraTopAtStart =
                        true;

                } else if (
                    ostatniPomijanyBazowy >= 0 &&
                    !czyDlugiProstyPowrotNaOs
                ) {

                    leftSkipIntermediateMainIndexes.add(
                        ostatniPomijanyBazowy
                    );
                }


                if (
                    e.useLegacySingleSkipGeometry &&
                    !czy311KamionkaDwaPomijane &&
                    !czyNajpierwWariantPotemPominiecie &&
                    !czyDlugiProstyPowrotNaOs
                ) {

                    /*
                     * Wszystkie pozostałe przypadki zachowują
                     * dotychczasową geometrię.
                     */
                    legacySingleSkipIntermediateIndexes.add(
                        ostatniPomijanyBazowy
                    );
                }
            }
        );


    /*
     * WAŻNE:
     * nie wymuszamy końca lewego pominięcia na osi głównej.
     *
     * Jeżeli dany przystanek rzeczywiście należy do trasy
     * podstawowej, isOnMainAxis[] już ma wartość true.
     *
     * Jeżeli natomiast jest to dalszy ciąg wariantu, musi pozostać
     * na osi prawej razem z kolejnymi przystankami tego wariantu.
     * Przykład: Sadyba 01 -> Wiertnicza 01 -> Łowcza 01.
     */


    /* =====================================================
       KRAWĘDZIE DOKŁADNEGO KURSU
       ===================================================== */

    const selectedEdgeKeys =
        new Set();


    if (
        kursBazowy &&
        Array.isArray(
            kursBazowy.punkty
        )
    ) {

        const punkty =
            kursBazowy.punkty
                .filter(
                    pt =>
                        czasNaMinuty(
                            pt.czas
                        ) !== null
                )
                .sort(
                    (
                        a,
                        b
                    ) =>
                        a.index -
                        b.index
                );


        for (
            let j = 0;
            j <
            punkty.length - 1;
            j++
        ) {

            selectedEdgeKeys.add(
                punkty[j].index +
                "," +
                punkty[j + 1].index
            );
        }
    }


    /*
     * W zwykłym widoku wariantu aktywne muszą być wszystkie
     * odcinki należące do wybranego wariantu, a nie wyłącznie
     * odcinki jednego znalezionego kursu.
     */
    if (aktualnyWariant) {

        edges.forEach(
            e => {

                if (
                    e &&
                    e.warianty &&
                    typeof e.warianty.has ===
                        "function" &&
                    e.warianty.has(
                        aktualnyWariant
                    )
                ) {

                    selectedEdgeKeys.add(
                        e.u +
                        "," +
                        e.v
                    );
                }
            }
        );
    }


    /* =====================================================
       PARAMETRY SVG
       ===================================================== */

    const ROW_HEIGHT =
        44;


    const TRACK_W =
        22;


    const SPINE_X =
        44;


    const LEFT_X =
        SPINE_X -
        TRACK_W;


    const RIGHT_X =
        SPINE_X +
        TRACK_W;


    const SVG_W =
        RIGHT_X +
        16;


    /* =====================================================
       KOŃCE WSZYSTKICH WARIANTÓW / KURSÓW
       =====================================================

       Jeżeli aktualnie wybrany jest kurs podstawowy,
       końcowy przystanek innego wariantu może być szary.
       Taki przystanek nadal jest krańcem danego wariantu,
       więc powinien być rysowany jako KWADRAT.
    */

    const variantStartIndexes =
        new Set();


    const variantEndIndexes =
        new Set();


    Object.values(
        tripPaths
    ).forEach(
        path => {

            if (
                !Array.isArray(path) ||
                path.length === 0
            ) {
                return;
            }


            const pierwszyPunkt =
                path.find(
                    punkt =>
                        punkt &&
                        Number.isInteger(
                            Number(
                                punkt.index
                            )
                        )
                );


            if (pierwszyPunkt) {

                variantStartIndexes.add(
                    Number(
                        pierwszyPunkt.index
                    )
                );
            }


            let lastIndex =
                -1;


            path.forEach(
                punkt => {

                    if (
                        punkt &&
                        Number.isInteger(
                            Number(
                                punkt.index
                            )
                        )
                    ) {

                        lastIndex =
                            Math.max(
                                lastIndex,
                                Number(
                                    punkt.index
                                )
                            );
                    }
                }
            );


            if (lastIndex >= 0) {

                variantEndIndexes.add(
                    lastIndex
                );
            }
        }
    );


    /* =====================================================
       GLOBALNA GEOMETRIA LEWYCH OMINIĘĆ
       =====================================================

       Nie stosujemy już wyjątków zależnych od numeru linii.
       Linie 110, 126, 131, 331 i inne korzystają z tej samej
       reguły: tylko ostatni pomijany przystanek osi głównej
       dostaje dodatkowe 22 px przed miejscem powrotu wariantu.

       Linie, których wariant jest prawą odnogą (track === 1),
       zachowują dotychczasową geometrię.
    */


    /* =====================================================
       LISTA PRZYSTANKÓW
       ===================================================== */

    const lista =
        document.createElement(
            "div"
        );


    lista.className =
        "lista-przystankow";


    przystanki.forEach(
        (
            p,
            i
        ) => {

            const nodeActive =
                selectedActive[i];


            /*
             * Początek i koniec wariantu nie zmieniają wysokości
             * wiersza. Większy odstęp otrzymuje wyłącznie
             * przystanek trasy podstawowej pomijany pomiędzy nimi.
             */
            const isLowerLeftSkipStart =
                leftSkipVariantStartIndexes.has(i);


            const isLowerLeftSkipEnd =
                leftSkipVariantEndIndexes.has(i);


            /*
             * Standardowy wiersz ma 44 px.
             *
             * Jeżeli jednak TEN przystanek trasy podstawowej jest
             * pomijany przez lewy wariant, zwiększamy jego wiersz
             * do 66 px i pozostawiamy znacznik dokładnie pośrodku.
             *
             * Daje to po 11 px dodatkowego odstępu z obu stron:
             *
             *   Wiertnicza 02
             *        ↓ większy odstęp
             *   Sadyba 05
             *        ↓ większy odstęp
             *   Sadyba 01 / 02
             *
             * Sam punkt powrotu wariantu NIE jest rozciągany.
             *
             * Ważne: wysokość jest ustawiana również na samym
             * elemencie .przystanek-btn, a nie tylko w SVG.
             */
            const isSkippedMainIntermediate =
                leftSkipIntermediateMainIndexes.has(i);


            const isExtraTopFirstSkippedVariant =
                extraTopFirstSkippedVariantIndexes.has(
                    i
                );


            const isPowiekszonyWiersz =
                isSkippedMainIntermediate ||
                isExtraTopFirstSkippedVariant;


            const rowHeight =
                isPowiekszonyWiersz
                    ? ROW_HEIGHT + ROW_HEIGHT / 2
                    : ROW_HEIGHT;


            /*
             * Dla powiększonego wiersza NIE ustawiamy znacznika
             * pośrodku 66 px.
             *
             * nodeActive = false:
             *     nodeY = 44 px
             *     -> dodatkowe 22 px NAD przystankiem,
             *     -> normalne 22 px POD nim.
             *
             * nodeActive = true:
             *     nodeY = 22 px
             *     -> normalne 22 px NAD przystankiem,
             *     -> dodatkowe 22 px POD nim.
             *
             * To daje dokładnie:
             *
             * zdjęcie 1:
             * Wiertnicza 02 -> [większy odstęp] -> Sadyba 05
             * -> [normalny odstęp] -> Sadyba 02
             *
             * zdjęcie 2:
             * Goraszewska 01 -> [normalny odstęp] -> Sadyba 05
             * -> [większy odstęp] -> Sadyba 01
             */
            const useLegacySingleSkipRowGeometry =
                legacySingleSkipIntermediateIndexes.has(
                    i
                );


            const nodeY =
                isExtraTopFirstSkippedVariant
                    ? ROW_HEIGHT
                    : (
                        useLegacySingleSkipRowGeometry
                            ? (
                                nodeActive
                                    ? ROW_HEIGHT / 2
                                    : ROW_HEIGHT
                            )
                            : ROW_HEIGHT / 2
                    );


            const beforeVariantStart =
                firstActiveIndex !== -1 &&
                i <
                firstActiveIndex;


            const inactiveForCourse =
                !nodeActive;


            const visualInactive =
                beforeVariantStart ||
                inactiveForCourse;


            const btn =
                document.createElement(
                    "div"
                );


            btn.className =
                "przystanek-btn" +
                (
                    visualInactive
                        ? " inactive"
                        : ""
                );


            /*
             * Jeżeli przystanek leży WEWNĄTRZ lewego ominięcia
             * (np. Sadyba 05), jego wiersz naprawdę musi mieć
             * zwiększoną wysokość. Samo powiększenie SVG nie
             * zwiększało odstępu między wierszami, dlatego wcześniej
             * linie wyglądały na rozłączone.
             */
            if (
                isPowiekszonyWiersz
            ) {

                btn.style.height =
                    rowHeight + "px";

                btn.style.minHeight =
                    rowHeight + "px";
            }


            const isFirstStop =
                i === 0;


            const isLastStop =
                i ===
                przystanki.length - 1;


            const isVariantStart =
                firstActiveIndex !== -1 &&
                i === firstActiveIndex;


            const isVariantEnd =
                lastActiveIndex !== -1 &&
                i === lastActiveIndex;


            /*
             * Szary przystanek też może być krańcem
             * niewybranego wariantu (np. wariantu skróconego).
             * Wtedy również rysujemy go jako kwadrat.
             */
            const isInactiveVariantStart =
                !nodeActive &&
                variantStartIndexes.has(i);


            const isInactiveVariantEnd =
                !nodeActive &&
                variantEndIndexes.has(i);


            const shouldBeSquare =
                isFirstStop ||
                isVariantStart ||
                isVariantEnd ||
                isInactiveVariantStart ||
                isInactiveVariantEnd ||
                isLastStop;


            const isNz =
                czyPrzystanekNaZadanie(
                    p
                );


            let inactiveLines =
                "";


            let activeLines =
                "";


            /*
             * Linie rysujemy bez białego podkładu przy przecięciu.
             */
            let overlayLines =
                "";


            const drawLine =
                (
                    x1,
                    y1,
                    x2,
                    y2,
                    isActive
                ) => {

                    const color =
                        isActive
                            ? "#000"
                            : "#ccc";


                    const w =
                        isActive
                            ? 2.5
                            : 2;


                    const str =
                        `<line
                            x1="${x1}"
                            y1="${y1}"
                            x2="${x2}"
                            y2="${y2}"
                            stroke="${color}"
                            stroke-width="${w}"
                            stroke-linecap="round"
                        />`;


                    if (isActive) {
                        activeLines += str;
                    } else {
                        inactiveLines += str;
                    }
                };


            const drawCrossingLine =
                (x1, y1, x2, y2, isActive) => {
                    drawLine(
                        x1,
                        y1,
                        x2,
                        y2,
                        isActive
                    );
                };

            edges.forEach(
                e => {

                    const edgeKey =
                        e.u + "," + e.v;


                    const isEdgeActive =
                        selectedEdgeKeys.has(edgeKey);


                    if (e.track === 0) {

                        /*
                         * Standardowo track 0 jest pionową osią SPINE_X.
                         *
                         * Wyjątek lokalny 338:
                         * po post-processingu niektóre wewnętrzne punkty
                         * pętli są rysowane na RIGHT_X. Jeżeli krawędź
                         * track 0 dochodzi do takiego punktu, nie może
                         * kończyć się na SPINE_X, bo wtedy powstaje
                         * widoczna przerwa między kreską a kropką.
                         *
                         * Dlatego tylko dla 338 początek / koniec
                         * track 0 łączymy z rzeczywistym X punktu.
                         * Środkowa część krawędzi nadal pozostaje
                         * na SPINE_X.
                         */
                        const startXTrack0 =
                            String(
                                numerLinii || ""
                            ).trim() === "338"
                                ? xDlaPunktu338(
                                    e.u
                                )
                                : SPINE_X;


                        const endXTrack0 =
                            String(
                                numerLinii || ""
                            ).trim() === "338"
                                ? xDlaPunktu338(
                                    e.v
                                )
                                : SPINE_X;


                        if (i === e.u) {

                            drawLine(
                                startXTrack0,
                                nodeY,
                                SPINE_X,
                                rowHeight,
                                isEdgeActive
                            );

                        } else if (
                            i > e.u &&
                            i < e.v
                        ) {

                            drawLine(
                                SPINE_X,
                                0,
                                SPINE_X,
                                rowHeight,
                                isEdgeActive
                            );

                        } else if (
                            i === e.v
                        ) {

                            drawLine(
                                SPINE_X,
                                0,
                                endXTrack0,
                                nodeY,
                                isEdgeActive
                            );
                        }


                    } else if (e.track === 1) {

                        const startX =
                            String(
                                numerLinii || ""
                            ).trim() === "338"
                                ? xDlaPunktu338(
                                    e.u
                                )
                                : (
                                    isOnMainAxis[e.u]
                                        ? SPINE_X
                                        : RIGHT_X
                                );

                        const endX =
                            String(
                                numerLinii || ""
                            ).trim() === "338"
                                ? xDlaPunktu338(
                                    e.v
                                )
                                : (
                                    isOnMainAxis[e.v]
                                        ? SPINE_X
                                        : RIGHT_X
                                );


                        if (i === e.u) {
                            drawLine(
                                startX, nodeY,
                                RIGHT_X, rowHeight,
                                isEdgeActive
                            );

                        } else if (i > e.u && i < e.v) {
                            drawLine(
                                RIGHT_X, 0,
                                RIGHT_X, rowHeight,
                                isEdgeActive
                            );

                        } else if (i === e.v) {
                            drawLine(
                                RIGHT_X, 0,
                                endX, nodeY,
                                isEdgeActive
                            );
                        }


                    } else if (e.track === -1) {

                        const startX =
                            String(
                                numerLinii || ""
                            ).trim() === "338"
                                ? xDlaPunktu338(
                                    e.u
                                )
                                : (
                                    isOnMainAxis[e.u]
                                        ? SPINE_X
                                        : RIGHT_X
                                );

                        const endX =
                            String(
                                numerLinii || ""
                            ).trim() === "338"
                                ? xDlaPunktu338(
                                    e.v
                                )
                                : (
                                    isOnMainAxis[e.v]
                                        ? SPINE_X
                                        : RIGHT_X
                                );


                        /*
                         * Wariant pomijający przystanki:
                         * pion po lewej jest rysowany od granicy
                         * do granicy wiersza, dlatego odcinki łączą się.
                         */
                        if (i === e.u) {

                            if (startX === RIGHT_X) {

                                /*
                                 * Dokładnie jak w poprawnym fragmencie
                                 * przesłanym przez użytkownika:
                                 *
                                 * np. Wiertnicza:
                                 * 66,22 -> 22,66
                                 *
                                 * Linia może wyjść poza wysokość SVG,
                                 * ponieważ .node-wrapper svg ma
                                 * overflow: visible.
                                 */
                                drawCrossingLine(
                                    startX,
                                    nodeY,
                                    LEFT_X,
                                    rowHeight + ROW_HEIGHT / 2,
                                    isEdgeActive
                                );

                            } else {

                                if (
                                    e.extraTopAtStart === true
                                ) {

                                    /*
                                     * 311 -> Kamionka:
                                     *
                                     * Przekątna z Umińskiego wchodzi
                                     * dodatkowe 22 px w następny wiersz.
                                     * Dzięki temu większa przerwa jest
                                     * między Umińskiego i Rechniewskiego 02.
                                     */
                                    drawLine(
                                        startX,
                                        nodeY,
                                        LEFT_X,
                                        rowHeight + ROW_HEIGHT / 2,
                                        isEdgeActive
                                    );

                                } else {

                                    drawLine(
                                        startX,
                                        nodeY,
                                        LEFT_X,
                                        rowHeight,
                                        isEdgeActive
                                    );
                                }
                            }
                        }


                        if (i > e.u && i < e.v) {

                            /*
                             * Jeżeli wariant ma wrócić na PRAWĄ oś,
                             * potrzebujemy przekątnej 44 x 44 px.
                             *
                             * Ostatnie 22 px tej przekątnej zaczynamy
                             * jeszcze w poprzednim (powiększonym)
                             * wierszu. Dlatego pion po lewej kończymy
                             * 22 px przed jego dolną krawędzią.
                             */
                            /*
                             * Dla pomijanego, nieaktywnego przystanku
                             * większy odstęp jest NAD znacznikiem.
                             *
                             * Przykład przesłanego poprawnego fragmentu
                             * Sadyba 05:
                             *
                             * x=22, y=22 -> y=66.
                             *
                             * Nie skracamy też pionu przed przekątną.
                             * Odcinki mogą się lekko nakładać, co usuwa
                             * każdą widoczną szczelinę na łączeniu.
                             */
                            const poczatekPionu =
                                (
                                    e.extraTopAtStart === true &&
                                    i === e.firstSkippedMainIndex
                                )
                                    ? ROW_HEIGHT / 2
                                    : (
                                        e.useLegacySingleSkipGeometry &&
                                        isSkippedMainIntermediate &&
                                        !nodeActive
                                            ? ROW_HEIGHT / 2
                                            : 0
                                    );


                            /*
                             * OSTATNI POMIJANY PRZYSTANEK
                             *
                             * Jeżeli bieżący wiersz jest ostatnim
                             * pomijanym przystankiem tej konkretnej
                             * lewej krawędzi i zaraz po nim następuje
                             * punkt powrotu (e.v), kończymy pion 22 px
                             * wcześniej.
                             *
                             * Następna przekątna zaczyna się dokładnie
                             * w tym samym miejscu, więc nie ma ani
                             * przerwy, ani zbędnego pionowego ogonka.
                             *
                             * Ta reguła zastępuje wyjątki 126/131 i
                             * działa tak samo dla 110, 331 oraz innych
                             * identycznych układów.
                             */
                            let koniecPionu =
                                rowHeight;


                            /*
                             * Jeżeli wariant wraca na oś główną,
                             * lewy pion dochodzi do końca wiersza.
                             *
                             * Jeżeli po pominięciu przechodzi na prawą oś,
                             * przekątna LEFT_X -> RIGHT_X zaczyna się
                             * 22 px ponad następnym wierszem. Wtedy pion
                             * trzeba zakończyć dokładnie 22 px wcześniej.
                             *
                             * Nie ma tu już wyjątków dla 131, 170 ani
                             * żadnego konkretnego numeru linii.
                             */
                            if (
                                !e.useLegacySingleSkipGeometry &&
                                e.lastSkippedMainIndex === i &&
                                isSkippedMainIntermediate &&
                                isOnMainAxis[
                                    e.v
                                ] !== true
                            ) {

                                koniecPionu =
                                    rowHeight -
                                    ROW_HEIGHT / 2;
                            }


                            drawLine(
                                LEFT_X,
                                poczatekPionu,
                                LEFT_X,
                                koniecPionu,
                                isEdgeActive
                            );
                        }


                        if (i === e.v) {

                            if (endX === RIGHT_X) {

                                /*
                                 * LEFT_X -> RIGHT_X to 44 px poziomo.
                                 * Zaczynamy 22 px nad bieżącym wierszem
                                 * i kończymy w jego środku (22 px),
                                 * czyli mamy również 44 px pionowo.
                                 *
                                 * Przekątna zaczyna się 22 px
                                 * ponad bieżącym wierszem. Pion po lewej
                                 * jest celowo dociągnięty do końca
                                 * poprzedniego wiersza, więc elementy
                                 * nachodzą na siebie na łączeniu i nie
                                 * powstaje żadna szczelina.
                                 */
                                drawCrossingLine(
                                    LEFT_X,
                                    -ROW_HEIGHT / 2,
                                    endX,
                                    nodeY,
                                    isEdgeActive
                                );

                            } else {

                                /*
                                 * Powrót na oś główną ma już zwykłą
                                 * geometrię i zwykły odstęp.
                                 */
                                drawLine(
                                    LEFT_X,
                                    0,
                                    endX,
                                    nodeY,
                                    isEdgeActive
                                );
                            }
                        }
                    }
                }
            );

            const nodeX =
                String(
                    numerLinii || ""
                ).trim() === "338"
                    ? xDlaPunktu338(
                        i
                    )
                    : (
                        isOnMainAxis[i]
                            ? SPINE_X
                            : RIGHT_X
                    );


            const isBlackStart =
                isVariantStart;


            const strokeColor =
                !nodeActive
                    ? "#ccc"
                    : (
                        isBlackStart
                            ? "#000"
                            : "#e42313"
                    );


            const fillColor =
                !nodeActive
                    ? "#ccc"
                    : (
                        isBlackStart
                            ? "#000"
                            : "#e42313"
                    );


            let nodeSvg =
                "";


            if (
                shouldBeSquare
            ) {

                if (isNz) {

                    nodeSvg =
                        `<rect
                            x="${nodeX - 6.75}"
                            y="${nodeY - 6.75}"
                            width="13.5"
                            height="13.5"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    nodeSvg =
                        `<rect
                            x="${nodeX - 8}"
                            y="${nodeY - 8}"
                            width="16"
                            height="16"
                            fill="${fillColor}"
                            stroke="none"
                        />`;
                }


            } else {

                if (isNz) {

                    nodeSvg =
                        `<circle
                            cx="${nodeX}"
                            cy="${nodeY}"
                            r="6.75"
                            fill="#ffffff"
                            stroke="${strokeColor}"
                            stroke-width="2.5"
                        />`;

                } else {

                    nodeSvg =
                        `<circle
                            cx="${nodeX}"
                            cy="${nodeY}"
                            r="8"
                            fill="${fillColor}"
                            stroke="none"
                        />`;
                }
            }


            /*
             * Trzy osobne warstwy SVG:
             * 1. szare odcinki,
             * 2. czarne aktywne odcinki,
             * 3. znaczniki przystanków.
             *
             * Nie używamy białej obwódki ani maski.
             * Czarna kreska po prostu ma wyższy z-index niż szara,
             * również wtedy, gdy elementy z sąsiednich wierszy
             * nachodzą na siebie przez overflow: visible.
             */
            const svgHtml =
                `<svg
                    class="trasa-warstwa trasa-warstwa-szara"
                    width="${SVG_W}"
                    height="${rowHeight}"
                    aria-hidden="true"
                >
                    ${inactiveLines}
                </svg>
                <svg
                    class="trasa-warstwa trasa-warstwa-czarna"
                    width="${SVG_W}"
                    height="${rowHeight}"
                    aria-hidden="true"
                >
                    ${activeLines}
                    ${overlayLines}
                </svg>
                <svg
                    class="trasa-warstwa trasa-warstwa-punkty"
                    width="${SVG_W}"
                    height="${rowHeight}"
                    aria-hidden="true"
                >
                    ${nodeSvg}
                </svg>`;


            const nodeWrapper =
                document.createElement(
                    "div"
                );


            nodeWrapper.className =
                "node-wrapper";


            /*
             * Przystanki trasy podstawowej mają nazwę bliżej
             * głównej osi. Przystanki wariantowe zachowują
             * dotychczasowy odstęp od prawej osi.
             */
            const szerokoscOsiDlaWiersza =
                (
                    String(
                        numerLinii || ""
                    ).trim() === "338" &&
                    force338RightNodes.has(
                        i
                    )
                )
                    ? SVG_W
                    : (
                        isOnMainAxis[i]
                            ? SPINE_X + 16
                            : SVG_W
                    );


            nodeWrapper.style.width =
                szerokoscOsiDlaWiersza +
                "px";


            nodeWrapper.style.height =
                rowHeight +
                "px";


            nodeWrapper.innerHTML =
                svgHtml;


            const czasKolumna =
                document.createElement(
                    "div"
                );


            czasKolumna.className =
                "kolumna-czas-przejazdu";


            /*
             * Korekta pionowa elementów tekstowych w powiększonym
             * wierszu. Dzięki temu nazwa, numer i czas pozostają
             * dokładnie na wysokości kropki / kwadratu.
             */
            const przesuniecieTekstuY =
                isPowiekszonyWiersz
                    ? (
                        nodeY -
                        rowHeight / 2
                    )
                    : 0;


            if (
                przesuniecieTekstuY !== 0
            ) {

                czasKolumna.style.transform =
                    `translateY(${przesuniecieTekstuY}px)`;
            }


            if (
                i ===
                firstActiveIndex
            ) {

                czasKolumna.classList.add(
                    "pierwszy"
                );
            }


            const czasSumowany =
                czasySumowane[i];


            if (
                czasSumowany !== null &&
                czasSumowany !== undefined &&
                nodeActive
            ) {

                czasKolumna.textContent =
                    czasSumowany +
                    " min";

            } else {

                czasKolumna.textContent =
                    "";
            }


            const nazwa =
                document.createElement(
                    "div"
                );


            nazwa.className =
                "przystanek-nazwa";


            nazwa.textContent =
                p.nazwa ||
                "Przystanek";


            if (
                przesuniecieTekstuY !== 0
            ) {

                nazwa.style.transform =
                    `translateY(${przesuniecieTekstuY}px)`;
            }



            const nr =
                document.createElement(
                    "div"
                );


            nr.className =
                "przystanek-nr";


            nr.textContent =
                p.nr || "";


            if (
                przesuniecieTekstuY !== 0
            ) {

                nr.style.transform =
                    `translateY(${przesuniecieTekstuY}px)`;
            }


            btn.appendChild(
                czasKolumna
            );


            btn.appendChild(
                nodeWrapper
            );


            btn.appendChild(
                nazwa
            );


            btn.appendChild(
                nr
            );


            const kliknijPrzystanek =
                function(e) {

                    e.stopPropagation();

                    wybierzPrzystanek(
                        p,
                        i
                    );
                };


            const wlaczHoverPrzystanku =
                () => {
                    btn.classList.add(
                        "hover-przystanek"
                    );
                };


            const wylaczHoverPrzystanku =
                () => {
                    btn.classList.remove(
                        "hover-przystanek"
                    );
                };


            nazwa.addEventListener(
                "click",
                kliknijPrzystanek
            );

            nr.addEventListener(
                "click",
                kliknijPrzystanek
            );


            nazwa.addEventListener(
                "mouseenter",
                wlaczHoverPrzystanku
            );

            nazwa.addEventListener(
                "mouseleave",
                wylaczHoverPrzystanku
            );

            nr.addEventListener(
                "mouseenter",
                wlaczHoverPrzystanku
            );

            nr.addEventListener(
                "mouseleave",
                wylaczHoverPrzystanku
            );


            lista.appendChild(
                btn
            );
        }
    );


    kontener.appendChild(
        lista
    );
}


/* =========================================================
   WYBÓR PRZYSTANKU
   ========================================================= */

function wybierzPrzystanek(
    p,
    index
) {

    /*
     * Najpierw zapisujemy wybrany przystanek.
     */
    ustawWybranyPrzystanek(
        p,
        index
    );


    widokKursuAktywny =
        false;


    /*
     * Aktualizujemy URL bez przeładowania strony.
     */
    aktualizujHistorieURL(
        "idx:" + index
    );


    /*
     * WAŻNE:
     * Nie wracamy już po kliknięciu przystanku przez cały
     * pokazRozklad(), bo ta funkcja ponownie ustala stan widoku
     * i przy pierwszym kliknięciu mogła pozostawić listę
     * przystanków. Po odświeżeniu URL zawierał już "przystanek",
     * dlatego dopiero wtedy rozkład się pojawiał.
     *
     * Teraz od razu renderujemy rozkład klikniętego przystanku.
     */
    const rozklad =
        znajdzRozklad();


    if (
        rozklad &&
        Array.isArray(
            rozklad.kierunki
        ) &&
        rozklad.kierunki[
            aktualnyKierunek
        ]
    ) {

        const kierunek =
            rozklad.kierunki[
                aktualnyKierunek
            ];


        const kierunekDlaDaty =
            przygotujKierunekDlaDaty(
                kierunek,
                wybranaData
            );


        const przystankiPasazerskie =
            kierunekDlaDaty
                ? (
                    kierunekDlaDaty.przystanki ||
                    []
                  )
                : filtrujPrzystankiSpecjalneFWTP(
                    kierunek.przystanki ||
                    []
                  );


        let przystanekDoPokazania =
            null;


        /*
         * Najpierw próbujemy użyć dokładnego indeksu z listy.
         */
        if (
            Number.isInteger(
                Number(index)
            ) &&
            Number(index) >= 0 &&
            Number(index) <
                przystankiPasazerskie.length
        ) {

            przystanekDoPokazania =
                przystankiPasazerskie[
                    Number(index)
                ];
        }


        /*
         * Gdyby indeks pochodził z przefiltrowanej listy,
         * odnajdujemy przystanek po numerze i nazwie.
         */
        if (
            !przystanekDoPokazania ||
            normalizujTekst(
                przystanekDoPokazania.nazwa
            ) !==
                normalizujTekst(
                    p?.nazwa
                ) ||
            String(
                przystanekDoPokazania.nr || ""
            ).trim() !==
                String(
                    p?.nr || ""
                ).trim()
        ) {

            przystanekDoPokazania =
                przystankiPasazerskie.find(
                    przystanek =>
                        String(
                            przystanek.nr || ""
                        ).trim() ===
                            String(
                                p?.nr || ""
                            ).trim()
                        &&
                        normalizujTekst(
                            przystanek.nazwa
                        ) ===
                            normalizujTekst(
                                p?.nazwa
                            )
                ) ||
                p;
        }


        const prawidlowyIndex =
            przystankiPasazerskie.indexOf(
                przystanekDoPokazania
            );


        ustawWybranyPrzystanek(
            przystanekDoPokazania,
            prawidlowyIndex >= 0
                ? prawidlowyIndex
                : index
        );


        /*
         * Bezpośrednie wyświetlenie rozkładu.
         */
        pokazRozkladWybranegoPrzystanku(
            rozklad,
            przystanekDoPokazania
        );

    } else {

        /*
         * Awaryjnie zachowujemy dotychczasową ścieżkę.
         */
        pokazRozklad();
    }


    requestAnimationFrame(
        () => {

            window.scrollTo(
                0,
                0
            );


            requestAnimationFrame(
                () => {

                    window.scrollTo(
                        0,
                        0
                    );
                }
            );
        }
    );
}


/* =========================================================
   WIDOK PRZYSTANKU
   ========================================================= */

function pokazRozkladWybranegoPrzystanku(
    rozklad,
    przystanek
) {

    const kontener =
        document.getElementById(
            "przystanki"
        );


    document.querySelector(
        ".dni"
    ).style.display =
        "flex";


    ustawWidocznoscWyboruInnegoDnia();


    document.getElementById(
        "typRozkładu"
    ).style.display =
        "block";


    document.getElementById(
        "typRozkładu"
    ).textContent =
        rozklad.nazwa ||
        "Rozkład jazdy";


    document.getElementById(
        "warianty-pojemnik"
    ).style.display =
