<!DOCTYPE html>

<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rozkład jazdy</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

/* =========================================================
   GŁÓWNY KONTENER I NAGŁÓWKI
   ========================================================= */

.rozkład {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px;
}

/* =========================================================
   NAGŁÓWEK LINII
   ========================================================= */

.naglowek-linii {
    display: block;

    width: fit-content;
    min-width: 165px;

    margin-left: 10%;
    margin-right: 0;

    margin-bottom: 15px;

    background: white;

    border: 1px solid #ddd;

    border-radius: 0;

    padding: 0;

    box-sizing: border-box;

    text-align: center;

    overflow: hidden;
}


/* =========================================================
   NUMER LINII
   ========================================================= */

.numer-linii {
    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;

    height: 100px;

    margin: 0;
    padding: 0 22px;

    box-sizing: border-box;

    font-family:
        "Barlow Semi Condensed",
        sans-serif;

    font-size: 80px;

    font-weight: 700;

    line-height: 1;

    text-align: center;

    color: #222;

    /* WAŻNE */
    transform: none;
}


/* =========================================================
   FIOLETOWY PASEK POD NUMEREM
   ========================================================= */

.naglowek-linii::after {
    content: "";

    display: block;

    width: 100%;

    height: 16px;

    background: #990066;
}


/* =========================================================
   TRAMWAJ
   ========================================================= */

.naglowek-linii.tramwaj::after {
    background: #e30613;
}


/* =========================================================
   UKRYCIE TRASY
   ========================================================= */

.trasa {
    display: none;
}


/* =========================================================
   TRAMWAJ
   ========================================================= */

.naglowek-linii.tramwaj {
    border-bottom-color: #e30613;
}

/* =========================================================
   KIERUNKI I DNI
   ========================================================= */

.kierunki,
.dni {
    display: flex;
    gap: 10px;
    width: 80%;
    margin-left: auto;
    margin-right: auto;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.kierunek-btn,
.dzien-btn {
    flex: 1;
    padding: 14px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
     font-family:
        "Barlow Semi Condensed",
        sans-serif;
   font-size: 17px;
    font-weight: 700;
    color: #222;
    text-align: center;
    transition: 0.15s;
    box-sizing: border-box;
}

.kierunek-btn:hover,
.dzien-btn:hover {
    color: #d61c12;
    border-color: #d61c12;
    background: #fff;
}

.kierunek-btn.aktywny,
.dzien-btn.aktywny {
   background: #d61c12;
    color: white;
    border-color: #d61c12;
}
.kierunek-btn.aktywny:hover {
    background: #d61c12;

    color: white;

    border-color: #d61c12;
}

/* =========================================================
   WARIANTY
   ========================================================= */

.warianty-pojemnik {
    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #fff;

    border-top: 2px solid #ccc;
    border-bottom: 2px solid #ccc;

    width: 80%;

    margin-left: auto;
    margin-right: auto;

    padding: 10px 10px 10px 15px;

    margin-bottom: 0;

    box-sizing: border-box;
}

.warianty-info {
    font-size: 15px;
    color: #1d1d1b;
    padding-left: 10px;
}

.warianty-info strong {
    font-weight: 700;
}

.warianty-przyciski {
    display: flex;
    gap: 2px;
    padding-right: 10px;
}

.wariant-btn {
    padding: 4px 12px;

    font-size: 22px;
    font-weight: 900;

    color: #706f6f;

    background: transparent;
    border: none;

    border-bottom: 4px solid transparent;

    cursor: pointer;

    transition: 0.15s;

    font-family: inherit;

    text-transform: uppercase;
}

.wariant-btn:hover {
    color: #d61c12;
}

.wariant-btn.aktywny {
    color: #d61c12;
    border-bottom-color: #d61c12;
}


/* =========================================================
   KALENDARZ / ŁADOWANIE / BŁĘDY
   ========================================================= */

.kalendarz {
    display: none;

    background: white;

    border: 1px solid #ddd;
    border-radius: 6px;

    padding: 15px;
    margin-bottom: 15px;
}

.kalendarz input {

    border-radius: 5px;
}

.typ-rozkładu {
    background: #f7f7f7;

    width: 80%;

    margin-left: auto;
    margin-right: auto;

    padding: 12px 15px;

    margin-bottom: 15px;

    border-radius: 6px;

    font-size: 14px;
    color: #555;

    box-sizing: border-box;
}

.brak-godzin {
    padding: 15px;

    color: #777;

    font-size: 14px;
}

.loading {
    background: white;

    border: 1px solid #ddd;
    border-radius: 8px;

    padding: 30px;

    text-align: center;

    color: #666;
}

.blad {
    background: #fff4f4;

    border-radius: 8px;

    padding: 20px;

    line-height: 1.6;
}

.blad strong {

}

.brak-danych {

    border: 1px solid #ddd;

}


/* =========================================================
   ROZKŁAD JAZDY
   ========================================================= */

.przystanek {

}

.godziny {

}

.wiersz-godziny {

    grid-template-columns:

    grid-auto-columns: 46px;

}

.kolumna-godzina {

    font-size: 16px;

    font-weight: 600;

    border-right: 1px solid #444;

.kolumna-minuta {

<script>

/* =========================================================
   FWTP – ROZKŁAD JAZDY
   ========================================================= */


/* =========================================================
   ZMIENNE
   ========================================================= */

let daneLinii = null;

let numerLinii = null;

let aktualnyKierunek = 0;

let aktualnyDzien = "dzisiaj";

let wybranaData = new Date();

let wybranyPrzystanek = null;



/* =========================================================
   ODCZYT NUMERU LINII Z URL
   ========================================================= */

const parametry =
    new URLSearchParams(
        window.location.search
    );


numerLinii =
    parametry.get("linia");


if (!numerLinii) {

    pokazBlad(
        "Nie podano numeru linii.",
        "Użyj adresu w rodzaju: ?linia=102"
    );

}
else {

    document.getElementById(
        "numerLinii"
    ).textContent =
        numerLinii;

    pobierzDane();

}



/* =========================================================
   USUWANIE WADLIWEGO POLA „godziny”
   ========================================================= */

function usunPoleGodziny(tekst) {

    const pozycja =
        tekst.search(
            /"godziny"\s*:\s*\[/
        );


    if (pozycja === -1) {

        return tekst;

    }


    const poczatekTablicy =
        tekst.indexOf(
            "[",
            pozycja
        );


    if (poczatekTablicy === -1) {

        return tekst;

    }


    let poziom = 0;

    let wStringu = false;

    let ucieczka = false;

    let koniecTablicy = -1;


    for (
        let i = poczatekTablicy;
        i < tekst.length;
        i++
    ) {

        const znak = tekst[i];


        if (ucieczka) {

            ucieczka = false;

            continue;

        }


        if (
            znak === "\\"
            &&
            wStringu
        ) {

            ucieczka = true;

            continue;

        }


        if (
            znak === '"'
        ) {

            wStringu =
                !wStringu;

            continue;

        }


        if (wStringu) {

            continue;

        }


        if (znak === "[") {

            poziom++;

        }


        if (znak === "]") {

            poziom--;

            if (poziom === 0) {

                koniecTablicy = i;

                break;

            }

        }

    }


    if (
        koniecTablicy === -1
    ) {

        return tekst;

    }


    let poczatek =
        pozycja;

    let koniec =
        koniecTablicy + 1;


    while (
        koniec < tekst.length
        &&
        /\s/.test(
            tekst[koniec]
        )
    ) {

        koniec++;

    }


    if (
        tekst[koniec] === ","
    ) {

        koniec++;

    }


    let wynik =
        tekst.substring(
            0,
            poczatek
        )
        +
        tekst.substring(
            koniec
        );


    wynik =
        wynik.replace(
            /,\s*,/g,
            ","
        );


    wynik =
        wynik.replace(
            /,\s*}/g,
            "}"
        );


    return wynik;

}



/* =========================================================
   POBIERANIE JSON
   ========================================================= */

async function pobierzDane() {

    const adres =
        "../dane/" +
        encodeURIComponent(
            numerLinii
        ) +
        ".json";


    console.log(
        "FWTP – pobieram:",
        adres
    );


    try {

        const odpowiedz =
            await fetch(
                adres,
                {
                    cache: "no-cache"
                }
            );


        if (!odpowiedz.ok) {

            throw new Error(
                "HTTP " +
                odpowiedz.status +
                " – nie znaleziono pliku " +
                numerLinii +
                ".json"
            );

        }


        let tekst =
            await odpowiedz.text();


        if (
            !tekst.trim()
        ) {

            throw new Error(
                "Plik JSON jest pusty."
            );

        }


        try {

            daneLinii =
                JSON.parse(
                    tekst
                );

        }
        catch (pierwszyBlad) {

            console.warn(
                "FWTP – zwykły JSON.parse nie powiódł się."
            );


            const oczyszczonyJSON =
                usunPoleGodziny(
                    tekst
                );


            try {

                daneLinii =
                    JSON.parse(
                        oczyszczonyJSON
                    );

            }
            catch (drugiBlad) {

                console.error(
                    "Oryginalny JSON:",
                    tekst
                );

                console.error(
                    "Oczyszczony JSON:",
                    oczyszczonyJSON
                );


                throw new Error(
                    "JSON jest nieprawidłowy. " +
                    "Błąd: " +
                    drugiBlad.message
                );

            }

        }


        if (
            !daneLinii ||
            typeof daneLinii !== "object"
        ) {

            throw new Error(
                "JSON nie zawiera obiektu danych."
            );

        }


        if (
            !Array.isArray(
                daneLinii.rozkłady
            )
        ) {

            throw new Error(
                "JSON nie zawiera tablicy „rozkłady”."
            );

        }


        console.log(
            "FWTP – JSON załadowany poprawnie:",
            daneLinii
        );


        uruchomStrone();


    }
    catch (blad) {

        console.error(
            "FWTP – BŁĄD:",
            blad
        );


        pokazBlad(
            "Nie udało się załadować linii " +
            numerLinii +
            ".",
            blad.message
        );

    }

}



/* =========================================================
   URUCHOMIENIE STRONY
   ========================================================= */

function uruchomStrone() {

    document.getElementById("numerLinii").textContent =
        daneLinii.linia || numerLinii;


    document.getElementById("trasa").textContent =
        daneLinii.trasa ||
        ("Rozkład jazdy linii " + numerLinii);


    wybranaData = new Date();

    aktualnyKierunek = 0;

    wybranyPrzystanek = null;


    const parametrKierunku =
        parametry.get("kierunek");


    if (
        parametrKierunku !== null &&
        parametrKierunku !== ""
    ) {

        const liczbaKierunku =
            Number(parametrKierunku);


        if (
            Number.isInteger(liczbaKierunku) &&
            liczbaKierunku >= 0
        ) {

            aktualnyKierunek =
                liczbaKierunku;

        }

    }


    const parametrPrzystanku =
        parametry.get("przystanek");


    if (parametrPrzystanku) {

        const rozklad =
            znajdzRozklad();


        if (
            rozklad &&
            Array.isArray(rozklad.kierunki)
        ) {

            const kierunek =
                rozklad.kierunki[
                    aktualnyKierunek
                ];


            if (
                kierunek &&
                Array.isArray(kierunek.przystanki)
            ) {

                let znaleziony =
                    kierunek.przystanki.find(
                        function(przystanek) {

                            return String(
                                przystanek.nr ?? ""
                            ).trim()
                            ===
                            String(
                                parametrPrzystanku
                            ).trim();

                        }
                    );


                if (!znaleziony) {

                    const indeks =
                        Number(parametrPrzystanku);


                    if (
                        Number.isInteger(indeks) &&
                        indeks >= 0 &&
                        indeks < kierunek.przystanki.length
                    ) {

                        znaleziony =
                            kierunek.przystanki[indeks];

                    }

                }


                if (znaleziony) {

                    wybranyPrzystanek =
                        znaleziony;

                }

            }

        }

    }


    pokazRozklad();

}



/* =========================================================
   NORMALIZACJA TEKSTU
   ========================================================= */

function normalizujTekst(tekst) {

    return String(
        tekst || ""
    )
    .toLowerCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    );

}



/* =========================================================
   TYP DNIA
   ========================================================= */

function okreslTypDnia(data) {

    const dzien =
        data.getDay();


    if (dzien === 6) {

        return "sobota";

    }


    if (dzien === 0) {

        return "niedziela";

    }


    return "roboczy";

}



/* =========================================================
   ZNAJDŹ ODPOWIEDNI ROZKŁAD
   ========================================================= */

function znajdzRozklad() {

    const rozklady =
        daneLinii.rozkłady || [];


    if (
        rozklady.length === 0
    ) {

        return null;

    }


    const typDnia =
        okreslTypDnia(
            wybranaData
        );


    if (
        typDnia === "sobota"
    ) {

        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                nazwa.includes(
                    "sobot"
                )
            ) {

                return rozklad;

            }

        }

    }


    if (
        typDnia === "niedziela"
    ) {

        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                nazwa.includes(
                    "niedziel"
                )
            ) {

                return rozklad;

            }

        }


        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                (
                    nazwa.includes(
                        "sobot"
                    )
                    &&
                    nazwa.includes(
                        "niedziel"
                    )
                )
                ||
                nazwa.includes(
                    "swieta"
                )
                ||
                nazwa.includes(
                    "swiat"
                )
            ) {

                return rozklad;

            }

        }

    }


    if (
        typDnia === "roboczy"
    ) {

        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                nazwa.includes(
                    "poniedzialku do piatku"
                )
                ||
                nazwa.includes(
                    "poniedzialku"
                )
                ||
                nazwa.includes(
                    "poniedzialek"
                )
                ||
                (
                    nazwa.includes(
                        "piat"
                    )
                    &&
                    !nazwa.includes(
                        "sobot"
                    )
                )
            ) {

                return rozklad;

            }

        }

    }


    return rozklady[0];

}



/* =========================================================
   GENEROWANIE KIERUNKÓW
   ========================================================= */

function generujKierunki() {

    const kontener =
        document.getElementById(
            "kierunki"
        );


    kontener.innerHTML = "";


    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !Array.isArray(
            rozklad.kierunki
        )
    ) {

        return;

    }


    rozklad.kierunki.forEach(
        function(
            kierunek,
            index
        ) {

            const przycisk =
                document.createElement(
                    "button"
                );


            przycisk.className =
                "kierunek-btn";


            if (
                index ===
                aktualnyKierunek
            ) {

                przycisk.classList.add(
                    "aktywny"
                );

            }


            const przystanki =
                Array.isArray(
                    kierunek.przystanki
                )
                    ?
                    kierunek.przystanki
                    :
                    [];


            let nazwaKierunku = "";


            if (
                przystanki.length > 0
            ) {

                const ostatni =
                    przystanki[
                        przystanki.length - 1
                    ];


                nazwaKierunku =
                    ostatni.nazwa ||
                    "";

            }


            if (
                !nazwaKierunku
            ) {

                nazwaKierunku =
                    "Kierunek " +
                    (
                        index + 1
                    );

            }


            przycisk.textContent =
                nazwaKierunku;


            przycisk.onclick =
                function() {

                    zmienKierunek(
                        index
                    );

                };


            kontener.appendChild(
                przycisk
            );

        }
    );

}



/* =========================================================
   ZMIANA KIERUNKU
   ========================================================= */

function zmienKierunek(index) {

    aktualnyKierunek = index;

    wybranyPrzystanek = null;


    const url =
        new URL(window.location.href);


    url.searchParams.set(
        "kierunek",
        String(index)
    );


    url.searchParams.delete(
        "przystanek"
    );


    window.history.pushState(
        {},
        "",
        url
    );


    pokazRozklad();

}



/* =========================================================
   WYBÓR DNIA
   ========================================================= */

function wybierzDzien(dzien) {

    aktualnyDzien =
        dzien;


    document
        .querySelectorAll(
            ".dzien-btn"
        )
        .forEach(
            function(przycisk) {

                przycisk.classList.remove(
                    "aktywny"
                );

            }
        );


    const kalendarz =
        document.getElementById(
            "kalendarz"
        );


    kalendarz.style.display =
        "none";


    if (
        dzien === "dzisiaj"
    ) {

        document.getElementById(
            "dzisiajBtn"
        ).classList.add(
            "aktywny"
        );


        wybranaData =
            new Date();

    }


    if (
        dzien === "jutro"
    ) {

        document.getElementById(
            "jutroBtn"
        ).classList.add(
            "aktywny"
        );


        wybranaData =
            new Date();


        wybranaData.setDate(
            wybranaData.getDate() + 1
        );

    }


    if (
        dzien === "kalendarz"
    ) {

        document.getElementById(
            "kalendarzBtn"
        ).classList.add(
            "aktywny"
        );


        kalendarz.style.display =
            "block";


        document.getElementById(
            "wybranaData"
        ).value =
            formatujDateInput(
                wybranaData
            );

    }


    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !rozklad.kierunki ||
        !rozklad.kierunki[
            aktualnyKierunek
        ]
    ) {

        aktualnyKierunek = 0;

    }


    pokazRozklad();

}



/* =========================================================
   KALENDARZ
   ========================================================= */

document
    .getElementById(
        "wybranaData"
    )
    .addEventListener(
        "change",
        function() {

            if (
                !this.value
            ) {

                return;

            }


            const czesci =
                this.value.split(
                    "-"
                );


            wybranaData =
                new Date(
                    Number(
                        czesci[0]
                    ),
                    Number(
                        czesci[1]
                    ) - 1,
                    Number(
                        czesci[2]
                    )
                );


            const rozklad =
                znajdzRozklad();


            if (
                !rozklad ||
                !rozklad.kierunki ||
                !rozklad.kierunki[
                    aktualnyKierunek
                ]
            ) {

                aktualnyKierunek = 0;

            }


            pokazRozklad();

        }
    );



/* =========================================================
   POBIERANIE DANYCH WARIANTU
   ========================================================= */

function pobierzDaneWariantu(kurs) {

    if (
        !kurs ||
        typeof kurs !== "object"
    ) {

        return {
            litera: "",
            opis: ""
        };

    }


    let wariant =
        kurs.wariant;


    let litera = "";

    let opis = "";



    /* =====================================================
       WARIANT JAKO OBIEKT
       ===================================================== */

    if (
        wariant &&
        typeof wariant === "object"
    ) {

        litera =
            wariant.litera ||
            wariant.nazwa ||
            wariant.symbol ||
            wariant.wariant ||
            wariant.oznaczenie ||
            "";


        opis =
            wariant.opis ||
            wariant.tekst ||
            wariant.opisWariantu ||
            wariant.description ||
            "";

    }



    /* =====================================================
       WARIANT JAKO TEKST
       ===================================================== */

    else {

        litera =
            String(
                wariant || ""
            ).trim();

    }


    litera =
        String(
            litera
        ).trim();



    /* =====================================================
       SZUKANIE OPISU W AKTUALNYM ROZKŁADZIE
       ===================================================== */

    if (
        litera &&
        daneLinii &&
        Array.isArray(
            daneLinii.rozkłady
        )
    ) {

        const rozklad =
            znajdzRozklad();


        if (
            rozklad &&
            Array.isArray(
                rozklad.warianty
            )
        ) {

            const znaleziony =
                rozklad.warianty.find(
                    function(w) {

                        if (
                            !w ||
                            typeof w !== "object"
                        ) {

                            return false;

                        }


                        const literaWariantu =
                            String(
                                w.litera ||
                                w.nazwa ||
                                w.symbol ||
                                w.wariant ||
                                w.oznaczenie ||
                                ""
                            ).trim();


                        return (
                            literaWariantu
                                .toUpperCase()
                            ===
                            litera
                                .toUpperCase()
                        );

                    }
                );


            if (
                znaleziony
            ) {

                opis =
                    znaleziony.opis ||
                    znaleziony.tekst ||
                    znaleziony.opisWariantu ||
                    znaleziony.description ||
                    znaleziony.description_pl ||
                    "";

            }

        }

    }



    /* =====================================================
       DODATKOWE POLA KURSU
       ===================================================== */

    if (!opis) {

        opis =
            kurs.wariantOpis ||
            kurs.opisWariantu ||
            kurs.wariant_Opis ||
            kurs.opis ||
            kurs.uwagi ||
            kurs.uwaga ||
            "";

    }


    return {

        litera:
            String(
                litera
            ).trim(),

        opis:
            String(
                opis
            ).trim()

    };

}



/* =========================================================
   POBIERANIE SAMEJ LITERKI
   ========================================================= */

function pobierzWariant(kurs) {

    const dane =
        pobierzDaneWariantu(
            kurs
        );


    return dane.litera;

}



/* =========================================================
   WARIANT A – TRASA PODSTAWOWA
   A pozostaje w danych i na liście przystanków,
   ale nie jest pokazywany w rozkładzie jazdy.
   ========================================================= */

function czyWariantPodstawowy(litera) {

    const literaTekst =
        String(
            litera || ""
        )
        .trim()
        .toUpperCase();


    if (!literaTekst) {

        return false;

    }


    const rozklad =
        znajdzRozklad();


    if (
        rozklad &&
        Array.isArray(
            rozklad.warianty
        )
    ) {

        const znaleziony =
            rozklad.warianty.find(
                function(w) {

                    if (
                        !w ||
                        typeof w !== "object"
                    ) {

                        return false;

                    }


                    const literaWariantu =
                        String(
                            w.litera ||
                            w.nazwa ||
                            w.symbol ||
                            w.wariant ||
                            w.oznaczenie ||
                            ""
                        )
                        .trim()
                        .toUpperCase();


                    return (
                        literaWariantu ===
                        literaTekst
                    );

                }
            );


        if (znaleziony) {

            const opis =
                String(
                    znaleziony.opis ||
                    znaleziony.tekst ||
                    znaleziony.opisWariantu ||
                    znaleziony.description ||
                    znaleziony.description_pl ||
                    ""
                )
                .trim()
                .toLowerCase();


            return opis ===
                "trasa podstawowa";

        }

    }


    /* Starszy JSON bez opisu wariantu:
       A traktujemy jako podstawowy. */

    return literaTekst === "A";

}



/* =========================================================
   WARIANT DO WYŚWIETLENIA
   ========================================================= */

function pobierzWariantDoWyswietlenia(kurs) {

    const wariant =
        pobierzWariant(kurs);


    if (
        czyWariantPodstawowy(
            wariant
        )
    ) {

        return "";

    }


    return wariant;

}



/* =========================================================
   ZBIERANIE WARIANTÓW DLA PRZYSTANKU
   ========================================================= */

function zbierzWariantyPrzystanku(przystanek) {

    const warianty =
        new Map();


    if (
        !przystanek ||
        !Array.isArray(
            przystanek.kursy
        )
    ) {

        return warianty;

    }


    przystanek.kursy.forEach(
        function(kurs) {

            const dane =
                pobierzDaneWariantu(
                    kurs
                );


            /*
             * WAŻNE:
             * Do legendy trafiają tylko warianty,
             * które są rzeczywiście wyświetlane
             * przy minutach.
             *
             * Jeżeli A jest ukryte jako trasa
             * podstawowa, nie trafia do legendy.
             */

            const wariantDoWyswietlenia =
                pobierzWariantDoWyswietlenia(
                    kurs
                );


            if (
                !dane.litera ||
                !wariantDoWyswietlenia
            ) {

                return;

            }


            if (
                !warianty.has(
                    dane.litera
                )
            ) {

                warianty.set(
                    dane.litera,
                    dane.opis
                );

            }
            else {

                if (
                    !warianty.get(
                        dane.litera
                    )
                    &&
                    dane.opis
                ) {

                    warianty.set(
                        dane.litera,
                        dane.opis
                    );

                }

            }

        }
    );


    return warianty;

}



/* =========================================================
   TWORZENIE LEGENDY
   ========================================================= */

function utworzLegendePrzystanku(przystanek) {

    const warianty =
        zbierzWariantyPrzystanku(
            przystanek
        );


    if (
        warianty.size === 0
    ) {

        return null;

    }


    const legenda =
        document.createElement(
            "div"
        );


    legenda.className =
        "legenda-wariantow";


    const lista =
        document.createElement(
            "div"
        );


    lista.className =
        "legenda-lista";


    warianty.forEach(
        function(
            opis,
            litera
        ) {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "legenda-element";


            const symbol =
                document.createElement(
                    "span"
                );


            symbol.className =
                "legenda-litera";


            symbol.textContent =
                litera;


            element.appendChild(
                symbol
            );


            if (
                opis
            ) {

                const opisElement =
                    document.createElement(
                        "span"
                    );


                opisElement.className =
                    "legenda-opis";


                opisElement.textContent =
                    opis;


                element.appendChild(
                    opisElement
                );

            }


            lista.appendChild(
                element
            );

        }
    );


    legenda.appendChild(
        lista
    );


    return legenda;

}



/* =========================================================
   GŁÓWNE WYŚWIETLANIE ROZKŁADU
   ========================================================= */

function pokazRozklad() {

    if (!daneLinii) {

        return;

    }


    const rozklad =
        znajdzRozklad();


    const kontener =
        document.getElementById(
            "przystanki"
        );


    const typ =
        document.getElementById(
            "typRozkladu"
        );


    const powrot =
        document.getElementById(
            "powrotPrzystanki"
        );


    if (!rozklad) {

        typ.style.display = "block";

        typ.textContent =
            "Brak rozkładu";

        powrot.style.display =
            "none";


        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak danych rozkładu.' +
            '</div>';


        return;

    }


    const kierunki =
        rozklad.kierunki || [];


    if (kierunki.length === 0) {

        typ.style.display = "block";

        typ.textContent =
            "Brak kierunków";

        powrot.style.display =
            "none";


        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Ten rozkład nie zawiera kierunków.' +
            '</div>';


        return;

    }


    if (
        aktualnyKierunek < 0 ||
        aktualnyKierunek >= kierunki.length
    ) {

        aktualnyKierunek = 0;

    }


    generujKierunki();


    if (!wybranyPrzystanek) {

        pokazListePrzystankow(
            rozklad
        );

        return;

    }


    const kierunek =
        kierunki[
            aktualnyKierunek
        ];


    const przystanki =
        Array.isArray(
            kierunek.przystanki
        )
            ?
            kierunek.przystanki
            :
            [];


    let aktualnyPrzystanek = null;


    if (
        wybranyPrzystanek.nr !== undefined &&
        wybranyPrzystanek.nr !== null
    ) {

        aktualnyPrzystanek =
            przystanki.find(
                function(przystanek) {

                    return String(
                        przystanek.nr ?? ""
                    ).trim()
                    ===
                    String(
                        wybranyPrzystanek.nr
                    ).trim();

                }
            );

    }


    if (!aktualnyPrzystanek) {

        aktualnyPrzystanek =
            przystanki.find(
                function(przystanek) {

                    return (
                        String(
                            przystanek.nazwa ?? ""
                        ).trim()
                        ===
                        String(
                            wybranyPrzystanek.nazwa ?? ""
                        ).trim()
                        &&
                        String(
                            przystanek.lp ?? ""
                        ).trim()
                        ===
                        String(
                            wybranyPrzystanek.lp ?? ""
                        ).trim()
                    );

                }
            );

    }


    if (!aktualnyPrzystanek) {

        wybranyPrzystanek = null;

        pokazListePrzystankow(
            rozklad
        );

        return;

    }


    wybranyPrzystanek =
        aktualnyPrzystanek;


    pokazRozkladWybranegoPrzystanku(
        rozklad,
        aktualnyPrzystanek
    );

}



/* =========================================================
   LISTA PRZYSTANKÓW
   ========================================================= */

function pokazListePrzystankow(
    rozklad = null
) {

    if (!rozklad) {

        rozklad =
            znajdzRozklad();

    }


    const kontener =
        document.getElementById(
            "przystanki"
        );


    const typ =
        document.getElementById(
            "typRozkladu"
        );


    const powrot =
        document.getElementById(
            "powrotPrzystanki"
        );


    if (
        !rozklad ||
        !Array.isArray(
            rozklad.kierunki
        )
    ) {

        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak danych przystanków.' +
            '</div>';

        return;

    }


    const kierunek =
        rozklad.kierunki[
            aktualnyKierunek
        ];


    if (!kierunek) {

        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak wybranego kierunku.' +
            '</div>';

        return;

    }


    const przystanki =
        Array.isArray(
            kierunek.przystanki
        )
            ?
            kierunek.przystanki
            :
            [];


    wybranyPrzystanek = null;


    powrot.style.display =
        "none";


    const dni =
        document.querySelector(
            ".dni"
        );


    if (dni) {

        dni.style.display =
            "none";

    }


    const kalendarz =
        document.getElementById(
            "kalendarz"
        );


    if (kalendarz) {

        kalendarz.style.display =
            "none";

    }


    typ.style.display =
        "block";


    typ.textContent =
        "Wybierz przystanek";


    kontener.innerHTML = "";


    const lista =
        document.createElement(
            "div"
        );


    lista.className =
        "lista-przystankow";


    if (przystanki.length === 0) {

        lista.innerHTML =
            '<div class="brak-danych">' +
            'Brak przystanków w tym kierunku.' +
            '</div>';


        kontener.appendChild(
            lista
        );


        return;

    }


    przystanki.forEach(
        function(
            przystanek,
            index
        ) {

            const przycisk =
                document.createElement(
                    "button"
                );


            przycisk.type =
                "button";


            przycisk.className =
                "przystanek-btn";


            const lp =
                document.createElement(
                    "span"
                );


            lp.className =
                "lp";


            lp.textContent =
                przystanek.lp ||
                (index + 1);


            const nazwa =
                document.createElement(
                    "span"
                );


            nazwa.className =
                "przystanek-nazwa";


            nazwa.textContent =
                przystanek.nazwa ||
                "Przystanek";


            const nr =
                document.createElement(
                    "span"
                );


            nr.className =
                "przystanek-nr";


            if (
                przystanek.nr !== undefined &&
                przystanek.nr !== null &&
                String(
                    przystanek.nr
                ).trim() !== ""
            ) {

                nr.textContent =
                    "nr " +
                    przystanek.nr;

            }


            przycisk.appendChild(
                lp
            );


            przycisk.appendChild(
                nazwa
            );


            przycisk.appendChild(
                nr
            );


            przycisk.onclick =
                function() {

                    wybierzPrzystanek(
                        przystanek,
                        index
                    );

                };


            lista.appendChild(
                przycisk
            );

        }
    );


    kontener.appendChild(
        lista
    );

}



/* =========================================================
   WYBÓR PRZYSTANKU
   ========================================================= */

function wybierzPrzystanek(
    przystanek,
    index
) {

    if (!przystanek) {

        return;

    }


    wybranyPrzystanek =
        przystanek;


    const url =
        new URL(
            window.location.href
        );


    url.searchParams.set(
        "kierunek",
        String(
            aktualnyKierunek
        )
    );


    if (
        przystanek.nr !== undefined &&
        przystanek.nr !== null &&
        String(
            przystanek.nr
        ).trim() !== ""
    ) {

        url.searchParams.set(
            "przystanek",
            String(
                przystanek.nr
            )
        );

    }
    else {

        url.searchParams.set(
            "przystanek",
            String(index)
        );

    }


    window.history.pushState(
        {},
        "",
        url
    );


    pokazRozklad();

}



/* =========================================================
   POWRÓT DO LISTY
   ========================================================= */

function pokazListePrzystankowZPowrotem() {

    wybranyPrzystanek = null;


    const url =
        new URL(
            window.location.href
        );


    url.searchParams.delete(
        "przystanek"
    );


    window.history.pushState(
        {},
        "",
        url
    );


    pokazRozklad();

}



/* =========================================================
   ROZKŁAD WYBRANEGO PRZYSTANKU
   ========================================================= */

function pokazRozkladWybranegoPrzystanku(
    rozklad,
    przystanek
) {

    const kontener =
        document.getElementById(
            "przystanki"
        );


    const typ =
        document.getElementById(
            "typRozkladu"
        );


    const powrot =
        document.getElementById(
            "powrotPrzystanki"
        );


    powrot.style.display =
        "block";


    const dni =
        document.querySelector(
            ".dni"
        );


    if (dni) {

        dni.style.display =
            "flex";

    }


    const kalendarz =
        document.getElementById(
            "kalendarz"
        );


    if (
        aktualnyDzien !==
        "kalendarz"
    ) {

        kalendarz.style.display =
            "none";

    }


    typ.style.display =
        "block";


    typ.textContent =
        rozklad.nazwa ||
        "Rozkład jazdy";


    kontener.innerHTML =
        "";


    const naglowek =
        document.createElement(
            "div"
        );


    naglowek.className =
        "naglowek-przystanku-widok";


    const nazwa =
        document.createElement(
            "div"
        );


    nazwa.className =
        "nazwa";


    nazwa.textContent =
        przystanek.nazwa ||
        "Przystanek";


    const nr =
        document.createElement(
            "div"
        );


    nr.className =
        "numer";


    if (
        przystanek.nr !== undefined &&
        przystanek.nr !== null &&
        String(
            przystanek.nr
        ).trim() !== ""
    ) {

        nr.textContent =
            "nr " +
            przystanek.nr;

    }


    naglowek.appendChild(
        nazwa
    );


    naglowek.appendChild(
        nr
    );


    kontener.appendChild(
        naglowek
    );


    const blok =
        document.createElement(
            "div"
        );


    blok.className =
        "przystanek";


    const godziny =
        document.createElement(
            "div"
        );


    godziny.className =
        "godziny";


    const kursy =
        Array.isArray(
            przystanek.kursy
        )
            ?
            przystanek.kursy
            :
            [];


    if (kursy.length === 0) {

        godziny.innerHTML =
            '<div class="brak-godzin">' +
            'Brak odjazdów' +
            '</div>';

    }
    else {

        let aktualnaGodzina =
            null;


        let aktualnyWiersz =
            null;


        kursy.forEach(
            function(kurs) {

                if (
                    !kurs ||
                    typeof kurs !== "object"
                ) {

                    return;

                }


                const czas =
                    String(
                        kurs.czas || ""
                    ).trim();


                const dopasowanie =
                    czas.match(
                        /^(\d{1,2}):(\d{2})$/
                    );


                if (!dopasowanie) {

                    return;

                }


                const godzina =
                    Number(
                        dopasowanie[1]
                    );


                const minuta =
                    dopasowanie[2];


                if (
                    !Number.isFinite(
                        godzina
                    )
                ) {

                    return;

                }


                if (
                    aktualnaGodzina === null ||
                    aktualnaGodzina !== godzina
                ) {

                    aktualnaGodzina =
                        godzina;


                    aktualnyWiersz =
                        document.createElement(
                            "div"
                        );


                    aktualnyWiersz.className =
                        "wiersz-godziny";


                    const kolumnaGodziny =
                        document.createElement(
                            "div"
                        );


                    kolumnaGodziny.className =
                        "kolumna-godzina";


                    kolumnaGodziny.textContent =
                        String(
                            godzina
                        ).padStart(
                            2,
                            "0"
                        );


                    aktualnyWiersz.appendChild(
                        kolumnaGodziny
                    );


                    godziny.appendChild(
                        aktualnyWiersz
                    );

                }


                const kolumna =
                    document.createElement(
                        "div"
                    );


                kolumna.className =
                    "kolumna-minuta";


                const minutaZWariantem =
                    document.createElement(
                        "span"
                    );


                minutaZWariantem.className =
                    "minuta-z-wariantem";


                const minutaElement =
                    document.createElement(
                        "span"
                    );


                minutaElement.className =
                    "minuta";


                minutaElement.textContent =
                    minuta;


                minutaZWariantem.appendChild(
                    minutaElement
                );


                /*
                 * TUTAJ DECYDUJEMY,
                 * CZY LITERKA MA BYĆ WIDOCZNA.
                 *
                 * A jako trasa podstawowa
                 * nie jest pokazywane.
                 *
                 * B, C, D itd. są pokazywane.
                 */

                const wariant =
                    pobierzWariantDoWyswietlenia(
                        kurs
                    );


                if (wariant) {

                    const wariantElement =
                        document.createElement(
                            "span"
                        );


                    wariantElement.className =
                        "wariant-minuty";


                    wariantElement.textContent =
                        wariant;


                    minutaZWariantem.appendChild(
                        wariantElement
                    );

                }


                kolumna.appendChild(
                    minutaZWariantem
                );


                if (kurs.numer) {

                    kolumna.title =
                        "Kliknij, aby zobaczyć cały kurs " +
                        kurs.numer;


                    kolumna.onclick =
                        function() {

                            pokazCalyKurs(
                                kurs.numer
                            );

                        };

                }


                if (aktualnyWiersz) {

                    aktualnyWiersz.appendChild(
                        kolumna
                    );

                }

            }
        );

    }


    blok.appendChild(
        godziny
    );


    /*
     * LEGENDA:
     *
     * korzysta z dokładnie tej samej funkcji
     * pobierzWariantDoWyswietlenia(),
     * dzięki czemu nie pojawi się tutaj
     * wariant, którego nie ma przy żadnej minucie.
     */

    const legenda =
        utworzLegendePrzystanku(
            przystanek
        );


    if (legenda) {

        blok.appendChild(
            legenda
        );

    }


    kontener.appendChild(
        blok
    );

}



/* =========================================================
   WIDOK CAŁEGO KURSU
   ========================================================= */

function pokazCalyKurs(
    numerKursu
) {

    if (
        !daneLinii ||
        !numerKursu
    ) {

        return;

    }


    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !Array.isArray(
            rozklad.kierunki
        )
    ) {

        return;

    }


    const kierunek =
        rozklad.kierunki[
            aktualnyKierunek
        ];


    if (
        !kierunek ||
        !Array.isArray(
            kierunek.przystanki
        )
    ) {

        return;

    }


    const kliknietyPrzystanek =
        wybranyPrzystanek;


    const przystanki =
        kierunek.przystanki;


    const kursPrzystanki =
        [];


    przystanki.forEach(
        function(
            przystanek,
            index
        ) {

            if (
                !przystanek ||
                !Array.isArray(
                    przystanek.kursy
                )
            ) {

                return;

            }


            const kurs =
                przystanek.kursy.find(
                    function(k) {

                        if (
                            !k ||
                            typeof k !== "object"
                        ) {

                            return false;

                        }


                        return String(
                            k.numer ?? ""
                        ).trim()
                        ===
                        String(
                            numerKursu
                        ).trim();

                    }
                );


            if (!kurs) {

                return;

            }


            kursPrzystanki.push({

                index:
                    index,

                lp:
                    przystanek.lp !== undefined
                        ?
                        przystanek.lp
                        :
                        index + 1,

                nazwa:
                    przystanek.nazwa ||
                    "Przystanek",

                nr:
                    przystanek.nr,

                czas:
                    String(
                        kurs.czas || ""
                    ).trim(),

                kurs:
                    kurs,

                wariant:
                    pobierzDaneWariantu(
                        kurs
                    )

            });

        }
    );


    const kontener =
        document.getElementById(
            "przystanki"
        );


    const typ =
        document.getElementById(
            "typRozkladu"
        );


    if (!kontener) {

        return;

    }


    if (
        kursPrzystanki.length === 0
    ) {

        kontener.innerHTML =
            '<div class="kurs-pusty">' +
            'Nie znaleziono przystanków dla tego kursu.' +
            '</div>';


        return;

    }


    const dni =
        document.querySelector(
            ".dni"
        );


    if (dni) {

        dni.style.display =
            "none";

    }


    const kalendarz =
        document.getElementById(
            "kalendarz"
        );


    if (kalendarz) {

        kalendarz.style.display =
            "none";

    }


    if (typ) {

        typ.style.display =
            "block";

        typ.textContent =
            "Przebieg kursu";

    }


    kontener.innerHTML =
        "";


    const widok =
        document.createElement(
            "div"
        );


    widok.className =
        "kurs-widok";



    /* =====================================================
       NAGŁÓWEK: LINIA + KIERUNEK + WARIANT
       ===================================================== */

    const naglowek =
        document.createElement(
            "div"
        );


    naglowek.className =
        "kurs-naglowek";


    const linia =
        document.createElement(
            "div"
        );


    linia.className =
        "kurs-linia";


    linia.textContent =
        daneLinii.linia ||
        numerLinii ||
        "";


    const informacje =
        document.createElement(
            "div"
        );


    informacje.className =
        "kurs-informacje";


    const kierunekElement =
        document.createElement(
            "div"
        );


    kierunekElement.className =
        "kurs-kierunek";


    let nazwaKierunku =
        kierunek.nazwaKierunku ||
        kierunek.nazwa ||
        kierunek.kierunek ||
        kierunek.kierunekNazwa ||
        "";


    if (
        !nazwaKierunku &&
        kursPrzystanki.length > 0
    ) {

        nazwaKierunku =
            kursPrzystanki[
                kursPrzystanki.length - 1
            ].nazwa;

    }


    if (!nazwaKierunku) {

        nazwaKierunku =
            "Kierunek";

    }


    kierunekElement.textContent =
        nazwaKierunku;


    const wariantElement =
        document.createElement(
            "div"
        );


    wariantElement.className =
        "kurs-wariant";


    let wariant = null;


    for (
        let i = 0;
        i < kursPrzystanki.length;
        i++
    ) {

        if (
            kursPrzystanki[i].wariant &&
            kursPrzystanki[i].wariant.litera
        ) {

            wariant =
                kursPrzystanki[i].wariant;

            break;

        }

    }


    if (
        wariant &&
        wariant.litera &&
        !czyWariantPodstawowy(
            wariant.litera
        )
    ) {

        let tekst =
            "Wariant " +
            wariant.litera;


        if (
            wariant.opis
        ) {

            tekst +=
                " - " +
                wariant.opis;

        }


        wariantElement.textContent =
            tekst;

    }
    else {

        wariantElement.textContent =
            "Kurs podstawowy";

    }


    informacje.appendChild(
        kierunekElement
    );


    informacje.appendChild(
        wariantElement
    );


    naglowek.appendChild(
        linia
    );


    naglowek.appendChild(
        informacje
    );


    widok.appendChild(
        naglowek
    );



    /* =====================================================
       NUMER KURSU
       ===================================================== */

    const numer =
        document.createElement(
            "div"
        );


    numer.className =
        "kurs-numer";


    numer.textContent =
        "Kurs " +
        numerKursu +
        " • " +
        kursPrzystanki.length +
        " przystanków";


    widok.appendChild(
        numer
    );



    /* =====================================================
       PRZYSTANKI
       ===================================================== */

    const lista =
        document.createElement(
            "div"
        );


    lista.className =
        "kurs-lista";


    kursPrzystanki.forEach(
        function(element) {

            const wiersz =
                document.createElement(
                    "div"
                );


            wiersz.className =
                "kurs-przystanek";


            let aktywny = false;


            if (kliknietyPrzystanek) {

                if (
                    element.nr !== undefined &&
                    element.nr !== null &&
                    kliknietyPrzystanek.nr !== undefined &&
                    kliknietyPrzystanek.nr !== null &&
                    String(
                        element.nr
                    ).trim() !== "" &&
                    String(
                        kliknietyPrzystanek.nr
                    ).trim() !== ""
                ) {

                    aktywny =
                        String(
                            element.nr
                        ).trim()
                        ===
                        String(
                            kliknietyPrzystanek.nr
                        ).trim();

                }


                if (!aktywny) {

                    aktywny =
                        String(
                            element.nazwa || ""
                        )
                        .trim()
                        .toLowerCase()
                        ===
                        String(
                            kliknietyPrzystanek.nazwa || ""
                        )
                        .trim()
                        .toLowerCase()
                        &&
                        String(
                            element.lp ?? ""
                        ).trim()
                        ===
                        String(
                            kliknietyPrzystanek.lp ?? ""
                        ).trim();

                }

            }


            if (aktywny) {

                wiersz.classList.add(
                    "aktywny"
                );

            }


            const lp =
                document.createElement(
                    "div"
                );


            lp.className =
                "kurs-lp";


            lp.textContent =
                element.lp;


            const nazwa =
                document.createElement(
                    "div"
                );


            nazwa.className =
                "kurs-nazwa";


            nazwa.textContent =
                element.nazwa;


            const czas =
                document.createElement(
                    "div"
                );


            czas.className =
                "kurs-czas";


            czas.textContent =
                element.czas ||
                "—";


            wiersz.appendChild(
                lp
            );


            wiersz.appendChild(
                nazwa
            );


            wiersz.appendChild(
                czas
            );


            lista.appendChild(
                wiersz
            );

        }
    );


    widok.appendChild(
        lista
    );


    kontener.appendChild(
        widok
    );


    /* Przewijamy do przystanku,
       z którego kliknięto kurs. */

    const aktywny =
        widok.querySelector(
            ".kurs-przystanek.aktywny"
        );


    if (aktywny) {

        setTimeout(
            function() {

                aktywny.scrollIntoView({

                    behavior:
                        "smooth",

                    block:
                        "center"

                });

            },
            100
        );

    }

}



/* =========================================================
   POWRÓT Z CAŁEGO KURSU DO ROZKŁADU WYBRANEGO PRZYSTANKU
   ========================================================= */

function powrotDoRozkladuPrzystanku() {

    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !wybranyPrzystanek
    ) {

        pokazListePrzystankow(
            rozklad
        );


        return;

    }


    pokazRozkladWybranegoPrzystanku(
        rozklad,
        wybranyPrzystanek
    );

}



/* =========================================================
   FORMAT DATY
   ========================================================= */

function formatujDateInput(data) {

    const rok =
        data.getFullYear();


    const miesiac =
        String(
            data.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const dzien =
        String(
            data.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        rok +
        "-" +
        miesiac +
        "-" +
        dzien
    );

}

   BŁĄD
   ========================================================= */

    tytul,
    opis
) {

    document.getElementById(

    ).textContent =
        "Błąd";


    document.getElementById(
        "trasa"
    ).textContent =

    document.getElementById(

    ).innerHTML =

    document.getElementById(
        "typRozkladu"
    ).style.display =

    document.getElementById(

    ).innerHTML =

        '<div class="blad">' +

        '<strong>' +
        tytul +
        '</strong>' +

        opis +

        '</div>';

}



/* =========================================================
   PRZYCISK WSTECZ / HISTORIA PRZEGLĄDARKI
   ========================================================= */

window.addEventListener(
    "popstate",
    function() {

        const url =
            new URL(
                window.location.href
            );


        const parametrKierunku =
            url.searchParams.get(
                "kierunek"
            );


        const parametrPrzystanku =
            url.searchParams.get(
                "przystanek"
            );


        const liczbaKierunku =
            Number(
                parametrKierunku
            );


        aktualnyKierunek =
            Number.isInteger(
                liczbaKierunku
            ) &&
            liczbaKierunku >= 0
                ?
                liczbaKierunku
                :
                0;


        wybranyPrzystanek =
            null;


        const rozklad =
            znajdzRozklad();


        if (
            parametrPrzystanku &&
            rozklad &&
            Array.isArray(
                rozklad.kierunki
            )
        ) {

            const kierunek =
                rozklad.kierunki[
                    aktualnyKierunek
                ];


            if (
                kierunek &&
                Array.isArray(
                    kierunek.przystanki
                )
            ) {

                const znaleziony =
                    kierunek.przystanki.find(
                        function(przystanek) {

                            return String(
                                przystanek.nr ?? ""
                            ).trim()
                            ===
                            String(
                                parametrPrzystanku
                            ).trim();

                        }
                    );


                if (znaleziony) {

                    wybranyPrzystanek =
                        znaleziony;

                }

            }

        }


        pokazRozklad();

    }
);
