<!DOCTYPE html>

<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rozkład jazdy</title>

<link rel="stylesheet" href="../css/style.css">

<!-- =========================================================
     CZCIONKA BARLOW SEMI CONDENSED
     ========================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   GŁÓWNY KONTENER
   ========================================================= */

.rozkład {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px;
}


/* =========================================================
   POWRÓT
   ========================================================= */

.powrot {
    display: inline-block;
    margin-bottom: 20px;
    color: #0066cc;
    text-decoration: none;
    font-weight: bold;
}

.powrot:hover {
    text-decoration: underline;
}


/* =========================================================
   NAGŁÓWEK LINII
   ========================================================= */

.naglowek-linii {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 25px;
    margin-bottom: 15px;
}

.numer-linii {
    font-size: 42px;
    font-weight: bold;
    margin: 0 0 8px 0;
}

.trasa {
    font-size: 19px;
    font-weight: bold;
    margin: 0;
    white-space: pre-line;
}


/* =========================================================
   KIERUNKI
   ========================================================= */

.kierunki {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.kierunek-btn {
    flex: 1;
    padding: 14px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    transition: 0.15s;
}

.kierunek-btn:hover {
    border-color: #0066cc;
}

.kierunek-btn.aktywny {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
}


/* =========================================================
   DNI
   ========================================================= */

.dni {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.dzien-btn {
    padding: 12px 20px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.dzien-btn:hover {
    border-color: #0066cc;
}

.dzien-btn.aktywny {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
}


/* =========================================================
   KALENDARZ
   ========================================================= */

.kalendarz {
    display: none;
    background: white;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 15px;
    margin-bottom: 15px;
}

.kalendarz input {
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
}


/* =========================================================
   TYP ROZKŁADU
   ========================================================= */

.typ-rozkładu {
    background: #f7f7f7;
    border: 1px solid #ddd;
    padding: 12px 15px;
    margin-bottom: 15px;
    border-radius: 6px;
    font-size: 14px;
    color: #555;
}


/* =========================================================
   LISTA PRZYSTANKÓW
   ========================================================= */

.przystanki {
    display: flex;
    flex-direction: column;
    gap: 10px;
}


/* =========================================================
   PRZYSTANEK
   ========================================================= */

.przystanek {
    background: white;
    border: 1px solid #ddd;
    border-radius: 7px;
    overflow: hidden;
}

.przystanek-naglowek {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #f2f2f2;
    padding: 13px 15px;
    border-bottom: 1px solid #ddd;
}

.lp {
    min-width: 35px;
    font-weight: bold;
    color: #666;
}

.nazwa-przystanku {
    font-weight: bold;
    font-size: 17px;
}

.numer-przystanku {
    margin-left: auto;
    color: #777;
    font-size: 13px;
}


/* =========================================================
   GODZINY
   ========================================================= */

.godziny {
    width: 100%;
}

.wiersz-godziny {

    display: grid;

    /*
       GODZINA:
       45px → 43px

       MINUTA:
       48px → 46px
    */

    grid-template-columns:
        43px
        repeat(10, 46px);

    grid-auto-columns: 46px;

    /*
       WYSOKOŚĆ:
       40px → 38px
    */

    min-height: 38px;

    border-bottom: 1px solid #eee;
}


/* =========================================================
   GODZINA
   ========================================================= */

.kolumna-godzina {

    display: flex;

    align-items: center;

    justify-content: center;

    font-family: "Barlow Semi Condensed", sans-serif;

    font-size: 16px;

    font-weight: 600;

    background: #555;

    color: white;

    border-right: 1px solid #444;

    /*
       40px → 38px
    */

    min-height: 38px;
}


/* =========================================================
   KOMÓRKA MINUTY
   ========================================================= */

.kolumna-minuta {

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    position: relative;

    /*
       40px → 38px
    */

    min-height: 38px;

    font-family: "Barlow Semi Condensed", sans-serif;

    font-weight: 600;

    white-space: nowrap;

    /*
       48px → 46px
    */

    width: 46px;

    min-width: 46px;

    max-width: 46px;

    overflow: visible;

    color: #222;

    /*
       Wszystkie kolumny minut
       przesunięte 10 px w prawo.
    */

    transform: translateX(10px);
}


.kolumna-minuta:hover {
    background: #f5f8fb;
}


/* =========================================================
   MINUTA + WARIANT
   ========================================================= */

.minuta-z-wariantem {

    position: relative;

    display: inline-block;

    line-height: 1;

    text-align: center;
}


/* =========================================================
   MINUTA
   ========================================================= */

.minuta {

    display: inline-block;

    font-family: "Barlow Semi Condensed", sans-serif;

    font-size: 16px;

    font-weight: 600;

    line-height: 1;

    color: inherit;

    position: relative;

    z-index: 1;
}


/* =========================================================
   LITERKA WARIANTU
   ========================================================= */

.wariant-minuty {

    position: absolute;

    left: calc(100% + 2px);

    bottom: -1px;

    /*
       CZCIONKA WARIANTÓW
    */

    font-family: "Barlow Semi Condensed", sans-serif;

    /*
       WARIANT:
       12px
    */

    font-size: 12px;

    line-height: 1;

    font-weight: 600;

    color: inherit;

    white-space: nowrap;

    z-index: 2;
}


/* =========================================================
   LEGENDA WARIANTÓW
   ========================================================= */

.legenda-wariantow {

    background: #f7f7f7;

    border-top: 1px solid #ddd;

    padding: 10px 15px;

    font-size: 16px;

    color: #555;

    font-family: "Barlow Semi Condensed", sans-serif;

    font-weight: 600;
}

.legenda-lista {

    display: flex;

    flex-direction: column;

    gap: 4px;
}

.legenda-element {

    display: flex;

    align-items: baseline;

    gap: 6px;

    line-height: 1.35;

    font-family: "Barlow Semi Condensed", sans-serif;

    font-weight: 600;
}

.legenda-litera {

    min-width: 22px;

    font-weight: 600;

    color: black;

    font-family: "Barlow Semi Condensed", sans-serif;

    font-size: 19px;
}

.legenda-separator {

    color: black;

    font-family: "Barlow Semi Condensed", sans-serif;

    font-size: 16px;

    font-weight: 600;
}

.legenda-opis {

    color: black;

    font-weight: 600;

    font-family: "Barlow Semi Condensed", sans-serif;

    font-size: 16px;
}


/* =========================================================
   BRAK GODZIN
   ========================================================= */

.brak-godzin {

    padding: 15px;

    color: #777;

    font-size: 14px;
}


/* =========================================================
   ŁADOWANIE
   ========================================================= */

.loading {

    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;

    padding: 30px;

    text-align: center;

    color: #666;
}


/* =========================================================
   BŁĄD
   ========================================================= */

.blad {

    background: #fff4f4;

    border: 1px solid #e0aaaa;

    color: #a00000;

    border-radius: 8px;

    padding: 20px;

    line-height: 1.6;
}

.blad strong {

    display: block;

    margin-bottom: 8px;
}


/* =========================================================
   BRAK DANYCH
   ========================================================= */

.brak-danych {

    padding: 30px;

    text-align: center;

    color: #777;

    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;
}


/* =========================================================
   TELEFON / TABLET
   ========================================================= */

@media (max-width: 800px) {

    .wiersz-godziny {

        grid-template-columns:
            38px
            repeat(6, 46px);

        grid-auto-columns: 46px;

        min-height: 38px;
    }

}


/* =========================================================
   TELEFON
   ========================================================= */

@media (max-width: 550px) {

    .rozkład {

        margin: 15px auto;

    }

    .numer-linii {

        font-size: 34px;

    }

    .trasa {

        font-size: 16px;

    }

    .kierunki {

        flex-direction: column;

    }

    .dni {

        flex-wrap: wrap;

    }

    .dzien-btn {

        flex: 1;

        padding: 11px 10px;

    }


    /* =====================================================
       WIERSZ GODZIN – TELEFON
       ===================================================== */

    .wiersz-godziny {

        grid-template-columns:
            36px
            repeat(4, 46px);

        grid-auto-columns: 46px;

        min-height: 36px;

        overflow-x: auto;

    }


    /* =====================================================
       GODZINA – TELEFON
       ===================================================== */

    .kolumna-godzina {

        font-size: 14px;

        /*
           38px → 36px
        */

        min-height: 36px;

    }


    /* =====================================================
       MINUTA – TELEFON
       ===================================================== */

    .kolumna-minuta {

        /*
           48px → 46px
        */

        width: 46px;

        min-width: 46px;

        max-width: 46px;

        /*
           38px → 36px
        */

        min-height: 36px;

        transform: translateX(10px);

    }


    .minuta {

        font-size: 15px;

    }


    /* =====================================================
       WARIANT – TELEFON
       ===================================================== */

    .wariant-minuty {

        /*
           Wariant również Barlow Semi Condensed
           i pozostaje 12 px.
        */

        font-family: "Barlow Semi Condensed", sans-serif;

        font-size: 12px;

        font-weight: 600;

        left: calc(100% + 2px);

        bottom: -1px;

    }


    .legenda-wariantow {

        font-size: 19px;

    }

    .legenda-litera,
    .legenda-separator,
    .legenda-opis {

        font-size: 19px;

    }


    .przystanek-naglowek {

        padding: 12px;

    }

    .nazwa-przystanku {

        font-size: 15px;

    }

    .numer-przystanku {

        font-size: 11px;

    }

}


/* =========================================================
   WIDOK LISTY PRZYSTANKÓW
   ========================================================= */

.lista-przystankow {

    display: flex;

    flex-direction: column;

    gap: 8px;
}

.przystanek-btn {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 14px 16px;

    background: white;

    border: 1px solid #ddd;

    border-radius: 7px;

    cursor: pointer;

    text-align: left;

    transition: 0.15s;

    font-family: inherit;
}

.przystanek-btn:hover {

    border-color: #0066cc;

    background: #f8fbff;
}

.przystanek-btn .lp {

    min-width: 35px;

    font-weight: bold;

    color: #777;
}

.przystanek-btn .przystanek-nazwa {

    font-size: 16px;

    font-weight: bold;

    color: #222;
}

.przystanek-btn .przystanek-nr {

    margin-left: auto;

    color: #777;

    font-size: 13px;
}

.powrot-przystanki {

    margin-bottom: 15px;
}

.powrot-przystanki button {

    border: none;

    background: none;

    padding: 0;

    color: #0066cc;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    font-family: inherit;
}

.powrot-przystanki button:hover {

    text-decoration: underline;

}

.naglowek-przystanku-widok {

    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;

    padding: 20px;

    margin-bottom: 15px;
}

.naglowek-przystanku-widok .nazwa {

    font-size: 26px;

    font-weight: bold;

    margin-bottom: 5px;
}

.naglowek-przystanku-widok .numer {

    color: #777;

    font-size: 14px;
}


@media (max-width: 550px) {

    .przystanek-btn {

        padding: 13px 12px;

    }

    .przystanek-btn .przystanek-nazwa {

        font-size: 15px;

    }

    .naglowek-przystanku-widok .nazwa {

        font-size: 22px;

    }

}

</style>

<body>


<header class="topbar">

    <div class="logo">
        FWTP
    </div>

    <nav>

        <a href="../">
            Strona główna
        </a>

        <a href="../linie/">
            Linie
        </a>

    </nav>

</header>


<main class="rozkład">


<a
    class="powrot"
    href="../linie/"
>
    ← Linie
</a>


<section class="naglowek-linii">


<h1
    id="numerLinii"
    class="numer-linii"
>
    Ładowanie...
</h1>


<p
    id="trasa"
    class="trasa"
>
    Pobieranie danych...
</p>


</section>


<div
    id="kierunki"
    class="kierunki"
></div>


<div
    class="dni"
    style="display:none;"
>


<button
    id="dzisiajBtn"
    class="dzien-btn aktywny"
    onclick="wybierzDzien('dzisiaj')"
>
    DZISIAJ
</button>


<button
    id="jutroBtn"
    class="dzien-btn"
    onclick="wybierzDzien('jutro')"
>

</button>


<button
    id="kalendarzBtn"
    class="dzien-btn"
    onclick="wybierzDzien('kalendarz')"
>

    id="kalendarz"
    class="kalendarz"

    type="date"

>


</div>

    class="powrot-przystanki"

>

    <button onclick="pokazListePrzystankowZPowrotem()">

        ← Przystanki

    </button>

</div>

    id="typRozkladu"
    class="typ-rozkładu"
>

    Ładowanie rozkładu...

</div>

    <div class="loading">

</main>


<script>

/* =========================================================
   FWTP – ROZKŁAD JAZDY
   ========================================================= */


/* =========================================================
   ZMIENNE
   ========================================================= */

let daneLinii = null;

let numerLinii = null;

let aktualnyKierunek = 0;

let aktualnyDzien = "dzisiaj";

let wybranaData = new Date();

let wybranyPrzystanek = null;


/* =========================================================
   ODCZYT NUMERU LINII Z URL
   ========================================================= */

const parametry =
    new URLSearchParams(
        window.location.search
    );


numerLinii =
    parametry.get("linia");


if (!numerLinii) {

    pokazBlad(
        "Nie podano numeru linii.",
        "Użyj adresu w rodzaju: ?linia=102"
    );

}
else {

    document.getElementById(
        "numerLinii"
    ).textContent =
        numerLinii;

    pobierzDane();

}


/* =========================================================
   USUWANIE WADLIWEGO POLA „godziny”
   ========================================================= */

function usunPoleGodziny(tekst) {

    const pozycja =
        tekst.search(
            /"godziny"\s*:\s*\[/
        );

    if (pozycja === -1) {
        return tekst;
    }

    const poczatekTablicy =
        tekst.indexOf(
            "[",
            pozycja
        );

    if (poczatekTablicy === -1) {
        return tekst;
    }

    let poziom = 0;

    let wStringu = false;

    let ucieczka = false;

    let koniecTablicy = -1;


    for (
        let i = poczatekTablicy;
        i < tekst.length;
        i++
    ) {

        const znak = tekst[i];


        if (ucieczka) {

            ucieczka = false;

            continue;

        }


        if (
            znak === "\\"
            &&
            wStringu
        ) {

            ucieczka = true;

            continue;

        }


        if (
            znak === '"'
        ) {

            wStringu =
                !wStringu;

            continue;

        }


        if (wStringu) {
            continue;
        }


        if (znak === "[") {
            poziom++;
        }


        if (znak === "]") {

            poziom--;

            if (poziom === 0) {

                koniecTablicy = i;

                break;

            }

        }

    }


    if (
        koniecTablicy === -1
    ) {

        return tekst;

    }


    let poczatek =
        pozycja;

    let koniec =
        koniecTablicy + 1;


    while (
        koniec < tekst.length
        &&
        /\s/.test(
            tekst[koniec]
        )
    ) {

        koniec++;

    }


    if (
        tekst[koniec] === ","
    ) {

        koniec++;

    }


    let wynik =
        tekst.substring(
            0,
            poczatek
        )
        +
        tekst.substring(
            koniec
        );


    wynik =
        wynik.replace(
            /,\s*,/g,
            ","
        );


    wynik =
        wynik.replace(
            /,\s*}/g,
            "}"
        );


    return wynik;

}


/* =========================================================
   POBIERANIE JSON
   ========================================================= */

async function pobierzDane() {

    const adres =
        "../dane/" +
        encodeURIComponent(
            numerLinii
        ) +
        ".json";


    console.log(
        "FWTP – pobieram:",
        adres
    );


    try {

        const odpowiedz =
            await fetch(
                adres,
                {
                    cache: "no-cache"
                }
            );


        if (!odpowiedz.ok) {

            throw new Error(
                "HTTP " +
                odpowiedz.status +
                " – nie znaleziono pliku " +
                numerLinii +
                ".json"
            );

        }


        let tekst =
            await odpowiedz.text();


        if (
            !tekst.trim()
        ) {

            throw new Error(
                "Plik JSON jest pusty."
            );

        }


        try {

            daneLinii =
                JSON.parse(
                    tekst
                );

        }
        catch (pierwszyBlad) {

            console.warn(
                "FWTP – zwykły JSON.parse nie powiódł się."
            );


            const oczyszczonyJSON =
                usunPoleGodziny(
                    tekst
                );


            try {

                daneLinii =
                    JSON.parse(
                        oczyszczonyJSON
                    );

            }
            catch (drugiBlad) {

                console.error(
                    "Oryginalny JSON:",
                    tekst
                );

                console.error(
                    "Oczyszczony JSON:",
                    oczyszczonyJSON
                );


                throw new Error(
                    "JSON jest nieprawidłowy. " +
                    "Błąd: " +
                    drugiBlad.message
                );

            }

        }


        if (
            !daneLinii ||
            typeof daneLinii !== "object"
        ) {

            throw new Error(
                "JSON nie zawiera obiektu danych."
            );

        }


        if (
            !Array.isArray(
                daneLinii.rozkłady
            )
        ) {

            throw new Error(
                "JSON nie zawiera tablicy „rozkłady”."
            );

        }


        console.log(
            "FWTP – JSON załadowany poprawnie:",
            daneLinii
        );


        uruchomStrone();


    }
    catch (blad) {

        console.error(
            "FWTP – BŁĄD:",
            blad
        );


        pokazBlad(
            "Nie udało się załadować linii " +
            numerLinii +
            ".",
            blad.message
        );

    }

}


/* =========================================================
   URUCHOMIENIE STRONY
   ========================================================= */

function uruchomStrone() {

    document.getElementById("numerLinii").textContent =
        daneLinii.linia || numerLinii;

    document.getElementById("trasa").textContent =
        daneLinii.trasa ||
        ("Rozkład jazdy linii " + numerLinii);

    wybranaData = new Date();
    aktualnyKierunek = 0;
    wybranyPrzystanek = null;

    const parametrKierunku =
        parametry.get("kierunek");

    if (
        parametrKierunku !== null &&
        parametrKierunku !== ""
    ) {

        const liczbaKierunku = Number(parametrKierunku);

        if (
            Number.isInteger(liczbaKierunku) &&
            liczbaKierunku >= 0
        ) {
            aktualnyKierunek = liczbaKierunku;
        }
    }

    const parametrPrzystanku =
        parametry.get("przystanek");

    if (parametrPrzystanku) {

        const rozklad = znajdzRozklad();

        if (
            rozklad &&
            Array.isArray(rozklad.kierunki)
        ) {

            const kierunek =
                rozklad.kierunki[aktualnyKierunek];

            if (
                kierunek &&
                Array.isArray(kierunek.przystanki)
            ) {

                let znaleziony =
                    kierunek.przystanki.find(
                        function(przystanek) {

                            return String(
                                przystanek.nr ?? ""
                            ).trim()
                            ===
                            String(
                                parametrPrzystanku
                            ).trim();

                        }
                    );

                if (!znaleziony) {

                    const indeks =
                        Number(parametrPrzystanku);

                    if (
                        Number.isInteger(indeks) &&
                        indeks >= 0 &&
                        indeks < kierunek.przystanki.length
                    ) {

                        znaleziony =
                            kierunek.przystanki[indeks];

                    }

                }

                if (znaleziony) {

                    wybranyPrzystanek =
                        znaleziony;

                }

            }

        }

    }

    pokazRozklad();

}


/* =========================================================
   NORMALIZACJA TEKSTU
   ========================================================= */

function normalizujTekst(tekst) {

    return String(
        tekst || ""
    )
    .toLowerCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    );

}


/* =========================================================
   TYP DNIA
   ========================================================= */

function okreslTypDnia(data) {

    const dzien =
        data.getDay();


    if (dzien === 6) {
        return "sobota";
    }


    if (dzien === 0) {
        return "niedziela";
    }


    return "roboczy";
}


/* =========================================================
   ZNAJDŹ ODPOWIEDNI ROZKŁAD
   ========================================================= */

function znajdzRozklad() {

    const rozklady =
        daneLinii.rozkłady || [];


    if (
        rozklady.length === 0
    ) {

        return null;

    }


    const typDnia =
        okreslTypDnia(
            wybranaData
        );


    if (
        typDnia === "sobota"
    ) {

        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                nazwa.includes(
                    "sobot"
                )
            ) {

                return rozklad;

            }

        }

    }


    if (
        typDnia === "niedziela"
    ) {

        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                nazwa.includes(
                    "niedziel"
                )
            ) {

                return rozklad;

            }

        }


        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                (
                    nazwa.includes(
                        "sobot"
                    )
                    &&
                    nazwa.includes(
                        "niedziel"
                    )
                )
                ||
                nazwa.includes(
                    "swieta"
                )
                ||
                nazwa.includes(
                    "swiat"
                )
            ) {

                return rozklad;

            }

        }

    }


    if (
        typDnia === "roboczy"
    ) {

        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                nazwa.includes(
                    "poniedzialku do piatku"
                )
                ||
                nazwa.includes(
                    "poniedzialku"
                )
                ||
                nazwa.includes(
                    "poniedzialek"
                )
                ||
                (
                    nazwa.includes(
                        "piat"
                    )
                    &&
                    !nazwa.includes(
                        "sobot"
                    )
                )
            ) {

                return rozklad;

            }

        }

    }


    return rozklady[0];

}


/* =========================================================
   GENEROWANIE KIERUNKÓW
   ========================================================= */

function generujKierunki() {

    const kontener =
        document.getElementById(
            "kierunki"
        );


    kontener.innerHTML = "";


    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !Array.isArray(
            rozklad.kierunki
        )
    ) {

        return;

    }


    rozklad.kierunki.forEach(
        function(
            kierunek,
            index
        ) {

            const przycisk =
                document.createElement(
                    "button"
                );


            przycisk.className =
                "kierunek-btn";


            if (
                index ===
                aktualnyKierunek
            ) {

                przycisk.classList.add(
                    "aktywny"
                );

            }


            const przystanki =
                Array.isArray(
                    kierunek.przystanki
                )
                    ?
                    kierunek.przystanki
                    :
                    [];


            let nazwaKierunku = "";


            if (
                przystanki.length > 0
            ) {

                const ostatni =
                    przystanki[
                        przystanki.length - 1
                    ];


                nazwaKierunku =
                    ostatni.nazwa ||
                    "";

            }


            if (
                !nazwaKierunku
            ) {

                nazwaKierunku =
                    "Kierunek " +
                    (
                        index + 1
                    );

            }


            przycisk.textContent =
                nazwaKierunku;


            przycisk.onclick =
                function() {

                    zmienKierunek(
                        index
                    );

                };


            kontener.appendChild(
                przycisk
            );

        }
    );

}


/* =========================================================
   ZMIANA KIERUNKU
   ========================================================= */

function zmienKierunek(index) {

    aktualnyKierunek = index;

    wybranyPrzystanek = null;

    const url =
        new URL(window.location.href);

    url.searchParams.set(
        "kierunek",
        String(index)
    );

    url.searchParams.delete(
        "przystanek"
    );

    window.history.pushState(
        {},
        "",
        url
    );

    pokazRozklad();

}


/* =========================================================
   WYBÓR DNIA
   ========================================================= */

function wybierzDzien(dzien) {

    aktualnyDzien =

    document

        )

                );

        );

        );

    ) {

        ).classList.add(

        );

    }


    if (
        dzien === "jutro"
    ) {

        document.getElementById(

        ).classList.add(

        );


        wybranaData =

        wybranaData.setDate(

        );

    }


    if (

    ) {

        ).classList.add(

        ).value =

            );

        !rozklad.kierunki ||

        ]
    ) {

    }

/* =========================================================
   KALENDARZ
   ========================================================= */

document
    .getElementById(
        "wybranaData"
    )
    .addEventListener(
        "change",
        function() {

            if (
                !this.value
            ) {

                return;

            }


            const czesci =
                this.value.split(
                    "-"
                );


            wybranaData =
                new Date(
                    Number(
                        czesci[0]
                    ),
                    Number(
                        czesci[1]
                    ) - 1,
                    Number(
                        czesci[2]
                    )
                );


            const rozklad =
                znajdzRozklad();


            if (
                !rozklad ||
                !rozklad.kierunki ||
                !rozklad.kierunki[
                    aktualnyKierunek
                ]
            ) {

                aktualnyKierunek = 0;

            }


            pokazRozklad();

        }
    );


/* =========================================================
   POBIERANIE DANYCH WARIANTU
   ========================================================= */

function pobierzDaneWariantu(kurs) {

    if (
        !kurs ||
        typeof kurs !== "object"
    ) {

        return {
            litera: "",
            opis: ""
        };

    }


    let wariant =
        kurs.wariant;


    let litera = "";

    let opis = "";


    if (
        wariant &&
        typeof wariant === "object"
    ) {

        litera =
            wariant.litera ||
            wariant.nazwa ||
            wariant.symbol ||
            wariant.wariant ||
            wariant.oznaczenie ||
            "";


        opis =
            wariant.opis ||
            wariant.tekst ||
            wariant.opisWariantu ||
            wariant.description ||
            "";

    }


    else {

        litera =
            String(
                wariant || ""
            ).trim();

    }


    litera =
        String(
            litera
        ).trim();


    if (
        litera &&
        daneLinii &&
        Array.isArray(
            daneLinii.rozkłady
        )
    ) {

        const rozklad =
            znajdzRozklad();


        if (
            rozklad &&
            Array.isArray(
                rozklad.warianty
            )
        ) {

            const znaleziony =
                rozklad.warianty.find(
                    function(w) {

                        if (
                            !w ||
                            typeof w !== "object"
                        ) {

                            return false;

                        }


                        const literaWariantu =
                            String(
                                w.litera ||
                                w.nazwa ||
                                w.symbol ||
                                w.wariant ||
                                w.oznaczenie ||
                                ""
                            ).trim();


                        return (
                            literaWariantu
                                .toUpperCase()
                            ===
                            litera
                                .toUpperCase()
                        );

                    }
                );


            if (
                znaleziony
            ) {

                opis =
                    znaleziony.opis ||
                    znaleziony.tekst ||
                    znaleziony.opisWariantu ||
                    znaleziony.description ||
                    znaleziony.description_pl ||
                    "";

            }

        }

    }


    if (!opis) {

        opis =
            kurs.wariantOpis ||
            kurs.opisWariantu ||
            kurs.wariant_Opis ||
            kurs.opis ||
            kurs.uwagi ||
            kurs.uwaga ||
            "";

    }


    return {

        litera:
            String(
                litera
            ).trim(),

        opis:
            String(
                opis
            ).trim()

    };

}


/* =========================================================
   POBIERANIE SAMEJ LITERKI
   ========================================================= */

function pobierzWariant(kurs) {

    const dane =
        pobierzDaneWariantu(
            kurs
        );


    return dane.litera;

}


/* =========================================================
   ZBIERANIE WARIANTÓW DLA PRZYSTANKU
   ========================================================= */

function zbierzWariantyPrzystanku(przystanek) {

    const warianty =
        new Map();


    if (
        !przystanek ||
        !Array.isArray(
            przystanek.kursy
        )
    ) {

        return warianty;

    }


    przystanek.kursy.forEach(
        function(kurs) {

            const dane =
                pobierzDaneWariantu(
                    kurs
                );


            if (
                !dane.litera
            ) {

                return;

            }


            if (
                !warianty.has(
                    dane.litera
                )
            ) {

                warianty.set(
                    dane.litera,
                    dane.opis
                );

            }
            else {

                if (
                    !warianty.get(
                        dane.litera
                    )
                    &&
                    dane.opis
                ) {

                    warianty.set(
                        dane.litera,
                        dane.opis
                    );

                }

            }

        }
    );


    return warianty;

}


/* =========================================================
   TWORZENIE LEGENDY
   ========================================================= */

function utworzLegendePrzystanku(przystanek) {

    const warianty =
        zbierzWariantyPrzystanku(
            przystanek
        );


    if (
        warianty.size === 0
    ) {

        return null;

    }


    const legenda =
        document.createElement(
            "div"
        );


    legenda.className =
        "legenda-wariantow";


    const lista =
        document.createElement(
            "div"
        );


    lista.className =
        "legenda-lista";


    warianty.forEach(
        function(
            opis,
            litera
        ) {


            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "legenda-element";


            const symbol =
                document.createElement(
                    "span"
                );


            symbol.className =
                "legenda-litera";


            symbol.textContent =
                litera;


            element.appendChild(
                symbol
            );


            /* =================================================
               MYŚLNIK POMIĘDZY LITERĄ A OPISEM
               ================================================= */

            if (opis) {

                const separator =
                    document.createElement(
                        "span"
                    );


                separator.className =
                    "legenda-separator";


                separator.textContent =
                    " - ";


                element.appendChild(
                    separator
                );


                const opisElement =
                    document.createElement(
                        "span"
                    );


                opisElement.className =
                    "legenda-opis";


                opisElement.textContent =
                    opis;


                element.appendChild(
                    opisElement
                );

            }


            lista.appendChild(
                element
            );

        }
    );


    legenda.appendChild(
        lista
    );


    return legenda;

}


/* =========================================================
   GŁÓWNE WYŚWIETLANIE ROZKŁADU
   ========================================================= */

function pokazRozklad() {

    if (!daneLinii) {
        return;
    }

    const rozklad =
        znajdzRozklad();

    const kontener =
        document.getElementById(
            "przystanki"
        );

    const typ =
        document.getElementById(
            "typRozkladu"
        );

    const powrot =
        document.getElementById(
            "powrotPrzystanki"
        );


    if (!rozklad) {

        typ.style.display =
            "block";

        typ.textContent =
            "Brak rozkładu";

        powrot.style.display =
            "none";


        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak danych rozkładu.' +
            '</div>';

        return;

    }


    const kierunki =
        rozklad.kierunki || [];


    if (kierunki.length === 0) {

        typ.style.display =
            "block";

        typ.textContent =
            "Brak kierunków";

        powrot.style.display =
            "none";


        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Ten rozkład nie zawiera kierunków.' +
            '</div>';

        return;

    }


    if (
        aktualnyKierunek < 0 ||
        aktualnyKierunek >= kierunki.length
    ) {

        aktualnyKierunek = 0;

    }


    generujKierunki();


    if (!wybranyPrzystanek) {

        pokazListePrzystankow(
            rozklad
        );

        return;

    }


    const kierunek =
        kierunki[
            aktualnyKierunek
        ];


    const przystanki =
        Array.isArray(
            kierunek.przystanki
        )
            ?
            kierunek.przystanki
            :
            [];


    let aktualnyPrzystanek =
        null;


    if (
        wybranyPrzystanek.nr !== undefined &&
        wybranyPrzystanek.nr !== null
    ) {

        aktualnyPrzystanek =
            przystanki.find(
                function(przystanek) {

                    return String(
                        przystanek.nr ?? ""
                    ).trim()
                    ===
                    String(
                        wybranyPrzystanek.nr
                    ).trim();

                }
            );

    }


    if (!aktualnyPrzystanek) {

        aktualnyPrzystanek =
            przystanki.find(
                function(przystanek) {

                    return (
                        String(
                            przystanek.nazwa ?? ""
                        ).trim()
                        ===
                        String(
                            wybranyPrzystanek.nazwa ?? ""
                        ).trim()
                        &&
                        String(
                            przystanek.lp ?? ""
                        ).trim()
                        ===
                        String(
                            wybranyPrzystanek.lp ?? ""
                        ).trim()
                    );

                }
            );

    }


    if (!aktualnyPrzystanek) {

        wybranyPrzystanek =
            null;

        pokazListePrzystankow(
            rozklad
        );

        return;

    }


    wybranyPrzystanek =
        aktualnyPrzystanek;


    pokazRozkladWybranegoPrzystanku(
        rozklad,
        aktualnyPrzystanek
    );

}

   LISTA PRZYSTANKÓW

    if (

    ) {

        );

    przystanki.forEach(

                );

                (

                );

                );


            nazwa.className =

                );

                "przystanek-nr";

                przystanek.nr !== null &&
                String(
                    przystanek.nr
                ).trim() !== ""
            ) {

            }

                lp
            );


            przycisk.appendChild(

            );

            );


            przycisk.onclick =
                function() {

                    wybierzPrzystanek(
                        przystanek,
                        index
                    );

                };


            lista.appendChild(
                przycisk
            );

        }
    );


    kontener.appendChild(
        lista
    );

}

   WYBÓR PRZYSTANKU

        );

/* =========================================================
   ROZKŁAD WYBRANEGO PRZYSTANKU
   ========================================================= */

function pokazRozkladWybranegoPrzystanku(
    rozklad,
    przystanek
) {

    const kontener =
        document.getElementById(
            "przystanki"
        );


    const typ =
        document.getElementById(
            "typRozkladu"
        );


    const powrot =
        document.getElementById(
            "powrotPrzystanki"
        );


    powrot.style.display =
        "block";


    const dni =
        document.querySelector(
            ".dni"
        );


    if (dni) {

        dni.style.display =
            "flex";

    }


    const kalendarz =
        document.getElementById(
            "kalendarz"
        );


    if (
        aktualnyDzien !==
        "kalendarz"
    ) {

        kalendarz.style.display =
            "none";

    }


    typ.style.display =
        "block";


    typ.textContent =
        rozklad.nazwa ||
        "Rozkład jazdy";


    kontener.innerHTML =
        "";


    const naglowek =
        document.createElement(
            "div"
        );


    naglowek.className =
        "naglowek-przystanku-widok";


    const nazwa =
        document.createElement(
            "div"
        );


    nazwa.className =
        "nazwa";


    nazwa.textContent =
        przystanek.nazwa ||
        "Przystanek";


    const nr =
        document.createElement(
            "div"
        );


    nr.className =
        "numer";


    if (
        przystanek.nr !== undefined &&
        przystanek.nr !== null &&
        String(
            przystanek.nr
        ).trim() !== ""
    ) {

        nr.textContent =
            "nr " +
            przystanek.nr;

    }


    naglowek.appendChild(
        nazwa
    );


    naglowek.appendChild(
        nr
    );


    kontener.appendChild(
        naglowek
    );


    const blok =
        document.createElement(
            "div"
        );


    blok.className =
        "przystanek";


    const godziny =
        document.createElement(
            "div"
        );


    godziny.className =
        "godziny";


    const kursy =
        Array.isArray(
            przystanek.kursy
        )
            ?
            przystanek.kursy
            :
            [];


    if (
        kursy.length === 0
    ) {

        godziny.innerHTML =
            '<div class="brak-godzin">' +
            'Brak odjazdów' +
            '</div>';

    }
    else {

        let aktualnaGodzina =
            null;


        let aktualnyWiersz =
            null;


        kursy.forEach(
            function(kurs) {

                if (
                    !kurs ||
                    typeof kurs !== "object"
                ) {

                    return;

                }


                const czas =
                    String(
                        kurs.czas || ""
                    ).trim();


                const dopasowanie =
                    czas.match(
                        /^(\d{1,2}):(\d{2})$/
                    );


                if (!dopasowanie) {

                    return;

                }


                const godzina =
                    Number(
                        dopasowanie[1]
                    );


                const minuta =
                    dopasowanie[2];


                if (
                    !Number.isFinite(
                        godzina
                    )
                ) {

                    return;

                }


                if (
                    aktualnaGodzina === null ||
                    aktualnaGodzina !== godzina
                ) {

                    aktualnaGodzina =
                        godzina;


                    aktualnyWiersz =
                        document.createElement(
                            "div"
                        );


                    aktualnyWiersz.className =
                        "wiersz-godziny";


                    const kolumnaGodziny =
                        document.createElement(
                            "div"
                        );


                    kolumnaGodziny.className =
                        "kolumna-godzina";


                    kolumnaGodziny.textContent =
                        String(
                            godzina
                        ).padStart(
                            2,
                            "0"
                        );


                    aktualnyWiersz.appendChild(
                        kolumnaGodziny
                    );


                    godziny.appendChild(
                        aktualnyWiersz
                    );

                }


                const kolumna =
                    document.createElement(
                        "div"
                    );


                kolumna.className =
                    "kolumna-minuta";


                const minutaZWariantem =
                    document.createElement(
                        "span"
                    );


                minutaZWariantem.className =
                    "minuta-z-wariantem";


                const minutaElement =
                    document.createElement(
                        "span"
                    );


                minutaElement.className =
                    "minuta";


                minutaElement.textContent =
                    minuta;


                minutaZWariantem.appendChild(
                    minutaElement
                );


                const wariant =
                    pobierzWariant(
                        kurs
                    );


                if (wariant) {

                    const wariantElement =
                        document.createElement(
                            "span"
                        );


                    wariantElement.className =
                        "wariant-minuty";


                    wariantElement.textContent =
                        wariant;


                    minutaZWariantem.appendChild(
                        wariantElement
                    );

                }


                kolumna.appendChild(
                    minutaZWariantem
                );


                if (kurs.numer) {

                    kolumna.title =
                        "Kurs " +
                        kurs.numer;

                }


                if (aktualnyWiersz) {

                    aktualnyWiersz.appendChild(
                        kolumna
                    );

                }

            }
        );

    }


    blok.appendChild(
        godziny
    );


    const legenda =
        utworzLegendePrzystanku(
            przystanek
        );


    if (legenda) {

        blok.appendChild(
            legenda
        );

    }


    kontener.appendChild(
        blok
    );

}


/* =========================================================
   FORMAT DATY
   ========================================================= */

function formatujDateInput(data) {

    const rok =
        data.getFullYear();


    const miesiac =
        String(
            data.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const dzien =
        String(
            data.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        rok +
        "-" +
        miesiac +
        "-" +
        dzien
    );

}


/* =========================================================
   BŁĄD
   ========================================================= */

function pokazBlad(
    tytul,
    opis
) {

    document.getElementById(
        "numerLinii"
    ).textContent =
        "Błąd";


    document.getElementById(
        "trasa"
    ).textContent =
        "";


    document.getElementById(
        "kierunki"
    ).innerHTML =
        "";


    document.getElementById(
        "typRozkladu"
    ).style.display =
        "none";


    document.getElementById(
        "przystanki"
    ).innerHTML =

        '<div class="blad">' +

        '<strong>' +
        tytul +
        '</strong>' +

        opis +

        '</div>';

}


/* =========================================================
   PRZYCISK WSTECZ / HISTORIA PRZEGLĄDARKI
   ========================================================= */

window.addEventListener(
    "popstate",
    function() {

        const url =
            new URL(
                window.location.href
            );


        const parametrKierunku =
            url.searchParams.get(
                "kierunek"
            );


        const parametrPrzystanku =
            url.searchParams.get(
                "przystanek"
            );


        const liczbaKierunku =
            Number(
                parametrKierunku
            );


        aktualnyKierunek =
            Number.isInteger(
                liczbaKierunku
            ) &&
            liczbaKierunku >= 0
                ?
                liczbaKierunku
                :
                0;


        wybranyPrzystanek =
            null;


        const rozklad =
            znajdzRozklad();


        if (
            parametrPrzystanku &&
            rozklad &&
            Array.isArray(
                rozklad.kierunki
            )
        ) {

            const kierunek =
                rozklad.kierunki[
                    aktualnyKierunek
                ];


            if (
                kierunek &&
                Array.isArray(
                    kierunek.przystanki
                )
            ) {

                const znaleziony =
                    kierunek.przystanki.find(
                        function(przystanek) {

                            return String(
                                przystanek.nr ?? ""
                            ).trim()
                            ===
                            String(
                                parametrPrzystanku
                            ).trim();

                        }
                    );


                if (znaleziony) {

                    wybranyPrzystanek =
                        znaleziony;

                }

            }

        }


        pokazRozklad();

    }
);
