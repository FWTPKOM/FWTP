<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rozkład jazdy</title>
<link rel="stylesheet" href="../css/style.css">

<!-- =========================================================
     CZCIONKA BARLOW SEMI CONDENSED
     ========================================================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600&display=swap" rel="stylesheet">

<style>
/* =========================================================
   GŁÓWNY KONTENER
   ========================================================= */
.rozkład {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px;
}

/* =========================================================
   POWRÓT
   ========================================================= */
.powrot {
    display: inline-block;
    margin-bottom: 20px;
    color: #0066cc;
    text-decoration: none;
    font-weight: bold;
}
.powrot:hover {
    text-decoration: underline;
}

/* =========================================================
   NAGŁÓWEK LINII
   ========================================================= */
.naglowek-linii {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 25px;
    margin-bottom: 15px;
}
.numer-linii {
    font-size: 42px;
    font-weight: bold;
    margin: 0 0 8px 0;
}
.trasa {
    font-size: 19px;
    font-weight: bold;
    margin: 0;
    white-space: pre-line;
}

/* =========================================================
   KIERUNKI
   ========================================================= */
.kierunki {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}
.kierunek-btn {
    flex: 1;
    padding: 14px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    transition: 0.15s;
}
.kierunek-btn:hover {
    border-color: #0066cc;
}
.kierunek-btn.aktywny {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
}

/* =========================================================
   WARIANTY (Zgodnie z oryginalnym designem)
   ========================================================= */
.warianty-pojemnik {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px 25px;
    margin-bottom: 15px;
}
.warianty-info {
    font-size: 15px;
    color: #555;
}
.warianty-info strong {
    color: #000;
}
.warianty-przyciski {
    display: flex;
    gap: 5px;
}
.wariant-btn {
    padding: 8px 16px;
    font-size: 18px;
    font-weight: 900;
    color: #706f6f;
    background: transparent;
    border: none;
    border-bottom: 4px solid transparent;
    cursor: pointer;
    transition: 0.15s;
    font-family: inherit;
}
.wariant-btn:hover {
    color: #d61c12;
}
.wariant-btn.aktywny {
    color: #d61c12;
    border-bottom-color: #d61c12;
}

@media (max-width: 550px) {
    .warianty-pojemnik {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 15px;
    }
}

/* =========================================================
   DNI
   ========================================================= */
.dni {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}
.dzien-btn {
    padding: 12px 20px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}
.dzien-btn:hover {
    border-color: #0066cc;
}
.dzien-btn.aktywny {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
}

/* =========================================================
   KALENDARZ
   ========================================================= */
.kalendarz {
    display: none;
    background: white;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 15px;
    margin-bottom: 15px;
}
.kalendarz input {
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

/* =========================================================
   TYP ROZKŁADU
   ========================================================= */
.typ-rozkładu {
    background: #f7f7f7;
    border: 1px solid #ddd;
    padding: 12px 15px;
    margin-bottom: 15px;
    border-radius: 6px;
    font-size: 14px;
    color: #555;
}

/* =========================================================
   LISTA PRZYSTANKÓW
   ========================================================= */
.przystanki {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* =========================================================
   PRZYSTANEK
   ========================================================= */
.przystanek {
    background: white;
    border: 1px solid #ddd;
    border-radius: 7px;
    overflow: hidden;
}
.przystanek-naglowek {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #f2f2f2;
    padding: 13px 15px;
    border-bottom: 1px solid #ddd;
}
.lp {
    min-width: 35px;
    font-weight: bold;
    color: #666;
}
.nazwa-przystanku {
    font-weight: bold;
    font-size: 17px;
}
.numer-przystanku {
    margin-left: auto;
    color: #777;
    font-size: 13px;
}

/* =========================================================
   GODZINY
   ========================================================= */
.godziny {
    width: 100%;
}
.wiersz-godziny {
    display: grid;
    grid-template-columns: 43px repeat(10, 46px);
    grid-auto-columns: 46px;
    min-height: 38px;
    border-bottom: 1px solid #eee;
}

/* =========================================================
   GODZINA
   ========================================================= */
.kolumna-godzina {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Barlow Semi Condensed", sans-serif;
    font-size: 16px;
    font-weight: 600;
    background: #555;
    color: white;
    border-right: 1px solid #444;
    min-height: 38px;
}

/* =========================================================
   KOMÓRKA MINUTY
   ========================================================= */
.kolumna-minuta {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    min-height: 38px;
    font-family: "Barlow Semi Condensed", sans-serif;
    font-weight: 600;
    white-space: nowrap;
    width: 46px;
    min-width: 46px;
    max-width: 46px;
    overflow: visible;
    color: black;
    transform: translateX(10px);
    cursor: pointer;
}
.kolumna-minuta:hover {
    background: #e8eef5;
}

/* =========================================================
   MINUTA + WARIANT
   ========================================================= */
.minuta-z-wariantem {
    position: relative;
    display: inline-block;
    line-height: 1;
    text-align: center;
}
.minuta {
    display: inline-block;
    font-family: "Barlow Semi Condensed", sans-serif;
    font-size: 16px;
    font-weight: 600;
    line-height: 1;
    color: inherit;
    position: relative;
    z-index: 1;
}
.wariant-minuty {
    position: absolute;
    left: calc(100% + 2px);
    bottom: -1px;
    font-family: "Barlow Semi Condensed", sans-serif;
    font-size: 12px;
    line-height: 1;
    font-weight: 600;
    color: inherit;
    white-space: nowrap;
    z-index: 2;
}

/* =========================================================
   LEGENDA WARIANTÓW
   ========================================================= */
.legenda-wariantow {
    background: #f7f7f7;
    border-top: 1px solid #ddd;
    padding: 10px 15px;
    font-size: 16px;
    color: #555;
    font-family: "Barlow Semi Condensed", sans-serif;
    font-weight: 600;
}
.legenda-lista {
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.legenda-element {
    display: flex;
    align-items: baseline;
    gap: 6px;
    line-height: 1.35;
    font-family: "Barlow Semi Condensed", sans-serif;
    font-weight: 600;
}
.legenda-litera {
    min-width: 22px;
    font-weight: 600;
    color: black;
    font-family: "Barlow Semi Condensed", sans-serif;
    font-size: 16px;
}
.legenda-separator {
    color: black;
    font-family: "Barlow Semi Condensed", sans-serif;
    font-size: 16px;
    font-weight: 600;
}
.legenda-opis {
    color: black;
    font-weight: 600;
    font-family: "Barlow Semi Condensed", sans-serif;
    font-size: 15px;
}

/* =========================================================
   BRAK GODZIN / BŁĘDY
   ========================================================= */
.brak-godzin {
    padding: 15px;
    color: #777;
    font-size: 14px;
}
.loading {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 30px;
    text-align: center;
    color: #666;
}
.blad {
    background: #fff4f4;
    border: 1px solid #e0aaaa;
    color: #a00000;
    border-radius: 8px;
    padding: 20px;
    line-height: 1.6;
}
.blad strong {
    display: block;
    margin-bottom: 8px;
}
.brak-danych {
    padding: 30px;
    text-align: center;
    color: #777;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
}

/* =========================================================
   WIZUALNA OŚ TRASY (TIMELINE WTP)
   ========================================================= */
.node-wrapper {
    width: 34px;
    display: flex;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
}
.linia-pionowa {
    position: absolute;
    width: 2px;
    background-color: #000;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
}
.linia-pionowa.start { top: 50%; bottom: 0; }
.linia-pionowa.middle { top: 0; bottom: 0; }
.linia-pionowa.end { top: 0; bottom: 50%; }

.wezel {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
}
.wezel.square {
    width: 12px;
    height: 12px;
    border-radius: 1px;
}
.wezel.circle {
    width: 12px;
    height: 12px;
    border-radius: 50%;
}
.wezel.nz {
    width: 8px;  /* Niezamalowana kropka "na żądanie" */
    height: 8px;
    border-radius: 50%;
    background-color: #fff;
    border: 2px solid #e42313;
}
.bg-black { background-color: #000; }
.bg-red { background-color: #e42313; }

/* =========================================================
   WIDOK LISTY PRZYSTANKÓW
   ========================================================= */
.lista-przystankow {
    display: flex;
    flex-direction: column;
    gap: 0; /* Zwarte dla osi */
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
    background: white;
}
.przystanek-btn {
    width: 100%;
    display: flex;
    align-items: stretch;
    padding: 0;
    background: white;
    border: none;
    border-bottom: 1px solid #eee;
    cursor: pointer;
    text-align: left;
    transition: 0.15s;
    font-family: inherit;
    min-height: 48px;
}
.przystanek-btn:last-child {
    border-bottom: none;
}
.przystanek-btn:hover {
    background: #f8fbff;
}
.przystanek-btn:hover .przystanek-nazwa {
    color: #0066cc;
}
.przystanek-btn .lp {
    width: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #777;
}
.przystanek-btn .przystanek-nazwa {
    flex: 1;
    display: flex;
    align-items: center;
    font-size: 16px;
    font-weight: bold;
    color: #222;
    padding-left: 10px;
    transition: color 0.15s;
}
.przystanek-btn .przystanek-nr {
    color: #777;
    font-size: 13px;
    display: flex;
    align-items: center;
    padding: 0 15px;
}

.powrot-przystanki {
    margin-bottom: 15px;
}
.powrot-przystanki button {
    border: none;
    background: none;
    padding: 0;
    color: #0066cc;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
}
.powrot-przystanki button:hover {
    text-decoration: underline;
}
.naglowek-przystanku-widok {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 15px;
}
.naglowek-przystanku-widok .nazwa {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 5px;
}
.naglowek-przystanku-widok .numer {
    color: #777;
    font-size: 14px;
}

/* =========================================================
   WIDOK CAŁEGO KURSU
   ========================================================= */
.kurs-widok {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 15px;
}
.kurs-naglowek {
    background: #555;
    color: white;
    padding: 15px;
    font-family: "Barlow Semi Condensed", sans-serif;
}
.kurs-naglowek .kurs-tytul {
    font-size: 22px;
    margin-bottom: 5px;
    font-weight: 600;
}
.kurs-naglowek .kurs-informacja {
    font-size: 15px;
    opacity: 0.9;
}
.kurs-lista {
    display: flex;
    flex-direction: column;
}
.kurs-przystanek {
    display: flex;
    align-items: stretch;
    min-height: 48px;
    border-bottom: 1px solid #eee;
}
.kurs-przystanek:last-child {
    border-bottom: none;
}
.kurs-przystanek.aktywny {
    background: #f2f2f2;
}

.kurs-czas-rel {
    width: 60px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 12px;
    color: #888;
    font-size: 13px;
}
.kurs-nazwa-box {
    flex: 1;
    display: flex;
    align-items: center;
    padding-left: 10px;
    font-size: 15px;
    font-weight: bold;
}
.kurs-nazwa-box span {
    font-weight: normal;
    color: #777;
    font-size: 13px;
    margin-left: 6px;
}
.kurs-czas-abs {
    width: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 15px;
}

/* =========================================================
   RESPONSYWNOŚĆ (TELEFON / TABLET)
   ========================================================= */
@media (max-width: 800px) {
    .wiersz-godziny {
        grid-template-columns: 38px repeat(6, 46px);
    }
}
@media (max-width: 550px) {
    .rozkład { margin: 15px auto; }
    .numer-linii { font-size: 34px; }
    .trasa { font-size: 16px; }
    .kierunki { flex-direction: column; }
    .dni { flex-wrap: wrap; }
    .dzien-btn { flex: 1; padding: 11px 10px; }

    .wiersz-godziny {
        grid-template-columns: 36px repeat(4, 46px);
        min-height: 36px;
        overflow-x: auto;
    }
    .kolumna-godzina { font-size: 14px; min-height: 36px; }
    .kolumna-minuta { width: 46px; min-width: 46px; max-width: 46px; min-height: 36px; }
    .minuta { font-size: 15px; }

    .przystanek-btn .przystanek-nazwa { font-size: 15px; }
    .naglowek-przystanku-widok .nazwa { font-size: 22px; }
    
    .kurs-czas-rel { width: 50px; padding-right: 8px; font-size: 12px; }
    .kurs-czas-abs { width: 50px; font-size: 14px; }
    .kurs-nazwa-box { font-size: 14px; padding-left: 6px; }
}
</style>
</head>

<body>

<header class="topbar">
    <div class="logo">FWTP</div>
    <nav>
        <a href="../">Strona główna</a>
        <a href="../linie/">Linie</a>
    </nav>
</header>

<main class="rozkład">

<a class="powrot" href="../linie/">← Linie</a>

<section class="naglowek-linii">
    <h1 id="numerLinii" class="numer-linii">Ładowanie...</h1>
    <p id="trasa" class="trasa">Pobieranie danych...</p>
</section>

<div id="kierunki" class="kierunki"></div>

<!-- Dodany pojemnik na warianty -->
<div id="warianty-pojemnik" class="warianty-pojemnik" style="display:none;">
    <div class="warianty-info"><strong>Uwaga!</strong> Ta linia ma różne warianty trasy.</div>
    <div id="warianty-przyciski" class="warianty-przyciski"></div>
</div>

<div class="dni" style="display:none;">
    <button id="dzisiajBtn" class="dzien-btn aktywny" onclick="wybierzDzien('dzisiaj')">DZISIAJ</button>
    <button id="jutroBtn" class="dzien-btn" onclick="wybierzDzien('jutro')">JUTRO</button>
    <button id="kalendarzBtn" class="dzien-btn" onclick="wybierzDzien('kalendarz')">KALENDARZ</button>
</div>

<div id="kalendarz" class="kalendarz">
    <input type="date" id="wybranaData">
</div>

<div id="powrotPrzystanki" class="powrot-przystanki" style="display:none;">
    <button onclick="pokazListePrzystankowZPowrotem()">← Przystanki</button>
</div>

<div id="typRozkladu" class="typ-rozkładu">Ładowanie rozkładu...</div>

<div id="przystanki" class="przystanki">
    <div class="loading">Ładowanie przystanków...</div>
</div>

</main>

<script>
/* =========================================================
   FWTP – ROZKŁAD JAZDY (v4.0 - Warianty A/B i kropki "Na Żądanie")
   ========================================================= */

let daneLinii = null;
let numerLinii = null;
let aktualnyKierunek = 0;
let aktualnyWariant = null; // Filtrowanie widoku
let aktualnyDzien = "dzisiaj";
let wybranaData = new Date();
let wybranyPrzystanek = null;

const parametry = new URLSearchParams(window.location.search);
numerLinii = parametry.get("linia");

if (!numerLinii) {
    pokazBlad("Nie podano numeru linii.", "Użyj adresu w rodzaju: ?linia=102");
} else {
    document.getElementById("numerLinii").textContent = numerLinii;
    pobierzDane();
}

function usunPoleGodziny(tekst) {
    const pozycja = tekst.search(/"godziny"\s*:\s*\[/);
    if (pozycja === -1) return tekst;
    const poczatekTablicy = tekst.indexOf("[", pozycja);
    if (poczatekTablicy === -1) return tekst;

    let poziom = 0;
    let wStringu = false;
    let ucieczka = false;
    let koniecTablicy = -1;

    for (let i = poczatekTablicy; i < tekst.length; i++) {
        const znak = tekst[i];
        if (ucieczka) { ucieczka = false; continue; }
        if (znak === "\\" && wStringu) { ucieczka = true; continue; }
        if (znak === '"') { wStringu = !wStringu; continue; }
        if (wStringu) continue;
        if (znak === "[") poziom++;
        if (znak === "]") {
            poziom--;
            if (poziom === 0) { koniecTablicy = i; break; }
        }
    }

    if (koniecTablicy === -1) return tekst;

    let poczatek = pozycja;
    let koniec = koniecTablicy + 1;

    while (koniec < tekst.length && /\s/.test(tekst[koniec])) koniec++;
    if (tekst[koniec] === ",") koniec++;

    let wynik = tekst.substring(0, poczatek) + tekst.substring(koniec);
    wynik = wynik.replace(/,\s*,/g, ",");
    wynik = wynik.replace(/,\s*}/g, "}");
    return wynik;
}

async function pobierzDane() {
    const adres = "../dane/" + encodeURIComponent(numerLinii) + ".json";
    console.log("FWTP – pobieram:", adres);

    try {
        const odpowiedz = await fetch(adres, { cache: "no-cache" });
        if (!odpowiedz.ok) throw new Error("HTTP " + odpowiedz.status + " – nie znaleziono pliku " + numerLinii + ".json");
        let tekst = await odpowiedz.text();
        if (!tekst.trim()) throw new Error("Plik JSON jest pusty.");

        try {
            daneLinii = JSON.parse(tekst);
        } catch (pierwszyBlad) {
            console.warn("FWTP – zwykły JSON.parse nie powiódł się.");
            const oczyszczonyJSON = usunPoleGodziny(tekst);
            try {
                daneLinii = JSON.parse(oczyszczonyJSON);
            } catch (drugiBlad) {
                throw new Error("JSON jest nieprawidłowy. Błąd: " + drugiBlad.message);
            }
        }

        if (!daneLinii || typeof daneLinii !== "object") throw new Error("JSON nie zawiera obiektu danych.");
        if (!Array.isArray(daneLinii.rozkłady)) throw new Error("JSON nie zawiera tablicy „rozkłady”.");

        console.log("FWTP – JSON załadowany poprawnie:", daneLinii);
        uruchomStrone();
    } catch (blad) {
        console.error("FWTP – BŁĄD:", blad);
        pokazBlad("Nie udało się załadować linii " + numerLinii + ".", blad.message);
    }
}

function uruchomStrone() {
    document.getElementById("numerLinii").textContent = daneLinii.linia || numerLinii;
    document.getElementById("trasa").textContent = daneLinii.trasa || ("Rozkład jazdy linii " + numerLinii);

    wybranaData = new Date();
    aktualnyKierunek = 0;
    aktualnyWariant = null;
    wybranyPrzystanek = null;

    const parametrKierunku = parametry.get("kierunek");
    if (parametrKierunku !== null && parametrKierunku !== "") {
        const liczbaKierunku = Number(parametrKierunku);
        if (Number.isInteger(liczbaKierunku) && liczbaKierunku >= 0) {
            aktualnyKierunek = liczbaKierunku;
        }
    }

    const parametrPrzystanku = parametry.get("przystanek");
    if (parametrPrzystanku) {
        const rozklad = znajdzRozklad();
        if (rozklad && Array.isArray(rozklad.kierunki)) {
            const kierunek = rozklad.kierunki[aktualnyKierunek];
            if (kierunek && Array.isArray(kierunek.przystanki)) {
                let znaleziony = kierunek.przystanki.find(function(przystanek) {
                    return String(przystanek.nr ?? "").trim() === String(parametrPrzystanku).trim();
                });
                if (!znaleziony) {
                    const indeks = Number(parametrPrzystanku);
                    if (Number.isInteger(indeks) && indeks >= 0 && indeks < kierunek.przystanki.length) {
                        znaleziony = kierunek.przystanki[indeks];
                    }
                }
                if (znaleziony) wybranyPrzystanek = znaleziony;
            }
        }
    }
    pokazRozklad();
}

function normalizujTekst(tekst) {
    return String(tekst || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function okreslTypDnia(data) {
    const dzien = data.getDay();
    if (dzien === 6) return "sobota";
    if (dzien === 0) return "niedziela";
    return "roboczy";
}

function znajdzRozklad() {
    const rozklady = daneLinii.rozkłady || [];
    if (rozklady.length === 0) return null;

    const typDnia = okreslTypDnia(wybranaData);

    if (typDnia === "sobota") {
        for (const rozklad of rozklady) {
            const nazwa = normalizujTekst(rozklad.nazwa);
            if (nazwa.includes("sobot")) return rozklad;
        }
    }

    if (typDnia === "niedziela") {
        for (const rozklad of rozklady) {
            const nazwa = normalizujTekst(rozklad.nazwa);
            if (nazwa.includes("niedziel")) return rozklad;
        }
        for (const rozklad of rozklady) {
            const nazwa = normalizujTekst(rozklad.nazwa);
            if ((nazwa.includes("sobot") && nazwa.includes("niedziel")) || nazwa.includes("swieta") || nazwa.includes("swiat")) {
                return rozklad;
            }
        }
    }

    if (typDnia === "roboczy") {
        for (const rozklad of rozklady) {
            const nazwa = normalizujTekst(rozklad.nazwa);
            if (nazwa.includes("poniedzialku do piatku") || nazwa.includes("poniedzialku") || nazwa.includes("poniedzialek") || (nazwa.includes("piat") && !nazwa.includes("sobot"))) {
                return rozklad;
            }
        }
    }
    return rozklady[0];
}

function generujKierunki() {
    const kontener = document.getElementById("kierunki");
    kontener.innerHTML = "";
    const rozklad = znajdzRozklad();
    if (!rozklad || !Array.isArray(rozklad.kierunki)) return;

    rozklad.kierunki.forEach(function(kierunek, index) {
        const przycisk = document.createElement("button");
        przycisk.className = "kierunek-btn";
        if (index === aktualnyKierunek) przycisk.classList.add("aktywny");

        const przystanki = Array.isArray(kierunek.przystanki) ? kierunek.przystanki : [];
        let nazwaKierunku = "";
        if (przystanki.length > 0) {
            const ostatni = przystanki[przystanki.length - 1];
            nazwaKierunku = ostatni.nazwa || "";
        }
        if (!nazwaKierunku) nazwaKierunku = "Kierunek " + (index + 1);

        przycisk.textContent = nazwaKierunku;
        przycisk.onclick = function() { zmienKierunek(index); };
        kontener.appendChild(przycisk);
    });
}

function zmienKierunek(index) {
    aktualnyKierunek = index;
    aktualnyWariant = null; // Resetujemy wariant po zmianie kierunku
    wybranyPrzystanek = null;
    const url = new URL(window.location.href);
    url.searchParams.set("kierunek", String(index));
    url.searchParams.delete("przystanek");
    window.history.pushState({}, "", url);
    pokazRozklad();
}

function wybierzDzien(dzien) {
    aktualnyDzien = dzien;
    document.querySelectorAll(".dzien-btn").forEach(function(przycisk) {
        przycisk.classList.remove("aktywny");
    });
    const kalendarz = document.getElementById("kalendarz");
    kalendarz.style.display = "none";

    if (dzien === "dzisiaj") {
        document.getElementById("dzisiajBtn").classList.add("aktywny");
        wybranaData = new Date();
    }
    if (dzien === "jutro") {
        document.getElementById("jutroBtn").classList.add("aktywny");
        wybranaData = new Date();
        wybranaData.setDate(wybranaData.getDate() + 1);
    }
    if (dzien === "kalendarz") {
        document.getElementById("kalendarzBtn").classList.add("aktywny");
        kalendarz.style.display = "block";
        document.getElementById("wybranaData").value = formatujDateInput(wybranaData);
    }

    const rozklad = znajdzRozklad();
    if (!rozklad || !rozklad.kierunki || !rozklad.kierunki[aktualnyKierunek]) {
        aktualnyKierunek = 0;
    }
    pokazRozklad();
}

document.getElementById("wybranaData").addEventListener("change", function() {
    if (!this.value) return;
    const czesci = this.value.split("-");
    wybranaData = new Date(Number(czesci[0]), Number(czesci[1]) - 1, Number(czesci[2]));
    const rozklad = znajdzRozklad();
    if (!rozklad || !rozklad.kierunki || !rozklad.kierunki[aktualnyKierunek]) {
        aktualnyKierunek = 0;
    }
    pokazRozklad();
});

function pobierzDaneWariantu(kurs) {
    if (!kurs || typeof kurs !== "object") return { litera: "", opis: "" };
    let wariant = kurs.wariant;
    let litera = "";
    let opis = "";

    if (wariant && typeof wariant === "object") {
        litera = wariant.litera || wariant.nazwa || wariant.symbol || wariant.wariant || wariant.oznaczenie || "";
        opis = wariant.opis || wariant.tekst || wariant.opisWariantu || wariant.description || "";
    } else {
        litera = String(wariant || "").trim();
    }
    litera = String(litera).trim();

    if (litera && daneLinii && Array.isArray(daneLinii.rozkłady)) {
        const rozklad = znajdzRozklad();
        if (rozklad && Array.isArray(rozklad.warianty)) {
            const znaleziony = rozklad.warianty.find(function(w) {
                if (!w || typeof w !== "object") return false;
                const literaWariantu = String(w.litera || w.nazwa || w.symbol || w.wariant || w.oznaczenie || "").trim();
                return (literaWariantu.toUpperCase() === litera.toUpperCase());
            });
            if (znaleziony) {
                opis = znaleziony.opis || znaleziony.tekst || znaleziony.opisWariantu || znaleziony.description || znaleziony.description_pl || "";
            }
        }
    }
    if (!opis) {
        opis = kurs.wariantOpis || kurs.opisWariantu || kurs.wariant_Opis || kurs.opis || kurs.uwagi || kurs.uwaga || "";
    }
    return { litera: String(litera).trim(), opis: String(opis).trim() };
}

function pobierzWariant(kurs) {
    return pobierzDaneWariantu(kurs).litera;
}

function zbierzWariantyPrzystanku(przystanek) {
    const warianty = new Map();
    if (!przystanek || !Array.isArray(przystanek.kursy)) return warianty;

    przystanek.kursy.forEach(function(kurs) {
        const dane = pobierzDaneWariantu(kurs);
        if (!dane.litera) return;
        if (!warianty.has(dane.litera)) {
            warianty.set(dane.litera, dane.opis);
        } else {
            if (!warianty.get(dane.litera) && dane.opis) warianty.set(dane.litera, dane.opis);
        }
    });
    return warianty;
}

function utworzLegendePrzystanku(przystanek) {
    const warianty = zbierzWariantyPrzystanku(przystanek);
    if (warianty.size === 0) return null;

    const legenda = document.createElement("div");
    legenda.className = "legenda-wariantow";
    const lista = document.createElement("div");
    lista.className = "legenda-lista";

    warianty.forEach(function(opis, litera) {
        const element = document.createElement("div");
        element.className = "legenda-element";
        
        const symbol = document.createElement("span");
        symbol.className = "legenda-litera";
        symbol.textContent = litera;
        element.appendChild(symbol);

        if (opis) {
            const separator = document.createElement("span");
            separator.className = "legenda-separator";
            separator.textContent = " - ";
            element.appendChild(separator);

            const opisElement = document.createElement("span");
            opisElement.className = "legenda-opis";
            opisElement.textContent = opis;
            element.appendChild(opisElement);
        }
        lista.appendChild(element);
    });

    legenda.appendChild(lista);
    return legenda;
}

// Funkcja pomocnicza: zbiera wszystkie dostępne literki wariantów dla danego kierunku
function zbierzWariantyDlaKierunku(kierunek) {
    const znalezione = new Set();
    if (!kierunek || !Array.isArray(kierunek.przystanki)) return [];
    
    kierunek.przystanki.forEach(function(p) {
        if (Array.isArray(p.kursy)) {
            p.kursy.forEach(function(k) {
                const litera = pobierzWariant(k);
                if (litera && String(litera).trim() !== "") {
                    znalezione.add(String(litera).trim());
                }
            });
        }
    });
    return Array.from(znalezione).sort();
}

function pokazRozklad() {
    if (!daneLinii) return;
    const rozklad = znajdzRozklad();
    const kontener = document.getElementById("przystanki");
    const typ = document.getElementById("typRozkladu");
    const powrot = document.getElementById("powrotPrzystanki");

    if (!rozklad) {
        typ.style.display = "block";
        typ.textContent = "Brak rozkładu";
        powrot.style.display = "none";
        kontener.innerHTML = '<div class="brak-danych">Brak danych rozkładu.</div>';
        document.getElementById("warianty-pojemnik").style.display = "none";
        return;
    }

    const kierunki = rozklad.kierunki || [];
    if (kierunki.length === 0) {
        typ.style.display = "block";
        typ.textContent = "Brak kierunków";
        powrot.style.display = "none";
        kontener.innerHTML = '<div class="brak-danych">Ten rozkład nie zawiera kierunków.</div>';
        document.getElementById("warianty-pojemnik").style.display = "none";
        return;
    }

    if (aktualnyKierunek < 0 || aktualnyKierunek >= kierunki.length) aktualnyKierunek = 0;
    generujKierunki();

    if (!wybranyPrzystanek) {
        pokazListePrzystankow(rozklad);
        return;
    }

    const kierunek = kierunki[aktualnyKierunek];
    const przystanki = Array.isArray(kierunek.przystanki) ? kierunek.przystanki : [];
    let aktualnyPrzystanek = null;

    if (wybranyPrzystanek.nr !== undefined && wybranyPrzystanek.nr !== null) {
        aktualnyPrzystanek = przystanki.find(function(przystanek) {
            return String(przystanek.nr ?? "").trim() === String(wybranyPrzystanek.nr).trim();
        });
    }

    if (!aktualnyPrzystanek) {
        aktualnyPrzystanek = przystanki.find(function(przystanek) {
            return (String(przystanek.nazwa ?? "").trim() === String(wybranyPrzystanek.nazwa ?? "").trim() &&
                    String(przystanek.lp ?? "").trim() === String(wybranyPrzystanek.lp ?? "").trim());
        });
    }

    if (!aktualnyPrzystanek) {
        wybranyPrzystanek = null;
        pokazListePrzystankow(rozklad);
        return;
    }

    wybranyPrzystanek = aktualnyPrzystanek;
    pokazRozkladWybranegoPrzystanku(rozklad, aktualnyPrzystanek);
}

/* =========================================================
   LISTA PRZYSTANKÓW (Z Filtrowaniem Wariantów i NŻ)
   ========================================================= */
function pokazListePrzystankow(rozklad = null) {
    if (!rozklad) rozklad = znajdzRozklad();
    const kontener = document.getElementById("przystanki");
    const typ = document.getElementById("typRozkladu");
    const powrot = document.getElementById("powrotPrzystanki");
    const wariantyPojemnik = document.getElementById("warianty-pojemnik");
    const wariantyPrzyciski = document.getElementById("warianty-przyciski");

    if (!rozklad || !Array.isArray(rozklad.kierunki)) {
        kontener.innerHTML = '<div class="brak-danych">Brak danych przystanków.</div>';
        if(wariantyPojemnik) wariantyPojemnik.style.display = "none";
        return;
    }

    const kierunek = rozklad.kierunki[aktualnyKierunek];
    if (!kierunek) {
        kontener.innerHTML = '<div class="brak-danych">Brak wybranego kierunku.</div>';
        if(wariantyPojemnik) wariantyPojemnik.style.display = "none";
        return;
    }

    const przystanki = Array.isArray(kierunek.przystanki) ? kierunek.przystanki : [];
    wybranyPrzystanek = null;
    powrot.style.display = "none";

    const dni = document.querySelector(".dni");
    if (dni) dni.style.display = "none";
    const kalendarz = document.getElementById("kalendarz");
    if (kalendarz) kalendarz.style.display = "none";

    typ.style.display = "block";
    typ.textContent = "Wybierz przystanek";
    kontener.innerHTML = "";

    // Budowanie UI dla Wariantów (A, B, C...)
    if (wariantyPojemnik && wariantyPrzyciski) {
        const wariantyKierunku = zbierzWariantyDlaKierunku(kierunek);
        
        if (wariantyKierunku.length > 0) {
            wariantyPojemnik.style.display = "flex";
            wariantyPrzyciski.innerHTML = "";

            const btnAll = document.createElement("button");
            btnAll.className = "wariant-btn" + (aktualnyWariant === null ? " aktywny" : "");
            btnAll.textContent = "A B"; // Używamy "Wszystkie"
            btnAll.innerHTML = "Główna";
            btnAll.onclick = function() { aktualnyWariant = null; pokazRozklad(); };
            wariantyPrzyciski.appendChild(btnAll);

            wariantyKierunku.forEach(function(w) {
                const btn = document.createElement("button");
                btn.className = "wariant-btn" + (aktualnyWariant === w ? " aktywny" : "");
                btn.textContent = w;
                btn.onclick = function() { aktualnyWariant = w; pokazRozklad(); };
                wariantyPrzyciski.appendChild(btn);
            });
        } else {
            wariantyPojemnik.style.display = "none";
            aktualnyWariant = null;
        }
    }

    // Filtrowanie przystanków do widoku osi (jeśli wybrany jest konkretny wariant)
    let widocznePrzystanki = przystanki;
    if (aktualnyWariant !== null) {
        widocznePrzystanki = przystanki.filter(function(p) {
            if (!Array.isArray(p.kursy)) return false;
            return p.kursy.some(function(k) { return pobierzWariant(k) === aktualnyWariant; });
        });
    }

    const lista = document.createElement("div");
    lista.className = "lista-przystankow";

    if (widocznePrzystanki.length === 0) {
        lista.innerHTML = '<div class="brak-danych">Brak przystanków dla wybranego wariantu.</div>';
        kontener.appendChild(lista);
        return;
    }

    widocznePrzystanki.forEach(function(przystanek, index) {
        const przycisk = document.createElement("button");
        przycisk.type = "button";
        przycisk.className = "przystanek-btn";

        const lp = document.createElement("div");
        lp.className = "lp";
        lp.textContent = przystanek.lp || (index + 1);

        // Oś trasy (linia i kropka)
        const nodeWrapper = document.createElement("div");
        nodeWrapper.className = "node-wrapper";
        
        const line = document.createElement("div");
        let lineClass = "middle";
        if (index === 0) lineClass = "start";
        if (index === widocznePrzystanki.length - 1) lineClass = "end";
        line.className = "linia-pionowa " + lineClass;

        // Logika Przystanku na Żądanie (flaga lub dopisek NŻ)
        const isNaZadanie = przystanek.naZadanie === true || przystanek.nz === true || (przystanek.nazwa && String(przystanek.nazwa).includes("(NŻ)"));

        const icon = document.createElement("div");
        icon.className = "wezel ";
        if (index === 0) icon.className += "square bg-black";
        else if (index === widocznePrzystanki.length - 1) icon.className += "square bg-red";
        else if (isNaZadanie) icon.className += "nz"; // Niezamalowana kropka na żądanie
        else icon.className += "circle bg-red";

        nodeWrapper.appendChild(line);
        nodeWrapper.appendChild(icon);

        const nazwa = document.createElement("div");
        nazwa.className = "przystanek-nazwa";
        nazwa.textContent = przystanek.nazwa || "Przystanek";

        const nr = document.createElement("div");
        nr.className = "przystanek-nr";
        if (przystanek.nr !== undefined && przystanek.nr !== null && String(przystanek.nr).trim() !== "") {
            nr.textContent = "nr " + przystanek.nr;
        }

        przycisk.appendChild(lp);
        przycisk.appendChild(nodeWrapper);
        przycisk.appendChild(nazwa);
        przycisk.appendChild(nr);

        przycisk.onclick = function() {
            wybierzPrzystanek(przystanek, index);
        };
        lista.appendChild(przycisk);
    });

    kontener.appendChild(lista);
}

function wybierzPrzystanek(przystanek, index) {
    if (!przystanek) return;
    wybranyPrzystanek = przystanek;
    const url = new URL(window.location.href);
    url.searchParams.set("kierunek", String(aktualnyKierunek));

    if (przystanek.nr !== undefined && przystanek.nr !== null && String(przystanek.nr).trim() !== "") {
        url.searchParams.set("przystanek", String(przystanek.nr));
    } else {
        url.searchParams.set("przystanek", String(index));
    }
    window.history.pushState({}, "", url);
    pokazRozklad();
}

function pokazListePrzystankowZPowrotem() {
    wybranyPrzystanek = null;
    const url = new URL(window.location.href);
    url.searchParams.delete("przystanek");
    window.history.pushState({}, "", url);
    pokazRozklad();
}

/* =========================================================
   PRZELICZNIK CZASU W MINUTACH
   ========================================================= */
function czasWMinutach(czasString) {
    if (!czasString) return 0;
    const parts = czasString.split(":");
    if (parts.length !== 2) return 0;
    return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
}

/* =========================================================
   WYŚWIETLANIE CAŁEGO KURSU (Oś czasu + NŻ)
   ========================================================= */
function pokazCalyKurs(numerKursu) {
    if (!daneLinii || !numerKursu) return;
    const rozklad = znajdzRozklad();
    if (!rozklad || !Array.isArray(rozklad.kierunki)) return;
    const kierunek = rozklad.kierunki[aktualnyKierunek];
    if (!kierunek || !Array.isArray(kierunek.przystanki)) return;

    const przystanki = kierunek.przystanki;
    const kursPrzystanki = [];

    przystanki.forEach(function(przystanek, index) {
        if (!przystanek || !Array.isArray(przystanek.kursy)) return;
        const kurs = przystanek.kursy.find(function(k) {
            if (!k || typeof k !== "object") return false;
            return String(k.numer ?? "").trim() === String(numerKursu).trim();
        });

        if (kurs) {
            kursPrzystanki.push({
                lp: przystanek.lp || index + 1,
                nazwa: przystanek.nazwa || "Przystanek",
                nr: przystanek.nr,
                naZadanie: przystanek.naZadanie,
                nz: przystanek.nz,
                czas: String(kurs.czas || "").trim(),
                kurs: kurs
            });
        }
    });

    const kontener = document.getElementById("przystanki");
    const typ = document.getElementById("typRozkladu");
    const powrot = document.getElementById("powrotPrzystanki");

    if (kursPrzystanki.length === 0) {
        kontener.innerHTML = '<div class="brak-danych">Nie znaleziono przystanków dla tego kursu.</div>';
        return;
    }

    const wariantyPojemnik = document.getElementById("warianty-pojemnik");
    if (wariantyPojemnik) wariantyPojemnik.style.display = "none"; // Chowamy warianty w tym widoku

    const dni = document.querySelector(".dni");
    if (dni) dni.style.display = "none";
    const kalendarz = document.getElementById("kalendarz");
    if (kalendarz) kalendarz.style.display = "none";

    typ.style.display = "block";
    typ.textContent = "Przebieg kursu";
    kontener.innerHTML = "";

    const widok = document.createElement("div");
    widok.className = "kurs-widok";

    const naglowek = document.createElement("div");
    naglowek.className = "kurs-naglowek";
    const tytul = document.createElement("div");
    tytul.className = "kurs-tytul";
    tytul.textContent = "Kurs " + numerKursu;
    const informacja = document.createElement("div");
    informacja.className = "kurs-informacja";
    informacja.textContent = "Przebieg przez " + kursPrzystanki.length + " przystanków";

    naglowek.appendChild(tytul);
    naglowek.appendChild(informacja);
    widok.appendChild(naglowek);

    const lista = document.createElement("div");
    lista.className = "kurs-lista";

    const pierwszyCzas = czasWMinutach(kursPrzystanki[0].czas);

    kursPrzystanki.forEach(function(element, index) {
        const wiersz = document.createElement("div");
        wiersz.className = "kurs-przystanek";

        if (wybranyPrzystanek && String(wybranyPrzystanek.nr ?? "").trim() === String(element.nr ?? "").trim()) {
            wiersz.classList.add("aktywny");
        }

        const aktualnyCzas = czasWMinutach(element.czas);
        let diff = aktualnyCzas - pierwszyCzas;
        if (diff < 0) diff += 24 * 60; // Nocne obejście

        const relTime = document.createElement("div");
        relTime.className = "kurs-czas-rel";
        relTime.textContent = diff + " min";

        // Logika Przystanku na Żądanie
        const isNaZadanie = element.naZadanie === true || element.nz === true || (element.nazwa && String(element.nazwa).includes("(NŻ)"));

        const nodeWrapper = document.createElement("div");
        nodeWrapper.className = "node-wrapper";
        
        const line = document.createElement("div");
        let lineClass = "middle";
        if (index === 0) lineClass = "start";
        if (index === kursPrzystanki.length - 1) lineClass = "end";
        line.className = "linia-pionowa " + lineClass;

        const icon = document.createElement("div");
        icon.className = "wezel ";
        if (index === 0) icon.className += "square bg-black";
        else if (index === kursPrzystanki.length - 1) icon.className += "square bg-red";
        else if (isNaZadanie) icon.className += "nz"; // Kropka NŻ
        else icon.className += "circle bg-red";

        nodeWrapper.appendChild(line);
        nodeWrapper.appendChild(icon);

        const nazwa = document.createElement("div");
        nazwa.className = "kurs-nazwa-box";
        nazwa.textContent = element.nazwa;

        if (element.nr !== undefined && element.nr !== null && String(element.nr).trim() !== "") {
            const nrSpan = document.createElement("span");
            nrSpan.textContent = element.nr;
            nazwa.appendChild(nrSpan);
        }

        const czas = document.createElement("div");
        czas.className = "kurs-czas-abs";
        czas.textContent = element.czas || "—";

        wiersz.appendChild(relTime);
        wiersz.appendChild(nodeWrapper);
        wiersz.appendChild(nazwa);
        wiersz.appendChild(czas); 
        lista.appendChild(wiersz);
    });

    widok.appendChild(lista);
    kontener.appendChild(widok);
}

function pokazRozkladWybranegoPrzystanku(rozklad, przystanek) {
    const kontener = document.getElementById("przystanki");
    const typ = document.getElementById("typRozkladu");
    const powrot = document.getElementById("powrotPrzystanki");
    const wariantyPojemnik = document.getElementById("warianty-pojemnik");
    if (wariantyPojemnik) wariantyPojemnik.style.display = "none"; // Chowamy warianty

    powrot.style.display = "block";

    const dni = document.querySelector(".dni");
    if (dni) dni.style.display = "flex";

    const kalendarz = document.getElementById("kalendarz");
    if (aktualnyDzien !== "kalendarz") kalendarz.style.display = "none";

    typ.style.display = "block";
    typ.textContent = rozklad.nazwa || "Rozkład jazdy";
    kontener.innerHTML = "";

    const naglowek = document.createElement("div");
    naglowek.className = "naglowek-przystanku-widok";
    const nazwa = document.createElement("div");
    nazwa.className = "nazwa";
    nazwa.textContent = przystanek.nazwa || "Przystanek";
    const nr = document.createElement("div");
    nr.className = "numer";
    if (przystanek.nr !== undefined && przystanek.nr !== null && String(przystanek.nr).trim() !== "") {
        nr.textContent = "nr " + przystanek.nr;
    }
    naglowek.appendChild(nazwa);
    naglowek.appendChild(nr);
    kontener.appendChild(naglowek);

    const blok = document.createElement("div");
    blok.className = "przystanek";
    const godziny = document.createElement("div");
    godziny.className = "godziny";

    const kursy = Array.isArray(przystanek.kursy) ? przystanek.kursy : [];

    if (kursy.length === 0) {
        godziny.innerHTML = '<div class="brak-godzin">Brak odjazdów</div>';
    } else {
        let aktualnaGodzina = null;
        let aktualnyWiersz = null;

        kursy.forEach(function(kurs) {
            if (!kurs || typeof kurs !== "object") return;
            const czas = String(kurs.czas || "").trim();
            const dopasowanie = czas.match(/^(\d{1,2}):(\d{2})$/);
            if (!dopasowanie) return;

            const godzina = Number(dopasowanie[1]);
            const minuta = dopasowanie[2];

            if (!Number.isFinite(godzina)) return;

            if (aktualnaGodzina === null || aktualnaGodzina !== godzina) {
                aktualnaGodzina = godzina;
                aktualnyWiersz = document.createElement("div");
                aktualnyWiersz.className = "wiersz-godziny";
                const kolumnaGodziny = document.createElement("div");
                kolumnaGodziny.className = "kolumna-godzina";
                kolumnaGodziny.textContent = String(godzina).padStart(2, "0");
                aktualnyWiersz.appendChild(kolumnaGodziny);
                godziny.appendChild(aktualnyWiersz);
            }

            const kolumna = document.createElement("div");
            kolumna.className = "kolumna-minuta";
            const minutaZWariantem = document.createElement("span");
            minutaZWariantem.className = "minuta-z-wariantem";
            const minutaElement = document.createElement("span");
            minutaElement.className = "minuta";
            minutaElement.textContent = minuta;
            minutaZWariantem.appendChild(minutaElement);

            const wariant = pobierzWariant(kurs);
            if (wariant) {
                const wariantElement = document.createElement("span");
                wariantElement.className = "wariant-minuty";
                wariantElement.textContent = wariant;
                minutaZWariantem.appendChild(wariantElement);
            }

            kolumna.appendChild(minutaZWariantem);

            if (kurs.numer) {
                kolumna.title = "Kliknij, aby zobaczyć cały kurs " + kurs.numer;
                kolumna.onclick = function() {
                    pokazCalyKurs(kurs.numer);
                };
            }

            if (aktualnyWiersz) aktualnyWiersz.appendChild(kolumna);
        });
    }

    blok.appendChild(godziny);
    const legenda = utworzLegendePrzystanku(przystanek);
    if (legenda) blok.appendChild(legenda);
    kontener.appendChild(blok);
}

function formatujDateInput(data) {
    const rok = data.getFullYear();
    const miesiac = String(data.getMonth() + 1).padStart(2, "0");
    const dzien = String(data.getDate()).padStart(2, "0");
    return rok + "-" + miesiac + "-" + dzien;
}

function pokazBlad(tytul, opis) {
    document.getElementById("numerLinii").textContent = "Błąd";
    document.getElementById("trasa").textContent = "";
    document.getElementById("kierunki").innerHTML = "";
    document.getElementById("typRozkladu").style.display = "none";
    document.getElementById("warianty-pojemnik").style.display = "none";
    document.getElementById("przystanki").innerHTML = '<div class="blad"><strong>' + tytul + '</strong>' + opis + '</div>';
}

window.addEventListener("popstate", function() {
    const url = new URL(window.location.href);
    const parametrKierunku = url.searchParams.get("kierunek");
    const parametrPrzystanku = url.searchParams.get("przystanek");
    const liczbaKierunku = Number(parametrKierunku);
    
    aktualnyKierunek = Number.isInteger(liczbaKierunku) && liczbaKierunku >= 0 ? liczbaKierunku : 0;
    wybranyPrzystanek = null;
    aktualnyWariant = null;

    const rozklad = znajdzRozklad();
    if (parametrPrzystanku && rozklad && Array.isArray(rozklad.kierunki)) {
        const kierunek = rozklad.kierunki[aktualnyKierunek];
        if (kierunek && Array.isArray(kierunek.przystanki)) {
            const znaleziony = kierunek.przystanki.find(function(przystanek) {
                return String(przystanek.nr ?? "").trim() === String(parametrPrzystanku).trim();
            });
            if (znaleziony) wybranyPrzystanek = znaleziony;
        }
    }
    pokazRozklad();
});
