<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rozkład jazdy</title>

<link rel="stylesheet" href="../css/style.css">

<style>

/* =========================================================
   GŁÓWNY KONTENER
   ========================================================= */

.rozkład {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px;
}


/* =========================================================
   POWRÓT
   ========================================================= */

.powrot {
    display: inline-block;
    margin-bottom: 20px;
    color: #0066cc;
    text-decoration: none;
    font-weight: bold;
}

.powrot:hover {
    text-decoration: underline;
}


/* =========================================================
   NAGŁÓWEK LINII
   ========================================================= */

.naglowek-linii {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 25px;
    margin-bottom: 15px;
}

.numer-linii {
    font-size: 42px;
    font-weight: bold;
    margin: 0 0 8px 0;
}

.trasa {
    font-size: 19px;
    font-weight: bold;
    margin: 0;
    white-space: pre-line;
}


/* =========================================================
   KIERUNKI
   ========================================================= */

.kierunki {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.kierunek-btn {
    flex: 1;
    padding: 14px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    transition: 0.15s;
}

.kierunek-btn:hover {
    border-color: #0066cc;
}

.kierunek-btn.aktywny {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
}


/* =========================================================
   DNI
   ========================================================= */

.dni {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.dzien-btn {
    padding: 12px 20px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.dzien-btn:hover {
    border-color: #0066cc;
}

.dzien-btn.aktywny {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
}


/* =========================================================
   KALENDARZ
   ========================================================= */

.kalendarz {
    display: none;
    background: white;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 15px;
    margin-bottom: 15px;
}

.kalendarz input {
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
}


/* =========================================================
   TYP ROZKŁADU
   ========================================================= */

.typ-rozkładu {
    background: #f7f7f7;
    border: 1px solid #ddd;
    padding: 12px 15px;
    margin-bottom: 15px;
    border-radius: 6px;
    font-size: 14px;
    color: #555;
}


/* =========================================================
   SCHEMAT TRASY – GŁÓWNY
   ========================================================= */

.lista-trasy {
    position: relative;
    background: #fff;
    border: 1px solid #ddd;
    padding: 20px 15px 20px 0;
    overflow: hidden;
}


/*
    Główna pionowa linia.
    Jej pozycja odpowiada punktom przystanków.
*/

.lista-trasy::before {
    content: "";
    position: absolute;

    left: 28px;
    top: 28px;
    bottom: 28px;

    width: 3px;

    background: #333;

    z-index: 0;
}


/* =========================================================
   WIERSZ PRZYSTANKU
   ========================================================= */

.wiersz-trasy {
    position: relative;

    min-height: 52px;

    display: flex;
    align-items: center;

    padding: 0 10px 0 0;

    z-index: 1;
}


/* =========================================================
   PUNKT
   ========================================================= */

.punkt-przystanku {
    width: 17px;
    height: 17px;

    margin-left: 20px;
    margin-right: 15px;

    flex: 0 0 17px;

    border-radius: 50%;

    background: white;

    border: 3px solid #333;

    box-sizing: border-box;

    z-index: 3;
}


/* =========================================================
   PRZYSTANEK
   ========================================================= */

.przystanek-trasy {
    width: 100%;

    border: none;
    background: transparent;

    padding: 8px 10px;

    display: flex;
    align-items: center;

    text-align: left;

    cursor: pointer;

    font-family: inherit;

    border-radius: 4px;

    transition: background .15s;
}

.przystanek-trasy:hover {
    background: #f2f5f8;
}


.nazwa-trasy {
    font-size: 16px;
    font-weight: 600;
    color: #222;
}


.nr-trasy {
    margin-left: 8px;

    color: #777;

    font-size: 12px;
}


/* =========================================================
   NUMER PORZĄDKOWY
   ========================================================= */

.lp-trasy {
    min-width: 35px;

    font-size: 12px;

    color: #888;

    text-align: right;

    margin-right: 4px;
}


/* =========================================================
   POCZĄTEK / KONIEC
   ========================================================= */

.wiersz-trasy.poczatek .punkt-przystanku {
    background: #333;
}

.wiersz-trasy.koniec .punkt-przystanku {
    background: #333;
}


/* =========================================================
   ODGAŁĘZIENIA
   ========================================================= */

.odgalecie-trasy {
    position: relative;

    margin-left: 28px;

    padding-left: 45px;

    border-left: 3px solid #aaa;

    margin-top: -1px;
    margin-bottom: -1px;

    background: #fafafa;
}


/*
    poziome wejście z głównej linii
*/

.odgalecie-trasy::before {
    content: "";

    position: absolute;

    left: -3px;
    top: 25px;

    width: 45px;
    height: 3px;

    background: #aaa;
}


/* =========================================================
   PRZYSTANKI W ODGAŁĘZIENIU
   ========================================================= */

.wiersz-odgalecia {
    position: relative;

    min-height: 48px;

    display: flex;
    align-items: center;
}


.wiersz-odgalecia .punkt-przystanku {
    margin-left: 0;
    margin-right: 12px;

    width: 15px;
    height: 15px;

    border-color: #888;
}


.wiersz-odgalecia .nazwa-trasy {
    color: #666;
    font-size: 15px;
}


/* =========================================================
   SZARE OZNACZENIE WARIANTU
   ========================================================= */

.oznaczenie-wariantu {
    margin-left: auto;

    display: flex;
    align-items: center;
    gap: 5px;

    padding-left: 10px;

    color: #888;

    font-size: 12px;

    white-space: nowrap;
}


.oznaczenie-wariantu-literka {
    font-weight: bold;

    border: 1px solid #aaa;

    border-radius: 3px;

    padding: 1px 4px;

    background: #f3f3f3;

    color: #666;
}


.oznaczenie-wariantu-opis {
    color: #888;
}


/* =========================================================
   LEGENDA SCHEMATU
   ========================================================= */

.legenda-trasy {
    margin-top: 15px;

    padding: 12px 15px;

    background: #f7f7f7;

    border-top: 1px solid #ddd;

    font-size: 13px;
}


.legenda-trasy-tytul {
    font-weight: bold;

    margin-bottom: 7px;

    color: #555;
}


.legenda-trasy-element {
    display: flex;

    gap: 7px;

    margin-bottom: 4px;

    color: #666;
}


.legenda-trasy-literka {
    min-width: 18px;

    font-weight: bold;
}


/* =========================================================
   OZNACZENIE PODJAZDU
   ========================================================= */

.podjazd-label {
    position: relative;

    margin-left: 73px;

    margin-top: 3px;
    margin-bottom: 3px;

    color: #888;

    font-size: 12px;

    font-style: italic;
}


/* =========================================================
   BRAK DANYCH
   ========================================================= */

.brak-danych {
    padding: 30px;

    text-align: center;

    color: #777;

    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;
}


/* =========================================================
   POWRÓT DO LISTY
   ========================================================= */

.powrot-przystanki {
    margin-bottom: 15px;
}

.powrot-przystanki button {
    border: none;

    background: none;

    padding: 0;

    color: #0066cc;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    font-family: inherit;
}

.powrot-przystanki button:hover {
    text-decoration: underline;
}


/* =========================================================
   NAGŁÓWEK PRZYSTANKU
   ========================================================= */

.naglowek-przystanku-widok {
    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;

    padding: 20px;

    margin-bottom: 15px;
}

.naglowek-przystanku-widok .nazwa {
    font-size: 26px;

    font-weight: bold;

    margin-bottom: 5px;
}

.naglowek-przystanku-widok .numer {
    color: #777;

    font-size: 14px;
}


/* =========================================================
   GODZINY
   ========================================================= */

.przystanek {
    background: white;

    border: 1px solid #ddd;

    border-radius: 7px;

    overflow: hidden;
}

.godziny {
    width: 100%;
}

.wiersz-godziny {
    display: grid;

    grid-template-columns:
        45px
        repeat(10, minmax(38px, 1fr));

    min-height: 40px;

    border-bottom: 1px solid #eee;
}

.kolumna-godzina {
    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 16px;

    font-weight: bold;

    background: #f7f7f7;

    border-right: 1px solid #ddd;

    min-height: 40px;
}

.kolumna-minuta {
    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    border-right: 1px solid #eee;

    position: relative;

    min-height: 40px;

    white-space: nowrap;

    overflow: visible;

    color: #222;
}

.kolumna-minuta:last-child {
    border-right: none;
}

.kolumna-minuta:hover {
    background: #f5f8fb;
}


/* =========================================================
   MINUTA
   ========================================================= */

.minuta-z-wariantem {
    position: relative;

    display: inline-block;

    line-height: 1;

    text-align: center;
}

.minuta {
    display: inline-block;

    font-size: 16px;

    font-weight: 400;

    line-height: 1;

    color: inherit;

    position: relative;

    z-index: 1;
}

.wariant-minuty {
    position: absolute;

    left: calc(100% + 2px);

    bottom: -1px;

    font-size: 12px;

    line-height: 1;

    font-weight: 400;

    color: inherit;

    white-space: nowrap;

    z-index: 2;
}


/* =========================================================
   LEGENDA WARIANTÓW PRZYSTANKU
   ========================================================= */

.legenda-wariantow {
    background: #f7f7f7;

    border-top: 1px solid #ddd;

    padding: 10px 15px;

    font-size: 13px;

    color: #555;
}

.legenda-lista {
    display: flex;

    flex-direction: column;

    gap: 4px;
}

.legenda-element {
    display: flex;

    align-items: baseline;

    gap: 6px;

    line-height: 1.35;
}

.legenda-litera {
    min-width: 18px;

    font-weight: bold;

    color: #333;
}

.legenda-opis {
    color: #555;

    font-weight: 400;
}


/* =========================================================
   BRAK GODZIN
   ========================================================= */

.brak-godzin {
    padding: 15px;

    color: #777;

    font-size: 14px;
}


/* =========================================================
   ŁADOWANIE
   ========================================================= */

.loading {
    background: white;

    border: 1px solid #ddd;

    border-radius: 8px;

    padding: 30px;

    text-align: center;

    color: #666;
}


/* =========================================================
   BŁĄD
   ========================================================= */

.blad {
    background: #fff4f4;

    border: 1px solid #e0aaaa;

    color: #a00000;

    border-radius: 8px;

    padding: 20px;

    line-height: 1.6;
}

.blad strong {
    display: block;

    margin-bottom: 8px;
}


/* =========================================================
   TELEFON
   ========================================================= */

@media (max-width: 700px) {

    .rozkład {
        margin: 15px auto;
    }

    .numer-linii {
        font-size: 34px;
    }

    .trasa {
        font-size: 16px;
    }

    .kierunki {
        flex-direction: column;
    }

    .dni {
        flex-wrap: wrap;
    }

    .dzien-btn {
        flex: 1;

        padding: 11px 10px;
    }

    .lista-trasy {
        padding-left: 0;
        padding-right: 5px;
    }

    .lista-trasy::before {
        left: 23px;
    }

    .punkt-przystanku {
        margin-left: 15px;
        margin-right: 11px;
    }

    .lp-trasy {
        min-width: 28px;
        font-size: 11px;
    }

    .nazwa-trasy {
        font-size: 15px;
    }

    .nr-trasy {
        font-size: 11px;
    }

    .oznaczenie-wariantu {
        display: none;
    }

    .odgalecie-trasy {
        margin-left: 23px;
        padding-left: 34px;
    }

    .odgalecie-trasy::before {
        width: 34px;
    }

    .podjazd-label {
        margin-left: 55px;
    }

    .wiersz-godziny {
        grid-template-columns:
            38px
            repeat(4, minmax(40px, 1fr));

        overflow-x: auto;
    }

    .kolumna-godzina {
        font-size: 14px;
        min-height: 38px;
    }

    .kolumna-minuta {
        min-height: 38px;
    }

    .minuta {
        font-size: 15px;
    }

    .wariant-minuty {
        font-size: 11px;
    }

}


/* =========================================================
   BARDZO MAŁY EKRAN
   ========================================================= */

@media (max-width: 450px) {

    .lp-trasy {
        display: none;
    }

    .punkt-przystanku {
        margin-left: 14px;
    }

    .lista-trasy::before {
        left: 22px;
    }

    .nazwa-trasy {
        font-size: 14px;
    }

}


/* =========================================================
   WIDOK PRZYSTANKU – UKRYWANIE SCHEMATU
   ========================================================= */

.widok-rozkładu-przystanku {
    width: 100%;
}

</style>

</head>


<body>


<header class="topbar">

    <div class="logo">
        FWTP
    </div>

    <nav>

        <a href="../">
            Strona główna
        </a>

        <a href="../linie/">
            Linie
        </a>

    </nav>

</header>


<main class="rozkład">


<a
    class="powrot"
    href="../linie/"
>
    ← Linie
</a>


<section class="naglowek-linii">

    <h1
        id="numerLinii"
        class="numer-linii"
    >
        Ładowanie...
    </h1>

    <p
        id="trasa"
        class="trasa"
    >
        Pobieranie danych...
    </p>

</section>


<div
    id="kierunki"
    class="kierunki"
></div>


<div class="dni" style="display:none;">

    <button
        id="dzisiajBtn"
        class="dzien-btn aktywny"
        onclick="wybierzDzien('dzisiaj')"
    >
        DZISIAJ
    </button>

    <button
        id="jutroBtn"
        class="dzien-btn"
        onclick="wybierzDzien('jutro')"
    >
        JUTRO
    </button>

    <button
        id="kalendarzBtn"
        class="dzien-btn"
        onclick="wybierzDzien('kalendarz')"
    >
        KALENDARZ
    </button>

</div>


<div
    id="kalendarz"
    class="kalendarz"
>

    <input
        type="date"
        id="wybranaData"
    >

</div>


<div
    id="powrotPrzystanki"
    class="powrot-przystanki"
    style="display:none;"
>

    <button onclick="pokazListePrzystankowZPowrotem()">
        ← Przystanki
    </button>

</div>


<div
    id="typRozkladu"
    class="typ-rozkładu"
>
    Ładowanie rozkładu...
</div>


<div
    id="przystanki"
    class="przystanki"
>

    <div class="loading">
        Ładowanie przystanków...
    </div>

</div>


</main>



<script>

/* =========================================================
   FWTP – ROZKŁAD JAZDY
   WERSJA ZE SCHEMATEM TRASY I WARIANTAMI
   ========================================================= */


/* =========================================================
   ZMIENNE
   ========================================================= */

let daneLinii = null;

let numerLinii = null;

let aktualnyKierunek = 0;

let aktualnyDzien = "dzisiaj";

let wybranaData = new Date();

let wybranyPrzystanek = null;


/* =========================================================
   PARAMETRY URL
   ========================================================= */

const parametry =
    new URLSearchParams(
        window.location.search
    );


numerLinii =
    parametry.get("linia");


if (!numerLinii) {

    pokazBlad(
        "Nie podano numeru linii.",
        "Użyj adresu w rodzaju: ?linia=102"
    );

}
else {

    document.getElementById(
        "numerLinii"
    ).textContent =
        numerLinii;

    pobierzDane();

}


/* =========================================================
   USUWANIE WADLIWEGO POLA GODZINY
   ========================================================= */

function usunPoleGodziny(tekst) {

    const pozycja =
        tekst.search(
            /"godziny"\s*:\s*\[/
        );

    if (pozycja === -1) {
        return tekst;
    }

    const poczatekTablicy =
        tekst.indexOf(
            "[",
            pozycja
        );

    if (poczatekTablicy === -1) {
        return tekst;
    }

    let poziom = 0;

    let wStringu = false;

    let ucieczka = false;

    let koniecTablicy = -1;


    for (
        let i = poczatekTablicy;
        i < tekst.length;
        i++
    ) {

        const znak = tekst[i];


        if (ucieczka) {

            ucieczka = false;

            continue;

        }


        if (
            znak === "\\"
            &&
            wStringu
        ) {

            ucieczka = true;

            continue;

        }


        if (
            znak === '"'
        ) {

            wStringu =
                !wStringu;

            continue;

        }


        if (wStringu) {
            continue;
        }


        if (znak === "[") {
            poziom++;
        }


        if (znak === "]") {

            poziom--;

            if (poziom === 0) {

                koniecTablicy = i;

                break;

            }

        }

    }


    if (
        koniecTablicy === -1
    ) {

        return tekst;

    }


    let poczatek =
        pozycja;

    let koniec =
        koniecTablicy + 1;


    while (
        koniec < tekst.length
        &&
        /\s/.test(
            tekst[koniec]
        )
    ) {

        koniec++;

    }


    if (
        tekst[koniec] === ","
    ) {

        koniec++;

    }


    let wynik =
        tekst.substring(
            0,
            poczatek
        )
        +
        tekst.substring(
            koniec
        );


    wynik =
        wynik.replace(
            /,\s*,/g,
            ","
        );


    wynik =
        wynik.replace(
            /,\s*}/g,
            "}"
        );


    return wynik;

}


/* =========================================================
   POBIERANIE JSON
   ========================================================= */

async function pobierzDane() {

    const adres =
        "../dane/" +
        encodeURIComponent(
            numerLinii
        ) +
        ".json";


    console.log(
        "FWTP – pobieram:",
        adres
    );


    try {

        const odpowiedz =
            await fetch(
                adres,
                {
                    cache: "no-cache"
                }
            );


        if (!odpowiedz.ok) {

            throw new Error(
                "HTTP " +
                odpowiedz.status +
                " – nie znaleziono pliku " +
                numerLinii +
                ".json"
            );

        }


        let tekst =
            await odpowiedz.text();


        if (
            !tekst.trim()
        ) {

            throw new Error(
                "Plik JSON jest pusty."
            );

        }


        try {

            daneLinii =
                JSON.parse(
                    tekst
                );

        }
        catch (pierwszyBlad) {

            console.warn(
                "FWTP – zwykły JSON.parse nie powiódł się."
            );


            const oczyszczonyJSON =
                usunPoleGodziny(
                    tekst
                );


            try {

                daneLinii =
                    JSON.parse(
                        oczyszczonyJSON
                    );

            }
            catch (drugiBlad) {

                console.error(
                    "Oryginalny JSON:",
                    tekst
                );

                console.error(
                    "Oczyszczony JSON:",
                    oczyszczonyJSON
                );


                throw new Error(
                    "JSON jest nieprawidłowy. " +
                    "Błąd: " +
                    drugiBlad.message
                );

            }

        }


        if (
            !daneLinii ||
            typeof daneLinii !== "object"
        ) {

            throw new Error(
                "JSON nie zawiera obiektu danych."
            );

        }


        if (
            !Array.isArray(
                daneLinii.rozkłady
            )
        ) {

            throw new Error(
                "JSON nie zawiera tablicy „rozkłady”."
            );

        }


        console.log(
            "FWTP – JSON załadowany poprawnie:",
            daneLinii
        );


        uruchomStrone();

    }
    catch (blad) {

        console.error(
            "FWTP – BŁĄD:",
            blad
        );


        pokazBlad(
            "Nie udało się załadować linii " +
            numerLinii +
            ".",
            blad.message
        );

    }

}


/* =========================================================
   URUCHOMIENIE STRONY
   ========================================================= */

function uruchomStrone() {

    document.getElementById("numerLinii").textContent =
        daneLinii.linia || numerLinii;


    document.getElementById("trasa").textContent =
        daneLinii.trasa ||
        ("Rozkład jazdy linii " + numerLinii);


    wybranaData = new Date();

    aktualnyKierunek = 0;

    wybranyPrzystanek = null;


    const parametrKierunku =
        parametry.get("kierunek");


    if (
        parametrKierunku !== null &&
        parametrKierunku !== ""
    ) {

        const liczbaKierunku =
            Number(
                parametrKierunku
            );


        if (
            Number.isInteger(
                liczbaKierunku
            ) &&
            liczbaKierunku >= 0
        ) {

            aktualnyKierunek =
                liczbaKierunku;

        }

    }


    const parametrPrzystanku =
        parametry.get("przystanek");


    if (parametrPrzystanku) {

        const rozklad =
            znajdzRozklad();


        if (
            rozklad &&
            Array.isArray(
                rozklad.kierunki
            )
        ) {

            const kierunek =
                rozklad.kierunki[
                    aktualnyKierunek
                ];


            if (
                kierunek &&
                Array.isArray(
                    kierunek.przystanki
                )
            ) {

                let znaleziony =
                    kierunek.przystanki.find(
                        function(przystanek) {

                            return String(
                                przystanek.nr ?? ""
                            ).trim()
                            ===
                            String(
                                parametrPrzystanku
                            ).trim();

                        }
                    );


                if (!znaleziony) {

                    const indeks =
                        Number(
                            parametrPrzystanku
                        );


                    if (
                        Number.isInteger(
                            indeks
                        ) &&
                        indeks >= 0 &&
                        indeks <
                        kierunek.przystanki.length
                    ) {

                        znaleziony =
                            kierunek.przystanki[
                                indeks
                            ];

                    }

                }


                if (znaleziony) {

                    wybranyPrzystanek =
                        znaleziony;

                }

            }

        }

    }


    pokazRozklad();

}


/* =========================================================
   NORMALIZACJA TEKSTU
   ========================================================= */

function normalizujTekst(tekst) {

    return String(
        tekst || ""
    )
    .toLowerCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    );

}


/* =========================================================
   TYP DNIA
   ========================================================= */

function okreslTypDnia(data) {

    const dzien =
        data.getDay();


    if (dzien === 6) {
        return "sobota";
    }


    if (dzien === 0) {
        return "niedziela";
    }


    return "roboczy";

}


/* =========================================================
   ZNAJDŹ ROZKŁAD
   ========================================================= */

function znajdzRozklad() {

    const rozklady =
        daneLinii.rozkłady || [];


    if (
        rozklady.length === 0
    ) {

        return null;

    }


    const typDnia =
        okreslTypDnia(
            wybranaData
        );


    if (
        typDnia === "sobota"
    ) {

        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                nazwa.includes("sobot")
            ) {

                return rozklad;

            }

        }

    }


    if (
        typDnia === "niedziela"
    ) {

        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                nazwa.includes("niedziel")
            ) {

                return rozklad;

            }

        }


        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                (
                    nazwa.includes("sobot")
                    &&
                    nazwa.includes("niedziel")
                )
                ||
                nazwa.includes("swieta")
                ||
                nazwa.includes("swiat")
            ) {

                return rozklad;

            }

        }

    }


    if (
        typDnia === "roboczy"
    ) {

        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                nazwa.includes(
                    "poniedzialku do piatku"
                )
                ||
                nazwa.includes(
                    "poniedzialku"
                )
                ||
                nazwa.includes(
                    "poniedzialek"
                )
                ||
                (
                    nazwa.includes("piat")
                    &&
                    !nazwa.includes("sobot")
                )
            ) {

                return rozklad;

            }

        }

    }


    return rozklady[0];

}


/* =========================================================
   KIERUNKI
   ========================================================= */

function generujKierunki() {

    const kontener =
        document.getElementById(
            "kierunki"
        );


    kontener.innerHTML = "";


    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !Array.isArray(
            rozklad.kierunki
        )
    ) {

        return;

    }


    rozklad.kierunki.forEach(
        function(
            kierunek,
            index
        ) {

            const przycisk =
                document.createElement(
                    "button"
                );


            przycisk.className =
                "kierunek-btn";


            if (
                index ===
                aktualnyKierunek
            ) {

                przycisk.classList.add(
                    "aktywny"
                );

            }


            const przystanki =
                Array.isArray(
                    kierunek.przystanki
                )
                ?
                kierunek.przystanki
                :
                [];


            let nazwaKierunku = "";


            if (
                przystanki.length > 0
            ) {

                const ostatni =
                    przystanki[
                        przystanki.length - 1
                    ];


                nazwaKierunku =
                    ostatni.nazwa ||
                    "";

            }


            if (
                !nazwaKierunku
            ) {

                nazwaKierunku =
                    "Kierunek " +
                    (
                        index + 1
                    );

            }


            przycisk.textContent =
                nazwaKierunku;


            przycisk.onclick =
                function() {

                    zmienKierunek(
                        index
                    );

                };


            kontener.appendChild(
                przycisk
            );

        }
    );

}


/* =========================================================
   ZMIANA KIERUNKU
   ========================================================= */

function zmienKierunek(index) {

    aktualnyKierunek =
        index;

    wybranyPrzystanek =
        null;


    const url =
        new URL(
            window.location.href
        );


    url.searchParams.set(
        "kierunek",
        String(index)
    );


    url.searchParams.delete(
        "przystanek"
    );


    window.history.pushState(
        {},
        "",
        url
    );


    pokazRozklad();

}

   WYBÓR DNIA

/* =========================================================
   KALENDARZ
   ========================================================= */

document
    .getElementById(
        "wybranaData"
    )
    .addEventListener(

                !this.value
            ) {

                return;

            }

                );

                new Date(
                    Number(czesci[0]),
                    Number(czesci[1]) - 1,
                    Number(czesci[2])
                );

                znajdzRozklad();


            if (
                !rozklad ||
                !rozklad.kierunki ||
                !rozklad.kierunki[

                ]
            ) {

                aktualnyKierunek = 0;

            }


            pokazRozklad();

        }
    );


/* =========================================================
   WARIANT
   ========================================================= */

function pobierzDaneWariantu(kurs) {

    if (
        !kurs ||
        typeof kurs !== "object"
    ) {

        return {
            litera: "",
            opis: ""
        };

    }


    let wariant =
        kurs.wariant;


    let litera = "";

    let opis = "";


    if (
        wariant &&
        typeof wariant === "object"
    ) {

        litera =
            wariant.litera ||
            wariant.nazwa ||
            wariant.symbol ||
            wariant.wariant ||
            wariant.oznaczenie ||
            "";


        opis =
            wariant.opis ||
            wariant.tekst ||
            wariant.opisWariantu ||
            wariant.description ||
            "";

    }
    else {

        litera =
            String(
                wariant || ""
            ).trim();

    }


    litera =
        String(
            litera
        ).trim();


    if (
        litera &&
        daneLinii &&
        Array.isArray(
            daneLinii.rozkłady
        )
    ) {

        const rozklad =
            znajdzRozklad();


        if (
            rozklad &&
            Array.isArray(
                rozklad.warianty
            )
        ) {

            const znaleziony =
                rozklad.warianty.find(
                    function(w) {

                        if (
                            !w ||
                            typeof w !== "object"
                        ) {

                            return false;

                        }


                        const literaWariantu =
                            String(
                                w.litera ||
                                w.nazwa ||
                                w.symbol ||
                                w.wariant ||
                                w.oznaczenie ||
                                ""
                            ).trim();


                        return (
                            literaWariantu.toUpperCase()
                            ===
                            litera.toUpperCase()
                        );

                    }
                );


            if (
                znaleziony
            ) {

                opis =
                    znaleziony.opis ||
                    znaleziony.tekst ||
                    znaleziony.opisWariantu ||
                    znaleziony.description ||
                    znaleziony.description_pl ||
                    "";

            }

        }

    }


    if (!opis) {

        opis =
            kurs.wariantOpis ||
            kurs.opisWariantu ||
            kurs.wariant_Opis ||
            kurs.opis ||
            kurs.uwagi ||
            kurs.uwaga ||
            "";

    }


    return {

        litera:
            String(
                litera
            ).trim(),

        opis:
            String(
                opis
            ).trim()

    };

}


function pobierzWariant(kurs) {

    return pobierzDaneWariantu(
        kurs
    ).litera;

}


/* =========================================================
   ZBIERANIE WARIANTÓW
   ========================================================= */

function zbierzWariantyPrzystanku(przystanek) {

    const warianty =
        new Map();


    if (
        !przystanek ||
        !Array.isArray(
            przystanek.kursy
        )
    ) {

        return warianty;

    }


    przystanek.kursy.forEach(
        function(kurs) {

            const dane =
                pobierzDaneWariantu(
                    kurs
                );


            if (
                !dane.litera
            ) {

                return;

            }


            if (
                !warianty.has(
                    dane.litera
                )
            ) {

                warianty.set(
                    dane.litera,
                    dane.opis
                );

            }

        }
    );


    return warianty;

}


/* =========================================================
   TWORZENIE LEGENDY
   ========================================================= */

function utworzLegendePrzystanku(przystanek) {

    const warianty =
        zbierzWariantyPrzystanku(
            przystanek
        );


    if (
        warianty.size === 0
    ) {

        return null;

    }


    const legenda =
        document.createElement(
            "div"
        );


    legenda.className =
        "legenda-wariantow";


    const lista =
        document.createElement(
            "div"
        );


    lista.className =
        "legenda-lista";


    warianty.forEach(
        function(
            opis,
            litera
        ) {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "legenda-element";


            const symbol =
                document.createElement(
                    "span"
                );


            symbol.className =
                "legenda-litera";


            symbol.textContent =
                litera;


            element.appendChild(
                symbol
            );


            if (
                opis
            ) {

                const opisElement =
                    document.createElement(
                        "span"
                    );


                opisElement.className =
                    "legenda-opis";


                opisElement.textContent =
                    opis;


                element.appendChild(
                    opisElement
                );

            }


            lista.appendChild(
                element
            );

        }
    );


    legenda.appendChild(
        lista
    );


    return legenda;

}


/* =========================================================
   BUDOWANIE MAPY KURSÓW
   =========================================================

   To jest najważniejsza część.

   Każdy numer kursu jest śledzony po wszystkich
   przystankach.

   NIE UŻYWAMY LP JAKO ID.

   Przystanek jest identyfikowany przez:
       indeks w tablicy przystanki[]

   Dzięki temu dwa razy:
       Ekspresowa
   są dwoma różnymi punktami trasy.
   ========================================================= */

function zbudujMapeKursow(przystanki) {

    const mapa =
        new Map();


    if (
        !Array.isArray(przystanki)
    ) {

        return mapa;

    }


    przystanki.forEach(
        function(
            przystanek,
            indeks
        ) {

            if (
                !przystanek ||
                !Array.isArray(
                    przystanek.kursy
                )
            ) {

                return;

            }


            przystanek.kursy.forEach(
                function(kurs) {

                    if (
                        !kurs ||
                        !kurs.numer
                    ) {

                        return;

                    }


                    const numer =
                        String(
                            kurs.numer
                        ).trim();


                    if (
                        !mapa.has(numer)
                    ) {

                        mapa.set(
                            numer,
                            {
                                numer: numer,
                                wariant:
                                    pobierzWariant(kurs),
                                przystanki: [],
                                daneWariantu:
                                    pobierzDaneWariantu(kurs)
                            }
                        );

                    }


                    const dane =
                        mapa.get(numer);


                    /*
                        Nie dodajemy tego samego indeksu
                        drugi raz.
                    */

                    if (
                        !dane.przystanki.includes(
                            indeks
                        )
                    ) {

                        dane.przystanki.push(
                            indeks
                        );

                    }


                    /*
                        Kurs jest źródłem prawdy
                        dla wariantu.
                    */

                    if (
                        !dane.wariant
                    ) {

                        dane.wariant =
                            pobierzWariant(
                                kurs
                            );

                    }

                }
            );

        }
    );


    /*
        Uporządkowanie każdego kursu
        zgodnie z kolejnością trasy.
    */

    mapa.forEach(
        function(kurs) {

            kurs.przystanki.sort(
                function(a, b) {
                    return a - b;
                }
            );

        }
    );


    return mapa;

}


/* =========================================================
   WARIANTY DLA ODCINKA
   ========================================================= */

function wariantyDlaOdcinka(
    mapaKursow,
    indeksA,
    indeksB
) {

    const wynik =
        new Map();


    mapaKursow.forEach(
        function(kurs) {

            const sciezka =
                kurs.przystanki;


            const pozycjaA =
                sciezka.indexOf(
                    indeksA
                );


            const pozycjaB =
                sciezka.indexOf(
                    indeksB
                );


            if (
                pozycjaA !== -1 &&
                pozycjaB !== -1 &&
                pozycjaB === pozycjaA + 1
            ) {

                const litera =
                    kurs.wariant ||
                    "";


                if (
                    litera &&
                    !wynik.has(
                        litera
                    )
                ) {

                    wynik.set(
                        litera,
                        kurs.daneWariantu
                            ? kurs.daneWariantu.opis
                            : ""
                    );

                }

            }

        }
    );


    return wynik;

}


/* =========================================================
   WYKRYWANIE RZECZYWISTYCH ODCINKÓW
   =========================================================

   Sprawdzamy wszystkie kursy.

   Jeżeli kurs przechodzi:
       A -> B -> C

   to odcinki są:
       A-B
       B-C

   Dzięki temu wiemy, które przystanki są
   rzeczywiście połączone przez konkretny kurs.
   ========================================================= */

function zbudujGrafTrasy(
    przystanki,
    mapaKursow
) {

    const graf =
        new Map();


    mapaKursow.forEach(
        function(kurs) {

            const sciezka =
                kurs.przystanki;


            for (
                let i = 0;
                i < sciezka.length - 1;
                i++
            ) {

                const a =
                    sciezka[i];


                const b =
                    sciezka[i + 1];


                const klucz =
                    a + ">" + b;


                if (
                    !graf.has(klucz)
                ) {

                    graf.set(
                        klucz,
                        {
                            a: a,
                            b: b,
                            kursy: [],
                            warianty: new Map()
                        }
                    );

                }


                const odcinek =
                    graf.get(klucz);


                odcinek.kursy.push(
                    kurs.numer
                );


                if (
                    kurs.wariant
                ) {

                    if (
                        !odcinek.warianty.has(
                            kurs.wariant
                        )
                    ) {

                        odcinek.warianty.set(
                            kurs.wariant,
                            kurs.daneWariantu
                                ? kurs.daneWariantu.opis
                                : ""
                        );

                    }

                }

            }

        }
    );


    return graf;

}


/* =========================================================
   POWTARZAJĄCE SIĘ PRZYSTANKI
   =========================================================

   Szukamy powtórzeń tej samej nazwy.

   Przykład:

       Płytowa
       Kupiecka
       Płytowa

   albo:

       Ekspresowa
       Polfa
       Ekspresowa

   Jest to bardzo ważne, ponieważ w danych trasy
   te punkty są różnymi pozycjami tablicy.
   ========================================================= */

function znajdzPowtorzenia(przystanki) {

    const mapa =
        new Map();


    przystanki.forEach(
        function(
            przystanek,
            indeks
        ) {

            const nazwa =
                normalizujTekst(
                    przystanek.nazwa
                );


            if (
                !nazwa
            ) {

                return;

            }


            if (
                !mapa.has(nazwa)
            ) {

                mapa.set(
                    nazwa,
                    []
                );

            }


            mapa.get(nazwa).push(
                indeks
            );

        }
    );


    const powtorzenia =
        [];


    mapa.forEach(
        function(
            indeksy,
            nazwa
        ) {

            if (
                indeksy.length >= 2
            ) {

                powtorzenia.push(
                    {
                        nazwa: nazwa,
                        indeksy: indeksy
                    }
                );

            }

        }
    );


    return powtorzenia;

}


/* =========================================================
   WYKRYWANIE ODGAŁĘZIENIA
   ========================================================= */

function znajdzOdgalecia(
    przystanki,
    mapaKursow
) {

    const odgalecia =
        [];


    const powtorzenia =
        znajdzPowtorzenia(
            przystanki
        );


    /*
        Każde powtórzenie nazwy może oznaczać,
        że między punktami znajduje się podjazd,
        pętla albo odgałęzienie.
    */

    powtorzenia.forEach(
        function(powtorzenie) {

            const indeksy =
                powtorzenie.indeksy;


            for (
                let i = 0;
                i < indeksy.length - 1;
                i++
            ) {

                const poczatek =
                    indeksy[i];


                const koniec =
                    indeksy[i + 1];


                if (
                    koniec <= poczatek + 1
                ) {

                    continue;

                }


                /*
                    Sprawdzamy kursy, które faktycznie
                    przechodzą przez cały fragment.
                */

                const kursyWFragmencie =
                    [];


                mapaKursow.forEach(
                    function(kurs) {

                        const sciezka =
                            kurs.przystanki;


                        const p1 =
                            sciezka.indexOf(
                                poczatek
                            );


                        const p2 =
                            sciezka.indexOf(
                                koniec
                            );


                        if (
                            p1 !== -1 &&
                            p2 !== -1 &&
                            p2 > p1
                        ) {

                            const fragment =
                                sciezka.slice(
                                    p1,
                                    p2 + 1
                                );


                            /*
                                Musimy mieć wszystkie
                                kolejne punkty fragmentu.
                            */

                            let kompletny =
                                true;


                            for (
                                let x = 0;
                                x < fragment.length;
                                x++
                            ) {

                                if (
                                    fragment[x] ===
                                    undefined
                                ) {

                                    kompletny = false;

                                }

                            }


                            if (
                                kompletny
                            ) {

                                kursyWFragmencie.push(
                                    {
                                        numer:
                                            kurs.numer,

                                        wariant:
                                            kurs.wariant
                                    }
                                );

                            }

                        }

                    }
                );


                /*
                    Tylko jeśli istnieje faktyczny kurs
                    wykonujący fragment.
                */

                if (
                    kursyWFragmencie.length > 0
                ) {

                    odgalecia.push(
                        {
                            poczatek:
                                poczatek,

                            koniec:
                                koniec,

                            indeksy:
                                Array.from(
                                    {
                                        length:
                                            koniec -
                                            poczatek +
                                            1
                                    },
                                    function(_, n) {
                                        return poczatek + n;
                                    }
                                ),

                            kursy:
                                kursyWFragmencie
                        }
                    );

                }

            }

        }
    );


    return odgalecia;

}


/* =========================================================
   CZY DANY PRZYSTANEK JEST W ODGAŁĘZIENIU
   ========================================================= */

function znajdzOdgalecieDlaIndeksu(
    odgalecia,
    indeks
) {

    for (
        const odgalecie
        of odgalecia
    ) {

        if (
            indeks > odgalecie.poczatek &&
            indeks < odgalecie.koniec
        ) {

            return odgalecie;

        }

    }


    return null;

}


/* =========================================================
   WARIANTY W ODGAŁĘZIENIU
   ========================================================= */

function zbierzWariantyOdgalecia(
    odgalecie
) {

    const warianty =
        new Map();


    if (
        !odgalecie ||
        !Array.isArray(
            odgalecie.kursy
        )
    ) {

        return warianty;

    }


    odgalecie.kursy.forEach(
        function(kurs) {

            if (
                kurs.wariant &&
                !warianty.has(
                    kurs.wariant
                )
            ) {

                warianty.set(
                    kurs.wariant,
                    ""
                );

            }

        }
    );


    return warianty;

}


/* =========================================================
   TWORZENIE ELEMENTU PRZYSTANKU
   ========================================================= */

function utworzPrzystanekTrasy(
    przystanek,
    indeks,
    opcje = {}
) {

    const wiersz =
        document.createElement(
            "div"
        );


    wiersz.className =
        opcje.odgalecie
            ?
            "wiersz-odgalecia"
            :
            "wiersz-trasy";


    if (
        indeks === 0
    ) {

        wiersz.classList.add(
            "poczatek"
        );

    }


    if (
        opcje.koniec
    ) {

        wiersz.classList.add(
            "koniec"
        );

    }


    const punkt =
        document.createElement(
            "div"
        );


    punkt.className =
        "punkt-przystanku";


    const przycisk =
        document.createElement(
            "button"
        );


    przycisk.type =
        "button";


    przycisk.className =
        "przystanek-trasy";


    const lp =
        document.createElement(
            "span"
        );


    lp.className =
        "lp-trasy";


    lp.textContent =
        przystanek.lp ??
        (indeks + 1);


    const nazwa =
        document.createElement(
            "span"
        );


    nazwa.className =
        "nazwa-trasy";


    nazwa.textContent =
        przystanek.nazwa ||
        "Przystanek";


    przycisk.appendChild(
        lp
    );


    przycisk.appendChild(
        nazwa
    );


    if (
        przystanek.nr !== undefined &&
        przystanek.nr !== null &&
        String(
            przystanek.nr
        ).trim() !== ""
    ) {

        const nr =
            document.createElement(
                "span"
            );


        nr.className =
            "nr-trasy";


        nr.textContent =
            "nr " +
            przystanek.nr;


        przycisk.appendChild(
            nr
        );

    }


    przycisk.onclick =
        function() {

            wybierzPrzystanek(
                przystanek,
                indeks
            );

        };


    wiersz.appendChild(
        punkt
    );


    wiersz.appendChild(
        przycisk
    );


    return wiersz;

}


/* =========================================================
   OZNACZENIE WARIANTU
   ========================================================= */

function utworzOznaczenieWariantu(
    warianty
) {

    if (
        !warianty ||
        warianty.size === 0
    ) {

        return null;

    }


    const kontener =
        document.createElement(
            "div"
        );


    kontener.className =
        "oznaczenie-wariantu";


    warianty.forEach(
        function(
            opis,
            litera
        ) {

            const literka =
                document.createElement(
                    "span"
                );


            literka.className =
                "oznaczenie-wariantu-literka";


            literka.textContent =
                litera;


            kontener.appendChild(
                literka
            );

        }
    );


    return kontener;

}


/* =========================================================
   LEGENDA CAŁEJ TRASY
   ========================================================= */

function utworzLegendeTrasy(
    przystanki
) {

    const warianty =
        new Map();


    przystanki.forEach(
        function(przystanek) {

            if (
                !Array.isArray(
                    przystanek.kursy
                )
            ) {

                return;

            }


            przystanek.kursy.forEach(
                function(kurs) {

                    const dane =
                        pobierzDaneWariantu(
                            kurs
                        );


                    if (
                        dane.litera &&
                        !warianty.has(
                            dane.litera
                        )
                    ) {

                        warianty.set(
                            dane.litera,
                            dane.opis
                        );

                    }

                }
            );

        }
    );


    if (
        warianty.size === 0
    ) {

        return null;

    }


    const legenda =
        document.createElement(
            "div"
        );


    legenda.className =
        "legenda-trasy";


    const tytul =
        document.createElement(
            "div"
        );


    tytul.className =
        "legenda-trasy-tytul";


    tytul.textContent =
        "Warianty trasy";


    legenda.appendChild(
        tytul
    );


    warianty.forEach(
        function(
            opis,
            litera
        ) {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "legenda-trasy-element";


            const symbol =
                document.createElement(
                    "span"
                );


            symbol.className =
                "legenda-trasy-literka";


            symbol.textContent =
                litera;


            element.appendChild(
                symbol
            );


            const tekst =
                document.createElement(
                    "span"
                );


            tekst.textContent =
                opis ||
                "";


            element.appendChild(
                tekst
            );


            legenda.appendChild(
                element
            );

        }
    );


    return legenda;

}


/* =========================================================
   RYSOWANIE SCHEMATU TRASY
   ========================================================= */

function pokazListePrzystankow(
    rozklad = null
) {

    if (!rozklad) {

        rozklad =
            znajdzRozklad();

    }


    const kontener =
        document.getElementById(
            "przystanki"
        );


    const typ =
        document.getElementById(
            "typRozkladu"
        );


    const powrot =
        document.getElementById(
            "powrotPrzystanki"
        );


    if (
        !rozklad ||
        !Array.isArray(
            rozklad.kierunki
        )
    ) {

        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak danych przystanków.' +
            '</div>';

        return;

    }


    const kierunek =
        rozklad.kierunki[
            aktualnyKierunek
        ];


    if (!kierunek) {

        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak wybranego kierunku.' +
            '</div>';

        return;

    }


    const przystanki =
        Array.isArray(
            kierunek.przystanki
        )
        ?
        kierunek.przystanki
        :
        [];


    wybranyPrzystanek =
        null;


    powrot.style.display =
        "none";


    const dni =
        document.querySelector(
            ".dni"
        );


    if (dni) {

        dni.style.display =
            "none";

    }


    document.getElementById(
        "kalendarz"
    ).style.display =
        "none";


    typ.style.display =
        "block";


    typ.textContent =
        "Wybierz przystanek";


    kontener.innerHTML =
        "";


    if (
        przystanki.length === 0
    ) {

        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak przystanków w tym kierunku.' +
            '</div>';

        return;

    }


    /*
        Budujemy dane potrzebne do wykrywania
        faktycznych wariantów.
    */

    const mapaKursow =
        zbudujMapeKursow(
            przystanki
        );


    const graf =
        zbudujGrafTrasy(
            przystanki,
            mapaKursow
        );


    const odgalecia =
        znajdzOdgalecia(
            przystanki,
            mapaKursow
        );


    console.log(
        "FWTP – mapa kursów:",
        mapaKursow
    );


    console.log(
        "FWTP – graf trasy:",
        graf
    );


    console.log(
        "FWTP – wykryte odgałęzienia:",
        odgalecia
    );


    const schemat =
        document.createElement(
            "div"
        );


    schemat.className =
        "lista-trasy";


    /*
        Zestaw indeksów należących do odgałęzień.
    */

    const indeksyOdgalecien =
        new Set();


    odgalecia.forEach(
        function(odgalecie) {

            for (
                let i =
                    odgalecie.poczatek + 1;

                i <
                    odgalecie.koniec;

                i++
            ) {

                indeksyOdgalecien.add(
                    i
                );

            }

        }
    );


    /*
        Zapamiętujemy już narysowane odgałęzienia.
    */

    const narysowaneOdgalecia =
        new Set();


    for (
        let indeks = 0;
        indeks < przystanki.length;
        indeks++
    ) {

        /*
            Jeśli indeks należy do odgałęzienia,
            rysujemy go wewnątrz tego odgałęzienia.
        */

        const odgalecie =
            znajdzOdgalecieDlaIndeksu(
                odgalecia,
                indeks
            );


        if (
            odgalecie
        ) {

            const klucz =
                odgalecie.poczatek +
                "-" +
                odgalecie.koniec;


            if (
                !narysowaneOdgalecia.has(
                    klucz
                )
            ) {

                narysowaneOdgalecia.add(
                    klucz
                );


                const blok =
                    document.createElement(
                        "div"
                    );


                blok.className =
                    "odgalecie-trasy";


                /*
                    Wstawiamy wszystkie punkty
                    znajdujące się pomiędzy
                    dwoma wystąpieniami tego
                    samego przystanku.
                */

                for (
                    let x =
                        odgalecie.poczatek + 1;

                    x <
                        odgalecie.koniec;

                    x++
                ) {

                    const element =
                        utworzPrzystanekTrasy(
                            przystanki[x],
                            x,
                            {
                                odgalecie: true
                            }
                        );


                    blok.appendChild(
                        element
                    );

                }


                /*
                    Dodajemy opis wariantów.
                */

                const warianty =
                    zbierzWariantyOdgalecia(
                        odgalecie
                    );


                const oznaczenie =
                    utworzOznaczenieWariantu(
                        warianty
                    );


                if (
                    oznaczenie
                ) {

                    /*
                        Dodajemy opis do ostatniego
                        elementu odgałęzienia.
                    */

                    const ostatni =
                        blok.lastElementChild;


                    if (
                        ostatni
                    ) {

                        const przycisk =
                            ostatni.querySelector(
                                ".przystanek-trasy"
                            );


                        if (
                            przycisk
                        ) {

                            przycisk.appendChild(
                                oznaczenie
                            );

                        }

                    }

                }


                schemat.appendChild(
                    blok
                );


                /*
                    Przechodzimy od razu do punktu
                    kończącego odgałęzienie.
                */

                indeks =
                    odgalecie.koniec - 1;


                continue;

            }

        }


        /*
            Normalny przystanek.
        */

        const wiersz =
            utworzPrzystanekTrasy(
                przystanki[indeks],
                indeks,
                {
                    koniec:
                        indeks ===
                        przystanki.length - 1
                }
            );


        /*
            Warianty obsługujące odcinek
            wychodzący z tego przystanku.
        */

        if (
            indeks <
            przystanki.length - 1
        ) {

            const warianty =
                wariantyDlaOdcinka(
                    mapaKursow,
                    indeks,
                    indeks + 1
                );


            const oznaczenie =
                utworzOznaczenieWariantu(
                    warianty
                );


            if (
                oznaczenie
            ) {

                const przycisk =
                    wiersz.querySelector(
                        ".przystanek-trasy"
                    );


                if (
                    przycisk
                ) {

                    przycisk.appendChild(
                        oznaczenie
                    );

                }

            }

        }


        schemat.appendChild(
            wiersz
        );

    }


    kontener.appendChild(
        schemat
    );


    /*
        Legenda wariantów.
    */

    const legenda =
        utworzLegendeTrasy(
            przystanki
        );


    if (
        legenda
    ) {

        kontener.appendChild(
            legenda
        );

    }

}


/* =========================================================
   WYBÓR PRZYSTANKU
   ========================================================= */

function wybierzPrzystanek(
    przystanek,
    index
) {

    if (!przystanek) {

        return;

    }


    wybranyPrzystanek =
        przystanek;


    const url =
        new URL(
            window.location.href
        );


    url.searchParams.set(
        "kierunek",
        String(
            aktualnyKierunek
        )
    );


    /*
        Nr może się powtarzać.

        Dlatego jako bezpieczny identyfikator
        wykorzystujemy indeks tablicy.
    */

    url.searchParams.set(
        "przystanek",
        String(index)
    );


    window.history.pushState(
        {},
        "",
        url
    );


    pokazRozklad();

}


/* =========================================================
   POWRÓT DO LISTY
   ========================================================= */

function pokazListePrzystankowZPowrotem() {

    wybranyPrzystanek =
        null;


    const url =
        new URL(
            window.location.href
        );


    url.searchParams.delete(
        "przystanek"
    );


    window.history.pushState(
        {},
        "",
        url
    );


    pokazRozklad();

}


/* =========================================================
   GŁÓWNE WYŚWIETLANIE
   ========================================================= */

function pokazRozklad() {

    if (!daneLinii) {

        return;

    }


    const rozklad =
        znajdzRozklad();


    const kontener =
        document.getElementById(
            "przystanki"
        );


    const typ =
        document.getElementById(
            "typRozkladu"
        );


    const powrot =
        document.getElementById(
            "powrotPrzystanki"
        );


    if (!rozklad) {

        typ.style.display =
            "block";


        typ.textContent =
            "Brak rozkładu";


        powrot.style.display =
            "none";


        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak danych rozkładu.' +
            '</div>';


        return;

    }


    const kierunki =
        rozklad.kierunki || [];


    if (
        kierunki.length === 0
    ) {

        typ.style.display =
            "block";


        typ.textContent =
            "Brak kierunków";


        powrot.style.display =
            "none";


        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Ten rozkład nie zawiera kierunków.' +
            '</div>';


        return;

    }


    if (
        aktualnyKierunek < 0 ||
        aktualnyKierunek >=
        kierunki.length
    ) {

        aktualnyKierunek =
            0;

    }


    generujKierunki();


    /*
        Brak wybranego przystanku:
        pokazujemy schemat.
    */

    if (
        !wybranyPrzystanek
    ) {

        pokazListePrzystankow(
            rozklad
        );

        return;

    }


    const kierunek =
        kierunki[
            aktualnyKierunek
        ];


    const przystanki =
        Array.isArray(
            kierunek.przystanki
        )
        ?
        kierunek.przystanki
        :
        [];


    /*
        Najpierw próbujemy po indeksie zapisanym
        w URL.
    */

    let aktualnyPrzystanek =
        null;


    const parametrPrzystanku =
        new URLSearchParams(
            window.location.search
        ).get(
            "przystanek"
        );


    if (
        parametrPrzystanku !== null
    ) {

        const indeks =
            Number(
                parametrPrzystanku
            );


        if (
            Number.isInteger(indeks) &&
            indeks >= 0 &&
            indeks <
                przystanki.length
        ) {

            aktualnyPrzystanek =
                przystanki[indeks];

        }

    }


    /*
        Awaryjnie szukamy po nr/nazwie.
    */

    if (
        !aktualnyPrzystanek &&
        wybranyPrzystanek
    ) {

        aktualnyPrzystanek =
            przystanki.find(
                function(przystanek) {

                    return (
                        String(
                            przystanek.nazwa ?? ""
                        ).trim()
                        ===
                        String(
                            wybranyPrzystanek.nazwa ?? ""
                        ).trim()
                        &&
                        String(
                            przystanek.lp ?? ""
                        ).trim()
                        ===
                        String(
                            wybranyPrzystanek.lp ?? ""
                        ).trim()
                    );

                }
            );

    }


    if (
        !aktualnyPrzystanek
    ) {

        wybranyPrzystanek =
            null;


        pokazListePrzystankow(
            rozklad
        );


        return;

    }


    wybranyPrzystanek =
        aktualnyPrzystanek;


    pokazRozkladWybranegoPrzystanku(
        rozklad,
        aktualnyPrzystanek
    );

}


/* =========================================================
   ROZKŁAD WYBRANEGO PRZYSTANKU

        );

    }

        document.getElementById(
            "kalendarz"
        );

        aktualnyDzien !==
        "kalendarz"
    ) {

        kalendarz.style.display =
            "none";

    }


    typ.style.display =
        "block";

        rozklad.nazwa ||
        "Rozkład jazdy";


    kontener.innerHTML =
        "";


    const naglowek =
        document.createElement(
            "div"
        );


    naglowek.className =
        "naglowek-przystanku-widok";


    const nazwa =
        document.createElement(
            "div"
        );


    nazwa.className =
        "nazwa";


    nazwa.textContent =
        przystanek.nazwa ||
        "Przystanek";


    const nr =
        document.createElement(
            "div"
        );


    nr.className =
        "numer";


    if (
        przystanek.nr !== undefined &&
        przystanek.nr !== null &&
        String(
            przystanek.nr
        ).trim() !== ""
    ) {

        nr.textContent =

    );

    );

        );

        document.createElement(
            "div"
        );


    godziny.className =
        "godziny";


    const kursy =
        Array.isArray(
            przystanek.kursy
        )
        ?
        przystanek.kursy
        :
        [];


    if (
        kursy.length === 0
    ) {

        godziny.innerHTML =
            '<div class="brak-godzin">' +
            'Brak odjazdów' +
            '</div>';

    }
    else {

        let aktualnaGodzina =
            null;


        let aktualnyWiersz =
            null;


        kursy.forEach(
            function(kurs) {

                if (
                    !kurs ||
                    typeof kurs !== "object"
                ) {

                    return;

                }


                const czas =
                    String(
                        kurs.czas || ""
                    ).trim();


                const dopasowanie =
                    czas.match(
                        /^(\d{1,2}):(\d{2})$/
                    );


                if (
                    !dopasowanie
                ) {

                    return;

                }


                const godzina =
                    Number(
                        dopasowanie[1]
                    );


                const minuta =
                    dopasowanie[2];


                if (
                    !Number.isFinite(
                        godzina
                    )
                ) {

                    return;

                }


                if (
                    aktualnaGodzina === null ||
                    aktualnaGodzina !==
                    godzina
                ) {

                    aktualnaGodzina =
                        godzina;


                    aktualnyWiersz =
                        document.createElement(
                            "div"
                        );


                    aktualnyWiersz.className =
                        "wiersz-godziny";


                    const kolumnaGodziny =
                        document.createElement(
                            "div"
                        );


                    kolumnaGodziny.className =
                        "kolumna-godzina";


                    kolumnaGodziny.textContent =
                        String(
                            godzina
                        ).padStart(
                            2,
                            "0"
                        );


                    aktualnyWiersz.appendChild(
                        kolumnaGodziny
                    );


                    godziny.appendChild(
                        aktualnyWiersz
                    );

                }


                const kolumna =
                    document.createElement(
                        "div"
                    );


                kolumna.className =
                    "kolumna-minuta";


                const minutaZWariantem =
                    document.createElement(
                        "span"
                    );


                minutaZWariantem.className =
                    "minuta-z-wariantem";


                const minutaElement =
                    document.createElement(
                        "span"
                    );


                minutaElement.className =
                    "minuta";


                minutaElement.textContent =
                    minuta;


                minutaZWariantem.appendChild(
                    minutaElement
                );


                const wariant =
                    pobierzWariant(
                        kurs
                    );


                if (
                    wariant
                ) {

                    const wariantElement =
                        document.createElement(
                            "span"
                        );


                    wariantElement.className =
                        "wariant-minuty";


                    wariantElement.textContent =
                        wariant;


                    minutaZWariantem.appendChild(
                        wariantElement
                    );

                }


                kolumna.appendChild(
                    minutaZWariantem
                );


                if (
                    kurs.numer
                ) {

                    kolumna.title =
                        "Kurs " +
                        kurs.numer;

                }


                if (
                    aktualnyWiersz
                ) {

                    aktualnyWiersz.appendChild(
                        kolumna
                    );

                }

            }
        );

    }


    blok.appendChild(
        godziny
    );


    const legenda =
        utworzLegendePrzystanku(
            przystanek
        );


    if (
        legenda
    ) {

        blok.appendChild(
            legenda
        );

    }


    kontener.appendChild(
        blok
    );

}


/* =========================================================
   DATA
   ========================================================= */

function formatujDateInput(data) {

    const rok =
        data.getFullYear();


    const miesiac =
        String(
            data.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const dzien =
        String(
            data.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        rok +
        "-" +
        miesiac +
        "-" +
        dzien
    );

}


/* =========================================================
   BŁĄD
   ========================================================= */

function pokazBlad(
    tytul,
    opis
) {

    document.getElementById(
        "numerLinii"
    ).textContent =
        "Błąd";


    document.getElementById(
        "trasa"
    ).textContent =
        "";


    document.getElementById(
        "kierunki"
    ).innerHTML =
        "";


    document.getElementById(
        "typRozkladu"
    ).style.display =
        "none";


    document.getElementById(
        "przystanki"
    ).innerHTML =

        '<div class="blad">' +

        '<strong>' +
        tytul +
        '</strong>' +

        opis +

        '</div>';

}


/* =========================================================
   HISTORIA PRZEGLĄDARKI
   ========================================================= */

window.addEventListener(
    "popstate",
    function() {

        const url =
            new URL(
                window.location.href
            );


        const parametrKierunku =
            url.searchParams.get(
                "kierunek"
            );


        const parametrPrzystanku =
            url.searchParams.get(
                "przystanek"
            );


        const liczbaKierunku =
            Number(
                parametrKierunku
            );


        aktualnyKierunek =
            Number.isInteger(
                liczbaKierunku
            ) &&
            liczbaKierunku >= 0
                ?
                liczbaKierunku
                :
                0;


        wybranyPrzystanek =
            null;


        const rozklad =
            znajdzRozklad();


        if (
            parametrPrzystanku &&
            rozklad &&
            Array.isArray(
                rozklad.kierunki
            )
        ) {

            const kierunek =
                rozklad.kierunki[
                    aktualnyKierunek
                ];


            if (
                kierunek &&
                Array.isArray(
                    kierunek.przystanki
                )
            ) {

                const indeks =
                    Number(
                        parametrPrzystanku
                    );


                if (
                    Number.isInteger(indeks) &&
                    indeks >= 0 &&
                    indeks <
                        kierunek.przystanki.length
                ) {

                    wybranyPrzystanek =
                        kierunek.przystanki[
                            indeks
                        ];

                }

            }

        }


        pokazRozklad();

    }
);
