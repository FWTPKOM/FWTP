<!DOCTYPE html>

<html lang="pl">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Rozkład jazdy</title>

<link rel="stylesheet"
      href="../css/style.css">

<style>

    /* =====================================================
       GŁÓWNY KONTENER
       ===================================================== */

    .rozkład {
        max-width: 1100px;
        margin: 30px auto;
        padding: 0 15px;
    }

    /* =====================================================
       POWRÓT
       ===================================================== */

    .powrot {
        display: inline-block;
        margin-bottom: 20px;
        color: #0066cc;
        text-decoration: none;
        font-weight: bold;
    }

    .powrot:hover {
        text-decoration: underline;
    }

    /* =====================================================
       NAGŁÓWEK LINII
       ===================================================== */

    .naglowek-linii {
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 25px;
        margin-bottom: 15px;
    }

    .numer-linii {
        font-size: 42px;
        font-weight: bold;
        margin: 0 0 8px 0;
    }

    .trasa {
        font-size: 19px;
        font-weight: bold;
        margin: 0;
    }

    /* =====================================================
       WYBÓR KIERUNKU
       ===================================================== */

    .kierunki {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }

    .kierunek-btn {
        flex: 1;
        padding: 14px;
        background: white;
        border: 1px solid #ccc;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
        transition: 0.15s;
    }

    .kierunek-btn:hover {
        border-color: #0066cc;
    }

    .kierunek-btn.aktywny {
        background: #0066cc;
        color: white;
        border-color: #0066cc;
    }

    /* =====================================================
       WYBÓR DNIA
       ===================================================== */

    .dni {
        display: flex;
        gap: 8px;
        margin-bottom: 15px;
    }

    .dzien-btn {
        padding: 12px 20px;
        border: 1px solid #ccc;
        background: white;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }

    .dzien-btn:hover {
        border-color: #0066cc;
    }

    .dzien-btn.aktywny {
        background: #0066cc;
        color: white;
        border-color: #0066cc;
    }

    /* =====================================================
       KALENDARZ
       ===================================================== */

    .kalendarz {
        display: none;
        background: white;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 15px;
        margin-bottom: 15px;
    }

    .kalendarz input {
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    /* =====================================================
       INFORMACJA O TYPIE ROZKŁADU
       ===================================================== */

    .typ-rozkładu {
        background: #f7f7f7;
        border: 1px solid #ddd;
        padding: 12px 15px;
        margin-bottom: 15px;
        border-radius: 6px;
        font-size: 14px;
        color: #555;
    }

    /* =====================================================
       LISTA PRZYSTANKÓW
       ===================================================== */

    .przystanki {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* =====================================================
       PRZYSTANEK
       ===================================================== */

    .przystanek {
        background: white;
        border: 1px solid #ddd;
        border-radius: 7px;
        overflow: hidden;
    }

    .przystanek-naglowek {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #f2f2f2;
        padding: 13px 15px;
        border-bottom: 1px solid #ddd;
    }

    .lp {
        min-width: 35px;
        font-weight: bold;
        color: #666;
    }

    .nazwa-przystanku {
        font-weight: bold;
        font-size: 17px;
    }

    .numer-przystanku {
        margin-left: auto;
        color: #777;
        font-size: 13px;
    }

    /* =====================================================
       GODZINY
       ===================================================== */

    .godziny {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
    }

    .godzina {
        padding: 13px 5px;
        text-align: center;
        border-right: 1px solid #eee;
        border-bottom: 1px solid #eee;
        font-size: 17px;
        font-weight: 500;
    }

    .godzina:nth-child(8n) {
        border-right: none;
    }

    .godzina:hover {
        background: #f5f8fb;
    }

    /* =====================================================
       WARIANT KURSU
       ===================================================== */

    .godzina-wariant {
        display: block;
        font-size: 10px;
        color: #777;
        margin-top: 2px;
    }

    /* =====================================================
       BRAK GODZIN
       ===================================================== */

    .brak-godzin {
        padding: 15px;
        color: #777;
        font-size: 14px;
    }

    /* =====================================================
       ŁADOWANIE
       ===================================================== */

    .loading {
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 30px;
        text-align: center;
        color: #666;
    }

    /* =====================================================
       BŁĄD
       ===================================================== */

    .blad {
        background: #fff4f4;
        border: 1px solid #e0aaaa;
        color: #a00000;
        border-radius: 8px;
        padding: 20px;
        line-height: 1.6;
    }

    .blad strong {
        display: block;
        margin-bottom: 8px;
    }

    /* =====================================================
       BRAK DANYCH
       ===================================================== */

    .brak-danych {
        padding: 30px;
        text-align: center;
        color: #777;
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
    }

    /* =====================================================
       TELEFON
       ===================================================== */

    @media (max-width: 800px) {

        .godziny {
            grid-template-columns: repeat(5, 1fr);
        }

        .godzina:nth-child(8n) {
            border-right: 1px solid #eee;
        }

        .godzina:nth-child(5n) {
            border-right: none;
        }
    }

    @media (max-width: 550px) {

        .rozkład {
            margin: 15px auto;
        }

        .numer-linii {
            font-size: 34px;
        }

        .trasa {
            font-size: 16px;
        }

        .kierunki {
            flex-direction: column;
        }

        .dni {
            flex-wrap: wrap;
        }

        .dzien-btn {
            flex: 1;
            padding: 11px 10px;
        }

        .godziny {
            grid-template-columns: repeat(3, 1fr);
        }

        .godzina:nth-child(5n) {
            border-right: 1px solid #eee;
        }

        .godzina:nth-child(3n) {
            border-right: none;
        }

        .przystanek-naglowek {
            padding: 12px;
        }

        .nazwa-przystanku {
            font-size: 15px;
        }

        .numer-przystanku {
            font-size: 11px;
        }
    }

</style>


</head>

<body>

<header class="topbar">


<div class="logo">
    FWTP
</div>

<nav>

    <a href="../">
        Strona główna
    </a>

    <a href="../linie/">
        Linie
    </a>

</nav>


</header>

<main class="rozkład">


<a
    class="powrot"
    href="../linie/"
>
    ← Linie
</a>



<section class="naglowek-linii">

    <h1
        id="numerLinii"
        class="numer-linii"
    >
        Ładowanie...
    </h1>

    <p
        id="trasa"
        class="trasa"
    >
        Pobieranie danych...
    </p>

</section>



<div
    id="kierunki"
    class="kierunki"
>
</div>



<div class="dni">

    <button
        id="dzisiajBtn"
        class="dzien-btn aktywny"
        onclick="wybierzDzien('dzisiaj')"
    >
        DZISIAJ
    </button>

    <button
        id="jutroBtn"
        class="dzien-btn"
        onclick="wybierzDzien('jutro')"
    >
        JUTRO
    </button>

    <button
        id="kalendarzBtn"
        class="dzien-btn"
        onclick="wybierzDzien('kalendarz')"
    >
        KALENDARZ
    </button>

</div>



<div
    id="kalendarz"
    class="kalendarz"
>

    <input
        type="date"
        id="wybranaData"
    >

</div>



<div
    id="typRozkladu"
    class="typ-rozkładu"
>
    Ładowanie rozkładu...
</div>



<div
    id="przystanki"
    class="przystanki"
>

    <div class="loading">
        Ładowanie przystanków...
    </div>

</div>


</main>

<script>

/* =========================================================
   FWTP – ROZKŁAD JAZDY
   WERSJA DOPASOWANA DO JSON:
   
   rozkłady[]
       kierunki[]
           przystanki[]
               kursy[]
                   numer
                   czas
                   wariant
   ========================================================= */


/* =========================================================
   ZMIENNE
   ========================================================= */

let daneLinii = null;

let numerLinii = null;

let aktualnyKierunek = 0;

let aktualnyDzien = "dzisiaj";

let wybranaData = new Date();



/* =========================================================
   ODCZYT NUMERU LINII
   ========================================================= */

const parametry =
    new URLSearchParams(
        window.location.search
    );

numerLinii =
    parametry.get("linia");



/*
 * Obsługujemy również adres:
 *
 * /FWTP/linia/?linia=110
 *
 * =========================================================
 */

if (!numerLinii) {

    pokazBlad(
        "Nie podano numeru linii.",
        "Wróć do listy linii i wybierz linię."
    );

}
else {

    document.getElementById(
        "numerLinii"
    ).textContent =
        numerLinii;

    pobierzDane();

}



/* =========================================================
   POBIERANIE JSON
   ========================================================= */

async function pobierzDane() {

    const adres =
        "../dane/" +
        encodeURIComponent(numerLinii) +
        ".json";


    try {

        console.log(
            "FWTP – pobieram:",
            adres
        );


        const odpowiedz =
            await fetch(
                adres,
                {
                    cache: "no-cache"
                }
            );


        if (!odpowiedz.ok) {

            throw new Error(
                "HTTP " +
                odpowiedz.status +
                " – nie znaleziono pliku " +
                numerLinii +
                ".json"
            );

        }


        const tekst =
            await odpowiedz.text();


        if (!tekst.trim()) {

            throw new Error(
                "Plik JSON jest pusty."
            );

        }


        try {

            daneLinii =
                JSON.parse(tekst);

        }
        catch (bladJSON) {

            console.error(
                "Nieprawidłowy JSON:",
                tekst
            );

            throw new Error(
                "Plik JSON istnieje, ale ma nieprawidłową składnię."
            );

        }


        if (!daneLinii) {

            throw new Error(
                "Nie udało się odczytać danych."
            );

        }


        if (
            !Array.isArray(
                daneLinii.rozkłady
            )
        ) {

            throw new Error(
                "JSON nie zawiera prawidłowego pola 'rozkłady'."
            );

        }


        console.log(
            "FWTP – JSON załadowany:",
            daneLinii
        );


        uruchomStrone();

    }
    catch (blad) {

        console.error(
            "FWTP – błąd:",
            blad
        );


        pokazBlad(
            "Nie udało się załadować linii " +
            numerLinii +
            ".",
            blad.message
        );

    }

}



/* =========================================================
   URUCHOMIENIE STRONY
   ========================================================= */

function uruchomStrone() {


    /*
     * Numer linii
     */

    document.getElementById(
        "numerLinii"
    ).textContent =
        daneLinii.linia ||
        numerLinii;


    /*
     * Trasa
     */

    document.getElementById(
        "trasa"
    ).textContent =
        daneLinii.trasa ||
        "Rozkład jazdy linii " +
        numerLinii;


    /*
     * Data
     */

    ustawDate();


    /*
     * Kierunek
     */

    aktualnyKierunek = 0;


    /*
     * Wyświetlenie
     */

    pokazRozklad();

}



/* =========================================================
   NORMALIZACJA TEKSTU
   ========================================================= */

function normalizujTekst(tekst) {

    return String(
        tekst || ""
    )
    .toLowerCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    );

}



/* =========================================================
   OKREŚLENIE TYPU DNIA
   ========================================================= */

function okreslTypDnia(data) {

    const dzien =
        data.getDay();


    /*
     * 0 = niedziela
     * 1 = poniedziałek
     * 2 = wtorek
     * 3 = środa
     * 4 = czwartek
     * 5 = piątek
     * 6 = sobota
     */


    if (dzien === 6) {

        return "sobota";

    }


    if (dzien === 0) {

        return "niedziela";

    }


    return "roboczy";

}



/* =========================================================
   ROZPOZNAWANIE ROZKŁADU
   ========================================================= */

function znajdzRozklad() {

    const rozklady =
        daneLinii.rozkłady || [];


    if (rozklady.length === 0) {

        return null;

    }


    const typDnia =
        okreslTypDnia(
            wybranaData
        );


    console.log(
        "FWTP – typ dnia:",
        typDnia
    );


    /*
     * =====================================================
     * SOBOTA
     * =====================================================
     */

    if (typDnia === "sobota") {

        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                nazwa.includes("sobot")
            ) {

                return rozklad;

            }

        }

    }



    /*
     * =====================================================
     * NIEDZIELA / ŚWIĘTA
     * =====================================================
     */

    if (typDnia === "niedziela") {

        /*
         * Najpierw szukamy rozkładu
         * niedzielnego.
         */

        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                nazwa.includes("niedziel")
            ) {

                return rozklad;

            }

        }


        /*
         * Jeżeli nie ma osobnego
         * rozkładu niedzielnego,
         * szukamy soboty/niedzieli/świąt.
         */

        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                (
                    nazwa.includes("sobot") &&
                    nazwa.includes("niedziel")
                )
                ||
                nazwa.includes("swieta")
                ||
                nazwa.includes("swiat")
            ) {

                return rozklad;

            }

        }

    }



    /*
     * =====================================================
     * PONIEDZIAŁEK – PIĄTEK
     * =====================================================
     */

    if (typDnia === "roboczy") {

        for (
            const rozklad
            of rozklady
        ) {

            const nazwa =
                normalizujTekst(
                    rozklad.nazwa
                );


            if (
                nazwa.includes(
                    "poniedzialku"
                )
                ||
                nazwa.includes(
                    "poniedzialek"
                )
                ||
                nazwa.includes(
                    "poniedzialku do piatku"
                )
                ||
                (
                    nazwa.includes("piat")
                    &&
                    !nazwa.includes("sobot")
                )
            ) {

                /*
                 * Jeżeli nazwa mówi:
                 * "oprócz świąt", jest to
                 * dokładnie wariant roboczy.
                 */

                return rozklad;

            }

        }

    }



    /*
     * =====================================================
     * OSTATECZNY FALLBACK
     * =====================================================
     */

    return rozklady[0];

}



/* =========================================================
   GENEROWANIE KIERUNKÓW
   ========================================================= */

function generujKierunki() {

    const kontener =
        document.getElementById(
            "kierunki"
        );


    kontener.innerHTML = "";


    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !Array.isArray(
            rozklad.kierunki
        )
    ) {

        return;

    }


    const kierunki =
        rozklad.kierunki;


    kierunki.forEach(
        function (
            kierunek,
            index
        ) {

            const przycisk =
                document.createElement(
                    "button"
                );


            przycisk.className =
                "kierunek-btn";


            if (
                index ===
                aktualnyKierunek
            ) {

                przycisk.classList.add(
                    "aktywny"
                );

            }


            /*
             * Kierunek określamy
             * na podstawie OSTATNIEGO
             * przystanku.
             */

            const przystanki =
                Array.isArray(
                    kierunek.przystanki
                )
                    ?
                    kierunek.przystanki
                    :
                    [];


            let nazwaKierunku =
                "";


            if (
                przystanki.length > 0
            ) {

                const ostatni =
                    przystanki[
                        przystanki.length - 1
                    ];


                nazwaKierunku =
                    ostatni.nazwa ||
                    "";

            }


            /*
             * Jeżeli nie udało się
             * znaleźć nazwy.
             */

            if (
                !nazwaKierunku
            ) {

                nazwaKierunku =
                    "Kierunek " +
                    (
                        index + 1
                    );

            }


            przycisk.textContent =
                nazwaKierunku;


            przycisk.onclick =
                function () {

                    zmienKierunek(
                        index
                    );

                };


            kontener.appendChild(
                przycisk
            );

        }
    );

}



/* =========================================================
   ZMIANA KIERUNKU
   ========================================================= */

function zmienKierunek(index) {

    aktualnyKierunek =
        index;


    pokazRozklad();

}



/* =========================================================
   WYBÓR DNIA
   ========================================================= */

function wybierzDzien(dzien) {

    aktualnyDzien =
        dzien;


    const przyciski =
        document.querySelectorAll(
            ".dzien-btn"
        );


    przyciski.forEach(
        function (
            przycisk
        ) {

            przycisk.classList.remove(
                "aktywny"
            );

        }
    );


    const kalendarz =
        document.getElementById(
            "kalendarz"
        );


    kalendarz.style.display =
        "none";



    if (
        dzien === "dzisiaj"
    ) {

        document.getElementById(
            "dzisiajBtn"
        ).classList.add(
            "aktywny"
        );


        wybranaData =
            new Date();

    }



    if (
        dzien === "jutro"
    ) {

        document.getElementById(
            "jutroBtn"
        ).classList.add(
            "aktywny"
        );


        wybranaData =
            new Date();


        wybranaData.setDate(
            wybranaData.getDate() + 1
        );

    }



    if (
        dzien === "kalendarz"
    ) {

        document.getElementById(
            "kalendarzBtn"
        ).classList.add(
            "aktywny"
        );


        kalendarz.style.display =
            "block";


        const input =
            document.getElementById(
                "wybranaData"
            );


        input.value =
            formatujDateInput(
                wybranaData
            );

    }


    /*
     * Po zmianie dnia
     * sprawdzamy, czy istnieje
     * dany kierunek.
     */

    const rozklad =
        znajdzRozklad();


    if (
        !rozklad ||
        !rozklad.kierunki ||
        !rozklad.kierunki[
            aktualnyKierunek
        ]
    ) {

        aktualnyKierunek = 0;

    }


    pokazRozklad();

}



/* =========================================================
   KALENDARZ
   ========================================================= */

document
    .getElementById(
        "wybranaData"
    )
    .addEventListener(
        "change",
        function () {

            if (
                !this.value
            ) {

                return;

            }


            const czesci =
                this.value.split("-");


            wybranaData =
                new Date(
                    Number(
                        czesci[0]
                    ),
                    Number(
                        czesci[1]
                    ) - 1,
                    Number(
                        czesci[2]
                    )
                );


            const rozklad =
                znajdzRozklad();


            if (
                !rozklad ||
                !rozklad.kierunki ||
                !rozklad.kierunki[
                    aktualnyKierunek
                ]
            ) {

                aktualnyKierunek = 0;

            }


            pokazRozklad();

        }
    );



/* =========================================================
   USTAWIENIE DATY
   ========================================================= */

function ustawDate() {

    wybranaData =
        new Date();

}



/* =========================================================
   POKAZANIE ROZKŁADU
   ========================================================= */

function pokazRozklad() {

    if (!daneLinii) {
        return;
    }


    /*
     * Najpierw pobieramy właściwy
     * wariant dnia.
     */

    const rozklad =
        znajdzRozklad();


    /*
     * Następnie generujemy
     * przyciski kierunków.
     */

    generujKierunki();


    const kontener =
        document.getElementById(
            "przystanki"
        );


    const typ =
        document.getElementById(
            "typRozkladu"
        );


    if (!rozklad) {

        typ.textContent =
            "Brak rozkładu";


        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak danych rozkładu.' +
            '</div>';


        return;

    }


    /*
     * Nazwa rozkładu
     */

    typ.textContent =
        rozklad.nazwa ||
        "Rozkład jazdy";


    /*
     * Kierunki
     */

    const kierunki =
        rozklad.kierunki || [];


    if (
        kierunki.length === 0
    ) {

        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Ten rozkład nie zawiera kierunków.' +
            '</div>';


        return;

    }


    /*
     * Zabezpieczenie indeksu.
     */

    if (
        aktualnyKierunek < 0 ||
        aktualnyKierunek >=
        kierunki.length
    ) {

        aktualnyKierunek = 0;

    }


    const kierunek =
        kierunki[
            aktualnyKierunek
        ];


    const przystanki =
        kierunek.przystanki || [];


    kontener.innerHTML = "";


    /*
     * Jeżeli nie ma przystanków.
     */

    if (
        przystanki.length === 0
    ) {

        kontener.innerHTML =
            '<div class="brak-danych">' +
            'Brak przystanków w tym kierunku.' +
            '</div>';


        return;

    }



    /*
     * =====================================================
     * PRZYSTANKI
     * =====================================================
     */

    przystanki.forEach(
        function (
            przystanek,
            index
        ) {

            const blok =
                document.createElement(
                    "div"
                );


            blok.className =
                "przystanek";



            /*
             * -----------------------------------------------
             * NAGŁÓWEK PRZYSTANKU
             * -----------------------------------------------
             */

            const naglowek =
                document.createElement(
                    "div"
                );


            naglowek.className =
                "przystanek-naglowek";



            /*
             * LP
             */

            const lp =
                document.createElement(
                    "span"
                );


            lp.className =
                "lp";


            lp.textContent =
                przystanek.lp ||
                (
                    index + 1
                );



            /*
             * NAZWA
             */

            const nazwa =
                document.createElement(
                    "span"
                );


            nazwa.className =
                "nazwa-przystanku";


            nazwa.textContent =
                przystanek.nazwa ||
                "Przystanek";



            /*
             * NUMER
             */

            const nr =
                document.createElement(
                    "span"
                );


            nr.className =
                "numer-przystanku";


            if (
                przystanek.nr !==
                undefined &&
                przystanek.nr !==
                null &&
                String(
                    przystanek.nr
                ).trim() !== ""
            ) {

                nr.textContent =
                    "nr " +
                    przystanek.nr;

            }



            naglowek.appendChild(
                lp
            );


            naglowek.appendChild(
                nazwa
            );


            naglowek.appendChild(
                nr
            );


            blok.appendChild(
                naglowek
            );



            /*
             * -----------------------------------------------
             * GODZINY
             * -----------------------------------------------
             */

            const godziny =
                document.createElement(
                    "div"
                );


            godziny.className =
                "godziny";


            /*
             * WAŻNE:
             *
             * JSON ma:
             *
             * "kursy": [
             *   {
             *      "numer": "110.1001",
             *      "czas": "05:10",
             *      "wariant": "D"
             *   }
             * ]
             *
             * Dlatego NIE używamy:
             *
             * przystanek.godziny
             *
             * tylko:
             *
             * przystanek.kursy
             */

            const kursy =
                Array.isArray(
                    przystanek.kursy
                )
                    ?
                    przystanek.kursy
                    :
                    [];


            if (
                kursy.length === 0
            ) {

                godziny.innerHTML =
                    '<div class="brak-godzin">' +
                    'Brak odjazdów' +
                    '</div>';

            }
            else {

                kursy.forEach(
                    function (
                        kurs
                    ) {

                        /*
                         * Kurs może być
                         * obiektem.
                         */

                        if (
                            !kurs ||
                            typeof kurs !==
                            "object"
                        ) {

                            return;

                        }


                        const czas =
                            kurs.czas ||
                            "";


                        if (
                            !czas
                        ) {

                            return;

                        }


                        const element =
                            document.createElement(
                                "div"
                            );


                        element.className =
                            "godzina";


                        element.textContent =
                            czas;


                        /*
                         * Wariant kursu
                         *
                         * Pokazujemy go tylko,
                         * jeżeli istnieje.
                         */

                        if (
                            kurs.wariant
                        ) {

                            const wariant =
                                document.createElement(
                                    "span"
                                );


                            wariant.className =
                                "godzina-wariant";


                            wariant.textContent =
                                kurs.wariant;


                            element.appendChild(
                                wariant
                            );

                        }


                        /*
                         * Numer kursu
                         * zapisujemy jako tooltip.
                         */

                        if (
                            kurs.numer
                        ) {

                            element.title =
                                "Kurs " +
                                kurs.numer;

                        }


                        godziny.appendChild(
                            element
                        );

                    }
                );


                /*
                 * Jeżeli wszystkie kursy
                 * nie miały poprawnego czasu.
                 */

                if (
                    godziny.children.length === 0
                ) {

                    godziny.innerHTML =
                        '<div class="brak-godzin">' +
                        'Brak poprawnych godzin' +
                        '</div>';

                }

            }


            blok.appendChild(
                godziny
            );


            kontener.appendChild(
                blok
            );

        }
    );

}



/* =========================================================
   FORMAT DATY
   ========================================================= */

function formatujDateInput(
    data
) {

    const rok =
        data.getFullYear();


    const miesiac =
        String(
            data.getMonth() + 1
        )
        .padStart(
            2,
            "0"
        );


    const dzien =
        String(
            data.getDate()
        )
        .padStart(
            2,
            "0"
        );


    return (
        rok +
        "-" +
        miesiac +
        "-" +
        dzien
    );

}



/* =========================================================
   BŁĄD
   ========================================================= */

function pokazBlad(
    tytul,
    opis
) {

    document.getElementById(
        "numerLinii"
    ).textContent =
        "Błąd";


    document.getElementById(
        "trasa"
    ).textContent =
        "";


    document.getElementById(
        "kierunki"
    ).innerHTML =
        "";


    document.getElementById(
        "typRozkladu"
    ).style.display =
        "none";


    document.getElementById(
        "przystanki"
    ).innerHTML =

        '<div class="blad">' +

        '<strong>' +
        tytul +
        '</strong>' +

        opis +

        '</div>';

}
