<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Aktualność</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<header class="topbar">

    <div class="logo">
        ROZKŁADY
    </div>

   <nav class="menu" id="menu"></nav>

</header>


<main class="container">

    <article
        id="artykul"
        class="artykul">

        Ładowanie...

    </article>

</main>


<footer>

    <p>
       FWTP © 2026
    </p>

</footer>


<script>

const parametry =
    new URLSearchParams(
        window.location.search
    );

const id =
    parametry.get("id");


if (!id) {

    pokazBlad(
        "Nie podano identyfikatora aktualności."
    );

} else {

    pobierzArtykul();

}


function pobierzArtykul() {

    fetch("../aktualnosci/aktualnosci.json")

        .then(response => {

            if (!response.ok) {
                throw new Error(
                    "Nie udało się pobrać danych."
                );
            }

            return response.json();

        })

        .then(aktualnosci => {

            const aktualnosc =
                aktualnosci.find(
                    element =>
                        element.id === id
                );

            if (!aktualnosc) {

                pokazBlad(
                    "Nie znaleziono tej aktualności."
                );

                return;
            }

            pokazArtykul(
                aktualnosc
            );

        })

        .catch(error => {

            console.error(error);

            pokazBlad(
                "Nie udało się załadować aktualności."
            );

        });

}


function pokazArtykul(aktualnosc) {

    document.title =
        aktualnosc.tytul;

    const kontener =
        document.getElementById(
            "artykul"
        );

    let tresc = "";

    if (Array.isArray(aktualnosc.tresc)) {

        aktualnosc.tresc.forEach(
            element => {

                if (element.typ === "naglowek") {

                    tresc += `
                        <h2>
                            ${escapeHTML(element.tekst)}
                        </h2>
                    `;

                } else if (element.typ === "tekst") {

                    tresc += `
                        <p>
                            ${escapeHTML(element.tekst)}
                        </p>
                    `;

                }

            }
        );

    }

    kontener.innerHTML = `

        <a
            class="powrot"
            href="../aktualnosci/">
            ← Powrót do aktualności
        </a>

        <div class="artykul-data">
            ${formatujDate(aktualnosc.data)}
        </div>

        <h1>
            ${escapeHTML(aktualnosc.tytul)}
        </h1>

        ${tresc}

    `;

}


function pokazBlad(tekst) {

    document.getElementById(
        "artykul"
    ).innerHTML = `

        <a
            class="powrot"
            href="../aktualnosci/">
            ← Powrót do aktualności
        </a>

        <h1>Błąd</h1>

        <p>
            ${escapeHTML(tekst)}
        </p>

    `;

}


function formatujDate(data) {

    const d =
        new Date(data + "T00:00:00");

    return d.toLocaleDateString(
        "pl-PL",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


function escapeHTML(tekst) {

    return String(tekst)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

</script>
<script src="/FWTP/js/menu.js"></script>
    
</body>
</html>
