
<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Linie – Rozkłady jazdy</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .search {

            width: 100%;

            padding: 14px;

            font-size: 17px;

            border: 1px solid #ccc;

            border-radius: 6px;

            margin-bottom: 25px;

        }


        .linie {

            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(90px, 1fr));

            gap: 10px;

        }


        .linia {

            display: flex;

            align-items: center;

            justify-content: center;

            height: 55px;

            background: white;

            border: 1px solid #ccc;

            border-radius: 6px;

            text-decoration: none;

            color: #222;

            font-size: 18px;

            font-weight: bold;

            transition: 0.15s;

        }


        .linia:hover {

            background: #0066cc;

            color: white;

            border-color: #0066cc;

            transform: translateY(-2px);

        }


        .sekcja {

            margin-bottom: 35px;

        }


        .sekcja h2 {

            border-bottom: 1px solid #ddd;

            padding-bottom: 10px;

        }

    </style>

</head>


<body>


<header class="topbar">

    <div class="logo">
        ROZKŁADY
    </div>

    <nav>

        <a href="../index.html">
            Strona główna
        </a>

        <a href="index.html">
            Linie
        </a>

    </nav>

</header>



<main class="container">


    <h1>Linie</h1>

    <p>
        Wybierz numer linii.
    </p>


    <input
        type="text"
        id="search"
        class="search"
        placeholder="🔎 Wyszukaj linię..."
    >


    <div class="sekcja">

        <h2>🚌 Autobusy</h2>

        <div
            id="autobusy"
            class="linie"
        ></div>

    </div>


    <div class="sekcja">

        <h2>🚋 Tramwaje</h2>

        <div
            id="tramwaje"
            class="linie"
        ></div>

    </div>


    <div class="sekcja">

        <h2>🚇 Metro</h2>

        <div
            id="metro"
            class="linie"
        ></div>

    </div>


</main>



<script src="../js/script.js"></script>


</body>
</html>
