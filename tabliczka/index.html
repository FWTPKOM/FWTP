<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FWTP - Tabliczki</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* =========================================================
           STRONA
           ========================================================= */

        .tabliczka-page {
            max-width: 1260px;
            margin: 24px auto;
            padding: 0 15px;
        }

        .sterowanie {
            margin-bottom: 18px;
            padding: 16px;

            background: #fff;

            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .sterowanie h1 {
            margin: 0 0 13px;

            font-size: 25px;
        }

        .sterowanie-grid {
            display: grid;
            grid-template-columns: 110px 1fr 1.3fr 155px auto;
            gap: 9px;
            align-items: end;
        }

        .pole {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .pole label {
            font-size: 13px;
            font-weight: 700;
        }

        .pole input,
        .pole select {
            width: 100%;
            min-height: 39px;

            padding: 7px 9px;

            background: #fff;
            color: #222;

            border: 1px solid #ccc;
            border-radius: 5px;

            font: inherit;
            font-size: 14px;

            box-sizing: border-box;
        }

        .pokaz-btn {
            min-height: 39px;
            padding: 8px 18px;

            border: 0;
            border-radius: 5px;

            background: #d61c12;
            color: #fff;

            font: inherit;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        .pokaz-btn:hover {
            background: #b8170f;
        }

        .status {
            margin-top: 9px;

            color: #666;

            font-size: 13px;
        }

        .tabliczka-scroll {
            overflow-x: auto;
            padding-bottom: 8px;

            -webkit-overflow-scrolling: touch;
        }


        /* =========================================================
           TABLICZKA - PROPORCJE WZOROWANE NA PDF
           ========================================================= */


    .tabliczka,
.tabliczka * {
    font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
}

.numer-linii-box,
.numer-linii-box * {
    font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
}

        .tabliczka {
            --lewa: 74.0%;
            --prawa: 26.0%;

            display: grid;
            grid-template-columns: var(--lewa) var(--prawa);

            width: 210mm;
            height: 160mm;
            min-height: 160mm;

            margin: 0 auto;

            background: #fff;
            color: #000000;

            border: 4px double #111;


            box-sizing: border-box;
        }

        .tabliczka.trasa-2-kol {
            --lewa: 50.5%;
            --prawa: 49.5%;
        }

        .panel-lewy {
            position: relative;

            min-width: 0;

            border-right: 0;
        }

        .panel-lewy::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            right: -3px;
            width: 1px;
            background: #777;
            z-index: 2;
        }

        .panel-prawy {
            min-width: 0;
            height: 100%;
            overflow: hidden;
        }


        /* =========================================================
           NAGŁÓWEK
           ========================================================= */

        .naglowek-tabliczki {
            display: grid;
            grid-template-columns: 155px minmax(0, 1fr);

            width: min(560px, calc(100% - 23px));

            margin: 12px 0 0 17px;
        }

        .numer-linii-box {
            height: 78px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;
            margin: 0;

            border: 1px solid #777;

            font-size: 80px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -2px;
            text-align: center;
            text-indent: 0;

            box-sizing: border-box;
        }

        .dane-linii {
            padding: 5px 0 0 13px;
        }

        .typ-linii {
            position: relative;
            top: -4px;
            margin-bottom: 9px;

            font-size: 17px;
            font-weight: 400;
        }

        .kierunek {
            position: relative;
            top: 2px;
            margin-bottom: 5px;

            font-size: 17px;
            font-weight: 400;
        }

        .kierunek::before {
            content: "→";
            display: inline-block;

            margin-right: 7px;
        }

        .wazny {
            font-size: 11px;
            color: #000000;
        }


        /* =========================================================
           TABELE ROZKŁADÓW
           ========================================================= */

        .rozklady-wrap {
            width: min(640px, calc(100% - 36px));

            margin: 3px 0 0 17px;
        }

        .rozklady-grid {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: max-content;
            align-items: start;
            justify-content: start;

            width: max-content;
            max-width: 100%;
        }

        .rozklady-grid.kol-1,
        .rozklady-grid.kol-2,
        .rozklady-grid.kol-3 {
            grid-template-columns: none;
            max-width: 100%;
        }

        /*
           Każdy typ dnia jest JEDNYM pudełkiem:
           tytuł dnia + Godz. + Minuty + wszystkie godziny.
           Dzięki white-space: nowrap w tytule minimalna szerokość
           całej kolumny nigdy nie będzie mniejsza niż sam napis typu dnia.
        */

        .rozklady-grid.kol-3.weekend-rowny {
            grid-template-columns: max-content repeat(2, minmax(max-content, 1fr));
        }

        .rozklady-grid.kol-3.weekend-rowny .dzien:nth-child(2),
        .rozklady-grid.kol-3.weekend-rowny .dzien:nth-child(3) {
            width: 100%;
            min-width: 100%;
        }

        .dzien {
            display: block;

            width: max-content;
            min-width: max-content;

            border: 1px solid #111;
            box-sizing: border-box;
            overflow: hidden;
        }

        .dzien + .dzien {
            margin-left: 3px;
        }

        .dzien-tytul {
            min-height: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 1px 8px 0 8px;
            font-size: 16px;
            line-height: 1.05;
            font-weight: 400;
            text-align: center;
            white-space: nowrap;
            color: #000000;
            width: auto;
            min-width: max-content;
            box-sizing: border-box;
        }

        .godziny-head {
            display: grid;
            grid-template-columns: 22px minmax(0, 1fr);
            width: 100%;

            min-height: 21px;

            border-bottom: 1px solid #111;

            font-size: 13px;
            font-weight: 400;
        }

        .godziny-head > div {
            padding: 2px 2px;
        }

        .godziny-head > div:first-child {
            padding-left: 2px;
            padding-right: 0;
        }

        .godziny-head > div:last-child {
            padding-left: 15px;
            padding-right: 2px;
        }

        .godzina-row {
            display: grid;
            grid-template-columns: 22px minmax(0, 1fr);
            width: 100%;

            min-height: 16px;
            height: 16px;
            align-items: stretch;

            border-bottom: 1px solid #d6d6d6;
            box-sizing: border-box;
        }

        .godzina-row:last-child {
            border-bottom: 0;
        }

        .godzina-cell {
            position: relative;
            left: 1px;
            padding: 0 4px 0 1px;

            border-right: 1px solid #111;

            font-size: 16px;
            line-height: 16px;
            font-weight: 800;
            text-align: right;

            height: 16px;
            box-sizing: border-box;
        }

        .minuty-cell {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 24px;
            align-items: center;
            justify-content: start;
            column-gap: 0;

            min-width: 0;
            height: 16px;

            padding: 0 1px 0 3.5px;

            font-size: 15px;
            line-height: 16px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            box-sizing: border-box;
        }

        .minuta {
            display: inline-flex;
            align-items: baseline;
            justify-content: flex-start;

            width: 24px;
            min-width: 24px;
            height: 16px;
            line-height: 16px;

            white-space: nowrap;
            
        }

        /*
           Litera wariantu ma taki sam rozmiar i tę samą linię bazową
           co minuta. Każda minuta zajmuje jednak identyczne 26 px,
           więc symbole nie rozsuwają następnych minut.
        */
        .symbol {
            position: static;

            margin-left: 0;

            font-size: 13px;
            line-height: inherit;
            font-weight: 400;
            vertical-align: baseline;
        }

        .brak {
            padding: 16px 8px;

            color: #777;

            font-size: 11px;
            text-align: center;
        }


        /*
           Tabela dla typu dnia, w którym linia nie kursuje.
           Zachowujemy dokładnie taką samą wysokość jak pozostałe
           rozkłady, ale nie pokazujemy godzin ani minut.
        */
        .nie-kursuje-body {
            position: relative;
        }

        .godzina-row-nie-kursuje {
            border-bottom: 0;
        }

        .nie-kursuje-napis {
            position: absolute;

            left: 22px;
            right: 0;
            top: 0;
            bottom: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 4px;
            text-align: center;

            pointer-events: none;
            box-sizing: border-box;
            font-family: Calibri, "Segoe UI", Arial, sans-serif;
            font-size: 13.5px;
            line-height: 1;
            font-weight: 400;
            letter-spacing: 0.75px;
            transform: scaleY(1.30);
            transform-origin: center;

        }


        /* =========================================================
           LEGENDA
           ========================================================= */

        .legenda {
            max-width: 620px;

            margin: 11px 12px 12px 17px;

            font-size: 14px;
            line-height: 1.25;
        }

        .legenda-wiersz {
            margin-top: -3px;

            display: grid;
            grid-template-columns: 22px auto minmax(0, 1fr);
            
            align-items: baseline;

            font-weight: 700;
        }

        .legenda-litera {
            display: block;

            width: 22px;
            min-width: 22px;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .legenda-myslnik {
            display: block;
            margin-left: -2px;
            margin-right: 5px;
            padding: 0;
            text-align: center;
        }

        .legenda-opis {
            display: block;
            min-width: 0;
        }


        /* =========================================================
           PIONOWY NAPIS PRZYSTANKU
           ========================================================= */

        .etykieta-przystanku {
            position: absolute;

            left: 1px;
            bottom: 13px;

            writing-mode: vertical-rl;
            transform: rotate(180deg);

            font-size: 13px;
            line-height: 1;
        }


        /* =========================================================
           TRASA - PRAWA CZĘŚĆ
           ========================================================= */

        .trasa-head {
            min-height: 24px;

            display: grid;
            grid-template-columns: 1fr;
            align-items: center;

            margin-left: 3px;
            width: calc(100% - 3px);
            padding: 2px 0;

            border-bottom: 1px solid #777;

            font-size: 13px;
            font-weight: 400;

            box-sizing: border-box;
        }

        .trasa-head.cols-2 {
            grid-template-columns: 1fr 1fr;
        }

        .trasa-head-label {
            min-width: 0;
            padding: 0 6px 0 3px;
            transform: translateY(3px);
            box-sizing: border-box;
            font-weight: 400;
        }

        .trasa-head.cols-2 .trasa-head-label:first-child {
            border-right: 0;
        }

        .trasa-columns {
            display: grid;

            height: calc(100% - 24px);
            min-height: 0;
            overflow: hidden;
        }

        .trasa-columns.cols-1 {
            grid-template-columns: 1fr;
        }

        .trasa-columns.cols-2 {
            grid-template-columns: 1fr 1fr;
        }

        .trasa-kol {
            min-width: 0;
            overflow: visible;

            /* 5 px bliżej pionowej linii oddzielającej rozkład od trasy */
            padding: 4px 2px 8px 2px;

            border-right: 1px solid #777;
        }

        .trasa-kol:last-child {
            border-right: 0;
        }

        .trasa-lista {
            margin: 0;
            padding: 0;

            list-style: none;
        }

        .trasa-stop {
            display: grid;
            grid-template-columns: 19px 12px minmax(0, 1fr) 12px;
            align-items: center;

            min-height: 16.5px;

            color: #111;

            font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
            font-size: 13.5px;
            line-height: 1;
        }

        .trasa-stop.przed {
            color: #777;
        }

        .trasa-czas {
            align-self: start;

            padding-top: 0;
            padding-right: 1px;

            text-align: right;
            white-space: nowrap;
            line-height: 15px;
        
            font-size: 13px;
        }

        .trasa-os {
            position: relative;

            align-self: stretch;
        }

        .trasa-os::before {
            content: "";

            position: absolute;

            left: 4.1px;
            top: 0;
            bottom: 0;

            width: 2.25px;

            background: currentColor;
        }

        .trasa-os::after {
            content: "";

            position: absolute;

            left: 1px;
            top: 3px;

            width: 8.5px;
            height: 8.5px;

            transform: none;

            background: currentColor;

            border-radius: 50%;
        }

        .trasa-stop.kraniec-poczatek .trasa-os::before {
            top: 8px;
        }

        .trasa-stop.kraniec-koniec .trasa-os::before {
            bottom: calc(100% - 8px);
        }

        /* Jeżeli pod trasą podstawową jest dalszy wariant/wydłużenie,
           z kropki ostatniego przystanku podstawowego wychodzi
           krótka kreska w dół. */
        .trasa-kol:has(.trasa-extra)
        .trasa-stop.kraniec-koniec
        .trasa-os::before {
            bottom: 0;
        }

        .trasa-nazwa {
            min-width: 0;

            overflow: visible;

            white-space: nowrap;
            overflow-wrap: normal;
            word-break: normal;
            hyphens: none;

            font-weight: 400;
            line-height: 1;
        }

        .trasa-stop.kraniec-poczatek .trasa-nazwa,
        .trasa-stop.kraniec-koniec .trasa-nazwa {
            font-weight: 700;
        }

        .trasa-nazwa.zawijaj {
            white-space: normal;
        }

        /* Nazwa w dwóch liniach ma własne miejsce w układzie,
           dzięki czemu kolejny przystanek nie nachodzi na drugą linię. */
        .trasa-stop:has(.trasa-nazwa.zawijaj) {
            min-height: 33px;
        }

        .trasa-nazwa.zawijaj .trasa-nazwa-aktywna {
    white-space: normal;
}

        .trasa-stop.wybrany {
            color: #111;
        }

        .trasa-stop.nz .trasa-os::after {
            background: #fff;
            border: 2px solid currentColor;
            box-sizing: border-box;
        }

        .trasa-nz {
            justify-self: end;
            align-self: start;

            position: relative;
            right: -1px;

            padding-right: 0;

            text-align: right;

            font-size: 15.5px;
            line-height: 1;
            font-weight: 400;
        }


        /* =========================================================
           BŁĄD
           ========================================================= */

        .blad {
            padding: 20px;

            background: #fff;

            border: 1px solid #ddd;
            border-radius: 7px;

            color: #666;
        }


        /* =========================================================
           RESPONSYWNOŚĆ
           ========================================================= */

        @media (max-width: 850px) {

            .sterowanie-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 560px) {

            .tabliczka-page {
                margin: 15px auto;
                padding: 0 8px;
            }

            .sterowanie-grid {
                grid-template-columns: 1fr;
            }
        }



        /* =========================================================
           TRASY WYDŁUŻONE / WARIANTOWE
           ========================================================= */

        .trasa-extra {
            margin-top: 14px;
        }


        /*
           Nagłówki pojawiające się wewnątrz głównej listy trasy,
           gdy autobus wjeżdża na odcinek wariantowy i później
           wraca na wspólną trasę.
        */
        .trasa-separator {
            display: block;
            list-style: none;
            margin: 14px 0 9px 0;
            padding: 0;
            min-height: 16px;
        }

        .trasa-separator-title {
            display: block;
            width: 100%;
            margin: 0;
            padding: 0 4px;
            box-sizing: border-box;

            font-family: Calibri, "Segoe UI", Arial, sans-serif;
            font-size: 16px;
            line-height: 16px;
            font-weight: 400;
            color: #111;

            /*
               Jeżeli lista liter nie mieści się w szerokości kolumny,
               tekst przechodzi do następnego wiersza.
            */
            white-space: normal;
            overflow-wrap: normal;
            word-break: normal;
            text-align: center;

            transform: scaleY(1.08);
            transform-origin: center;
        }

        .trasa-extra-title {
            margin: auto auto 9px auto;
            font-size: 16px;
            line-height: 16px;
            font-weight: 400;
            color: #111;
            white-space: nowrap;
            text-align: center;
            transform-origin: center;
        }

        .trasa-extra-lista {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .trasa-extra-stop {
            display: grid;
            grid-template-columns: 19px 12px minmax(0,1fr) 12px;
            align-items: center;
            min-height: 16.5px;
            color: #111;
            font-family: Calibri, "Segoe UI", Arial, sans-serif;
            font-size: 13.5px;
            line-height: 1;
            transform: none;
        }

        .trasa-extra-stop .trasa-czas {
            text-align: right;
        }

        .trasa-extra-stop .trasa-os {
            position: relative;
            align-self: stretch;
            min-height: 16.5px;
        }

        .trasa-extra-stop .trasa-os::before {
            content: "";
            position: absolute;
            left: 4.1px;
            top: 0;
            bottom: 0;
            width: 2.25px;
            background: #111;
        }

        /* Ostatni przystanek wydłużenia:
           linia dochodzi tylko od góry do kropki. */
        .trasa-extra-stop:last-child .trasa-os::before {
            bottom: calc(100% - 8px);
        }

        .trasa-extra-stop .trasa-os::after {
            content: "";
            position: absolute;
            left: 1px;
            top: 4px;
            width: 8.5px;
            height: 8.5px;
            border-radius: 50%;
            background: #111;
        }

        .trasa-extra-stop .trasa-nazwa {
            min-width: 0;
            overflow: visible;
            white-space: nowrap;
            overflow-wrap: normal;
            word-break: normal;
            hyphens: none;
            font-weight: 400;
            line-height: 1;
            transform: scaleY(1.30);
            transform-origin: left center;
            letter-spacing: 0.75px;
        }

        /* Tylko kraniec trasy wydłużonej jest pogrubiony. */
        .trasa-extra-stop:last-child .trasa-nazwa {
            font-weight: 700;
        }

        .trasa-extra-stop .trasa-nz {
            transform: scaleY(1.30);
            transform-origin: right center;
        }

        .trasa-extra-stop .trasa-nazwa.zawijaj {
            white-space: normal;
        }

        .trasa-extra-stop:has(.trasa-nazwa.zawijaj) {
            min-height: 33px;
        }

        /* =========================================================
           DRUK
           ========================================================= */

        @media print {

            body {
                background: #fff !important;
            }

            .topbar,
            .sterowanie,
            footer {
                display: none !important;
            }

            .tabliczka-page {
                max-width: none;
                margin: 0;
                padding: 0;
            }

            .tabliczka-scroll {
                overflow: visible;
            }

            .tabliczka {
                width: 210mm;
                height: 160mm;
                min-height: 160mm;
                margin: 0 auto;
            }
        }
    
/* =========================================================
   DOPASOWANIE PROPORCJI CZCIONKI DO WZORU PDF
   Delikatne rozciągnięcie pionowe tekstu o 8%.
   Numer linii pozostaje bez skalowania.
   ========================================================= */

.typ-linii,
.kierunek,
.wazny,
.dzien-tytul,
.godziny-head,
.legenda,
.trasa-head-label,
.stop-time,
.stop-zadanie,
.trasa-extra-title,
.trasa-extra-stop {
    transform: scaleY(1.08);
    transform-origin: center;
}

/* Lista przystanków – mocniejsze pionowe rozciągnięcie,
   żeby efekt był widoczny również przy nazwach przystanków. */
.stop-name,
.trasa-nazwa {
    transform: scaleY(1.30);
    transform-origin: left center;
    letter-spacing: 0.75px;
}

/* Aktywny przystanek ma takie samo pionowe rozciągnięcie
   jak pozostałe nazwy przystanków — również przy dwóch liniach. */
.trasa-stop.wybrany .trasa-nazwa {
    transform: scaleY(1.30);
    transform-origin: left center;
}

.trasa-nazwa-aktywna {
    position: relative;
    display: inline;

    padding: 0;
    margin: 0;

    /* KLUCZOWE:
       aktywny ma dokładnie taki sam line-height jak zwykła nazwa. */
    line-height: 1;

    color: #fff;
    font-weight: inherit;
    letter-spacing: inherit;

    vertical-align: baseline;

    /* Tło jest tylko dekoracją tekstu i nie zmienia wysokości linii. */
    background:
        linear-gradient(
            to bottom,
            transparent 0,
            transparent 1.55px,
            #111 1.55px,
            #111 calc(100% - 1.55px),
            transparent calc(100% - 1.55px),
            transparent 100%
        );

    box-shadow: none;

    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
}


/* Symbol „ż” rozciągnięty pionowo tak samo jak lista przystanków. */
.trasa-nz {
    transform: scaleY(1.30);
    transform-origin: right center;
}

/* Godziny i minuty bez pionowego skalowania. */
.godzina-cell {
    transform: none;
}

/* Minuty rozciągnięte tylko pionowo.
   Nie zmieniamy letter-spacing ani szerokości komórki,
   więc cyfry nie są od siebie bardziej odsunięte. */

function rozdzielNazweIMiejscowosc(nazwa){

    const tekst = String(nazwa || "").trim();

    const dopasowanie = tekst.match(/^(.*?)\s*\(([^()]*)\)\s*$/);

    if(!dopasowanie){
        return {
            nazwa: tekst,
            miejscowosc: ""
        };
    }

    const nazwaBezNawiasu = String(dopasowanie[1] || "").trim();
    const tekstWNawiasie = String(dopasowanie[2] || "").trim();

    const jestMiejscowoscia = MIEJSCOWOSCI.some(
        miejscowosc =>
            normalizuj(miejscowosc) === normalizuj(tekstWNawiasie)
    );

    if(!jestMiejscowoscia){
        return {
            nazwa: tekst,
            miejscowosc: ""
        };
    }

    return {
        nazwa: nazwaBezNawiasu,
        miejscowosc: tekstWNawiasie
    };
}

    String(
        parametry.get("linia")||""
    ).trim();

/* =========================================================
   DATA / URL
   ========================================================= */

function dataZTekstu(tekst){

    const m=
        /^(\d{4})-(\d{2})-(\d{2})$/
            .exec(
                String(
                    tekst||""
                )
            );

    if(!m)return null;

    const d=
        new Date(
            Number(m[1]),
            Number(m[2])-1,
            Number(m[3])
        );

    return Number.isNaN(
        d.getTime()
    )
        ? null
        : d;
}


function dataISO(data){

    return[
        data.getFullYear(),
        String(
            data.getMonth()+1
        ).padStart(2,"0"),
        String(
            data.getDate()
        ).padStart(2,"0")
    ].join("-");
}


function pobierzIndeksPrzystanku(){

    const tekst=
        String(
            parametry.get("przystanek")||""
        );

    if(
        tekst.startsWith("idx:")
    ){
        const n=
            Number(
                tekst.slice(4)
            );

        return Number.isInteger(n)
            ? n
            : 0;
    }

    const n=
        Number(tekst);

    return Number.isInteger(n)
        ? n
        : 0;
}


function zapiszURL(){

    const url=
        new URL(
            window.location.href
        );

    url.searchParams.set(
        "linia",
        aktualnaLinia
    );

    url.searchParams.set(
        "data",
        dataISO(
            wybranaData
        )
    );

    url.searchParams.set(
        "kierunek",
        String(
            aktualnyKierunek
        )
    );

    url.searchParams.set(
        "przystanek",
        "idx:"+
        aktualnyPrzystanek
    );

    history.replaceState(
        {},
        "",
        url
    );
}


/* =========================================================

async function pobierzManifestPaczek(){

    if(
        manifestPaczek!==null
    ){
        return manifestPaczek;
    }

    try{

        const r=
            await fetch(
                BASE_DANE+
                "paczki.json?ts="+
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!r.ok){
            manifestPaczek=[];
            return manifestPaczek;
        }

        const j=
            await r.json();

        manifestPaczek=
            Array.isArray(j)
                ? j
                : Array.isArray(j.paczki)
                    ? j.paczki
                    : [];
    }
    catch{
        manifestPaczek=[];
    }

    return manifestPaczek;
}


function paczkaObowiazuje(
    paczka,
    linia,
    data
){

    const linie=
        Array.isArray(
            paczka?.linie
        )
            ? paczka.linie.map(String)
            : [];

    if(
        !linie.includes(
            String(linia)
        )
    ){
        return false;
    }

    const iso=
        dataISO(data);

    const od=
        String(
            paczka.od||""
        );

    const doDaty=
        String(
            paczka.do||""
        );

    return(
        (!od||iso>=od)&&
        (!doDaty||iso<=doDaty)
    );
}


async function pobierzLinie(
    linia,
    data
){

    const paczki=
        await pobierzManifestPaczek();

    const pasujace=
        paczki
            .filter(
                p=>
                    paczkaObowiazuje(
                        p,
                        linia,
                        data
                    )
            )
            .sort(
                (a,b)=>
                    Number(
                        b.priorytet||0
                    )-
                    Number(
                        a.priorytet||0
                    )
            );

    const zrodla=[];

    pasujace.forEach(
        p=>{

            const folder=
                String(
                    p.folder||""
                )
                    .replace(/^\/+/,"")
                    .replace(/\/+$/,"");

            if(folder){
                zrodla.push({
                    url:
                        BASE_DANE+
                        folder+
                        "/"+
                        encodeURIComponent(linia)+
                        ".json",
                    od:
                        String(
                            p.od||""
                        )
                });
            }
        }
    );

    zrodla.push({
        url:
            BASE_DANE+
            encodeURIComponent(linia)+
            ".json",
        od:""
    });

    for(const zrodlo of zrodla){

        try{

            const r=
                await fetch(
                    zrodlo.url+
                    "?ts="+
                    Date.now(),
                    {
                        cache:"no-store"
                    }
                );

            if(!r.ok)continue;

            const json=
                await r.json();

            waznyOdDanych=
                String(
                    json?.od||
                    json?.waznyOd||
                    json?.dataOd||
                    json?.obowiazujeOd||
                    zrodlo.od||
                    ""
                );

            return json;
        }
        catch{
            /* następny */
        }
    }

    throw new Error(
        "Nie znaleziono danych linii "+
        linia+
        "."
    );
}


/* =========================================================
   WCZYTANIE
   ========================================================= */

async function wczytajLinie(){

    ustawStatus(
        "Ładowanie linii "+
        aktualnaLinia+
        "..."
    );

    document
        .getElementById("wynik")
        .innerHTML="";

    try{

        daneLinii=
            await pobierzLinie(
                aktualnaLinia,
                wybranaData
            );

        const kierunki=
            pobierzKierunki();

        if(!kierunki.length){
            throw new Error(
                "Brak kierunków w pliku JSON."
            );
        }

        if(
            aktualnyKierunek<0||
            aktualnyKierunek>=
                kierunki.length
        ){
            aktualnyKierunek=0;
        }

        wypelnijKierunki();
        wypelnijPrzystanki();

        zapiszURL();
        renderuj();

        ustawStatus(
            "Linia "+
            String(
                daneLinii.linia||
                aktualnaLinia
            )+
            " • "+
            dataISO(
                wybranaData
            )
        );
    }
    catch(error){

        console.error(error);

        pokazBlad(
            error.message||
            "Nie udało się wczytać danych."
        );
    }
}


/* =========================================================
   KIERUNKI
   ========================================================= */

function znajdzNajpelniejszyKierunek(index){

    let najlepszy=null;
    let ile=-1;

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const k=
                Array.isArray(
                    rozklad.kierunki
                )
                    ? rozklad.kierunki[index]
                    : null;

            if(
                !k||
                !Array.isArray(
                    k.przystanki
                )
            ){
                return;
            }

            if(
                k.przystanki.length>
                ile
            ){
                najlepszy=k;
                ile=k.przystanki.length;
            }
        }
    );

    return najlepszy;
}


function pobierzKierunki(){

    let max=0;

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        r=>{
            if(
                Array.isArray(
                    r.kierunki
                )
            ){
                max=
                    Math.max(
                        max,
                        r.kierunki.length
                    );
            }
        }
    );

    const wynik=[];
    const widzianeTrasy=[];

    const normalizujNazwe=
        nazwa=>
            String(
                nazwa||
                ""
            )
            .toUpperCase()
            .replace(/\u00A0/g," ")
            .replace(/\s+/g," ")
            .replace(/[.,;:]+$/g,"")
            .trim();

    const nazwyTrasy=
        k=>
            (
                k?.przystanki||
                []
            )
            .map(
                p=>
                    normalizujNazwe(
                        p?.nazwa
                    )
            );

    const takieSameNazwy=
        (a,b)=>{

            if(
                a.length!==b.length
            ){
                return false;
            }

            for(
                let j=0;
                j<a.length;
                j++
            ){
                if(
                    a[j]!==b[j]
                ){
                    return false;
                }
            }

            return true;
        };

    for(
        let i=0;
        i<max;
        i++
    ){

        const k=
            znajdzNajpelniejszyKierunek(
                i
            );

        if(!k){
            continue;
        }

        const nazwy=
            nazwyTrasy(k);

        /*
           Numery stanowisk/przystanków są całkowicie ignorowane.
           Jeżeli kolejność i nazwy przystanków są takie same,
           drugi kierunek/wariant nie jest dodawany.
        */
        const duplikat=
            widzianeTrasy.some(
                poprzednia=>
                    takieSameNazwy(
                        poprzednia,
                        nazwy
                    )
            );

        if(duplikat){
            continue;
        }

        widzianeTrasy.push(
            nazwy
        );

        wynik.push({
            index:i,
            dane:k
        });
    }

    return wynik;
}


function nazwaKierunku(k){

    const gotowa=
        String(
            k?.nazwa||
            k?.kierunek||
            ""
        ).trim();

    if(gotowa){
        return gotowa;
    }

    const p=
        k?.przystanki||
        [];

    return p.length
        ? String(
            p[p.length-1].nazwa||
            ""
        )
        : "";
}


function wypelnijKierunki(){

    const select=
        document.getElementById(
            "kierunekSelect"

    const lista=

    select.innerHTML="";

    lista.forEach(

            option.textContent=

            select.appendChild(option);
        }
    );

    select.disabled=
        !lista.length;

    select.value=
        String(
            aktualnyKierunek
        );
}

function czasNaMinuty(czas){

    const m=
        /^(\d{1,2}):(\d{2})$/
            .exec(
                String(
                    czas||""
                ).trim()
            );

    if(!m)return null;

    const h=Number(m[1]);
    const min=Number(m[2]);

    if(
        h<0||
        h>47||
        min<0||
        min>59
    ){
        return null;
    }

    return h*60+min;
}


function rozbijCzas(czas){

    const m=
        /^(\d{1,2}):(\d{2})$/
            .exec(
                String(
                    czas||""
                ).trim()
            );

    if(!m)return null;

    return{
        godzina:Number(m[1]),
        minuta:m[2]
    };
}


/* =========================================================
   KURSY / DNI
   ========================================================= */

function symbolDnia(kurs){

    return String(
        kurs?.uwagi||
        ""
    )
        .trim()
        .toUpperCase();
}


function kluczKursu(kurs){

    return[
        String(
            kurs?.numer||""
        ),
        String(
            kurs?.wariant||""
        )
    ].join("||");
}


function znajdzPrzystanekWRozkladzie(
    rozklad,
    kierunekIndex,
    baza
){

    const k=
        Array.isArray(
            rozklad?.kierunki
        )
            ? rozklad.kierunki[
                kierunekIndex
            ]
            : null;

    if(
        !k||
        !Array.isArray(
            k.przystanki
        )
    ){
        return null;
    }

    const nazwa=
        normalizuj(
            baza?.nazwa
        );

    const nr=
        String(
            baza?.nr||""
        ).trim();

    return(
        k.przystanki.find(
            p=>
                normalizuj(p.nazwa)===
                    nazwa&&
                String(
                    p.nr||""
                ).trim()===
                    nr
        )||
        null
    );
}


function pobierzKursyDlaSymbolu(symbol){

    const bazaK=
        kierunekBazowy();

    const bazaP=
        bazaK?.przystanki?.[
            aktualnyPrzystanek
        ];

    if(!bazaP)return[];

    const mapa=new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    aktualnyKierunek,
                    bazaP
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        symbolDnia(kurs)!==
                        symbol
                    ){
                        return;
                    }

                    if(
                        czasNaMinuty(
                            kurs.czas
                        )===null
                    ){
                        return;
                    }

                    const key=
                        kluczKursu(kurs);

                    if(!mapa.has(key)){
                        mapa.set(
                            key,
                            kurs
                        );
                    }
                }
            );
        }
    );

    return Array.from(
        mapa.values()
    );
}


function dostepneGrupyDni(){

    const symbole=
        new Set();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const bazaK=
                kierunekBazowy();

            const bazaP=
                bazaK?.przystanki?.[
                    aktualnyPrzystanek
                ];

            const p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    aktualnyKierunek,
                    bazaP
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    const s=
                        symbolDnia(kurs);

                    if(s){
                        symbole.add(s);
                    }
                }
            );
        }
    );

    const wynik=[];

    const maD=
        symbole.has("D");

    const maC=
        symbole.has("C");

    const ma6=
        symbole.has("6");

    const ma7=
        symbole.has("7");

    const maWeekendRozdzielony=
        ma6||
        ma7;

    /*
       DZIEŃ POWSZEDNI pokazujemy również wtedy,
       gdy kursów D nie ma, ale są kursy weekendowe.
       Wtedy tabela wyświetli "NIE KURSUJE".
    */
    if(
        maD||
        maC||
        maWeekendRozdzielony
    ){
        wynik.push({
            symbol:"D",
            tytul:"DZIEŃ POWSZEDNI"
        });
    }

    /*
       Jeżeli dane używają osobnych symboli 6 i 7,
       zawsze pokazujemy obie kolumny.
       Brakująca dostanie "NIE KURSUJE".
    */
    if(maWeekendRozdzielony){

        wynik.push({
            symbol:"6",
            tytul:"SOBOTA"
        });

        wynik.push({
            symbol:"7",
            tytul:"NIEDZIELA I ŚWIĘTO"
        });
    }
    else{

        /*
           Przy układzie D/C pokazujemy SOBOTA I ŚWIĘTO
           nawet wtedy, gdy istnieją wyłącznie kursy D.
        */
        if(
            maD||
            maC
        ){
            wynik.push({
                symbol:"C",
                tytul:"SOBOTA I ŚWIĘTO"
            });
        }
    }

    /*
       Nietypowe symbole pozostają obsługiwane jak wcześniej.
    */
    [
        ...symbole
    ]
        .filter(
            s=>
                !["D","C","6","7"]
                    .includes(s)
        )
        .forEach(
            s=>{
                wynik.push({
                    symbol:s,
                    tytul:
                        "ROZKŁAD "+
                        s
                });
            }
        );

    return wynik;
}


/* =========================================================
   WARIANTY / LEGENDA
   ========================================================= */

function mapaWariantow(){

    const mapa=new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        r=>{
            (
                r.warianty||
                []
            ).forEach(
                w=>{

                    const litera=
                        String(
                            w.litera||""
                        ).trim();

                    const opis=
                        String(
                            w.opis||""
                        ).trim();

                    if(
                        litera&&
                        opis&&
                        !mapa.has(litera)
                    ){
                        mapa.set(
                            litera,
                            opis
                        );
                    }
                }
            );
        }
    );

    return mapa;
}



function normalizujOpisWariantu(opis){

    return String(
        opis||""
    )
    .trim()
    .replace(
        /\s+/g,
        " "
    )
    .toLocaleLowerCase(
        "pl"
    );
}


function kanonicznaLiteraWariantu(litera){

    const szukana=
        String(
            litera||""
        ).trim();

    if(!szukana){
        return"";
    }

    const mapa=
        mapaWariantow();

    const opis=
        mapa.get(
            szukana
        )||"";

    if(!opis){
        return szukana;
    }

    const klucz=
        normalizujOpisWariantu(
            opis
        );

    /*
       Jeżeli kilka wariantów ma identyczny opis,
       wybieramy tylko PIERWSZĄ literę występującą
       w mapie wariantów.

       Przykład:
       B = "kurs przez ..."
       C = "kurs przez ..."

       wtedy wszędzie używamy tylko B:
       - przy minutach,
       - w legendzie.
    */
    for(
        const [innaLitera,innyOpis]
        of mapa.entries()
    ){
        if(
            normalizujOpisWariantu(
                innyOpis
            )===klucz
        ){
            return String(
                innaLitera||""
            ).trim();
        }
    }

    return szukana;
}


function czyOznaczacWariant(opis){

    /*
       Litera wariantu ma być pokazywana przy minutach oraz w legendzie
       także wtedy, gdy kurs jedzie inną trasą przez dodatkowy przystanek
       lub ulicę, np.:
       "kurs przez KUPIECKĄ",
       "kursy przez ...",
       "podjazd przez ...".

       Wcześniej kod oznaczał tylko kursy skrócone, wydłużone,
       do zajezdni itd., dlatego warianty linii 126 nie pojawiały się
       na tabliczce.
    */
    return(
        /skrócon|wydłuż|tylko do|zajezdni|przez|podjazd/i
            .test(
                String(
                    opis||""
                )
            )
    );
}



function koncowyPrzystanekKursu(
    kurs,
    symbol
){

    const numer=
        String(
            kurs?.numer||
            ""
        );

    if(!numer){
        return"";
    }

    let ostatniaNazwa="";

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const kierunek=
                Array.isArray(
                    rozklad?.kierunki
                )
                    ? rozklad.kierunki[
                        aktualnyKierunek
                    ]
                    : null;

            (
                kierunek?.przystanki||
                []
            ).forEach(
                p=>{

                    const jest=
                        (
                            p?.kursy||
                            []
                        ).some(
                            k=>
                                String(
                                    k?.numer||
                                    ""
                                )===numer&&
                                symbolDnia(k)===
                                    symbol
                        );

                    if(jest){
                        ostatniaNazwa=
                            String(
                                p?.nazwa||
                                ""
                            );
                    }
                }
            );
        }
    );

    return ostatniaNazwa;
}


function znajdzLitereSkroceniaPoKoncu(
    kurs,
    symbol
){

    const koniec=
        koncowyPrzystanekKursu(
            kurs,
            symbol
        );

    if(!koniec){
        return"";
    }

    const baza=
        kierunekBazowy();

    const koniecPelnej=
        String(
            baza?.przystanki?.[
                (baza?.przystanki?.length||1)-1
            ]?.nazwa||
            ""
        );

    if(
        normalizuj(koniec)===
        normalizuj(koniecPelnej)
    ){
        return"";
    }

    const mapa=
        mapaWariantow();

    for(
        const [litera,opis]
        of mapa.entries()
    ){

        const tekst=
            String(
                opis||
                ""
            );

        if(
            /skrócon|tylko do/i
                .test(tekst)&&
            normalizuj(tekst)
                .includes(
                    normalizuj(koniec)
                )
        ){
            return String(
                litera||
                ""
            )
                .trim()
                .toLowerCase();
        }
    }

    return"";
}


function symbolWariantu(kurs,symbol){

    const litera=
        String(
            kurs?.wariant||""
        ).trim();

    const opis=
        mapaWariantow()
            .get(litera)||
        "";

    if(
        litera&&
        czyOznaczacWariant(opis)
    ){
        return kanonicznaLiteraWariantu(
            litera
        ).toLowerCase();
    }

    /*
       Jeśli litera jest wyznaczana automatycznie po końcu kursu,
       również przepuszczamy ją przez tę samą regułę,
       aby identyczny opis nie dostał drugiej litery.
    */
    const literaSkrocenia=
        znajdzLitereSkroceniaPoKoncu(
            kurs,
            symbol
        );

    return kanonicznaLiteraWariantu(
        literaSkrocenia
    ).toLowerCase();
}


/* =========================================================
   TABELA
   ========================================================= */

function grupujGodziny(kursy){

    const mapa=new Map();

    kursy.forEach(
        kurs=>{

            const c=
                rozbijCzas(
                    kurs.czas
                );

            if(!c)return;

            const h=
                c.godzina%24;

            if(!mapa.has(h)){
                mapa.set(h,[]);
            }

            mapa.get(h).push({
                minuta:c.minuta,
                kurs
            });
        }
    );

    return mapa;
}



function wspolneGodzinyDlaGrup(grupy){

    const godziny=
        new Set();

    (
        grupy||
        []
    ).forEach(
        grupa=>{

            const kursy=
                pobierzKursyDlaSymbolu(
                    grupa.symbol
                );

            const mapa=
                grupujGodziny(
                    kursy
                );

            mapa.forEach(
                (wartosc,h)=>{
                    godziny.add(
                        Number(h)
                    );
                }
            );
        }
    );

    if(!godziny.size){
        return[];
    }

    /*
       Godziny traktujemy w kolejności komunikacyjnej:
       4, 5, 6 ... 23, 0, 1, 2, 3.

       Najważniejsza zmiana:
       tworzymy PEŁNY zakres od pierwszej do ostatniej godziny,
       a nie tylko godziny, w których faktycznie występują kursy.

       Przykład:
       kursy są o 6,7,8,9 oraz 14,15,...20
       => tabela dostanie również puste wiersze:
          10, 11, 12, 13.
    */

    const przesunieta=
        [...godziny]
            .map(
                h=>
                    h<4
                        ? h+24
                        : h
            )
            .sort(
                (a,b)=>a-b
            );

    const pierwsza=
        przesunieta[0];

    const ostatnia=
        przesunieta[
            przesunieta.length-1
        ];

    const wynik=[];

    for(
        let h=pierwsza;
        h<=ostatnia;
        h++
    ){
        wynik.push(
            h%24
        );
    }

    return wynik;
}


function renderDzien(grupa,wspolneGodziny){

    const kursy=
        pobierzKursyDlaSymbolu(
            grupa.symbol
        );

    const mapa=
        grupujGodziny(
            kursy
        );

    const godziny=
        Array.isArray(
            wspolneGodziny
        )&&
        wspolneGodziny.length
            ? wspolneGodziny
            : [
                ...mapa.keys()
            ];

    let body="";

    /*
       Cały typ dnia bez żadnego kursu:
       - tyle samo wierszy co pozostałe tabele,
       - bez numerów godzin,
       - bez minut,
       - zostaje pionowy podział godziny/minuty,
       - na środku części minutowej: NIE KURSUJE.
    */
    if(
        kursy.length===0&&
        godziny.length
    ){

        const pusteWiersze=
            godziny
                .map(
                    ()=>(
                        '<div class="godzina-row godzina-row-nie-kursuje">'+
                        '<div class="godzina-cell"></div>'+
                        '<div class="minuty-cell"></div>'+
                        '</div>'
                    )
                )
                .join("");

        body=
            '<div class="nie-kursuje-body">'+
            pusteWiersze+
            '<div class="nie-kursuje-napis">NIE KURSUJE</div>'+
            '</div>';
    }
    else if(!godziny.length){

        body=
            '<div class="brak">Brak kursów</div>';
    }
    else{

        body=
            godziny
                .map(
                    h=>{

                        /*
                           Brak kursu tylko w konkretnej godzinie:
                           normalny pusty wiersz, żeby wszystkie
                           tabele pozostały wyrównane.
                        */
                        if(!mapa.has(h)){

                            return(
                                '<div class="godzina-row godzina-row-pusta">'+
                                '<div class="godzina-cell"></div>'+
                                '<div class="minuty-cell"></div>'+
                                '</div>'
                            );
                        }

                        const minuty=
                            mapa.get(h)
                                .map(
                                    item=>{

                                        const sym=
                                            symbolWariantu(
                                                item.kurs,
                                                grupa.symbol
                                            );

                                        return(
                                            '<span class="minuta">'+
                                            escapeHtml(
                                                item.minuta
                                            )+
                                            (
                                                sym
                                                    ? '<span class="symbol">'+
                                                      escapeHtml(sym)+
                                                      '</span>'
                                                    : ''
                                            )+
                                            '</span>'
                                        );
                                    }
                                )
                                .join("");

                        return(
                            '<div class="godzina-row">'+
                            '<div class="godzina-cell">'+
                            h+
                            '</div>'+
                            '<div class="minuty-cell">'+
                            minuty+
                            '</div>'+
                            '</div>'
                        );
                    }
                )
                .join("");
    }

    return(
        '<section class="dzien">'+
        '<div class="dzien-tytul">'+
        escapeHtml(
            grupa.tytul
        )+
        '</div>'+
        '<div class="godziny-head">'+
        '<div>Godz.</div>'+
        '<div>Minuty</div>'+
        '</div>'+
        body+
        '</section>'
    );
}


/* =========================================================
   CZASY PRZEJAZDU NA TRASIE
   ========================================================= */

function znajdzNajlepszyKursDoTrasy(){

    const baza=
        kierunekBazowy();

    const lista=
        baza?.przystanki||
        [];

    const start=
        lista[
            aktualnyPrzystanek
        ];

    if(!start)return null;

    const kandydaci=
        new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    aktualnyKierunek,
                    start
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        czasNaMinuty(
                            kurs.czas
                        )===null
                    ){
                        return;
                    }

                    const key=
                        kluczKursu(kurs);

                    if(!kandydaci.has(key)){

                        kandydaci.set(
                            key,
                            {
                                key,
                                numer:String(
                                    kurs.numer||""
                                ),
                                wariant:String(
                                    kurs.wariant||""
                                ),
                                start:
                                    czasNaMinuty(
                                        kurs.czas
                                    ),
                                count:0
                            }
                        );
                    }
                }
            );
        }
    );

    kandydaci.forEach(
        kandydat=>{

            for(
                let i=
                    aktualnyPrzystanek;
                i<lista.length;
                i++
            ){

                if(
                    znajdzCzasKursuNaPrzystanku(
                        kandydat,
                        lista[i]
                    )!==null
                ){
                    kandydat.count++;
                }
            }
        }
    );

    return[
        ...kandydaci.values()
    ].sort(
        (a,b)=>
            b.count-a.count||
            a.start-b.start
    )[0]||null;
}


function znajdzCzasKursuNaPrzystanku(
    kandydat,
    bazaP
){

    for(
        const rozklad of
        (
            daneLinii?.rozkłady||
            []
        )
    ){

        const p=
            znajdzPrzystanekWRozkladzie(
                rozklad,
                aktualnyKierunek,
                bazaP
            );

        const kurs=
            (
                p?.kursy||
                []
            ).find(
                k=>
                    String(
                        k.numer||""
                    )===
                        kandydat.numer&&
                    String(
                        k.wariant||""
                    )===
                        kandydat.wariant&&
                    czasNaMinuty(
                        k.czas
                    )!==null
            );

        if(kurs){
            return czasNaMinuty(
                kurs.czas
            );
        }
    }

    return null;
}


function czasyTrasy(){

    const baza=
        kierunekBazowy();

    const lista=
        baza?.przystanki||
        [];

    const kandydat=
        znajdzNajlepszyKursDoTrasy();

    const wynik=
        new Array(
            lista.length
        ).fill(null);

    if(!kandydat){
        return wynik;
    }

    const start=
        znajdzCzasKursuNaPrzystanku(
            kandydat,
            lista[
                aktualnyPrzystanek
            ]
        );

    if(start===null){
        return wynik;
    }

    for(
        let i=
            aktualnyPrzystanek;
        i<lista.length;
        i++
    ){

        let t=
            znajdzCzasKursuNaPrzystanku(
                kandydat,
                lista[i]
            );

        if(t===null)continue;

        while(t<start){
            t+=1440;
        }

        wynik[i]=
            t-start;
    }

    return wynik;
}

   TRASA
   ========================================================= */

function czyNZ(p){

    const typ=
        String(
            p?.typ||""
        )
            .trim()
            .toUpperCase();

    return(
        typ==="NŻ"||
        typ==="NZ"||
        typ==="N/Z"||
        typ.includes("ŻĄD")
    );
}



function typPrzystankuTrasy(p){

    return String(
        p?.typ||""
    )
    .trim()
    .toUpperCase();
}


function listaPelnejTrasyDoWyswietlenia(){

    const baza=
        kierunekBazowy();

    const lista=
        baza?.przystanki||
        [];

    if(!lista.length){
        return[];
    }

    const bezTech=
        lista
            .map(
                (p,index)=>({
                    p,
                    index,
                    typ:typPrzystankuTrasy(p)
                })
            )
            .filter(
                x=>x.typ!=="TECH"
            );

    if(!bezTech.length){
        return[];
    }

    if(
        bezTech.length>=2&&
        bezTech[
            bezTech.length-2
        ].typ==="WYS"
    ){
        bezTech.pop();
    }

    return bezTech.map(
        x=>({
            p:x.p,
            index:x.index
        })
    );
}


function literyWydluzonychWariantow(){

    const wynik=new Set();

    for(
        const [litera,opis]
        of mapaWariantow().entries()
    ){
        if(
            /wydłuż/i.test(
                String(opis||"")
            )
        ){
            wynik.add(
                String(litera||"")
                    .trim()
            );
        }
    }

    return wynik;
}



function czyWariantTrasyPrzez(litera){

    const opis=
        mapaWariantow()
            .get(
                String(
                    litera||""
                ).trim()
            )||
        "";

    /*
       Do tej logiki NIE mieszamy:
       - kursów skróconych,
       - kursów wydłużonych,
       - kursów do zajezdni,
       - "tylko do ...".

       Tu interesują nas wyłącznie warianty przebiegu typu:
       "przez ...", "podjazd ...".
    */
    return(
        /przez|podjazd/i.test(
            String(opis)
        )&&
        !/skrócon|wydłuż|zajezdni|tylko do/i.test(
            String(opis)
        )
    );
}


function kursyAktualnegoRozkladuDoTrasy(){
