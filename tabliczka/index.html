function znajdzKursWariantuDoTrasy(litera){

    const pelna=
        kierunekBazowy()?.przystanki||
        [];

    const start=
        pelna[
            aktualnyPrzystanek
        ];

    if(!start){
        return null;
    }

    const kandydaci=
        new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    aktualnyKierunek,
                    start
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        String(
                            kurs?.wariant||""
                        ).trim()!==litera
                    ){
                        return;
                    }

                    const czas=
                        czasNaMinuty(
                            kurs?.czas
                        );

                    if(czas===null){
                        return;
                    }

                    const key=
                        kluczKursu(kurs);

                    if(!kandydaci.has(key)){
                        kandydaci.set(
                            key,
                            {
                                key,
                                numer:String(
                                    kurs?.numer||""
                                ),
                                wariant:litera,
                                start:czas,
                                count:0
                            }
                        );
                    }
                }
            );
        }
    );

    kandydaci.forEach(
        kandydat=>{

            pelna.forEach(
                p=>{
                    if(
                        znajdzCzasKursuNaPrzystanku(
                            kandydat,
                            p
                        )!==null
                    ){
                        kandydat.count++;
                    }
                }
            );
        }
    );

    return[
        ...kandydaci.values()
    ].sort(
        (a,b)=>
            b.count-a.count||
            a.start-b.start
    )[0]||null;
}


function czasWariantuNaPrzystanku(
    litera,
    element
){

    const kandydat=
        znajdzKursWariantuDoTrasy(
            litera
        );

    if(!kandydat){
        return null;
    }

    const pelna=
        kierunekBazowy()?.przystanki||
        [];

    const start=
        pelna[
            aktualnyPrzystanek
        ];

    if(!start){
        return null;
    }

    const t0=
        znajdzCzasKursuNaPrzystanku(
            kandydat,
            start
        );

    const t=
        znajdzCzasKursuNaPrzystanku(
            kandydat,
            element.p
        );

    if(
        t0===null||
        t===null
    ){
        return null;
    }

    let wynik=t-t0;

    while(wynik<0){
        wynik+=1440;
    }

    return wynik;
}



function kursReferencyjnyDrugiegoKierunku(
    info
){

    if(!info){
        return null;
    }

    const mapa=
        new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    info.indexKierunku,
                    info.przystanek
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        czasNaMinuty(
                            kurs?.czas
                        )===null
                    ){
                        return;
                    }

                    const key=
                        kluczKursu(kurs);

                    if(!mapa.has(key)){
                        mapa.set(
                            key,
                            {
                                ...kurs,
                                _kierunekIndex:
                                    info.indexKierunku,
                                count:0
                            }
                        );
                    }
                }
            );
        }
    );

    const pelna=
        info.kierunek?.przystanki||
        [];

    mapa.forEach(
        ref=>{

            pelna.forEach(
                p=>{

                    (
                        daneLinii?.rozkłady||
                        []
                    ).some(
                        rozklad=>{

                            const pp=
                                znajdzPrzystanekWRozkladzie(
                                    rozklad,
                                    info.indexKierunku,
                                    p
                                );

                            const jest=
                                (
                                    pp?.kursy||
                                    []
                                ).some(
                                    k=>
                                        String(
                                            k?.numer||""
                                        )===
                                            String(
                                                ref?.numer||""
                                            )&&
                                        String(
                                            k?.wariant||""
                                        ).trim()===
                                            String(
                                                ref?.wariant||""
                                            ).trim()&&
                                        czasNaMinuty(
                                            k?.czas
                                        )!==null
                                );

                            if(jest){
                                ref.count++;
                            }

                            return jest;
                        }
                    );
                }
            );
        }
    );

    return[
        ...mapa.values()
    ]
    .sort(
        (a,b)=>
            b.count-a.count
    )[0]||null;
}



function znajdzPrzystanekDrugiegoKierunkuPoDokladnymIndeksie(
    rozklad,
    info,
    element
){

    const k=
        Array.isArray(
            rozklad?.kierunki
        )
            ? rozklad.kierunki[
                info.indexKierunku
            ]
            : null;

    if(
        !k||
        !Array.isArray(
            k.przystanki
        )||
        !element
    ){
        return null;
    }

    const index=
        Number(
            element.index
        );

    const bazaP=
        element.p;

    /*
       Najpierw dokładny indeks z pełnego kierunku.
       To rozróżnia dwa kolejne PKP ZACISZE-WILNO o tej samej
       nazwie i tym samym numerze.
    */
    if(
        Number.isInteger(index)&&
        index>=0&&
        index<k.przystanki.length
    ){

        const p=
            k.przystanki[index];

        if(
            normalizuj(
                p?.nazwa
            )===
                normalizuj(
                    bazaP?.nazwa
                )&&
            String(
                p?.nr||""
            ).trim()===
                String(
                    bazaP?.nr||""
                ).trim()
        ){
            return p;
        }
    }

    /*
       Fallback dla rozkładów o nieco innej strukturze.
    */
    return znajdzPrzystanekWRozkladzie(
        rozklad,
        info.indexKierunku,
        bazaP
    );
}


function czasDrugiegoKierunku(
    info,
    element
){

    const ref=
        kursReferencyjnyDrugiegoKierunku(
            info
        );

    if(
        !ref||
        !element?.p
    ){
        return null;
    }

    let start=null;
    let cel=null;

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const ps=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    info.indexKierunku,
                    info.przystanek
                );

            const pc=
                znajdzPrzystanekDrugiegoKierunkuPoDokladnymIndeksie(
                    rozklad,
                    info,
                    element
                );

            const znajdz=
                pp=>
                    (
                        pp?.kursy||
                        []
                    ).find(
                        k=>
                            String(
                                k?.numer||""
                            )===
                                String(
                                    ref?.numer||""
                                )&&
                            String(
                                k?.wariant||""
                            ).trim()===
                                String(
                                    ref?.wariant||""
                                ).trim()&&
                            czasNaMinuty(
                                k?.czas
                            )!==null
                    );

            const ks=znajdz(ps);
            const kc=znajdz(pc);

            if(ks){
                start=
                    czasNaMinuty(
                        ks.czas
                    );
            }

            if(kc){
                cel=
                    czasNaMinuty(
                        kc.czas
                    );
            }
        }
    );

    if(
        start===null||
        cel===null
    ){
        return null;
    }

    let wynik=cel-start;

    while(wynik<0){
        wynik+=1440;
    }

    return wynik;
}


function listaDrugiegoKierunkuOdPrzystanku(){

    const info=
        drugiKierunekBiezacegoPrzystanku();

    if(!info){
        return[];
    }

    const surowa=
        (
            info.kierunek?.przystanki||
            []
        )
        .map(
            (p,index)=>({
                p,
                index,
                _drugiKierunek:true,
                _sourceDirection:
                    info.indexKierunku
            })
        )
        .filter(
            x=>
                x.index>=
                    info.indexPrzystanku&&
                String(
                    x.p?.typ||""
                ).trim().toUpperCase()!=="TECH"
        );

    const zCzasem=
        surowa.filter(
            element=>
                element.index===
                    info.indexPrzystanku||
                czasDrugiegoKierunku(
                    info,
                    element
                )!==null
        );

    /*
       Tak samo jak przy 131:
       jeżeli kursy rozpoczynające się po drodze tworzą drugi,
       sztuczny wpis tego samego przystanku, zostawiamy tylko
       ten obsługiwany przez kurs jadący od bieżącego słupka.
    */
    const wynik=[];

    for(
        const element
        of zCzasem
    ){

        const poprzedni=
            wynik[
                wynik.length-1
            ];

        if(
            poprzedni&&
            normalizuj(
                poprzedni?.p?.nazwa
            )===
                normalizuj(
                    element?.p?.nazwa
                )&&
            String(
                poprzedni?.p?.nr||""
            ).trim()===
                String(
                    element?.p?.nr||""
                ).trim()
        ){
            /*
               Jeżeli jeden z nich jest aktywny, aktywny ma pierwszeństwo.
               W przeciwnym razie późniejszy wpis odpowiada dalszemu
               rzeczywistemu przebiegowi.
            */
            if(
                poprzedni.index===
                info.indexPrzystanku
            ){
                continue;
            }

            wynik[
                wynik.length-1
            ]=
                element;

            continue;
        }

        wynik.push(
            element
        );
    }

    return wynik;
}



function symboleDrugiegoKierunkuTrasy(
    info
){

        return[];
    }

    const wynik=
        new Set();

    const mapa=
        mapaSymboliDwukierunkowych();

    for(
        const item
        of mapa.values()

        if(
            Number(item.dir)===
            Number(info.indexKierunku)&&
            item.znak

            wynik.add(

        ...wynik

                b,
                "pl"
            )
    );
}

            .join("");

    return html;
}

function listaWydluzeniaBezPowtorzonegoKranca(
    wariant,
    baza
){

    const lista=
        Array.isArray(
            wariant?.przystanki
        )
            ? [...wariant.przystanki]
            : [];

    if(
        !lista.length||
        !Array.isArray(baza)||
        !baza.length
    ){
        return lista;
    }

    const ostatniElementBazy=
        baza[
            baza.length-1
        ];

    const ostatni=
        ostatniElementBazy?.p||
        ostatniElementBazy;

    const pierwszyElementWydluzenia=
        lista[0];

    const pierwszy=
        pierwszyElementWydluzenia?.p||
        pierwszyElementWydluzenia;

    const nazwaBazy=
        normalizuj(
            ostatni?.nazwa
        );

    const nazwaWydluzenia=
        normalizuj(
            pierwszy?.nazwa
        );

    /*
       NAJWAŻNIEJSZA ZMIANA:
       NIE patrzymy na numer przystanku.

       Jeżeli na granicy:
           trasa podstawowa -> trasa wydłużona
       występuje ta sama nazwa przystanku,
       to jest to ten sam logiczny punkt trasy i nie może
       zostać pokazany drugi raz.

       Przykład:
           ... GORASZEWSKA
           SADYBA          <- koniec trasy podstawowej
           Trasa w kursach „w”
           SADYBA          <- ten duplikat usuwamy
           WIERTNICZA

       Nawet jeśli oba wpisy SADYBA mają różne numery słupków.
    */
    if(
        nazwaBazy&&
        nazwaBazy===
        nazwaWydluzenia
    ){
        return lista.slice(1);
    }

    return lista;
}



function czyDokladnyAktywnyJestWWydluzeniu(){

    const baza=
        kierunekBazowy()
            ?.przystanki||
        [];

    const aktywny=
        baza[
            aktualnyPrzystanek
        ];

    if(!aktywny){
        return false;
    }

    const dane=
        daneTrasWydluzonych();

    if(
        !Array.isArray(
            dane?.wydluzenia
        )||
        !dane.wydluzenia.length
    ){
        return false;
    }

    const nazwa=
        normalizuj(
            aktywny?.nazwa
        );

    const nr=
        String(
            aktywny?.nr||""
        ).trim();

    for(
        const wariant
        of dane.wydluzenia
    ){

        /*
         * Używamy dokładnie TEJ SAMEJ listy, która jest później
         * renderowana w sekcji "Trasa w kursach ...".
         *
         * To ważne dla SADYBY:
         * powtórzony kraniec SADYBA jest z wydłużenia usuwany,
         * więc SADYBA nadal może być aktywna w części podstawowej.
         */
        const lista=
            listaWydluzeniaBezPowtorzonegoKranca(
                wariant,
                dane.baza
            );

        const maDokladny=
            lista.some(
                element=>{

                    const p=
                        element?.p||
                        element;

                    /*
                     * Najpierw dokładny indeks, jeśli jest dostępny.
                     */
                    if(
                        Number(
                            element?.index
                        )===
                        Number(
                            aktualnyPrzystanek
                        )
                    ){
                        return true;
                    }

                    /*
                     * Potem dokładna nazwa + numer słupka.
                     * Nie dopasowujemy po samej nazwie.
                     */
                    return(
                        normalizuj(
                            p?.nazwa
                        )===
                            nazwa&&
                        String(
                            p?.nr||""
                        ).trim()===
                            nr
                    );
                }
            );

        if(maDokladny){
            return true;
        }
    }

    return false;
}


function renderWydluzeniaTrasy(){

    const dane=
        daneTrasWydluzonych();

    if(!dane.wydluzenia.length){
        return"";
    }

    const bazaKierunku=
        kierunekBazowy()
            ?.przystanki||
        [];

    const wybranyBazowy=
        bazaKierunku[
            aktualnyPrzystanek
        ]||null;

    return dane.wydluzenia
        .map(
            wariant=>{

                const litera=
                    String(
                        wariant.litera||""
                    )
                    .trim()
                    .toLowerCase();

                const przystankiWydluzenia=
                    listaWydluzeniaBezPowtorzonegoKranca(
                        wariant,
                        dane.baza
                    );

                /*
                 * =================================================
                 * AKTYWNY PRZYSTANEK W WYDŁUŻENIU
                 * =================================================
                 *
                 * To jest odpowiednik logiki działającej w zwykłej
                 * liście (np. linia 126).
                 *
                 * Najpierw dokładny index z URL, potem nazwa+nr,
                 * a przy unikalnej nazwie sama nazwa.
                 */
                let aktywnaPozycja=
                    przystankiWydluzenia.findIndex(
                        element=>
                            Number(
                                element?.index
                            )===
                            Number(
                                aktualnyPrzystanek
                            )
                    );

                if(
                    aktywnaPozycja<0&&
                    wybranyBazowy
                ){

                    const nazwaWybranego=
                        normalizuj(
                            wybranyBazowy?.nazwa
                        );

                    const nrWybranego=
                        String(
                            wybranyBazowy?.nr||""
                        ).trim();

                    aktywnaPozycja=
                        przystankiWydluzenia.findIndex(
                            element=>{

                                const p=
                                    element?.p||
                                    element;

                                return(
                                    normalizuj(
                                        p?.nazwa
                                    )===
                                        nazwaWybranego&&
                                    String(
                                        p?.nr||""
                                    ).trim()===
                                        nrWybranego
                                );
                            }
                        );

                    /*
                       Jeżeli nazwa jest na wydłużeniu tylko raz,
                       numer nie musi blokować poprawnego dopasowania.
                       To zabezpiecza LNIANA.
                    */
                    if(aktywnaPozycja<0){

                        const poNazwie=
                            przystankiWydluzenia
                                .map(
                                    (element,pozycja)=>({
                                        element,
                                        pozycja
                                    })
                                )
                                .filter(
                                    item=>
                                        normalizuj(
                                            (
                                                item.element?.p||
                                                item.element
                                            )?.nazwa
                                        )===
                                        nazwaWybranego
                                );

                        if(poNazwie.length===1){
                            aktywnaPozycja=
                                poNazwie[0].pozycja;
                        }
                    }
                }

                const wiersze=
                    przystankiWydluzenia
                        .map(
                            (element,pozycja)=>{

                                const p=
                                    element.p;

                                const przed=
                                    aktywnaPozycja>=0&&
                                    pozycja<
                                        aktywnaPozycja;

                                const wybrany=
                                    aktywnaPozycja>=0&&
                                    pozycja===
                                        aktywnaPozycja;

                                let czas=null;

                                /*
                                   Dokładnie jak w zwykłej liście:
                                   - przed aktywnym: bez czasu,
                                   - aktywny: 0,
                                   - po aktywnym: normalny czas.
                                */
                                if(!przed){

                                    if(wybrany){
                                        czas=0;
                                    }
                                    else{
                                        czas=
                                            czasWariantuNaPrzystanku(
                                                wariant.litera,
                                                element
                                            );
                                    }
                                }

                                return(
                                    '<li class="trasa-extra-stop'+
                                    (
                                        przed
                                            ? ' przed'
                                            : ''
                                    )+
                                    (
                                        wybrany
                                            ? ' wybrany'
                                            : ''
                                    )+
                                    (
                                        czyNZ(p)
                                            ? ' nz'
                                            : ''
                                    )+
                                    '">'+
                                    '<span class="trasa-czas">'+
                                    (
                                        czas===null
                                            ? ''
                                            : escapeHtml(
                                                String(czas)
                                            )
                                    )+
                                    '</span>'+
                                    '<span class="trasa-os"></span>'+
                                    '<span class="trasa-nazwa">'+
                                    (
                                        wybrany
                                            ? '<span class="trasa-nazwa-aktywna">'+
                                              escapeHtml(
                                                  String(
                                                      p?.nazwa||""
                                                  ).toUpperCase()
                                              )+
                                              '</span>'
                                            : escapeHtml(
                                                  String(
                                                      p?.nazwa||""
                                                  ).toUpperCase()
                                              )
                                    )+
                                    '</span>'+
                                    '<span class="trasa-nz">'+
                                    (
                                        czyNZ(p)
                                            ? 'ż'
                                            : ''
                                    )+
                                    '</span>'+
                                    '</li>'
                                );
                            }
                        )
                        .join("");

                if(
                    !przystankiWydluzenia.length
                ){
                    return"";
                }

                return(
                    '<div class="trasa-extra">'+
                    '<div class="trasa-extra-title">'+
                    'Trasa w kursach „'+
                    escapeHtml(litera)+
                    '”'+
                    '</div>'+
                    '<ul class="trasa-extra-lista">'+
                    wiersze+
                    '</ul>'+
                    '</div>'
                );
            }
        )
        .join("");
}



function pozycjaAktywnegoNaWyswietlanejTrasie(
    lista
){

    const source=
        Array.isArray(lista)
            ? lista
            : [];

    if(!source.length){
        return -1;
    }

    const baza=
        kierunekBazowy()
            ?.przystanki||
        [];

    const wybrany=
        baza[
            aktualnyPrzystanek
        ];

    if(!wybrany){
        return -1;
    }

    const nazwa=
        normalizuj(
            wybrany?.nazwa
        );

    const nr=
        String(
            wybrany?.nr||""
        ).trim();

    /*
       1. Najpierw dokładnie NAZWA + NUMER.
    */
    const exact=[];

    source.forEach(
        (element,pozycja)=>{

            const p=
                element?.p||
                element;

            if(
                normalizuj(
                    p?.nazwa
                )===
                    nazwa&&
                String(
                    p?.nr||""
                ).trim()===
                    nr
            ){
                exact.push(
                    pozycja
                );
            }
        }
    );

    if(exact.length===1){
        return exact[0];
    }

    /*
       Jeżeli ta sama nazwa+nr występuje więcej niż raz,
       wybieramy takie samo wystąpienie jak w kierunku bazowym.
    */
    if(exact.length>1){

        let wystapienie=0;

        for(
            let i=0;
            i<aktualnyPrzystanek;
            i++
        ){
            if(
                normalizuj(
                    baza[i]?.nazwa
                )===
                    nazwa&&
                String(
                    baza[i]?.nr||""
                ).trim()===
                    nr
            ){
                wystapienie++;
            }
        }

        return exact[
            Math.min(
                wystapienie,
                exact.length-1
            )
        ];
    }

    /*
       2. Fallback po nazwie.

       LNIANA jest na trasie tylko raz, więc nawet jeśli po złożeniu
       wariantów numer słupka nie został zachowany przy tym obiekcie,
       nadal dokładnie wiemy, który wiersz jest aktywny.
    */
    const sameName=[];

    source.forEach(
        (element,pozycja)=>{

            const p=
                element?.p||
                element;

            if(
                normalizuj(
                    p?.nazwa
                )===
                nazwa
            ){
                sameName.push(
                    pozycja
                );
            }
        }
    );

    if(sameName.length===1){
        return sameName[0];
    }

    /*
       3. Kilka razy ta sama nazwa, np. WIERNA.
       Ustalamy, które to wystąpienie nazwy w kierunku bazowym.
    */
    if(sameName.length>1){

        let wystapienieNazwy=0;

        for(
            let i=0;
            i<aktualnyPrzystanek;
            i++
        ){
            if(
                normalizuj(
                    baza[i]?.nazwa
                )===
                nazwa
            ){
                wystapienieNazwy++;
            }
        }

        return sameName[
            Math.min(
                wystapienieNazwy,
                sameName.length-1
            )
        ];
    }

    return -1;
}


/*
 * Zachowujemy starą nazwę funkcji dla pozostałego kodu,
 * ale teraz zwraca ona POZYCJĘ na finalnej liście.
 */
function indeksAktywnegoNaWyswietlanejTrasie(
    lista
){
    return pozycjaAktywnegoNaWyswietlanejTrasie(
        lista
    );
}



function poprawLiteryNaglowkaPoKrancu(
    separator,
    poprzedniElement
){

    if(
        !czyBiezacyPrzystanekDwukierunkowy()||
        !separator||
        !poprzedniElement?.p
    ){
        return separator;
    }

    const mapa=
        mapaSymboliDwukierunkowych();

    if(!mapa?.size){
        return separator;
    }

    const nazwaPoprzedniego=
        normalizuj(
            poprzedniElement.p.nazwa
        );

    const pelnyKierunek=
        normalizuj(
            nazwaKierunku(
                znajdzNajpelniejszyKierunek(
                    aktualnyKierunek
                )
            )
        );

    let symbolKonczyTutaj="";
    let symbolJedzieDoKierunku="";

    for(
        const item
        of mapa.values()
    ){

        if(
            Number(item.dir)!==
            Number(aktualnyKierunek)
        ){
            continue;
        }

        const kraniec=
            normalizuj(
                rzeczywistyKraniecKombinacjiDwukierunkowej(
                    item
                )
            );

        if(
            kraniec&&
            kraniec===
            nazwaPoprzedniego
        ){
            symbolKonczyTutaj=
                String(
                    item.znak||""
                ).toLowerCase();
        }

        if(
            kraniec&&
            pelnyKierunek&&
            kraniec===
            pelnyKierunek
        ){
            symbolJedzieDoKierunku=
                String(
                    item.znak||""
                ).toLowerCase();
        }
    }

    if(
        !symbolKonczyTutaj||
        !symbolJedzieDoKierunku||
        symbolKonczyTutaj===
        symbolJedzieDoKierunku
    ){
        return separator;
    }

    /*
       Przykład 170 / WIERNA 04:

       e = kurs kończący na PKP ZACISZE-WILNO
       l = kurs jadący dalej do ELSNEROWA

       Jeżeli separator pojawia się już PO PKP ZACISZE-WILNO,
       nie może nadal mówić "Trasa w kursach e".
       Zmieniamy WYŁĄCZNIE literę e -> l.
    */
    const wzorzec=
        new RegExp(
            "„"+
            symbolKonczyTutaj+
            "”",
            "g"
        );

    return separator.replace(
        wzorzec,
        "„"+
        symbolJedzieDoKierunku+
        "”"
    );
}


function renderTrasaKolumna(
    fragment,
    czasy,
    pierwszyIndexTrasy,
    ostatniIndexTrasy,
    pokazWydluzenia=false
){

    const pelnaLista=
        listaTrasyDoWyswietlenia();

    const aktywnaPozycjaWyswietlana=
        pozycjaAktywnegoNaWyswietlanejTrasie(
            pelnaLista
        );

    /*
       =========================================================
       WYJĄTEK TYLKO DLA POCZĄTKU WŁASNEGO WARIANTU
       =========================================================

       Wersja 154 miała poprawną całą logikę pozostałych linii.
       Problem dotyczył tylko przypadku takiego jak SADYBA 05:

       - wybrany dokładny słupek jest początkiem swoich kursów,
       - wcześniejsza gałąź zostaje prawidłowo odcięta,
       - po scaleniu wariantów na początku finalnej listy zostaje
         logicznie ten sam przystanek SADYBA, ale jego `index`
         może pochodzić z drugiego wpisu tej samej nazwy.

       Nie zmieniamy więc globalnego sposobu zaznaczania aktywnego.
       Tworzymy tylko jeden lokalny fallback:
       jeśli dokładnego `aktualnyPrzystanek` nie ma już na finalnej
       liście, a aktywny jest początkiem swoich kursów, wtedy pierwszy
       element finalnej listy o tej samej nazwie traktujemy jako aktywny.
    */
    const bazaAktywna=
        kierunekBazowy()
            ?.przystanki?.[
                aktualnyPrzystanek
            ]||
        null;

    const finalMaDokladnyAktywny=
        pelnaLista.some(
            element=>
                Number(
                    element?.index
                )===
                Number(
                    aktualnyPrzystanek
                )
        );

    let awaryjnaPozycjaPoczatkuWariantu=
        -1;

    if(
        !finalMaDokladnyAktywny&&
        bazaAktywna
    ){

        const pasujacePoNazwie=
            pelnaLista
                .map(
                    (element,pozycja)=>({
                        element,
                        pozycja
                    })
                )
                .filter(
                    item=>
                        normalizuj(
                            item.element?.p?.nazwa
                        )===
                        normalizuj(
                            bazaAktywna?.nazwa
                        )
                );

        /*
         * Nie robimy już szerokiego fallbacku dla każdej
         * powtarzającej się nazwy.
         *
         * Fallback wolno zastosować tylko wtedy, gdy po całym
         * przycięciu wariantów na FINALNEJ liście została dokładnie
         * jedna pozycja o tej nazwie.
         *
         * To jest przypadek SADYBA na granicy trasy podstawowej
         * i wydłużenia do WILANOWA:
         * dokładny obiekt SADYBA 01 został scalony, ale na liście
         * nadal istnieje jeden logiczny przystanek SADYBA.
         *
         * Jeżeli na finalnej liście są dwa takie same nazwy
         * (np. WIERNA / PL. HALLERA w realnym podwójnym przebiegu),
         * niczego nie zgadujemy i zostawiamy zwykłą dokładną logikę.
         */
        if(
            pasujacePoNazwie.length===1
        ){
            awaryjnaPozycjaPoczatkuWariantu=
                pasujacePoNazwie[0].pozycja;
        }
    }

    return(
        '<div class="trasa-kol">'+
        '<ul class="trasa-lista">'+
        fragment.lista
            .map(
                (element,lokalny)=>{

                    const p=
                        element&&
                        Object.prototype.hasOwnProperty.call(
                            element,
                            "p"
                        )
                            ? element.p
                            : element;

                    const index=
                        element&&
                        Object.prototype.hasOwnProperty.call(
                            element,
                            "index"
                        )
                            ? element.index
                            : fragment.start+
                              lokalny;

                    const stanAktualny=
                        stanTrasyNaPrzystanku(
                            element
                        );

                    let stanPoprzedni=null;

                    /*
                       Fragmenty kolumn są wycinane z finalnej listy,
                       więc najpierw bierzemy REALNĄ pozycję tego samego
                       obiektu. Dzięki temu nie mylimy dwóch przystanków
                       o tej samej nazwie ani indeksów różnych wariantów.
                    */
                    let pozycjaWidoczna=
                        pelnaLista.indexOf(
                            element
                        );

                    /*
                       Awaryjny fallback tylko wtedy, gdy obiekt został
                       odtworzony po drodze.
                    */
                    if(pozycjaWidoczna<0){

                        const nazwaElementu=
                            normalizuj(
                                p?.nazwa
                            );

                        const nrElementu=
                            String(
                                p?.nr||""
                            ).trim();

                        pozycjaWidoczna=
                            pelnaLista.findIndex(
                                x=>{
                                    const xp=
                                        x?.p||
                                        x;

                                    return(
                                        normalizuj(
                                            xp?.nazwa
                                        )===
                                            nazwaElementu&&
                                        String(
                                            xp?.nr||""
                                        ).trim()===
                                            nrElementu
                                    );
                                }
                            );
                    }

                    if(
                        pozycjaWidoczna>0
                    ){

                        const poprzedniElement=
                            pelnaLista[
                                pozycjaWidoczna-1
                            ];

                        stanPoprzedni=
                            stanTrasyNaPrzystanku(
                                poprzedniElement
                            );
                    }

                    /*
                       Dokładnie jak przy zwykłej trasie (np. 126):
                       parametr idx odnosi się bezpośrednio do indeksu
                       w kierunku bazowym, z którego renderowany jest
                       ten wiersz.
                    */
                    const przedBazowy=
                        Number(index)<
                        Number(aktualnyPrzystanek);

                    /*
                       "przedBazowy" służy dalej do dotychczasowej logiki
                       separatorów. Sam wiersz aktywny nie może jednak
                       być traktowany wizualnie jako przejechany.
                    */
                    let przed=
                        przedBazowy;

                    /*
                       Opisy wariantów trasy pokazujemy tylko od
                       aktualnego przystanku w dół.

                       Jeżeli rozgałęzienie zostało już minięte,
                       nie ma sensu dalej pokazywać np.
                       "Trasa w kursach przez PKP ŻERAŃ",
                       bo pasażer znajduje się już po wyborze
                       konkretnego przebiegu.

                       Przykład 126:
                       - albo kurs pojechał przez PKP ŻERAŃ,
                       - albo przez KUPIECKĄ,
                       - po minięciu tego rozgałęzienia nie pokazujemy
                         już opisu nieaktualnej gałęzi.
                    */
                    let separator=
                        (
                            stanPoprzedni===null||
                            przed
                                ? ''
                                : naglowekZmianyTrasy(
                                    stanPoprzedni,
                                    stanAktualny
                                )
                        );

                    /*
                       Aktywny przystanek = dokładnie ten sam idx,
                       który jest wybrany w polu przystanku i w URL.

                       Dzięki temu:
                       - WIERNA 02 przy idx:21 zaznacza drugi WIERNA,
                       - LNIANA 02 przy idx:22 zaznacza LNIANA,
                       niezależnie od tego, jak lista wariantów została
                       później przefiltrowana.
                    */
                    /*
                       Jeżeli dokładnie wybrany przystanek jest
                       renderowany w sekcji wydłużenia, nie wolno
                       jednocześnie zaznaczać wcześniejszego wpisu
                       o tej samej nazwie w trasie podstawowej.

                       Przykład:
                       WIERNA 02 -> aktywna tylko druga WIERNA
                       w sekcji do ELSNEROWA.

                       SADYBA na granicy wydłużenia pozostaje bez zmian,
                       ponieważ powtórzona SADYBA jest usuwana z listy
                       wydłużenia przez listaWydluzeniaBezPowtorzonegoKranca().
                    */
                    const aktywnyTylkoWWydluzeniu=
                        czyDokladnyAktywnyJestWWydluzeniu()&&
                        !finalMaDokladnyAktywny;

                    const wybranyFallback=
                        awaryjnaPozycjaPoczatkuWariantu>=0&&
                        pozycjaWidoczna===
                            awaryjnaPozycjaPoczatkuWariantu;

                    const wybranyDokladny=
                        Number(index)===
                        Number(aktualnyPrzystanek);

                    const wybrany=
                        wybranyFallback||
                        (
                            !aktywnyTylkoWWydluzeniu&&
                            wybranyDokladny
                        );

                    /*
                       Jeżeli po scaleniu wariantów aktywny dokładny wpis
                       został zastąpiony logicznie tym samym przystankiem
                       (np. SADYBA 01), ten wiersz musi wyglądać jak każdy
                       inny aktywny:
                       - nie jest szary,
                       - ma 0 minut,
                       - ma czarną kropkę.
                    */
                    if(wybrany){
                        przed=false;
                    }

                    if(
                        czyBiezacyPrzystanekDwukierunkowy()
                    ){

                        const tytulKierunku=
                            tytulAktualnegoKierunkuTrasy();

                        /*
                           W trybie dwóch kierunków nigdy nie piszemy
                           "Trasa we wszystkich kursach", bo mogłoby to
                           sugerować również kursy przeciwnego kierunku.
                        */
                        if(
                            separator.includes(
                                "Trasa we wszystkich kursach"
                            )
                        ){
                            separator=
                                tytulKierunku
                                    ? (
                                        '<li class="trasa-separator">'+
                                        '<span class="trasa-separator-title">'+
                                        escapeHtml(
                                            tytulKierunku
                                        )+
                                        '</span>'+
                                        '</li>'
                                    )
                                    : '';
                        }

                        /*
                           Nad aktywnym przystankiem zawsze pokazujemy,
                           w których kursach obowiązuje właśnie ten
                           przebieg / kierunek.
                        */
                        if(
                            wybrany
                        ){

                            let tytulAktywnego=
                                tytulKierunku;

                            /*
                             * Jeżeli od aktywnego przystanku dalej
                             * jedzie tylko konkretny wariant,
                             * pokazujemy właśnie jego literę.
                             *
                             * Przykład 170 / PL. OSTREJ BRAMY 01:
                             * dalej do ELSNEROWA jedzie wariant „l”,
                             * więc nad aktywnym ma być:
                             * "Trasa w kursach „l”"
                             * zamiast ogólnego opisu kierunku.
                             */
                            if(
                                stanAktualny?.typ==="wariant"&&
                                Array.isArray(
                                    stanAktualny.litery
                                )&&
                                stanAktualny.litery.length
                            ){
                                tytulAktywnego=
                                    "Trasa w kursach "+
                                    stanAktualny.litery
                                        .map(
                                            x=>
                                                "„"+
                                                String(x)
                                                    .toLowerCase()+
                                                "”"
                                        )
                                        .join(", ");
                            }

                            if(tytulAktywnego){
                                separator=
                                    '<li class="trasa-separator">'+
                                    '<span class="trasa-separator-title">'+
                                    escapeHtml(
                                        tytulAktywnego
                                    )+
                                    '</span>'+
                                    '</li>';
                            }
                        }
                    }

                    /*
                       TYLKO korekta litery po krańcu kursu skróconego.
                       Reszta listy i układu pozostaje bez zmian.
                    */
                    if(
                        czyBiezacyPrzystanekDwukierunkowy()&&
                        separator&&
                        pozycjaWidoczna>0
                    ){
                        separator=
                            poprawLiteryNaglowkaPoKrancu(
                                separator,
                                pelnaLista[
                                    pozycjaWidoczna-1
                                ]
                            );
                    }

                    let czas=null;

                    /*
                       Dla przystanków znajdujących się PRZED aktualnie
                       wybranym przystankiem nie pokazujemy czasu przejazdu.
                       Czas ma sens dopiero od miejsca, na którym znajduje
                       się pasażer / tabliczka.
                    */
                    if(!przed){

                        if(wybrany){
                            /*
                               Aktywny wiersz finalnej listy = miejsce,
                               na którym stoi tabliczka, więc zawsze 0 min.
                            */
                            czas=0;
                        }
                        else{

                            czas=
                                czasy[index];

                            if(
                                czas===null||
                                typeof czas==="undefined"
                            ){
                                czas=
                                    czasDowolnegoKursuNaPrzystanku(
                                        element
                                    );
                            }
                        }
                    }

                    return(
                        separator+
                        '<li class="trasa-stop'+
                        (
                            przed
                                ? ' przed'
                                : ''
                        )+
                        (
                            wybrany
                                ? ' wybrany'
                                : ''
                        )+
                        (
                            wybranyFallback
                                ? ' aktywny-granica-wariantu'
                                : ''
                        )+
                        (
                            wybrany&&
                            index===pierwszyIndexTrasy&&
                            czyBiezacyPrzystanekDwukierunkowy()
                                ? ' aktywny-poczatek-dwukierunkowy'
                                : ''
                        )+
                        (
                            czyNZ(p)
                                ? ' nz'
                                : ''
                        )+
                        (
                            index===pierwszyIndexTrasy
                                ? ' kraniec-poczatek'
                                : ''
                        )+
                        (
                            index===ostatniIndexTrasy
                                ? ' kraniec-koniec'
                                : ''
                        )+
                        '">'+
                        '<span class="trasa-czas">'+
                        (
                            czas===null
                                ? ''
                                : escapeHtml(
                                    String(czas)
                                )
                        )+
                        '</span>'+
                        '<span class="trasa-os"></span>'+
                        '<span class="trasa-nazwa">'+
                        (
                            wybrany
                                ? '<span class="trasa-nazwa-aktywna">'+
                                  escapeHtml(
                                      String(
                                          p.nazwa||""
                                      ).toUpperCase()
                                  )+
                                  '</span>'
                                : escapeHtml(
                                      String(
                                          p.nazwa||""
                                      ).toUpperCase()
                                  )
                        )+
                        '</span>'+
                        '<span class="trasa-nz">'+
                        (
                            czyNZ(p)
                                ? 'ż'
                                : ''
                        )+
                        '</span>'+
                        '</li>'
                    );
                }
            )
            .join("")+
        '</ul>'+
        (
            pokazWydluzenia
                ? renderWydluzeniaTrasy()
                : ''
        )+
        '</div>'
    );
}

function rzeczywistyKraniecKombinacjiDwukierunkowej(item){

    const liczniki=
        new Map();

    dostepneGrupyDni()
        .slice(0,3)
        .forEach(
            grupa=>{

                pobierzKursyDlaSymbolu(
                    grupa.symbol
                )
                .forEach(
                    kurs=>{

                        const dir=
                            Number(
                                kurs?._kierunekIndex
                            );

                        if(
                            dir!==
                            Number(
                                item.dir
                            )
                        ){
                            return;
                        }

                        const litera=
                            literaWariantuPoRzeczywistymPrzebiegu(
                                {
                                    ...kurs,
                                    symbol:grupa.symbol,
                                    _kierunekIndex:dir
                                },
                                dir
                            );

                        const wariant=
                            (
                                litera&&
                                czyPokazacWariantJakLiniaHTML(
                                    litera
                                )
                            )
                                ? String(
                                    litera
                                ).toLowerCase()
                                : "";

                        if(
                            wariant!==
                            String(
                                item.wariant||""
                            ).toLowerCase()
                        ){
                            return;
                        }

                        const ref={
                            numer:String(
                                kurs?.numer||""
                            ),
                            wariant:String(
                                kurs?.wariant||""
                            ).trim(),
                            symbol:grupa.symbol,
                            brygada:String(
                                kurs?.brygada||""
                            ).trim(),
                            _kierunekIndex:dir
                        };

                        /*
                           Dla aktualnego kierunku możemy użyć pełnej
                           listy z dokładnym rozróżnieniem wystąpień.
                        */
                        const pelna=
                            (
                                dir===
                                Number(
                                    aktualnyKierunek
                                )
                            )
                                ? listaPelnejTrasyDoWyswietlenia()
                                : (
                                    znajdzNajpelniejszyKierunek(
                                        dir
                                    )?.przystanki||
                                    []
                                ).map(
                                    (p,index)=>({
                                        p,
                                        index
                                    })
                                );

                        let ostatni=null;

                        pelna.forEach(
                            element=>{

                                if(
                                    kursMaPrzystanek(
                                        ref,
                                        element
                                    )
                                ){
                                    ostatni=
                                        element;
                                }
                            }
                        );

                        if(!ostatni){
                            return;
                        }

                        const nazwa=
                            String(
                                ostatni?.p?.nazwa||
                                ""
                            ).toUpperCase();

                        const key=
                            normalizuj(
                                nazwa
                            );

                        if(!liczniki.has(key)){
                            liczniki.set(
                                key,
                                {
                                    nazwa,
                                    ile:0
                                }
                            );
                        }

                        liczniki
                            .get(key)
                            .ile++;
                    }
                );
            }
        );

    if(!liczniki.size){
        return"";
    }

    return[
        ...liczniki.values()
    ]
    .sort(
        (a,b)=>
            b.ile-a.ile
    )[0].nazwa;
}


function opisKombinacjiDwukierunkowej(item){

    const kierunek=
        String(
            item?.kierunek||""
        ).toUpperCase();

    const kraniec=
        rzeczywistyKraniecKombinacjiDwukierunkowej(
            item
        );

    if(
        kraniec&&
        normalizuj(kraniec)!==
        normalizuj(kierunek)
    ){
        return(
            "kurs do krańca "+
            kraniec
        );
    }

    return(
        "kurs w kierunku "+
        kierunek
    );
}


function renderLegendaDwukierunkowa(){

    const mapa=
        mapaSymboliDwukierunkowych();

    if(!mapa.size){
        return"";
    }

    const wiersze=[];

    [
        ...mapa.values()
    ]
    .sort(
        (a,b)=>
            a.znak.localeCompare(
                b.znak,
                "pl"
            )
    )
    .forEach(
        item=>{

            const opis=
                opisKombinacjiDwukierunkowej(
                    item
                );

            wiersze.push(
                '<div class="legenda-wiersz">'+
                '<span class="legenda-litera">'+
                escapeHtml(
                    item.znak
                )+
                '</span>'+
                '<span class="legenda-myslnik">-</span>'+
                '<span class="legenda-opis">'+
                escapeHtml(
                    opis
                )+
                '</span>'+
                '</div>'
            );
        }
    );

    return wiersze.join("");
}


function renderLegenda(){

    if(
        czyBiezacyPrzystanekDwukierunkowy()
    ){
        return renderLegendaDwukierunkowa();
    }

    const mapa=
        mapaWariantow();

    if(!mapa.size){
        return"";
    }

    /*
       Legenda ma pokazywać WYŁĄCZNIE oznaczenia,
       które faktycznie występują przy minutach
       w aktualnym kierunku i na aktualnym przystanku.

       Dzięki temu warianty istniejące tylko w drugim kierunku
       nie pojawią się tutaj w legendzie.
    */
    const uzyteLitery=
        new Set();

    const grupy=
        dostepneGrupyDni()
            .slice(
                0,
                3
            );

    grupy.forEach(
        grupa=>{

            const kursy=
                pobierzKursyDlaSymbolu(
                    grupa.symbol
                );

            kursy.forEach(
                kurs=>{

                    const litera=
                        String(
                            symbolWariantu(
                                kurs,
                                grupa.symbol
                            )||""
                        )
                        .trim()
                        .toLowerCase();

                    if(litera){
                        uzyteLitery.add(
                            litera
                        );
                    }
                }
            );
        }
    );

    if(!uzyteLitery.size){
        return"";
    }

    /*
       Identyczne opisy nadal łączymy do jednej litery,
       ale tylko wtedy, gdy ta litera rzeczywiście występuje
       przy minutach w aktualnie wyświetlanym rozkładzie.
    */
    const widzianeOpisy=
        new Set();

    const wiersze=[];

    for(
        const [litera,opis]
        of mapa.entries()
    ){

        const tekst=
            String(
                opis||""
            ).trim();

        /*
           Litera trafiła tutaj tylko wtedy, gdy faktycznie
           została użyta przy minutach. Wystarczy więc publiczny
           opis z JSON-u — tak jak w linia.html.
        */
        if(!tekst){
            continue;
        }

        const literaDoPokazania=
            kanonicznaLiteraWariantu(
                litera
            )
            .toLowerCase();

        /*
           Najważniejsze:
           nie ma litery przy żadnej minucie w tym kierunku
           => nie ma jej również w legendzie.
        */
        if(
            !uzyteLitery.has(
                literaDoPokazania
            )
        ){
            continue;
        }

        const klucz=
            normalizujOpisWariantu(
                tekst
            );

        if(
            widzianeOpisy.has(
                klucz
            )
        ){
            continue;
        }

        widzianeOpisy.add(
            klucz
        );

        wiersze.push(
            '<div class="legenda-wiersz">'+
            '<span class="legenda-litera">'+
            escapeHtml(
                literaDoPokazania
            )+
            '</span>'+
            '<span class="legenda-myslnik">-</span>'+
            '<span class="legenda-opis">'+
            escapeHtml(
                tekst
            )+
            '</span>'+
            '</div>'
        );
    }

    if(!wiersze.length){
        return"";
    }

    /*
       Sam renderuj() opakowuje te wiersze w .legenda.
       Zwracamy więc tylko wiersze, żeby nie powstawał
       drugi margin-left i litera wariantu była dokładnie
       pod środkiem pierwszej kolumny godzin.
    */
    return(
        wiersze.join("")
    );
}

function typLinii(numer){

    const tekst=
        String(
            numer||""
        )
            .trim()
            .toUpperCase();

    if(/^Z-/.test(tekst)){
        return"LINIA ZASTĘPCZA";
    }

    const n=Number(tekst);

    if(
        Number.isFinite(n)&&
        n>=1&&
        n<=79
    ){
        return"LINIA TRAMWAJOWA";
    }

    return"LINIA ZWYKŁA";
}

/* V159: pierwszy aktywny przystanek ma pełny początek osi i czas 0.
   Działa również dla SADYBA 01, bez zmiany logiki tras. */
function poprawPierwszyAktywnyPrzystanek(){
    document
        .querySelectorAll(".trasa-kol")
        .forEach(kolumna=>{
            const aktywne=
                kolumna.querySelectorAll(
                    ".trasa-stop.wybrany"
                );

            aktywne.forEach(stop=>{
                let poprzedni=stop.previousElementSibling;
                let maPrzystanekPrzed=false;

                while(poprzedni){
                    if(
                        poprzedni.classList &&
                        poprzedni.classList.contains("trasa-stop")
                    ){
                        maPrzystanekPrzed=true;
                        break;
                    }

                    /* separator rozpoczyna nową grupę trasy */
                    if(
                        poprzedni.classList &&
                        poprzedni.classList.contains("trasa-separator")
                    ){
                        break;
                    }

                    poprzedni=poprzedni.previousElementSibling;
                }

                stop.classList.toggle(
                    "aktywny-pierwszy",
                    !maPrzystanekPrzed
                );

                if(!maPrzystanekPrzed){
                    const czas=
                        stop.querySelector(".trasa-czas");

                    if(czas){
                        czas.textContent="0";
                    }
                }
            });
        });
}

function renderuj(){

    /*
       Każde nowe renderowanie zaczyna z czystym cache.
       W obrębie jednego renderu te same ciężkie analizy są
       wykonywane tylko raz.
    */
    wyczyscCacheTabliczki();


    const kierunek=
        kierunekBazowy();

        kierunek?.przystanki||

    const p=
        lista[
            aktualnyPrzystanek

        dostepneGrupyDni();

        )+

            kierunkiStopu.length>1
                ? kierunkiDwaHtml
                : (
                    '<div class="kierunek">'+

                        String(
                            nazwaKierunku(
                                kierunek
                            )
                        ).toUpperCase()
                    )+
                    '</div>'
                )
        )+
        '<div class="wazny">'+
        (

                      waznyOdDanych
                  )

        )+

        '</div>'+

        '<div class="rozklady-wrap">'+
        ('<div class="rozklady-grid '+kolKlasa+(
                    grupy.some(g => g.tytul === "SOBOTA") &&

        )+
        ' '+
        escapeHtml(
            String(
                p.nr||""
            )
        )+
        '</div>'+

        '</section>'+

        '<aside class="panel-prawy">'+
        '<div class="trasa-head cols-'+
        fragmenty.length+
        '">'+
        '<div class="trasa-head-label">czasy, trasa, przystanki</div>'+ 
        (
            fragmenty.length===2
                ? '<div class="trasa-head-label">czasy, trasa, przystanki</div>'
                : ''
        )+
        '</div>'+
        '<div class="trasa-columns cols-'+
        fragmenty.length+
        '">'+
        trasaHtml+
        '</div>'+
        '</aside>'+

        '</article>'+
        '</div>';

    document
        .getElementById("wynik")
        .innerHTML=
            html;

    requestAnimationFrame(() => {

        /*
           Najpierw dopasowujemy szerokość tabel do napisu
           "NIE KURSUJE", jeżeli taki napis występuje.
        */
        dopasujSzerokoscNieKursuje();

        /*
           Dopiero POTEM wyrównujemy SOBOTĘ i ŚWIĘTO.
           Dzięki temu nawet jeśli jedna z tych tabel została
           poszerzona przez "NIE KURSUJE", druga dostanie
           dokładnie tę samą szerokość.
        */
        wyrownajSzerokoscWeekendow();

        requestAnimationFrame(() => {

            /*
               Powtarzamy wyrównanie po kolejnym przeliczeniu layoutu,
               żeby szerokości były identyczne także po załadowaniu
               fontów i ostatecznym ułożeniu treści.
            */
            wyrownajSzerokoscWeekendow();

            dopasujKolumnyTrasy();
        });
    });

    poprawPierwszyAktywnyPrzystanek();
}
