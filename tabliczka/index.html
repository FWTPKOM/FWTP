        new Map();

    const grupy=
        dostepneGrupyDni()
            .slice(
                0,
                3
            );

    grupy.forEach(
        grupa=>{

            const kursy=
                pobierzKursyDlaSymbolu(
                    grupa.symbol
                );

            kursy.forEach(
                kurs=>{

                    const key=
                        kluczKursu(kurs);

                    if(
                        !wynik.has(key)
                    ){
                        wynik.set(
                            key,
                            {
                                numer:String(
                                    kurs?.numer||""
                                ),
                                wariant:String(
                                    kurs?.wariant||""
                                ).trim(),
                                symbol:grupa.symbol
                            }
                        );
                    }
                }
            );
        }
    );

    return[
        ...wynik.values()
    ];
}


function kursMaPrzystanek(
    kursRef,
    element
){

    if(
        !kursRef||
        !element?.p
    ){
        return false;
    }

    for(
        const rozklad of
        (
            daneLinii?.rozkłady||
            []
        )
    ){

        const p=
            znajdzPrzystanekWRozkladzie(
                rozklad,
                aktualnyKierunek,
                element.p
            );

        const jest=
            (
                p?.kursy||
                []
            ).some(
                k=>
                    String(
                        k?.numer||""
                    )===
                        kursRef.numer&&
                    String(
                        k?.wariant||""
                    ).trim()===
                        kursRef.wariant&&
                    symbolDnia(k)===
                        kursRef.symbol&&
                    czasNaMinuty(
                        k?.czas
                    )!==null
            );

        if(jest){
            return true;
        }
    }

    return false;
}


function reprezentatywneKursyTras(){

    const wszystkie=
        kursyAktualnegoRozkladuDoTrasy();

    const warianty=
        new Map();

    const podstawowe=[];

    wszystkie.forEach(
        kurs=>{

            const literaKanoniczna=
                kanonicznaLiteraWariantu(
                    kurs.wariant
                );

            if(
                kurs.wariant&&
                czyWariantTrasyPrzez(
                    kurs.wariant
                )
            ){

                if(
                    !warianty.has(
                        literaKanoniczna
                    )
                ){
                    warianty.set(
                        literaKanoniczna,
                        []
                    );
                }

                warianty
                    .get(
                        literaKanoniczna
                    )
                    .push(kurs);
            }
            else{

                /*
                   Kursy skrócone nie mogą definiować trasy podstawowej,
                   bo wtedy np. kurs do BARTNICZEJ zniekształcałby
                   oznaczenia późniejszych odcinków.
                */
                const opis=
                    mapaWariantow()
                        .get(
                            kurs.wariant
                        )||
                    "";

                if(
                    !/skrócon|wydłuż|zajezdni|tylko do/i.test(
                        String(opis)
                    )
                ){
                    podstawowe.push(kurs);
                }
            }
        }
    );

    return{
        podstawowe,
        warianty
    };
}


function wybierzNajdluzszyKurs(
    listaKursow
){

    const pelna=
        listaTrasyDoWyswietlenia();

    let najlepszy=null;
    let max=-1;

    (
        listaKursow||
        []
    ).forEach(
        kurs=>{

            let licznik=0;

            pelna.forEach(
                element=>{
                    if(
                        kursMaPrzystanek(
                            kurs,
                            element
                        )
                    ){
                        licznik++;
                    }
                }
            );

            if(licznik>max){
                max=licznik;
                najlepszy=kurs;
            }
        }
    );

    return najlepszy;
}


function danePrzebiegowWariantowych(){

    const zestaw=
        reprezentatywneKursyTras();

    const baza=
        wybierzNajdluzszyKurs(
            zestaw.podstawowe
        );

    const warianty=
        new Map();

    for(
        const [litera,kursy]
        of zestaw.warianty.entries()
    ){
        const kurs=
            wybierzNajdluzszyKurs(
                kursy
            );

        if(kurs){
            warianty.set(
                litera,
                kurs
            );
        }
    }

    return{
        baza,
        warianty
    };
}


function stanTrasyNaPrzystanku(element){

    const dane=
        danePrzebiegowWariantowych();

    if(
        !dane.baza&&
        !dane.warianty.size
    ){
        return{
            typ:"wszystkie",
            litery:[]
        };
    }

    const bazaJedzie=
        dane.baza
            ? kursMaPrzystanek(
                dane.baza,
                element
            )
            : false;

    const wariantyJadace=[];

    for(
        const [litera,kurs]
        of dane.warianty.entries()
    ){
        if(
            kursMaPrzystanek(
                kurs,
                element
            )
        ){
            wariantyJadace.push(
                litera
            );
        }
    }

    /*
       Jeżeli przystanek jest częścią trasy podstawowej,
       nie opisujemy go jako "Trasa w kursach ...".
       Jest to zwykły wspólny fragment.

       Dzięki temu wariant "o - przez POLFĘ" nie pojawi się nad
       KUPIECKĄ tylko dlatego, że jego kurs później przejeżdża
       przez wspólny przystanek.
    */
    if(bazaJedzie){

        const wszystkieWariantyJada=
            [
                ...dane.warianty.keys()
            ]
            .every(
                litera=>
                    wariantyJadace.includes(
                        litera
                    )
            );

        return{
            typ:
                wszystkieWariantyJada
                    ? "wszystkie"
                    : "podstawowa",
            litery:wariantyJadace
        };
    }

    /*
       Przystanku nie ma na trasie podstawowej.
       Zatem jest to rzeczywisty odcinek wariantowy.
       Pokazujemy WYŁĄCZNIE litery kursów, które faktycznie
       obsługują ten przystanek.
    */
    if(wariantyJadace.length){

        return{
            typ:"wariant",
            litery:wariantyJadace
        };
    }

    return{
        typ:"inne",
        litery:[]
    };
}


function kluczStanuTrasy(stan){

    if(!stan){
        return"";
    }

    return(
        stan.typ+
        ":"+
        (
            stan.litery||
            []
        )
        .slice()
        .sort()
        .join(",")
    );
}


function naglowekZmianyTrasy(
    poprzedni,
    aktualny
){

    if(!aktualny){
        return"";
    }

    const poprzedniKlucz=
        kluczStanuTrasy(
            poprzedni
        );

    const aktualnyKlucz=
        kluczStanuTrasy(
            aktualny
        );

    if(
        poprzedniKlucz===
        aktualnyKlucz
    ){
        return"";
    }

    if(
        aktualny.typ==="wariant"&&
        aktualny.litery.length
    ){

        const litery=
            aktualny.litery
                .map(
                    litera=>
                        "„"+
                        escapeHtml(
                            String(litera)
                                .toLowerCase()
                        )+
                        "”"
                )
                .join(", ");

        return(
            '<li class="trasa-separator">'+
            '<span class="trasa-separator-title">'+
            'Trasa w kursach '+
            litery+
            '</span>'+
            '</li>'
        );
    }

    /*
       Po odcinku wariantowym napis "Trasa we wszystkich kursach"
       pojawia się dopiero wtedy, gdy faktycznie wszystkie przebiegi
       wracają na wspólną trasę.
    */
    if(
        poprzedni&&
        poprzedni.typ==="wariant"&&
        aktualny.typ==="wszystkie"
    ){
        return(
            '<li class="trasa-separator">'+
            '<span class="trasa-separator-title">'+
            'Trasa we wszystkich kursach'+
            '</span>'+
            '</li>'
        );
    }

    return"";
}


function czasDowolnegoKursuNaPrzystanku(
    element
){

    const listaStartowa=
        kursyAktualnegoRozkladuDoTrasy();

    const baza=
        kierunekBazowy();

    const startP=
        baza?.przystanki?.[
            aktualnyPrzystanek
        ];

    if(
        !startP||
        !element?.p
    ){
        return null;
    }

    const wyniki=[];

    listaStartowa.forEach(
        kursRef=>{

            let start=null;
            let koniec=null;

            for(
                const rozklad of
                (
                    daneLinii?.rozkłady||
                    []
                )
            ){

                const pStart=
                    znajdzPrzystanekWRozkladzie(
                        rozklad,
                        aktualnyKierunek,
                        startP
                    );

                const kStart=
                    (
                        pStart?.kursy||
                        []
                    ).find(
                        k=>
                            String(
                                k?.numer||""
                            )===
                                kursRef.numer&&
                            String(
                                k?.wariant||""
                            ).trim()===
                                kursRef.wariant&&
                            symbolDnia(k)===
                                kursRef.symbol&&
                            czasNaMinuty(
                                k?.czas
                            )!==null
                    );

                if(kStart){
                    start=
                        czasNaMinuty(
                            kStart.czas
                        );
                }

                const pKoniec=
                    znajdzPrzystanekWRozkladzie(
                        rozklad,
                        aktualnyKierunek,
                        element.p
                    );

                const kKoniec=
                    (
                        pKoniec?.kursy||
                        []
                    ).find(
                        k=>
                            String(
                                k?.numer||""
                            )===
                                kursRef.numer&&
                            String(
                                k?.wariant||""
                            ).trim()===
                                kursRef.wariant&&
                            symbolDnia(k)===
                                kursRef.symbol&&
                            czasNaMinuty(
                                k?.czas
                            )!==null
                    );

                if(kKoniec){
                    koniec=
                        czasNaMinuty(
                            kKoniec.czas
                        );
                }
            }

            if(
                start!==null&&
                koniec!==null
            ){

                let roznica=
                    koniec-start;

                while(roznica<0){
                    roznica+=1440;
                }

                wyniki.push(
                    roznica
                );
            }
        }
    );

    if(!wyniki.length){
        return null;
    }

    /*
       Jeżeli kilka kursów daje czas dla tego samego przystanku,
       bierzemy najmniejszy poprawny czas przejazdu.
    */
    return Math.min(
        ...wyniki
    );
}


function wariantyNaPrzystanku(element){

    const wynik=new Set();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    aktualnyKierunek,
                    element.p
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        czasNaMinuty(
                            kurs?.czas
                        )===null
                    ){
                        return;
                    }

                    wynik.add(
                        String(
                            kurs?.wariant||""
                        ).trim()
                    );
                }
            );
        }
    );

    return wynik;
}


function daneTrasWydluzonych(){

    const pelna=
        listaPelnejTrasyDoWyswietlenia();

    if(!pelna.length){
        return{
            baza:[],
            wydluzenia:[]
        };
    }

    const wydluzone=
        literyWydluzonychWariantow();

    if(!wydluzone.size){
        return{
            baza:pelna,
            wydluzenia:[]
        };
    }

    let koniecBazy=
        pelna.length-1;

    let znalezionoKoniec=false;

    for(
        let i=pelna.length-1;
        i>=0;
        i--
    ){
        const warianty=
            wariantyNaPrzystanku(
                pelna[i]
            );

        const maKursPodstawowy=
            [...warianty].some(
                litera=>
                    !wydluzone.has(
                        String(litera||"")
                            .trim()
                    )
            );

        if(maKursPodstawowy){
            koniecBazy=i;
            znalezionoKoniec=true;
            break;
        }
    }

    if(!znalezionoKoniec){
        return{
            baza:pelna,
            wydluzenia:[]
        };
    }

    const baza=
        pelna.slice(
            0,
            koniecBazy+1
        );

    const ogon=
        pelna.slice(
            koniecBazy+1
        );

    const wydluzenia=[];

    wydluzone.forEach(
        litera=>{

            const przystanki=
                ogon.filter(
                    element=>
                        wariantyNaPrzystanku(
                            element
                        ).has(litera)
                );

            if(przystanki.length){
                wydluzenia.push({
                    litera,
                    przystanki
                });
            }
        }
    );

    return{
        baza,
        wydluzenia
    };
}


function listaTrasyDoWyswietlenia(){

    return daneTrasWydluzonych()
        .baza;
}


function podzielTrase(lista){

    /*
       Najpierw ZAWSZE próbujemy zmieścić całą trasę
       w jednej kolumnie. Dopiero po wyrenderowaniu
       sprawdzamy rzeczywistą wysokość.
    */
    return[
        {
            start:0,
            lista
        }
    ];
}


function podzielTraseNaDwie(lista){

    const polowa=
        Math.ceil(
            lista.length/2
        );

    return[
        {
            start:0,
            lista:
                lista.slice(
                    0,
                    polowa
                )
        },
        {
            start:polowa,
            lista:
                lista.slice(
                    polowa
                )
        }
    ];
}



function znajdzKursWariantuDoTrasy(litera){

    const pelna=
        kierunekBazowy()?.przystanki||
        [];

    const start=
        pelna[
            aktualnyPrzystanek
        ];

    if(!start){
        return null;
    }

    const kandydaci=
        new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    aktualnyKierunek,
                    start
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        String(
                            kurs?.wariant||""
                        ).trim()!==litera
                    ){
                        return;
                    }

                    const czas=
                        czasNaMinuty(
                            kurs?.czas
                        );

                    if(czas===null){
                        return;
                    }

                    const key=
                        kluczKursu(kurs);

                    if(!kandydaci.has(key)){
                        kandydaci.set(
                            key,
                            {
                                key,
                                numer:String(
                                    kurs?.numer||""
                                ),
                                wariant:litera,
                                start:czas,
                                count:0
                            }
                        );
                    }
                }
            );
        }
    );

    kandydaci.forEach(
        kandydat=>{

            pelna.forEach(
                p=>{
                    if(
                        znajdzCzasKursuNaPrzystanku(
                            kandydat,
                            p
                        )!==null
                    ){
                        kandydat.count++;
                    }
                }
            );
        }
    );

    return[
        ...kandydaci.values()
    ].sort(
        (a,b)=>
            b.count-a.count||
            a.start-b.start
    )[0]||null;
}


function czasWariantuNaPrzystanku(
    litera,
    element
){

    const kandydat=
        znajdzKursWariantuDoTrasy(
            litera
        );

    if(!kandydat){
        return null;
    }

    const pelna=
        kierunekBazowy()?.przystanki||
        [];

    const start=
        pelna[
            aktualnyPrzystanek
        ];

    if(!start){
        return null;
    }

    const t0=
        znajdzCzasKursuNaPrzystanku(
            kandydat,
            start
        );

    const t=
        znajdzCzasKursuNaPrzystanku(
            kandydat,
            element.p
        );

    if(
        t0===null||
        t===null
    ){
        return null;
    }

    let wynik=t-t0;

    while(wynik<0){
        wynik+=1440;
    }

    return wynik;
}


function renderWydluzeniaTrasy(){

    const dane=
        daneTrasWydluzonych();

    if(!dane.wydluzenia.length){
        return"";
    }

    return dane.wydluzenia
        .map(
            wariant=>{

                const litera=
                    String(
                        wariant.litera||""
                    )
                    .trim()
                    .toLowerCase();

                const wiersze=
                    wariant.przystanki
                        .map(
                            element=>{

                                const p=
                                    element.p;

                                const czas=
                                    czasWariantuNaPrzystanku(
                                        wariant.litera,
                                        element
                                    );

                                return(
                                    '<li class="trasa-extra-stop'+
                                    (
                                        czyNZ(p)
                                            ? ' nz'
                                            : ''
                                    )+
                                    '">'+
                                    '<span class="trasa-czas">'+
                                    (
                                        czas===null
                                            ? ''
                                            : escapeHtml(
                                                String(czas)
                                            )
                                    )+
                                    '</span>'+
                                    '<span class="trasa-os"></span>'+
                                    '<span class="trasa-nazwa">'+
                                    escapeHtml(
                                        String(
                                            p?.nazwa||""
                                        ).toUpperCase()
                                    )+
                                    '</span>'+
                                    '<span class="trasa-nz">'+
                                    (
                                        czyNZ(p)
                                            ? 'ż'
                                            : ''
                                    )+
                                    '</span>'+
                                    '</li>'
                                );
                            }
                        )
                        .join("");

                return(
                    '<div class="trasa-extra">'+
                    '<div class="trasa-extra-title">'+
                    'Trasa w kursach „'+
                    escapeHtml(litera)+
                    '”'+
                    '</div>'+
                    '<ul class="trasa-extra-lista">'+
                    wiersze+
                    '</ul>'+
                    '</div>'
                );
            }
        )
        .join("");
}


function renderTrasaKolumna(
    fragment,
    czasy,
    pierwszyIndexTrasy,
    ostatniIndexTrasy,
    pokazWydluzenia=false
){

    const pelnaLista=
        listaTrasyDoWyswietlenia();

    return(
        '<div class="trasa-kol">'+
        '<ul class="trasa-lista">'+
        fragment.lista
            .map(
                (element,lokalny)=>{

                    const p=
                        element&&
                        Object.prototype.hasOwnProperty.call(
                            element,
                            "p"
                        )
                            ? element.p
                            : element;

                    const index=
                        element&&
                        Object.prototype.hasOwnProperty.call(
                            element,
                            "index"
                        )
                            ? element.index
                            : fragment.start+
                              lokalny;

                    const stanAktualny=
                        stanTrasyNaPrzystanku(
                            element
                        );

                    let stanPoprzedni=null;

                    if(index>0){

                        const poprzedniElement=
                            pelnaLista.find(
                                x=>
                                    x.index===
                                    index-1
                            );

                        if(poprzedniElement){
                            stanPoprzedni=
                                stanTrasyNaPrzystanku(
                                    poprzedniElement
                                );
                        }
                    }

                    const separator=
                        naglowekZmianyTrasy(
                            stanPoprzedni,
                            stanAktualny
                        );

                    const przed=
                        index<
                        aktualnyPrzystanek;

                    const wybrany=
                        index===
                        aktualnyPrzystanek;

                    let czas=
                        czasy[index];

                    if(
                        czas===null||
                        typeof czas==="undefined"
                    ){
                        czas=
                            czasDowolnegoKursuNaPrzystanku(
                                element
                            );
                    }

                    return(
                        separator+
                        '<li class="trasa-stop'+
                        (
                            przed
                                ? ' przed'
                                : ''
                        )+
                        (
                            wybrany
                                ? ' wybrany'
                                : ''
                        )+
                        (
                            czyNZ(p)
                                ? ' nz'
                                : ''
                        )+
                        (
                            index===pierwszyIndexTrasy
                                ? ' kraniec-poczatek'
                                : ''
                        )+
                        (
                            index===ostatniIndexTrasy
                                ? ' kraniec-koniec'
                                : ''
                        )+
                        '">'+
                        '<span class="trasa-czas">'+
                        (
                            czas===null
                                ? ''
                                : escapeHtml(
                                    String(czas)
                                )
                        )+
                        '</span>'+
                        '<span class="trasa-os"></span>'+
                        '<span class="trasa-nazwa">'+
                        (
                            wybrany
                                ? '<span class="trasa-nazwa-aktywna">'+
                                  escapeHtml(
                                      String(
                                          p.nazwa||""
                                      ).toUpperCase()
                                  )+
                                  '</span>'
                                : escapeHtml(
                                      String(
                                          p.nazwa||""
                                      ).toUpperCase()
                                  )
                        )+
                        '</span>'+
                        '<span class="trasa-nz">'+
                        (
                            czyNZ(p)
                                ? 'ż'
                                : ''
                        )+
                        '</span>'+
                        '</li>'
                    );
                }
            )
            .join("")+
        '</ul>'+
        (
            pokazWydluzenia
                ? renderWydluzeniaTrasy()
                : ''
        )+
        '</div>'
    );
}


/* =========================================================
   LEGENDA
   ========================================================= */

function renderLegenda(){

    const mapa=
        mapaWariantow();

    if(!mapa.size){
        return"";
    }

    /*
       Legenda ma pokazywać WYŁĄCZNIE oznaczenia,
       które faktycznie występują przy minutach
       w aktualnym kierunku i na aktualnym przystanku.

       Dzięki temu warianty istniejące tylko w drugim kierunku
       nie pojawią się tutaj w legendzie.
    */
    const uzyteLitery=
        new Set();

    const grupy=
        dostepneGrupyDni()
            .slice(
                0,
                3
            );

    grupy.forEach(
        grupa=>{

            const kursy=
                pobierzKursyDlaSymbolu(
                    grupa.symbol
                );

            kursy.forEach(
                kurs=>{

                    const litera=
                        String(
                            symbolWariantu(
                                kurs,
                                grupa.symbol
                            )||""
                        )
                        .trim()
                        .toLowerCase();

                    if(litera){
                        uzyteLitery.add(
                            litera
                        );
                    }
                }
            );
        }
    );

    if(!uzyteLitery.size){
        return"";
    }

    /*
       Identyczne opisy nadal łączymy do jednej litery,
       ale tylko wtedy, gdy ta litera rzeczywiście występuje
       przy minutach w aktualnie wyświetlanym rozkładzie.
    */
    const widzianeOpisy=
        new Set();

    const wiersze=[];

    for(
        const [litera,opis]
        of mapa.entries()
    ){

        const tekst=
            String(
                opis||""
            ).trim();

        if(
            !tekst||
            !czyOznaczacWariant(
                tekst
            )
        ){
            continue;
        }

        const literaDoPokazania=
            kanonicznaLiteraWariantu(
                litera
            )
            .toLowerCase();

        /*
           Najważniejsze:
           nie ma litery przy żadnej minucie w tym kierunku
           => nie ma jej również w legendzie.
        */
        if(
            !uzyteLitery.has(
                literaDoPokazania
            )
        ){
            continue;
        }

        const klucz=
            normalizujOpisWariantu(
                tekst
            );

        if(
            widzianeOpisy.has(
                klucz
            )
        ){
            continue;
        }

        widzianeOpisy.add(
            klucz
        );

        wiersze.push(
            '<div class="legenda-wiersz">'+
            '<span class="legenda-litera">'+
            escapeHtml(
                literaDoPokazania
            )+
            '</span>'+
            '<span class="legenda-myslnik">-</span>'+
            '<span class="legenda-opis">'+
            escapeHtml(
                tekst
            )+
            '</span>'+
            '</div>'
        );
    }

    if(!wiersze.length){
        return"";
    }

    return(
        '<div class="legenda">'+
        wiersze.join("")+
        '</div>'
    );
}


/* =========================================================
   TYP LINII
   ========================================================= */

function typLinii(numer){

    const tekst=
        String(
            numer||""
        )
            .trim()
            .toUpperCase();

    if(/^Z-/.test(tekst)){
        return"LINIA ZASTĘPCZA";
    }

    const n=Number(tekst);

    if(
        Number.isFinite(n)&&
        n>=1&&
        n<=79
    ){
        return"LINIA TRAMWAJOWA";
    }

    return"LINIA ZWYKŁA";
}


/* =========================================================
   RENDER
   ========================================================= */

function renderuj(){

    const kierunek=
        kierunekBazowy();

    const lista=
        kierunek?.przystanki||
        [];

    const p=
        lista[
            aktualnyPrzystanek
        ];

    if(!p){
        pokazBlad(
            "Nie znaleziono wybranego przystanku."
        );
        return;
    }

    const grupy=
        dostepneGrupyDni();

    const fragmenty=
        podzielTrase(
            lista
        );

    const czasy=
        czasyTrasy();

    const numer=
        String(
            daneLinii.linia||
            aktualnaLinia
        );

    const klasaTrasy=
        fragmenty.length===2
            ? " trasa-2-kol"
            : "";

    const legenda=
        renderLegenda();

    const grupyRozkladow=
        grupy.slice(
            0,
            3
        );

    const wspolneGodziny=
        wspolneGodzinyDlaGrup(
            grupyRozkladow
        );

    const rozklady=
        grupyRozkladow
            .map(
                grupa=>
                    renderDzien(
                        grupa,
                        wspolneGodziny
                    )
            )
            .join("");

    const kolKlasa=
        "kol-"+
        Math.max(
            1,
            Math.min(
                3,
                grupy.length
            )
        );

    const listaTrasy=
        listaTrasyDoWyswietlenia();

    const pierwszyIndexTrasy=
        listaTrasy.length
            ? listaTrasy[0].index
            : -1;

    const ostatniIndexTrasy=
        listaTrasy.length
            ? listaTrasy[listaTrasy.length-1].index
            : -1;

    const trasaHtml=
        fragmenty
            .map(
                f=>
                    renderTrasaKolumna(
                        f,
                        czasy,
                        pierwszyIndexTrasy,
                        ostatniIndexTrasy
                    )
            )
            .join("");

    const html=
        '<div class="tabliczka-scroll">'+
        '<article class="tabliczka'+
        klasaTrasy+
        '">'+

        '<section class="panel-lewy">'+

        '<div class="naglowek-tabliczki">'+
        '<div class="numer-linii-box">'+
        escapeHtml(numer)+
        '</div>'+
        '<div class="dane-linii">'+
        '<div class="typ-linii">'+
        escapeHtml(
            typLinii(numer)
        )+
        '</div>'+
        '<div class="kierunek">'+
        escapeHtml(
            String(
                nazwaKierunku(
                    kierunek
                )
            ).toUpperCase()
        )+
        '</div>'+
        '<div class="wazny">'+
        (
            waznyOdDanych
                ? 'Ważny od '+
                  escapeHtml(
                      waznyOdDanych
                  )
                : ''
        )+
        '</div>'+
        '</div>'+
        '</div>'+

        '<div class="rozklady-wrap">'+
        ('<div class="rozklady-grid '+kolKlasa+(
                    grupy.some(g => g.tytul === "SOBOTA") &&
                    grupy.some(g => g.tytul.includes("NIEDZIELA"))
                        ? ' weekend-rowny'
                        : ''
                )+'">')+
        rozklady+
        '</div>'+
        '</div>'+

        (
            legenda
                ? '<div class="legenda">'+
                  legenda+
                  '</div>'
                : ''
        )+

        '<div class="etykieta-przystanku">'+
        'Przystanek: '+
        escapeHtml(
            String(
                p.nazwa||""
            ).toUpperCase()
        )+
        ' '+
        escapeHtml(
            String(
                p.nr||""
            )
        )+
        '</div>'+

        '</section>'+

        '<aside class="panel-prawy">'+
        '<div class="trasa-head cols-'+
        fragmenty.length+
        '">'+
        '<div class="trasa-head-label">czasy, trasa, przystanki</div>'+ 
        (
            fragmenty.length===2
                ? '<div class="trasa-head-label">czasy, trasa, przystanki</div>'
                : ''
        )+
        '</div>'+
        '<div class="trasa-columns cols-'+
        fragmenty.length+
        '">'+
        trasaHtml+
        '</div>'+
        '</aside>'+

        '</article>'+
        '</div>';

    document
        .getElementById("wynik")
        .innerHTML=
            html;

    requestAnimationFrame(() => {
        wyrownajSzerokoscWeekendow();

        requestAnimationFrame(() => {
            dopasujKolumnyTrasy();
        });
    });
}


/* =========================================================
   POMOCNICZE
   ========================================================= */

function normalizuj(tekst){

    return String(
        tekst||""
    )
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim()
        .toUpperCase();
}


function escapeHtml(tekst){

    return String(
        tekst??""
    )
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function ustawStatus(tekst){

    document
        .getElementById("status")
        .textContent=
            tekst;
}


function pokazBlad(tekst){

    ustawStatus(tekst);

    document
        .getElementById("wynik")
        .innerHTML=
            '<div class="blad">'+
            escapeHtml(tekst)+
            '</div>';
}



function wyrownajSzerokoscWeekendow() {
    const dni = Array.from(
        document.querySelectorAll(".rozklady-grid .dzien")
    );

    const sobota = dni.find(d => {
        const t = (d.querySelector(".dzien-tytul")?.textContent || "")
            .trim()
            .toUpperCase();
        return t === "SOBOTA";
    });

    const niedziela = dni.find(d => {
        const t = (d.querySelector(".dzien-tytul")?.textContent || "")
            .trim()
            .toUpperCase();
        return t.includes("NIEDZIELA");
    });

    if (!sobota || !niedziela) return;

    sobota.style.width = "";
    sobota.style.minWidth = "";
    niedziela.style.width = "";
    niedziela.style.minWidth = "";

    const szerokosc = Math.max(
        Math.ceil(sobota.getBoundingClientRect().width),
        Math.ceil(niedziela.getBoundingClientRect().width)
    );

    [sobota, niedziela].forEach(d => {
        d.style.width = szerokosc + "px";
        d.style.minWidth = szerokosc + "px";
    });
}
function ustawNaglowekTrasy(liczbaKolumn) {

    const head = document.querySelector(".trasa-head");
    if (!head) return;

    const ile = liczbaKolumn === 2 ? 2 : 1;

    head.className = "trasa-head cols-" + ile;
    head.innerHTML =
        '<div class="trasa-head-label">czasy, trasa, przystanki</div>' +
        (
            ile === 2
                ? '<div class="trasa-head-label">czasy, trasa, przystanki</div>'
                : ''
        );
}


function dopasujKolumnyTrasy() {

    const tabliczka = document.querySelector(".tabliczka");
    const columns = document.querySelector(".trasa-columns");

    if (!tabliczka || !columns) return;

    const lista = listaTrasyDoWyswietlenia();
    if (!lista.length) return;

    const czasy = czasyTrasy();

    const pierwszyIndexTrasy =
        lista.length
            ? lista[0].index
            : -1;

    const ostatniIndexTrasy =
        lista.length
            ? lista[lista.length - 1].index
            : -1;

    // Najpierw próbujemy wszystko w jednej kolumnie.
    tabliczka.classList.remove("trasa-2-kol");
    columns.className = "trasa-columns cols-1";
    ustawNaglowekTrasy(1);
    columns.innerHTML = renderTrasaKolumna(
        { start: 0, lista: lista },
        czasy,
        pierwszyIndexTrasy,
        ostatniIndexTrasy,
        true
    );

    ustawZawijanieNazwTrasy(columns);

    const jednaKolumna = columns.querySelector(".trasa-kol");
    const jednaLista = columns.querySelector(".trasa-lista");

    if (!jednaKolumna || !jednaLista) return;

    const style1 = getComputedStyle(jednaKolumna);
    const paddingY1 =
        parseFloat(style1.paddingTop || 0) +
        parseFloat(style1.paddingBottom || 0);

    const potrzebnaWysokosc =
        Math.ceil(jednaLista.getBoundingClientRect().height + paddingY1);

    const dostepnaWysokosc =
        Math.floor(columns.clientHeight);

    if (potrzebnaWysokosc <= dostepnaWysokosc) {
        return;
    }

    // Jeśli się nie mieści, przechodzimy na szeroki panel 2-kolumnowy.
    tabliczka.classList.add("trasa-2-kol");
    columns.className = "trasa-columns cols-2";
    ustawNaglowekTrasy(2);

    // Do pierwszej kolumny tymczasowo wkładamy wszystko,
    // aby sprawdzić ile kolejnych przystanków realnie się mieści.
    columns.innerHTML =
        renderTrasaKolumna(
            { start: 0, lista: lista },
            czasy,
            pierwszyIndexTrasy,
            ostatniIndexTrasy,
            true
        ) +
        '<div class="trasa-kol trasa-kol-pusta"></div>';

    ustawZawijanieNazwTrasy(columns);

    const pierwszaKolumna = columns.querySelector(".trasa-kol");
    const wiersze = Array.from(
        pierwszaKolumna?.querySelectorAll(".trasa-stop") || []
    );

    if (!pierwszaKolumna || !wiersze.length) return;

    const stylKolumny = getComputedStyle(pierwszaKolumna);
    const paddingBottom = parseFloat(stylKolumny.paddingBottom || 0);

    const maxDol =
        pierwszaKolumna.getBoundingClientRect().top +
        columns.clientHeight -
        paddingBottom;

    let ileSieMiesci = 0;

    for (const wiersz of wiersze) {
        const rect = wiersz.getBoundingClientRect();

        if (rect.bottom <= maxDol + 0.5) {
            ileSieMiesci++;
        } else {
            break;
        }
    }

    ileSieMiesci = Math.max(
        1,
        Math.min(
            ileSieMiesci,
            lista.length - 1
        )
    );

    const pierwszaLista = lista.slice(0, ileSieMiesci);
    const drugaLista = lista.slice(ileSieMiesci);

    // Pierwsza kolumna = maksymalnie dużo przystanków.
    // Druga kolumna = wyłącznie te, które się nie zmieściły.
    columns.innerHTML =
        renderTrasaKolumna(
            {
                start: 0,
                lista: pierwszaLista
            },
            czasy,
            pierwszyIndexTrasy,
            ostatniIndexTrasy,
            false
        ) +
        renderTrasaKolumna(
            {
                start: ileSieMiesci,
                lista: drugaLista
            },
            czasy,
            pierwszyIndexTrasy,
            ostatniIndexTrasy,
            true
        );

    ustawZawijanieNazwTrasy(columns);
}






function ustawZawijanieNazwTrasy(columns){

    if(!columns){
        return;
    }

    /*
       Każda nazwa jest oceniana osobno:
       - jeśli mieści się w jednej linii -> pozostaje bez zawijania,
       - jeśli się nie mieści -> tylko ta nazwa dostaje zawijanie.
    */
    const nazwy=
        Array.from(
            columns.querySelectorAll(
                ".trasa-nazwa"
            )
        );

    nazwy.forEach(
        el=>{
            el.classList.remove(
                "zawijaj"
            );
        }
    );

    nazwy.forEach(
        el=>{

            if(
                Math.ceil(
                    el.scrollWidth
                )>
                Math.ceil(
                    el.clientWidth
                )+1
            ){
                el.classList.add(
                    "zawijaj"
                );
            }
        }
    );
}
