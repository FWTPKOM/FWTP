<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FWTP - Tabliczki</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* =========================================================
           STRONA
           ========================================================= */

        .tabliczka-page {
            max-width: 1260px;
            margin: 24px auto;
            padding: 0 15px;
        }

        .sterowanie {
            margin-bottom: 18px;
            padding: 16px;

            background: #fff;

            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .sterowanie h1 {
            margin: 0 0 13px;

            font-size: 25px;
        }

        .sterowanie-grid {
            display: grid;
            grid-template-columns: 110px 1fr 1.3fr 155px auto;
            gap: 9px;
            align-items: end;
        }

        .pole {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .pole label {
            font-size: 13px;
            font-weight: 700;
        }

        .pole input,
        .pole select {
            width: 100%;
            min-height: 39px;

            padding: 7px 9px;

            background: #fff;
            color: #222;

            border: 1px solid #ccc;
            border-radius: 5px;

            font: inherit;
            font-size: 14px;

            box-sizing: border-box;
        }

        .pokaz-btn {
            min-height: 39px;
            padding: 8px 18px;

            border: 0;
            border-radius: 5px;

            background: #d61c12;
            color: #fff;

            font: inherit;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        .pokaz-btn:hover {
            background: #b8170f;
        }

        .status {
            margin-top: 9px;

            color: #666;

            font-size: 13px;
        }

        .tabliczka-scroll {
            overflow-x: auto;
            padding-bottom: 8px;

            -webkit-overflow-scrolling: touch;
        }


        /* =========================================================
           TABLICZKA - PROPORCJE WZOROWANE NA PDF
           ========================================================= */


    .tabliczka,
.tabliczka * {
    font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
}

.numer-linii-box,
.numer-linii-box * {
    font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
}

        .tabliczka {
            --lewa: 74.0%;
            --prawa: 26.0%;

            display: grid;
            grid-template-columns: var(--lewa) var(--prawa);

            width: 210mm;
            height: 160mm;
            min-height: 160mm;

            margin: 0 auto;

            background: #fff;
            color: #000000;

            border: 4px double #111;


            box-sizing: border-box;
        }

        .tabliczka.trasa-2-kol {
            --lewa: 50.5%;
            --prawa: 49.5%;
        }

        .panel-lewy {
            position: relative;

            min-width: 0;

            border-right: 0;
        }

        .panel-lewy::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            right: -3px;
            width: 1px;
            background: #777;
            z-index: 2;
        }

        .panel-prawy {
            min-width: 0;
            height: 100%;
            overflow: hidden;
        }


        /* =========================================================
           NAGŁÓWEK
           ========================================================= */

        .naglowek-tabliczki {
            display: grid;
            grid-template-columns: 150px minmax(0, 1fr);

            width: min(560px, calc(100% - 23px));

            margin: 12px 0 0 17px;
        }

        .numer-linii-box {
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;
            margin: 0;

            border: 1px solid #777;

            font-size: 80px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -2px;
            text-align: center;
            text-indent: 0;

            box-sizing: border-box;
        }

        .dane-linii {
            padding: 5px 0 0 13px;
        }

        .typ-linii {
            position: relative;
            top: -4px;
            margin-bottom: 9px;

            font-size: 17px;
            font-weight: 400;
        }

        .kierunek {
            position: relative;
            top: 2px;
            margin-bottom: 5px;

            font-size: 17px;
            font-weight: 400;
        }

        .kierunek::before {
            content: "→";
            display: inline-block;

            margin-right: 7px;
        }

        .wazny {
            font-size: 11px;
            color: #000000;
        }


        /* =========================================================
           TABELE ROZKŁADÓW
           ========================================================= */

        .rozklady-wrap {
            width: min(640px, calc(100% - 36px));

            margin: 3px 0 0 17px;
        }

        .rozklady-grid {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: max-content;
            align-items: start;
            justify-content: start;

            width: max-content;
            max-width: 100%;
        }

        .rozklady-grid.kol-1,
        .rozklady-grid.kol-2,
        .rozklady-grid.kol-3 {
            grid-template-columns: none;
            max-width: 100%;
        }

        /*
           Każdy typ dnia jest JEDNYM pudełkiem:
           tytuł dnia + Godz. + Minuty + wszystkie godziny.
           Dzięki white-space: nowrap w tytule minimalna szerokość
           całej kolumny nigdy nie będzie mniejsza niż sam napis typu dnia.
        */

        .rozklady-grid.kol-3.weekend-rowny {
            grid-template-columns: max-content repeat(2, minmax(max-content, 1fr));
        }

        .rozklady-grid.kol-3.weekend-rowny .dzien:nth-child(2),
        .rozklady-grid.kol-3.weekend-rowny .dzien:nth-child(3) {
            width: 100%;
            min-width: 100%;
        }

        .dzien {
            display: block;

            width: max-content;
            min-width: max-content;

            border: 1px solid #111;
            box-sizing: border-box;
            overflow: hidden;
        }

        .dzien + .dzien {
            margin-left: 3px;
        }

        .dzien-tytul {
            min-height: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 1px 8px 0 8px;
            font-size: 16px;
            line-height: 1.05;
            font-weight: 400;
            text-align: center;
            white-space: nowrap;
            color: #000000;
            width: auto;
            min-width: max-content;
            box-sizing: border-box;
        }

        .godziny-head {
            display: grid;
            grid-template-columns: 22px minmax(0, 1fr);
            width: 100%;

            min-height: 21px;

            border-bottom: 1px solid #111;

            font-size: 13px;
            font-weight: 400;
        }

        .godziny-head > div {
            padding: 2px 2px;
        }

        .godziny-head > div:first-child {
            padding-left: 2px;
            padding-right: 0;
        }

        .godziny-head > div:last-child {
            padding-left: 15px;
            padding-right: 2px;
        }

        .godzina-row {
            display: grid;
            grid-template-columns: 22px minmax(0, 1fr);
            width: 100%;

            min-height: 16px;
            height: 16px;
            align-items: stretch;

            border-bottom: 1px solid #d6d6d6;
            box-sizing: border-box;
        }

        .godzina-row:last-child {
            border-bottom: 0;
        }

        .godzina-cell {
            position: relative;
            left: 1px;
            padding: 0 4px 0 1px;

            border-right: 1px solid #111;

            font-size: 16px;
            line-height: 16px;
            font-weight: 800;
            text-align: right;

            height: 16px;
            box-sizing: border-box;
        }

        .minuty-cell {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 24px;
            align-items: center;
            justify-content: start;
            column-gap: 0;

            min-width: 0;
            height: 16px;

            padding: 0 1px 0 3.5px;

            font-size: 15px;
            line-height: 16px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            box-sizing: border-box;
        }

        .minuta {
            display: inline-flex;
            align-items: baseline;
            justify-content: flex-start;

            width: 24px;
            min-width: 24px;
            height: 16px;
            line-height: 16px;

            white-space: nowrap;
            
        }

        /*
           Litera wariantu ma taki sam rozmiar i tę samą linię bazową
           co minuta. Każda minuta zajmuje jednak identyczne 26 px,
           więc symbole nie rozsuwają następnych minut.
        */
        .symbol {
            position: static;

            margin-left: 0;

            font-size: 13px;
            line-height: inherit;
            font-weight: 400;
            vertical-align: baseline;
        }

        .brak {
            padding: 16px 8px;

            color: #777;

            font-size: 11px;
            text-align: center;
        }


        /*
           Tabela dla typu dnia, w którym linia nie kursuje.
           Zachowujemy dokładnie taką samą wysokość jak pozostałe
           rozkłady, ale nie pokazujemy godzin ani minut.
        */
        .nie-kursuje-body {
            position: relative;
        }

        .godzina-row-nie-kursuje {
            border-bottom: 0;
        }

        .nie-kursuje-napis {
            position: absolute;

            left: 22px;
            right: 0;
            top: 0;
            bottom: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 4px;
            text-align: center;

            pointer-events: none;
            box-sizing: border-box;
            font-family: Calibri, "Segoe UI", Arial, sans-serif;
            font-size: 13.5px;
            line-height: 1;
            font-weight: 400;
            letter-spacing: 0.75px;
            transform: scaleY(1.30);
            transform-origin: center;

        }


        /* =========================================================
           LEGENDA
           ========================================================= */

        .legenda {
            max-width: 620px;

            margin: 11px 12px 12px 17px;

            font-size: 14px;
            line-height: 1.25;
        }

        .legenda-wiersz {
            margin-top: -3px;

            display: grid;
            grid-template-columns: 22px auto minmax(0, 1fr);
            
            align-items: baseline;

            font-weight: 700;
        }

        .legenda-litera {
            display: block;

            width: 22px;
            min-width: 22px;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .legenda-myslnik {
            display: block;
            margin-left: -2px;
            margin-right: 5px;
            padding: 0;
            text-align: center;
        }

        .legenda-opis {
            display: block;
            min-width: 0;
        }


        /* =========================================================
           PIONOWY NAPIS PRZYSTANKU
           ========================================================= */

        .etykieta-przystanku {
            position: absolute;

            left: 1px;
            bottom: 13px;

            writing-mode: vertical-rl;
            transform: rotate(180deg);

            font-size: 13px;
            line-height: 1;
        }


        /* =========================================================
           TRASA - PRAWA CZĘŚĆ
           ========================================================= */

        .trasa-head {
            min-height: 24px;

            display: grid;
            grid-template-columns: 1fr;
            align-items: center;

            margin-left: 3px;
            width: calc(100% - 3px);
            padding: 2px 0;

            border-bottom: 1px solid #777;

            font-size: 13px;
            font-weight: 400;

            box-sizing: border-box;
        }

        .trasa-head.cols-2 {
            grid-template-columns: 1fr 1fr;
        }

        .trasa-head-label {
            min-width: 0;
            padding: 0 6px 0 3px;
            transform: translateY(3px);
            box-sizing: border-box;
            font-weight: 400;
        }

        .trasa-head.cols-2 .trasa-head-label:first-child {
            border-right: 0;
        }

        .trasa-columns {
            display: grid;

            height: calc(100% - 24px);
            min-height: 0;
            overflow: hidden;
        }

        .trasa-columns.cols-1 {
            grid-template-columns: 1fr;
        }

        .trasa-columns.cols-2 {
            grid-template-columns: 1fr 1fr;
        }

        .trasa-kol {
            min-width: 0;
            overflow: visible;

            /* 5 px bliżej pionowej linii oddzielającej rozkład od trasy */
            padding: 4px 2px 8px 2px;

            border-right: 1px solid #777;
        }

        .trasa-kol:last-child {
            border-right: 0;
        }

        .trasa-lista {
            margin: 0;
            padding: 0;

            list-style: none;
        }

        .trasa-stop {
            display: grid;
            grid-template-columns: 19px 12px minmax(0, 1fr) 12px;
            align-items: center;

            min-height: 16.5px;

            color: #111;

            font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
            font-size: 13.5px;
            line-height: 1;
        }

        .trasa-stop.przed {
            color: #777;
        }

        .trasa-czas {
            align-self: start;

            padding-top: 0;
            padding-right: 1px;

            text-align: right;
            white-space: nowrap;
            line-height: 15px;
        
            font-size: 13px;
        }

        .trasa-os {
            position: relative;

            align-self: stretch;
        }

        .trasa-os::before {
            content: "";

            position: absolute;

            left: 4.1px;
            top: 0;
            bottom: 0;

            width: 2.25px;

            background: currentColor;
        }

        .trasa-os::after {
            content: "";

            position: absolute;

            left: 1px;
            top: 3px;

            width: 8.5px;
            height: 8.5px;

            transform: none;

            background: currentColor;

            border-radius: 50%;
        }

        .trasa-stop.kraniec-poczatek .trasa-os::before {
            top: 8px;
        }

        .trasa-stop.kraniec-koniec .trasa-os::before {
            bottom: calc(100% - 8px);
        }

        /* Jeżeli pod trasą podstawową jest dalszy wariant/wydłużenie,
           z kropki ostatniego przystanku podstawowego wychodzi
           krótka kreska w dół. */
        .trasa-kol:has(.trasa-extra)
        .trasa-stop.kraniec-koniec
        .trasa-os::before {
            bottom: 0;
        }

        .trasa-nazwa {
            min-width: 0;

            overflow: visible;

            white-space: nowrap;
            overflow-wrap: normal;
            word-break: normal;
            hyphens: none;

            font-weight: 400;
            line-height: 1;
        }

        .trasa-stop.kraniec-poczatek .trasa-nazwa,
        .trasa-stop.kraniec-koniec .trasa-nazwa {
            font-weight: 700;
        }

        .trasa-nazwa.zawijaj {
            white-space: normal;
        }

        /* Nazwa w dwóch liniach ma własne miejsce w układzie,
           dzięki czemu kolejny przystanek nie nachodzi na drugą linię. */
        .trasa-stop:has(.trasa-nazwa.zawijaj) {
            min-height: 33px;
        }

        .trasa-nazwa.zawijaj .trasa-nazwa-aktywna {
    white-space: normal;
}

        .trasa-stop.wybrany {
            color: #111;
        }

        .trasa-stop.nz .trasa-os::after {
            background: #fff;
            border: 2px solid currentColor;
            box-sizing: border-box;
        }

        .trasa-nz {
            justify-self: end;
            align-self: start;

            position: relative;
            right: -1px;

            padding-right: 0;

            text-align: right;

            font-size: 15.5px;
            line-height: 1;
            font-weight: 400;
        }


        /* =========================================================
           BŁĄD
           ========================================================= */

        .blad {
            padding: 20px;

            background: #fff;

            border: 1px solid #ddd;
            border-radius: 7px;

            color: #666;
        }


        /* =========================================================
           RESPONSYWNOŚĆ
           ========================================================= */

        @media (max-width: 850px) {

            .sterowanie-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 560px) {

            .tabliczka-page {
                margin: 15px auto;
                padding: 0 8px;
            }

            .sterowanie-grid {
                grid-template-columns: 1fr;
            }
        }



        /* =========================================================
           TRASY WYDŁUŻONE / WARIANTOWE
           ========================================================= */

        .trasa-extra {
            margin-top: 14px;
        }


        /*
           Nagłówki pojawiające się wewnątrz głównej listy trasy,
           gdy autobus wjeżdża na odcinek wariantowy i później
           wraca na wspólną trasę.
        */
        .trasa-separator {
            display: block;
            list-style: none;
            margin: 14px 0 9px 0;
            padding: 0;
            min-height: 16px;
        }

        .trasa-separator-title {
            display: block;
            width: 100%;
            margin: 0;
            padding: 0 4px;
            box-sizing: border-box;

            font-family: Calibri, "Segoe UI", Arial, sans-serif;
            font-size: 16px;
            line-height: 16px;
            font-weight: 400;
            color: #111;

            /*
               Jeżeli lista liter nie mieści się w szerokości kolumny,
               tekst przechodzi do następnego wiersza.
            */
            white-space: normal;
            overflow-wrap: normal;
            word-break: normal;
            text-align: center;

            transform: scaleY(1.08);
            transform-origin: center;
        }

        .trasa-extra-title {
            margin: auto auto 9px auto;
            font-size: 16px;
            line-height: 16px;
            font-weight: 400;
            color: #111;
            white-space: nowrap;
            text-align: center;
            transform-origin: center;
        }

        .trasa-extra-lista {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .trasa-extra-stop {
            display: grid;
            grid-template-columns: 19px 12px minmax(0,1fr) 12px;
            align-items: center;
            min-height: 16.5px;
            color: #111;
            font-family: Calibri, "Segoe UI", Arial, sans-serif;
            font-size: 13.5px;
            line-height: 1;
            transform: none;
        }

        .trasa-extra-stop .trasa-czas {
            text-align: right;
        }

        .trasa-extra-stop .trasa-os {
            position: relative;
            align-self: stretch;
            min-height: 16.5px;
        }

        .trasa-extra-stop .trasa-os::before {
            content: "";
            position: absolute;
            left: 4.1px;
            top: 0;
            bottom: 0;
            width: 2.25px;
            background: #111;
        }

        /* Ostatni przystanek wydłużenia:
           linia dochodzi tylko od góry do kropki. */
        .trasa-extra-stop:last-child .trasa-os::before {
            bottom: calc(100% - 8px);
        }

        .trasa-extra-stop .trasa-os::after {
            content: "";
            position: absolute;
            left: 1px;
            top: 4px;
            width: 8.5px;
            height: 8.5px;
            border-radius: 50%;
            background: #111;
        }

        .trasa-extra-stop .trasa-nazwa {
            min-width: 0;
            overflow: visible;
            white-space: nowrap;
            overflow-wrap: normal;
            word-break: normal;
            hyphens: none;
            font-weight: 400;
            line-height: 1;
            transform: scaleY(1.30);
            transform-origin: left center;
            letter-spacing: 0.75px;
        }

        /* Tylko kraniec trasy wydłużonej jest pogrubiony. */
        .trasa-extra-stop:last-child .trasa-nazwa {
            font-weight: 700;
        }

        .trasa-extra-stop .trasa-nz {
            transform: scaleY(1.30);
            transform-origin: right center;
        }

        .trasa-extra-stop .trasa-nazwa.zawijaj {
            white-space: normal;
        }

        .trasa-extra-stop:has(.trasa-nazwa.zawijaj) {
            min-height: 33px;
        }

        /*
         * Wydłużenie ma teraz ten sam stan aktywny/minięty
         * co zwykła lista przystanków.
         */
        .trasa-extra-stop.przed,
        .trasa-extra-stop.przed .trasa-nazwa,
        .trasa-extra-stop.przed .trasa-czas,
        .trasa-extra-stop.przed .trasa-nz {
            color:#777;
        }

        .trasa-extra-stop.przed .trasa-os::before,
        .trasa-extra-stop.przed .trasa-os::after {
            background:#777;
        }

        .trasa-extra-stop.wybrany {
            color:#111;
        }

        .trasa-extra-stop.wybrany .trasa-nazwa {
            transform:scaleY(1.30);
            transform-origin:left center;
        }

        /* =========================================================
           DRUK
           ========================================================= */

        @media print {

            body {
                background: #fff !important;
            }

            .topbar,
            .sterowanie,
            footer {
                display: none !important;
            }

            .tabliczka-page {
                max-width: none;
                margin: 0;
                padding: 0;
            }

            .tabliczka-scroll {
                overflow: visible;
            }

            .tabliczka {
                width: 210mm;
                height: 160mm;
                min-height: 160mm;
                margin: 0 auto;
            }
        }
    
/* =========================================================
   DOPASOWANIE PROPORCJI CZCIONKI DO WZORU PDF
   Delikatne rozciągnięcie pionowe tekstu o 8%.
   Numer linii pozostaje bez skalowania.
   ========================================================= */

.typ-linii,
.kierunek,
.wazny,
.dzien-tytul,
.godziny-head,
.legenda,
.trasa-head-label,
.stop-time,
.stop-zadanie,
.trasa-extra-title,
.trasa-extra-stop {
    transform: scaleY(1.08);
    transform-origin: center;
}

/* Lista przystanków – mocniejsze pionowe rozciągnięcie,
   żeby efekt był widoczny również przy nazwach przystanków. */
.stop-name,
.trasa-nazwa {
    transform: scaleY(1.30);
    transform-origin: left center;
    letter-spacing: 0.75px;
}

/* Aktywny przystanek ma takie samo pionowe rozciągnięcie
   jak pozostałe nazwy przystanków — również przy dwóch liniach. */
.trasa-stop.wybrany .trasa-nazwa {
    transform: scaleY(1.30);
    transform-origin: left center;
}

.trasa-nazwa-aktywna {
    position: relative;
    display: inline;

    padding: 0;
    margin: 0;

    /* KLUCZOWE:
       aktywny ma dokładnie taki sam line-height jak zwykła nazwa. */
    line-height: 1;

    color: #fff;
    font-weight: inherit;
    letter-spacing: inherit;

    vertical-align: baseline;

    /* Tło jest tylko dekoracją tekstu i nie zmienia wysokości linii. */
    background:
        linear-gradient(
            to bottom,
            transparent 0,

function rozdzielNazweIMiejscowosc(nazwa){

    const tekst = String(nazwa || "").trim();

    const dopasowanie = tekst.match(/^(.*?)\s*\(([^()]*)\)\s*$/);

    if(!dopasowanie){
        return {
            nazwa: tekst,
            miejscowosc: ""
        };
    }

    const nazwaBezNawiasu = String(dopasowanie[1] || "").trim();
    const tekstWNawiasie = String(dopasowanie[2] || "").trim();

    const jestMiejscowoscia = MIEJSCOWOSCI.some(
        miejscowosc =>
            normalizuj(miejscowosc) === normalizuj(tekstWNawiasie)
    );

    if(!jestMiejscowoscia){
        return {
            nazwa: tekst,
            miejscowosc: ""
        };
    }

    return {
        nazwa: nazwaBezNawiasu,
        miejscowosc: tekstWNawiasie
    };
}

    ].join("|");
}


const cacheObliczenWToku=
    new Set();

function memoTabliczki(
    nazwa,
    klucz,
    producent
){

    const pelnyKlucz=
        kluczStanuCache()+
        "||"+
        nazwa+
        "||"+
        String(
            klucz||""
        );

    if(
        cacheObliczenTabliczki.has(
            pelnyKlucz
        )
    ){
        return cacheObliczenTabliczki.get(
            pelnyKlucz
        );
    }

    /*
       Zabezpieczenie przed przypadkową rekurencją cykliczną.
       Nie pozwalamy drugi raz rozpocząć obliczania dokładnie
       tego samego wyniku, zanim pierwsze obliczenie się skończy.
    */
    if(
        cacheObliczenWToku.has(
            pelnyKlucz
        )
    ){
        console.error(
            "[FWTP] Wykryto cykliczne obliczenie:",
            nazwa,
            klucz
        );

        return null;
    }

    cacheObliczenWToku.add(
        pelnyKlucz
    );

    try{

        const wynik=
            producent();

        cacheObliczenTabliczki.set(
            pelnyKlucz,
            wynik
        );

        return wynik;

    }finally{

        cacheObliczenWToku.delete(
            pelnyKlucz
        );
    }
}


function wyczyscCacheTabliczki(){

    cacheObliczenTabliczki.clear();
    cacheObliczenWToku.clear();

    if(
        typeof cacheNormalizacjiTekstu!=="undefined"&&
        cacheNormalizacjiTekstu.size>3000
    ){
        cacheNormalizacjiTekstu.clear();
    }
}

function ustawLoaderTabliczki(

){

                Math.round(
                    Number(procent)||0
                )
            )
        );

    const pasek=
        document.getElementById(
            "tabliczkaLoaderProgress"
        );

        document.getElementById(
            "tabliczkaLoaderBus"
        );

    const liczba=
        document.getElementById(

        );

    const opis=
        document.getElementById(

        );

    if(pasek){

        pasek.style.width=
            p+"%";

        pasek.classList.toggle(
            "gotowe",
            p>=100
        );
    }

    if(autobus){

        autobus.style.left=
            p+"%";

        autobus.classList.toggle(
            "gotowe",
            p>=100
        );
    }

    if(liczba){

    }

    if(
        opis&&
        etap
    ){

function czekajNaRenderTabliczki(){

    return new Promise(
        resolve=>{

            requestAnimationFrame(
                ()=>{
                    requestAnimationFrame(
                        resolve
                    );
                }
            );
        }
    );
}


async function czekajNaPelneRenderowanieTabliczki(){

    /*
       Najpierw czekamy na fonty.
       Dzięki temu szerokości napisów i kolumn są już ostateczne.
    */
    try{

        if(
            document.fonts&&
            document.fonts.ready
        ){
            await document.fonts.ready;
        }
    }
    catch{}

    /*
       renderuj() wykonuje własne requestAnimationFrame:
       1. wyrównanie tabel SOBOTA / ŚWIĘTO,
       2. dopasowanie kolumn trasy.

       Czekamy więc jeszcze kilka pełnych klatek,
       aby loader zniknął dopiero po rzeczywistym
       zakończeniu układania tabliczki.
    */
    await czekajNaRenderTabliczki();
    await czekajNaRenderTabliczki();
    await czekajNaRenderTabliczki();
}


async function zakonczLoaderTabliczki(){

    await new Promise(

    document.body.classList.remove(

async function przerysujTabliczkeZLoaderem(
    etapPoczatkowy,
    przygotuj=null
){

    /*
       Ten sam loader działa teraz także przy:
       - zmianie kierunku,
       - zmianie przystanku.

       Tabliczka pozostaje niewidoczna od początku zmiany
       aż do zakończenia pełnego renderowania.
    */
    pokazLoaderTabliczki();

    ustawLoaderTabliczki(
        10,
        etapPoczatkowy||
        "Przygotowywanie tabliczki..."
    );

    await czekajNaRenderTabliczki();

    try{

        if(
            typeof przygotuj===
            "function"
        ){
            przygotuj();
        }

        ustawLoaderTabliczki(
            42,
            "Przygotowywanie rozkładu..."
        );

        await czekajNaRenderTabliczki();

        ustawLoaderTabliczki(
            68,
            "Budowanie rozkładu i trasy..."
        );

        renderuj();

        await czekajNaRenderTabliczki();

        ustawLoaderTabliczki(
            90,
            "Dopasowywanie układu tabliczki..."
        );

        /*
           Czekamy dokładnie tak samo jak przy zmianie linii:
           - na fonty,
           - na wyrównanie tabel dni,
           - na obliczenie szerokości "NIE KURSUJE",
           - na podział listy przystanków na kolumny,
           - na końcowy układ całej tabliczki.
        */
        await czekajNaPelneRenderowanieTabliczki();

        await zakonczLoaderTabliczki();
    }
    catch(error){

        console.error(error);

        ukryjLoaderTabliczki();

        pokazBlad(
            error?.message||
            "Nie udało się przygotować tabliczki."
        );
    }
}

/* =========================================================
   DATA / URL
   ========================================================= */

function dataZTekstu(tekst){

    const m=
        /^(\d{4})-(\d{2})-(\d{2})$/
            .exec(
                String(
                    tekst||""
                )
            );

    if(!m)return null;

    const d=
        new Date(
            Number(m[1]),
            Number(m[2])-1,
            Number(m[3])
        );

    return Number.isNaN(
        d.getTime()
    )
        ? null
        : d;
}


function dataISO(data){

    return[
        data.getFullYear(),
        String(
            data.getMonth()+1
        ).padStart(2,"0"),
        String(
            data.getDate()
        ).padStart(2,"0")
    ].join("-");
}


function pobierzIndeksPrzystanku(){

    const tekst=
        String(
            parametry.get("przystanek")||""
        );

    if(
        tekst.startsWith("idx:")
    ){
        const n=
            Number(
                tekst.slice(4)
            );

        return Number.isInteger(n)
            ? n
            : 0;
    }

    const n=
        Number(tekst);

    return Number.isInteger(n)
        ? n
        : 0;
}


function zapiszURL(){

    const url=
        new URL(
            window.location.href
        );

    url.searchParams.set(
        "linia",
        aktualnaLinia
    );

    url.searchParams.set(
        "data",
        dataISO(
            wybranaData
        )
    );

    url.searchParams.set(
        "kierunek",
        String(
            aktualnyKierunek
        )
    );

    url.searchParams.set(
        "przystanek",
        "idx:"+
        aktualnyPrzystanek
    );

    history.replaceState(
        {},
        "",
        url
    );
}

async function pobierzManifestPaczek(){

    if(
        manifestPaczek!==null
    ){
        return manifestPaczek;
    }

    try{

        const r=
            await fetch(
                BASE_DANE+
                "paczki.json?ts="+
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!r.ok){
            manifestPaczek=[];
            return manifestPaczek;
        }

        const j=
            await r.json();

        manifestPaczek=
            Array.isArray(j)
                ? j
                : Array.isArray(j.paczki)
                    ? j.paczki
                    : [];
    }
    catch{
        manifestPaczek=[];
    }

    return manifestPaczek;
}


function paczkaObowiazuje(
    paczka,
    linia,
    data
){

    const linie=
        Array.isArray(
            paczka?.linie
        )
            ? paczka.linie.map(String)
            : [];

    if(
        !linie.includes(
            String(linia)
        )
    ){
        return false;
    }

    const iso=
        dataISO(data);

    const od=
        String(
            paczka.od||""
        );

    const doDaty=
        String(
            paczka.do||""
        );

    return(
        (!od||iso>=od)&&
        (!doDaty||iso<=doDaty)
    );
}


async function pobierzLinie(
    linia,
    data
){

    const paczki=
        await pobierzManifestPaczek();

    const pasujace=
        paczki
            .filter(
                p=>
                    paczkaObowiazuje(
                        p,
                        linia,
                        data
                    )
            )
            .sort(
                (a,b)=>
                    Number(
                        b.priorytet||0
                    )-
                    Number(
                        a.priorytet||0
                    )
            );

    const zrodla=[];

    pasujace.forEach(
        p=>{

            const folder=
                String(
                    p.folder||""
                )
                    .replace(/^\/+/,"")
                    .replace(/\/+$/,"");

            if(folder){
                zrodla.push({
                    url:
                        BASE_DANE+
                        folder+
                        "/"+
                        encodeURIComponent(linia)+
                        ".json",
                    od:
                        String(
                            p.od||""
                        )
                });
            }
        }
    );

    zrodla.push({
        url:
            BASE_DANE+
            encodeURIComponent(linia)+
            ".json",
        od:""
    });

    for(const zrodlo of zrodla){

        try{

            const r=
                await fetch(
                    zrodlo.url+
                    "?ts="+
                    Date.now(),
                    {
                        cache:"no-store"
                    }
                );

            if(!r.ok)continue;

            const json=
                await r.json();

            waznyOdDanych=
                String(
                    json?.od||
                    json?.waznyOd||
                    json?.dataOd||
                    json?.obowiazujeOd||
                    zrodlo.od||
                    ""
                );

            return json;
        }
        catch{
            /* następny */
        }
    }

    throw new Error(
        "Nie znaleziono danych linii "+
        linia+
        "."
    );
}

   WCZYTANIE
   ========================================================= */

async function wczytajLinie(){

    pokazLoaderTabliczki();

    ustawLoaderTabliczki(
        5,
        "Pobieranie danych linii "+
        aktualnaLinia+
        "..."
    );

    ustawStatus(
        "Ładowanie linii "+
        aktualnaLinia+
        "..."
    );

    document
        .getElementById("wynik")
        .innerHTML="";

    await czekajNaRenderTabliczki();

    try{

        /*
           5–45%:
           pobranie manifestu / właściwego JSON-u linii.
        */
        daneLinii=
            await pobierzLinie(
                aktualnaLinia,
                wybranaData
            );

        ustawLoaderTabliczki(
            45,
            "Dane linii pobrane"
        );

        await czekajNaRenderTabliczki();

        /*
           45–62%:
           analiza kierunków i danych przystanków.
        */
        const kierunki=
            pobierzKierunki();

        if(!kierunki.length){
            throw new Error(
                "Brak kierunków w pliku JSON."
            );
        }

        if(
            aktualnyKierunek<0||
            aktualnyKierunek>=
                kierunki.length
        ){
            aktualnyKierunek=0;
        }

        ustawLoaderTabliczki(
            62,
            "Analizowanie kierunków i przystanków..."
        );

        wypelnijKierunki();
        wypelnijPrzystanki();

        await czekajNaRenderTabliczki();

        /*
           62–78%:
           przygotowanie rozkładów i trasy.
        */
        ustawLoaderTabliczki(
            78,
            "Budowanie rozkładów i trasy..."
        );

        zapiszURL();

        await czekajNaRenderTabliczki();

        /*
           78–92%:
           właściwe renderowanie tabliczki.
           Loader jest w osobnym kontenerze, więc pozostaje
           widoczny podczas budowania gotowej tabliczki.
        */
        renderuj();

        ustawLoaderTabliczki(
            92,
            "Dopasowywanie układu tabliczki..."
        );

        /*
           Czekamy aż zakończą się:
           - render DOM,
           - fonty,
           - wyrównanie SOBOTA / ŚWIĘTO,
           - dopasowanie 1/2 kolumn listy przystanków.
        */
        await czekajNaPelneRenderowanieTabliczki();

        ustawStatus(
            "Linia "+
            String(
                daneLinii.linia||
                aktualnaLinia
            )+
            " • "+
            dataISO(
                wybranaData
            )
        );

        /*
           100% następuje dopiero wtedy, gdy gotowa tabliczka
           jest już naprawdę ułożona na stronie.
        */
        await zakonczLoaderTabliczki();
    }
    catch(error){

        console.error(error);

        ukryjLoaderTabliczki();

        pokazBlad(
            error.message||
            "Nie udało się wczytać danych."
        );
    }
}


/* =========================================================
   KIERUNKI
   ========================================================= */

function znajdzNajpelniejszyKierunek(index){

    let najlepszy=null;
    let ile=-1;

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const k=
                Array.isArray(
                    rozklad.kierunki
                )
                    ? rozklad.kierunki[index]
                    : null;

            if(
                !k||
                !Array.isArray(
                    k.przystanki
                )
            ){
                return;
            }

            if(
                k.przystanki.length>
                ile
            ){
                najlepszy=k;
                ile=k.przystanki.length;
            }
        }
    );

    return najlepszy;
}


function pobierzKierunki(){

    let max=0;

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        r=>{
            if(
                Array.isArray(
                    r.kierunki
                )
            ){
                max=
                    Math.max(
                        max,
                        r.kierunki.length
                    );
            }
        }
    );

    const wynik=[];
    const widzianeTrasy=[];

    const normalizujNazwe=
        nazwa=>
            String(
                nazwa||
                ""
            )
            .toUpperCase()
            .replace(/\u00A0/g," ")
            .replace(/\s+/g," ")
            .replace(/[.,;:]+$/g,"")
            .trim();

    const nazwyTrasy=
        k=>
            (
                k?.przystanki||
                []
            )
            .map(
                p=>
                    normalizujNazwe(
                        p?.nazwa
                    )
            );

    const takieSameNazwy=
        (a,b)=>{

            if(
                a.length!==b.length
            ){
                return false;
            }

            for(
                let j=0;
                j<a.length;
                j++
            ){
                if(
                    a[j]!==b[j]
                ){
                    return false;
                }
            }

            return true;
        };

    for(
        let i=0;
        i<max;
        i++
    ){

        const k=
            znajdzNajpelniejszyKierunek(
                i
            );

        if(!k){
            continue;
        }

        const nazwy=
            nazwyTrasy(k);

        /*
           Numery stanowisk/przystanków są całkowicie ignorowane.
           Jeżeli kolejność i nazwy przystanków są takie same,
           drugi kierunek/wariant nie jest dodawany.
        */
        const duplikat=
            widzianeTrasy.some(
                poprzednia=>
                    takieSameNazwy(
                        poprzednia,
                        nazwy
                    )
            );

        if(duplikat){
            continue;
        }

        widzianeTrasy.push(
            nazwy
        );

        wynik.push({
            index:i,
            dane:k
        });
    }

    return wynik;
}


function nazwaKierunku(k){

    const gotowa=
        String(
            k?.nazwa||
            k?.kierunek||
            ""
        ).trim();

    if(gotowa){
        return gotowa;
    }

    const p=
        k?.przystanki||
        [];

    return p.length
        ? String(
            p[p.length-1].nazwa||
            ""
        )
        : "";
}


function wypelnijKierunki(){

    const select=
        document.getElementById(
            "kierunekSelect"
        );

    const lista=
        pobierzKierunki();

    select.innerHTML="";

    lista.forEach(
        el=>{

            const option=
                document.createElement(
                    "option"
                );

            option.value=
                String(el.index);

            option.textContent=
                nazwaKierunku(
                    el.dane
                )||
                "Kierunek "+
                (el.index+1);

            select.appendChild(option);
        }
    );

    select.disabled=
        !lista.length;

    select.value=
        String(
            aktualnyKierunek
        );
}

   PRZYSTANKI
   ========================================================= */



function czyTenSamPrzystanekPoNazwieINumerze(
    a,
    b
){

    if(
        !a||
        !b
    ){
        return false;
    }

    const nazwaA=
        normalizuj(
            a.nazwa
        );

    const nazwaB=
        normalizuj(
            b.nazwa
        );

    const nrA=
        String(
            a.nr||""
        ).trim();

    const nrB=
        String(
            b.nr||""
        ).trim();

    return(
        nazwaA===
            nazwaB&&
        nrA===
            nrB
    );
}


function __bezCache_kierunkiObslugujaceBiezacyPrzystanek(){

    const baza=
        znajdzNajpelniejszyKierunek(
            aktualnyKierunek
        );

    const p=
        baza?.przystanki?.[
            aktualnyPrzystanek
        ];

    if(!p){
        return[];
    }

    const wynik=[];

    const listaKierunkow=
        pobierzKierunki();

    listaKierunkow.forEach(
        el=>{

            const k=
                znajdzNajpelniejszyKierunek(
                    el.index
                );

            if(!k){
                return;
            }

            /*
               KLUCZOWA ZMIANA:
               drugi kierunek uznajemy za obsługujący TEN SAM
               przystanek tylko wtedy, gdy zgadza się:
               - nazwa,
               - numer przystanku.

               Czyli:
               SADYBA 05 !== SADYBA 01.

               Dzięki temu:
               - na SADYBA 05 nie pojawią się kursy do WILANOWA,
               - na SADYBA 01 mogą się pojawić, jeśli rzeczywiście
                 ten słupek obsługuje drugi kierunek.
            */
            const index=
                (
                    k.przystanki||
                    []
                ).findIndex(
                    x=>
                        czyTenSamPrzystanekPoNazwieINumerze(
                            x,
                            p
                        )
                );

            if(index<0){
                return;
            }

            wynik.push({
                indexKierunku:el.index,
                kierunek:k,
                indexPrzystanku:index,
                przystanek:
                    k.przystanki[index],
                nazwa:
                    String(
                        nazwaKierunku(k)||
                        ""
                    ).toUpperCase()
            });
        }
    );

    wynik.sort(
        (a,b)=>
            Number(
                a.indexKierunku!==
                aktualnyKierunek
            )-
            Number(
                b.indexKierunku!==
                aktualnyKierunek
            )
    );

    return wynik;
}

function kierunkiObslugujaceBiezacyPrzystanek(){

    return memoTabliczki(

    );
}

function __bezCache_czyBiezacyPrzystanekKraniecWiekszosciKursow(){

    const kierunek=
        znajdzNajpelniejszyKierunek(
            aktualnyKierunek
        );

    const przystanki=
        kierunek?.przystanki||
        [];

    const aktywny=
        przystanki[
            aktualnyPrzystanek
        ];

    if(!aktywny){
        return false;
    }

    const kursyNaAktywnym=
        new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    aktualnyKierunek,
                    aktywny
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        czasNaMinuty(
                            kurs?.czas
                        )===null
                    ){
                        return;
                    }

                    const key=
                        [
                            String(
                                kurs?.numer||""
                            ),
                            String(
                                kurs?.wariant||""
                            ),
                            symbolDnia(kurs)
                        ].join("|");

                    if(!kursyNaAktywnym.has(key)){
                        kursyNaAktywnym.set(
                            key,
                            {
                                numer:String(
                                    kurs?.numer||""
                                ),
                                wariant:String(
                                    kurs?.wariant||""
                                ),
                                symbol:
                                    symbolDnia(kurs)
                            }
                        );
                    }
                }
            );
        }
    );

    if(!kursyNaAktywnym.size){
        return false;
    }

    let koncowe=0;
    let przelotowe=0;

    for(
        const ref
        of kursyNaAktywnym.values()
    ){

        const indeksy=[];

        przystanki.forEach(
            (p,index)=>{

                let maCzas=false;

                (
                    daneLinii?.rozkłady||
                    []
                ).some(
                    rozklad=>{

                        const pp=
                            znajdzPrzystanekWRozkladzie(
                                rozklad,
                                aktualnyKierunek,
                                p
                            );

                        const znaleziony=
                            (
                                pp?.kursy||
                                []
                            ).find(
                                k=>
                                    String(
                                        k?.numer||""
                                    )===
                                        ref.numer&&
                                    String(
                                        k?.wariant||""
                                    )===
                                        ref.wariant&&
                                    symbolDnia(k)===
                                        ref.symbol&&
                                    czasNaMinuty(
                                        k?.czas
                                    )!==null
                            );

                        if(znaleziony){
                            maCzas=true;
                        }

                        return maCzas;
                    }
                );

                if(maCzas){
                    indeksy.push(index);
                }
            }
        );

        if(!indeksy.length){
            continue;
        }

        const pierwszy=
            indeksy[0];

        const ostatni=
            indeksy[
                indeksy.length-1
            ];

        if(
            aktualnyPrzystanek===
                pierwszy||
            aktualnyPrzystanek===
                ostatni
        ){
            koncowe++;
        }
        else{
            przelotowe++;
        }
    }

    /*
       Jeżeli co najmniej połowa kursów obsługujących ten słupek
       zaczyna się albo kończy właśnie tutaj, traktujemy go jako
       rzeczywisty kraniec trasy podstawowej.

       To naprawia przypadki takie jak SADYBA 05:
       część kursów jedzie dalej jako wydłużone, ale dla większości
       kursów SADYBA jest początkiem/końcem podstawowej trasy.
    */
    return(
        koncowe>0&&
        koncowe>=przelotowe
    );
}

        "",
        ()=>__bezCache_czyBiezacyPrzystanekKraniecWiekszosciKursow()
    );
}



function __bezCache_czyBiezacyPrzystanekKraniecTrasyPodstawowej(){

    /*
       Pełna lista może zawierać także dalszą część kursów
       wydłużonych. Dlatego nie wystarczy sprawdzać, czy wybrany
       przystanek jest pierwszym/ostatnim elementem najdłuższej trasy.

       Przykład linii 131:
       podstawowa trasa w kierunku DW. CENTRALNY zaczyna się na
       SADYBA 05, ale część kursów ma jeszcze wariant wydłużony.
       SADYBA nadal jest krańcem trasy podstawowej i na takim
       przystanku ma działać zwykły, jednokierunkowy rozkład.
    */
    const dane=
        daneTrasWydluzonych();

    const baza=
        Array.isArray(
            dane?.baza
        )
            ? dane.baza
            : [];

    if(!baza.length){
        return false;
    }

    const pierwszy=
        baza[0];

    const ostatni=
        baza[
            baza.length-1
        ];

    return(
        pierwszy?.index===
            aktualnyPrzystanek||
        ostatni?.index===
            aktualnyPrzystanek||
        czyBiezacyPrzystanekKraniecWiekszosciKursow()
    );
}

function __bezCache_czyBiezacyPrzystanekDwukierunkowy(){

    const baza=
        znajdzNajpelniejszyKierunek(

    const przystanki=
        baza?.przystanki||
        [];

    /*
       Tryb dwóch kierunków jest WYŁĄCZONY:
       1. na pierwszym przystanku pełnego kierunku,
       2. na ostatnim przystanku pełnego kierunku,
       3. na początku/końcu TRASY PODSTAWOWEJ,
          nawet jeśli istnieją kursy wydłużone.

       Dzięki temu np. SADYBA 05 na linii 131 pozostaje normalnym
       krańcem w kierunku DW. CENTRALNY.
    */
    if(
        !przystanki.length||
        aktualnyPrzystanek<=0||
        aktualnyPrzystanek>=
            przystanki.length-1||
        czyBiezacyPrzystanekKraniecTrasyPodstawowej()
    ){

    }

    return Boolean(
        drugiKierunekBiezacegoPrzystanku()
    );
}

    const wszystkie=

    /*
       Na przystanku początkowym i końcowym nie mieszamy

       na CH TARGÓWEK w kierunku CH TARGÓWEK pokazujemy

/* =========================================================
   CZAS
   ========================================================= */


const cacheCzasNaMinuty=
    new Map();

function czasNaMinuty(czas){

    const tekst=
        String(
            czas||""
        ).trim();

    if(
        cacheCzasNaMinuty.has(
            tekst
        )
    ){
        return cacheCzasNaMinuty.get(
            tekst
        );
    }

    const m=
        /^(\d{1,2}):(\d{2})$/
            .exec(
                tekst
            );

    if(!m){
        cacheCzasNaMinuty.set(
            tekst,
            null
        );

        return null;
    }

    const h=Number(m[1]);
    const min=Number(m[2]);

    if(
        h<0||
        h>47||
        min<0||
        min>59
    ){
        cacheCzasNaMinuty.set(
            tekst,
            null
        );

        return null;
    }

    const wynik=
        h*60+min;

    cacheCzasNaMinuty.set(
        tekst,
        wynik
    );

    return wynik;
}


function rozbijCzas(czas){

    const m=
        /^(\d{1,2}):(\d{2})$/
            .exec(
                String(
                    czas||""
                ).trim()
            );

    if(!m)return null;

    return{
        godzina:Number(m[1]),
        minuta:m[2]
    };
}


/* =========================================================
   KURSY / DNI
   ========================================================= */

function symbolDnia(kurs){

    return String(
        kurs?.uwagi||
        ""
    )
        .trim()
        .toUpperCase();
}


function kluczKursu(kurs){

    return[
        String(
            kurs?.numer||""
        ),
        String(
            kurs?.wariant||""
        )
    ].join("||");
}



function numerWystapieniaPrzystankuWBazie(element){

    if(
        !element||
        !Object.prototype.hasOwnProperty.call(
            element,
            "index"
        )
    ){
        return 0;
    }

    const baza=
        kierunekBazowy()
            ?.przystanki||
        [];

    const index=
        Number(
            element.index
        );

    if(
        !Number.isInteger(index)||
        index<0||
        index>=baza.length
    ){
        return 0;
    }

    const cel=
        baza[index];

    const nazwa=
        normalizuj(
            cel?.nazwa
        );

    const nr=
        String(
            cel?.nr||""
        ).trim();

    let wystapienie=0;

    for(
        let i=0;
        i<index;
        i++
    ){

        const p=
            baza[i];

        if(
            normalizuj(
                p?.nazwa
            )===
                nazwa&&
            String(
                p?.nr||""
            ).trim()===
                nr
        ){
            wystapienie++;
        }
    }

    return wystapienie;
}


function znajdzPrzystanekWRozkladzieDlaElementu(
    rozklad,
    kierunekIndex,
    element
){

    const k=
        Array.isArray(
            rozklad?.kierunki
        )
            ? rozklad.kierunki[
                kierunekIndex
            ]
            : null;

    if(
        !k||
        !Array.isArray(
            k.przystanki
        )||
        !element
    ){
        return null;
    }

    const bazaP=
        element?.p||
        element;

    const nazwa=
        normalizuj(
            bazaP?.nazwa
        );

    const nr=
        String(
            bazaP?.nr||""
        ).trim();

    const pasujace=
        k.przystanki.filter(
            p=>
                normalizuj(
                    p?.nazwa
                )===
                    nazwa&&
                String(
                    p?.nr||""
                ).trim()===
                    nr
        );

    if(!pasujace.length){
        return null;
    }

    /*
       KLUCZOWA POPRAWKA DLA WARIANTÓW:

       Pełna lista kierunku może zawierać ten sam przystanek kilka razy,
       bo została zbudowana ze wszystkich przebiegów razem.

       Natomiast w KONKRETNYM obiekcie rozkładu / przebiegu może istnieć
       tylko jedno wystąpienie tej nazwy i numeru.

       Przykład linii 170:
       pełna oś ma dwa PKP ZACISZE-WILNO 02, ale konkretny przebieg
       w kierunku RONDO STARZYŃSKIEGO ma tylko jeden taki przystanek.

       Wtedy nie wolno żądać "drugiego wystąpienia" w tym rozkładzie,
       bo ono nie istnieje. Jedyny pasujący przystanek jest
       jednoznacznie właściwy dla tego przebiegu.
    */
    if(pasujace.length===1){
        return pasujace[0];
    }

    /*
       Jeżeli w konkretnym rozkładzie naprawdę istnieją dwa lub więcej
       identycznych przystanków, wtedy dopiero rozróżniamy je numerem
       wystąpienia z pełnej osi. To zachowuje poprawne przypadki typu
       rzeczywistych podwójnych przystanków na jednej trasie.
    */
    const wystapienie=
        numerWystapieniaPrzystankuWBazie(
            element
        );

    return(
        pasujace[
            Math.min(
                wystapienie,
                pasujace.length-1
            )
        ]||
        null
    );
}


function znajdzPrzystanekWRozkladzie(
    rozklad,
    kierunekIndex,
    baza
){

    const k=
        Array.isArray(
            rozklad?.kierunki
        )
            ? rozklad.kierunki[
                kierunekIndex
            ]
            : null;

    if(
        !k||
        !Array.isArray(
            k.przystanki
        )
    ){
        return null;
    }

    const nazwa=
        normalizuj(
            baza?.nazwa
        );

    const nr=
        String(
            baza?.nr||""
        ).trim();

    return(
        k.przystanki.find(
            p=>
                normalizuj(p.nazwa)===
                    nazwa&&
                String(
                    p.nr||""
                ).trim()===
                    nr
        )||
        null
    );
}


function __bezCache_pobierzKursyDlaSymbolu(symbol){

    const obsluga=
        kierunkiAktywneDlaBiezacegoPrzystanku();

    if(!obsluga.length){
        return[];
    }

    const mapa=
        new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            obsluga.forEach(
                info=>{

                    const p=
                        znajdzDokladnyPrzystanekWRozkladzie(
                            rozklad,
                            info.indexKierunku,
                            info.przystanek
                        );

                    (
                        p?.kursy||
                        []
                    ).forEach(
                        kurs=>{

                            if(
                                symbolDnia(kurs)!==
                                symbol
                            ){
                                return;
                            }

                            if(
                                czasNaMinuty(
                                    kurs.czas
                                )===null
                            ){
                                return;
                            }

                            const key=
                                info.indexKierunku+
                                "|"+
                                kluczKursu(kurs);

                            if(!mapa.has(key)){

                                mapa.set(
                                    key,
                                    {
                                        ...kurs,
                                        _kierunekIndex:
                                            info.indexKierunku,
                                        _kierunekNazwa:
                                            info.nazwa,
                                        _przystanekIndex:
                                            info.indexPrzystanku
                                    }
                                );
                            }
                        }
                    );
                }
            );
        }
    );

    return Array.from(
        mapa.values()
    );
}

function pobierzKursyDlaSymbolu(symbol){

    return memoTabliczki(
        "pobierzKursyDlaSymbolu",
        String(symbol||""),
        ()=>__bezCache_pobierzKursyDlaSymbolu(symbol)
    );
}



function __bezCache_dostepneGrupyDni(){

    const symbole=
        new Set();

    const obsluga=
        kierunkiAktywneDlaBiezacegoPrzystanku();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            obsluga.forEach(
                info=>{

                    const p=
                        znajdzDokladnyPrzystanekWRozkladzie(
                            rozklad,
                            info.indexKierunku,
                            info.przystanek
                        );

                    (
                        p?.kursy||
                        []
                    ).forEach(
                        kurs=>{

                            const s=
                                symbolDnia(kurs);

                            if(s){
                                symbole.add(s);
                            }
                        }
                    );
                }
            );
        }
    );

    const wynik=[];

    const maD=
        symbole.has("D");

    const maC=
        symbole.has("C");

    const ma6=
        symbole.has("6");

    const ma7=
        symbole.has("7");

    const maWeekendRozdzielony=
        ma6||
        ma7;

    /*
       DZIEŃ POWSZEDNI pokazujemy również wtedy,
       gdy kursów D nie ma, ale są kursy weekendowe.
       Wtedy tabela wyświetli "NIE KURSUJE".
    */
    if(
        maD||
        maC||
        maWeekendRozdzielony
    ){
        wynik.push({
            symbol:"D",
            tytul:"DZIEŃ POWSZEDNI"
        });
    }

    /*
       Jeżeli dane używają osobnych symboli 6 i 7,
       zawsze pokazujemy obie kolumny.
       Brakująca dostanie "NIE KURSUJE".
    */
    if(maWeekendRozdzielony){

        wynik.push({
            symbol:"6",
            tytul:"SOBOTA"
        });

        wynik.push({
            symbol:"7",
            tytul:"ŚWIĘTO"
        });
    }
    else{

        /*
           Przy układzie D/C pokazujemy SOBOTA I ŚWIĘTO
           nawet wtedy, gdy istnieją wyłącznie kursy D.
        */
        if(
            maD||
            maC
        ){
            wynik.push({
                symbol:"C",
                tytul:"SOBOTA I ŚWIĘTO"
            });
        }
    }

    /*
       Nietypowe symbole pozostają obsługiwane jak wcześniej.
    */
    [
        ...symbole
    ]
        .filter(
            s=>
                !["D","C","6","7"]
                    .includes(s)
        )

function czyPokazacWariantJakLiniaHTML(litera){

    const znak=
        String(
            litera||""
        )
        .trim()
        .toUpperCase();

    if(!znak){
        return false;
    }

    const publiczne=
        publiczneLiteryWariantow();

    /*
       Litera nieobecna w publicznych definicjach JSON
       jest oznaczeniem wewnętrznym przebiegu.
       Nie pokazujemy jej przy minutach ani w legendzie.
    */
    if(
        publiczne.size&&
        !publiczne.has(znak)
    ){
        return false;
    }

    const literyKierunku=
        publiczneLiteryWariantowAktualnegoKierunku();

    const liczbaWariantowKierunku=
        literyKierunku.length;

    if(
        !literyKierunku.includes(
            znak
        )
    ){
        return false;
    }

    /*
       ZASADA Z linia.html:

       A = przebieg podstawowy.

       1-3 warianty w AKTUALNYM KIERUNKU:
           A bez literki.

       4 lub więcej wariantów w AKTUALNYM KIERUNKU:
           pokazujemy również A.

       B/C/D/... pozostają normalnie widoczne.
    */
    if(
        znak==="A"&&
        liczbaWariantowKierunku<4
    ){
        return false;
    }

    /*
       Jeżeli w kierunku rzeczywiście występuje kilka
       publicznych wariantów, wariant jest publiczny.
    */
    if(
        liczbaWariantowKierunku>1
    ){
        return true;
    }

    /*
       Fallback dla pojedynczego / starszego układu danych:
       zachowujemy dotychczasową logikę opisu.
       A nadal pozostaje ukryte.
    */
    if(znak==="A"){
        return false;
    }

    const mapa=
        mapaWariantow();

    const opis=
        mapa.get(znak)||
        mapa.get(
            String(
                litera||""
            ).trim()
        )||
        "";

    return czyOznaczacWariant(
        opis
    );
}


function normalizujOpisWariantu(opis){

    return String(
        opis||""
    )
    .trim()
    .replace(
        /\s+/g,
        " "
    )
    .toLocaleLowerCase(
        "pl"
    );
}


function kanonicznaLiteraWariantu(litera){

    const szukana=
        String(
            litera||""
        ).trim();

    if(!szukana){
        return"";
    }

    const mapa=
        mapaWariantow();

    const opis=
        mapa.get(
            szukana
        )||"";

    if(!opis){
        return szukana;
    }

    const klucz=
        normalizujOpisWariantu(
            opis
        );

    /*
       Jeżeli kilka wariantów ma identyczny opis,
       wybieramy tylko PIERWSZĄ literę występującą
       w mapie wariantów.

       Przykład:
       B = "kurs przez ..."
       C = "kurs przez ..."

       wtedy wszędzie używamy tylko B:
       - przy minutach,
       - w legendzie.
    */
    for(
        const [innaLitera,innyOpis]
        of mapa.entries()
    ){
        if(
            normalizujOpisWariantu(
                innyOpis
            )===klucz
        ){
            return String(
                innaLitera||""
            ).trim();
        }
    }

    return szukana;
}


function czyOznaczacWariant(opis){

    /*
       Litera wariantu ma być pokazywana przy minutach oraz w legendzie
       także wtedy, gdy kurs jedzie inną trasą przez dodatkowy przystanek
       lub ulicę, np.:
       "kurs przez KUPIECKĄ",
       "kursy przez ...",
       "podjazd przez ...".

       Wcześniej kod oznaczał tylko kursy skrócone, wydłużone,
       do zajezdni itd., dlatego warianty linii 126 nie pojawiały się
       na tabliczce.
    */
    return(
        /skrócon|wydłuż|tylko do|zajezdni|przez|podjazd/i
            .test(
                String(
                    opis||""
                )
            )
    );
}

function znajdzLitereSkroceniaPoKoncu(
    kurs,
    symbol
){

    const koniec=
        koncowyPrzystanekKursu(
            kurs,
            symbol
        );

    if(!koniec){
        return"";
    }

    const baza=
        kierunekBazowy();

    const koniecPelnej=
        String(
            baza?.przystanki?.[
                (baza?.przystanki?.length||1)-1
            ]?.nazwa||
            ""
        );

    if(
        normalizuj(koniec)===
        normalizuj(koniecPelnej)
    ){
        return"";
    }

    const mapa=
        mapaWariantow();

    for(
        const [litera,opis]
        of mapa.entries()
    ){

        const tekst=
            String(
                opis||
                ""
            );

        if(
            /skrócon|tylko do/i
                .test(tekst)&&
            normalizuj(tekst)
                .includes(
                    normalizuj(koniec)
                )
        ){
            return String(
                litera||
                ""
            )
                .trim()
                .toLowerCase();
        }
    }

    return"";
}

function __bezCache_literaWariantuPoRzeczywistymPrzebiegu(
    kursRef,
    kierunekIndex=(
        Number.isInteger(
            kursRef?._kierunekIndex
        )
            ? kursRef._kierunekIndex
            : aktualnyKierunek
    )
){

    if(!kursRef){
        return"";
    }

    const oryginalna=
        String(
            kursRef?.wariant||""
        ).trim();

    const opisOryginalny=
        String(
            mapaWariantow()
                .get(
                    oryginalna
                )||
            ""
        );

    /*
       Kursów skróconych / wydłużonych nie klasyfikujemy ponownie.
       Ich litera wynika z innej logiki niż podjazdy "przez ...".
    */
    if(
        /skrócon|wydłuż|zajezdni|tylko do/i
            .test(
                opisOryginalny
            )
    ){
        return oryginalna;
    }

    const przystankiKursu=
        nazwyPrzystankowKursu(
            kursRef,
            kierunekIndex
        );

    if(!przystankiKursu.size){
        return oryginalna;
    }

    const kandydaci=[];

    for(
        const [litera,opis]
        of mapaWariantow().entries()
    ){

        if(
            !czyWariantTrasyPrzez(
                litera
            )
        ){
            continue;
        }

        const wymagane=
            wymaganePrzystankiZWariantu(
                litera,
                kierunekIndex
            );

        if(!wymagane.length){
            continue;
        }

        const pasuje=
            wymagane.every(
                nazwa=>
                    przystankiKursu.has(
                        nazwa
                    )
            );

        if(!pasuje){
            continue;
        }

        kandydaci.push({
            litera:
                String(
                    litera||""
                ).trim(),
            wymagane:
                wymagane.length,
            oryginalny:
                String(
                    litera||""
                ).trim()===
                oryginalna
        });
    }

    if(!kandydaci.length){
        return oryginalna;
    }

    /*
       Wybieramy NAJBARDZIEJ SZCZEGÓŁOWY pasujący wariant.

       Dla 126:
       - o = POLFA                      -> 1 przystanek
       - p = PŁYTOWA + KUPIECKA        -> 2 przystanki
       - l = PŁYTOWA + KUPIECKA+POLFA  -> 3 przystanki

       Jeśli kurs 6:13 faktycznie jedzie przez KUPIECKĄ i POLFA,
       a także PŁYTOWĄ, wygra "l", a nie "o".
    */
    kandydaci.sort(
        (a,b)=>
            b.wymagane-
            a.wymagane||
            Number(b.oryginalny)-
            Number(a.oryginalny)
    );

    return kandydaci[0].litera;
}

    return memoTabliczki(

        tekst||""

    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .replace(
        /[^A-Za-z0-9]/g,
        ""
    )
    .toLowerCase();
}


function opisWariantuDoKierunku(
    litera,
    kierunekIndex
){

    const szukana=
        kanonicznaLiteraWariantu(
            String(
                litera||""
            ).trim()
        )
        .toLowerCase();

    let opis="";

    for(
        const [klucz,wartosc]
        of mapaWariantow().entries()
    ){
        const k=
            kanonicznaLiteraWariantu(
                String(
                    klucz||""
                ).trim()
            )
            .toLowerCase();

        if(k===szukana){
            opis=
                String(
                    wartosc||""
                ).trim();
            break;
        }
    }

    if(!opis){
        return"";
    }

    /*
       W legendzie chcemy:
       "kurs w kierunku ... przez PŁYTOWĄ, KUPIECKĄ I POLFA",
       a nie samo oznaczenie wariantu.
    */
    return opis
        .replace(
            /^kurs\s+/i,
            ""
        )
        .trim();
}

                ...kierunekLitery
            );

            kandydaci.push(
                ...alfabet
            );

            const znak=
                kandydaci.find(
                    x=>
                        x&&
                        !zajete.has(x)
                )||
                "x";

            zajete.add(znak);

            wynik.set(
                item.key,
                {
                    ...item,
                    znak
                }
            );
        }
    );

    return wynik;
}

function symbolKursuDwukierunkowego(
    kurs,
    symbol
){

    const dir=
        Number(
            kurs?._kierunekIndex
        );

    const litera=
        literaWariantuPoRzeczywistymPrzebiegu(
            {
                ...kurs,
                symbol,
                _kierunekIndex:dir
            },
            dir
        );

    const wariant=
        (
            litera&&
            czyPokazacWariantJakLiniaHTML(
                litera
            )
        )
            ? String(litera).toLowerCase()
            : "";

    const wpis=
        mapaSymboliDwukierunkowych()
            .get(
                dir+"|"+wariant
            );

    return wpis?.znak||"";
}


function symbolWariantu(kurs,symbol){

    if(
        czyBiezacyPrzystanekDwukierunkowy()
    ){
        return symbolKursuDwukierunkowego(
            kurs,
            symbol
        );
    }

    const kursRef={
        numer:String(
            kurs?.numer||""
        ),
        wariant:String(
            kurs?.wariant||""
        ).trim(),
        symbol
    };

    const literaRzeczywista=
        literaWariantuPoRzeczywistymPrzebiegu(
            kursRef
        );

    /*
       Litera przy minucie wynika teraz z rzeczywistej trasy,
       a nie wyłącznie z pola kurs.wariant.

       Dzięki temu np. kurs oznaczony w danych jako "o",
       który faktycznie jedzie przez PŁYTOWĄ + KUPIECKĄ + POLFA,
       dostanie "l".
    */
    if(
        literaRzeczywista&&
        czyPokazacWariantJakLiniaHTML(
            literaRzeczywista
        )
    ){
        return kanonicznaLiteraWariantu(
            literaRzeczywista
        ).toLowerCase();
    }

    const literaSkrocenia=
        znajdzLitereSkroceniaPoKoncu(
            kurs,
            symbol
        );

    if(
        !literaSkrocenia||
        !czyPokazacWariantJakLiniaHTML(
            literaSkrocenia
        )
    ){
        return"";
    }

    return kanonicznaLiteraWariantu(
        literaSkrocenia
    ).toLowerCase();
}
