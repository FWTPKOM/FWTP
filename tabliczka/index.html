<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FWTP - Tabliczki</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* =========================================================
           STRONA
           ========================================================= */

        .tabliczka-page {
            max-width: 1260px;
            margin: 24px auto;
            padding: 0 15px;
        }

        .sterowanie {
            margin-bottom: 18px;
            padding: 16px;

            background: #fff;

            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .sterowanie h1 {
            margin: 0 0 13px;

            font-size: 25px;
        }

        .sterowanie-grid {
            display: grid;
            grid-template-columns: 110px 1fr 1.3fr 155px auto;
            gap: 9px;
            align-items: end;
        }

        .pole {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .pole label {
            font-size: 13px;
            font-weight: 700;
        }

        .pole input,
        .pole select {
            width: 100%;
            min-height: 39px;

            padding: 7px 9px;

            background: #fff;
            color: #222;

            border: 1px solid #ccc;
            border-radius: 5px;

            font: inherit;
            font-size: 14px;

            box-sizing: border-box;
        }

        .pokaz-btn {
            min-height: 39px;
            padding: 8px 18px;

            border: 0;
            border-radius: 5px;

            background: #d61c12;
            color: #fff;

            font: inherit;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        .pokaz-btn:hover {
            background: #b8170f;
        }

        .status {
            margin-top: 9px;

            color: #666;

            font-size: 13px;
        }

        .tabliczka-scroll {
            overflow-x: auto;
            padding-bottom: 8px;

            -webkit-overflow-scrolling: touch;
        }


        /* =========================================================
           TABLICZKA - PROPORCJE WZOROWANE NA PDF
           ========================================================= */


    .tabliczka,
.tabliczka * {
    font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
}

.numer-linii-box,
.numer-linii-box * {
    font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
}

        .tabliczka {
            --lewa: 74.0%;
            --prawa: 26.0%;

            display: grid;
            grid-template-columns: var(--lewa) var(--prawa);

            width: 210mm;
            height: 160mm;
            min-height: 160mm;

            margin: 0 auto;

            background: #fff;
            color: #000000;

            border: 4px double #111;


            box-sizing: border-box;
        }

        .tabliczka.trasa-2-kol {
            --lewa: 50.5%;
            --prawa: 49.5%;
        }

        .panel-lewy {
            position: relative;

            min-width: 0;

            border-right: 0;
        }

        .panel-lewy::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            right: -3px;
            width: 1px;
            background: #777;
            z-index: 2;
        }

        .panel-prawy {
            min-width: 0;
            height: 100%;
            overflow: hidden;
        }


        /* =========================================================
           NAGŁÓWEK
           ========================================================= */

        .naglowek-tabliczki {
            display: grid;
            grid-template-columns: 155px minmax(0, 1fr);

            width: min(560px, calc(100% - 23px));

            margin: 12px 0 0 17px;
        }

        .numer-linii-box {
            height: 78px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;
            margin: 0;

            border: 1px solid #777;

            font-size: 80px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -2px;
            text-align: center;
            text-indent: 0;

            box-sizing: border-box;
        }

        .dane-linii {
            padding: 5px 0 0 13px;
        }

        .typ-linii {
            position: relative;
            top: -4px;
            margin-bottom: 9px;

            font-size: 17px;
            font-weight: 400;
        }

        .kierunek {
            position: relative;
            top: 2px;
            margin-bottom: 5px;

            font-size: 17px;
            font-weight: 400;
        }

        .kierunek::before {
            content: "→";
            display: inline-block;

            margin-right: 7px;
        }

        .wazny {
            font-size: 11px;
            color: #000000;
        }


        /* =========================================================
           TABELE ROZKŁADÓW
           ========================================================= */

        .rozklady-wrap {
            width: min(640px, calc(100% - 36px));

            margin: 3px 0 0 17px;
        }

        .rozklady-grid {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: max-content;
            align-items: start;
            justify-content: start;

            width: max-content;
            max-width: 100%;
        }

        .rozklady-grid.kol-1,
        .rozklady-grid.kol-2,
        .rozklady-grid.kol-3 {
            grid-template-columns: none;
            max-width: 100%;
        }

        /*
           Każdy typ dnia jest JEDNYM pudełkiem:
           tytuł dnia + Godz. + Minuty + wszystkie godziny.
           Dzięki white-space: nowrap w tytule minimalna szerokość
           całej kolumny nigdy nie będzie mniejsza niż sam napis typu dnia.
        */

        .rozklady-grid.kol-3.weekend-rowny {
            grid-template-columns: max-content repeat(2, minmax(max-content, 1fr));
        }

        .rozklady-grid.kol-3.weekend-rowny .dzien:nth-child(2),
        .rozklady-grid.kol-3.weekend-rowny .dzien:nth-child(3) {
            width: 100%;
            min-width: 100%;
        }

        .dzien {
            display: block;

            width: max-content;
            min-width: max-content;

            border: 1px solid #111;
            box-sizing: border-box;
            overflow: hidden;
        }

        .dzien + .dzien {
            margin-left: 3px;
        }

        .dzien-tytul {
            min-height: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 1px 8px 0 8px;
            font-size: 16px;
            line-height: 1.05;
            font-weight: 400;
            text-align: center;
            white-space: nowrap;
            color: #000000;
            width: auto;
            min-width: max-content;
            box-sizing: border-box;
        }

        .godziny-head {
            display: grid;
            grid-template-columns: 22px minmax(0, 1fr);
            width: 100%;

            min-height: 21px;

            border-bottom: 1px solid #111;

            font-size: 13px;
            font-weight: 400;
        }

        .godziny-head > div {
            padding: 2px 2px;
        }

        .godziny-head > div:first-child {
            padding-left: 2px;
            padding-right: 0;
        }

        .godziny-head > div:last-child {
            padding-left: 15px;
            padding-right: 2px;
        }

        .godzina-row {
            display: grid;
            grid-template-columns: 22px minmax(0, 1fr);
            width: 100%;

            min-height: 16px;
            height: 16px;
            align-items: stretch;

            border-bottom: 1px solid #aaa;
            box-sizing: border-box;
        }

        .godzina-row:last-child {
            border-bottom: 0;
        }

        .godzina-cell {
            position: relative;
            left: 1px;
            padding: 0 4px 0 1px;

            border-right: 1px solid #111;

            font-size: 16px;
            line-height: 16px;
            font-weight: 800;
            text-align: right;

            height: 16px;
            box-sizing: border-box;
        }

        .minuty-cell {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 23px;
            align-items: center;
            justify-content: start;
            column-gap: 0;

            min-width: 0;
            height: 16px;

            padding: 0 1px 0 2.5px;

            font-size: 15px;
            line-height: 16px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            box-sizing: border-box;
        }

        .minuta {
            display: inline-flex;
            align-items: baseline;
            justify-content: flex-start;

            width: 23px;
            min-width: 23px;
            height: 16px;
            line-height: 16px;

            white-space: nowrap;
            
        }

        /*
           Litera wariantu ma taki sam rozmiar i tę samą linię bazową
           co minuta. Każda minuta zajmuje jednak identyczne 26 px,
           więc symbole nie rozsuwają następnych minut.
        */
        .symbol {
            position: static;

            margin-left: 0;

            font-size: 11px;
            line-height: inherit;
            font-weight: 400;
            vertical-align: baseline;
        }

        .brak {
            padding: 16px 8px;

            color: #777;

            font-size: 11px;
            text-align: center;
        }


        /* =========================================================
           LEGENDA
           ========================================================= */

        .legenda {
            max-width: 620px;

            margin: 11px 12px 12px 17px;

            font-size: 14px;
            line-height: 1.25;
        }

        .legenda-wiersz {
            margin-top: 3px;

            display: grid;
            grid-template-columns: 22px auto minmax(0, 1fr);
            
            align-items: baseline;

            font-weight: 700;
        }

        .legenda-litera {
            display: block;

            width: 22px;
            min-width: 22px;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .legenda-myslnik {
            display: block;
            margin-left: -2px;
            margin-right: 5px;
            padding: 0;
            text-align: center;
        }

        .legenda-opis {
            display: block;
            min-width: 0;
        }


        /* =========================================================
           PIONOWY NAPIS PRZYSTANKU
           ========================================================= */

        .etykieta-przystanku {
            position: absolute;

            left: 1px;
            bottom: 13px;

            writing-mode: vertical-rl;
            transform: rotate(180deg);

            font-size: 13px;
            line-height: 1;
        }


        /* =========================================================
           TRASA - PRAWA CZĘŚĆ
           ========================================================= */

        .trasa-head {
            min-height: 24px;

            display: grid;
            grid-template-columns: 1fr;
            align-items: center;

            margin-left: 3px;
            width: calc(100% - 3px);
            padding: 2px 0;

            border-bottom: 1px solid #777;

            font-size: 13px;
            font-weight: 400;

            box-sizing: border-box;
        }

        .trasa-head.cols-2 {
            grid-template-columns: 1fr 1fr;
        }

        .trasa-head-label {
            min-width: 0;
            padding: 0 6px 0 3px;
            transform: translateY(3px);
            box-sizing: border-box;
            font-weight: 400;
        }

        .trasa-head.cols-2 .trasa-head-label:first-child {
            border-right: 0;
        }

        .trasa-columns {
            display: grid;

            height: calc(100% - 24px);
            min-height: 0;
            overflow: hidden;
        }

        .trasa-columns.cols-1 {
            grid-template-columns: 1fr;
        }

        .trasa-columns.cols-2 {
            grid-template-columns: 1fr 1fr;
        }

        .trasa-kol {
            min-width: 0;
            overflow: visible;

            /* 5 px bliżej pionowej linii oddzielającej rozkład od trasy */
            padding: 4px 2px 8px 2px;

            border-right: 1px solid #777;
        }

        .trasa-kol:last-child {
            border-right: 0;
        }

        .trasa-lista {
            margin: 0;
            padding: 0;

            list-style: none;
        }

        .trasa-stop {
            display: grid;
            grid-template-columns: 19px 12px minmax(0, 1fr) 12px;
            align-items: center;

            min-height: 16.5px;

            color: #111;

            font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
            font-size: 13.5px;
            line-height: 1;
        }

        .trasa-stop.przed {
            color: #777;
        }

        .trasa-czas {
            align-self: start;

            padding-top: 0;
            padding-right: 1px;

            text-align: right;
            white-space: nowrap;
            line-height: 15px;
        
            font-size: 13px;
        }

        .trasa-os {
            position: relative;

            align-self: stretch;
        }

        .trasa-os::before {
            content: "";

            position: absolute;

            left: 4.1px;
            top: 0;
            bottom: 0;

            width: 2.25px;

            background: currentColor;
        }

        .trasa-os::after {
            content: "";

            position: absolute;

            left: 1px;
            top: 3px;

            width: 8.5px;
            height: 8.5px;

            transform: none;

            background: currentColor;

            border-radius: 50%;
        }

        .trasa-stop.kraniec-poczatek .trasa-os::before {
            top: 8px;
        }

        .trasa-stop.kraniec-koniec .trasa-os::before {
            bottom: calc(100% - 8px);
        }

        .trasa-nazwa {
            min-width: 0;

            overflow: visible;

            white-space: nowrap;
            overflow-wrap: normal;
            word-break: normal;
            hyphens: none;

            font-weight: 400;
            line-height: 1;
        }

        .trasa-stop.kraniec-poczatek .trasa-nazwa,
        .trasa-stop.kraniec-koniec .trasa-nazwa {
            font-weight: 700;
        }

        .trasa-nazwa.zawijaj {
            white-space: normal;
        }

        /* Nazwa w dwóch liniach ma własne miejsce w układzie,
           dzięki czemu kolejny przystanek nie nachodzi na drugą linię. */
        .trasa-stop:has(.trasa-nazwa.zawijaj) {
            min-height: 33px;
        }

        .trasa-nazwa.zawijaj .trasa-nazwa-aktywna {
            white-space: normal;
        }

        .trasa-stop.wybrany .trasa-nazwa {
            display: inline;

            width: auto;
            max-width: none;

            padding: 0;
            margin: 0;

            background: transparent;
            color: inherit;

            overflow: visible;
            white-space: normal;
            text-overflow: clip;
        }

        .trasa-nazwa-aktywna {
            background: #111;
            color: #fff;

            padding: 0;
            margin: 0;

            font-weight: inherit;

            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }

        .trasa-stop.wybrany {
            color: #111;
        }

        .trasa-stop.nz .trasa-os::after {
            background: #fff;
            border: 2px solid currentColor;
            box-sizing: border-box;
        }

        .trasa-nz {
            justify-self: end;
            align-self: start;

            position: relative;
            right: -1px;

            padding-right: 0;

            text-align: right;

            font-size: 15.5px;
            line-height: 1;
            font-weight: 400;
        }


        /* =========================================================
           BŁĄD
           ========================================================= */

        .blad {
            padding: 20px;

            background: #fff;

            border: 1px solid #ddd;
            border-radius: 7px;

            color: #666;
        }


        /* =========================================================
           RESPONSYWNOŚĆ
           ========================================================= */

        @media (max-width: 850px) {

            .sterowanie-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 560px) {

            .tabliczka-page {
                margin: 15px auto;
                padding: 0 8px;
            }

            .sterowanie-grid {
                grid-template-columns: 1fr;
            }
        }


        /* =========================================================
           DRUK
           ========================================================= */

        @media print {

            body {
                background: #fff !important;
            }

            .topbar,
            .sterowanie,
            footer {
                display: none !important;
            }

            .tabliczka-page {
                max-width: none;
                margin: 0;
                padding: 0;
            }

            .tabliczka-scroll {
                overflow: visible;
            }

            .tabliczka {
                width: 210mm;
                height: 160mm;
                min-height: 160mm;
                margin: 0 auto;
            }
        }
    
/* =========================================================
   DOPASOWANIE PROPORCJI CZCIONKI DO WZORU PDF
   Delikatne rozciągnięcie pionowe tekstu o 8%.
   Numer linii pozostaje bez skalowania.
   ========================================================= */

.typ-linii,
.kierunek,
.wazny,
.dzien-tytul,
.godziny-head,
.legenda,
.trasa-head-label,
.stop-time,
.stop-zadanie,
.trasa-extra-title,
.trasa-extra-stop {
    transform: scaleY(1.08);
    transform-origin: center;
}

/* Lista przystanków – mocniejsze pionowe rozciągnięcie,
   żeby efekt był widoczny również przy nazwach przystanków. */
.stop-name,
.trasa-nazwa {
    transform: scaleY(1.30);
    transform-origin: left center;
    letter-spacing: 0.75px;
}

/* Aktywny przystanek ma takie samo pionowe rozciągnięcie
   jak pozostałe nazwy przystanków — również przy dwóch liniach. */
.trasa-stop.wybrany .trasa-nazwa {
    transform: scaleY(1.30);
    transform-origin: left center;
}

.trasa-nazwa-aktywna {
    transform: none;
}

.trasa-nazwa-aktywna {
    position: relative;
    display: inline;
    height: auto;
    line-height: 16.5px;
    padding: 0;
    background: transparent;
    color: #fff;
    overflow: visible;
    vertical-align: baseline;
    box-sizing: content-box;

    /* Czarne tło aktywnego przystanku bez jasnych linii nad i pod. */
    background: #111;
    box-shadow: none;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
}

.trasa-nazwa-aktywna::before {
    content: none;
}

.trasa-nazwa-aktywna-tekst {
    display: inline;
    line-height: 16.5px;
    letter-spacing: 0.75px;
}

/* Symbol „ż” rozciągnięty pionowo tak samo jak lista przystanków. */
.trasa-nz {
    transform: scaleY(1.30);
    transform-origin: right center;
}

/* Godziny i minuty bez pionowego skalowania. */
.godzina-cell {
    transform: none;
}

/* Minuty rozciągnięte tylko pionowo.
   Nie zmieniamy letter-spacing ani szerokości komórki,
   więc cyfry nie są od siebie bardziej odsunięte. */
.minuta {
    transform: scaleY(1.12);
    transform-origin: left center;
    letter-spacing: 0;
    font-weight: 500;
}

/* Elementy, które miały już własny transform, wymagają połączenia transformacji. */
.typ-linii {
    transform: translateY(1px) scaleY(1.08);
}

.kierunek {
    transform: translateY(2px) scaleY(1.08);
}

.trasa-head-label {
    transform: translateY(3px) scaleY(1.08);
}




/* =========================================================
   KOLORY TEKSTÓW
   ========================================================= */

.dzien-tytul,
.godziny-head,
.trasa-stop:not(.przed),
.trasa-stop:not(.przed) .trasa-nazwa,
.trasa-stop:not(.przed) .trasa-czas,
.trasa-stop:not(.przed) .trasa-nz {
    color: #000000;
}

/* Przystanki już minięte pozostają takie jak wcześniej. */
.trasa-stop.przed {
    color: #777;
}

</style>
</head>

<header class="topbar">
    <div class="logo">FWTP</div>
    <nav class="menu" id="menu"></nav>
</header>


<main class="tabliczka-page">

    <section class="sterowanie">

        <h1>Tabliczka przystankowa</h1>

        <div class="sterowanie-grid">

            <div class="pole">
                <label for="liniaInput">Linia</label>
                <input id="liniaInput" type="text" placeholder="np. 126">
            </div>

            <div class="pole">
                <label for="kierunekSelect">Kierunek</label>
                <select id="kierunekSelect" disabled></select>
            </div>

            <div class="pole">
                <label for="przystanekSelect">Przystanek</label>
                <select id="przystanekSelect" disabled></select>
            </div>

            <div class="pole">
                <label for="dataInput">Data</label>
                <input id="dataInput" type="date">
            </div>

            <button id="pokazBtn" class="pokaz-btn" type="button">
                Pokaż
            </button>

        </div>

        <div id="status" class="status">
            Wpisz numer linii.
        </div>

    </section>


    <div id="wynik"></div>

</main>


<script src="/FWTP/js/menu.js"></script>

function rozdzielNazweIMiejscowosc(nazwa){

    const tekst = String(nazwa || "").trim();

    const dopasowanie = tekst.match(/^(.*?)\s*\(([^()]*)\)\s*$/);

    if(!dopasowanie){
        return {
            nazwa: tekst,
            miejscowosc: ""
        };
    }

    const nazwaBezNawiasu = String(dopasowanie[1] || "").trim();
    const tekstWNawiasie = String(dopasowanie[2] || "").trim();

    const jestMiejscowoscia = MIEJSCOWOSCI.some(
        miejscowosc =>
            normalizuj(miejscowosc) === normalizuj(tekstWNawiasie)
    );

    if(!jestMiejscowoscia){
        return {
            nazwa: tekst,
            miejscowosc: ""
        };
    }

    return {
        nazwa: nazwaBezNawiasu,
        miejscowosc: tekstWNawiasie
    };
}


let daneLinii=null;
let manifestPaczek=null;
let waznyOdDanych="";

const parametry=
    new URLSearchParams(
        window.location.search
    );

let aktualnaLinia=
    String(
        parametry.get("linia")||""
    ).trim();

let aktualnyKierunek=
    Number(
        parametry.get("kierunek")||0
    );

let aktualnyPrzystanek=
    pobierzIndeksPrzystanku();

let wybranaData=
    dataZTekstu(
        parametry.get("data")
    )||
    new Date();


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async()=>{

        const liniaInput=
            document.getElementById("liniaInput");

        const dataInput=
            document.getElementById("dataInput");

        liniaInput.value=
            aktualnaLinia;

        dataInput.value=
            dataISO(
                wybranaData
            );

        document
            .getElementById("pokazBtn")
            .addEventListener(
                "click",
                async()=>{

                    const nowaLinia=
                        String(
                            liniaInput.value||""
                        ).trim();

                    const d=
                        dataZTekstu(
                            dataInput.value
                        );

                    if(d){
                        wybranaData=d;
                    }

                    if(!nowaLinia){
                        pokazBlad(
                            "Podaj numer linii."
                        );
                        return;
                    }

                    if(
                        nowaLinia!==
                        aktualnaLinia
                    ){
                        aktualnyKierunek=0;
                        aktualnyPrzystanek=0;
                    }

                    aktualnaLinia=
                        nowaLinia;

                    await wczytajLinie();
                }
            );

        liniaInput.addEventListener(
            "keydown",
            event=>{
                if(event.key==="Enter"){
                    document
                        .getElementById("pokazBtn")
                        .click();
                }
            }
        );

        document
            .getElementById("kierunekSelect")
            .addEventListener(
                "change",
                function(){

                    aktualnyKierunek=
                        Number(
                            this.value
                        );

                    aktualnyPrzystanek=0;

                    wypelnijPrzystanki();
                    zapiszURL();
                    renderuj();
                }
            );

        document
            .getElementById("przystanekSelect")
            .addEventListener(
                "change",
                function(){

                    aktualnyPrzystanek=
                        Number(
                            this.value
                        );

                    zapiszURL();
                    renderuj();
                }
            );

        dataInput.addEventListener(
            "change",
            async function(){

                const d=
                    dataZTekstu(
                        this.value
                    );

                if(!d)return;

                wybranaData=d;

                if(aktualnaLinia){
                    await wczytajLinie();
                }
            }
        );

        if(aktualnaLinia){
            await wczytajLinie();
        }
    }
);


/* =========================================================
   DATA / URL
   ========================================================= */

function dataZTekstu(tekst){

    const m=
        /^(\d{4})-(\d{2})-(\d{2})$/
            .exec(
                String(
                    tekst||""
                )
            );

    if(!m)return null;

    const d=
        new Date(
            Number(m[1]),
            Number(m[2])-1,
            Number(m[3])
        );

    return Number.isNaN(
        d.getTime()
    )
        ? null
        : d;
}


function dataISO(data){

    return[
        data.getFullYear(),
        String(
            data.getMonth()+1
        ).padStart(2,"0"),
        String(
            data.getDate()
        ).padStart(2,"0")
    ].join("-");
}


function pobierzIndeksPrzystanku(){

    const tekst=
        String(
            parametry.get("przystanek")||""
        );

    if(
        tekst.startsWith("idx:")
    ){
        const n=
            Number(
                tekst.slice(4)
            );

        return Number.isInteger(n)
            ? n
            : 0;
    }

    const n=
        Number(tekst);

    return Number.isInteger(n)
        ? n
        : 0;
}


function zapiszURL(){

    const url=
        new URL(
            window.location.href
        );

    url.searchParams.set(
        "linia",
        aktualnaLinia
    );

    url.searchParams.set(
        "data",
        dataISO(
            wybranaData
        )
    );

    url.searchParams.set(
        "kierunek",
        String(
            aktualnyKierunek
        )
    );

    url.searchParams.set(
        "przystanek",
        "idx:"+
        aktualnyPrzystanek
    );

    history.replaceState(
        {},
        "",
        url
    );
}

   PACZKI
   ========================================================= */

async function pobierzManifestPaczek(){

    if(
        manifestPaczek!==null
    ){
        return manifestPaczek;
    }

    try{

        const r=
            await fetch(
                BASE_DANE+
                "paczki.json?ts="+
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!r.ok){
            manifestPaczek=[];
            return manifestPaczek;
        }

        const j=
            await r.json();

        manifestPaczek=
            Array.isArray(j)
                ? j
                : Array.isArray(j.paczki)
                    ? j.paczki
                    : [];
    }
    catch{
        manifestPaczek=[];
    }

    return manifestPaczek;
}


function paczkaObowiazuje(
    paczka,
    linia,
    data
){

    const linie=
        Array.isArray(
            paczka?.linie
        )
            ? paczka.linie.map(String)
            : [];

    if(
        !linie.includes(
            String(linia)
        )
    ){
        return false;
    }

    const iso=
        dataISO(data);

    const od=
        String(
            paczka.od||""
        );

    const doDaty=
        String(
            paczka.do||""
        );

    return(
        (!od||iso>=od)&&
        (!doDaty||iso<=doDaty)
    );
}


async function pobierzLinie(
    linia,
    data
){

    const paczki=
        await pobierzManifestPaczek();

    const pasujace=
        paczki
            .filter(
                p=>
                    paczkaObowiazuje(
                        p,
                        linia,
                        data
                    )
            )
            .sort(
                (a,b)=>
                    Number(
                        b.priorytet||0
                    )-
                    Number(
                        a.priorytet||0
                    )
            );

    const zrodla=[];

    pasujace.forEach(
        p=>{

            const folder=
                String(
                    p.folder||""
                )
                    .replace(/^\/+/,"")
                    .replace(/\/+$/,"");

            if(folder){
                zrodla.push({
                    url:
                        BASE_DANE+
                        folder+
                        "/"+
                        encodeURIComponent(linia)+
                        ".json",
                    od:
                        String(
                            p.od||""
                        )
                });
            }
        }
    );

    zrodla.push({
        url:
            BASE_DANE+
            encodeURIComponent(linia)+
            ".json",
        od:""
    });

    for(const zrodlo of zrodla){

        try{

            const r=
                await fetch(
                    zrodlo.url+
                    "?ts="+
                    Date.now(),
                    {
                        cache:"no-store"
                    }
                );

            if(!r.ok)continue;

            const json=
                await r.json();

            waznyOdDanych=
                String(
                    json?.od||
                    json?.waznyOd||
                    json?.dataOd||
                    json?.obowiazujeOd||
                    zrodlo.od||
                    ""
                );

            return json;
        }
        catch{
            /* następny */
        }
    }

    throw new Error(
        "Nie znaleziono danych linii "+
        linia+
        "."
    );
}

async function wczytajLinie(){

    ustawStatus(
        "Ładowanie linii "+
        aktualnaLinia+
        "..."
    );

    document
        .getElementById("wynik")
        .innerHTML="";

    try{

        daneLinii=
            await pobierzLinie(
                aktualnaLinia,
                wybranaData
            );

        const kierunki=
            pobierzKierunki();

        if(!kierunki.length){
            throw new Error(
                "Brak kierunków w pliku JSON."
            );
        }

        if(
            aktualnyKierunek<0||
            aktualnyKierunek>=
                kierunki.length
        ){
            aktualnyKierunek=0;
        }

        wypelnijKierunki();
        wypelnijPrzystanki();

        zapiszURL();
        renderuj();

        ustawStatus(
            "Linia "+
            String(
                daneLinii.linia||
                aktualnaLinia
            )+
            " • "+
            dataISO(
                wybranaData
            )
        );
    }
    catch(error){

        console.error(error);

        pokazBlad(
            error.message||
            "Nie udało się wczytać danych."
        );
    }
}


/* =========================================================
   KIERUNKI
   ========================================================= */

function znajdzNajpelniejszyKierunek(index){

    let najlepszy=null;
    let ile=-1;

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const k=
                Array.isArray(
                    rozklad.kierunki
                )
                    ? rozklad.kierunki[index]
                    : null;

            if(
                !k||
                !Array.isArray(
                    k.przystanki
                )
            ){
                return;
            }

            if(
                k.przystanki.length>
                ile
            ){
                najlepszy=k;
                ile=k.przystanki.length;
            }
        }
    );

    return najlepszy;
}


function pobierzKierunki(){

    let max=0;

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        r=>{
            if(
                Array.isArray(
                    r.kierunki
                )
            ){
                max=
                    Math.max(
                        max,
                        r.kierunki.length
                    );
            }
        }
    );

    const wynik=[];
    const widzianeTrasy=[];

    const normalizujNazwe=
        nazwa=>
            String(
                nazwa||
                ""
            )
            .toUpperCase()
            .replace(/\u00A0/g," ")
            .replace(/\s+/g," ")
            .replace(/[.,;:]+$/g,"")
            .trim();

    const nazwyTrasy=
        k=>
            (
                k?.przystanki||
                []
            )
            .map(
                p=>
                    normalizujNazwe(
                        p?.nazwa
                    )
            );

    const takieSameNazwy=
        (a,b)=>{

            if(
                a.length!==b.length
            ){
                return false;
            }

            for(
                let j=0;
                j<a.length;
                j++
            ){
                if(
                    a[j]!==b[j]
                ){
                    return false;
                }
            }

            return true;
        };

    for(
        let i=0;
        i<max;
        i++
    ){

        const k=
            znajdzNajpelniejszyKierunek(
                i
            );

        if(!k){
            continue;
        }

        const nazwy=
            nazwyTrasy(k);

        /*
           Numery stanowisk/przystanków są całkowicie ignorowane.
           Jeżeli kolejność i nazwy przystanków są takie same,
           drugi kierunek/wariant nie jest dodawany.
        */
        const duplikat=
            widzianeTrasy.some(
                poprzednia=>
                    takieSameNazwy(
                        poprzednia,
                        nazwy
                    )
            );

        if(duplikat){
            continue;
        }

        widzianeTrasy.push(
            nazwy
        );

        wynik.push({
            index:i,
            dane:k
        });
    }

    return wynik;
}


function nazwaKierunku(k){

    const gotowa=
        String(
            k?.nazwa||
            k?.kierunek||
            ""
        ).trim();

    if(gotowa){
        return gotowa;
    }

    const p=
        k?.przystanki||
        [];

    return p.length
        ? String(
            p[p.length-1].nazwa||
            ""
        )
        : "";
}


function wypelnijKierunki(){

    const select=
        document.getElementById(
            "kierunekSelect"
        );

    const lista=
        pobierzKierunki();

    select.innerHTML="";

    lista.forEach(
        el=>{

            const option=
                document.createElement(
                    "option"
                );

            option.value=
                String(el.index);

            option.textContent=
                nazwaKierunku(
                    el.dane
                )||
                "Kierunek "+
                (el.index+1);

            select.appendChild(option);
        }
    );

    select.disabled=
        !lista.length;

    select.value=
        String(
            aktualnyKierunek
        );
}

function kierunekBazowy(){

    return znajdzNajpelniejszyKierunek(

function wypelnijPrzystanki(){

/* =========================================================
   CZAS
   ========================================================= */

function czasNaMinuty(czas){

    const m=
        /^(\d{1,2}):(\d{2})$/
            .exec(
                String(
                    czas||""
                ).trim()
            );

    if(!m)return null;

    const h=Number(m[1]);
    const min=Number(m[2]);

    if(
        h<0||
        h>47||
        min<0||
        min>59
    ){
        return null;
    }

    return h*60+min;
}


function rozbijCzas(czas){

    const m=
        /^(\d{1,2}):(\d{2})$/
            .exec(
                String(
                    czas||""
                ).trim()
            );

    if(!m)return null;

    return{
        godzina:Number(m[1]),
        minuta:m[2]
    };
}


/* =========================================================
   KURSY / DNI
   ========================================================= */

function symbolDnia(kurs){

    return String(
        kurs?.uwagi||
        ""
    )
        .trim()
        .toUpperCase();
}


function kluczKursu(kurs){

    return[
        String(
            kurs?.numer||""
        ),
        String(
            kurs?.wariant||""
        )
    ].join("||");
}


function znajdzPrzystanekWRozkladzie(
    rozklad,
    kierunekIndex,
    baza
){

    const k=
        Array.isArray(
            rozklad?.kierunki
        )
            ? rozklad.kierunki[
                kierunekIndex
            ]
            : null;

    if(
        !k||
        !Array.isArray(
            k.przystanki
        )
    ){
        return null;
    }

    const nazwa=
        normalizuj(
            baza?.nazwa
        );

    const nr=
        String(
            baza?.nr||""
        ).trim();

    return(
        k.przystanki.find(
            p=>
                normalizuj(p.nazwa)===
                    nazwa&&
                String(
                    p.nr||""
                ).trim()===
                    nr
        )||
        null
    );
}


function pobierzKursyDlaSymbolu(symbol){

    const bazaK=
        kierunekBazowy();

    const bazaP=
        bazaK?.przystanki?.[
            aktualnyPrzystanek
        ];

    if(!bazaP)return[];

    const mapa=new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    aktualnyKierunek,
                    bazaP
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        symbolDnia(kurs)!==
                        symbol
                    ){
                        return;
                    }

                    if(
                        czasNaMinuty(
                            kurs.czas
                        )===null
                    ){
                        return;
                    }

                    const key=
                        kluczKursu(kurs);

                    if(!mapa.has(key)){
                        mapa.set(
                            key,
                            kurs
                        );
                    }
                }
            );
        }
    );

    return Array.from(
        mapa.values()
    );
}


function dostepneGrupyDni(){

    const symbole=
        new Set();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const bazaK=
                kierunekBazowy();

            const bazaP=
                bazaK?.przystanki?.[
                    aktualnyPrzystanek
                ];

            const p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    aktualnyKierunek,
                    bazaP
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    const s=
                        symbolDnia(kurs);

                    if(s){
                        symbole.add(s);
                    }
                }
            );
        }
    );

    const wynik=[];

    if(symbole.has("D")){
        wynik.push({
            symbol:"D",
            tytul:"DZIEŃ POWSZEDNI"
        });
    }

    if(
        symbole.has("6")&&
        symbole.has("7")
    ){
        wynik.push({
            symbol:"6",
            tytul:"SOBOTA"
        });

        wynik.push({
            symbol:"7",
            tytul:"NIEDZIELA I ŚWIĘTO"
        });
    }
    else if(
        symbole.has("C")
    ){
        wynik.push({
            symbol:"C",
            tytul:"SOBOTA I ŚWIĘTO"
        });
    }
    else{

        if(symbole.has("6")){
            wynik.push({
                symbol:"6",
                tytul:"SOBOTA"
            });
        }

        if(symbole.has("7")){
            wynik.push({
                symbol:"7",
                tytul:"NIEDZIELA I ŚWIĘTO"
            });
        }
    }

    /*
     * Fallback: pokaż pozostałe symbole,
     * jeżeli eksport używa innych oznaczeń.
     */
    [
        ...symbole
    ]
        .filter(
            s=>
                !["D","C","6","7"]
                    .includes(s)
        )
        .forEach(
            s=>{
                wynik.push({
                    symbol:s,
                    tytul:
                        "ROZKŁAD "+
                        s
                });
            }
        );

    return wynik;
}


/* =========================================================
   WARIANTY / LEGENDA
   ========================================================= */

function mapaWariantow(){

    const mapa=new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        r=>{
            (
                r.warianty||
                []
            ).forEach(
                w=>{

                    const litera=
                        String(
                            w.litera||""
                        ).trim();

                    const opis=
                        String(
                            w.opis||""
                        ).trim();

                    if(
                        litera&&
                        opis&&
                        !mapa.has(litera)
                    ){
                        mapa.set(
                            litera,
                            opis
                        );
                    }
                }
            );
        }
    );

    return mapa;
}


function czyOznaczacWariant(opis){

    return(
        /skrócon|wydłuż|tylko do|zajezdni/i
            .test(
                String(
                    opis||""
                )
            )
    );
}



function koncowyPrzystanekKursu(
    kurs,
    symbol
){

    const numer=
        String(
            kurs?.numer||
            ""
        );

    if(!numer){
        return"";
    }

    let ostatniaNazwa="";

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const kierunek=
                Array.isArray(
                    rozklad?.kierunki
                )
                    ? rozklad.kierunki[
                        aktualnyKierunek
                    ]
                    : null;

            (
                kierunek?.przystanki||
                []
            ).forEach(
                p=>{

                    const jest=
                        (
                            p?.kursy||
                            []
                        ).some(
                            k=>
                                String(
                                    k?.numer||
                                    ""
                                )===numer&&
                                symbolDnia(k)===
                                    symbol
                        );

                    if(jest){
                        ostatniaNazwa=
                            String(
                                p?.nazwa||
                                ""
                            );
                    }
                }
            );
        }
    );

    return ostatniaNazwa;
}


function znajdzLitereSkroceniaPoKoncu(
    kurs,
    symbol
){

    const koniec=
        koncowyPrzystanekKursu(
            kurs,
            symbol
        );

    if(!koniec){
        return"";
    }

    const baza=
        kierunekBazowy();

    const koniecPelnej=
        String(
            baza?.przystanki?.[
                (baza?.przystanki?.length||1)-1
            ]?.nazwa||
            ""
        );

    if(
        normalizuj(koniec)===
        normalizuj(koniecPelnej)
    ){
        return"";
    }

    const mapa=
        mapaWariantow();

    for(
        const [litera,opis]
        of mapa.entries()
    ){

        const tekst=
            String(
                opis||
                ""
            );

        if(
            /skrócon|tylko do/i
                .test(tekst)&&
            normalizuj(tekst)
                .includes(
                    normalizuj(koniec)
                )
        ){
            return String(
                litera||
                ""
            )
                .trim()
                .toLowerCase();
        }
    }

    return"";
}


function symbolWariantu(kurs,symbol){

    const litera=
        String(
            kurs?.wariant||""
        ).trim();

    const opis=
        mapaWariantow()
            .get(litera)||
        "";

    if(
        litera&&
        czyOznaczacWariant(opis)
    ){
        return litera.toLowerCase();
    }

    /*
       Jeżeli np. w NIEDZIELĘ wszystkie kursy kończą się
       na URSYNÓW PŁD. i w danych kurs nie ma jawnego pola wariant,
       nadal pokazujemy właściwą literę wariantu skróconego.
    */
    return znajdzLitereSkroceniaPoKoncu(
        kurs,
        symbol
    );
}


/* =========================================================
   TABELA
   ========================================================= */

function grupujGodziny(kursy){

    const mapa=new Map();

    kursy.forEach(
        kurs=>{

            const c=
                rozbijCzas(
                    kurs.czas
                );

            if(!c)return;

            const h=
                c.godzina%24;

            if(!mapa.has(h)){
                mapa.set(h,[]);
            }

            mapa.get(h).push({
                minuta:c.minuta,
                kurs
            });
        }
    );

    return mapa;
}


function renderDzien(grupa){

    const kursy=
        pobierzKursyDlaSymbolu(
            grupa.symbol
        );

    const mapa=
        grupujGodziny(
            kursy
        );

    let body="";

    if(!mapa.size){

        body=
            '<div class="brak">Brak kursów</div>';
    }
    else{

        body=
            [
                ...mapa.keys()
            ]
                .map(
                    h=>{

                        const minuty=
                            mapa.get(h)
                                .map(
                                    item=>{

                                        const sym=
                                            symbolWariantu(
                                                item.kurs,
                                                grupa.symbol
                                            );

                                        return(
                                            '<span class="minuta">'+
                                            escapeHtml(
                                                item.minuta
                                            )+
                                            (
                                                sym
                                                    ? '<span class="symbol">'+
                                                      escapeHtml(sym)+
                                                      '</span>'
                                                    : ''
                                            )+
                                            '</span>'
                                        );
                                    }
                                )
                                .join("");

                        return(
                            '<div class="godzina-row">'+
                            '<div class="godzina-cell">'+
                            h+
                            '</div>'+
                            '<div class="minuty-cell">'+
                            minuty+
                            '</div>'+
                            '</div>'
                        );
                    }
                )
                .join("");
    }

    return(
        '<section class="dzien">'+
        '<div class="dzien-tytul">'+
        escapeHtml(
            grupa.tytul
        )+
        '</div>'+
        '<div class="godziny-head">'+
        '<div>Godz.</div>'+
        '<div>Minuty</div>'+
        '</div>'+
        body+
        '</section>'
    );
}


/* =========================================================
   CZASY PRZEJAZDU NA TRASIE
   ========================================================= */

function znajdzNajlepszyKursDoTrasy(){

    const baza=
        kierunekBazowy();

    const lista=
        baza?.przystanki||
        [];

    const start=
        lista[
            aktualnyPrzystanek
        ];

    if(!start)return null;

    const kandydaci=
        new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    aktualnyKierunek,
                    start
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        czasNaMinuty(
                            kurs.czas
                        )===null
                    ){
                        return;
                    }

                    const key=
                        kluczKursu(kurs);

                    if(!kandydaci.has(key)){

                        kandydaci.set(
                            key,
                            {
                                key,
                                numer:String(
                                    kurs.numer||""
                                ),
                                wariant:String(
                                    kurs.wariant||""
                                ),
                                start:
                                    czasNaMinuty(
                                        kurs.czas
                                    ),
                                count:0
                            }
                        );
                    }
                }
            );
        }
    );

    kandydaci.forEach(
        kandydat=>{

            for(
                let i=
                    aktualnyPrzystanek;
                i<lista.length;
                i++
            ){

                if(
                    znajdzCzasKursuNaPrzystanku(
                        kandydat,
                        lista[i]
                    )!==null
                ){
                    kandydat.count++;
                }
            }
        }
    );

    return[
        ...kandydaci.values()
    ].sort(
        (a,b)=>
            b.count-a.count||
            a.start-b.start
    )[0]||null;
}


function znajdzCzasKursuNaPrzystanku(
    kandydat,
    bazaP
){

    for(
        const rozklad of
        (
            daneLinii?.rozkłady||
            []
        )
    ){

        const p=
            znajdzPrzystanekWRozkladzie(
                rozklad,
                aktualnyKierunek,
                bazaP
            );

        const kurs=
            (
                p?.kursy||
                []
            ).find(
                k=>
                    String(
                        k.numer||""
                    )===
                        kandydat.numer&&
                    String(
                        k.wariant||""
                    )===
                        kandydat.wariant&&
                    czasNaMinuty(
                        k.czas
                    )!==null
            );

        if(kurs){
            return czasNaMinuty(
                kurs.czas
            );
        }
    }

    return null;
}


function czasyTrasy(){

    const baza=
        kierunekBazowy();

    const lista=
        baza?.przystanki||
        [];

    const kandydat=
        znajdzNajlepszyKursDoTrasy();

    const wynik=
        new Array(
            lista.length
        ).fill(null);

    if(!kandydat){
        return wynik;
    }

    const start=
        znajdzCzasKursuNaPrzystanku(
            kandydat,
            lista[
                aktualnyPrzystanek
            ]
        );

    if(start===null){
        return wynik;
    }

    for(
        let i=
            aktualnyPrzystanek;
        i<lista.length;
        i++
    ){

        let t=
            znajdzCzasKursuNaPrzystanku(
                kandydat,
                lista[i]
            );

        if(t===null)continue;

        while(t<start){
            t+=1440;
        }

        wynik[i]=
            t-start;
    }

    return wynik;
}


/* =========================================================
   TRASA
   ========================================================= */

function czyNZ(p){

    const typ=
        String(
            p?.typ||""
        )
            .trim()
            .toUpperCase();

    return(
        typ==="NŻ"||
        typ==="NZ"||
        typ==="N/Z"||
        typ.includes("ŻĄD")
    );
}



function listaTrasyDoWyswietlenia(){

    const baza=
        kierunekBazowy();

    const lista=
        baza?.przystanki||
        [];

    if(!lista.length){
        return[];
    }

    /*
       Dla każdego przystanku sprawdzamy, czy kursy obsługujące dany wpis
       jadą dalej niż ten przystanek.

       To pozwala odróżnić:
       - zwykłe powtórzenie tej samej nazwy na trasie -> ZOSTAWIAMY,
       - drugi numer stanowiska używany wyłącznie przez kursy skrócone
         kończące się na tym przystanku -> USUWAMY.
    */
    const kursJedzieDalej=
        (index,kurs)=>{

            const numer=
                String(
                    kurs?.numer||
                    ""
                );

            if(!numer){
                return false;
            }

            for(
                let j=index+1;
                j<lista.length;
                j++
            ){
                const dalej=
                    (
                        lista[j]?.kursy||
                        []
                    ).some(
                        k=>
                            String(
                                k?.numer||
                                ""
                            )===numer
                    );

                if(dalej){
                    return true;
                }
            }

            return false;
        };

    const maKursPelny=
        index=>
            (
                lista[index]?.kursy||
                []
            ).some(
                kurs=>
                    kursJedzieDalej(
                        index,
                        kurs
                    )
            );

    const wynik=[];

    let i=0;

    while(i<lista.length){

        const aktualna=
            lista[i];

        const nastepna=
            lista[i+1];

        const taSamaNazwa=
            nastepna&&
            normalizuj(
                aktualna?.nazwa
            )===
            normalizuj(
                nastepna?.nazwa
            );

        if(!taSamaNazwa){

            wynik.push({
                p:aktualna,
                index:i
            });

            i++;
            continue;
        }

        /*
           Mamy dwa KOLEJNE wpisy o tej samej nazwie.
           Usuwamy jeden tylko wtedy, gdy jeden z nich jest wyraźnie
           stanowiskiem dla kursów jadących dalej, a drugi nie ma żadnego
           kursu jadącego dalej (czyli jest stanowiskiem końcowym wariantu).
        */
        const pierwszyPelny=
            maKursPelny(i);

        const drugiPelny=
            maKursPelny(i+1);

        if(
            pierwszyPelny!==drugiPelny
        ){

            const zachowajIndex=
                pierwszyPelny
                    ? i
                    : i+1;

            wynik.push({
                p:lista[zachowajIndex],
                index:zachowajIndex
            });

            i+=2;
            continue;
        }

        /*
           Jeśli oba wpisy są "pełne" albo oba są końcowe,
           NIE zakładamy, że to wariant. Zostawiamy oba,
           bo linia może rzeczywiście dwa razy odwiedzać ten sam przystanek.
        */
        wynik.push({
            p:aktualna,
            index:i
        });

        i++;
    }

    return wynik;
}


function podzielTrase(lista){

    /*
       Najpierw ZAWSZE próbujemy zmieścić całą trasę
       w jednej kolumnie. Dopiero po wyrenderowaniu
       sprawdzamy rzeczywistą wysokość.
    */
    return[
        {
            start:0,
            lista
        }
    ];
}


function podzielTraseNaDwie(lista){

    const polowa=
        Math.ceil(
            lista.length/2
        );

    return[
        {
            start:0,
            lista:
                lista.slice(
                    0,
                    polowa
                )
        },
        {
            start:polowa,
            lista:
                lista.slice(
                    polowa
                )
        }
    ];
}


function renderTrasaKolumna(
    fragment,
    czasy,
    pierwszyIndexTrasy,
    ostatniIndexTrasy
){

    return(
        '<div class="trasa-kol">'+
        '<ul class="trasa-lista">'+
        fragment.lista
            .map(
                (element,lokalny)=>{

                    const p=
                        element&&
                        Object.prototype.hasOwnProperty.call(
                            element,
                            "p"
                        )
                            ? element.p
                            : element;

                    const index=
                        element&&
                        Object.prototype.hasOwnProperty.call(
                            element,
                            "index"
                        )
                            ? element.index
                            : fragment.start+
                              lokalny;

                    const przed=
                        index<
                        aktualnyPrzystanek;

                    const wybrany=
                        index===
                        aktualnyPrzystanek;

                    const czas=
                        czasy[index];

                    return(
                        '<li class="trasa-stop'+
                        (
                            przed
                                ? ' przed'
                                : ''
                        )+
                        (
                            wybrany
                                ? ' wybrany'
                                : ''
                        )+
                        (
                            czyNZ(p)
                                ? ' nz'
                                : ''
                        )+
                        (
                            index===pierwszyIndexTrasy
                                ? ' kraniec-poczatek'
                                : ''
                        )+
                        (
                            index===ostatniIndexTrasy
                                ? ' kraniec-koniec'
                                : ''
                        )+
                        '">'+
                        '<span class="trasa-czas">'+
                        (
                            czas===null
                                ? ''
                                : escapeHtml(
                                    String(czas)
                                )
                        )+
                        '</span>'+
                        '<span class="trasa-os"></span>'+
                        '<span class="trasa-nazwa">'+
                        (
                            wybrany
                                ? '<span class="trasa-nazwa-aktywna">'+
                                  '<span class="trasa-nazwa-aktywna-tekst">'+
                                  escapeHtml(
                                      String(
                                          p.nazwa||""
                                      ).toUpperCase()
                                  )+
                                  '</span>'+
                                  '</span>'
                                : escapeHtml(
                                      String(
                                          p.nazwa||""
                                      ).toUpperCase()
                                  )
                        )+
                        '</span>'+
                        '<span class="trasa-nz">'+
                        (
                            czyNZ(p)
                                ? 'ż'
                                : ''
                        )+
                        '</span>'+
                        '</li>'
                    );
                }
            )
            .join("")+
        '</ul>'+
        '</div>'
    );
}


/* =========================================================
   LEGENDA
   ========================================================= */

function renderLegenda(){

    const grupy=
        dostepneGrupyDni();

    const opisy=
        mapaWariantow();

    const uzyte=
        new Set();

    grupy.forEach(
        grupa=>{

            pobierzKursyDlaSymbolu(
                grupa.symbol
            ).forEach(
                kurs=>{

                    const symbol=
                        symbolWariantu(
                            kurs,
                            grupa.symbol
                        );

                    const litera=
                        String(
                            symbol||
                            ""
                        )
                            .trim()
                            .toUpperCase();

                    const opis=
                        opisy.get(litera)||
                        "";

                    if(
                        litera&&
                        czyOznaczacWariant(
                            opis
                        )
                    ){
                        uzyte.add(litera);
                    }
                }
            );
        }
    );

    if(!uzyte.size){
        return"";
    }

    return[
        ...uzyte
    ]
        .sort(
            (a,b)=>
                a.localeCompare(
                    b,
                    "pl",
                    {
                        numeric:true
                    }
                )
        )
        .map(
            litera=>{

                return(
                    '<div class="legenda-wiersz">'+
                    '<span class="legenda-litera">'+
                    escapeHtml(
                        litera.toLowerCase()
                    )+
                    '</span>'+
                    '<span class="legenda-myslnik">-</span>'+
                    '<span class="legenda-opis">'+
                    escapeHtml(
                        opisy.get(litera)||
                        ""
                    )+
                    '</span>'+
                    '</div>'
                );
            }
        )
        .join("");
}


/* =========================================================
   TYP LINII
   ========================================================= */

function typLinii(numer){

    const tekst=
        String(
            numer||""
        )
            .trim()
            .toUpperCase();

    if(/^Z-/.test(tekst)){
        return"LINIA ZASTĘPCZA";
    }

    const n=Number(tekst);

    if(
        Number.isFinite(n)&&
        n>=1&&
        n<=79
    ){
        return"LINIA TRAMWAJOWA";
    }

    return"LINIA ZWYKŁA";
}


/* =========================================================
   RENDER
   ========================================================= */

function renderuj(){

    const kierunek=
        kierunekBazowy();

    const lista=
        kierunek?.przystanki||
        [];

    const p=
        lista[
            aktualnyPrzystanek
        ];

    if(!p){
        pokazBlad(
            "Nie znaleziono wybranego przystanku."
        );
        return;
    }

    const grupy=
        dostepneGrupyDni();

    const fragmenty=
        podzielTrase(
            lista
        );

    const czasy=
        czasyTrasy();

    const numer=
        String(
            daneLinii.linia||
            aktualnaLinia
        );

    const klasaTrasy=
        fragmenty.length===2
            ? " trasa-2-kol"
            : "";

    const legenda=
        renderLegenda();

    const rozklady=
        grupy
            .slice(0,3)
            .map(
                renderDzien
            )
            .join("");

    const kolKlasa=
        "kol-"+
        Math.max(
            1,
            Math.min(
                3,
                grupy.length
            )
        );

    const listaTrasy=
        listaTrasyDoWyswietlenia();

    const pierwszyIndexTrasy=
        listaTrasy.length
            ? listaTrasy[0].index
            : -1;

    const ostatniIndexTrasy=
        listaTrasy.length
            ? listaTrasy[listaTrasy.length-1].index
            : -1;

    const trasaHtml=
        fragmenty
            .map(
                f=>
                    renderTrasaKolumna(
                        f,
                        czasy,
                        pierwszyIndexTrasy,
                        ostatniIndexTrasy
                    )
            )
            .join("");

    const html=
        '<div class="tabliczka-scroll">'+
        '<article class="tabliczka'+
        klasaTrasy+
        '">'+

        '<section class="panel-lewy">'+

        '<div class="naglowek-tabliczki">'+
        '<div class="numer-linii-box">'+
        escapeHtml(numer)+
        '</div>'+
        '<div class="dane-linii">'+
        '<div class="typ-linii">'+
        escapeHtml(
            typLinii(numer)
        )+
        '</div>'+
        '<div class="kierunek">'+
        escapeHtml(
            String(
                nazwaKierunku(
                    kierunek
                )
            ).toUpperCase()
        )+
        '</div>'+
        '<div class="wazny">'+
        (
            waznyOdDanych
                ? 'Ważny od '+
                  escapeHtml(
                      waznyOdDanych
                  )
                : ''
        )+
        '</div>'+
        '</div>'+
        '</div>'+

        '<div class="rozklady-wrap">'+
        ('<div class="rozklady-grid '+kolKlasa+(
                    grupy.some(g => g.tytul === "SOBOTA") &&
                    grupy.some(g => g.tytul.includes("NIEDZIELA"))
                        ? ' weekend-rowny'
                        : ''
                )+'">')+
        rozklady+
        '</div>'+
        '</div>'+

        (
            legenda
                ? '<div class="legenda">'+
                  legenda+
                  '</div>'
                : ''
        )+

        '<div class="etykieta-przystanku">'+
        'Przystanek: '+
        escapeHtml(
            String(
                p.nazwa||""
            ).toUpperCase()
        )+
        ' '+
        escapeHtml(
            String(
                p.nr||""
            )
        )+
        '</div>'+

        '</section>'+

        '<aside class="panel-prawy">'+
        '<div class="trasa-head cols-'+
        fragmenty.length+
        '">'+
        '<div class="trasa-head-label">czasy, trasa, przystanki</div>'+ 
        (
            fragmenty.length===2
                ? '<div class="trasa-head-label">czasy, trasa, przystanki</div>'
                : ''
        )+
        '</div>'+
        '<div class="trasa-columns cols-'+
        fragmenty.length+
        '">'+
        trasaHtml+
        '</div>'+
        '</aside>'+

        '</article>'+
        '</div>';

    document
        .getElementById("wynik")
        .innerHTML=
            html;

    requestAnimationFrame(() => {
        wyrownajSzerokoscWeekendow();

        requestAnimationFrame(() => {
            dopasujKolumnyTrasy();
        });
    });
}


/* =========================================================
   POMOCNICZE
   ========================================================= */

function normalizuj(tekst){

    return String(
        tekst||""
    )
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim()
        .toUpperCase();
}


function escapeHtml(tekst){

    return String(
        tekst??""
    )
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function ustawStatus(tekst){

    document
        .getElementById("status")
        .textContent=
            tekst;
}


function pokazBlad(tekst){

    ustawStatus(tekst);

    document
        .getElementById("wynik")
        .innerHTML=
            '<div class="blad">'+
            escapeHtml(tekst)+
            '</div>';
}



function wyrownajSzerokoscWeekendow() {
    const dni = Array.from(
        document.querySelectorAll(".rozklady-grid .dzien")
    );

    const sobota = dni.find(d => {
        const t = (d.querySelector(".dzien-tytul")?.textContent || "")
            .trim()
            .toUpperCase();
        return t === "SOBOTA";
    });

    const niedziela = dni.find(d => {
        const t = (d.querySelector(".dzien-tytul")?.textContent || "")
            .trim()
            .toUpperCase();
        return t.includes("NIEDZIELA");
    });

    if (!sobota || !niedziela) return;

    sobota.style.width = "";
    sobota.style.minWidth = "";
    niedziela.style.width = "";
    niedziela.style.minWidth = "";

    const szerokosc = Math.max(
        Math.ceil(sobota.getBoundingClientRect().width),
        Math.ceil(niedziela.getBoundingClientRect().width)
    );

    [sobota, niedziela].forEach(d => {
        d.style.width = szerokosc + "px";
        d.style.minWidth = szerokosc + "px";
    });
}
function ustawNaglowekTrasy(liczbaKolumn) {

    const head = document.querySelector(".trasa-head");
    if (!head) return;

    const ile = liczbaKolumn === 2 ? 2 : 1;

    head.className = "trasa-head cols-" + ile;
    head.innerHTML =
        '<div class="trasa-head-label">czasy, trasa, przystanki</div>' +
        (
            ile === 2
                ? '<div class="trasa-head-label">czasy, trasa, przystanki</div>'
                : ''
        );
}


function dopasujKolumnyTrasy() {

    const tabliczka = document.querySelector(".tabliczka");
    const columns = document.querySelector(".trasa-columns");

    if (!tabliczka || !columns) return;

    const lista = listaTrasyDoWyswietlenia();
    if (!lista.length) return;

    const czasy = czasyTrasy();

    const pierwszyIndexTrasy =
        lista.length
            ? lista[0].index
            : -1;

    const ostatniIndexTrasy =
        lista.length
            ? lista[lista.length - 1].index
            : -1;

    // Najpierw próbujemy wszystko w jednej kolumnie.
    tabliczka.classList.remove("trasa-2-kol");
    columns.className = "trasa-columns cols-1";
    ustawNaglowekTrasy(1);
    columns.innerHTML = renderTrasaKolumna(
        { start: 0, lista: lista },
        czasy,
        pierwszyIndexTrasy,
        ostatniIndexTrasy
    );

    ustawZawijanieNazwTrasy(columns);

    const jednaKolumna = columns.querySelector(".trasa-kol");
    const jednaLista = columns.querySelector(".trasa-lista");

    if (!jednaKolumna || !jednaLista) return;

    const style1 = getComputedStyle(jednaKolumna);
    const paddingY1 =
        parseFloat(style1.paddingTop || 0) +
        parseFloat(style1.paddingBottom || 0);

    const potrzebnaWysokosc =
        Math.ceil(jednaLista.getBoundingClientRect().height + paddingY1);

    const dostepnaWysokosc =
        Math.floor(columns.clientHeight);

    if (potrzebnaWysokosc <= dostepnaWysokosc) {
        return;
    }

    // Jeśli się nie mieści, przechodzimy na szeroki panel 2-kolumnowy.
    tabliczka.classList.add("trasa-2-kol");
    columns.className = "trasa-columns cols-2";
    ustawNaglowekTrasy(2);

    // Do pierwszej kolumny tymczasowo wkładamy wszystko,
    // aby sprawdzić ile kolejnych przystanków realnie się mieści.
    columns.innerHTML =
        renderTrasaKolumna(
            { start: 0, lista: lista },
            czasy,
            pierwszyIndexTrasy,
            ostatniIndexTrasy
        ) +
        '<div class="trasa-kol trasa-kol-pusta"></div>';

    ustawZawijanieNazwTrasy(columns);

    const pierwszaKolumna = columns.querySelector(".trasa-kol");
    const wiersze = Array.from(
        pierwszaKolumna?.querySelectorAll(".trasa-stop") || []
    );

    if (!pierwszaKolumna || !wiersze.length) return;

    const stylKolumny = getComputedStyle(pierwszaKolumna);
    const paddingBottom = parseFloat(stylKolumny.paddingBottom || 0);

    const maxDol =
        pierwszaKolumna.getBoundingClientRect().top +
        columns.clientHeight -
        paddingBottom;

    let ileSieMiesci = 0;

    for (const wiersz of wiersze) {
        const rect = wiersz.getBoundingClientRect();

        if (rect.bottom <= maxDol + 0.5) {
            ileSieMiesci++;
        } else {
            break;
        }
    }

    ileSieMiesci = Math.max(
        1,
        Math.min(
            ileSieMiesci,
            lista.length - 1
        )
    );

    const pierwszaLista = lista.slice(0, ileSieMiesci);
    const drugaLista = lista.slice(ileSieMiesci);

    // Pierwsza kolumna = maksymalnie dużo przystanków.
    // Druga kolumna = wyłącznie te, które się nie zmieściły.
    columns.innerHTML =
        renderTrasaKolumna(
            {
                start: 0,
                lista: pierwszaLista
            },
            czasy,
            pierwszyIndexTrasy,
            ostatniIndexTrasy
        ) +
        renderTrasaKolumna(
            {
                start: ileSieMiesci,
                lista: drugaLista
            },
            czasy,
            pierwszyIndexTrasy,
            ostatniIndexTrasy
        );

    ustawZawijanieNazwTrasy(columns);
}






function ustawZawijanieNazwTrasy(columns){

    if(!columns){
        return;
    }

    /*
       Każda nazwa jest oceniana osobno:
       - jeśli mieści się w jednej linii -> pozostaje bez zawijania,
       - jeśli się nie mieści -> tylko ta nazwa dostaje zawijanie.
    */
    const nazwy=
        Array.from(
            columns.querySelectorAll(
                ".trasa-nazwa"
            )
        );

    nazwy.forEach(
        el=>{
            el.classList.remove(
                "zawijaj"
            );
        }
    );

    nazwy.forEach(
        el=>{

            if(
                Math.ceil(
                    el.scrollWidth
                )>
                Math.ceil(
                    el.clientWidth
                )+1
            ){
                el.classList.add(
                    "zawijaj"
                );
            }
        }
    );
}
