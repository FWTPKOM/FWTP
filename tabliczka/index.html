const cacheNormalizacjiTekstu=
    new Map();

function normalizuj(tekst){

    const surowy=
        String(
            tekst||""
        );

    if(
        cacheNormalizacjiTekstu.has(
            surowy
        )
    ){
        return cacheNormalizacjiTekstu.get(
            surowy
        );
    }

    const wynik=
        surowy
            .trim()
            .toLocaleLowerCase(
                "pl-PL"
            )
            .replace(
                /\s+/g,
                " "
            );

    cacheNormalizacjiTekstu.set(
        surowy,
        wynik
    );

    return wynik;
}



function escapeHtml(tekst){

    return String(
        tekst??""
    )
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function ustawStatus(tekst){

    document
        .getElementById("status")
        .textContent=
            tekst;
}


function pokazBlad(tekst){

    ustawStatus(tekst);

    document
        .getElementById("wynik")
        .innerHTML=
            '<div class="blad">'+
            escapeHtml(tekst)+
            '</div>';
}




function dopasujSzerokoscNieKursuje(){

    const dni=
        Array.from(
            document.querySelectorAll(
                ".rozklady-grid .dzien"
            )
        );

    dni.forEach(
        dzien=>{

            const napis=
                dzien.querySelector(
                    ".nie-kursuje-napis"
                );

            if(!napis){
                return;
            }

            /*
               Najpierw zdejmujemy ewentualne wcześniejsze
               wymuszenie szerokości, żeby zmierzyć naturalny układ.
            */
            const poprzedniaSzerokosc=
                parseFloat(
                    dzien.style.width
                )||0;

            const poprzedniaMinSzerokosc=
                parseFloat(
                    dzien.style.minWidth
                )||0;

            /*
               Pole minut zaczyna się po 22 px kolumny godzin.
               Do szerokości napisu dokładamy po 8 px luzu
               z lewej i prawej strony.
            */
            const szerokoscNapisu=
                Math.ceil(
                    napis.scrollWidth
                );

            const potrzebnaSzerokosc=
                22+
                szerokoscNapisu+
                16;

            const aktualnaSzerokosc=
                Math.ceil(
                    dzien.getBoundingClientRect().width
                );

            const docelowa=
                Math.max(
                    aktualnaSzerokosc,
                    poprzedniaSzerokosc,
                    poprzedniaMinSzerokosc,
                    potrzebnaSzerokosc
                );

            dzien.style.width=
                docelowa+"px";

            dzien.style.minWidth=
                docelowa+"px";
        }
    );
}


function wyrownajSzerokoscWeekendow() {

    const dni = Array.from(
        document.querySelectorAll(
            ".rozklady-grid .dzien"
        )
    );

    const sobota = dni.find(d => {
        const t =
            (
                d.querySelector(
                    ".dzien-tytul"
                )?.textContent || ""
            )
            .trim()
            .toUpperCase();

        return t === "SOBOTA";
    });

    const swieto = dni.find(d => {
        const t =
            (
                d.querySelector(
                    ".dzien-tytul"
                )?.textContent || ""
            )
            .trim()
            .toUpperCase();

        return t === "ŚWIĘTO";
    });

    if(!sobota || !swieto){
        return;
    }

    /*
       Zdejmujemy wcześniejsze szerokości tylko na czas pomiaru.
    */
    [sobota, swieto].forEach(d => {
        d.style.width = "";
        d.style.minWidth = "";
    });

    const szerokoscNaturalnaSobota =
        Math.ceil(
            sobota.getBoundingClientRect().width
        );

    const szerokoscNaturalnaSwieto =
        Math.ceil(
            swieto.getBoundingClientRect().width
        );

    /*
       Jeżeli w którejś tabeli jest "NIE KURSUJE",
       tabela musi być na tyle szeroka, by napis zmieścił się
       w jednej linii w części minutowej.
    */
    function wymaganaSzerokoscNieKursuje(dzien){

        const napis =
            dzien.querySelector(
                ".nie-kursuje-napis"
            );

        if(!napis){
            return 0;
        }

        return (
            22 +
            Math.ceil(napis.scrollWidth) +
            16
        );
    }

    const wymaganaSobota =
        wymaganaSzerokoscNieKursuje(
            sobota
        );

    const wymaganaSwieto =
        wymaganaSzerokoscNieKursuje(
            swieto
        );

    /*
       Obie kolumny dostają DOKŁADNIE tę samą szerokość:
       większą z naturalnych / wymaganych szerokości + 8 px luzu.
    */
    const szerokosc =
        Math.max(
            szerokoscNaturalnaSobota,
            szerokoscNaturalnaSwieto,
            wymaganaSobota,
            wymaganaSwieto
        ) + 8;

    [sobota, swieto].forEach(d => {
        d.style.width = szerokosc + "px";
        d.style.minWidth = szerokosc + "px";
        d.style.maxWidth = szerokosc + "px";
    });
}
function ustawNaglowekTrasy(liczbaKolumn) {

    const head =
        document.querySelector(
            ".trasa-head"
        );

    if(!head){
        return;
    }

    const ile=
        Math.max(
            1,
            Math.min(
                3,
                Number(
                    liczbaKolumn
                )||1
            )
        );

    head.className=
        "trasa-head cols-"+
        ile;

    head.innerHTML=
        Array.from(
            {length:ile},
            ()=>(
                '<div class="trasa-head-label">'+
                'czasy, trasa, przystanki'+
                '</div>'
            )
        )
        .join("");
}


function dopasujKolumnyTrasy() {

    const tabliczka = document.querySelector(".tabliczka");
    const columns = document.querySelector(".trasa-columns");

    if (!tabliczka || !columns) return;

    const lista = listaTrasyDoWyswietlenia();
    if (!lista.length) return;

    const czasy = czasyTrasy();

    /*
       Jeżeli ten sam słupek jest obsługiwany w obu kierunkach,
       budujemy układ 3-kolumnowy:
       - 1. i 2. kolumna: aktualny kierunek,
       - 3. kolumna: drugi kierunek od bieżącego przystanku dalej.

       Dzięki temu nie pokazujemy w drugim kierunku przystanków,
       które pasażer ma już za sobą.
    */
    if(
        czyBiezacyPrzystanekDwukierunkowy()
    ){

        /*
         * =====================================================
         * JEDEN CIĄG TRASY
         * =====================================================
         */
        const listaAktualnego=
            lista.filter(
                element=>
                    element.index>=
                    aktualnyPrzystanek
            );

        const pierwszyIndex=
            listaAktualnego.length
                ? listaAktualnego[0].index
                : -1;

        const ostatniIndex=
            listaAktualnego.length
                ? listaAktualnego[
                    listaAktualnego.length-1
                ].index
                : -1;

        const htmlAktualnego=
            renderTrasaKolumna(
                {
                    start:0,
                    lista:listaAktualnego
                },
                czasy,
                pierwszyIndex,
                ostatniIndex,
                false
            );

        const parserAktualnego=
            document.createElement(
                "div"
            );

        parserAktualnego.innerHTML=
            htmlAktualnego;

        const wszystkieHtml=
            Array.from(
                parserAktualnego.querySelector(
                    ".trasa-lista"
                )?.children||
                []
            )
            .map(
                el=>el.outerHTML
            );

        const drugiHtml=
            renderElementyDrugiegoKierunkuTrasy();

        if(drugiHtml){

            const parserDrugiego=
                document.createElement(
                    "ul"
                );

            parserDrugiego.innerHTML=
                drugiHtml;

            Array.from(
                parserDrugiego.children
            )
            .forEach(
                el=>
                    wszystkieHtml.push(
                        el.outerHTML
                    )
            );
        }

        if(!wszystkieHtml.length){
            return;
        }


        /*
         * =====================================================
         * POMOCNICZY PODZIAŁ DLA N KOLUMN
         * =====================================================
         *
         * Działa tak samo jak zwykły 126:
         * wypełnia pierwszą kolumnę do samego dołu,
         * dopiero potem przechodzi do kolejnej.
         */
        const podziel=
            ileKolumn=>{

                tabliczka.classList.remove(
                    "trasa-2-kol",
                    "trasa-3-kol"
                );

                if(ileKolumn===2){
                    tabliczka.classList.add(
                        "trasa-2-kol"
                    );
                }
                else if(ileKolumn===3){
                    tabliczka.classList.add(
                        "trasa-3-kol"
                    );
                }

                columns.className=
                    "trasa-columns cols-"+
                    ileKolumn;

                ustawNaglowekTrasy(
                    ileKolumn
                );

                /*
                   Wszystko wkładamy tymczasowo do pierwszej kolumny.
                */
                columns.innerHTML=
                    '<div class="trasa-kol trasa-kol-pomiar">'+
                        '<ul class="trasa-lista">'+
                            wszystkieHtml.join("")+
                        '</ul>'+
                    '</div>'+
                    Array.from(
                        {
                            length:
                                Math.max(
                                    0,
                                    ileKolumn-1
                                )
                        },
                        ()=>(
                            '<div class="trasa-kol trasa-kol-pusta"></div>'
                        )
                    ).join("");

                /*
                   Tak samo jak przy 126: najpierw rzeczywiste
                   zawinięcie nazw, dopiero potem pomiar.
                */
                ustawZawijanieNazwTrasy(
                    columns
                );

                const kolumna=
                    columns.querySelector(
                        ".trasa-kol-pomiar"
                    );

                const dzieci=
                    Array.from(
                        kolumna?.querySelector(
                            ".trasa-lista"
                        )?.children||
                        []
                    );

                if(
                    !kolumna||
                    !dzieci.length
                ){
                    return null;
                }

                const styl=
                    getComputedStyle(
                        kolumna
                    );

                /*
                   Dokładnie jak w zwykłym podziale:
                   maxDol = top kolumny + wysokość dostępna.
                */
                const maxDol=
                    kolumna
                        .getBoundingClientRect()
                        .top+
                    columns.clientHeight-
                    parseFloat(
                        styl.paddingBottom||0
                    )-
                    2;

                const grupy=[
                    []
                ];

                let overflow=false;

                const dostepna=
                    columns.clientHeight-
                    parseFloat(
                        styl.paddingTop||0
                    )-
                    parseFloat(
                        styl.paddingBottom||0
                    )-
                    1;

                /*
                   Rzeczywista wysokość każdego elementu po zawinięciu.
                   Nie korzystamy już z jego absolutnej pozycji w jednej
                   długiej kolumnie.
                */
                const wysokosci=
                    dzieci.map(
                        dziecko=>{

                            const rect=
                                dziecko
                                    .getBoundingClientRect();

                            const css=
                                getComputedStyle(
                                    dziecko
                                );

                            return(
                                rect.height+
                                parseFloat(
                                    css.marginTop||0
                                )+
                                parseFloat(
                                    css.marginBottom||0
                                )
                            );
                        }
                    );

                let sumaKolumny=0;

                for(
                    let i=0;
                    i<dzieci.length;
                    i++
                ){

                    const dziecko=
                        dzieci[i];

                    const wysokosc=
                        Math.max(
                            0,
                            wysokosci[i]||0
                        );

                    /*
                       Jeśli to nagłówek wariantu, pilnujemy aby
                       razem z nim zmieścił się przynajmniej pierwszy
                       przystanek tej sekcji.
                    */
                    let wymagane=
                        wysokosc;

                    if(
                        dziecko
                            ?.classList
                            ?.contains(
                                "trasa-separator"
                            )&&
                        i+1<dzieci.length
                    ){
                        wymagane+=
                            Math.max(
                                0,
                                wysokosci[i+1]||0
                            );
                    }

                    if(
                        grupy[
                            grupy.length-1
                        ].length>0&&
                        sumaKolumny+
                            wymagane>
                            dostepna
                    ){

                        if(
                            grupy.length<
                            ileKolumn
                        ){
                            grupy.push(
                                []
                            );

                            sumaKolumny=0;
                        }
                        else{
                            overflow=true;
                        }
                    }

                    grupy[
                        grupy.length-1
                    ].push(
                        wszystkieHtml[i]
                    );

                    sumaKolumny+=
                        wysokosc;
                }

                /*
                   Po podziale sprawdzamy jeszcze każdą kolumnę
                   osobno, już z finalną zawartością.
                */
                columns.innerHTML=
                    grupy
                        .map(
                            grupa=>
                                '<div class="trasa-kol">'+
                                    '<ul class="trasa-lista">'+
                                        grupa.join("")+
                                    '</ul>'+
                                '</div>'
                        )
                        .join("");

                ustawZawijanieNazwTrasy(
                    columns
                );

                const kolumnyTest=
                    Array.from(
                        columns.querySelectorAll(
                            ".trasa-kol"
                        )
                    );

                for(
                    const kol
                    of kolumnyTest
                ){
                    if(
                        kol.scrollHeight>
                        columns.clientHeight+2
                    ){
                        overflow=true;
                        break;
                    }
                }

                return{
                    grupy,
                    overflow
                };
            };


        /*
         * Najpierw 2 kolumny – tak jak przy 126.
         */
        let wynik=
            podziel(
                2
            );

        let ileKolumn=2;

        /*
         * Trzecia dopiero jeżeli dwie naprawdę nie wystarczą.
         */
        if(
            !wynik||
            wynik.overflow
        ){
            wynik=
                podziel(
                    3
                );

            ileKolumn=3;
        }

        if(!wynik){
            return;
        }

        const grupy=
            wynik.grupy.filter(
                grupa=>
                    grupa.length
            );

        ileKolumn=
            Math.max(
                1,
                Math.min(
                    3,
                    grupy.length
                )
            );

        tabliczka.classList.remove(
            "trasa-2-kol",
            "trasa-3-kol"
        );

        if(ileKolumn===2){
            tabliczka.classList.add(
                "trasa-2-kol"
            );
        }
        else if(ileKolumn===3){
            tabliczka.classList.add(
                "trasa-3-kol"
            );
        }

        columns.className=
            "trasa-columns cols-"+
            ileKolumn;

        ustawNaglowekTrasy(
            ileKolumn
        );

        columns.innerHTML=
            grupy
                .map(
                    grupa=>
                        '<div class="trasa-kol">'+
                            '<ul class="trasa-lista">'+
                                grupa.join("")+
                            '</ul>'+
                        '</div>'
                )
                .join("");

        ustawZawijanieNazwTrasy(
            columns
        );

        return;
    }

    tabliczka.classList.remove(
        "trasa-3-kol"
    );

    const pierwszyIndexTrasy =
        lista.length
            ? lista[0].index
            : -1;

    const ostatniIndexTrasy =
        lista.length
            ? lista[lista.length - 1].index
            : -1;

    // Najpierw próbujemy wszystko w jednej kolumnie.
    tabliczka.classList.remove("trasa-2-kol");
    columns.className = "trasa-columns cols-1";
    ustawNaglowekTrasy(1);
    columns.innerHTML = renderTrasaKolumna(
        { start: 0, lista: lista },
        czasy,
        pierwszyIndexTrasy,
        ostatniIndexTrasy,
        true
    );

    ustawZawijanieNazwTrasy(columns);

    const jednaKolumna = columns.querySelector(".trasa-kol");
    const jednaLista = columns.querySelector(".trasa-lista");

    if (!jednaKolumna || !jednaLista) return;

    const style1 = getComputedStyle(jednaKolumna);
    const paddingY1 =
        parseFloat(style1.paddingTop || 0) +
        parseFloat(style1.paddingBottom || 0);

    const potrzebnaWysokosc =
        Math.ceil(jednaLista.getBoundingClientRect().height + paddingY1);

    const dostepnaWysokosc =
        Math.floor(columns.clientHeight);

    if (potrzebnaWysokosc <= dostepnaWysokosc) {
        return;
    }

    // Jeśli się nie mieści, przechodzimy na szeroki panel 2-kolumnowy.
    tabliczka.classList.add("trasa-2-kol");
    columns.className = "trasa-columns cols-2";
    ustawNaglowekTrasy(2);

    // Do pierwszej kolumny tymczasowo wkładamy wszystko,
    // aby sprawdzić ile kolejnych przystanków realnie się mieści.
    columns.innerHTML =
        renderTrasaKolumna(
            { start: 0, lista: lista },
            czasy,
            pierwszyIndexTrasy,
            ostatniIndexTrasy,
            true
        ) +
        '<div class="trasa-kol trasa-kol-pusta"></div>';

    ustawZawijanieNazwTrasy(columns);

    const pierwszaKolumna = columns.querySelector(".trasa-kol");
    const wiersze = Array.from(
        pierwszaKolumna?.querySelectorAll(".trasa-stop") || []
    );

    if (!pierwszaKolumna || !wiersze.length) return;

    const stylKolumny = getComputedStyle(pierwszaKolumna);
    const paddingBottom = parseFloat(stylKolumny.paddingBottom || 0);

    const maxDol =
        pierwszaKolumna.getBoundingClientRect().top +
        columns.clientHeight -
        paddingBottom;

    let ileSieMiesci = 0;

    for (const wiersz of wiersze) {
        const rect = wiersz.getBoundingClientRect();

        if (rect.bottom <= maxDol + 0.5) {
            ileSieMiesci++;
        } else {
            break;
        }
    }

    ileSieMiesci = Math.max(
        1,
        Math.min(
            ileSieMiesci,
            lista.length - 1
        )
    );

    const pierwszaLista = lista.slice(0, ileSieMiesci);
    const drugaLista = lista.slice(ileSieMiesci);

    // Pierwsza kolumna = maksymalnie dużo przystanków.
    // Druga kolumna = wyłącznie te, które się nie zmieściły.
    columns.innerHTML =
        renderTrasaKolumna(
            {
                start: 0,
                lista: pierwszaLista
            },
            czasy,
            pierwszyIndexTrasy,
            ostatniIndexTrasy,
            false
        ) +
        renderTrasaKolumna(
            {
                start: ileSieMiesci,
                lista: drugaLista
            },
            czasy,
            pierwszyIndexTrasy,
            ostatniIndexTrasy,
            true
        );

    ustawZawijanieNazwTrasy(columns);
}






function ustawZawijanieNazwTrasy(columns){

    if(!columns){
        return;
    }

    /*
       Każda nazwa jest oceniana osobno:
       - jeśli mieści się w jednej linii -> pozostaje bez zawijania,
       - jeśli się nie mieści -> tylko ta nazwa dostaje zawijanie.
    */
    const nazwy=
        Array.from(
            columns.querySelectorAll(
                ".trasa-nazwa"
            )
        );

    nazwy.forEach(
        el=>{
            el.classList.remove(
                "zawijaj"
            );
        }
    );

    nazwy.forEach(
        el=>{

            if(
                Math.ceil(
                    el.scrollWidth
                )>
                Math.ceil(
                    el.clientWidth
                )+1
            ){
                el.classList.add(
                    "zawijaj"
                );
            }
        }
    );
}
