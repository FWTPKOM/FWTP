function grupujGodziny(kursy){

    const mapa=new Map();

    kursy.forEach(
        kurs=>{

            const c=
                rozbijCzas(
                    kurs.czas
                );

            if(!c)return;

            const h=
                c.godzina%24;

            if(!mapa.has(h)){
                mapa.set(h,[]);
            }

            mapa.get(h).push({
                minuta:c.minuta,
                kurs
            });
        }
    );

    return mapa;
}



function wspolneGodzinyDlaGrup(grupy){

    const godziny=
        new Set();

    (
        grupy||
        []
    ).forEach(
        grupa=>{

            const kursy=
                pobierzKursyDlaSymbolu(
                    grupa.symbol
                );

            const mapa=
                grupujGodziny(
                    kursy
                );

            mapa.forEach(
                (wartosc,h)=>{
                    godziny.add(
                        Number(h)
                    );
                }
            );
        }
    );

    if(!godziny.size){
        return[];
    }

    /*
       Godziny traktujemy w kolejności komunikacyjnej:
       4, 5, 6 ... 23, 0, 1, 2, 3.

       Najważniejsza zmiana:
       tworzymy PEŁNY zakres od pierwszej do ostatniej godziny,
       a nie tylko godziny, w których faktycznie występują kursy.

       Przykład:
       kursy są o 6,7,8,9 oraz 14,15,...20
       => tabela dostanie również puste wiersze:
          10, 11, 12, 13.
    */

    const przesunieta=
        [...godziny]
            .map(
                h=>
                    h<4
                        ? h+24
                        : h
            )
            .sort(
                (a,b)=>a-b
            );

    const pierwsza=
        przesunieta[0];

    const ostatnia=
        przesunieta[
            przesunieta.length-1
        ];

    const wynik=[];

    for(
        let h=pierwsza;
        h<=ostatnia;
        h++
    ){
        wynik.push(
            h%24
        );
    }

    return wynik;
}


function renderDzien(grupa,wspolneGodziny){

    const kursy=
        pobierzKursyDlaSymbolu(
            grupa.symbol
        );

    const mapa=
        grupujGodziny(
            kursy
        );

    const godziny=
        Array.isArray(
            wspolneGodziny
        )&&
        wspolneGodziny.length
            ? wspolneGodziny
            : [
                ...mapa.keys()
            ];

    let body="";

    /*
       Cały typ dnia bez żadnego kursu:
       - tyle samo wierszy co pozostałe tabele,
       - bez numerów godzin,
       - bez minut,
       - zostaje pionowy podział godziny/minuty,
       - na środku części minutowej: NIE KURSUJE.
    */
    if(
        kursy.length===0&&
        godziny.length
    ){

        const pusteWiersze=
            godziny
                .map(
                    ()=>(
                        '<div class="godzina-row godzina-row-nie-kursuje">'+
                        '<div class="godzina-cell"></div>'+
                        '<div class="minuty-cell"></div>'+
                        '</div>'
                    )
                )
                .join("");

        body=
            '<div class="nie-kursuje-body">'+
            pusteWiersze+
            '<div class="nie-kursuje-napis">NIE KURSUJE</div>'+
            '</div>';
    }
    else if(!godziny.length){

        body=
            '<div class="brak">Brak kursów</div>';
    }
    else{

        body=
            godziny
                .map(
                    h=>{

                        /*
                           Brak kursu tylko w konkretnej godzinie:
                           normalny pusty wiersz, żeby wszystkie
                           tabele pozostały wyrównane.
                        */
                        if(!mapa.has(h)){

                            return(
                                '<div class="godzina-row godzina-row-pusta">'+
                                '<div class="godzina-cell"></div>'+
                                '<div class="minuty-cell"></div>'+
                                '</div>'
                            );
                        }

                        const minuty=
                            mapa.get(h)
                                .map(
                                    item=>({
                                        ...item,
                                        sym:
                                            String(
                                                symbolWariantu(
                                                    item.kurs,
                                                    grupa.symbol
                                                )||""
                                            )
                                            .toLowerCase()
                                    })
                                )
                                .sort(
                                    (a,b)=>
                                        Number(a.minuta)-
                                        Number(b.minuta)||
                                        a.sym.localeCompare(
                                            b.sym,
                                            "pl"
                                        )
                                )
                                .map(
                                    item=>(
                                        '<span class="minuta">'+
                                        escapeHtml(
                                            item.minuta
                                        )+
                                        (
                                            item.sym
                                                ? '<span class="symbol">'+
                                                  escapeHtml(
                                                      item.sym
                                                  )+
                                                  '</span>'
                                                : ''
                                        )+
                                        '</span>'
                                    )
                                )
                                .join("");

                        return(
                            '<div class="godzina-row">'+
                            '<div class="godzina-cell">'+
                            h+
                            '</div>'+
                            '<div class="minuty-cell">'+
                            minuty+
                            '</div>'+
                            '</div>'
                        );
                    }
                )
                .join("");
    }

    return(
        '<section class="dzien">'+
        '<div class="dzien-tytul">'+
        escapeHtml(
            grupa.tytul
        )+
        '</div>'+
        '<div class="godziny-head">'+
        '<div>Godz.</div>'+
        '<div>Minuty</div>'+
        '</div>'+
        body+
        '</section>'
    );
}

function __bezCache_znajdzNajlepszyKursDoTrasy(){

    const baza=
        kierunekBazowy();

    const lista=
        baza?.przystanki||
        [];

    const start=
        lista[
            aktualnyPrzystanek
        ];

    if(!start)return null;

    const startElement={
        p:start,
        index:
            aktualnyPrzystanek
    };

    const kandydaci=
        new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            /*
               KLUCZOWA POPRAWKA:
               nie szukamy już pierwszego przystanku o tej samej
               nazwie i numerze.

               Szukamy dokładnie TEGO wystąpienia, które zostało
               wybrane w URL / select:
                   kierunek=1
                   przystanek=idx:5

               To jest konieczne np. dla linii 170, gdzie
               PKP ZACISZE-WILNO 02 może wystąpić więcej niż raz
               w strukturze kierunku, ale każde wystąpienie należy
               do innego przebiegu.
            */
            const p=
                znajdzPrzystanekWRozkladzieDlaElementu(
                    rozklad,
                    aktualnyKierunek,
                    startElement
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        czasNaMinuty(
                            kurs.czas
                        )===null
                    ){
                        return;
                    }

                    const key=
                        kluczKursu(kurs);

                    if(!kandydaci.has(key)){

                        kandydaci.set(
                            key,
                            {
                                key,
                                numer:String(
                                    kurs.numer||""
                                ),
                                wariant:String(
                                    kurs.wariant||""
                                ),
                                start:
                                    czasNaMinuty(
                                        kurs.czas
                                    ),
                                count:0
                            }
                        );
                    }
                }
            );
        }
    );

    kandydaci.forEach(
        kandydat=>{

            for(
                let i=
                    aktualnyPrzystanek;
                i<lista.length;
                i++
            ){

                if(
                    znajdzCzasKursuNaPrzystanku(
                        kandydat,
                        lista[i],
                        i
                    )!==null
                ){
                    kandydat.count++;
                }
            }
        }
    );

    return[
        ...kandydaci.values()
    ].sort(
        (a,b)=>
            b.count-a.count||
            a.start-b.start
    )[0]||null;
}

function znajdzCzasKursuNaPrzystanku(
    kandydat,
    bazaP,
    bazaIndex=null
){

    for(
        const rozklad of
        (
            daneLinii?.rozkłady||
            []
        )
    ){

        let p=null;

        if(
            Number.isInteger(
                Number(
                    bazaIndex
                )
            )
        ){

            p=
                znajdzPrzystanekWRozkladzieDlaElementu(
                    rozklad,
                    aktualnyKierunek,
                    {
                        p:bazaP,
                        index:Number(
                            bazaIndex
                        )
                    }
                );
        }
        else{

            /*
               Stary fallback pozostaje dla pozostałych miejsc kodu,
               które nie mają informacji o indeksie wystąpienia.
            */
            p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    aktualnyKierunek,
                    bazaP
                );
        }

        const kurs=
            (
                p?.kursy||
                []
            ).find(
                k=>
                    String(
                        k.numer||""
                    )===
                        kandydat.numer&&
                    String(
                        k.wariant||""
                    )===
                        kandydat.wariant&&
                    czasNaMinuty(
                        k.czas
                    )!==null
            );

        if(kurs){
            return czasNaMinuty(
                kurs.czas
            );
        }
    }

    return null;
}


function __bezCache_czasyTrasy(){

    const baza=
        kierunekBazowy();

    const lista=
        baza?.przystanki||
        [];

    const kandydat=
        znajdzNajlepszyKursDoTrasy();

    const wynik=
        new Array(
            lista.length
        ).fill(null);

    if(!kandydat){
        return wynik;
    }

    const start=
        znajdzCzasKursuNaPrzystanku(
            kandydat,
            lista[
                aktualnyPrzystanek
            ],
            aktualnyPrzystanek
        );

    if(start===null){
        return wynik;
    }

    for(
        let i=
            aktualnyPrzystanek;
        i<lista.length;
        i++
    ){

        let t=
            znajdzCzasKursuNaPrzystanku(
                kandydat,
                lista[i],
                i
            );

        if(t===null)continue;

        while(t<start){
            t+=1440;
        }

        wynik[i]=
            t-start;
    }

    return wynik;
}

function statystykaKursowPrzystankuTrasy(p){

    const normalne=
        new Set();

    const skrocone=
        new Set();

    (
        p?.kursy||
        []
    ).forEach(
        kurs=>{

            if(
                czasNaMinuty(
                    kurs?.czas
                )===null
            ){
                return;
            }

            const klucz=[
                String(
                    kurs?.numer||""
                ).trim(),
                String(
                    kurs?.wariant||""
                ).trim(),
                String(
                    kurs?.uwagi||""
                ).trim(),
                String(
                    kurs?.brygada||""
                ).trim()
            ].join("|");

            if(
                czyKursSkroconyDlaListyTrasy(
                    kurs
                )
            ){
                skrocone.add(
                    klucz
                );
            }
            else{
                normalne.add(
                    klucz
                );
            }
        }
    );

    return{
        normalne:
            normalne.size,
        skrocone:
            skrocone.size
    };
}


function usunDuplikatyTylkoOdKursowSkroconych(lista){

    const wynik=[];

    let i=0;

    while(i<lista.length){

        const nazwa=
            normalizuj(
                lista[i]?.p?.nazwa
            );

        let j=i+1;

        /*
           Interesują nas tylko KOLEJNE wystąpienia dokładnie
           tej samej nazwy przystanku.
        */
        while(
            j<lista.length&&
            normalizuj(
                lista[j]?.p?.nazwa
            )===nazwa
        ){
            j++;
        }

        const grupa=
            lista.slice(
                i,
                j
            );

        if(grupa.length===1){

            wynik.push(
                grupa[0]
            );

            i=j;
            continue;
        }

        const zeStatystykami=
            grupa.map(
                element=>({
                    element,
                    stat:
                        statystykaKursowPrzystankuTrasy(
                            element.p
                        )
                })
            );

        const zNormalnymi=
            zeStatystykami.filter(
                x=>
                    x.stat.normalne>0
            );

        /*
           Usuwamy powtórzenie TYLKO w bezpiecznym przypadku:

           - dokładnie jedno wystąpienie tej nazwy jest używane
             przez normalne / pełne kursy,
           - pozostałe wystąpienia mają wyłącznie kursy skrócone.

           Przykład linii 192:
           URSYNÓW PŁD. dla kursu skróconego +
           URSYNÓW PŁD. dla normalnych kursów do OS. KABATY

           => zostaje tylko ten drugi, normalny przystanek.

           Jeśli dwa przystanki o tej samej nazwie są rzeczywiście
           używane przez normalne kursy, NICZEGO nie łączymy.
        */
        if(
            zNormalnymi.length===1&&
            zeStatystykami.every(
                x=>
                    x===zNormalnymi[0]||
                    (
                        x.stat.normalne===0&&
                        x.stat.skrocone>0
                    )
            )
        ){
            wynik.push(
                zNormalnymi[0].element
            );
        }
        else{

            /*
               Nietypowy / niejednoznaczny przypadek:
               zachowujemy wszystkie wiersze, żeby nie usuwać
               prawdziwych dwóch różnych przystanków o tej samej nazwie.
            */
            grupa.forEach(
                element=>
                    wynik.push(
                        element
                    )
            );
        }

        i=j;
    }

    return wynik;
}


function __bezCache_listaPelnejTrasyDoWyswietlenia(){

    const baza=
        kierunekBazowy();

    const lista=
        baza?.przystanki||
        [];

    if(!lista.length){
        return[];
    }

    const bezTech=
        lista
            .map(
                (p,index)=>({
                    p,
                    index,
                    typ:typPrzystankuTrasy(p)
                })
            )
            .filter(
                x=>x.typ!=="TECH"
            );

    if(!bezTech.length){
        return[];
    }

    if(
        bezTech.length>=2&&
        bezTech[
            bezTech.length-2
        ].typ==="WYS"
    ){
        bezTech.pop();
    }

    const gotowaLista=
        bezTech.map(
            x=>({
                p:x.p,
                index:x.index
            })
        );

    /*
       Na końcu usuwamy tylko sztuczne podwójne wystąpienia
       powstałe przez osobny kraniec kursu skróconego.
    */
    return usunDuplikatyTylkoOdKursowSkroconych(
        gotowaLista
    );
}

function czyWariantTrasyPrzez(litera){

    const opis=
        mapaWariantow()
            .get(
                String(
                    litera||""
                ).trim()
            )||
        "";

    const tekst=
        String(opis);

    /*
       Do oznaczania ODCINKÓW WARIANTOWYCH na liście przystanków
       bierzemy tylko kursy jadące przez dodatkowe przystanki.

       WAŻNE:
       "kurs bez podjazdów" jest przebiegiem podstawowym,
       a NIE wariantem trasy.

       Nie mieszamy też:
       - kursów skróconych,
       - kursów wydłużonych,
       - kursów do zajezdni,
       - "tylko do ...".
    */
    if(
        /bez\s+podjazd/i.test(
            tekst
        )
    ){
        return false;
    }

    return(
        /przez|podjazd/i.test(
            tekst
        )&&
        !/skrócon|wydłuż|zajezdni|tylko do/i.test(
            tekst
        )
    );
}

    return !kursMaPrzystanek(

                        ).trim(),
                        symbol:grupa.symbol,
                        brygada:String(
                            kurs?.brygada||""
                        ).trim(),
                        _kierunekIndex:
                            Number(
                                kurs?._kierunekIndex
                            )
                    };

                    /*
                       Kurs rozpoczynający się dopiero w środku trasy
                       pomijamy przy analizie wariantów.
                    */
                    if(
                        czyKursZaczynaWSrodkuTrasy(
                            kursRef
                        )
                    ){
                        return;
                    }

                    if(
                        !wynik.has(key)
                    ){
                        wynik.set(
                            key,
                            kursRef
                        );
                    }
                }
            );
        }
    );

    return[
        ...wynik.values()
    ];
}

function kursMaPrzystanek(
    kursRef,
    element
){

    if(
        !kursRef||
        !element?.p
    ){
        return false;
    }

    const kierunekIndex=
        Number.isInteger(
            kursRef?._kierunekIndex
        )
            ? kursRef._kierunekIndex
            : aktualnyKierunek;

    for(
        const rozklad of
        (
            daneLinii?.rozkłady||
            []
        )
    ){

        const p=
            znajdzPrzystanekWRozkladzieDlaElementu(
                rozklad,
                kierunekIndex,
                element
            );

        const jest=
            (
                p?.kursy||
                []
            ).some(
                k=>
                    String(
                        k?.numer||""
                    )===
                        String(
                            kursRef?.numer||""
                        )&&
                    String(
                        k?.wariant||""
                    ).trim()===
                        String(
                            kursRef?.wariant||""
                        ).trim()&&
                    symbolDnia(k)===
                        kursRef.symbol&&
                    (
                        !String(
                            kursRef?.brygada||""
                        ).trim()||
                        String(
                            k?.brygada||""
                        ).trim()===
                            String(
                                kursRef?.brygada||""
                            ).trim()
                    )&&
                    czasNaMinuty(
                        k?.czas
                    )!==null
            );

        if(jest){
            return true;
        }
    }

    return false;
}



function ostatniIndexKursuNaPelnejTrasie(kursRef){

    const pelna=
        listaPelnejTrasyDoWyswietlenia();

    let ostatni=-1;

    pelna.forEach(
        element=>{

            if(
                kursMaPrzystanek(
                    kursRef,
                    element
                )
            ){
                ostatni=
                    Math.max(
                        ostatni,
                        Number(
                            element.index
                        )
                    );
            }
        }
    );

    return ostatni;
}


function bazowyKoniecPelnychKursow(){

    let max=-1;

    dostepneGrupyDni()
        .slice(0,3)
        .forEach(
            grupa=>{

                pobierzKursyDlaSymbolu(
                    grupa.symbol
                )
                .forEach(
                    kurs=>{

                        if(
                            czyBiezacyPrzystanekDwukierunkowy()&&
                            Number(
                                kurs?._kierunekIndex
                            )!==
                            Number(
                                aktualnyKierunek
                            )
                        ){
                            return;
                        }

                        const opis=
                            String(
                                mapaWariantow()
                                    .get(
                                        String(
                                            kurs?.wariant||""
                                        ).trim()
                                    )||
                                ""
                            );

                        if(
                            /skrócon|wydłuż|zajezdni|tylko do/i
                                .test(opis)
                        ){
                            return;
                        }

                        const ref={
                            numer:String(
                                kurs?.numer||""
                            ),
                            wariant:String(
                                kurs?.wariant||""
                            ).trim(),
                            symbol:grupa.symbol,
                            brygada:String(
                                kurs?.brygada||""
                            ).trim(),
                            _kierunekIndex:
                                Number(
                                    kurs?._kierunekIndex
                                )
                        };

                        if(
                            czyKursZaczynaWSrodkuTrasy(
                                ref
                            )
                        ){
                            return;
                        }

                        max=
                            Math.max(
                                max,
                                ostatniIndexKursuNaPelnejTrasie(
                                    ref
                                )
                            );
                    }
                );
            }
        );

    return max;
}


function czyKursPomijanyPrzyTrasie(kurs){

    const litera=
        String(
            kurs?.wariant||""
        ).trim();

    const opis=
        String(
            mapaWariantow()
                .get(litera)||
            ""
        );

    /*
       W specjalnym układzie dwóch kierunków analizujemy rzeczywiste
       przebiegi WSZYSTKICH kursów wychodzących z bieżącego słupka.

       To jest potrzebne np. dla 170:
       - e kończy na PKP ZACISZE-WILNO,
       - l jedzie dalej do ELSNEROWA.

       Kursy zaczynające się dopiero w środku trasy są już wcześniej
       odrzucane przez czyKursZaczynaWSrodkuTrasy(), więc nie tworzą
       fałszywych gałęzi.
    */
    if(
        czyBiezacyPrzystanekDwukierunkowy()
    ){
        return(
            /zajezdni|tylko do/i
                .test(opis)
        );
    }

    /*
       Zwykły układ pozostaje bez zmian — kursów skróconych
       nie mieszamy do opisów wariantów trasy.
    */
    if(
        /skrócon|zajezdni|tylko do/i
            .test(opis)
    ){
        return true;
    }

    if(
        /wydłuż/i.test(opis)
    ){

        const koniecKursu=
            ostatniIndexKursuNaPelnejTrasie(
                kurs
            );

        const koniecBazowy=
            bazowyKoniecPelnychKursow();

        return(
            koniecBazowy>=0&&
            koniecKursu>
            koniecBazowy
        );
    }

    return false;
}


function __bezCache_grupyPrzebiegowTrasy(){

    const wszystkie=
        kursyAktualnegoRozkladuDoTrasy();

    /*
       Grupujemy kursy według litery wariantu.
       WAŻNE:
       "a - kurs bez podjazdów" też jest pełnoprawnym przebiegiem
       przy porównywaniu odcinków. Nie traktujemy go jako "wariantu"
       w sensie dodatkowego opisu, ale musi brać udział w ustalaniu:
       - które kursy jadą przez konkretny przystanek,
       - kiedy wszystkie przebiegi ponownie się łączą.

       Dzięki temu np. PKP ŻERAŃ może poprawnie dostać:
       "Trasa w kursach „a”, „o”".
    */
    const grupy=
        new Map();

    wszystkie.forEach(
        kurs=>{

            if(
                czyKursPomijanyPrzyTrasie(
                    kurs
                )
            ){
                return;
            }

            const oryginalnaLitera=
                String(
                    kurs?.wariant||""
                ).trim();

            const literaPoTrasie=
                literaWariantuPoRzeczywistymPrzebiegu(
                    kurs
                );

            const literaKanoniczna=
                literaPoTrasie
                    ? kanonicznaLiteraWariantu(
                        literaPoTrasie
                    )
                    : "";

            /*
               KLUCZOWA ZASADA:
               lista przystanków używa tej samej reguły widoczności
               wariantów co oznaczenia przy minutach.

               Przebieg A nadal pozostaje osobnym przebiegiem
               do analizy trasy, ale jego litera jest ukryta,
               gdy linia.html również jej nie pokazuje
               (czyli przy 1-3 wariantach w kierunku).

               Dzięki temu np. przy linii 192:
               - przy minutach nie ma "a",
               - na liście przystanków również nie pojawi się
                 "Trasa w kursach „a”".
            */
            const literaWidoczna=
                (
                    literaPoTrasie&&
                    czyPokazacWariantJakLiniaHTML(
                        literaPoTrasie
                    )
                )
                    ? literaKanoniczna
                    : "";

            /*
               Do rozdzielenia rzeczywistych przebiegów używamy
               oryginalnej/kanonicznej litery, nawet gdy jej nie
               pokazujemy użytkownikowi.
            */
            const key=
                literaKanoniczna||
                (
                    literaPoTrasie
                        ? literaPoTrasie.toUpperCase()
                        : (
                            oryginalnaLitera
                                ? oryginalnaLitera.toUpperCase()
                                : "__PODSTAWOWY__"
                        )
                );

            if(
                !grupy.has(key)
            ){
                grupy.set(
                    key,
                    {
                        litera:literaWidoczna,
                        kursy:[]
                    }
                );
            }

            grupy
                .get(key)
                .kursy
                .push(kurs);
        }
    );

    return grupy;
}

function wybierzNajdluzszyKurs(
    listaKursow
){

    /*
       WAŻNE:
       tutaj używamy PEŁNEJ trasy kierunku, a nie finalnej listy
       tabliczki.

       Finalna lista sama zależy od stanTrasyNaPrzystanku(),
       a stanTrasyNaPrzystanku() zależy od wyboru najdłuższego kursu.
       Użycie listaTrasyDoWyswietlenia() tworzyło więc rekurencję:

       listaTrasyDoWyswietlenia
       -> stanTrasyNaPrzystanku
       -> danePrzebiegowWariantowych
       -> wybierzNajdluzszyKurs
       -> listaTrasyDoWyswietlenia
       -> ...

       i kończyło się "Maximum call stack size exceeded".

       Pełna lista jest właściwą podstawą do porównania długości
       kursów i nie zmienia zasad wyboru przebiegu.
    */
    const pelna=
        listaPelnejTrasyDoWyswietlenia();

    let najlepszy=null;
    let max=-1;

    (
        listaKursow||
        []
    ).forEach(
        kurs=>{

            let licznik=0;

            pelna.forEach(
                element=>{

                    if(
                        kursMaPrzystanek(
                            kurs,
                            element
                        )
                    ){
                        licznik++;
                    }
                }
            );

            if(licznik>max){
                max=licznik;
                najlepszy=kurs;
            }
        }
    );

    return najlepszy;
}

function stanTrasyNaPrzystanku(element){

    const przebiegi=
        danePrzebiegowWariantowych();

    if(!przebiegi.length){
        return{
            typ:"wszystkie",
            litery:[]
        };
    }

    const jadace=
        przebiegi.filter(
            przebieg=>
                kursMaPrzystanek(
                    przebieg.kurs,
                    element
                )
        );

    /*
       Jeżeli przez dany przystanek jadą WSZYSTKIE pełne przebiegi,
       jest to wspólna trasa.
    */
    if(
        jadace.length===
        przebiegi.length
    ){
        return{
            typ:"wszystkie",
            litery:
                jadace
                    .map(
                        x=>x.litera
                    )
                    .filter(Boolean)
        };
    }

    /*
       Jeżeli przystanek obsługuje tylko część pełnych przebiegów,
       pokazujemy dokładnie te litery.

       Przykłady dla 126:
       - PŁYTOWA / KUPIECKA -> np. „l”, „p”
       - PKP ŻERAŃ -> „a”, „o”

       Kurs skrócony "b" nie bierze tu udziału.
    */
    const litery=
        jadace
            .map(
                x=>x.litera
            )
            .filter(Boolean);

    if(litery.length){
        return{
            typ:"wariant",
            litery
        };
    }

    /*
       Jeżeli został tylko przebieg bez WIDOCZNEJ litery
       (np. A ukryte przy 1-3 wariantach), nie tworzymy
       nagłówka "Trasa w kursach".

       Ta sama litera jest więc ukryta zarówno:
       - przy minutach,
       - w legendzie,
       - na liście przystanków.
    */
    if(jadace.length){
        return{
            typ:"podstawowa",
            litery:[]
        };
    }

    return{
        typ:"inne",
        litery:[]
    };
}


function kluczStanuTrasy(stan){

    if(!stan){
        return"";
    }

    return(
        stan.typ+
        ":"+
        (
            stan.litery||
            []
        )
        .slice()
        .sort()
        .join(",")
    );
}


function naglowekZmianyTrasy(
    poprzedni,
    aktualny
){

    if(!aktualny){
        return"";
    }

    const poprzedniKlucz=
        kluczStanuTrasy(
            poprzedni
        );

    const aktualnyKlucz=
        kluczStanuTrasy(
            aktualny
        );

    if(
        poprzedniKlucz===
        aktualnyKlucz
    ){
        return"";
    }

    if(
        aktualny.typ==="wariant"&&
        aktualny.litery.length
    ){

        const litery=
            aktualny.litery
                .map(
                    litera=>
                        "„"+
                        escapeHtml(
                            String(litera)
                                .toLowerCase()
                        )+
                        "”"
                )
                .join(", ");

        return(
            '<li class="trasa-separator">'+
            '<span class="trasa-separator-title">'+
            'Trasa w kursach '+
            litery+
            '</span>'+
            '</li>'
        );
    }

    /*
       Po odcinku wariantowym napis "Trasa we wszystkich kursach"
       pojawia się dopiero wtedy, gdy faktycznie wszystkie przebiegi
       wracają na wspólną trasę.
    */
    if(
        poprzedni&&
        poprzedni.typ==="wariant"&&
        aktualny.typ==="wszystkie"
    ){
        return(
            '<li class="trasa-separator">'+
            '<span class="trasa-separator-title">'+
            'Trasa we wszystkich kursach'+
            '</span>'+
            '</li>'
        );
    }

    return"";
}


function czasDowolnegoKursuNaPrzystanku(
    element
){

    const listaStartowa=
        kursyAktualnegoRozkladuDoTrasy();

    const baza=
        kierunekBazowy();

    const startP=
        baza?.przystanki?.[
            aktualnyPrzystanek
        ];

    if(
        !startP||
        !element?.p
    ){
        return null;
    }

    const wyniki=[];

    listaStartowa.forEach(
        kursRef=>{

            let start=null;
            let koniec=null;

            for(
                const rozklad of
                (
                    daneLinii?.rozkłady||
                    []
                )
            ){

                const pStart=
                    znajdzPrzystanekWRozkladzieDlaElementu(
                        rozklad,
                        aktualnyKierunek,
                        {
                            p:startP,
                            index:
                                aktualnyPrzystanek
                        }
                    );

                const kStart=
                    (
                        pStart?.kursy||
                        []
                    ).find(
                        k=>
                            String(
                                k?.numer||""
                            )===
                                kursRef.numer&&
                            String(
                                k?.wariant||""
                            ).trim()===
                                kursRef.wariant&&
                            symbolDnia(k)===
                                kursRef.symbol&&
                            czasNaMinuty(
                                k?.czas
                            )!==null
                    );

                if(kStart){
                    start=
                        czasNaMinuty(
                            kStart.czas
                        );
                }

                const pKoniec=
                    znajdzPrzystanekWRozkladzieDlaElementu(
                        rozklad,
                        aktualnyKierunek,
                        element
                    );

                const kKoniec=
                    (
                        pKoniec?.kursy||
                        []
                    ).find(
                        k=>
                            String(
                                k?.numer||""
                            )===
                                kursRef.numer&&
                            String(
                                k?.wariant||""
                            ).trim()===
                                kursRef.wariant&&
                            symbolDnia(k)===
                                kursRef.symbol&&
                            czasNaMinuty(
                                k?.czas
                            )!==null
                    );

                if(kKoniec){
                    koniec=
                        czasNaMinuty(
                            kKoniec.czas
                        );
                }
            }

            if(
                start!==null&&
                koniec!==null
            ){

                let roznica=
                    koniec-start;

                while(roznica<0){
                    roznica+=1440;
                }

                wyniki.push(
                    roznica
                );
            }
        }
    );

    if(!wyniki.length){
        return null;
    }

    /*
       Jeżeli kilka kursów daje czas dla tego samego przystanku,
       bierzemy najmniejszy poprawny czas przejazdu.
    */
    return Math.min(
        ...wyniki
    );
}

function __bezCache_daneTrasWydluzonych(){

    const pelna=
        listaPelnejTrasyDoWyswietlenia();

    if(!pelna.length){
        return{
            baza:[],
            wydluzenia:[]
        };
    }

    const wydluzone=
        literyWydluzonychWariantow();

    if(!wydluzone.size){
        return{
            baza:pelna,
            wydluzenia:[]
        };
    }

    let koniecBazy=
        pelna.length-1;

    let znalezionoKoniec=false;

    for(
        let i=pelna.length-1;
        i>=0;
        i--
    ){
        const warianty=
            wariantyNaPrzystanku(
                pelna[i]
            );

        const maKursPodstawowy=
            [...warianty].some(
                litera=>
                    !wydluzone.has(
                        String(litera||"")
                            .trim()
                    )
            );

        if(maKursPodstawowy){
            koniecBazy=i;
            znalezionoKoniec=true;
            break;
        }
    }

    if(!znalezionoKoniec){
        return{
            baza:pelna,
            wydluzenia:[]
        };
    }

    const baza=
        pelna.slice(
            0,
            koniecBazy+1
        );

    const ogon=
        pelna.slice(
            koniecBazy+1
        );

    const wydluzenia=[];

    wydluzone.forEach(
        litera=>{

            const przystanki=
                ogon.filter(
                    element=>
                        wariantyNaPrzystanku(
                            element
                        ).has(litera)
                );

            if(przystanki.length){
                wydluzenia.push({
                    litera,
                    przystanki
                });
            }
        }
    );

    return{
        baza,
        wydluzenia
    };
}

function kluczeKursowDokladnegoElementuTrasy(
    element
){

    const wynik=
        new Set();

    if(!element?.p){
        return wynik;
    }

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        (rozklad,rozkladIndex)=>{

            const p=
                znajdzPrzystanekWRozkladzieDlaElementu(
                    rozklad,
                    aktualnyKierunek,
                    element
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        czasNaMinuty(
                            kurs?.czas
                        )===null
                    ){
                        return;
                    }

                    /*
                       rozkladIndex jest częścią klucza.
                       Dwa kursy o tym samym numerze, wariancie i brygadzie
                       z dwóch różnych bloków rozkładowych nie mogą zostać
                       przypadkowo uznane za ten sam kurs.
                    */
                    wynik.add(
                        [
                            rozkladIndex,
                            String(
                                kurs?.numer||""
                            ).trim(),
                            String(
                                kurs?.wariant||""
                            ).trim(),
                            symbolDnia(kurs),
                            String(
                                kurs?.brygada||""
                            ).trim()
                        ].join("|")
                    );
                }
            );
        }
    );

    return wynik;
}


function istniejeKursLaczacyDokladneElementy(
    pierwszy,
    drugi
){

    const a=
        kluczeKursowDokladnegoElementuTrasy(
            pierwszy
        );

    const b=
        kluczeKursowDokladnegoElementuTrasy(
            drugi
        );

    if(
        !a.size||
        !b.size
    ){
        return false;
    }

    for(
        const key
        of a
    ){
        if(
            b.has(key)
        ){
            return true;
        }
    }

    return false;
}



function istniejeKursOdDokladnegoAktywnegoDoPrzystanku(
    aktywnyElement,
    przyszlyElement
){

    if(
        !aktywnyElement?.p||
        !przyszlyElement?.p
    ){
        return false;
    }

    /*
       Kursy bierzemy DOKŁADNIE z aktywnego wystąpienia.
       To nadal rozróżnia np. dwa przystanki o tej samej nazwie.
    */
    const aktywneKursy=
        kluczeKursowDokladnegoElementuTrasy(
            aktywnyElement
        );

    if(!aktywneKursy.size){
        return false;
    }

    /*
       Dla przyszłego przystanku najpierw próbujemy dokładnego
       elementu. Jeżeli złożona oś wariantów ma inny indeks,
       robimy bezpieczny fallback po realnym przystanku
       (nazwa + numer) z rozkładu.
    */
    const przyszleDokladne=
        kluczeKursowDokladnegoElementuTrasy(
            przyszlyElement
        );

    for(
        const key
        of aktywneKursy
    ){
        if(
            przyszleDokladne.has(
                key
            )
        ){
            return true;
        }
    }

    /*
       Fallback:
       kluczeKursowNaPrzystanku() nie używa pozycji na złożonej osi,
       tylko rzeczywistego przystanku w kierunku.
       Dzięki temu nie gubimy dalszej trasy, gdy indeks elementu
       po złożeniu wariantów nie jest już zgodny 1:1.
    */
    const przyszlePoPrzystanku=
        kluczeKursowNaPrzystanku(
            przyszlyElement.p
        );

    if(!przyszlePoPrzystanku.size){
        return false;
    }

    /*
       Klucz exact zawiera rozkladIndex na początku.
       Klucz zwykły go nie zawiera, więc porównujemy część:
       numer|wariant|symbol|brygada
    */
    for(
        const exactKey
        of aktywneKursy
    ){

        const czesci=
            String(
                exactKey
            ).split("|");

        const uproszczony=
            czesci
                .slice(1)
                .join("|");

        if(
            przyszlePoPrzystanku.has(
                uproszczony
            )
        ){
            return true;
        }
    }

    return false;
}


function przeniesMinieteGaleziePrzedAktywny(
    lista
){

    if(
        !Array.isArray(lista)||
        !lista.length
    ){
        return lista||[];
    }

    const pozycjaAktywnego=
        lista.findIndex(
            element=>
                element.index===
                aktualnyPrzystanek
        );

    if(
        pozycjaAktywnego<0
    ){
        return lista;
    }

    const aktywny=
        lista[
            pozycjaAktywnego
        ];

    const przed=
        lista.slice(
            0,
            pozycjaAktywnego
        );

    const po=
        lista.slice(
            pozycjaAktywnego+1
        );

    const przyszle=[];

    po.forEach(
        element=>{

            /*
               Jeżeli po aktualnym przystanku znajduje się punkt,
               którego nie obsługuje żaden z kursów przejeżdżających
               przez aktualny przystanek, to jest to alternatywna
               gałąź, która została już minięta.

               Dla 126 przy KUPIECKIEJ:
               dodatkowy PKP ŻERAŃ należy do innego przebiegu
               i nie może być pokazywany za KUPIECKĄ.
            */
            if(
                !istniejeKursOdDokladnegoAktywnegoDoPrzystanku(
                    aktywny,
                    element
                )
            ){
                /*
                   To jest przystanek z alternatywnej gałęzi, który
                   w układzie wspólnym wypadł za aktualnym przystankiem,
                   chociaż logicznie należy do części wcześniejszej.

                   Nie pokazujemy go wcale.

                   Przystanki naprawdę już przejechane w aktualnym
                   przebiegu nadal znajdują się w tablicy "przed"
                   i są renderowane na szaro.
                */
                return;
            }
            else{
                przyszle.push(
                    element
                );
            }
        }
    );

    return[
        ...przed,
        aktywny,
        ...przyszle
    ];
}



function __bezCache_czyAktywnyPrzystanekJestPoczatkiemSwoichKursow(){

    const kierunek=
        znajdzNajpelniejszyKierunek(
            aktualnyKierunek
        );

    const przystanki=
        kierunek?.przystanki||
        [];

    const aktywny=
        przystanki[
            aktualnyPrzystanek
        ];

    if(!aktywny){
        return false;
    }

    /*
       Bierzemy WYŁĄCZNIE kursy przypisane do dokładnie
       wybranego słupka: nazwa + numer.
    */
    const kursyAktywnego=
        new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const p=
                znajdzDokladnyPrzystanekWRozkladzie(
                    rozklad,
                    aktualnyKierunek,
                    aktywny
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        czasNaMinuty(
                            kurs?.czas
                        )===null
                    ){
                        return;
                    }

                    const key=
                        [
                            String(
                                kurs?.numer||""
                            ).trim(),
                            String(
                                kurs?.wariant||""
                            ).trim(),
                            symbolDnia(kurs),
                            String(
                                kurs?.brygada||""
                            ).trim()
                        ].join("|");

                    if(!kursyAktywnego.has(key)){
                        kursyAktywnego.set(
                            key,
                            {
                                numer:String(
                                    kurs?.numer||""
                                ).trim(),
                                wariant:String(
                                    kurs?.wariant||""
                                ).trim(),
                                symbol:
                                    symbolDnia(kurs),
                                brygada:String(
                                    kurs?.brygada||""
                                ).trim()
                            }
                        );
                    }
                }
            );
        }
    );

    if(!kursyAktywnego.size){
        return false;
    }

    let znalezionoKurs=false;

    for(
        const ref
        of kursyAktywnego.values()
    ){

        const indeksy=[];

        przystanki.forEach(
            (p,index)=>{

                let maCzas=false;

                (
                    daneLinii?.rozkłady||
                    []
                ).some(
                    rozklad=>{

                        const pp=
                            znajdzDokladnyPrzystanekWRozkladzie(
                                rozklad,
                                aktualnyKierunek,
                                p
                            );

                        const pasuje=
                            (
                                pp?.kursy||
                                []
                            ).some(
                                k=>
                                    String(
                                        k?.numer||""
                                    ).trim()===
                                        ref.numer&&
                                    String(
                                        k?.wariant||""
                                    ).trim()===
                                        ref.wariant&&
                                    symbolDnia(k)===
                                        ref.symbol&&
                                    String(
                                        k?.brygada||""
                                    ).trim()===
                                        ref.brygada&&
                                    czasNaMinuty(
                                        k?.czas
                                    )!==null
                            );

                        if(pasuje){
                            maCzas=true;
                        }

                        return maCzas;
                    }
                );

                if(maCzas){
                    indeksy.push(index);
                }
            }
        );

        if(!indeksy.length){
            continue;
        }

        znalezionoKurs=true;

        /*
           Jeżeli choć jeden kurs przejeżdża przez jakiś
           wcześniejszy przystanek, to wybrany słupek nie jest
           początkiem wszystkich swoich kursów.
        */
        const pierwszy=
            Math.min(
                ...indeksy
            );

        if(
            pierwszy<
            aktualnyPrzystanek
        ){
            return false;
        }
    }

    return znalezionoKurs;
}

function czyAktywnyPrzystanekJestPoczatkiemSwoichKursow(){

    return memoTabliczki(
        "czyAktywnyPrzystanekJestPoczatkiemSwoichKursow",
        "",
        ()=>__bezCache_czyAktywnyPrzystanekJestPoczatkiemSwoichKursow()
    );
}



function przytnijInneGaleziePrzedPoczatkiemWariantu(
    lista
){

    if(
        !Array.isArray(lista)||
        !lista.length||
        !czyAktywnyPrzystanekJestPoczatkiemSwoichKursow()
    ){
        return lista||[];
    }

    const pozycja=
        lista.findIndex(
            element=>
                element.index===
                aktualnyPrzystanek
        );

    if(pozycja<0){
        return lista;
    }

    /*
       Jeśli wybrany dokładny słupek jest początkiem swoich kursów,
       nie pokazujemy przed nim przystanków należących do innego
       wariantu / innej gałęzi.

       Przykład:
       SADYBA 05 — początek wariantu/kierunku:
       nie pokazujemy wcześniej WILANÓW -> ... -> WIERTNICZA.

       Gdy wybierzemy późniejszy przystanek, np. SADYBA 02,
       ta reguła już nie działa i wcześniejsza trasa od WILANOWA
       może być normalnie widoczna.
    */
    return lista.slice(
        pozycja
    );
}



function usunPowtorzenieNazwyPrzedAktywnym(
    lista
){

    if(
        !Array.isArray(lista)||
        !lista.length
    ){
        return lista||[];
    }

    const pozycjaAktywnego=
        lista.findIndex(
            element=>
                element.index===
                aktualnyPrzystanek
        );

    if(pozycjaAktywnego<=0){
        return lista;
    }

    const aktywny=
        lista[
            pozycjaAktywnego
        ];

    const poprzedni=
        lista[
            pozycjaAktywnego-1
        ];

    const nazwaAktywnego=
        normalizuj(
            aktywny?.p?.nazwa
        );

    const nazwaPoprzedniego=
        normalizuj(
            poprzedni?.p?.nazwa
        );

    /*
       Ta sama nazwa bezpośrednio przed aktywnym NIE zawsze
       oznacza sztuczne powtórzenie.

       Rozróżniamy dwa przypadki:

       1. Istnieje rzeczywisty kurs, który obsługuje oba dokładne
          wystąpienia przystanku:
              PL. HALLERA 06 -> PL. HALLERA 08
          Wtedy poprzedni przystanek MUSI zostać jako już przejechany.

       2. Żaden kurs nie obsługuje obu wystąpień:
          np. wcześniejsza SADYBA należy do innej gałęzi/wariantu,
          a aktywna SADYBA jest początkiem dalszego przebiegu.
          Wtedy wcześniejsze sztuczne powtórzenie usuwamy.

       Dzięki temu zachowujemy logikę działającą dla 131,
       ale nie gubimy prawdziwego wcześniejszego przystanku na 170.
    */
    if(
        nazwaAktywnego&&
        nazwaAktywnego===
        nazwaPoprzedniego
    ){

        /*
           Jeżeli choć jeden rzeczywisty kurs łączy dokładnie oba
           elementy, to są to dwa faktyczne punkty jednego przejazdu.
        */
        if(
            istniejeKursLaczacyDokladneElementy(
                poprzedni,
                aktywny
            )
        ){
            return lista;
        }

        /*
           W przeciwnym razie jest to sztuczne powtórzenie
           wynikające ze złożenia wariantów.
        */
        return[
            ...lista.slice(
                0,
                pozycjaAktywnego-1
            ),
            aktywny,
            ...lista.slice(
                pozycjaAktywnego+1
            )
        ];
    }

    return lista;
}



function usunPrzyszlePrzystankiBezMinuty(
    lista
){

    if(
        !Array.isArray(lista)||
        !lista.length
    ){
        return lista||[];
    }

    const aktywnyPos=
        lista.findIndex(
            element=>
                element?.index===
                aktualnyPrzystanek
        );

    if(aktywnyPos<0){
        return lista;
    }

    const aktywny=
        lista[
            aktywnyPos
        ];

    return lista.filter(
        (element,pos)=>{

            /*
               Przystanki już minięte pozostają bez zmian.
            */
            if(pos<=aktywnyPos){
                return true;
            }

            /*
               NAJWAŻNIEJSZA ZASADA — taka jak przy 131,
               ale teraz działa również dla identycznej nazwy+nr:

               przystanek po aktywnym zostaje tylko wtedy,
               gdy istnieje ten sam rzeczywisty kurs, który:
               - obsługuje aktywny przystanek,
               - obsługuje dokładnie TO wystąpienie przyszłego
                 przystanku.

               Kurs, który dopiero zaczyna się na przyszłym punkcie,
               nie spełnia tego warunku i nie tworzy sztucznego
               drugiego przystanku.
            */
            if(
                !istniejeKursOdDokladnegoAktywnegoDoPrzystanku(
                    aktywny,
                    element
                )
            ){
                return false;
            }

            /*
               Dodatkowa kontrola zgodna z dotychczasową logiką:
               musi istnieć poprawny czas przejazdu.
            */
            return(
                czasDowolnegoKursuNaPrzystanku(
                    element
                )!==null
            );
        }
    );
}



function usunSztuczneDuplikatyWTymSamymStanieTrasy(
    lista
){

    if(
        !Array.isArray(lista)||
        lista.length<2
    ){
        return lista||[];
    }

    const wynik=[];

    let i=0;

    while(i<lista.length){

        const pierwszy=
            lista[i];

        const nazwa=
            normalizuj(
                pierwszy?.p?.nazwa
            );

        const stan=
            kluczStanuTrasy(
                stanTrasyNaPrzystanku(
                    pierwszy
                )
            );

        let j=i+1;

        while(
            j<lista.length
        ){

            const kolejny=
                lista[j];

            const tenSamPrzystanek=
                normalizuj(
                    kolejny?.p?.nazwa
                )===
                    nazwa&&
                String(
                    kolejny?.p?.nr||""
                ).trim()===
                String(
                    pierwszy?.p?.nr||""
                ).trim();

            const tenSamStan=
                kluczStanuTrasy(
                    stanTrasyNaPrzystanku(
                        kolejny
                    )
                )===
                    stan;

            if(
                !tenSamPrzystanek||
                !tenSamStan
            ){
                break;
            }

            j++;
        }

        const grupa=
            lista.slice(
                i,
                j
            );

        if(grupa.length===1){

            wynik.push(
                grupa[0]
            );

            i=j;
            continue;
        }

        const aktywny=
            grupa.find(
                element=>
                    element?.index===
                    aktualnyPrzystanek
            );

        wynik.push(
            aktywny||
            grupa[
                grupa.length-1
            ]
        );

        i=j;
    }

    return wynik;
}



function czyStanWariantuJestPodzbiorem(
    mniejszy,
    wiekszy
){

    if(
        !mniejszy||
        !wiekszy
    ){
        return false;
    }

    const a=
        new Set(
            (
                mniejszy.litery||
                []
            )
            .map(
                x=>String(x).trim().toLowerCase()
            )
            .filter(Boolean)
        );

    const b=
        new Set(
            (
                wiekszy.litery||
                []
            )
            .map(
                x=>String(x).trim().toLowerCase()
            )
            .filter(Boolean)
        );

    /*
       Musi to być RZECZYWISTY, właściwy podzbiór.
       Przykład 170:
           wcześniejszy PKP = wszystkie przebiegi [e,l]
           kolejny PKP      = tylko [e]
       => drugi wpis jest wyłącznie granicą wariantu.
    */
    if(
        !a.size||
        !b.size||
        a.size>=b.size
    ){
        return false;
    }

    for(
        const litera
        of a
    ){
        if(
            !b.has(
                litera
            )
        ){
            return false;
        }
    }

    return true;
}



function czyElementJestPoczatkiemLubKoncemKursu(
    element
){

    if(
        !element||
        !element.p
    ){
        return false;
    }

    /*
       WAŻNE:
       Nie sprawdzamy już WSZYSTKICH kursów linii.

       Wcześniej np. przystanek mógł zostać uznany za kraniec tylko
       dlatego, że jakiś kurs zaczynał się w środku trasy. To psuło
       przypadek linii 170.

       Do rozróżniania:
       - prawdziwego przystanku w środku trasy,
       - punktu końcowo/początkowego wariantu,

       bierzemy tylko reprezentatywne PEŁNE PRZEBIEGI używane już
       przez logikę wariantów na liście przystanków.
    */
    const przebiegi=
        danePrzebiegowWariantowych();

    if(!przebiegi.length){
        return false;
    }

    for(
        const przebieg
        of przebiegi
    ){

        const kurs=
            przebieg?.kurs;

        if(
            !kurs||
            !kursMaPrzystanek(
                kurs,
                element
            )
        ){
            continue;
        }

        /*
           Wyznaczamy pierwszy i ostatni element tego konkretnego
           pełnego przebiegu na tej samej pełnej osi trasy, z której
           korzysta logika wariantów.
        */
        const pelna=
            listaPelnejTrasyDoWyswietlenia();

        const indeksy=[];

        pelna.forEach(
            (x,pozycja)=>{

                if(
                    kursMaPrzystanek(
                        kurs,
                        x
                    )
                ){
                    indeksy.push(
                        pozycja
                    );
                }
            }
        );

        if(!indeksy.length){
            continue;
        }

        const pozycjaElementu=
            pelna.indexOf(
                element
            );

        /*
           Jeżeli obiekt został odtworzony po drodze, dopasowujemy
           dokładnie po nazwa + numer + wystąpienie.
        */
        let pozycja=
            pozycjaElementu;

        if(pozycja<0){

            const nazwa=
                normalizuj(
                    element?.p?.nazwa
                );

            const nr=
                String(
                    element?.p?.nr||""
                ).trim();

            const wystapienie=
                numerWystapieniaPrzystankuWBazie(
                    element
                );

            let licznik=0;

            pozycja=
                pelna.findIndex(
                    x=>{

                        if(
                            normalizuj(
                                x?.p?.nazwa
                            )!==
                                nazwa||
                            String(
                                x?.p?.nr||""
                            ).trim()!==
                                nr
                        ){
                            return false;
                        }

                        if(
                            licznik===
                            wystapienie
                        ){
                            return true;
                        }

                        licznik++;

                        return false;
                    }
                );
        }

        if(pozycja<0){
            continue;
        }

        if(
            pozycja===
                indeksy[0]||
            pozycja===
                indeksy[
                    indeksy.length-1
                ]
        ){
            return true;
        }
    }

    return false;
}



function czyJedenPelnyPrzebiegMaObaPrzystanki(
    pierwszy,
    drugi
){

    if(
        !pierwszy?.p||
        !drugi?.p
    ){
        return false;
    }

    const przebiegi=
        danePrzebiegowWariantowych();

    for(
        const przebieg
        of przebiegi
    ){

        const kurs=
            przebieg?.kurs;

        if(!kurs){
            continue;
        }

        if(
            kursMaPrzystanek(
                kurs,
                pierwszy
            )&&
            kursMaPrzystanek(
                kurs,
                drugi
            )
        ){
            return true;
        }
    }

    return false;
}


function usunPowtorzenieNaGranicyWariantow(
    lista
){

    if(
        !Array.isArray(lista)||
        lista.length<2
    ){
        return lista||[];
    }

    const wynik=[];

    for(
        const element
        of lista
    ){

        const poprzedni=
            wynik[
                wynik.length-1
            ];

        if(!poprzedni){

            wynik.push(
                element
            );

            continue;
        }

        const taSamaNazwa=
            normalizuj(
                poprzedni?.p?.nazwa
            )===
            normalizuj(
                element?.p?.nazwa
            );

        if(!taSamaNazwa){

            wynik.push(
                element
            );

            continue;
        }

        const stanPoprzedni=
            stanTrasyNaPrzystanku(
                poprzedni
            );

        const stanAktualny=
            stanTrasyNaPrzystanku(
                element
            );

        const kluczPoprzedni=
            kluczStanuTrasy(
                stanPoprzedni
            );

        const kluczAktualny=
            kluczStanuTrasy(
                stanAktualny
            );

        /*
         * KLUCZOWA ZASADA:
         *
         * Jeśli dwa KOLEJNE wpisy mają tę samą nazwę i właśnie
         * pomiędzy nimi zmienia się stan wariantu, drugi wpis
         * nie oznacza ponownego przejazdu przez ten sam przystanek.
         *
         * Jest to tylko granica odcinków:
         *
         *   WIERNA
         *   PL. OSTREJ BRAMY
         *   PKP ZACISZE-WILNO
         *   [zmiana: dalej tylko l]
         *   PKP ZACISZE-WILNO   <- NIE pokazujemy drugi raz
         *   PL. OSTREJ BRAMY
         *   WIERNA
         *   LNIANA
         *   ELSNERÓW
         *
         * Dzięki temu linia 170 pokazuje PKP ZACISZE-WILNO raz.
         *
         * Jednocześnie dla linii 126:
         * - dwa MARCELIN,
         * - dwa OS. MARYWILSKA
         *
         * pozostają, jeżeli między nimi NIE zmienia się stan trasy.
         */
        if(
            kluczPoprzedni!==
            kluczAktualny
        ){

            /*
             * Jeżeli drugi wpis jest dokładnie aktywnym przystankiem,
             * zachowujemy aktywny obiekt zamiast poprzedniego,
             * ale nadal tylko JEDEN wiersz.
             */
            if(
                Number(
                    element?.index
                )===
                Number(
                    aktualnyPrzystanek
                )
            ){
                wynik[
                    wynik.length-1
                ]=
                    element;
            }

            continue;
        }

        /*
         * Ten sam stan trasy = to mogą być dwa rzeczywiste
         * wystąpienia tej samej nazwy w jednym przebiegu.
         * Nie usuwamy ich tutaj.
         */
        wynik.push(
            element
        );
    }

    return wynik;
}



function usunKolejnePowtorzeniaNazwyWDwukierunkowym(
    lista
){

    if(
        !czyBiezacyPrzystanekDwukierunkowy()||
        !Array.isArray(lista)||
        lista.length<2
    ){
        return lista||[];
    }

    const wynik=[];

    for(
        const element
        of lista
    ){

        const poprzedni=
            wynik[
                wynik.length-1
            ];

        if(
            poprzedni&&
            normalizuj(
                poprzedni?.p?.nazwa
            )===
                normalizuj(
                    element?.p?.nazwa
                )&&
            String(
                poprzedni?.p?.nr||""
            ).trim()===
                String(
                    element?.p?.nr||""
                ).trim()
        ){
            /*
               Aktywny wpis ma pierwszeństwo.
               W przeciwnym razie zostawiamy PIERWSZE rzeczywiste
               wystąpienie przystanku.

               Dzięki temu dla 170:
               e+l -> PKP ZACISZE-WILNO
               e   -> PKP ZACISZE-WILNO

               zostaje tylko pierwszy PKP.

               Zmiana wariantu zostanie wykryta przed następnym
               rzeczywistym przystankiem, np. PL. OSTREJ BRAMY.
            */
            if(
                element?.index===
                aktualnyPrzystanek
            ){
                wynik[
                    wynik.length-1
                ]=
                    element;
            }

            continue;
        }

        wynik.push(
            element
        );
    }

    return wynik;
}


function __bezCache_listaTrasyDoWyswietlenia(){

    const baza=
        czyBiezacyPrzystanekDwukierunkowy()
            ? listaPelnejTrasyDoWyswietlenia()
            : daneTrasWydluzonych()
                .baza;

    const oczyszczona=
        przeniesMinieteGaleziePrzedAktywny(
            baza
        );

    const poPoczatkuWariantu=
        przytnijInneGaleziePrzedPoczatkiemWariantu(
            oczyszczona
        );

    const bezPowtorzenia=
        usunPowtorzenieNazwyPrzedAktywnym(
            poPoczatkuWariantu
        );

    const bezPustychPrzyszlych=
        usunPrzyszlePrzystankiBezMinuty(
            bezPowtorzenia
        );

    const bezDuplikatowTegoSamegoStanu=
        usunSztuczneDuplikatyWTymSamymStanieTrasy(
            bezPustychPrzyszlych
        );

    const bezGranicy=
        usunPowtorzenieNaGranicyWariantow(
            bezDuplikatowTegoSamegoStanu
        );

    let wynik=
        usunKolejnePowtorzeniaNazwyWDwukierunkowym(
            bezGranicy
        );

    /*
       =========================================================
       FALLBACK DLA DOKŁADNEGO AKTYWNEGO PRZYSTANKU
       =========================================================

       Jeżeli rozkład jazdy i kierunek zostały poprawnie znalezione,
       ale filtry wariantów usunęły wszystkie przystanki PO aktywnym,
       odbudowujemy dalszą trasę z TEGO SAMEGO kursu, z którego
       zostały policzone czasy przejazdu.

       To jest dokładnie przypadek:
           linia 170
           kierunek RONDO STARZYŃSKIEGO
           PKP ZACISZE-WILNO 02 (idx:5)

       Godziny są poprawne, więc kurs został znaleziony.
       Nie ma powodu, żeby lista kończyła się na aktywnym punkcie,
       jeżeli czasyTrasy() ma czasy dla następnych przystanków.
    */

    const aktywnyPos=
        wynik.findIndex(
            element=>
                Number(
                    element?.index
                )===
                Number(
                    aktualnyPrzystanek
                )
        );

    const maCosPoAktywnym=
        aktywnyPos>=0&&
        aktywnyPos<
            wynik.length-1;

    if(
        aktywnyPos>=0&&
        !maCosPoAktywnym
    ){

        const czasy=
            czasyTrasy();

        const dalsze=
            baza.filter(
                element=>{

                    const idx=
                        Number(
                            element?.index
                        );

                    if(
                        !Number.isInteger(idx)||
                        idx<=
                            Number(
                                aktualnyPrzystanek
                            )
                    ){
                        return false;
                    }

                    /*
                       Zostawiamy wyłącznie te punkty, dla których
                       wybrany rzeczywisty kurs ma policzony czas.
                       Dzięki temu nie dokładamy obcych gałęzi.
                    */
                    return(
                        czasy[
                            idx
                        ]!==null&&
                        czasy[
                            idx
                        ]!==undefined
                    );
                }
            );

        if(dalsze.length){

            const klucze=
                new Set(
                    wynik.map(
                        element=>
                            [
                                Number(
                                    element?.index
                                ),
                                normalizuj(
                                    element?.p?.nazwa
                                ),
                                String(
                                    element?.p?.nr||""
                                ).trim()
                            ].join("|")
                    )
                );

            dalsze.forEach(
                element=>{

                    const key=
                        [
                            Number(
                                element?.index
                            ),
                            normalizuj(
                                element?.p?.nazwa
                            ),
                            String(
                                element?.p?.nr||""
                            ).trim()
                        ].join("|");

                    if(!klucze.has(key)){
                        wynik.push(
                            element
                        );
                        klucze.add(key);
                    }
                }
            );
        }
    }

    return wynik;
}
