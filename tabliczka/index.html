<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tabliczka przystankowa - FWTP</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* =========================================================
           STRONA
           ========================================================= */

        .tabliczka-page {
            max-width: 1260px;
            margin: 24px auto;
            padding: 0 15px;
        }

        .sterowanie {
            margin-bottom: 18px;
            padding: 16px;

            background: #fff;

            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .sterowanie h1 {
            margin: 0 0 13px;

            font-size: 25px;
        }

        .sterowanie-grid {
            display: grid;
            grid-template-columns: 110px 1fr 1.3fr 155px auto;
            gap: 9px;
            align-items: end;
        }

        .pole {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .pole label {
            font-size: 13px;
            font-weight: 700;
        }

        .pole input,
        .pole select {
            width: 100%;
            min-height: 39px;

            padding: 7px 9px;

            background: #fff;
            color: #222;

            border: 1px solid #ccc;
            border-radius: 5px;

            font: inherit;
            font-size: 14px;

            box-sizing: border-box;
        }

        .pokaz-btn {
            min-height: 39px;
            padding: 8px 18px;

            border: 0;
            border-radius: 5px;

            background: #d61c12;
            color: #fff;

            font: inherit;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        .pokaz-btn:hover {
            background: #b8170f;
        }

        .status {
            margin-top: 9px;

            color: #666;

            font-size: 13px;
        }

        .tabliczka-scroll {
            overflow-x: auto;
            padding-bottom: 8px;

            -webkit-overflow-scrolling: touch;
        }


        /* =========================================================
           TABLICZKA - PROPORCJE WZOROWANE NA PDF
           ========================================================= */

        .tabliczka,
        .tabliczka * {
            font-family: Univers, "Univers LT Std", "Helvetica Neue", Arial, sans-serif !important;
        }

        .tabliczka {
            --lewa: 75.7%;
            --prawa: 24.3%;

            display: grid;
            grid-template-columns: var(--lewa) var(--prawa);

            width: 210mm;
            height: 160mm;
            min-height: 160mm;

            margin: 0 auto;

            background: #fff;
            color: #111;

            border: 2px solid #111;

            font-family: Univers, "Univers LT Std", "Helvetica Neue", Arial, sans-serif;

            box-sizing: border-box;
        }

        .tabliczka.trasa-2-kol {
            --lewa: 51.9%;
            --prawa: 48.1%;
        }

        .panel-lewy {
            position: relative;

            min-width: 0;

            border-right: 1px solid #777;
        }

        .panel-prawy {
            min-width: 0;
        }


        /* =========================================================
           NAGŁÓWEK
           ========================================================= */

        .naglowek-tabliczki {
            display: grid;
            grid-template-columns: 190px minmax(0, 1fr);

            width: min(560px, calc(100% - 18px));

            margin: 12px 0 0 26px;
        }

        .numer-linii-box {
            font-family: Arial, Helvetica, sans-serif !important;

            height: 78px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #777;

            font-size: 67px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -2px;
        }

        .dane-linii {
            padding: 5px 0 0 13px;
        }

        .typ-linii {
            margin-bottom: 9px;

            font-size: 17px;
            font-weight: 700;
        }

        .kierunek {
            margin-bottom: 5px;

            font-size: 17px;
            font-weight: 700;
        }

        .kierunek::before {
            content: "→";
            display: inline-block;

            margin-right: 7px;
        }

        .wazny {
            font-size: 11px;
        }


        /* =========================================================
           TABELE ROZKŁADÓW
           ========================================================= */

        .rozklady-wrap {
            width: min(640px, calc(100% - 36px));

            margin: 3px 0 0 26px;
        }

        .rozklady-grid {
            display: grid;

            border-left: 1px solid #777;
            border-top: 1px solid #777;
        }

        .rozklady-grid.kol-1 {
            grid-template-columns: 1fr;
            max-width: 360px;
        }

        .rozklady-grid.kol-2 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            max-width: 470px;
        }

        .rozklady-grid.kol-3 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
            max-width: 640px;
        }

        .dzien {
            min-width: 0;

            border-right: 1px solid #777;
            border-bottom: 1px solid #777;
        }

        .dzien-tytul {
            min-height: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 1px 4px;

            border-bottom: 1px solid #777;

            font-size: 14px;
            line-height: 1.05;
            font-weight: 700;
            text-align: center;

            box-sizing: border-box;
        }

        .godziny-head {
            display: grid;
            grid-template-columns: 31px 1fr;

            min-height: 18px;

            border-bottom: 1px solid #999;

            font-size: 10px;
            font-weight: 700;
        }

        .godziny-head > div {
            padding: 2px 3px;
        }

        .godziny-head > div:first-child {
            border-right: 1px solid #aaa;
        }

        .godzina-row {
            display: grid;
            grid-template-columns: 31px minmax(0, 1fr);

            min-height: 18px;

            border-bottom: 1px solid #aaa;
        }

        .godzina-row:last-child {
            border-bottom: 0;
        }

        .godzina-cell {
            padding: 0 3px;

            border-right: 1px solid #aaa;

            font-size: 14px;
            line-height: 17px;
            font-weight: 800;
            text-align: right;
        }

        .minuty-cell {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0 5px;

            min-width: 0;

            padding: 0 4px;

            font-size: 13px;
            line-height: 17px;
        }

        .minuta {
            display: inline-flex;
            align-items: baseline;

            white-space: nowrap;
        }

        .symbol {
            margin-left: 1px;

            font-size: 8px;
            line-height: 1;
            font-weight: 700;
        }

        .brak {
            padding: 16px 8px;

            color: #777;

            font-size: 11px;
            text-align: center;
        }


        /* =========================================================
           LEGENDA
           ========================================================= */

        .legenda {
            max-width: 620px;

            margin: 11px 26px 12px;

            font-size: 11px;
            line-height: 1.25;
        }

        .legenda-wiersz {
            margin-top: 3px;

            font-weight: 700;
        }

        .legenda-litera {
            display: inline-block;

            min-width: 13px;
        }


        /* =========================================================
           PIONOWY NAPIS PRZYSTANKU
           ========================================================= */

        .etykieta-przystanku {
            position: absolute;

            left: 4px;
            bottom: 13px;

            writing-mode: vertical-rl;
            transform: rotate(180deg);

            font-size: 10px;
            line-height: 1;
        }


        /* =========================================================
           TRASA - PRAWA CZĘŚĆ
           ========================================================= */

        .trasa-head {
            min-height: 24px;

            display: flex;
            align-items: center;

            padding: 2px 6px;

            border-bottom: 1px solid #777;

            font-size: 10px;
            font-weight: 700;

            box-sizing: border-box;
        }

        .trasa-columns {
            display: grid;

            min-height: calc(160mm - 25px);
        }

        .trasa-columns.cols-1 {
            grid-template-columns: 1fr;
        }

        .trasa-columns.cols-2 {
            grid-template-columns: 1fr 1fr;
        }

        .trasa-kol {
            min-width: 0;

            padding: 5px 7px 10px;

            border-right: 1px solid #777;
        }

        .trasa-kol:last-child {
            border-right: 0;
        }

        .trasa-lista {
            margin: 0;
            padding: 0;

            list-style: none;
        }

        .trasa-stop {
            display: grid;
            grid-template-columns: 26px 12px minmax(0, 1fr) 12px;
            align-items: center;

            min-height: 17px;

            color: #111;

            font-size: 11px;
            line-height: 1.02;
        }

        .trasa-stop.przed {
            color: #777;
        }

        .trasa-czas {
            padding-right: 2px;

            text-align: right;
        }

        .trasa-os {
            position: relative;

            align-self: stretch;
        }

        .trasa-os::before {
            content: "";

            position: absolute;

            left: 5px;
            top: 0;
            bottom: 0;

            width: 1.5px;

            background: currentColor;
        }

        .trasa-os::after {
            content: "";

            position: absolute;

            left: 2px;
            top: 50%;

            width: 7px;
            height: 7px;

            transform: translateY(-50%);

            background: currentColor;

            border-radius: 50%;
        }

        .trasa-stop:first-child .trasa-os::before {
            top: 50%;
        }

        .trasa-stop:last-child .trasa-os::before {
            bottom: 50%;
        }

        .trasa-nazwa {
            overflow: hidden;

            white-space: nowrap;
            text-overflow: ellipsis;

            font-weight: 700;
        }

        .trasa-stop.wybrany .trasa-nazwa {
            display: inline-block;

            width: max-content;
            max-width: 100%;

            padding: 1px 3px;

            background: #111;
            color: #fff;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .trasa-stop.wybrany {
            color: #111;
        }

        .trasa-nz {
            text-align: center;

            font-size: 10px;
        }


        /* =========================================================
           BŁĄD
           ========================================================= */

        .blad {
            padding: 20px;

            background: #fff;

            border: 1px solid #ddd;
            border-radius: 7px;

            color: #666;
        }


        /* =========================================================
           RESPONSYWNOŚĆ
           ========================================================= */

        @media (max-width: 850px) {

            .sterowanie-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 560px) {

            .tabliczka-page {
                margin: 15px auto;
                padding: 0 8px;
            }

            .sterowanie-grid {
                grid-template-columns: 1fr;
            }
        }


        /* =========================================================
           DRUK
           ========================================================= */

        @media print {

            body {
                background: #fff !important;
            }

            .topbar,
            .sterowanie,
            footer {
                display: none !important;
            }

            .tabliczka-page {
                max-width: none;
                margin: 0;
                padding: 0;
            }

            .tabliczka-scroll {
                overflow: visible;
            }

            .tabliczka {
                width: 210mm;
                height: 160mm;
                min-height: 160mm;
                margin: 0 auto;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="logo">FWTP</div>
    <nav class="menu" id="menu"></nav>
</header>


<main class="tabliczka-page">

    <section class="sterowanie">

        <h1>Tabliczka przystankowa</h1>

        <div class="sterowanie-grid">

            <div class="pole">
                <label for="liniaInput">Linia</label>
                <input id="liniaInput" type="text" placeholder="np. 126">
            </div>

            <div class="pole">
                <label for="kierunekSelect">Kierunek</label>
                <select id="kierunekSelect" disabled></select>
            </div>

            <div class="pole">
                <label for="przystanekSelect">Przystanek</label>
                <select id="przystanekSelect" disabled></select>
            </div>

            <div class="pole">
                <label for="dataInput">Data</label>
                <input id="dataInput" type="date">
            </div>

            <button id="pokazBtn" class="pokaz-btn" type="button">
                Pokaż
            </button>

        </div>

        <div id="status" class="status">
            Wpisz numer linii.
        </div>

    </section>


    <div id="wynik"></div>

</main>


<script src="/FWTP/js/menu.js"></script>

<script>

/* =========================================================
   ZMIENNE
   ========================================================= */

const BASE_DANE="/FWTP/dane/";

let daneLinii=null;
let manifestPaczek=null;

const parametry=
    new URLSearchParams(
        window.location.search
    );

let aktualnaLinia=
    String(
        parametry.get("linia")||""
    ).trim();

let aktualnyKierunek=
    Number(
        parametry.get("kierunek")||0
    );

let aktualnyPrzystanek=
    pobierzIndeksPrzystanku();

let wybranaData=
    dataZTekstu(
        parametry.get("data")
    )||
    new Date();


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async()=>{

        const liniaInput=
            document.getElementById("liniaInput");

        const dataInput=
            document.getElementById("dataInput");

        liniaInput.value=
            aktualnaLinia;

        dataInput.value=
            dataISO(
                wybranaData
            );

        document
            .getElementById("pokazBtn")
            .addEventListener(
                "click",
                async()=>{

                    const nowaLinia=
                        String(
                            liniaInput.value||""
                        ).trim();

                    const d=
                        dataZTekstu(
                            dataInput.value
                        );

                    if(d){
                        wybranaData=d;
                    }

                    if(!nowaLinia){
                        pokazBlad(
                            "Podaj numer linii."
                        );
                        return;
                    }

                    if(
                        nowaLinia!==
                        aktualnaLinia
                    ){
                        aktualnyKierunek=0;
                        aktualnyPrzystanek=0;
                    }

                    aktualnaLinia=
                        nowaLinia;

                    await wczytajLinie();
                }
            );

        liniaInput.addEventListener(
            "keydown",
            event=>{
                if(event.key==="Enter"){
                    document
                        .getElementById("pokazBtn")
                        .click();
                }
            }
        );

        document
            .getElementById("kierunekSelect")
            .addEventListener(
                "change",
                function(){

                    aktualnyKierunek=
                        Number(
                            this.value
                        );

                    aktualnyPrzystanek=0;

                    wypelnijPrzystanki();
                    zapiszURL();
                    renderuj();
                }
            );

        document
            .getElementById("przystanekSelect")
            .addEventListener(
                "change",
                function(){

                    aktualnyPrzystanek=
                        Number(
                            this.value
                        );

                    zapiszURL();
                    renderuj();
                }
            );

        dataInput.addEventListener(
            "change",
            async function(){

                const d=
                    dataZTekstu(
                        this.value
                    );

                if(!d)return;

                wybranaData=d;

                if(aktualnaLinia){
                    await wczytajLinie();
                }
            }
        );

        if(aktualnaLinia){
            await wczytajLinie();
        }
    }
);


/* =========================================================
   DATA / URL
   ========================================================= */

function dataZTekstu(tekst){

    const m=
        /^(\d{4})-(\d{2})-(\d{2})$/
            .exec(
                String(
                    tekst||""
                )
            );

    if(!m)return null;

    const d=
        new Date(
            Number(m[1]),
            Number(m[2])-1,
            Number(m[3])
        );

    return Number.isNaN(
        d.getTime()
    )
        ? null
        : d;
}


function dataISO(data){

    return[
        data.getFullYear(),
        String(
            data.getMonth()+1
        ).padStart(2,"0"),
        String(
            data.getDate()
        ).padStart(2,"0")
    ].join("-");
}


function pobierzIndeksPrzystanku(){

    const tekst=
        String(
            parametry.get("przystanek")||""
        );

    if(
        tekst.startsWith("idx:")
    ){
        const n=
            Number(
                tekst.slice(4)
            );

        return Number.isInteger(n)
            ? n
            : 0;
    }

    const n=
        Number(tekst);

    return Number.isInteger(n)
        ? n
        : 0;
}


function zapiszURL(){

    const url=
        new URL(
            window.location.href
        );

    url.searchParams.set(
        "linia",
        aktualnaLinia
    );

    url.searchParams.set(
        "data",
        dataISO(
            wybranaData
        )
    );

    url.searchParams.set(
        "kierunek",
        String(
            aktualnyKierunek
        )
    );

    url.searchParams.set(
        "przystanek",
        "idx:"+
        aktualnyPrzystanek
    );

    history.replaceState(
        {},
        "",
        url
    );
}


/* =========================================================
   PACZKI
   ========================================================= */

async function pobierzManifestPaczek(){

    if(
        manifestPaczek!==null
    ){
        return manifestPaczek;
    }

    try{

        const r=
            await fetch(
                BASE_DANE+
                "paczki.json?ts="+
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!r.ok){
            manifestPaczek=[];
            return manifestPaczek;
        }

        const j=
            await r.json();

        manifestPaczek=
            Array.isArray(j)
                ? j
                : Array.isArray(j.paczki)
                    ? j.paczki
                    : [];
    }
    catch{
        manifestPaczek=[];
    }

    return manifestPaczek;
}


function paczkaObowiazuje(
    paczka,
    linia,
    data
){

    const linie=
        Array.isArray(
            paczka?.linie
        )
            ? paczka.linie.map(String)
            : [];

    if(
        !linie.includes(
            String(linia)
        )
    ){
        return false;
    }

    const iso=
        dataISO(data);

    const od=
        String(
            paczka.od||""
        );

    const doDaty=
        String(
            paczka.do||""
        );

    return(
        (!od||iso>=od)&&
        (!doDaty||iso<=doDaty)
    );
}


async function pobierzLinie(
    linia,
    data
){

    const paczki=
        await pobierzManifestPaczek();

    const pasujace=
        paczki
            .filter(
                p=>
                    paczkaObowiazuje(
                        p,
                        linia,
                        data
                    )
            )
            .sort(
                (a,b)=>
                    Number(
                        b.priorytet||0
                    )-
                    Number(
                        a.priorytet||0
                    )
            );

    const urls=[];

    pasujace.forEach(
        p=>{

            const folder=
                String(
                    p.folder||""
                )
                    .replace(/^\/+/,"")
                    .replace(/\/+$/,"");

            if(folder){
                urls.push(
                    BASE_DANE+
                    folder+
                    "/"+
                    encodeURIComponent(linia)+
                    ".json"
                );
            }
        }
    );

    urls.push(
        BASE_DANE+
        encodeURIComponent(linia)+
        ".json"
    );

    for(const url of urls){

        try{

            const r=
                await fetch(
                    url+
                    "?ts="+
                    Date.now(),
                    {
                        cache:"no-store"
                    }
                );

            if(!r.ok)continue;

            return await r.json();
        }
        catch{
            /* następny */
        }
    }

    throw new Error(
        "Nie znaleziono danych linii "+
        linia+
        "."
    );
}


/* =========================================================
   WCZYTANIE
   ========================================================= */

async function wczytajLinie(){

    ustawStatus(
        "Ładowanie linii "+
        aktualnaLinia+
        "..."
    );

    document
        .getElementById("wynik")
        .innerHTML="";

    try{

        daneLinii=
            await pobierzLinie(
                aktualnaLinia,
                wybranaData
            );

        const kierunki=
            pobierzKierunki();

        if(!kierunki.length){
            throw new Error(
                "Brak kierunków w pliku JSON."
            );
        }

        if(
            aktualnyKierunek<0||
            aktualnyKierunek>=
                kierunki.length
        ){
            aktualnyKierunek=0;
        }

        wypelnijKierunki();
        wypelnijPrzystanki();

        zapiszURL();
        renderuj();

        ustawStatus(
            "Linia "+
            String(
                daneLinii.linia||
                aktualnaLinia
            )+
            " • "+
            dataISO(
                wybranaData
            )
        );
    }
    catch(error){

        console.error(error);

        pokazBlad(
            error.message||
            "Nie udało się wczytać danych."
        );
    }
}


/* =========================================================
   KIERUNKI
   ========================================================= */

function znajdzNajpelniejszyKierunek(index){

    let najlepszy=null;
    let ile=-1;

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const k=
                Array.isArray(
                    rozklad.kierunki
                )
                    ? rozklad.kierunki[index]
                    : null;

            if(
                !k||
                !Array.isArray(
                    k.przystanki
                )
            ){
                return;
            }

            if(
                k.przystanki.length>
                ile
            ){
                najlepszy=k;
                ile=k.przystanki.length;
            }
        }
    );

    return najlepszy;
}


function pobierzKierunki(){

    let max=0;

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        r=>{
            if(
                Array.isArray(
                    r.kierunki
                )
            ){
                max=
                    Math.max(
                        max,
                        r.kierunki.length
                    );
            }
        }
    );

    const wynik=[];

    for(let i=0;i<max;i++){

        const k=
            znajdzNajpelniejszyKierunek(i);

        if(k){
            wynik.push({
                index:i,
                dane:k
            });
        }
    }

    return wynik;
}


function nazwaKierunku(k){

    const gotowa=
        String(
            k?.nazwa||
            k?.kierunek||
            ""
        ).trim();

    if(gotowa){
        return gotowa;
    }

    const p=
        k?.przystanki||
        [];

    return p.length
        ? String(
            p[p.length-1].nazwa||
            ""
        )
        : "";
}


function wypelnijKierunki(){

    const select=
        document.getElementById(
            "kierunekSelect"
        );

    const lista=
        pobierzKierunki();

    select.innerHTML="";

    lista.forEach(
        el=>{

            const option=
                document.createElement(
                    "option"
                );

            option.value=
                String(el.index);

            option.textContent=
                nazwaKierunku(
                    el.dane
                )||
                "Kierunek "+
                (el.index+1);

            select.appendChild(option);
        }
    );

    select.disabled=
        !lista.length;

    select.value=
        String(
            aktualnyKierunek
        );
}


/* =========================================================
   PRZYSTANKI
   ========================================================= */

function kierunekBazowy(){

    return znajdzNajpelniejszyKierunek(
        aktualnyKierunek
    );
}


function wypelnijPrzystanki(){

    const select=
        document.getElementById(
            "przystanekSelect"
        );

    const k=
        kierunekBazowy();

    const lista=
        k?.przystanki||
        [];

    if(
        aktualnyPrzystanek<0||
        aktualnyPrzystanek>=
            lista.length
    ){
        aktualnyPrzystanek=0;
    }

    select.innerHTML="";

    lista.forEach(
        (p,index)=>{

            const option=
                document.createElement(
                    "option"
                );

            option.value=
                String(index);

            option.textContent=
                String(
                    p.nazwa||""
                )+
                " "+
                String(
                    p.nr||""
                );

            select.appendChild(option);
        }
    );

    select.disabled=
        !lista.length;

    select.value=
        String(
            aktualnyPrzystanek
        );
}


/* =========================================================
   CZAS
   ========================================================= */

function czasNaMinuty(czas){

    const m=
        /^(\d{1,2}):(\d{2})$/
            .exec(
                String(
                    czas||""
                ).trim()
            );

    if(!m)return null;

    const h=Number(m[1]);
    const min=Number(m[2]);

    if(
        h<0||
        h>47||
        min<0||
        min>59
    ){
        return null;
    }

    return h*60+min;
}


function rozbijCzas(czas){

    const m=
        /^(\d{1,2}):(\d{2})$/
            .exec(
                String(
                    czas||""
                ).trim()
            );

    if(!m)return null;

    return{
        godzina:Number(m[1]),
        minuta:m[2]
    };
}


/* =========================================================
   KURSY / DNI
   ========================================================= */

function symbolDnia(kurs){

    return String(
        kurs?.uwagi||
        ""
    )
        .trim()
        .toUpperCase();
}


function kluczKursu(kurs){

    return[
        String(
            kurs?.numer||""
        ),
        String(
            kurs?.wariant||""
        )
    ].join("||");
}


function znajdzPrzystanekWRozkladzie(
    rozklad,
    kierunekIndex,
    baza
){

    const k=
        Array.isArray(
            rozklad?.kierunki
        )
            ? rozklad.kierunki[
                kierunekIndex
            ]
            : null;

    if(
        !k||
        !Array.isArray(
            k.przystanki
        )
    ){
        return null;
    }

    const nazwa=
        normalizuj(
            baza?.nazwa
        );

    const nr=
        String(
            baza?.nr||""
        ).trim();

    return(
        k.przystanki.find(
            p=>
                normalizuj(p.nazwa)===
                    nazwa&&
                String(
                    p.nr||""
                ).trim()===
                    nr
        )||
        null
    );
}


function pobierzKursyDlaSymbolu(symbol){

    const bazaK=
        kierunekBazowy();

    const bazaP=
        bazaK?.przystanki?.[
            aktualnyPrzystanek
        ];

    if(!bazaP)return[];

    const mapa=new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    aktualnyKierunek,
                    bazaP
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        symbolDnia(kurs)!==
                        symbol
                    ){
                        return;
                    }

                    if(
                        czasNaMinuty(
                            kurs.czas
                        )===null
                    ){
                        return;
                    }

                    const key=
                        kluczKursu(kurs);

                    if(!mapa.has(key)){
                        mapa.set(
                            key,
                            kurs
                        );
                    }
                }
            );
        }
    );

    return Array.from(
        mapa.values()
    ).sort(
        (a,b)=>
            czasNaMinuty(a.czas)-
            czasNaMinuty(b.czas)
    );
}


function dostepneGrupyDni(){

    const symbole=
        new Set();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const bazaK=
                kierunekBazowy();

            const bazaP=
                bazaK?.przystanki?.[
                    aktualnyPrzystanek
                ];

            const p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    aktualnyKierunek,
                    bazaP
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    const s=
                        symbolDnia(kurs);

                    if(s){
                        symbole.add(s);
                    }
                }
            );
        }
    );

    const wynik=[];

    if(symbole.has("D")){
        wynik.push({
            symbol:"D",
            tytul:"DZIEŃ POWSZEDNI"
        });
    }

    if(
        symbole.has("6")&&
        symbole.has("7")
    ){
        wynik.push({
            symbol:"6",
            tytul:"SOBOTA"
        });

        wynik.push({
            symbol:"7",
            tytul:"NIEDZIELA I ŚWIĘTO"
        });
    }
    else if(
        symbole.has("C")
    ){
        wynik.push({
            symbol:"C",
            tytul:"SOBOTA I ŚWIĘTO"
        });
    }
    else{

        if(symbole.has("6")){
            wynik.push({
                symbol:"6",
                tytul:"SOBOTA"
            });
        }

        if(symbole.has("7")){
            wynik.push({
                symbol:"7",
                tytul:"NIEDZIELA I ŚWIĘTO"
            });
        }
    }

    /*
     * Fallback: pokaż pozostałe symbole,
     * jeżeli eksport używa innych oznaczeń.
     */
    [
        ...symbole
    ]
        .filter(
            s=>
                !["D","C","6","7"]
                    .includes(s)
        )
        .forEach(
            s=>{
                wynik.push({
                    symbol:s,
                    tytul:
                        "ROZKŁAD "+
                        s
                });
            }
        );

    return wynik;
}


/* =========================================================
   WARIANTY / LEGENDA
   ========================================================= */

function mapaWariantow(){

    const mapa=new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        r=>{
            (
                r.warianty||
                []
            ).forEach(
                w=>{

                    const litera=
                        String(
                            w.litera||""
                        ).trim();

                    const opis=
                        String(
                            w.opis||""
                        ).trim();

                    if(
                        litera&&
                        opis&&
                        !mapa.has(litera)
                    ){
                        mapa.set(
                            litera,
                            opis
                        );
                    }
                }
            );
        }
    );

    return mapa;
}


function czyOznaczacWariant(opis){

    return(
        /skrócon|wydłuż|tylko do|zajezdni/i
            .test(
                String(
                    opis||""
                )
            )
    );
}


function symbolWariantu(kurs){

    const litera=
        String(
            kurs?.wariant||""
        ).trim();

    const opis=
        mapaWariantow()
            .get(litera)||
        "";

    if(
        !litera||
        !czyOznaczacWariant(opis)
    ){
        return"";
    }

    return litera.toLowerCase();
}


/* =========================================================
   TABELA
   ========================================================= */

function grupujGodziny(kursy){

    const mapa=new Map();

    kursy.forEach(
        kurs=>{

            const c=
                rozbijCzas(
                    kurs.czas
                );

            if(!c)return;

            const h=
                c.godzina%24;

            if(!mapa.has(h)){
                mapa.set(h,[]);
            }

            mapa.get(h).push({
                minuta:c.minuta,
                kurs
            });
        }
    );

    return mapa;
}


function renderDzien(grupa){

    const kursy=
        pobierzKursyDlaSymbolu(
            grupa.symbol
        );

    const mapa=
        grupujGodziny(
            kursy
        );

    let body="";

    if(!mapa.size){

        body=
            '<div class="brak">Brak kursów</div>';
    }
    else{

        body=
            [
                ...mapa.keys()
            ]
                .sort(
                    (a,b)=>a-b
                )
                .map(
                    h=>{

                        const minuty=
                            mapa.get(h)
                                .map(
                                    item=>{

                                        const sym=
                                            symbolWariantu(
                                                item.kurs
                                            );

                                        return(
                                            '<span class="minuta">'+
                                            escapeHtml(
                                                item.minuta
                                            )+
                                            (
                                                sym
                                                    ? '<span class="symbol">'+
                                                      escapeHtml(sym)+
                                                      '</span>'
                                                    : ''
                                            )+
                                            '</span>'
                                        );
                                    }
                                )
                                .join("");

                        return(
                            '<div class="godzina-row">'+
                            '<div class="godzina-cell">'+
                            h+
                            '</div>'+
                            '<div class="minuty-cell">'+
                            minuty+
                            '</div>'+
                            '</div>'
                        );
                    }
                )
                .join("");
    }

    return(
        '<section class="dzien">'+
        '<div class="dzien-tytul">'+
        escapeHtml(
            grupa.tytul
        )+
        '</div>'+
        '<div class="godziny-head">'+
        '<div>Godz.</div>'+
        '<div>Minuty</div>'+
        '</div>'+
        body+
        '</section>'
    );
}


/* =========================================================
   CZASY PRZEJAZDU NA TRASIE
   ========================================================= */

function znajdzNajlepszyKursDoTrasy(){

    const baza=
        kierunekBazowy();

    const lista=
        baza?.przystanki||
        [];

    const start=
        lista[
            aktualnyPrzystanek
        ];

    if(!start)return null;

    const kandydaci=
        new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    aktualnyKierunek,
                    start
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        czasNaMinuty(
                            kurs.czas
                        )===null
                    ){
                        return;
                    }

                    const key=
                        kluczKursu(kurs);

                    if(!kandydaci.has(key)){

                        kandydaci.set(
                            key,
                            {
                                key,
                                numer:String(
                                    kurs.numer||""
                                ),
                                wariant:String(
                                    kurs.wariant||""
                                ),
                                start:
                                    czasNaMinuty(
                                        kurs.czas
                                    ),
                                count:0
                            }
                        );
                    }
                }
            );
        }
    );

    kandydaci.forEach(
        kandydat=>{

            for(
                let i=
                    aktualnyPrzystanek;
                i<lista.length;
                i++
            ){

                if(
                    znajdzCzasKursuNaPrzystanku(
                        kandydat,
                        lista[i]
                    )!==null
                ){
                    kandydat.count++;
                }
            }
        }
    );

    return[
        ...kandydaci.values()
    ].sort(
        (a,b)=>
            b.count-a.count||
            a.start-b.start
    )[0]||null;
}


function znajdzCzasKursuNaPrzystanku(
    kandydat,
    bazaP
){

    for(
        const rozklad of
        (
            daneLinii?.rozkłady||
            []
        )
    ){

        const p=
            znajdzPrzystanekWRozkladzie(
                rozklad,
                aktualnyKierunek,
                bazaP
            );

        const kurs=
            (
                p?.kursy||
                []
            ).find(
                k=>
                    String(
                        k.numer||""
                    )===
                        kandydat.numer&&
                    String(
                        k.wariant||""
                    )===
                        kandydat.wariant&&
                    czasNaMinuty(
                        k.czas
                    )!==null
            );

        if(kurs){
            return czasNaMinuty(
                kurs.czas
            );
        }
    }

    return null;
}


function czasyTrasy(){

    const baza=
        kierunekBazowy();

    const lista=
        baza?.przystanki||
        [];

    const kandydat=
        znajdzNajlepszyKursDoTrasy();

    const wynik=
        new Array(
            lista.length
        ).fill(null);

    if(!kandydat){
        return wynik;
    }

    const start=
        znajdzCzasKursuNaPrzystanku(
            kandydat,
            lista[
                aktualnyPrzystanek
            ]
        );

    if(start===null){
        return wynik;
    }

    for(
        let i=
            aktualnyPrzystanek;
        i<lista.length;
        i++
    ){

        let t=
            znajdzCzasKursuNaPrzystanku(
                kandydat,
                lista[i]
            );

        if(t===null)continue;

        while(t<start){
            t+=1440;
        }

        wynik[i]=
            t-start;
    }

    return wynik;
}


/* =========================================================
   TRASA
   ========================================================= */

function czyNZ(p){

    const typ=
        String(
            p?.typ||""
        )
            .trim()
            .toUpperCase();

    return(
        typ==="NŻ"||
        typ==="NZ"||
        typ==="N/Z"||
        typ.includes("ŻĄD")
    );
}


function podzielTrase(lista){

    if(
        lista.length<=28
    ){
        return[
            {
                start:0,
                lista
            }
        ];
    }

    const polowa=
        Math.ceil(
            lista.length/2
        );

    return[
        {
            start:0,
            lista:
                lista.slice(
                    0,
                    polowa
                )
        },
        {
            start:polowa,
            lista:
                lista.slice(
                    polowa
                )
        }
    ];
}


function renderTrasaKolumna(
    fragment,
    czasy
){

    return(
        '<div class="trasa-kol">'+
        '<ul class="trasa-lista">'+
        fragment.lista
            .map(
                (p,lokalny)=>{

                    const index=
                        fragment.start+
                        lokalny;

                    const przed=
                        index<
                        aktualnyPrzystanek;

                    const wybrany=
                        index===
                        aktualnyPrzystanek;

                    const czas=
                        czasy[index];

                    return(
                        '<li class="trasa-stop'+
                        (
                            przed
                                ? ' przed'
                                : ''
                        )+
                        (
                            wybrany
                                ? ' wybrany'
                                : ''
                        )+
                        '">'+
                        '<span class="trasa-czas">'+
                        (
                            czas===null
                                ? ''
                                : escapeHtml(
                                    String(czas)
                                )
                        )+
                        '</span>'+
                        '<span class="trasa-os"></span>'+
                        '<span class="trasa-nazwa">'+
                        escapeHtml(
                            String(
                                p.nazwa||""
                            ).toUpperCase()
                        )+
                        '</span>'+
                        '<span class="trasa-nz">'+
                        (
                            czyNZ(p)
                                ? 'ż'
                                : ''
                        )+
                        '</span>'+
                        '</li>'
                    );
                }
            )
            .join("")+
        '</ul>'+
        '</div>'
    );
}


/* =========================================================
   LEGENDA
   ========================================================= */

function renderLegenda(){

    const grupy=
        dostepneGrupyDni();

    const opisy=
        mapaWariantow();

    const uzyte=
        new Set();

    grupy.forEach(
        grupa=>{

            pobierzKursyDlaSymbolu(
                grupa.symbol
            ).forEach(
                kurs=>{

                    const litera=
                        String(
                            kurs.wariant||""
                        ).trim();

                    const opis=
                        opisy.get(litera)||
                        "";

                    if(
                        litera&&
                        czyOznaczacWariant(
                            opis
                        )
                    ){
                        uzyte.add(litera);
                    }
                }
            );
        }
    );

    if(!uzyte.size){
        return"";
    }

    return[
        ...uzyte
    ]
        .sort(
            (a,b)=>
                a.localeCompare(
                    b,
                    "pl",
                    {
                        numeric:true
                    }
                )
        )
        .map(
            litera=>{

                return(
                    '<div class="legenda-wiersz">'+
                    '<span class="legenda-litera">'+
                    escapeHtml(
                        litera.toLowerCase()
                    )+
                    '</span>'+
                    ' - '+
                    escapeHtml(
                        opisy.get(litera)||
                        ""
                    )+
                    '</div>'
                );
            }
        )
        .join("");
}


/* =========================================================
   TYP LINII
   ========================================================= */

function typLinii(numer){

    const tekst=
        String(
            numer||""
        )
            .trim()
            .toUpperCase();

    if(/^Z-/.test(tekst)){
        return"LINIA ZASTĘPCZA";
    }

    const n=Number(tekst);

    if(
        Number.isFinite(n)&&
        n>=1&&
        n<=79
    ){
        return"LINIA TRAMWAJOWA";
    }

    return"LINIA ZWYKŁA";
}


/* =========================================================
   RENDER
   ========================================================= */

function renderuj(){

    const kierunek=
        kierunekBazowy();

    const lista=
        kierunek?.przystanki||
        [];

    const p=
        lista[
            aktualnyPrzystanek
        ];

    if(!p){
        pokazBlad(
            "Nie znaleziono wybranego przystanku."
        );
        return;
    }

    const grupy=
        dostepneGrupyDni();

    const fragmenty=
        podzielTrase(
            lista
        );

    const czasy=
        czasyTrasy();

    const numer=
        String(
            daneLinii.linia||
            aktualnaLinia
        );

    const klasaTrasy=
        fragmenty.length===2
            ? " trasa-2-kol"
            : "";

    const legenda=
        renderLegenda();

    const rozklady=
        grupy
            .slice(0,3)
            .map(
                renderDzien
            )
            .join("");

    const kolKlasa=
        "kol-"+
        Math.max(
            1,
            Math.min(
                3,
                grupy.length
            )
        );

    const trasaHtml=
        fragmenty
            .map(
                f=>
                    renderTrasaKolumna(
                        f,
                        czasy
                    )
            )
            .join("");

    const html=
        '<div class="tabliczka-scroll">'+
        '<article class="tabliczka'+
        klasaTrasy+
        '">'+

        '<section class="panel-lewy">'+

        '<div class="naglowek-tabliczki">'+
        '<div class="numer-linii-box">'+
        escapeHtml(numer)+
        '</div>'+
        '<div class="dane-linii">'+
        '<div class="typ-linii">'+
        escapeHtml(
            typLinii(numer)
        )+
        '</div>'+
        '<div class="kierunek">'+
        escapeHtml(
            String(
                nazwaKierunku(
                    kierunek
                )
            ).toUpperCase()
        )+
        '</div>'+
        '<div class="wazny">'+
        'Rozkład dla dnia '+
        escapeHtml(
            dataISO(
                wybranaData
            )
        )+
        '</div>'+
        '</div>'+
        '</div>'+

        '<div class="rozklady-wrap">'+
        '<div class="rozklady-grid '+
        kolKlasa+
        '">'+
        rozklady+
        '</div>'+
        '</div>'+

        (
            legenda
                ? '<div class="legenda">'+
                  legenda+
                  '</div>'
                : ''
        )+

        '<div class="etykieta-przystanku">'+
        'Przystanek: '+
        escapeHtml(
            String(
                p.nazwa||""
            ).toUpperCase()
        )+
        ' '+
        escapeHtml(
            String(
                p.nr||""
            )
        )+
        '</div>'+

        '</section>'+

        '<aside class="panel-prawy">'+
        '<div class="trasa-head">'+
        'czasy, trasa, przystanki'+
        '</div>'+
        '<div class="trasa-columns cols-'+
        fragmenty.length+
        '">'+
        trasaHtml+
        '</div>'+
        '</aside>'+

        '</article>'+
        '</div>';

    document
        .getElementById("wynik")
        .innerHTML=
            html;
}


/* =========================================================
   POMOCNICZE
   ========================================================= */

function normalizuj(tekst){

    return String(
        tekst||""
    )
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim()
        .toUpperCase();
}


function escapeHtml(tekst){

    return String(
        tekst??""
    )
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function ustawStatus(tekst){

    document
        .getElementById("status")
        .textContent=
            tekst;
}


function pokazBlad(tekst){

    ustawStatus(tekst);

    document
        .getElementById("wynik")
        .innerHTML=
            '<div class="blad">'+
            escapeHtml(tekst)+
            '</div>';
}
