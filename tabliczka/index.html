<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tabliczka przystankowa - FWTP</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* =========================================================
           STRONA
           ========================================================= */

        .tabliczka-page {
            max-width: 1280px;
            margin: 28px auto;
            padding: 0 15px;
        }

        .sterowanie {
            margin-bottom: 18px;
            padding: 18px;

            background: #ffffff;

            border: 1px solid #dddddd;
            border-radius: 8px;
        }

        .sterowanie h1 {
            margin: 0 0 14px;

            font-size: 27px;
        }

        .sterowanie-grid {
            display: grid;
            grid-template-columns: 115px 1fr 1fr 160px auto;
            gap: 10px;
            align-items: end;
        }

        .pole {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .pole label {
            font-size: 13px;
            font-weight: 700;
        }

        .pole input,
        .pole select {
            width: 100%;
            min-height: 40px;

            padding: 7px 9px;

            background: #ffffff;
            color: #222222;

            border: 1px solid #cccccc;
            border-radius: 5px;

            font: inherit;
            font-size: 14px;

            box-sizing: border-box;
        }

        .pokaz-btn {
            min-height: 40px;
            padding: 8px 17px;

            border: 0;
            border-radius: 5px;

            background: #d61c12;
            color: #ffffff;

            font: inherit;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        .pokaz-btn:hover {
            background: #b8170f;
        }

        .status {
            margin-top: 10px;

            color: #666666;

            font-size: 13px;
        }


        /* =========================================================
           TABLICZKA
           ========================================================= */

        .tabliczka-wrap {
            overflow-x: auto;
            width: 100%;

            padding-bottom: 8px;

            -webkit-overflow-scrolling: touch;
        }

        .tabliczka {
            width: 1120px;
            min-height: 650px;

            margin: 0 auto;

            background: #ffffff;
            color: #111111;

            border: 2px solid #111111;

            font-family: Arial, Helvetica, sans-serif;

            box-sizing: border-box;
        }


        /* =========================================================
           GÓRA
           ========================================================= */

        .tab-gora {
            display: grid;
            grid-template-columns: 610px 1fr;

            min-height: 138px;

            border-bottom: 1px solid #777777;
        }

        .tab-gora-lewa {
            display: grid;
            grid-template-columns: 205px 1fr;

            border-right: 1px solid #777777;
        }

        .numer-linii-duzy {
            display: flex;
            align-items: center;
            justify-content: center;

            margin: 12px;

            border: 1px solid #777777;

            font-size: 72px;
            line-height: 1;
            font-weight: 800;
        }

        .dane-linii {
            padding: 14px 12px 8px;
        }

        .typ-linii {
            margin-bottom: 6px;

            font-size: 19px;
            font-weight: 700;
        }

        .kierunek-duzy {
            font-size: 19px;
            font-weight: 700;
        }

        .kierunek-duzy::before {
            content: "→";
            margin-right: 7px;
        }

        .wazny-od {
            margin-top: 6px;

            font-size: 13px;
        }

        .wybrany-przystanek {
            margin-top: 12px;

            font-size: 13px;
            font-weight: 700;
        }

        .tab-gora-prawa {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .trasa-kolumna {
            padding: 7px 10px;

            border-right: 1px solid #777777;
        }

        .trasa-kolumna:last-child {
            border-right: 0;
        }

        .trasa-naglowek {
            margin-bottom: 4px;

            font-size: 11px;
            font-weight: 700;
        }


        /* =========================================================
           TRASA
           ========================================================= */

        .trasa-lista {
            margin: 0;
            padding: 0;

            list-style: none;
        }

        .trasa-stop {
            position: relative;

            display: grid;
            grid-template-columns: 31px 13px minmax(0, 1fr);
            align-items: center;

            min-height: 18px;

            font-size: 12px;
            line-height: 1.05;
        }

        .trasa-stop-nr {
            padding-right: 3px;

            text-align: right;
        }

        .trasa-os {
            position: relative;

            align-self: stretch;
        }

        .trasa-os::before {
            content: "";

            position: absolute;

            top: 0;
            bottom: 0;
            left: 6px;

            width: 2px;

            background: #111111;
        }

        .trasa-os::after {
            content: "";

            position: absolute;

            top: 50%;
            left: 3px;

            width: 8px;
            height: 8px;

            transform: translateY(-50%);

            background: #111111;

            border-radius: 50%;
        }

        .trasa-stop:first-child .trasa-os::before {
            top: 50%;
        }

        .trasa-stop:last-child .trasa-os::before {
            bottom: 50%;
        }

        .trasa-stop-nazwa {
            overflow: hidden;

            white-space: nowrap;
            text-overflow: ellipsis;

            font-weight: 700;
        }

        .trasa-stop.wybrany .trasa-stop-nazwa {
            text-decoration: underline;
        }


        /* =========================================================
           ŚRODEK: ROZKŁAD + TRASA
           ========================================================= */

        .tab-srodek {
            display: grid;
            grid-template-columns: 610px 1fr;
        }

        .rozklady {
            border-right: 1px solid #777777;
        }

        .rozklady-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }

        .dzien-tabela {
            border-right: 1px solid #777777;
        }

        .dzien-tabela:last-child {
            border-right: 0;
        }

        .dzien-tytul {
            min-height: 27px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-bottom: 1px solid #777777;

            font-size: 15px;
            font-weight: 700;
            text-align: center;
        }

        .godz-min-naglowek {
            display: grid;
            grid-template-columns: 36px 1fr;

            min-height: 20px;

            border-bottom: 1px solid #777777;

            font-size: 10px;
            font-weight: 700;
        }

        .godz-min-naglowek > div {
            padding: 3px 4px;
        }

        .godz-min-naglowek > div:first-child {
            border-right: 1px solid #aaaaaa;
        }

        .wiersz-godziny {
            display: grid;
            grid-template-columns: 36px 1fr;

            min-height: 19px;

            border-bottom: 1px solid #bbbbbb;
        }

        .wiersz-godziny:last-child {
            border-bottom: 0;
        }

        .godzina {
            padding: 1px 4px;

            border-right: 1px solid #aaaaaa;

            font-size: 15px;
            line-height: 17px;
            font-weight: 800;
            text-align: right;
        }

        .minuty {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0 6px;

            padding: 1px 5px;

            font-size: 14px;
            line-height: 17px;
        }

        .minuta {
            white-space: nowrap;
        }

        .symbol-kursu {
            margin-left: 1px;

            font-size: 9px;
            font-weight: 700;
            vertical-align: super;
        }

        .brak-kursow {
            min-height: 90px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 15px;

            color: #777777;

            font-size: 12px;
            text-align: center;
        }


        /* =========================================================
           DOLNA CZĘŚĆ LEWA
           ========================================================= */

        .uwagi {
            padding: 10px 12px 12px;

            border-top: 1px solid #777777;

            font-size: 11px;
            line-height: 1.3;
        }

        .uwagi-glowna {
            margin-bottom: 4px;

            font-weight: 800;
        }

        .legenda-wiersz {
            margin-top: 2px;
        }

        .legenda-symbol {
            display: inline-block;

            min-width: 16px;

            font-weight: 800;
        }

        .stopka-przystanku {
            margin-top: 9px;

            font-size: 10px;
        }


        /* =========================================================
           PRAWA TRASA W ŚRODKU
           ========================================================= */

        .trasa-pelna {
            padding: 7px 10px 10px;
        }

        .trasa-pelna .trasa-lista {
            columns: 2;
            column-gap: 16px;
        }

        .trasa-pelna .trasa-stop {
            break-inside: avoid;
        }


        /* =========================================================
           BŁĄD
           ========================================================= */

        .blad {
            padding: 24px;

            background: #ffffff;

            border: 1px solid #dddddd;
            border-radius: 8px;

            color: #666666;
        }


        /* =========================================================
           RESPONSYWNOŚĆ
           ========================================================= */

        @media (max-width: 850px) {

            .sterowanie-grid {
                grid-template-columns: 1fr 1fr;
            }

            .pokaz-btn {
                width: 100%;
            }
        }

        @media (max-width: 560px) {

            .tabliczka-page {
                margin: 15px auto;
                padding: 0 8px;
            }

            .sterowanie {
                padding: 14px;
            }

            .sterowanie-grid {
                grid-template-columns: 1fr;
            }

            .tabliczka {
                margin: 0;
            }
        }

        @media print {

            body {
                background: #ffffff !important;
            }

            .topbar,
            .sterowanie,
            footer {
                display: none !important;
            }

            .tabliczka-page {
                max-width: none;
                margin: 0;
                padding: 0;
            }

            .tabliczka-wrap {
                overflow: visible;
            }

            .tabliczka {
                width: 100%;
                min-height: 0;
                margin: 0;

                page-break-inside: avoid;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="logo">FWTP</div>
    <nav class="menu" id="menu"></nav>
</header>


<main class="tabliczka-page">

    <section class="sterowanie">

        <h1>Tabliczka przystankowa</h1>

        <div class="sterowanie-grid">

            <div class="pole">
                <label for="liniaInput">Linia</label>
                <input
                    id="liniaInput"
                    type="text"
                    placeholder="np. 126"
                    autocomplete="off"
                >
            </div>

            <div class="pole">
                <label for="kierunekSelect">Kierunek</label>
                <select id="kierunekSelect" disabled>
                    <option value="">Najpierw wczytaj linię</option>
                </select>
            </div>

            <div class="pole">
                <label for="przystanekSelect">Przystanek</label>
                <select id="przystanekSelect" disabled>
                    <option value="">Najpierw wczytaj linię</option>
                </select>
            </div>

            <div class="pole">
                <label for="dataInput">Rozkład obowiązujący</label>
                <input
                    id="dataInput"
                    type="date"
                >
            </div>

            <button
                id="pokazBtn"
                class="pokaz-btn"
                type="button"
            >
                Pokaż
            </button>

        </div>

        <div
            id="status"
            class="status"
        >
            Wpisz numer linii.
        </div>

    </section>


    <div id="wynik"></div>

</main>


<script src="/FWTP/js/menu.js"></script>

<script>

/* =========================================================
   ZMIENNE
   ========================================================= */

const BASE_DANE =
    "/FWTP/dane/";

let daneLinii =
    null;

let manifestPaczek =
    null;

let wybranaData =
    dataZURL() ||
    new Date();

let aktualnaLinia =
    String(
        new URLSearchParams(
            window.location.search
        ).get("linia") || ""
    ).trim();

let aktualnyKierunek =
    Number(
        new URLSearchParams(
            window.location.search
        ).get("kierunek") || 0
    );

let aktualnyPrzystanek =
    pobierzIndeksPrzystankuZURL();


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        const liniaInput =
            document.getElementById(
                "liniaInput"
            );

        const dataInput =
            document.getElementById(
                "dataInput"
            );

        liniaInput.value =
            aktualnaLinia;

        dataInput.value =
            dataISO(
                wybranaData
            );

        document
            .getElementById(
                "pokazBtn"
            )
            .addEventListener(
                "click",
                async () => {

                    const nowaLinia =
                        String(
                            liniaInput.value || ""
                        ).trim();

                    const nowaData =
                        dataZInput(
                            dataInput.value
                        );

                    if (
                        nowaData
                    ) {
                        wybranaData =
                            nowaData;
                    }

                    if (
                        !nowaLinia
                    ) {
                        pokazBlad(
                            "Podaj numer linii."
                        );
                        return;
                    }

                    const zmianaLinii =
                        nowaLinia !==
                        aktualnaLinia;

                    aktualnaLinia =
                        nowaLinia;

                    if (
                        zmianaLinii
                    ) {
                        aktualnyKierunek =
                            0;

                        aktualnyPrzystanek =
                            0;
                    }

                    await wczytajLinie();
                }
            );

        liniaInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {
                    document
                        .getElementById(
                            "pokazBtn"
                        )
                        .click();
                }
            }
        );

        document
            .getElementById(
                "kierunekSelect"
            )
            .addEventListener(
                "change",
                function () {

                    aktualnyKierunek =
                        Number(
                            this.value
                        );

                    aktualnyPrzystanek =
                        0;

                    wypelnijPrzystanki();
                    zapiszURL();
                    renderuj();
                }
            );

        document
            .getElementById(
                "przystanekSelect"
            )
            .addEventListener(
                "change",
                function () {

                    aktualnyPrzystanek =
                        Number(
                            this.value
                        );

                    zapiszURL();
                    renderuj();
                }
            );

        dataInput.addEventListener(
            "change",
            async function () {

                const d =
                    dataZInput(
                        this.value
                    );

                if (!d) {
                    return;
                }

                wybranaData =
                    d;

                if (
                    aktualnaLinia
                ) {
                    await wczytajLinie();
                }
            }
        );

        if (
            aktualnaLinia
        ) {
            await wczytajLinie();
        }
    }
);


/* =========================================================
   DATA
   ========================================================= */

function dataZURL() {

    const tekst =
        new URLSearchParams(
            window.location.search
        ).get("data");

    return dataZInput(
        tekst
    );
}


function dataZInput(
    tekst
) {

    const match =
        /^(\d{4})-(\d{2})-(\d{2})$/
            .exec(
                String(
                    tekst || ""
                )
            );

    if (!match) {
        return null;
    }

    const data =
        new Date(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
        );

    return Number.isNaN(
        data.getTime()
    )
        ? null
        : data;
}


function dataISO(
    data
) {

    return [
        data.getFullYear(),
        String(
            data.getMonth() + 1
        ).padStart(2, "0"),
        String(
            data.getDate()
        ).padStart(2, "0")
    ].join("-");
}


function formatDataPL(
    data
) {

    return dataISO(
        data
    );
}


function pobierzIndeksPrzystankuZURL() {

    const wartosc =
        String(
            new URLSearchParams(
                window.location.search
            ).get("przystanek") || ""
        );

    if (
        wartosc.startsWith(
            "idx:"
        )
    ) {
        const n =
            Number(
                wartosc.slice(4)
            );

        return Number.isInteger(n)
            ? n
            : 0;
    }

    const n =
        Number(
            wartosc
        );

    return Number.isInteger(n)
        ? n
        : 0;
}


/* =========================================================
   PACZKI
   ========================================================= */

async function pobierzManifestPaczek() {

    if (
        manifestPaczek !==
        null
    ) {
        return manifestPaczek;
    }

    try {

        const response =
            await fetch(
                BASE_DANE +
                "paczki.json?ts=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );

        if (
            !response.ok
        ) {
            manifestPaczek =
                [];

            return manifestPaczek;
        }

        const dane =
            await response.json();

        manifestPaczek =
            Array.isArray(
                dane
            )
                ? dane
                : Array.isArray(
                    dane.paczki
                )
                    ? dane.paczki
                    : [];

    }
    catch (error) {
        manifestPaczek =
            [];
    }

    return manifestPaczek;
}


function paczkaObowiazuje(
    paczka,
    linia,
    data
) {

    if (!paczka) {
        return false;
    }

    const linie =
        Array.isArray(
            paczka.linie
        )
            ? paczka.linie.map(
                String
            )
            : [];

    if (
        !linie.includes(
            String(linia)
        )
    ) {
        return false;
    }

    const iso =
        dataISO(
            data
        );

    const od =
        String(
            paczka.od || ""
        );

    const doDaty =
        String(
            paczka.do || ""
        );

    if (
        od &&
        iso < od
    ) {
        return false;
    }

    if (
        doDaty &&
        iso > doDaty
    ) {
        return false;
    }

    return true;
}


async function pobierzLinie(
    linia,
    data
) {

    const paczki =
        await pobierzManifestPaczek();

    const pasujace =
        paczki
            .filter(
                p =>
                    paczkaObowiazuje(
                        p,
                        linia,
                        data
                    )
            )
            .sort(
                (a, b) =>
                    Number(
                        b.priorytet || 0
                    ) -
                    Number(
                        a.priorytet || 0
                    )
            );

    const urls =
        [];

    pasujace.forEach(
        paczka => {

            const folder =
                String(
                    paczka.folder || ""
                )
                    .replace(
                        /^\/+/,
                        ""
                    )
                    .replace(
                        /\/+$/,
                        ""
                    );

            if (
                folder
            ) {
                urls.push(
                    BASE_DANE +
                    folder +
                    "/" +
                    encodeURIComponent(
                        linia
                    ) +
                    ".json"
                );
            }
        }
    );

    urls.push(
        BASE_DANE +
        encodeURIComponent(
            linia
        ) +
        ".json"
    );

    for (
        const url of urls
    ) {

        try {

            const response =
                await fetch(
                    url +
                    "?ts=" +
                    Date.now(),
                    {
                        cache:
                            "no-store"
                    }
                );

            if (
                !response.ok
            ) {
                continue;
            }

            return await response.json();
        }
        catch (error) {
            /* następny kandydat */
        }
    }

    throw new Error(
        "Nie znaleziono pliku JSON linii " +
        linia +
        "."
    );
}


/* =========================================================
   WCZYTYWANIE
   ========================================================= */

async function wczytajLinie() {

    ustawStatus(
        "Ładowanie linii " +
        aktualnaLinia +
        "..."
    );

    document.getElementById(
        "wynik"
    ).innerHTML =
        "";

    try {

        daneLinii =
            await pobierzLinie(
                aktualnaLinia,
                wybranaData
            );

        const kierunki =
            pobierzKierunki();

        if (
            !kierunki.length
        ) {
            throw new Error(
                "W pliku linii nie znaleziono kierunków."
            );
        }

        if (
            aktualnyKierunek < 0 ||
            aktualnyKierunek >=
                kierunki.length
        ) {
            aktualnyKierunek =
                0;
        }

        wypelnijKierunki();
        wypelnijPrzystanki();

        zapiszURL();
        renderuj();

        ustawStatus(
            "Linia " +
            String(
                daneLinii.linia ||
                aktualnaLinia
            ) +
            " • " +
            formatDataPL(
                wybranaData
            )
        );

    }
    catch (error) {

        console.error(
            error
        );

        pokazBlad(
            error.message ||
            "Nie udało się wczytać danych."
        );
    }
}


/* =========================================================
   KIERUNKI
   ========================================================= */

function pobierzKierunki() {

    if (
        !daneLinii ||
        !Array.isArray(
            daneLinii.rozkłady
        )
    ) {
        return [];
    }

    let max =
        0;

    daneLinii.rozkłady.forEach(
        rozklad => {

            if (
                Array.isArray(
                    rozklad.kierunki
                )
            ) {
                max =
                    Math.max(
                        max,
                        rozklad.kierunki.length
                    );
            }
        }
    );

    const wynik =
        [];

    for (
        let i = 0;
        i < max;
        i++
    ) {

        const najlepszy =
            znajdzNajpelniejszyKierunek(
                i
            );

        if (
            najlepszy
        ) {
            wynik.push(
                {
                    index:
                        i,
                    dane:
                        najlepszy
                }
            );
        }
    }

    return wynik;
}


function znajdzNajpelniejszyKierunek(
    index
) {

    let najlepszy =
        null;

    let maxPrzystankow =
        -1;

    (
        daneLinii.rozkłady ||
        []
    ).forEach(
        rozklad => {

            const kierunek =
                Array.isArray(
                    rozklad.kierunki
                )
                    ? rozklad.kierunki[index]
                    : null;

            if (
                !kierunek ||
                !Array.isArray(
                    kierunek.przystanki
                )
            ) {
                return;
            }

            if (
                kierunek.przystanki.length >
                maxPrzystankow
            ) {
                najlepszy =
                    kierunek;

                maxPrzystankow =
                    kierunek.przystanki.length;
            }
        }
    );

    return najlepszy;
}


function nazwaKierunku(
    kierunek
) {

    if (!kierunek) {
        return "";
    }

    const nazwa =
        String(
            kierunek.nazwa ||
            kierunek.kierunek ||
            ""
        ).trim();

    if (
        nazwa
    ) {
        return nazwa;
    }

    const przystanki =
        kierunek.przystanki ||
        [];

    if (
        przystanki.length
    ) {
        return String(
            przystanki[
                przystanki.length - 1
            ].nazwa || ""
        );
    }

    return "";
}


function wypelnijKierunki() {

    const select =
        document.getElementById(
            "kierunekSelect"
        );

    const kierunki =
        pobierzKierunki();

    select.innerHTML =
        "";

    kierunki.forEach(
        element => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                String(
                    element.index
                );

            option.textContent =
                nazwaKierunku(
                    element.dane
                ) ||
                (
                    "Kierunek " +
                    (
                        element.index + 1
                    )
                );

            select.appendChild(
                option
            );
        }
    );

    select.disabled =
        !kierunki.length;

    select.value =
        String(
            aktualnyKierunek
        );
}


/* =========================================================
   PRZYSTANKI
   ========================================================= */

function aktualnyKierunekDane() {

    return znajdzNajpelniejszyKierunek(
        aktualnyKierunek
    );
}


function wypelnijPrzystanki() {

    const select =
        document.getElementById(
            "przystanekSelect"
        );

    const kierunek =
        aktualnyKierunekDane();

    const przystanki =
        kierunek &&
        Array.isArray(
            kierunek.przystanki
        )
            ? kierunek.przystanki
            : [];

    select.innerHTML =
        "";

    przystanki.forEach(
        (
            p,
            index
        ) => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                String(
                    index
                );

            option.textContent =
                [
                    String(
                        p.nazwa || ""
                    ),
                    String(
                        p.nr || ""
                    )
                ]
                    .filter(
                        Boolean
                    )
                    .join(
                        " "
                    );

            select.appendChild(
                option
            );
        }
    );

    if (
        aktualnyPrzystanek < 0 ||
        aktualnyPrzystanek >=
            przystanki.length
    ) {
        aktualnyPrzystanek =
            0;
    }

    select.disabled =
        !przystanki.length;

    select.value =
        String(
            aktualnyPrzystanek
        );
}


/* =========================================================
   KURSY DLA DNIA
   ========================================================= */

function symbolDniaKursu(
    kurs
) {

    return String(
        kurs &&
        kurs.uwagi ||
        ""
    )
        .trim()
        .toUpperCase();
}


function czySymbolPasuje(
    kurs,
    symbol
) {

    return (
        symbolDniaKursu(
            kurs
        ) ===
        symbol
    );
}


function kluczKursu(
    kurs
) {

    return [
        String(
            kurs.numer || ""
        ),
        String(
            kurs.wariant || ""
        )
    ].join(
        "||"
    );
}


function pobierzKursyPrzystanku(
    kierunekIndex,
    przystanekIndex,
    symbol
) {

    const mapa =
        new Map();

    (
        daneLinii.rozkłady ||
        []
    ).forEach(
        rozklad => {

            const kierunek =
                Array.isArray(
                    rozklad.kierunki
                )
                    ? rozklad.kierunki[
                        kierunekIndex
                    ]
                    : null;

            const przystanek =
                kierunek &&
                Array.isArray(
                    kierunek.przystanki
                )
                    ? kierunek.przystanki[
                        przystanekIndex
                    ]
                    : null;

            if (
                !przystanek ||
                !Array.isArray(
                    przystanek.kursy
                )
            ) {
                return;
            }

            przystanek.kursy.forEach(
                kurs => {

                    if (
                        !czySymbolPasuje(
                            kurs,
                            symbol
                        )
                    ) {
                        return;
                    }

                    if (
                        czasNaMinuty(
                            kurs.czas
                        ) ===
                        null
                    ) {
                        return;
                    }

                    const key =
                        kluczKursu(
                            kurs
                        );

                    if (
                        !mapa.has(
                            key
                        )
                    ) {
                        mapa.set(
                            key,
                            kurs
                        );
                    }
                }
            );
        }
    );

    return Array.from(
        mapa.values()
    )
        .sort(
            (a, b) =>
                czasNaMinuty(
                    a.czas
                ) -
                czasNaMinuty(
                    b.czas
                )
        );
}


function czasNaMinuty(
    czas
) {

    const m =
        /^(\d{1,2}):(\d{2})$/
            .exec(
                String(
                    czas || ""
                ).trim()
            );

    if (!m) {
        return null;
    }

    const h =
        Number(
            m[1]
        );

    const min =
        Number(
            m[2]
        );

    if (
        h < 0 ||
        h > 47 ||
        min < 0 ||
        min > 59
    ) {
        return null;
    }

    return (
        h * 60 +
        min
    );
}


function rozbijCzas(
    czas
) {

    const m =
        /^(\d{1,2}):(\d{2})$/
            .exec(
                String(
                    czas || ""
                ).trim()
            );

    if (!m) {
        return null;
    }

    return {
        godzina:
            Number(
                m[1]
            ),
        minuta:
            m[2]
    };
}


/* =========================================================
   WARIANTY / SKRÓCENIA
   ========================================================= */

function mapaOpisowWariantow() {

    const mapa =
        new Map();

    (
        daneLinii.rozkłady ||
        []
    ).forEach(
        rozklad => {

            (
                rozklad.warianty ||
                []
            ).forEach(
                wariant => {

                    const litera =
                        String(
                            wariant.litera || ""
                        ).trim();

                    const opis =
                        String(
                            wariant.opis || ""
                        ).trim();

                    if (
                        litera &&
                        opis &&
                        !mapa.has(
                            litera
                        )
                    ) {
                        mapa.set(
                            litera,
                            opis
                        );
                    }
                }
            );
        }
    );

    return mapa;
}


function czyOpisSkrócenia(
    opis
) {

    return /skrócon|tylko do|do przystanku/i
        .test(
            String(
                opis || ""
            )
        );
}


function symbolDlaWariantu(
    litera
) {

    if (
        !litera
    ) {
        return "";
    }

    return String(
        litera
    )
        .trim()
        .toLowerCase();
}


function uzyteSymboleSkrócen(
    kursy
) {

    const opisy =
        mapaOpisowWariantow();

    const wynik =
        new Map();

    kursy.forEach(
        kurs => {

            const litera =
                String(
                    kurs.wariant || ""
                ).trim();

            const opis =
                opisy.get(
                    litera
                ) || "";

            if (
                litera &&
                opis &&
                czyOpisSkrócenia(
                    opis
                )
            ) {
                wynik.set(
                    symbolDlaWariantu(
                        litera
                    ),
                    opis
                );
            }
        }
    );

    return wynik;
}


/* =========================================================
   TABELA GODZIN
   ========================================================= */

function grupujPoGodzinach(
    kursy
) {

    const mapa =
        new Map();

    kursy.forEach(
        kurs => {

            const czas =
                rozbijCzas(
                    kurs.czas
                );

            if (!czas) {
                return;
            }

            const h =
                czas.godzina %
                24;

            if (
                !mapa.has(
                    h
                )
            ) {
                mapa.set(
                    h,
                    []
                );
            }

            mapa.get(
                h
            ).push(
                {
                    minuta:
                        czas.minuta,
                    kurs:
                        kurs
                }
            );
        }
    );

    return mapa;
}


function renderDzien(
    tytul,
    symbol
) {

    const kursy =
        pobierzKursyPrzystanku(
            aktualnyKierunek,
            aktualnyPrzystanek,
            symbol
        );

    const grupy =
        grupujPoGodzinach(
            kursy
        );

    let body =
        "";

    if (
        !grupy.size
    ) {
        body =
            '<div class="brak-kursow">' +
            'Brak kursów' +
            '</div>';
    }
    else {

        const godziny =
            Array.from(
                grupy.keys()
            )
                .sort(
                    (a, b) =>
                        a - b
                );

        body =
            godziny
                .map(
                    godzina => {

                        const minuty =
                            grupy.get(
                                godzina
                            )
                                .map(
                                    item => {

                                        const litera =
                                            String(
                                                item.kurs.wariant ||
                                                ""
                                            ).trim();

                                        const opis =
                                            mapaOpisowWariantow()
                                                .get(
                                                    litera
                                                ) || "";

                                        const symbolKursu =
                                            (
                                                litera &&
                                                czyOpisSkrócenia(
                                                    opis
                                                )
                                            )
                                                ? (
                                                    '<span class="symbol-kursu">' +
                                                    escapeHtml(
                                                        symbolDlaWariantu(
                                                            litera
                                                        )
                                                    ) +
                                                    '</span>'
                                                )
                                                : "";

                                        return (
                                            '<span class="minuta">' +
                                            escapeHtml(
                                                item.minuta
                                            ) +
                                            symbolKursu +
                                            '</span>'
                                        );
                                    }
                                )
                                .join("");

                        return (
                            '<div class="wiersz-godziny">' +
                            '<div class="godzina">' +
                            String(
                                godzina
                            ) +
                            '</div>' +
                            '<div class="minuty">' +
                            minuty +
                            '</div>' +
                            '</div>'
                        );
                    }
                )
                .join("");
    }

    return (
        '<section class="dzien-tabela">' +
        '<div class="dzien-tytul">' +
        escapeHtml(
            tytul
        ) +
        '</div>' +
        '<div class="godz-min-naglowek">' +
        '<div>Godz.</div>' +
        '<div>Minuty</div>' +
        '</div>' +
        body +
        '</section>'
    );
}


/* =========================================================
   TRASA
   ========================================================= */

function trasaOdWybranegoPrzystanku() {

    const kierunek =
        aktualnyKierunekDane();

    if (
        !kierunek ||
        !Array.isArray(
            kierunek.przystanki
        )
    ) {
        return [];
    }

    return kierunek.przystanki.slice(
        aktualnyPrzystanek
    );
}


function renderTrasaLista(
    lista,
    offset = 0
) {

    return (
        '<ul class="trasa-lista">' +
        lista
            .map(
                (
                    p,
                    index
                ) => {

                    const wybrany =
                        (
                            index +
                            offset
                        ) === 0;

                    return (
                        '<li class="trasa-stop' +
                        (
                            wybrany
                                ? " wybrany"
                                : ""
                        ) +
                        '">' +
                        '<span class="trasa-stop-nr">' +
                        escapeHtml(
                            String(
                                p.nr || ""
                            )
                        ) +
                        '</span>' +
                        '<span class="trasa-os"></span>' +
                        '<span class="trasa-stop-nazwa">' +
                        escapeHtml(
                            String(
                                p.nazwa || ""
                            ).toUpperCase()
                        ) +
                        '</span>' +
                        '</li>'
                    );
                }
            )
            .join("") +
        '</ul>'
    );
}


function renderTrasaPelna() {

    const lista =
        trasaOdWybranegoPrzystanku();

    if (
        !lista.length
    ) {
        return "";
    }

    return renderTrasaLista(
        lista
    );
}


/* =========================================================
   LEGENDA
   ========================================================= */

function renderLegenda() {

    const wszystkieKursy =
        [
            ...pobierzKursyPrzystanku(
                aktualnyKierunek,
                aktualnyPrzystanek,
                "D"
            ),
            ...pobierzKursyPrzystanku(
                aktualnyKierunek,
                aktualnyPrzystanek,
                "6"
            ),
            ...pobierzKursyPrzystanku(
                aktualnyKierunek,
                aktualnyPrzystanek,
                "7"
            ),
            ...pobierzKursyPrzystanku(
                aktualnyKierunek,
                aktualnyPrzystanek,
                "C"
            )
        ];

    const legenda =
        uzyteSymboleSkrócen(
            wszystkieKursy
        );

    let html =
        '<div class="uwagi-glowna">' +
        'WSZYSTKIE KURSY REALIZOWANE ZGODNIE Z ROZKŁADEM' +
        '</div>';

    legenda.forEach(
        (
            opis,
            symbol
        ) => {

            html +=
                '<div class="legenda-wiersz">' +
                '<span class="legenda-symbol">' +
                escapeHtml(
                    symbol
                ) +
                '</span>' +
                ' - ' +
                escapeHtml(
                    opis
                ) +
                '</div>';
        }
    );

    const kierunek =
        aktualnyKierunekDane();

    const p =
        kierunek &&
        kierunek.przystanki
            ? kierunek.przystanki[
                aktualnyPrzystanek
            ]
            : null;

    if (
        p
    ) {
        html +=
            '<div class="stopka-przystanku">' +
            'Przystanek: ' +
            escapeHtml(
                String(
                    p.nazwa || ""
                ).toUpperCase()
            ) +
            " " +
            escapeHtml(
                String(
                    p.nr || ""
                )
            ) +
            '</div>';
    }

    return html;
}


/* =========================================================
   RENDER CAŁOŚCI
   ========================================================= */

function typLinii(
    linia
) {

    const n =
        Number(
            linia
        );

    if (
        Number.isFinite(
            n
        ) &&
        n >= 1 &&
        n <= 79
    ) {
        return "LINIA TRAMWAJOWA";
    }

    return "LINIA AUTOBUSOWA";
}


function renderuj() {

    if (
        !daneLinii
    ) {
        return;
    }

    const kierunek =
        aktualnyKierunekDane();

    const przystanek =
        kierunek &&
        kierunek.przystanki
            ? kierunek.przystanki[
                aktualnyPrzystanek
            ]
            : null;

    if (
        !kierunek ||
        !przystanek
    ) {
        pokazBlad(
            "Nie znaleziono wybranego przystanku."
        );
        return;
    }

    const numerLinii =
        String(
            daneLinii.linia ||
            aktualnaLinia
        );

    const kierunekTekst =
        nazwaKierunku(
            kierunek
        );

    /*
     * Dla soboty i święta najpierw próbujemy osobnych
     * symboli 6/7. Jeżeli w danych ich nie ma, poniżej
     * używamy także wspólnego symbolu C.
     */
    let sobota =
        renderDzien(
            "SOBOTA",
            "6"
        );

    let swieto =
        renderDzien(
            "ŚWIĘTO",
            "7"
        );

    const kursySobota =
        pobierzKursyPrzystanku(
            aktualnyKierunek,
            aktualnyPrzystanek,
            "6"
        );

    const kursySwieto =
        pobierzKursyPrzystanku(
            aktualnyKierunek,
            aktualnyPrzystanek,
            "7"
        );

    if (
        !kursySobota.length
    ) {
        sobota =
            renderDzien(
                "SOBOTA",
                "C"
            );
    }

    if (
        !kursySwieto.length
    ) {
        swieto =
            renderDzien(
                "ŚWIĘTO",
                "C"
            );
    }

    const html =
        '<div class="tabliczka-wrap">' +
        '<article class="tabliczka">' +

        '<div class="tab-gora">' +

        '<div class="tab-gora-lewa">' +
        '<div class="numer-linii-duzy">' +
        escapeHtml(
            numerLinii
        ) +
        '</div>' +
        '<div class="dane-linii">' +
        '<div class="typ-linii">' +
        escapeHtml(
            typLinii(
                numerLinii
            )
        ) +
        '</div>' +
        '<div class="kierunek-duzy">' +
        escapeHtml(
            String(
                kierunekTekst || ""
            ).toUpperCase()
        ) +
        '</div>' +
        '<div class="wazny-od">' +
        'Rozkład dla dnia ' +
        escapeHtml(
            formatDataPL(
                wybranaData
            )
        ) +
        '</div>' +
        '<div class="wybrany-przystanek">' +
        'Przystanek: ' +
        escapeHtml(
            String(
                przystanek.nazwa || ""
            ).toUpperCase()
        ) +
        " " +
        escapeHtml(
            String(
                przystanek.nr || ""
            )
        ) +
        '</div>' +
        '</div>' +
        '</div>' +

        '<div class="tab-gora-prawa">' +
        '<div class="trasa-kolumna">' +
        '<div class="trasa-naglowek">' +
        'czasy, trasa, przystanki' +
        '</div>' +
        renderTrasaLista(
            trasaOdWybranegoPrzystanku()
                .slice(
                    0,
                    12
                )
        ) +
        '</div>' +
        '<div class="trasa-kolumna">' +
        '<div class="trasa-naglowek">' +
        'czasy, trasa, przystanki' +
        '</div>' +
        renderTrasaLista(
            trasaOdWybranegoPrzystanku()
                .slice(
                    12,
                    24
                ),
            12
        ) +
        '</div>' +
        '</div>' +

        '</div>' +

        '<div class="tab-srodek">' +

        '<div class="rozklady">' +
        '<div class="rozklady-grid">' +
        renderDzien(
            "DZIEŃ POWSZEDNI",
            "D"
        ) +
        sobota +
        swieto +
        '</div>' +
        '<div class="uwagi">' +
        renderLegenda() +
        '</div>' +
        '</div>' +

        '<div class="trasa-pelna">' +
        '<div class="trasa-naglowek">' +
        'TRASA OD WYBRANEGO PRZYSTANKU' +
        '</div>' +
        renderTrasaPelna() +
        '</div>' +

        '</div>' +

        '</article>' +
        '</div>';

    document.getElementById(
        "wynik"
    ).innerHTML =
        html;
}


/* =========================================================
   URL
   ========================================================= */

function zapiszURL() {

    const url =
        new URL(
            window.location.href
        );

    url.searchParams.set(
        "linia",
        aktualnaLinia
    );

    url.searchParams.set(
        "data",
        dataISO(
            wybranaData
        )
    );

    url.searchParams.set(
        "kierunek",
        String(
            aktualnyKierunek
        )
    );

    url.searchParams.set(
        "przystanek",
        "idx:" +
        String(
            aktualnyPrzystanek
        )
    );

    history.replaceState(
        {},
        "",
        url
    );
}


/* =========================================================
   POMOCNICZE
   ========================================================= */

function escapeHtml(
    tekst
) {

    return String(
        tekst ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


function ustawStatus(
    tekst
) {

    document.getElementById(
        "status"
    ).textContent =
        tekst;
}


function pokazBlad(
    tekst
) {

    ustawStatus(
        tekst
    );

    document.getElementById(
        "wynik"
    ).innerHTML =
        '<div class="blad">' +
        escapeHtml(
            tekst
        ) +
        '</div>';
}
