function renderWydluzeniaTrasy(){

    /*
       W397: minuty i każdy wiersz powstają NAJPIERW dokładnie
       przez oryginalny renderer v385. Dopiero potem porządkujemy
       dwa wydłużenia do układu:
           tylko s
           wspólny r,s
       Dzięki temu nie dotykamy działającej logiki minut v385.
    */
    const html=
        renderWydluzeniaTrasySurowe397();

    if(!html){
        return "";
    }

    const box=
        document.createElement("div");

    box.innerHTML=html;

    const bloki=
        Array.from(
            box.querySelectorAll(
                ":scope > .trasa-extra"
            )
        );

    if(bloki.length!==2){
        return html;
    }

    function litera397(blok){
        const t=
            blok.querySelector(
                ":scope > .trasa-extra-title"
            )?.textContent||"";

        const m=
            t.match(/[„"]([^”"]+)[”"]/);

        return(
            m
                ? String(m[1]).trim()
                : ""
        );
    }

    function wiersze397(blok){
        return Array.from(
            blok.querySelectorAll(
                ":scope > .trasa-extra-lista > .trasa-extra-stop"
            )
        );
    }

    function nazwa397(wiersz){
        return normalizuj(
            wiersz.querySelector(
                ".trasa-nazwa"
            )?.textContent||""
        );
    }

    const a={
        litera:litera397(bloki[0]),
        rows:wiersze397(bloki[0])
    };

    const b={
        litera:litera397(bloki[1]),
        rows:wiersze397(bloki[1])
    };

    if(
        !a.litera||
        !b.litera||
        !a.rows.length||
        !b.rows.length
    ){
        return html;
    }

    /*
       Najdłuższy wspólny KOŃCOWY odcinek po logicznej nazwie.
       Numer słupka nie rozcina przebiegu trasy.
    */
    let ia=a.rows.length-1;
    let ib=b.rows.length-1;

    while(
        ia>=0&&
        ib>=0&&
        nazwa397(a.rows[ia])===
        nazwa397(b.rows[ib])
    ){
        ia--;
        ib--;
    }

    const commonA=
        a.rows.slice(ia+1);

    if(!commonA.length){
        return html;
    }

    const prefixA=
        a.rows.slice(0,ia+1);

    const prefixB=
        b.rows.slice(0,ib+1);

    /*
       Najdłuższy własny odcinek pokazujemy pierwszy.
       Dla 338 jest to s.
    */
    const prefiksy=[
        {
            litera:a.litera,
            rows:prefixA
        },
        {
            litera:b.litera,
            rows:prefixB
        }
    ]
    .filter(x=>x.rows.length)
    .sort(
        (x,y)=>
            y.rows.length-
            x.rows.length
    );

    function blok397(litery,rows){

        if(!rows.length){
            return "";
        }

        return(
            '<div class="trasa-extra">'+
                '<div class="trasa-extra-title">'+
                    'Trasa w kursach '+
                    litery
                        .map(
                            l=>
                                '„'+
                                escapeHtml(l)+
                                '”'
                        )
                        .join(", ")+
                '</div>'+
                '<ul class="trasa-extra-lista">'+
                    rows
                        .map(
                            r=>r.outerHTML
                        )
                        .join("")+
                '</ul>'+
            '</div>'
        );
    }

    let wynik="";

    prefiksy.forEach(
        x=>{
            wynik+=
                blok397(
                    [x.litera],
                    x.rows
                );
        }
    );

    /*
       WERSJA 399

       Wspólny odcinek r,s ma pokazywać czasy przejazdu
       wariantu DŁUŻSZEGO.

       Wiersze mają już minuty policzone przez oryginalny
       renderer v385. Wybieramy więc wspólny ogon z tego
       wariantu, który przed wspólnym odcinkiem ma dłuższy
       własny przebieg.

       Dla linii 338 jest to wariant s.
    */
    const commonB=
        b.rows.slice(
            ib+1
        );

    const wspolneWiersze399=
        prefixA.length>=prefixB.length
            ? commonA
            : commonB;

    wynik+=
        blok397(
            [
                a.litera,
                b.litera
            ].sort(
                (x,y)=>
                    x.localeCompare(
                        y,
                        "pl",
                        {numeric:true}
                    )
            ),
            wspolneWiersze399
        );

    return wynik;
}



function pozycjaAktywnegoNaWyswietlanejTrasie(
    lista
){

    const source=
        Array.isArray(lista)
            ? lista
            : [];

    if(!source.length){
        return -1;
    }

    const baza=
        kierunekBazowy()
            ?.przystanki||
        [];

    const wybrany=
        baza[
            aktualnyPrzystanek
        ];

    if(!wybrany){
        return -1;
    }

    const nazwa=
        normalizuj(
            wybrany?.nazwa
        );

    const nr=
        String(
            wybrany?.nr||""
        ).trim();

    /*
       1. Najpierw dokładnie NAZWA + NUMER.
    */
    const exact=[];

    source.forEach(
        (element,pozycja)=>{

            const p=
                element?.p||
                element;

            if(
                normalizuj(
                    p?.nazwa
                )===
                    nazwa&&
                String(
                    p?.nr||""
                ).trim()===
                    nr
            ){
                exact.push(
                    pozycja
                );
            }
        }
    );

    if(exact.length===1){
        return exact[0];
    }

    /*
       Jeżeli ta sama nazwa+nr występuje więcej niż raz,
       wybieramy takie samo wystąpienie jak w kierunku bazowym.
    */
    if(exact.length>1){

        let wystapienie=0;

        for(
            let i=0;
            i<aktualnyPrzystanek;
            i++
        ){
            if(
                normalizuj(
                    baza[i]?.nazwa
                )===
                    nazwa&&
                String(
                    baza[i]?.nr||""
                ).trim()===
                    nr
            ){
                wystapienie++;
            }
        }

        return exact[
            Math.min(
                wystapienie,
                exact.length-1
            )
        ];
    }

    /*
       2. Fallback po nazwie.

       LNIANA jest na trasie tylko raz, więc nawet jeśli po złożeniu
       wariantów numer słupka nie został zachowany przy tym obiekcie,
       nadal dokładnie wiemy, który wiersz jest aktywny.
    */
    const sameName=[];

    source.forEach(
        (element,pozycja)=>{

            const p=
                element?.p||
                element;

            if(
                normalizuj(
                    p?.nazwa
                )===
                nazwa
            ){
                sameName.push(
                    pozycja
                );
            }
        }
    );

    if(sameName.length===1){
        return sameName[0];
    }

    /*
       3. Kilka razy ta sama nazwa, np. WIERNA.
       Ustalamy, które to wystąpienie nazwy w kierunku bazowym.
    */
    if(sameName.length>1){

        let wystapienieNazwy=0;

        for(
            let i=0;
            i<aktualnyPrzystanek;
            i++
        ){
            if(
                normalizuj(
                    baza[i]?.nazwa
                )===
                nazwa
            ){
                wystapienieNazwy++;
            }
        }

        return sameName[
            Math.min(
                wystapienieNazwy,
                sameName.length-1
            )
        ];
    }

    return -1;
}

function czasElementuKursowego207(
    element
){
    if(
        !element?._kursowy207
    ){
        return null;
    }

    const dane=
        daneKursowAktywnego206();

    if(!dane){
        return null;
    }

    let najlepszy=null;

    dane.przebiegi.forEach(
        info=>{

            info.punkty.forEach(
                pkt=>{

                    if(
                        normalizujNazwe208(
                            pkt.p?.nazwa
                        )!==
                        normalizujNazwe208(
                            element.p?.nazwa
                        )||
                        String(
                            pkt.p?.nr||
                            ""
                        ).trim()!==
                        String(
                            element.p?.nr||
                            ""
                        ).trim()
                    ){
                        return;
                    }

                    pkt.kursy.forEach(
                        kurs=>{

                            const m=
                                czasNaMinuty(
                                    kurs?.czas
                                );

                            if(
                                m!==null&&
                                (
                                    najlepszy===null||
                                    m<najlepszy
                                )
                            ){
                                najlepszy=m;
                            }
                        }
                    );
                }
            );
        }
    );

    if(najlepszy===null){
        return null;
    }

    /*
       czasDowolnegoKursuNaPrzystanku zwraca czas przejazdu względem
       aktywnego. Tu wyliczamy analogicznie z pierwszego aktywnego czasu.
    */
    let startMin=null;

    dane.przebiegi.forEach(
        info=>{

            const pierwszy=
                info.punkty[0];

            (
                pierwszy?.kursy||
                []
            ).forEach(
                kurs=>{

                    const m=
                        czasNaMinuty(
                            kurs?.czas
                        );

                    if(
                        m!==null&&
                        (
                            startMin===null||
                            m<startMin
                        )
                    ){
                        startMin=m;
                    }
                }
            );
        }
    );

    if(startMin===null){
        return null;
    }

    let roznica=
        najlepszy-
        startMin;

    if(roznica<0){
        roznica+=24*60;
    }

    return roznica;
}

function rzeczywistyKraniecKombinacjiDwukierunkowej(item){

        .slice(0,3)

                )

                            Number(
                                kurs?._kierunekIndex
                            );

                        if(
                            dir!==
                            Number(
                                item.dir
                            )
                        ){
                            return;
                        }

                        const litera=
                            literaWariantuPoRzeczywistymPrzebiegu(
                                {
                                    ...kurs,
                                    symbol:grupa.symbol,
                                    _kierunekIndex:dir
                                },
                                dir
                            );

                        const wariant=
                            (
                                litera&&
                                czyPokazacWariantJakLiniaHTML(
                                    litera
                                )
                            )
                                ? String(
                                    litera
                                ).toLowerCase()
                                : "";

                        if(
                            wariant!==
                            String(
                                item.wariant||""
                            ).toLowerCase()
                        ){
                            return;
                        }

                        const ref={
                            numer:String(
                                kurs?.numer||""
                            ),
                            wariant:String(
                                kurs?.wariant||""
                            ).trim(),
                            symbol:grupa.symbol,
                            brygada:String(
                                kurs?.brygada||""
                            ).trim(),
                            _kierunekIndex:dir
                        };

                        /*
                           Dla aktualnego kierunku możemy użyć pełnej
                           listy z dokładnym rozróżnieniem wystąpień.
                        */
                        const pelna=
                            (
                                dir===
                                Number(
                                    aktualnyKierunek
                                )
                            )
                                ? listaPelnejTrasyDoWyswietlenia()
                                : (
                                    znajdzNajpelniejszyKierunek(
                                        dir
                                    )?.przystanki||
                                    []
                                ).map(
                                    (p,index)=>({
                                        p,
                                        index
                                    })
                                );

                        let ostatni=null;

                        pelna.forEach(
                            element=>{

                                if(
                                    kursMaPrzystanek(
                                        ref,
                                        element
                                    )
                                ){
                                    ostatni=
                                        element;
                                }
                            }
                        );

                        if(!ostatni){
                            return;
                        }

                        const nazwa=
                            String(
                                ostatni?.p?.nazwa||
                                ""
                            ).toUpperCase();

                        const key=
                            normalizuj(
                                nazwa
                            );

                        if(!liczniki.has(key)){
                            liczniki.set(
                                key,
                                {
                                    nazwa,
                                    ile:0
                                }
                            );
                        }

                        liczniki
                            .get(key)
                            .ile++;
                    }
                );
            }
        );

    if(!liczniki.size){
        return"";
    }

    return[
        ...liczniki.values()
    ]
    .sort(
        (a,b)=>
            b.ile-a.ile
    )[0].nazwa;
}

/* V626: legenda korzysta z identycznych symboli jak minuty. */
function renderLegenda(){

    }

    const mapa=
        mapaWariantow();

    if(!mapa.size){

    /*
       Legenda ma pokazywać WYŁĄCZNIE oznaczenia,

       wariantów (ta sama funkcja co renderDzien).
       w aktualnym kierunku i na aktualnym przystanku.

       Dzięki temu warianty istniejące tylko w drugim kierunku

    */
    const uzyteLitery=
        new Set();

    const grupy=
        dostepneGrupyDni()
            .slice(

            );

    grupy.forEach(
        grupa=>{

            const kursy=
                pobierzKursyDlaSymbolu(
                    grupa.symbol
                );

            kursy.forEach(

                        String(
                            v625SymbolWariantuDlaMinuty(
                                kurs,
                                grupa.symbol
                            )||""
                        )
                        .trim()
                        .toLowerCase();

                    if(litera){
                        uzyteLitery.add(
                            litera
                        );
                    }
                }
            );
        }
    );

    if(!uzyteLitery.size){
        return"";
    }

    /*
       Identyczne opisy nadal łączymy do jednej litery,
       ale tylko wtedy, gdy ta litera rzeczywiście występuje
       przy minutach w aktualnie wyświetlanym rozkładzie.
    */
    const widzianeOpisy=

    const wiersze=[];

    for(
        const [litera,opis]
        of mapa.entries()
    ){

        const tekst=
            String(

            ).trim();

        /*
           Litera trafiła tutaj tylko wtedy, gdy faktycznie
           została użyta przy minutach. Wystarczy więc publiczny
           opis z JSON-u — tak jak w linia.html.
        */
        if(!tekst){
            continue;
        }

        const literaDoPokazania=
            kanonicznaLiteraWariantu(
                litera
            )
            .toLowerCase();

        /*
           Najważniejsze:
           nie ma litery przy żadnej minucie w tym kierunku
           => nie ma jej również w legendzie.
        */
        if(
            !uzyteLitery.has(
                literaDoPokazania
            )
        ){
            continue;
        }

        const klucz=
            normalizujOpisWariantu(
                tekst
            );

        if(
            widzianeOpisy.has(
                klucz
            )
        ){
            continue;
        }

        widzianeOpisy.add(
            klucz
        );

        wiersze.push(
            '<div class="legenda-wiersz">'+

            )+

            '<span class="legenda-myslnik">-</span>'+
            '<span class="legenda-opis">'+
            escapeHtml(
                window.bezMiejscowosciWKierunkuIOpisie458(
                    tekst
                )
            )+
            '</span>'+
            '</div>'
        );
    }

    if(!wiersze.length){
        return"";
    }

       drugi margin-left i litera wariantu była dokładnie

    */
    return(

}

function typLinii(numer){

        String(
            numer||""
        )
            .trim()
            .toUpperCase();

    if(/^Z-/.test(tekst)){
        return"LINIA ZASTĘPCZA";
    }

    const n=Number(tekst);

    if(
        Number.isFinite(n)&&
        n>=1&&
        n<=79
    ){
        return"LINIA TRAMWAJOWA";
    }

    return"LINIA ZWYKŁA";
}

   WERSJA 215 — ŚCIŚNIĘTA LITERA m
   ========================================================= */

function scisnijLiteryM215(
    root=document
){
    /*
       Najpierw elementy, w których litera wariantu jest osobnym node'em.
    */
    root.querySelectorAll(
        [
            "[data-wariant='M']",
            "[data-wariant='m']",
            ".wariant-litera",
            ".symbol-wariantu",
            ".minuta-wariant"
        ].join(",")
    ).forEach(
        el=>{

            const znak=
                String(
                    el.dataset?.wariant||
                    el.textContent||
                    ""
                )
                .trim()
                .toLowerCase();

            if(znak==="m"){
                el.classList.add(
                    "wariant-m-215"
                );
            }
        }
    );

    /*
       Jeżeli renderer zapisuje np. "28m" jako jeden tekst, zamieniamy
       tylko końcowe m na osobny span. Nie dotykamy opisów legendy.
    */
    root.querySelectorAll(
        ".tabliczka .minuty-cell, .tabliczka .minuty, .tabliczka [class*='minut']"
    ).forEach(
        kontener=>{

            Array.from(
                kontener.childNodes
            ).forEach(
                node=>{

                    if(
                        node.nodeType!==Node.TEXT_NODE
                    ){
                        return;
                    }

                    const txt=
                        node.nodeValue;

                    if(
                        !txt||
                        !/\d{1,2}m(?=\s|$)/i.test(
                            txt
                        )
                    ){
                        return;
                    }

                    const frag=
                        document.createDocumentFragment();

                    const czesci=
                        txt.split(
                            /(\d{1,2})(m)(?=\s|$)/ig
                        );

                    for(
                        let i=0;
                        i<czesci.length;
                        i++
                    ){
                        const part=
                            czesci[i];

                        if(
                            i>=2&&
                            i%3===2&&
                            String(part).toLowerCase()==="m"
                        ){
                            const span=
                                document.createElement(
                                    "span"
                                );

                            span.className=
                                "wariant-m-215";

                            span.textContent=
                                part;

                            frag.appendChild(
                                span
                            );
                        } else if(part){
                            frag.appendChild(
                                document.createTextNode(
                                    part
                                )
                            );
                        }
                    }

                    node.replaceWith(
                        frag
                    );
                }
            );
        }
    );
}
