<!DOCTYPE html>
<!-- =========================================================
     FWTP — TABLICZKA TESTOWA
     WERSJA: 480
     DATA: 2026-09-17

     NOWY SILNIK:
     - JSON jest źródłem prawdy o przebiegu
     - kurs.trasa określa kolejność przystanków
     - nazwa_czysta określa nazwę wyświetlaną
     - miejscowosc określa separatory miejscowości
     - strefa określa strefę taryfową
     - brak wyjątków dla konkretnych linii
     - JSON pobierany z tego samego folderu co HTML
     ========================================================= -->
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FWTP - Tabliczka testowa</title>
<link rel="stylesheet" href="../css/style.css">

<style>
:root{
    --czerwony:#d61c12;
    --tekst:#111;
    --szary:#666;
    --os-x:24px;
    --os-w:2.3px;
    --kropka:10px;
}

*{box-sizing:border-box}

body{
    margin:0;
    background:#f4f4f4;
    color:var(--tekst);
    font-family:Calibri,"Segoe UI",Arial,sans-serif;
}

.topbar{
    display:flex;
    align-items:center;
    min-height:54px;
    padding:0 20px;
    background:#fff;
    border-bottom:1px solid #ddd;
}

.logo{
    font-size:25px;
    font-weight:800;
}

.tabliczka-page{
    max-width:1260px;
    margin:24px auto;
    padding:0 15px;
}

.sterowanie{
    margin-bottom:18px;
    padding:16px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:8px;
}

.sterowanie h1{
    margin:0 0 13px;
    font-size:25px;
}

.sterowanie-grid{
    display:grid;
    grid-template-columns:110px 180px 120px 1fr auto;
    gap:9px;
    align-items:end;
}

.pole{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.pole label{
    font-size:13px;
    font-weight:700;
}

.pole input,
.pole select{
    width:100%;
    min-height:39px;
    padding:7px 9px;
    border:1px solid #ccc;
    border-radius:5px;
    background:#fff;
    font:inherit;
    font-size:14px;
}

.pokaz-btn{
    min-height:39px;
    padding:8px 18px;
    border:0;
    border-radius:5px;
    background:var(--czerwony);
    color:#fff;
    font:inherit;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.pokaz-btn:hover{background:#b8170f}

.status{
    margin-top:9px;
    color:#666;
    font-size:13px;
}

.tabliczka-scroll{
    overflow-x:auto;
    padding-bottom:8px;
}

.tabliczka{
    width:100%;
    min-width:850px;
    background:#fff;
    border:1px solid #bcbcbc;
}

.naglowek{
    display:grid;
    grid-template-columns:145px 1fr;
    min-height:112px;
    border-bottom:3px solid #111;
}

.numer-linii-box{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    background:var(--czerwony);
    color:#fff;
    font-size:60px;
    line-height:1;
    font-weight:800;
}

.naglowek-info{
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:12px 20px;
}

.naglowek-kierunek{
    font-size:15px;
    font-weight:700;
    text-transform:uppercase;
}

.naglowek-cel{
    margin-top:3px;
    font-size:31px;
    line-height:1.05;
    font-weight:800;
}

.naglowek-przystanek{
    margin-top:6px;
    color:#555;
    font-size:15px;
}

.tresc{
    display:grid;
    grid-template-columns:minmax(300px,42%) 1fr;
}

.trasa-panel{
    padding:13px 16px 17px;
    border-right:2px solid #111;
}

.trasa-tytul{
    margin:0 0 7px;
    font-size:15px;
    font-weight:800;
    text-transform:uppercase;
}

.trasa-lista{
    position:relative;
}

.trasa-wiersz{
    position:relative;
    display:grid;
    grid-template-columns:48px minmax(0,1fr);
    min-height:27px;
    align-items:center;
}

/* Oś jest częścią każdego wiersza. Dzięki temu przechodzi również
   przez separatory i nie powstają szczeliny. */
.trasa-wiersz::before{
    content:"";
    position:absolute;
    left:var(--os-x);
    top:0;
    bottom:0;
    width:var(--os-w);
    transform:translateX(-50%);
    background:#111;
    z-index:1;
}

.trasa-wiersz.pierwszy::before{
    top:50%;
}

.trasa-wiersz.ostatni::before{
    bottom:50%;
}

.trasa-os{
    position:relative;
    align-self:stretch;
    min-height:27px;
}

.trasa-kropka{
    position:absolute;
    z-index:3;
    left:var(--os-x);
    top:50%;
    width:var(--kropka);
    height:var(--kropka);
    transform:translate(-50%,-50%);
    border:2px solid #111;
    border-radius:50%;
    background:#fff;
}

.trasa-wiersz.pierwszy .trasa-kropka,
.trasa-wiersz.ostatni .trasa-kropka{
    background:#111;
}

.trasa-nazwa{
    position:relative;
    z-index:2;
    padding:3px 2px 3px 0;
    font-size:14px;
    line-height:1.05;
    font-weight:600;
    overflow-wrap:normal;
    word-break:normal;
}

.trasa-wiersz.aktualny .trasa-nazwa{
    font-weight:900;
}

.trasa-wiersz.aktualny .trasa-kropka{
    width:13px;
    height:13px;
    background:var(--czerwony);
    border-color:var(--czerwony);
}

.trasa-separator{
    min-height:24px;
}

.trasa-separator .trasa-os{
    min-height:24px;
}

.separator-tekst{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    gap:7px;
    min-width:0;
    padding:2px 0;
    color:#565656;
    font-size:12px;
    line-height:1;
    font-weight:700;
    white-space:nowrap;
}

.separator-tekst::before,
.separator-tekst::after{
    content:"";
    height:1px;
    background:#8b8b8b;
    flex:1 1 auto;
    min-width:10px;
}

.trasa-strefa .separator-tekst{
    color:#111;
    font-weight:800;
}

.trasa-strefa .separator-tekst::before,
.trasa-strefa .separator-tekst::after{
    height:0;
    border-top:2px double #111;
    background:none;
}

.trasa-graniczny .trasa-nazwa::after{
    content:"  [1/2]";
    font-size:10px;
    font-weight:800;
}

.rozklad-panel{
    min-width:0;
    padding:13px 16px 17px;
}

.rozklad-tytul{
    margin:0 0 9px;
    font-size:15px;
    font-weight:800;
    text-transform:uppercase;
}

.rozklad-placeholder{
    padding:18px;
    border:1px dashed #bbb;
    color:#666;
    font-size:14px;
}

.blad{
    padding:18px;
    background:#fff;
    border:1px solid #d7a4a4;
    color:#8c1717;
    font-weight:700;
}

@media(max-width:800px){
    .sterowanie-grid{grid-template-columns:1fr 1fr}
    .tresc{grid-template-columns:1fr}
    .trasa-panel{border-right:0;border-bottom:2px solid #111}
}
</style>
</head>

<body>
<header class="topbar">
    <div class="logo">FWTP</div>
</header>

<main class="tabliczka-page">
<section class="sterowanie">
    <h1>Tabliczka przystankowa — test V480</h1>

    <div class="sterowanie-grid">
        <div class="pole">
            <label for="liniaInput">Linia</label>
            <input id="liniaInput" type="text" placeholder="np. 150">
        </div>

        <div class="pole">
            <label for="dataInput">Data</label>
            <input id="dataInput" type="date">
        </div>

        <div class="pole">
            <label for="kierunekInput">Kierunek</label>
            <select id="kierunekInput"></select>
        </div>

        <div class="pole">
            <label for="przystanekInput">Przystanek</label>
            <select id="przystanekInput"></select>
        </div>

        <button class="pokaz-btn" id="pokazBtn" type="button">Pokaż</button>
    </div>

    <div class="status" id="status"></div>
</section>

<div class="tabliczka-scroll">
    <div id="wynik"></div>
</div>
</main>

<script>
/* =========================================================
   FWTP TABLICZKA — WERSJA 480
   NOWY, CZYSTY SILNIK OPARTY O JSON V38+
   ========================================================= */

const WERSJA_TABLICZKI = "480";
const BASE_DANE = "./";

let daneLinii = null;

const qs = new URLSearchParams(location.search);

const liniaInput = document.getElementById("liniaInput");
const dataInput = document.getElementById("dataInput");
const kierunekInput = document.getElementById("kierunekInput");
const przystanekInput = document.getElementById("przystanekInput");
const pokazBtn = document.getElementById("pokazBtn");
const statusEl = document.getElementById("status");
const wynikEl = document.getElementById("wynik");

function txt(v){
    return String(v ?? "").replace(/\s+/g," ").trim();
}

function esc(v){
    return txt(v)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
}

function norm(v){
    return txt(v).toLocaleUpperCase("pl-PL");
}

function tablica(v){
    return Array.isArray(v) ? v : [];
}

function dzisiejszaData(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
}

function nazwaStopu(stop){
    return txt(stop?.nazwa_czysta) || txt(stop?.nazwa);
}

function miejscowoscStopu(stop){
    return txt(stop?.miejscowosc);
}

function strefaStopu(stop){
    return txt(stop?.strefa);
}

function idStopu(stop){
    return txt(stop?.id);
}

function typStopu(stop){
    return norm(stop?.typ || "STOP");
}

function czyPasazerski(stop){
    return typStopu(stop) !== "TECH";
}

/* ---------------------------------------------------------
   Rozkłady / kierunki — obsługa struktury obecnego eksportera
   --------------------------------------------------------- */

function wszystkieRozklady(){
    return tablica(daneLinii?.rozkłady || daneLinii?.rozklady);
}

function wybierzRozklad(){
    const rozklady = wszystkieRozklady();
    if(!rozklady.length) return null;

    /* Na tym etapie nie zgadujemy przebiegu z dnia.
       Wybór rozkładu służy tylko znalezieniu danych kierunku.
       Jeżeli eksporter poda w przyszłości daty obowiązywania,
       tutaj będzie jedyne miejsce wyboru rozkładu. */
    return rozklady[0];
}

function kierunkiZRozkladu(rozklad){
    return tablica(
        rozklad?.kierunki ||
        daneLinii?.kierunki
    );
}

function przystankiKierunku(kierunek){
    return tablica(
        kierunek?.przystanki ||
        kierunek?.stops
    ).filter(czyPasazerski);
}

function pobierzKursyZeStopu(stop){
    return tablica(stop?.kursy);
}

function trasaKursu(kurs){
    return tablica(kurs?.trasa).map(txt).filter(Boolean);
}

/* ---------------------------------------------------------
   Kluczowa zasada V480:
   trasę wyznacza WYŁĄCZNIE kurs.trasa.
   --------------------------------------------------------- */

function znajdzKursDlaWybranegoPrzystanku(stop){
    const kursy = pobierzKursyZeStopu(stop);

    /* Preferujemy pierwszy kurs, który ma nową strukturę trasa. */
    const zTrasa = kursy.find(k => trasaKursu(k).length);
    return zTrasa || null;
}

function mapaStopow(kierunek){
    const map = new Map();

    for(const stop of przystankiKierunku(kierunek)){
        const id = idStopu(stop);
        if(id && !map.has(id)){
            map.set(id,stop);
        }
    }

    return map;
}

function zbudujPrzebieg(kierunek, wybranyStop){
    const mapa = mapaStopow(kierunek);
    const kurs = znajdzKursDlaWybranegoPrzystanku(wybranyStop);

    if(!kurs){
        throw new Error(
            "Wybrany przystanek nie ma kursu z polem „trasa”. " +
            "V480 nie zgaduje przebiegu ze starej struktury."
        );
    }

    const ids = trasaKursu(kurs);
    const wynik = [];

    for(const id of ids){
        const stop = mapa.get(id);

        if(stop){
            wynik.push(stop);
        }else{
            console.warn("V480: ID z kurs.trasa nie znalezione w kierunku:",id);
        }
    }

    if(!wynik.length){
        throw new Error(
            "Pole „trasa” istnieje, ale jego ID nie pasują do przystanków kierunku."
        );
    }

    return {
        kurs,
        przystanki:wynik
    };
}

/* ---------------------------------------------------------
   Separatory
   Miejscowość i strefa pochodzą wyłącznie z JSON.
   --------------------------------------------------------- */

function separatorMiejscowosci(nazwa){
    return `
        <div class="trasa-wiersz trasa-separator trasa-miejscowosc">
            <div class="trasa-os"></div>
            <div class="separator-tekst">${esc(nazwa)}</div>
        </div>
    `;
}

function separatorStrefy(tekst){
    return `
        <div class="trasa-wiersz trasa-separator trasa-strefa">
            <div class="trasa-os"></div>
            <div class="separator-tekst">${esc(tekst)}</div>
        </div>
    `;
}

function tekstStrefy(strefa){
    if(strefa === "1") return "STREFA I";
    if(strefa === "2") return "STREFA II";
    return "";
}

function zbudujElementyTrasy(przystanki){
    const elementy = [];

    let poprzedniaMiejscowosc = null;
    let poprzedniaStrefa = null;

    przystanki.forEach((stop,index)=>{
        const miejsc = miejscowoscStopu(stop);
        const strefa = strefaStopu(stop);

        /* Separator miejscowości przed pierwszym przystankiem danej
           miejscowości. Warszawy nie wymuszamy sztucznie — jeżeli JSON
           ją poda, może być pokazana tak samo jak pozostałe. */
        if(
            index > 0 &&
            miejsc &&
            miejsc !== poprzedniaMiejscowosc
        ){
            elementy.push({
                typ:"miejscowosc",
                tekst:miejsc
            });
        }

        /* Zmiana 1 -> 2 lub 2 -> 1.
           Sam przystanek 1/2 jest oznaczony jako graniczny i nie powoduje
           zgadywania strony granicy. */
        if(
            index > 0 &&
            strefa !== "1/2" &&
            poprzedniaStrefa &&
            poprzedniaStrefa !== "1/2" &&
            strefa &&
            strefa !== poprzedniaStrefa
        ){
            elementy.push({
                typ:"strefa",
                tekst:tekstStrefy(strefa)
            });
        }

        elementy.push({
            typ:"stop",
            stop
        });

        if(miejsc){
            poprzedniaMiejscowosc = miejsc;
        }

        if(strefa && strefa !== "1/2"){
            poprzedniaStrefa = strefa;
        }
    });

    return elementy;
}

function renderujTrase(przystanki, wybranyStop){
    const elementy = zbudujElementyTrasy(przystanki);
    const stopElementy = elementy.filter(e=>e.typ==="stop");

    let nrStopu = 0;
    let html = "";

    for(const el of elementy){
        if(el.typ === "miejscowosc"){
            html += separatorMiejscowosci(el.tekst);
            continue;
        }

        if(el.typ === "strefa"){
            html += separatorStrefy(el.tekst);
            continue;
        }

        const stop = el.stop;
        const pierwszy = nrStopu === 0;
        const ostatni = nrStopu === stopElementy.length - 1;
        const aktualny =
            idStopu(stop) &&
            idStopu(stop) === idStopu(wybranyStop);

        const klasy = [
            "trasa-wiersz",
            pierwszy ? "pierwszy" : "",
            ostatni ? "ostatni" : "",
            aktualny ? "aktualny" : "",
            strefaStopu(stop) === "1/2" ? "trasa-graniczny" : ""
        ].filter(Boolean).join(" ");

        html += `
            <div class="${klasy}" data-stop-id="${esc(idStopu(stop))}">
                <div class="trasa-os">
                    <span class="trasa-kropka"></span>
                </div>
                <div class="trasa-nazwa">${esc(nazwaStopu(stop))}</div>
            </div>
        `;

        nrStopu++;
    }

    return html;
}

/* ---------------------------------------------------------
   Cel / nazwa kierunku
   --------------------------------------------------------- */

function nazwaKierunku(kierunek, przebieg){
    const bezposrednia =
        txt(kierunek?.nazwa) ||
        txt(kierunek?.kierunek);

    if(bezposrednia) return bezposrednia;

    const ostatni = przebieg.at(-1);
    return ostatni ? nazwaStopu(ostatni) : "";
}

/* ---------------------------------------------------------
   Render tabliczki
   --------------------------------------------------------- */

function renderuj(){
    try{
        const rozklad = wybierzRozklad();
        if(!rozklad) throw new Error("Brak rozkładów w JSON.");

        const kierunki = kierunkiZRozkladu(rozklad);
        const ki = Number(kierunekInput.value || 0);
        const kierunek = kierunki[ki];

        if(!kierunek) throw new Error("Nie znaleziono wybranego kierunku.");

        const przystanki = przystankiKierunku(kierunek);
        const pi = Number(przystanekInput.value || 0);
        const wybranyStop = przystanki[pi];

        if(!wybranyStop) throw new Error("Nie znaleziono wybranego przystanku.");

        const wynik = zbudujPrzebieg(kierunek,wybranyStop);
        const przebieg = wynik.przystanki;
        const cel = nazwaKierunku(kierunek,przebieg);

        wynikEl.innerHTML = `
            <article class="tabliczka">
                <header class="naglowek">
                    <div class="numer-linii-box">${esc(daneLinii?.linia || liniaInput.value)}</div>
                    <div class="naglowek-info">
                        <div class="naglowek-kierunek">kierunek</div>
                        <div class="naglowek-cel">${esc(cel)}</div>
                        <div class="naglowek-przystanek">
                            przystanek: ${esc(nazwaStopu(wybranyStop))}
                        </div>
                    </div>
                </header>

                <div class="tresc">
                    <section class="trasa-panel">
                        <h2 class="trasa-tytul">Trasa przejazdu</h2>
                        <div class="trasa-lista">
                            ${renderujTrase(przebieg,wybranyStop)}
                        </div>
                    </section>

                    <section class="rozklad-panel">
                        <h2 class="rozklad-tytul">Rozkład jazdy</h2>
                        <div class="rozklad-placeholder">
                            V480 przebudowuje najpierw silnik trasy.
                            Rozkład godzin zostanie podłączony do tego samego,
                            nowego modelu JSON bez przywracania starego
                            mechanizmu budowania przebiegu.
                        </div>
                    </section>
                </div>
            </article>
        `;

        statusEl.textContent =
            `FWTP V480 • przebieg: ${przebieg.length} przystanków • ` +
            `źródło: kurs.trasa`;

    }catch(err){
        console.error(err);
        wynikEl.innerHTML =
            `<div class="blad">${esc(err?.message || err)}</div>`;
        statusEl.textContent = "Błąd renderowania V480.";
    }
}

/* ---------------------------------------------------------
   Wypełnianie kontrolek
   --------------------------------------------------------- */

function wypelnijKierunki(){
    const rozklad = wybierzRozklad();
    const kierunki = kierunkiZRozkladu(rozklad);

    kierunekInput.innerHTML = kierunki.map((k,i)=>{
        const stops = przystankiKierunku(k);
        const nazwa =
            txt(k?.nazwa) ||
            txt(k?.kierunek) ||
            (stops.length ? nazwaStopu(stops.at(-1)) : `Kierunek ${i+1}`);

        return `<option value="${i}">${esc(nazwa)}</option>`;
    }).join("");

    let k = Number(qs.get("kierunek") || 0);
    if(!Number.isInteger(k) || k < 0 || k >= kierunki.length) k = 0;
    kierunekInput.value = String(k);

    wypelnijPrzystanki();
}

function wypelnijPrzystanki(){
    const rozklad = wybierzRozklad();
    const kierunki = kierunkiZRozkladu(rozklad);
    const k = Number(kierunekInput.value || 0);
    const kierunek = kierunki[k];
    const stops = przystankiKierunku(kierunek);

    przystanekInput.innerHTML = stops.map((s,i)=>{
        const nr = txt(s?.nr);
        const suffix = nr ? ` ${nr}` : "";
        return `<option value="${i}">${esc(nazwaStopu(s)+suffix)}</option>`;
    }).join("");

    const p = qs.get("przystanek") || "";
    const m = /^idx:(\d+)$/i.exec(p);

    let idx = m ? Number(m[1]) : 0;
    if(!Number.isInteger(idx) || idx < 0 || idx >= stops.length) idx = 0;

    przystanekInput.value = String(idx);
}

/* ---------------------------------------------------------
   Ładowanie JSON z tego samego katalogu
   --------------------------------------------------------- */

async function laduj(){
    const linia = txt(liniaInput.value);

    if(!linia){
        wynikEl.innerHTML = `<div class="blad">Podaj numer linii.</div>`;
        return;
    }

    statusEl.textContent = `Ładowanie ${linia}.json…`;

    try{
        const url = `${BASE_DANE}${encodeURIComponent(linia)}.json`;

        const response = await fetch(url,{
            cache:"no-store"
        });

        if(!response.ok){
            throw new Error(`Nie udało się pobrać ${linia}.json (${response.status}).`);
        }

        daneLinii = await response.json();

        wypelnijKierunki();
        renderuj();

    }catch(err){
        console.error(err);
        wynikEl.innerHTML =
            `<div class="blad">${esc(err?.message || err)}</div>`;
        statusEl.textContent = "Błąd ładowania JSON.";
    }
}

/* ---------------------------------------------------------
   URL
   --------------------------------------------------------- */

function aktualizujURL(){
    const p = new URLSearchParams(location.search);

    p.set("linia",txt(liniaInput.value));
    p.set("data",dataInput.value || dzisiejszaData());
    p.set("kierunek",String(kierunekInput.value || 0));
    p.set("przystanek",`idx:${przystanekInput.value || 0}`);

    history.replaceState(null,"",`${location.pathname}?${p.toString()}`);
}

liniaInput.value = qs.get("linia") || "150";
dataInput.value = qs.get("data") || dzisiejszaData();

pokazBtn.addEventListener("click",()=>{
    aktualizujURL();
    laduj();
});

kierunekInput.addEventListener("change",()=>{
    wypelnijPrzystanki();
    aktualizujURL();
    renderuj();
});

przystanekInput.addEventListener("change",()=>{
    aktualizujURL();
    renderuj();
});

liniaInput.addEventListener("keydown",e=>{
    if(e.key === "Enter"){
        aktualizujURL();
        laduj();
    }
});
