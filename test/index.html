function znajdzNajpelniejszyKierunek(index){

    let najlepszy=null;
    let ile=-1;

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const k=
                Array.isArray(
                    rozklad.kierunki
                )
                    ? rozklad.kierunki[index]
                    : null;

            if(
                !k||
                !Array.isArray(
                    k.przystanki
                )
            ){
                return;
            }

            if(
                k.przystanki.length>
                ile
            ){
                najlepszy=k;
                ile=k.przystanki.length;
            }
        }
    );

    return najlepszy;
}


function pobierzKierunki(){

    let max=0;

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        r=>{
            if(
                Array.isArray(
                    r.kierunki
                )
            ){
                max=
                    Math.max(
                        max,
                        r.kierunki.length
                    );
            }
        }
    );

    const wynik=[];
    const widzianeTrasy=[];

    const normalizujNazwe=
        nazwa=>
            String(
                nazwa||
                ""
            )
            .toUpperCase()
            .replace(/\u00A0/g," ")
            .replace(/\s+/g," ")
            .replace(/[.,;:]+$/g,"")
            .trim();

    const nazwyTrasy=
        k=>
            (
                k?.przystanki||
                []
            )
            .map(
                p=>
                    normalizujNazwe208(
                        p?.nazwa
                    )
            );

    const takieSameNazwy=
        (a,b)=>{

            if(
                a.length!==b.length
            ){
                return false;
            }

            for(
                let j=0;
                j<a.length;
                j++
            ){
                if(
                    a[j]!==b[j]
                ){
                    return false;
                }
            }

            return true;
        };

    for(
        let i=0;
        i<max;
        i++
    ){

        const k=
            znajdzNajpelniejszyKierunek(
                i
            );

        if(!k){
            continue;
        }

        const nazwy=
            nazwyTrasy(k);

        /*
           Numery stanowisk/przystanków są całkowicie ignorowane.
           Jeżeli kolejność i nazwy przystanków są takie same,
           drugi kierunek/wariant nie jest dodawany.
        */
        const duplikat=
            widzianeTrasy.some(
                poprzednia=>
                    takieSameNazwy(
                        poprzednia,
                        nazwy
                    )
            );

        if(duplikat){
            continue;
        }

        widzianeTrasy.push(
            nazwy
        );

        wynik.push({
            index:i,
            dane:k
        });
    }

    return wynik;
}


function nazwaKierunku(
    k,
    kierunekIndex=aktualnyKierunek
){

    /*
       v226:
       kierunek wyliczony z kursów aktualnego przystanku może być użyty
       TYLKO dla aktualnie wybranego kierunku.

       Wcześniej kierunekZDokladnychKursow206() był wywoływany dla KAŻDEJ
       pozycji selecta, dlatego np. oba kierunki linii 401 dostawały
       tę samą nazwę „URSYNÓW PŁD.”, mimo że ich listy przystanków
       były prawidłowe.
    */
    if(
        Number(kierunekIndex)===
        Number(aktualnyKierunek)
    ){
        const zKursow=
            kierunekZDokladnychKursow206();

        if(zKursow){
            return zKursow;
        }
    }

    /*
       Dla pozostałych kierunków nazwa pochodzi z ich własnej trasy.
       TECH nie może być kierunkiem pasażerskim.
    */
    const lista=
        k?.przystanki||
        [];

    for(
        let i=lista.length-1;
        i>=0;
        i--
    ){
        if(
            typPrzystankuTrasy(
                lista[i]
            )!=="TECH"
        ){
            return String(
                lista[i]?.nazwa||
                ""
            ).trim();
        }
    }

    return String(
        k?.nazwa||
        k?.kierunek||
        ""
    ).trim();
}

function wypelnijKierunki(){

    const select=
        document.getElementById(
            "kierunekSelect"
        );

    const lista=
        pobierzKierunki();

    select.innerHTML="";

    lista.forEach(
        el=>{

            const option=
                document.createElement(
                    "option"
                );

            option.value=
                String(el.index);

            option.textContent=el.dane?.okrezna===true || (
                v486Array(el.dane?.przystanki).length>2 &&
                v486StopName(el.dane.przystanki[0])===
                v486StopName(el.dane.przystanki.at(-1))
            )
                ? (v630OpisKierunku(el.dane)||"Kierunek "+(el.index+1))
                : (nazwaKierunku(el.dane,el.index)||"Kierunek "+(el.index+1));

            select.appendChild(option);
        }
    );

    select.disabled=
        !lista.length;

    select.value=
        String(
            aktualnyKierunek
        );
}

function czyTenSamPrzystanekPoNazwieINumerze(
    a,
    b
){

    if(
        !a||
        !b
    ){
        return false;
    }

    const nazwaA=
        normalizuj(
            a.nazwa
        );

    const nazwaB=
        normalizuj(
            b.nazwa
        );

    const nrA=
        String(
            a.nr||""
        ).trim();

    const nrB=
        String(
            b.nr||""
        ).trim();

    return(
        nazwaA===
            nazwaB&&
        nrA===
            nrB
    );
}

function __bezCache_czyBiezacyPrzystanekKraniecWiekszosciKursow(){

    const kierunek=
        znajdzNajpelniejszyKierunek(
            aktualnyKierunek
        );

    const przystanki=
        kierunek?.przystanki||
        [];

    const aktywny=
        przystanki[
            aktualnyPrzystanek
        ];

    if(!aktywny){
        return false;
    }

    const kursyNaAktywnym=
        new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    aktualnyKierunek,
                    aktywny
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        czasNaMinuty(
                            kurs?.czas
                        )===null
                    ){
                        return;
                    }

                    const key=
                        [
                            String(
                                kurs?.numer||""
                            ),
                            String(
                                kurs?.wariant||""
                            ),
                            symbolDnia(kurs)
                        ].join("|");

                    if(!kursyNaAktywnym.has(key)){
                        kursyNaAktywnym.set(
                            key,
                            {
                                numer:String(
                                    kurs?.numer||""
                                ),
                                wariant:String(
                                    kurs?.wariant||""
                                ),
                                symbol:
                                    symbolDnia(kurs)
                            }
                        );
                    }
                }
            );
        }
    );

    if(!kursyNaAktywnym.size){
        return false;
    }

    let koncowe=0;
    let przelotowe=0;

    for(
        const ref
        of kursyNaAktywnym.values()
    ){

        const indeksy=[];

        przystanki.forEach(
            (p,index)=>{

                let maCzas=false;

                (
                    daneLinii?.rozkłady||
                    []
                ).some(
                    rozklad=>{

                        const pp=
                            znajdzPrzystanekWRozkladzie(
                                rozklad,
                                aktualnyKierunek,
                                p
                            );

                        const znaleziony=
                            (
                                pp?.kursy||
                                []
                            ).find(
                                k=>
                                    String(
                                        k?.numer||""
                                    )===
                                        ref.numer&&
                                    String(
                                        k?.wariant||""
                                    )===
                                        ref.wariant&&
                                    symbolDnia(k)===
                                        ref.symbol&&
                                    czasNaMinuty(
                                        k?.czas
                                    )!==null
                            );

                        if(znaleziony){
                            maCzas=true;
                        }

                        return maCzas;
                    }
                );

                if(maCzas){
                    indeksy.push(index);
                }
            }
        );

        if(!indeksy.length){
            continue;
        }

        const pierwszy=
            indeksy[0];

        const ostatni=
            indeksy[
                indeksy.length-1
            ];

        if(
            aktualnyPrzystanek===
                pierwszy||
            aktualnyPrzystanek===
                ostatni
        ){
            koncowe++;
        }
        else{
            przelotowe++;
        }
    }

    /*
       Jeżeli co najmniej połowa kursów obsługujących ten słupek
       zaczyna się albo kończy właśnie tutaj, traktujemy go jako
       rzeczywisty kraniec trasy podstawowej.

       To naprawia przypadki takie jak SADYBA 05:
       część kursów jedzie dalej jako wydłużone, ale dla większości
       kursów SADYBA jest początkiem/końcem podstawowej trasy.
    */
    return(
        koncowe>0&&
        koncowe>=przelotowe
    );
}

function katalogPrzystankowPasazerskichV576(indexKierunku){

    /* =========================================================
       FWTP V576 — JEDEN KATALOG WSZYSTKICH PRZYSTANKÓW PASAŻERSKICH
       =========================================================
       Źródłem listy wyboru nie jest już jeden rozkład ani jeden
       typ dnia. Zbieramy dokładne ID przystanków ze WSZYSTKICH
       bloków rozkładów dla wybranego kierunku.

       Do wyboru trafia każdy przystanek, na którym istnieje
       przynajmniej jeden rzeczywisty kurs pasażerski w dowolnym
       typie dnia. TECH jest pomijany.

       Przykład 134:
       - TORUŃSKA 05 — dzień powszedni -> MUSI być do wyboru,
       - SUWALSKA / METRO BRÓDNO — weekend -> MUSZĄ być do wyboru,
       - PKP TORUŃSKA z odpowiednich przebiegów -> także.
       ========================================================= */

    const mapa=new Map();
    const kolejnosc=[];

    const dodaj=p=>{
        if(!p)return;

        const id=v486StopId(p);
        if(!id)return;

        const typ=String(p?.typ||p?.typ_przystanku||'')
            .trim().toUpperCase();

        if(typ==='TECH')return;

        const maKursPasazerski=(p?.kursy||[]).some(k=>
            czasNaMinuty(k?.czas)!==null
        );

        if(!maKursPasazerski)return;

        const klucz=[
            String(p?.nazwa_czysta||p?.nazwa||'')
                .trim().toUpperCase(),
            String(p?.nr||'').trim().toUpperCase()
        ].join('|');

        if(!mapa.has(klucz)){
            mapa.set(klucz,p);
            kolejnosc.push(klucz);
        }else{
            /* Preferujemy bogatszy obiekt, np. z lista_przystankowa. */
            const stary=mapa.get(klucz);
            const staryModel=Array.isArray(stary?.lista_przystankowa?.elementy)
                ? stary.lista_przystankowa.elementy.length : 0;
            const nowyModel=Array.isArray(p?.lista_przystankowa?.elementy)
                ? p.lista_przystankowa.elementy.length : 0;

            if(nowyModel>staryModel){
                mapa.set(klucz,p);
            }
        }
    };

    (daneLinii?.rozkłady||[]).forEach(rozklad=>{
        const k=Array.isArray(rozklad?.kierunki)
            ? rozklad.kierunki[indexKierunku]
            : null;

        (k?.przystanki||[]).forEach(dodaj);
    });

    return kolejnosc.map(id=>mapa.get(id)).filter(Boolean);
}

const cacheCzasNaMinuty=
    new Map();

function czasNaMinuty(czas){

    const tekst=
        String(
            czas||""
        ).trim();

    if(
        cacheCzasNaMinuty.has(
            tekst
        )
    ){
        return cacheCzasNaMinuty.get(
            tekst
        );
    }

    const m=
        /^(\d{1,2}):(\d{2})$/
            .exec(
                tekst
            );

    if(!m){
        cacheCzasNaMinuty.set(
            tekst,
            null
        );

        return null;
    }

    const h=Number(m[1]);
    const min=Number(m[2]);

    if(
        h<0||
        h>47||
        min<0||
        min>59
    ){
        cacheCzasNaMinuty.set(
            tekst,
            null
        );

        return null;
    }

    const wynik=
        h*60+min;

    cacheCzasNaMinuty.set(
        tekst,
        wynik
    );

    return wynik;
}


function rozbijCzas(czas){

    const m=
        /^(\d{1,2}):(\d{2})$/
            .exec(
                String(
                    czas||""
                ).trim()
            );

    if(!m)return null;

    return{
        godzina:Number(m[1]),
        minuta:m[2]
    };
}

function symbolDnia(kurs){

    return String(
        kurs?.uwagi||
        ""
    )
        .trim()
        .toUpperCase();
}


/* =========================================================
   WERSJA 462 — DF NALEŻY DO DNIA POWSZEDNIEGO
   =========================================================
   symbolDnia(kurs) pozostaje BEZ ZMIAN i nadal zwraca pełne
   oznaczenie z JSON, np. "DF". Dzięki temu nie zmieniamy
   identyfikacji konkretnych kursów ani działającej logiki tras.

   grupaDnia(kurs) służy WYŁĄCZNIE do przypisania kursu do
   odpowiedniej tabeli dnia:
       D, DF, D... -> D (DZIEŃ POWSZEDNI)
       C, C...     -> C (SOBOTA I ŚWIĘTO)
       6, 6...     -> 6 (SOBOTA)
       7, 7...     -> 7 (ŚWIĘTO)
   ========================================================= */
function grupaDnia(kurs){

    const uwagi=
        symbolDnia(kurs);

    if(uwagi.startsWith("D")){
        return "D";
    }

    if(uwagi.startsWith("C")){
        return "C";
    }

    if(uwagi.startsWith("6")){
        return "6";
    }

    if(uwagi.startsWith("7")){
        return "7";
    }

    return uwagi;
}


function kluczKursu(kurs){

    return[
        String(
            kurs?.numer||""
        ),
        String(
            kurs?.wariant||""
        )
    ].join("||");
}



function numerWystapieniaPrzystankuWBazie(element){

    if(
        !element||
        !Object.prototype.hasOwnProperty.call(
            element,
            "index"
        )
    ){
        return 0;
    }

    const baza=
        kierunekBazowy()
            ?.przystanki||
        [];

    const index=
        Number(
            element.index
        );

    if(
        !Number.isInteger(index)||
        index<0||
        index>=baza.length
    ){
        return 0;
    }

    const cel=
        baza[index];

    const nazwa=
        normalizuj(
            cel?.nazwa
        );

    const nr=
        String(
            cel?.nr||""
        ).trim();

    let wystapienie=0;

    for(
        let i=0;
        i<index;
        i++
    ){

        const p=
            baza[i];

        if(
            normalizuj(
                p?.nazwa
            )===
                nazwa&&
            String(
                p?.nr||""
            ).trim()===
                nr
        ){
            wystapienie++;
        }
    }

    return wystapienie;
}



/* V486: usunięto starą funkcję listy: znajdzPrzystanekWRozkladzieDlaElementu */



function znajdzPrzystanekWRozkladzie(

    baza
){

    const k=
        Array.isArray(
            rozklad?.kierunki

            ? rozklad.kierunki[

    if(

                    nazwa&&

                    p.nr||""
                ).trim()===
                    nr
        )||
        null
    );
}



/* =========================================================
   FWTP TABLICZKA — WERSJA 606
   NIE POKAZUJ KURSU, KTÓRY KOŃCZY NA AKTUALNYM PRZYSTANKU
   =========================================================

   Rozkład na przystanku pokazuje ODJAZDY z tego przystanku.

   Jeżeli:
       kurs.koniec_trasy === ID aktualnego przystanku
   albo – dla starszego JSON-u – ostatni element kurs.trasa
   jest aktualnym przystankiem,

   to ten kurs właśnie tutaj kończy i NIE może być pokazany
   jako odjazd.

   Przykład 110:
       CM. PÓŁNOCNY-BRAMA ZACH. 03

   Kurs C:
       ... -> WIDOKOWA 02 -> CM. PÓŁNOCNY-BRAMA ZACH. 03 [KONIEC]

   Na Metro Marymont kurs C jest normalnie widoczny z literą C.
   Na CM. PÓŁNOCNY-BRAMA ZACH. kurs C znika z tabeli,
   bo z tego przystanku już nie odjeżdża.

   Kurs W przejeżdżający przez ten przystanek pozostaje.
   ========================================================= */

function v606CzyKursKonczyNaAktualnymPrzystanku(
    kurs,
    przystanek
){

    const aktualnyId=
        String(
            typeof v486StopId==="function"
                ? v486StopId(przystanek)
                : przystanek?.id||""
        )
        .trim();

    if(!aktualnyId){
        return false;
    }

    const koniec=
        String(
            kurs?.koniec_trasy||
            ""
        )
        .trim();

    /*
       Główne źródło prawdy – jawny koniec_trasy z JSON-u.
    */
    if(
        koniec&&
        koniec===aktualnyId
    ){
        return true;
    }

    /*
       Fallback dla starszych danych:
       ostatni dokładny ID w kurs.trasa.
    */
    const trasa=
        Array.isArray(kurs?.trasa)
            ? kurs.trasa
            : [];

    if(trasa.length){

        const ostatniId=
            String(
                trasa[
                    trasa.length-1
                ]||
                ""
            )
            .trim();

        if(
            ostatniId&&
            ostatniId===aktualnyId
        ){
            return true;
        }
    }

    return false;
}

function __bezCache_pobierzKursyDlaSymbolu(symbol){

    /*
       WERSJA 572

       Nie korzystamy tutaj z kierunkiAktywneDlaBiezacegoPrzystanku(),
       ponieważ ta funkcja w obecnej architekturze zwraca indeks
       kierunku, a starszy kod tabel oczekiwał obiektu z polami
       indexKierunku/przystanek. To powodowało pusty wynik V571.

       Dla tabel rozkładów zasada jest prostsza:
       - bierzemy aktualnie wybrany fizyczny przystanek,
       - zachowujemy aktualny kierunek,
       - przeszukujemy WSZYSTKIE daneLinii.rozkłady[],
       - z każdego bloku pobieramy ten sam przystanek,
       - filtrujemy kursy według D / C / 6 / 7.
    */

    const baza=
        kierunekBazowy();

    const aktywny=
        (
            baza?.przystanki||
            []
        )[
            aktualnyPrzystanek
        ];

    if(!aktywny){
        return[];
    }

    const mapa=
        new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        (rozklad,rozkladIndex)=>{

            const p=
                znajdzDokladnyPrzystanekWRozkladzie(
                    rozklad,
                    aktualnyKierunek,
                    aktywny
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    /* FWTP V632: DTECH/CTECH to przejazdy techniczne.
                       Nigdy nie pokazujemy ich jako odjazdów pasażerskich. */
                    if(/TECH/i.test(String(kurs?.uwagi||"")) ||
                       /TECH/i.test(String(kurs?.wariant||""))){
                        return;
                    }

                    if(
                        grupaDnia(kurs)!==
                        symbol
                    ){
                        return;
                    }

                    if(
                        czasNaMinuty(
                            kurs?.czas
                        )===null
                    ){
                        return;
                    }

                    /*
                       V606:
                       czas na przystanku końcowym jest czasem
                       przyjazdu/zakończenia kursu, a nie odjazdem.
                       Taki kurs nie trafia do tabeli rozkładu.
                    */
                    if(
                        v606CzyKursKonczyNaAktualnymPrzystanku(
                            kurs,
                            p
                        )
                    ){
                        return;
                    }

                    const key=
                        [
                            rozkladIndex,
                            aktualnyKierunek,
                            String(kurs?.numer||""),
                            String(kurs?.wariant||""),
                            String(kurs?.czas||"")
                        ].join("|");

                    if(!mapa.has(key)){

                        mapa.set(
                            key,
                            {
                                ...kurs,
                                _kierunekIndex:
                                    aktualnyKierunek,
                                _kierunekNazwa:
                                    String(
                                        (
                                            rozklad?.kierunki||
                                            []
                                        )[
                                            aktualnyKierunek
                                        ]?.nazwa||
                                        ""
                                    ),
                                _przystanekIndex:
                                    aktualnyPrzystanek,
                                _rozkladIndex:
                                    rozkladIndex
                            }
                        );
                    }
                }
            );
        }
    );

    return Array.from(
        mapa.values()
    );
}


/* =========================================================
   FWTP V493 — WEEKEND DODANY DO DZIAŁAJĄCEGO DNIA POWSZEDNIEGO
   =========================================================
   V490 poprawnie pokazywał D/DF. Tego mechanizmu NIE zmieniamy.
   Dla C/6/7 tylko dokładamy kursy tego samego ID przystanku
   z pozostałych bloków daneLinii["rozkłady"].
   ========================================================= */
function v493KursyInnychRozkladowDlaAktywnegoPrzystanku(){
    const active=v486CurrentStop();
    const activeId=v486StopId(active);
    const wynik=[];

    const rozklady=Array.isArray(daneLinii?.["rozkłady"])
        ? daneLinii["rozkłady"]
        : [];

    rozklady.forEach((rozklad,ri)=>{
        const kierunek=v486Array(rozklad?.kierunki)[aktualnyKierunek];
        if(!kierunek)return;

        const p=v486Array(kierunek.przystanki)
            .find(x=>v486StopId(x)===activeId);

        if(!p)return;

        v486Array(p.kursy).forEach(k=>{
            if(czasNaMinuty(k?.czas)===null)return;
            wynik.push({
                ...k,
                _v493RozkladIndex:ri
            });
        });
    });

    return wynik;
}

function pobierzKursyDlaSymbolu(symbol){

    /*
       =========================================================
       FWTP WERSJA 571
       WSZYSTKIE TYPY DNIA ZAWSZE ZE WSZYSTKICH ROZKŁADÓW
       =========================================================

       W V570 symbol D był pobierany wyłącznie z v486CurrentStop(),
       czyli z aktualnie wybranego bloku rozkładu. Gdy aktywny był
       blok SOBOTA I ŚWIĘTO, funkcja nie mogła zobaczyć kursów D
       znajdujących się w osobnym obiekcie daneLinii.rozkłady[].

       Od V571 D, C, 6 i 7 są pobierane dokładnie tą samą metodą:
       przeszukujemy WSZYSTKIE bloki daneLinii.rozkłady[] i szukamy
       tego samego fizycznego przystanku w odpowiednim kierunku.

       Wybrana data NIE decyduje już o tym, które typy dnia są
       widoczne na tabliczce. Data nadal może służyć pozostałej
       logice strony, ale sekcja tabel pokazuje wszystkie typy dnia,
       które istnieją dla danego przystanku.
    */

    const podstawowe=__bezCache_pobierzKursyDlaSymbolu(symbol);
    const wspolne=v631WspolnyPoczatek();
    if(!wspolne)return podstawowe;
    const id=v486StopId(v486CurrentStop());
    const wynik=[];
    const widziane=new Set();
    wspolne.forEach((dir,di)=>{
        v486Array(daneLinii?.rozkłady).forEach((r,ri)=>{
            const k=v486Array(r?.kierunki)[dir.index];
            const p=v486Array(k?.przystanki).find(x=>v486StopId(x)===id);
            if(!p)return;
            v486Array(p.kursy).forEach(kurs=>{
                if(/TECH/i.test(String(kurs?.uwagi||"")) ||
                   grupaDnia(kurs)!==symbol ||
                   czasNaMinuty(kurs?.czas)===null ||
                   v606CzyKursKonczyNaAktualnymPrzystanku(kurs,p))return;
                const key=[ri,dir.index,kurs.numer,kurs.czas].join('|');
                if(widziane.has(key))return;
                widziane.add(key);
                wynik.push({...kurs,_kierunekIndex:dir.index,
                    _v631Kierunek: String.fromCharCode(97+di),
                    _v631Opis:dir.opis,_rozkladIndex:ri});
            });
        });
    });
    return wynik;
}


function __bezCache_dostepneGrupyDni(){

    /*
       =========================================================
       FWTP V575 — WSZYSTKIE TYPY DNIA + NIE KURSUJE
       =========================================================
       O tym, jakie TABELE dnia istnieją, decyduje cała linia /
       kierunek, a nie wyłącznie aktualnie wybrany przystanek.

       Jeżeli np. linia ma SOBOTĘ I ŚWIĘTO, ale wybrany przystanek
       nie jest wtedy obsługiwany, tabela nadal jest widoczna.
       renderDzien() dostaje wtedy 0 kursów i pokazuje NIE KURSUJE.
    */

    let maD=false;
    let maC=false;
    let ma6=false;
    let ma7=false;

    (
        daneLinii?.rozkłady||
        []
    ).forEach(rozklad=>{

        const k=
            Array.isArray(rozklad?.kierunki)
                ? rozklad.kierunki[aktualnyKierunek]
                : null;

        (
            k?.przystanki||
            []
        ).forEach(p=>{

            (
                p?.kursy||
                []
            ).forEach(kurs=>{

                const g=grupaDnia(kurs);

                if(g==="D") maD=true;
                else if(g==="C") maC=true;
                else if(g==="6") ma6=true;
                else if(g==="7") ma7=true;
            });
        });
    });

    const wynik=[];

    if(maD){
        wynik.push({
            symbol:"D",
            tytul:"DZIEŃ POWSZEDNI"
        });
    }

    if(maC){
        wynik.push({
            symbol:"C",
            tytul:"SOBOTA I ŚWIĘTO"
        });
    }else{
        if(ma6){
            wynik.push({
                symbol:"6",
                tytul:"SOBOTA"
            });
        }

        if(ma7){
            wynik.push({
                symbol:"7",
                tytul:"ŚWIĘTO"
            });
        }
        /* V624: brak weekendowych kursow nie ukrywa tabel.
           W takim dniu renderDzien pokazuje NIE KURSUJE. */
        if(!ma6 && !ma7){
            wynik.push({symbol:"C",tytul:"SOBOTA I ŚWIĘTO"});
        }else if(ma6 && !ma7){
            wynik.push({symbol:"7",tytul:"ŚWIĘTO"});
        }else if(!ma6 && ma7){
            wynik.push({symbol:"6",tytul:"SOBOTA"});
        }
    }

    return wynik;
}

function dostepneGrupyDni(){

    return __bezCache_dostepneGrupyDni();
}

function __bezCache_mapaWariantow(){

    /*

    /*

    */
    if(

        publiczneLiteryWariantowAktualnegoKierunku();

        !literyKierunku.includes(

       - literą używaną przez legendę.

       Dzięki temu A znika w obu miejscach bez późniejszego
       manipulowania DOM-em.
    */
    if(
        znak==="A"&&
        czyUkrycWariantANaAktywnymPrzystanku213()
    ){

           A bez literki.

           pokazujemy również A.

       B/C/D/... pozostają normalnie widoczne.
    */
    if(
        znak==="A"&&
        liczbaWariantowKierunku<4
    ){
        return false;
    }

    /*
       Jeżeli w kierunku rzeczywiście występuje kilka

        liczbaWariantowKierunku>1

function kanonicznaLiteraWariantu(litera){

    const szukana=
        String(

        ).trim();

        return"";

    const mapa=
        mapaWariantow();

    const opis=
        mapa.get(
            szukana
        )||"";

    if(!opis){
        return szukana;
    }

    const klucz=
        normalizujOpisWariantu(
            opis
        );

    /*
       Jeżeli kilka wariantów ma identyczny opis,
       wybieramy tylko PIERWSZĄ literę występującą
       w mapie wariantów.

       C = "kurs przez ..."

       wtedy wszędzie używamy tylko B:
       - przy minutach,
       - w legendzie.
    */
    for(
        const [innaLitera,innyOpis]
        of mapa.entries()
    ){
        if(
            normalizujOpisWariantu(
                innyOpis
            )===klucz
        ){
            return String(
                innaLitera||""
            ).trim();
        }
    }

    return szukana;
}

    );
}




function normalizujSymbolKandydata(tekst){

    return String(
        tekst||""
    )
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .replace(
        /[^A-Za-z0-9]/g,
        ""
    )
    .toLowerCase();
}


function opisWariantuDoKierunku(
    litera,
    kierunekIndex
){

    const szukana=
        kanonicznaLiteraWariantu(
            String(
                litera||""
            ).trim()
        )
        .toLowerCase();

    let opis="";

    for(
        const [klucz,wartosc]
        of mapaWariantow().entries()
    ){
        const k=
            kanonicznaLiteraWariantu(
                String(
                    klucz||""
                ).trim()
            )
            .toLowerCase();

        if(k===szukana){
            opis=
                String(
                    wartosc||""
                ).trim();
            break;
        }
    }

    if(!opis){
        return"";
    }

    /*
       W legendzie chcemy:
       "kurs w kierunku ... przez PŁYTOWĄ, KUPIECKĄ I POLFA",
       a nie samo oznaczenie wariantu.
    */
    return opis
        .replace(
            /^kurs\s+/i,
            ""
        )
        .trim();
}


function __bezCache_mapaSymboliDwukierunkowych(){

    if(
        !czyBiezacyPrzystanekDwukierunkowy()
    ){
        return new Map();
    }

    const kombinacje=
        new Map();

    dostepneGrupyDni()
        .slice(0,3)
        .forEach(
            grupa=>{

                pobierzKursyDlaSymbolu(
                    grupa.symbol
                )
                .forEach(
                    kurs=>{

                        const dir=
                            Number(
                                kurs?._kierunekIndex
                            );

                        const litera=
                            literaWariantuPoRzeczywistymPrzebiegu(
                                {
                                    ...kurs,
                                    symbol:grupa.symbol,
                                    _kierunekIndex:dir
                                },
                                dir
                            );

                        const pokazWariant=
                            litera&&
                            czyPokazacWariantJakLiniaHTML(
                                litera
                            );

                        const wariant=
                            pokazWariant
                                ? String(litera).toLowerCase()
                                : "";

                        const key=
                            dir+"|"+wariant;

                        if(!kombinacje.has(key)){
                            kombinacje.set(
                                key,
                                {
                                    key,
                                    dir,
                                    wariant,
                                    kierunek:
                                        String(
                                            kurs?._kierunekNazwa||
                                            nazwaKierunku(
                                                znajdzNajpelniejszyKierunek(dir)
                                            )||
                                            ""
                                        ).toUpperCase()
                                }
                            );
                        }
                    }
                );
            }
        );

    const zajete=
        new Set();

    const wynik=
        new Map();

    const alfabet=
        "abcdefghijklmnopqrstuvwxyz".split("");

    [
        ...kombinacje.values()
    ]
    .sort(
        (a,b)=>
            Number(
                a.dir!==
                aktualnyKierunek
            )-
            Number(
                b.dir!==
                aktualnyKierunek
            )||
            a.wariant.localeCompare(
                b.wariant,
                "pl"
            )
    )
    .forEach(
        item=>{

            const kandydaci=[];

            if(item.wariant){
                kandydaci.push(
                    normalizujSymbolKandydata(
                        item.wariant
                    ).slice(0,1)
                );
            }

            const kierunekLitery=
                normalizujSymbolKandydata(
                    item.kierunek
                )
                .split("");

            kandydaci.push(
                ...kierunekLitery
            );

            kandydaci.push(
                ...alfabet
            );

            const znak=
                kandydaci.find(
                    x=>
                        x&&
                        !zajete.has(x)
                )||
                "x";

            zajete.add(znak);

            wynik.set(
                item.key,
                {
                    ...item,
                    znak
                }
            );
        }
    );

    return wynik;
}

function v574LiteryWidoczneNaLisciePrzystankow(){

    /*
       =========================================================
       FWTP WERSJA 574
       JEDNO ŹRÓDŁO LITER: lista_przystankowa.elementy[]
       =========================================================

       Nie ustalamy już osobno, jakie litery mają być pokazane
       przy minutach.

       Czytamy dokładnie te litery, które VBA V106 umieściło
       w gotowych separatorach:
           "Trasa w kursach „k”, „e”"
           "Trasa w kursach bez oznaczeń, „z”"

       Dzięki temu tabela godzin i lista przystanków nie mogą
       mieć dwóch różnych zestawów oznaczeń.
    */

    const wynik=new Set();

    const elementy=
        typeof v514ModelListy==="function"
            ? v514ModelListy()
            : null;

    if(!Array.isArray(elementy)){
        return wynik;
    }

    elementy.forEach(
        element=>{

            if(
                String(element?.typ||"")
                    .trim()
                    .toLowerCase()!=="trasa_w_kursach"
            ){
                return;
            }

            const tekst=
                String(element?.tekst||"");

            /*
               Najpierw typograficzne cudzysłowy używane przez VBA.
               Obsługujemy też zwykły cudzysłów jako zabezpieczenie.
            */
            const regex=/[„"]\s*([A-Za-z0-9]+)\s*[”"]/g;

            let match;

            while(
                (
                    match=regex.exec(tekst)
                )!==null
            ){
                const litera=
                    String(match[1]||"")
                        .trim()
                        .toUpperCase();

                if(litera){
                    wynik.add(litera);
                }
            }
        }
    );

    return wynik;
}



/* =========================================================
   FWTP TABLICZKA — WERSJA 602
   WARIANT SKRÓCONY WEDŁUG kurs.koniec_trasy

   Jeżeli JSON jawnie mówi, że wariant kończy się na innym
   przystanku niż wariant bazowy A, HTML ma pokazać jego literę
   przy minucie niezależnie od tego, czy separator
   lista_przystankowa zawiera tę literę.

   Przykład 110:
       A -> CH ŁOMIANKI
       C -> CM. PÓŁNOCNY-BRAMA ZACH.
   więc weekendowe kursy C muszą mieć literę C.

   Nie zmieniamy wariantów "przez ..." kończących się na tym
   samym krańcu co A.
   ========================================================= */
function v602CzyWariantMaInnyKoniecNizBaza(kurs){

    const wariant=
        String(kurs?.wariant||"")
            .trim()
            .toUpperCase();

    const koniec=
        String(kurs?.koniec_trasy||"")
            .trim();

    if(!wariant || wariant==="A" || !koniec){
        return false;
    }

    const kierunekIndex=
        Number.isInteger(Number(kurs?._kierunekIndex))
            ? Number(kurs._kierunekIndex)
            : aktualnyKierunek;

    const konceBazy=new Set();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(rozklad=>{

        const kierunek=
            Array.isArray(rozklad?.kierunki)
                ? rozklad.kierunki[kierunekIndex]
                : null;

        (
            kierunek?.przystanki||
            []
        ).forEach(p=>{

            (
                p?.kursy||
                []
            ).forEach(k=>{

                if(
                    String(k?.wariant||"")
                        .trim()
                        .toUpperCase()!=="A"
                ){
                    return;
                }

                const terminal=
                    String(k?.koniec_trasy||"")
                        .trim();

                if(terminal){
                    konceBazy.add(terminal);
                }
            });
        });
    });

    /*
       Jeżeli A nie występuje jawnie, nie zgadujemy.
       Dotychczasowa logika HTML pozostaje wtedy bez zmian.
    */
    if(!konceBazy.size){
        return false;
    }

    return !konceBazy.has(koniec);
}



/* =========================================================
   FWTP TABLICZKA — WERSJA 606
   CZY LITERA WARIANTU W DANYM TYPIE DNIA COKOLWIEK ROZRÓŻNIA?
   =========================================================

   Przykład 110 / CM. PÓŁNOCNY-BRAMA ZACH.:

   D:
       część kursów jedzie bez W,
       część kursów ma W
       => W MUSI być pokazane.

   C:
       wszystkie kursy z tego przystanku mają W
       => W niczego nie rozróżnia i ma być ukryte.

   Ważne:
   - sprawdzamy tylko kursy dostępne na AKTUALNYM przystanku,
   - sprawdzamy tylko JEDEN typ dnia (symbolDnia),
   - nie zmieniamy danych JSON,
   - nie zmieniamy litery na inną,
   - jeżeli występuje kurs bez wariantu albo drugi wariant,
     litera pozostaje widoczna.
   ========================================================= */

function v606CzyWariantJestJedynyWTymTypieDnia(
    wariant,
    symbolDnia
){

    const szukany=
        String(
            wariant||
            ""
        )
        .trim()
        .toUpperCase();

    if(!szukany){
        return false;
    }

    /* V660: w RAW porownujemy warianty w calym tygodniu, nie tylko
       w jednym typie dnia. Np. C w sobote linii 110 musi byc widoczne. */
    if(window.FWTPRawActive===true && szukany!=="A"){
        return false;
    }

    const kursy=
        pobierzKursyDlaSymbolu(
            symbolDnia
        )||[];

    if(!kursy.length){
        return false;
    }

    let znalezionoKurs=false;

    for(const kurs of kursy){

        znalezionoKurs=true;

        /*
           Najpierw dokładna litera z JSON-u.
           Dopiero dla starszych danych bez pola "wariant"
           korzystamy z istniejącego fallbacku przebiegu.
        */
        let litera=
            String(
                kurs?.wariant||
                ""
            )
            .trim()
            .toUpperCase();

        if(!litera){

            const dir=
                Number.isInteger(
                    Number(kurs?._kierunekIndex)
                )
                    ? Number(kurs._kierunekIndex)
                    : aktualnyKierunek;

            litera=
                String(
                    literaWariantuPoRzeczywistymPrzebiegu(
                        {
                            ...kurs,
                            symbol:symbolDnia,
                            _kierunekIndex:dir
                        },
                        dir
                    )||
                    ""
                )
                .trim()
                .toUpperCase();
        }

        /*
           Choćby jeden kurs bez tej litery oznacza,
           że wariant rzeczywiście rozróżnia kursy.
        */
        if(litera!==szukany){
            return false;
        }
    }

    return znalezionoKurs;
}


function symbolWariantu(kurs,symbolDnia){

    /*
       =========================================================
       FWTP TABLICZKA — WERSJA 606
       kurs.wariant Z JSON JEST ŹRÓDŁEM PRAWDY
       + UKRYCIE LITERY, GDY W DANYM TYPIE DNIA
         WSZYSTKIE KURSY Z TEGO PRZYSTANKU MAJĄ TEN SAM WARIANT
       =========================================================

       Jeżeli JSON kursu zawiera:
           "wariant": "C"
       HTML ma pokazać:
           C

       Nie wolno zamieniać C na "w", "g", "i" itd. na podstawie
       ponownego analizowania fizycznego przebiegu.

       Wyjątek zachowujemy tylko dla A:
       A nadal podlega istniejącej zasadzie widoczności wariantu A.
    */

    const wariantJSON=
        String(
            kurs?.wariant||
            ""
        )
        .trim()
        .toUpperCase();

    if(wariantJSON){

        if(wariantJSON==="A"){

            return czyPokazacWariantJakLiniaHTML("A")
                ? "A"
                : "";

        }

        /*
           V606:
           SKRÓCENIE MA PIERWSZEŃSTWO.

           Jeżeli wariant oznacza kurs skrócony / kurs tylko do
           konkretnego przystanku, litera MUSI pozostać nawet wtedy,
           gdy wszystkie kursy z tego przystanku w danym typie dnia
           mają tę samą literę.

           Przykład:
           METRO MARYMONT -> kursy skrócone do cmentarza:
           litera nadal jest potrzebna, bo informuje o innym końcu.

           Dopiero zwykły wariant przebiegu, np. W przez WIDOKOWĄ,
           można ukryć, jeżeli w C wszystkie kursy jadą właśnie W.
        */
        const opisV606=
            String(
                mapaWariantow().get(
                    wariantJSON
                )||
                ""
            )
            .trim();

        const jestSkroceniemV606=
            v602CzyWariantMaInnyKoniecNizBaza(
                {
                    ...kurs,
                    wariant:wariantJSON
                }
            )||
            /skrócon|skrocon|tylko\s+do/i.test(
                opisV606
            );

        if(jestSkroceniemV606){
            return wariantJSON;
        }

        if(
            v606CzyWariantJestJedynyWTymTypieDnia(
                wariantJSON,
                symbolDnia
            )
        ){
            return "";
        }

        return wariantJSON;
    }

    /*
       Fallback wyłącznie dla starszych JSON-ów, które nie mają
       pola kurs.wariant.
    */
    const dir=
        Number.isInteger(
            Number(kurs?._kierunekIndex)
        )
            ? Number(kurs._kierunekIndex)
            : aktualnyKierunek;

    const literaFallback=
        String(
            literaWariantuPoRzeczywistymPrzebiegu(
                {
                    ...kurs,
                    symbol:symbolDnia,
                    _kierunekIndex:dir
                },
                dir
            )||
            ""
        )
        .trim()
        .toUpperCase();

    if(!literaFallback){
        return "";
    }

    if(literaFallback==="A"){
        return czyPokazacWariantJakLiniaHTML("A")
            ? "A"
            : "";
    }

    /*
       V606: również w starszym JSON-ie nie chowamy skrócenia.
    */
    const opisFallbackV606=
        String(
            mapaWariantow().get(
                literaFallback
            )||
            ""
        )
        .trim();

    const jestSkroceniemFallbackV606=
        /skrócon|skrocon|tylko\s+do/i.test(
            opisFallbackV606
        );

    if(
        !jestSkroceniemFallbackV606&&
        v606CzyWariantJestJedynyWTymTypieDnia(
            literaFallback,
            symbolDnia
        )
    ){
        return "";
    }

    return literaFallback;
}


function v573CzyRozneTrasyMiedzyTypamiDnia(){

    /*
       Jeżeli ta sama linia ma różne fizyczne przebiegi w różnych
       blokach rozkładu, warianty tych kursów muszą być widoczne
       przy minutach. Sam fakt, że aktualna data wskazuje inny blok,
       nie może ich ukryć.

    const klucze=new Set();

                            if(trasa){

                            }

    return klucze.size>1;
}

function grupujGodziny(kursy){

    const mapa=new Map();

    kursy.forEach(
        kurs=>{

            const c=
                rozbijCzas(
                    kurs.czas
                );

            if(!c)return;

            const h=
                c.godzina%24;

            if(!mapa.has(h)){
                mapa.set(h,[]);
            }

            mapa.get(h).push({
                minuta:c.minuta,
                kurs
            });
        }
    );

    return mapa;
}



function wspolneGodzinyDlaGrup(grupy){

    const godziny=
        new Set();

    (
        grupy||
        []
    ).forEach(
        grupa=>{

            const kursy=
                pobierzKursyDlaSymbolu(
                    grupa.symbol
                );

            const mapa=
                grupujGodziny(
                    kursy
                );

            mapa.forEach(
                (wartosc,h)=>{
                    godziny.add(
                        Number(h)
                    );
                }
            );
        }
    );

    if(!godziny.size){
        return[];
    }

    /*
       Godziny traktujemy w kolejności komunikacyjnej:
       4, 5, 6 ... 23, 0, 1, 2, 3.

       Najważniejsza zmiana:
       tworzymy PEŁNY zakres od pierwszej do ostatniej godziny,
       a nie tylko godziny, w których faktycznie występują kursy.

       Przykład:
       kursy są o 6,7,8,9 oraz 14,15,...20
       => tabela dostanie również puste wiersze:
          10, 11, 12, 13.
    */

    const przesunieta=
        [...godziny]
            .map(
                h=>
                    h<4
                        ? h+24
                        : h
            )
            .sort(
                (a,b)=>a-b
            );

    const pierwsza=
        przesunieta[0];

    const ostatnia=
        przesunieta[
            przesunieta.length-1
        ];

    const wynik=[];

    for(
        let h=pierwsza;
        h<=ostatnia;
        h++
    ){
        wynik.push(
            h%24
        );
    }

    return wynik;
}

/* =========================================================
   FWTP TABLICZKA — WERSJA 625
   OZNACZENIE PRZY MINUCIE TYLKO PRZED PODJAZDEM.
   JSON kurs.wariant pozostaje nienaruszony (opis pełnego kursu).
   Na tabliczce odczytujemy fizyczny punkt wsiadania i kolejność
   przystanków kursu. Po minięciu CALOWEJ wariant M nie opisuje
   już przyszłego podjazdu — dotyczy to również KĘPY ZAWADOWSKIEJ.
   Nie ingerujemy w pozostałe warianty ani w listę przystankową.
   ========================================================= */
function v625SymbolWariantuDlaMinuty(kurs,symbolDnia){
    const litera=String(kurs?.wariant||"").trim().toUpperCase();
    if(String(daneLinii?.linia||"").trim()==="164" && litera==="M"){
        const p=v486CurrentStop();
        const aktualnyID=String(p?.id||"");
        const trasa=Array.isArray(kurs?.trasa)?kurs.trasa:[];
        const pozAktualna=trasa.indexOf(aktualnyID);
        const pozCalowa=trasa.findIndex(id=>
            /\|calowa\|/i.test(String(id||""))
        );
        if(pozAktualna>=0 && pozCalowa>=0 && pozAktualna>pozCalowa){
            return "";
        }
        // Kępa Zawadowska jest pierwszym przystankiem po
        // odcinku przez Calową; nie wymagamy zgodności indeksu
        // w przypadku kursów z technicznym pominięciem punktu.
        if(/\|kępa zawadowska\|02$/i.test(aktualnyID)){
            return "";
        }
    }
    return symbolWariantu(kurs,symbolDnia);
}

function renderDzien(grupa,wspolneGodziny){

    if(!godziny.length && kursy.length===0){

    let body="";

    if(

function znajdzCzasKursuNaPrzystanku(

    /*
       =========================================================
       WERSJA 415 — JEDEN FIZYCZNY KURS
       =========================================================

       Czasów kolejnych przystanków nie wolno już składać z kursów
       o tym samym numerze znalezionych w różnych rozkładach.

       Kandydat wskazuje konkretny rozkład. Od początku do końca

       =========================================================
    */

        Number.isInteger(
            Number(
                kandydat?.rozkladIndex
            )
        )
            ? rozklady[
                Number(
                    kandydat.rozkladIndex
                )
            ]
            : null;

    if(!rozklad){
        return null;
    }

    let p=null;

    if(

            )
        )
    ){
        p=
            znajdzPrzystanekWRozkladzieDlaElementu(
                rozklad,
                aktualnyKierunek,
                {
                    p:bazaP,
                    index:Number(
                        bazaIndex
                    )
                }
            );
    }
    else{
        p=
            znajdzPrzystanekWRozkladzie(
                rozklad,
                aktualnyKierunek,
                bazaP
            );
    }

    const kurs=
        (
            p?.kursy||
            []
        ).find(
            k=>
                String(
                    k?.numer||""
                )===
                    String(
                        kandydat?.numer||""
                    )&&
                String(
                    k?.wariant||""
                ).trim()===
                    String(
                        kandydat?.wariant||""
                    ).trim()&&
                (
                    !String(
                        kandydat?.brygada||""
                    ).trim()||
                    String(
                        k?.brygada||""
                    ).trim()===
                        String(
                            kandydat?.brygada||""
                        ).trim()
                )&&
                czasNaMinuty(
                    k?.czas

        );

    return kurs
        ? czasNaMinuty(
            kurs.czas
        )
        : null;

       Dodatkowa kontrola spójności:
       w jednym kursie czas przejazdu na kolejnych przystankach
       nie może się cofać. Nie poprawiamy danych sztucznie —

    let poprzedni415=null;

function usunDuplikatyTylkoOdKursowSkroconych(lista){

    const wynik=[];

    let i=0;

    while(i<lista.length){

        const nazwa=
            normalizuj(
                lista[i]?.p?.nazwa
            );

        let j=i+1;

        /*
           Interesują nas tylko KOLEJNE wystąpienia dokładnie
           tej samej nazwy przystanku.
        */
        while(
            j<lista.length&&
            normalizuj(
                lista[j]?.p?.nazwa
            )===nazwa
        ){
            j++;
        }

        const grupa=
            lista.slice(
                i,
                j
            );

        if(grupa.length===1){

            wynik.push(
                grupa[0]
            );

            i=j;
            continue;
        }

        const zeStatystykami=
            grupa.map(
                element=>({
                    element,
                    stat:
                        statystykaKursowPrzystankuTrasy(
                            element.p
                        )
                })
            );

        const zNormalnymi=
            zeStatystykami.filter(
                x=>
                    x.stat.normalne>0
            );

        /*
           Usuwamy powtórzenie TYLKO w bezpiecznym przypadku:

           - dokładnie jedno wystąpienie tej nazwy jest używane
             przez normalne / pełne kursy,
           - pozostałe wystąpienia mają wyłącznie kursy skrócone.

           Przykład linii 192:
           URSYNÓW PŁD. dla kursu skróconego +
           URSYNÓW PŁD. dla normalnych kursów do OS. KABATY

           => zostaje tylko ten drugi, normalny przystanek.

           Jeśli dwa przystanki o tej samej nazwie są rzeczywiście
           używane przez normalne kursy, NICZEGO nie łączymy.
        */
        if(
            zNormalnymi.length===1&&
            zeStatystykami.every(
                x=>
                    x===zNormalnymi[0]||
                    (
                        x.stat.normalne===0&&
                        x.stat.skrocone>0
                    )
            )
        ){
            wynik.push(
                zNormalnymi[0].element
            );
        }
        else{

            /*
               Nietypowy / niejednoznaczny przypadek:
               zachowujemy wszystkie wiersze, żeby nie usuwać
               prawdziwych dwóch różnych przystanków o tej samej nazwie.
            */
            grupa.forEach(
                element=>
                    wynik.push(
                        element
                    )
            );
        }

        i=j;
    }

    return wynik;
}

        kluczStanuTrasy(

        kluczStanuTrasy(

            '<li class="trasa-separator">'+

            'Trasa w kursach '+

            '</li>'
        );

    kandydat,
    element

    if(!kandydat||!element?.p)return null;

    const rozklad=
        (daneLinii?.rozkłady||[])[
            Number(kandydat.rozkladIndex)
        ];

        rozklad?.kierunki?.[
            aktualnyKierunek
        ]?.przystanki||[];

    const brygada=String(kandydat?.brygada||"").trim();

        (p?.kursy||[]).some(
            k=>
                String(k?.numer||"")===numer&&
                String(k?.wariant||"").trim()===wariant&&
                (

                    p,
                    element.p

        return dokladny;

    const nazwa=normalizuj(element.p?.nazwa);

    const zgodne=
        lista.filter(
            p=>
                normalizuj(p?.nazwa)===nazwa&&
                maKurs(p)
        );

            (a,b)=>
                Math.abs(lista.indexOf(a)-idx)-
                Math.abs(lista.indexOf(b)-idx)

}

function daneKursowAktywnego206(){

    const aktywnyIndex=
        Number(
            aktualnyPrzystanek

            aktualnyKierunek

    if(
        !aktywnyBaza||

            aktywnyIndex
        )
    ){

    }

    const wszystkieKlucze=
        new Set();

    const warianty=
        new Set();

    const przebiegi=[];

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const kierunek=
                rozklad?.kierunki?.[
                    Number(
                        aktualnyKierunek
                    )
                ];

            const lista=
                kierunek?.przystanki||
                [];

            /*
               Aktywny słupek identyfikujemy po DOKŁADNEJ parze
               NAZWA + NR, a nie po pozycji w wariantowym przebiegu.

            const aktywnyPos=
                lista.findIndex(
                    p=>
                        normalizujNazwe208(
                            p?.nazwa
                        )===
                        normalizujNazwe208(
                            aktywnyBaza?.nazwa
                        )&&
                        String(
                            p?.nr||
                            ""
                        ).trim()===
                        String(
                            aktywnyBaza?.nr||
                            ""
                        ).trim()
                );

            if(aktywnyPos<0){
                return;
            }

            const aktywny=
                lista[
                    aktywnyPos
                ];

            const aktywneKursy=
                (
                    aktywny?.kursy||
                    []
                )
                .filter(
                    kurs=>
                        czasNaMinuty(
                            kurs?.czas
                        )!==null
                );

            if(!aktywneKursy.length){
                return;
            }

            const lokalneKlucze=
                new Set(
                    aktywneKursy.map(
                        kluczKursu206
                    )
                );

            aktywneKursy.forEach(
                kurs=>{

                    wszystkieKlucze.add(
                        kluczKursu206(
                            kurs

                    );

                    const w=
                        String(
                            kurs?.wariant||
                            ""
                        )
                        .trim()
                        .toUpperCase();

                    if(w){
                        warianty.add(w);
                    }
                }
            );

               występującej w konkretnym rozkładzie.

               pozostaje dokładnie w takiej kolejności.
            */
            const punkty=[];

            lista.forEach(
                (p,pos)=>{

                    if(pos<aktywnyPos){
                        return;
                    }

                    const kursyTutaj=
                        (
                            p?.kursy||
                            []
                        )
                        .filter(
                            kurs=>
                                lokalneKlucze.has(
                                    kluczKursu206(
                                        kurs
                                    )
                                )
                        );

                    if(!kursyTutaj.length){
                        return;
                    }

                    punkty.push({
                        p,
                        pos,
                        kursy:kursyTutaj
                    });
                }
            );

            if(punkty.length){
                przebiegi.push({
                    rozklad,
                    lista,
                    aktywnyPos,
                    punkty
                });
            }
        }

        !wszystkieKlucze.size||
        !przebiegi.length

       Jeżeli nie — aktywny jest rzeczywistym początkiem pasażerskim.
    */

    przebiegi.forEach(
        info=>{

            for(
                let i=0;

                const ma=
                    (
                        info.lista[i]?.kursy||
                        []
                    ).some(
                        kurs=>
                            wszystkieKlucze.has(
                                kluczKursu206(
                                    kurs
                                )
                            )
                    );

                if(ma){
                    istniejePrzedAktywnym=true;
                    break;
                }
            }
        }
    );

    /*
       Łączymy punkty z rozkładów. Klucz zawiera nazwę, numer słupka
       i numer wystąpienia tej samej pary, więc dwa PKP URSUS
       nie zostaną sklejone.
    */
    const punktyMap=
        new Map();

    przebiegi.forEach(
        info=>{

            const wystapienia=
                new Map();

            info.punkty.forEach(
                pkt=>{

                    const para=
                        [
                            normalizujNazwe208(
                                pkt.p?.nazwa
                            ),
                            String(
                                pkt.p?.nr||
                                ""
                            ).trim()
                        ].join("|");

                    const nrWyst=
                        (
                            wystapienia.get(
                                para
                            )||
                            0
                        )+1;

                    wystapienia.set(
                        para,
                        nrWyst
                    );

                    const key=
                        para+
                        "|occ:"+
                        nrWyst;

                    if(
                        !punktyMap.has(
                            key
                        )
                    ){
                        punktyMap.set(
                            key,
                            {
                                p:pkt.p,
                                key,
                                kolejnosc:
                                    punktyMap.size
                            }
                        );
                    }
                }
            );
        }
    );

    return{
        aktywnyIndex,
        aktywnyBaza,
        klucze:wszystkieKlucze,
        warianty,
        przebiegi,
        punkty:[
            ...punktyMap.values()
        ],
        istniejePrzedAktywnym
    };
}

function usunSztuczneDuplikatyWTymSamymStanieTrasy(

        lista.length<2

    }

    while(i<lista.length){

        const pierwszy=
            lista[i];

            normalizuj(
                pierwszy?.p?.nazwa
            );

        const stan=
            kluczStanuTrasy(
                stanTrasyNaPrzystanku(
                    pierwszy
                )
            );

        let j=i+1;

        while(
            j<lista.length
        ){

            const kolejny=

                normalizuj(

                )===
                    nazwa&&
                String(
                    kolejny?.p?.nr||""
                ).trim()===

                kluczStanuTrasy(
                    stanTrasyNaPrzystanku(
                        kolejny
                    )
                )===
                    stan;

            if(
                !tenSamPrzystanek||
                !tenSamStan
            ){
                break;
            }

            j++;
        }

        const grupa=
            lista.slice(
                i,

        if(grupa.length===1){

                        kandydat.count++;
                        kandydat.ostatniIndex=i418;

                        let tt418=t418;

                        while(tt418<czas){
                            tt418+=1440;
                        }

                        if(tt418>ostatniCzas418){
                            ostatniCzas418=tt418;
                        }
                    }

                    kandydat.czasDoKonca=
                        ostatniCzas418-czas;

                    kandydaci.push(
                        kandydat
                    );
                }
            );
        }
    );

    return kandydaci.sort(
        (a,b)=>
            b.count-a.count||
            b.ostatniIndex-a.ostatniIndex||
            b.czasDoKonca-a.czasDoKonca||
            a.start-b.start
    )[0]||null;
}

    /*
       WERSJA 418:
       czas od aktywnego przystanku do wydłużenia jest liczony
       z jednego konkretnego kursu tego wariantu i z fizycznych
       słupków, które ten kurs naprawdę obsługuje.
    */
    const startFizyczny418=
        fizycznyPrzystanekWybranegoKursu417(
            kandydat,

                p:start,

function kursReferencyjnyDrugiegoKierunku(
    info
){

    if(!info){
        return null;
    }

    const mapa=
        new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    info.indexKierunku,
                    info.przystanek
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        czasNaMinuty(
                            kurs?.czas
                        )===null
                    ){
                        return;
                    }

                    const key=
                        kluczKursu(kurs);

                    if(!mapa.has(key)){
                        mapa.set(
                            key,
                            {
                                ...kurs,
                                _kierunekIndex:
                                    info.indexKierunku,
                                count:0
                            }
                        );
                    }
                }
            );
        }
    );

    const pelna=
        info.kierunek?.przystanki||
        [];

    mapa.forEach(
        ref=>{

            pelna.forEach(
                p=>{

                    (
                        daneLinii?.rozkłady||
                        []
                    ).some(
                        rozklad=>{

                            const pp=
                                znajdzPrzystanekWRozkladzie(
                                    rozklad,
                                    info.indexKierunku,
                                    p
                                );

                            const jest=
                                (
                                    pp?.kursy||
                                    []
                                ).some(
                                    k=>
                                        String(
                                            k?.numer||""
                                        )===
                                            String(
                                                ref?.numer||""
                                            )&&
                                        String(
                                            k?.wariant||""
                                        ).trim()===
                                            String(
                                                ref?.wariant||""
                                            ).trim()&&
                                        czasNaMinuty(
                                            k?.czas
                                        )!==null
                                );

                            if(jest){
                                ref.count++;
                            }

                            return jest;
                        }
                    );
                }
            );
        }
    );

    return[
        ...mapa.values()
    ]
    .sort(
        (a,b)=>
            b.count-a.count
    )[0]||null;
}



function znajdzPrzystanekDrugiegoKierunkuPoDokladnymIndeksie(
    rozklad,
    info,
    element
){

    const k=
        Array.isArray(
            rozklad?.kierunki
        )
            ? rozklad.kierunki[
                info.indexKierunku
            ]
            : null;

    if(
        !k||
        !Array.isArray(
            k.przystanki
        )||
        !element
    ){
        return null;
    }

    const index=
        Number(
            element.index
        );

    const bazaP=
        element.p;

    /*
       Najpierw dokładny indeks z pełnego kierunku.
       To rozróżnia dwa kolejne PKP ZACISZE-WILNO o tej samej
       nazwie i tym samym numerze.
    */
    if(
        Number.isInteger(index)&&
        index>=0&&
        index<k.przystanki.length
    ){

        const p=
            k.przystanki[index];

        if(
            normalizuj(
                p?.nazwa
            )===
                normalizuj(
                    bazaP?.nazwa
                )&&
            String(
                p?.nr||""
            ).trim()===
                String(
                    bazaP?.nr||""
                ).trim()
        ){
            return p;
        }
    }

    /*
       Fallback dla rozkładów o nieco innej strukturze.
    */
    return znajdzPrzystanekWRozkladzie(
        rozklad,
        info.indexKierunku,
        bazaP
    );
}


function czasDrugiegoKierunku(
    info,
    element
){

    const ref=
        kursReferencyjnyDrugiegoKierunku(
            info
        );

    if(
        !ref||
        !element?.p
    ){
        return null;
    }

    let start=null;
    let cel=null;

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const ps=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    info.indexKierunku,
                    info.przystanek
                );

            const pc=
                znajdzPrzystanekDrugiegoKierunkuPoDokladnymIndeksie(
                    rozklad,
                    info,
                    element
                );

            const znajdz=
                pp=>
                    (
                        pp?.kursy||
                        []
                    ).find(
                        k=>
                            String(
                                k?.numer||""
                            )===
                                String(
                                    ref?.numer||""
                                )&&
                            String(
                                k?.wariant||""
                            ).trim()===
                                String(
                                    ref?.wariant||""
                                ).trim()&&
                            czasNaMinuty(
                                k?.czas
                            )!==null
                    );

            const ks=znajdz(ps);
            const kc=znajdz(pc);

            if(ks){
                start=
                    czasNaMinuty(
                        ks.czas
                    );
            }

            if(kc){
                cel=
                    czasNaMinuty(
                        kc.czas
                    );
            }
        }
    );

    if(
        start===null||
        cel===null
    ){
        return null;
    }

    let wynik=cel-start;

    while(wynik<0){
        wynik+=1440;
    }

    return wynik;
}

function listaWydluzeniaBezPowtorzonegoKranca(
    wariant,
    baza
){

    const lista=
        Array.isArray(
            wariant?.przystanki
        )
            ? [...wariant.przystanki]
            : [];

    if(
        !lista.length||
        !Array.isArray(baza)||
        !baza.length
    ){
        return lista;
    }

    const ostatniElementBazy=
        baza[
            baza.length-1
        ];

    const ostatni=
        ostatniElementBazy?.p||
        ostatniElementBazy;

    const pierwszyElementWydluzenia=
        lista[0];

    const pierwszy=
        pierwszyElementWydluzenia?.p||
        pierwszyElementWydluzenia;

    const nazwaBazy=
        normalizuj(
            ostatni?.nazwa
        );

    const nazwaWydluzenia=
        normalizuj(
            pierwszy?.nazwa
        );

    /*
       NAJWAŻNIEJSZA ZMIANA:
       NIE patrzymy na numer przystanku.

       Jeżeli na granicy:
           trasa podstawowa -> trasa wydłużona
       występuje ta sama nazwa przystanku,
       to jest to ten sam logiczny punkt trasy i nie może
       zostać pokazany drugi raz.

       Przykład:
           ... GORASZEWSKA
           SADYBA          <- koniec trasy podstawowej
           Trasa w kursach „w”
           SADYBA          <- ten duplikat usuwamy
           WIERTNICZA

       Nawet jeśli oba wpisy SADYBA mają różne numery słupków.
    */
    if(
        nazwaBazy&&
        nazwaBazy===
        nazwaWydluzenia
    ){
        return lista.slice(1);
    }

    return lista;
}




function pozycjaAktywnegoWWydluzeniu(
    wariant,
    dane=null
){

    const daneWydluzen=
        dane||
        daneTrasWydluzonych();

    const bazaKierunku=
        kierunekBazowy()
            ?.przystanki||
        [];

    const wybranyBazowy=
        bazaKierunku[
            aktualnyPrzystanek
        ]||null;

    const przystankiWydluzenia=
        listaWydluzeniaBezPowtorzonegoKranca(
            wariant,
            daneWydluzen?.baza||[]
        );

    if(
        !przystankiWydluzenia.length||
        !wybranyBazowy
    ){
        return -1;
    }

    /*
     * 1. Najpierw dokładny indeks.
     */
    let aktywnaPozycja=
        przystankiWydluzenia.findIndex(
            element=>
                Number(
                    element?.index
                )===
                Number(
                    aktualnyPrzystanek
                )
        );

    if(aktywnaPozycja>=0){
        return aktywnaPozycja;
    }

    const nazwaWybranego=
        normalizuj(
            wybranyBazowy?.nazwa
        );

    const nrWybranego=
        String(
            wybranyBazowy?.nr||""
        ).trim();

    /*
     * 2. Dokładna nazwa + numer.
     */
    aktywnaPozycja=
        przystankiWydluzenia.findIndex(
            element=>{

                const p=
                    element?.p||
                    element;

                return(
                    normalizuj(
                        p?.nazwa
                    )===
                        nazwaWybranego&&
                    String(
                        p?.nr||""
                    ).trim()===
                        nrWybranego
                );
            }
        );

    if(aktywnaPozycja>=0){
        return aktywnaPozycja;
    }

    /*
     * 3. Jeżeli na wydłużeniu nazwa występuje tylko raz,
     *    możemy użyć samej nazwy.
     *
     *    To jest dotychczasowy fallback np. dla LNIANEJ / WIERNEJ.
     *
     *    Dla SADYBY nie zadziała błędnie, bo graniczna SADYBA
     *    jest wcześniej usuwana przez
     *    listaWydluzeniaBezPowtorzonegoKranca().
     */
    const poNazwie=
        przystankiWydluzenia
            .map(
                (element,pozycja)=>({
                    element,
                    pozycja
                })
            )
            .filter(
                item=>
                    normalizuj(
                        (
                            item.element?.p||
                            item.element
                        )?.nazwa
                    )===
                    nazwaWybranego
            );

    if(poNazwie.length===1){
        return poNazwie[0].pozycja;
    }

    return -1;
}
