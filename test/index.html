<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WTP LIVE v70</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css?v=70"><style>/* WTP LIVE v70 — oś linii dokładnie przez środki kropek; brak końcowych wystających odcinków */
.route-stops > .route-stop { border-left:0 !important; position:relative; }
.route-stops > .route-stop::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--route-color,var(--bus)); pointer-events:none; }
.route-stops > .route-stop:first-child::before { top:50%; }
.route-stops > .route-stop:last-child::before { bottom:50%; }
.route-stops > .route-stop:only-child::before { display:none; }
.route-stops > .route-stop::after { display:none !important; }
.route-stops > .route-stop .route-dot { left:-4px !important; width:11px; height:11px; box-sizing:border-box; position:absolute; z-index:1; }

/* WERSJA 70 — większy odstęp, poprawna oś, typy przystanków */
.vehicle-panel .route-stop{min-height:46px!important;padding-top:9px!important;padding-bottom:9px!important;box-sizing:border-box}
.route-stops>.route-stop::before{left:0!important;transform:translateX(-50%);width:3px!important}
.route-stops>.route-stop .route-dot{left:0!important;top:50%!important;transform:translate(-50%,-50%)!important;width:13px!important;height:13px!important;border:2.5px solid var(--route-color,var(--bus))!important;border-radius:50%!important;box-sizing:border-box!important;background:var(--route-color,var(--bus))!important}
.route-stops>.route-stop.request-stop .route-dot{background:#fff!important}
.route-stops>.route-stop.unknown-stop .route-dot{background:#fff!important}
.route-stops>.route-stop.current .route-dot{outline:2px solid #fff;outline-offset:-4px}
.vehicle-panel .close-vehicle{top:12px!important;right:15px!important;transform:none!important;width:42px!important;height:42px!important;border-radius:50%!important;z-index:10!important}
.vehicle-panel #vehicleHeading{min-height:66px!important;display:flex!important;align-items:center!important;box-sizing:border-box!important;padding:12px 72px 12px 20px!important}
</style></head><body><header><strong>WTP LIVE <small>v70</small></strong><nav><button data-tab="mapa" class="selected">Mapa</button><button data-tab="odjazdy">Odjazdy</button></nav></header><main><section id="mapa" class="active"><aside><h2>Mapa pojazdów</h2><label>Linia<input id="line" placeholder="np. 145, 20, N01"></label><div class="checks"><label><input id="bus" type="checkbox" checked> Autobusy</label><label><input id="tram" type="checkbox" checked> Tramwaje</label></div><button id="refresh">Odśwież</button><label class="stop-toggle"><input id="showStops" type="checkbox" checked> Pokaż przystanki na mapie</label><p id="stopStatus" class="wtp-internal-diagnostics" hidden></p><p id="status" class="wtp-internal-diagnostics" hidden></p><p id="count" class="wtp-internal-diagnostics" hidden></p></aside><div id="map"></div></section><section id="odjazdy"><article><h2>Odjazdy z przystanku</h2><p>Odjazdy według danych udostępnianych przez API.</p><div class="search"><input id="stop" placeholder="Nazwa przystanku, np. Centrum"><button id="find">Szukaj</button></div><div id="results"></div><div id="timetable"></div></article></section></main><aside id="vehiclePanel" class="vehicle-panel" hidden><button id="closeVehicle" class="close-vehicle" aria-label="Zamknij">×</button><h2 id="vehicleHeading"></h2><div id="vehicleBody"></div></aside><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="config.js?v=70"></script><script src="app.js?v=70"></script></body></html>
