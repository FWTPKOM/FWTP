<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WTP LIVE v87</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css?v=87">
</head>
<body>
<header>
    <strong>WTP LIVE <small>v87</small></strong>
    <nav>
        <button data-tab="mapa" class="selected">Mapa</button>
        <button data-tab="odjazdy">Odjazdy</button>
    </nav>
</header>
<main>
    <section id="mapa" class="active">
        <aside>
            <h2>Mapa pojazdów</h2>
            <label>Linia
                <input id="line" placeholder="np. 145, 20, N01">
            </label>
            <div class="checks">
                <label><input id="bus" type="checkbox" checked> Autobusy</label>
                <label><input id="tram" type="checkbox" checked> Tramwaje</label>
            </div>
            <button id="refresh">Odśwież</button>
            <label class="stop-toggle">
                <input id="showStops" type="checkbox" checked>
                Pokaż przystanki na mapie
            </label>
            <p id="stopStatus" class="wtp-internal-diagnostics" hidden></p>
            <p id="status" class="wtp-internal-diagnostics" hidden></p>
            <p id="count" class="wtp-internal-diagnostics" hidden></p>
        </aside>
        <div id="map"></div>
    </section>
    <section id="odjazdy">
        <article>
            <h2>Odjazdy z przystanku</h2>
            <p>Odjazdy według danych udostępnianych przez API.</p>
            <div class="search">
                <input id="stop" placeholder="Nazwa przystanku, np. Centrum">
                <button id="find">Szukaj</button>
            </div>
            <div id="results"></div>
            <div id="timetable"></div>
        </article>
    </section>
</main>
<aside id="vehiclePanel" class="vehicle-panel" hidden>
    <button id="closeVehicle" class="close-vehicle" aria-label="Zamknij">×</button>
    <h2 id="vehicleHeading"></h2>
    <div id="vehicleBody"></div>
</aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js?v=87"></script>
<script src="app.js?v=87"></script>
</body>
</html>
