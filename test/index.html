    ).join("");
}

function v498DopasujKolumnyTrasy(){
    const tabliczka=document.querySelector("#wynik .tabliczka");
    const columns=document.querySelector("#wynik .trasa-columns");

    if(!tabliczka || !columns)return;

    /*
       V499:
       STREFA I/II jest najpierw ustawiana globalnie:
       raz na górze i ponownie dopiero po rzeczywistej zmianie.
    */
    v501NormalizujMiejscowosci(columns);
    /* FWTP V537: STREFA pochodzi już z lista_przystankowa.elementy[] — nie dokładamy starej V499. */

    /*
       Najpierw pobieramy cały nowy przebieg V496 zanim zmienimy DOM.
    */
    const wszystkie=v498PobierzStrumienWierszy(columns);
    if(!wszystkie.length)return;

    /*
       =====================================================
       1. NAJPIERW JEDNA KOLUMNA
       =====================================================
    */
    tabliczka.classList.remove("trasa-2-kol","trasa-3-kol");
    columns.className="trasa-columns cols-1";
    v498UstawNaglowek(1);
    v498RenderGrupy(columns,[wszystkie]);

    if(typeof ustawZawijanieNazwTrasy==="function"){
        ustawZawijanieNazwTrasy(columns);
    }

    const jedna=columns.querySelector(".trasa-kol");

    if(
        jedna &&
        jedna.scrollHeight<=columns.clientHeight+1
    ){
        return;
    }

    /*
       =====================================================
       2. DOPIERO TERAZ DWIE KOLUMNY
       =====================================================
       To jest ta sama zasada co w starej działającej logice:
       nie dzielimy listy matematycznie na pół.
       Wypełniamy pierwszą kolumnę do dostępnej wysokości.
    */
    tabliczka.classList.add("trasa-2-kol");
    columns.className="trasa-columns cols-2";
    v498UstawNaglowek(2);

    /*
       Pomiar przy FINALNEJ szerokości kolumny.
       Druga pusta kolumna wymusza prawidłową szerokość pierwszej.
    */
    columns.innerHTML=
        '<div class="trasa-kol trasa-kol-pomiar-498">'+
            '<ul class="trasa-lista trasa-lista-pomiar-498">'+
                wszystkie.join("")+
            '</ul>'+
        '</div>'+
        '<div class="trasa-kol trasa-kol-pusta"></div>';

    if(typeof ustawZawijanieNazwTrasy==="function"){
        ustawZawijanieNazwTrasy(columns);
    }

    const pomiar=columns.querySelector(".trasa-kol-pomiar-498");
    const dzieci=Array.from(
        pomiar?.querySelector(".trasa-lista-pomiar-498")?.children||[]
    );

    if(!pomiar || !dzieci.length)return;

    const styl=getComputedStyle(pomiar);

    const dostepna=
        columns.clientHeight-
        parseFloat(styl.paddingTop||0)-
        parseFloat(styl.paddingBottom||0)-
        1;

    const wysokosci=dzieci.map(el=>{
        const rect=el.getBoundingClientRect();
        const css=getComputedStyle(el);

        return (
            rect.height+
            parseFloat(css.marginTop||0)+
            parseFloat(css.marginBottom||0)
        );
    });

    const grupy=[[]];
    let suma=0;

    for(let i=0;i<wszystkie.length;i++){
        const h=Math.max(0,wysokosci[i]||0);
        let wymagane=h;

        /*
           Tak jak wcześniej: napis "TRASA W KURSACH ..."
           nie może zostać sam na dole kolumny.
           Musi zmieścić się razem z pierwszym przystankiem.
        */
        if(
            dzieci[i]?.classList?.contains("trasa-separator") &&
            i+1<wszystkie.length
        ){
            wymagane+=Math.max(0,wysokosci[i+1]||0);
        }

        if(
            grupy[0].length>0 &&
            suma+wymagane>dostepna &&
            grupy.length===1
        ){
            grupy.push([]);
            suma=0;
        }

        grupy[grupy.length-1].push(wszystkie[i]);
        suma+=h;
    }

    /*
       Jeżeli po pomiarze jednak wszystko weszło do jednej,
       wracamy do jednej kolumny.
    */
    const niepuste=grupy.filter(g=>g.length);

    if(niepuste.length<=1){
        tabliczka.classList.remove("trasa-2-kol");
        columns.className="trasa-columns cols-1";
        v498UstawNaglowek(1);
        v498RenderGrupy(columns,[wszystkie]);

        if(typeof ustawZawijanieNazwTrasy==="function"){
            ustawZawijanieNazwTrasy(columns);
        }
        return;
    }

    v498RenderGrupy(columns,niepuste.slice(0,2));

    if(typeof ustawZawijanieNazwTrasy==="function"){
        ustawZawijanieNazwTrasy(columns);
    }

    /*
       Koniec pierwszej kolumny nie jest końcem trasy.
    */
    const pierwsza=columns.querySelector(
        ":scope > .trasa-kol:not(:last-child) .trasa-lista > li:last-child"
    );

    /*
       V502:
       granica kolumny nie jest końcem trasy, ALE nie wolno usuwać
       oznaczenia, jeśli ten przystanek jest rzeczywistym końcem
       któregoś kurs.trasa (np. METRO MŁOCINY).
    */
    if(pierwsza){
        const key=pierwsza.getAttribute("data-v499-stop-key");
        const p=key ? v499StopByKey(key) : null;

        let prawdziwyKoniec=false;

        if(p){
            const routes=v486BuildRoutes();
            prawdziwyKoniec=routes.some(route=>
                v502CzyRzeczywistyKoniec({p},route)
            );
        }

        if(!prawdziwyKoniec){
            pierwsza.classList.remove(
                "kraniec-koniec",
                "koniec-trasy-210",
                "ma-kontynuacje-trasy"
            );
        }
    }
}


/* =========================================================
   FWTP — WERSJA 508
   KOŃCE TRAS — OSTATECZNE OZNACZENIE PO RENDERZE
   =========================================================
   V507 poprawnie czytał JSON, ale oznaczenie końca było wykonywane
   podczas budowania poszczególnych grup/gałęzi. Późniejsze łączenie
   tras i dzielenie na kolumny mogło zgubić kontekst przebiegu.

   V508 robi to prościej i jednoznacznie:
   1. z kursów AKTUALNEGO przystanku zbiera dokładne ID ostatniego
      pasażerskiego przystanku każdego kurs.trasa;
   2. po CAŁYM renderowaniu i po podziale na kolumny czyści stare
      klasy końcowe;
   3. nadaje klasę końcową tylko elementom o dokładnie takim ID.

   Dla linii 150:
   - 40|Metro Młociny|21  -> końcowy
   - 36|Metro Marymont|11 -> NIE końcowy
   - 37|Metro Marymont|12 -> końcowy
   ========================================================= */

/* =========================================================
   FWTP — WERSJA 557
   KOŃCE TRAS — JSON/V80 JEST JEDYNYM ŹRÓDŁEM PRAWDY

   WAŻNE:
   Stara V508 ponownie zbierała wszystkie model.trasy[].koniec_trasy.
   To psuło poprawkę z VBA V80, ponieważ zwykły kurs skrócony nadal
   ma własne koniec_trasy, mimo że NIE powinien być wizualnym krańcem.

   Przykład 126:
       wariant B kończy kurs na BARTNICZEJ,
       ale element Bartnicza ma koncowy=false.
       HTML ma uszanować false i NIE robić z niej krańca.

   Dlatego od V557:
   - końce czytamy tylko z lista_przystankowa.elementy[],
   - exact ID nadal obowiązuje,
   - kontynuacja również pochodzi z element.kontynuacja,
   - JS nie rekonstruuje semantyki końców z kursów/trasy.
   ========================================================= */

function v557TerminalStateMap(){
    const active=v486CurrentStop();
    const model=active?.lista_przystankowa;
    const out=new Map();

    if(
        !model ||
        Number(model.wersja)<2 ||
        !Array.isArray(model.elementy)
    ){
        return out;
    }

    model.elementy.forEach(element=>{
        if(v486Text(element?.typ)!=="przystanek"){
            return;
        }

        const id=v486Text(element?.id).trim();
        if(!id)return;

        out.set(id,{
            koncowy: element?.koncowy===true,
            kontynuacja:
                element?.koncowy===true &&
                element?.kontynuacja===true
        });
    });

    return out;
}


function v508TerminalIds(){
    /*
       Nazwa funkcji zostaje dla zgodności ze starszym kodem,
       ale od V557 zwraca tylko końce zaakceptowane przez VBA V80.
    */
    const out=new Set();

    v557TerminalStateMap().forEach((state,id)=>{
        if(state.koncowy){
            out.add(id);
        }
    });

    return out;
}


/* V633: W okrężnej gotowy JSON określa kolejność listy.
   Starsze etapy układu mogły dopisać ponownie przedostatni przystanek
   już PO rzeczywistym końcu. Usuwamy wyłącznie nadmiar po końcu,

/* V635: przycinamy również gotowy DOM po dzieleniu listy na kolumny.
   Nie opieramy się na klasach starego silnika ani na układzie kolumn. */
/* V636: wyłączona historyczna ingerencja w listę po renderowaniu.
   Jedynym źródłem kolejności i liczby przystanków jest JSON. */
function v633UsunPrzystankiPoKoncuOkreznej(){

function przeniesLegendeJesliWychodziPozaStrone237(
    tabliczka
){
    if(!tabliczka){
        return;
    }

    /*
       Jeśli legenda została już przeniesiona, niczego więcej nie robimy.
       To najważniejsza zmiana względem v230-v236:
       nie ma już ciągłego wyjmowania i ponownego wkładania elementu.
    */
    if(
        tabliczka.querySelector(
            ".legenda.legenda-przeniesiona-237"
        )
    ){
        return;
    }

    const legenda=
        tabliczka.querySelector(
            ".panel-lewy > .legenda"
        );

    if(!legenda){
        return;
    }

    const tabRect=
        tabliczka.getBoundingClientRect();

    const legRect=
        legenda.getBoundingClientRect();

    if(
        legRect.bottom<=
        tabRect.bottom-1
    ){
        return;
    }

    const kolumny=
        Array.from(
            tabliczka.querySelectorAll(
                ".panel-prawy .trasa-columns > .trasa-kol"
            )
        );

    if(!kolumny.length){
        return;
    }

    const docelowa=
        kolumny[kolumny.length-1];

    /*
       Legenda ma być POD CAŁĄ zawartością ostatniej kolumny,
       także pod .trasa-extra ("Trasa w kursach...").
       Dlatego nie wstawiamy jej już do żadnego UL.
       Zawsze appendChild bezpośrednio do .trasa-kol.
    */
    legenda.classList.remove(
        "legenda-przeniesiona-234",
        "legenda-przeniesiona-235"
    );

    legenda.classList.add(
        "legenda-przeniesiona-237"
    );

    docelowa.appendChild(
        legenda
    );
}

const cacheNormalizacjiTekstu=
    new Map();

function normalizuj(tekst){

    const surowy=
        String(
            tekst||""
        );

    if(
        cacheNormalizacjiTekstu.has(
            surowy
        )
    ){
        return cacheNormalizacjiTekstu.get(
            surowy
        );
    }

    const wynik=
        surowy
            .trim()
            .toLocaleLowerCase(
                "pl-PL"
            )
            .replace(
                /\s+/g,
                " "
            );

    cacheNormalizacjiTekstu.set(
        surowy,
        wynik
    );

    return wynik;
}

    /*

       Jeśli więc prawa krawędź wrap wchodzi poza panel lewy,

    */
    /*
       v227:
       294.5 px może na granicy panelu dać ułamkową różnicę
       w getBoundingClientRect() przez obramowania/subpiksele.

function dopasujRozkladyWTrybieKompaktowym(
    tabliczka
){

    if(!tabliczka){
        return;
    }

    const panel=
        tabliczka.querySelector(
            ".panel-lewy"
        );

    const wrap=
        tabliczka.querySelector(
            ".rozklady-wrap"
        );

    const grid=
        tabliczka.querySelector(
            ".rozklady-grid"
        );

    if(
        !panel||
        !wrap||
        !grid
    ){
        return;
    }

    const dni=
        Array.from(
            grid.querySelectorAll(
                ":scope > .dzien"
            )
        );

    if(!dni.length){
        return;
    }

    /*
       Najpierw zdejmujemy szerokości nadane przez wcześniejsze
       dopasowania (np. równe SOBOTA/ŚWIĘTO), żeby zmierzyć
       rzeczywistą potrzebną szerokość.
    */
    dni.forEach(
        dzien=>{

            dzien.style.width="";
            dzien.style.minWidth="";
        }
    );

    const odstepy=
        Math.max(
            0,
            dni.length-1
        )*3;

    const dostepna=
        Math.max(
            120,
            Math.floor(
                wrap.clientWidth-
                odstepy
            )
        );

    const naturalne=
        dni.map(
            dzien=>
                Math.ceil(
                    dzien.scrollWidth
                )
        );

    const minima=
        dni.map(
            minimalnaSzerokoscDnia
        );

    let docelowe=
        naturalne.slice();

    let suma=
        docelowe.reduce(
            (a,b)=>a+b,
            0
        );

    /*
       Jeżeli naturalne szerokości się nie mieszczą,
       stopniowo odbieramy szerokość głównie najszerszym tabelom.
       Dzięki flex-wrap minuty przejdą wtedy do następnego wiersza.
    */
    if(suma>dostepna){

        let brak=
            suma-dostepna;

        let bezpiecznik=0;

        while(
            brak>0.5&&
            bezpiecznik<2000
        ){

            bezpiecznik++;

            let kandydat=-1;
            let najwiekszyZapas=0;

            for(
                let i=0;
                i<docelowe.length;
                i++
            ){

                const zapas=
                    docelowe[i]-
                    minima[i];

                if(zapas>najwiekszyZapas){
                    najwiekszyZapas=zapas;
                    kandydat=i;
                }
            }

            if(
                kandydat<0||
                najwiekszyZapas<=0
            ){
                break;
            }

            const krok=
                Math.min(
                    2,
                    brak,
                    najwiekszyZapas
                );

            docelowe[kandydat]-=
                krok;

            brak-=
                krok;
        }
    }

    dni.forEach(
        (dzien,i)=>{

            if(
                dzien.classList.contains(
                    "dzien-powszedni-kompakt"
                )
            ){
                dzien.style.width="246px";
                dzien.style.minWidth="246px";
                return;
            }

            const szer=
                Math.max(
                    minima[i],
                    Math.floor(
                        docelowe[i]
                    )
                );

            dzien.style.width=
                szer+"px";

            dzien.style.minWidth=
                szer+"px";
        }
    );
}

                row.querySelector(".godzina-cell")?.textContent||""
            ).trim();

            if(!g){ return; }
            if(!mapa.has(g)){ mapa.set(g,[]); }
            mapa.get(g).push(row);
        });

    void tabliczka.offsetHeight;

    mapa.forEach(rows=>{
        let podwojny=false;

        rows.forEach(row=>{
            const minuty=row.querySelector(".minuty-cell");
            if(!minuty){ return; }

            /*
               Normalny wiersz ma 16 px.
               Jeżeli zawartość minut potrzebuje więcej niż 18 px,
               traktujemy godzinę jako dwuwierszową.
            */
            if(minuty.scrollHeight>18){
                podwojny=true;
            }
        });

        if(podwojny){
            rows.forEach(row=>{
                row.classList.add("wiersz-dwuliniowy");
            });
        }
    });
}

/* =========================================================
   WERSJA 194 — PRZELICZENIE SZEROKOŚCI .rozklady-wrap
   ========================================================= */
function przeliczWrap194(
    tabliczka
){
    if(!tabliczka){
        return;
    }

    const wrap=
        tabliczka.querySelector(
            ".rozklady-wrap"
        );

    const grid=
        tabliczka.querySelector(
            ".rozklady-grid"
        );

    if(!wrap||!grid){
        return;
    }

    /*
       v228:
       Samo width:fit-content potrafiło zachować szerokość
       INTRINSICzną zawartości minut, nawet kiedy widoczna tabela
       miała już np. 294.5 px.

       Efekt:
       - na ekranie 294.5 px mieściło się prawidłowo,
       - ale .rozklady-wrap raportował większy right,
       - kod błędnie przechodził do 270, a potem czasem 246 px.

       Nadal badamy .rozklady-wrap — zgodnie z dotychczasową logiką —
       ale jego szerokość ustawiamy na RZECZYWISTĄ szerokość
       wyrenderowanych tabel .dzien.
    */

    wrap.style.width="";
    wrap.style.minWidth="";
    wrap.style.maxWidth="";

    grid.style.width="";
    grid.style.minWidth="";

    void grid.offsetWidth;

    const dni=
        Array.from(
            grid.children
        ).filter(
            el=>
                el.classList&&
                el.classList.contains("dzien")
        );

    if(!dni.length){
        return;
    }

    const gridRect=
        grid.getBoundingClientRect();

    let prawa=
        gridRect.left;

    dni.forEach(
        dzien=>{
            const rect=
                dzien.getBoundingClientRect();

            if(rect.right>prawa){
                prawa=rect.right;
            }
        }
    );

    const rzeczywistaSzerokosc=
        Math.max(
            0,
            prawa-gridRect.left
        );

    /*
       Ustawiamy dokładnie to, co rzeczywiście widać.
       Dzięki temu ręczne 294.5 px i automatyczne 294.5 px
       są mierzone identycznie.
    */
    grid.style.width=
        rzeczywistaSzerokosc+"px";

    grid.style.minWidth=
        rzeczywistaSzerokosc+"px";

    wrap.style.width=
        rzeczywistaSzerokosc+"px";

    wrap.style.minWidth=
        rzeczywistaSzerokosc+"px";

    wrap.style.maxWidth=
        rzeczywistaSzerokosc+"px";

    void wrap.offsetWidth;
}


/* =========================================================
   WERSJA 225 — RAMKA DO OSTATNIEJ MINUTY PRZY JEDNEJ LINII
   ========================================================= */

function dopasujRamkeDoOstatniejMinuty225(
    tabliczka
){
    if(!tabliczka){
        return;
    }

    const dni=
        tabliczka.querySelectorAll(
            ".dzien.dzien-powszedni-kompakt"
        );

    dni.forEach(
        dzien=>{

            dzien.classList.remove(
                "jedna-linia-fit-225"
            );

            const wiersze=
                Array.from(
                    dzien.querySelectorAll(
                        ".godzina-row"
                    )
                );

            if(!wiersze.length){
                return;
            }

            /*
               Wiersz jest dwuliniowy, jeśli:
               - ma klasę wiersz-dwuliniowy, albo
               - jego pole minut jest wyższe niż pojedynczy wiersz.
            */
            const maZawiniecie=
                wiersze.some(
                    wiersz=>{

                        if(
                            wiersz.classList.contains(
                                "wiersz-dwuliniowy"
                            )
                        ){
                            return true;
                        }

                        const minuty=
                            wiersz.querySelector(
                                ".minuty-cell"
                            );

                        if(!minuty){
                            return false;
                        }

                        return (
                            minuty.getBoundingClientRect().height
                            >
                            18
                        );
                    }
                );

            if(maZawiniecie){
                return;
            }

            /*
               Wszystkie godziny mieszczą się w jednej linii:
               szerokość tabeli może zakończyć się przy ostatniej minucie.
            */
            dzien.classList.add(
                "jedna-linia-fit-225"
            );
        }
    );
}

function dopasujSzerokoscNieKursuje(){

    const dni=
        Array.from(
            document.querySelectorAll(
                ".rozklady-grid .dzien"
            )
        );

    dni.forEach(
        dzien=>{

            const napis=
                dzien.querySelector(
                    ".nie-kursuje-napis"
                );

            if(!napis){
                return;
            }

            /*
               Najpierw zdejmujemy ewentualne wcześniejsze
               wymuszenie szerokości, żeby zmierzyć naturalny układ.
            */
            const poprzedniaSzerokosc=
                parseFloat(
                    dzien.style.width
                )||0;

            const poprzedniaMinSzerokosc=
                parseFloat(
                    dzien.style.minWidth
                )||0;

            /*
               Pole minut zaczyna się po 22 px kolumny godzin.
               Do szerokości napisu dokładamy po 8 px luzu
               z lewej i prawej strony.
            */
            const szerokoscNapisu=
                Math.ceil(
                    napis.scrollWidth
                );

            const potrzebnaSzerokosc=
                22+
                szerokoscNapisu+
                16;

            const aktualnaSzerokosc=
                Math.ceil(
                    dzien.getBoundingClientRect().width
                );

            const docelowa=
                Math.max(
                    aktualnaSzerokosc,
                    poprzedniaSzerokosc,
                    poprzedniaMinSzerokosc,
                    potrzebnaSzerokosc
                );

            dzien.style.width=
                docelowa+"px";

            dzien.style.minWidth=
                docelowa+"px";
        }
    );
}


function wyrownajSzerokoscWeekendow() {

    const dni = Array.from(
        document.querySelectorAll(
            ".rozklady-grid .dzien"
        )
    );

    const sobota = dni.find(d => {
        const t =
            (
                d.querySelector(
                    ".dzien-tytul"
                )?.textContent || ""
            )
            .trim()
            .toUpperCase();

        return t === "SOBOTA";
    });

    const swieto = dni.find(d => {
        const t =
            (
                d.querySelector(
                    ".dzien-tytul"
                )?.textContent || ""
            )
            .trim()
            .toUpperCase();

        return t === "ŚWIĘTO";
    });

    if(!sobota || !swieto){
        return;
    }

    /*
       Zdejmujemy wcześniejsze szerokości tylko na czas pomiaru.
    */
    [sobota, swieto].forEach(d => {
        d.style.width = "";
        d.style.minWidth = "";
    });

    const szerokoscNaturalnaSobota =
        Math.ceil(
            sobota.getBoundingClientRect().width
        );

    const szerokoscNaturalnaSwieto =
        Math.ceil(
            swieto.getBoundingClientRect().width
        );

    /*
       Jeżeli w którejś tabeli jest "NIE KURSUJE",
       tabela musi być na tyle szeroka, by napis zmieścił się
       w jednej linii w części minutowej.
    */
    function wymaganaSzerokoscNieKursuje(dzien){

        const napis =
            dzien.querySelector(
                ".nie-kursuje-napis"
            );

        if(!napis){
            return 0;
        }

        return (
            22 +
            Math.ceil(napis.scrollWidth) +
            16
        );
    }

    const wymaganaSobota =
        wymaganaSzerokoscNieKursuje(
            sobota
        );

    const wymaganaSwieto =
        wymaganaSzerokoscNieKursuje(
            swieto
        );

    /*
       Obie kolumny dostają DOKŁADNIE tę samą szerokość:
       większą z naturalnych / wymaganych szerokości + 8 px luzu.
    */
    const szerokosc =
        Math.max(
            szerokoscNaturalnaSobota,
            szerokoscNaturalnaSwieto,
            wymaganaSobota,
            wymaganaSwieto
        ) + 8;

    [sobota, swieto].forEach(d => {
        d.style.width = szerokosc + "px";
        d.style.minWidth = szerokosc + "px";
        d.style.maxWidth = szerokosc + "px";
    });
}
function ustawNaglowekTrasy(liczbaKolumn) {

    const head =
        document.querySelector(
            ".trasa-head"
        );

    if(!head){
        return;
    }

    const ile=
        Math.max(
            1,
            Math.min(
                3,
                Number(
                    liczbaKolumn
                )||1
            )
        );

    head.className=
        "trasa-head cols-"+
        ile;

    head.innerHTML=
        Array.from(
            {length:ile},
            ()=>(
                '<div class="trasa-head-label">'+
                'czasy, trasa, przystanki'+
                '</div>'
            )
        )
        .join("");
}

function zabezpieczJednowyrazoweNazwy176(root=document){

    root.querySelectorAll(
        ".trasa-nazwa"
    ).forEach(
        nazwa=>{

            const tekst=
                (nazwa.textContent||"")
                    .replace(/\s+/g, " ")
                    .trim();

            /*
               Jedno słowo = brak spacji w nazwie.
               Np. WAWELSKA, SŁUŻEWIEC, SADYBA, WIERNA.
            */
            const jednowyrazowa=
                tekst.length>0 &&
                !tekst.includes(" ") &&
                !tekst.includes("-") &&
                !tekst.includes("–") &&
                !tekst.includes("—");

            nazwa.classList.toggle(
                "nazwa-jednowyrazowa",
                jednowyrazowa
            );

            if(jednowyrazowa){
                nazwa.classList.remove(
                    "zawijaj"
                );
            }
        }
    );
}


/* =========================================================
   WERSJA 177 — AUTOMATYCZNE POSZERZANIE KOLUMNY DLA
   JEDNOWYRAZOWYCH NAZW PRZYSTANKÓW
   ========================================================= */

function dopasujSzerokoscKolumnyDoJednowyrazowych177(
    tabliczka
){

    if(!tabliczka){
        return;
    }

    const panelPrawy=
        tabliczka.querySelector(
            ".panel-prawy"
        );

    const panelLewy=
        tabliczka.querySelector(
            ".panel-lewy"
        );

    const columns=
        tabliczka.querySelector(
            ".trasa-columns"
        );

    if(
        !panelPrawy||
        !panelLewy||
        !columns
    ){
        return;
    }

    const nazwy=
        Array.from(
            tabliczka.querySelectorAll(
                ".trasa-nazwa.nazwa-jednowyrazowa"
            )
        );

    if(!nazwy.length){
        return;
    }

    /*
       Szukamy największej różnicy:
       scrollWidth - clientWidth.
       Jeśli dodatnia, jednowyrazowa nazwa nie mieści się.
    */
    let brakujace=0;

    nazwy.forEach(
        nazwa=>{

            const roznica=
                Math.ceil(
                    nazwa.scrollWidth-
                    nazwa.clientWidth
                );

            if(roznica>brakujace){
                brakujace=
                    roznica;
            }
        }
    );

    if(brakujace<=0){
        return;
    }

    /*
       Dodajemy mały zapas, żeby napis nie dotykał krawędzi.
    */
    const zapas=8;

    const szerTabliczki=
        tabliczka.clientWidth;

    if(!szerTabliczki){
        return;
    }

    const obecnaPrawa=
        panelPrawy.getBoundingClientRect().width;

    const nowaPrawa=
        obecnaPrawa+
        brakujace+
        zapas;

    /*
       Nie pozwalamy, żeby prawa część zabrała absurdalnie dużo.
       Górna granica 55% całej kartki.
    */
    const maxPrawa=
        szerTabliczki*0.55;

    const docelowaPrawa=
        Math.min(
            nowaPrawa,
            maxPrawa
        );

    const procentPrawa=
        (
            docelowaPrawa/
            szerTabliczki
        )*100;

    const procentLewa=
        100-
        procentPrawa;

    tabliczka.style.setProperty(
        "--prawa",
        procentPrawa.toFixed(2)+"%"
    );

    tabliczka.style.setProperty(
        "--lewa",
        procentLewa.toFixed(2)+"%"
    );
}

function czyTabliczkaMiesciSiePionowo181(
    tabliczka
){

    if(!tabliczka){
        return true;
    }

    /*
       WERSJA 182:
       nazwa funkcji zostaje dla zgodności z v181, ale testujemy
       już właściwy problem: czy układ rozkładów mieści się
       SZEROKOŚCIOWO na tej samej kartce.

       Jeśli prawa krawędź rozkładów wchodzi w obszar listy
       przystanków / wychodzi poza panel lewy, wtedy 9 kursów
       w jednym rzędzie uznajemy za układ, który się nie mieści.
    */
    if(
        typeof czyRozkladNachodziNaListePrzystankow==="function"
    ){
        return(
            !czyRozkladNachodziNaListePrzystankow(
                tabliczka
            )
        );
    }

    /*
       Fallback geometryczny.
    */
    const panelLewy=
        tabliczka.querySelector(
            ".panel-lewy"
        );

    const grid=
        tabliczka.querySelector(
            ".rozklady-grid"
        );

    if(
        !panelLewy||
        !grid
    ){
        return true;
    }

    const panelRect=
        panelLewy.getBoundingClientRect();

    const gridRect=
        grid.getBoundingClientRect();

    return(
        gridRect.right<=
        panelRect.right-2
    );
}


function ustawLimit8Kursow181(
    tabliczka
){

    if(!tabliczka){
        return;
    }

    /*
       ETAP 1 — zawsze zaczynamy od normalnego układu 9.
    */
    tabliczka.classList.remove(
        "max-8-kursow"
    );

    tabliczka
        .querySelectorAll(
            ".minuty-cell.limit-8-kursow"
        )
        .forEach(
            cell=>
                cell.classList.remove(
                    "limit-8-kursow"
                )
        );

    tabliczka.style.removeProperty(
        "--szerokosc-8-kursow"
    );

    /*
       Po zdjęciu limitu przywracamy naturalny layout.
    */
    void tabliczka.offsetWidth;

    /*
       Jeśli 9 kursów mieści się szerokościowo na tej samej kartce,
       NICZEGO nie zmieniamy.
    */
    if(
        czyTabliczkaMiesciSiePionowo181(
            tabliczka
        )
    ){
        return;
    }

    /*
       ETAP 2 — 9 się nie mieści.
       Liczymy dokładne miejsce na 8 normalnych pól minut.
    */
    const pierwszaMinuta=
        tabliczka.querySelector(
            ".minuty-cell .minuta"
        );

    if(!pierwszaMinuta){
        return;
    }

    const minutaRect=
        pierwszaMinuta.getBoundingClientRect();

    const minutaStyle=
        getComputedStyle(
            pierwszaMinuta
        );

    const szerMinuty=
        Math.max(
            1,
            minutaRect.width+
            (parseFloat(minutaStyle.marginLeft)||0)+
            (parseFloat(minutaStyle.marginRight)||0)
        );

    const przykladowaCell=
        pierwszaMinuta.closest(
            ".minuty-cell"
        );

    const cellStyle=
        getComputedStyle(
            przykladowaCell
        );

    const gap=
        parseFloat(
            cellStyle.columnGap||
            cellStyle.gap||
            0
        )||0;

    const paddingL=
        parseFloat(
            cellStyle.paddingLeft||0
        )||0;

    const paddingR=
        parseFloat(
            cellStyle.paddingRight||0
        )||0;

    /*
       WERSJA 183:
       Dla układu maksymalnie 8 kursów na godzinę
       docelowa szerokość obszaru minut wynosi około 225 px.
       Nie ściskamy samych minut — zmieniamy szerokość tabeli/obszaru,
       aby dziewiąta pozycja przechodziła do drugiego wiersza.
    */
    const szerokosc8=225;

    tabliczka.style.setProperty(
        "--szerokosc-8-kursow",
        szerokosc8+"px"
    );

    tabliczka.classList.add(
        "max-8-kursow"
    );

    /*
       Limit stosujemy w tabelach, które rzeczywiście mają godzinę
       z co najmniej 9 kursami. Tam dziewiąty kurs przechodzi do
       drugiego wiersza.
    */
    tabliczka
        .querySelectorAll(
            ".dzien"
        )
        .forEach(
            dzien=>{

                const ma9LubWiecej=
                    Array.from(
                        dzien.querySelectorAll(
                            ".godzina-row"
                        )
                    )
                    .some(
                        row=>
                            row.querySelectorAll(
                                ".minuty-cell .minuta"
                            ).length>=9
                    );

                if(!ma9LubWiecej){
                    return;
                }

                dzien
                    .querySelectorAll(
                        ".minuty-cell"
                    )
                    .forEach(
                        cell=>
                            cell.classList.add(
                                "limit-8-kursow"
                            )
                    );
            }
        );

    void tabliczka.offsetWidth;

    /*
       Po przejściu 9 -> 8 jeszcze raz uruchamiamy istniejące
       dopasowanie kompaktowe, bo zmieniła się szerokość tabel.
    */
    if(
        tabliczka.classList.contains(
            "tryb-kompaktowy"
        )&&
        typeof dopasujRozkladyWTrybieKompaktowym==="function"
    ){
        dopasujRozkladyWTrybieKompaktowym(
            tabliczka
        );
    }

    /*
       I wyrównujemy wysokości tych samych godzin między dniami.
    */
    if(
        typeof wyrownajWysokosciGodzinMiedzyDniami==="function"
    ){
        requestAnimationFrame(
            ()=>{
                wyrownajWysokosciGodzinMiedzyDniami(
                    tabliczka
                );
            }
        );
    }
}

function poprawPierwszyPasazerski180(
    root=document
){

    root
        .querySelectorAll(
            ".trasa-kol"
        )
        .forEach(
            kolumna=>{

                const przystanki=
                    Array.from(
                        kolumna.querySelectorAll(
                            ".trasa-stop"
                        )
                    )
                    .filter(
                        stop=>{

                            /*
                               Pomijamy elementy techniczne, jeśli z jakiegoś
                               powodu są obecne w DOM.
                            */
                            const typ=
                                (
                                    stop.dataset.typ||
                                    stop.getAttribute(
                                        "data-typ"
                                    )||
                                    ""
                                )
                                .toUpperCase();

                            if(typ==="TECH"){
                                return false;
                            }

                            const style=
                                getComputedStyle(
                                    stop
                                );

                            return(
                                style.display!=="none"&&
                                style.visibility!=="hidden"
                            );
                        }
                    );

                /*
                   Czyścimy poprzednie oznaczenie tylko w tej kolumnie.
                */
                kolumna
                    .querySelectorAll(
                        ".trasa-stop.pierwszy-pasazerski"
                    )
                    .forEach(
                        stop=>
                            stop.classList.remove(
                                "pierwszy-pasazerski"
                            )
                    );

                if(!przystanki.length){
                    return;
                }

                /*
                   Pierwszy widoczny pasażerski przystanek:
                   linia zaczyna się od jego kropki i idzie w dół.
                */
                przystanki[0]
                    .classList.add(
                        "pierwszy-pasazerski"
                    );
            }
        );
}

function ustawZawijanieNazwTrasy(columns){

    zabezpieczJednowyrazoweNazwy176(

       - jeśli mieści się w jednej linii -> pozostaje bez zawijania,
       - jeśli się nie mieści -> tylko ta nazwa dostaje zawijanie.
    */
    const nazwy=
        Array.from(
            columns.querySelectorAll(
                ".trasa-nazwa"
            )

    nazwy.forEach(
        el=>{
            el.classList.remove(
                "zawijaj"
            );

    );

    nazwy.forEach(
        el=>{

            if(
                Math.ceil(
                    el.scrollWidth
                )>
                Math.ceil(
                    el.clientWidth
                )+1
            ){
                el.classList.add(
                    "zawijaj"
                );
            }
        }
    );
}

<style id="fwtp-v544-kropka-do-kropki">
/* =========================================================

   Logika oparta na rozwiązaniu z oryginalnego kodu:
   "kropka-do-kropki-493".

   Łącznik:
   - jest OSOBNYM elementem DOM,
   - należy do przystanku przed separatorem,
   - zaczyna się w środku jego kropki,
   - kończy się w środku kropki następnego przystanku,
   - nie powstaje, gdy przed separatorem nie ma przystanku.
   ========================================================= */

.tabliczka .trasa-stop,
.tabliczka .trasa-extra-stop {
    overflow: visible !important;
}

.trasa-stop
> .kropka-do-kropki-544,

.trasa-extra-stop
> .kropka-do-kropki-544 {
    position: absolute !important;
    display: block !important;
    width: 2.25px !important;
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    background: #111 !important;
    z-index: 20 !important;
    pointer-events: none !important;
}
</style>

<script>
(function FWTP_WERSJA_544(){
    "use strict";

    let zaplanowane544 = false;

    /*
       Dokładny środek ZWYKŁEJ kropki z oryginalnego kodu:
       left: 1px; width: 8.5px  => X = 5.25px
       top:  3px; height: 8.5px => Y = 7.25px
    */
    const DOT_CENTER_X_544 = 1 + 8.5 / 2;
    const DOT_CENTER_Y_544 = 3 + 8.5 / 2;
    const LINE_WIDTH_544   = 2.25;

    function jestStop544(el){
        return !!el?.matches?.(
            ".trasa-stop,.trasa-extra-stop"
        );
    }

    function jestMiejscowosc544(el){
        return !!(
            el?.classList?.contains("trasa-separator") &&
            el.classList.contains("trasa-miejscowosc-429")
        );
    }

    function srodekKropki544(stop, bazaRect){
        const os = stop.querySelector(".trasa-os");
        if(!os) return null;

        const osRect = os.getBoundingClientRect();

        return {
            x:
                osRect.left -
                bazaRect.left +
                DOT_CENTER_X_544,

            y:
                osRect.top -
                bazaRect.top +
                DOT_CENTER_Y_544
        };
    }

    function wyczysc544(tab){
        tab.querySelectorAll(".kropka-do-kropki-544")
            .forEach(el => el.remove());
    }

    function polacz544(lista){
        const dzieci = Array.from(lista.children);

        for(let i = 0; i < dzieci.length; i++){

            const pierwszy = dzieci[i];

            /*
               Łącznik zawsze zaczyna się od PRZYSTANKU.
               Dzięki temu nie ma kreski, jeśli miejscowość
               znajduje się przed pierwszym przystankiem.
            */
            if(!jestStop544(pierwszy)) continue;

            let j = i + 1;
            let jestSeparatorMiejscowosci = false;

            /*
               Dopuszczamy jeden lub kilka kolejnych separatorów
               miejscowości pomiędzy dwoma przystankami.
            */
            while(
                j < dzieci.length &&
                jestMiejscowosc544(dzieci[j])
            ){
                jestSeparatorMiejscowosci = true;
                j++;
            }

            if(!jestSeparatorMiejscowosci) continue;

            const drugi = dzieci[j];

            if(!jestStop544(drugi)) continue;

            const pierwszyRect =
                pierwszy.getBoundingClientRect();

            const a =
                srodekKropki544(
                    pierwszy,
                    pierwszyRect
                );

            const b =
                srodekKropki544(
                    drugi,
                    pierwszyRect
                );

            if(
                !a ||
                !b ||
                b.y <= a.y
            ){
                continue;
            }

            if(
                getComputedStyle(pierwszy).position === "static"
            ){
                pierwszy.style.position = "relative";
            }

            const linia =
                document.createElement("span");

            linia.className =
                "kropka-do-kropki-544";

            /*
               FWTP V547:
               łącznik zachowuje się kolorystycznie tak jak
               zwykła oś przystanków.

               Jeżeli przystanek, z którego wychodzi linia,
               jest już minięty (.przed), cały odcinek do
               następnego przystanku jest szary.
            */
            if(
                pierwszy.classList.contains("przed")
            ){
                linia.classList.add(
                    "kropka-do-kropki-minieta-547"
                );
            }

            linia.setAttribute(
                "aria-hidden",
                "true"
            );

            /*
               X dokładnie w środku kropki.
            */
            linia.style.left =
                (
                    a.x -
                    LINE_WIDTH_544 / 2
                ) + "px";

            /*
               FWTP V546

               Łącznik nie biegnie już od środka kropki
               do środka następnej kropki.

               Zaczyna się na DOLNEJ KRAWĘDZI kółka
               przystanku przed separatorem i kończy się
               na GÓRNEJ KRAWĘDZI kółka przystanku
               po separatorze.

               Średnica kropki = 8.5 px,
               promień = 4.25 px.
            */
            const DOT_RADIUS_546 = 8.5 / 2;

            const startY546 =
                a.y + DOT_RADIUS_546;

            const endY546 =
                b.y - DOT_RADIUS_546;

            linia.style.top =
                startY546 + "px";

            linia.style.height =
                Math.max(
                    0,
                    endY546 - startY546
                ) + "px";

            /*
               Tak jak w oryginalnym rozwiązaniu:
               osobny element jest dzieckiem przystanku,
               NIE separatora miejscowości.
            */
            pierwszy.appendChild(linia);
        }
    }

    function wykonaj544(){
        const tab =
            document.querySelector("#wynik .tabliczka") ||
            document.querySelector(".tabliczka");

        if(!tab) return;

        wyczysc544(tab);

        tab.querySelectorAll(
            ".trasa-lista,.trasa-lista-397,.v514-lista"
        ).forEach(polacz544);
    }

    function plan544(){
        if(zaplanowane544) return;

        zaplanowane544 = true;

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                zaplanowane544 = false;
                wykonaj544();
            });
        });
    }

    /*
       Funkcję udostępniamy również rendererowi,
       żeby można ją było wywołać po każdym renderze.
    */
    window.v544PolaczMiejscowosci = plan544;

    if(document.readyState === "loading"){
        document.addEventListener(
            "DOMContentLoaded",
            plan544,
            {once:true}
        );
    }else{
        plan544();
    }

    window.addEventListener(
        "load",
        plan544
    );

    window.addEventListener(
        "resize",
        plan544
    );

    /*
       Bez MutationObservera.
       Krótkie ponowienie tylko na start, ponieważ dane JSON
       mogą zostać wyrenderowane po DOMContentLoaded.
    */
    setTimeout(plan544, 100);
    setTimeout(plan544, 300);
    setTimeout(plan544, 700);
    setTimeout(plan544, 1400);
})();
</script>

<script>
(function(){
    function v585OznaczDwuwierszowyKierunek(){
        document.querySelectorAll(".naglowek-tabliczki").forEach(function(naglowek){
            const kierunek = naglowek.querySelector(".kierunek");

            naglowek.classList.remove("kierunek-dwuwierszowy-v585");

            if(!kierunek){
                return;
            }

            const styl = getComputedStyle(kierunek);
            const lineHeight = parseFloat(styl.lineHeight) || 18;

            /*
               scrollHeight sprawdza faktyczną wysokość tekstu po zawinięciu.
               Dzięki temu nie zależymy od długości tekstu ani starej klasy 379.
            */
            if(kierunek.scrollHeight > lineHeight * 1.35){
                naglowek.classList.add("kierunek-dwuwierszowy-v585");
            }
        });
    }

    window.v585OznaczDwuwierszowyKierunek =
        v585OznaczDwuwierszowyKierunek;

    const observer = new MutationObserver(function(){
        requestAnimationFrame(v585OznaczDwuwierszowyKierunek);
    });

    observer.observe(document.body,{
        childList:true,
        subtree:true,
        characterData:true
    });

    window.addEventListener("resize",function(){
        requestAnimationFrame(v585OznaczDwuwierszowyKierunek);
    });

    document.addEventListener("DOMContentLoaded",function(){
        requestAnimationFrame(v585OznaczDwuwierszowyKierunek);
    });
})();
</script>

<script id="fwtp-v642-uklad-js">
(function(){
 'use strict';
 let queued=false;
 function dopasuj(){
  queued=false;
  const t=document.querySelector('#wynik .tabliczka');
  if(!t)return;
  const panel=t.querySelector('.panel-lewy'),wrap=t.querySelector('.rozklady-wrap'),grid=t.querySelector('.rozklady-grid');
  if(!panel||!wrap||!grid)return;
  const dni=Array.from(grid.children).filter(e=>e.classList.contains('dzien'));
  if(!dni.length)return;
  t.classList.add('v642-uklad');
  // ZAWSZE liczymy całą grupę dni od jej początku do PRAWEJ GRANICY PANELU.
  const left=wrap.getBoundingClientRect().left;
  const right=panel.getBoundingClientRect().right;
  const budzet=Math.max(0,Math.floor(right-left-5-3*(dni.length-1)));
  // V646: mierzymy tytuł w rzeczywistym foncie przeglądarki,
  // bez odziedziczonej, sztucznie zwężonej szerokości tabeli.
  const minimum=dni.map(d=>{
   const h=d.querySelector('.dzien-tytul');
   if(!h)return 72;
   const probe=h.cloneNode(true);
   probe.style.cssText='position:absolute!important;left:-10000px!important;top:0!important;'+
    'width:max-content!important;min-width:max-content!important;max-width:none!important;'+
    'white-space:nowrap!important;display:inline-block!important;'+
    'visibility:hidden!important;transform:none!important;box-sizing:border-box!important;';
   document.body.appendChild(probe);
   const width=Math.ceil(probe.getBoundingClientRect().width)+4;
   probe.remove();
   return Math.max(72,width);
  });
  const naturalne=dni.map((d,i)=>{
   const max=Math.max(0,...Array.from(d.querySelectorAll('.godzina-row'))
    .map(r=>r.querySelectorAll('.minuty-cell > .minuta').length));
   const brak=d.querySelector('.nie-kursuje-napis');
   // Tytuł, największa liczba minut i napis NIE KURSUJE
   // są równorzędnymi ograniczeniami szerokości.
   let napis=0;
   if(brak){
    const st=getComputedStyle(brak);
    const probe=document.createElement('span');
    probe.textContent=brak.textContent.trim();
    probe.style.cssText='position:absolute;left:-10000px;white-space:nowrap;visibility:hidden;';
    probe.style.font=st.font;
    probe.style.letterSpacing=st.letterSpacing;
    document.body.appendChild(probe);
    napis=Math.ceil(probe.getBoundingClientRect().width)+32;
    probe.remove();
   }
   return Math.max(minimum[i],27+24*max,napis);
  });
  // V649: sobota i święto mają identyczną szerokość, co najmniej 112 px.
  // Pozwala to wyświetlić pełny nagłówek „Godz. Minuty” bez ucinania.
  const weekend=dni.map((d,i)=>({d,i,tytul:(d.querySelector('.dzien-tytul')?.textContent||'').trim().toUpperCase()}))
    .filter(x=>x.tytul==='SOBOTA'||x.tytul==='ŚWIĘTO');
  weekend.forEach(x=>{minimum[x.i]=Math.max(minimum[x.i],112);naturalne[x.i]=Math.max(naturalne[x.i],112)});
  const widths=naturalne.slice();
  if(weekend.length===2){
    const wspolna=Math.max(112,...weekend.map(x=>widths[x.i]));
    weekend.forEach(x=>widths[x.i]=wspolna);
  }
  let brak=widths.reduce((a,b)=>a+b,0)-budzet;
  // Zwężamy tylko wtedy, kiedy CAŁA grupa tabel przekracza dostępne miejsce.
  // Nigdy nie zwężamy poniżej pełnej szerokości nagłówka, jeśli suma
  // minimalnych szerokości mieści się w lewym panelu.
  for(let k=0;brak>0.1&&k<2000;k++){
   let idx=-1,zapas=0;
   widths.forEach((w,i)=>{if(w-minimum[i]>zapas){idx=i;zapas=w-minimum[i]}});
   if(idx<0)break;
   const delta=Math.min(brak,zapas,24);widths[idx]-=delta;brak-=delta;
  }
  // V649: po dopasowaniu obie weekendowe tabele ponownie wyrównujemy.
  // Jeśli trzeba, odzyskujemy brakujące piksele z tabel pozostałych dni.
  if(weekend.length===2){
    const a=weekend[0].i,b=weekend[1].i;
    const wspolna=Math.max(112,widths[a],widths[b]);
    const extra=(wspolna-widths[a])+(wspolna-widths[b]);
    widths[a]=widths[b]=wspolna;
    let remaining=extra;
    for(let pass=0;remaining>0.1&&pass<1000;pass++){
      const other=widths.map((w,i)=>({w,i,spare:w-minimum[i]}))
        .filter(x=>x.i!==a&&x.i!==b&&x.spare>0.1)
        .sort((x,y)=>y.spare-x.spare)[0];
      if(!other)break;
      const step=Math.min(remaining,other.spare,24);
      widths[other.i]-=step;remaining-=step;
    }
    brak+=remaining;
  }
  // Wyłącznie w naprawdę ciasnym układzie dopuszczamy złamanie nagłówka.
  const ciasno=brak>0.1;
  for(let k=0;brak>0.1&&k<2000;k++){
   const choices=widths.map((w,i)=>({w,i,limit:weekend.some(x=>x.i===i)?112:58}))
     .filter(x=>x.w>x.limit+0.1).sort((a,b)=>(b.w-b.limit)-(a.w-a.limit));
   if(!choices.length)break;
   const choice=choices[0];
   const delta=Math.min(brak,choice.w-choice.limit,12);widths[choice.i]-=delta;brak-=delta;
  }
  dni.forEach((d,i)=>{
   const w=Math.max(58,Math.floor(widths[i]));
   d.style.setProperty('--v642-szer',w+'px');
   d.style.setProperty('--v642-kol',String(Math.max(1,Math.floor((w-27)/24))));
   const h=d.querySelector('.dzien-tytul');
   if(h)h.style.setProperty('white-space',w+1>=minimum[i]?'nowrap':'normal','important');
  });
  // Wysokość konkretnej godziny jest wspólna dla WSZYSTKICH dni.
  const maxGodz=new Map();
  dni.forEach(d=>d.querySelectorAll('.godzina-row').forEach(r=>{
   const h=(r.querySelector('.godzina-cell')?.textContent||'').trim();
   const count=r.querySelectorAll('.minuty-cell > .minuta').length;
   const cols=Number(d.style.getPropertyValue('--v642-kol'))||1;
   const height=16*Math.max(1,Math.ceil(count/cols));
   maxGodz.set(h,Math.max(maxGodz.get(h)||16,height));
  }));
  dni.forEach(d=>d.querySelectorAll('.godzina-row').forEach(r=>{
   const h=(r.querySelector('.godzina-cell')?.textContent||'').trim();
   r.style.setProperty('--v642-wys',(maxGodz.get(h)||16)+'px');
  }));
 }
 function schedule(){if(queued)return;queued=true;requestAnimationFrame(()=>requestAnimationFrame(dopasuj));}
 const root=document.getElementById('wynik');
 if(root)new MutationObserver(schedule).observe(root,{childList:true,subtree:true});
 window.addEventListener('resize',schedule,{passive:true});
 document.addEventListener('DOMContentLoaded',schedule);
 schedule();
})();
</script>

<script id="fwtp-v644-przenoszenie-legendy">
(function(){
'use strict';
let pending=false;
function check(){
 pending=false;
 const tab=document.querySelector('#wynik .tabliczka');
 if(!tab)return;
 const legend=tab.querySelector('.panel-lewy > .legenda');
 if(!legend)return; // Po przeniesieniu niczego już nie zmieniamy.
 const bottom=tab.getBoundingClientRect().bottom;
 // Dopiero po obliczeniu wszystkich wysokości przez mechanizm v642.
 if(legend.getBoundingClientRect().bottom <= bottom-8)return;
 const cols=Array.from(tab.querySelectorAll('.panel-prawy .trasa-columns > .trasa-kol'));
 if(!cols.length)return;
 const last=cols[cols.length-1];
 // Umieszczamy pod ostatnim przystankiem ostatniej kolumny.
 legend.classList.add('legenda-przeniesiona-237','v644-legenda');
 last.appendChild(legend);
}
function schedule(){
 if(pending)return;pending=true;
 requestAnimationFrame(()=>requestAnimationFrame(()=>requestAnimationFrame(check)));
}
const root=document.getElementById('wynik');
if(root)new MutationObserver(schedule).observe(root,{childList:true,subtree:true});
window.addEventListener('resize',schedule,{passive:true});
document.addEventListener('DOMContentLoaded',schedule);
schedule();
})();
</script>

<!-- WERSJA: 667 — AKTUALNA WERSJA PLIKU; POPRAWKI GEOMETRII I ZAWIJANIA -->
<style id="fwtp-v664-elastyczne-kolumny">
/* Proporcje są wyliczane osobno dla każdej tabliczki. Maksymalna różnica szerokości kolumn: 5 punktów procentowych (47,5%–52,5%). */
html body .tabliczka.v664-elastyczna .trasa-columns.cols-2,
html body .tabliczka.v664-elastyczna .trasa-head.cols-2 {
  grid-template-columns:var(--v664-pierwsza, 50%) minmax(0,1fr)!important;
}
/* Szerokość nazwy jest przeliczana po rzeczywistej zmianie kolumny. */
html body .tabliczka.v664-elastyczna .trasa-nazwa:not(.zawijaj){
  white-space:nowrap;
}
</style>
<script id="fwtp-v664-elastyczne-kolumny-js">
(function(){
 'use strict';
 let oczekuje=false;
 function zaplanuj(){
   if(oczekuje)return;
   oczekuje=true;
   requestAnimationFrame(()=>requestAnimationFrame(()=>{
     oczekuje=false;
     document.querySelectorAll('#wynik .tabliczka').forEach(dopasuj);
   }));
 }
 function dopasuj(t){
   const lewy=t.querySelector('.panel-lewy');
   const prawy=t.querySelector('.panel-prawy');
   const lista=t.querySelector('.trasa-columns');
   if(!lewy||!prawy||!lista)return;
   const szer=t.getBoundingClientRect().width;
   if(szer<300)return;
   const wrap=lewy.querySelector('.rozklady-wrap');
   const rozklady=lewy.querySelector('.rozklady-grid');
   // Nie zwężamy rozkładu do samej liczby minut: uwzględniamy
   // rzeczywiste położenie jego prawej krawędzi i legendę.
   const lewyX=lewy.getBoundingClientRect().left;
   const obecnyLewy=lewy.getBoundingClientRect().width;
   let minimum=0;
   if(rozklady){
     const r=rozklady.getBoundingClientRect();
     minimum=Math.max(minimum,r.right-lewyX+12);
   }
   if(wrap){
     const r=wrap.getBoundingClientRect();
     minimum=Math.max(minimum,r.left-lewyX+Math.min(wrap.scrollWidth,r.width)+12);
   }
   const legenda=lewy.querySelector(':scope > .legenda');
   if(legenda){
     const r=legenda.getBoundingClientRect();
     minimum=Math.max(minimum,r.left-lewyX+Math.min(legenda.scrollWidth,r.width)+12);
   }
   // Rezerwa bezpieczeństwa: żadna minuta ani legenda nie może wejść na listę.
   minimum=Math.max(minimum, szer*0.37);
   const docelowyLewy=Math.max(minimum,Math.min(obecnyLewy,szer*0.50));
   if(obecnyLewy-docelowyLewy>=10){
     const procent=100*docelowyLewy/szer;
     t.style.setProperty('--lewa',procent.toFixed(2)+'%');
     t.style.setProperty('--prawa',(100-procent).toFixed(2)+'%');
   }
   if(!lista.classList.contains('cols-2')){
     t.classList.remove('v664-elastyczna');
     if(typeof ustawZawijanieNazwTrasy==='function')ustawZawijanieNazwTrasy(lista);
     if(typeof v665SynchronizujWysokosci==='function')v665SynchronizujWysokosci(lista);
     return;
   }
   const kolumny=Array.from(lista.children).filter(e=>e.classList.contains('trasa-kol'));
   if(kolumny.length!==2)return;
   // Rozdzielamy dodatkowe miejsce na podstawie faktycznej szerokości
   // nazw w każdej kolumnie, nie arbitralnie 50/50.
   const kontekst=document.createElement('canvas').getContext('2d');
   function potrzeba(kol){
     let max=0, zawiniete=0;
     kol.querySelectorAll('.trasa-stop .trasa-nazwa').forEach(n=>{
       const css=getComputedStyle(n);
       kontekst.font=css.font;
       const napis=n.textContent.replace(/\s+/g,' ').trim();
       const w=kontekst.measureText(napis).width;
       max=Math.max(max,w);
       if(n.classList.contains('zawijaj'))zawiniete++;
     });
     return {max,zawiniete};
   }
   const a=potrzeba(kolumny[0]), b=potrzeba(kolumny[1]);
   const calosc=lista.getBoundingClientRect().width;
   if(calosc<150)return;
   const szerNazwy=calosc-2*36-10;
   let proporcja=(a.max+5)/Math.max(1,a.max+b.max+10);
   proporcja=Math.max(0.475,Math.min(0.525,proporcja));
   // Maksymalnie 5 punktów procentowych różnicy; nie odbieramy miejsca drugiej kolumnie, jeśli jej nazwy też są długie.
   if(b.max>=(1-proporcja)*calosc-36)proporcja=Math.min(proporcja,0.50);
   t.style.setProperty('--v664-pierwsza',(proporcja*100).toFixed(2)+'%');
   t.classList.add('v664-elastyczna');
   if(typeof ustawZawijanieNazwTrasy==='function')ustawZawijanieNazwTrasy(lista);
     if(typeof v665SynchronizujWysokosci==='function')v665SynchronizujWysokosci(lista);
 }
 const wynik=document.getElementById('wynik');
 if(wynik){
   new MutationObserver(zaplanuj).observe(wynik,{childList:true});
 }
 window.addEventListener('resize',zaplanuj);
 document.addEventListener('DOMContentLoaded',zaplanuj);
 zaplanuj();
})();
</script>

html body .tabliczka .trasa-extra-stop.v665-jednoliniowy > .trasa-czas,

/* V667: nazwa, która naprawdę nie mieści się w kolumnie,

html body .tabliczka .trasa-stop.v665-dwuliniowy > .trasa-nazwa,
html body .tabliczka .trasa-extra-stop.v665-dwuliniowy > .trasa-nazwa {
  white-space:normal!important;
  overflow-wrap:normal!important;

  max-width:100%!important;
  line-height:1!important;
}
html body .tabliczka .trasa-stop.v665-jednoliniowy > .trasa-nazwa,
html body .tabliczka .trasa-extra-stop.v665-jednoliniowy > .trasa-nazwa {
  white-space:nowrap!important;
}
</style>
<script id="fwtp-v665-synchronizacja-wierszy-js">
/* Przeliczamy stan wiersza po KAŻDEJ zmianie szerokości kolumn.
   Poprzednie v612-dwuwierszowy mogło pozostać na LI nawet wtedy,
   gdy v664 przeniosło nazwę z dwóch wierszy do jednego. */
function v665SynchronizujWysokosci(kolumny){
  if(!kolumny)return;
  // V667: decyzja na podstawie rzeczywistej szerokości tekstu
  // w AKTUALNYM foncie oraz wolnego miejsca w danej kolumnie.
  // Nie używamy samej klasy .zawijaj, która mogła pozostać po
  // wcześniejszej, węższej lub szerszej wersji kolumny.
  const miernik=document.createElement('canvas').getContext('2d');
  kolumny.querySelectorAll('.trasa-stop, .trasa-extra-stop').forEach(wiersz=>{
    const nazwa=wiersz.querySelector(':scope > .trasa-nazwa');
    if(!nazwa)return;
    const css=getComputedStyle(nazwa);
    miernik.font=css.font;
    const napis=(nazwa.textContent||'').replace(/\s+/g,' ').trim();
    let szerokosc=miernik.measureText(napis).width;
    // Canvas nie uwzględnia letter-spacing; doliczamy go jawnie.
    const rozstaw=parseFloat(css.letterSpacing);
    if(Number.isFinite(rozstaw)&&rozstaw!==0)
      szerokosc+=Math.max(0,napis.length-1)*rozstaw;
    const rect=nazwa.getBoundingClientRect();
    const row=wiersz.getBoundingClientRect();
    const nz=wiersz.querySelector(':scope > .trasa-nz');
    const rezerwaNz=nz?Math.max(0,nz.getBoundingClientRect().width)+2:0;
    // Dwa ograniczenia: własne pole nazwy oraz fizyczny koniec
    // wiersza, pomniejszony o oznaczenie NŻ.
    const doPrawej=Math.max(0,row.right-rect.left-rezerwaNz-2);
    const pole=rect.width>8?Math.min(rect.width,doPrawej):doPrawej;
    const zawija=szerokosc>pole+0.5;
    nazwa.classList.toggle('zawijaj',zawija);
    wiersz.classList.toggle('v665-jednoliniowy',!zawija);
    wiersz.classList.toggle('v665-dwuliniowy',zawija);
    wiersz.classList.toggle('v612-dwuwierszowy',zawija);
    wiersz.style.removeProperty('height');
    wiersz.style.removeProperty('min-height');
  });
}
</script>
