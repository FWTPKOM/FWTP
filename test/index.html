/* =========================================================
   WERSJA 362 — OSTATNIA KROPKA DOKŁADNIE NA OSI
   ========================================================= */

/*
   Ostatni przystanek ma używać dokładnie tej samej poziomej
   pozycji kropki co zwykły przystanek. Różnica dotyczy tylko
   długości pionowej linii — ma ona zakończyć się w środku kropki.

   Geometria:
   oś:   left 4.1px + 2.25px / 2 = 5.225px
   kropka: left 1px + 8.5px / 2 = 5.25px
   Różnica = tylko 0.025px.
*/

.trasa-stop.koniec-trasy-210 .trasa-os::after {
    left: 1px !important;
    right: auto !important;
    width: 8.5px !important;
    height: 8.5px !important;
    transform: none !important;
    box-sizing: border-box !important;
}

/*
   Pionowa oś końcowego przystanku kończy się w środku kropki,
   zamiast przechodzić pod nią.
*/
.trasa-stop.koniec-trasy-210 .trasa-os {
    left: 4.1px !important;
    width: 2.25px !important;
}

/*
   Gdy element jest końcem wyłącznie dlatego, że kończy się
   pierwsza kolumna, nie traktujemy go jako faktycznego końca
   całej trasy. Linia może być kontynuowana zgodnie z istniejącą
   logiką podziału kolumn.
*/
.trasa-stop.koniec-trasy-210:not(.ma-kontynuacje-trasy) .trasa-os::before {
}
</style>
<style>
/* =========================================================
   WERSJA 560 — PRZYSTANEK KOŃCOWY PRZELOTOWY
   =========================================================
   JSON:
       koncowy=true, kontynuacja=false
           -> zwykły rzeczywisty kraniec: oś kończy się na kropce

       koncowy=true, kontynuacja=true
           -> przystanek końcowy przelotowy:
              nazwa i kropka jak na krańcu,
              ALE pionowa oś biegnie dalej.

   Ta reguła ma pierwszeństwo przed starszymi regułami V385,
   które uzależniały ciągłość osi od obecności .trasa-extra.
   Od V560 źródłem prawdy jest lista_przystankowa.elementy[].
   ========================================================= */

.tabliczka
.trasa-stop.v514-rzeczywisty-koniec.ma-kontynuacje-trasy
.trasa-os::before {
    content: "" !important;
    display: block !important;
    top: 0 !important;
    bottom: 0 !important;
    height: auto !important;
}

/*
   Gdy pomiędzy terminalem przelotowym a kolejnym przystankiem
   występuje separator, np. "Trasa w kursach „i”", renderer V560
   dodaje do separatora osobny odcinek tej SAMEJ osi.

   Nie używamy MutationObservera. Oś powstaje od razu podczas
   renderowania modelu JSON.
*/
.tabliczka .trasa-separator.v560-most-terminalu {
    position: relative !important;
}

.tabliczka .trasa-separator.v560-most-terminalu
.v560-os-przelotowa {
    position: absolute !important;
    display: block !important;
    left: 23.1px !important;
    top: 0 !important;
    bottom: 0 !important;
    width: 2.25px !important;
    background: #000 !important;
    z-index: 2 !important;
    pointer-events: none !important;
}

/*
   Tekst separatora ma pozostać czytelny, ale czarna oś jest
   elementem trasy i nie może znikać wskutek starej logiki końca.
*/
.tabliczka .trasa-separator.v560-most-terminalu
.trasa-separator-title {
    position: relative !important;
    z-index: 1 !important;
}
</style>
<style>
/* =========================================================
   WERSJA 363 — KOREKTA KIERUNKU OSTATNIEJ KROPKI
   ========================================================= */

/*
   W 362 korekta poszła w prawo.
   Teraz przesuwamy WYŁĄCZNIE końcową kropkę w lewo.
   Oś oraz wszystkie zwykłe kropki pozostają bez zmian.
*/
.trasa-stop.koniec-trasy-210 .trasa-os::after {
    left: 0px !important;
    right: auto !important;
    transform: none !important;
}
</style>
<style>
/* =========================================================
   WERSJA 364 — OSTATNIA KROPKA DOKŁADNIE NA TEJ SAMEJ OSI
   ========================================================= */

/*
   WAŻNE:
   Nie przesuwamy .trasa-os. To jest komórka/kolumna osi i musi
   pozostać dokładnie tam, gdzie wszystkie pozostałe przystanki.
   W 362 ustawienie left:4.1px na samym .trasa-os przesunęło cały
   układ współrzędnych ostatniego punktu.
*/
.trasa-stop.koniec-trasy-210 .trasa-os {
    left: auto !important;
    right: auto !important;
    width: auto !important;
}

/*
   Identyczna geometria jak dla zwykłych przystanków:
   linia:  left 4.1px, szerokość 2.25px -> środek 5.225px
   kropka: left 1px,   szerokość 8.5px -> środek 5.25px
*/
.trasa-stop.koniec-trasy-210 .trasa-os::after {
    content: "" !important;
    display: block !important;
    position: absolute !important;

    left: 1px !important;
    right: auto !important;
    top: 3px !important;

    width: 8.5px !important;
    height: 8.5px !important;
    min-width: 8.5px !important;
    min-height: 8.5px !important;

    transform: none !important;

    border-radius: 50% !important;
    background: currentColor !important;
    box-sizing: border-box !important;
    z-index: 5 !important;
}

/*
   Linia ma tę samą pozycję poziomą co wszędzie.
   Na faktycznym końcu kończy się w środku punktu.
*/
.trasa-stop.koniec-trasy-210 .trasa-os::before {
    left: 4.1px !important;
    width: 2.25px !important;
    bottom: calc(100% - 7.25px) !important;
    height: auto !important;
}
</style>
<style>
/* =========================================================
   WERSJA 368 — CIĄGŁOŚĆ OSI PRZY TRASIE WYDŁUŻONEJ
   ========================================================= */

/*
   koniec-trasy-210 normalnie ucina kreskę na środku kropki.
   Jeśli JS oznaczy ten sam wiersz jako ma-kontynuacje-trasy,
   nie jest to koniec całej trasy, tylko koniec trasy podstawowej.
   Dlatego kreska biegnie przez kropkę dalej w dół.
*/
.trasa-stop.koniec-trasy-210.ma-kontynuacje-trasy .trasa-os::before {
    top: 0 !important;
    bottom: 0 !important;
    height: auto !important;
}
</style>
<style>
/* =========================================================
   WERSJA 372 — DWA KIERUNKI: PRAWDZIWE ZAWIJANIE
   ========================================================= */

/*
   Przy trasie dwukolumnowej lewy panel ma ok. 50.5% tabliczki.
   Stary nagłówek miał szerokość aż 560px, więc fizycznie wychodził
   poza lewy panel i tekst kierunku wchodził na listę przystanków.

   Przy dwóch kierunkach ograniczamy nagłówek do szerokości
   RZECZYWISTEGO lewego panelu.
*/
.naglowek-tabliczki:has(.kierunki-dwa) {
    width: calc(100% - 34px) !important;
    height: auto !important;
    min-height: 80px !important;
    align-items: start !important;
}

/*
   Kolumna z tekstem może się realnie zwężać.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .dane-linii {
    min-width: 0 !important;
    padding-top: 1px !important;
}

/*
   LINIA ZWYKŁA maksymalnie wysoko.
   Pierwszy kierunek zaczyna się prawie od razu pod nią.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .typ-linii {
    top: -4px !important;
    margin-bottom: 0 !important;
}

/*
   To są PRAWDZIWE elementy generowane przez renderer.
   W 371 błędnie stylowany był .kierunek, podczas gdy przy dwóch
   kierunkach HTML używa .kierunki-dwa-wiersz.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa {
    display: block !important;
    position: static !important;
    top: auto !important;

    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;

    margin: -1px 0 0 0 !important;
    padding: 0 !important;
    transform: none !important;
}

.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa-wiersz {
    display: block !important;

    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;

    white-space: normal !important;
    overflow-wrap: normal !important;
    word-break: normal !important;

    margin: 0 !important;
    padding: 0 !important;

    line-height: 18px !important;
    transform: none !important;
}

/*
   Strzałka pozostaje przy początku danego kierunku.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa-strzalka {
    margin-right: 7px !important;
}

/*
   "Ważny od" NIE jest już absolutnie przyklejony do starego
   80-pikselowego nagłówka. Ma znaleźć się pod pełną wysokością
   obu kierunków, także gdy pierwszy zawinie się do dwóch wierszy.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .wazny {
    position: static !important;
    top: auto !important;
    bottom: auto !important;

    margin: 1px 0 0 0 !important;
    padding: 0 !important;

    line-height: 11px !important;
}

/*
   Pole numeru zachowuje dotychczasowe 80px.
   Tabela rozkładu zacznie się niżej tylko wtedy, gdy tekst dwóch
   kierunków rzeczywiście potrzebuje większej wysokości.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .numer-linii-box {
    align-self: start !important;
}
</style>
<style>
/* =========================================================
   WERSJA 373 — TYPOGRAFIA I ODSTĘPY DWÓCH KIERUNKÓW
   ========================================================= */

/*
   W 372 własne line-height dla .kierunki-dwa-wiersz zmieniło
   wizualnie typografię. Tutaj nie narzucamy nowego kroju/font-size;
   dziedziczymy dokładnie font nagłówka z .dane-linii.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa,
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa-wiersz,
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa-strzalka {
    font-family: inherit !important;
    font-size: inherit !important;
    font-weight: inherit !important;
    font-style: inherit !important;
    letter-spacing: inherit !important;
}

/*
   Cały blok kierunków 5 px wyżej.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa {
    margin-top: -5px !important;
    margin-bottom: 0 !important;
}

/*
   Mniejsza interlinia:
   - pomiędzy pierwszą i drugą linią zawiniętego kierunku,
   - pomiędzy pierwszym a drugim kierunkiem.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa-wiersz {
    line-height: 15px !important;
    margin-top: 0 !important;
    margin-bottom: -1px !important;
}

/*
   "Ważny od" również bliżej drugiego kierunku.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .wazny {
    margin-top: -1px !important;
}
</style>
<style>
/* =========================================================
   WERSJA 374 — ORYGINALNA CZCIONKA, +2PX ODSTĘPU, WAŻNY NA DOLE
   ========================================================= */

/*
   Przywracamy dokładne parametry typografii używane wcześniej
   przez nagłówek kierunku. Nie dziedziczymy font-size z rodzica,
   bo właśnie to w 373 dało inny wygląd.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa,
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa-wiersz,
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa-strzalka {
    font-family: "Arial Narrow", Arial, sans-serif !important;
    font-size: 20px !important;
    font-weight: 400 !important;
    font-style: normal !important;
    letter-spacing: 0 !important;
}

/*
   Zostaje podniesienie całego bloku o 5 px.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa {
    margin-top: -5px !important;
    margin-bottom: 0 !important;
}

/*
   W 373 było 15px / -1px.
   Użytkownik chce o 2px większe odstępy:
   17px interlinii i 1px po każdym kierunku.
   Dotyczy to także zawiniętego ELSNERÓW.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa-wiersz {
    line-height: 17px !important;
    margin-top: 0 !important;
    margin-bottom: 1px !important;
}

/*
   "Ważny od" wraca dokładnie na dolną krawędź pola numeru linii.
   Nie bierze udziału w przepływie kierunków.
*/
.naglowek-tabliczki:has(.kierunki-dwa) {
    position: relative !important;
}

.naglowek-tabliczki:has(.kierunki-dwa) .wazny {
    position: absolute !important;
    left: 204px !important;
    bottom: 0 !important;
    top: auto !important;

    margin: 0 !important;
    padding: 0 !important;

    font-family: "Arial Narrow", Arial, sans-serif !important;
    line-height: 11px !important;
}
</style>
<style>
/* =========================================================
   WERSJA 375 — PRZYWRÓCENIE TYPOGRAFII
   ========================================================= */

/* Kierunki: dokładnie ten stos czcionek. */
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa,
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa-wiersz,
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa-strzalka {
    font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
    font-size: 17px !important;
    font-weight: 400 !important;
    font-style: normal !important;
    letter-spacing: 0 !important;
}

/*
   Przywrócenie ustawienia nazw przystanków/trasy,
   które było wcześniej i nie powinno było zostać naruszone.
*/
.stop-name,
.trasa-nazwa {
    transform: scaleY(1.30) !important;
    transform-origin: left center !important;
    letter-spacing: 0.75px !important;
}

/*
   Zachowujemy poprawki układu z ostatniej wersji:
   blok kierunków -5 px oraz odstępy z 374.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa {
    margin-top: -5px !important;
}

.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa-wiersz {
    line-height: 17px !important;
    margin-top: 0 !important;
    margin-bottom: 1px !important;
}
</style>
<style>
/* =========================================================
   WERSJA 376 — KIERUNEK + "WAŻNY OD" JAK W PRZESŁANEJ V246
   ========================================================= */

/* Dokładna typografia kierunku z przesłanej wersji. */
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa-wiersz {
    font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
    font-size: 17px !important;
    line-height: 18px !important;
    font-weight: 400 !important;
    letter-spacing: normal !important;

    /* jedyna różnica funkcjonalna: pozwalamy zawinąć długi kierunek */
    white-space: normal !important;

    transform: scaleY(1.08) !important;
    transform-origin: left center !important;

    margin-top: 0 !important;
    margin-bottom: 0 !important;
}

/* Strzałka jak w przesłanej wersji. */
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa-strzalka {
    display: inline-block !important;
    margin-right: 7px !important;

    font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
    font-size: 17px !important;
    font-weight: 400 !important;
}

/*
   Położenie kierunków zachowujemy zgodnie z obecną prośbą:
   blok jest 5 px wyżej.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa {
    position: relative !important;
    top: -3px !important;
    margin-top: 0 !important;
    margin-bottom: 0 !important;
    padding-bottom: 12px !important;
    transform: none !important;
}

/*
   Nagłówek ma stałe 80 px — dokładnie tak jak w przesłanej wersji.
   Dolna krawędź jest więc na tej samej wysokości co pole numeru linii.
*/
.naglowek-tabliczki:has(.kierunki-dwa) {
    position: relative !important;
    height: 80px !important;
    min-height: 80px !important;
    align-items: start !important;
}

/* Typografia "Ważny od" z przesłanej wersji. */
.naglowek-tabliczki:has(.kierunki-dwa) .wazny {
    position: absolute !important;
    top: auto !important;
    bottom: 1px !important;

    /* zaczyna się w kolumnie danych, nie pod numerem linii */
    left: 163px !important;

    margin: 0 !important;
    padding: 0 !important;

    font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
    font-size: 11px !important;
    font-weight: 400 !important;
    color: #000000 !important;
    line-height: 1 !important;

    transform: scaleY(1.08) !important;
    transform-origin: center !important;
}
</style>
<style>
/* =========================================================
   WERSJA 377 — ODSTĘPY KIERUNKÓW MNIEJSZE O 2 PX
   ========================================================= */

/*
   376: line-height 18px.
   377: 16px, czyli o 2px mniej:
   - między liniami zawiniętego kierunku,
   - między pierwszym i drugim kierunkiem.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa-wiersz {
    line-height: 16px !important;
}

/* Pozostałe ustawienia z 376 bez zmian. */
</style>
<style>
/* =========================================================
   WERSJA 379 — JEDEN KIERUNEK ZAWINIĘTY NA DWA WIERSZE
   ========================================================= */

/*
   Nagłówek nadal ma dokładnie 80 px — tyle samo co ramka numeru linii.
*/
.naglowek-tabliczki {
    position: relative;
    height: 80px !important;
    min-height: 80px !important;
}

/*
   Dla zwykłego pojedynczego kierunku rezerwujemy dół nagłówka
   na napis "Ważny od". Sam kierunek może mieć 1 albo 2 wiersze.
*/
.naglowek-tabliczki:not(:has(.kierunki-dwa)) .dane-linii {
    position: relative !important;
    height: 80px !important;
    min-height: 80px !important;
    box-sizing: border-box !important;
    padding-bottom: 13px !important;
}

/*
   Jeśli pojedynczy kierunek zawinie się na dwa wiersze (np. linia 401),
   przesuwamy go wyżej, ale nie zmieniamy jego czcionki ani transformacji.

            padding: 0 4px;
            text-align: center;

            pointer-events: none;
            box-sizing: border-box;
            font-family: Calibri, "Segoe UI", Arial, sans-serif;
            font-size: 13.5px;
            line-height: 1;
            font-weight: 400;
            letter-spacing: 0.75px;
            transform: scaleY(1.30);
            transform-origin: center;

        }


        /* =========================================================
           LEGENDA
           ========================================================= */

        .legenda {
            max-width: 620px;

            margin: 11px 12px 12px 17px;

            font-size: 14px;
            line-height: 1.25;
        }

        .legenda-wiersz {
            margin-top: -3px;

            display: grid;
            grid-template-columns: 22px auto minmax(0, 1fr);
            
            align-items: baseline;

            font-weight: 700;
        }

        .legenda-litera {
            display: block;

            width: 22px;
            min-width: 22px;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .legenda-myslnik {
            display: block;
            margin-left: -2px;
            margin-right: 5px;
            padding: 0;
            text-align: center;
        }

        .legenda-opis {
            display: block;
            min-width: 0;
        }


        /* =========================================================
           PIONOWY NAPIS PRZYSTANKU
           ========================================================= */

        .etykieta-przystanku {
            position: absolute;

            left: 1px;
            bottom: 13px;

            writing-mode: vertical-rl;
            transform: rotate(180deg);

            font-size: 13px;
            line-height: 1;
        }


        /* =========================================================
           TRASA - PRAWA CZĘŚĆ
           ========================================================= */

        .trasa-head {
            min-height: 24px;

            display: grid;
            grid-template-columns: 1fr;
            align-items: center;

            margin-left: 3px;
            width: calc(100% - 3px);
            padding: 2px 0;

            border-bottom: 1px solid #777;

            font-size: 13px;
            font-weight: 400;

            box-sizing: border-box;
        }

        .trasa-head.cols-2 {
            grid-template-columns: 1fr 1fr;
        }

        .trasa-head-label {
            min-width: 0;
            padding: 0 6px 0 3px;
            transform: translateY(3px);
            box-sizing: border-box;
            font-weight: 400;
        }

        .trasa-head.cols-2 .trasa-head-label:first-child {
            border-right: 0;
        }

        .trasa-columns {
            display: grid;

            height: calc(100% - 24px);
            min-height: 0;
            overflow: hidden;
        }

        .trasa-columns.cols-1 {
            grid-template-columns: 1fr;
        }

        .trasa-columns.cols-2 {
            grid-template-columns: 1fr 1fr;
        }

        .trasa-kol {
            min-width: 0;
            overflow: visible;

            /* 5 px bliżej pionowej linii oddzielającej rozkład od trasy */
            padding: 4px 2px 8px 2px;

            border-right: 1px solid #777;
        }

        .trasa-kol:last-child {
            border-right: 0;
        }

        .trasa-lista {
            margin: 0;
            padding: 0;

            list-style: none;
        }

        .trasa-stop {
            display: grid;
            grid-template-columns: 19px 12px minmax(0, 1fr) 12px;
            align-items: center;

            min-height: 16.5px;

            color: #111;

            font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
            font-size: 13.5px;
            line-height: 1;
        }

        .trasa-stop.przed {
            color: #777;
        }

        .trasa-czas {
            align-self: start;

            padding-top: 0;
            padding-right: 1px;

            text-align: right;
            white-space: nowrap;
            line-height: 15px;
        
            font-size: 13px;
        }

        .trasa-os {
            position: relative;

            align-self: stretch;
        }

        .trasa-os::before {
            content: "";

            position: absolute;

            left: 4.1px;
            top: 0;
            bottom: 0;

            width: 2.25px;

            background: currentColor;
        }

        .trasa-os::after {
            content: "";

            position: absolute;

            left: 1px;
            top: 3px;

            width: 8.5px;
            height: 8.5px;

            transform: none;

            background: currentColor;

            border-radius: 50%;
        }

        .trasa-stop.kraniec-poczatek .trasa-os::before {
            top: 8px;
        }

        .trasa-stop.kraniec-koniec .trasa-os::before {
            bottom: calc(100% - 8px);
        }

        /* Jeżeli pod trasą podstawową jest dalszy wariant/wydłużenie,
           z kropki ostatniego przystanku podstawowego wychodzi
           krótka kreska w dół. */
        .trasa-kol:has(.trasa-extra)
        .trasa-stop.kraniec-koniec
        .trasa-os::before {
            bottom: 0;
        }

        .trasa-nazwa {
            min-width: 0;

            overflow: visible;

            white-space: nowrap;
            overflow-wrap: normal;
            word-break: normal;
            hyphens: none;

            font-weight: 400;
            line-height: 1;
        }

        .trasa-stop.kraniec-poczatek .trasa-nazwa,
        .trasa-stop.kraniec-koniec .trasa-nazwa {
            font-weight: 700;
        }

        .trasa-nazwa.zawijaj {
            white-space: normal;
        }

        /* Nazwa w dwóch liniach ma własne miejsce w układzie,
           dzięki czemu kolejny przystanek nie nachodzi na drugą linię. */
        .trasa-stop:has(.trasa-nazwa.zawijaj) {
            min-height: 33px;
        }

        .trasa-nazwa.zawijaj .trasa-nazwa-aktywna {
    white-space: normal;
}

        .trasa-stop.wybrany {
            color: #111;
        }

        .trasa-stop.nz .trasa-os::after {
            background: #fff;
            border: 2px solid currentColor;
            box-sizing: border-box;
        }

        .trasa-nz {
            justify-self: end;
            align-self: start;

            position: relative;
            right: 1px;

            padding-right: 0;

            text-align: right;

            font-size: 15.5px;
            line-height: 1;
            font-weight: 400;
        }


        /* =========================================================
           BŁĄD
           ========================================================= */

        .blad {
            padding: 20px;

            background: #fff;

            border: 1px solid #ddd;
            border-radius: 7px;

            color: #666;
        }


        /* =========================================================
           RESPONSYWNOŚĆ
           ========================================================= */

        @media (max-width: 850px) {

            .sterowanie-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 560px) {

            .tabliczka-page {
                margin: 15px auto;
                padding: 0 8px;
            }

            .sterowanie-grid {
                grid-template-columns: 1fr;
            }
        }



        /* =========================================================
           TRASY WYDŁUŻONE / WARIANTOWE
           ========================================================= */

        .trasa-extra {
            margin-top: 14px;
        }


        /*
           Nagłówki pojawiające się wewnątrz głównej listy trasy,
           gdy autobus wjeżdża na odcinek wariantowy i później
           wraca na wspólną trasę.
        */
        .trasa-separator {
            display: block;
            list-style: none;
            margin: 14px 0 9px 0;
            padding: 0;
            min-height: 16px;
        }



        /* =========================================================
           WERSJA 432 — MIEJSCOWOŚCI JAK NA TABLICZCE WZORCOWEJ

           - nazwa miejscowości o 2 px mniejsza,
           - poziome kreski są wyraźniejsze,
           - pionowa oś trasy przechodzi przez cały wiersz miejscowości,
             dzięki czemu łączy kropkę przystanku nad i pod nagłówkiem.
           ========================================================= */
        .trasa-separator.trasa-miejscowosc-429 {
            display: flex;
            align-items: center;
            gap: 7px;

            /* Bez zewnętrznego marginesu: oś nie może mieć przerwy. */
            margin: 0;
            min-height: 22px;
            padding: 5px 0 3px 0;
            box-sizing: border-box;

            position: relative;

            /*
               Oś .trasa-stop znajduje się w drugiej kolumnie siatki:
               19 px + 4.1 px. Ten sam punkt prowadzimy przez separator.
            */
            background-image: linear-gradient(
                to right,
                transparent 23.1px,
                #111 23.1px,
                #111 25.35px,
                transparent 25.35px
            );
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }

        .trasa-separator.trasa-miejscowosc-429::before,
        .trasa-separator.trasa-miejscowosc-429::after {
            content: "";
            flex: 1 1 auto;
            min-width: 20px;

            /* Około 2× mocniejsze kreski niż w v430. */
            border-top: 2px dashed #777;

            /* Kreski i tekst mają być nad pionową osią. */
            position: relative;
            z-index: 1;
        }

        /*
           V432 — jeśli separator miejscowości jest pierwszym elementem
           danej kolumny, nie ma nad nim poprzedniej kropki. Dlatego
           pionowa oś nie może wychodzić ponad pierwszy przystanek.
        */
        .trasa-lista-397 > .trasa-miejscowosc-429:first-child {
            background-image: none !important;
        }

        .trasa-lista-397 > .trasa-miejscowosc-429:first-child
        + .trasa-stop .trasa-os::before,
        .trasa-lista-397 > .trasa-miejscowosc-429:first-child
        + .trasa-extra-stop .trasa-os::before {
            top: 50% !important;
            height: 50% !important;
        }

        .trasa-separator.trasa-miejscowosc-429 .trasa-separator-title {
            display: inline-block;
            width: auto;
            flex: 0 0 auto;
            padding: 0 2px;

            /* v432: nazwa miejscowości ma 8 px. */
            font-size: 8px;
            line-height: 9px;
            color: #777;
            font-weight: 400;
            text-align: center;
            white-space: nowrap;
            text-transform: uppercase;

            position: relative;
            z-index: 2;
            background: #fff;
        }

        .trasa-separator-title {
            display: block;
            width: 100%;
            margin: 0;
            padding: 0 4px;
            box-sizing: border-box;

            font-family: Calibri, "Segoe UI", Arial, sans-serif;
            font-size: 16px;
            line-height: 16px;
            font-weight: 400;
            color: #111;

            /*
               Jeżeli lista liter nie mieści się w szerokości kolumny,
               tekst przechodzi do następnego wiersza.
            */
            white-space: normal;
            overflow-wrap: normal;
            word-break: normal;
            text-align: center;

            transform: scaleY(1.08);
            transform-origin: center;
        }

        .trasa-extra-title {
            margin: auto auto 9px auto;
            font-size: 16px;
            line-height: 16px;
            font-weight: 400;
            color: #111;
            white-space: nowrap;
            text-align: center;
            transform-origin: center;
        }

        .trasa-extra-lista {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .trasa-extra-stop {
            display: grid;
            grid-template-columns: 19px 12px minmax(0,1fr) 12px;
            align-items: center;
            min-height: 16.5px;
            color: #111;
            font-family: Calibri, "Segoe UI", Arial, sans-serif;
            font-size: 13.5px;
            line-height: 1;
            transform: none;
        }

        .trasa-extra-stop .trasa-czas {
            text-align: right;
        }

        .trasa-extra-stop .trasa-os {
            position: relative;
            align-self: stretch;
            min-height: 16.5px;
        }

        .trasa-extra-stop .trasa-os::before {
            content: "";
            position: absolute;
            left: 4.1px;
            top: 0;
            bottom: 0;
            width: 2.25px;
            background: #111;
        }

        /* Ostatni przystanek wydłużenia:
           linia dochodzi tylko od góry do kropki. */
        .trasa-extra-stop:last-child .trasa-os::before {
            bottom: calc(100% - 8px);
        }

        .trasa-extra-stop .trasa-os::after {
            content: "";
            position: absolute;
            left: 1px;
            top: 4px;
            width: 8.5px;
            height: 8.5px;
            border-radius: 50%;
            background: #111;
        }

        .trasa-extra-stop .trasa-nazwa {
            min-width: 0;
            overflow: visible;
            white-space: nowrap;
            overflow-wrap: normal;
            word-break: normal;
            hyphens: none;
            font-weight: 400;
            line-height: 1;
            transform: scaleY(1.30);
            transform-origin: left center;
            letter-spacing: 0.75px;
        }

        /* Tylko kraniec trasy wydłużonej jest pogrubiony. */
        .trasa-extra-stop:last-child .trasa-nazwa {
            font-weight: 700;
        }

        .trasa-extra-stop .trasa-nz {
            transform: scaleY(1.30);
            transform-origin: right center;
        }

        .trasa-extra-stop .trasa-nazwa.zawijaj {
            white-space: normal;
        }

        .trasa-extra-stop:has(.trasa-nazwa.zawijaj) {
            min-height: 33px;
        }

        /*
         * Wydłużenie ma teraz ten sam stan aktywny/minięty
         * co zwykła lista przystanków.
         */
        .trasa-extra-stop.przed,
        .trasa-extra-stop.przed .trasa-nazwa,
        .trasa-extra-stop.przed .trasa-czas,
        .trasa-extra-stop.przed .trasa-nz {
            color:#777;
        }

        .trasa-extra-stop.przed .trasa-os::before,
        .trasa-extra-stop.przed .trasa-os::after {
            background:#777;
        }

        .trasa-extra-stop.wybrany {
            color:#111;
        }

        .trasa-extra-stop.wybrany .trasa-nazwa {
            transform:scaleY(1.30);
            transform-origin:left center;
        }

        /* =========================================================
           DRUK
           ========================================================= */

        @media print {

            body {
                background: #fff !important;
            }

            .topbar,
            .sterowanie,
            footer {
                display: none !important;
            }

            .tabliczka-page {
                max-width: none;
                margin: 0;
                padding: 0;
            }

            .tabliczka-scroll {
                overflow: visible;
            }

            .tabliczka {
                width: 210mm;
                height: 160mm;
                min-height: 160mm;
                margin: 0 auto;
            }
        }
    
/* =========================================================
   DOPASOWANIE PROPORCJI CZCIONKI DO WZORU PDF
   Delikatne rozciągnięcie pionowe tekstu o 8%.
   Numer linii pozostaje bez skalowania.
   ========================================================= */

.typ-linii,
.kierunek,
.wazny,
.dzien-tytul,
.godziny-head,
.legenda,
.trasa-head-label,
.stop-time,
.stop-zadanie,
.trasa-extra-title,
.trasa-extra-stop {
    transform: scaleY(1.08);
    transform-origin: center;
}

/* Lista przystanków – mocniejsze pionowe rozciągnięcie,
   żeby efekt był widoczny również przy nazwach przystanków. */
.stop-name,
.trasa-nazwa {
    transform: scaleY(1.30);
    transform-origin: left center;
    letter-spacing: 0.75px;
}

/* Aktywny przystanek ma takie samo pionowe rozciągnięcie
   jak pozostałe nazwy przystanków — również przy dwóch liniach. */
.trasa-stop.wybrany .trasa-nazwa {
    transform: scaleY(1.30);
    transform-origin: left center;
}

.trasa-nazwa-aktywna {
    position: relative;
    display: inline;

    padding: 0;
    margin: 0;

    /* KLUCZOWE:
       aktywny ma dokładnie taki sam line-height jak zwykła nazwa. */
    line-height: 1;

    color: #fff;
    font-weight: inherit;
    letter-spacing: inherit;

    vertical-align: baseline;

    /* Tło jest tylko dekoracją tekstu i nie zmienia wysokości linii. */
    background:
        linear-gradient(
            to bottom,
            transparent 0,
            transparent 1.55px,
            #111 1.55px,
            #111 calc(100% - 1.55px),
            transparent calc(100% - 1.55px),
            transparent 100%
        );

    box-shadow: none;

    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
}


/* Symbol „ż” rozciągnięty pionowo tak samo jak lista przystanków. */
.trasa-nz {
    transform: scaleY(1.30);
    transform-origin: right center;
}

/* Godziny i minuty bez pionowego skalowania. */
.godzina-cell {
    transform: none;
}

/* Minuty rozciągnięte tylko pionowo.
   Nie zmieniamy letter-spacing ani szerokości komórki,
   więc cyfry nie są od siebie bardziej odsunięte. */
.minuta {
    transform: scaleY(1.12);
    transform-origin: left center;
    letter-spacing: 0;
    font-weight: 500;
}

/* Elementy, które miały już własny transform, wymagają połączenia transformacji. */
.typ-linii {
    transform: translateY(1px) scaleY(1.08);
}

.kierunek {
    transform: translateY(2px) scaleY(1.08);
}

.trasa-head-label {
    transform: translateY(3px) scaleY(1.08);
}




/* =========================================================
   KOLORY TEKSTÓW
   ========================================================= */

.dzien-tytul,
.godziny-head,
.trasa-stop:not(.przed),
.trasa-stop:not(.przed) .trasa-nazwa,
.trasa-stop:not(.przed) .trasa-czas,
.trasa-stop:not(.przed) .trasa-nz {
    color: #000000;
}

/* Przystanki już minięte pozostają takie jak wcześniej. */
.trasa-stop.przed {
    color: #777;
}


        /* =========================================================
           OPISY WARIANTÓW TRASY — CZCIONKA JAK LISTA PRZYSTANKÓW
           ========================================================= */

        .trasa-separator-title,
        .trasa-extra-title {
            font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
            font-size: 13.5px !important;
            line-height: 1 !important;
            font-weight: 400 !important;
            letter-spacing: 0.75px !important;
            transform: scaleY(1.30) !important;
            transform-origin: center !important;
        }



/* =========================================================
   "NIE KURSUJE" — JEDNA LINIA, JEŻELI KOLUMNA MA MIEJSCE
   ========================================================= */

/*
   Tekst nie może sam zawijać się na dwie linie.
   Jeżeli układ ma wystarczająco dużo miejsca na tabelę dnia,
   napis pozostaje jako "NIE KURSUJE" w jednej linii.

   Szerokości całej sekcji rozkładów nie zwiększamy tutaj,
   więc lista przystanków nadal ma pierwszeństwo i nie może
   zostać przykryta przez rozkład.
*/
.nie-kursuje,
.nie-kursuje-tekst {
    white-space: nowrap !important;
    word-break: keep-all !important;
    overflow-wrap: normal !important;
}

/*
   Jeżeli kontener "NIE KURSUJE" jest flexem/gridem,
   pozwalamy tekstowi wykorzystać całą dostępną szerokość
   części minutowej.
*/
.nie-kursuje-tekst {
    width: max-content;
    max-width: none;
}


/* =========================================================
   ŁADOWANIE TABLICZKI – AUTOBUS NA PASKU
   Wygląd taki sam jak w brygady.html.
   Loader pozostaje widoczny aż do zakończenia renderowania.
   ========================================================= */

.tabliczka-loader{
    padding:28px 20px 30px;
    background:#ffffff;
    border:1px solid #dddddd;
    border-radius:8px;
    box-sizing:border-box;
    text-align:center;
    margin-bottom:16px;
}

.tabliczka-loader-title{
    margin:0 0 22px;
    color:#222222;
    font-size:16px;
    font-weight:800;
}

.tabliczka-loader-road{
    position:relative;
    width:min(650px,100%);
    height:62px;
    margin:0 auto;
    overflow:visible;
}

.tabliczka-loader-track{
    position:absolute;
    left:0;
    right:0;
    top:50%;
    height:9px;
    transform:translateY(-50%);
    overflow:hidden;
    background:#e4e4e4;
    border:1px solid #c7c7c7;
    border-radius:999px;
    box-sizing:border-box;
}

.tabliczka-loader-progress{
    width:0%;
    height:100%;
    background:#d61c12;
    border-radius:999px;
    transition:width .30s ease;
}

.tabliczka-loader-bus{
    position:absolute;
    left:0%;
    top:50%;
    width:125px;
    height:auto;
    max-height:54px;
    object-fit:contain;
    transform:translate(-50%,-50%);
    z-index:3;
    transition:left .30s ease;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));
    pointer-events:none;
}

.tabliczka-loader-percent{
    margin-top:7px;
    color:#d61c12;
    font-size:18px;
    font-weight:900;
}

.tabliczka-loader-stage{
    margin-top:4px;
    min-height:15px;
    color:#666666;
    font-size:12px;
}

.tabliczka-loader-progress.gotowe{
    width:100%!important;
}

.tabliczka-loader-bus.gotowe{
    left:100%!important;
}

@media(max-width:550px){
    .tabliczka-loader{
        padding:24px 10px 26px;
    }

    .tabliczka-loader-road{
        width:86%;
    }

    .tabliczka-loader-bus{
        width:96px;
        height:auto;
        max-height:46px;
    }
}


/* =========================================================
   NIE KURSUJE — ZAWSZE W JEDNEJ LINII, JEŚLI JEST MIEJSCE
   ========================================================= */

.nie-kursuje-napis {
    white-space: nowrap !important;
    word-break: keep-all !important;
    overflow-wrap: normal !important;
    flex-wrap: nowrap !important;
}


/* =========================================================
   TABLICZKA UKRYTA DO PEŁNEGO ZAKOŃCZENIA ŁADOWANIA
   ========================================================= */

body.tabliczka-w-trakcie-ladowania #wynik {
    visibility: hidden !important;
}

body.tabliczka-w-trakcie-ladowania #tabliczkaLoaderHost {
    visibility: visible !important;
}


/* =========================================================
   NIE KURSUJE — POSZERZA CAŁĄ TABELĘ DNIA, JEŚLI TRZEBA
   ========================================================= */

.nie-kursuje-napis {
    white-space: nowrap !important;
    word-break: keep-all !important;
    overflow-wrap: normal !important;
    overflow: visible !important;
}


/* =========================================================
   PRZYSTANEK OBSŁUGIWANY W OBU KIERUNKACH
   ========================================================= */

.kierunki-dwa{
    display:grid;
    gap:1px;
    margin:1px 0 4px 0;
    padding:0;
    box-sizing:border-box;
}

.kierunki-dwa-wiersz{
    font-family:Calibri,"Segoe UI",Arial,sans-serif;
    font-size:17px;
    line-height:18px;
    font-weight:400;
    white-space:nowrap;
    transform:scaleY(1.08);
    transform-origin:left center;
}

.kierunki-dwa-strzalka{
    display:inline-block;
    margin-right:7px;
}

.tabliczka.trasa-3-kol{
    --lewa:42%;
    --prawa:58%;
}

.trasa-head.cols-3,
.trasa-columns.cols-3{
    grid-template-columns:repeat(3,minmax(0,1fr));
}

.trasa-head.cols-3 .trasa-head-label{
    padding-left:2px;
    padding-right:2px;
}

.trasa-columns.cols-3 .trasa-kol{
    padding-left:1px;
    padding-right:1px;
}

/* Przy trzech kolumnach celowo pozwalamy na częstsze zawijanie nazw. */
.tabliczka.trasa-3-kol .trasa-stop{
    grid-template-columns:18px 11px minmax(0,1fr) 11px;

    /* TAKA SAMA CZCIONKA jak w zwykłej liście przystanków. */
    font-size:13.5px;
}

/*
 * Nie zmieniamy fontu ani nie wymuszamy dwuliniowości.
 * ustawZawijanieNazwTrasy() zawinie tylko te nazwy,
 * które naprawdę nie mieszczą się w szerokości kolumny.
 */
.tabliczka.trasa-3-kol .trasa-nazwa{
    white-space:nowrap;
}

.trasa-drugi-kierunek-title{
    margin:8px 2px 7px;
    text-align:center;
    font-family:Calibri,"Segoe UI",Arial,sans-serif;
    font-size:13.5px;
    line-height:1;
    font-weight:400;
    letter-spacing:.75px;
    transform:scaleY(1.30);
    transform-origin:center;
}

.trasa-drugi-kierunek-title::before{
    content:"";
}

.trasa-kol.drugi-kierunek .trasa-stop.przed{
    color:#111;
}


/* =========================================================
   3 KOLUMNY — DWULINIOWE NAZWY TAK JAK W ZWYKŁEJ LIŚCIE
   ========================================================= */

.tabliczka.trasa-3-kol .trasa-nazwa.zawijaj{
    white-space:normal !important;
}

.tabliczka.trasa-3-kol .trasa-stop:has(.trasa-nazwa.zawijaj){
    min-height:33px;
}


/* =========================================================
   DWA KIERUNKI W NAGŁÓWKU — 5 PX WYŻEJ
   ========================================================= */

.kierunki-dwa{
    position:relative;
    top:-5px;
    margin-bottom:-5px;
}


/* =========================================================
   LEGENDA — RÓWNE ODSTĘPY PRZY OPISACH DWULINIOWYCH
   ========================================================= */

.legenda-wiersz{
    align-items:start !important;
    margin-top:2px !important;
    line-height:14px !important;
}

.legenda-litera,
.legenda-myslnik,
.legenda-opis{
    line-height:14px !important;
}

.legenda-opis{
    display:block;
    margin:0 !important;
    padding:0 !important;
}

.legenda-wiersz + .legenda-wiersz{
    margin-top:2px !important;
}


/* =========================================================
   AKTYWNY PRZYSTANEK – JEDNAKOWE TŁO
   =========================================================
   .trasa-extra-stop jest globalnie skalowany scaleY(1.08),
   a zwykły .trasa-stop nie. To powodowało inną wysokość
   czarnego tła aktywnego przystanku w trasie wydłużonej.

   Dla aktywnego extra-stop wyłączamy tylko skalowanie RODZICA.
   Sama nazwa nadal ma identyczne scaleY(1.30) i korzysta z tej
   samej klasy .trasa-nazwa-aktywna co zwykły przystanek.
   ========================================================= */

.trasa-extra-stop.wybrany {
    transform: none !important;
}

.trasa-extra-stop.wybrany .trasa-nazwa {
    transform: scaleY(1.30) !important;
    transform-origin: left center !important;
    line-height: 1 !important;
}

.trasa-extra-stop.wybrany .trasa-nazwa-aktywna {
    line-height: 1 !important;
    padding: 0 !important;
    margin: 0 !important;
}


/* =========================================================
   TYLKO WYGLĄD:
   aktywny pierwszy widoczny przystanek w układzie
   dwukierunkowym nie jest pogrubiony.
   Bez zmian w logice JS.
   ========================================================= */

.tabliczka.trasa-2-kol
.trasa-columns
.trasa-kol:first-child
.trasa-stop.wybrany.kraniec-poczatek
.trasa-nazwa,

.tabliczka.trasa-3-kol
.trasa-columns
.trasa-kol:first-child
.trasa-stop.wybrany.kraniec-poczatek
.trasa-nazwa,

.tabliczka.trasa-2-kol
.trasa-columns
.trasa-kol:first-child
.trasa-stop.wybrany.kraniec-poczatek
.trasa-nazwa-aktywna,

.tabliczka.trasa-3-kol
.trasa-columns
.trasa-kol:first-child
.trasa-stop.wybrany.kraniec-poczatek
.trasa-nazwa-aktywna {
    font-weight:400 !important;
}


/* =========================================================
   PIERWSZY AKTYWNY PRZYSTANEK – LINIA WYCHODZI Z KROPKI W DÓŁ
   =========================================================
   Tylko wygląd osi. Bez zmian w logice trasy.
   Jeżeli aktywny przystanek jest pierwszym widocznym punktem,
   kreska ma zaczynać się w środku kropki i iść do samego dołu
   wiersza, tak aby łączyła się z następnym przystankiem.
   ========================================================= */




/* =========================================================
   LINIA NAD AKTYWNYM PRZYSTANKIEM
   =========================================================
   Tylko jeśli aktywny pierwszy przystanek występuje w obu kierunkach.
   Zwykły przystanek początkowy NIE ma linii nad kropką.
   ========================================================= */

.trasa-stop.aktywny-poczatek-dwukierunkowy .trasa-os::before {
    top: 0 !important;
    bottom: 0 !important;
}


/* =========================================================
   V159 — aktywny pierwszy przystanek (np. SADYBA 01)
   Czarna kropka, czas 0 i oś również do góry.
   Nie dotyczy zwykłego nieaktywnego przystanku początkowego.
   ========================================================= */
.trasa-stop.aktywny-pierwszy .trasa-os::before {
    top: -8.25px !important;
    height: calc(100% + 8.25px) !important;
    background: #111 !important;
}
.trasa-stop.aktywny-pierwszy .trasa-os::after {
    background: #111 !important;
    border-color: #111 !important;
}
.trasa-stop.aktywny-pierwszy .trasa-czas {
    color: #111 !important;
}


/* =========================================================
   V160 — aktywny przystanek na granicy wariantu
   np. SADYBA 01 przy wydłużeniu do WILANOWA
   ========================================================= */
.trasa-stop.aktywny-granica-wariantu .trasa-os::before {
    top: 0 !important;
    bottom: 0 !important;
    height: auto !important;
    background:#111 !important;
}
.trasa-stop.aktywny-granica-wariantu .trasa-os::after {
    background:#111 !important;
    border-color:#111 !important;
}
.trasa-stop.aktywny-granica-wariantu .trasa-czas {
    color:#111 !important;
}


/* =========================================================
   v165 — wcześniejsze wystąpienie tej samej nazwy
   nie może wyglądać jak aktywny przystanek.
   Np. 170 / WIERNA 02: pierwsza WIERNA ma szarą kropkę
   i szarą linię, aktywna pozostaje tylko druga WIERNA.
   ========================================================= */

.trasa-stop.nieaktywny-duplikat {
    color: #777 !important;
}

.trasa-stop.nieaktywny-duplikat .trasa-nazwa,
.trasa-stop.nieaktywny-duplikat .trasa-czas,
.trasa-stop.nieaktywny-duplikat .trasa-nz {
    color: #777 !important;
}

.trasa-stop.nieaktywny-duplikat .trasa-os::before {
    background: #777 !important;
}

.trasa-stop.nieaktywny-duplikat .trasa-os::after {
    background: #777 !important;
    border-color: #777 !important;
}


/* =========================================================
   v166 — NIEAKTYWNY / PRZEJECHANY PRZYSTANEK
   Jeżeli przystanek jest nieaktywny, nie tylko nazwa,
   ale również jego kropka i linia osi mają być szare.
   Aktywny przystanek (.wybrany) pozostaje czarny.
   ========================================================= */

.trasa-stop.przed:not(.wybrany) .trasa-os::before {
    background: #777 !important;
}

.trasa-stop.przed:not(.wybrany) .trasa-os::after {
    background: #777 !important;
    border-color: #777 !important;
}

/* NŻ pozostaje pustą kropką, ale jej obwód jest szary. */
.trasa-stop.przed:not(.wybrany).nz .trasa-os::after {
    background: #fff !important;
    border-color: #777 !important;
}

/* Wcześniejsze, fałszywe wystąpienie tej samej nazwy
   również zawsze ma szarą oś i kropkę. */
.trasa-stop.nieaktywny-duplikat .trasa-os::before {
    background: #777 !important;
}

.trasa-stop.nieaktywny-duplikat .trasa-os::after {
    background: #777 !important;
    border-color: #777 !important;
}

.trasa-stop.nieaktywny-duplikat.nz .trasa-os::after {
    background: #fff !important;
    border-color: #777 !important;
}


/* =========================================================
   v167 — STAŁA WYSOKOŚĆ NAGŁÓWKA
   =========================================================
   Dwuliniowy kierunek nie może spychać tabeli rozkładu w dół.
   Dolna krawędź pola numeru linii i początek tabeli pozostają
   w tym samym miejscu jak przy jednym kierunku.
   ========================================================= */

.naglowek-tabliczki {
    height: 80px;
    min-height: 80px;
    align-items: start;
}

.naglowek-tabliczki:has(.kierunki-dwa) .dane-linii {
    padding-top: 2px;
}

.naglowek-tabliczki:has(.kierunki-dwa) .typ-linii {
    margin-bottom: 4px;
}

.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa {
    top: -7px;
    margin-bottom: -7px;
}

.naglowek-tabliczki:has(.kierunki-dwa) .wazny {
    position: relative;
    top: -4px;
}


/* =========================================================
   v167 — AUTOMATYCZNY TRYB DWÓCH TABLICZEK
   =========================================================
   Włącza się tylko wtedy, gdy kilka tabel dni nie mieści się
   w lewym panelu i zaczyna nachodzić na listę przystanków.

   Strona 1:
   - DZIEŃ POWSZEDNI
   - pełna lista przystanków / przebieg trasy

   Strona 2:
   - SOBOTA / NIEDZIELA / ŚWIĘTO (wszystkie dni pozostałe)
   - komunikat odsyłający do tabliczki DZIEŃ POWSZEDNI
   ========================================================= */

.tabliczka-scroll.tryb-dwoch-tabliczek {
    overflow-x: auto;
}

.tabliczka.strona-dzien-powszedni,
.tabliczka.strona-weekend {
    margin-left: auto;
    margin-right: auto;
}

.tabliczka.strona-weekend {
    margin-top: 18px;
    --lewa: 74%;
    --prawa: 26%;
}

.tabliczka.strona-weekend.trasa-2-kol,
.tabliczka.strona-weekend.trasa-3-kol {
    --lewa: 74%;
    --prawa: 26%;
}

.tabliczka.strona-weekend .panel-prawy {
    position: relative;
}

.tabliczka.strona-weekend .trasa-przeniesiona-info {
    height: 100%;
    box-sizing: border-box;
    padding: 17px 13px 12px 13px;

    display: flex;
    align-items: flex-start;
    justify-content: flex-start;

    font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
    font-size: 14px;
    line-height: 1.15;
    font-weight: 700;
    text-align: left;
}

.tabliczka.strona-weekend .rozklady-grid {
    max-width: 100%;
}

.tabliczka.strona-weekend .rozklady-grid .dzien + .dzien {
    margin-left: 3px;
}

/* Na drugiej tabliczce SOBOTA i ŚWIĘTO/NIEDZIELA mogą wykorzystać
   cały dostępny lewy panel, ale zachowują naturalne szerokości. */
.tabliczka.strona-weekend .rozklady-wrap {
    width: calc(100% - 36px);
}

@media print {
    .tabliczka.strona-weekend {
        break-before: page;
        page-break-before: always;
    }
}


/* =========================================================
   v168 — ETAP 1: TRYB KOMPAKTOWY
   Najpierw próbujemy zmieścić całość na JEDNEJ tabliczce.
   Dopiero jeśli to nadal nie wystarczy, uruchamiane są dwie strony.
   ========================================================= */

.tabliczka.tryb-kompaktowy.trasa-2-kol {
    --lewa: 60%;
    --prawa: 40%;
}

.tabliczka.tryb-kompaktowy.trasa-3-kol {
    --lewa: 55%;
    --prawa: 45%;
}

.tabliczka.tryb-kompaktowy .rozklady-wrap {
    width: calc(100% - 34px);
}

.tabliczka.tryb-kompaktowy .rozklady-grid {
    width: 100%;
    max-width: 100%;
    grid-auto-columns: auto;
}

.tabliczka.tryb-kompaktowy .dzien {
    min-width: 0 !important;
    max-width: none;
}

/*
   Godzina może mieć 2 wiersze minut.
   Sama kolumna godzin rozciąga się wtedy na pełną wysokość wiersza.
*/
.tabliczka.tryb-kompaktowy .godzina-row {
    height: auto;
    min-height: 16px;
    align-items: stretch;
}

.tabliczka.tryb-kompaktowy .godzina-cell {
    height: auto;
    min-height: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    line-height: 16px;
}

.tabliczka.tryb-kompaktowy .minuty-cell {
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    align-items: center;

    height: auto;
    min-height: 16px;

    white-space: normal;
    overflow: visible;
}

.tabliczka.tryb-kompaktowy .minuta {
    flex: 0 0 24px;
    width: 24px;
    min-width: 24px;
}

/*
   Przy węższej liście przystankowej pozwalamy częściej
   zawijać długie nazwy na 2 wiersze zamiast zabierać szerokość.
*/
.tabliczka.tryb-kompaktowy .trasa-stop {
    min-height: 16.5px;
}

/* Druga strona ma powstać dopiero PO nieudanej próbie kompaktowej. */
.tabliczka.strona-weekend {
    --lewa: 74%;
    --prawa: 26%;
}


/* =========================================================
   v169 — NAGŁÓWEK Z DWOMA KIERUNKAMI
   ========================================================= */
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa {
    top: -12px !important;
    margin-bottom: -12px !important;
}

.naglowek-tabliczki:has(.kierunki-dwa) .wazny {
    position: relative;
    top: -9px !important;
}

/* =========================================================
   v169 — DWULINIOWE PRZYSTANKI
   Zachowujemy starą poprawną wysokość.
   ========================================================= */
.tabliczka.tryb-kompaktowy .trasa-nazwa {
    white-space: nowrap;
}

.tabliczka.tryb-kompaktowy .trasa-nazwa.zawijaj {
    white-space: normal !important;
}

.tabliczka.tryb-kompaktowy .trasa-stop:has(.trasa-nazwa.zawijaj) {
    min-height: 33px !important;
}

/* =========================================================
   v169 — DZIEŃ POWSZEDNI W TRYBIE KOMPAKTOWYM
   Wymuszamy węższą tabelę, aby przy godzinach z dużą liczbą kursów
   minuty przechodziły do drugiego wiersza.
   ========================================================= */
.tabliczka.tryb-kompaktowy .dzien.dzien-powszedni-kompakt {
    width: 246px !important;
    min-width: 246px !important;
    max-width: 246px !important;
}

.tabliczka.tryb-kompaktowy .dzien.dzien-powszedni-kompakt .godzina-row {
    height: auto !important;
    min-height: 16px !important;
    align-items: stretch !important;
}

.tabliczka.tryb-kompaktowy .dzien.dzien-powszedni-kompakt .godzina-cell {
    height: auto !important;
    min-height: 16px !important;
    display: flex !important;
    align-items: flex-start !important;
    justify-content: flex-end !important;
}

.tabliczka.tryb-kompaktowy .dzien.dzien-powszedni-kompakt .minuty-cell {
    display: flex !important;
    flex-wrap: wrap !important;
    align-content: flex-start !important;
    align-items: center !important;
    height: auto !important;
    min-height: 16px !important;
    overflow: visible !important;
    white-space: normal !important;
}

.tabliczka.tryb-kompaktowy .dzien.dzien-powszedni-kompakt .minuta {
    flex: 0 0 24px !important;
    width: 24px !important;
    min-width: 24px !important;
}


/* =========================================================
   v170 — WIĘCEJ MIEJSCA NA LISTĘ PRZYSTANKÓW
   ========================================================= */

.tabliczka.tryb-kompaktowy.trasa-2-kol {
    --lewa: 57%;
    --prawa: 43%;
}

.tabliczka.tryb-kompaktowy.trasa-3-kol {
    --lewa: 53%;
    --prawa: 47%;
}

/* Jednoliniowy przystanek zostaje jednoliniowy.
   Tylko .zawijaj może dostać 2 linie. */
.tabliczka.tryb-kompaktowy .trasa-nazwa:not(.zawijaj) {
    white-space: nowrap !important;
    overflow-wrap: normal !important;
    word-break: normal !important;
}

.tabliczka.tryb-kompaktowy .trasa-stop:not(:has(.trasa-nazwa.zawijaj)) {
    min-height: 16.5px !important;
}


/* =========================================================
   v170 — RÓWNE WYSOKOŚCI GODZIN WE WSZYSTKICH DNIACH
   =========================================================
   Jeżeli dana godzina w którymkolwiek dniu ma minuty w 2 wierszach,
   ta sama godzina we wszystkich pozostałych tabelach ma dostać
   taką samą wysokość.
   ========================================================= */

.tabliczka.tryb-kompaktowy .godzina-row.wiersz-dwuliniowy {
    min-height: 32px !important;
    height: 32px !important;
}

.tabliczka.tryb-kompaktowy .godzina-row.wiersz-dwuliniowy .godzina-cell {
    min-height: 32px !important;
    height: 32px !important;
}

.tabliczka.tryb-kompaktowy .godzina-row.wiersz-dwuliniowy .minuty-cell {
    min-height: 32px !important;
    height: 32px !important;
}


/* =========================================================
   WERSJA 175 — DWULINIOWE NAZWY PRZYSTANKÓW
   ========================================================= */

.trasa-nazwa.zawijaj {
    line-height: 0.9 !important;
}

.trasa-extra-stop .trasa-nazwa.zawijaj {
    line-height: 0.9 !important;
}


/* =========================================================
   WERSJA 176 — JEDNOWYRAZOWE NAZWY ZAWSZE W JEDNEJ LINII
   ========================================================= */

.trasa-nazwa.nazwa-jednowyrazowa,
.trasa-nazwa.nazwa-jednowyrazowa.zawijaj {
    white-space: nowrap !important;
    word-break: keep-all !important;
    overflow-wrap: normal !important;
    hyphens: none !important;

    width: max-content !important;
    min-width: max-content !important;
    max-width: none !important;
}

/* Jednowyrazowy przystanek nie może dostać wysokości 2 wierszy. */
.trasa-stop:has(.trasa-nazwa.nazwa-jednowyrazowa) {
    min-height: 16.5px !important;
}


/* =========================================================
   WERSJA 177 — JEDNOWYRAZOWE BEZ MYŚLNIKA
   ========================================================= */

/*
   Jedno słowo bez myślnika, np. NOWOURSYNOWSKA,
   musi zawsze zostać w jednej linii.
*/
.trasa-nazwa.nazwa-jednowyrazowa {
    white-space: nowrap !important;
    word-break: keep-all !important;
    overflow-wrap: normal !important;
    hyphens: none !important;
}

/*
   Nazwy z myślnikami nie są objęte tą blokadą
   i mogą przechodzić do 2 wierszy.
*/


/* =========================================================
   WERSJA 180 — PIERWSZY WIDOCZNY PRZYSTANEK PASAŻERSKI
   NIE MA KRESKI DO GÓRY
   ========================================================= */

.trasa-stop.pierwszy-pasazerski .trasa-os::before {
    top: 50% !important;
    bottom: 0 !important;
    height: auto !important;
}

/*
   Jeśli wcześniejsza logika rysuje oś innym pseudo-elementem,
   górna część jest dodatkowo maskowana białym tłem.
*/
.trasa-stop.pierwszy-pasazerski .trasa-os {
    overflow: hidden !important;
}


/* =========================================================
   WERSJA 181 — AUTOMATYCZNIE 9 LUB 8 KURSÓW NA GODZINĘ
   ========================================================= */

/*
   Tryb awaryjny włącza JS dopiero wtedy, gdy wariant z 9 kursami
   nie mieści całej tabliczki na jednej stronie.

   Nie zwężamy samych pól minut. Zachowują swoją normalną szerokość.
   Ograniczamy jedynie szerokość obszaru minut tak, żeby w jednym
   rzędzie mogło znaleźć się maksymalnie 8 pozycji.
*/
.tabliczka.max-8-kursow .minuty-cell {
    flex-wrap: wrap !important;
}

/*
   Wartość szerokości jest ustawiana przez JS na podstawie
   faktycznej szerokości pojedynczej .minuta i odstępów.
*/
.tabliczka.max-8-kursow .minuty-cell.limit-8-kursow {
    width: var(--szerokosc-8-kursow) !important;
    max-width: var(--szerokosc-8-kursow) !important;
}


/* =========================================================
   WERSJA 182 — TECH NIGDY NIE JEST WIDOCZNY NA TABLICZCE
   ========================================================= */

.trasa-stop[data-typ="TECH"],
.trasa-stop[data-typ="tech"],
.trasa-extra-stop[data-typ="TECH"],
.trasa-extra-stop[data-typ="tech"] {
    display: none !important;
}


/* =========================================================

       dokładnie nazwę stojącą bezpośrednio przed nawiasem. */
    const m458 = wartosc458.match(/\s*\(([^()]+)\)\s*$/);
    if(m458){

        const bez458 = wartosc458.slice(0, m458.index).trimEnd();

        const norm458 = s => String(s || "")
            .toLocaleUpperCase("pl-PL")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/\s+/g, " ")

        if(r458 && String(r458.miejscowosc || "").trim()){
            return String(r458.nazwa || wartosc458).trim();
        }
    }

    return wartosc458;
};

function rozdzielNazweIMiejscowosc(nazwa){
const tekst = String(nazwa || "").trim();

    /* WERSJA 477 — JSON jest źródłem prawdy dla nazwy i miejscowości. */
    try{
        const rozklady = Array.isArray(daneLinii?.rozkłady) ? daneLinii.rozkłady : [];
        for(const rozklad of rozklady){
            for(const kierunek of (Array.isArray(rozklad?.kierunki) ? rozklad.kierunki : [])){
                for(const p of (Array.isArray(kierunek?.przystanki) ? kierunek.przystanki : [])){
                    if(normalizuj(String(p?.nazwa || "")) === normalizuj(tekst)){
                        if(Object.prototype.hasOwnProperty.call(p,"nazwa_czysta") ||
                           Object.prototype.hasOwnProperty.call(p,"miejscowosc")){
                            return {
                                nazwa: String(p?.nazwa_czysta || p?.nazwa || tekst).trim(),
                                miejscowosc: String(p?.miejscowosc || "").trim()
                            };
                        }
                    }
                }
            }
        }
    }catch(e){
        console.warn("FWTP v477: nie udało się odczytać miejscowości z JSON",e);
    }

    /* Zgodność ze starszymi JSON-ami. */
    const dopasowanie = tekst.match(/^(.*?)\s*\(([^()]*)\)\s*$/);
    if(!dopasowanie) return {nazwa:tekst,miejscowosc:""};
    const nazwaBezNawiasu=String(dopasowanie[1]||"").trim();
    const tekstWNawiasie=String(dopasowanie[2]||"").trim();
    const jestMiejscowoscia=MIEJSCOWOSCI.some(m=>normalizuj(m)===normalizuj(tekstWNawiasie));
    return jestMiejscowoscia
        ? {nazwa:nazwaBezNawiasu,miejscowosc:tekstWNawiasie}
        : {nazwa:tekst,miejscowosc:""};
}



/* =========================================================
   CACHE OBLICZEŃ TABLICZKI
   =========================================================
   Wiele funkcji analizuje te same kursy, warianty i przystanki
   po kilkadziesiąt / kilkaset razy podczas jednego renderowania.

   Wynik zależy od:
   - linii,
   - daty,
   - kierunku,
   - wybranego przystanku.

   Cache jest czyszczony przed każdym renderuj(), więc logika
   pozostaje dokładnie taka sama jak wcześniej.
   ========================================================= */

const cacheObliczenTabliczki=
    new Map();

function kluczStanuCache(){

    return[
        String(
            aktualnaLinia||""
        ),
        (
            wybranaData instanceof Date
                ? dataISO(
                    wybranaData
                )
                : ""
        ),
        String(
            aktualnyKierunek
        ),
        String(
            aktualnyPrzystanek
        )
    ].join("|");
}


const cacheObliczenWToku=
    new Set();

function memoTabliczki(
    nazwa,
    klucz,
    producent
){

    const pelnyKlucz=
        kluczStanuCache()+
        "||"+
        nazwa+
        "||"+
        String(
            klucz||""
        );

    if(
        cacheObliczenTabliczki.has(
            pelnyKlucz
        )
    ){
        return cacheObliczenTabliczki.get(
            pelnyKlucz
        );
    }

    /*
       Zabezpieczenie przed przypadkową rekurencją cykliczną.
       Nie pozwalamy drugi raz rozpocząć obliczania dokładnie
       tego samego wyniku, zanim pierwsze obliczenie się skończy.
    */
    if(
        cacheObliczenWToku.has(
            pelnyKlucz
        )
    ){
        console.error(
            "[FWTP] Wykryto cykliczne obliczenie:",
            nazwa,
            klucz
        );

        return null;
    }

    cacheObliczenWToku.add(
        pelnyKlucz
    );

    try{

        const wynik=
            producent();

        cacheObliczenTabliczki.set(
            pelnyKlucz,
            wynik
        );

        return wynik;

    }finally{

        cacheObliczenWToku.delete(
            pelnyKlucz
        );
    }
}


function wyczyscCacheTabliczki(){

    cacheObliczenTabliczki.clear();
    cacheObliczenWToku.clear();

    if(
        typeof cacheNormalizacjiTekstu!=="undefined"&&
        cacheNormalizacjiTekstu.size>3000
    ){
        cacheNormalizacjiTekstu.clear();
    }
}

function ustawLoaderTabliczki(
    procent,
    etap
){

    const p=
        Math.max(
            0,
            Math.min(
                100,
                Math.round(
                    Number(procent)||0
                )
            )
        );

    const pasek=
        document.getElementById(
            "tabliczkaLoaderProgress"
        );

    const autobus=
        document.getElementById(
            "tabliczkaLoaderBus"
        );

    const liczba=
        document.getElementById(
            "tabliczkaLoaderPercent"
        );

    const opis=
        document.getElementById(
            "tabliczkaLoaderStage"
        );

    if(pasek){

        pasek.style.width=
            p+"%";

        pasek.classList.toggle(
            "gotowe",
            p>=100
        );
    }

    if(autobus){

        autobus.style.left=
            p+"%";

        autobus.classList.toggle(
            "gotowe",
            p>=100
        );
    }

    if(liczba){
        liczba.textContent=
            p+"%";
    }

    if(
        opis&&
        etap
    ){
        opis.textContent=
            etap;
    }
}


function czekajNaRenderTabliczki(){

    return new Promise(
        resolve=>{

            requestAnimationFrame(
                ()=>{
                    requestAnimationFrame(
                        resolve
                    );
                }
            );
        }
    );
}


async function czekajNaPelneRenderowanieTabliczki(){

    /*
       Najpierw czekamy na fonty.
       Dzięki temu szerokości napisów i kolumn są już ostateczne.
    */
    try{

        if(
            document.fonts&&
            document.fonts.ready
        ){
            await document.fonts.ready;
        }
    }
    catch{}

    /*
       renderuj() wykonuje własne requestAnimationFrame:
       1. wyrównanie tabel SOBOTA / ŚWIĘTO,
       2. dopasowanie kolumn trasy.

       Czekamy więc jeszcze kilka pełnych klatek,
       aby loader zniknął dopiero po rzeczywistym
       zakończeniu układania tabliczki.
    */
    await czekajNaRenderTabliczki();
    await czekajNaRenderTabliczki();
    await czekajNaRenderTabliczki();
}


async function zakonczLoaderTabliczki(){

    ustawLoaderTabliczki(

}

async function przerysujTabliczkeZLoaderem(
    etapPoczatkowy,
    przygotuj=null
){

    /*
       Ten sam loader działa teraz także przy:
       - zmianie kierunku,
       - zmianie przystanku.

       Tabliczka pozostaje niewidoczna od początku zmiany
       aż do zakończenia pełnego renderowania.
    */
    pokazLoaderTabliczki();

    ustawLoaderTabliczki(
        10,
        etapPoczatkowy||
        "Przygotowywanie tabliczki..."
    );

    await czekajNaRenderTabliczki();

    try{

        if(
            typeof przygotuj===
            "function"
        ){
            przygotuj();
        }

        ustawLoaderTabliczki(
            42,
            "Przygotowywanie rozkładu..."
        );

        await czekajNaRenderTabliczki();

        ustawLoaderTabliczki(
            68,
            "Budowanie rozkładu i trasy..."
        );

        renderuj();

        await czekajNaRenderTabliczki();

        ustawLoaderTabliczki(
            90,
            "Dopasowywanie układu tabliczki..."
        );

        /*
           Czekamy dokładnie tak samo jak przy zmianie linii:
           - na fonty,
           - na wyrównanie tabel dni,
           - na obliczenie szerokości "NIE KURSUJE",
           - na podział listy przystanków na kolumny,
           - na końcowy układ całej tabliczki.
        */
        await czekajNaPelneRenderowanieTabliczki();

        await zakonczLoaderTabliczki();
    }
    catch(error){

        console.error(error);

        ukryjLoaderTabliczki();

        pokazBlad(
            error?.message||
            "Nie udało się przygotować tabliczki."
        );
    }
}

/* =========================================================
   DATA / URL
   ========================================================= */

function dataZTekstu(tekst){

    const m=
        /^(\d{4})-(\d{2})-(\d{2})$/
            .exec(
                String(
                    tekst||""
                )
            );

    if(!m)return null;

    const d=
        new Date(
            Number(m[1]),
            Number(m[2])-1,
            Number(m[3])
        );

    return Number.isNaN(
        d.getTime()
    )
        ? null
        : d;
}


function dataISO(data){

    return[
        data.getFullYear(),
        String(
            data.getMonth()+1
        ).padStart(2,"0"),
        String(
            data.getDate()
        ).padStart(2,"0")
    ].join("-");
}


function pobierzIndeksPrzystanku(){

    const tekst=
        String(
            parametry.get("przystanek")||""
        );

    if(
        tekst.startsWith("idx:")
    ){
        const n=
            Number(
                tekst.slice(4)
            );

        return Number.isInteger(n)
            ? n
            : 0;
    }

    const n=
        Number(tekst);

    return Number.isInteger(n)
        ? n
        : 0;
}


function zapiszURL(){

    const url=
        new URL(
            window.location.href
        );

    url.searchParams.set(

function v590FormatujDateZakresu(iso){
    const m=String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!m)return String(iso||"");
    return m[3]+"."+m[2]+"."+m[1];
}

function v590NapisZakresuPaczek(){
    /*
       V594:
       napis pod rozkładem pokazujemy wyłącznie dla rozkładu
       czasowo zmienionego i tylko wtedy, gdy:
       1) użyta paczka ma zakres OD-DO, albo
       2) nazwa użytej paczki zawiera słowo "specjalny".
    */
    if(daneLinii?.trasa_czasowo_zmieniona!==true){
        return "";
    }

    const czesci=String(zakresPaczekDanych||"").split("|");
    const maZakres=
        czesci.length===2 &&
        !!czesci[0] &&
        !!czesci[1];

    if(!maZakres && !paczkaSpecjalnaDanych){
        return "";
    }

    /*
       Paczka "specjalny" bez pełnego zakresu OD-DO spełnia warunek
       wyświetlania, ale nie wymyślamy daty, której w nazwie nie ma.
    */
    if(!maZakres){
        return "ROZKŁAD JAZDY SPECJALNY";
    }

    const od=v590FormatujDateZakresu(czesci[0]);
    const doDaty=v590FormatujDateZakresu(czesci[1]);

    if(!od || !doDaty){
        return "";
    }

    if(czesci[0]===czesci[1]){
        return "ROZKŁAD JAZDY OBOWIĄZUJE W DNIU: "+od;
    }

    const a=czesci[0].match(/^(\d{4})-(\d{2})-(\d{2})$/);
    const b=czesci[1].match(/^(\d{4})-(\d{2})-(\d{2})$/);

    if(a && b){
        /* Ten sam miesiąc i rok: 19-20.09.2026 */
        if(a[1]===b[1] && a[2]===b[2]){
            return "ROZKŁAD JAZDY OBOWIĄZUJE W DNIACH: "+
                a[3]+"-"+b[3]+"."+a[2]+"."+a[1];
        }

        /* Ten sam rok, różne miesiące: 30.09-02.10.2026 */
        if(a[1]===b[1]){
            return "ROZKŁAD JAZDY OBOWIĄZUJE W DNIACH: "+
                a[3]+"."+a[2]+"-"+b[3]+"."+b[2]+"."+a[1];
        }
    }

    /* Różne lata — pełny zapis obu dat. */
    return "ROZKŁAD JAZDY OBOWIĄZUJE W DNIACH: "+od+"-"+doDaty;
}


function paczkaObowiazuje(
    paczka,
    linia,
    data
){

    const linie=
        Array.isArray(
            paczka?.linie
        )
            ? paczka.linie.map(String)
            : [];

    if(
        !linie.includes(
            String(linia)
        )
    ){
        return false;
    }

    const iso=
        dataISO(data);

    const od=
        String(
            paczka.od||""
        );

    const doDaty=
        String(
            paczka.do||""
        );

    return(
        (!od||iso>=od)&&
        (!doDaty||iso<=doDaty)
    );
}


async function pobierzLinie(
    linia,
    data
){

    const paczki=
        await pobierzManifestPaczek();

    const pasujace=
        paczki
            .filter(
                p=>
                    paczkaObowiazuje(
                        p,
                        linia,
                        data
                    )
            )
            .sort(
                (a,b)=>
                    Number(
                        b.priorytet||0
                    )-
                    Number(
                        a.priorytet||0
                    )
            );

    const zrodla=[];

    pasujace.forEach(
        p=>{

            const folder=
                String(
                    p.folder||""
                )
                    .replace(/^\/+/,"")
                    .replace(/\/+$/,"");

            if(folder){
                zrodla.push({
                    url:
                        BASE_DANE+
                        folder+
                        "/"+
                        encodeURIComponent(linia)+
                        ".json",
                    od:
                        String(
                            p.od||""
                        ),
                    folder:
                        folder
                });
            }
        }
    );

    zrodla.push({
        url:
            BASE_DANE+
            encodeURIComponent(linia)+
            ".json",
        od:"",
        folder:""
    });

    for(const zrodlo of zrodla){

        try{

            const r=
                await fetch(
                    zrodlo.url+
                    "?ts="+
                    Date.now(),
                    {
                        cache:"no-store"
                    }
                );

            if(!r.ok)continue;

            const json=
                await r.json();

            waznyOdDanych=
                String(
                    json?.od||
                    json?.waznyOd||
                    json?.dataOd||
                    json?.obowiazujeOd||
                    zrodlo.od||
                    ""
                );

            /*
               FWTP V590:
               napis o okresie obowiązywania pokazujemy WYŁĄCZNIE wtedy,
               gdy faktycznie użyta paczka ma w nazwie pełny zakres:
               RRRR-MM-DD_do_RRRR-MM-DD.
               Sama data początkowa nie wystarcza.
            */
            zakresPaczekDanych="";
            paczkaSpecjalnaDanych=false;

            const folderPaczekV590=
                String(zrodlo.folder||"");

            const nazwaPaczekV590=
                folderPaczekV590
                    .split("/")
                    .filter(Boolean)
                    .pop()||"";

            /*
               V594:
               "specjalny" może wystąpić w nazwie paczki niezależnie od
               wielkości liter, np.:
               specjalny
               2026-09-19_specjalny
               specjalny_2026-09-19_do_2026-09-20
            */
            paczkaSpecjalnaDanych=
                /specjalny/i.test(nazwaPaczekV590);

            const dopasowaniePaczekV590=
                nazwaPaczekV590.match(
                    /(\d{4}-\d{2}-\d{2})_do_(\d{4}-\d{2}-\d{2})/
                );

            if(dopasowaniePaczekV590){
                zakresPaczekDanych=
                    dopasowaniePaczekV590[1]+
                    "|"+
                    dopasowaniePaczekV590[2];
            }

            /* FWTP V657: automatyczne rozpoznawanie formatu pliku.
               Stary JSON przechodzi bez zmian; RAW przelicza wbudowany JS.
               Nie wymaga raw_test ani dodatkowych plikow skryptow. */
            if (json && json.format === "FWTP-RAW-1") {
                if (!window.FWTPRaw || typeof window.FWTPRaw.convert !== "function") {
                    throw new Error("Brak wbudowanego silnika FWTP RAW.");
                }
                return window.FWTPRaw.convert(json);
            }
            return json;
        }
        catch{
            /* następny */
        }
    }

    throw new Error(
        "Nie znaleziono danych linii "+
        linia+
        "."
    );
}
