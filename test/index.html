/* =========================================================
   FWTP — WERSJA 486
   CAŁKOWICIE NOWY SILNIK LISTY PRZYSTANKÓW
   =========================================================
   Stara logika listy (126 / 401 / 150 / wydłużenia / gałęzie /
   stanTrasyNaPrzystanku / daneTrasWydluzonych itd.) NIE JEST
   UŻYWANA przez renderer V486.

   Jedynym źródłem fizycznego przebiegu jest:
       kurs.trasa = [ID, ID, ID...]

   Metadane:
       p.id
       p.nazwa_czysta
       p.miejscowosc
       p.strefa
       p.typ
   ========================================================= */

function v486Text(v){
    return String(v == null ? "" : v)
        .replace(/\s+/g," ")
        .trim();
}

function v486Array(v){
    return Array.isArray(v) ? v : [];
}

function v486StopId(p){
    return v486Text(p?.id);
}

function v486StopName(p){
    return v486Text(p?.nazwa_czysta) || v486Text(p?.nazwa);
}

function v486StopNumber(p){
    return v486Text(p?.nr);
}

function v486StopType(p){
    return v486Text(p?.typ).toLocaleUpperCase("pl-PL");
}

function v486StopTown(p){
    return v486Text(p?.miejscowosc);
}

function v486StopZone(p){
    return v486Text(p?.strefa);
}


function v486DirectionName(){
    /*
       V581

       Kierunek nagłówka wyznaczamy WYŁĄCZNIE z kursów,
       które rzeczywiście obsługują aktualnie wybrany przystanek.

       Zasada:
       1. zbierz kursy dostępne na wybranym przystanku,
       2. odrzuć kursy skrócone jako źródło głównego kierunku,
       3. ustal podstawowy kraniec z najczęściej występującego
          końca pełnych tras,
       4. jeżeli istnieje rzeczywiste wydłużenie podstawowej trasy,
          pokaż: PODSTAWOWY KRANIEC / KRANIEC WYDŁUŻENIA,
       5. nigdy nie bierz kierunku z kursu, który nie przejeżdża
          przez aktualnie wybrany przystanek.
    */

    const k = v486CurrentDirection();

    /*
       Jeżeli JSON ma jawnie wpisany kierunek, nie używamy go
       automatycznie, ponieważ dla konkretnego przystanku może
       istnieć inny dostępny zestaw kursów (np. linia 150).
    */

    const wybranyPrzystanek =
        v486BaseStops()[
            Number(aktualnyPrzystanek)
        ] || null;

    const wybranyId =
        v486StopId(wybranyPrzystanek);

    const wybranaNazwa =
        v486StopName(wybranyPrzystanek);

    const wybranyNr =
        v486StopNumber(wybranyPrzystanek);

    function tenSamWybranyPrzystanek(p){
        if(!p){
            return false;
        }

        const id = v486StopId(p);

        if(
            wybranyId &&
            id &&
            id === wybranyId
        ){
            return true;
        }

        return (
            wybranaNazwa &&
            v486StopName(p) === wybranaNazwa &&
            v486StopNumber(p) === wybranyNr
        );
    }

    function znajdzStopPoId(id){
        id = v486Text(id);

        if(!id){
            return null;
        }

        for(const rozklad of v486Array(daneLinii?.rozkłady)){
            const kier = v486Array(rozklad?.kierunki)[
                Number(aktualnyKierunek)
            ];

            for(const p of v486Array(kier?.przystanki)){
                if(v486StopId(p) === id){
                    return p;
                }
            }
        }

        return null;
    }

    function koniecPasazerskiKursu(kurs){
        const trasa = v486Array(kurs?.trasa);

        if(!trasa.length){
            return null;
        }

        /*
           Jeżeli exporter podał koniec_trasy, jest to źródło
           nadrzędne. W przeciwnym razie idziemy od końca kurs.trasa
           i pomijamy TECH.
        */
        const jawnyKoniec =
            v486Text(kurs?.koniec_trasy);

        if(jawnyKoniec){
            const p = znajdzStopPoId(jawnyKoniec);

            if(
                p &&
                v486StopType(p) !== "TECH"
            ){
                return p;
            }
        }

        for(let i=trasa.length-1; i>=0; i--){
            const p = znajdzStopPoId(trasa[i]);

            if(
                p &&
                v486StopType(p) !== "TECH"
            ){
                return p;
            }
        }

        return null;
    }

    function kursObslugujeWybrany(kurs){
        const trasa = v486Array(kurs?.trasa);

        if(!trasa.length){
            return false;
        }

        if(wybranyId && trasa.includes(wybranyId)){
            return true;
        }

        /*
           Fallback dla różnych LP tego samego fizycznego
           przystanku w innych typach dnia.
        */
        for(const id of trasa){
            const p = znajdzStopPoId(id);

            if(tenSamWybranyPrzystanek(p)){
                return true;
            }
        }

        return false;
    }

    const kursy = [];
    const widziane = new Set();

    /*
       Zbieramy kursy ze wszystkich typów dnia, ale tylko te,
       które naprawdę przechodzą przez aktualny przystanek.
    */
    v486Array(daneLinii?.rozkłady).forEach((rozklad, rIdx)=>{
        const kier = v486Array(rozklad?.kierunki)[
            Number(aktualnyKierunek)
        ];

        v486Array(kier?.przystanki).forEach((p, pIdx)=>{
            if(!tenSamWybranyPrzystanek(p)){
                return;
            }

            v486Array(p?.kursy).forEach((kurs, kIdx)=>{
                if(!kursObslugujeWybrany(kurs)){
                    return;
                }

                const trasa = v486Array(kurs?.trasa);
                const klucz =
                    rIdx + "|" +
                    v486Text(kurs?.numer) + "|" +
                    v486Text(kurs?.czas) + "|" +
                    trasa.join(">");

                if(widziane.has(klucz)){
                    return;
                }

                widziane.add(klucz);

                const koniec = koniecPasazerskiKursu(kurs);

                if(!koniec){
                    return;
                }

                kursy.push({
                    kurs,
                    trasa,
                    koniec,
                    koniecId: v486StopId(koniec),
                    koniecNazwa: v486StopName(koniec),
                    opis:
                        v486Text(kurs?.opis) ||
                        v486Text(kurs?.uwagi) ||
                        ""
                });
            });
        });
    });

    if(kursy.length){
        /*
           Najpierw szukamy podstawowego końca.
           Kurs skrócony nie może zmienić głównego kierunku.
        */
        const pelne = kursy.filter(x=>{
            const opis = (
                x.opis + " " +
                v486Text(x.kurs?.wariant_opis) + " " +
                v486Text(x.kurs?.opis_wariantu)
            ).toLowerCase();

            return !opis.includes("skrócon");
        });

        const baza = pelne.length ? pelne : kursy;

        const stat = new Map();

        baza.forEach(x=>{
            const key =
                v486Text(x.koniecNazwa).toUpperCase();

            if(!key){
                return;
            }

            if(!stat.has(key)){
                stat.set(key,{
                    nazwa: x.koniecNazwa,
                    count: 0,
                    maxLen: 0,
                    sample: x
                });
            }

            const a = stat.get(key);
            a.count++;
            a.maxLen = Math.max(
                a.maxLen,
                x.trasa.length
            );
        });

        let podstawowy = null;

        for(const a of stat.values()){
            if(
                !podstawowy ||
                a.count > podstawowy.count ||
                (
                    a.count === podstawowy.count &&
                    a.maxLen < podstawowy.maxLen
                )
            ){
                podstawowy = a;
            }
        }

        if(podstawowy){
            /*
               Szukamy rzeczywistego wydłużenia:
               trasa wydłużona musi zawierać podstawowy kraniec
               i mieć po nim jeszcze pasażerski koniec.
            */
            const rozszerzenia = new Map();

            for(const x of baza){
                if(
                    v486Text(x.koniecNazwa).toUpperCase() ===
                    v486Text(podstawowy.nazwa).toUpperCase()
                ){
                    continue;
                }

                let idxPodstawowego = -1;

                for(let i=0; i<x.trasa.length; i++){
                    const p = znajdzStopPoId(x.trasa[i]);

                    if(
                        p &&
                        v486StopName(p).toUpperCase() ===
                        v486Text(podstawowy.nazwa).toUpperCase()
                    ){
                        idxPodstawowego = i;
                        break;
                    }
                }

                if(
                    idxPodstawowego >= 0 &&
                    idxPodstawowego < x.trasa.length - 1
                ){
                    const key =
                        v486Text(x.koniecNazwa).toUpperCase();

                    if(!rozszerzenia.has(key)){
                        rozszerzenia.set(key,{
                            nazwa: x.koniecNazwa,
                            count: 0,
                            maxLen: 0
                        });
                    }

                    const a = rozszerzenia.get(key);
                    a.count++;
                    a.maxLen = Math.max(
                        a.maxLen,
                        x.trasa.length
                    );
                }
            }

            let wydluzony = null;

            for(const a of rozszerzenia.values()){
                if(
                    !wydluzony ||
                    a.count > wydluzony.count ||
                    (
                        a.count === wydluzony.count &&
                        a.maxLen > wydluzony.maxLen
                    )
                ){
                    wydluzony = a;
                }
            }

            if(wydluzony){
                return (
                    podstawowy.nazwa +
                    " / " +
                    wydluzony.nazwa
                );
            }

            /* FWTP V621: jawne wydłużenia w JSON (np. 142: S).
               Starszy mechanizm rozpoznaje tylko wydłużenia biegnące
               przez kraniec bazowy; Skalnicowa jest inną odnogą.
               Czytamy więc warianty i końce z JSON-u, bez zgadywania. */
            const jawneWydluzenia = [];
            for(const rozklad of v486Array(daneLinii?.rozkłady)){
                const kierunek = v486Array(rozklad?.kierunki)[Number(aktualnyKierunek)];
                const opisy = new Map(
                    v486Array(kierunek?.warianty).map(w => [
                        v486Text(w?.litera).toUpperCase(),
                        v486Text(w?.opis).toLowerCase()
                    ])
                );
                for(const przystanek of v486Array(kierunek?.przystanki)){
                    if(!tenSamWybranyPrzystanek(przystanek)) continue;
                    for(const trasa of v486Array(przystanek?.lista_przystankowa?.trasy)){
                        const litera = v486Text(trasa?.wariant).toUpperCase();
                        if(!opisy.get(litera)?.includes("wydłużon")) continue;
                        const ids = v486Array(trasa?.trasa);
                        if(!ids.length) continue;
                        if(!ids.some(id => {
                            const p = znajdzStopPoId(id);
                            return tenSamWybranyPrzystanek(p);
                        })) continue;
                        const koniecId = v486Text(trasa?.koniec_trasy) || ids[ids.length-1];
                        const koniecStop = znajdzStopPoId(koniecId);
                        const nazwa = koniecStop
                            ? v486StopName(koniecStop)
                            : v486Text(koniecId).split("|")[1] || "";
                        if(nazwa &&
                           v486Text(nazwa).toUpperCase() !== v486Text(podstawowy.nazwa).toUpperCase() &&
                           !jawneWydluzenia.some(x => x.toUpperCase() === nazwa.toUpperCase())){
                            jawneWydluzenia.push(nazwa);
                        }
                    }
                }
            }
            return [podstawowy.nazwa, ...jawneWydluzenia].join(" / ");
        }
    }

    /*
       Fallback dla starszych danych:
       tylko kursy/przystanki dostępne w aktualnym kierunku.
    */
    const direct =
        v486Text(k?.nazwa) ||
        v486Text(k?.kierunek);

    if(direct){
        return direct;
    }

    const stops = v486BaseStops()
        .filter(p => v486StopType(p) !== "TECH");

    return stops.length
        ? v486StopName(stops[stops.length-1])
        : "";
}

function v486CurrentDirection(){
    return kierunekBazowy() || null;
}

function v486BaseStops(){
    return v486Array(
        v486CurrentDirection()?.przystanki
    );
}

function v486CurrentStop(){
    return v486BaseStops()[
        Number(aktualnyPrzystanek)
    ] || null;
}

function v486StopMap(){
    const map = new Map();

    v486BaseStops().forEach((p,index)=>{
        const id = v486StopId(p);

        if(id && !map.has(id)){
            map.set(id,{p,index});
        }
    });

    return map;
}

function v486MinutesValue(value){
    const m = /^(\d{1,2}):(\d{2})$/.exec(
        v486Text(value)
    );

    if(!m) return null;

    return Number(m[1]) * 60 + Number(m[2]);
}

function v486CourseKey(kurs){
    /*
       "numer" jest identyfikatorem konkretnego kursu w nowym JSON.
       Jeżeli kiedyś go zabraknie, dokładamy czas/brygadę jako fallback.
    */
    return [
        v486Text(kurs?.numer),
        v486Text(kurs?.czas),
        v486Text(kurs?.brygada)
    ].join("|");
}

function v486CourseAtStop(stop, representative){
    if(!stop || !representative) return null;

    const numer = v486Text(representative.numer);

    if(numer){
        const exact = v486Array(stop.kursy).find(
            k => v486Text(k?.numer) === numer
        );

        if(exact) return exact;
    }

    const key = v486CourseKey(representative);

    return v486Array(stop.kursy).find(
        k => v486CourseKey(k) === key
    ) || null;
}

/*
   Wszystkie RZECZYWISTE przebiegi dostępne z aktualnego przystanku.

   Każdy kurs.trasa jest przycinany od dokładnego ID aktualnego słupka.
   Niczego nie dodajemy, nie przestawiamy i nie dopasowujemy po nazwie.
*/
function v486BuildRoutes(){
    const active=v486CurrentStop();
    if(!active)return [];

    const stopMap=v486StopMap();

    /*
       FWTP V512
       Pierwszeństwo ma model listy przygotowany przez VBA V39.
       JavaScript NIE rekonstruuje już przebiegów z kursów, jeżeli
       lista_przystankowa istnieje.
    */
    const model=active.lista_przystankowa;

    if(model && Array.isArray(model.trasy) && model.trasy.length){
        const groups=new Map();

        model.trasy.forEach((trasaModel,index)=>{
            const ids=v486Array(trasaModel?.trasa)
                .map(v486Text)
                .filter(Boolean);

            const items=ids
                .map(id=>stopMap.get(id))
                .filter(Boolean)
                .filter(x=>v486StopType(x.p)!=="TECH");

            if(!items.length)return;

            const terminalId=v486Text(
                trasaModel?.koniec_trasy
            ).trim();

            const wariant=v486Text(
                trasaModel?.wariant
            ).trim();

            /*
               Klucz fizycznego przebiegu pozostaje dokładny.
               Łączenie wspólnych punktów (np. PROZY) wykonuje
               późniejszy renderer po nazwach, tak jak od V501.
            */
            const key=ids.join(">>");

            if(!groups.has(key)){
                groups.set(key,{
                    ids,
                    items,
                    courses:[],
                    variants:new Set(),
                    terminalIds:new Set(),
                    listaModel:true,
                    order:index
                });
            }

            const g=groups.get(key);

            if(wariant){
                g.variants.add(wariant);
            }

            if(terminalId){
                g.terminalIds.add(terminalId);
            }
        });

        return [...groups.values()];
    }

    /*
       Fallback dla starszych JSON-ów bez lista_przystankowa.
    */
    const activeId=v486StopId(active);
    const groups=new Map();

    for(const kurs of v486Array(active.kursy)){
        const fullIds=v486Array(kurs?.trasa)
            .map(v486Text)
            .filter(Boolean);

        if(!fullIds.includes(activeId))continue;

        const items=fullIds
            .map(id=>stopMap.get(id))
            .filter(Boolean)
            .filter(x=>v486StopType(x.p)!=="TECH");

        if(!items.length)continue;

        const key=fullIds.join(">>");

        if(!groups.has(key)){
            groups.set(key,{
                ids:fullIds,
                items,
                courses:[],
                variants:new Set(),
                terminalIds:new Set()
            });
        }

        const g=groups.get(key);
        g.courses.push(kurs);

        const w=v486Text(kurs?.wariant).trim();
        if(w)g.variants.add(w);

        const terminal=v486Text(kurs?.koniec_trasy).trim();
        if(terminal)g.terminalIds.add(terminal);
    }

    return [...groups.values()];
}

/*
   Czas przejazdu dla reprezentatywnego kursu danego rzeczywistego
   przebiegu. Nie korzystamy z czasyTrasy() ani ze starego wyboru
   wariantu.
*/
function v486TravelMinutes(route,item){
    const active = v486CurrentStop();
    const rep = route?.representative;

    const activeCourse = v486CourseAtStop(active,rep);
    const stopCourse = v486CourseAtStop(item?.p,rep);

    const t0 = v486MinutesValue(activeCourse?.czas);
    const t1 = v486MinutesValue(stopCourse?.czas);

    if(t0 === null || t1 === null){
        return null;
    }

    let diff = t1 - t0;

    /*
       V488:
       - wcześniejsze przystanki mają czas ujemny względem tabliczki,
       - przejście przez północ korygujemy tylko przy oczywistym
         skoku do następnej doby.
    */
    if(diff < -12*60){
        diff += 24*60;
    }

    if(diff > 12*60){
        diff -= 24*60;
    }

    return diff;
}


/*
   V488 — WSPÓLNA TRASA I ODGAŁĘZIENIA

   JSON jest poprawny: każdy kurs ma pełne kurs.trasa.
   HTML musi z tych pełnych przebiegów wykryć wspólne fragmenty.

   Dla każdego ID liczymy, w ilu rzeczywistych przebiegach występuje.
   Dzięki temu wspólny odcinek nie jest traktowany jako trzy niezależne
   trasy. Informacja jest dołączona do elementów renderowanych.
*/
function v486RouteUsage(routes){
    const usage = new Map();

    for(const route of routes){
        const unique = new Set(route.ids);

        for(const id of unique){
            usage.set(
                id,
                (usage.get(id)||0)+1
            );
        }
    }

    return usage;
}

function v486MarkSharedRoutes(routes){
    const usage = v486RouteUsage(routes);

    for(const route of routes){
        route.items = route.items.map(item=>({
            ...item,
            _v488Usage:
                usage.get(
                    v486StopId(item.p)
                )||1,
            _v488Shared:
                (usage.get(
                    v486StopId(item.p)
                )||1)>1
        }));
    }

    return routes;
}

function v486RouteLabel(route){
    const letters = Array.from(
        new Set(
            v486Array(route?.courses)
                .map(k => v486Text(k?.wariant))
                .filter(Boolean)
        )
    );

    if(!letters.length) return "";

    return "Trasa w kursach " +
        letters
            .map(x => "„"+x.toLowerCase()+"”")
            .join(", ");
}

/*
   Separator miejscowości jest tworzony WYŁĄCZNIE z pola
   miejscowosc z JSON. Nie czytamy nawiasów z nazwy.
*/
function v486TownSeparator(town){
    if(!town) return "";

    return (
        '<li class="trasa-separator v486-miejscowosc">'+
        '<span class="trasa-separator-title">'+
        '--- '+escapeHtml(town.toUpperCase())+' ---'+
        '</span>'+
        '</li>'
    );
}

/*
   Separator strefy również korzysta WYŁĄCZNIE z JSON.
*/
function v486ZoneSeparator(zone){
    if(!zone) return "";

    return (
        '<li class="trasa-separator trasa-strefa-440">'+
        '<span class="trasa-separator-title">'+
        'STREFA '+escapeHtml(zone)+
        '</span>'+
        '</li>'
    );
}

function v486RenderRouteColumn(route){
    const activeId = v486StopId(
        v486CurrentStop()
    );

    let previousTown = null;
    let previousZone = null;

    let rows = "";

    route.items.forEach((item,pos)=>{
        const p = item.p;
        const town = v486StopTown(p);
        const zone = v486StopZone(p);

        /*
           Miejscowość pokazujemy przy zmianie miejscowości.
           Nie dopisujemy jej do nazwy przystanku.
        */
        if(
            pos > 0 &&
            town &&
            town !== previousTown
        ){
            rows += v486TownSeparator(town);
        }

        /*
           Strefa jest niezależna od miejscowości.
           1/2 traktujemy jako informację graniczną zapisaną w JSON.
        */
        if(
            pos > 0 &&
            zone &&
            zone !== previousZone
        ){
            rows += v486ZoneSeparator(zone);
        }

        const selected =
            v486StopId(p) === activeId;

        const first = pos === 0;
        const last = pos === route.items.length-1;
        const minutes = v486TravelMinutes(route,item);

        const classes = [
            "trasa-stop",
            selected ? "wybrany" : "",
            first ? "kraniec-poczatek" : "",
            last ? "kraniec-koniec koniec-trasy-210" : "",
            item?._v488Shared ? "v488-wspolny" : "v488-galaz",
            czyNZ(p) ? "nz" : ""
        ].filter(Boolean).join(" ");

        rows +=
            '<li class="'+classes+'" data-v486-id="'+
            escapeHtml(v486StopId(p))+'">'+

            '<span class="trasa-czas">'+
            (
                minutes === null
                    ? ""
                    : escapeHtml(String(minutes))
            )+
            '</span>'+

            '<span class="trasa-os"></span>'+

            '<span class="trasa-nazwa">'+
            (
                selected
                    ? '<span class="trasa-nazwa-aktywna">'+
                      escapeHtml(
                          v486StopName(p).toUpperCase()
                      )+
                      '</span>'
                    : escapeHtml(
                          v486StopName(p).toUpperCase()
                      )
            )+
            '</span>'+

            '<span class="trasa-nz">'+
            (
                czyNZ(p)
                    ? "ż"
                    : ""
            )+
            '</span>'+
            '</li>';

        if(town){
            previousTown = town;
        }

        if(zone){
            previousZone = zone;
        }
    });

    const label = v486RouteLabel(route);

    return (
        '<div class="trasa-kol v486-trasa-kol">'+
        '<ul class="trasa-lista">'+
        (
            label
                ? '<li class="trasa-separator v486-wariant">'+
                  '<span class="trasa-separator-title">'+
                  escapeHtml(label)+
                  '</span>'+
                  '</li>'
                : ''
        )+
        rows+
        '</ul>'+
        '</div>'
    );
}


/* =========================================================
   FWTP — WERSJA 496
   WSPÓLNE PRZYSTANKI + RZECZYWISTE ODGAŁĘZIENIA
   =========================================================
   - logiczny przystanek: nazwa_czysta + nr
   - różne ID/LP tego samego słupka nie tworzą kopii
   - wspólny fragment kilku kurs.trasa jest pokazany jeden raz
   - opis wariantu jest dopiero przy odgałęzieniu
   - brak specjalnych wyjątków dla numerów linii
   ========================================================= */

function v496StopKey(p){
    return [
        v486StopName(p)
            .toLocaleUpperCase("pl-PL")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g,"")
            .replace(/\s+/g," ")
            .trim(),
        v486Text(p?.nr).toLocaleUpperCase("pl-PL").trim()
    ].join("\u001F");
}


/* =========================================================
   FWTP — WERSJA 501
   WSPÓLNY PUNKT TAKŻE PO SAMEJ NAZWIE PRZYSTANKU
   ========================================================= */

function v501StopNameKey(p){
    return v486StopName(p)
        .toLocaleUpperCase("pl-PL")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/\s+/g," ")
        .trim();
}

/*
   Dla szukania wspólnego przebiegu używamy nazwy przystanku.
   Numer słupka nadal pozostaje w danych i przy zwykłym
   identyfikowaniu przystanku, ale nie powoduje sztucznego
   rozgałęzienia, gdy obie trasy mają np. PROZY.
*/
function v501RouteNameKeys(route){
    return v486Array(route?.items).map(x=>v501StopNameKey(x?.p));
}

function v496RouteKeys(route){
    return v486Array(route?.items).map(x=>v496StopKey(x?.p));
}

function v496Varianty(route){
    const out=new Set();

    /*
       FWTP V513:
       V512 buduje przebiegi z lista_przystankowa, więc route.courses
       może być puste. Litera wariantu jest wtedy w route.variants.
    */
    if(route?.variants instanceof Set){
        route.variants.forEach(v=>{
            const x=v486Text(v).trim().toUpperCase();
            if(x)out.add(x);
        });
    }

    v486Array(route?.courses).forEach(kurs=>{
        const x=v486Text(kurs?.wariant).trim().toUpperCase();
        if(x)out.add(x);
    });

    return [...out];
}

function v503CzasKursu(kurs){
    const raw=v486Text(kurs?.czas).trim();
    if(!raw)return "";

    /*
       Zachowujemy czas z JSON-a. Usuwamy tylko zbędne sekundy,
       jeśli format jest HH:MM:SS.
    */
    const m=raw.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
    if(m){
        return String(Number(m[1]))+":"+m[2];
    }

    return raw;
}

function v503KursyGałęzi(routes){
    const out=[];
    const seen=new Set();

    v486Array(routes).forEach(route=>{
        v486Array(route?.courses).forEach(kurs=>{
            const czas=v503CzasKursu(kurs);
            if(!czas)return;

            const key=v486CourseKey(kurs);
            if(seen.has(key))return;
            seen.add(key);

            out.push({
                czas,
                sort:(()=>{
                    const m=czas.match(/^(\d{1,2}):(\d{2})$/);
                    if(!m)return Number.MAX_SAFE_INTEGER;
                    let h=Number(m[1]);
                    const min=Number(m[2]);
                    /*
                       Kursy po północy zostają w naturalnym porządku
                       danych; sortujemy tylko czytelnie w obrębie godzin.
                    */
                    return h*60+min;
                })()
            });
        });
    });

    out.sort((a,b)=>a.sort-b.sort);
    return out.map(x=>x.czas);
}

function v496OpisWariantow(routes){
    const litery=Array.from(new Set(
        v486Array(routes)
            .flatMap(route=>v496Varianty(route))
            .map(x=>v486Text(x).trim().toUpperCase())
            .filter(Boolean)
    ));

    /*
       V513:
       Ta sama zasada co przy minutach:
       - jeżeli oznaczenie jest rzeczywiście pokazywane -> podaj literę,
       - jeżeli oznaczenia są ukryte -> "BEZ OZNACZEŃ".
       Dzięki temu gałąź F do Metro Marymont dostaje F.
    */
    const widoczne=litery.filter(litera=>{
        if(typeof czyPokazacWariantJakLiniaHTML==="function"){
            return czyPokazacWariantJakLiniaHTML(litera);
        }
        return litera==="F";
    });

    if(widoczne.length){
        return "TRASA W KURSACH " +
            widoczne.map(x=>'„'+x+'”').join(", ");
    }

    return "TRASA W KURSACH BEZ OZNACZEŃ";
}


/* =========================================================
   FWTP — WERSJA 502
   RZECZYWISTY PRZYSTANEK KOŃCOWY
   ========================================================= */

function v502CzyRzeczywistyKoniec(item,route){
    const p=item?.p;
    if(!p)return false;

    const itemId=v486StopId(p);
    if(!itemId)return false;

    /*
       FWTP V512:
       jeżeli przebieg pochodzi z lista_przystankowa V39,
       koniec jest już jawnie zapisany przez VBA.
    */
    if(route?.terminalIds instanceof Set && route.terminalIds.size){
        return route.terminalIds.has(itemId);
    }

    /*
       Fallback dla starego JSON.
    */
    const stopMap=v486StopMap();

    for(const kurs of v486Array(route?.courses)){
        const explicit=v486Text(kurs?.koniec_trasy).trim();

        if(explicit){
            if(explicit===itemId)return true;
            continue;
        }

        const trasa=v486Array(kurs?.trasa);

        for(let i=trasa.length-1;i>=0;i--){
            const id=v486Text(trasa[i]).trim();
            if(!id)continue;

            const found=stopMap.get(id);
            if(found && v486StopType(found.p)==="TECH")continue;

            return id===itemId;
        }
    }

    return false;
}

function v496RenderStop(item, route, aktywnyKey, first=false, last=false){
    const p=item?.p;
    if(!p) return "";

    const selected=v496StopKey(p)===aktywnyKey;
    const minutes=v486TravelMinutes(route,item);

    /*
       V502: jeżeli jest to ostatni pasażerski przystanek rzeczywistego
       kurs.trasa, oznaczamy go jako końcowy niezależnie od podziału
       wariantów i kolumn.
    */
    /*
       V506:
       samo bycie ostatnim elementem aktualnie wyrenderowanego fragmentu
       NIE oznacza końca trasy. Fragment może kończyć się tylko dlatego,
       że zaczyna się odgałęzienie albo nastąpił podział kolumn.

       Końcowość pochodzi wyłącznie z ostatniego pasażerskiego
       przystanku rzeczywistego kurs.trasa.
    */
    const realTerminal=
        v502CzyRzeczywistyKoniec(item,route);

    const cls=[
        "trasa-stop",
        selected?"wybrany":"",
        first?"kraniec-poczatek":"",
        realTerminal?"kraniec-koniec koniec-trasy-210":"",
        czyNZ(p)?"nz":""
    ].filter(Boolean).join(" ");

    return '<li class="'+cls+'" data-v499-stop-key="'+escapeHtml(v496StopKey(p))+'" data-v508-stop-id="'+escapeHtml(v486StopId(p))+'">'+
        '<span class="trasa-czas">'+
        (minutes===null?"":escapeHtml(String(minutes)))+
        '</span>'+
        '<span class="trasa-os"></span>'+
        '<span class="trasa-nazwa">'+
        (selected
            ? '<span class="trasa-nazwa-aktywna">'+escapeHtml(v486StopName(p).toUpperCase())+'</span>'
            : escapeHtml(v486StopName(p).toUpperCase())
        )+
        '</span>'+
        '<span class="trasa-nz">'+(czyNZ(p)?"ż":"")+'</span>'+
        '</li>';
}

function v496RenderItems(items,route,aktywnyKey,opts={}){
    let html="";
    let town=opts.previousTown||null;
    let zone=opts.previousZone||null;

    items.forEach((item,i)=>{
        const p=item?.p;
        if(!p)return;

        const t=v486StopTown(p);
        const z=v486StopZone(p);

        if(t && t!==town && (i>0 || opts.separatorAtStart)){
            html+=v486TownSeparator(t);
        }
        /*
           V499: strefy są renderowane globalnie przez v499NormalizujStrefy().
           Dzięki temu STREFA I jest raz na górze i nie powtarza się
           w każdej gałęzi.
        */

        html+=v496RenderStop(
            item,route,aktywnyKey,
            !!opts.realFirst && i===0,
            !!opts.realLast && i===items.length-1
        );

        if(t)town=t;
        if(z)zone=z;
    });

    return {html,town,zone};
}

/*
   Szukamy najdłuższego wspólnego, kolejnego fragmentu wszystkich tras.
   Nie wymagamy, żeby zaczynał się na indeksie 0. Dzięki temu:
   różne początki -> połączenie -> wspólny pień -> odgałęzienie
   działa poprawnie.
*/
function v496LongestCommonBlock(routes){
    if(routes.length<2)return null;

    const arrays=routes.map(v501RouteNameKeys);
    const base=arrays.reduce((a,b)=>a.length<=b.length?a:b);

    let best=null;

    for(let start=0;start<base.length;start++){
        for(let len=1;start+len<=base.length;len++){
            const block=base.slice(start,start+len);
            const positions=[];

            let ok=true;
            for(const arr of arrays){
                let found=-1;
                outer:
                for(let p=0;p<=arr.length-block.length;p++){
                    for(let j=0;j<block.length;j++){
                        if(arr[p+j]!==block[j])continue outer;
                    }
                    found=p;
                    break;
                }
                if(found<0){ok=false;break;}
                positions.push(found);
            }

            if(ok && (!best || len>best.len)){
                best={block,len,positions};
            }
        }
    }
    return best;
}

function v496GroupExact(parts){
    const m=new Map();
    parts.forEach(x=>{
        const key=x.items.map(i=>v501StopNameKey(i.p)).join("\u001E");
        if(!m.has(key))m.set(key,{items:x.items,routes:[]});
        m.get(key).routes.push(x.route);
    });
    return Array.from(m.values());
}

function v496RenderBranchGroup(group,aktywnyKey,position){
    if(!group.items.length)return "";

    const rep=group.routes[0];
    /*
       V499:
       opis wariantu pokazujemy tylko przy odgałęzieniu PO wspólnej trasie.
       Różne początki przed wspólnym odcinkiem nie dostają napisu
       "TRASA W KURSACH ...".
    */
    const label=
        position==="after"
            ? v496OpisWariantow(group.routes)
            : "";
    const r=v496RenderItems(
        group.items,rep,aktywnyKey,
        {
            separatorAtStart:true,
            realFirst:position==="before",
            realLast:position==="after"
        }
    );

    return '<div class="v496-galaz">'+
        (label
            ? '<div class="trasa-separator v496-opis"><span class="trasa-separator-title">'+
              escapeHtml(label)+'</span></div>'
            : '')+
        '<ul class="trasa-lista">'+r.html+'</ul>'+
        '</div>';
}


/*
   V499:
   wariant pokazuje tylko własne odgałęzienie.
   Gdy ponownie spotka przystanek należący do dalszej trasy bazowej,
   nie powtarzamy dalszych przystanków wariantu — od tego miejsca
   lista może korzystać z przebiegu podstawowego.
*/
function v499PrzytnijGalazDoPowrotu(group,baseRoute,commonEndIndex){
    if(!group?.items?.length)return group;

    const baseAfter=v486Array(baseRoute?.items).slice(commonEndIndex);
    const baseKeys=new Set(baseAfter.map(x=>v501StopNameKey(x.p)));

    let cut=-1;
    for(let i=0;i<group.items.length;i++){
        if(baseKeys.has(v501StopNameKey(group.items[i].p))){
            cut=i;
            break;
        }
    }

    if(cut>0){
        return {
            ...group,
            items:group.items.slice(0,cut)
        };
    }

    return group;
}


/* =========================================================
   FWTP — WERSJA 500
   MINIONE PRZYSTANKI = WYŁĄCZNIE TRASA PODSTAWOWA
   =========================================================
   Na tabliczce przystankowej pasażera interesuje:
   - jak przebiegała trasa podstawowa do TEGO przystanku,
   - jakie warianty mogą wystąpić DOPIERO DALEJ.

   Dlatego wariant, który różnił się przed aktualnym przystankiem,
   nie tworzy już osobnej gałęzi po lewej/górnej części listy.
   ========================================================= */

function v500CzyTrasaA(route){
    return v486Array(route?.courses).some(
        k=>v486Text(k?.wariant).toUpperCase()==="A"
    );
}

function v500TrasaPodstawowa(routes){
    /*
       Najpierw szukamy jawnego wariantu A.
       Jeżeli JSON nie ma A przy kursach, zachowujemy pierwszy
       przebieg wyznaczony przez silnik jako bazowy.
    */
    return routes.find(v500CzyTrasaA) || routes[0] || null;
}

function v500IndexAktywnego(route,activeKey){
    return v486Array(route?.items).findIndex(
        x=>v496StopKey(x?.p)===activeKey
    );
}

function v500PrzygotujTrasyOdAktualnegoPrzystanku(routes){
    routes=v486Array(routes);
    if(!routes.length)return routes;

    const activeKey=v496StopKey(v486CurrentStop());
    const base=v500TrasaPodstawowa(routes);
    if(!base)return routes;

    const baseIndex=v500IndexAktywnego(base,activeKey);

    /*
       Jeżeli z jakiegoś powodu aktywnego przystanku nie ma
       w przebiegu podstawowym, nie zgadujemy — zostawiamy dane.
    */
    if(baseIndex<0)return routes;

    const basePassed=base.items.slice(0,baseIndex+1);

    return routes
        .map(route=>{
            const idx=v500IndexAktywnego(route,activeKey);

            /*
               Kurs niewykonujący aktualnego przystanku nie powinien
               brać udziału w tabliczce tego przystanku.
            */
            if(idx<0)return null;

            /*
               KLUCZOWA ZMIANA V500:
               wszystko DO aktualnego przystanku bierzemy z bazy.
               Dopiero wszystko PO nim pochodzi z rzeczywistego
               kurs.trasa danego wariantu.
            */
            const future=route.items.slice(idx+1);

            return {
                ...route,
                items:[
                    ...basePassed,
                    ...future
                ]
            };
        })
        .filter(Boolean);
}


function v500PolaczIdentyczneTrasy(routes){
    const map=new Map();

    v486Array(routes).forEach(route=>{
        const key=v486Array(route.items)
            .map(x=>v501StopNameKey(x?.p))
            .join("\u001E");

        if(!map.has(key)){
            map.set(key,{
                ...route,
                courses:[...v486Array(route.courses)]
            });
        }else{
            const dst=map.get(key);
            const seen=new Set(
                dst.courses.map(k=>v486CourseKey(k))
            );

            v486Array(route.courses).forEach(k=>{
                const ck=v486CourseKey(k);
                if(!seen.has(ck)){
                    seen.add(ck);
                    dst.courses.push(k);
                }
            });
        }
    });

    return Array.from(map.values());
}

function v496RenderRoutes(routes){
    routes=v486Array(routes);
    if(!routes.length)return "";

    /*
       V500:
       wszystkie przebiegi mają identyczną część minioną,
       zaczerpniętą z trasy podstawowej. Różnić mogą się dopiero
       ZA aktualnym przystankiem.
    */
    routes=v500PrzygotujTrasyOdAktualnegoPrzystanku(routes);
    routes=v500PolaczIdentyczneTrasy(routes);
    if(!routes.length)return "";

    const activeKey=v496StopKey(v486CurrentStop());

    if(routes.length===1){
        const r=v496RenderItems(
            routes[0].items,routes[0],activeKey,
            {realFirst:true,realLast:true}
        );
        return '<div class="trasa-kol v496-kol"><ul class="trasa-lista">'+r.html+'</ul></div>';
    }

    const common=v496LongestCommonBlock(routes);

    /*
       Jeżeli nie ma żadnego wspólnego kolejnego fragmentu,
       są to rzeczywiście niezależne przebiegi.
    */
    if(!common || common.len===0){
        return '<div class="trasa-kol v496-kol"><div class="v496-galezie">'+
            routes.map(route=>
                v496RenderBranchGroup({items:route.items,routes:[route]},activeKey,"whole")
            ).join("")+
            '</div></div>';
    }

    const before=[];
    const after=[];

    routes.forEach((route,ri)=>{
        const p=common.positions[ri];
        before.push({route,items:route.items.slice(0,p)});
        after.push({route,items:route.items.slice(p+common.len)});
    });

    const beforeGroups=v496GroupExact(before).filter(g=>g.items.length);
    const afterGroups=v496GroupExact(after).filter(g=>g.items.length);

    const baseRoute=routes[0];
    const commonItems=baseRoute.items.slice(
        common.positions[0],
        common.positions[0]+common.len
    );

    let html='<div class="trasa-kol v496-kol">';

    /*
       Różne początki: opisy dotyczą tylko tych różnych gałęzi.
    */
    if(beforeGroups.length){
        html+='<div class="v496-galezie v496-przed">'+
            beforeGroups.map(g=>v496RenderBranchGroup(g,activeKey,"before")).join("")+
            '</div>';
    }

    /*
       Wspólny odcinek — dokładnie jeden raz, bez napisu wariantu.
    */
    const commonRendered=v496RenderItems(
        commonItems,baseRoute,activeKey,
        {
            separatorAtStart:beforeGroups.length>0,
            realFirst:beforeGroups.length===0,
            realLast:afterGroups.length===0
        }
    );
    html+='<ul class="trasa-lista v496-wspolna">'+commonRendered.html+'</ul>';

    /*
       Dopiero tutaj, po wspólnym odcinku, pokazujemy opis gałęzi.
    */
    if(afterGroups.length){
        const commonEnd=
            common.positions[0]+common.len;

        /*
           Pierwszy przebieg jest przebiegiem bazowym dla dalszej
           wspólnej listy. Pozostałe przebiegi pokazują tylko własny
           fragment odgałęzienia; po powrocie do podstawowej trasy
           nie powtarzamy już przystanków.
        */
        const baseAfterKey=
            baseRoute.items.slice(commonEnd)
                .map(x=>v501StopNameKey(x.p))
                .join("\u001E");

        const groups499=afterGroups.map(g=>{
            const key=g.items.map(x=>v501StopNameKey(x.p)).join("\u001E");

            if(key===baseAfterKey){
                return g;
            }

            return v499PrzytnijGalazDoPowrotu(
                g,
                baseRoute,
                commonEnd
            );
        }).filter(g=>g.items.length);

        html+='<div class="v496-galezie v496-po">'+
            groups499.map(g=>v496RenderBranchGroup(g,activeKey,"after")).join("")+
            '</div>';
    }

    html+='</div>';
    return html;
}

/* =========================================================
   FWTP — WERSJA 514
   GOTOWA LISTA PRZYSTANKOWA Z VBA V42 / JSON lista_przystankowa.wersja=2

   ZASADA:
   - VBA układa kolejność listy,
   - JS NIE wykrywa już wspólnej trasy ani odgałęzień,
   - JS tylko renderuje elementy[] dokładnie w kolejności z JSON,
   - trasa_w_kursach jest gotowym separatorem z VBA,
   - koncowy=true kończy linię dokładnie w środku kropki,
   - stan=miniety korzysta ze starego wyglądu .przed,
   - aktualny przystanek ustalamy dodatkowo po dokładnym ID,
     aby dwa słupki o tej samej nazwie nie pomyliły zaznaczenia.
   ========================================================= */

function v514ModelListy(){
    const active=v486CurrentStop();
    const model=active?.lista_przystankowa;

    if(
        model &&
        Number(model.wersja)>=2 &&
        Array.isArray(model.elementy)
    ){
        return model.elementy;
    }

    return null;
}

function v514StopPoId(id){
    const wanted=v486Text(id).trim();
    if(!wanted)return null;

    /*
       FWTP V556:
       Status, minuty i zaznaczenie przystanku muszą działać
       WYŁĄCZNIE na dokładnym ID w aktualnym kierunku.

       Nie szukamy po nazwie.
       Nie szukamy pierwszego pasującego przystanku w innym
       rozkładzie ani w innym kierunku.

       Przykład:
       "Izabelin-Dziekanówek 01"
       i
       "Izabelin-Dziekanówek 02"
       są dwoma różnymi przystankami.
    */
    return v486BaseStops().find(
        p => v486StopId(p)===wanted
    ) || null;
}

function v577KluczStopu(p){
    return [
        String(p?.nazwa_czysta||p?.nazwa||'').trim().toUpperCase(),
        String(p?.nr||'').trim().toUpperCase()
    ].join('|');
}

function v577NajczestszyCzasZCalegoTygodnia(targetId){

    const baza=kierunekBazowy();
    const current=baza?.przystanki?.[aktualnyPrzystanek]||null;
    if(!current)return null;

    const aId=String(targetId||'').split('|');
    const targetKey=[
        String(aId.length>=2?aId[aId.length-2]:'').trim().toUpperCase(),
        String(aId.length>=1?aId[aId.length-1]:'').trim().toUpperCase()
    ].join('|');

    const currentKey=v577KluczStopu(current);
    const roznice=[];

    (daneLinii?.rozkłady||[]).forEach(rozklad=>{
        const kier=Array.isArray(rozklad?.kierunki)
            ? rozklad.kierunki[aktualnyKierunek]
            : null;
        const stops=kier?.przystanki||[];
        const a=stops.find(p=>v577KluczStopu(p)===currentKey);
        const b=stops.find(p=>v577KluczStopu(p)===targetKey);
        if(!a||!b)return;

        const mb=new Map();
        (b?.kursy||[]).forEach(k=>{
            const nr=String(k?.numer||'').trim();
            const t=czasNaMinuty(k?.czas);
            if(nr&&t!==null)mb.set(nr,t);
        });

        (a?.kursy||[]).forEach(k=>{
            const nr=String(k?.numer||'').trim();
            const ta=czasNaMinuty(k?.czas);
            if(!nr||ta===null||!mb.has(nr))return;
            let d=mb.get(nr)-ta;
            if(d<0)d+=1440;
            if(d>=0&&d<1440)roznice.push(d);
        });
    });

    if(!roznice.length)return null;

    const licz=new Map();
    roznice.forEach(v=>licz.set(v,(licz.get(v)||0)+1));

    let best=null,bestCount=-1;
    licz.forEach((count,value)=>{
        if(count>bestCount||(count===bestCount&&(best===null||value>best))){
            best=value;
            bestCount=count;
        }
    });
    return best;
}

function v514MinutyDoPrzystanku(targetId){
    const active=v486CurrentStop();
    if(!active)return null;

    const activeId=v486Text(
        v486StopId(active)
    ).trim();

    const wantedId=v486Text(
        targetId
    ).trim();

    if(!activeId || !wantedId){
        return null;
    }

    /*
       Dokładnie ten sam słupek.
    */
    if(wantedId===activeId){
        return 0;
    }

    const target=v514StopPoId(wantedId);
    if(!target)return null;

    for(const kurs of v486Array(active?.kursy)){
        const trasa=v486Array(kurs?.trasa)
            .map(x=>v486Text(x).trim())
            .filter(Boolean);

        /*
           FWTP V556:
           indexOf() porównuje pełne ID.
           Sama nazwa przystanku nie bierze udziału
           w ustalaniu pozycji.
        */
        const activeIndex=
            trasa.indexOf(activeId);

        const targetIndex=
            trasa.indexOf(wantedId);

        if(
            activeIndex < 0 ||
            targetIndex < 0
        ){
            continue;
        }

        /*
           Kurs na docelowym słupku również dopasowujemy
           do tego samego konkretnego kursu.
        */
        const targetCourse=
            v486CourseAtStop(
                target,
                kurs
            );

        if(!targetCourse){
            continue;
        }

        const t0=
            v486MinutesValue(
                kurs?.czas
            );

        const t1=
            v486MinutesValue(
                targetCourse?.czas
            );

        if(
            t0===null ||
            t1===null
        ){
            continue;
        }

        let diff=t1-t0;

        if(diff < -12*60)diff+=24*60;
        if(diff >  12*60)diff-=24*60;

        /*
           Dodatkowe zabezpieczenie kierunku:
           przystanek fizycznie wcześniejszy w kurs.trasa
           nie może zostać potraktowany jako przyszły tylko
           dlatego, że czas przekracza północ.
        */
        if(
            targetIndex < activeIndex &&
            diff > 0
        ){
            diff=-Math.abs(diff);
        }

        if(
            targetIndex > activeIndex &&
            diff < 0
        ){
            diff=Math.abs(diff);
        }

        return diff;
    }

    return null;
}


function v514RenderSeparator(element){
    /* FWTP V525:
       element typu "strefa" musi być renderowany jako:
       class="trasa-separator trasa-strefa-440"
       — bez klasy v486-strefa.
    */

    const typ=v486Text(element?.typ);
    const tekst=v486Text(element?.tekst).trim();

    /*
       V588: granice objazdu mogą mieć sam typ bez pola tekst.
       Dla pozostałych separatorów zachowujemy dotychczasową zasadę.
    */
    if(
        !tekst &&
        typ!=="poczatek_objazdu" &&
        typ!=="koniec_objazdu"
    ){
        return "";
    }

    if(typ==="strefa"){
        if(/^[1-5]\d\d$/.test(String(daneLinii?.linia||"")))return "";
        /* FWTP V535:
           JSON jest źródłem prawdy. Jeżeli ma "STREFA I",
           renderer pokazuje dokładnie "STREFA I".
           Dodatkowy fallback obsługuje stare JSON-y z 1/2/3. */
        const tekstStrefy=tekst
            .replace(/^STREFA\s+1$/i,"STREFA I")
            .replace(/^STREFA\s+2$/i,"STREFA II")
            .replace(/^STREFA\s+3$/i,"STREFA III");

        return (
            '<li class="trasa-separator trasa-strefa-440">'+
            '<span class="trasa-separator-title">'+
            escapeHtml(tekstStrefy)+
            '</span>'+
            '</li>'
        );
    }

    if(typ==="miejscowosc"){
        return (
            '<li class="trasa-separator trasa-miejscowosc-429">'+
            '<span class="trasa-separator-title">'+
            escapeHtml(tekst)+
            '</span>'+
            '</li>'
        );
    }

    /*
       FWTP V588:
       VBA zapisuje granice objazdu bezpośrednio w
       lista_przystankowa.elementy[].
       HTML tylko je wyświetla — nie wyznacza objazdu samodzielnie.
    */
    if(
        typ==="poczatek_objazdu" ||
        typ==="koniec_objazdu"
    ){
        const domyslnyTekst=
            typ==="poczatek_objazdu"
                ? "POCZĄTEK OBJAZDU"
                : "KONIEC OBJAZDU";

        const tekstObjazdu=
            (tekst || domyslnyTekst);

        return (
            '<li class="trasa-separator trasa-miejscowosc-429 v588-objazd '+typ+'">'+
            '<span class="trasa-separator-title">'+
            escapeHtml(tekstObjazdu)+
            '</span>'+
            '</li>'
        );
    }

    if(typ==="trasa_w_kursach"){
        const tekstTrasyMale=
            tekst.toLocaleLowerCase("pl-PL");

        const tekstTrasy=
            tekstTrasyMale.length
                ? tekstTrasyMale.charAt(0).toLocaleUpperCase("pl-PL")+
                  tekstTrasyMale.slice(1)
                : tekstTrasyMale;

        return (
            '<li class="trasa-separator v496-opis v514-trasa-w-kursach">'+
            '<span class="trasa-separator-title">'+
            escapeHtml(tekstTrasy)+
            '</span>'+
            '</li>'
        );
    }

    return "";
}

function v514RenderStop(element,position,total){
    const id=v486Text(element?.id);
    const p=v514StopPoId(id);

    /*
       Gdyby w przyszłości VBA zapisało element, którego nie ma już
       w tablicy przystanków, nadal pokażemy nazwę z elementu JSON.
    */
    const name=v486Text(
        element?.nazwa ||
        p?.nazwa_czysta ||
        p?.nazwa
    ).trim();

    const activeId=v486StopId(v486CurrentStop());

    const selected=
        id===activeId ||
        (
            !activeId &&
            v486Text(element?.stan)==="aktualny"
        );

    /*
       =========================================================
       FWTP WERSJA 570
       CZAS PRZEJAZDU POCHODZI BEZPOŚREDNIO Z JSON V106
       =========================================================

       VBA V106 zapisuje przy każdym przyszłym przystanku:
           "czas_przejazdu": N

       Jest to już gotowa, jedna wartość:
       - policzona tylko z kursów obsługujących oba przystanki,
       - najczęstsza dla danego odcinka/trasy,
       - przy remisie wybrana jest większa wartość.

       HTML NIE przelicza już czasu z kursów i NIE próbuje
       wybierać własnego wariantu przejazdu.

       Dla starszych JSON-ów zostawiamy bezpieczny fallback
       do dotychczasowej funkcji, ale dla JSON V106 zawsze
       pierwszeństwo ma element.czas_przejazdu.
    */
    const czasZJSON=
        Number(element?.czas_przejazdu);

    const maCzasZJSON=
        element?.czas_przejazdu!==undefined &&
        element?.czas_przejazdu!==null &&
        element?.czas_przejazdu!=="" &&
        Number.isFinite(czasZJSON);

    const czasZTygodnia=
        maCzasZJSON
            ? null
            : v577NajczestszyCzasZCalegoTygodnia(id);

    const minutesRaw=
        maCzasZJSON
            ? czasZJSON
            : (
                Number.isFinite(czasZTygodnia)
                    ? czasZTygodnia
                    : v514MinutyDoPrzystanku(id)
            );

    /*
       Od V106 stan "miniety" jest również zapisany bezpośrednio
       w gotowej liście. Dla nowych danych nie wyznaczamy go
       z ujemnego czasu, bo czas_przejazdu dotyczy przyszłości.
       Ujemny fallback zachowujemy wyłącznie dla starszych JSON-ów.
    */
    const minietyPoCzasie=
        !maCzasZJSON &&
        typeof minutesRaw==="number" &&
        Number.isFinite(minutesRaw) &&
        minutesRaw < 0;

    const miniety=
        !selected &&
        (
            v486Text(element?.stan)==="miniety" ||
            minietyPoCzasie
        );

    /*
       FWTP V557:
       Status końca pochodzi WYŁĄCZNIE z gotowego elementu
       lista_przystankowa.elementy[] wygenerowanego przez VBA V80.

       Nie wolno ponownie wyznaczać końców z model.trasy[].koniec_trasy,
       bo tam celowo pozostają także zwykłe kursy skrócone
       (np. 126 do Bartniczej / Metra Kondratowicza).

       koncowy=true + kontynuacja=false:
           rzeczywisty koniec gałęzi/krańca.

       koncowy=true + kontynuacja=true:
           rzeczywisty koniec jednego przebiegu, ale inny przebieg
           jedzie dalej z tego samego dokładnego przystanku.
    */
    /* =========================================================
       FWTP V620 — WYŁĄCZNIE FLAGI Z JSON
       O wyglądzie KAŻDEGO przystanku KAŻDEJ linii decydują
       tylko pola elementu lista_przystankowa.elementy:
         koncowy / kontynuacja.
       Nie wyznaczamy końcowych na podstawie trasy wariantu,
       końca kursu, nazwy ani pozycji na wspólnej liście.
       ========================================================= */
    const terminal=element?.koncowy===true;
    const continuation=terminal && element?.kontynuacja===true;

    /*
       Minięty:
       - istniejąca klasa "przed" robi go szarym,
       - minut nie pokazujemy.
    */
    const minutes=
        miniety
            ? null
            : minutesRaw;

    /*
       V563:
       Geometria terminalu nie może zależeć od dawnych wersji CSS.

       terminal-dwuwierszowy:
       dla długiej nazwy końcowej czas i kropka są ustawiane
       względem środka całego wiersza, nie pierwszej linii tekstu.

       v563-terminal-przelotowy:
       dostaje własny, jawny odcinek osi POD kropką.
    */
    /*
       =========================================================
       FWTP V612 — TYLKO 3 STANY PRZYSTANKU

       Źródłem prawdy są WYŁĄCZNIE:
           element.koncowy
           element.kontynuacja

       1. false / false
          -> v612-przelotowy
          -> nazwa zwykła
          -> oś nad i pod kropką

       2. true / true
          -> v612-koncowy-przelotowy
          -> nazwa pogrubiona
          -> oś nad i pod kropką

       3. true / false
          -> v612-koncowy
          -> nazwa pogrubiona
          -> oś TYLKO nad kropką

       Nie tworzymy tu żadnych klas v568/v569.
       Wariant trasy nie wpływa na geometrię przystanku.
       =========================================================
    */

    const v612Stan=
        terminal
            ?(
                continuation
                    ?"v612-koncowy-przelotowy"
                    :"v612-koncowy"
             )
            :"v612-przelotowy";

    /*
       V613:
       Stan nie jest już tylko klasą <li>.
       Każdy element graficzny dostaje własną klasę stanu.
    */
    const v613OsStan=
        v612Stan+"-os";

    const v613NazwaStan=
        v612Stan+"-nazwa";

    const v613CzasStan=
        v612Stan+"-czas";

    const v613NZStan=
        v612Stan+"-nz";

    const v612Dwuwierszowy=
        terminal &&
        (
            name.length>=18 ||
            name.includes("-")
        );

    const cls=[
        "trasa-stop",
        v612Stan,
        v612Dwuwierszowy?"v612-dwuwierszowy":"",
        selected?"wybrany":"",
        miniety?"przed":"",
        position===0?"kraniec-poczatek":"",
        (
            String(element?.typ_przystanku||p?.typ||"")
                .trim()
                .toUpperCase()==="NŻ" ||
            String(element?.typ_przystanku||p?.typ||"")
                .trim()
                .toUpperCase()==="NZ"
        )?"nz":""
    ].filter(Boolean).join(" ");

    return (
        '<li class="'+cls+'" '+
        'data-v514-stop-id="'+escapeHtml(id)+'" '+
        'data-v508-stop-id="'+escapeHtml(id)+'">'+

        '<span class="trasa-czas '+v613CzasStan+'">'+
        (minutes===null?"":escapeHtml(String(minutes)))+
        '</span>'+

        '<span class="trasa-os '+v613OsStan+'"></span>'+

        '<span class="trasa-nazwa '+v613NazwaStan+'" '+
        (terminal?'style="font-weight:700 !important"':'style="font-weight:400 !important"')+
        ' data-json-koncowy="'+(terminal?'true':'false')+'">'+
        (
            selected
                ? '<span class="trasa-nazwa-aktywna">'+
                  escapeHtml(name.toUpperCase())+
                  '</span>'
                : escapeHtml(name.toUpperCase())
        )+
        '</span>'+

        '<span class="trasa-nz '+v613NZStan+'">'+
        (
            (
                String(element?.typ_przystanku||p?.typ||"")
                    .trim()
                    .toUpperCase()==="NŻ" ||
                String(element?.typ_przystanku||p?.typ||"")
                    .trim()
                    .toUpperCase()==="NZ"
            )
                ? "ż"
                : ""
        )+
        '</span>'+

        '</li>'
    );
}

/* FWTP V630: okrężność rozpoznajemy również w JSON bez pól V185.
   Zawsze ignorujemy DTECH/CTECH i porównujemy rzeczywisty pełny kurs. */
function v630Pasazerski(k){
    return !/TECH/i.test(String(k?.uwagi||""));
}
function v628KierunekOkrezny(){
    const k=v486CurrentDirection();
    if(!k)return null;
    if(k.okrezna===true)return k;
    const stops=v486Array(k.przystanki);
    if(stops.length<3)return null;
    const pierwszy=stops[0],ostatni=stops[stops.length-1];
    if(!pierwszy||!ostatni||
       v486StopName(pierwszy).trim().toLocaleLowerCase("pl")!==
       v486StopName(ostatni).trim().toLocaleLowerCase("pl"))return null;
    const rzeczywiste=v486Array(pierwszy.kursy).filter(c=>
        v630Pasazerski(c)&&v486Array(c.trasa).length>=3&&
        v486Array(c.trasa).some(id=>String(id)===v486StopId(ostatni))
    );
    return rzeczywiste.length?k:null;
}
function v630OpisKierunku(k){
    if(!k)return "";
    if(String(k.opis_kierunku||"").trim())return String(k.opis_kierunku).trim();
    const nazwy=v486Array(k.przystanki).slice(1,-1)
        .filter(p=>v486StopType(p)!=="TECH")
        .map(p=>v486StopName(p));
    const priorytet=nazwy.filter(n=>/PKP|RATUSZ|CZERWONYCH BERETÓW/i.test(n));
    const wybrane=(priorytet.length>=2?priorytet:
        [nazwy[0],nazwy[Math.floor(nazwy.length/2)],nazwy[nazwy.length-1]])
        .filter((n,i,a)=>n&&a.indexOf(n)===i);
    return wybrane.length?"Przez "+wybrane.join(", "):"";
}
/* Dla starszych gotowych list VBA, które pominęły powrót na kraniec,
   odtwarzamy WYŁĄCZNIE brakujący ostatni element z kurs.trasa.
   Nie zmieniamy list i rozgałęzień pozostałych linii. */
function v628ListaOkrezna(elements){
    const k=v628KierunekOkrezny();
    if(!k || !elements?.length)return elements;
    const ostatni=v486Array(k.przystanki).at(-1);
    const koniecId=v486StopId(ostatni);
    if(!koniecId)return elements;
    const ostatniElement=[...elements].reverse().find(e=>e?.typ==="przystanek");
    if(ostatniElement && v486Text(ostatniElement.id)===koniecId)return elements;
    const ostatniWidoczny=[...elements].reverse().find(e=>e?.typ==="przystanek");
    if(!ostatniWidoczny)return elements;
    const pierwsze=v486BaseStops()[0];
    const start=v486CurrentStop();
    const cel=ostatni;
    const czasy=[];
    const mapa=new Map(v486Array(cel?.kursy)
        .filter(c=>!String(c?.uwagi||"").toUpperCase().includes("TECH"))
        .map(c=>[String(c.numer),c]));
    for(const c of v486Array(start?.kursy)){
        if(String(c?.uwagi||"").toUpperCase().includes("TECH"))continue;
        const koniec=mapa.get(String(c?.numer));
        if(!koniec)continue;
        const a=czasNaMinuty(c.czas),b=czasNaMinuty(koniec.czas);
        if(Number.isFinite(a)&&Number.isFinite(b))czasy.push((b-a+1440)%1440);
    }
    const licz=new Map();
    for(const x of czasy)licz.set(x,(licz.get(x)||0)+1);
    const czas=czasy.length
        ? [...licz].sort((a,b)=>b[1]-a[1]||b[0]-a[0])[0][0]
        : null;
    const koncowy={
        typ:"przystanek",id:koniecId,
        nazwa:v486StopName(cel)||v486StopName(pierwsze),
        nr:v486StopNumber(cel),
        stan:"normalny",koncowy:true,kontynuacja:false
    };
    if(czas!==null)koncowy.czas_przejazdu=czas;
    return [...elements,koncowy];
}

/* V635: lista okrężna kończy się na ostatnim przystanku z JSON.
   Żaden dodatkowy fragment nie może znaleźć się za tym końcem. */
function v635PrzytnijListeOkrezna(elements){
    const k=v628KierunekOkrezny();
    if(!k || !Array.isArray(elements))return elements;
    const id=v486StopId(v486Array(k.przystanki).at(-1));
    if(!id)return elements;
    const index=elements.findIndex(e=>e?.typ==="przystanek" &&
        v486Text(e.id).trim()===id);
    return index>=0?elements.slice(0,index+1):elements;
}

function v514RenderGotowejListy(){
    /* V636: gotowa lista jest dokładnie taka, jak lista_przystankowa.elementy
       aktualnego przystanku w JSON. Nie dopisujemy ani nie usuwamy pozycji. */
    const elementsRaw=v514ModelListy();
    if(!elementsRaw)return "";

    /* V648: dwa wskazane przystanki nie są przystankami granicznymi.
       Usuwamy wyłącznie separator STREFA I/2 bezpośrednio związany
       z BUKOWEM (211) lub HUBALA-DOBRZAŃSKIEGO (149).
       Nie zmieniamy innych separatorów, kolejności ani JSON. */
    const numerV648=String(daneLinii?.linia||aktualnaLinia||"").trim();
    const nazwaV648=e=>String(e?.nazwa||"").normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,"");
    const wyjatekV648=e=>e?.typ==="przystanek" && (
        (numerV648==="211" && nazwaV648(e)==="BUKOW") ||
        (numerV648==="149" && nazwaV648(e)==="HUBALADOBRZANSKIEGO")
    );
    const jestGranicaV648=e=>e?.typ==="strefa" &&
        /(?:STREFA\s*)?(?:I\s*\/\s*2|1\s*\/\s*2)/i.test(String(e?.tekst||""));
    // V649: dla linii 1xx–5xx nie pokazujemy separatorów stref.
    // Dotyczy STREFA I, STREFA I/2, STREFA II i wszystkich ich wariantów.
    // Nie zmieniamy oznaczeń NŻ ani kolejności przystanków.
    const bezStrefV649=/^[1-5]\d\d$/.test(numerV648);

    /* V651: sprawdzamy WSZYSTKIE kierunki i rozkłady linii, a nie
       wyłącznie aktualnie wyświetlany przystanek. Miejscowość WARSZAWA
       ukrywamy tylko wtedy, gdy KAŻDY przystanek linii ma jawnie
       wpisaną miejscowość Warszawa. Brak danych nie jest dowodem. */
    const wszystkiePrzystankiV651=(daneLinii?.rozkłady||[])
        .flatMap(r=>Array.isArray(r?.kierunki)?r.kierunki:[])
        .flatMap(k=>Array.isArray(k?.przystanki)?k.przystanki:[]);
    const normalizujV651=s=>String(s||'').normalize('NFD')
        .replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
    const tylkoWarszawaV651=wszystkiePrzystankiV651.length>0 &&
        wszystkiePrzystankiV651.every(p=>
            normalizujV651(p?.miejscowosc)==='WARSZAWA'
        );
    const elements=elementsRaw.filter((e,i,a)=>{
        if(tylkoWarszawaV651 && String(e?.typ||'').toLowerCase()==='miejscowosc' &&
           normalizujV651(e?.tekst)==='WARSZAWA')return false;
        if(bezStrefV649 && String(e?.typ||"").toLowerCase()==="strefa")return false;
        if(!jestGranicaV648(e))return true;
        // Granica może wystąpić przed lub po przystanku, czasem
        // oddzielona od niego separatorem miejscowości.
        let prev=null,next=null;
        for(let j=i-1;j>=0;j--){if(a[j]?.typ==="przystanek"){prev=a[j];break;}}
        for(let j=i+1;j<a.length;j++){if(a[j]?.typ==="przystanek"){next=a[j];break;}}
        return !(wyjatekV648(next)||wyjatekV648(prev));
    });

    let rows="";
    let stopPosition=0;

    const stopCount=elements.filter(
        x=>v486Text(x?.typ)==="przystanek"
    ).length;

    /*
       V561:
       separator "Trasa w kursach..." jest przerwą w osi.
       Nie rysujemy przez niego żadnej czarnej kreski.

       Terminal przelotowy ma natomiast kreskę od góry do dołu
       W OBRĘBIE SWOJEGO WIERSZA. Dzięki temu kreska wychodzi
       spod kropki, ale kończy się przed separatorem.
    */
    elements.forEach(element=>{
        const typ=v486Text(element?.typ);

        if(typ==="przystanek"){

            rows+=v514RenderStop(
                element,
                stopPosition,
                stopCount
            );

            stopPosition++;

        }else{

            rows+=v514RenderSeparator(
                element
            );
        }
    });

    return (
        '<div class="trasa-kol v514-kol">'+
        '<ul class="trasa-lista v514-lista">'+
        rows+
        '</ul>'+
        '</div>'
    );
}

function v486RenderRoutes(routes){

       Dzięki temu V514 nie psuje starszych plików.

    return v496RenderRoutes(routes);
}

function v501TownText(el){
    return (el?.textContent||"")
        .replace(/[-–—]/g," ")
        .replace(/\s+/g," ")
        .trim()
        .toLocaleUpperCase("pl-PL");
}

function v501NormalizujMiejscowosci(root){
    if(!root)return;

    /*
       =========================================================
       FWTP V558 — POPRAWKA "TRASA WE WSZYSTKICH KURSACH"
       =========================================================

       BŁĄD V557 i wcześniejszych:
       V501 brała WSZYSTKIE .trasa-separator i próbowała rozpoznać
       miejscowość po samym tekście.

       Warunek wykluczał:
           "TRASA W KURSACH"
       ale NIE wykluczał:
           "TRASA WE WSZYSTKICH KURSACH"

       W efekcie pierwszy taki napis był traktowany jak nazwa
       miejscowości, a następny identyczny napis był usuwany jako
       "powtórzona miejscowość".

       Dlatego w 126:
       - pierwszy powrót po Płytowej/Kupieckiej był widoczny,
       - drugi powrót po Polfie znikał.

       V558:
       miejscowości rozpoznajemy WYŁĄCZNIE po klasie nadanej
       przez renderer JSON:
           .trasa-miejscowosc-429

       Separatory tras i stref nie są już w ogóle dotykane przez
       normalizację miejscowości.
       =========================================================
    */

    const seps=[
        ...root.querySelectorAll(
            ".trasa-separator.trasa-miejscowosc-429"
        )
    ];

    let current="";

    seps.forEach(el=>{
        const town=v501TownText(el);

        if(!town)return;

        if(town===current){
            el.remove();
            return;
        }

        current=town;
    });

    /*
       Obsługa gałęzi pozostaje, ale również tutaj szukamy już
       WYŁĄCZNIE prawdziwych separatorów miejscowości.
       Dzięki temu:
       - TRASA W KURSACH ...
       - TRASA WE WSZYSTKICH KURSACH
       - STREFA I / II
       nigdy nie mogą zostać pomylone z miejscowością.
    */
    root.querySelectorAll(".v496-galezie").forEach(branchBox=>{
        let prev=branchBox.previousElementSibling;
        let inherited="";

        while(prev && !inherited){
            const candidates=[
                ...(
                    prev.querySelectorAll?.(
                        ".trasa-separator.trasa-miejscowosc-429"
                    ) || []
                )
            ];

            if(candidates.length){
                inherited=
                    v501TownText(
                        candidates[candidates.length-1]
                    );
            }

            prev=prev.previousElementSibling;
        }

        if(!inherited)return;

        branchBox.querySelectorAll(".v496-galaz").forEach(branch=>{
            const first=
                branch.querySelector(
                    ".trasa-separator.trasa-miejscowosc-429"
                );

            if(
                first &&
                v501TownText(first)===inherited
            ){
                first.remove();
            }
        });
    });
}
function v499ZoneText(el){
    return (el?.textContent||"")
        .replace(/\s+/g," ")
        .trim()
        .toLocaleUpperCase("pl-PL");
}

function v499PierwszaStrefaZTrasy(){
    const routes=v486BuildRoutes();
    if(!routes.length)return "";

    /*
       Strefa z pierwszego rzeczywistego przystanku przebiegu.
       Jeżeli pierwszy przebieg zaczyna się inną gałęzią, nadal
       strefa jest informacją globalną i ma być przed listą.
    */
    for(const route of routes){
        for(const item of v486Array(route.items)){
            const z=v486StopZone(item?.p);
            if(z)return z;
        }
    }
    return "";
}

function v499NormalizujStrefy(root){
    if(!root)return;
    if(/^[1-5]\d\d$/.test(String(daneLinii?.linia||""))){
        root.querySelectorAll(".v486-strefa,.trasa-strefa-440").forEach(x=>x.remove());
        return;
    }

    /*
       Usuwamy wszystkie separatory stref wygenerowane lokalnie
       przez poszczególne gałęzie. Zbudujemy je ponownie według
       kolejności wyświetlanej listy.
    */
    root.querySelectorAll(".v486-strefa").forEach(x=>x.remove());

    const pierwsza=v499PierwszaStrefaZTrasy();
    if(!pierwsza)return;

    /*
       Pierwszy napis STREFA I / II ma być NA GÓRZE,
       przed miejscowością i przed pierwszym przystankiem.
    */
    const firstList=root.querySelector(".trasa-lista");
    if(firstList){
        firstList.insertAdjacentHTML(
            "afterbegin",
            v486ZoneSeparator(pierwsza)
        );
    }

    /*
       Następne napisy dodajemy wyłącznie w momencie faktycznej
       zmiany strefy. Ten sam napis nie jest powtarzany.
    */
    let current=pierwsza;

    const stops=Array.from(
        root.querySelectorAll(".trasa-stop")
    );

    stops.forEach(stop=>{
        const key=stop.getAttribute("data-v499-stop-key");
        if(!key)return;

        const p=v499StopByKey(key);
        const zone=v486StopZone(p);

        if(zone && zone!==current){
            stop.insertAdjacentHTML(
                "beforebegin",
                v486ZoneSeparator(zone)
            );
            current=zone;
        }
    });
}

function v499StopByKey(key){
    const k=v486CurrentDirection();
    for(const p of v486Array(k?.przystanki)){
        if(v496StopKey(p)===key)return p;
    }
    return null;
}

function v498PobierzStrumienWierszy(columns){

    /*
       =========================================================
       FWTP V575 — KOLEJNOŚĆ 1:1 Z JSON
       =========================================================
       Dla gotowej listy VBA nie wyszukujemy elementów kilkoma
       selektorami i nie próbujemy ponownie interpretować gałęzi.

       Bierzemy WYŁĄCZNIE bezpośrednie dzieci <ul> w kolejności DOM.
       Ta kolejność jest dokładnie kolejnością:
           lista_przystankowa.elementy[]

       Czyli dla 134:
           K/E -> SUWALSKA / METRO BRÓDNO / ...
           bez oznaczeń/Z -> TORUŃSKA
       i splitter kolumn nie może już zamienić tych fragmentów.
    */

    const main=columns.querySelector(":scope > .v496-kol") ||
               columns.querySelector(":scope > .trasa-kol");

    if(!main)return [];

    const lista=
        main.querySelector(":scope > .v514-lista") ||
        main.querySelector(":scope > .trasa-lista");

    if(!lista)return [];

    return Array.from(lista.children)
        .map(el=>el.outerHTML);
}
