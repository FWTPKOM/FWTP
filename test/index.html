   ========================================================= */

function znajdzNajpelniejszyKierunek(index){

    let najlepszy=null;
    let ile=-1;

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const k=
                Array.isArray(
                    rozklad.kierunki
                )
                    ? rozklad.kierunki[index]
                    : null;

            if(
                !k||
                !Array.isArray(
                    k.przystanki
                )
            ){
                return;
            }

            if(
                k.przystanki.length>
                ile
            ){
                najlepszy=k;
                ile=k.przystanki.length;
            }
        }
    );

    return najlepszy;
}


function pobierzKierunki(){

    let max=0;

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        r=>{
            if(
                Array.isArray(
                    r.kierunki
                )
            ){
                max=
                    Math.max(
                        max,
                        r.kierunki.length
                    );
            }
        }
    );

    const wynik=[];
    const widzianeTrasy=[];

    const normalizujNazwe=
        nazwa=>
            String(
                nazwa||
                ""
            )
            .toUpperCase()
            .replace(/\u00A0/g," ")
            .replace(/\s+/g," ")
            .replace(/[.,;:]+$/g,"")
            .trim();

    const nazwyTrasy=
        k=>
            (
                k?.przystanki||
                []
            )
            .map(
                p=>
                    normalizujNazwe208(
                        p?.nazwa
                    )
            );

    const takieSameNazwy=
        (a,b)=>{

            if(
                a.length!==b.length
            ){
                return false;
            }

            for(
                let j=0;
                j<a.length;
                j++
            ){
                if(
                    a[j]!==b[j]
                ){
                    return false;
                }
            }

            return true;
        };

    for(
        let i=0;
        i<max;
        i++
    ){

        const k=
            znajdzNajpelniejszyKierunek(
                i
            );

        if(!k){
            continue;
        }

        const nazwy=
            nazwyTrasy(k);

        /*
           Numery stanowisk/przystanków są całkowicie ignorowane.
           Jeżeli kolejność i nazwy przystanków są takie same,
           drugi kierunek/wariant nie jest dodawany.
        */
        const duplikat=
            widzianeTrasy.some(
                poprzednia=>
                    takieSameNazwy(
                        poprzednia,
                        nazwy
                    )
            );

        if(duplikat){
            continue;
        }

        widzianeTrasy.push(
            nazwy
        );

        wynik.push({
            index:i,
            dane:k
        });
    }

    return wynik;
}


function nazwaKierunku(
    k,
    kierunekIndex=aktualnyKierunek
){

    /*
       v226:
       kierunek wyliczony z kursów aktualnego przystanku może być użyty
       TYLKO dla aktualnie wybranego kierunku.

       Wcześniej kierunekZDokladnychKursow206() był wywoływany dla KAŻDEJ
       pozycji selecta, dlatego np. oba kierunki linii 401 dostawały
       tę samą nazwę „URSYNÓW PŁD.”, mimo że ich listy przystanków
       były prawidłowe.
    */
    if(
        Number(kierunekIndex)===
        Number(aktualnyKierunek)
    ){
        const zKursow=
            kierunekZDokladnychKursow206();

        if(zKursow){
            return zKursow;
        }
    }

    /*
       Dla pozostałych kierunków nazwa pochodzi z ich własnej trasy.
       TECH nie może być kierunkiem pasażerskim.
    */
    const lista=
        k?.przystanki||
        [];

    for(
        let i=lista.length-1;
        i>=0;
        i--
    ){
        if(
            typPrzystankuTrasy(
                lista[i]
            )!=="TECH"
        ){
            return String(
                lista[i]?.nazwa||
                ""
            ).trim();
        }
    }

    return String(
        k?.nazwa||
        k?.kierunek||
        ""
    ).trim();
}

function wypelnijKierunki(){

    const select=
        document.getElementById(
            "kierunekSelect"
        );

    const lista=
        pobierzKierunki();

    select.innerHTML="";

    lista.forEach(
        el=>{

            const option=
                document.createElement(
                    "option"
                );

            option.value=
                String(el.index);

            option.textContent=
                nazwaKierunku(
                    el.dane,
                    el.index
                )||
                "Kierunek "+
                (el.index+1);

            select.appendChild(option);
        }
    );

    select.disabled=
        !lista.length;

    select.value=
        String(
            aktualnyKierunek
        );
}

function czyTenSamPrzystanekPoNazwieINumerze(
    a,
    b
){

    if(
        !a||
        !b
    ){
        return false;
    }

    const nazwaA=
        normalizuj(
            a.nazwa
        );

    const nazwaB=
        normalizuj(
            b.nazwa
        );

    const nrA=
        String(
            a.nr||""
        ).trim();

    const nrB=
        String(
            b.nr||""
        ).trim();

    return(
        nazwaA===
            nazwaB&&
        nrA===
            nrB
    );
}

function __bezCache_czyBiezacyPrzystanekKraniecWiekszosciKursow(){

    const kierunek=
        znajdzNajpelniejszyKierunek(
            aktualnyKierunek
        );

    const przystanki=
        kierunek?.przystanki||
        [];

    const aktywny=
        przystanki[
            aktualnyPrzystanek
        ];

    if(!aktywny){
        return false;
    }

    const kursyNaAktywnym=
        new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    aktualnyKierunek,
                    aktywny
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        czasNaMinuty(
                            kurs?.czas
                        )===null
                    ){
                        return;
                    }

                    const key=
                        [
                            String(
                                kurs?.numer||""
                            ),
                            String(
                                kurs?.wariant||""
                            ),
                            symbolDnia(kurs)
                        ].join("|");

                    if(!kursyNaAktywnym.has(key)){
                        kursyNaAktywnym.set(
                            key,
                            {
                                numer:String(
                                    kurs?.numer||""
                                ),
                                wariant:String(
                                    kurs?.wariant||""
                                ),
                                symbol:
                                    symbolDnia(kurs)
                            }
                        );
                    }
                }
            );
        }
    );

    if(!kursyNaAktywnym.size){
        return false;
    }

    let koncowe=0;
    let przelotowe=0;

    for(
        const ref
        of kursyNaAktywnym.values()
    ){

        const indeksy=[];

        przystanki.forEach(
            (p,index)=>{

                let maCzas=false;

                (
                    daneLinii?.rozkłady||
                    []
                ).some(
                    rozklad=>{

                        const pp=
                            znajdzPrzystanekWRozkladzie(
                                rozklad,
                                aktualnyKierunek,
                                p
                            );

                        const znaleziony=
                            (
                                pp?.kursy||
                                []
                            ).find(
                                k=>
                                    String(
                                        k?.numer||""
                                    )===
                                        ref.numer&&
                                    String(
                                        k?.wariant||""
                                    )===
                                        ref.wariant&&
                                    symbolDnia(k)===
                                        ref.symbol&&
                                    czasNaMinuty(
                                        k?.czas
                                    )!==null
                            );

                        if(znaleziony){
                            maCzas=true;
                        }

                        return maCzas;
                    }
                );

                if(maCzas){
                    indeksy.push(index);
                }
            }
        );

        if(!indeksy.length){
            continue;
        }

        const pierwszy=
            indeksy[0];

        const ostatni=
            indeksy[
                indeksy.length-1
            ];

        if(
            aktualnyPrzystanek===
                pierwszy||
            aktualnyPrzystanek===
                ostatni
        ){
            koncowe++;
        }
        else{
            przelotowe++;
        }
    }

    /*
       Jeżeli co najmniej połowa kursów obsługujących ten słupek
       zaczyna się albo kończy właśnie tutaj, traktujemy go jako
       rzeczywisty kraniec trasy podstawowej.

       To naprawia przypadki takie jak SADYBA 05:
       część kursów jedzie dalej jako wydłużone, ale dla większości
       kursów SADYBA jest początkiem/końcem podstawowej trasy.
    */
    return(
        koncowe>0&&
        koncowe>=przelotowe
    );
}

const cacheCzasNaMinuty=
    new Map();

function czasNaMinuty(czas){

    const tekst=
        String(
            czas||""
        ).trim();

    if(
        cacheCzasNaMinuty.has(
            tekst
        )
    ){
        return cacheCzasNaMinuty.get(
            tekst
        );
    }

    const m=
        /^(\d{1,2}):(\d{2})$/
            .exec(
                tekst
            );

    if(!m){
        cacheCzasNaMinuty.set(
            tekst,
            null
        );

        return null;
    }

    const h=Number(m[1]);
    const min=Number(m[2]);

    if(
        h<0||
        h>47||
        min<0||
        min>59
    ){
        cacheCzasNaMinuty.set(
            tekst,
            null
        );

        return null;
    }

    const wynik=
        h*60+min;

    cacheCzasNaMinuty.set(
        tekst,
        wynik
    );

    return wynik;
}


function rozbijCzas(czas){

    const m=
        /^(\d{1,2}):(\d{2})$/
            .exec(
                String(
                    czas||""
                ).trim()
            );

    if(!m)return null;

    return{
        godzina:Number(m[1]),
        minuta:m[2]
    };
}

function symbolDnia(kurs){

        kurs?.uwagi||
        ""
    )
        .trim()
        .toUpperCase();
}


/* =========================================================
   WERSJA 462 — DF NALEŻY DO DNIA POWSZEDNIEGO
   =========================================================
   symbolDnia(kurs) pozostaje BEZ ZMIAN i nadal zwraca pełne
   oznaczenie z JSON, np. "DF". Dzięki temu nie zmieniamy
   identyfikacji konkretnych kursów ani działającej logiki tras.

   grupaDnia(kurs) służy WYŁĄCZNIE do przypisania kursu do
   odpowiedniej tabeli dnia:
       D, DF, D... -> D (DZIEŃ POWSZEDNI)
       C, C...     -> C (SOBOTA I ŚWIĘTO)
       6, 6...     -> 6 (SOBOTA)
       7, 7...     -> 7 (ŚWIĘTO)
   ========================================================= */
function grupaDnia(kurs){

    const uwagi=
        symbolDnia(kurs);

    if(uwagi.startsWith("D")){
        return "D";
    }

    if(uwagi.startsWith("C")){
        return "C";
    }

    if(uwagi.startsWith("6")){
        return "6";
    }

    if(uwagi.startsWith("7")){
        return "7";
    }

    return uwagi;
}


function kluczKursu(kurs){

    return[
        String(
            kurs?.numer||""
        ),
        String(
            kurs?.wariant||""
        )
    ].join("||");
}



function numerWystapieniaPrzystankuWBazie(element){

    if(
        !element||
        !Object.prototype.hasOwnProperty.call(
            element,
            "index"
        )
    ){
        return 0;
    }

    const baza=
        kierunekBazowy()
            ?.przystanki||
        [];

    const index=
        Number(
            element.index
        );

    if(
        !Number.isInteger(index)||
        index<0||
        index>=baza.length
    ){
        return 0;
    }

    const cel=
        baza[index];

    const nazwa=
        normalizuj(
            cel?.nazwa
        );

    const nr=
        String(
            cel?.nr||""
        ).trim();

    let wystapienie=0;

    for(
        let i=0;
        i<index;
        i++
    ){

        const p=
            baza[i];

        if(
            normalizuj(
                p?.nazwa
            )===
                nazwa&&
            String(
                p?.nr||""
            ).trim()===
                nr
        ){
            wystapienie++;
        }
    }

    return wystapienie;
}

function __bezCache_dostepneGrupyDni(){

    const symbole=
        new Set();

    const obsluga=
        kierunkiAktywneDlaBiezacegoPrzystanku();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            obsluga.forEach(
                info=>{

                    const p=
                        znajdzDokladnyPrzystanekWRozkladzie(
                            rozklad,
                            info.indexKierunku,
                            info.przystanek
                        );

                    (
                        p?.kursy||
                        []
                    ).forEach(
                        kurs=>{

                            const s=
                                grupaDnia(kurs);

                            if(s){
                                symbole.add(s);
                            }
                        }
                    );
                }
            );
        }
    );

    const wynik=[];

    const maD=
        symbole.has("D");

    const maC=
        symbole.has("C");

    const ma6=
        symbole.has("6");

    const ma7=
        symbole.has("7");

    const maWeekendRozdzielony=
        ma6||
        ma7;

    /*
       DZIEŃ POWSZEDNI pokazujemy również wtedy,
       gdy kursów D nie ma, ale są kursy weekendowe.
       Wtedy tabela wyświetli "NIE KURSUJE".
    */
    if(
        maD||
        maC||
        maWeekendRozdzielony
    ){
        wynik.push({
            symbol:"D",
            tytul:"DZIEŃ POWSZEDNI"
        });
    }

    /*
       Jeżeli dane używają osobnych symboli 6 i 7,
       zawsze pokazujemy obie kolumny.
       Brakująca dostanie "NIE KURSUJE".
    */
    if(maWeekendRozdzielony){

        wynik.push({
            symbol:"6",
            tytul:"SOBOTA"
        });

        wynik.push({
            symbol:"7",
            tytul:"ŚWIĘTO"
        });
    }
    else{

        /*
           Przy układzie D/C pokazujemy SOBOTA I ŚWIĘTO
           nawet wtedy, gdy istnieją wyłącznie kursy D.
        */
        if(
            maD||
            maC
        ){
            wynik.push({
                symbol:"C",
                tytul:"SOBOTA I ŚWIĘTO"
            });
        }
    }

    /*
       Nietypowe symbole pozostają obsługiwane jak wcześniej.
    */
    [
        ...symbole
    ]
        .filter(
            s=>
                !["D","C","6","7"]
                    .includes(s)
        )
        .forEach(
            s=>{
                wynik.push({
                    symbol:s,
                    tytul:
                        "ROZKŁAD "+
                        s
                });
            }
        );

    return wynik;
}

function czyPokazacWariantJakLiniaHTML(litera){

    const znak=

        .toUpperCase();

    if(!znak){

    const publiczne=
        publiczneLiteryWariantow();

    /*
       Litera nieobecna w publicznych definicjach JSON
       jest oznaczeniem wewnętrznym przebiegu.
       Nie pokazujemy jej przy minutach ani w legendzie.
    */
    if(
        publiczne.size&&
        !publiczne.has(znak)
    ){
        return false;
    }

    const literyKierunku=
        publiczneLiteryWariantowAktualnegoKierunku();

    const liczbaWariantowKierunku=
        literyKierunku.length;

    if(
        !literyKierunku.includes(

    ){
        return false;
    }

       - literą używaną przez legendę.

       Dzięki temu A znika w obu miejscach bez późniejszego
       manipulowania DOM-em.
    */
    if(
        znak==="A"&&
        czyUkrycWariantANaAktywnymPrzystanku213()
    ){

    }

    /*
       ZASADA Z linia.html:

       A = przebieg podstawowy.

       1-3 warianty w AKTUALNYM KIERUNKU:
           A bez literki.

       4 lub więcej wariantów w AKTUALNYM KIERUNKU:
           pokazujemy również A.

       B/C/D/... pozostają normalnie widoczne.
    */
    if(
        znak==="A"&&
        liczbaWariantowKierunku<4
    ){
        return false;
    }

    /*
       Jeżeli w kierunku rzeczywiście występuje kilka
       publicznych wariantów, wariant jest publiczny.
    */
    if(
        liczbaWariantowKierunku>1
    ){

    }

       zachowujemy dotychczasową logikę opisu.

    if(znak==="A"){

    const mapa=
        mapaWariantow();

    const opis=

        mapa.get(

        )||

    return czyOznaczacWariant(

}

function kanonicznaLiteraWariantu(litera){

    const szukana=
        String(
            litera||""
        ).trim();

    if(!szukana){
        return"";
    }

    const mapa=
        mapaWariantow();

    const opis=
        mapa.get(
            szukana
        )||"";

    if(!opis){
        return szukana;
    }

    const klucz=
        normalizujOpisWariantu(
            opis
        );

    /*
       Jeżeli kilka wariantów ma identyczny opis,
       wybieramy tylko PIERWSZĄ literę występującą
       w mapie wariantów.

       Przykład:
       B = "kurs przez ..."
       C = "kurs przez ..."

       wtedy wszędzie używamy tylko B:
       - przy minutach,
       - w legendzie.
    */
    for(
        const [innaLitera,innyOpis]
        of mapa.entries()
    ){
        if(
            normalizujOpisWariantu(
                innyOpis
            )===klucz
        ){
            return String(
                innaLitera||""
            ).trim();
        }
    }

    return szukana;
}

                wymagane.length,
            oryginalny:
                String(

                oryginalna

    if(!kandydaci.length){

    kandydaci.sort(

function grupujGodziny(kursy){

    const mapa=new Map();

    kursy.forEach(
        kurs=>{

            const c=
                rozbijCzas(
                    kurs.czas
                );

            if(!c)return;

            const h=
                c.godzina%24;

            if(!mapa.has(h)){
                mapa.set(h,[]);
            }

            mapa.get(h).push({
                minuta:c.minuta,
                kurs
            });
        }
    );

    return mapa;
}



function wspolneGodzinyDlaGrup(grupy){

    const godziny=
        new Set();

    (
        grupy||
        []
    ).forEach(
        grupa=>{

            const kursy=
                pobierzKursyDlaSymbolu(
                    grupa.symbol
                );

            const mapa=
                grupujGodziny(
                    kursy
                );

            mapa.forEach(
                (wartosc,h)=>{
                    godziny.add(
                        Number(h)
                    );
                }
            );
        }
    );

    if(!godziny.size){
        return[];
    }

    /*
       Godziny traktujemy w kolejności komunikacyjnej:
       4, 5, 6 ... 23, 0, 1, 2, 3.

       Najważniejsza zmiana:
       tworzymy PEŁNY zakres od pierwszej do ostatniej godziny,
       a nie tylko godziny, w których faktycznie występują kursy.

       Przykład:
       kursy są o 6,7,8,9 oraz 14,15,...20
       => tabela dostanie również puste wiersze:
          10, 11, 12, 13.
    */

    const przesunieta=
        [...godziny]
            .map(
                h=>
                    h<4
                        ? h+24
                        : h
            )
            .sort(
                (a,b)=>a-b
            );

    const pierwsza=
        przesunieta[0];

    const ostatnia=
        przesunieta[
            przesunieta.length-1
        ];

    const wynik=[];

    for(
        let h=pierwsza;
        h<=ostatnia;
        h++
    ){
        wynik.push(
            h%24
        );
    }

    return wynik;
}

function usunDuplikatyTylkoOdKursowSkroconych(lista){

            lista.slice(

            zeStatystykami.filter(
                x=>
                    x.stat.normalne>0
            );

        /*
           Usuwamy powtórzenie TYLKO w bezpiecznym przypadku:

           - dokładnie jedno wystąpienie tej nazwy jest używane
             przez normalne / pełne kursy,
           - pozostałe wystąpienia mają wyłącznie kursy skrócone.

           Przykład linii 192:
           URSYNÓW PŁD. dla kursu skróconego +
           URSYNÓW PŁD. dla normalnych kursów do OS. KABATY

           => zostaje tylko ten drugi, normalny przystanek.

           Jeśli dwa przystanki o tej samej nazwie są rzeczywiście
           używane przez normalne kursy, NICZEGO nie łączymy.
        */
        if(
            zNormalnymi.length===1&&
            zeStatystykami.every(
                x=>
                    x===zNormalnymi[0]||
                    (
                        x.stat.normalne===0&&
                        x.stat.skrocone>0
                    )
            )
        ){
            wynik.push(
                zNormalnymi[0].element
            );
        }
        else{

            /*
               Nietypowy / niejednoznaczny przypadek:

function usunSztuczneDuplikatyWTymSamymStanieTrasy(
    lista
){

    if(
        !Array.isArray(lista)||
        lista.length<2
    ){
        return lista||[];
    }

    const wynik=[];

    let i=0;

    while(i<lista.length){

        const pierwszy=
            lista[i];

        const nazwa=
            normalizuj(
                pierwszy?.p?.nazwa
            );

        const stan=
            kluczStanuTrasy(
                stanTrasyNaPrzystanku(
                    pierwszy
                )
            );

        let j=i+1;

        while(
            j<lista.length
        ){

            const kolejny=
                lista[j];

            const tenSamPrzystanek=
                normalizuj(
                    kolejny?.p?.nazwa
                )===
                    nazwa&&
                String(
                    kolejny?.p?.nr||""
                ).trim()===
                String(
                    pierwszy?.p?.nr||""
                ).trim();

            const tenSamStan=
                kluczStanuTrasy(
                    stanTrasyNaPrzystanku(
                        kolejny
                    )
                )===
                    stan;

            if(
                !tenSamPrzystanek||
                !tenSamStan
            ){
                break;
            }

            j++;
        }

        const grupa=
            lista.slice(
                i,
                j
            );

        if(grupa.length===1){

            wynik.push(
                grupa[0]
            );

            i=j;
            continue;
        }

        const aktywny=
            grupa.find(
                element=>
                    element?.index===
                    aktualnyPrzystanek
            );

        wynik.push(
            aktywny||
            grupa[
                grupa.length-1
            ]
        );

        i=j;
    }

    return wynik;
}

function znajdzKursWariantuDoTrasy(litera){

    const pelna=
        kierunekBazowy()?.przystanki||
        [];

    const start=
        pelna[
            aktualnyPrzystanek
        ];

    if(!start){
        return null;
    }

    const kandydaci=[];

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        (rozklad,rozkladIndex418)=>{

            const p=
                znajdzPrzystanekWRozkladzieDlaElementu(
                    rozklad,
                    aktualnyKierunek,
                    {
                        p:start,
                        index:
                            aktualnyPrzystanek
                    }
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        String(
                            kurs?.wariant||""
                        ).trim().toLowerCase()!==
                        String(
                            litera||""
                        ).trim().toLowerCase()
                    ){
                        return;
                    }

                    const czas=
                        czasNaMinuty(
                            kurs?.czas
                        );

                    if(czas===null){
                        return;
                    }

                    const kandydat={
                        key:[
                            String(
                                rozkladIndex418
                            ),
                            String(
                                kurs?.numer||""
                            ),
                            String(
                                kurs?.wariant||""
                            ).trim(),
                            String(
                                kurs?.brygada||""
                            ).trim()
                        ].join("||"),
                        numer:String(
                            kurs?.numer||""
                        ),
                        wariant:String(
                            kurs?.wariant||""
                        ).trim(),
                        brygada:String(
                            kurs?.brygada||""
                        ).trim(),
                        rozkladIndex:
                            rozkladIndex418,
                        start:czas,
                        count:0,
                        ostatniIndex:-1,
                        czasDoKonca:0
                    };

                    const lista418=
                        rozklad?.kierunki?.[
                            aktualnyKierunek
                        ]?.przystanki||
                        [];

                    const pStartIndex418=
                        lista418.indexOf(p);

                    let ostatniCzas418=czas;

                    for(
                        let i418=Math.max(
                            0,
                            pStartIndex418
                        );
                        i418<lista418.length;
                        i418++
                    ){
                        const stop418=
                            lista418[i418];

                        const fizyczny418=
                            fizycznyPrzystanekWybranegoKursu417(
                                kandydat,
                                {
                                    p:stop418,
                                    index:i418
                                }
                            );

                        if(!fizyczny418){
                            continue;
                        }

                        const t418=
                            znajdzCzasKursuNaPrzystanku(
                                kandydat,
                                fizyczny418,
                                null
                            );

                        if(t418===null){
                            continue;
                        }

                        kandydat.count++;
                        kandydat.ostatniIndex=i418;

                        let tt418=t418;

                        while(tt418<czas){
                            tt418+=1440;
                        }

                        if(tt418>ostatniCzas418){
                            ostatniCzas418=tt418;
                        }
                    }

                    kandydat.czasDoKonca=
                        ostatniCzas418-czas;

                    kandydaci.push(
                        kandydat
                    );
                }
            );
        }
    );

    return kandydaci.sort(
        (a,b)=>
            b.count-a.count||
            b.ostatniIndex-a.ostatniIndex||
            b.czasDoKonca-a.czasDoKonca||
            a.start-b.start
    )[0]||null;
}

function czasWariantuNaPrzystanku(
    litera,
    element
){

    const kandydat=
        znajdzKursWariantuDoTrasy(
            litera
        );

    if(!kandydat){
        return null;
    }

    const pelna=
        kierunekBazowy()?.przystanki||
        [];

    const start=
        pelna[
            aktualnyPrzystanek
        ];

    if(!start){
        return null;
    }

    /*
       WERSJA 418:
       czas od aktywnego przystanku do wydłużenia jest liczony
       z jednego konkretnego kursu tego wariantu i z fizycznych
       słupków, które ten kurs naprawdę obsługuje.
    */
    const startFizyczny418=
        fizycznyPrzystanekWybranegoKursu417(
            kandydat,
            {
                p:start,
                index:
                    aktualnyPrzystanek
            }
        );

    const koniecFizyczny418=
        fizycznyPrzystanekWybranegoKursu417(
            kandydat,
            element
        );

    if(
        !startFizyczny418||
        !koniecFizyczny418
    ){
        return null;
    }

    const t0=
        znajdzCzasKursuNaPrzystanku(
            kandydat,
            startFizyczny418,
            null
        );

    const t=
        znajdzCzasKursuNaPrzystanku(
            kandydat,
            koniecFizyczny418,
            null
        );

    if(
        t0===null||
        t===null
    ){
        return null;
    }

    let wynik=t-t0;

    while(wynik<0){
        wynik+=1440;
    }

    return wynik;
}


function kursReferencyjnyDrugiegoKierunku(
    info
){

    if(!info){
        return null;
    }

    const mapa=
        new Map();

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const p=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    info.indexKierunku,
                    info.przystanek
                );

            (
                p?.kursy||
                []
            ).forEach(
                kurs=>{

                    if(
                        czasNaMinuty(
                            kurs?.czas
                        )===null
                    ){
                        return;
                    }

                    const key=
                        kluczKursu(kurs);

                    if(!mapa.has(key)){
                        mapa.set(
                            key,
                            {
                                ...kurs,
                                _kierunekIndex:
                                    info.indexKierunku,
                                count:0
                            }
                        );
                    }
                }
            );
        }
    );

    const pelna=
        info.kierunek?.przystanki||
        [];

    mapa.forEach(
        ref=>{

            pelna.forEach(
                p=>{

                    (
                        daneLinii?.rozkłady||
                        []
                    ).some(
                        rozklad=>{

                            const pp=
                                znajdzPrzystanekWRozkladzie(
                                    rozklad,
                                    info.indexKierunku,
                                    p
                                );

                            const jest=
                                (
                                    pp?.kursy||
                                    []
                                ).some(
                                    k=>
                                        String(
                                            k?.numer||""
                                        )===
                                            String(
                                                ref?.numer||""
                                            )&&
                                        String(
                                            k?.wariant||""
                                        ).trim()===
                                            String(
                                                ref?.wariant||""
                                            ).trim()&&
                                        czasNaMinuty(
                                            k?.czas
                                        )!==null
                                );

                            if(jest){
                                ref.count++;
                            }

                            return jest;
                        }
                    );
                }
            );
        }
    );

    return[
        ...mapa.values()
    ]
    .sort(
        (a,b)=>
            b.count-a.count
    )[0]||null;
}



function znajdzPrzystanekDrugiegoKierunkuPoDokladnymIndeksie(
    rozklad,
    info,
    element
){

    const k=
        Array.isArray(
            rozklad?.kierunki
        )
            ? rozklad.kierunki[
                info.indexKierunku
            ]
            : null;

    if(
        !k||
        !Array.isArray(
            k.przystanki
        )||
        !element
    ){
        return null;
    }

    const index=
        Number(
            element.index
        );

    const bazaP=
        element.p;

    /*
       Najpierw dokładny indeks z pełnego kierunku.
       To rozróżnia dwa kolejne PKP ZACISZE-WILNO o tej samej
       nazwie i tym samym numerze.
    */
    if(
        Number.isInteger(index)&&
        index>=0&&
        index<k.przystanki.length
    ){

        const p=
            k.przystanki[index];

        if(
            normalizuj(
                p?.nazwa
            )===
                normalizuj(
                    bazaP?.nazwa
                )&&
            String(
                p?.nr||""
            ).trim()===
                String(
                    bazaP?.nr||""
                ).trim()
        ){
            return p;
        }
    }

    /*
       Fallback dla rozkładów o nieco innej strukturze.
    */
    return znajdzPrzystanekWRozkladzie(
        rozklad,
        info.indexKierunku,
        bazaP
    );
}


function czasDrugiegoKierunku(
    info,
    element
){

    const ref=
        kursReferencyjnyDrugiegoKierunku(
            info
        );

    if(
        !ref||
        !element?.p
    ){
        return null;
    }

    let start=null;
    let cel=null;

    (
        daneLinii?.rozkłady||
        []
    ).forEach(
        rozklad=>{

            const ps=
                znajdzPrzystanekWRozkladzie(
                    rozklad,
                    info.indexKierunku,
                    info.przystanek
                );

            const pc=
                znajdzPrzystanekDrugiegoKierunkuPoDokladnymIndeksie(
                    rozklad,
                    info,
                    element
                );

            const znajdz=
                pp=>
                    (
                        pp?.kursy||
                        []
                    ).find(
                        k=>
                            String(
                                k?.numer||""
                            )===
                                String(
                                    ref?.numer||""
                                )&&
                            String(
                                k?.wariant||""
                            ).trim()===
                                String(
                                    ref?.wariant||""
                                ).trim()&&
                            czasNaMinuty(
                                k?.czas
                            )!==null
                    );

            const ks=znajdz(ps);
            const kc=znajdz(pc);

            if(ks){
                start=
                    czasNaMinuty(
                        ks.czas
                    );
            }

            if(kc){
                cel=
                    czasNaMinuty(
                        kc.czas
                    );
            }
        }
    );

    if(
        start===null||
        cel===null
    ){
        return null;
    }

    let wynik=cel-start;

    while(wynik<0){
        wynik+=1440;
    }

    return wynik;
}

function listaWydluzeniaBezPowtorzonegoKranca(
    wariant,
    baza
){

    const lista=
        Array.isArray(
            wariant?.przystanki
        )
            ? [...wariant.przystanki]
            : [];

    if(
        !lista.length||
        !Array.isArray(baza)||
        !baza.length
    ){
        return lista;
    }

    const ostatniElementBazy=
        baza[
            baza.length-1
        ];

    const ostatni=
        ostatniElementBazy?.p||
        ostatniElementBazy;

    const pierwszyElementWydluzenia=
        lista[0];

    const pierwszy=
        pierwszyElementWydluzenia?.p||
        pierwszyElementWydluzenia;

    const nazwaBazy=
        normalizuj(
            ostatni?.nazwa
        );

    const nazwaWydluzenia=
        normalizuj(
            pierwszy?.nazwa
        );

    /*
       NAJWAŻNIEJSZA ZMIANA:
       NIE patrzymy na numer przystanku.

       Jeżeli na granicy:
           trasa podstawowa -> trasa wydłużona
       występuje ta sama nazwa przystanku,
       to jest to ten sam logiczny punkt trasy i nie może
       zostać pokazany drugi raz.

       Przykład:
           ... GORASZEWSKA
           SADYBA          <- koniec trasy podstawowej
           Trasa w kursach „w”
           SADYBA          <- ten duplikat usuwamy
           WIERTNICZA

       Nawet jeśli oba wpisy SADYBA mają różne numery słupków.
    */
    if(
        nazwaBazy&&
        nazwaBazy===
        nazwaWydluzenia
    ){
        return lista.slice(1);
    }

    return lista;
}




function pozycjaAktywnegoWWydluzeniu(
    wariant,
    dane=null
){

    const daneWydluzen=
        dane||
        daneTrasWydluzonych();

    const bazaKierunku=
        kierunekBazowy()
            ?.przystanki||
        [];

    const wybranyBazowy=
        bazaKierunku[
            aktualnyPrzystanek
        ]||null;

    const przystankiWydluzenia=
        listaWydluzeniaBezPowtorzonegoKranca(
            wariant,
            daneWydluzen?.baza||[]
        );

    if(
        !przystankiWydluzenia.length||
        !wybranyBazowy
    ){
        return -1;
    }

    /*
     * 1. Najpierw dokładny indeks.
     */
    let aktywnaPozycja=
        przystankiWydluzenia.findIndex(
            element=>
                Number(
                    element?.index
                )===
                Number(
                    aktualnyPrzystanek
                )
        );

    if(aktywnaPozycja>=0){
        return aktywnaPozycja;
    }

    const nazwaWybranego=
        normalizuj(
            wybranyBazowy?.nazwa
        );

    const nrWybranego=
        String(
            wybranyBazowy?.nr||""
        ).trim();

    /*
     * 2. Dokładna nazwa + numer.
     */
    aktywnaPozycja=
        przystankiWydluzenia.findIndex(
            element=>{

                const p=
                    element?.p||
                    element;

                return(
                    normalizuj(
                        p?.nazwa
                    )===
                        nazwaWybranego&&
                    String(
                        p?.nr||""
                    ).trim()===
                        nrWybranego
                );
            }
        );

    if(aktywnaPozycja>=0){
        return aktywnaPozycja;
    }

    /*
     * 3. Jeżeli na wydłużeniu nazwa występuje tylko raz,
     *    możemy użyć samej nazwy.
     *
     *    To jest dotychczasowy fallback np. dla LNIANEJ / WIERNEJ.
     *
     *    Dla SADYBY nie zadziała błędnie, bo graniczna SADYBA
     *    jest wcześniej usuwana przez
     *    listaWydluzeniaBezPowtorzonegoKranca().
     */
    const poNazwie=
        przystankiWydluzenia
            .map(
                (element,pozycja)=>({
                    element,
                    pozycja
                })
            )
            .filter(
                item=>
                    normalizuj(
                        (
                            item.element?.p||
                            item.element
                        )?.nazwa
                    )===
                    nazwaWybranego
            );

    if(poNazwie.length===1){
        return poNazwie[0].pozycja;
    }

    return -1;
}



function numerWystapieniaNazwyAktywnego(){

    const baza=
        kierunekBazowy()
            ?.przystanki||

    const aktywny=

        ];

    if(!aktywny){
        return 0;
    }

    const nazwa=
        normalizuj(

    let wystapienie=0;

    for(

    }

    return wystapienie;
}

function renderWydluzeniaTrasy(){

    /*
       W397: minuty i każdy wiersz powstają NAJPIERW dokładnie
       przez oryginalny renderer v385. Dopiero potem porządkujemy
       dwa wydłużenia do układu:
           tylko s
           wspólny r,s
       Dzięki temu nie dotykamy działającej logiki minut v385.
    */
    const html=
        renderWydluzeniaTrasySurowe397();

    if(!html){
        return "";
    }

    const box=
        document.createElement("div");

    box.innerHTML=html;

    const bloki=
        Array.from(
            box.querySelectorAll(
                ":scope > .trasa-extra"
            )
        );

    if(bloki.length!==2){
        return html;
    }

    function litera397(blok){
        const t=
            blok.querySelector(
                ":scope > .trasa-extra-title"
            )?.textContent||"";

        const m=
            t.match(/[„"]([^”"]+)[”"]/);

        return(
            m
                ? String(m[1]).trim()
                : ""
        );
    }

    function wiersze397(blok){
        return Array.from(
            blok.querySelectorAll(
                ":scope > .trasa-extra-lista > .trasa-extra-stop"
            )
        );
    }

    function nazwa397(wiersz){
        return normalizuj(
            wiersz.querySelector(
                ".trasa-nazwa"
            )?.textContent||""
        );
    }

    const a={
        litera:litera397(bloki[0]),
        rows:wiersze397(bloki[0])
    };

    const b={
        litera:litera397(bloki[1]),
        rows:wiersze397(bloki[1])
    };

    if(
        !a.litera||
        !b.litera||
        !a.rows.length||
        !b.rows.length
    ){
        return html;
    }

    /*
       Najdłuższy wspólny KOŃCOWY odcinek po logicznej nazwie.
       Numer słupka nie rozcina przebiegu trasy.
    */
    let ia=a.rows.length-1;
    let ib=b.rows.length-1;

    while(
        ia>=0&&
        ib>=0&&
        nazwa397(a.rows[ia])===
        nazwa397(b.rows[ib])
    ){
        ia--;
        ib--;
    }

    const commonA=
        a.rows.slice(ia+1);

    if(!commonA.length){
        return html;
    }

    const prefixA=
        a.rows.slice(0,ia+1);

    const prefixB=
        b.rows.slice(0,ib+1);

    /*
       Najdłuższy własny odcinek pokazujemy pierwszy.
       Dla 338 jest to s.
    */
    const prefiksy=[
        {
            litera:a.litera,
            rows:prefixA
        },
        {
            litera:b.litera,
            rows:prefixB
        }
    ]
    .filter(x=>x.rows.length)
    .sort(
        (x,y)=>
            y.rows.length-
            x.rows.length
    );

    function blok397(litery,rows){

        if(!rows.length){
            return "";
        }

        return(
            '<div class="trasa-extra">'+
                '<div class="trasa-extra-title">'+
                    'Trasa w kursach '+
                    litery
                        .map(
                            l=>
                                '„'+
                                escapeHtml(l)+
                                '”'
                        )
                        .join(", ")+
                '</div>'+
                '<ul class="trasa-extra-lista">'+
                    rows
                        .map(
                            r=>r.outerHTML
                        )
                        .join("")+
                '</ul>'+
            '</div>'
        );
    }

    let wynik="";

    prefiksy.forEach(
        x=>{
            wynik+=
                blok397(
                    [x.litera],
                    x.rows
                );
        }
    );

    /*
       WERSJA 399

       Wspólny odcinek r,s ma pokazywać czasy przejazdu
       wariantu DŁUŻSZEGO.

       Wiersze mają już minuty policzone przez oryginalny
       renderer v385. Wybieramy więc wspólny ogon z tego
       wariantu, który przed wspólnym odcinkiem ma dłuższy
       własny przebieg.

       Dla linii 338 jest to wariant s.
    */
    const commonB=
        b.rows.slice(
            ib+1
        );

    const wspolneWiersze399=
        prefixA.length>=prefixB.length
            ? commonA
            : commonB;

    wynik+=
        blok397(
            [
                a.litera,
                b.litera
            ].sort(
                (x,y)=>
                    x.localeCompare(
                        y,
                        "pl",
                        {numeric:true}
                    )
            ),
            wspolneWiersze399
        );

    return wynik;
}



function pozycjaAktywnegoNaWyswietlanejTrasie(
    lista
){

    const source=
        Array.isArray(lista)
            ? lista
            : [];

    if(!source.length){
        return -1;
    }

    const baza=
        kierunekBazowy()
            ?.przystanki||
        [];

    const wybrany=
        baza[
            aktualnyPrzystanek
        ];

    if(!wybrany){
        return -1;
    }

    const nazwa=
        normalizuj(
            wybrany?.nazwa
        );

    const nr=
        String(
            wybrany?.nr||""
        ).trim();

    /*
       1. Najpierw dokładnie NAZWA + NUMER.
    */
    const exact=[];

    source.forEach(
        (element,pozycja)=>{

            const p=
                element?.p||
                element;

            if(
                normalizuj(
                    p?.nazwa
                )===
                    nazwa&&
                String(
                    p?.nr||""
                ).trim()===
                    nr
            ){
                exact.push(
                    pozycja
                );
            }
        }
    );

    if(exact.length===1){
        return exact[0];
    }

    /*
       Jeżeli ta sama nazwa+nr występuje więcej niż raz,
       wybieramy takie samo wystąpienie jak w kierunku bazowym.
    */
    if(exact.length>1){

        let wystapienie=0;

        for(
            let i=0;
            i<aktualnyPrzystanek;
            i++
        ){
            if(
                normalizuj(
                    baza[i]?.nazwa
                )===
                    nazwa&&
                String(
                    baza[i]?.nr||""
                ).trim()===
                    nr
            ){
                wystapienie++;
            }
        }

        return exact[
            Math.min(
                wystapienie,
                exact.length-1
            )
        ];
    }

    /*
       2. Fallback po nazwie.

       LNIANA jest na trasie tylko raz, więc nawet jeśli po złożeniu
       wariantów numer słupka nie został zachowany przy tym obiekcie,
       nadal dokładnie wiemy, który wiersz jest aktywny.
    */
    const sameName=[];

    source.forEach(
        (element,pozycja)=>{

            const p=
                element?.p||
                element;

            if(
                normalizuj(
                    p?.nazwa
                )===
                nazwa
            ){
                sameName.push(
                    pozycja
                );
            }
        }
    );

    if(sameName.length===1){
        return sameName[0];
    }

    /*
       3. Kilka razy ta sama nazwa, np. WIERNA.
       Ustalamy, które to wystąpienie nazwy w kierunku bazowym.
    */
    if(sameName.length>1){

        let wystapienieNazwy=0;

        for(
            let i=0;
            i<aktualnyPrzystanek;
            i++
        ){
            if(
                normalizuj(
                    baza[i]?.nazwa
                )===
                nazwa
            ){
                wystapienieNazwy++;
            }
        }

        return sameName[
            Math.min(
                wystapienieNazwy,
                sameName.length-1
            )
        ];
    }

    return -1;
}

function czasElementuKursowego207(
    element
){
    if(
        !element?._kursowy207
    ){
        return null;
    }

    const dane=
        daneKursowAktywnego206();

    if(!dane){
        return null;
    }

    let najlepszy=null;

    dane.przebiegi.forEach(
        info=>{

            info.punkty.forEach(
                pkt=>{

                    if(
                        normalizujNazwe208(
                            pkt.p?.nazwa
                        )!==
                        normalizujNazwe208(
                            element.p?.nazwa
                        )||
                        String(
                            pkt.p?.nr||
                            ""
                        ).trim()!==
                        String(
                            element.p?.nr||
                            ""
                        ).trim()
                    ){
                        return;
                    }

                    pkt.kursy.forEach(
                        kurs=>{

                            const m=
                                czasNaMinuty(
                                    kurs?.czas
                                );

                            if(
                                m!==null&&
                                (
                                    najlepszy===null||
                                    m<najlepszy
                                )
                            ){
                                najlepszy=m;
                            }
                        }
                    );
                }
            );
        }
    );

    if(najlepszy===null){
        return null;
    }

    /*
       czasDowolnegoKursuNaPrzystanku zwraca czas przejazdu względem
       aktywnego. Tu wyliczamy analogicznie z pierwszego aktywnego czasu.
    */
    let startMin=null;

    dane.przebiegi.forEach(
        info=>{

            const pierwszy=
                info.punkty[0];

            (
                pierwszy?.kursy||
                []
            ).forEach(
                kurs=>{

                    const m=
                        czasNaMinuty(
                            kurs?.czas
                        );

                    if(
                        m!==null&&
                        (
                            startMin===null||
                            m<startMin
                        )
                    ){
                        startMin=m;
                    }
                }
            );
        }
    );

    if(startMin===null){
        return null;
    }

    let roznica=
        najlepszy-
        startMin;

    if(roznica<0){
        roznica+=24*60;
    }

    return roznica;
}

    const liczniki=

    dostepneGrupyDni()
        .slice(0,3)
        .forEach(
            grupa=>{

                pobierzKursyDlaSymbolu(
                    grupa.symbol
                )
                .forEach(
                    kurs=>{

                        const dir=
                            Number(
                                kurs?._kierunekIndex
                            );

                        if(
                            dir!==
                            Number(
                                item.dir
                            )
                        ){
                            return;
                        }

                        const litera=
                            literaWariantuPoRzeczywistymPrzebiegu(
                                {
                                    ...kurs,
                                    symbol:grupa.symbol,
                                    _kierunekIndex:dir
                                },
                                dir
                            );

                        const wariant=
                            (
                                litera&&
                                czyPokazacWariantJakLiniaHTML(
                                    litera
                                )
                            )
                                ? String(
                                    litera
                                ).toLowerCase()
                                : "";

                        if(
                            wariant!==
                            String(
                                item.wariant||""
                            ).toLowerCase()
                        ){
                            return;
                        }

                        const ref={
                            numer:String(
                                kurs?.numer||""
                            ),
                            wariant:String(
                                kurs?.wariant||""
                            ).trim(),
                            symbol:grupa.symbol,
                            brygada:String(
                                kurs?.brygada||""
                            ).trim(),
                            _kierunekIndex:dir
                        };

                        /*
                           Dla aktualnego kierunku możemy użyć pełnej
                           listy z dokładnym rozróżnieniem wystąpień.
                        */
                        const pelna=
                            (
                                dir===
                                Number(
                                    aktualnyKierunek
                                )
                            )
                                ? listaPelnejTrasyDoWyswietlenia()
                                : (
                                    znajdzNajpelniejszyKierunek(
                                        dir
                                    )?.przystanki||
                                    []
                                ).map(
                                    (p,index)=>({
                                        p,
                                        index
                                    })
                                );

                        let ostatni=null;

                        pelna.forEach(
                            element=>{

                                if(
                                    kursMaPrzystanek(
                                        ref,
                                        element
                                    )
                                ){
                                    ostatni=
                                        element;
                                }
                            }
                        );

                        if(!ostatni){
                            return;
                        }

                        const nazwa=
                            String(
                                ostatni?.p?.nazwa||
                                ""
                            ).toUpperCase();

                        const key=
                            normalizuj(
                                nazwa
                            );

                        if(!liczniki.has(key)){
                            liczniki.set(
                                key,
                                {
                                    nazwa,
                                    ile:0
                                }
                            );
                        }

                        liczniki
                            .get(key)
                            .ile++;
                    }
                );
            }
        );

    if(!liczniki.size){
        return"";
    }

    return[
        ...liczniki.values()
    ]
    .sort(
        (a,b)=>
            b.ile-a.ile
    )[0].nazwa;
}

function renderLegenda(){

    if(
        czyBiezacyPrzystanekDwukierunkowy()
    ){
        return renderLegendaDwukierunkowa();
    }

    const mapa=
        mapaWariantow();

    if(!mapa.size){
        return"";
    }

    /*
       Legenda ma pokazywać WYŁĄCZNIE oznaczenia,
       które faktycznie występują przy minutach
       w aktualnym kierunku i na aktualnym przystanku.

       Dzięki temu warianty istniejące tylko w drugim kierunku
       nie pojawią się tutaj w legendzie.
    */
    const uzyteLitery=
        new Set();

    const grupy=
        dostepneGrupyDni()
            .slice(
                0,
                3
            );

    grupy.forEach(
        grupa=>{

            const kursy=
                pobierzKursyDlaSymbolu(
                    grupa.symbol
                );

            kursy.forEach(
                kurs=>{

                    const litera=
                        String(
                            symbolWariantu(
                                kurs,
                                grupa.symbol
                            )||""
                        )
                        .trim()
                        .toLowerCase();

                    if(litera){
                        uzyteLitery.add(
                            litera
                        );
                    }
                }
            );
        }
    );

    if(!uzyteLitery.size){
        return"";
    }

    /*
       Identyczne opisy nadal łączymy do jednej litery,
       ale tylko wtedy, gdy ta litera rzeczywiście występuje
       przy minutach w aktualnie wyświetlanym rozkładzie.
    */
    const widzianeOpisy=
        new Set();

    const wiersze=[];

    for(
        const [litera,opis]
        of mapa.entries()
    ){

        const tekst=
            String(
                opis||""
            ).trim();

        /*
           Litera trafiła tutaj tylko wtedy, gdy faktycznie
           została użyta przy minutach. Wystarczy więc publiczny
           opis z JSON-u — tak jak w linia.html.
        */
        if(!tekst){
            continue;
        }

        const literaDoPokazania=
            kanonicznaLiteraWariantu(
                litera
            )
            .toLowerCase();

        /*
           Najważniejsze:
           nie ma litery przy żadnej minucie w tym kierunku
           => nie ma jej również w legendzie.
        */
        if(
            !uzyteLitery.has(
                literaDoPokazania
            )
        ){
            continue;
        }

        const klucz=
            normalizujOpisWariantu(
                tekst
            );

        if(
            widzianeOpisy.has(
                klucz
            )
        ){
            continue;
        }

        widzianeOpisy.add(
            klucz
        );

        wiersze.push(
            '<div class="legenda-wiersz">'+
            '<span class="legenda-litera">'+
            escapeHtml(
                literaDoPokazania
            )+
            '</span>'+
            '<span class="legenda-myslnik">-</span>'+
            '<span class="legenda-opis">'+
            escapeHtml(
                window.bezMiejscowosciWKierunkuIOpisie458(
                    tekst
                )
            )+
            '</span>'+
            '</div>'
        );
    }

    if(!wiersze.length){
        return"";
    }

    /*
       Sam renderuj() opakowuje te wiersze w .legenda.
       Zwracamy więc tylko wiersze, żeby nie powstawał
       drugi margin-left i litera wariantu była dokładnie
       pod środkiem pierwszej kolumny godzin.
    */
    return(
        wiersze.join("")
    );
}

function typLinii(numer){

    const tekst=
        String(
            numer||""
        )
            .trim()
            .toUpperCase();

    if(/^Z-/.test(tekst)){
        return"LINIA ZASTĘPCZA";
    }

    const n=Number(tekst);

    if(
        Number.isFinite(n)&&
        n>=1&&
        n<=79
    ){
        return"LINIA TRAMWAJOWA";
    }

    return"LINIA ZWYKŁA";
}
