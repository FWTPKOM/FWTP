<!-- =========================================================
     FWTP — WERSJA PLIKU: 518
     BAZA: pełny kod użytkownika V493
     POPRAWKI:
     - tylko jeden nagłówek "czasy, trasa, przystanki"
     - wspólne przystanki łączone po nazwa_czysta + nr
     - obsługa: różne początki -> wspólny odcinek -> odgałęzienia
     - "TRASA W KURSACH ..." dopiero przy rzeczywistej gałęzi
     - brak "TRASA W KURSACH ..." nad początkiem listy
     - STREFA I/II raz na górze, ponownie tylko po zmianie strefy
     - po powrocie wariantu dalsze wspólne przystanki bierze trasa bazowa
     - V500: wszystkie MINIONE przystanki są wyłącznie z trasy podstawowej
     - V500: warianty są pokazywane tylko ZA aktualnym przystankiem
     - V500: historyczne odgałęzienia przed aktualnym przystankiem są ukryte
     - V501: ta sama miejscowość (np. WARSZAWA) nie jest powtarzana na gałęzi
     - V501: bez literek przy minutach opis brzmi tylko "TRASA W KURSACH"
     - V501: wspólny punkt odgałęzienia jest rozpoznawany także po samej nazwie
       (np. PROZY jest jeden raz przed rozgałęzieniem)
     - V502: bez liter przy minutach napis = "TRASA W KURSACH BEZ OZNACZEŃ"
     - V502: rzeczywisty ostatni przystanek kurs.trasa zawsze jest końcowy
       (np. METRO MŁOCINY)
     - V503: obsługa gałęzi, także do METRO MARYMONT
     - V504: gdy przy minutach nie ma A/B, NIE wypisujemy godzin
     - V504: opis brzmi dokładnie "TRASA W KURSACH BEZ OZNACZEŃ"
     - V505: opis gałęzi używa tej samej logiki widoczności liter co minuty
     - V505: kursy do METRO MARYMONT oznaczone F pokazują "TRASA W KURSACH „F”"
     - V505: ukryte A/B nadal dają "TRASA W KURSACH BEZ OZNACZEŃ"
     - V506: końcowość jest sprawdzana po nazwa_czysta + nr, nie po samej nazwie
     - V506: METRO MARYMONT 11 i 12 są rozróżniane
     - V506: tylko ostatni pasażerski słupek kurs.trasa jest końcowy
     - V506: METRO MŁOCINY jest końcowy, gdy faktycznie kończy dany kurs.trasa
     - V507: koniec trasy jest ustalany po dokładnym ID ostatniego przystanku kurs.trasa
     - V507: Metro Młociny 21 = koniec; Metro Marymont 11 = nie; Metro Marymont 12 = koniec
     - V508: każdy wiersz przechowuje dokładne ID przystanku z JSON
     - V508: po podziale na kolumny końce są nakładane ponownie z kurs.trasa
     - V508: nie polegamy już na kontekście gałęzi podczas renderowania
     - V509: naprawiono faktyczny błąd — V508 nie było wywoływane przez renderuj()
     - V509: końce z kurs.trasa są nakładane bezpośrednio po realnym renderowaniu
     - V510: prawdziwy koniec usuwa starszą klasę ma-kontynuacje-trasy
     - V510: końcowy przystanek jest zawsze pogrubiony
     - V510: kreska zawsze kończy się w środku końcowej kropki, także przy .trasa-extra
     - V511: wykryto konflikt: stare style 4xx występują PO </head> i nadpisywały V510

<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FWTP - Tabliczki</title>
<link href="../css/style.css" rel="stylesheet"/>
<style>
        /* =========================================================
           STRONA
           ========================================================= */

        .tabliczka-page {
            max-width: 1260px;
            margin: 24px auto;
            padding: 0 15px;
        }

        .sterowanie {
            margin-bottom: 18px;
            padding: 16px;

            background: #fff;

            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .sterowanie h1 {
            margin: 0 0 13px;

            font-size: 25px;
        }

        .sterowanie-grid {
            display: grid;
            grid-template-columns: 110px 1fr 1.3fr 155px auto;
            gap: 9px;
            align-items: end;
        }

        .pole {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .pole label {
            font-size: 13px;
            font-weight: 700;
        }

        .pole input,
        .pole select {
            width: 100%;
            min-height: 39px;

            padding: 7px 9px;

            background: #fff;
            color: #222;

            border: 1px solid #ccc;
            border-radius: 5px;

            font: inherit;
            font-size: 14px;

            box-sizing: border-box;
        }

        .pokaz-btn {
            min-height: 39px;
            padding: 8px 18px;

            border: 0;
            border-radius: 5px;

            background: #d61c12;
            color: #fff;

            font: inherit;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        .pokaz-btn:hover {
            background: #b8170f;
        }

        .status {
            margin-top: 9px;

            color: #666;

            font-size: 13px;
        }

        .tabliczka-scroll {
            overflow-x: auto;
            padding-bottom: 8px;

            -webkit-overflow-scrolling: touch;
        }


        /* =========================================================
           TABLICZKA - PROPORCJE WZOROWANE NA PDF
           ========================================================= */


    .tabliczka,
.tabliczka * {
    font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
}

.numer-linii-box,
.numer-linii-box * {
    font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
}

        .tabliczka {
            --lewa: 74.0%;
            --prawa: 26.0%;

            display: grid;
            grid-template-columns: var(--lewa) var(--prawa);

            width: 210mm;
            height: 160mm;
            min-height: 160mm;

            margin: 0 auto;

            background: #fff;
            color: #000000;

            border: 4px double #111;


            box-sizing: border-box;
        }

        .tabliczka.trasa-2-kol {
            --lewa: 50.5%;
            --prawa: 49.5%;
        }

        .panel-lewy {
            position: relative;

            min-width: 0;

            border-right: 0;
        }

        .panel-lewy::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            right: -3px;
            width: 1px;
            background: #777;
            z-index: 2;
        }

        .panel-prawy {
            min-width: 0;
            height: 100%;
            overflow: hidden;
        }


        /* =========================================================
           NAGŁÓWEK
           ========================================================= */

        .naglowek-tabliczki {
            display: grid;
            grid-template-columns: 150px minmax(0, 1fr);

            width: min(560px, calc(100% - 23px));

            margin: 12px 0 0 17px;
        }

        .numer-linii-box {
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;
            margin: 0;

            border: 1px solid #777;

            font-size: 80px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -2px;
            text-align: center;
            text-indent: 0;

            box-sizing: border-box;
        }

        .dane-linii {
            padding: 5px 0 0 13px;
        }

        .typ-linii {
            position: relative;
            top: -4px;
            margin-bottom: 9px;

            font-size: 17px;
            font-weight: 400;
        }

        .kierunek {
            position: relative;
            top: 2px;
            margin-bottom: 5px;

            font-size: 17px;
            font-weight: 400;
        }

        .kierunek::before {
            content: "→";
            display: inline-block;

            margin-right: 7px;
        }

        .wazny {
            font-size: 11px;
            color: #000000;
        }


        /* =========================================================
           TABELE ROZKŁADÓW
           ========================================================= */

        .rozklady-wrap {
            width: min(640px, calc(100% - 36px));

            margin: 3px 0 0 17px;
        }

        .rozklady-grid {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: max-content;
            align-items: start;
            justify-content: start;

            width: max-content;
            max-width: 100%;
        }

        .rozklady-grid.kol-1,
        .rozklady-grid.kol-2,
        .rozklady-grid.kol-3 {
            grid-template-columns: none;
            max-width: 100%;
        }

        /*
           Każdy typ dnia jest JEDNYM pudełkiem:
           tytuł dnia + Godz. + Minuty + wszystkie godziny.
           Dzięki white-space: nowrap w tytule minimalna szerokość
           całej kolumny nigdy nie będzie mniejsza niż sam napis typu dnia.
        */

        .rozklady-grid.kol-3.weekend-rowny {
            grid-template-columns: max-content repeat(2, minmax(max-content, 1fr));
        }

        .rozklady-grid.kol-3.weekend-rowny .dzien:nth-child(2),
        .rozklady-grid.kol-3.weekend-rowny .dzien:nth-child(3) {
            width: 100%;
            min-width: 100%;
        }

        .dzien {
            display: block;

            width: max-content;
            min-width: max-content;

            border: 1px solid #111;
            box-sizing: border-box;
            overflow: hidden;
        }

        .dzien + .dzien {
            margin-left: 3px;
        }

        .dzien-tytul {
            min-height: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 1px 8px 0 8px;
            font-size: 16px;
            line-height: 1.05;
            font-weight: 400;
            text-align: center;
            white-space: nowrap;
            color: #000000;
            width: auto;
            min-width: max-content;
            box-sizing: border-box;
        }

        .godziny-head {
            display: grid;
            grid-template-columns: 22px minmax(0, 1fr);
            width: 100%;

            min-height: 21px;

            border-bottom: 1px solid #111;

            font-size: 13px;
            font-weight: 400;
        }

        .godziny-head > div {
            padding: 2px 2px;
        }

        .godziny-head > div:first-child {
            padding-left: 2px;
            padding-right: 0;
        }

        .godziny-head > div:last-child {
            padding-left: 15px;
            padding-right: 2px;
        }

        .godzina-row {
            display: grid;
            grid-template-columns: 22px minmax(0, 1fr);
            width: 100%;

            min-height: 16px;
            height: 16px;
            align-items: stretch;

            border-bottom: 1px solid #d6d6d6;
            box-sizing: border-box;
        }

        .godzina-row:last-child {
            border-bottom: 0;
        }

        .godzina-cell {
            position: relative;
            left: 1px;
            padding: 0 4px 0 1px;

            border-right: 1px solid #111;

            font-size: 16px;
            line-height: 16px;
            font-weight: 800;
            text-align: right;

            height: 16px;
            box-sizing: border-box;
        }

        .minuty-cell {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 24px;
            align-items: center;
            justify-content: start;
            column-gap: 0;

            min-width: 0;
            height: 16px;

            padding: 0 1px 0 3.5px;

            font-size: 15px;
            line-height: 16px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            box-sizing: border-box;
        }

        .minuta {
            display: inline-flex;
            align-items: baseline;
            justify-content: flex-start;

            width: 24px;
            min-width: 24px;
            height: 16px;
            line-height: 16px;

            white-space: nowrap;
            
        }

        /*
           Litera wariantu ma taki sam rozmiar i tę samą linię bazową
           co minuta. Każda minuta zajmuje jednak identyczne 26 px,
           więc symbole nie rozsuwają następnych minut.
        */
        .symbol {
            position: static;

            margin-left: 0;

            font-size: 13px;
            line-height: inherit;
            font-weight: 400;
            vertical-align: baseline;
        }

        .brak {
            padding: 16px 8px;

            color: #777;

            font-size: 11px;
            text-align: center;
        }


        /*
           Tabela dla typu dnia, w którym linia nie kursuje.
           Zachowujemy dokładnie taką samą wysokość jak pozostałe
           rozkłady, ale nie pokazujemy godzin ani minut.
        */
        .nie-kursuje-body {
            position: relative;
        }

        .godzina-row-nie-kursuje {
            border-bottom: 0;
        }

        .nie-kursuje-napis {
            position: absolute;

            left: 22px;
            right: 0;
            top: 0;
            bottom: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 4px;
            text-align: center;

            pointer-events: none;
            box-sizing: border-box;
            font-family: Calibri, "Segoe UI", Arial, sans-serif;
            font-size: 13.5px;
            line-height: 1;
            font-weight: 400;
            letter-spacing: 0.75px;
            transform: scaleY(1.30);
            transform-origin: center;

        }


        /* =========================================================
           LEGENDA
           ========================================================= */

        .legenda {
            max-width: 620px;

            margin: 11px 12px 12px 17px;

            font-size: 14px;
            line-height: 1.25;
        }

        .legenda-wiersz {
            margin-top: -3px;

            display: grid;
            grid-template-columns: 22px auto minmax(0, 1fr);
            
            align-items: baseline;

            font-weight: 700;
        }

        .legenda-litera {
            display: block;

            width: 22px;
            min-width: 22px;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .legenda-myslnik {
            display: block;
            margin-left: -2px;
            margin-right: 5px;
            padding: 0;
            text-align: center;
        }

        .legenda-opis {
            display: block;
            min-width: 0;
        }


        /* =========================================================
           PIONOWY NAPIS PRZYSTANKU
           ========================================================= */

        .etykieta-przystanku {
            position: absolute;

            left: 1px;
            bottom: 13px;

            writing-mode: vertical-rl;
            transform: rotate(180deg);

            font-size: 13px;
            line-height: 1;
        }


        /* =========================================================
           TRASA - PRAWA CZĘŚĆ
           ========================================================= */

        .trasa-head {
            min-height: 24px;

            display: grid;
            grid-template-columns: 1fr;
            align-items: center;

            margin-left: 3px;
            width: calc(100% - 3px);
            padding: 2px 0;

            border-bottom: 1px solid #777;

            font-size: 13px;
            font-weight: 400;

            box-sizing: border-box;
        }

        .trasa-head.cols-2 {
            grid-template-columns: 1fr 1fr;
        }

        .trasa-head-label {
            min-width: 0;
            padding: 0 6px 0 3px;
            transform: translateY(3px);
            box-sizing: border-box;
            font-weight: 400;
        }

        .trasa-head.cols-2 .trasa-head-label:first-child {
            border-right: 0;
        }

        .trasa-columns {
            display: grid;

            height: calc(100% - 24px);
            min-height: 0;
            overflow: hidden;
        }

        .trasa-columns.cols-1 {
            grid-template-columns: 1fr;
        }

        .trasa-columns.cols-2 {
            grid-template-columns: 1fr 1fr;
        }

        .trasa-kol {
            min-width: 0;
            overflow: visible;

            /* 5 px bliżej pionowej linii oddzielającej rozkład od trasy */
            padding: 4px 2px 8px 2px;

            border-right: 1px solid #777;
        }

        .trasa-kol:last-child {
            border-right: 0;
        }

        .trasa-lista {
            margin: 0;
            padding: 0;

            list-style: none;
        }

        .trasa-stop {
            display: grid;
            grid-template-columns: 19px 12px minmax(0, 1fr) 12px;
            align-items: center;

            min-height: 16.5px;

            color: #111;

            font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
            font-size: 13.5px;
            line-height: 1;
        }

        .trasa-stop.przed {
            color: #777;
        }

        .trasa-czas {
            align-self: start;

            padding-top: 0;
            padding-right: 1px;

            text-align: right;
            white-space: nowrap;
            line-height: 15px;
        
            font-size: 13px;
        }

        .trasa-os {
            position: relative;

            align-self: stretch;
        }

        .trasa-os::before {
            content: "";

            position: absolute;

            left: 4.1px;
            top: 0;
            bottom: 0;

            width: 2.25px;

            background: currentColor;
        }

        .trasa-os::after {
            content: "";

            position: absolute;

            left: 1px;
            top: 3px;

            width: 8.5px;
            height: 8.5px;

            transform: none;

            background: currentColor;

            border-radius: 50%;
        }

        .trasa-stop.kraniec-poczatek .trasa-os::before {
            top: 8px;
        }

        .trasa-stop.kraniec-koniec .trasa-os::before {
            bottom: calc(100% - 8px);
        }

        /* Jeżeli pod trasą podstawową jest dalszy wariant/wydłużenie,
           z kropki ostatniego przystanku podstawowego wychodzi
           krótka kreska w dół. */
        .trasa-kol:has(.trasa-extra)
        .trasa-stop.kraniec-koniec
        .trasa-os::before {
            bottom: 0;
        }

        .trasa-nazwa {
            min-width: 0;

            overflow: visible;

            white-space: nowrap;
            overflow-wrap: normal;
            word-break: normal;
            hyphens: none;

            font-weight: 400;
            line-height: 1;
        }

        .trasa-stop.kraniec-poczatek .trasa-nazwa,
        .trasa-stop.kraniec-koniec .trasa-nazwa {
            font-weight: 700;
        }

        .trasa-nazwa.zawijaj {
            white-space: normal;
        }

        /* Nazwa w dwóch liniach ma własne miejsce w układzie,
           dzięki czemu kolejny przystanek nie nachodzi na drugą linię. */
        .trasa-stop:has(.trasa-nazwa.zawijaj) {
            min-height: 33px;
        }

        .trasa-nazwa.zawijaj .trasa-nazwa-aktywna {
    white-space: normal;
}

        .trasa-stop.wybrany {
            color: #111;
        }

        .trasa-stop.nz .trasa-os::after {
            background: #fff;
            border: 2px solid currentColor;
            box-sizing: border-box;
        }

        .trasa-nz {
            justify-self: end;
            align-self: start;

            position: relative;
            right: -1px;

            padding-right: 0;

            text-align: right;

            font-size: 15.5px;
            line-height: 1;
            font-weight: 400;
        }


        /* =========================================================
           BŁĄD
           ========================================================= */

        .blad {
            padding: 20px;

            background: #fff;

            border: 1px solid #ddd;
            border-radius: 7px;

            color: #666;
        }


        /* =========================================================
           RESPONSYWNOŚĆ
           ========================================================= */

        @media (max-width: 850px) {

            .sterowanie-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 560px) {

            .tabliczka-page {
                margin: 15px auto;
                padding: 0 8px;
            }

            .sterowanie-grid {
                grid-template-columns: 1fr;
            }
        }



        /* =========================================================
           TRASY WYDŁUŻONE / WARIANTOWE
           ========================================================= */

        .trasa-extra {
            margin-top: 14px;
        }


        /*
           Nagłówki pojawiające się wewnątrz głównej listy trasy,
           gdy autobus wjeżdża na odcinek wariantowy i później
           wraca na wspólną trasę.
        */
        .trasa-separator {
            display: block;
            list-style: none;
            margin: 14px 0 9px 0;
            padding: 0;
            min-height: 16px;
        }



        /* =========================================================
           WERSJA 432 — MIEJSCOWOŚCI JAK NA TABLICZCE WZORCOWEJ

           - nazwa miejscowości o 2 px mniejsza,
           - poziome kreski są wyraźniejsze,
           - pionowa oś trasy przechodzi przez cały wiersz miejscowości,
             dzięki czemu łączy kropkę przystanku nad i pod nagłówkiem.
           ========================================================= */
        .trasa-separator.trasa-miejscowosc-429 {
            display: flex;
            align-items: center;
            gap: 7px;

            /* Bez zewnętrznego marginesu: oś nie może mieć przerwy. */
            margin: 0;
            min-height: 22px;
            padding: 5px 0 3px 0;
            box-sizing: border-box;

            position: relative;

            /*
               Oś .trasa-stop znajduje się w drugiej kolumnie siatki:
               19 px + 4.1 px. Ten sam punkt prowadzimy przez separator.
            */
            background-image: linear-gradient(
                to right,
                transparent 23.1px,
                #111 23.1px,
                #111 25.35px,
                transparent 25.35px
            );
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }

        .trasa-separator.trasa-miejscowosc-429::before,
        .trasa-separator.trasa-miejscowosc-429::after {
            content: "";
            flex: 1 1 auto;
            min-width: 20px;

            /* Około 2× mocniejsze kreski niż w v430. */
            border-top: 2px dashed #777;

            /* Kreski i tekst mają być nad pionową osią. */
            position: relative;
            z-index: 1;
        }

        /*
           V432 — jeśli separator miejscowości jest pierwszym elementem
           danej kolumny, nie ma nad nim poprzedniej kropki. Dlatego
           pionowa oś nie może wychodzić ponad pierwszy przystanek.
        */
        .trasa-lista-397 > .trasa-miejscowosc-429:first-child {
            background-image: none !important;
        }

        .trasa-lista-397 > .trasa-miejscowosc-429:first-child
        + .trasa-stop .trasa-os::before,
        .trasa-lista-397 > .trasa-miejscowosc-429:first-child
        + .trasa-extra-stop .trasa-os::before {
            top: 50% !important;
            height: 50% !important;
        }

        .trasa-separator.trasa-miejscowosc-429 .trasa-separator-title {
            display: inline-block;
            width: auto;
            flex: 0 0 auto;
            padding: 0 2px;

            /* v432: nazwa miejscowości ma 8 px. */
            font-size: 8px;

            color: #777;
            font-weight: 400;
            text-align: center;
            white-space: nowrap;
            text-transform: uppercase;

            position: relative;
            z-index: 2;
            background: #fff;
        }

        .trasa-separator-title {
            display: block;
            width: 100%;
            margin: 0;
            padding: 0 4px;
            box-sizing: border-box;

            font-family: Calibri, "Segoe UI", Arial, sans-serif;
            font-size: 16px;
            line-height: 16px;
            font-weight: 400;
            color: #111;

            /*
               Jeżeli lista liter nie mieści się w szerokości kolumny,
               tekst przechodzi do następnego wiersza.
            */
            white-space: normal;
            overflow-wrap: normal;
            word-break: normal;
            text-align: center;

            transform: scaleY(1.08);
            transform-origin: center;
        }

        .trasa-extra-title {
            margin: auto auto 9px auto;
            font-size: 16px;
            line-height: 16px;
            font-weight: 400;
            color: #111;
            white-space: nowrap;
            text-align: center;
            transform-origin: center;
        }

        .trasa-extra-lista {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .trasa-extra-stop {
            display: grid;
            grid-template-columns: 19px 12px minmax(0,1fr) 12px;
            align-items: center;
            min-height: 16.5px;
            color: #111;
            font-family: Calibri, "Segoe UI", Arial, sans-serif;
            font-size: 13.5px;
            line-height: 1;
            transform: none;
        }

        .trasa-extra-stop .trasa-czas {
            text-align: right;
        }

        .trasa-extra-stop .trasa-os {
            position: relative;
            align-self: stretch;
            min-height: 16.5px;
        }

        .trasa-extra-stop .trasa-os::before {
            content: "";
            position: absolute;
            left: 4.1px;
            top: 0;
            bottom: 0;
            width: 2.25px;
            background: #111;
        }

        /* Ostatni przystanek wydłużenia:
           linia dochodzi tylko od góry do kropki. */
        .trasa-extra-stop:last-child .trasa-os::before {
            bottom: calc(100% - 8px);
        }

        .trasa-extra-stop .trasa-os::after {
            content: "";
            position: absolute;
            left: 1px;
            top: 4px;
            width: 8.5px;
            height: 8.5px;
            border-radius: 50%;
            background: #111;
        }

        .trasa-extra-stop .trasa-nazwa {
            min-width: 0;
            overflow: visible;
            white-space: nowrap;
            overflow-wrap: normal;
            word-break: normal;
            hyphens: none;
            font-weight: 400;
            line-height: 1;
            transform: scaleY(1.30);
            transform-origin: left center;
            letter-spacing: 0.75px;
        }

        /* Tylko kraniec trasy wydłużonej jest pogrubiony. */
        .trasa-extra-stop:last-child .trasa-nazwa {
            font-weight: 700;
        }

        .trasa-extra-stop .trasa-nz {
            transform: scaleY(1.30);
            transform-origin: right center;
        }

        .trasa-extra-stop .trasa-nazwa.zawijaj {
            white-space: normal;
        }

        .trasa-extra-stop:has(.trasa-nazwa.zawijaj) {
            min-height: 33px;
        }

        /*
         * Wydłużenie ma teraz ten sam stan aktywny/minięty
         * co zwykła lista przystanków.
         */
        .trasa-extra-stop.przed,
        .trasa-extra-stop.przed .trasa-nazwa,
        .trasa-extra-stop.przed .trasa-czas,
        .trasa-extra-stop.przed .trasa-nz {
            color:#777;
        }

        .trasa-extra-stop.przed .trasa-os::before,
        .trasa-extra-stop.przed .trasa-os::after {
            background:#777;
        }

        .trasa-extra-stop.wybrany {
            color:#111;
        }

        .trasa-extra-stop.wybrany .trasa-nazwa {
            transform:scaleY(1.30);
            transform-origin:left center;
        }

/* =========================================================
   DOPASOWANIE PROPORCJI CZCIONKI DO WZORU PDF
   Delikatne rozciągnięcie pionowe tekstu o 8%.
   Numer linii pozostaje bez skalowania.
   ========================================================= */

.typ-linii,
.kierunek,
.wazny,
.dzien-tytul,
.godziny-head,
.legenda,
.trasa-head-label,
.stop-time,
.stop-zadanie,
.trasa-extra-title,
.trasa-extra-stop {
    transform: scaleY(1.08);
    transform-origin: center;
}

/* Lista przystanków – mocniejsze pionowe rozciągnięcie,
   żeby efekt był widoczny również przy nazwach przystanków. */
.stop-name,
.trasa-nazwa {
    transform: scaleY(1.30);
    transform-origin: left center;
    letter-spacing: 0.75px;
}

/* Aktywny przystanek ma takie samo pionowe rozciągnięcie
   jak pozostałe nazwy przystanków — również przy dwóch liniach. */
.trasa-stop.wybrany .trasa-nazwa {
    transform: scaleY(1.30);
    transform-origin: left center;
}

.trasa-nazwa-aktywna {
    position: relative;
    display: inline;

    padding: 0;
    margin: 0;

    /* KLUCZOWE:
       aktywny ma dokładnie taki sam line-height jak zwykła nazwa. */
    line-height: 1;

    color: #fff;
    font-weight: inherit;
    letter-spacing: inherit;

    vertical-align: baseline;

    /* Tło jest tylko dekoracją tekstu i nie zmienia wysokości linii. */
    background:
        linear-gradient(
            to bottom,
            transparent 0,
            transparent 1.55px,
            #111 1.55px,
            #111 calc(100% - 1.55px),
            transparent calc(100% - 1.55px),
            transparent 100%
        );

    box-shadow: none;

    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
}


/* Symbol „ż” rozciągnięty pionowo tak samo jak lista przystanków. */
.trasa-nz {
    transform: scaleY(1.30);
    transform-origin: right center;
}

/* Godziny i minuty bez pionowego skalowania. */
.godzina-cell {
    transform: none;
}

/* Minuty rozciągnięte tylko pionowo.
   Nie zmieniamy letter-spacing ani szerokości komórki,
   więc cyfry nie są od siebie bardziej odsunięte. */
.minuta {
    transform: scaleY(1.12);
    transform-origin: left center;
    letter-spacing: 0;
    font-weight: 500;
}

/* Elementy, które miały już własny transform, wymagają połączenia transformacji. */
.typ-linii {
    transform: translateY(1px) scaleY(1.08);
}

.kierunek {
    transform: translateY(2px) scaleY(1.08);
}

.trasa-head-label {
    transform: translateY(3px) scaleY(1.08);
}




/* =========================================================
   KOLORY TEKSTÓW
   ========================================================= */

.dzien-tytul,
.godziny-head,
.trasa-stop:not(.przed),
.trasa-stop:not(.przed) .trasa-nazwa,
.trasa-stop:not(.przed) .trasa-czas,
.trasa-stop:not(.przed) .trasa-nz {
    color: #000000;
}

/* Przystanki już minięte pozostają takie jak wcześniej. */
.trasa-stop.przed {
    color: #777;
}


        /* =========================================================
           OPISY WARIANTÓW TRASY — CZCIONKA JAK LISTA PRZYSTANKÓW
           ========================================================= */

        .trasa-separator-title,
        .trasa-extra-title {
            font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
            font-size: 13.5px !important;
            line-height: 1 !important;
            font-weight: 400 !important;
            letter-spacing: 0.75px !important;
            transform: scaleY(1.30) !important;
            transform-origin: center !important;
        }



/* =========================================================
   "NIE KURSUJE" — JEDNA LINIA, JEŻELI KOLUMNA MA MIEJSCE
   ========================================================= */

/*
   Tekst nie może sam zawijać się na dwie linie.
   Jeżeli układ ma wystarczająco dużo miejsca na tabelę dnia,
   napis pozostaje jako "NIE KURSUJE" w jednej linii.

   Szerokości całej sekcji rozkładów nie zwiększamy tutaj,
   więc lista przystanków nadal ma pierwszeństwo i nie może
   zostać przykryta przez rozkład.
*/
.nie-kursuje,
.nie-kursuje-tekst {
    white-space: nowrap !important;
    word-break: keep-all !important;
    overflow-wrap: normal !important;
}

/*
   Jeżeli kontener "NIE KURSUJE" jest flexem/gridem,
   pozwalamy tekstowi wykorzystać całą dostępną szerokość
   części minutowej.
*/
.nie-kursuje-tekst {
    width: max-content;
    max-width: none;
}


/* =========================================================
   ŁADOWANIE TABLICZKI – AUTOBUS NA PASKU
   Wygląd taki sam jak w brygady.html.
   Loader pozostaje widoczny aż do zakończenia renderowania.
   ========================================================= */

.tabliczka-loader{
    padding:28px 20px 30px;
    background:#ffffff;
    border:1px solid #dddddd;
    border-radius:8px;
    box-sizing:border-box;
    text-align:center;
    margin-bottom:16px;
}

.tabliczka-loader-title{
    margin:0 0 22px;
    color:#222222;
    font-size:16px;
    font-weight:800;
}

.tabliczka-loader-road{
    position:relative;
    width:min(650px,100%);
    height:62px;
    margin:0 auto;
    overflow:visible;
}

.tabliczka-loader-track{
    position:absolute;
    left:0;
    right:0;
    top:50%;
    height:9px;
    transform:translateY(-50%);
    overflow:hidden;
    background:#e4e4e4;
    border:1px solid #c7c7c7;
    border-radius:999px;
    box-sizing:border-box;
}

.tabliczka-loader-progress{
    width:0%;
    height:100%;
    background:#d61c12;
    border-radius:999px;
    transition:width .30s ease;
}

.tabliczka-loader-bus{
    position:absolute;
    left:0%;
    top:50%;
    width:125px;
    height:auto;
    max-height:54px;
    object-fit:contain;
    transform:translate(-50%,-50%);
    z-index:3;
    transition:left .30s ease;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));
    pointer-events:none;
}

.tabliczka-loader-percent{
    margin-top:7px;
    color:#d61c12;
    font-size:18px;
    font-weight:900;
}

.tabliczka-loader-stage{
    margin-top:4px;
    min-height:15px;
    color:#666666;
    font-size:12px;
}

.tabliczka-loader-progress.gotowe{
    width:100%!important;
}

.tabliczka-loader-bus.gotowe{
    left:100%!important;
}

@media(max-width:550px){
    .tabliczka-loader{
        padding:24px 10px 26px;
    }

    .tabliczka-loader-road{
        width:86%;
    }

    .tabliczka-loader-bus{
        width:96px;
        height:auto;
        max-height:46px;
    }
}

/* =========================================================
   AKTYWNY PRZYSTANEK – JEDNAKOWE TŁO
   =========================================================
   .trasa-extra-stop jest globalnie skalowany scaleY(1.08),
   a zwykły .trasa-stop nie. To powodowało inną wysokość
   czarnego tła aktywnego przystanku w trasie wydłużonej.

   Dla aktywnego extra-stop wyłączamy tylko skalowanie RODZICA.
   Sama nazwa nadal ma identyczne scaleY(1.30) i korzysta z tej
   samej klasy .trasa-nazwa-aktywna co zwykły przystanek.
   ========================================================= */

.trasa-extra-stop.wybrany {
    transform: none !important;
}

.trasa-extra-stop.wybrany .trasa-nazwa {
    transform: scaleY(1.30) !important;
    transform-origin: left center !important;
    line-height: 1 !important;
}

.trasa-extra-stop.wybrany .trasa-nazwa-aktywna {
    line-height: 1 !important;
    padding: 0 !important;
    margin: 0 !important;
}


/* =========================================================
   TYLKO WYGLĄD:
   aktywny pierwszy widoczny przystanek w układzie
   dwukierunkowym nie jest pogrubiony.
   Bez zmian w logice JS.
   ========================================================= */

.tabliczka.trasa-2-kol
.trasa-columns
.trasa-kol:first-child
.trasa-stop.wybrany.kraniec-poczatek
.trasa-nazwa,

.tabliczka.trasa-3-kol
.trasa-columns
.trasa-kol:first-child
.trasa-stop.wybrany.kraniec-poczatek
.trasa-nazwa,

.tabliczka.trasa-2-kol
.trasa-columns
.trasa-kol:first-child
.trasa-stop.wybrany.kraniec-poczatek
.trasa-nazwa-aktywna,

.tabliczka.trasa-3-kol
.trasa-columns
.trasa-kol:first-child
.trasa-stop.wybrany.kraniec-poczatek
.trasa-nazwa-aktywna {
    font-weight:400 !important;
}


/* =========================================================
   PIERWSZY AKTYWNY PRZYSTANEK – LINIA WYCHODZI Z KROPKI W DÓŁ
   =========================================================
   Tylko wygląd osi. Bez zmian w logice trasy.
   Jeżeli aktywny przystanek jest pierwszym widocznym punktem,
   kreska ma zaczynać się w środku kropki i iść do samego dołu
   wiersza, tak aby łączyła się z następnym przystankiem.
   ========================================================= */




/* =========================================================
   LINIA NAD AKTYWNYM PRZYSTANKIEM
   =========================================================
   Tylko jeśli aktywny pierwszy przystanek występuje w obu kierunkach.
   Zwykły przystanek początkowy NIE ma linii nad kropką.
   ========================================================= */

.trasa-stop.aktywny-poczatek-dwukierunkowy .trasa-os::before {
    top: 0 !important;
    bottom: 0 !important;
}


/* =========================================================
   V159 — aktywny pierwszy przystanek (np. SADYBA 01)
   Czarna kropka, czas 0 i oś również do góry.
   Nie dotyczy zwykłego nieaktywnego przystanku początkowego.
   ========================================================= */
.trasa-stop.aktywny-pierwszy .trasa-os::before {
    top: -8.25px !important;
    height: calc(100% + 8.25px) !important;
    background: #111 !important;
}
.trasa-stop.aktywny-pierwszy .trasa-os::after {
    background: #111 !important;
    border-color: #111 !important;
}
.trasa-stop.aktywny-pierwszy .trasa-czas {
    color: #111 !important;
}


/* =========================================================
   V160 — aktywny przystanek na granicy wariantu
   np. SADYBA 01 przy wydłużeniu do WILANOWA
   ========================================================= */
.trasa-stop.aktywny-granica-wariantu .trasa-os::before {
    top: 0 !important;
    bottom: 0 !important;
    height: auto !important;
    background:#111 !important;
}
.trasa-stop.aktywny-granica-wariantu .trasa-os::after {
    background:#111 !important;
    border-color:#111 !important;
}
.trasa-stop.aktywny-granica-wariantu .trasa-czas {
    color:#111 !important;
}


/* =========================================================
   v165 — wcześniejsze wystąpienie tej samej nazwy
   nie może wyglądać jak aktywny przystanek.
   Np. 170 / WIERNA 02: pierwsza WIERNA ma szarą kropkę
   i szarą linię, aktywna pozostaje tylko druga WIERNA.
   ========================================================= */

.trasa-stop.nieaktywny-duplikat {
    color: #777 !important;
}

.trasa-stop.nieaktywny-duplikat .trasa-nazwa,
.trasa-stop.nieaktywny-duplikat .trasa-czas,
.trasa-stop.nieaktywny-duplikat .trasa-nz {
    color: #777 !important;
}

.trasa-stop.nieaktywny-duplikat .trasa-os::before {
    background: #777 !important;
}

.trasa-stop.nieaktywny-duplikat .trasa-os::after {
    background: #777 !important;
    border-color: #777 !important;
}


/* =========================================================
   v166 — NIEAKTYWNY / PRZEJECHANY PRZYSTANEK
   Jeżeli przystanek jest nieaktywny, nie tylko nazwa,
   ale również jego kropka i linia osi mają być szare.
   Aktywny przystanek (.wybrany) pozostaje czarny.
   ========================================================= */

.trasa-stop.przed:not(.wybrany) .trasa-os::before {
    background: #777 !important;
}

.trasa-stop.przed:not(.wybrany) .trasa-os::after {
    background: #777 !important;
    border-color: #777 !important;
}

/* NŻ pozostaje pustą kropką, ale jej obwód jest szary. */
.trasa-stop.przed:not(.wybrany).nz .trasa-os::after {
    background: #fff !important;
    border-color: #777 !important;
}

/* Wcześniejsze, fałszywe wystąpienie tej samej nazwy
   również zawsze ma szarą oś i kropkę. */
.trasa-stop.nieaktywny-duplikat .trasa-os::before {
    background: #777 !important;
}

.trasa-stop.nieaktywny-duplikat .trasa-os::after {
    background: #777 !important;
    border-color: #777 !important;
}

.trasa-stop.nieaktywny-duplikat.nz .trasa-os::after {
    background: #fff !important;
    border-color: #777 !important;
}


/* =========================================================
   v167 — STAŁA WYSOKOŚĆ NAGŁÓWKA
   =========================================================
   Dwuliniowy kierunek nie może spychać tabeli rozkładu w dół.
   Dolna krawędź pola numeru linii i początek tabeli pozostają
   w tym samym miejscu jak przy jednym kierunku.
   ========================================================= */

.naglowek-tabliczki {
    height: 80px;
    min-height: 80px;
    align-items: start;
}

.naglowek-tabliczki:has(.kierunki-dwa) .dane-linii {
    padding-top: 2px;
}

.naglowek-tabliczki:has(.kierunki-dwa) .typ-linii {
    margin-bottom: 4px;
}

.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa {
    top: -7px;
    margin-bottom: -7px;
}

.naglowek-tabliczki:has(.kierunki-dwa) .wazny {
    position: relative;
    top: -4px;
}


/* =========================================================
   v167 — AUTOMATYCZNY TRYB DWÓCH TABLICZEK
   =========================================================
   Włącza się tylko wtedy, gdy kilka tabel dni nie mieści się
   w lewym panelu i zaczyna nachodzić na listę przystanków.

   Strona 1:
   - DZIEŃ POWSZEDNI
   - pełna lista przystanków / przebieg trasy

   Strona 2:
   - SOBOTA / NIEDZIELA / ŚWIĘTO (wszystkie dni pozostałe)
   - komunikat odsyłający do tabliczki DZIEŃ POWSZEDNI
   ========================================================= */

.tabliczka-scroll.tryb-dwoch-tabliczek {
    overflow-x: auto;
}

.tabliczka.strona-dzien-powszedni,
.tabliczka.strona-weekend {
    margin-left: auto;
    margin-right: auto;
}

.tabliczka.strona-weekend {
    margin-top: 18px;
    --lewa: 74%;
    --prawa: 26%;
}

.tabliczka.strona-weekend.trasa-2-kol,
.tabliczka.strona-weekend.trasa-3-kol {
    --lewa: 74%;
    --prawa: 26%;
}

.tabliczka.strona-weekend .panel-prawy {
    position: relative;
}

.tabliczka.strona-weekend .trasa-przeniesiona-info {
    height: 100%;
    box-sizing: border-box;
    padding: 17px 13px 12px 13px;

    display: flex;
    align-items: flex-start;
    justify-content: flex-start;

    font-family: Calibri, "Segoe UI", Arial, sans-serif !important;
    font-size: 14px;
    line-height: 1.15;
    font-weight: 700;
    text-align: left;
}

.tabliczka.strona-weekend .rozklady-grid {
    max-width: 100%;
}

.tabliczka.strona-weekend .rozklady-grid .dzien + .dzien {
    margin-left: 3px;
}

/* Na drugiej tabliczce SOBOTA i ŚWIĘTO/NIEDZIELA mogą wykorzystać
   cały dostępny lewy panel, ale zachowują naturalne szerokości. */
.tabliczka.strona-weekend .rozklady-wrap {
    width: calc(100% - 36px);
}

@media print {
    .tabliczka.strona-weekend {
        break-before: page;
        page-break-before: always;
    }
}


/* =========================================================
   v168 — ETAP 1: TRYB KOMPAKTOWY
   Najpierw próbujemy zmieścić całość na JEDNEJ tabliczce.
   Dopiero jeśli to nadal nie wystarczy, uruchamiane są dwie strony.
   ========================================================= */

.tabliczka.tryb-kompaktowy.trasa-2-kol {
    --lewa: 60%;
    --prawa: 40%;
}

.tabliczka.tryb-kompaktowy.trasa-3-kol {
    --lewa: 55%;
    --prawa: 45%;
}

.tabliczka.tryb-kompaktowy .rozklady-wrap {
    width: calc(100% - 34px);
}

.tabliczka.tryb-kompaktowy .rozklady-grid {
    width: 100%;
    max-width: 100%;
    grid-auto-columns: auto;
}

.tabliczka.tryb-kompaktowy .dzien {
    min-width: 0 !important;
    max-width: none;
}

/*
   Godzina może mieć 2 wiersze minut.
   Sama kolumna godzin rozciąga się wtedy na pełną wysokość wiersza.
*/
.tabliczka.tryb-kompaktowy .godzina-row {
    height: auto;
    min-height: 16px;
    align-items: stretch;
}

.tabliczka.tryb-kompaktowy .godzina-cell {
    height: auto;
    min-height: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    line-height: 16px;
}

.tabliczka.tryb-kompaktowy .minuty-cell {
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    align-items: center;

    height: auto;
    min-height: 16px;

    white-space: normal;
    overflow: visible;
}

.tabliczka.tryb-kompaktowy .minuta {
    flex: 0 0 24px;
    width: 24px;
    min-width: 24px;
}

/*
   Przy węższej liście przystankowej pozwalamy częściej
   zawijać długie nazwy na 2 wiersze zamiast zabierać szerokość.
*/
.tabliczka.tryb-kompaktowy .trasa-stop {
    min-height: 16.5px;
}

/* Druga strona ma powstać dopiero PO nieudanej próbie kompaktowej. */
.tabliczka.strona-weekend {
    --lewa: 74%;
    --prawa: 26%;
}


/* =========================================================
   v169 — NAGŁÓWEK Z DWOMA KIERUNKAMI
   ========================================================= */
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa {
    top: -12px !important;
    margin-bottom: -12px !important;
}

.naglowek-tabliczki:has(.kierunki-dwa) .wazny {
    position: relative;
    top: -9px !important;
}

/* =========================================================
   v169 — DWULINIOWE PRZYSTANKI
   Zachowujemy starą poprawną wysokość.
   ========================================================= */
.tabliczka.tryb-kompaktowy .trasa-nazwa {
    white-space: nowrap;
}

.tabliczka.tryb-kompaktowy .trasa-nazwa.zawijaj {
    white-space: normal !important;
}

.tabliczka.tryb-kompaktowy .trasa-stop:has(.trasa-nazwa.zawijaj) {
    min-height: 33px !important;
}

/* =========================================================
   v169 — DZIEŃ POWSZEDNI W TRYBIE KOMPAKTOWYM
   Wymuszamy węższą tabelę, aby przy godzinach z dużą liczbą kursów
   minuty przechodziły do drugiego wiersza.
   ========================================================= */
.tabliczka.tryb-kompaktowy .dzien.dzien-powszedni-kompakt {
    width: 246px !important;
    min-width: 246px !important;
    max-width: 246px !important;
}

.tabliczka.tryb-kompaktowy .dzien.dzien-powszedni-kompakt .godzina-row {
    height: auto !important;
    min-height: 16px !important;
    align-items: stretch !important;
}

.tabliczka.tryb-kompaktowy .dzien.dzien-powszedni-kompakt .godzina-cell {
    height: auto !important;
    min-height: 16px !important;
    display: flex !important;
    align-items: flex-start !important;
    justify-content: flex-end !important;
}

.tabliczka.tryb-kompaktowy .dzien.dzien-powszedni-kompakt .minuty-cell {
    display: flex !important;
    flex-wrap: wrap !important;
    align-content: flex-start !important;
    align-items: center !important;
    height: auto !important;
    min-height: 16px !important;
    overflow: visible !important;
    white-space: normal !important;
}

.tabliczka.tryb-kompaktowy .dzien.dzien-powszedni-kompakt .minuta {
    flex: 0 0 24px !important;
    width: 24px !important;
    min-width: 24px !important;
}


/* =========================================================
   v170 — WIĘCEJ MIEJSCA NA LISTĘ PRZYSTANKÓW
   ========================================================= */

.tabliczka.tryb-kompaktowy.trasa-2-kol {
    --lewa: 57%;
    --prawa: 43%;
}

.tabliczka.tryb-kompaktowy.trasa-3-kol {
    --lewa: 53%;
    --prawa: 47%;
}

/* Jednoliniowy przystanek zostaje jednoliniowy.
   Tylko .zawijaj może dostać 2 linie. */
.tabliczka.tryb-kompaktowy .trasa-nazwa:not(.zawijaj) {
    white-space: nowrap !important;
    overflow-wrap: normal !important;
    word-break: normal !important;
}

.tabliczka.tryb-kompaktowy .trasa-stop:not(:has(.trasa-nazwa.zawijaj)) {
    min-height: 16.5px !important;
}


/* =========================================================
   v170 — RÓWNE WYSOKOŚCI GODZIN WE WSZYSTKICH DNIACH
   =========================================================
   Jeżeli dana godzina w którymkolwiek dniu ma minuty w 2 wierszach,
   ta sama godzina we wszystkich pozostałych tabelach ma dostać
   taką samą wysokość.
   ========================================================= */

.tabliczka.tryb-kompaktowy .godzina-row.wiersz-dwuliniowy {
    min-height: 32px !important;
    height: 32px !important;
}

.tabliczka.tryb-kompaktowy .godzina-row.wiersz-dwuliniowy .godzina-cell {
    min-height: 32px !important;
    height: 32px !important;
}

.tabliczka.tryb-kompaktowy .godzina-row.wiersz-dwuliniowy .minuty-cell {
    min-height: 32px !important;
    height: 32px !important;
}


/* =========================================================
   WERSJA 175 — DWULINIOWE NAZWY PRZYSTANKÓW
   ========================================================= */

.trasa-nazwa.zawijaj {
    line-height: 0.9 !important;
}

.trasa-extra-stop .trasa-nazwa.zawijaj {
    line-height: 0.9 !important;
}


/* =========================================================
   WERSJA 176 — JEDNOWYRAZOWE NAZWY ZAWSZE W JEDNEJ LINII
   ========================================================= */

.trasa-nazwa.nazwa-jednowyrazowa,
.trasa-nazwa.nazwa-jednowyrazowa.zawijaj {
    white-space: nowrap !important;
    word-break: keep-all !important;
    overflow-wrap: normal !important;
    hyphens: none !important;

    width: max-content !important;
    min-width: max-content !important;
    max-width: none !important;
}

/* Jednowyrazowy przystanek nie może dostać wysokości 2 wierszy. */
.trasa-stop:has(.trasa-nazwa.nazwa-jednowyrazowa) {
    min-height: 16.5px !important;
}


/* =========================================================
   WERSJA 177 — JEDNOWYRAZOWE BEZ MYŚLNIKA
   ========================================================= */

/*
   Jedno słowo bez myślnika, np. NOWOURSYNOWSKA,
   musi zawsze zostać w jednej linii.
*/
.trasa-nazwa.nazwa-jednowyrazowa {
    white-space: nowrap !important;
    word-break: keep-all !important;
    overflow-wrap: normal !important;
    hyphens: none !important;
}

/*
   Nazwy z myślnikami nie są objęte tą blokadą
   i mogą przechodzić do 2 wierszy.
*/


/* =========================================================
   WERSJA 180 — PIERWSZY WIDOCZNY PRZYSTANEK PASAŻERSKI
   NIE MA KRESKI DO GÓRY
   ========================================================= */

.trasa-stop.pierwszy-pasazerski .trasa-os::before {
    top: 50% !important;
    bottom: 0 !important;
    height: auto !important;
}

/*
   Jeśli wcześniejsza logika rysuje oś innym pseudo-elementem,
   górna część jest dodatkowo maskowana białym tłem.
*/
.trasa-stop.pierwszy-pasazerski .trasa-os {
    overflow: hidden !important;
}


/* =========================================================
   WERSJA 181 — AUTOMATYCZNIE 9 LUB 8 KURSÓW NA GODZINĘ
   ========================================================= */

/*
   Tryb awaryjny włącza JS dopiero wtedy, gdy wariant z 9 kursami
   nie mieści całej tabliczki na jednej stronie.

   Nie zwężamy samych pól minut. Zachowują swoją normalną szerokość.
   Ograniczamy jedynie szerokość obszaru minut tak, żeby w jednym
   rzędzie mogło znaleźć się maksymalnie 8 pozycji.
*/
.tabliczka.max-8-kursow .minuty-cell {
    flex-wrap: wrap !important;
}

/*
   Wartość szerokości jest ustawiana przez JS na podstawie
   faktycznej szerokości pojedynczej .minuta i odstępów.
*/
.tabliczka.max-8-kursow .minuty-cell.limit-8-kursow {
    width: var(--szerokosc-8-kursow) !important;
    max-width: var(--szerokosc-8-kursow) !important;
}


/* =========================================================
   WERSJA 182 — TECH NIGDY NIE JEST WIDOCZNY NA TABLICZCE
   ========================================================= */

.trasa-stop[data-typ="TECH"],
.trasa-stop[data-typ="tech"],
.trasa-extra-stop[data-typ="TECH"],
.trasa-extra-stop[data-typ="tech"] {
    display: none !important;
}


/* =========================================================
   WERSJA 183 — TRYB 8 KURSÓW = OKOŁO 225 PX
   ========================================================= */

.tabliczka.max-8-kursow .minuty-cell.limit-8-kursow {
    width: 225px !important;
    max-width: 225px !important;
}


/* =========================================================
   FWTP — WERSJA 184
   1) NATURALNY UKŁAD — MINUTY W 1 WIERSZU
   2) JEŚLI SIĘ NIE MIEŚCI -> DZIEŃ POWSZEDNI 246px
   3) JEŚLI NADAL NIE -> DZIEŃ POWSZEDNI 225px
   4) JEŚLI NADAL NIE -> 2 STRONY
   ========================================================= */

.tabliczka.etap-246.tryb-kompaktowy
.dzien.dzien-powszedni-kompakt {
    width: 246px !important;
    min-width: 246px !important;
    max-width: 246px !important;
}

.tabliczka.etap-225.tryb-kompaktowy
.dzien.dzien-powszedni-kompakt {
    width: 225px !important;
    min-width: 225px !important;
    max-width: 225px !important;
}

.tabliczka.etap-246.tryb-kompaktowy
.dzien.dzien-powszedni-kompakt .minuty-cell,
.tabliczka.etap-225.tryb-kompaktowy
.dzien.dzien-powszedni-kompakt .minuty-cell {
    display: flex !important;
    flex-wrap: wrap !important;
    white-space: normal !important;
    overflow: visible !important;
}

/* wyłączenie starego limitu 8 z v183 */
.tabliczka.max-8-kursow .minuty-cell.limit-8-kursow {
    width: auto !important;
    max-width: none !important;
}


/* =========================================================
   WERSJA 187 — PODWÓJNY WIERSZ = DOKŁADNIE 32 PX
   ========================================================= */
.tabliczka.tryb-kompaktowy .godzina-row.wiersz-dwuliniowy,
.tabliczka.tryb-kompaktowy .godzina-row.wiersz-dwuliniowy .godzina-cell,
.tabliczka.tryb-kompaktowy .godzina-row.wiersz-dwuliniowy .minuty-cell {
    height: 32px !important;
    min-height: 32px !important;
    max-height: 32px !important;
    box-sizing: border-box !important;
}


/* =========================================================
   WERSJA 191 — BAZA v188
   ETAP 245 PX = 9 KURSÓW W JEDNYM WIERSZU
   ========================================================= */

/*
   Cały typ dnia nadal ma 246 px.
*/
.tabliczka.etap-246.tryb-kompaktowy
.dzien.dzien-powszedni-kompakt {
    width: 246px !important;
    min-width: 246px !important;
    max-width: 246px !important;
}

/*
   W etapie 245 nie zmniejszamy pojedynczych minut.
   Zmniejszamy tylko szerokość kolumny "Godz." do niezbędnego minimum,
   dzięki czemu obszar minut dostaje wystarczająco dużo miejsca na
   9 normalnych pozycji w jednym rzędzie.
*/
.tabliczka.etap-246.tryb-kompaktowy
.dzien.dzien-powszedni-kompakt .godzina-row,
.tabliczka.etap-246.tryb-kompaktowy
.dzien.dzien-powszedni-kompakt .naglowek-kolumn {
    grid-template-columns: 21px minmax(0, 1fr) !important;
}

/*
   W etapie 245 minuty mogą się zawijać dopiero wtedy,
   gdy jest ich WIĘCEJ niż 9.
*/
.tabliczka.etap-246.tryb-kompaktowy
.dzien.dzien-powszedni-kompakt .minuty-cell {
    min-width: 0 !important;
    max-width: none !important;
}

/*
   Pojedyncza minuta zachowuje normalną szerokość z bazowego kodu.
   Nie stosujemy tutaj starego limitu 8.
*/
.tabliczka.etap-246.tryb-kompaktowy
.dzien.dzien-powszedni-kompakt .minuta {
    flex: 0 0 24px !important;
    width: 24px !important;
    min-width: 24px !important;
}


/* =========================================================
   FWTP — WERSJA 194
   .rozklady-wrap DOPASOWANY DO RZECZYWISTYCH TABEL
   ========================================================= */

.tabliczka .rozklady-wrap {
    width: fit-content !important;
    min-width: 0 !important;
    max-width: 100% !important;
    flex: 0 0 auto !important;
    align-self: flex-start !important;
}

.tabliczka .rozklady-grid {
    width: fit-content !important;
    min-width: 0 !important;
    max-width: none !important;
    justify-content: flex-start !important;
}

/*
   W etapach 246 / 225 wrap nadal dopasowuje się dokładnie
   do sumy rzeczywistych tabel typu dnia.
*/
.tabliczka.etap-246 .rozklady-wrap,
.tabliczka.etap-225 .rozklady-wrap {
    width: fit-content !important;
    min-width: 0 !important;
    max-width: 100% !important;
}


/* =========================================================
   FWTP — WERSJA 197
   DWA KIERUNKI + "WAŻNY OD"
   ========================================================= */

/*
   W starszych wersjach dwa kierunki były sztucznie przesuwane
   do góry (top:-12px). To powodowało wejście napisu "Ważny od"
   na drugi kierunek.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa {
    top: 0 !important;
    margin-bottom: 0 !important;
    transform: none !important;
}

/*
   Nagłówek z dwoma kierunkami jest punktem odniesienia
   dla daty ważności.
*/
.naglowek-tabliczki:has(.kierunki-dwa) {
    position: relative !important;
}

/*
   "Ważny od" kończy się przy dolnej krawędzi nagłówka,
   czyli na tej samej wysokości co dolna ramka pola numeru linii.
   Nie zabiera już miejsca drugiemu kierunkowi.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .wazny {
    position: absolute !important;
    top: auto !important;
    bottom: 1px !important;
    margin: 0 !important;
    line-height: 1 !important;
}

/*
   Zostawiamy nad datą minimalny odstęp od drugiego kierunku.
*/
.naglowek-tabliczki:has(.kierunki-dwa) .kierunki-dwa {
    padding-bottom: 12px !important;
}



/* =========================================================
   WERSJA 209 — KONIEC RZECZYWISTEGO PRZEBIEGU KURSU
   ========================================================= */

.trasa-stop.koniec-kursu-209 .trasa-nazwa,
.trasa-stop.koniec-kursu-209 .trasa-nazwa-aktywna {
    font-weight: 700 !important;
}

.trasa-stop.koniec-kursu-209 .trasa-os::before {
    bottom: 50% !important;
}

.trasa-stop.koniec-kursu-209 .trasa-os::after {
    display: none !important;
}



/* =========================================================
   WERSJA 210 — OSTATNI WIDOCZNY PRZYSTANEK
   ========================================================= */

.trasa-stop.koniec-trasy-210 .trasa-nazwa,
.trasa-stop.koniec-trasy-210 .trasa-nazwa-aktywna {
    font-weight: 700 !important;
}

/*
   Oś w tym projekcie jest rysowana pseudo-elementem ::before.
   Na ostatnim przystanku ma dochodzić tylko DO środka kropki.
*/
.trasa-stop.koniec-trasy-210 .trasa-os::before {
    bottom: 50% !important;
    height: auto !important;
}

/* zabezpieczenie, jeśli któryś wariant CSS używa ::after */
.trasa-stop.koniec-trasy-210 .trasa-os::after {
    display: none !important;
}



/* =========================================================
   WERSJA 211 — KROPKA NA OSTATNIM PRZYSTANKU
   ========================================================= */

/*
   Ostatni widoczny przystanek musi mieć normalną czarną kropkę.
   Rysujemy ją bezpośrednio na elemencie osi, niezależnie od tego,
   który pseudo-element w starszych regułach odpowiada za punkt.
*/
.trasa-stop.koniec-trasy-210 .trasa-os {
    position: relative !important;
}

.trasa-stop.koniec-trasy-210 .trasa-os::after {
    content: "" !important;
    display: block !important;
    position: absolute !important;
    width: 8.5px !important;
    height: 8.5px !important;
    min-width: 8.5px !important;
    min-height: 8.5px !important;
    border-radius: 50% !important;
    background: #000 !important;
    left: 50% !important;
    top: 50% !important;
    transform: translate(-50%, -50%) !important;
    z-index: 5 !important;
}

/* pionowa linia dochodzi do środka kropki i tam się kończy */
.trasa-stop.koniec-trasy-210 .trasa-os::before {
    bottom: 50% !important;
    height: auto !important;
}



/* =========================================================
   WERSJA 214 — RÓWNA WYSOKOŚĆ TABEL DNI
   ========================================================= */

/*
   Wysokość nadaje JS na podstawie najwyższej tabeli w danej karcie.
   Box-sizing gwarantuje, że obramowania obu tabel kończą się równo.
*/
.tabliczka .rozklady-grid > .dzien {
    box-sizing: border-box !important;
}



/* =========================================================
   WERSJA 216 — NIE KURSUJE
   ========================================================= */

/*
   Nie dorysowujemy żadnej dodatkowej kreski.
   Rozciągamy istniejący .nie-kursuje-body aż do dolnej krawędzi

function rozdzielNazweIMiejscowosc(nazwa){
const tekst = String(nazwa || "").trim();

    /* WERSJA 477 — JSON jest źródłem prawdy dla nazwy i miejscowości. */
    try{
        const rozklady = Array.isArray(daneLinii?.rozkłady) ? daneLinii.rozkłady : [];
        for(const rozklad of rozklady){
            for(const kierunek of (Array.isArray(rozklad?.kierunki) ? rozklad.kierunki : [])){
                for(const p of (Array.isArray(kierunek?.przystanki) ? kierunek.przystanki : [])){
                    if(normalizuj(String(p?.nazwa || "")) === normalizuj(tekst)){
                        if(Object.prototype.hasOwnProperty.call(p,"nazwa_czysta") ||
                           Object.prototype.hasOwnProperty.call(p,"miejscowosc")){
                            return {
                                nazwa: String(p?.nazwa_czysta || p?.nazwa || tekst).trim(),
                                miejscowosc: String(p?.miejscowosc || "").trim()
                            };
                        }
                    }
                }
            }
        }
    }catch(e){
        console.warn("FWTP v477: nie udało się odczytać miejscowości z JSON",e);
    }

    /* Zgodność ze starszymi JSON-ami. */
    const dopasowanie = tekst.match(/^(.*?)\s*\(([^()]*)\)\s*$/);
    if(!dopasowanie) return {nazwa:tekst,miejscowosc:""};
    const nazwaBezNawiasu=String(dopasowanie[1]||"").trim();
    const tekstWNawiasie=String(dopasowanie[2]||"").trim();
    const jestMiejscowoscia=MIEJSCOWOSCI.some(m=>normalizuj(m)===normalizuj(tekstWNawiasie));
    return jestMiejscowoscia
        ? {nazwa:nazwaBezNawiasu,miejscowosc:tekstWNawiasie}
        : {nazwa:tekst,miejscowosc:""};
}

const cacheObliczenWToku=

function memoTabliczki(
    nazwa,
    klucz,
    producent
){

    const pelnyKlucz=
        kluczStanuCache()+
        "||"+
        nazwa+
        "||"+
        String(
            klucz||""
        );

    if(
        cacheObliczenTabliczki.has(
            pelnyKlucz
        )
    ){
        return cacheObliczenTabliczki.get(
            pelnyKlucz
        );
    }

    /*
       Zabezpieczenie przed przypadkową rekurencją cykliczną.
       Nie pozwalamy drugi raz rozpocząć obliczania dokładnie
       tego samego wyniku, zanim pierwsze obliczenie się skończy.
    */
    if(
        cacheObliczenWToku.has(
            pelnyKlucz
        )
    ){
        console.error(
            "[FWTP] Wykryto cykliczne obliczenie:",
            nazwa,
            klucz
        );

        return null;
    }

    cacheObliczenWToku.add(
        pelnyKlucz
    );

    try{

        const wynik=
            producent();

        cacheObliczenTabliczki.set(
            pelnyKlucz,
            wynik
        );

        return wynik;

    }finally{

        cacheObliczenWToku.delete(
            pelnyKlucz
        );
    }
}

    ustawLoaderTabliczki(

    );

function ustawLoaderTabliczki(
    procent,
    etap
){

    const p=
        Math.max(
            0,
            Math.min(
                100,
                Math.round(
                    Number(procent)||0
                )
            )
        );

    const pasek=
        document.getElementById(
            "tabliczkaLoaderProgress"
        );

    const autobus=
        document.getElementById(
            "tabliczkaLoaderBus"
        );

    const liczba=
        document.getElementById(
            "tabliczkaLoaderPercent"
        );

    const opis=
        document.getElementById(
            "tabliczkaLoaderStage"
        );

    if(pasek){

        pasek.style.width=
            p+"%";

        pasek.classList.toggle(
            "gotowe",
            p>=100
        );
    }

    if(autobus){

        autobus.style.left=
            p+"%";

        autobus.classList.toggle(
            "gotowe",
            p>=100
        );
    }

    if(liczba){
        liczba.textContent=
            p+"%";
    }

    if(
        opis&&
        etap
    ){
        opis.textContent=
            etap;
    }
}


function czekajNaRenderTabliczki(){

    return new Promise(
        resolve=>{

            requestAnimationFrame(
                ()=>{
                    requestAnimationFrame(
                        resolve
                    );
                }
            );
        }
    );
}


async function czekajNaPelneRenderowanieTabliczki(){

    /*
       Najpierw czekamy na fonty.
       Dzięki temu szerokości napisów i kolumn są już ostateczne.
    */
    try{

        if(
            document.fonts&&
            document.fonts.ready
        ){
            await document.fonts.ready;
        }
    }
    catch{}

    /*
       renderuj() wykonuje własne requestAnimationFrame:
       1. wyrównanie tabel SOBOTA / ŚWIĘTO,
       2. dopasowanie kolumn trasy.

       Czekamy więc jeszcze kilka pełnych klatek,
       aby loader zniknął dopiero po rzeczywistym
       zakończeniu układania tabliczki.
    */
    await czekajNaRenderTabliczki();
    await czekajNaRenderTabliczki();
    await czekajNaRenderTabliczki();
}


async function zakonczLoaderTabliczki(){

    ustawLoaderTabliczki(
        100,
        "Gotowe"
    );

    await czekajNaRenderTabliczki();

    /*
       Krótka chwila, aby użytkownik zobaczył dojazd autobusu
       dokładnie do 100%.
    */
    await new Promise(
        resolve=>
            setTimeout(
                resolve,
                320
            )
    );

    const host=
        document.getElementById(
            "tabliczkaLoaderHost"
        );

    if(host){
        host.innerHTML="";
    }

    /*
       Tabliczka staje się widoczna dopiero po pełnym
       zakończeniu pobierania i renderowania całej linii.
    */
    document.body.classList.remove(
        "tabliczka-w-trakcie-ladowania"
    );
}


function ukryjLoaderTabliczki(){

    const host=
        document.getElementById(
            "tabliczkaLoaderHost"
        );

    if(host){
        host.innerHTML="";
    }

    document.body.classList.remove(
        "tabliczka-w-trakcie-ladowania"
    );
}


async function przerysujTabliczkeZLoaderem(
    etapPoczatkowy,
    przygotuj=null
){

    /*
       Ten sam loader działa teraz także przy:
       - zmianie kierunku,
       - zmianie przystanku.

       Tabliczka pozostaje niewidoczna od początku zmiany
       aż do zakończenia pełnego renderowania.
    */
    pokazLoaderTabliczki();

    ustawLoaderTabliczki(
        10,
        etapPoczatkowy||
        "Przygotowywanie tabliczki..."
    );

    await czekajNaRenderTabliczki();

    try{

        if(
            typeof przygotuj===
            "function"
        ){
            przygotuj();
        }

        ustawLoaderTabliczki(
            42,
            "Przygotowywanie rozkładu..."
        );

        await czekajNaRenderTabliczki();

        ustawLoaderTabliczki(
            68,
            "Budowanie rozkładu i trasy..."
        );

        renderuj();

        await czekajNaRenderTabliczki();

        ustawLoaderTabliczki(
            90,
            "Dopasowywanie układu tabliczki..."
        );

        /*
           Czekamy dokładnie tak samo jak przy zmianie linii:
           - na fonty,
           - na wyrównanie tabel dni,
           - na obliczenie szerokości "NIE KURSUJE",
           - na podział listy przystanków na kolumny,
           - na końcowy układ całej tabliczki.
        */
        await czekajNaPelneRenderowanieTabliczki();

        await zakonczLoaderTabliczki();
    }
    catch(error){

        console.error(error);

        ukryjLoaderTabliczki();

        pokazBlad(
            error?.message||
            "Nie udało się przygotować tabliczki."
        );
    }
}

function dataZTekstu(tekst){

    const m=
        /^(\d{4})-(\d{2})-(\d{2})$/
            .exec(
                String(
                    tekst||""
                )
            );

    if(!m)return null;

    const d=
        new Date(
            Number(m[1]),
            Number(m[2])-1,
            Number(m[3])
        );

    return Number.isNaN(
        d.getTime()
    )
        ? null
        : d;
}


function dataISO(data){

    return[
        data.getFullYear(),
        String(
            data.getMonth()+1
        ).padStart(2,"0"),
        String(
            data.getDate()
        ).padStart(2,"0")
    ].join("-");
}


function pobierzIndeksPrzystanku(){

    const tekst=
        String(
            parametry.get("przystanek")||""
        );

    if(
        tekst.startsWith("idx:")
    ){
        const n=
            Number(
                tekst.slice(4)
            );

        return Number.isInteger(n)
            ? n
            : 0;
    }

    const n=
        Number(tekst);

    return Number.isInteger(n)
        ? n
        : 0;
}


function zapiszURL(){

    const url=
        new URL(
            window.location.href
        );

    url.searchParams.set(
        "linia",
        aktualnaLinia
    );

    url.searchParams.set(
        "data",
        dataISO(
            wybranaData
        )
    );

    url.searchParams.set(
        "kierunek",
        String(
            aktualnyKierunek
        )
    );

    url.searchParams.set(
        "przystanek",
        "idx:"+
        aktualnyPrzystanek
    );

    history.replaceState(
        {},
        "",
        url
    );
}

async function pobierzManifestPaczek(){

    if(
        manifestPaczek!==null
    ){
        return manifestPaczek;
    }

    try{

        const r=
            await fetch(
                BASE_DANE+
                "paczki.json?ts="+
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!r.ok){
            manifestPaczek=[];
            return manifestPaczek;
        }

        const j=
            await r.json();

        manifestPaczek=
            Array.isArray(j)
                ? j
                : Array.isArray(j.paczki)
                    ? j.paczki
                    : [];
    }
    catch{
        manifestPaczek=[];
    }

    return manifestPaczek;
}


function paczkaObowiazuje(
    paczka,
    linia,
    data
){

    const linie=
        Array.isArray(
            paczka?.linie
        )
            ? paczka.linie.map(String)
            : [];

    if(
        !linie.includes(
            String(linia)
        )
    ){
        return false;
    }

    const iso=
        dataISO(data);

    const od=
        String(
            paczka.od||""
        );

    const doDaty=
        String(
            paczka.do||""
        );

    return(
        (!od||iso>=od)&&
        (!doDaty||iso<=doDaty)
    );
}


async function pobierzLinie(
    linia,
    data
){

    const paczki=
        await pobierzManifestPaczek();

    const pasujace=
        paczki
            .filter(
                p=>
                    paczkaObowiazuje(
                        p,
                        linia,
                        data
                    )
            )
            .sort(
                (a,b)=>
                    Number(
                        b.priorytet||0
                    )-
                    Number(
                        a.priorytet||0
                    )
            );

    const zrodla=[];

    pasujace.forEach(
        p=>{

            const folder=
                String(
                    p.folder||""
                )
                    .replace(/^\/+/,"")
                    .replace(/\/+$/,"");

            if(folder){
                zrodla.push({
                    url:
                        BASE_DANE+
                        folder+
                        "/"+
                        encodeURIComponent(linia)+
                        ".json",
                    od:
                        String(
                            p.od||""
                        )
                });
            }
        }
    );

    zrodla.push({
        url:
            BASE_DANE+
            encodeURIComponent(linia)+
            ".json",
        od:""
    });

    for(const zrodlo of zrodla){

        try{

            const r=
                await fetch(
                    zrodlo.url+
                    "?ts="+
                    Date.now(),
                    {
                        cache:"no-store"
                    }
                );

            if(!r.ok)continue;

            const json=
                await r.json();

            waznyOdDanych=
                String(
                    json?.od||
                    json?.waznyOd||
                    json?.dataOd||
                    json?.obowiazujeOd||
                    zrodlo.od||
                    ""
                );

            return json;
        }
        catch{
            /* następny */
        }
    }

    throw new Error(
        "Nie znaleziono danych linii "+
        linia+
        "."
    );
}

async function wczytajLinie(){

    pokazLoaderTabliczki();

    ustawLoaderTabliczki(

        aktualnaLinia+
        "..."
    );

    ustawStatus(
        "Ładowanie linii "+
        aktualnaLinia+
        "..."
    );

    document
        .getElementById("wynik")
        .innerHTML="";

    await czekajNaRenderTabliczki();

    try{

        /*
           5–45%:
           pobranie manifestu / właściwego JSON-u linii.
        */
        daneLinii=
            await pobierzLinie(
                aktualnaLinia,
                wybranaData
            );

        ustawLoaderTabliczki(
            45,
            "Dane linii pobrane"
        );

        await czekajNaRenderTabliczki();

        /*
           45–62%:
           analiza kierunków i danych przystanków.
        */
        const kierunki=
            pobierzKierunki();

        if(!kierunki.length){
            throw new Error(
                "Brak kierunków w pliku JSON."
            );
        }

        if(
            aktualnyKierunek<0||
            aktualnyKierunek>=
                kierunki.length
        ){
            aktualnyKierunek=0;
        }

        ustawLoaderTabliczki(
            62,
            "Analizowanie kierunków i przystanków..."
        );

        wypelnijKierunki();
        wypelnijPrzystanki();

        await czekajNaRenderTabliczki();

        /*
           62–78%:
           przygotowanie rozkładów i trasy.
        */
        ustawLoaderTabliczki(
            78,
            "Budowanie rozkładów i trasy..."
        );

        zapiszURL();

        await czekajNaRenderTabliczki();

        /*
           78–92%:
           właściwe renderowanie tabliczki.
           Loader jest w osobnym kontenerze, więc pozostaje
           widoczny podczas budowania gotowej tabliczki.
        */
        renderuj();

        ustawLoaderTabliczki(
            92,
            "Dopasowywanie układu tabliczki..."
        );

        /*
           Czekamy aż zakończą się:
           - render DOM,
           - fonty,
           - wyrównanie SOBOTA / ŚWIĘTO,
           - dopasowanie 1/2 kolumn listy przystanków.
        */
        await czekajNaPelneRenderowanieTabliczki();

        ustawStatus(
            "Linia "+
            String(
                daneLinii.linia||
                aktualnaLinia
            )+
            " • "+
            dataISO(
                wybranaData
            )

        /*
           100% następuje dopiero wtedy, gdy gotowa tabliczka
           jest już naprawdę ułożona na stronie.
        */
        await zakonczLoaderTabliczki();
    }
    catch(error){

        console.error(error);

        ukryjLoaderTabliczki();

        pokazBlad(
            error.message||
            "Nie udało się wczytać danych."
        );
    }
}
