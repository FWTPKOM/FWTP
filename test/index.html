function poprawPierwszyAktywnyPrzystanek(){
    document
        .querySelectorAll(".trasa-kol")
        .forEach(kolumna=>{
            const aktywne=
                kolumna.querySelectorAll(
                    ".trasa-stop.wybrany"
                );

            aktywne.forEach(stop=>{
                let poprzedni=stop.previousElementSibling;
                let maPrzystanekPrzed=false;

                while(poprzedni){
                    if(
                        poprzedni.classList &&
                        poprzedni.classList.contains("trasa-stop")
                    ){
                        maPrzystanekPrzed=true;
                        break;
                    }

                    /* separator rozpoczyna nową grupę trasy */
                    if(
                        poprzedni.classList &&
                        poprzedni.classList.contains("trasa-separator")
                    ){
                        break;
                    }

                    poprzedni=poprzedni.previousElementSibling;
                }

                stop.classList.toggle(
                    "aktywny-pierwszy",
                    !maPrzystanekPrzed
                );

                if(!maPrzystanekPrzed){
                    const czas=
                        stop.querySelector(".trasa-czas");

                    if(czas){
                        czas.textContent="0";
                    }
                }
            });
        });
}


/* =========================================================
   WERSJA 214 — WYRÓWNANIE TABEL „NIE KURSUJE”
   ========================================================= */

function wyrownajWysokoscTabelDni214(
    root=document
){
    root.querySelectorAll(
        ".tabliczka .rozklady-grid"
    ).forEach(
        grid=>{

            const dni=
                Array.from(
                    grid.children
                )
                .filter(
                    el=>
                        el.classList?.contains(
                            "dzien"
                        )
                );

            if(dni.length<2){
                return;
            }

            /*
               Najpierw zdejmujemy wysokość z poprzedniego renderowania,
               aby po zmianie przystanku/dnia pomiar był naturalny.
            */
            dni.forEach(
                dzien=>{
                    dzien.style.height="";
                    dzien.style.minHeight="";
                }
            );

            const max=
                Math.max(
                    ...dni.map(
                        dzien=>
                            dzien.getBoundingClientRect().height
                    )
                );

            if(
                !Number.isFinite(max)||
                max<=0
            ){
                return;
            }

            dni.forEach(
                dzien=>{
                    dzien.style.height=
                        max+"px";
                    dzien.style.minHeight=
                        max+"px";
                }
            );
        }
    );
}


function zaplanujWyrownanieTabelDni214(){

    requestAnimationFrame(
        ()=>
            requestAnimationFrame(
                ()=>
                    wyrownajWysokoscTabelDni214(
                        document
                    )
            )
    );
}



/* =========================================================
   WERSJA 215 — GEOMETRIA DNIA „NIE KURSUJE”
   ========================================================= */

function przygotujNieKursuje215(
    root=document
){
    root.querySelectorAll(
        ".tabliczka .rozklady-grid > .dzien"
    ).forEach(
        dzien=>{

            const tekstCaly=
                String(
                    dzien.textContent||
                    ""
                )
                .replace(/\s+/g," ")
                .trim()
                .toUpperCase();

            const nieKursuje=
                tekstCaly.includes(
                    "NIE KURSUJE"
                );

            dzien.classList.toggle(
                "nie-kursuje-215",
                nieKursuje
            );

            if(!nieKursuje){
                return;
            }

            /*
               v216:
               NIE wyliczamy już położenia sztucznej kreski.
               Istniejący .nie-kursuje-body ma rozciągnąć się flexem
               do samego dołu tabeli.
            */
            let tekstEl=null;

            Array.from(
                dzien.querySelectorAll("*")
            ).forEach(
                el=>{

                    if(tekstEl){
                        return;
                    }

                    const txt=
                        String(
                            el.textContent||
                            ""
                        )
                        .replace(/\s+/g," ")
                        .trim()
                        .toUpperCase();

                    if(
                        txt==="NIE KURSUJE"&&
                        !Array.from(
                            el.children
                        ).some(
                            child=>
                                String(
                                    child.textContent||
                                    ""
                                )
                                .replace(/\s+/g," ")
                                .trim()
                                .toUpperCase()==="NIE KURSUJE"
                        )
                    ){
                        tekstEl=el;
                    }
                }
            );

            if(tekstEl){
                tekstEl.classList.add(
                    "nie-kursuje-tekst"
                );
            }
        }
    );
}

/* =========================================================
   WERSJA 215 — ŚCIŚNIĘTA LITERA m
   ========================================================= */

function scisnijLiteryM215(
    root=document
){
    /*
       Najpierw elementy, w których litera wariantu jest osobnym node'em.
    */
    root.querySelectorAll(
        [
            "[data-wariant='M']",
            "[data-wariant='m']",
            ".wariant-litera",
            ".symbol-wariantu",
            ".minuta-wariant"
        ].join(",")
    ).forEach(
        el=>{

            const znak=
                String(
                    el.dataset?.wariant||
                    el.textContent||
                    ""
                )
                .trim()
                .toLowerCase();

            if(znak==="m"){
                el.classList.add(
                    "wariant-m-215"
                );
            }
        }
    );

    /*
       Jeżeli renderer zapisuje np. "28m" jako jeden tekst, zamieniamy
       tylko końcowe m na osobny span. Nie dotykamy opisów legendy.
    */
    root.querySelectorAll(
        ".tabliczka .minuty-cell, .tabliczka .minuty, .tabliczka [class*='minut']"
    ).forEach(
        kontener=>{

            Array.from(
                kontener.childNodes
            ).forEach(
                node=>{

                    if(
                        node.nodeType!==Node.TEXT_NODE
                    ){
                        return;
                    }

                    const txt=
                        node.nodeValue;

                    if(
                        !txt||
                        !/\d{1,2}m(?=\s|$)/i.test(
                            txt
                        )
                    ){
                        return;
                    }

                    const frag=
                        document.createDocumentFragment();

                    const czesci=
                        txt.split(
                            /(\d{1,2})(m)(?=\s|$)/ig
                        );

                    for(
                        let i=0;
                        i<czesci.length;
                        i++
                    ){
                        const part=
                            czesci[i];

                        if(
                            i>=2&&
                            i%3===2&&
                            String(part).toLowerCase()==="m"
                        ){
                            const span=
                                document.createElement(
                                    "span"
                                );

                            span.className=
                                "wariant-m-215";

                            span.textContent=
                                part;

                            frag.appendChild(
                                span
                            );
                        } else if(part){
                            frag.appendChild(
                                document.createTextNode(
                                    part
                                )
                            );
                        }
                    }

                    node.replaceWith(
                        frag
                    );
                }
            );
        }
    );
}


function poprawWidok215(){
    wyrownajWysokoscTabelDni214(
        document
    );

    przygotujNieKursuje215(
        document
    );

    scisnijLiteryM215(
        document
    );
}



/* =========================================================
   FWTP — WERSJA 486
   CAŁKOWICIE NOWY SILNIK LISTY PRZYSTANKÓW
   =========================================================
   Stara logika listy (126 / 401 / 150 / wydłużenia / gałęzie /
   stanTrasyNaPrzystanku / daneTrasWydluzonych itd.) NIE JEST
   UŻYWANA przez renderer V486.

   Jedynym źródłem fizycznego przebiegu jest:
       kurs.trasa = [ID, ID, ID...]

   Metadane:
       p.id
       p.nazwa_czysta
       p.miejscowosc
       p.strefa
       p.typ
   ========================================================= */

function v486Text(v){
    return String(v == null ? "" : v)
        .replace(/\s+/g," ")
        .trim();
}

function v486Array(v){
    return Array.isArray(v) ? v : [];
}

function v486StopId(p){
    return v486Text(p?.id);
}

function v486StopName(p){
    return v486Text(p?.nazwa_czysta) || v486Text(p?.nazwa);
}

function v486StopType(p){
    return v486Text(p?.typ).toLocaleUpperCase("pl-PL");
}

function v486StopTown(p){
    return v486Text(p?.miejscowosc);
}

function v486StopZone(p){
    return v486Text(p?.strefa);
}


function v486DirectionName(){
    const k = v486CurrentDirection();

    const direct =
        v486Text(k?.nazwa) ||
        v486Text(k?.kierunek);

    if(direct){
        return direct;
    }

    const stops = v486BaseStops()
        .filter(p => v486StopType(p) !== "TECH");

    return stops.length
        ? v486StopName(stops[stops.length-1])
        : "";
}

function v486CurrentDirection(){
    return kierunekBazowy() || null;
}

function v486BaseStops(){
    return v486Array(
        v486CurrentDirection()?.przystanki
    );
}

function v486CurrentStop(){
    return v486BaseStops()[
        Number(aktualnyPrzystanek)
    ] || null;
}

function v486StopMap(){
    const map = new Map();

    v486BaseStops().forEach((p,index)=>{
        const id = v486StopId(p);

        if(id && !map.has(id)){
            map.set(id,{p,index});
        }
    });

    return map;
}

function v486MinutesValue(value){
    const m = /^(\d{1,2}):(\d{2})$/.exec(
        v486Text(value)
    );

    if(!m) return null;

    return Number(m[1]) * 60 + Number(m[2]);
}

function v486CourseKey(kurs){
    /*
       "numer" jest identyfikatorem konkretnego kursu w nowym JSON.
       Jeżeli kiedyś go zabraknie, dokładamy czas/brygadę jako fallback.
    */
    return [
        v486Text(kurs?.numer),
        v486Text(kurs?.czas),
        v486Text(kurs?.brygada)
    ].join("|");
}

function v486CourseAtStop(stop, representative){
    if(!stop || !representative) return null;

    const numer = v486Text(representative.numer);

    if(numer){
        const exact = v486Array(stop.kursy).find(
            k => v486Text(k?.numer) === numer
        );

        if(exact) return exact;
    }

    const key = v486CourseKey(representative);

    return v486Array(stop.kursy).find(
        k => v486CourseKey(k) === key
    ) || null;
}

/*
   Wszystkie RZECZYWISTE przebiegi dostępne z aktualnego przystanku.

   Każdy kurs.trasa jest przycinany od dokładnego ID aktualnego słupka.
   Niczego nie dodajemy, nie przestawiamy i nie dopasowujemy po nazwie.
*/
function v486BuildRoutes(){
    const active=v486CurrentStop();
    if(!active)return [];

    const stopMap=v486StopMap();

    /*
       FWTP V512
       Pierwszeństwo ma model listy przygotowany przez VBA V39.
       JavaScript NIE rekonstruuje już przebiegów z kursów, jeżeli
       lista_przystankowa istnieje.
    */
    const model=active.lista_przystankowa;

    if(model && Array.isArray(model.trasy) && model.trasy.length){
        const groups=new Map();

        model.trasy.forEach((trasaModel,index)=>{
            const ids=v486Array(trasaModel?.trasa)
                .map(v486Text)
                .filter(Boolean);

            const items=ids
                .map(id=>stopMap.get(id))
                .filter(Boolean)
                .filter(x=>v486StopType(x.p)!=="TECH");

            if(!items.length)return;

            const terminalId=v486Text(
                trasaModel?.koniec_trasy
            ).trim();

            const wariant=v486Text(
                trasaModel?.wariant
            ).trim();

            /*
               Klucz fizycznego przebiegu pozostaje dokładny.
               Łączenie wspólnych punktów (np. PROZY) wykonuje
               późniejszy renderer po nazwach, tak jak od V501.
            */
            const key=ids.join(">>");

            if(!groups.has(key)){
                groups.set(key,{
                    ids,
                    items,
                    courses:[],
                    variants:new Set(),
                    terminalIds:new Set(),
                    listaModel:true,
                    order:index
                });
            }

            const g=groups.get(key);

            if(wariant){
                g.variants.add(wariant);
            }

            if(terminalId){
                g.terminalIds.add(terminalId);
            }
        });

        return [...groups.values()];
    }

    /*
       Fallback dla starszych JSON-ów bez lista_przystankowa.
    */
    const activeId=v486StopId(active);
    const groups=new Map();

    for(const kurs of v486Array(active.kursy)){
        const fullIds=v486Array(kurs?.trasa)
            .map(v486Text)
            .filter(Boolean);

        if(!fullIds.includes(activeId))continue;

        const items=fullIds
            .map(id=>stopMap.get(id))
            .filter(Boolean)
            .filter(x=>v486StopType(x.p)!=="TECH");

        if(!items.length)continue;

        const key=fullIds.join(">>");

        if(!groups.has(key)){
            groups.set(key,{
                ids:fullIds,
                items,
                courses:[],
                variants:new Set(),
                terminalIds:new Set()
            });
        }

        const g=groups.get(key);
        g.courses.push(kurs);

        const w=v486Text(kurs?.wariant).trim();
        if(w)g.variants.add(w);

        const terminal=v486Text(kurs?.koniec_trasy).trim();
        if(terminal)g.terminalIds.add(terminal);
    }

    return [...groups.values()];
}

/*
   Czas przejazdu dla reprezentatywnego kursu danego rzeczywistego
   przebiegu. Nie korzystamy z czasyTrasy() ani ze starego wyboru
   wariantu.
*/
function v486TravelMinutes(route,item){
    const active = v486CurrentStop();
    const rep = route?.representative;

    const activeCourse = v486CourseAtStop(active,rep);
    const stopCourse = v486CourseAtStop(item?.p,rep);

    const t0 = v486MinutesValue(activeCourse?.czas);
    const t1 = v486MinutesValue(stopCourse?.czas);

    if(t0 === null || t1 === null){
        return null;
    }

    let diff = t1 - t0;

    /*
       V488:
       - wcześniejsze przystanki mają czas ujemny względem tabliczki,
       - przejście przez północ korygujemy tylko przy oczywistym
         skoku do następnej doby.
    */
    if(diff < -12*60){
        diff += 24*60;
    }

    if(diff > 12*60){
        diff -= 24*60;
    }

    return diff;
}


/*
   V488 — WSPÓLNA TRASA I ODGAŁĘZIENIA

   JSON jest poprawny: każdy kurs ma pełne kurs.trasa.
   HTML musi z tych pełnych przebiegów wykryć wspólne fragmenty.

   Dla każdego ID liczymy, w ilu rzeczywistych przebiegach występuje.
   Dzięki temu wspólny odcinek nie jest traktowany jako trzy niezależne
   trasy. Informacja jest dołączona do elementów renderowanych.
*/
function v486RouteUsage(routes){
    const usage = new Map();

    for(const route of routes){
        const unique = new Set(route.ids);

        for(const id of unique){
            usage.set(
                id,
                (usage.get(id)||0)+1
            );
        }
    }

    return usage;
}

function v486MarkSharedRoutes(routes){
    const usage = v486RouteUsage(routes);

    for(const route of routes){
        route.items = route.items.map(item=>({
            ...item,
            _v488Usage:
                usage.get(
                    v486StopId(item.p)
                )||1,
            _v488Shared:
                (usage.get(
                    v486StopId(item.p)
                )||1)>1
        }));
    }

    return routes;
}

function v486RouteLabel(route){
    const letters = Array.from(
        new Set(
            v486Array(route?.courses)
                .map(k => v486Text(k?.wariant))
                .filter(Boolean)
        )
    );

    if(!letters.length) return "";

    return "Trasa w kursach " +
        letters
            .map(x => "„"+x.toLowerCase()+"”")
            .join(", ");
}

/*
   Separator miejscowości jest tworzony WYŁĄCZNIE z pola
   miejscowosc z JSON. Nie czytamy nawiasów z nazwy.
*/
function v486TownSeparator(town){
    if(!town) return "";

    return (
        '<li class="trasa-separator v486-miejscowosc">'+
        '<span class="trasa-separator-title">'+
        '--- '+escapeHtml(town.toUpperCase())+' ---'+
        '</span>'+
        '</li>'
    );
}

/*
   Separator strefy również korzysta WYŁĄCZNIE z JSON.
*/
function v486ZoneSeparator(zone){
    if(!zone) return "";

    return (
        '<li class="trasa-separator v486-strefa">'+
        '<span class="trasa-separator-title">'+
        'STREFA '+escapeHtml(zone)+
        '</span>'+
        '</li>'
    );
}

function v486RenderRouteColumn(route){
    const activeId = v486StopId(
        v486CurrentStop()
    );

    let previousTown = null;
    let previousZone = null;

    let rows = "";

    route.items.forEach((item,pos)=>{
        const p = item.p;
        const town = v486StopTown(p);
        const zone = v486StopZone(p);

        /*
           Miejscowość pokazujemy przy zmianie miejscowości.
           Nie dopisujemy jej do nazwy przystanku.
        */
        if(
            pos > 0 &&
            town &&
            town !== previousTown
        ){
            rows += v486TownSeparator(town);
        }

        /*
           Strefa jest niezależna od miejscowości.
           1/2 traktujemy jako informację graniczną zapisaną w JSON.
        */
        if(
            pos > 0 &&
            zone &&
            zone !== previousZone
        ){
            rows += v486ZoneSeparator(zone);
        }

        const selected =
            v486StopId(p) === activeId;

        const first = pos === 0;
        const last = pos === route.items.length-1;
        const minutes = v486TravelMinutes(route,item);

        const classes = [
            "trasa-stop",
            selected ? "wybrany" : "",
            first ? "kraniec-poczatek" : "",
            last ? "kraniec-koniec koniec-trasy-210" : "",
            item?._v488Shared ? "v488-wspolny" : "v488-galaz",
            czyNZ(p) ? "nz" : ""
        ].filter(Boolean).join(" ");

        rows +=
            '<li class="'+classes+'" data-v486-id="'+
            escapeHtml(v486StopId(p))+'">'+

            '<span class="trasa-czas">'+
            (
                minutes === null
                    ? ""
                    : escapeHtml(String(minutes))
            )+
            '</span>'+

            '<span class="trasa-os"></span>'+

            '<span class="trasa-nazwa">'+
            (
                selected
                    ? '<span class="trasa-nazwa-aktywna">'+
                      escapeHtml(
                          v486StopName(p).toUpperCase()
                      )+
                      '</span>'
                    : escapeHtml(
                          v486StopName(p).toUpperCase()
                      )
            )+
            '</span>'+

            '<span class="trasa-nz">'+
            (
                czyNZ(p)
                    ? "ż"
                    : ""
            )+
            '</span>'+
            '</li>';

        if(town){
            previousTown = town;
        }

        if(zone){
            previousZone = zone;
        }
    });

    const label = v486RouteLabel(route);

    return (
        '<div class="trasa-kol v486-trasa-kol">'+
        '<ul class="trasa-lista">'+
        (
            label
                ? '<li class="trasa-separator v486-wariant">'+
                  '<span class="trasa-separator-title">'+
                  escapeHtml(label)+
                  '</span>'+
                  '</li>'
                : ''
        )+
        rows+
        '</ul>'+
        '</div>'
    );
}


/* =========================================================
   FWTP — WERSJA 496
   WSPÓLNE PRZYSTANKI + RZECZYWISTE ODGAŁĘZIENIA
   =========================================================
   - logiczny przystanek: nazwa_czysta + nr
   - różne ID/LP tego samego słupka nie tworzą kopii
   - wspólny fragment kilku kurs.trasa jest pokazany jeden raz
   - opis wariantu jest dopiero przy odgałęzieniu
   - brak specjalnych wyjątków dla numerów linii
   ========================================================= */

function v496StopKey(p){
    return [
        v486StopName(p)
            .toLocaleUpperCase("pl-PL")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g,"")
            .replace(/\s+/g," ")
            .trim(),
        v486Text(p?.nr).toLocaleUpperCase("pl-PL").trim()
    ].join("\u001F");
}


/* =========================================================
   FWTP — WERSJA 501
   WSPÓLNY PUNKT TAKŻE PO SAMEJ NAZWIE PRZYSTANKU
   ========================================================= */

function v501StopNameKey(p){
    return v486StopName(p)
        .toLocaleUpperCase("pl-PL")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/\s+/g," ")
        .trim();
}

/*
   Dla szukania wspólnego przebiegu używamy nazwy przystanku.
   Numer słupka nadal pozostaje w danych i przy zwykłym
   identyfikowaniu przystanku, ale nie powoduje sztucznego
   rozgałęzienia, gdy obie trasy mają np. PROZY.
*/
function v501RouteNameKeys(route){
    return v486Array(route?.items).map(x=>v501StopNameKey(x?.p));
}

function v496RouteKeys(route){
    return v486Array(route?.items).map(x=>v496StopKey(x?.p));
}

function v496Varianty(route){
    const out=new Set();

    /*
       FWTP V513:
       V512 buduje przebiegi z lista_przystankowa, więc route.courses
       może być puste. Litera wariantu jest wtedy w route.variants.
    */
    if(route?.variants instanceof Set){
        route.variants.forEach(v=>{
            const x=v486Text(v).trim().toUpperCase();
            if(x)out.add(x);
        });
    }

    v486Array(route?.courses).forEach(kurs=>{
        const x=v486Text(kurs?.wariant).trim().toUpperCase();
        if(x)out.add(x);
    });

    return [...out];
}

function v503CzasKursu(kurs){
    const raw=v486Text(kurs?.czas).trim();
    if(!raw)return "";

    /*
       Zachowujemy czas z JSON-a. Usuwamy tylko zbędne sekundy,
       jeśli format jest HH:MM:SS.
    */
    const m=raw.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
    if(m){
        return String(Number(m[1]))+":"+m[2];
    }

    return raw;
}

function v503KursyGałęzi(routes){
    const out=[];
    const seen=new Set();

    v486Array(routes).forEach(route=>{
        v486Array(route?.courses).forEach(kurs=>{
            const czas=v503CzasKursu(kurs);
            if(!czas)return;

            const key=v486CourseKey(kurs);
            if(seen.has(key))return;
            seen.add(key);

            out.push({
                czas,
                sort:(()=>{
                    const m=czas.match(/^(\d{1,2}):(\d{2})$/);
                    if(!m)return Number.MAX_SAFE_INTEGER;
                    let h=Number(m[1]);
                    const min=Number(m[2]);
                    /*
                       Kursy po północy zostają w naturalnym porządku
                       danych; sortujemy tylko czytelnie w obrębie godzin.
                    */
                    return h*60+min;
                })()
            });
        });
    });

    out.sort((a,b)=>a.sort-b.sort);
    return out.map(x=>x.czas);
}

function v496OpisWariantow(routes){
    const litery=Array.from(new Set(
        v486Array(routes)
            .flatMap(route=>v496Varianty(route))
            .map(x=>v486Text(x).trim().toUpperCase())
            .filter(Boolean)
    ));

    /*
       V513:
       Ta sama zasada co przy minutach:
       - jeżeli oznaczenie jest rzeczywiście pokazywane -> podaj literę,
       - jeżeli oznaczenia są ukryte -> "BEZ OZNACZEŃ".
       Dzięki temu gałąź F do Metro Marymont dostaje F.
    */
    const widoczne=litery.filter(litera=>{
        if(typeof czyPokazacWariantJakLiniaHTML==="function"){
            return czyPokazacWariantJakLiniaHTML(litera);
        }
        return litera==="F";
    });

    if(widoczne.length){
        return "TRASA W KURSACH " +
            widoczne.map(x=>'„'+x+'”').join(", ");
    }

    return "TRASA W KURSACH BEZ OZNACZEŃ";
}


/* =========================================================
   FWTP — WERSJA 502
   RZECZYWISTY PRZYSTANEK KOŃCOWY
   ========================================================= */

function v502CzyRzeczywistyKoniec(item,route){
    const p=item?.p;
    if(!p)return false;

    const itemId=v486StopId(p);
    if(!itemId)return false;

    /*
       FWTP V512:
       jeżeli przebieg pochodzi z lista_przystankowa V39,
       koniec jest już jawnie zapisany przez VBA.
    */
    if(route?.terminalIds instanceof Set && route.terminalIds.size){
        return route.terminalIds.has(itemId);
    }

    /*
       Fallback dla starego JSON.
    */
    const stopMap=v486StopMap();

    for(const kurs of v486Array(route?.courses)){
        const explicit=v486Text(kurs?.koniec_trasy).trim();

        if(explicit){
            if(explicit===itemId)return true;
            continue;
        }

        const trasa=v486Array(kurs?.trasa);

        for(let i=trasa.length-1;i>=0;i--){
            const id=v486Text(trasa[i]).trim();
            if(!id)continue;

            const found=stopMap.get(id);
            if(found && v486StopType(found.p)==="TECH")continue;

            return id===itemId;
        }
    }

    return false;
}

function v496RenderStop(item, route, aktywnyKey, first=false, last=false){
    const p=item?.p;
    if(!p) return "";

    const selected=v496StopKey(p)===aktywnyKey;
    const minutes=v486TravelMinutes(route,item);

    /*
       V502: jeżeli jest to ostatni pasażerski przystanek rzeczywistego
       kurs.trasa, oznaczamy go jako końcowy niezależnie od podziału
       wariantów i kolumn.
    */
    /*
       V506:
       samo bycie ostatnim elementem aktualnie wyrenderowanego fragmentu
       NIE oznacza końca trasy. Fragment może kończyć się tylko dlatego,
       że zaczyna się odgałęzienie albo nastąpił podział kolumn.

       Końcowość pochodzi wyłącznie z ostatniego pasażerskiego
       przystanku rzeczywistego kurs.trasa.
    */
    const realTerminal=
        v502CzyRzeczywistyKoniec(item,route);

    const cls=[
        "trasa-stop",
        selected?"wybrany":"",
        first?"kraniec-poczatek":"",
        realTerminal?"kraniec-koniec koniec-trasy-210":"",
        czyNZ(p)?"nz":""
    ].filter(Boolean).join(" ");

    return '<li class="'+cls+'" data-v499-stop-key="'+escapeHtml(v496StopKey(p))+'" data-v508-stop-id="'+escapeHtml(v486StopId(p))+'">'+
        '<span class="trasa-czas">'+
        (minutes===null?"":escapeHtml(String(minutes)))+
        '</span>'+
        '<span class="trasa-os"></span>'+
        '<span class="trasa-nazwa">'+
        (selected
            ? '<span class="trasa-nazwa-aktywna">'+escapeHtml(v486StopName(p).toUpperCase())+'</span>'
            : escapeHtml(v486StopName(p).toUpperCase())
        )+
        '</span>'+
        '<span class="trasa-nz">'+(czyNZ(p)?"ż":"")+'</span>'+
        '</li>';
}

function v496RenderItems(items,route,aktywnyKey,opts={}){
    let html="";
    let town=opts.previousTown||null;
    let zone=opts.previousZone||null;

    items.forEach((item,i)=>{
        const p=item?.p;
        if(!p)return;

        const t=v486StopTown(p);
        const z=v486StopZone(p);

        if(t && t!==town && (i>0 || opts.separatorAtStart)){
            html+=v486TownSeparator(t);
        }
        /*
           V499: strefy są renderowane globalnie przez v499NormalizujStrefy().
           Dzięki temu STREFA I jest raz na górze i nie powtarza się
           w każdej gałęzi.
        */

        html+=v496RenderStop(
            item,route,aktywnyKey,
            !!opts.realFirst && i===0,
            !!opts.realLast && i===items.length-1
        );

        if(t)town=t;
        if(z)zone=z;
    });

    return {html,town,zone};
}

/*
   Szukamy najdłuższego wspólnego, kolejnego fragmentu wszystkich tras.
   Nie wymagamy, żeby zaczynał się na indeksie 0. Dzięki temu:
   różne początki -> połączenie -> wspólny pień -> odgałęzienie
   działa poprawnie.
*/
function v496LongestCommonBlock(routes){
    if(routes.length<2)return null;

    const arrays=routes.map(v501RouteNameKeys);
    const base=arrays.reduce((a,b)=>a.length<=b.length?a:b);

    let best=null;

    for(let start=0;start<base.length;start++){
        for(let len=1;start+len<=base.length;len++){
            const block=base.slice(start,start+len);
            const positions=[];

            let ok=true;
            for(const arr of arrays){
                let found=-1;
                outer:
                for(let p=0;p<=arr.length-block.length;p++){
                    for(let j=0;j<block.length;j++){
                        if(arr[p+j]!==block[j])continue outer;
                    }
                    found=p;
                    break;
                }
                if(found<0){ok=false;break;}
                positions.push(found);
            }

            if(ok && (!best || len>best.len)){
                best={block,len,positions};
            }
        }
    }
    return best;
}

function v496GroupExact(parts){
    const m=new Map();
    parts.forEach(x=>{
        const key=x.items.map(i=>v501StopNameKey(i.p)).join("\u001E");
        if(!m.has(key))m.set(key,{items:x.items,routes:[]});
        m.get(key).routes.push(x.route);
    });
    return Array.from(m.values());
}

function v496RenderBranchGroup(group,aktywnyKey,position){
    if(!group.items.length)return "";

    const rep=group.routes[0];
    /*
       V499:
       opis wariantu pokazujemy tylko przy odgałęzieniu PO wspólnej trasie.
       Różne początki przed wspólnym odcinkiem nie dostają napisu
       "TRASA W KURSACH ...".
    */
    const label=
        position==="after"
            ? v496OpisWariantow(group.routes)
            : "";
    const r=v496RenderItems(
        group.items,rep,aktywnyKey,
        {
            separatorAtStart:true,
            realFirst:position==="before",
            realLast:position==="after"
        }
    );

    return '<div class="v496-galaz">'+
        (label
            ? '<div class="trasa-separator v496-opis"><span class="trasa-separator-title">'+
              escapeHtml(label)+'</span></div>'
            : '')+
        '<ul class="trasa-lista">'+r.html+'</ul>'+
        '</div>';
}


/*
   V499:
   wariant pokazuje tylko własne odgałęzienie.
   Gdy ponownie spotka przystanek należący do dalszej trasy bazowej,
   nie powtarzamy dalszych przystanków wariantu — od tego miejsca
   lista może korzystać z przebiegu podstawowego.
*/
function v499PrzytnijGalazDoPowrotu(group,baseRoute,commonEndIndex){
    if(!group?.items?.length)return group;

    const baseAfter=v486Array(baseRoute?.items).slice(commonEndIndex);
    const baseKeys=new Set(baseAfter.map(x=>v501StopNameKey(x.p)));

    let cut=-1;
    for(let i=0;i<group.items.length;i++){
        if(baseKeys.has(v501StopNameKey(group.items[i].p))){
            cut=i;
            break;
        }
    }

    if(cut>0){
        return {
            ...group,
            items:group.items.slice(0,cut)
        };
    }

    return group;
}


/* =========================================================
   FWTP — WERSJA 500
   MINIONE PRZYSTANKI = WYŁĄCZNIE TRASA PODSTAWOWA
   =========================================================
   Na tabliczce przystankowej pasażera interesuje:
   - jak przebiegała trasa podstawowa do TEGO przystanku,
   - jakie warianty mogą wystąpić DOPIERO DALEJ.

   Dlatego wariant, który różnił się przed aktualnym przystankiem,
   nie tworzy już osobnej gałęzi po lewej/górnej części listy.
   ========================================================= */

function v500CzyTrasaA(route){
    return v486Array(route?.courses).some(
        k=>v486Text(k?.wariant).toUpperCase()==="A"
    );
}

function v500TrasaPodstawowa(routes){
    /*
       Najpierw szukamy jawnego wariantu A.
       Jeżeli JSON nie ma A przy kursach, zachowujemy pierwszy
       przebieg wyznaczony przez silnik jako bazowy.
    */
    return routes.find(v500CzyTrasaA) || routes[0] || null;
}

function v500IndexAktywnego(route,activeKey){
    return v486Array(route?.items).findIndex(
        x=>v496StopKey(x?.p)===activeKey
    );
}

function v500PrzygotujTrasyOdAktualnegoPrzystanku(routes){
    routes=v486Array(routes);
    if(!routes.length)return routes;

    const activeKey=v496StopKey(v486CurrentStop());
    const base=v500TrasaPodstawowa(routes);
    if(!base)return routes;

    const baseIndex=v500IndexAktywnego(base,activeKey);

    /*
       Jeżeli z jakiegoś powodu aktywnego przystanku nie ma
       w przebiegu podstawowym, nie zgadujemy — zostawiamy dane.
    */
    if(baseIndex<0)return routes;

    const basePassed=base.items.slice(0,baseIndex+1);

    return routes
        .map(route=>{
            const idx=v500IndexAktywnego(route,activeKey);

            /*
               Kurs niewykonujący aktualnego przystanku nie powinien
               brać udziału w tabliczce tego przystanku.
            */
            if(idx<0)return null;

            /*
               KLUCZOWA ZMIANA V500:
               wszystko DO aktualnego przystanku bierzemy z bazy.
               Dopiero wszystko PO nim pochodzi z rzeczywistego
               kurs.trasa danego wariantu.
            */
            const future=route.items.slice(idx+1);

            return {
                ...route,
                items:[
                    ...basePassed,
                    ...future
                ]
            };
        })
        .filter(Boolean);
}


function v500PolaczIdentyczneTrasy(routes){
    const map=new Map();

    v486Array(routes).forEach(route=>{
        const key=v486Array(route.items)
            .map(x=>v501StopNameKey(x?.p))
            .join("\u001E");

        if(!map.has(key)){
            map.set(key,{
                ...route,
                courses:[...v486Array(route.courses)]
            });
        }else{
            const dst=map.get(key);
            const seen=new Set(
                dst.courses.map(k=>v486CourseKey(k))
            );

            v486Array(route.courses).forEach(k=>{
                const ck=v486CourseKey(k);
                if(!seen.has(ck)){
                    seen.add(ck);
                    dst.courses.push(k);
                }
            });
        }
    });

    return Array.from(map.values());
}

function v496RenderRoutes(routes){
    routes=v486Array(routes);
    if(!routes.length)return "";

    /*
       V500:
       wszystkie przebiegi mają identyczną część minioną,
       zaczerpniętą z trasy podstawowej. Różnić mogą się dopiero
       ZA aktualnym przystankiem.
    */
    routes=v500PrzygotujTrasyOdAktualnegoPrzystanku(routes);
    routes=v500PolaczIdentyczneTrasy(routes);
    if(!routes.length)return "";

    const activeKey=v496StopKey(v486CurrentStop());

    if(routes.length===1){
        const r=v496RenderItems(
            routes[0].items,routes[0],activeKey,
            {realFirst:true,realLast:true}
        );
        return '<div class="trasa-kol v496-kol"><ul class="trasa-lista">'+r.html+'</ul></div>';
    }

    const common=v496LongestCommonBlock(routes);

    /*
       Jeżeli nie ma żadnego wspólnego kolejnego fragmentu,
       są to rzeczywiście niezależne przebiegi.
    */
    if(!common || common.len===0){
        return '<div class="trasa-kol v496-kol"><div class="v496-galezie">'+
            routes.map(route=>
                v496RenderBranchGroup({items:route.items,routes:[route]},activeKey,"whole")
            ).join("")+
            '</div></div>';
    }

    const before=[];
    const after=[];

    routes.forEach((route,ri)=>{
        const p=common.positions[ri];
        before.push({route,items:route.items.slice(0,p)});
        after.push({route,items:route.items.slice(p+common.len)});
    });

    const beforeGroups=v496GroupExact(before).filter(g=>g.items.length);
    const afterGroups=v496GroupExact(after).filter(g=>g.items.length);

    const baseRoute=routes[0];
    const commonItems=baseRoute.items.slice(
        common.positions[0],
        common.positions[0]+common.len
    );

    let html='<div class="trasa-kol v496-kol">';

    /*
       Różne początki: opisy dotyczą tylko tych różnych gałęzi.
    */
    if(beforeGroups.length){
        html+='<div class="v496-galezie v496-przed">'+
            beforeGroups.map(g=>v496RenderBranchGroup(g,activeKey,"before")).join("")+
            '</div>';
    }

    /*
       Wspólny odcinek — dokładnie jeden raz, bez napisu wariantu.
    */
    const commonRendered=v496RenderItems(
        commonItems,baseRoute,activeKey,
        {
            separatorAtStart:beforeGroups.length>0,
            realFirst:beforeGroups.length===0,
            realLast:afterGroups.length===0
        }
    );
    html+='<ul class="trasa-lista v496-wspolna">'+commonRendered.html+'</ul>';

    /*
       Dopiero tutaj, po wspólnym odcinku, pokazujemy opis gałęzi.
    */
    if(afterGroups.length){
        const commonEnd=
            common.positions[0]+common.len;

        /*
           Pierwszy przebieg jest przebiegiem bazowym dla dalszej
           wspólnej listy. Pozostałe przebiegi pokazują tylko własny
           fragment odgałęzienia; po powrocie do podstawowej trasy
           nie powtarzamy już przystanków.
        */
        const baseAfterKey=
            baseRoute.items.slice(commonEnd)
                .map(x=>v501StopNameKey(x.p))
                .join("\u001E");

        const groups499=afterGroups.map(g=>{
            const key=g.items.map(x=>v501StopNameKey(x.p)).join("\u001E");

            if(key===baseAfterKey){
                return g;
            }

            return v499PrzytnijGalazDoPowrotu(
                g,
                baseRoute,
                commonEnd
            );
        }).filter(g=>g.items.length);

        html+='<div class="v496-galezie v496-po">'+
            groups499.map(g=>v496RenderBranchGroup(g,activeKey,"after")).join("")+
            '</div>';
    }

    html+='</div>';
    return html;
}

/* =========================================================
   FWTP — WERSJA 514
   GOTOWA LISTA PRZYSTANKOWA Z VBA V42 / JSON lista_przystankowa.wersja=2

   ZASADA:
   - VBA układa kolejność listy,
   - JS NIE wykrywa już wspólnej trasy ani odgałęzień,
   - JS tylko renderuje elementy[] dokładnie w kolejności z JSON,
   - trasa_w_kursach jest gotowym separatorem z VBA,
   - koncowy=true kończy linię dokładnie w środku kropki,
   - stan=miniety korzysta ze starego wyglądu .przed,
   - aktualny przystanek ustalamy dodatkowo po dokładnym ID,
     aby dwa słupki o tej samej nazwie nie pomyliły zaznaczenia.
   ========================================================= */

function v514ModelListy(){
    const active=v486CurrentStop();
    const model=active?.lista_przystankowa;

    if(
        model &&
        Number(model.wersja)>=2 &&
        Array.isArray(model.elementy)
    ){
        return model.elementy;
    }

    return null;
}

function v514StopPoId(id){
    const wanted=v486Text(id);

    /*
       FWTP V515:
       Nie korzystamy z nieistniejącego v486ScheduleBlocks().
       Przeszukujemy bezpośrednio daneLinii["rozkłady"] / daneLinii.rozklady.
    */
    const rozklady=v486Array(
        daneLinii?.["rozkłady"] ?? daneLinii?.rozklady
    );

    for(const r of rozklady){
        for(const k of v486Array(r?.kierunki)){
            for(const p of v486Array(k?.przystanki)){
                if(v486StopId(p)===wanted){
                    return p;
                }
            }
        }
    }

    return null;
}

function v514MinutyDoPrzystanku(targetId){
    const active=v486CurrentStop();
    if(!active)return null;

    const activeId=v486StopId(active);

    for(const kurs of v486Array(active?.kursy)){
        const trasa=v486Array(kurs?.trasa).map(v486Text);

        if(
            !trasa.includes(activeId) ||
            !trasa.includes(v486Text(targetId))
        ){
            continue;
        }

        const target=v514StopPoId(targetId);
        if(!target)continue;

        const targetCourse=v486CourseAtStop(target,kurs);
        const t0=v486MinutesValue(kurs?.czas);
        const t1=v486MinutesValue(targetCourse?.czas);

        if(t0===null || t1===null)continue;

        let diff=t1-t0;

        if(diff < -12*60)diff+=24*60;
        if(diff >  12*60)diff-=24*60;

        return diff;
    }

    return null;
}

function v514RenderSeparator(element){
    const typ=v486Text(element?.typ);
    const tekst=v486Text(element?.tekst).trim();

    if(!tekst)return "";

    if(typ==="strefa"){
        return (
            '<li class="trasa-separator v486-strefa trasa-strefa-440 v514-strefa">'+
            '<span class="trasa-separator-title">'+
            escapeHtml(tekst)+
            '</span>'+
            '</li>'
        );
    }

    if(typ==="miejscowosc"){
        return (
            '<li class="trasa-separator trasa-miejscowosc-429 v486-miejscowosc v514-miejscowosc">'+
            '<span class="trasa-separator-title">'+
            escapeHtml(tekst)+
            '</span>'+
            '</li>'
        );
    }

    if(typ==="trasa_w_kursach"){
        return (
            '<li class="trasa-separator v496-opis v514-trasa-w-kursach">'+
            '<span class="trasa-separator-title">'+
            escapeHtml(tekst)+
            '</span>'+
            '</li>'
        );
    }

    return "";
}

function v514RenderStop(element,position,total){
    const id=v486Text(element?.id);
    const p=v514StopPoId(id);

    /*
       Gdyby w przyszłości VBA zapisało element, którego nie ma już
       w tablicy przystanków, nadal pokażemy nazwę z elementu JSON.
    */
    const name=v486Text(
        element?.nazwa ||
        p?.nazwa_czysta ||
        p?.nazwa
    ).trim();

    const activeId=v486StopId(v486CurrentStop());

    const selected=
        id===activeId ||
        (
            !activeId &&
            v486Text(element?.stan)==="aktualny"
        );

    const miniety=
        v486Text(element?.stan)==="miniety" &&
        !selected;

    const terminal=element?.koncowy===true;
    const minutes=v514MinutyDoPrzystanku(id);

    const cls=[
        "trasa-stop",
        selected?"wybrany":"",
        miniety?"przed":"",
        position===0?"kraniec-poczatek":"",
        terminal
            ?"kraniec-koniec koniec-trasy-210 v511-rzeczywisty-koniec v514-rzeczywisty-koniec"
            :"",
        p && czyNZ(p)?"nz":""
    ].filter(Boolean).join(" ");

    return (
        '<li class="'+cls+'" '+
        'data-v514-stop-id="'+escapeHtml(id)+'" '+
        'data-v508-stop-id="'+escapeHtml(id)+'">'+

        '<span class="trasa-czas">'+
        (minutes===null?"":escapeHtml(String(minutes)))+
        '</span>'+

        '<span class="trasa-os"></span>'+

        '<span class="trasa-nazwa">'+
        (
            selected
                ? '<span class="trasa-nazwa-aktywna">'+
                  escapeHtml(name.toUpperCase())+
                  '</span>'
                : escapeHtml(name.toUpperCase())
        )+
        '</span>'+

        '<span class="trasa-nz">'+
        (p && czyNZ(p)?"ż":"")+
        '</span>'+

        '</li>'
    );
}

function v514RenderGotowejListy(){
    const elements=v514ModelListy();
    if(!elements)return "";

    let rows="";
    let stopPosition=0;

    const stopCount=elements.filter(
        x=>v486Text(x?.typ)==="przystanek"
    ).length;

    elements.forEach(element=>{
        const typ=v486Text(element?.typ);

        if(typ==="przystanek"){
            rows+=v514RenderStop(
                element,
                stopPosition,
                stopCount
            );
            stopPosition++;
        }else{
            rows+=v514RenderSeparator(element);
        }
    });

    return (
        '<div class="trasa-kol v514-kol">'+
        '<ul class="trasa-lista v514-lista">'+
        rows+
        '</ul>'+
        '</div>'
    );
}

function v486RenderRoutes(routes){
    const gotowa=v514RenderGotowejListy();

    if(gotowa){
        return gotowa;
    }

    /*
       Fallback dla starszych JSON bez lista_przystankowa.wersja=2.
       Dzięki temu V514 nie psuje starszych plików.
    */
    return v496RenderRoutes(routes);
}

/*
   Zachowujemy nazwy funkcji, których mogą dotykać inne części strony,
   ale od V486 zwracają one WYŁĄCZNIE nowy model JSON.
*/
window.listaTrasyDoWyswietlenia = function(){

window.podzielTrase = function(){

        start:0,
        lista:route.items.map(x=>({
            p:x.p,

            _v486:true
        })),
        _v486Route:route,

function v501TownText(el){
    return (el?.textContent||"")
        .replace(/[-–—]/g," ")
        .replace(/\s+/g," ")
        .trim()
        .toLocaleUpperCase("pl-PL");
}

function v501NormalizujMiejscowosci(root){
    if(!root)return;

    const seps=[
        ...root.querySelectorAll(".trasa-separator")
    ].filter(el=>{
        const txt=v501TownText(el);
        return txt &&
               !txt.includes("TRASA W KURSACH") &&
               !txt.includes("STREFA ");
    });

    let current="";

    seps.forEach(el=>{
        const town=v501TownText(el);

        if(town===current){
            el.remove();
            return;
        }

        current=town;
    });

    /*
       Odgałęzienia mogą ponownie wygenerować WARSZAWA mimo że
       poprzedni wspólny odcinek nadal jest w Warszawie.
       Usuwamy separator gałęzi, jeśli jest taki sam jak ostatnia
       miejscowość występująca przed kontenerem gałęzi.
    */
    root.querySelectorAll(".v496-galezie").forEach(branchBox=>{
        let prev=branchBox.previousElementSibling;
        let inherited="";

        while(prev && !inherited){
            const candidates=[
                ...prev.querySelectorAll?.(".trasa-separator")||[]
            ].filter(el=>{
                const t=v501TownText(el);
                return t &&
                       !t.includes("TRASA W KURSACH") &&
                       !t.includes("STREFA ");
            });

            if(candidates.length){
                inherited=v501TownText(candidates[candidates.length-1]);
            }
            prev=prev.previousElementSibling;
        }

        if(!inherited)return;

        branchBox.querySelectorAll(".v496-galaz").forEach(branch=>{
            const first=[...branch.querySelectorAll(".trasa-separator")]
                .find(el=>{
                    const t=v501TownText(el);
                    return t &&
                           !t.includes("TRASA W KURSACH") &&
                           !t.includes("STREFA ");
                });

            if(first && v501TownText(first)===inherited){
                first.remove();
            }
        });
    });
}

function v499ZoneText(el){
    return (el?.textContent||"")
        .replace(/\s+/g," ")
        .trim()
        .toLocaleUpperCase("pl-PL");
}

function v499PierwszaStrefaZTrasy(){
    const routes=v486BuildRoutes();
    if(!routes.length)return "";

    /*
       Strefa z pierwszego rzeczywistego przystanku przebiegu.
       Jeżeli pierwszy przebieg zaczyna się inną gałęzią, nadal
       strefa jest informacją globalną i ma być przed listą.
    */
    for(const route of routes){
        for(const item of v486Array(route.items)){
            const z=v486StopZone(item?.p);
            if(z)return z;
        }
    }
    return "";
}

function v499NormalizujStrefy(root){
    if(!root)return;

    /*
       Usuwamy wszystkie separatory stref wygenerowane lokalnie
       przez poszczególne gałęzie. Zbudujemy je ponownie według
       kolejności wyświetlanej listy.
    */
    root.querySelectorAll(".v486-strefa").forEach(x=>x.remove());

    const pierwsza=v499PierwszaStrefaZTrasy();
    if(!pierwsza)return;

    /*
       Pierwszy napis STREFA I / II ma być NA GÓRZE,
       przed miejscowością i przed pierwszym przystankiem.
    */
    const firstList=root.querySelector(".trasa-lista");
    if(firstList){
        firstList.insertAdjacentHTML(
            "afterbegin",
            v486ZoneSeparator(pierwsza)
        );
    }

    /*
       Następne napisy dodajemy wyłącznie w momencie faktycznej
       zmiany strefy. Ten sam napis nie jest powtarzany.
    */
    let current=pierwsza;

    const stops=Array.from(
        root.querySelectorAll(".trasa-stop")
    );

    stops.forEach(stop=>{
        const key=stop.getAttribute("data-v499-stop-key");
        if(!key)return;

        const p=v499StopByKey(key);
        const zone=v486StopZone(p);

        if(zone && zone!==current){
            stop.insertAdjacentHTML(
                "beforebegin",
                v486ZoneSeparator(zone)
            );
            current=zone;
        }
    });
}

function v499StopByKey(key){
    const k=v486CurrentDirection();
    for(const p of v486Array(k?.przystanki)){
        if(v496StopKey(p)===key)return p;
    }
    return null;
}

function v498UstawNaglowek(ile){

function v498PobierzStrumienWierszy(columns){
    /*
       V496 może mieć wspólną część i kilka gałęzi.
       Do starego splittera przekazujemy jeden ciąg gotowych wierszy:
       separatory + przystanki, dokładnie w kolejności DOM.
    */
    const main=columns.querySelector(":scope > .v496-kol") ||
               columns.querySelector(":scope > .trasa-kol");

    if(!main)return [];

    const result=[];

    main.querySelectorAll(
        ".trasa-separator, .trasa-lista > .trasa-stop, .trasa-lista > li"
    ).forEach(el=>{
        /*
           Nie dodajemy li drugi raz, jeżeli selektor trafił go
           jednocześnie jako .trasa-stop i jako li.
        */
        if(result.includes(el))return;
        result.push(el);
    });

    return result.map(el=>el.outerHTML);
}

function v498RenderGrupy(columns,grupy){

            grupa.join("")+

            '</div>'
    ).join("");
}

function v498DopasujKolumnyTrasy(){
    const tabliczka=document.querySelector("#wynik .tabliczka");
    const columns=document.querySelector("#wynik .trasa-columns");

    if(!tabliczka || !columns)return;

    /*
       V499:
       STREFA I/II jest najpierw ustawiana globalnie:
       raz na górze i ponownie dopiero po rzeczywistej zmianie.
    */
    v501NormalizujMiejscowosci(columns);
    v499NormalizujStrefy(columns);

    /*
       Najpierw pobieramy cały nowy przebieg V496 zanim zmienimy DOM.
    */
    const wszystkie=v498PobierzStrumienWierszy(columns);
    if(!wszystkie.length)return;

    /*
       =====================================================
       1. NAJPIERW JEDNA KOLUMNA
       =====================================================
    */
    tabliczka.classList.remove("trasa-2-kol","trasa-3-kol");
    columns.className="trasa-columns cols-1";
    v498UstawNaglowek(1);
    v498RenderGrupy(columns,[wszystkie]);

    if(typeof ustawZawijanieNazwTrasy==="function"){
        ustawZawijanieNazwTrasy(columns);
    }

    const jedna=columns.querySelector(".trasa-kol");

    if(
        jedna &&
        jedna.scrollHeight<=columns.clientHeight+1
    ){
        return;
    }

    /*
       =====================================================
       2. DOPIERO TERAZ DWIE KOLUMNY
       =====================================================
       To jest ta sama zasada co w starej działającej logice:
       nie dzielimy listy matematycznie na pół.
       Wypełniamy pierwszą kolumnę do dostępnej wysokości.
    */
    tabliczka.classList.add("trasa-2-kol");
    columns.className="trasa-columns cols-2";
    v498UstawNaglowek(2);

    /*
       Pomiar przy FINALNEJ szerokości kolumny.
       Druga pusta kolumna wymusza prawidłową szerokość pierwszej.
    */
    columns.innerHTML=
        '<div class="trasa-kol trasa-kol-pomiar-498">'+
            '<ul class="trasa-lista trasa-lista-pomiar-498">'+
                wszystkie.join("")+
            '</ul>'+
        '</div>'+
        '<div class="trasa-kol trasa-kol-pusta"></div>';

    if(typeof ustawZawijanieNazwTrasy==="function"){
        ustawZawijanieNazwTrasy(columns);
    }

    const pomiar=columns.querySelector(".trasa-kol-pomiar-498");
    const dzieci=Array.from(
        pomiar?.querySelector(".trasa-lista-pomiar-498")?.children||[]
    );

    if(!pomiar || !dzieci.length)return;

    const styl=getComputedStyle(pomiar);

    const dostepna=
        columns.clientHeight-
        parseFloat(styl.paddingTop||0)-
        parseFloat(styl.paddingBottom||0)-
        1;

    const wysokosci=dzieci.map(el=>{
        const rect=el.getBoundingClientRect();
        const css=getComputedStyle(el);

        return (
            rect.height+
            parseFloat(css.marginTop||0)+
            parseFloat(css.marginBottom||0)
        );
    });

    const grupy=[[]];
    let suma=0;

    for(let i=0;i<wszystkie.length;i++){
        const h=Math.max(0,wysokosci[i]||0);
        let wymagane=h;

        /*
           Tak jak wcześniej: napis "TRASA W KURSACH ..."
           nie może zostać sam na dole kolumny.
           Musi zmieścić się razem z pierwszym przystankiem.
        */
        if(
            dzieci[i]?.classList?.contains("trasa-separator") &&
            i+1<wszystkie.length
        ){
            wymagane+=Math.max(0,wysokosci[i+1]||0);
        }

        if(
            grupy[0].length>0 &&
            suma+wymagane>dostepna &&
            grupy.length===1
        ){
            grupy.push([]);
            suma=0;
        }

        grupy[grupy.length-1].push(wszystkie[i]);
        suma+=h;
    }

    /*
       Jeżeli po pomiarze jednak wszystko weszło do jednej,
       wracamy do jednej kolumny.
    */
    const niepuste=grupy.filter(g=>g.length);

    if(niepuste.length<=1){
        tabliczka.classList.remove("trasa-2-kol");
        columns.className="trasa-columns cols-1";
        v498UstawNaglowek(1);
        v498RenderGrupy(columns,[wszystkie]);

        if(typeof ustawZawijanieNazwTrasy==="function"){
            ustawZawijanieNazwTrasy(columns);
        }
        return;
    }

    v498RenderGrupy(columns,niepuste.slice(0,2));

    if(typeof ustawZawijanieNazwTrasy==="function"){
        ustawZawijanieNazwTrasy(columns);
    }

    /*
       Koniec pierwszej kolumny nie jest końcem trasy.
    */
    const pierwsza=columns.querySelector(
        ":scope > .trasa-kol:not(:last-child) .trasa-lista > li:last-child"
    );

    /*
       V502:
       granica kolumny nie jest końcem trasy, ALE nie wolno usuwać
       oznaczenia, jeśli ten przystanek jest rzeczywistym końcem
       któregoś kurs.trasa (np. METRO MŁOCINY).
    */
    if(pierwsza){
        const key=pierwsza.getAttribute("data-v499-stop-key");
        const p=key ? v499StopByKey(key) : null;

        let prawdziwyKoniec=false;

        if(p){
            const routes=v486BuildRoutes();
            prawdziwyKoniec=routes.some(route=>
                v502CzyRzeczywistyKoniec({p},route)
            );
        }

        if(!prawdziwyKoniec){
            pierwsza.classList.remove(
                "kraniec-koniec",
                "koniec-trasy-210",
                "ma-kontynuacje-trasy"
            );
        }
    }
}


/* =========================================================
   FWTP — WERSJA 508
   KOŃCE TRAS — OSTATECZNE OZNACZENIE PO RENDERZE
   =========================================================
   V507 poprawnie czytał JSON, ale oznaczenie końca było wykonywane
   podczas budowania poszczególnych grup/gałęzi. Późniejsze łączenie
   tras i dzielenie na kolumny mogło zgubić kontekst przebiegu.

   V508 robi to prościej i jednoznacznie:
   1. z kursów AKTUALNEGO przystanku zbiera dokładne ID ostatniego
      pasażerskiego przystanku każdego kurs.trasa;
   2. po CAŁYM renderowaniu i po podziale na kolumny czyści stare
      klasy końcowe;
   3. nadaje klasę końcową tylko elementom o dokładnie takim ID.

   Dla linii 150:
   - 40|Metro Młociny|21  -> końcowy
   - 36|Metro Marymont|11 -> NIE końcowy
   - 37|Metro Marymont|12 -> końcowy
   ========================================================= */

function v508TerminalIds(){
    const active=v486CurrentStop();
    const out=new Set();

    /*
       FWTP V512 — źródło podstawowe: lista przygotowana przez VBA.
    */
    const model=active?.lista_przystankowa;

    if(model && Array.isArray(model.trasy)){
        model.trasy.forEach(route=>{
            const id=v486Text(route?.koniec_trasy).trim();
            if(id)out.add(id);
        });

        if(out.size)return out;
    }

    /*
       Fallback: jawne koniec_trasy kursu, a dopiero potem ostatnie ID.
    */
    const stopMap=v486StopMap();

    for(const kurs of v486Array(active?.kursy)){
        const explicit=v486Text(kurs?.koniec_trasy).trim();

        if(explicit){
            out.add(explicit);
            continue;
        }

        const trasa=v486Array(kurs?.trasa).map(v486Text).filter(Boolean);

        for(let i=trasa.length-1;i>=0;i--){
            const id=trasa[i];
            const found=stopMap.get(id);

            if(found && v486StopType(found.p)==="TECH")continue;

            out.add(id);
            break;
        }
    }

    return out;
}

function v508OznaczRzeczywisteKonce(){
    const root=document.querySelector("#wynik .trasa-columns");
    if(!root)return;

    const terminalIds=v508TerminalIds();

    root.querySelectorAll(".trasa-stop").forEach(stop=>{
        /*
           Najpierw zerujemy wcześniejsze oznaczenia. Dzięki temu
           koniec fragmentu, gałęzi czy kolumny nie może udawać
           końca rzeczywistego kursu.
        */
        stop.classList.remove(
            "kraniec-koniec",
            "koniec-trasy-210"
        );

        const id=(stop.getAttribute("data-v508-stop-id")||"").trim();

        if(id && terminalIds.has(id)){
            /*
               V510:
               ten wiersz jest PRAWDZIWYM końcem konkretnego kurs.trasa.
               Starsza logika nie może już traktować go jako miejsca
               kontynuacji / końca wariantu / granicy kolumny.
            */
            stop.classList.remove(
                "ma-kontynuacje-trasy",
                "koniec-wariantu-419",
                "koniec-wydluzenia-446"
            );

            stop.classList.add(
                "kraniec-koniec",
                "koniec-trasy-210",
                "v510-rzeczywisty-koniec",
                "v511-rzeczywisty-koniec"
            );

            /*
               V511:
               w tym pliku po </head> istnieje jeszcze dużo starego CSS
               z wersji 4xx. Dlatego nazwę końca pogrubiamy także
               bezpośrednio na elemencie.
            */
            const nazwa=stop.querySelector(
                ".trasa-nazwa, .trasa-nazwa-aktywna"
            );
            if(nazwa){
                nazwa.style.setProperty(
                    "font-weight",
                    "700",
                    "important"
                );
            }
        }else{
            stop.classList.remove(
                "v510-rzeczywisty-koniec",
                "v511-rzeczywisty-koniec"
            );
        }
    });
}

function przeniesLegendeJesliWychodziPozaStrone237(

    if(

    legenda.classList.remove(

const cacheNormalizacjiTekstu=
    new Map();

function normalizuj(tekst){

    const surowy=
        String(
            tekst||""
        );

    if(
        cacheNormalizacjiTekstu.has(
            surowy
        )
    ){
        return cacheNormalizacjiTekstu.get(
            surowy
        );
    }

    const wynik=
        surowy
            .trim()
            .toLocaleLowerCase(
                "pl-PL"
            )
            .replace(
                /\s+/g,
                " "
            );

    cacheNormalizacjiTekstu.set(
        surowy,
        wynik
    );

    return wynik;
}

function czyRozkladNachodziNaListePrzystankow(
    tabliczka

            ".rozklady-wrap"

    const panel=
        tabliczka.querySelector(
            ".panel-lewy"
        );

    if(
        !wrap||
        !panel
    ){
        return false;
    }

    const wrapRect=
        wrap.getBoundingClientRect();

    const panelRect=
        panel.getBoundingClientRect();

    /*
       WERSJA 194:
       ponownie badamy .rozklady-wrap.

       Różnica jest taka, że .rozklady-wrap nie jest już
       rozciągnięty na pusty obszar panelu — CSS width:fit-content
       powoduje, że kończy się przy rzeczywistym końcu tabel.

       Jeśli więc prawa krawędź wrap wchodzi poza panel lewy,
       rozkład naprawdę nachodzi na listę przystanków.
    */
    /*
       v227:
       294.5 px może na granicy panelu dać ułamkową różnicę
       w getBoundingClientRect() przez obramowania/subpiksele.
       Wizualnie tabela nadal się mieści, dlatego nie schodzimy
       od razu do 270/246 dla różnicy do 1.5 px.
    */
    /*

       .rozklady-wrap ma już szerokość zgodną z faktycznie
       wyrenderowanymi tabelami. Zostawiamy tylko 0.25 px
       na typowe różnice subpikselowe.
    */
    const tolerancjaKolizji228=
        0.25;

    return(
        wrapRect.right>
        panelRect.right+
        tolerancjaKolizji228
    );
}

function dopasujRozkladyWTrybieKompaktowym(
    tabliczka
){

    if(!tabliczka){
        return;
    }

    const panel=
        tabliczka.querySelector(
            ".panel-lewy"
        );

    const wrap=
        tabliczka.querySelector(
            ".rozklady-wrap"
        );

    const grid=
        tabliczka.querySelector(
            ".rozklady-grid"
        );

    if(
        !panel||
        !wrap||
        !grid
    ){
        return;
    }

    const dni=
        Array.from(
            grid.querySelectorAll(
                ":scope > .dzien"
            )
        );

    if(!dni.length){
        return;
    }

    /*
       Najpierw zdejmujemy szerokości nadane przez wcześniejsze
       dopasowania (np. równe SOBOTA/ŚWIĘTO), żeby zmierzyć
       rzeczywistą potrzebną szerokość.
    */
    dni.forEach(
        dzien=>{

            dzien.style.width="";
            dzien.style.minWidth="";
        }
    );

    const odstepy=
        Math.max(
            0,
            dni.length-1
        )*3;

    const dostepna=
        Math.max(
            120,
            Math.floor(
                wrap.clientWidth-
                odstepy
            )
        );

    const naturalne=
        dni.map(
            dzien=>
                Math.ceil(
                    dzien.scrollWidth
                )
        );

    const minima=
        dni.map(
            minimalnaSzerokoscDnia
        );

    let docelowe=
        naturalne.slice();

    let suma=
        docelowe.reduce(
            (a,b)=>a+b,
            0
        );

    /*
       Jeżeli naturalne szerokości się nie mieszczą,
       stopniowo odbieramy szerokość głównie najszerszym tabelom.
       Dzięki flex-wrap minuty przejdą wtedy do następnego wiersza.
    */
    if(suma>dostepna){

        let brak=
            suma-dostepna;

        let bezpiecznik=0;

        while(
            brak>0.5&&
            bezpiecznik<2000
        ){

            bezpiecznik++;

            let kandydat=-1;
            let najwiekszyZapas=0;

            for(
                let i=0;
                i<docelowe.length;
                i++
            ){

                const zapas=
                    docelowe[i]-
                    minima[i];

                if(zapas>najwiekszyZapas){
                    najwiekszyZapas=zapas;
                    kandydat=i;
                }
            }

            if(
                kandydat<0||
                najwiekszyZapas<=0
            ){
                break;
            }

            const krok=
                Math.min(
                    2,
                    brak,
                    najwiekszyZapas
                );

            docelowe[kandydat]-=
                krok;

            brak-=
                krok;
        }
    }

    dni.forEach(
        (dzien,i)=>{

            if(
                dzien.classList.contains(
                    "dzien-powszedni-kompakt"
                )
            ){
                dzien.style.width="246px";
                dzien.style.minWidth="246px";
                return;
            }

            const szer=
                Math.max(
                    minima[i],
                    Math.floor(
                        docelowe[i]
                    )
                );

            dzien.style.width=
                szer+"px";

            dzien.style.minWidth=
                szer+"px";
        }
    );
}



/* =========================================================

   WYRÓWNYWANIE GODZIN PRZYWRÓCONE 1:1 Z PODSTAWOWEGO v170.

   ta sama godzina we wszystkich typach dnia na tej kartce
   dostaje klasę wiersz-dwuliniowy i wysokość 32 px.
   ========================================================= */

function wyrownajWysokosciGodzinMiedzyDniami(
    tabliczka
){
    if(!tabliczka){ return; }

    const mapa=new Map();

    tabliczka
        .querySelectorAll(".rozklady-grid > .dzien .godzina-row")
        .forEach(row=>{
            row.classList.remove("wiersz-dwuliniowy");

            const g=String(
                row.querySelector(".godzina-cell")?.textContent||""
            ).trim();

            if(!g){ return; }
            if(!mapa.has(g)){ mapa.set(g,[]); }
            mapa.get(g).push(row);
        });

    void tabliczka.offsetHeight;

    mapa.forEach(rows=>{
        let podwojny=false;

        rows.forEach(row=>{
            const minuty=row.querySelector(".minuty-cell");
            if(!minuty){ return; }

            /*
               Normalny wiersz ma 16 px.
               Jeżeli zawartość minut potrzebuje więcej niż 18 px,
               traktujemy godzinę jako dwuwierszową.
            */
            if(minuty.scrollHeight>18){
                podwojny=true;
            }
        });

        if(podwojny){
            rows.forEach(row=>{
                row.classList.add("wiersz-dwuliniowy");
            });
        }
    });
}

/* =========================================================
   WERSJA 194 — PRZELICZENIE SZEROKOŚCI .rozklady-wrap
   ========================================================= */
function przeliczWrap194(
    tabliczka
){
    if(!tabliczka){
        return;
    }

    const wrap=
        tabliczka.querySelector(
            ".rozklady-wrap"
        );

    const grid=
        tabliczka.querySelector(
            ".rozklady-grid"
        );

    if(!wrap||!grid){
        return;
    }

    /*
       v228:
       Samo width:fit-content potrafiło zachować szerokość
       INTRINSICzną zawartości minut, nawet kiedy widoczna tabela
       miała już np. 294.5 px.

       Efekt:
       - na ekranie 294.5 px mieściło się prawidłowo,
       - ale .rozklady-wrap raportował większy right,
       - kod błędnie przechodził do 270, a potem czasem 246 px.

       Nadal badamy .rozklady-wrap — zgodnie z dotychczasową logiką —
       ale jego szerokość ustawiamy na RZECZYWISTĄ szerokość
       wyrenderowanych tabel .dzien.
    */

    wrap.style.width="";
    wrap.style.minWidth="";
    wrap.style.maxWidth="";

    grid.style.width="";
    grid.style.minWidth="";

    void grid.offsetWidth;

    const dni=
        Array.from(
            grid.children
        ).filter(
            el=>
                el.classList&&
                el.classList.contains("dzien")
        );

    if(!dni.length){
        return;
    }

    const gridRect=
        grid.getBoundingClientRect();

    let prawa=
        gridRect.left;

    dni.forEach(
        dzien=>{
            const rect=
                dzien.getBoundingClientRect();

            if(rect.right>prawa){
                prawa=rect.right;
            }
        }
    );

    const rzeczywistaSzerokosc=
        Math.max(
            0,
            prawa-gridRect.left
        );

    /*
       Ustawiamy dokładnie to, co rzeczywiście widać.
       Dzięki temu ręczne 294.5 px i automatyczne 294.5 px
       są mierzone identycznie.
    */
    grid.style.width=
        rzeczywistaSzerokosc+"px";

    grid.style.minWidth=
        rzeczywistaSzerokosc+"px";

    wrap.style.width=
        rzeczywistaSzerokosc+"px";

    wrap.style.minWidth=
        rzeczywistaSzerokosc+"px";

    wrap.style.maxWidth=
        rzeczywistaSzerokosc+"px";

    void wrap.offsetWidth;
}


/* =========================================================
   WERSJA 225 — RAMKA DO OSTATNIEJ MINUTY PRZY JEDNEJ LINII
   ========================================================= */

function dopasujRamkeDoOstatniejMinuty225(
    tabliczka
){
    if(!tabliczka){
        return;
    }

    const dni=
        tabliczka.querySelectorAll(
            ".dzien.dzien-powszedni-kompakt"
        );

    dni.forEach(
        dzien=>{

            dzien.classList.remove(
                "jedna-linia-fit-225"
            );

            const wiersze=
                Array.from(
                    dzien.querySelectorAll(
                        ".godzina-row"
                    )
                );

            if(!wiersze.length){
                return;
            }

            /*
               Wiersz jest dwuliniowy, jeśli:
               - ma klasę wiersz-dwuliniowy, albo
               - jego pole minut jest wyższe niż pojedynczy wiersz.
            */
            const maZawiniecie=
                wiersze.some(
                    wiersz=>{

                        if(
                            wiersz.classList.contains(
                                "wiersz-dwuliniowy"
                            )
                        ){
                            return true;
                        }

                        const minuty=
                            wiersz.querySelector(
                                ".minuty-cell"
                            );

                        if(!minuty){
                            return false;
                        }

                        return (
                            minuty.getBoundingClientRect().height
                            >
                            18
                        );
                    }
                );

            if(maZawiniecie){
                return;
            }

            /*
               Wszystkie godziny mieszczą się w jednej linii:
               szerokość tabeli może zakończyć się przy ostatniej minucie.
            */
            dzien.classList.add(
                "jedna-linia-fit-225"
            );
        }
    );
}

function dopasujSzerokoscNieKursuje(){

    const dni=
        Array.from(
            document.querySelectorAll(
                ".rozklady-grid .dzien"
            )
        );

    dni.forEach(
        dzien=>{

            const napis=
                dzien.querySelector(
                    ".nie-kursuje-napis"
                );

            if(!napis){
                return;
            }

            /*
               Najpierw zdejmujemy ewentualne wcześniejsze
               wymuszenie szerokości, żeby zmierzyć naturalny układ.
            */
            const poprzedniaSzerokosc=
                parseFloat(
                    dzien.style.width
                )||0;

            const poprzedniaMinSzerokosc=
                parseFloat(
                    dzien.style.minWidth
                )||0;

            /*
               Pole minut zaczyna się po 22 px kolumny godzin.
               Do szerokości napisu dokładamy po 8 px luzu
               z lewej i prawej strony.
            */
            const szerokoscNapisu=
                Math.ceil(
                    napis.scrollWidth
                );

            const potrzebnaSzerokosc=
                22+
                szerokoscNapisu+
                16;

            const aktualnaSzerokosc=
                Math.ceil(
                    dzien.getBoundingClientRect().width
                );

            const docelowa=
                Math.max(
                    aktualnaSzerokosc,
                    poprzedniaSzerokosc,
                    poprzedniaMinSzerokosc,
                    potrzebnaSzerokosc
                );

            dzien.style.width=
                docelowa+"px";

            dzien.style.minWidth=
                docelowa+"px";
        }
    );
}


function wyrownajSzerokoscWeekendow() {

    const dni = Array.from(
        document.querySelectorAll(
            ".rozklady-grid .dzien"
        )
    );

    const sobota = dni.find(d => {
        const t =
            (
                d.querySelector(
                    ".dzien-tytul"
                )?.textContent || ""
            )
            .trim()
            .toUpperCase();

        return t === "SOBOTA";
    });

    const swieto = dni.find(d => {
        const t =
            (
                d.querySelector(
                    ".dzien-tytul"
                )?.textContent || ""
            )
            .trim()
            .toUpperCase();

        return t === "ŚWIĘTO";
    });

    if(!sobota || !swieto){
        return;
    }

    /*
       Zdejmujemy wcześniejsze szerokości tylko na czas pomiaru.
    */
    [sobota, swieto].forEach(d => {
        d.style.width = "";
        d.style.minWidth = "";
    });

    const szerokoscNaturalnaSobota =
        Math.ceil(
            sobota.getBoundingClientRect().width
        );

    const szerokoscNaturalnaSwieto =
        Math.ceil(
            swieto.getBoundingClientRect().width
        );

    /*
       Jeżeli w którejś tabeli jest "NIE KURSUJE",
       tabela musi być na tyle szeroka, by napis zmieścił się
       w jednej linii w części minutowej.
    */
    function wymaganaSzerokoscNieKursuje(dzien){

        const napis =
            dzien.querySelector(
                ".nie-kursuje-napis"
            );

        if(!napis){
            return 0;
        }

        return (
            22 +
            Math.ceil(napis.scrollWidth) +
            16
        );
    }

    const wymaganaSobota =
        wymaganaSzerokoscNieKursuje(
            sobota
        );

    const wymaganaSwieto =
        wymaganaSzerokoscNieKursuje(
            swieto
        );

    /*
       Obie kolumny dostają DOKŁADNIE tę samą szerokość:
       większą z naturalnych / wymaganych szerokości + 8 px luzu.
    */
    const szerokosc =
        Math.max(
            szerokoscNaturalnaSobota,
            szerokoscNaturalnaSwieto,
            wymaganaSobota,
            wymaganaSwieto
        ) + 8;

    [sobota, swieto].forEach(d => {
        d.style.width = szerokosc + "px";
        d.style.minWidth = szerokosc + "px";
        d.style.maxWidth = szerokosc + "px";
    });
}

   JEDNOWYRAZOWYCH NAZW PRZYSTANKÓW
   ========================================================= */

function dopasujSzerokoscKolumnyDoJednowyrazowych177(
    tabliczka
){

    if(!tabliczka){
        return;
    }

    const panelPrawy=
        tabliczka.querySelector(
            ".panel-prawy"
        );

    const panelLewy=
        tabliczka.querySelector(
            ".panel-lewy"
        );

    const columns=
        tabliczka.querySelector(
            ".trasa-columns"
        );

    if(
        !panelPrawy||
        !panelLewy||
        !columns
    ){
        return;
    }

    const nazwy=
        Array.from(
            tabliczka.querySelectorAll(
                ".trasa-nazwa.nazwa-jednowyrazowa"
            )
        );

    if(!nazwy.length){
        return;
    }

    /*
       Szukamy największej różnicy:
       scrollWidth - clientWidth.
       Jeśli dodatnia, jednowyrazowa nazwa nie mieści się.
    */
    let brakujace=0;

    nazwy.forEach(
        nazwa=>{

            const roznica=
                Math.ceil(
                    nazwa.scrollWidth-
                    nazwa.clientWidth
                );

            if(roznica>brakujace){
                brakujace=
                    roznica;
            }
        }
    );

    if(brakujace<=0){
        return;
    }

    /*
       Dodajemy mały zapas, żeby napis nie dotykał krawędzi.
    */
    const zapas=8;

    const szerTabliczki=
        tabliczka.clientWidth;

    if(!szerTabliczki){
        return;
    }

    const obecnaPrawa=
        panelPrawy.getBoundingClientRect().width;

    const nowaPrawa=
        obecnaPrawa+
        brakujace+
        zapas;

    /*
       Nie pozwalamy, żeby prawa część zabrała absurdalnie dużo.
       Górna granica 55% całej kartki.
    */
    const maxPrawa=
        szerTabliczki*0.55;

    const docelowaPrawa=
        Math.min(
            nowaPrawa,
            maxPrawa
        );

    const procentPrawa=
        (
            docelowaPrawa/
            szerTabliczki
        )*100;

    const procentLewa=
        100-
        procentPrawa;

    tabliczka.style.setProperty(
        "--prawa",
        procentPrawa.toFixed(2)+"%"
    );

    tabliczka.style.setProperty(
        "--lewa",
        procentLewa.toFixed(2)+"%"
    );
}

function czyTabliczkaMiesciSiePionowo181(

       SZEROKOŚCIOWO na tej samej kartce.

        );

                                getComputedStyle(
                                    stop
                                );

                            return(
                                style.display!=="none"&&
                                style.visibility!=="hidden"
                            );
                        }
                    );

                /*
                   Czyścimy poprzednie oznaczenie tylko w tej kolumnie.
                */
                kolumna
                    .querySelectorAll(
                        ".trasa-stop.pierwszy-pasazerski"
                    )
                    .forEach(
                        stop=>
                            stop.classList.remove(
                                "pierwszy-pasazerski"
                            )
                    );

                if(!przystanki.length){
                    return;
                }

                /*
                   Pierwszy widoczny pasażerski przystanek:
                   linia zaczyna się od jego kropki i idzie w dół.
                */
                przystanki[0]
                    .classList.add(
                        "pierwszy-pasazerski"
                    );
            }
        );
}

function ustawZawijanieNazwTrasy(columns){
    /*
       v176 — przed pomiarem zaznaczamy nazwy jednowyrazowe.
       Po dalszym przeliczeniu ponownie zdejmujemy im .zawijaj.
    */
    zabezpieczJednowyrazoweNazwy176(
        columns||document
    );



    if(!columns){
        return;
    }

    /*
       Każda nazwa jest oceniana osobno:
       - jeśli mieści się w jednej linii -> pozostaje bez zawijania,
       - jeśli się nie mieści -> tylko ta nazwa dostaje zawijanie.
    */
    const nazwy=
        Array.from(
            columns.querySelectorAll(
                ".trasa-nazwa"
            )
        );

    nazwy.forEach(
        el=>{
            el.classList.remove(
                "zawijaj"
            );
        }
    );

    nazwy.forEach(
        el=>{

            if(
                Math.ceil(
                    el.scrollWidth
                )>
                Math.ceil(
                    el.clientWidth
                )+1
            ){
                el.classList.add(
                    "zawijaj"
                );
            }
        }
    );
}
